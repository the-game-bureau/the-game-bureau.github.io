    };

    function cityGeoBadge(label) {
      // Prefer the shared, structured-aware badge (assets/geo.js): resolves
      // 2-letter codes + countries the local map below can't.
      if (window.TgbGeo && typeof window.TgbGeo.geoBadge === 'function') {
        return window.TgbGeo.geoBadge(label);
      }
      const labelStr = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(labelStr)) return { kind: 'state', value: 'DC' };
      const parts = labelStr.split(',').map((s) => s.trim()).filter(Boolean);
      for (let i = parts.length - 1; i >= 1; i--) {
        const key = parts[i].toLowerCase();
        if (US_STATES[key]) return { kind: 'state', value: US_STATES[key] };
        if (COUNTRY_CODES[key]) return { kind: 'country', value: COUNTRY_CODES[key] };
      }
      return null;
    }

    function svgPathCenter(pathData, fallbackX, fallbackY) {
      const numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
      if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < numbers.length - 1; i += 2) {
        const x = Number(numbers[i]);
        const y = Number(numbers[i + 1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
      if (![minX, minY, maxX, maxY].every(Number.isFinite)) return { x: fallbackX, y: fallbackY };
      return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
    }

    function buildGeoBadge(badge) {
      const cls = (s) => 'hero-meta-list-geo' + (s ? ' ' + s : '');
      const shapes = window.US_STATE_SHAPES || null;
      if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
        svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', shapes[badge.value]);
        svg.appendChild(path);
        const labelPoint = svgPathCenter(shapes[badge.value], (shapes._w || 40) / 2, (shapes._h || 24) / 2);
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', String(labelPoint.x));
        text.setAttribute('y', String(labelPoint.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('alignment-baseline', 'middle');
        text.setAttribute('dy', '0.04em');
        text.textContent = badge.value;
        svg.appendChild(text);
        return svg;
      }
      const span = document.createElement('span');
      if (badge) {
        span.className = cls('hero-meta-list-geo--' + badge.kind);
        if (badge.kind === 'country') {
          const label = document.createElement('span');
          label.className = 'hero-meta-list-geo-label';
          label.textContent = badge.value;
          span.appendChild(label);
        } else {
          span.textContent = badge.value;
        }
        span.setAttribute('aria-hidden', 'true');
      } else {
        span.className = cls('');
      }
      return span;
    }

    // Line globe for the "All Cities" chip. It inherits the chip color so the
    // active blue button gets a clean white icon instead of a nested white disc.
    function buildAllCitiesGlobe() {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('class', 'hero-meta-list-geo hero-meta-list-geo--shape hero-meta-list-geo--globe');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      const disc = document.createElementNS(NS, 'circle');
      disc.setAttribute('class', 'globe-disc');
      disc.setAttribute('cx', '12');
      disc.setAttribute('cy', '12');
      disc.setAttribute('r', '8.8');
      svg.appendChild(disc);
      const grid = [
        ['ellipse', { cx: 12, cy: 12, rx: 3.8, ry: 8.8 }],  // meridian
        ['line', { x1: 3.2, y1: 12, x2: 20.8, y2: 12 }],    // equator
        ['line', { x1: 4.9, y1: 7.3, x2: 19.1, y2: 7.3 }],  // upper latitude
        ['line', { x1: 4.9, y1: 16.7, x2: 19.1, y2: 16.7 }],// lower latitude
      ];
      grid.forEach(([tag, attrs]) => {
        const el = document.createElementNS(NS, tag);
        el.setAttribute('class', 'globe-grid');
        Object.keys(attrs).forEach((k) => el.setAttribute(k, String(attrs[k])));
        svg.appendChild(el);
      });
      return svg;
    }

    function buildFeaturedStar() {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('class', 'hero-meta-list-geo hero-meta-list-geo--shape hero-meta-list-geo--star');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      const star = document.createElementNS(NS, 'path');
      star.setAttribute('class', 'globe-disc');
      star.setAttribute('d', 'M12 2.6 14.9 9l6.9.7-5.2 4.6 1.5 6.8L12 17.6 5.9 21.1l1.5-6.8L2.2 9.7 9.1 9z');
      svg.appendChild(star);
      return svg;
    }

    function setItemCount(n) {
      const count = Number(n) || 0;
      if (itemCountEl) itemCountEl.textContent = String(count);
      if (itemLabelEl) itemLabelEl.textContent = count === 1 ? 'GIFT SHOWING' : 'GIFTS SHOWING';
    }

    function setGiftHeroTotals(totalGifts, cityCount) {
      const gifts = Number(totalGifts) || 0;
      const cities = Number(cityCount) || 0;
      // The headline is the shop's name, not a number. Both counts live in the
      // dek: "547 books, gear, and local finds from 86 cities."
      if (headingEl && !requestedCity && !requestedGameParam) {
        headingEl.textContent = 'Gift Shop';
      }
      if (heroSubEl) {
        const cityWord = cities === 1 ? 'city' : 'cities';
        heroSubEl.textContent = gifts + ' books, gear, and local finds from ' +
          cities + ' ' + cityWord + '.';
      }
    }

    function renderGiftCityRail(cityData) {
      if (!giftCityPanelEl || !giftCityListEl) return;
      const entries = cityData && Array.isArray(cityData.entries) ? cityData.entries : [];
      if (!entries.length) {
        giftCityPanelEl.hidden = true;
        giftCityListEl.innerHTML = '';
        return;
      }
      giftCityPanelEl.hidden = false;
      const totalGifts = Number(cityData && cityData.total) ||
        entries.reduce((sum, entry) => sum + (Number(entry && entry.count) || 0), 0);
      setGiftHeroTotals(totalGifts, entries.length);

      giftCityListEl.innerHTML = '';
      // Featured leads the rail (it is the landing view), then the whole
      // catalog, then the cities themselves.
      const chips = [{
        city: '',
        label: 'Featured',
        count: Number(cityData && cityData.featuredTotal) || 0,
        isFeatured: true
      }, {
        city: '',
        label: 'All Cities',
        count: totalGifts,
        isAll: true
      }].concat(entries);

      // Three identical chunks [pre | primary | post] in a flex row. We park
      // scrollLeft at the start of the primary chunk; when auto-scroll or a drag
      // pushes it out of range, setGiftCityScroll jumps by exactly one chunk
      // width — invisible because the chunks are clones, so the rail loops.
      const track = document.createElement('div');
      track.className = 'gift-city-track';
      const makeChunk = (hidden) => {
        const chunk = document.createElement('div');
        chunk.className = 'gift-city-chunk';
        if (hidden) chunk.setAttribute('aria-hidden', 'true');
        chips.forEach((entry) => chunk.appendChild(createGiftCityChip(entry)));
        return chunk;
      };
      track.append(makeChunk(true), makeChunk(false), makeChunk(true));
      giftCityListEl.appendChild(track);

      setupGiftCityScroll();
    }

    function createGiftCityChip(entry) {
      const item = document.createElement('a');
      item.className = 'hero-meta-list-item';
      // Featured is the landing view (/gifts/); All Cities is the full catalog
      // (?all=1). Exactly one of the two is current at any time.
      item.href = entry.isFeatured ? '/gifts/'
        : (entry.isAll ? '/gifts/?all=1' : giftCityHref(entry.city));
      item.dataset.city = entry.city;
      const active = entry.isFeatured ? isFeaturedView
        : (entry.isAll ? (showAllGifts && !isFeaturedView) : entry.city === requestedCity);
      if (active) {
        item.classList.add('is-active');
        item.setAttribute('aria-current', 'true');
      }
      // Badge slot: a star for Featured, a globe for All Cities, the geo
      // (state/country) badge for a real city.
      if (entry.isFeatured) {
        item.appendChild(buildFeaturedStar());
      } else if (entry.isAll) {
        item.appendChild(buildAllCitiesGlobe());
      } else {
        item.appendChild(buildGeoBadge(cityGeoBadge(entry.city || entry.label)));
      }
      const copy = document.createElement('span');
      copy.className = 'hero-meta-list-copy';
      const name = document.createElement('span');
      name.className = 'hero-meta-list-name';
      name.textContent = entry.label;
      copy.appendChild(name);
      const count = document.createElement('span');
      count.className = 'hero-meta-list-count';
      count.textContent = entry.count + ' gift' + (entry.count === 1 ? '' : 's');
      item.append(copy, count);
      return item;
    }

    // ── City rail: infinite horizontal scroll + click-drag (ports the Games
    // page's hero-list behavior, but on the horizontal axis). ────────────────
    const GIFT_CITY_PX_PER_SEC = 22;
    let giftCityRaf = null, giftCityLastTs = 0, giftCityPos = 0;
    let giftCityDragActive = false, giftCityPauseUntil = 0, giftCityInited = false;
    const giftCityReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function giftCityLoopWidth() {
      if (!giftCityListEl) return 0;
      const chunk = giftCityListEl.querySelector('.gift-city-chunk');
      const track = giftCityListEl.querySelector('.gift-city-track');
      if (!chunk || !track) return 0;
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return Math.max(0, Math.round(chunk.getBoundingClientRect().width + gap));
    }

    function setGiftCityScroll(next, loopW) {
      if (!giftCityListEl) return;
      let v = Number.isFinite(next) ? next : 0;
      if (loopW > 0 && loopW > giftCityListEl.clientWidth) {
        // Keep scrollLeft inside the primary chunk's range [loopW, 2*loopW);
        // jumps of exactly one loopW are invisible (the chunks are clones).
        while (v >= 2 * loopW) v -= loopW;
        while (v < loopW) v += loopW;
      } else {
        const max = Math.max(0, giftCityListEl.scrollWidth - giftCityListEl.clientWidth);
        if (v < 0) v = 0;
        if (v > max) v = max;
      }
      giftCityPos = v;
      giftCityListEl.scrollLeft = v;
    }

    function shouldPauseGiftCity(ts) {
      if (!giftCityListEl) return true;
      if (giftCityDragActive) return true;
      if (giftCityListEl.contains(document.activeElement)) return true;
      return ts < giftCityPauseUntil;
    }

    function startGiftCityAutoScroll() {
      if (giftCityRaf || giftCityReducedMotion || !giftCityListEl) return;
      giftCityLastTs = 0;
      const tick = (ts) => {
        if (!giftCityLastTs) giftCityLastTs = ts;
        const dt = Math.min(40, ts - giftCityLastTs);
        giftCityLastTs = ts;
        const loopW = giftCityLoopWidth();
        if (!shouldPauseGiftCity(ts) && giftCityListEl && loopW > giftCityListEl.clientWidth) {
          setGiftCityScroll(giftCityPos + GIFT_CITY_PX_PER_SEC * (dt / 1000), loopW);
        }
        giftCityRaf = requestAnimationFrame(tick);
      };
      giftCityRaf = requestAnimationFrame(tick);
    }

    function wrapGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      if (loopW <= 0) { giftCityPos = giftCityListEl.scrollLeft; return; }
      setGiftCityScroll(giftCityListEl.scrollLeft, loopW);
    }

    function initGiftCityInteractions() {
      if (!giftCityListEl) return;
      let dragStartX = 0, dragStartScroll = 0, dragSuppressClick = false, pointerDownId = null;
      const DRAG_THRESHOLD = 4;
      giftCityListEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        giftCityDragActive = false;
        pointerDownId = e.pointerId;
        dragStartX = e.clientX;
        giftCityPos = giftCityListEl.scrollLeft;
        dragStartScroll = giftCityListEl.scrollLeft;
        giftCityPauseUntil = performance.now() + 600;
      });
      giftCityListEl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== pointerDownId) return;
        const dx = e.clientX - dragStartX;
        if (!giftCityDragActive && Math.abs(dx) > DRAG_THRESHOLD) {
          giftCityDragActive = true;
          giftCityListEl.classList.add('is-dragging');
          try { giftCityListEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          giftCityListEl.scrollLeft = dragStartScroll - dx;
          wrapGiftCityScroll();
          const consumed = (dragStartScroll - dx) - giftCityListEl.scrollLeft;
          if (consumed !== 0) dragStartScroll -= consumed;
          e.preventDefault();
        }
      });
      const endDrag = (e) => {
        if (e.pointerId === pointerDownId) pointerDownId = null;
        if (giftCityListEl.hasPointerCapture && giftCityListEl.hasPointerCapture(e.pointerId)) {
          try { giftCityListEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          dragSuppressClick = true;
          setTimeout(() => { dragSuppressClick = false; }, 0);
        }
        giftCityDragActive = false;
        giftCityListEl.classList.remove('is-dragging');
        giftCityPauseUntil = performance.now() + 350;
      };
      giftCityListEl.addEventListener('pointerup', endDrag);
      giftCityListEl.addEventListener('pointercancel', endDrag);
      // Swallow the click that follows a drag so a swipe doesn't navigate.
      giftCityListEl.addEventListener('click', (e) => {
        if (dragSuppressClick) { e.preventDefault(); e.stopPropagation(); }
      }, true);
      giftCityListEl.addEventListener('wheel', () => { giftCityPauseUntil = performance.now() + 800; }, { passive: true });
      giftCityListEl.addEventListener('scroll', wrapGiftCityScroll, { passive: true });
    }

    function setupGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      giftCityPos = loopW;
      giftCityListEl.scrollLeft = loopW;
      if (!giftCityInited) { initGiftCityInteractions(); giftCityInited = true; }
      startGiftCityAutoScroll();
    }

    // Coerce any value to a display string. NOTE: this does NOT escape HTML —
    // callers must assign the result via textContent (never innerHTML).
    function asText(value) {
      return String(value == null ? '' : value);
    }

    // Defensive filter: legacy gift_shop_items rows may have the scraper's
    // admin breadcrumb ("Surfaced from the Amazon search: …") stored in the
    // description column. Hide that from public visitors until an admin (or
    // the AI rewrite pass in gs_stock.py) backfills a real blurb.
    function cleanDescription(raw) {
      const t = String(raw == null ? '' : raw).trim();
      if (!t) return '';
      if (/^Surfaced from the Amazon search:/i.test(t)) return '';
      return t;
    }

    function shouldContainGiftImage(item) {
      const title = String(item && item.title || '');
      const url = String(item && item.url || '');
      const imageUrl = String(item && item.image_url || '');
      return /B00O9KFZIE/i.test(url)
        || /bookshop\.org/i.test(url)
        || /images-us\.bookshop\.org\/ingram/i.test(imageUrl)
        || /\b(blu[-\s]?ray|blue[-\s]?ray|dvd)\b/i.test(title)
        || /\(bd\)/i.test(title)
        || /\bBD\b/.test(title);
    }

    function imageLooksPortraitProduct(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return false;
      return img.naturalHeight / img.naturalWidth >= 1.15;
    }

    function applyGiftImageDisplay(img, item, media) {
      const focus = String(item && item.image_focus || '').trim();
      const applyContain = () => {
        img.style.objectFit = 'contain';
        img.style.objectPosition = '50% 50%';
        if (media) media.dataset.imageFit = 'contain';
      };
      if (shouldContainGiftImage(item)) {
        applyContain();
        return;
      }
      if (focus) img.style.objectPosition = focus;
      const applyAutoContain = () => {
        if (imageLooksPortraitProduct(img)) applyContain();
      };
      if (img.complete && img.naturalWidth > 0) applyAutoContain();
      else img.addEventListener('load', applyAutoContain, { once: true });
    }

    /* `fandom_game` IS NO LONGER A COLUMN of `public.games`, so this can only
       answer false. It is kept rather than deleted because its caller reads as
       a real decision -- a fandom gift belongs to the VISITING fanbase's city
       and every other gift to the game's own -- and deleting it would hide that
       the distinction has been lost rather than dropped. **A gift's city does
       not come from a game at all now**: it is `gift_shop_listings.city`,
       filled on all 969 rows. */
    function isFandomGame(game) {
      return false;
    }

    // Match Mission Control's city derivation: fandom gifts belong to the
    // visiting fanbase's city; every other gift belongs to the game's city.
    function gameCity(game) {
      if (!game) return '';
      return String((isFandomGame(game) ? game.away_team_city : game.city) || '').trim();
    }

    function gameMatchesCity(game, city) {
      const filter = String(city || '').trim();
      if (!filter) return true;
      return sameCity(gameCity(game), filter);
    }

    // Resolved id of the ?id=/?game= filter (empty = show every game's gifts).
    // Set in loadAllShops once the games list is available.
    let requestedGameId = '';
    function listingMatchesGameFilter(listing) {
      if (!requestedGameId) return true;
      return String((listing && listing.game_id) || '') === requestedGameId;
    }
    function gameMatchesGameFilter(game) {
      if (!requestedGameId) return true;
      return !!game && String(game.id) === requestedGameId;
    }

    function isYesish(value) {
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toUpperCase();
      return normalized === 'YES' || normalized === 'TRUE' || normalized === '1';
    }

    // Only certified gifts are shown publicly. Current rows use certified_at
    // from Mission Control; tolerate an explicit certified/YES flag too.
    function isCertified(item) {
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified')) {
        return isYesish(item.certified);
      }
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified_yes')) {
        return isYesish(item.certified_yes);
      }
      return !!String(item && item.certified_at || '').trim();
    }

    // Featured flag (gift_shop_items.featured), same 'YES'/null convention as
    // games. Drives the default /gifts/ view.
    function isFeatured(item) {
      return isYesish(item && item.featured);
    }

    function isHiddenGiftItem(item) {
      // A SHELVED item (rejected_at set) is never shown publicly, same as one in Review.
      if (item && String(item.rejected_at || '').trim()) return true;
      return [item && item.hidden, item && item.archived].some((value) => {
        return isYesish(value);
      });
    }

    // Grid ordering: plain alphabetical by item title.
    function compareGiftEntries(a, b) {
      const at = String(a && a.item && a.item.title || '').trim();
      const bt = String(b && b.item && b.item.title || '').trim();
      return at.localeCompare(bt, undefined, { sensitivity: 'base', numeric: true }) ||
        String(a && a.item && a.item.id || '').localeCompare(String(b && b.item && b.item.id || ''));
    }

    function normalizeGiftCities(cities) {
      const seen = new Map();
      (Array.isArray(cities) ? cities : []).forEach((cityValue) => {
        const city = String(cityValue || '').trim();
        if (!city) return;
        const key = city.toLowerCase();
        if (!seen.has(key)) seen.set(key, city);
      });
      return Array.from(seen.values())
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }));
    }

    function appendGiftCityTags(body, cities) {
      const labels = normalizeGiftCities(cities);
      if (!labels.length || !body) return;
      const tags = document.createElement('div');
      tags.className = 'card-city-tags';
      tags.tabIndex = 0;
      tags.setAttribute('aria-label', 'Gift cities');
      const track = document.createElement('div');
      track.className = 'card-city-track';
      labels.forEach((city) => {
        const tag = document.createElement('span');
        tag.className = 'card-city-tag';
        tag.setAttribute('role', 'link');
        tag.tabIndex = 0;
        tag.dataset.city = city;
        tag.textContent = cityDisplayName(city) || city;
        tag.title = 'Shop ' + city;
        track.appendChild(tag);
      });
      tags.appendChild(track);
      setupCityTagLoop(tags);
      body.appendChild(tags);
    }

    function setupCityTagLoop(el) {
      const track = el && el.querySelector('.card-city-track');
      if (!track) return;
      const originalTags = () => Array.from(track.querySelectorAll('.card-city-tag:not(.card-city-tag--clone)'));
      const clearClones = () => {
        track.querySelectorAll('.card-city-tag--clone').forEach((tag) => tag.remove());
      };
      const updateLoop = () => {
        el.classList.remove('is-looping');
        track.style.removeProperty('--card-city-loop-distance');
        track.style.removeProperty('--card-city-loop-duration');
        track.style.animation = 'none';
        clearClones();
        const originals = originalTags();
        if (!originals.length || track.scrollWidth <= el.clientWidth + 1) {
          track.style.removeProperty('animation');
          return;
        }
        const first = originals[0];
        const frag = document.createDocumentFragment();
        originals.forEach((tag) => {
          const clone = tag.cloneNode(true);
          clone.classList.add('card-city-tag--clone');
          clone.setAttribute('aria-hidden', 'true');
          clone.tabIndex = -1;
          frag.appendChild(clone);
        });
        track.appendChild(frag);
        const firstClone = track.querySelector('.card-city-tag--clone');
        const distance = first && firstClone ? firstClone.offsetLeft - first.offsetLeft : 0;
        if (distance <= 1) {
          track.style.removeProperty('animation');
          return;
        }
        track.style.setProperty('--card-city-loop-distance', distance + 'px');
        track.style.setProperty('--card-city-loop-duration', Math.max(12, distance / 16) + 's');
        // Force a fresh animation calculation after the previous inline reset.
        void track.offsetWidth;
        track.style.removeProperty('animation');
        el.classList.add('is-looping');
      };
      requestAnimationFrame(updateLoop);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(updateLoop);
        ro.observe(el);
        el._cityTagResizeObserver = ro;
      } else {
        window.addEventListener('resize', updateLoop);
      }
      el.addEventListener('keydown', (e) => {
        const cityTag = e.target && e.target.closest ? e.target.closest('.card-city-tag') : null;
        if (cityTag && el.contains(cityTag) && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = giftCityHref(cityTag.dataset.city || '');
          return;
        }
      });
      el.addEventListener('click', (e) => {
        const cityTag = e.target && e.target.closest ? e.target.closest('.card-city-tag') : null;
        if (!cityTag || !el.contains(cityTag)) return;
        e.preventDefault();
        e.stopPropagation();
        window.location.href = giftCityHref(cityTag.dataset.city || '');
      }, true);
    }

    function buildGiftItemCities(listings) {
      const citiesByItemId = new Map();
      (Array.isArray(listings) ? listings : []).forEach((listing) => {
        const item = listing && listing.gift_shop_items;
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        const city = String(listing && listing.city || '').trim();
        if (!city) return;
        const id = String(item.id);
        if (!citiesByItemId.has(id)) citiesByItemId.set(id, new Set());
        citiesByItemId.get(id).add(city);
      });
      const result = new Map();
      citiesByItemId.forEach((cities, id) => {
        result.set(id, normalizeGiftCities(Array.from(cities)));
      });
      return result;
    }

    function getMonogram(title) {
      const t = String(title || 'Item').trim();
      const words = t.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'GS';
    }

    function renderEmpty(message) {
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gridEl.appendChild(empty);
    }

    // Placeholder cards shown while the shop loads — keeps the grid's shape so
    // it doesn't flash a single text box before the real cards arrive.
    function renderSkeleton(count = 8) {
      gridEl.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        card.setAttribute('aria-hidden', 'true');
        const media = document.createElement('div');
        media.className = 'skeleton-media skeleton-shimmer';
        const body = document.createElement('div');
        body.className = 'skeleton-body';
        ['skeleton-line--title', '', 'skeleton-line--short'].forEach((mod) => {
          const line = document.createElement('div');
          line.className = 'skeleton-line skeleton-shimmer' + (mod ? ' ' + mod : '');
          body.appendChild(line);
        });
        const cta = document.createElement('div');
        cta.className = 'skeleton-cta skeleton-shimmer';
        body.appendChild(cta);
        card.append(media, body);
        gridEl.appendChild(card);
      }
    }

    // Reserve the city-rail height with placeholder pills so the panel doesn't
    // start collapsed and then push the grid down when the real cities arrive.
    function renderCityRailSkeleton() {
      if (!giftCityPanelEl || !giftCityListEl) return;
      giftCityPanelEl.hidden = false;
      if (giftCityTitleEl) giftCityTitleEl.textContent = 'Cities';
      giftCityListEl.innerHTML = '';
      const track = document.createElement('div');
      track.className = 'gift-city-track';
      [128, 152, 136, 168, 132, 148, 160, 124].forEach((w) => {
        const chip = document.createElement('div');
        chip.className = 'gift-city-skeleton-chip skeleton-shimmer';
        chip.style.width = w + 'px';
        chip.setAttribute('aria-hidden', 'true');
        track.appendChild(chip);
      });
      giftCityListEl.appendChild(track);
    }

    // Reserve the grid-header height with a shimmer title line (only for the
    // views that will actually show a header — not the single-item preview).
    function renderGridHeadSkeleton() {
      if (!giftGridHeadEl || !giftGridTitleEl) return;
      giftGridTitleEl.innerHTML = '';
      const line = document.createElement('span');
      line.className = 'gift-grid-title-skeleton skeleton-shimmer';
      line.setAttribute('aria-hidden', 'true');
      giftGridTitleEl.appendChild(line);
      giftGridHeadEl.hidden = false;
    }

    // Paint the full loading layout up front so first paint matches the final
    // shape — city rail, grid header, and grid all hold their space, then fill
    // in place with no reflow. The single-item preview has neither rail nor head.
    function renderLoadingLayout() {
      renderSkeleton();
      renderCityRailSkeleton();
      // A game filter scopes the shop and shows no grid header (it uses the hero
      // lead instead); every other view gets the header.
      if (requestedGameParam) {
        if (giftGridHeadEl) giftGridHeadEl.hidden = true;
      } else {
        renderGridHeadSkeleton();
      }
    }

    function buildSupabaseUrl(table, query = {}) {
      const url = new URL('rest/v1/' + table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      Object.entries(query).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        throw new Error('Network request to Supabase failed.');
      }
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error('Supabase ' + res.status + ': ' + text.slice(0, 200));
      }
      return res.json();
    }

    // "Load the whole table" reads must paginate past PostgREST's 1000-row cap,
    // or the tail silently vanishes once a table grows past 1000 rows (see
    // CLAUDE.md). TgbRest.fetchAll loops with the Range header; fall back to a
    // single unpaginated read only if the helper failed to load.
    async function fetchAllRows(url) {
      if (window.TgbRest && typeof window.TgbRest.fetchAll === 'function') {
        return window.TgbRest.fetchAll(url, {});
      }
      return fetchJson(url);
    }

    async function fetchAllListings() {
      return fetchAllRows(buildSupabaseUrl('gift_shop_listings', {
        // Listings now carry the city directly; no game join needed.
        select: '*,gift_shop_items(*)',
        archived: 'eq.false',
        order: 'created_at.desc'
      }));
    }

    // Names of every city hidden from the shop, lowercased. Filled by
    // fetchGiftShopCities and read by buildGiftCityEntries, which would
    // otherwise re-introduce one of these via a game (see the back-fill below).
    // A Set of names rather than rows because the game path only has the city
    // string to match on.
    const hiddenShopCityNames = new Set();
    function isIgnoredCity(city) {
      return hiddenShopCityNames.has(String(city || '').trim().toLowerCase());
    }

    // True when a catalog row is hidden from the gift shop. Prefers the
    // per-surface `hide_from_gift_shop` column and falls back to the retired
    // `ignored` flag only when that column is absent, so the page behaves
    // correctly before and after 2026072901_cities_hide_flags.sql.
    // THE SHOP'S CITY LIST IS ITS OWN LISTINGS, AND NOTHING ELSE (2026-08-31).
    // It used to read public.cities, the whole site's catalogue, and drop the
    // rows flagged `hide_from_gift_shop`. Asked for outright: the gift shop
    // keeps its own list and does not join that table.
    //
    // WHAT IT COSTS, said rather than discovered later. `hide_from_gift_shop`
    // governs nothing here now, so SIX CITIES IT WAS HIDING appear on the rail
    // the moment they hold a listing: Glendale, Miami Gardens, Orchard Park and
    // Santa Clara -- venue towns nobody shops for -- plus Moscow and Kyiv.
    // Archiving those listings is what takes them off the rail now, and the
    // flag still governs /games/ and /soundtracks/ as it always did.
    //
    // `hiddenShopCityNames` STAYS AND STAYS EMPTY. buildGiftCityEntries reads it
    // when back-filling cities found on a game, and an empty set is the honest
    // answer to "which cities are hidden from the shop" once nothing hides one.
    // Deleting it would mean editing that back-fill for no gain.
    async function fetchGiftShopCities() {
      const rows = await fetchAllRows(buildSupabaseUrl('gift_shop_listings', {
        select: 'city'
      }));
      hiddenShopCityNames.clear();
      return Array.isArray(rows) ? rows : [];
    }

    // Every gift_shop_items row, so the shop can show items even when they have
    // no game listing. Archived / access-code rows are filtered out by the caller.
    async function fetchAllShopItems() {
      return fetchAllRows(buildSupabaseUrl('gift_shop_items', {
        select: '*',
        order: 'created_at.desc'
      }));
    }

    // Pull every game so we can synthesize access-code purchase options
    // without needing pre-seeded gift_shop_items rows. The server-side
    // gs-create-checkout looks up the price authoritatively from
    // games.price — the only thing the client passes is game_id, so
    // there's no tampering surface.
    /* `games_with_teams` IS GONE, AND SO ARE ELEVEN OF THE COLUMNS IT ASKED
       FOR. That view no longer exists (`PGRST205`), and `public.games` has
       since lost `archived`, all three colours, both club cities and mascots,
       both team keys, `fandom_game` and `logo_url`. So this read was answering
       404 on EVERY LOAD of the public shop.
         IT COST NOTHING VISIBLE, which is why it went unnoticed: the caller
       catches, and `SHOW_TGB_GAMES_IN_SHOP` is false, so no game is drawn
       either way. What it did do is fire a failing request at every visitor.
         SO IT IS NOT MADE AT ALL WHILE THE FLAG IS OFF, and the select is
       repaired so that flipping the flag reads a table that exists rather than
       a view that does not. **What flipping it would now give is a card with no
       image and no club colour**: `logo_url` and the palette keys are gone from
       `public.games`, and no page can invent them. */
    async function fetchAllGames() {
      if (!SHOW_TGB_GAMES_IN_SHOP) return [];
      return fetchAllRows(buildSupabaseUrl('games', {
        select: 'id,name,tagline,price,engine,status,city,tags,category_icon'
      }));
    }

    function getGamePrimaryColor(game, teams) {
      if (window.TgbTeamPalette) {
        return window.TgbTeamPalette.resolveGamePalette(teams, game, 'away').palette.primary;
      }
      return String(game && game.primary_color || '').trim();
    }

    function isGamePaid(game) {
      if (!game) return false;
      const price = String(game.price == null ? '' : game.price).trim();
      if (!price || price.toUpperCase() === 'FREE') return false;
      // A GAME IS ON SALE WHEN ITS STATUS SAYS `live`. This read `archived`,
      // a text flag carrying 'YES' that is no longer a column; `games.status`
      // replaced it and `building` and `archived` both mean not for sale.
      if (String(game.status || '').trim().toLowerCase() !== 'live') return false;
      // Sanity-check that price parses to something positive — guards
      // against rows like "TBA" or "$" that would fail at checkout.
      const numeric = price.replace(/[^0-9.]/g, '');
      const dollars = parseFloat(numeric);
      return Number.isFinite(dollars) && dollars > 0;
    }

    // TEMPORARY: TGB games are pulled from the gift shop(s). Flip this back to
    // true (or delete it and the guard below) to show game products again.
    // Gating here removes games from BOTH the card grid and the city-rail counts,
    // since both surfaces route through isGiftShopGame().
    const SHOW_TGB_GAMES_IN_SHOP = false;

    function isGiftShopGame(game) {
      if (!SHOW_TGB_GAMES_IN_SHOP) return false;
      return isGamePaid(game);
    }

    function gameShopImageUrl(game) {
      // Strict separation: the shop card is the GAME's image, so it uses the
      // game logo ONLY, never the guide portrait. A game with no logo shows no
      // card image rather than borrowing the guide image.
      //   `logo_url` IS NO LONGER A COLUMN. A game points at `logo_id` into
      // `public.logos`, which holds the image itself, and nothing here reads
      // that yet. So this returns nothing and a game card would draw no image.
      // Unreachable today: `SHOW_TGB_GAMES_IN_SHOP` is false.
      return '';
    }

    function gameToGiftCardItem(game) {
      const tagline = String(game && game.tagline || '').trim();
      return {
        id:                'auto-gift:' + game.id,    // synthetic; never persisted
        title:             game.name || 'Untitled game',
        price_display:     game.price,
        description:       tagline || 'Game checkout is coming soon. This game will be available to buy from the gift shop.',
        image_url:         gameShopImageUrl(game),
        gift_card_game_id: game.id,
        engine:            game.engine || ''
      };
    }

    // Build the "pick any game" card. Click → opens TgbGift modal at
    // the chooser step, where the buyer picks a game from the list
    // of paid games and continues into the same Stripe flow.
    function createChooseAnyGameCard(paidGames) {
      const card = document.createElement('article');
      card.className = 'card card--gift-card card--gift-card-choose';
      card.dataset.giftCardChoose = 'true';

      const media = document.createElement('div');
      media.className = 'card-media';
      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = '★';
      media.appendChild(monogram);
      const heroImg = document.createElement('img');
      heroImg.className = 'card-image';
      heroImg.src = '/mc/gifts/shop_banner.png';
      heroImg.alt = '';
      heroImg.loading = 'lazy';
      heroImg.decoding = 'async';
      heroImg.addEventListener('error', () => {
        heroImg.remove();
        media.dataset.hasImage = 'false';
      });
      media.appendChild(heroImg);
      media.dataset.hasImage = 'true';

      const body = document.createElement('div');
      body.className = 'card-body';

      const eyebrow = document.createElement('p');
      eyebrow.className = 'card-game-eyebrow';
      eyebrow.textContent = 'Gift Shop · Featured';
      body.appendChild(eyebrow);

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = 'Game Access — Your Pick';
      body.appendChild(title);

      const count = (paidGames && paidGames.length) || 0;
      const desc = document.createElement('p');
      desc.className = 'card-caption';
      desc.textContent = count
        ? 'Pick any of our ' + count + ' games at checkout. Recipient gets an access code that unlocks it on any device.'
        : 'Pick any game at checkout. Recipient gets an access code that unlocks it on any device.';
      body.appendChild(desc);

      const cta = document.createElement('button');
      cta.type = 'button';
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      body.appendChild(cta);

      card.append(media, body);

      cta.addEventListener('click', () => {
        if (!window.TgbGift) return;
        window.TgbGift.openForChoice({ games: paidGames || [] });
      });

      return card;
    }

    // Every card gets a "more" affordance into the detail lightbox — whether or
    // not the caption is truncated. When the text is clamped it reads as the
    // continuation ("…records, a… more"); when it fits, it's still an explicit
    // door into the full details.
    function attachMoreAffordance(captionEl, item, opts) {
      captionEl.appendChild(buildMoreLink(item, opts));
    }

    // A "More" link that opens the detail lightbox. Built as a role=button span
    // so it can live inside the card's <a>/<button> without nesting a control;
    // preventDefault + stopPropagation keep the card's own click from firing.
    function buildMoreLink(item, opts) {
      const more = document.createElement('span');
      more.className = 'card-more';
      more.textContent = 'More';
      more.setAttribute('role', 'button');
      more.tabIndex = 0;
      const open = (e) => { e.preventDefault(); e.stopPropagation(); openGiftDetail(item, opts); };
      more.addEventListener('click', open);
      more.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
      return more;
    }

    function bindCardMediaToDetail(media, item, opts = {}) {
      if (!media || !item) return;
      media.dataset.opensDetail = 'true';
      media.setAttribute('role', 'button');
      media.setAttribute('aria-label', 'More about ' + asText(item.title || 'this gift'));
      media.tabIndex = 0;
      const open = (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        openGiftDetail(item, opts);
      };
      media.addEventListener('click', open);
      media.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') open(e);
      });
    }

    // Ref-counted body-scroll lock, shared by the gift-detail dialog and the
    // image zoom so that closing the zoom (opened on top of the dialog) doesn't
    // unlock scrolling while the dialog is still open.
    let scrollLockCount = 0;
    function lockBodyScroll() {
      if (scrollLockCount++ === 0) document.body.style.overflow = 'hidden';
    }
    function unlockBodyScroll() {
      if (scrollLockCount > 0 && --scrollLockCount === 0) document.body.style.overflow = '';
    }

    // Element focused before the dialog opened, so we can restore it on close.
    let giftDetailReturnFocus = null;

    // Keep Tab focus inside the open dialog panel.
    function trapGiftDetailFocus(event) {
      if (event.key !== 'Tab') return;
      const el = document.getElementById('giftDetail');
      if (!el || el.hidden) return;
      const focusables = el.querySelectorAll(
        'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
      );
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function closeGiftDetail() {
      const el = document.getElementById('giftDetail');
      if (!el || el.hidden) return;
      el.hidden = true;
      document.removeEventListener('keydown', trapGiftDetailFocus, true);
      unlockBodyScroll();
      if (giftDetailReturnFocus && typeof giftDetailReturnFocus.focus === 'function') {
        giftDetailReturnFocus.focus();
      }
      giftDetailReturnFocus = null;
    }

    // Populate + open the full-gift lightbox (scrolls if the description is long).
    function openGiftDetail(item, opts = {}) {
      const el = document.getElementById('giftDetail');
      if (!el || !item) return;
      const media   = document.getElementById('giftDetailMedia');
      const titleEl = document.getElementById('giftDetailTitle');
      const priceEl = document.getElementById('giftDetailPrice');
      const descEl  = document.getElementById('giftDetailDesc');
      const ctaWrap = document.getElementById('giftDetailCtaWrap');

      media.innerHTML = '';
      media.classList.remove('is-clickable');
      media.removeAttribute('role');
      media.removeAttribute('aria-label');
      media.removeAttribute('tabindex');
      media.style.removeProperty('--card-game-color');
      if (opts.gameColor) media.style.setProperty('--card-game-color', opts.gameColor);
      const imageUrl = String(item.image_url || '').trim();
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        media.appendChild(img);
        // The image in this dialog is inert: no zoom, no focus stop, and no
        // pointer affordance — it is illustration, not a control.
      } else {
        const mono = document.createElement('div');
        mono.className = 'gift-detail-monogram';
        mono.textContent = getMonogram(item.title);
        media.appendChild(mono);
      }

      titleEl.textContent = asText(item.title || 'Untitled item');
      const price = String(item.price_display || '').trim();
      priceEl.textContent = price;
      priceEl.hidden = !price;
      descEl.textContent = cleanDescription(item.description) || 'No description available.';

      ctaWrap.innerHTML = '';
      if (item.gift_card_game_id) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gift-detail-cta';
        btn.textContent = 'Buy now';
        btn.addEventListener('click', () => {
          closeGiftDetail();
          if (!window.TgbGift) return;
          window.TgbGift.openForGame({
            id:     item.gift_card_game_id,
            name:   String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                      || (opts.gameName || 'this game'),
            price:  item.price_display || '',
            engine: item.engine || opts.engine || ''
          });
        });
        ctaWrap.appendChild(btn);
      } else {
        const url = String(item.url || '').trim();
        if (/^https?:\/\//i.test(url)) {
          const a = document.createElement('a');
          a.className = 'gift-detail-cta';
          a.href = url;
          a.target = '_blank';
          a.rel = giftCtaRel(url);
          a.textContent = giftCtaLabel(item);
          ctaWrap.appendChild(a);
        }
      }

      giftDetailReturnFocus = document.activeElement;
      el.hidden = false;
      const body = el.querySelector('.gift-detail-body');
      if (body) body.scrollTop = 0;
      lockBodyScroll();
      document.addEventListener('keydown', trapGiftDetailFocus, true);
      // Move focus into the dialog (the close button) for keyboard/AT users.
      const closeBtn = el.querySelector('.gift-detail-close');
      if (closeBtn) closeBtn.focus();
    }

    // ?item=<id> — POP THE GIFT OPEN OVER THE ORDINARY SHOP.
    //
    // The shop renders first and is not filtered, so what you land on is the
    // gift shop with this gift open on top of it: the same lightbox a click on
    // the card opens, closing to a real page full of other gifts rather than to
    // a page with one card on it. That matters because this is the link every
    // gift post on social carries.
    //
    // IT READS THE ITEM, NOT A CARD. openGiftDetail takes the row itself, so
    // the gift does not have to be in the grid — and it usually is not, since
    // /gifts/ shows the featured set. It also means the admin's "VIEW IN GIFT
    // SHOP" preview still opens a draft or hidden gift that the shop would
    // never render.
    //
    // A link to a gift that no longer exists opens nothing and says nothing:
    // you are on the gift shop, which is a fine place to be.
    function openRequestedGift(items, itemCities) {
      if (!requestedItemId) return;
      const list = Array.isArray(items) ? items : [];
      const item = list.find((it) => it && String(it.id) === requestedItemId);
      if (!item) return;
      const cities = itemCities && typeof itemCities.get === 'function'
        ? (itemCities.get(String(item.id)) || [])
        : [];
      openGiftDetail(item, { cities });
    }

    // Close on backdrop / × / Escape (delegated so it works no matter when the
    // lightbox node is parsed relative to this script).
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-gift-detail-close]')) closeGiftDetail();
    });
    document.addEventListener('keydown', (e) => {
      const el = document.getElementById('giftDetail');
      const zoom = document.getElementById('imageZoom');
      // When the full-size zoom is open on top, let Escape close it first.
      if (e.key === 'Escape' && el && !el.hidden && (!zoom || zoom.hidden)) closeGiftDetail();
    });

    function createCard(item, opts = {}) {
      // Access-code items are TGB's own products (not affiliate). They have
      // no external url; clicking the card opens the shared gift-buy
      // modal via /mc/js/gs-buy-modal.js.
      if (item && item.gift_card_game_id) {
        return createGiftCardCard(item, opts);
      }

      const url = String(item.url || '').trim();
      // Only http(s) links render — guards against a stray javascript:/data: URL
      // in the admin-entered url executing on click.
      if (!/^https?:\/\//i.test(url)) return null;

      // The card itself is no longer one big link — only the image / "more"
      // affordance (→ detail) and the CTA button (→ retailer) are
      // clickable. The container is an inert <article>.
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';
      // Tag the card with its curation source so the source filter can
      // show/hide it (amazon | bookshop | free).
      card.dataset.giftSource = giftItemSource(item);

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
        bindCardMediaToDetail(media, item, opts);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }
      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = asText(item.title || 'Untitled item');
      body.appendChild(title);

      appendGiftCityTags(body, opts.cities);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        attachMoreAffordance(captionEl, item, opts);
        body.appendChild(captionEl);
      }

      // The CTA is now the real clickable control that leaves for the retailer.
      const cta = document.createElement('a');
      cta.className = 'card-cta';
      cta.href = url;
      cta.target = '_blank';
      cta.rel = giftCtaRel(url);
      cta.textContent = giftCtaLabel(item);
      body.appendChild(cta);

      card.append(media, body);
      return card;
    }

    // Amazon/Bookshop links are affiliate (paid) — flagged rel="sponsored".
    // Hand-added destination links (visitor guides, tickets, experiences) are
    // not affiliate, so they don't carry the sponsored token.
    function isAffiliateUrl(url) {
      const u = String(url || '').toLowerCase();
      return /amazon\.|amzn\.to|\ba\.co\//.test(u) || /bookshop\.org/.test(u);
    }

    // Which bucket a gift card belongs to for the "Curated from" filter:
    //   amazon   → Amazon affiliate link
    //   bookshop → Bookshop.org affiliate link
    //   free     → everything else: free publications (travel guides, audio
    //              tours, free walking tours) — no book-retailer affiliate.
    function giftItemSource(item) {
      const u = String(item && item.url || '').toLowerCase();
      if (/amazon\.|amzn\.to|\ba\.co\//.test(u)) return 'amazon';
      if (/bookshop\.org/.test(u)) return 'bookshop';
      return 'free';
    }
    function giftCtaRel(url) {
      return isAffiliateUrl(url) ? 'noopener nofollow sponsored' : 'noopener noreferrer';
    }

    // The CTA names where the click goes so "buy" isn't a bait-and-switch. A
    // hand-entered per-item label (cta_label) wins — that's how a destination
    // item reads "Request Guide" / "Get Tickets". Otherwise Amazon/Bookshop are
    // named, and any other destination falls back to "Visit Site". CSS uppercases
    // the label and appends a "→" on cards.
    function giftCtaLabel(item) {
      const custom = String(item && item.cta_label || '').trim();
      if (custom) return custom;
      const u = String(item && item.url || '').toLowerCase();
      if (/amazon\.|amzn\.to|\ba\.co\//.test(u)) return 'View on Amazon';
      if (/bookshop\.org/.test(u)) return 'View on Bookshop';
      return 'Visit Site';
    }

    function showGamePurchasePlaceholder(gameName) {
      const name = String(gameName || '').trim();
      window.alert(name
        ? 'Checkout for "' + name + '" is coming soon.'
        : 'Game checkout is coming soon.');
    }

    // Build an access-code-style card. Persisted gift-card items still use the
    // gift-buy modal; generated game cards pass placeholderPurchase until
    // checkout is ready.
    function createGiftCardCard(item, opts = {}) {
      // Inert container — only the image / "more" detail affordance and the
      // CTA button below are clickable.
      const card = document.createElement('article');
      card.className = 'card card--gift-card';
      card.dataset.adminEdit = opts.adminKind || 'gift-item';
      card.dataset.adminId = opts.adminId || item.id || '';
      if (opts.placeholderPurchase) {
        card.dataset.purchasePlaceholder = 'true';
      }

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
        bindCardMediaToDetail(media, item, opts);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }
      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = asText(item.title || 'Game access');
      body.appendChild(title);

      appendGiftCityTags(body, opts.cities);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        attachMoreAffordance(captionEl, item, opts);
        body.appendChild(captionEl);
      }

      // Only the CTA is clickable now — it opens the buy modal.
      const cta = document.createElement('button');
      cta.type = 'button';
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      if (opts.placeholderPurchase) {
        cta.setAttribute('aria-label', 'Buy ' + (item.title || 'this game') + ' (coming soon)');
      }
      body.appendChild(cta);

      card.append(media, body);

      cta.addEventListener('click', () => {
        if (opts.placeholderPurchase) {
          showGamePurchasePlaceholder(item.title || opts.gameName || '');
          return;
        }
        if (!window.TgbGift) return;
        window.TgbGift.openForGame({
          id:    item.gift_card_game_id,
          name:  String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                  || (opts.gameName || 'this game'),
          price: item.price_display || '',
          engine: item.engine || opts.engine || ''
        });
      });

      return card;
    }

    function compareGamesByName(a, b) {
      return String(a && a.name || '').localeCompare(String(b && b.name || ''), undefined, { sensitivity: 'base', numeric: true }) ||
        String(a && a.id || '').localeCompare(String(b && b.id || ''));
    }

    function createGameAccessCard(game, teams) {
      if (!game || !game.id) return null;
      return createGiftCardCard(gameToGiftCardItem(game), {
        adminKind: 'game',
        adminId: game.id,
        engine: game.engine || '',
        gameColor: getGamePrimaryColor(game, teams),
        gameName: game.name || '',
        placeholderPurchase: true
      });
    }

    async function loadAllShops() {
      headingEl.textContent = 'Gift Shop';
      setEyebrow('');
      leadEl.textContent = '';
      leadEl.hidden = true;
      document.title = (requestedCity ? requestedCity.toUpperCase() + ' ' : '') + 'GIFT SHOP | THE GAME BUREAU';

      renderLoadingLayout();

      try {
        const [listings, allGames, allItems, shopCities, teams] = await Promise.all([
          fetchAllListings().catch(() => []),
          fetchAllGames().catch(() => []),
          fetchAllShopItems().catch(() => []),
          fetchGiftShopCities().catch(() => []),
          window.TgbTeamPalette
            ? window.TgbTeamPalette.loadTeams(SB_CONFIG).catch(() => [])
            : Promise.resolve([])
        ]);
        const safeListings = Array.isArray(listings) ? listings : [];
        const safeGames    = Array.isArray(allGames) ? allGames : [];
        const safeItems    = Array.isArray(allItems) ? allItems : [];
        const safeShopCities = Array.isArray(shopCities) ? shopCities : [];
        const cityData = buildGiftCityEntries(safeShopCities, safeListings, safeItems, safeGames);
        const giftItemCities = buildGiftItemCities(safeListings);
        renderGiftCityRail(cityData);

        // Resolve the optional ?id=/?game= filter to a real game — match by id
        // first, then by name (case-insensitive) — and scope the shop to it.
        const requestedGame = requestedGameParam
          ? (safeGames.find((g) => String(g.id) === requestedGameParam)
             || safeGames.find((g) => String(g.name || '').trim().toLowerCase() === requestedGameParam.toLowerCase())
             || null)
          : null;
        requestedGameId = requestedGame ? String(requestedGame.id) : '';
        if (requestedGame) {
          setEyebrow(requestedGame.name || '');
          leadEl.hidden = false;
          leadEl.textContent = 'Gifts inspired by ';
          const leadGameEm = document.createElement('em');
          const leadGameStrong = document.createElement('strong');
          leadGameStrong.textContent = requestedGame.name || 'this game';
          leadGameEm.appendChild(leadGameStrong);
          leadEl.appendChild(leadGameEm);
          leadEl.appendChild(document.createTextNode('.'));
          document.title = String(requestedGame.name || '').toUpperCase() + ' GIFTS | THE GAME BUREAU';
        }

        // Effective city filter: an explicit ?city=, or the city of a ?id=/?game= game.
        const filterCity = requestedCity || (requestedGame ? gameCity(requestedGame) : '');
        const matchingListings = safeListings.filter((listing) => {
          const city = String(listing && listing.city || '').trim();
          return !filterCity || sameCity(city, filterCity);
        });

        // Game products are generated directly from Supabase games, so new or
        // edited games appear in the relevant city shop on the next load.
        const giftShopGames = safeGames
          .filter(isGiftShopGame)
          .filter((game) => gameMatchesCity(game, filterCity))
          .filter(gameMatchesGameFilter)
          .sort(compareGamesByName);
        const gameCards = giftShopGames
          .map((game) => createGameAccessCard(game, teams))
          .filter(Boolean);

        // ── Affiliate-only curated cards (Amazon, Bookshop, etc.).
        // We deliberately skip persisted access-code products because generated
        // game cards now own that surface.
        const grouped = new Map();
        for (const listing of matchingListings) {
          const item = listing && listing.gift_shop_items;
          if (!item || item.id == null) continue;
          if (item.gift_card_game_id) continue; // generated game cards own this
          if (isHiddenGiftItem(item)) continue; // kept for dedupe, hidden from public shop
          if (!isCertified(item)) continue;     // only show certified gifts
          if (!grouped.has(item.id)) {
            grouped.set(item.id, { item, cities: giftItemCities.get(String(item.id)) || [] });
          }
        }

        // Gifts are city-based now (not game-based), so no per-game name/color tags.
        let giftEntries = [];
        for (const { item, cities } of grouped.values()) {
          giftEntries.push({ item, opts: { cities }, cities });
        }

        // Default /gifts/ view: only featured gifts (one+ per city). Fall back to
        // all gifts if nothing is featured yet (e.g. before the column is set),
        // so the shop is never empty.
        let showingFeatured = false;
        if (isFeaturedView) {
          const featured = giftEntries.filter((e) => isFeatured(e.item));
          if (featured.length) { giftEntries = featured; showingFeatured = true; }
        }

        // Ordering modes:
        //  • "All Cities" / unfiltered → EVERY gift, sorted by city then A→Z by name.
        //  • a city/game filter → normal alphabetical-by-title ordering.
        const isUnfiltered = !requestedCity && !requestedGameId;
        if (isUnfiltered) {
          const primaryCity = (entry) => (normalizeGiftCities(entry && entry.cities)[0] || '');
          giftEntries.sort((a, b) => {
            return primaryCity(a).localeCompare(primaryCity(b), undefined, { sensitivity: 'base', numeric: true }) ||
              compareGiftEntries(a, b);
          });
        } else {
          giftEntries.sort(compareGiftEntries);
        }
        const itemCards = giftEntries
          .map(({ item, opts }) => createCard(item, opts))
          .filter(Boolean);

        // Games first, then the sorted affiliate gift items.
        const cards = []
          .concat(gameCards)
          .concat(itemCards);

        gridEl.innerHTML = '';
        if (giftGridHeadEl && !requestedGame) {
          if (requestedCity) {
            giftGridTitleEl.textContent = '';
            giftGridHeadEl.hidden = true;
          } else {
            giftGridTitleEl.textContent = showingFeatured ? 'Featured' : 'All Finds';
            giftGridHeadEl.hidden = false;
          }
        }
        if (!cards.length) {
          renderEmpty(requestedGame
            ? 'No games or gifts for ' + (requestedGame.name || 'this game') + ' yet.'
            : (requestedCity ? 'No games or gifts match ' + requestedCity + '.' : 'No items in the gift shop yet.'));
          setItemCount(0);
          openRequestedGift(safeItems, giftItemCities);
          return;
        }
        cards.forEach((card) => gridEl.appendChild(card));
        setItemCount(cards.length);
        openRequestedGift(safeItems, giftItemCities);
        // Per-game views hide the grid head/filter chrome; everywhere else,
        // offer the source filter (it hides itself if <2 sources are present).
      } catch (error) {
        console.error('[giftshop] all-shops load failed', error);
        renderEmpty('Could not load gift shop.');
        setItemCount(0);
      }
    }

    loadAllShops();

    // The giftShopAdminLogout() helper and its click handler were removed with
    // the Log out pill on 2026-07-28. Signing out now happens where the signing
    // in does, on the /mc/ pages.
  </script>

  <!-- Gift detail lightbox (populated by openGiftDetail) -->
  <div class="gift-detail" id="giftDetail" hidden role="dialog" aria-modal="true" aria-labelledby="giftDetailTitle">
    <div class="gift-detail-backdrop" data-gift-detail-close></div>
    <div class="gift-detail-panel">
      <button class="gift-detail-close" type="button" data-gift-detail-close aria-label="Close">&times;</button>
      <div class="gift-detail-media" id="giftDetailMedia"></div>
      <div class="gift-detail-body">
        <h2 class="gift-detail-title" id="giftDetailTitle"></h2>
        <div class="gift-detail-price" id="giftDetailPrice" hidden></div>
        <p class="gift-detail-desc" id="giftDetailDesc"></p>
        <div class="gift-detail-cta-wrap" id="giftDetailCtaWrap"></div>
      </div>
    </div>
  </div>

  <!-- The Stock Room and Log out pills that used to sit here were removed on
       2026-07-28. The per-gift EDIT GIFT button from admin-bridge is the only
       admin control on this page now; admins reach the Stock Room by typing
       /mc/gifts/, the same way they reach every other /mc/ surface. -->

  <script src="../mc/js/gs-buy-modal.js"></script>

  <!-- Admin-only: paints a hidden "EDIT GIFT" button on each gift card for
       logged-in admins (verified against admin_users), linking to that gift in
       mc/gifts/?item=<id> in a new tab. Invisible to the public. -->
  <script src="/mc/assets/admin-bridge.js"></script>

  <!-- Full-size image zoom: used from inside the gift-detail dialog. -->
  <div class="image-zoom" id="imageZoom" role="dialog" aria-modal="true" aria-label="Full-size product image" hidden>
    <img id="imageZoomImg" src="" alt="" referrerpolicy="no-referrer">
  </div>
  <script>
    (function () {
      const zoom = document.getElementById('imageZoom');
      const zoomImg = document.getElementById('imageZoomImg');
      if (!zoom || !zoomImg) return;

      function openZoom(src, alt) {
        if (!zoom.hidden) return;
        zoomImg.src = src;
        zoomImg.alt = alt || '';
        zoom.hidden = false;
        // Shared ref-counted lock (defined in the main script) so closing the
        // zoom over an open gift-detail dialog doesn't unlock scroll early.
        if (typeof lockBodyScroll === 'function') lockBodyScroll();
        else document.body.style.overflow = 'hidden';
      }
      function closeZoom() {
        if (zoom.hidden) return;
        zoom.hidden = true;
        zoomImg.removeAttribute('src');
        if (typeof unlockBodyScroll === 'function') unlockBodyScroll();
        else document.body.style.overflow = '';
      }

      zoom.addEventListener('click', closeZoom);
      document.addEventListener('keydown', function (event) {
        if (!zoom.hidden && event.key === 'Escape') closeZoom();
      });

      // Exposed so the gift-detail popup can open the full-size zoom when its
      // image is clicked.
      window.TgbImageZoom = { open: openZoom, close: closeZoom };
    }());
  </script>
  <script src="/mc/assets/site-analytics.js" defer></script>
</body>
