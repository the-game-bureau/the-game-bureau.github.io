<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3eee6">
  <title>GIFT SHOP | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@500;600&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site-shell.css">
  <link rel="stylesheet" href="../assets/site-pages.css">
  <script src="../assets/public-account.js"></script>
  <style>
    /* ── Gift shop overrides on top of site-shell.css home-page chrome.
       Body class `home-page` brings the dark night theme, nav, footer,
       Big Shoulders Display + JetBrains Mono. These rules style the
       gift-specific surfaces (grid cards, cart modal) to match. ──── */

    body.home-page .gift-page {
      display: grid;
      gap: 28px;
    }

    body.home-page .hero-kicker {
      margin: 0 0 18px;
      color: var(--accent);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Shorter hero for the gift shop — no scrolling meta panel here, so
       the games-page tall hero is overkill. */
    body.home-page main.gift-page .hero {
      min-height: 0;
      padding: clamp(28px, 4vw, 48px);
      background:
        linear-gradient(95deg,
          rgba(8, 11, 17, 0.94) 0%,
          rgba(8, 11, 17, 0.82) 32%,
          rgba(8, 11, 17, 0.48) 56%,
          rgba(8, 11, 17, 0.20) 78%,
          rgba(8, 11, 17, 0.08) 100%),
        url("/assets/gifts/walking-tour-hero-stops.png") center right / cover no-repeat;
    }
    body.home-page main.gift-page .hero-grid {
      min-height: 0;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    /* Container — mirrors body.home-page .selected-games panel. */
    body.home-page .gift-grid-wrap {
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.01)),
        rgba(11, 16, 24, 0.86);
      box-shadow: var(--shadow-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    body.home-page .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Cards: match game-card dark-surface + size treatment ──────── */
    body.home-page .card,
    body.home-page .empty {
      position: relative;
      display: grid;
      grid-template-rows: 154px minmax(0, 1fr);
      /* taller body so a 3-line description + "More" + CTA all fit */
      min-width: 0;
      height: 416px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card-paper);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-chip);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    body.home-page .card:hover,
    body.home-page .card:focus-visible {
      border-color: rgba(245, 180, 97, 0.34);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
      transform: translateY(-3px);
      outline: none;
    }

    body.home-page .card[data-game-color] {
      --card-secondary: var(--card-game-color, var(--accent));
    }

    body.home-page .card-media {
      position: relative;
      height: 154px;
      min-height: 154px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media::before { content: none; }
    body.home-page .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    body.home-page .card-monogram {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    body.home-page .card-media[data-has-image="true"] .card-monogram {
      display: none;
    }

    body.home-page .card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px 16px;
      min-height: 0;
      overflow: hidden;
    }

    body.home-page .card-game-eyebrow,
    body.home-page .card-price,
    body.home-page .card-cta {
      color: rgba(243, 238, 220, 0.62);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    body.home-page .card-game-eyebrow { display: none; }
    body.home-page .card-price { color: var(--ink); }
    /* Prices are not shown anywhere in the public gift shop. */
    body.home-page .card-price,
    .gift-detail-price { display: none !important; }

    /* Admin-only logout pill (upper-right). Mirrors admin-bridge's EDIT ITEM
       button; hidden unless admin-bridge has verified a logged-in admin
       (it adds html.tgb-admin-authorized). */
    .gift-admin-logout {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1300;
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
    }
    html.tgb-admin-authorized .gift-admin-logout { display: inline-flex; }
    .gift-admin-logout:hover,
    .gift-admin-logout:focus-visible {
      background: #fff;
      color: #111;
      outline: none;
      transform: translateY(-1px);
    }

    body.home-page .card-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    body.home-page .card-caption {
      min-height: 0;
      color: rgba(243, 238, 220, 0.72);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* "More" link on cards whose description is truncated — opens the detail
       lightbox. Sits between the caption and the CTA. */
    body.home-page .card-more {
      align-self: flex-start;
      margin-top: 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: underline;
      cursor: pointer;
    }
    body.home-page .card-more:hover,
    body.home-page .card-more:focus-visible { color: #fff; outline: none; }

    /* ── Gift detail lightbox ─────────────────────────────────────────── */
    .gift-detail {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gift-detail[hidden] { display: none; }
    .gift-detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .gift-detail-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(16, 21, 30, 0.97);
      color: var(--ink);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .gift-detail-close {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: rgba(8, 12, 18, 0.6);
      color: var(--ink);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .gift-detail-close:hover { background: rgba(8, 12, 18, 0.85); color: var(--accent); }
    .gift-detail-media {
      position: relative;
      height: 220px;
      flex-shrink: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    .gift-detail-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gift-detail-monogram {
      position: absolute;
      left: 16px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .gift-detail-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .gift-detail-title {
      margin: 0;
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .gift-detail-price {
      color: var(--ink);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    .gift-detail-desc {
      margin: 0;
      color: rgba(243, 238, 220, 0.82);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.86rem;
      font-weight: 400;
      line-height: 1.55;
      white-space: pre-line;
    }
    .gift-detail-cta-wrap { margin-top: 6px; }
    .gift-detail-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
    }
    .gift-detail-cta:hover { transform: translateY(-1px); }

    /* CTA styled as a full-width button matching .game-card-play —
       accent fill, 6px radius, inset highlight, hover lift + colored
       drop-shadow. The arrow keeps the affiliate "go-elsewhere" hint. */
    body.home-page .card-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: auto 0 0;
      padding: 0 14px;
      min-height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    body.home-page .card-cta::after { content: " \2192"; font-size: 1rem; line-height: 1; }
    body.home-page .card:hover .card-cta,
    body.home-page .card:focus-visible .card-cta {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32) inset,
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: translateY(-1px);
    }

    body.home-page .empty {
      grid-template-rows: auto;
      grid-column: 1 / -1;
      min-height: 180px;
      place-items: center;
      padding: 28px;
      color: rgba(243, 238, 220, 0.62);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    body.home-page .footer-note {
      max-width: 56rem;
      margin: 24px 0 0;
      color: rgba(243, 238, 220, 0.55);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      line-height: 1.6;
      text-transform: none;
    }

    /* ── Buy button — matches .game-card-play accent treatment ───── */
    body.home-page .card-buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    body.home-page .card-buy:hover,
    body.home-page .card-buy:focus-visible {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32) inset,
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: translateY(-1px);
      outline: none;
    }
    body.home-page .card-buy[disabled] { opacity: 0.6; cursor: progress; }

    /* ── Cart FAB ────────────────────────────────────────────────── */
    .cart-fab {
      position: fixed;
      right: 22px; bottom: 22px;
      z-index: 1200;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(16, 21, 30, 0.92);
      color: var(--ink);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .cart-fab[hidden] { display: none; }
    .cart-fab:hover { border-color: var(--accent); color: var(--accent); }
    .cart-fab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-size: 0.82rem;
      font-weight: 800;
    }

    /* ── Cart modal ──────────────────────────────────────────────── */
    .cart-modal {
      position: fixed;
      inset: 0;
      z-index: 1400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .cart-modal[hidden] { display: none; }
    .cart-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .cart-panel {
      position: relative;
      width: min(720px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      background: rgba(16, 21, 30, 0.96);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .cart-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
    }
    .cart-panel-head h2 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .cart-close {
      background: transparent;
      border: 0;
      font-size: 1.5rem;
      line-height: 1;
      color: rgba(243, 238, 220, 0.62);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .cart-close:hover { background: rgba(255, 255, 255, 0.08); color: var(--ink); }
    .cart-body {
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
    }
    .cart-line {
      display: grid;
      grid-template-columns: 60px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line);
    }
    .cart-line:last-child { border-bottom: 0; }
    .cart-line img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
    }
    .cart-line-title { font-weight: 700; font-size: 0.88rem; color: var(--ink); }
    .cart-line-sub { font-size: 0.74rem; color: rgba(243, 238, 220, 0.62); margin-top: 2px; }
    .cart-line-qty { display: inline-flex; align-items: center; gap: 6px; }
    .cart-line-qty button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    .cart-line-qty button:hover { background: var(--accent); color: #080c12; border-color: var(--accent); }
    .cart-line-price { font-weight: 800; min-width: 80px; text-align: right; color: var(--ink); }
    .cart-line-remove {
      background: transparent;
      border: 0;
      color: rgba(243, 238, 220, 0.55);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
    }
    .cart-line-remove:hover { color: var(--accent); }
    .cart-empty {
      padding: 32px;
      text-align: center;
      color: rgba(243, 238, 220, 0.62);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-style: normal;
      letter-spacing: 0.04em;
    }
    .cart-foot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
    }
    .cart-total {
      flex: 1;
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--ink);
      letter-spacing: 0;
    }
    .cart-checkout {
      padding: 12px 22px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    .cart-checkout:hover:not([disabled]) {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32) inset,
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: translateY(-1px);
    }
    .cart-checkout[disabled] { opacity: 0.55; cursor: not-allowed; }
    .cart-status {
      width: 100%;
      margin: 0;
      font-size: 0.78rem;
      color: rgba(243, 238, 220, 0.62);
      min-height: 1.2em;
    }
    .cart-status.error { color: #ff7560; font-weight: 700; }
    .cart-status.success { color: #66d088; font-weight: 700; }

    .checkout-pane[hidden] { display: none; }
    #stripeCheckoutMount { min-height: 320px; background: #fff; }

    .checkout-success { padding: 32px 24px; text-align: center; color: var(--ink); }
    .checkout-success h3 {
      margin: 0 0 8px;
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .checkout-success p { margin: 0 0 18px; color: rgba(243, 238, 220, 0.72); }
  </style>

</head>
<body class="home-page" data-admin-page="gift-shop">
  <div class="page-shell">
  <!-- Site navigation (shared via /assets/site-nav.js) -->
  <header class="site-nav" data-site-nav></header>
  <script src="../assets/site-nav.js"></script>

    <main class="gift-page">
      <section class="hero" aria-label="Gift shop overview">
        <div class="hero-grid">
          <div>
            <p class="hero-kicker"><span id="itemCount">0</span> ITEMS<span id="eyebrowSuffix" hidden> / <span id="eyebrow"></span></span></p>
            <h1 class="hero-headline" id="heading">Gift Shop</h1>
            <p class="hero-copy" id="lead">Game Souvenirs</p>
          </div>
        </div>
      </section>

      <section class="gift-grid-wrap" aria-label="Gift shop items">
        <div class="grid" id="grid"></div>
      </section>

      <p class="footer-note">As an Amazon Associate and a Bookshop.org affiliate, The Game Bureau may earn from qualifying purchases.</p>
    </main>
  </div>

  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const params = new URLSearchParams(location.search);
    const requestedCity = String(params.get('city') || '').trim();
    // Optional game filter. Canonical is ?id=<game-id> (matches the engine
    // URLs); ?game= is also accepted and may be an id or a game name. The raw
    // value is resolved to a real game once the games list loads (loadAllShops).
    const requestedGameParam = String(params.get('id') || params.get('game') || '').trim();

    const statusEl = document.getElementById('status') || { textContent: '', hidden: true };
    const gridEl = document.getElementById('grid');
    const headingEl = document.getElementById('heading');
    const eyebrowEl = document.getElementById('eyebrow');
    const eyebrowSuffixEl = document.getElementById('eyebrowSuffix');
    const leadEl = document.getElementById('lead');
    const itemCountEl = document.getElementById('itemCount');
    const shopCountEl = document.getElementById('shopCount') || { textContent: '' };

    function setStatus(msg) {
      const text = msg || '';
      statusEl.textContent = text;
      statusEl.hidden = !text;
    }

    function setEyebrow(text) {
      const trimmed = String(text || '').trim();
      eyebrowEl.textContent = trimmed;
      eyebrowSuffixEl.hidden = !trimmed;
      if (trimmed) eyebrowSuffixEl.textContent = ' / ' + trimmed;
    }

    function escapeText(value) {
      return String(value == null ? '' : value);
    }

    // Defensive filter: legacy gift_shop_items rows may have the scraper's
    // admin breadcrumb ("Surfaced from the Amazon search: …") stored in the
    // description column. Hide that from public visitors until an admin (or
    // the AI rewrite pass in gs_stock.py) backfills a real blurb.
    function cleanDescription(raw) {
      const t = String(raw == null ? '' : raw).trim();
      if (!t) return '';
      if (/^Surfaced from the Amazon search:/i.test(t)) return '';
      return t;
    }

    function isFandomGame(game) {
      const value = game && game.fandom_game;
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toLowerCase();
      return normalized === 'yes' || normalized === 'true' || normalized === '1';
    }

    // Match Mission Control's city derivation: fandom gifts belong to the
    // visiting fanbase's city; every other gift belongs to the game's city.
    function gameCity(game) {
      if (!game) return '';
      return String((isFandomGame(game) ? game.away_team_city : game.city) || '').trim();
    }

    function cityMatchesGame(game) {
      // A game filter (?id=/?game=) overrides the city filter entirely.
      if (requestedGameId) return true;
      if (!requestedCity) return true;
      return gameCity(game).localeCompare(requestedCity, undefined, { sensitivity: 'base' }) === 0;
    }

    // Resolved id of the ?id=/?game= filter (empty = show every game's gifts).
    // Set in loadAllShops once the games list is available.
    let requestedGameId = '';
    function listingMatchesGameFilter(listing) {
      if (!requestedGameId) return true;
      return String((listing && listing.game_id) || '') === requestedGameId;
    }
    function gameMatchesGameFilter(game) {
      if (!requestedGameId) return true;
      return !!game && String(game.id) === requestedGameId;
    }

    // Only certified gifts are shown publicly. An item is certified once an
    // admin stamps certified_at (Certify Today in /mc/gs-shop.html).
    function isCertified(item) {
      return !!String(item && item.certified_at || '').trim();
    }

    // Grid ordering: plain alphabetical by item title.
    function compareGiftEntries(a, b) {
      return String(a.item.title || '').localeCompare(
        String(b.item.title || ''), undefined, { sensitivity: 'base', numeric: true });
    }

    function getMonogram(title) {
      const t = String(title || 'Item').trim();
      const words = t.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'GS';
    }

    function renderEmpty(message) {
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gridEl.appendChild(empty);
    }

    function buildSupabaseUrl(table, query = {}) {
      const url = new URL('rest/v1/' + table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      Object.entries(query).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        throw new Error('Network request to Supabase failed.');
      }
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error('Supabase ' + res.status + ': ' + text.slice(0, 200));
      }
      return res.json();
    }

    async function fetchAllListings() {
      return fetchJson(buildSupabaseUrl('gift_shop_listings', {
        select: '*,gift_shop_items(*),games(id,name,primary_color,city,away_team_city,fandom_game)',
        archived: 'eq.false',
        order: 'created_at.desc'
      }));
    }

    // Every gift_shop_items row, so the shop can show items even when they have
    // no game listing. Archived / access-code rows are filtered out by the caller.
    async function fetchAllShopItems() {
      return fetchJson(buildSupabaseUrl('gift_shop_items', {
        select: '*',
        order: 'created_at.desc'
      }));
    }

    // Pull every game so we can synthesize access-code purchase options
    // without needing pre-seeded gift_shop_items rows. The server-side
    // gs-create-checkout looks up the price authoritatively from
    // games.price — the only thing the client passes is game_id, so
    // there's no tampering surface.
    async function fetchAllGames() {
      return fetchJson(buildSupabaseUrl('games', {
        select: 'id,name,tagline,price,engine,archived,primary_color,city,away_team_city,fandom_game'
      }));
    }

    function isGamePaid(game) {
      if (!game) return false;
      const price = String(game.price == null ? '' : game.price).trim();
      if (!price || price.toUpperCase() === 'FREE') return false;
      const archived = String(game.archived == null ? '' : game.archived).trim().toUpperCase();
      if (archived === 'YES') return false;
      // Sanity-check that price parses to something positive — guards
      // against rows like "TBA" or "$" that would fail at checkout.
      const numeric = price.replace(/[^0-9.]/g, '');
      const dollars = parseFloat(numeric);
      return Number.isFinite(dollars) && dollars > 0;
    }

    function gameToGiftCardItem(game) {
      const tagline = String(game && game.tagline || '').trim();
      return {
        id:                'auto-gift:' + game.id,    // synthetic; never persisted
        title:             (game.name || 'Untitled') + ' — Game Access',
        price_display:     game.price,
        description:       tagline || 'Send "' + (game.name || 'this game') + '" as a gift. Your recipient gets an access code that unlocks the game on any device.',
        gift_card_game_id: game.id,
        engine:            game.engine || ''
      };
    }

    // Build the "pick any game" card. Click → opens TgbGift modal at
    // the chooser step, where the buyer picks a game from the list
    // of paid games and continues into the same Stripe flow.
    function createChooseAnyGameCard(paidGames) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card card--gift-card card--gift-card-choose';
      card.style.font = 'inherit';
      card.style.textAlign = 'left';
      card.style.cursor = 'pointer';
      card.dataset.giftCardChoose = 'true';

      const media = document.createElement('div');
      media.className = 'card-media';
      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = '★';
      media.appendChild(monogram);
      const heroImg = document.createElement('img');
      heroImg.className = 'card-image';
      heroImg.src = '/assets/gifts/walking-tour-hero-stops.png';
      heroImg.alt = '';
      heroImg.loading = 'lazy';
      heroImg.decoding = 'async';
      heroImg.addEventListener('error', () => {
        heroImg.remove();
        media.dataset.hasImage = 'false';
      });
      media.appendChild(heroImg);
      media.dataset.hasImage = 'true';

      const body = document.createElement('div');
      body.className = 'card-body';

      const eyebrow = document.createElement('p');
      eyebrow.className = 'card-game-eyebrow';
      eyebrow.textContent = 'Gift Shop · Featured';
      body.appendChild(eyebrow);

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = 'Game Access — Your Pick';
      body.appendChild(title);

      const count = (paidGames && paidGames.length) || 0;
      const desc = document.createElement('p');
      desc.className = 'card-caption';
      desc.textContent = count
        ? 'Pick any of our ' + count + ' games at checkout. Recipient gets an access code that unlocks it on any device.'
        : 'Pick any game at checkout. Recipient gets an access code that unlocks it on any device.';
      body.appendChild(desc);

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      body.appendChild(cta);

      card.append(media, body);

      card.addEventListener('click', () => {
        if (!window.TgbGift) return;
        window.TgbGift.openForChoice({ games: paidGames || [] });
      });

      return card;
    }

    // Show a "More" affordance once the description is long enough to clamp.
    function shouldShowMore(desc) {
      return String(desc || '').length > 120;
    }

    // A "More" link that opens the detail lightbox. Built as a role=button span
    // so it can live inside the card's <a>/<button> without nesting a control;
    // preventDefault + stopPropagation keep the card's own click from firing.
    function buildMoreLink(item, opts) {
      const more = document.createElement('span');
      more.className = 'card-more';
      more.textContent = 'More';
      more.setAttribute('role', 'button');
      more.tabIndex = 0;
      const open = (e) => { e.preventDefault(); e.stopPropagation(); openGiftDetail(item, opts); };
      more.addEventListener('click', open);
      more.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
      return more;
    }

    function closeGiftDetail() {
      const el = document.getElementById('giftDetail');
      if (el) el.hidden = true;
    }

    // Populate + open the full-gift lightbox (scrolls if the description is long).
    function openGiftDetail(item, opts = {}) {
      const el = document.getElementById('giftDetail');
      if (!el || !item) return;
      const media   = document.getElementById('giftDetailMedia');
      const titleEl = document.getElementById('giftDetailTitle');
      const priceEl = document.getElementById('giftDetailPrice');
      const descEl  = document.getElementById('giftDetailDesc');
      const ctaWrap = document.getElementById('giftDetailCtaWrap');

      media.innerHTML = '';
      media.style.removeProperty('--card-game-color');
      if (opts.gameColor) media.style.setProperty('--card-game-color', opts.gameColor);
      const imageUrl = String(item.image_url || '').trim();
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        const focus = String(item.image_focus || '').trim();
        if (focus) img.style.objectPosition = focus;
        media.appendChild(img);
      } else {
        const mono = document.createElement('div');
        mono.className = 'gift-detail-monogram';
        mono.textContent = getMonogram(item.title);
        media.appendChild(mono);
      }

      titleEl.textContent = escapeText(item.title || 'Untitled item');
      const price = String(item.price_display || '').trim();
      priceEl.textContent = price;
      priceEl.hidden = !price;
      descEl.textContent = cleanDescription(item.description) || 'No description available.';

      ctaWrap.innerHTML = '';
      if (item.gift_card_game_id) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gift-detail-cta';
        btn.textContent = 'Buy now';
        btn.addEventListener('click', () => {
          closeGiftDetail();
          if (!window.TgbGift) return;
          window.TgbGift.openForGame({
            id:     item.gift_card_game_id,
            name:   String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                      || (opts.gameName || 'this game'),
            price:  item.price_display || '',
            engine: item.engine || opts.engine || ''
          });
        });
        ctaWrap.appendChild(btn);
      } else {
        const url = String(item.url || '').trim();
        if (url) {
          const a = document.createElement('a');
          a.className = 'gift-detail-cta';
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener nofollow sponsored';
          a.textContent = affiliateCtaLabel(url, item.price_display);
          ctaWrap.appendChild(a);
        }
      }

      el.hidden = false;
      const body = el.querySelector('.gift-detail-body');
      if (body) body.scrollTop = 0;
    }

    // Close on backdrop / × / Escape (delegated so it works no matter when the
    // lightbox node is parsed relative to this script).
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-gift-detail-close]')) closeGiftDetail();
    });
    document.addEventListener('keydown', (e) => {
      const el = document.getElementById('giftDetail');
      if (e.key === 'Escape' && el && !el.hidden) closeGiftDetail();
    });

    function createCard(item, opts = {}) {
      // Access-code items are TGB's own products (not affiliate). They have
      // no external url; clicking the card opens the shared gift-buy
      // modal via /mc/js/gs-buy-modal.js.
      if (item && item.gift_card_game_id) {
        return createGiftCardCard(item, opts);
      }

      const url = String(item.url || '').trim();
      if (!url) return null;

      const card = document.createElement('a');
      card.className = 'card';
      card.href = url;
      card.target = '_blank';
      card.rel = 'noopener nofollow sponsored';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        const focus = String(item.image_focus || '').trim();
        if (focus) img.style.objectPosition = focus;
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' · ');
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = escapeText(item.title || 'Untitled item');
      body.appendChild(title);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
        if (shouldShowMore(desc)) body.appendChild(buildMoreLink(item, opts));
      }

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = affiliateCtaLabel(url, item.price_display);
      body.appendChild(cta);

      card.append(media, body);
      return card;
    }

    // Every gift button reads "Buy now" (CSS uppercases it to BUY NOW).
    function affiliateCtaLabel() {
      return 'Buy now';
    }

    // Build an access-code card. Clicking it opens the shared gift-buy
    // modal (mc/js/gs-buy-modal.js). No external link — TGB is the
    // seller for these items.
    function createGiftCardCard(item, opts = {}) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card card--gift-card';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';
      // Strip native button styles so the card layout (which inherits
      // anchor-like styling) renders consistently.
      card.style.font = 'inherit';
      card.style.textAlign = 'left';
      card.style.cursor = 'pointer';

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        const focus = String(item.image_focus || '').trim();
        if (focus) img.style.objectPosition = focus;
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = escapeText(item.title || 'Game access');
      body.appendChild(title);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
        if (shouldShowMore(desc)) body.appendChild(buildMoreLink(item, opts));
      }

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      body.appendChild(cta);

      card.append(media, body);

      card.addEventListener('click', (event) => {
        // Don't fire if the user clicked the admin-edit affordance
        // (admin-bridge.js owns that click path).
        if (event.target.closest('[data-admin-action]')) return;
        if (!window.TgbGift) return;
        window.TgbGift.openForGame({
          id:    item.gift_card_game_id,
          name:  String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                  || (opts.gameName || 'this game'),
          price: item.price_display || '',
          engine: item.engine || opts.engine || ''
        });
      });

      return card;
    }

    async function loadAllShops() {
      headingEl.textContent = 'Gift Shop';
      setEyebrow('');
      leadEl.textContent = requestedCity ? 'Gifts from ' + requestedCity + '.' : 'Game Souvenirs';
      leadEl.hidden = false;
      document.title = (requestedCity ? requestedCity.toUpperCase() + ' ' : '') + 'GIFT SHOP | THE GAME BUREAU';

      setStatus('Loading');
      renderEmpty('Loading inventory...');

      try {
        const [listings, allGames] = await Promise.all([
          fetchAllListings().catch(() => []),
          fetchAllGames().catch(() => [])
        ]);
        const safeListings = Array.isArray(listings) ? listings : [];
        const safeGames    = Array.isArray(allGames) ? allGames : [];
        const gameById = new Map(safeGames.map((g) => [g.id, g]));

        // Resolve the optional ?id=/?game= filter to a real game — match by id
        // first, then by name (case-insensitive) — and scope the shop to it.
        const requestedGame = requestedGameParam
          ? (safeGames.find((g) => String(g.id) === requestedGameParam)
             || safeGames.find((g) => String(g.name || '').trim().toLowerCase() === requestedGameParam.toLowerCase())
             || null)
          : null;
        requestedGameId = requestedGame ? String(requestedGame.id) : '';
        if (requestedGame) {
          setEyebrow(requestedGame.name || '');
          leadEl.textContent = 'Gifts inspired by ';
          const leadGameEm = document.createElement('em');
          const leadGameStrong = document.createElement('strong');
          leadGameStrong.textContent = requestedGame.name || 'this game';
          leadGameEm.appendChild(leadGameStrong);
          leadEl.appendChild(leadGameEm);
          leadEl.appendChild(document.createTextNode('.'));
          document.title = String(requestedGame.name || '').toUpperCase() + ' GIFTS | THE GAME BUREAU';
        }

        const matchingListings = safeListings.filter((listing) => {
          const game = listing.games || gameById.get(listing.game_id);
          return cityMatchesGame(game) && listingMatchesGameFilter(listing);
        });

        // Curated gift_shop_items rows take precedence; record their
        // gift_card_game_id so we don't double-render the same game.
        const curatedGiftCardGameIds = new Set();
        for (const listing of matchingListings) {
          const item = listing && listing.gift_shop_items;
          if (item && item.gift_card_game_id) {
            curatedGiftCardGameIds.add(item.gift_card_game_id);
          }
        }

        // Index games by id so we can pick up name + primary_color when
        // synthesizing dynamic access-code purchase options.
        // List of currently-giftable games for the "Your Pick" chooser.
        const paidGames = safeGames
          .filter(isGamePaid)
          .filter(cityMatchesGame)
          .filter(gameMatchesGameFilter)
          .map((g) => ({ id: g.id, name: g.name, price: g.price, engine: g.engine || '' }))
          .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));

        // ── Choose-any-game card ("Game Access — Your Pick").
        // Hidden for now — we'll revisit the access-code chooser later. The
        // createChooseAnyGameCard builder + paidGames stay in place so it can
        // be re-enabled by restoring this to use createChooseAnyGameCard.
        const chooseCard = null;

        // ── Affiliate-only curated cards (Amazon, Bookshop, etc.).
        // We deliberately skip listings whose item is an access-code product
        // (gift_card_game_id is set) so the shop no longer shows
        // individual-game access-code cards.
        const grouped = new Map();
        for (const listing of matchingListings) {
          const item = listing && listing.gift_shop_items;
          if (!item || item.id == null) continue;
          if (item.gift_card_game_id) continue; // hidden — chooser owns this
          if (!isCertified(item)) continue;     // only show certified gifts
          const game = listing.games || gameById.get(listing.game_id) || {};
          const gameName = String(game.name || '').trim();
          const gameColor = String(game.primary_color || '').trim();
          let entry = grouped.get(item.id);
          if (!entry) {
            entry = { item, names: [], firstColor: gameColor || null };
            grouped.set(item.id, entry);
          }
          if (gameName && !entry.names.includes(gameName)) {
            entry.names.push(gameName);
          }
          if (!entry.firstColor && gameColor) entry.firstColor = gameColor;
        }

        // Collect every gift item (curated listings + standalone) as
        // {item, opts} so we can sort across both groups before rendering.
        const giftEntries = [];
        for (const { item, names, firstColor } of grouped.values()) {
          giftEntries.push({ item, opts: { gameNames: names, gameColor: firstColor || null } });
        }

        // Every other item that isn't already shown via a listing — so the shop
        // shows everything, with or without a game attached.
        const allItems = await fetchAllShopItems().catch(() => []);
        ((requestedCity || requestedGameId) ? [] : (Array.isArray(allItems) ? allItems : []))
          .filter((item) => item && item.id != null)
          .filter((item) => !grouped.has(item.id))   // not already shown via a listing
          .filter((item) => !item.gift_card_game_id)  // access-code products are owned by the chooser
          .filter((item) => item.archived !== true && String(item.archived).toUpperCase() !== 'YES')
          .filter(isCertified)                        // only show certified gifts
          .forEach((item) => giftEntries.push({ item, opts: {} }));

        // Alphabetical by item title.
        giftEntries.sort(compareGiftEntries);
        const itemCards = giftEntries
          .map(({ item, opts }) => createCard(item, opts))
          .filter(Boolean);

        // Chooser first, then the sorted gift items.
        const cards = []
          .concat(chooseCard ? [chooseCard] : [])
          .concat(itemCards);

        gridEl.innerHTML = '';
        if (!cards.length) {
          renderEmpty(requestedGame
            ? 'No gifts for ' + (requestedGame.name || 'this game') + ' yet.'
            : (requestedCity ? 'No gifts match ' + requestedCity + '.' : 'No items in the gift shop yet.'));
          itemCountEl.textContent = '0';
          shopCountEl.textContent = '0';
          setStatus('');
          return;
        }
        cards.forEach((card) => gridEl.appendChild(card));
        itemCountEl.textContent = String(cards.length);
        // Affiliate items are tied to games via listings; the chooser
        // itself represents the full paid-games catalog independently.
        const allGameIds = new Set(matchingListings.map((l) => l.game_id).filter(Boolean));
        shopCountEl.textContent = String(allGameIds.size);
        setStatus(cards.length + ' item' + (cards.length === 1 ? '' : 's') + ' across ' +
          allGameIds.size + ' game(s)');
      } catch (error) {
        console.error('[giftshop] all-shops load failed', error);
        renderEmpty('Could not load gift shop.');
        itemCountEl.textContent = '0';
        shopCountEl.textContent = '0';
        setStatus(error instanceof Error ? error.message : String(error));
      }
    }

    loadAllShops();

    // Admin-only logout (the #giftAdminLogout pill is shown by CSS only when
    // admin-bridge has verified a logged-in admin). Clears the shared session,
    // best-effort revokes it server-side, and tells admin-bridge to tear down
    // its EDIT controls — which also hides this button again.
    async function giftShopAdminLogout() {
      const KEY = 'tgb-photo-review-auth-session';
      let token = '';
      try {
        const session = JSON.parse(localStorage.getItem(KEY) || 'null');
        token = (session && session.access_token) || '';
      } catch (_) {}
      if (token) {
        try {
          await fetch(SB_CONFIG.url.replace(/\/+$/, '') + '/auth/v1/logout', {
            method: 'POST',
            headers: { apikey: SB_CONFIG.key, Authorization: 'Bearer ' + token }
          });
        } catch (_) {}
      }
      try { localStorage.removeItem(KEY); } catch (_) {}
      window.dispatchEvent(new CustomEvent('tgb-admin-auth-change', { detail: { signedIn: false } }));
      if (window.TgbPublicAdminBridge) window.TgbPublicAdminBridge.setAuthorized(false);
    }
    document.addEventListener('click', (e) => {
      if (e.target.closest('#giftAdminLogout')) { e.preventDefault(); giftShopAdminLogout(); }
    });
  </script>

  <!-- Gift detail lightbox (populated by openGiftDetail) -->
  <div class="gift-detail" id="giftDetail" hidden role="dialog" aria-modal="true" aria-labelledby="giftDetailTitle">
    <div class="gift-detail-backdrop" data-gift-detail-close></div>
    <div class="gift-detail-panel">
      <button class="gift-detail-close" type="button" data-gift-detail-close aria-label="Close">&times;</button>
      <div class="gift-detail-media" id="giftDetailMedia"></div>
      <div class="gift-detail-body">
        <h2 class="gift-detail-title" id="giftDetailTitle"></h2>
        <div class="gift-detail-price" id="giftDetailPrice" hidden></div>
        <p class="gift-detail-desc" id="giftDetailDesc"></p>
        <div class="gift-detail-cta-wrap" id="giftDetailCtaWrap"></div>
      </div>
    </div>
  </div>

  <!-- Admin-only: shown only when admin-bridge verifies a logged-in admin. -->
  <button class="gift-admin-logout" id="giftAdminLogout" type="button">Log out</button>

  <button class="cart-fab" id="cartFab" type="button" hidden aria-label="Open cart">
    Cart <span class="cart-fab-count" id="cartFabCount">0</span>
  </button>

  <div class="cart-modal" id="cartModal" hidden role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="cart-backdrop" id="cartBackdrop"></div>
    <section class="cart-panel">
      <header class="cart-panel-head">
        <h2 id="cartTitle">Your cart</h2>
        <button class="cart-close" type="button" id="cartCloseBtn" aria-label="Close">&times;</button>
      </header>
      <div class="cart-body" id="cartBody"></div>
      <div class="checkout-pane" id="checkoutPane" hidden>
        <div id="stripeCheckoutMount"></div>
      </div>
      <div class="checkout-pane" id="checkoutSuccess" hidden>
        <div class="checkout-success">
          <h3>Order received</h3>
          <p>Thanks. We emailed a receipt and your Printful order is on its way.</p>
          <button class="cart-checkout" type="button" id="checkoutSuccessClose">Keep browsing</button>
        </div>
      </div>
      <div class="cart-foot" id="cartFoot">
        <p class="cart-status" id="cartStatus" aria-live="polite"></p>
        <span class="cart-total" id="cartTotal">$0.00</span>
        <button class="cart-checkout" type="button" id="cartCheckoutBtn" disabled>Checkout</button>
      </div>
    </section>
  </div>

  <script src="https://js.stripe.com/v3"></script>
  <script>
    // ── Storefront cart + Stripe Embedded Checkout ───────────────────
    //
    // STRIPE_PUBLISHABLE_KEY must be the matching pk_test_… / pk_live_… for
    // the STRIPE_SECRET_KEY set on the create-stripe-session Edge Function.
    // Leave it empty to disable the cart entirely (affiliate-only mode).
    //
    // PAUSED 2026-05-26: POD / Printful integration is parked. All gift_shop
    // items render as affiliate links regardless of price_cents /
    // printful_variant_id. Restore by pasting the publishable key back in.
    // The pk_test_… key previously here:
    //   pk_test_51MF10bBFJf3v75ByzCOFJB7TL7MxnJ8I2ATlm3zszzjek7ki62BrhJ5TI0ZzTLBMk8ixoNUdsoG9pOjM8S1zR8wv00zYSpHYvw
    const STRIPE_PUBLISHABLE_KEY = '';
    const EDGE_BASE = SB_CONFIG.url.replace('.supabase.co', '.functions.supabase.co');
    const CREATE_SESSION_URL = EDGE_BASE + '/create-stripe-session';

    const CART_STORAGE_KEY = 'tgb-gift-cart-v1';
    const cartFab          = document.getElementById('cartFab');
    const cartFabCount     = document.getElementById('cartFabCount');
    const cartModal        = document.getElementById('cartModal');
    const cartBackdrop     = document.getElementById('cartBackdrop');
    const cartCloseBtn     = document.getElementById('cartCloseBtn');
    const cartBody         = document.getElementById('cartBody');
    const cartFoot         = document.getElementById('cartFoot');
    const cartTotalEl      = document.getElementById('cartTotal');
    const cartCheckoutBtn  = document.getElementById('cartCheckoutBtn');
    const cartStatus       = document.getElementById('cartStatus');
    const checkoutPane     = document.getElementById('checkoutPane');
    const checkoutSuccess  = document.getElementById('checkoutSuccess');
    const stripeMount      = document.getElementById('stripeCheckoutMount');

    let cart            = readCart();
    let itemsCache      = new Map();   // item_id → {title, image_url, price_cents, currency, printful_variant_id}
    let stripe          = null;
    let checkoutHandle  = null;        // Stripe Embedded Checkout handle (mount/unmount)
    let checkoutLoading = false;

    function readCart() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr.filter((l) => l && l.item_id && Number(l.qty) > 0) : [];
      } catch { return []; }
    }
    function writeCart() {
      try { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart)); }
      catch { /* private mode */ }
    }
    function clearCart() {
      cart = [];
      writeCart();
      renderCart();
    }
    function cartIsEmpty() {
      return !cart.length;
    }

    function rememberItem(item) {
      if (!item || !item.id) return;
      itemsCache.set(item.id, {
        title: item.title || 'Untitled item',
        image_url: item.image_url || '',
        price_cents: Number(item.price_cents) || 0,
        currency: (item.currency || 'usd').toLowerCase(),
        printful_variant_id: item.printful_variant_id || ''
      });
    }

    function isBuyable(item) {
      return !!(STRIPE_PUBLISHABLE_KEY && Number(item?.price_cents) > 0 && item?.printful_variant_id);
    }

    function formatPriceCents(cents, currency) {
      if (!Number.isFinite(cents)) return '';
      const c = (currency || 'usd').toUpperCase();
      try {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: c }).format(cents / 100);
      } catch {
        return '$' + (cents / 100).toFixed(2);
      }
    }

    function addToCart(itemId) {
      const existing = cart.find((l) => l.item_id === itemId);
      if (existing) existing.qty = Math.min(20, existing.qty + 1);
      else cart.push({ item_id: itemId, qty: 1 });
      writeCart();
      renderCart();
      openCart();
    }
    function setLineQty(itemId, qty) {
      const next = Math.max(0, Math.min(20, Math.floor(qty)));
      cart = cart.map((l) => l.item_id === itemId ? { ...l, qty: next } : l).filter((l) => l.qty > 0);
      writeCart();
      renderCart();
    }
    function removeLine(itemId) {
      cart = cart.filter((l) => l.item_id !== itemId);
      writeCart();
      renderCart();
    }

    function cartTotalCents() {
      let total = 0;
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (it) total += (it.price_cents || 0) * line.qty;
      }
      return total;
    }
    function cartCurrency() {
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (it && it.currency) return it.currency;
      }
      return 'usd';
    }

    function renderCart() {
      // FAB visibility + count
      const count = cart.reduce((acc, l) => acc + (Number(l.qty) || 0), 0);
      cartFabCount.textContent = String(count);
      cartFab.hidden = !STRIPE_PUBLISHABLE_KEY || count === 0;

      cartBody.innerHTML = '';
      if (!cart.length) {
        const empty = document.createElement('p');
        empty.className = 'cart-empty';
        empty.textContent = 'Your cart is empty.';
        cartBody.appendChild(empty);
        cartTotalEl.textContent = formatPriceCents(0, 'usd');
        cartCheckoutBtn.disabled = true;
        return;
      }
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (!it) continue;
        const row = document.createElement('div');
        row.className = 'cart-line';

        const img = document.createElement('img');
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        if (it.image_url) img.src = it.image_url;
        row.appendChild(img);

        const meta = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'cart-line-title';
        title.textContent = it.title;
        const sub = document.createElement('div');
        sub.className = 'cart-line-sub';
        sub.textContent = formatPriceCents(it.price_cents, it.currency) + ' each';
        meta.appendChild(title);
        meta.appendChild(sub);
        row.appendChild(meta);

        const qty = document.createElement('div');
        qty.className = 'cart-line-qty';
        const minus = document.createElement('button');
        minus.type = 'button'; minus.textContent = '−';
        minus.addEventListener('click', () => setLineQty(line.item_id, line.qty - 1));
        const num = document.createElement('span');
        num.textContent = String(line.qty);
        const plus = document.createElement('button');
        plus.type = 'button'; plus.textContent = '+';
        plus.addEventListener('click', () => setLineQty(line.item_id, line.qty + 1));
        qty.append(minus, num, plus);
        row.appendChild(qty);

        const price = document.createElement('div');
        price.className = 'cart-line-price';
        price.textContent = formatPriceCents(it.price_cents * line.qty, it.currency);
        row.appendChild(price);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'cart-line-remove';
        remove.setAttribute('aria-label', 'Remove');
        remove.textContent = '×';
        remove.addEventListener('click', () => removeLine(line.item_id));
        row.appendChild(remove);

        cartBody.appendChild(row);
      }
      cartTotalEl.textContent = formatPriceCents(cartTotalCents(), cartCurrency());
      cartCheckoutBtn.disabled = checkoutLoading || cart.length === 0;
    }

    function openCart() {
      if (!STRIPE_PUBLISHABLE_KEY) return; // cart disabled
      hideCheckoutPanes();
      cartBody.hidden = false;
      cartFoot.hidden = false;
      cartModal.hidden = false;
      setCartStatus('');
    }
    function closeCart() {
      // If a Stripe Checkout session is mounted, tear it down so a future
      // open() can mount a fresh one with the latest cart contents.
      if (checkoutHandle) {
        try { checkoutHandle.destroy(); } catch { /* noop */ }
        checkoutHandle = null;
      }
      cartModal.hidden = true;
    }
    function hideCheckoutPanes() {
      checkoutPane.hidden = true;
      checkoutSuccess.hidden = true;
    }
    function setCartStatus(message, state) {
      cartStatus.textContent = message || '';
      cartStatus.classList.toggle('error', state === 'error');
      cartStatus.classList.toggle('success', state === 'success');
    }

    cartFab.addEventListener('click', openCart);
    cartCloseBtn.addEventListener('click', closeCart);
    cartBackdrop.addEventListener('click', () => { if (!checkoutLoading) closeCart(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !cartModal.hidden && !checkoutLoading) closeCart();
    });

    cartCheckoutBtn.addEventListener('click', async () => {
      if (!cart.length || checkoutLoading) return;
      checkoutLoading = true;
      cartCheckoutBtn.disabled = true;
      setCartStatus('Starting secure checkout…');
      try {
        if (!stripe) {
          if (!window.Stripe) throw new Error('Stripe.js failed to load.');
          stripe = window.Stripe(STRIPE_PUBLISHABLE_KEY);
        }
        const resp = await fetch(CREATE_SESSION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart.map((l) => ({ item_id: l.item_id, qty: l.qty })) })
        });
        const raw = await resp.text();
        let payload = {};
        try { payload = raw ? JSON.parse(raw) : {}; } catch { /* ignore */ }
        if (!resp.ok) throw new Error(payload.error || ('HTTP ' + resp.status));

        cartBody.hidden = true;
        cartFoot.hidden = true;
        checkoutPane.hidden = false;

        checkoutHandle = await stripe.initEmbeddedCheckout({
          clientSecret: payload.client_secret,
        });
        checkoutHandle.mount(stripeMount);
        setCartStatus('');
      } catch (error) {
        console.error('[gift] checkout failed', error);
        setCartStatus(error instanceof Error ? error.message : String(error), 'error');
        cartBody.hidden = false;
        cartFoot.hidden = false;
        checkoutPane.hidden = true;
      } finally {
        checkoutLoading = false;
        cartCheckoutBtn.disabled = cart.length === 0;
      }
    });

    document.getElementById('checkoutSuccessClose').addEventListener('click', () => {
      closeCart();
      history.replaceState({}, '', location.pathname);
    });

    // If Stripe redirected us back with ?checkout=complete, render the
    // success pane right away and clear local cart state.
    (function handleCheckoutReturn() {
      const completed = params.get('checkout') === 'complete';
      if (!completed) return;
      clearCart();
      hideCheckoutPanes();
      cartBody.hidden = true;
      cartFoot.hidden = true;
      checkoutSuccess.hidden = false;
      cartModal.hidden = false;
    })();

    // Patch the existing createCard() so POD items render a Buy button.
    // We keep the affiliate code path unchanged for items without
    // price_cents / printful_variant_id.
    const __origCreateCard = createCard;
    createCard = function (item, opts = {}) {
      rememberItem(item);
      if (!isBuyable(item)) return __origCreateCard(item, opts);

      // Buyable card: render as a <div> (not an <a>) so the Buy button is
      // the only navigation target.
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';
      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';
      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        const focus = String(item.image_focus || '').trim();
        if (focus) img.style.objectPosition = focus;
        img.addEventListener('error', () => { img.remove(); media.dataset.hasImage = 'false'; });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = item.title || 'Untitled item';
      body.appendChild(title);

      const priceEl = document.createElement('div');
      priceEl.className = 'card-price';
      priceEl.textContent = formatPriceCents(item.price_cents, item.currency);
      body.appendChild(priceEl);

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
      }

      const buy = document.createElement('button');
      buy.type = 'button';
      buy.className = 'card-buy';
      buy.textContent = 'Buy now';
      buy.addEventListener('click', () => addToCart(item.id));
      body.appendChild(buy);

      card.append(media, body);
      return card;
    };

    // Initial paint so the FAB count matches any pre-existing cart from a
    // previous visit. Item titles/prices populate as cards render.
    renderCart();
  </script>
