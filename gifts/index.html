  <style>
    /* ── Gift shop overrides on top of site-shell.css home-page chrome.
       Body class `home-page` brings the dark night theme, nav, footer,
       Big Shoulders Display + IBM Plex Mono. These rules style the
       gift-specific surfaces (grid cards, detail lightbox) to match. ──── */

    /* One shared corner radius for every small interactive/tag/pill/badge
       control (chips, tags, CTAs, badges, search field, close button) so they
       read as one family. Containers (cards, panels, modals) keep their own,
       larger radii. Change this one value to reshape all controls at once. */
    body.home-page { --ctl-radius: 8px; }

    body.home-page .gift-page {
      display: grid;
      gap: 28px;
    }

    /* Container — mirrors body.home-page .selected-games panel. */
    body.home-page .gift-grid-wrap {
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.01)),
        rgba(11, 16, 24, 0.86);
      box-shadow: var(--shadow-panel);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    /* Filtered-view header inside the grid box — mirrors .gift-city-head. */
    body.home-page .gift-grid-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin: 0 0 20px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line);
    }
    body.home-page .gift-grid-title {
      /* Push the filter + count cluster to the right edge of the row. */
      margin: 0 auto 0 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }
    /* Source filter — slick toggle pills that read as "on" (filled, accent
       ring, check) or "off" (dim, no fill). Multi-select, all on by default.
       Lives inline in the grid-head row, between the title and count badge. */
    body.home-page .gift-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 0;
      padding: 0;
    }
    /* Author display:flex above would otherwise beat the UA [hidden] rule. */
    body.home-page .gift-filter[hidden] { display: none; }
    body.home-page .gift-filter-label {
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    body.home-page .gift-filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    body.home-page .gift-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--ctl-radius);
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease,
        box-shadow 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    body.home-page .gift-filter-chip:hover {
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip:focus-visible {
      outline: none;
      box-shadow: var(--shadow-chip), 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    /* The tick + accent fill only appear when the source is active. */
    body.home-page .gift-filter-chip .gift-filter-tick {
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      color: #0a0e15;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    body.home-page .gift-filter-chip .gift-filter-tick svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    body.home-page .gift-filter-chip .gift-filter-count {
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 16%, rgba(16, 21, 30, 0.78));
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-tick {
      background: var(--accent);
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-tick svg {
      opacity: 1;
      transform: scale(1);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-count {
      color: var(--accent);
    }
    body.home-page .gift-filter-chip[aria-pressed="false"] {
      opacity: 0.55;
    }
    body.home-page .gift-filter-chip[aria-pressed="false"]:hover {
      opacity: 0.85;
    }
    body.home-page .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Cards: match game-card dark-surface + size treatment ──────── */
    body.home-page .card,
    body.home-page .empty {
      position: relative;
      display: grid;
      grid-template-rows: 154px minmax(0, 1fr);
      /* taller body so a 3-line description + "More" + CTA all fit */
      min-width: 0;
      height: 416px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card-paper);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-chip);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    /* The source filter hides cards via the [hidden] attribute; the grid
       display above would otherwise win over the UA rule. */
    body.home-page .card[hidden] { display: none !important; }

    body.home-page .card:hover,
    body.home-page .card:focus-visible {
      border-color: rgba(245, 180, 97, 0.34);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
      transform: translateY(-3px);
      outline: none;
    }

    body.home-page .card[data-game-color] {
      --card-secondary: var(--card-game-color, var(--accent));
    }

    body.home-page .card-media {
      position: relative;
      height: 154px;
      min-height: 154px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media::before { content: none; }
    body.home-page .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 320ms ease;
    }
    /* Subtle zoom on the card image while the card is hovered/focused — the
       media's overflow:hidden keeps it inside the frame. */
    body.home-page .card:hover .card-image,
    body.home-page .card:focus-visible .card-image { transform: scale(1.045); }
    @media (prefers-reduced-motion: reduce) {
      body.home-page .card-image { transition: none; }
      body.home-page .card:hover .card-image,
      body.home-page .card:focus-visible .card-image { transform: none; }
    }
    body.home-page .card-monogram {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    body.home-page .card-media[data-has-image="true"] .card-monogram {
      display: none;
    }
    /* Contained products (book covers, portrait items) sit on a calm, softly
       game-tinted panel instead of a busy blown-up copy of their own art. */
    body.home-page .card-media[data-image-fit="contain"] {
      background:
        radial-gradient(130% 110% at 50% 0%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 62%),
        linear-gradient(180deg, rgba(10, 13, 19, 0.72), rgba(6, 9, 14, 0.94)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media[data-image-fit="contain"] .card-image {
      z-index: 1;
      box-sizing: border-box;
      padding: 14px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
    }

    /* Product images open the same detail lightbox as the "more" link. */
    body.home-page .card-media[data-opens-detail="true"] { cursor: pointer; }
    body.home-page .card-media[data-opens-detail="true"]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }

    /* Now that cards aren't anchors/buttons, the admin TEST/EDIT tools
       injected by admin-bridge.js need corner positioning. */
    html.tgb-admin-authorized body.home-page .card > .tgb-admin-edit-link,
    html.tgb-admin-authorized body.home-page .card > .tgb-admin-card-tools {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 5;
    }

    body.home-page .card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px 16px;
      min-height: 0;
      overflow: hidden;
    }

    body.home-page .card-game-eyebrow,
    body.home-page .card-price,
    body.home-page .card-cta {
      color: rgba(243, 238, 220, 0.62);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    body.home-page .card-game-eyebrow { display: none; }
    body.home-page .card-city-tags {
      /* FLEX, NOT BLOCK — this is what keeps the chip's bottom border. As a
         block, the inline-flex track sat on a text baseline: the strut set the
         line box height, the chip's padding-bottom and 1px border hang BELOW
         that baseline, and overflow-y:hidden (which the marquee needs) shaved
         them off. Every city chip on the shop was drawn with three sides.
         A flex container has no strut and no baseline alignment, so its height
         is simply the track's. */
      display: flex;
      align-items: flex-start;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      /* …and 1px of slack top and bottom. The chip is ~20.7px tall against a
         ~20px line box, so the two are within a rounding error of each other and
         which way it falls depends on the device pixel ratio — that is why the
         border was there on one screen and gone on the next. The overflow has to
         stay hidden (it is the marquee's clip), so the room comes from here. */
      padding: 1px 0;
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      line-height: 1.25;
      /* Single-row perpetual marquee. Overflow is clipped; the inner track
         translates continuously with cloned tags for a seamless loop. */
      overflow-x: hidden;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      touch-action: pan-x;
    }
    body.home-page .card-city-tags::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body.home-page .card-city-tags:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    body.home-page .card-city-track {
      display: inline-flex;
      flex-wrap: nowrap;
      gap: 6px;
      width: max-content;
      min-width: 100%;
      will-change: transform;
    }
    body.home-page .card-city-tags.is-looping .card-city-track {
      animation: card-city-loop var(--card-city-loop-duration, 24s) linear infinite;
    }
    @keyframes card-city-loop {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(calc(-1 * var(--card-city-loop-distance, 0px)), 0, 0); }
    }
    body.home-page .card-city-tag {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 3px 7px;
      border: 1px solid rgba(243, 238, 220, 0.28);
      border-radius: var(--ctl-radius);
      background: rgba(243, 238, 220, 0.08);
      color: rgba(243, 238, 220, 0.78);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }
    body.home-page .card-city-tag:hover,
    body.home-page .card-city-tag:focus-visible {
      border-color: rgba(243, 238, 220, 0.62);
      background: rgba(243, 238, 220, 0.16);
      color: #fff;
      outline: none;
    }
    body.home-page .card-price { color: var(--ink); }
    /* Prices are not shown anywhere in the public gift shop. */
    body.home-page .card-price,
    .gift-detail-price { display: none !important; }

    /* This page shows NO admin chrome of its own — the Stock Room and Log out
       pills were removed 2026-07-28, along with .gift-admin-controls and
       .gift-admin-pill. The rule below stays and is now load-bearing on its
       own: admin-bridge paints a floating LOG OUT on every public page for a
       signed-in admin, and without this it would reappear here the moment the
       page's own pill went away. Deleting it un-removes the button. */
    .tgb-admin-logout { display: none !important; }

    body.home-page .card-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      text-transform: uppercase;
      /* Bound the title to 2 lines so a long name can't crowd out the
         cities/caption below it in the fixed-height card. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    body.home-page .card-caption {
      /* flex:0 0 auto keeps the caption at its full clamped height so the
         line-clamp ellipsis shows — without it the caption shrinks and the
         text gets sliced off (horizontal cut) with no "…". Overflowing words
         wrap instead of running past the card edge. */
      position: relative;
      flex: 0 0 auto;
      min-height: 0;
      color: rgba(243, 238, 220, 0.72);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* "more" affordance for truncated captions — sits inline at the end of the
       last clamped line (bottom-right of the caption) with a gradient fade so
       it reads as part of the sentence: "…records, a… more". Opens the detail
       lightbox. */
    body.home-page .card-more {
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 0 0 0 2.6em;
      border: 0;
      /* Fade the underlying text into the card surface so "more" doesn't
         collide with the clamped text behind it. */
      background: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, var(--card-paper) 34%, var(--card-paper) 100%);
      color: var(--accent);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0;
      text-transform: lowercase;
      text-decoration: underline;
      cursor: pointer;
    }
    body.home-page .card-more:hover,
    body.home-page .card-more:focus-visible { color: #fff; outline: none; }

    /* ── Full-size image zoom (from the detail dialog image) ───────────── */
    .image-zoom {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 10, 0.9);
      cursor: zoom-out;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .image-zoom[hidden] { display: none; }
    .image-zoom img {
      max-width: min(92vw, 1100px);
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      background: #0b0d12;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }


    /* ── Finder-first hero (option C) ──────────────────────────────────────
       Title and counts share one row, the city field is the hero control, the
       rail sits below it. Selectors carry the same body[data-admin-page] prefix
       the skin uses, so these land on top of its collapsed-spyglass rules
       rather than losing to them. */
    /* Tight stack: counts sit above the title as the eyebrow, and every gap in
       the block is set here so nothing relies on the skin's looser defaults. */
    body[data-admin-page="gift-shop"].home-page main.gift-page .hero-grid {
      padding: 14px 26px 16px;
    }
    body[data-admin-page="gift-shop"].home-page .hero-headline {
      margin: 0;
      font-size: clamp(1.7rem, 2.8vw, 2.2rem);
      line-height: 1;
    }
    body[data-admin-page="gift-shop"].home-page main.gift-page .hero-sub {
      margin-top: 4px;
    }

    /* ── Gift detail lightbox ─────────────────────────────────────────── */
    .gift-detail {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gift-detail[hidden] { display: none; }
    .gift-detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.78);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .gift-detail-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(16, 21, 30, 0.97);
      color: var(--ink);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .gift-detail-close {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: var(--ctl-radius);
      background: rgba(8, 12, 18, 0.6);
      color: var(--ink);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .gift-detail-close:hover { background: rgba(8, 12, 18, 0.85); color: var(--accent); }
    .gift-detail-media {
      position: relative;
      height: 220px;
      flex-shrink: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    .gift-detail-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gift-detail-monogram {
      position: absolute;
      left: 16px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .gift-detail-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 22px 22px;

  <script>
    const SB_CONFIG = {

    const params = new URLSearchParams(location.search);
    const requestedCity = String(params.get('city') || '').trim();
    // Optional game filter. Canonical is ?id=<game-id> (matches the engine
    // URLs); ?game= is also accepted and may be an id or a game name. The raw

    // ── "Curated from" source filter ──────────────────────────────────────
    // Toggle gift cards by where they come from. Multi-select pills, all on by
    // default; a source with no items this view is omitted, and the whole bar
    // hides unless at least two sources are present (nothing to filter).
    const heroSubEl = document.getElementById('heroSub');

    // Eyebrow: the game/item name shown in the hero kicker on filtered views.
    function setEyebrow(text) {
      const trimmed = String(text || '').trim();

    }

    function cityDisplayName(label) {
      const s = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(s)) return s;
      const parts = s.split(',').map((p) => p.trim()).filter(Boolean);
      return parts[0] || s || '';
    }

    function giftCityHref(city) {
      const url = new URL('/gifts/', window.location.origin);
      const trimmed = String(city || '').trim();
      if (trimmed) url.searchParams.set('city', trimmed);
      return url.pathname + url.search;
    }

    function sameCity(a, b) {
      const left = String(a || '').trim();
      const right = String(b || '').trim();
      if (!left || !right) return false;
      return left.localeCompare(right, undefined, { sensitivity: 'base' }) === 0;
    }

    function buildGiftCityEntries(shopCities, listings, allItems, allGames) {
      const itemIdsByCity = new Map();
      (Array.isArray(listings) ? listings : []).forEach((listing) => {
        const item = listing && listing.gift_shop_items;
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        // Gifts are assigned directly to a city now (gift_shop_listings.city).
        const city = String(listing && listing.city || '').trim();
        if (!city) return;
        if (!itemIdsByCity.has(city)) itemIdsByCity.set(city, new Set());
        itemIdsByCity.get(city).add(item.id);
      });
      const allVisibleItemIds = new Set();
      const featuredItemIds = new Set();
      (Array.isArray(allItems) ? allItems : []).forEach((item) => {
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        allVisibleItemIds.add(item.id);
        if (isFeatured(item)) featuredItemIds.add(item.id);
      });
      // Also count gifts that only appear via listings (the grid renders those),
      // so the total never undercounts when the items fetch is partial/empty.
      itemIdsByCity.forEach((ids) => ids.forEach((id) => allVisibleItemIds.add(id)));
      const gameIdsByCity = new Map();
      const allVisibleGameIds = new Set();
      (Array.isArray(allGames) ? allGames : []).forEach((game) => {
        if (!isGiftShopGame(game) || !game.id) return;
        // Count every gift-shop game toward the total — the shop surfaces them
        // all (the "All Cities" view shows city-less games too).
        allVisibleGameIds.add(game.id);
        const city = gameCity(game);
        if (!city) return;
        if (!gameIdsByCity.has(city)) gameIdsByCity.set(city, new Set());
        gameIdsByCity.get(city).add(game.id);
      });
      const rowsByCity = new Map();
      (Array.isArray(shopCities) ? shopCities : []).forEach((row) => {
        const city = String(row && row.city || '').trim();
        if (!city) return;
        rowsByCity.set(city, {
          city,
          label: String(row && row.label || '').trim() || cityDisplayName(city)
        });
      });
      // Back-fill cities that only appear on a game. This has to re-check the
      // hide flag: the catalog rows arriving here are already filtered, but a
      // game sited at a stadium in a hidden town (Orchard Park, Santa Clara)
      // would otherwise put that town straight back into the rail and the city
      // buttons, defeating the filter above.
      gameIdsByCity.forEach((_, city) => {
        if (isIgnoredCity(city)) return;
        if (!rowsByCity.has(city)) rowsByCity.set(city, {
          city,
          label: cityDisplayName(city)
        });
      });
      const entries = Array.from(rowsByCity.values())
        .map((row) => {
          const city = String(row && row.city || '').trim();
          if (!city) return null;
          const label = String(row && row.label || '').trim() || cityDisplayName(city);
          const itemIds = itemIdsByCity.get(city);
          const gameIds = gameIdsByCity.get(city);
          return {
            city,
            label,
            count: (itemIds ? itemIds.size : 0) + (gameIds ? gameIds.size : 0)
          };
        })
        .filter(Boolean)
        // Surface cities that have at least one shop item or game product.
        .filter((entry) => entry.count > 0)
        .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base', numeric: true }) ||
          a.city.localeCompare(b.city, undefined, { sensitivity: 'base', numeric: true }));
      return {
        entries,
        total: allVisibleItemIds.size + allVisibleGameIds.size,
        giftTotal: allVisibleItemIds.size,
        gameTotal: allVisibleGameIds.size,
        featuredTotal: featuredItemIds.size + allVisibleGameIds.size
      };
    }

    // ── Geo badges — mirrors the Games-page BY CITY rows so the shop's city
    // rail uses the same country-oval / state-silhouette badge. ─────────────
    const US_STATES = {
      'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
      'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',

    };
    const COUNTRY_CODES = {

      'france':'FRA','germany':'DEU','spain':'ESP','italy':'ITA','portugal':'PRT',
