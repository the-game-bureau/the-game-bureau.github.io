<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3eee6">
  <title>GAME LIBRARY | THE GAME BUREAU</title>
  <link rel="icon" href="assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/public-theme.css">
  <script src="assets/public-account.js"></script>
  <script src="assets/games/helmets/helmet.js"></script>
  <style>
    * { box-sizing: border-box; }

    body.public-library {
      --paper: #f3eee6;
      --paper-strong: #fbf7f0;
      --ink: #111111;
      --muted: #69655e;
      --line: #cdc5b8;
      --line-strong: #111111;
      --accent: #d43b2f;
      --accent-soft: #f4ddd8;
      --chip: #f8f3ea;
      --water: #efebe3;
      --land: #e0d9cb;
      --radius-shell: 0px;
      --radius-panel: 0px;
      --shadow-soft: none;
      --shadow-lift: none;
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    }

    body.public-library::before,
    body.public-library::after {
      display: none;
    }

    .public-library a {
      color: inherit;
    }

    .public-library .page-shell {
      width: min(1360px, calc(100% - 36px));
      margin: 0 auto;
      padding: 22px 0 46px;
    }

    .public-library .site-nav {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 18px;
      align-items: start;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--line-strong);
    }

    .public-library .brand-lockup {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .public-library .brand-lockup--page .brand-name {
      color: var(--accent) !important;
      font-family: "IBM Plex Mono", monospace !important;
      font-size: 0.72rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.24em !important;
      text-transform: uppercase;
    }

    .public-library .page-headline {
      color: var(--ink);
      font-size: clamp(3.15rem, 8vw, 6.25rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.84;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .public-library .page-count-line {
      margin: 0;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .public-library .page-count-line span {
      color: var(--ink);
    }

    .public-library .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-self: start;
    }

    .public-library .nav-link,
    .public-library .utility-link,
    .public-library .button,
    .public-library .ghost-button,
    .public-library .mc-corner--header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .public-library .nav-link:hover,
    .public-library .nav-link:focus-visible,
    .public-library .utility-link:hover,
    .public-library .utility-link:focus-visible,
    .public-library .button:hover,
    .public-library .button:focus-visible,
    .public-library .ghost-button:hover,
    .public-library .ghost-button:focus-visible,
    .public-library .mc-corner--header:hover,
    .public-library .mc-corner--header:focus-visible {
      border-color: var(--accent);
      background: var(--paper-strong);
      color: var(--ink);
      outline: none;
      transform: translateY(-1px);
    }

    .public-library .nav-link--active,
    .public-library .button,
    .public-library .mc-corner--header {
      background: var(--ink);
      color: #ffffff;
    }

    .public-library .nav-link--active:hover,
    .public-library .nav-link--active:focus-visible,
    .public-library .button:hover,
    .public-library .button:focus-visible,
    .public-library .mc-corner--header:hover,
    .public-library .mc-corner--header:focus-visible {
      background: var(--accent);
      color: #ffffff;
    }

    .public-library .mc-corner--header {
      position: static;
      right: auto;
      bottom: auto;
      z-index: auto;
      white-space: nowrap;
      opacity: 1;
      justify-self: end;
    }

    .public-library main {
      display: grid;
      gap: 18px;
      padding-top: 16px;
    }

    .library-search-shell {
      width: 100%;
    }

    .library-bento-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .public-library .section-shell {
      position: relative;
      overflow: hidden;
      border: 1.5px solid var(--line-strong);
      background: var(--paper-strong);
      border-radius: var(--radius-shell);
      box-shadow: var(--shadow-soft);
    }

    .public-library .section-shell::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      height: 100%;
      border-radius: 0;
      background: var(--accent);
    }

    .public-library .section-inner {
      padding: 20px 20px 20px 26px;
    }

    .library-browse-panel,
    .library-console,
    .library-search-panel {
      display: grid;
      gap: 12px;
    }

    .library-search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 184px;
      gap: 12px;
      align-items: center;
    }

    .library-search-stack {
      display: block;
      min-width: 0;
    }

    .library-search-frame {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      min-height: 62px;
      border: 1.5px solid var(--line-strong);
      background: #ffffff;
      border-radius: var(--radius-panel);
      overflow: hidden;
      box-shadow: none;
    }

    .library-search-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-right: 1.5px solid var(--line-strong);
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .library-search-body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-height: 60px;
      padding: 8px 10px;
    }

    .library-search-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .search-filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 0 10px;
      border: 1.5px solid var(--line-strong);
      background: var(--chip);
      color: var(--ink);
      border-radius: 0;
      font: inherit;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    .search-filter-tag::after {
      content: "×";
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1;
    }

    .search-filter-tag:hover,
    .search-filter-tag:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
      transform: translateY(-1px);
    }

    .search-filter-tag-label,
    .search-filter-tag-value {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .search-filter-tag-label {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .search-filter-tag-value {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .library-search-input {
      flex: 1 1 260px;
      min-width: 240px;
      min-height: 34px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 0 4px;
    }

    .library-search-input::placeholder {
      color: rgba(17, 17, 17, 0.42);
    }

    .library-search-input:focus {
      outline: none;
    }

    .library-search-frame:focus-within {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(212, 59, 47, 0.32);
    }

    .library-clear-button {
      min-height: 62px;
      padding: 0 18px;
      border: 1.5px solid var(--line-strong);
      background: var(--ink);
      color: #ffffff;
      border-radius: var(--radius-panel);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .library-clear-button:hover,
    .library-clear-button:focus-visible {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      outline: none;
      transform: translateY(-1px);
    }

    .library-clear-button:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }

    .library-filter-matrix {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .filter-group,
    .fan-filter-group {
      display: grid;
      gap: 12px;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: var(--radius-panel);
      box-shadow: none;
    }

    .library-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .public-library .info-label,
    .library-filter-count,
    .card-detail {
      margin: 0;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .library-filter-count {
      color: var(--ink);
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .public-library .city-filter {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 276px;
      overflow: auto;
      align-content: start;
    }

    .public-library .city-filter li {
      width: 100%;
      min-width: 0;
    }

    .public-library .city-chip {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--ink);
      border-radius: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .city-chip-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .city-chip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .public-library .city-chip:hover,
    .public-library .city-chip:focus-visible {
      border-color: var(--accent);
      background: var(--paper);
      outline: none;
      transform: translateY(-1px);
    }

    .public-library .city-chip[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .public-library .city-chip-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 28px;
      padding: 0 6px;
      border: 1px solid currentColor;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
    }

    .city-chip-helmet {
      width: 18px;
      height: 18px;
      image-rendering: pixelated;
      flex: 0 0 auto;
    }

    .section-inner--results {
      padding-top: 22px;
    }

    .library-results-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .library-results-kicker {
      margin: 0;
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .library-results-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.25rem, 3vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      text-transform: uppercase;
      text-align: right;
      text-wrap: balance;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      counter-reset: library-card;
      align-items: stretch;
    }

    .card {
      grid-column: auto;
      counter-increment: library-card;
      position: relative;
      display: grid;
      grid-template-rows: 210px 1fr;
      min-height: 100%;
      border: 1.5px solid var(--line-strong);
      background: #ffffff;
      border-radius: var(--radius-shell);
      color: var(--ink);
      text-decoration: none;
      animation: card-rise 360ms cubic-bezier(0.2, 0.72, 0.2, 1) both;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      isolation: isolate;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .card:nth-child(6n + 1),
    .card:nth-child(6n + 4),
    .card:nth-child(5n + 1) {
      grid-column: auto;
      grid-template-columns: 1fr;
      grid-template-rows: 210px 1fr;
    }

    .card::before {
      content: counter(library-card, decimal-leading-zero);
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 3;
      min-width: 34px;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      background: rgba(17, 17, 17, 0.78);
      color: #ffffff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      box-shadow: var(--shadow-lift);
      outline: none;
      transform: translateY(-1px);
    }

    .card-visual {
      position: relative;
      overflow: hidden;
      border-bottom: 1.5px solid var(--line-strong);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.04)),
        linear-gradient(135deg, var(--game-secondary, #ddd6c8), var(--game-primary, #494949));
    }

    .card:nth-child(6n + 1) .card-visual,
    .card:nth-child(6n + 4) .card-visual,
    .card:nth-child(5n + 1) .card-visual {
      min-height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(17, 17, 17, 0.01), rgba(17, 17, 17, 0.12));
      background-size: auto;
      pointer-events: none;
    }

    .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-monogram {
      position: absolute;
      right: 16px;
      bottom: 14px;
      left: 16px;
      z-index: 1;
      color: var(--game-ink, #ffffff);
      font-size: clamp(3rem, 7vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.84;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .card-badges {
      position: absolute;
      top: 14px;
      right: 14px;
      left: 58px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .card-city,
    .card-featured {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .card-featured {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .card-meta {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .card:nth-child(6n + 1) .card-meta,
    .card:nth-child(6n + 4) .card-meta,
    .card:nth-child(5n + 1) .card-meta {
      padding: 14px;
      align-content: normal;
    }

    .card-name {
      margin: 0;
      color: var(--ink);
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.96;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .card:nth-child(6n + 1) .card-name,
    .card:nth-child(6n + 4) .card-name,
    .card:nth-child(5n + 1) .card-name {
      font-size: 1.42rem;
    }

    .card-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.48;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card:nth-child(6n + 1) .card-copy,
    .card:nth-child(6n + 4) .card-copy,
    .card:nth-child(5n + 1) .card-copy {
      -webkit-line-clamp: 4;
      line-clamp: 4;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .card-swatches {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-swatch {
      width: 20px;
      height: 10px;
      border: 1px solid rgba(17, 17, 17, 0.16);
    }

    .card-link {
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .empty {
      display: grid;
      align-content: center;
      justify-items: start;
      gap: 8px;
      min-height: 220px;
      padding: 24px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      border-radius: var(--radius-shell);
    }

    .empty strong {
      color: var(--ink);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    @keyframes card-rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1040px) {
      .public-library .site-nav {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .library-bento-board {
        grid-template-columns: 1fr;
      }

      .public-library .nav-links {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .public-library .mc-corner--header {
        justify-self: end;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .public-library .page-shell {
        width: calc(100% - 24px);
        padding: 16px 0 40px;
      }

      .public-library .page-headline {
        font-size: 2.8rem;
      }

      .library-filter-matrix,
      .library-search-row {
        grid-template-columns: 1fr;
      }

      .library-search-frame {
        grid-template-columns: 1fr;
      }

      .library-search-prefix {
        justify-content: flex-start;
        min-height: 42px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .library-clear-button {
        min-height: 48px;
      }

      .library-results-head {
        align-items: start;
        flex-direction: column;
      }

      .library-results-title {
        text-align: left;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card,
      .card:nth-child(6n + 1),
      .card:nth-child(6n + 4),
      .card:nth-child(5n + 1) {
        grid-column: auto;
        grid-template-columns: 1fr;
        grid-template-rows: 220px 1fr;
      }

      .card:nth-child(6n + 1) .card-visual,
      .card:nth-child(6n + 4) .card-visual,
      .card:nth-child(5n + 1) .card-visual {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 560px) {
      .public-library .nav-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .public-library .mc-corner--header {
        justify-self: start;
      }

      .public-library .section-inner {
        padding: 18px;
      }

      .public-library .city-chip,
      .search-filter-tag {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .public-library .nav-link,
      .public-library .mc-corner--header,
      .library-clear-button,
      .search-filter-tag,
      .public-library .city-chip,
      .card {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>

        <a class="nav-link nav-link--active" id="libraryNavLink" href="library.html" aria-current="page" title="Reset library view">GAME LIBRARY</a>
        <!-- Gift shop hidden while Stripe + Printful integration is being finalized. -->

        <a class="nav-link nav-link--account" href="account.html" data-account-link>Account</a>

    <main>
      <section class="editorial-band library-search-band" aria-label="GAME LIBRARY search" id="libraryDirectory">

                <div class="library-search-frame">
                  <span class="library-search-prefix">SEARCH</span>
                  <div class="library-search-body">
                    <div class="library-search-tags" id="searchTags" hidden></div>
                    <input
                      class="library-search-input"
                      id="librarySearchInput"
                      type="search"
                      autocomplete="off"
                      spellcheck="false"
                      aria-label="Search games by host city, fandom, or title"
                      placeholder="Type your search terms here..."
                    >
                  </div>
                </div>
              </div>
              <button class="library-clear-button" id="clearFiltersBtn" type="button">Reset Filters</button>
            </div>
          </div>
        </article>
      </section>

      <section class="editorial-band library-dashboard" aria-label="GAME LIBRARY controls">
        <div class="library-bento-board">
          <article class="section-shell library-console-shell">
            <div class="section-inner library-browse-panel">
              <div class="library-console">
                <div class="library-filter-matrix">
                  <div class="filter-group">
                    <div class="library-filter-head">
                      <p class="info-label">Game Host Cities</p>
                      <span class="library-filter-count" id="cityFilterCount">0</span>
                    </div>
                    <ul class="city-filter city-filter--swiss" id="cityFilter" role="list" aria-label="Filter by game host city"></ul>
                  </div>

                  <div class="fan-filter-group" id="fanFilterGroup" hidden>
                    <div class="library-filter-head">
                      <p class="info-label">Fandom</p>
                      <span class="library-filter-count" id="fanFilterCount">0</span>
                    </div>
                    <ul class="city-filter city-filter--swiss" id="fanFilter" role="list" aria-label="Filter by fandom"></ul>
                  </div>

      <section aria-label="Games">
        <article class="section-shell library-results-shell">
          <div class="section-inner section-inner--results">
            <div class="library-results-head">
              <p class="library-results-kicker">Browse</p>
              <p class="library-results-title" id="resultsHeading">All live games</p>
            </div>
            <div class="grid" id="grid" aria-live="polite"></div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3',
      table: 'games'
    };

    const ALL_CITIES = '__all__';
    const ALL_FANS = '__all_fans__';
    const cityFilterEl = document.getElementById('cityFilter');
    const fanFilterEl = document.getElementById('fanFilter');
    const fanFilterGroupEl = document.getElementById('fanFilterGroup');
    const gridEl = document.getElementById('grid');
    const headerGameCountEl = document.getElementById('headerGameCount');
    const headerCityCountEl = document.getElementById('headerCityCount');
    const searchInputEl = document.getElementById('librarySearchInput');
    const searchTagsEl = document.getElementById('searchTags');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const libraryNavLinkEl = document.getElementById('libraryNavLink');
    const libraryDirectoryEl = document.getElementById('libraryDirectory');
    const cityFilterCountEl = document.getElementById('cityFilterCount');
    const fanFilterCountEl = document.getElementById('fanFilterCount');
    const visibleGameCountEl = document.getElementById('visibleGameCount');
    const visibleGameLabelEl = document.getElementById('visibleGameLabel');
    const visibleScopeMetaEl = document.getElementById('visibleScopeMeta');
    const activeCityValueEl = document.getElementById('activeCityValue');
    const activeFanValueEl = document.getElementById('activeFanValue');
    const activeQueryValueEl = document.getElementById('activeQueryValue');
    const resultsStateLabelEl = document.getElementById('resultsStateLabel');
    const resultsHeadingEl = document.getElementById('resultsHeading');

    let allGames = [];
    let activeCity = ALL_CITIES;
    let activeFan = ALL_FANS;
    let searchTerm = '';

    function getFanTeam(game) {
      const name = String(game?.name || '').trim();
      const match = name.match(/^(.+?)\s+Fans Takeover\s+/i);
      return match ? match[1].trim() : '';
    }

    function normalizeTag(value) {
      return plainText(value);
    }

    function getTags(game) {
      const seen = new Set();
      const tags = [];
      const rawTags = Array.isArray(game?.tags) ? game.tags : [];
      rawTags.forEach((tag) => {
        const normalized = normalizeTag(tag);
        const key = normalized.toLowerCase();
        if (!normalized || seen.has(key)) return;
        seen.add(key);
        tags.push(normalized);
      });
      return tags;
    }

    function isTrueish(value) {
      if (typeof value === 'boolean') return value;
      if (typeof value === 'string') {
        const trimmed = value.trim().toLowerCase();
        return !!trimmed && trimmed !== 'false' && trimmed !== '0' && trimmed !== 'no';
      }
      return !!value;
    }

    function isLiveGame(game) {
      return !isTrueish(game?.archived);
    }

    function isFeatured(game) {
      if (typeof game?.featured === 'boolean') return game.featured;
      if (typeof game?.featured === 'string' && game.featured.trim()) return true;
      return getTags(game).some((tag) => tag.toLowerCase() === 'featured');
    }

    function getCity(game) {
      return String(game?.city || '').trim();
    }

    function getGameDate(game) {
      const raw = String(game?.game_date || '').trim();
      if (!raw) return '';
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return raw;
      const [, year, month, day] = match;
      const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString('en-US', {
        timeZone: 'UTC',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function plainText(value) {
      return String(value || '')
        .replace(/<[^>]*>/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function truncate(text, maxLength = 140) {
      const normalized = plainText(text);
      if (!normalized) return '';
      return normalized.length > maxLength
        ? normalized.slice(0, maxLength - 1).trimEnd() + '…'
        : normalized;
    }

    function getPalette(game) {
      return {
        primary: String(game?.primary_color || '').trim() || '#15211d',
        secondary: String(game?.secondary_color || '').trim() || '#667d76'
      };
    }

    function sanitizeAssetUrl(value) {
      const raw = String(value || '').trim().replace(/\\/g, '/')
        .replace('https://the-game-bureau.github.io/the-game-bureau/', 'https://thegamebureau.com/')
        .replace('https://the-game-bureau.github.io/', 'https://thegamebureau.com/');
      if (!raw) return '';
      if (raw.startsWith('data:') || raw.startsWith('blob:')) return raw;
      try {
        const base = /^assets\//i.test(raw) ? new URL('', window.location.href).toString() : window.location.href;
        const resolved = new URL(raw, base);
        const proto = String(resolved.protocol || '').toLowerCase();
        return proto === 'http:' || proto === 'https:' ? resolved.toString() : '';
      } catch (e) {
        return '';
      }
    }

    function getImageUrl(game) {
      return sanitizeAssetUrl(game?.logo_url || game?.guide_image_url || '');
    }

    function getGuideName(game) {
      return plainText(game?.guide_name || '');
    }

    function getSummaryCopy(game) {
      const candidates = [game?.tagline, game?.body, game?.how_to_play, game?.guide_bio];
      for (const candidate of candidates) {
        const text = truncate(candidate, 150);
        if (text) return text;
      }
      return 'Open the route and let the city reveal itself one clue at a time.';
    }

    function getMonogram(name) {
      const words = plainText(name).match(/[A-Za-z0-9]+/g) || [];
      const letters = words.slice(0, 2).map((word) => word.charAt(0).toUpperCase()).join('');
      return letters || 'TGB';
    }

    async function fetchGames() {
      const url = new URL('rest/v1/' + SB_CONFIG.table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      url.searchParams.set('select', '*');
      url.searchParams.set('order', 'name.asc');
      const response = await fetch(url.toString(), {
        headers: {
          apikey: SB_CONFIG.key,
          Authorization: `Bearer ${SB_CONFIG.key}`,
          Accept: 'application/json'
        },
        cache: 'no-store'
      });
      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error('Supabase ' + response.status + ': ' + text.slice(0, 200));
      }
      return response.json();
    }

    function sortGames(games) {
      return [...games].sort((left, right) => {
        const featuredDelta = Number(isFeatured(right)) - Number(isFeatured(left));
        if (featuredDelta !== 0) return featuredDelta;
        return String(left?.name || '').localeCompare(String(right?.name || ''), undefined, { sensitivity: 'base' });
      });
    }

    function pickContrastInk(hex) {
      const m = String(hex || '').trim().match(/^#?([0-9a-f]{6})$/i);
      if (!m) return '#fffaf0';
      const v = parseInt(m[1], 16);
      const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.65 ? '#15211d' : '#fffaf0';
    }

    function formatCountLabel(value, singular, plural = singular.endsWith('y') ? singular.slice(0, -1) + 'ies' : singular + 's') {
      return value === 1 ? '1 ' + singular : value + ' ' + plural;
    }

    function getSearchTerms() {
      return searchTerm.split(/\s+/).filter(Boolean);
    }

    function getSearchDisplayValue() {
      return plainText(searchInputEl ? searchInputEl.value : searchTerm);
    }

    function getResultsStateText() {
      const parts = [];
      if (activeCity !== ALL_CITIES) parts.push(activeCity);
      if (activeFan !== ALL_FANS) parts.push(activeFan + ' fandom');
      const query = getSearchDisplayValue();
      if (query) parts.push('"' + query + '"');
      return parts.length ? parts.join(' / ') : 'All live games';
    }

    function matchesSearch(game) {
      const terms = getSearchTerms();
      if (!terms.length) return true;
      const haystack = [
        game?.city,
        getFanTeam(game),
        game?.name
      ].map(plainText).join(' ').toLowerCase();
      return terms.every((term) => haystack.includes(term));
    }

    function getFilteredGames(options = {}) {
      const ignoreCity = !!options.ignoreCity;
      const ignoreFan = !!options.ignoreFan;
      const ignoreSearch = !!options.ignoreSearch;
      return allGames.filter((game) => {
        if (!ignoreCity && activeCity !== ALL_CITIES && getCity(game) !== activeCity) return false;
        if (!ignoreFan && activeFan !== ALL_FANS && getFanTeam(game) !== activeFan) return false;
        if (!ignoreSearch && !matchesSearch(game)) return false;
        return true;
      });
    }

    function getVisibleGames() {
      return getFilteredGames();
    }

    function createColorSwatch(color) {
      const swatch = document.createElement('span');
      swatch.className = 'card-swatch';
      swatch.style.background = color;
      return swatch;
    }

    function createCard(game, index = 0) {
      const id = String(game?.id || '').trim();
      const palette = getPalette(game);
      const name = String(game?.name || '').trim() || 'Untitled';
      const city = getCity(game);
      const team = getFanTeam(game);
      const imageUrl = getImageUrl(game);
      const summary = getSummaryCopy(game);
      const detail = [
        city,
        team ? team + ' fans' : ''
      ].filter(Boolean).join(' / ') || 'Live route';

      const card = document.createElement('a');
      card.className = 'card';
      card.href = '../game/run/index.html?id=' + encodeURIComponent(id);
      card.setAttribute('aria-label', name + (city ? ' in ' + city : ''));
      card.style.setProperty('--game-primary', palette.primary);
      card.style.setProperty('--game-secondary', palette.secondary);
      card.style.setProperty('--game-ink', pickContrastInk(palette.primary));
      card.style.animationDelay = Math.min(index, 12) * 36 + 'ms';

      const visual = document.createElement('div');
      visual.className = 'card-visual';

      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.addEventListener('error', () => img.remove());
        visual.appendChild(img);
      } else {
        const monogram = document.createElement('div');
        monogram.className = 'card-monogram';
        monogram.textContent = getMonogram(name);
        visual.appendChild(monogram);
      }

      const badgeRow = document.createElement('div');
      badgeRow.className = 'card-badges';
      if (city) {
        const cityBadge = document.createElement('span');
        cityBadge.className = 'card-city';
        cityBadge.textContent = city;
        badgeRow.appendChild(cityBadge);
      }
      const gameDateLabel = getGameDate(game);
      if (gameDateLabel) {
        const dateBadge = document.createElement('span');
        dateBadge.className = 'card-city';
        dateBadge.textContent = gameDateLabel;
        badgeRow.appendChild(dateBadge);
      }
      if (isFeatured(game)) {
        const badge = document.createElement('span');
        badge.className = 'card-featured';
        badge.textContent = 'Featured';
        badgeRow.appendChild(badge);
      }
      if (badgeRow.childNodes.length) visual.appendChild(badgeRow);

      const meta = document.createElement('div');
      meta.className = 'card-meta';

      const nameEl = document.createElement('h2');
      nameEl.className = 'card-name';
      nameEl.textContent = name;
      meta.appendChild(nameEl);

      if (summary) {
        const summaryEl = document.createElement('p');
        summaryEl.className = 'card-copy';
        summaryEl.textContent = summary;
        meta.appendChild(summaryEl);
      }

      const detailEl = document.createElement('div');
      detailEl.className = 'card-detail';
      detailEl.textContent = detail;
      meta.appendChild(detailEl);

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const swatches = document.createElement('div');
      swatches.className = 'card-swatches';
      swatches.append(createColorSwatch(palette.primary), createColorSwatch(palette.secondary));

      const linkEl = document.createElement('span');
      linkEl.className = 'card-link';
      linkEl.textContent = 'VIEW GAME';

      footer.append(swatches, linkEl);
      meta.appendChild(footer);

      card.append(visual, meta);
      return card;
    }

    function renderMetrics() {
      const visibleGames = getVisibleGames();
      const totalGames = allGames.length;
      const totalCities = new Set(allGames.map(getCity).filter(Boolean)).size;
      const visibleCities = new Set(visibleGames.map(getCity).filter(Boolean)).size;
      const visibleTeams = new Set(visibleGames.map(getFanTeam).filter(Boolean)).size;
      const query = getSearchDisplayValue();
      const resultsState = getResultsStateText();

      if (headerGameCountEl) {
        headerGameCountEl.textContent = visibleGames.length === totalGames
          ? String(totalGames)
          : visibleGames.length + ' of ' + totalGames;
      }

      if (headerCityCountEl) {
        headerCityCountEl.textContent = visibleCities === totalCities
          ? String(totalCities)
          : visibleCities + ' of ' + totalCities;
      }

      if (visibleGameCountEl) visibleGameCountEl.textContent = String(visibleGames.length);
      if (visibleGameLabelEl) {
        visibleGameLabelEl.textContent = visibleGames.length === totalGames
          ? formatCountLabel(totalGames, 'game') + ' live now'
          : 'Showing ' + visibleGames.length + ' of ' + totalGames + ' games';
      }
      if (visibleScopeMetaEl) {
        visibleScopeMetaEl.textContent = formatCountLabel(visibleCities, 'host city') + ' / ' + formatCountLabel(visibleTeams, 'fandom');
      }
      if (activeCityValueEl) activeCityValueEl.textContent = activeCity !== ALL_CITIES ? activeCity : 'All Host Cities';
      if (activeFanValueEl) activeFanValueEl.textContent = activeFan !== ALL_FANS ? activeFan : 'All Fandoms';
      if (activeQueryValueEl) activeQueryValueEl.textContent = query || 'All Titles';
      if (resultsStateLabelEl) resultsStateLabelEl.textContent = resultsState;
      if (resultsHeadingEl) resultsHeadingEl.textContent = resultsState;
    }

    function renderCityFilter() {
      const scopedGames = getFilteredGames({ ignoreCity: true });
      const cityCounts = new Map();
      scopedGames.forEach((g) => {
        const c = getCity(g);
        if (!c) return;
        cityCounts.set(c, (cityCounts.get(c) || 0) + 1);
      });
      if (activeCity !== ALL_CITIES && !cityCounts.has(activeCity)) cityCounts.set(activeCity, 0);
      const cities = [...cityCounts.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      cityFilterEl.innerHTML = '';
      const entries = [
        { key: ALL_CITIES, label: 'All Host Cities', count: scopedGames.length },
        ...cities.map((c) => ({ key: c, label: c, count: cityCounts.get(c) }))
      ];
      if (cityFilterCountEl) cityFilterCountEl.textContent = String(cities.length);

      entries.forEach((entry) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'city-chip';
        btn.setAttribute('aria-pressed', String(entry.key === activeCity));
        btn.title = entry.label;
        const main = document.createElement('span');
        main.className = 'city-chip-main';
        const label = document.createElement('span');
        label.className = 'city-chip-label';
        label.textContent = entry.label;
        main.appendChild(label);
        const count = document.createElement('span');
        count.className = 'city-chip-count';
        count.textContent = entry.count;
        btn.append(main, count);
        btn.addEventListener('click', () => setActiveCity(entry.key));
        li.appendChild(btn);
        cityFilterEl.appendChild(li);
      });
    }

    function setActiveCity(city) {
      activeCity = city;
      renderAll();
    }

    function renderFanFilter() {
      const scopedGames = getFilteredGames({ ignoreFan: true });
      const fanCounts = new Map();
      const fanGameSample = new Map();
      scopedGames.forEach((g) => {
        const fan = getFanTeam(g);
        if (!fan) return;
        fanCounts.set(fan, (fanCounts.get(fan) || 0) + 1);
        if (!fanGameSample.has(fan)) fanGameSample.set(fan, g);
      });
      if (activeFan !== ALL_FANS && !fanCounts.has(activeFan)) fanCounts.set(activeFan, 0);
      const fans = [...fanCounts.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      if (!fans.length) {
        fanFilterGroupEl.hidden = true;
        if (fanFilterCountEl) fanFilterCountEl.textContent = '0';
        return;
      }
      fanFilterGroupEl.hidden = false;

      const totalFanGames = scopedGames.filter((g) => getFanTeam(g)).length;
      const entries = [
        { key: ALL_FANS, label: 'All Fandoms', count: totalFanGames, helmet: null },
        ...fans.map((f) => ({ key: f, label: f, count: fanCounts.get(f), helmet: fanGameSample.get(f) }))
      ];
      if (fanFilterCountEl) fanFilterCountEl.textContent = String(fans.length);

      fanFilterEl.innerHTML = '';
      entries.forEach((entry) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'city-chip';
        btn.setAttribute('aria-pressed', String(entry.key === activeFan));
        btn.title = entry.label;

        const main = document.createElement('span');
        main.className = 'city-chip-main';

        if (entry.helmet && typeof window.helmetSVG === 'function') {
          const img = document.createElement('img');
          img.className = 'city-chip-helmet';
          img.alt = '';
          img.src = window.helmetSVG(
            entry.helmet.primary_color,
            entry.helmet.secondary_color,
            entry.helmet.tertiary_color
          );
          main.appendChild(img);
        }

        const labelSpan = document.createElement('span');
        labelSpan.className = 'city-chip-label';
        labelSpan.textContent = entry.label;
        main.appendChild(labelSpan);

        const count = document.createElement('span');
        count.className = 'city-chip-count';
        count.textContent = entry.count;
        btn.append(main, count);
        btn.addEventListener('click', () => setActiveFan(entry.key));
        li.appendChild(btn);
        fanFilterEl.appendChild(li);
      });
    }

    function setActiveFan(fan) {
      activeFan = fan;
      renderAll();
    }

    function makeSearchFilterTag(label, value, onClick) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'search-filter-tag';

      const labelEl = document.createElement('span');
      labelEl.className = 'search-filter-tag-label';
      labelEl.textContent = label;

      const valueEl = document.createElement('span');
      valueEl.className = 'search-filter-tag-value';
      valueEl.textContent = value;

      chip.append(labelEl, valueEl);
      if (typeof onClick === 'function') chip.addEventListener('click', onClick);
      return chip;
    }

    function renderSearchTags() {
      if (!searchTagsEl) return;
      searchTagsEl.innerHTML = '';
      if (activeCity !== ALL_CITIES) {
        searchTagsEl.appendChild(makeSearchFilterTag('Host City', activeCity, () => setActiveCity(ALL_CITIES)));
      }
      if (activeFan !== ALL_FANS) {
        searchTagsEl.appendChild(makeSearchFilterTag('Fandom', activeFan, () => setActiveFan(ALL_FANS)));
      }
      searchTagsEl.hidden = searchTagsEl.childElementCount === 0;

      if (clearFiltersBtn) {
        clearFiltersBtn.disabled = !searchTerm && activeCity === ALL_CITIES && activeFan === ALL_FANS;
      }
    }

    function clearFilters() {
      activeCity = ALL_CITIES;
      activeFan = ALL_FANS;
      searchTerm = '';
      if (searchInputEl) searchInputEl.value = '';
      renderAll();
    }

    function renderAll() {
      renderCityFilter();
      renderFanFilter();
      renderSearchTags();
      renderGrid();
    }

    function renderGrid() {
      const visible = getVisibleGames();

      gridEl.innerHTML = '';
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        const title = document.createElement('strong');
        title.textContent = 'NO GAMES';
        const copy = document.createElement('span');
        copy.textContent = searchTerm || activeCity !== ALL_CITIES || activeFan !== ALL_FANS
          ? 'No games matching your selection.'
          : 'Coming soon.';
        empty.append(title, copy);
        gridEl.appendChild(empty);
      } else {
        visible.forEach((game, index) => gridEl.appendChild(createCard(game, index)));
      }
      renderMetrics();
    }

    function renderErrorState(message) {
      renderMetrics();
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      const title = document.createElement('strong');
      title.textContent = 'NO GAMES';
      const copy = document.createElement('span');
      copy.textContent = message;
      empty.append(title, copy);
      gridEl.appendChild(empty);
    }

    async function load() {
      try {
        const games = await fetchGames();
        allGames = sortGames((Array.isArray(games) ? games : []).filter(isLiveGame));
        renderAll();
      } catch (error) {
        console.error(error);
        renderErrorState(error instanceof Error ? error.message : String(error));
      }
    }

    if (searchInputEl) {
      searchInputEl.addEventListener('input', () => {
        searchTerm = plainText(searchInputEl.value).toLowerCase();
        renderAll();
      });
    }

    if (clearFiltersBtn) {
      clearFiltersBtn.addEventListener('click', clearFilters);
    }

    if (libraryNavLinkEl) {
      libraryNavLinkEl.addEventListener('click', (event) => {
        event.preventDefault();
        clearFilters();
        if (libraryDirectoryEl) {
          libraryDirectoryEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        if (searchInputEl) {
          searchInputEl.focus({ preventScroll: true });
        }
      });
    }

    load();
  </script>
</body>
</html>
