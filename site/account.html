<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7faf6" />
  <meta name="description" content="Sign in to THE GAME BUREAU." />
  <title>ACCOUNT | THE GAME BUREAU</title>
  <link rel="icon" href="assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/public-theme.css">
  <script src="assets/public-account.js"></script>
  <script src="assets/account-page.js" defer></script>
  <style>
    .public-library main {
      display: grid;
      gap: 1rem;
    }

    .public-library .account-hero {
      margin-top: 0.5rem;
    }

    .public-library .account-layout {
      grid-template-columns: minmax(0, 720px);
    }

    .public-library .account-panel {
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .public-library .account-panel h2 {
      color: var(--ink);
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1;
      text-transform: uppercase;
    }

    .public-library .kicker {
      color: var(--muted-strong);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 0.5rem;
    }

    .public-library .account-tab,
    .public-library .text-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted-strong);
      font: 800 0.72rem/1 "Montserrat", Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .public-library .account-tab:hover,
    .public-library .account-tab:focus-visible,
    .public-library .text-button:hover,
    .public-library .text-button:focus-visible,
    .public-library .account-tab.is-active {
      border-color: var(--pine);
      color: var(--pine);
      background: #fff;
      outline: none;
    }

    .public-library .account-form label {
      color: var(--muted-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .public-library .account-form input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--ink);
      font: 500 1rem/1.2 "Montserrat", Arial, sans-serif;
    }

    .public-library .account-form input:focus {
      border-color: var(--pine);
      outline: 2px solid rgba(41, 67, 61, 0.18);
      outline-offset: 2px;
    }

    .public-library .account-status {
      color: var(--muted-strong);
    }

    .public-library .account-status.is-error {
      color: #b3392f;
      font-weight: 800;
    }

    .public-library .account-status.is-success {
      color: var(--pine);
      font-weight: 800;
    }

    .public-library .account-email {
      color: var(--muted-strong);
    }

    .public-library .btn,
    .public-library .btn-primary {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid var(--pine);
      background: var(--pine);
      color: var(--cream);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition);
    }

    .public-library .btn:hover,
    .public-library .btn:focus-visible {
      transform: translateY(-1px);
      background: #1f3530;
      outline: none;
    }

    .public-library .cta {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.74);
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
      text-decoration: none;
    }

    .public-library .cta:hover,
    .public-library .cta:focus-visible {
      border-color: var(--line-strong);
      background: #fff;
      outline: none;
    }
  </style>
</head>
<body class="public-library">
  <div class="page-shell">
    <header class="site-nav">
      <div class="brand-lockup brand-lockup--page">
        <span class="brand-name">The Game Bureau</span>
        <span class="page-headline">Account</span>
        <p class="page-count-line">Sign in or create an account</p>
      </div>
      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="library.html">Library</a>
        <a class="nav-link" href="gift.html">Gift Shop</a>
        <a class="nav-link nav-link--active nav-link--account" href="account.html" aria-current="page" data-account-link>Account</a>
      </nav>
    </header>

    <main>
      <section class="account-layout" aria-label="Account forms">
        <section class="account-panel" id="signedOutPanel">
          <div class="account-tabs" role="tablist" aria-label="Account mode">
            <button class="account-tab" type="button" role="tab" data-auth-mode-btn="signin">Sign in</button>
            <button class="account-tab" type="button" role="tab" data-auth-mode-btn="signup">Create account</button>
          </div>

          <form class="account-form" id="signInForm" data-auth-mode="signin">
            <label>
              Email
              <input name="email" type="email" autocomplete="username" required>
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn-primary" type="submit">Sign in</button>
            <button class="text-button" id="recoverBtn" type="button">Send password reset email</button>
            <p class="account-status" id="signInStatus" aria-live="polite"></p>
          </form>

          <form class="account-form hidden" id="signUpForm" data-auth-mode="signup">
            <label>
              Display name
              <input name="display_name" type="text" autocomplete="name">
            </label>
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="btn btn-primary" type="submit">Create account</button>
            <p class="account-status" id="signUpStatus" aria-live="polite"></p>
          </form>
        </section>

        <section class="account-panel hidden" id="signedInPanel">
          <p class="kicker">Signed in</p>
          <h2 id="accountName">Field agent</h2>
          <p class="account-email" id="accountEmail"></p>

          <form class="account-form" id="profileForm">
            <label>
              Display name
              <input id="displayNameInput" name="display_name" type="text" autocomplete="name">
            </label>
            <button class="btn btn-primary" type="submit">Save account</button>
            <p class="account-status" id="profileStatus" aria-live="polite"></p>
          </form>

          <div class="account-actions">
            <a class="cta" href="library.html">Open library</a>
            <button class="btn" id="accountSignOutBtn" type="button">Sign out</button>
          </div>
        </section>
      </section>
    </main>
  </div>
  <a class="mc-corner" href="../mc/index.html">MISSION CONTROL</a>
</body>
</html>
