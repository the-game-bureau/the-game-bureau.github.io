<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TEAMS | THE GAME BUREAU</title>
  <link rel="icon" href="../brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --mist: var(--paper-base);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --hand: 'Shadows Into Light', cursive;
      --body: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    html, body { margin: 0; min-height: 100vh; }
    body {
      font-family: var(--body);
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
      padding: 24px 28px 96px;
    }
    button, input { font: inherit; }

    header.page {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    header.page .title {
      font-family: var(--hand);
      font-size: clamp(2.5rem, 4vw, 4.2rem);
      color: var(--bic-blue);
      line-height: 0.9;
      margin: 0;
    }
    header.page .kicker {
      font-family: var(--hand);
      font-size: 1.2rem;
      color: var(--bic-blue);
      opacity: 0.85;
      margin: 0 0 -4px;
    }
    header.page .status {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2em;
      margin: 6px 0 0;
    }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button.btn {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 14px;
      background: var(--paper);
      border: 1px solid var(--ink);
      border-radius: 4px;
      cursor: pointer;
      color: var(--ink);
      transition: background 0.15s, color 0.15s;
    }
    button.btn:hover { background: var(--ink); color: #fff; }
    button.btn.primary { background: var(--bic-blue); border-color: var(--bic-blue); color: #fff; }
    button.btn.primary:hover { background: #1c3a6a; }
    button.btn.danger { color: var(--danger); border-color: var(--danger); }
    button.btn.danger:hover { background: var(--danger); color: #fff; }
    button.btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .league {
      margin: 28px 0 36px;
      padding-top: 8px;
    }
    .league-head {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--ink);
    }
    .league-name {
      font-family: var(--hand);
      font-size: 2.2rem;
      color: var(--bic-blue);
      margin: 0;
      cursor: text;
      outline: none;
      padding: 0 2px;
      border-radius: 3px;
    }
    .league-name:focus { background: rgba(255, 250, 205, 0.7); }
    .league-count {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .league-actions { margin-left: auto; display: flex; gap: 6px; }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .team-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 0 var(--paper-shadow);
    }
    .team-palette {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 48px;
    }
    .team-palette > div { position: relative; }
    .team-palette span {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      mix-blend-mode: difference;
      pointer-events: none;
    }
    .team-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .team-headline {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .team-code-input {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      width: 6ch;
      border: 1px dashed var(--line);
      background: rgba(255,255,255,0.65);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--bic-blue);
    }
    .team-name-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: var(--body);
      font-size: 1rem;
      font-weight: 600;
      padding: 2px 0;
      border-bottom: 1px solid transparent;
      color: var(--ink);
    }
    .team-name-input:focus, .team-code-input:focus {
      outline: none;
      border-bottom-color: var(--bic-blue);
      background: rgba(255, 250, 205, 0.7);
    }
    .team-sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .team-sub-input {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      font-family: var(--body);
      font-size: 0.85rem;
      padding: 4px 6px;
      border-radius: 3px;
      width: 100%;
      color: var(--ink);
    }
    .team-sub-input:focus { outline: none; border-color: var(--bic-blue); }
    .field-mini-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .color-row {
      display: grid;
      grid-template-columns: 16px 28px 90px 1fr;
      align-items: center;
      gap: 6px;
      border: 1px dashed transparent;
      border-radius: 4px;
      padding: 2px 2px;
      transition: background 0.12s, border-color 0.12s;
    }
    .color-row.is-dragging { opacity: 0.4; }
    .color-row.is-drop-target {
      background: rgba(var(--bic-blue-rgb), 0.08);
      border-color: var(--bic-blue);
    }
    .color-drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 24px;
      cursor: grab;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1;
      user-select: none;
    }
    .color-drag-handle:active { cursor: grabbing; color: var(--ink); }
    .color-row input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    .color-row input[type="text"] {
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.8);
      color: var(--ink);
    }
    .color-row input[type="text"]:focus { outline: none; border-color: var(--bic-blue); }
    .color-row .role {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .team-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-mini {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 8px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 3px;
      cursor: pointer;
      color: var(--muted);
    }
    .btn-mini:hover { color: var(--ink); border-color: var(--ink); }
    .btn-mini.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

    .empty-state {
      padding: 36px;
      text-align: center;
      font-family: var(--mono);
      color: var(--muted);
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.6);
    }
    .sticky-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 28px;
      background: rgba(254, 254, 249, 0.94);
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 50;
    }
    .sticky-bar .status { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); flex: 1; }

    /* Lookup modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(45, 72, 128, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }
    .modal-backdrop.is-open { display: flex; }
    .modal {
      background: var(--paper-base);
      border: 1px solid var(--ink);
      border-radius: 8px;
      width: min(560px, 100%);
      max-height: 92vh;
      overflow: auto;
      box-shadow: 0 18px 40px rgba(45,72,128,0.22);
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 20px 8px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title {
      font-family: var(--hand);
      font-size: 1.8rem;
      color: var(--bic-blue);
      margin: 0;
    }
    .modal-close {
      font-family: var(--mono);
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--muted);
      cursor: pointer;
    }
    .modal-close:hover { color: var(--danger); }
    .modal-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-field { display: flex; flex-direction: column; gap: 4px; }
    .modal-field label {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .modal-field input, .modal-field select {
      font-family: var(--body);
      font-size: 0.95rem;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 4px;
      color: var(--ink);
    }
    .modal-field input:focus, .modal-field select:focus { outline: none; border-color: var(--bic-blue); }
    .modal-row { display: flex; gap: 8px; align-items: flex-end; }
    .modal-row .modal-field { flex: 1; }
    .modal-step-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 6px 0 -2px;
    }
    .modal-option {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px 12px;
      background: rgba(255,255,255,0.6);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-option-title {
      font-family: var(--body);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
    }
    .modal-or {
      align-self: center;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: -4px 0;
    }
    .modal-status {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .modal-footnote {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: right;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .modal-footnote a {
      color: var(--bic-blue);
      text-decoration: underline dotted;
    }
    .modal-footnote a:hover { color: var(--danger); }
    .modal-results { display: flex; flex-direction: column; gap: 8px; }
    .result-card {
      display: grid;
      grid-template-columns: 4fr 1fr;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .result-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .result-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-meta {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .result-swatches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      height: 32px;
      width: 60px;
      border-radius: 4px;
      overflow: hidden;
    }
    .result-add {
      grid-column: 1 / -1;
      justify-self: end;
    }
    .team-helmet {
      display: grid;
      place-items: center;
      padding: 10px 8px 4px;
      background:
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.06) 1px, transparent 1px) 0 0 / 14px 14px,
        linear-gradient(rgba(var(--bic-blue-rgb), 0.06) 1px, transparent 1px) 0 0 / 14px 14px,
        rgba(255, 255, 255, 0.9);
    }
    .team-helmet-img {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 4px 8px rgba(var(--bic-blue-rgb), 0.18));
    }
  </style>
  <script src="../games/helmets/helmet.js"></script>
  <script src="../games/helmets/basketball.js"></script>
  <script src="../games/helmets/baseball.js"></script>
  <script src="../../mc/admin-auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site-pages.css">
  <script src="../public-account.js"></script>
</head>
<body>
  <header class="site-nav">
    <div class="brand-lockup">
      <span class="brand-name">The Game Bureau</span>
      <p class="brand-tagline">The cure for the common walking tour</p>
    </div>
    <nav class="nav-links" aria-label="Primary">
      <div class="nav-primary-links" aria-label="Featured">
        <a class="nav-link nav-link--major nav-link--games" href="/games/">GAMES</a>
        <a class="nav-link nav-link--major nav-link--gifts" href="/gifts/">GIFTS</a>

<header class="page">
  <div>
    <p class="kicker">Mission Control</p>
    <h1 class="title">Team Colors</h1>
    <p class="status" id="topStatus">Loading…</p>
  </div>
  <div class="toolbar">
    <button class="btn primary" id="lookupBtn">Add Colors</button>
    <button class="btn" id="reloadBtn">Reload</button>
    <button class="btn" id="openFileBtn" title="Open research/teams.json and edit colors directly in the file (Chrome/Edge)">Open File</button>
    <button class="btn primary" id="saveFileBtn" title="Save color edits back to the opened teams.json (Ctrl+S)" disabled>Save File</button>
    <button class="btn" id="exportBtn" title="Export current data for research/teams.json (offline fallback)">Export JSON</button>
    <button class="btn primary" id="loginBtn">Login</button>
  </div>
</header>

<main id="leaguesRoot"></main>

<div class="sticky-bar">
  <span class="status" id="bottomStatus"></span>
</div>

<!-- Lookup modal -->
<div class="modal-backdrop" id="lookupModal" role="dialog" aria-modal="true" aria-labelledby="lookupTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 class="modal-title" id="lookupTitle">Add Colors</h2>
      <button class="modal-close" id="lookupCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="modal-body">

      <!-- Step 1: pick a league (with inline "pull all" button) -->
      <div class="modal-row">
        <div class="modal-field">
          <label for="lookupLeague">League</label>
          <select id="lookupLeague"></select>
        </div>
        <button class="btn" id="lookupPullLeagueBtn" title="Pull every team in this league from ESPN">⇣ Pull</button>
      </div>

      <!-- Step 1b: pick a conference (only when the league has nested groups, e.g. NCAAF) -->
      <div class="modal-row" id="lookupGroupField" hidden>
        <div class="modal-field">
          <label for="lookupGroup">Conference</label>
          <select id="lookupGroup"></select>
        </div>
        <button class="btn" id="lookupPullGroupBtn" title="Pull every team in this conference from ESPN">⇣ Pull</button>
      </div>

      <div class="modal-option">
        <div class="modal-option-title">Add one team</div>
        <div class="modal-row">
          <input id="lookupQuery" type="text" placeholder="Team name, mascot, city, or code" autocomplete="off" style="flex:1;">
          <button class="btn primary" id="lookupSearchBtn">Search</button>
        </div>
      </div>

      <div class="modal-status" id="lookupStatus"></div>
      <div class="modal-results" id="lookupResults"></div>
      <div class="modal-footnote">Data: ESPN public API (via free CORS proxy)</div>
    </div>
  </div>
</div>

<script>
const JSON_PATH = '../../research/teams.json';
const SB_CONFIG = {
  url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
  key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3',
  table: 'teams'
};
const SB_BASE = SB_CONFIG.url + '/rest/v1/' + SB_CONFIG.table;
// NFL pinned first; everything else alphabetical (matches index.html ordering).
const LEAGUE_RANK = (name) => (name === 'NFL' ? 0 : 100);
const COLOR_ROLES = [
  { key: 'primary',   label: 'Primary' },
  { key: 'secondary', label: 'Secondary' },
  { key: 'tertiary',  label: 'Tertiary' }
];
const HEX_RE = /^#?([0-9a-f]{6})$/i;

// League code → ESPN URL path. ESPN's site API returns the full team
// roster + brand colors (color, alternateColor) for each major league.
const LEAGUE_PATHS = {
  NFL:                'football/nfl',
  NCAAF:              'football/college-football',
  CFB:                'football/college-football',
  NBA:                'basketball/nba',
  WNBA:               'basketball/wnba',
  NCAAM:              'basketball/mens-college-basketball',
  NCAAW:              'basketball/womens-college-basketball',
  MLB:                'baseball/mlb',
  NHL:                'hockey/nhl',
  MLS:                'soccer/usa.1',
  EPL:                'soccer/eng.1',
  'PREMIER LEAGUE':   'soccer/eng.1',
  BUNDESLIGA:         'soccer/ger.1',
  'LA LIGA':          'soccer/esp.1',
  'SERIE A':          'soccer/ita.1',
  'LIGUE 1':          'soccer/fra.1'
};
const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports';
// Multiple free CORS proxies — try each until one works. corsproxy.io
// rate-limits per-host sometimes (e.g. MLB → 403), so we fall back.
const CORS_PROXIES = [
  (target) => `https://corsproxy.io/?url=${encodeURIComponent(target)}`,
  (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
  (target) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(target)}`,
];
const teamCache = new Map(); // leaguePath → teams array

// state.doc is the in-memory display model (nested by league/conference) used by
// render(); it is rebuilt from Supabase rows on load. state.leagueSort tracks
// the league_sort column per league name (preserves user ordering). Mutations
// update state.doc immediately and fire-and-forget a Supabase write.
// fileHandle/rawDoc track the "file mode" introduced for editing research/teams.json
// directly via the File System Access API. When fileHandle is set, color/name
// edits skip the Supabase write and are flushed to the file on Save instead.
// rawDoc holds the original flat { _ai_update_prompt, teams:[…] } structure so
// every non-color field (TGBID, EspnId, GeoName, VenueCity…) is preserved.
const state = { doc: null, leagueSort: new Map(), session: null, fileHandle: null, rawDoc: null };

const els = {
  root: document.getElementById('leaguesRoot'),
  topStatus: document.getElementById('topStatus'),
  bottomStatus: document.getElementById('bottomStatus'),
  reloadBtn: document.getElementById('reloadBtn'),
  lookupBtn: document.getElementById('lookupBtn'),
  exportBtn: document.getElementById('exportBtn'),
  openFileBtn: document.getElementById('openFileBtn'),
  saveFileBtn: document.getElementById('saveFileBtn'),
  loginBtn: document.getElementById('loginBtn'),

  lookupModal: document.getElementById('lookupModal'),
  lookupCloseBtn: document.getElementById('lookupCloseBtn'),
  lookupLeague: document.getElementById('lookupLeague'),
  lookupPullLeagueBtn: document.getElementById('lookupPullLeagueBtn'),
  lookupGroupField: document.getElementById('lookupGroupField'),
  lookupGroup: document.getElementById('lookupGroup'),
  lookupPullGroupBtn: document.getElementById('lookupPullGroupBtn'),
  lookupQuery: document.getElementById('lookupQuery'),
  lookupSearchBtn: document.getElementById('lookupSearchBtn'),
  lookupStatus: document.getElementById('lookupStatus'),
  lookupResults: document.getElementById('lookupResults'),
};

function setStatus(msg, { error = false } = {}) {
  const text = error ? `⚠ ${msg}` : msg;
  els.topStatus.textContent = text;
  els.bottomStatus.textContent = text;
}

// Legacy no-op — every change is persisted to Supabase synchronously now, so
// there is no "unsaved changes" concept any more. Kept so existing call sites
// (renameLeague, updateTeamField, etc.) continue to compile.
function markDirty() {}

function normalizeHex(value, fallback = '#000000') {
  if (!value) return fallback;
  const raw = String(value).trim();
  const candidate = raw.startsWith('#') ? raw : '#' + raw;
  const m = HEX_RE.exec(candidate);
  return m ? '#' + m[1].toUpperCase() : fallback;
}

function readPaletteValue(source, canonicalKey, legacyKey, colorKey) {
  if (!source || typeof source !== 'object') return '';
  return source[canonicalKey] || source[colorKey] || source[legacyKey] || '';
}

function hasTeamFields(value) {
  return !!value && typeof value === 'object' && (
    'fullName' in value || 'primary' in value || 'shell' in value
  );
}

function normalizeTeamPalette(team) {
  const normalized = { ...(team || {}) };
  normalized.primary = readPaletteValue(team, 'primary', 'shell', 'primary_color');
  normalized.secondary = readPaletteValue(team, 'secondary', 'stripe', 'secondary_color');
  normalized.tertiary = readPaletteValue(team, 'tertiary', 'mask', 'tertiary_color');
  delete normalized.shell;
  delete normalized.stripe;
  delete normalized.mask;
  return normalized;
}

function normalizeLeagueNode(node) {
  const out = {};
  Object.entries(node || {}).forEach(([key, value]) => {
    if (hasTeamFields(value)) out[key] = normalizeTeamPalette(value);
    else if (value && typeof value === 'object') out[key] = normalizeLeagueNode(value);
    else out[key] = value;
  });
  return out;
}

function normalizeDoc(doc) {
  if (!doc || typeof doc !== 'object') {
    return { _comment: 'Team color palettes by sport/league.', leagues: {} };
  }
  if (doc.leagues && typeof doc.leagues === 'object') {
    return { ...doc, leagues: normalizeLeagueNode(doc.leagues) };
  }
  if (Array.isArray(doc.teams)) {
    const normalized = {
      _comment: doc._comment || 'Team color palettes by sport/league.',
      leagues: {}
    };
    doc.teams.forEach((row) => {
      if (!row || typeof row !== 'object') return;
      const leagueName = row.league || row.League || '';
      const code = row.code || row.Code || row.EspnId || '';
      if (!leagueName || !code) return;
      if (!normalized.leagues[leagueName]) normalized.leagues[leagueName] = {};
      const team = {
        fullName: row.fullName || row.full_name || [row.GeoName, row.MascotName].filter(Boolean).join(' ') || '',
        firstName: row.firstName || row.first_name || row.GeoName || '',
        fanbase: row.fanbase || row.firstName || row.first_name || row.GeoName || '',
        mascot: row.mascot || row.MascotName || '',
        primary: readPaletteValue(row, 'primary', 'shell', 'primary_color'),
        secondary: readPaletteValue(row, 'secondary', 'stripe', 'secondary_color'),
        tertiary: readPaletteValue(row, 'tertiary', 'mask', 'tertiary_color')
      };
      if (row.sport) team.sport = row.sport;
      const conference = row.conference || row.Conference || '';
      if (conference) {
        if (!normalized.leagues[leagueName][conference]) normalized.leagues[leagueName][conference] = {};
        normalized.leagues[leagueName][conference][code] = team;
      } else {
        normalized.leagues[leagueName][code] = team;
      }
    });
    return normalized;
  }
  if (doc.league && doc.teams) {
    return {
      _comment: doc._comment || 'Team color palettes by sport/league.',
      leagues: normalizeLeagueNode({ [doc.league]: doc.teams })
    };
  }
  return { _comment: 'Team color palettes by sport/league.', leagues: {} };
}

// ── Helpers ──────────────────────────────────────────────────────────────

// A "team" object has a fullName/primary field; a "group" (e.g. conference) is an
// object whose values are teams. Used to disambiguate nested sub-leagues inside
// a league like NCAAF.
function isTeamObj(value) {
  return hasTeamFields(value);
}

// Resolve the dict that directly holds the team. groupName is '' for flat teams.
function getTeamBucket(leagueName, groupName) {
  const league = state.doc?.leagues?.[leagueName];
  if (!league) return null;
  if (groupName) return league[groupName] || null;
  return league;
}

function countTeamsIn(leagueObj) {
  if (!leagueObj || typeof leagueObj !== 'object') return 0;
  let total = 0;
  for (const value of Object.values(leagueObj)) {
    if (isTeamObj(value)) total++;
    else if (value && typeof value === 'object') total += Object.keys(value).filter(k => isTeamObj(value[k])).length;
  }
  return total;
}

function totalsSummary() {
  const leagueNames = Object.keys(state.doc?.leagues || {});
  const total = leagueNames.reduce((sum, k) => sum + countTeamsIn(state.doc.leagues[k]), 0);
  return `${total} team${total === 1 ? '' : 's'} across ${leagueNames.length} league${leagueNames.length === 1 ? '' : 's'}`;
}

// ── Supabase persistence ────────────────────────────────────────────────

function isSignedIn() {
  return !!(state.session && state.session.access_token);
}

function supaHeaders(extra = {}) {
  const token = isSignedIn() ? state.session.access_token : SB_CONFIG.key;
  return {
    apikey: SB_CONFIG.key,
    Authorization: 'Bearer ' + token,
    'Content-Type': 'application/json',
    ...extra
  };
}

function supaUrl(query = '') {
  return SB_BASE + (query ? '?' + query : '');
}

function rowsToDoc(rows) {
  // Build the nested { leagues: { L: { teams… or conferences{ teams… } } } }
  // shape the existing render code expects. Preserve league ordering using the
  // league_sort column (min over rows in a league wins).
  const doc = { _comment: 'Team color palettes by sport/league.', leagues: {} };
  const leagueSort = new Map();
  rows.forEach((r) => {
    if (!r || !r.league || !r.code) return;
    if (!doc.leagues[r.league]) doc.leagues[r.league] = {};
    const league = doc.leagues[r.league];
    const team = {
      fullName:  r.full_name  || '',
      firstName: r.first_name || '',
      fanbase:   r.fanbase    || '',
      mascot:    r.mascot     || '',
      primary:   readPaletteValue(r, 'primary', 'shell', 'primary_color'),
      secondary: readPaletteValue(r, 'secondary', 'stripe', 'secondary_color'),
      tertiary:  readPaletteValue(r, 'tertiary', 'mask', 'tertiary_color')
    };
    if (r.sport) team.sport = r.sport;
    if (r.conference) {
      if (!league[r.conference] || isTeamObj(league[r.conference])) league[r.conference] = {};
      league[r.conference][r.code] = team;
    } else {
      league[r.code] = team;
    }
    const prev = leagueSort.has(r.league) ? leagueSort.get(r.league) : Number.POSITIVE_INFINITY;
    const candidate = typeof r.league_sort === 'number' ? r.league_sort : LEAGUE_RANK(r.league);
    if (candidate < prev) leagueSort.set(r.league, candidate);
  });
  return { doc, leagueSort };
}

function teamToRow(leagueName, groupName, code, team, leagueSort, teamSort) {
  return {
    league: leagueName,
    conference: groupName || '',
    code,
    full_name:  team.fullName  || '',
    first_name: team.firstName || '',
    fanbase:    team.fanbase   || '',
    mascot:     team.mascot    || '',
    sport:      team.sport     || '',
    shell:      readPaletteValue(team, 'primary', 'shell', 'primary_color'),
    stripe:     readPaletteValue(team, 'secondary', 'stripe', 'secondary_color'),
    mask:       readPaletteValue(team, 'tertiary', 'mask', 'tertiary_color'),
    league_sort: typeof leagueSort === 'number' ? leagueSort : LEAGUE_RANK(leagueName),
    team_sort:   typeof teamSort   === 'number' ? teamSort   : 0
  };
}

async function readErrorText(resp) {
  try {
    const text = await resp.text();
    return text || `HTTP ${resp.status}`;
  } catch (err) {
    return `HTTP ${resp.status}`;
  }
}

async function supaFetchAll() {
  const url = supaUrl('select=*&order=league_sort.asc&order=team_sort.asc');
  const resp = await fetch(url, { headers: supaHeaders(), cache: 'no-store' });
  if (!resp.ok) throw new Error(await readErrorText(resp));
  return await resp.json();
}

function requireAuth(action) {
  if (isSignedIn()) return true;
  setStatus(`Sign in to ${action}.`, { error: true });
  return false;
}

// Upserts one team row (insert or update on PK conflict).
async function supaUpsertRow(row) {
  if (!requireAuth('save changes')) return false;
  const resp = await fetch(supaUrl(), {
    method: 'POST',
    headers: supaHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([row])
  });
  if (!resp.ok) {
    setStatus(`Save failed: ${await readErrorText(resp)}`, { error: true });
    return false;
  }
  return true;
}

async function supaUpsertRows(rows) {
  if (!requireAuth('save changes')) return false;
  if (!rows.length) return true;
  const resp = await fetch(supaUrl(), {
    method: 'POST',
    headers: supaHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(rows)
  });
  if (!resp.ok) {
    setStatus(`Bulk save failed: ${await readErrorText(resp)}`, { error: true });
    return false;
  }
  return true;
}

async function supaDeleteRow(leagueName, groupName, code) {
  if (!requireAuth('delete teams')) return false;
  const q = `league=eq.${encodeURIComponent(leagueName)}`
          + `&conference=eq.${encodeURIComponent(groupName || '')}`
          + `&code=eq.${encodeURIComponent(code)}`;
  const resp = await fetch(supaUrl(q), { method: 'DELETE', headers: supaHeaders() });
  if (!resp.ok) {
    setStatus(`Delete failed: ${await readErrorText(resp)}`, { error: true });
    return false;
  }
  return true;
}

// Bulk rename a column value across a set of rows. Used for renaming a league
// or conference (which are part of the PK, so we can't just PATCH them — we
// re-insert the rows with the new key and delete the old ones).
async function supaRenameRows(filter, patch) {
  if (!requireAuth('rename')) return false;
  const q = Object.entries(filter).map(([k, v]) => `${k}=eq.${encodeURIComponent(v)}`).join('&');
  const resp = await fetch(supaUrl(q), {
    method: 'PATCH',
    headers: supaHeaders({ Prefer: 'return=minimal' }),
    body: JSON.stringify(patch)
  });
  if (!resp.ok) {
    setStatus(`Rename failed: ${await readErrorText(resp)}`, { error: true });
    return false;
  }
  return true;
}

async function loadFromSupabase() {
  setStatus('Loading…');
  try {
    const rows = await supaFetchAll();
    const { doc, leagueSort } = rowsToDoc(rows);
    state.doc = doc;
    state.leagueSort = leagueSort;
    render();
    setStatus(totalsSummary() + ' · Supabase');
    return true;
  } catch (err) {
    setStatus(`Supabase load failed (${err.message}). Falling back to research/teams.json.`, { error: true });
    await loadFromJsonFallback();
    return false;
  }
}

async function loadFromJsonFallback() {
  try {
    const resp = await fetch(JSON_PATH, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    state.doc = normalizeDoc(await resp.json());
    state.leagueSort = new Map(Object.keys(state.doc.leagues).map((k, i) => [k, LEAGUE_RANK(k) + i]));
    render();
    setStatus(totalsSummary() + ' · research/teams.json (offline)');
  } catch (err) {
    setStatus(`Could not fetch ${JSON_PATH} (${err.message}).`, { error: true });
    state.doc = normalizeDoc(null);
    state.leagueSort = new Map();
    render();
  }
}

// ── Export JSON (refresh the offline fallback file) ─────────────────────

const serialize = () => JSON.stringify(state.doc, null, 2) + '\n';

async function exportJson() {
  if (!state.doc) return;
  const text = serialize();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'teams.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      setStatus(`Exported to ${handle.name}`);
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      setStatus(`Export failed: ${err.message}`, { error: true });
    }
  }
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'teams.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Downloaded teams.json — use it to refresh research/teams.json.');
}

// ── File mode: edit research/teams.json in place (File System Access API) ───────
// When a file is open we edit the actual research/teams.json. Color/name edits live
// in state.doc and are merged back into state.rawDoc.teams (the canonical flat
// array) on Save, so every other field on each row is preserved verbatim.

function isFileMode() {
  return !!state.fileHandle;
}

async function ensureRWPermission(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if ((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}

async function openTeamsFile() {
  if (!window.showOpenFilePicker) {
    setStatus('File editing needs the File System Access API — use Chrome or Edge on desktop.', { error: true });
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      multiple: false,
      excludeAcceptAllOption: false
    });
    const file = await handle.getFile();
    const parsed = JSON.parse(await file.text());
    if (!Array.isArray(parsed.teams)) {
      setStatus(`${handle.name} has no "teams" array — pick the flat research/teams.json file.`, { error: true });
      return;
    }
    state.fileHandle = handle;
    state.rawDoc = parsed;
    state.doc = normalizeDoc(parsed);
    state.leagueSort = new Map(Object.keys(state.doc.leagues).map((k, i) => [k, LEAGUE_RANK(k) + i]));
    els.saveFileBtn.disabled = false;
    render();
    setStatus(`Editing ${handle.name} · ${totalsSummary()} · file mode (edits save back to the file)`);
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    setStatus(`Open failed: ${err.message}`, { error: true });
  }
}

// Merge the in-memory edits back onto the original flat array, matching rows by
// League + code. Only the editable color/name fields are overwritten; the row
// is spread first so untouched keys (TGBID, EspnId, GeoName, VenueCity, sport,
// paletteSource, …) and their order survive. Rows with no matching card are
// left exactly as they were.
function buildArrayDocFromEdits() {
  if (!state.rawDoc || !Array.isArray(state.rawDoc.teams)) return null;
  const nested = new Map();
  for (const [leagueName, leagueObj] of Object.entries(state.doc.leagues || {})) {
    const { groups, flatTeams } = partitionLeagueEntries(leagueObj);
    const key = (code) => leagueName.toUpperCase() + '::' + String(code).toUpperCase();
    for (const { code, team } of flatTeams) nested.set(key(code), team);
    for (const { teams } of groups) {
      for (const code of Object.keys(teams)) nested.set(key(code), teams[code]);
    }
  }
  const out = { ...state.rawDoc };
  out.teams = state.rawDoc.teams.map((row) => {
    if (!row || typeof row !== 'object') return row;
    const leagueName = String(row.League || row.league || '').toUpperCase();
    const code = String(row.code || '').toUpperCase();
    const team = nested.get(leagueName + '::' + code);
    if (!team) return row;
    return {
      ...row,
      fullName:  team.fullName  != null ? team.fullName  : row.fullName,
      firstName: team.firstName != null ? team.firstName : row.firstName,
      fanbase:   team.fanbase   != null ? team.fanbase   : row.fanbase,
      mascot:    team.mascot    != null ? team.mascot    : row.mascot,
      primary:   normalizeHex(team.primary,   row.primary),
      secondary: normalizeHex(team.secondary, row.secondary),
      tertiary:  normalizeHex(team.tertiary,  row.tertiary)
    };
  });
  return out;
}

async function saveTeamsFile() {
  if (!state.fileHandle) { setStatus('Open research/teams.json first (Open File).', { error: true }); return; }
  const doc = buildArrayDocFromEdits();
  if (!doc) { setStatus('Nothing to save — the open file had no teams array.', { error: true }); return; }
  if (!(await ensureRWPermission(state.fileHandle))) {
    setStatus('Write permission denied for the file.', { error: true });
    return;
  }
  try {
    const writable = await state.fileHandle.createWritable();
    await writable.write(JSON.stringify(doc, null, 2) + '\n');
    await writable.close();
    state.rawDoc = doc;
    setStatus(`Saved ${doc.teams.length} teams → ${state.fileHandle.name}`);
  } catch (err) {
    setStatus(`Save failed: ${err.message}`, { error: true });
  }
}

// ── Mutations ────────────────────────────────────────────────────────────

async function renameLeague(oldName, newNameRaw) {
  const newName = (newNameRaw || '').trim().toUpperCase();
  if (!newName || newName === oldName) return;
  if (state.doc.leagues[newName]) { setStatus(`League "${newName}" already exists.`, { error: true }); render(); return; }
  if (!requireAuth('rename a league')) { render(); return; }
  const ok = await supaRenameRows({ league: oldName }, { league: newName });
  if (!ok) { render(); return; }
  const rebuilt = {};
  for (const k of Object.keys(state.doc.leagues)) {
    rebuilt[k === oldName ? newName : k] = state.doc.leagues[k];
  }
  state.doc.leagues = rebuilt;
  if (state.leagueSort.has(oldName)) {
    state.leagueSort.set(newName, state.leagueSort.get(oldName));
    state.leagueSort.delete(oldName);
  }
  setStatus(`Renamed league ${oldName} → ${newName}`);
  render();
}

async function removeTeam(leagueName, groupName, code) {
  const bucket = getTeamBucket(leagueName, groupName);
  if (!bucket) return;
  if (!requireAuth('delete teams')) return;
  const ok = await supaDeleteRow(leagueName, groupName, code);
  if (!ok) return;
  delete bucket[code];
  setStatus(`Deleted ${code}`);
  render();
}

async function renameTeam(leagueName, groupName, oldCode, newCodeRaw) {
  const newCode = (newCodeRaw || '').trim().toUpperCase();
  if (!newCode || newCode === oldCode) return;
  const bucket = getTeamBucket(leagueName, groupName);
  if (!bucket) return;
  if (bucket[newCode]) {
    const where = groupName ? `${leagueName} / ${groupName}` : leagueName;
    setStatus(`Code "${newCode}" already used in ${where}.`, { error: true });
    render();
    return;
  }
  if (!requireAuth('rename a team')) { render(); return; }
  const ok = await supaRenameRows(
    { league: leagueName, conference: groupName || '', code: oldCode },
    { code: newCode }
  );
  if (!ok) { render(); return; }
  const rebuilt = {};
  for (const k of Object.keys(bucket)) {
    rebuilt[k === oldCode ? newCode : k] = bucket[k];
  }
  if (groupName) state.doc.leagues[leagueName][groupName] = rebuilt;
  else state.doc.leagues[leagueName] = rebuilt;
  setStatus(`Renamed ${oldCode} → ${newCode}`);
  render();
}

async function renameGroup(leagueName, oldGroup, newGroupRaw) {
  const newGroup = (newGroupRaw || '').trim();
  if (!newGroup || newGroup === oldGroup) return;
  const league = state.doc.leagues[leagueName];
  if (!league) return;
  if (league[newGroup]) { setStatus(`Group "${newGroup}" already exists in ${leagueName}.`, { error: true }); render(); return; }
  if (!requireAuth('rename a conference')) { render(); return; }
  const ok = await supaRenameRows(
    { league: leagueName, conference: oldGroup },
    { conference: newGroup }
  );
  if (!ok) { render(); return; }
  const rebuilt = {};
  for (const k of Object.keys(league)) {
    rebuilt[k === oldGroup ? newGroup : k] = league[k];
  }
  state.doc.leagues[leagueName] = rebuilt;
  setStatus(`Renamed conference ${oldGroup} → ${newGroup}`);
  render();
}

function cardSelector(leagueName, groupName, code) {
  return `[data-team-card="${leagueName}::${groupName}::${code}"]`;
}

// Patch a single column on one row. Maps the in-memory camelCase key (fullName,
// firstName, etc.) to the snake_case column name when needed.
const FIELD_TO_COLUMN = {
  fullName: 'full_name',
  firstName: 'first_name',
  fanbase: 'fanbase',
  mascot: 'mascot',
  sport: 'sport',
  primary: 'shell',
  secondary: 'stripe',
  tertiary: 'mask',
  shell: 'shell',
  stripe: 'stripe',
  mask: 'mask'
};

async function persistTeamField(leagueName, groupName, code, field, value) {
  const column = FIELD_TO_COLUMN[field];
  if (!column) return false;
  // File mode: state.doc already holds the edit; it is flushed to the file on
  // Save, so skip the Supabase write entirely (and don't require sign-in).
  if (isFileMode()) return true;
  if (!requireAuth('save changes')) return false;
  const q = `league=eq.${encodeURIComponent(leagueName)}`
          + `&conference=eq.${encodeURIComponent(groupName || '')}`
          + `&code=eq.${encodeURIComponent(code)}`;
  const resp = await fetch(supaUrl(q), {
    method: 'PATCH',
    headers: supaHeaders({ Prefer: 'return=minimal' }),
    body: JSON.stringify({ [column]: value || '' })
  });
  if (!resp.ok) {
    setStatus(`Save failed: ${await readErrorText(resp)}`, { error: true });
    return false;
  }
  return true;
}

function updateTeamField(leagueName, groupName, code, field, value) {
  const bucket = getTeamBucket(leagueName, groupName);
  const team = bucket && bucket[code];
  if (!team) return;
  team[field] = value;
  const where = groupName ? `${leagueName} / ${groupName} / ${code}` : `${leagueName} / ${code}`;
  setStatus(`Edited ${where}`);
  // Fire-and-forget — the call site has already updated the DOM. If the write
  // fails, persistTeamField surfaces the error via setStatus.
  persistTeamField(leagueName, groupName, code, field, value);
}

function updateColor(leagueName, groupName, code, role, rawValue) {
  const normalized = normalizeHex(rawValue, null);
  if (!normalized) { setStatus(`Invalid hex "${rawValue}" for ${code}/${role}`, { error: true }); return false; }
  updateTeamField(leagueName, groupName, code, role, normalized);
  const card = document.querySelector(cardSelector(leagueName, groupName, code));
  const bucket = getTeamBucket(leagueName, groupName);
  if (card && bucket) {
    const swatchEl = card.querySelector(`[data-swatch-role="${role}"]`);
    if (swatchEl) swatchEl.style.background = normalized;
    const picker = card.querySelector(`[data-color-picker="${role}"]`);
    if (picker) picker.value = normalized;
    const textInput = card.querySelector(`[data-color-text="${role}"]`);
    if (textInput) textInput.value = normalized;
    refreshHelmet(card, bucket[code]);
  }
  return true;
}

// Dispatch to the right SVG generator based on a team's sport.
function teamMarkSVG(sport, primary, secondary, tertiary) {
  switch ((sport || 'football').toLowerCase()) {
    case 'basketball':
      if (typeof window.basketballSVG === 'function') return window.basketballSVG(primary, secondary, tertiary);
      break;
    case 'baseball':
      if (typeof window.baseballSVG === 'function') return window.baseballSVG(primary, secondary, tertiary);
      break;
  }
  return typeof window.helmetSVG === 'function' ? window.helmetSVG(primary, secondary, tertiary) : null;
}

function refreshHelmet(card, team) {
  const img = card && card.querySelector('[data-helmet]');
  if (!img) return;
  const primary = readPaletteValue(team, 'primary', 'shell', 'primary_color') || '#000000';
  const secondary = readPaletteValue(team, 'secondary', 'stripe', 'secondary_color') || '#FFFFFF';
  const tertiary = readPaletteValue(team, 'tertiary', 'mask', 'tertiary_color') || '#AAAAAA';
  const src = teamMarkSVG(team.sport, primary, secondary, tertiary);
  if (src) img.src = src;
}

function syncRoleUI(card, team, role) {
  const value = team[role] || '';
  const swatchEl = card.querySelector(`[data-swatch-role="${role}"]`);
  if (swatchEl) swatchEl.style.background = value;
  const picker = card.querySelector(`[data-color-picker="${role}"]`);
  if (picker && value) picker.value = value;
  const textInput = card.querySelector(`[data-color-text="${role}"]`);
  if (textInput) textInput.value = value;
}

async function swapColorRoles(leagueName, groupName, code, roleA, roleB) {
  const bucket = getTeamBucket(leagueName, groupName);
  const team = bucket && bucket[code];
  if (!team) return;
  if (!isFileMode() && !requireAuth('swap colors')) return;
  const tmp = team[roleA];
  team[roleA] = team[roleB];
  team[roleB] = tmp;

  const card = document.querySelector(cardSelector(leagueName, groupName, code));
  if (card) {
    syncRoleUI(card, team, roleA);
    syncRoleUI(card, team, roleB);
    refreshHelmet(card, team);
  }
  const where = groupName ? `${leagueName} / ${groupName} / ${code}` : `${leagueName} / ${code}`;

  // File mode: the swap lives in state.doc; flushed to the file on Save.
  if (isFileMode()) { setStatus(`Swapped ${roleA.toUpperCase()} ↔ ${roleB.toUpperCase()} on ${where} · Save to file`); return; }

  const q = `league=eq.${encodeURIComponent(leagueName)}`
          + `&conference=eq.${encodeURIComponent(groupName || '')}`
          + `&code=eq.${encodeURIComponent(code)}`;
  const patch = {};
  patch[FIELD_TO_COLUMN[roleA] || roleA] = team[roleA] || '';
  patch[FIELD_TO_COLUMN[roleB] || roleB] = team[roleB] || '';
  const resp = await fetch(supaUrl(q), {
    method: 'PATCH',
    headers: supaHeaders({ Prefer: 'return=minimal' }),
    body: JSON.stringify(patch)
  });
  if (!resp.ok) {
    setStatus(`Swap save failed for ${where}: ${await readErrorText(resp)}`, { error: true });
    return;
  }
  setStatus(`Swapped ${roleA.toUpperCase()} ↔ ${roleB.toUpperCase()} on ${where}`);
}

function flipPrimarySecondary(leagueName, groupName, code) {
  swapColorRoles(leagueName, groupName, code, 'primary', 'secondary');
}

function render() {
  els.root.innerHTML = '';

    if (a === 'NFL') return -1;
    if (b === 'NFL') return 1;
    return a.localeCompare(b);
  });

    empty.textContent = 'No leagues yet. Click "Add Colors" to pull one in.';
    els.root.appendChild(empty);

  for (const leagueName of leagueNames) {
    els.root.appendChild(renderLeague(leagueName, state.doc.leagues[leagueName]));
  }
}

// Split a league's entries into nested groups (e.g. conferences) and flat
// teams, preserving the JSON order so manually arranged orderings survive.
function partitionLeagueEntries(leagueObj) {
  const groups = [];   // [{ name, teams }]
  const flatTeams = []; // [{ code, team }]
  for (const key of Object.keys(leagueObj || {})) {
    const value = leagueObj[key];
    if (isTeamObj(value)) flatTeams.push({ code: key, team: value });
    else if (value && typeof value === 'object') groups.push({ name: key, teams: value });
  }
  return { groups, flatTeams };
}

function renderLeague(leagueName, leagueObj) {
  const section = document.createElement('section');
  section.className = 'league';

  const head = document.createElement('div');
  head.className = 'league-head';

  const name = document.createElement('h2');
  name.className = 'league-name';
  name.textContent = leagueName;
  name.contentEditable = 'true';
  name.spellcheck = false;
  name.addEventListener('blur', () => renameLeague(leagueName, name.textContent));
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
  head.appendChild(name);

  const count = document.createElement('span');
  count.className = 'league-count';
  count.textContent = `${countTeamsIn(leagueObj)} TEAMS`;
  head.appendChild(count);

  section.appendChild(head);

  const { groups, flatTeams } = partitionLeagueEntries(leagueObj);

  // Render each nested group (conference) as its own labeled sub-section.
  for (const { name: groupName, teams } of groups) {
    section.appendChild(renderGroup(leagueName, groupName, teams));
  }

  // Render any flat teams (e.g. non-FBS teams in NCAAF) in a plain grid.
  if (flatTeams.length) {
    if (groups.length) {
      const flatHead = document.createElement('div');
      flatHead.className = 'league-head';
      flatHead.style.marginTop = '18px';
      const flatTitle = document.createElement('h3');
      flatTitle.className = 'league-name';
      flatTitle.style.fontSize = '1.4rem';
      flatTitle.textContent = 'Unsorted';
      flatHead.appendChild(flatTitle);
      const flatCount = document.createElement('span');
      flatCount.className = 'league-count';
      flatCount.textContent = `${flatTeams.length} TEAMS`;
      flatHead.appendChild(flatCount);
      section.appendChild(flatHead);
    }
    const grid = document.createElement('div');
    grid.className = 'team-grid';
    const sorted = [...flatTeams].sort((a, b) => a.code.localeCompare(b.code));
    for (const { code, team } of sorted) {
      grid.appendChild(renderTeam(leagueName, '', code, team));
    }
    section.appendChild(grid);
  }

  return section;
}

function renderGroup(leagueName, groupName, teams) {
  const wrap = document.createElement('div');
  wrap.className = 'league-group';
  wrap.style.marginTop = '18px';

  const head = document.createElement('div');
  head.className = 'league-head';

  const name = document.createElement('h3');
  name.className = 'league-name';
  name.style.fontSize = '1.4rem';
  name.textContent = groupName;
  name.contentEditable = 'true';
  name.spellcheck = false;
  name.addEventListener('blur', () => renameGroup(leagueName, groupName, name.textContent));
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
  head.appendChild(name);

  const count = document.createElement('span');
  count.className = 'league-count';
  count.textContent = `${Object.keys(teams).length} TEAMS`;
  head.appendChild(count);

  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'team-grid';
  const codes = Object.keys(teams).sort();

function buildLabeledInput(label, value, onChange) {
  const wrap = document.createElement('label');
  const lbl = document.createElement('div');
  lbl.className = 'field-mini-label';
  lbl.textContent = label;
  const input = document.createElement('input');
  input.className = 'team-sub-input';
  input.type = 'text';
  input.value = value;
  input.placeholder = label;
  input.addEventListener('input', () => onChange(input.value));
  wrap.appendChild(lbl);
  wrap.appendChild(input);
  return wrap;
}

function buildColorRow(leagueName, groupName, code, role, label, value) {
  const row = document.createElement('div');
  row.className = 'color-row';
  row.dataset.colorRow = role;
  const teamKey = `${leagueName}::${groupName}::${code}`;

  const handle = document.createElement('span');
  handle.className = 'color-drag-handle';
  handle.draggable = true;
  handle.title = 'Drag onto another color row to swap';
  handle.textContent = '⋮⋮';
  handle.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/role', role);
    e.dataTransfer.setData('text/team', teamKey);
    e.dataTransfer.effectAllowed = 'move';
    row.classList.add('is-dragging');
  });
  handle.addEventListener('dragend', () => row.classList.remove('is-dragging'));

  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    row.classList.add('is-drop-target');
  });
  row.addEventListener('dragleave', () => row.classList.remove('is-drop-target'));
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    row.classList.remove('is-drop-target');
    const sourceRole = e.dataTransfer.getData('text/role');
    const sourceTeam = e.dataTransfer.getData('text/team');
    if (sourceTeam !== teamKey) return;
    if (!sourceRole || sourceRole === role) return;
    swapColorRoles(leagueName, groupName, code, sourceRole, role);
  });

  const picker = document.createElement('input');
  picker.type = 'color';
  picker.value = normalizeHex(value);
  picker.dataset.colorPicker = role;
  picker.addEventListener('input', () => updateColor(leagueName, groupName, code, role, picker.value));

  const text = document.createElement('input');
  text.type = 'text';
  text.value = normalizeHex(value);
  text.dataset.colorText = role;
  text.addEventListener('change', () => updateColor(leagueName, groupName, code, role, text.value));
  text.addEventListener('blur', () => { text.value = normalizeHex(text.value, text.value); });

  const roleLabel = document.createElement('span');
  roleLabel.className = 'role';
  roleLabel.textContent = label;

  row.appendChild(handle);
  row.appendChild(picker);
  row.appendChild(text);
  row.appendChild(roleLabel);
  return row;
}

function populateLookupLeagueSelect() {
  const select = els.lookupLeague;
  select.innerHTML = '';
  const seen = new Set();
  // Show existing leagues first, then known catalog (deduped)
  const inDoc = Object.keys(state.doc?.leagues || {}).filter(k => LEAGUE_PATHS[k]);
  const allKeys = Object.keys(LEAGUE_PATHS);
  const ordered = [...inDoc.sort(), ...allKeys.filter(k => !inDoc.includes(k))];
  for (const code of ordered) {
    if (seen.has(code)) continue;
    seen.add(code);
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = code;
    select.appendChild(opt);

}

// Returns the conference/group names currently nested under a league, in their
// existing JSON order. Empty when the league is flat (e.g. NFL, MLB).
function getLeagueGroups(leagueName) {
  const league = state.doc?.leagues?.[leagueName];
  if (!league) return [];
  return Object.keys(league).filter((key) => !isTeamObj(league[key]));
}

function populateLookupGroupSelect() {

async function fetchViaProxies(target) {
  const errors = [];
  for (const build of CORS_PROXIES) {
    const url = build(target);
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) { errors.push(`${new URL(url).host} → HTTP ${resp.status}`); continue; }
      return await resp.json();
    } catch (err) {
      errors.push(`${new URL(url).host} → ${err.message}`);
    }
  }
  throw new Error(errors.join(' · '));
}

async function fetchTeams(leaguePath) {
  if (teamCache.has(leaguePath)) return teamCache.get(leaguePath);
  const target = `${ESPN_BASE}/${leaguePath}/teams?limit=900`;
  const data = await fetchViaProxies(target);
  const teams = [];
  for (const sport of data.sports || []) {
    for (const league of sport.leagues || []) {
      for (const entry of league.teams || []) {
        const team = entry.team || entry;
        if (team) teams.push(team);
      }
    }
  }
  teamCache.set(leaguePath, teams);
  return teams;
}

function matchTeams(teams, query) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const fields = ['displayName', 'name', 'shortDisplayName', 'abbreviation', 'nickname', 'location'];
  const exact = teams.filter(t => fields.some(f => (t[f] || '').toLowerCase() === q));
  if (exact.length) return exact;
  return teams.filter(t => fields.some(f => (t[f] || '').toLowerCase().includes(q)));
}

function generateFallbackCode(fullName) {
  const name = (fullName || '').trim();
  if (!name) return '';
  const words = name.split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[words.length - 1].slice(0, 3)).toUpperCase();
  return name.slice(0, 4).toUpperCase();
}

function teamCode(team) {
  const code = (team.abbreviation || '').toUpperCase().trim();
  if (code) return code;
  return generateFallbackCode(team.displayName || team.name || '');
}

// Maps a league code to the sport whose SVG mark we render for its teams.
const LEAGUE_SPORTS = {
  NFL: 'football', NCAAF: 'football', CFB: 'football',
  NBA: 'basketball', WNBA: 'basketball', NCAAM: 'basketball', NCAAW: 'basketball',
  MLB: 'baseball',
  NHL: 'hockey',
  MLS: 'soccer', EPL: 'soccer', 'PREMIER LEAGUE': 'soccer',
  BUNDESLIGA: 'soccer', 'LA LIGA': 'soccer', 'SERIE A': 'soccer', 'LIGUE 1': 'soccer',
};

function buildTeamRecord(team, leagueCode) {
  const fullName = team.displayName || team.name || '';
  const location = team.location || fullName.split(' ').slice(0, -1).join(' ') || fullName;
  const mascot = team.name || team.nickname || fullName.split(' ').slice(-1)[0] || fullName;
  const record = {
    fullName,
    firstName: location,
    fanbase: location,
    mascot,
    primary: normalizeHex(team.color, '#000000'),
    secondary: normalizeHex(team.alternateColor, '#FFFFFF'),
    tertiary: '#FFFFFF'
  };
  const sport = LEAGUE_SPORTS[leagueCode];
  if (sport) record.sport = sport;
  return record;
}

async function runLookup() {
  const leagueCode = els.lookupLeague.value;
  const path = LEAGUE_PATHS[leagueCode];
  const query = (els.lookupQuery.value || '').trim();
  if (!path) { els.lookupStatus.textContent = 'Pick a league.'; return; }
  if (!query) { els.lookupStatus.textContent = 'Type a team name.'; return; }
  els.lookupStatus.textContent = `Searching ${leagueCode} on ESPN…`;
  els.lookupResults.innerHTML = '';
  els.lookupSearchBtn.disabled = true;
  try {
    const teams = await fetchTeams(path);
    const matches = matchTeams(teams, query);
    if (!matches.length) {
      els.lookupStatus.textContent = `No matches for "${query}" in ${leagueCode}.`;
      return;
    }
    els.lookupStatus.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'} — pick one to add.`;
    for (const team of matches.slice(0, 12)) renderLookupResult(leagueCode, team);
    if (matches.length > 12) {
      const more = document.createElement('div');
      more.className = 'modal-status';
      more.textContent = `+${matches.length - 12} more — refine your search.`;
      els.lookupResults.appendChild(more);
    }
  } catch (err) {
    els.lookupStatus.textContent = `Lookup failed: ${err.message}`;
  } finally {
    els.lookupSearchBtn.disabled = false;
  }
}

function renderLookupResult(leagueCode, team) {
  const card = document.createElement('div');
  card.className = 'result-card';

  const info = document.createElement('div');

  const name = document.createElement('div');

async function addTeamFromLookup(leagueCode, groupName, team) {
  if (!requireAuth('add teams')) return;
  if (!state.doc.leagues[leagueCode]) state.doc.leagues[leagueCode] = {};
  const league = state.doc.leagues[leagueCode];
  if (groupName) {
    if (!league[groupName] || isTeamObj(league[groupName])) league[groupName] = {};
  }
  const bucket = groupName ? league[groupName] : league;
  let code = teamCode(team);
  if (!code) {
    code = (prompt('No code from ESPN. Team code?') || '').trim().toUpperCase();
    if (!code) return;
  }
  const where = groupName ? `${leagueCode} / ${groupName}` : leagueCode;
  if (bucket[code] && !confirm(`${where} / ${code} already exists. Overwrite?`)) return;
  const record = buildTeamRecord(team, leagueCode);
  const leagueSort = state.leagueSort.get(leagueCode);
  const teamSort = countTeamsIn(state.doc.leagues[leagueCode]);
  const ok = await supaUpsertRow(teamToRow(leagueCode, groupName, code, record, leagueSort, teamSort));
  if (!ok) return;
  bucket[code] = record;
  render();
  setStatus(`Added ${where} / ${code}.`);
  closeLookupModal();
}

const PULL_BATCH_SIZE = 50;

async function pullWholeLeague(leagueCode, groupName) {
  const path = LEAGUE_PATHS[leagueCode];
  if (!path) return;
  if (!requireAuth('pull a league')) return;
  const where = groupName ? `${leagueCode} / ${groupName}` : leagueCode;
  els.lookupStatus.textContent = `Fetching all ${where} teams from ESPN…`;
  els.lookupResults.innerHTML = '';
  els.lookupSearchBtn.disabled = true;
  els.lookupPullLeagueBtn.disabled = true;
  els.lookupPullGroupBtn.disabled = true;
  try {
    const teams = await fetchTeams(path);
    if (!teams.length) { els.lookupStatus.textContent = `No teams returned for ${leagueCode}.`; return; }
    if (!state.doc.leagues[leagueCode]) state.doc.leagues[leagueCode] = {};
    const league = state.doc.leagues[leagueCode];
    if (groupName) {
      if (!league[groupName] || isTeamObj(league[groupName])) league[groupName] = {};
    }
    const bucket = groupName ? league[groupName] : league;
    const existingCount = countTeamsIn(bucket);
    if (existingCount && !confirm(`${where} already has ${existingCount} team(s). Merge ${teams.length} from ESPN?`)) {
      els.lookupStatus.textContent = 'Cancelled.';
      return;
    }
    closeLookupModal();

    const leagueSort = state.leagueSort.has(leagueCode)
      ? state.leagueSort.get(leagueCode)
      : LEAGUE_RANK(leagueCode);
    if (!state.leagueSort.has(leagueCode)) state.leagueSort.set(leagueCode, leagueSort);

    const usedCodes = new Set();
    let added = 0, suffixed = 0;
    let teamSortStart = countTeamsIn(state.doc.leagues[leagueCode]);

    for (let batchStart = 0; batchStart < teams.length; batchStart += PULL_BATCH_SIZE) {
      const batchEnd = Math.min(batchStart + PULL_BATCH_SIZE, teams.length);
      const batchRows = [];
      for (let i = batchStart; i < batchEnd; i++) {
        const team = teams[i];
        const base = teamCode(team);
        if (!base) continue;
        let code = base;
        let n = 2;
        while (usedCodes.has(code)) code = `${base}${n++}`;
        if (code !== base) suffixed++;
        usedCodes.add(code);
        const record = buildTeamRecord(team, leagueCode);
        bucket[code] = record;
        batchRows.push(teamToRow(leagueCode, groupName, code, record, leagueSort, teamSortStart + added));
        added++;
      }
      render();
      const ok = await supaUpsertRows(batchRows);
      if (!ok) return;

      if (batchEnd < teams.length) {
        const remaining = teams.length - batchEnd;
        const next = Math.min(PULL_BATCH_SIZE, remaining);
        setStatus(`${added} of ${teams.length} ${where} teams added — waiting on you to continue…`);
        // Let the browser paint the new cards before the blocking confirm() pops.
        await new Promise(requestAnimationFrame);
        const keepGoing = confirm(`Added ${added} of ${teams.length} ${where} teams.\n\nPull the next ${next}?`);
        if (!keepGoing) {
          const parts = [`Stopped at ${added} of ${teams.length} ${where} teams`];
          if (suffixed) parts.push(`${suffixed} renamed to dodge collisions`);
          setStatus(parts.join(' · '));
          return;
        }
      }
    }

    const parts = [`ESPN returned ${teams.length} team${teams.length === 1 ? '' : 's'}`];
    parts.push(`${added} added to ${where}`);
    if (suffixed) parts.push(`${suffixed} renamed to dodge collisions`);
    setStatus(parts.join(' · '));
  } catch (err) {
    els.lookupStatus.textContent = `Pull failed: ${err.message}`;
  } finally {
    els.lookupSearchBtn.disabled = false;
    els.lookupPullLeagueBtn.disabled = false;
    els.lookupPullGroupBtn.disabled = false;
  }
}

// ── Wire-up ──────────────────────────────────────────────────────────────

const navAdminMenu = document.getElementById('navAdminMenu');
const navLoginBtn = document.getElementById('navLoginBtn');
const navAdminMenuPanel = document.getElementById('navAdminMenuPanel');
const navAdminSignOutBtn = document.getElementById('navAdminSignOutBtn');
let navAdminAuthorized = false;

function setNavAdminMenuOpen(isOpen) {
  if (!navLoginBtn || !navAdminMenuPanel) return;
  const shouldOpen = Boolean(isOpen && navAdminAuthorized);
  navAdminMenuPanel.hidden = !shouldOpen;
  navLoginBtn.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
}

function setNavAdminAuthorized(isAuthorized) {
  navAdminAuthorized = Boolean(isAuthorized);
  if (navLoginBtn) navLoginBtn.textContent = navAdminAuthorized ? 'Mission Control' : 'Login';
  setNavAdminMenuOpen(false);
}

const adminAuth = window.TgbMcAdminAuth ? window.TgbMcAdminAuth.create({
  supabaseConfig: { url: SB_CONFIG.url, publishableKey: SB_CONFIG.key },
  signOutButton: els.loginBtn,
  modalCopy: 'Sign in to edit team colors.',
  initialMessage: '',
  homeHref: '../../../index.html',
  onAuthorized: function () {
    els.loginBtn.textContent = 'Sign Out';
    setNavAdminAuthorized(true);
    state.session = adminAuth.getSession();
    loadFromSupabase();
  },
  onSignedOut: function () {
    els.loginBtn.textContent = 'Login';
    setNavAdminAuthorized(false);
    state.session = null;
    setStatus('Signed out — readonly mode.');
  }
}) : null;

if (adminAuth) {
  if (navLoginBtn) {
    navLoginBtn.addEventListener('click', () => {
      if (navAdminAuthorized) {
        setNavAdminMenuOpen(navAdminMenuPanel && navAdminMenuPanel.hidden);
      } else {
        adminAuth.showAuth();
      }
    });
  }
  if (navAdminSignOutBtn) {
    navAdminSignOutBtn.addEventListener('click', () => {
      setNavAdminMenuOpen(false);
      adminAuth.signOut({ silent: true });
    });
  }
  document.addEventListener('click', (event) => {
    if (!navAdminMenu || navAdminMenu.contains(event.target)) return;
    setNavAdminMenuOpen(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') setNavAdminMenuOpen(false);
  });
  adminAuth.init().then((signedIn) => {
    if (signedIn) {
      setNavAdminAuthorized(true);
      state.session = adminAuth.getSession();
      loadFromSupabase();
    } else {
      adminAuth.close();
      setNavAdminAuthorized(false);
      // Still show the catalog in read-only mode using anon read access.
      loadFromSupabase();
    }
  });
} else {
  loadFromJsonFallback();
}

els.reloadBtn.addEventListener('click', () => {
  if (isSignedIn()) loadFromSupabase();
  else loadFromJsonFallback();
});
els.lookupBtn.addEventListener('click', () => openLookupModal());
els.lookupCloseBtn.addEventListener('click', closeLookupModal);
els.lookupModal.addEventListener('click', (e) => { if (e.target === els.lookupModal) closeLookupModal(); });
els.lookupSearchBtn.addEventListener('click', runLookup);
els.lookupPullLeagueBtn.addEventListener('click', () => pullWholeLeague(els.lookupLeague.value, ''));
els.lookupPullGroupBtn.addEventListener('click', () => pullWholeLeague(els.lookupLeague.value, els.lookupGroup.value));
els.lookupLeague.addEventListener('change', syncLookupLeagueLabel);
els.lookupQuery.addEventListener('keydown', (e) => { if (e.key === 'Enter') runLookup(); });
els.exportBtn.addEventListener('click', exportJson);
els.openFileBtn.addEventListener('click', openTeamsFile);
els.saveFileBtn.addEventListener('click', saveTeamsFile);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && els.lookupModal.classList.contains('is-open')) closeLookupModal(); });
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && isFileMode()) {
    e.preventDefault();
    saveTeamsFile();
  }
});
</script>
