<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 1) Rename this file to <topic>.html  (e.g. oldestbar.html)
       2) Its cousin <topic>.json is loaded automatically into Section 2.
       3) Edit the <title>, <h1>, and the #basePrompt template below. -->
  <title>Research · New Topic</title>
  <link rel="stylesheet" href="research.css">
</head>
<body>
  <main class="research">

    <header class="research-head">
      <span class="research-kicker">Research Paradigm</span>
      <h1>New Topic</h1>
      <p class="research-sub">Build the prompt → run it in your AI → save the JSON reply as this page's cousin file.</p>
    </header>

    <!-- ════════ SECTION 1 · PROMPT BUILDER ════════ -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-tag">1 · Prompt</span>
        <div class="panel-actions">
          <button class="btn btn--ghost" id="editBtn" type="button">Edit</button>
          <button class="btn btn--primary" id="generateBtn" type="button">Generate</button>
          <button class="btn" id="copyBtn" type="button">Copy</button>
        </div>
      </div>
      <div class="panel-body">

        <!-- Write your prompt here. Drop {{keywords}} and {{notes}} wherever
             the inputs belong. Ask the AI to return ONLY valid JSON so it
             slots cleanly into the cousin .json file. -->
        <div class="field">
          <label for="basePrompt">Base prompt (template)</label>
          <textarea id="basePrompt" readonly>Describe your research task here.

FOCUS KEYWORDS: {{keywords}}
EXTRA DIRECTION: {{notes}}

Return ONLY valid JSON (no prose, no markdown fences) with the fields you need.</textarea>
        </div>

        <div class="field">
          <label for="keywords">Keywords</label>
          <input id="keywords" type="text" placeholder="comma, separated, keywords">
        </div>

        <div class="field">
          <label for="openText">Notes / open text</label>
          <textarea id="openText" placeholder="Anything extra…"></textarea>
        </div>

        <div class="field">
          <label for="output">Generated prompt</label>
          <textarea id="output" readonly placeholder="Press Generate to assemble the prompt, then Copy."></textarea>
        </div>

      </div>
    </section>

    <!-- ════════ SECTION 2 · RESULT (cousin JSON) ════════ -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-tag">2 · Result</span>
        <span class="panel-file" id="jsonName"></span>
      </div>
      <div class="result" id="result"></div>
    </section>

  </main>

  <script src="research.js"></script>
</body>
</html>
