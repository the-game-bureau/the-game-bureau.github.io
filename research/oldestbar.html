<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research · Oldest Bar</title>
  <link rel="stylesheet" href="research.css">
</head>
<body>
  <main class="research">

    <header class="research-head">
      <span class="research-kicker">Research Paradigm</span>
      <h1>Oldest Bar</h1>
      <p class="research-sub">Build the prompt → run it in your AI → drop the JSON reply next door as
        <code style="font-family:var(--mono)">oldestbar.json</code>.</p>
    </header>

    <!-- ════════ SECTION 1 · PROMPT BUILDER ════════ -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-tag">1 · Prompt</span>
        <div class="panel-actions">
          <button class="btn btn--ghost" id="editBtn" type="button">Edit</button>
          <button class="btn btn--primary" id="generateBtn" type="button">Generate</button>
          <button class="btn" id="copyBtn" type="button">Copy</button>
        </div>
      </div>
      <div class="panel-body">

        <!-- The prompt template is specified here, at page-creation time.
             Use {{keywords}} and {{notes}} where the inputs should land;
             anything not referenced is appended automatically on Generate. -->
        <div class="field">
          <label for="basePrompt">Base prompt (template)</label>
          <textarea id="basePrompt" readonly>You are a meticulous local-history researcher.

TASK: Identify the single oldest continuously-operating bar/tavern that matches the focus below, and report verified facts only. If a fact is uncertain or disputed, say so rather than guessing.

FOCUS KEYWORDS: {{keywords}}
EXTRA DIRECTION: {{notes}}

Return ONLY valid minified-or-pretty JSON (no prose, no markdown fences) with exactly this shape:
{
  "name": string,
  "city": string,
  "established": number,
  "address": string,
  "still_open": boolean,
  "claim_to_fame": string,
  "sources": [ { "title": string, "url": string } ],
  "confidence": "high" | "medium" | "low"
}</textarea>
        </div>

        <div class="field">
          <label for="keywords">Keywords</label>
          <input id="keywords" type="text" placeholder="e.g. Boston, Massachusetts, colonial-era">
        </div>

        <div class="field">
          <label for="openText">Notes / open text</label>
          <textarea id="openText" placeholder="Anything extra — constraints, what to ignore, preferred sources…"></textarea>
        </div>

        <div class="field">
          <label for="output">Generated prompt</label>
          <textarea id="output" readonly placeholder="Press Generate to assemble the prompt, then Copy."></textarea>
        </div>

      </div>
    </section>

    <!-- ════════ SECTION 2 · RESULT (cousin JSON) ════════ -->
    <section class="panel">
      <div class="panel-head">
        <span class="panel-tag">2 · Result</span>
        <span class="panel-file" id="jsonName"></span>
      </div>
      <div class="result" id="result"></div>
    </section>

  </main>

  <script src="research.js"></script>
</body>
</html>
