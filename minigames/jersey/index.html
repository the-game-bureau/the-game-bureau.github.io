<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101820" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>THE JERSEY GAME | The Game Bureau</title>
  <link rel="icon" href="/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101820;
      --panel: rgba(13, 18, 27, 0.88);
      --panel-strong: rgba(22, 29, 42, 0.96);
      --ink: #fff7dd;
      --muted: rgba(255, 247, 221, 0.68);
      --line: rgba(255, 247, 221, 0.18);
      --line-strong: rgba(255, 247, 221, 0.32);
      --accent: #d3bc8d;
      --good: #75d989;
      --bad: #ff785f;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.36);
      --pixel: 4px;
      --font-pixel: "Press Start 2P", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 38%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 82%, black) 0%, #070a0f 100%);
      color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .game-shell {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: start center;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
      overflow-x: hidden;
      isolation: isolate;
    }

    .game-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
      background-size: 20px 20px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 82%);
    }

    .game-card {
      width: min(100%, 1120px);
      min-width: 0;
      display: grid;
      gap: 12px;
      padding: 12px;
      container-type: inline-size;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar {
      min-width: 0;
      display: grid;
      gap: 6px;
      text-align: center;
    }

    .kicker {
      color: var(--accent);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(1.05rem, 5vw, 1.58rem);
      font-weight: 900;
      line-height: 1.38;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
      text-wrap: balance;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.46);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 700;
      line-height: 1.75;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .screen {
      display: grid;
      min-height: 240px;
      place-items: center;
      padding: 22px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
    }

    .screen[hidden] {
      display: none;
    }

    .screen-title {
      margin: 0 0 8px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: 0.9rem;
      font-weight: 900;
      line-height: 1.5;
    }

    .screen-copy {
      margin: 0;
      max-width: 28rem;
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 700;
      line-height: 1.75;
    }

    .play-area {
      display: grid;
      gap: 12px;
    }

    .play-area[hidden] {
      display: none;
    }

    .match-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 24px;
    }

    .match-meta,
    .jersey-label,
    .jersey-sport,
    .auto-note {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .equation {
      --jersey-slot-size: min(100%, 210px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
      min-width: 0;
      margin-inline: 0;
      padding: 6px 0 2px;
    }

    .operator,
    .equals {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 26px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 7vw, 1.8rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 34%, transparent);
    }

    .jersey-card {
      container-type: inline-size;
      width: var(--jersey-slot-size);
      max-width: var(--jersey-slot-size);
      min-width: 0;
      display: grid;
      gap: 6px;
      align-content: start;
      justify-items: center;
    }

    .jersey-stage {
      width: 100%;
      display: grid;
      place-items: end center;
      aspect-ratio: 0.92;
    }

    .jersey-caption {
      display: grid;
      gap: 3px;
      justify-items: center;
      width: 100%;
      text-align: center;
      line-height: 1.25;
    }

    .jersey-name-callout {
      --name-scale: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      padding: 0 2px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: calc(clamp(0.72rem, 9cqw, 1rem) * var(--name-scale));
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.12;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    .jersey-name-callout::before {
      content: none;
    }

    /* First name rides small above the bigger last name, like a real
       nameplate stacked over two rows. */
    .jersey-name-line {
      display: block;
      max-width: 100%;
      white-space: nowrap;
    }

    .jersey-name-line--first {
      font-size: 0.78em;
      font-weight: 800;
      opacity: 0.9;
    }

    .jersey-city {
      max-width: 100%;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(0.48rem, 2.6vw, 0.62rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jersey-sport-line {
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: clamp(0.4rem, 2.1vw, 0.5rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .jersey-label {
      min-height: 12px;
      color: var(--muted);
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .jersey {
      --jersey-primary: #d3bc8d;
      --jersey-secondary: #101820;
      --jersey-trim: #ffffff;
      --jersey-number: #101820;
      --jersey-number-shadow: rgba(255, 247, 221, 0.7);
      --jersey-detail:
        linear-gradient(180deg, transparent 0 72%, var(--jersey-secondary) 72% 78%, var(--jersey-trim) 78% 81%, transparent 81% 100%);
      --number-font-size: clamp(1.5rem, 24cqw, 2.72rem);
      --number-outline: 2px;
      --number-scale: 1;
      container-type: inline-size;
      position: relative;
      width: 100%;
      max-width: none;
      aspect-ratio: 0.92;
      display: grid;
      grid-template-rows: 22% 1fr 8%;
      align-items: center;
      justify-items: center;
      padding: 10% 12% 8%;
      clip-path: polygon(24% 0, 76% 0, 76% 5%, 88% 5%, 88% 10%, 96% 10%, 96% 18%, 100% 18%, 100% 34%, 92% 34%, 92% 39%, 84% 39%, 84% 34%, 78% 34%, 78% 100%, 22% 100%, 22% 34%, 16% 34%, 16% 39%, 8% 39%, 8% 34%, 0 34%, 0 18%, 4% 18%, 4% 10%, 12% 10%, 12% 5%, 24% 5%);
      background:
        var(--jersey-detail),
        linear-gradient(180deg, var(--jersey-secondary) 0 7%, var(--jersey-trim) 7% 10%, transparent 10% 100%),
        linear-gradient(90deg, transparent 0 6%, var(--jersey-secondary) 6% 12%, transparent 12% 88%, var(--jersey-secondary) 88% 94%, transparent 94% 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 5%, transparent 5% 95%, rgba(0, 0, 0, 0.22) 95% 100%),
        var(--jersey-primary);
      image-rendering: pixelated;
      filter: drop-shadow(0 7px 0 color-mix(in srgb, black 48%, transparent));
      box-shadow:
        inset 0 0 0 var(--pixel) color-mix(in srgb, var(--jersey-secondary) 82%, black),
        inset 0 calc(var(--pixel) * -1) 0 rgba(0, 0, 0, 0.22),
        inset calc(var(--pixel) * -1) 0 0 rgba(0, 0, 0, 0.2);
    }

    .jersey::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 4%;
      left: 34%;
      width: 32%;
      height: 21%;
      pointer-events: none;
      clip-path: polygon(0 0, 100% 0, 100% 44%, 84% 44%, 84% 62%, 70% 62%, 70% 79%, 58% 79%, 58% 92%, 42% 92%, 42% 79%, 30% 79%, 30% 62%, 16% 62%, 16% 44%, 0 44%);
      background: #101820;
      box-shadow:
        0 0 0 var(--pixel) var(--jersey-secondary),
        0 var(--pixel) 0 var(--jersey-trim);
    }

    .jersey::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 18% 17% 12%;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 46%, color-mix(in srgb, var(--jersey-trim) 42%, transparent) 46% 49%, color-mix(in srgb, var(--jersey-secondary) 52%, transparent) 49% 51%, color-mix(in srgb, var(--jersey-trim) 42%, transparent) 51% 54%, transparent 54% 100%);
      opacity: 0.46;
    }

    #jersey1 {
      --jersey-detail:
        linear-gradient(180deg, transparent 0 25%, var(--jersey-trim) 25% 28%, var(--jersey-secondary) 28% 34%, transparent 34% 100%);
    }

    #jersey2 {
      --jersey-detail:
        linear-gradient(90deg, transparent 0 32%, color-mix(in srgb, var(--jersey-trim) 68%, transparent) 32% 36%, transparent 36% 64%, color-mix(in srgb, var(--jersey-trim) 68%, transparent) 64% 68%, transparent 68% 100%);
    }

    #jersey3 {
      --jersey-detail:
        linear-gradient(180deg, transparent 0 68%, var(--jersey-secondary) 68% 75%, var(--jersey-trim) 75% 79%, transparent 79% 100%);
    }

    .jersey.sport-football {
      clip-path: polygon(22% 0, 78% 0, 78% 4%, 90% 4%, 90% 9%, 98% 9%, 98% 17%, 100% 17%, 100% 38%, 92% 38%, 92% 44%, 83% 44%, 83% 37%, 78% 37%, 78% 100%, 22% 100%, 22% 37%, 17% 37%, 17% 44%, 8% 44%, 8% 38%, 0 38%, 0 17%, 2% 17%, 2% 9%, 10% 9%, 10% 4%, 22% 4%);
      background:
        var(--jersey-detail),
        linear-gradient(180deg, var(--jersey-secondary) 0 8%, var(--jersey-trim) 8% 11%, transparent 11% 100%),
        linear-gradient(90deg, transparent 0 3%, var(--jersey-secondary) 3% 13%, var(--jersey-trim) 13% 16%, transparent 16% 84%, var(--jersey-trim) 84% 87%, var(--jersey-secondary) 87% 97%, transparent 97% 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 5%, transparent 5% 95%, rgba(0, 0, 0, 0.22) 95% 100%),
        var(--jersey-primary);
    }

    .jersey.sport-football::before {
      top: 5%;
    }

    .jersey.sport-football::after {
      background:
        linear-gradient(180deg, transparent 0 17%, color-mix(in srgb, var(--jersey-trim) 36%, transparent) 17% 20%, transparent 20% 100%);
      opacity: 0.38;
    }

    .jersey.sport-hockey {
      background:
        var(--jersey-detail),
        linear-gradient(180deg, transparent 0 18%, var(--jersey-trim) 18% 21%, var(--jersey-secondary) 21% 28%, transparent 28% 70%, var(--jersey-secondary) 70% 78%, var(--jersey-trim) 78% 82%, transparent 82% 100%),
        linear-gradient(90deg, transparent 0 5%, var(--jersey-secondary) 5% 13%, transparent 13% 87%, var(--jersey-secondary) 87% 95%, transparent 95% 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 5%, transparent 5% 95%, rgba(0, 0, 0, 0.22) 95% 100%),
        var(--jersey-primary);
    }

    .jersey.sport-hockey::after {
      background:
        linear-gradient(90deg, transparent 0 46%, var(--jersey-secondary) 46% 48%, transparent 48% 52%, var(--jersey-secondary) 52% 54%, transparent 54% 100%),
        linear-gradient(180deg, transparent 0 12%, color-mix(in srgb, var(--jersey-trim) 52%, transparent) 12% 15%, transparent 15% 100%);
      opacity: 0.58;
    }

    .jersey.sport-basketball {
      grid-template-rows: 23% 1fr 8%;
      padding: 10% 14% 8%;
      clip-path: polygon(30% 0, 70% 0, 70% 5%, 78% 5%, 78% 12%, 84% 12%, 84% 27%, 78% 37%, 80% 100%, 20% 100%, 22% 37%, 16% 27%, 16% 12%, 22% 12%, 22% 5%, 30% 5%);
      background:
        var(--jersey-detail),
        linear-gradient(180deg, var(--jersey-secondary) 0 7%, var(--jersey-trim) 7% 10%, transparent 10% 100%),
        linear-gradient(90deg, transparent 0 13%, var(--jersey-secondary) 13% 17%, var(--jersey-trim) 17% 20%, transparent 20% 80%, var(--jersey-trim) 80% 83%, var(--jersey-secondary) 83% 87%, transparent 87% 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 5%, transparent 5% 95%, rgba(0, 0, 0, 0.18) 95% 100%),
        var(--jersey-primary);
    }

    .jersey.sport-basketball::before {
      top: 5%;
      left: 35%;
      width: 30%;
      height: 24%;
    }

    .jersey.sport-basketball::after {
      background:
        linear-gradient(90deg, transparent 0 28%, color-mix(in srgb, var(--jersey-trim) 42%, transparent) 28% 32%, transparent 32% 68%, color-mix(in srgb, var(--jersey-trim) 42%, transparent) 68% 72%, transparent 72% 100%);
      opacity: 0.32;
    }

    .jersey.sport-baseball {
      padding: 10% 12% 8%;
      --jersey-detail:
        linear-gradient(180deg, transparent 0 72%, var(--jersey-secondary) 72% 77%, var(--jersey-trim) 77% 80%, transparent 80% 100%);
      clip-path: polygon(22% 0, 78% 0, 78% 5%, 88% 5%, 88% 11%, 97% 11%, 97% 19%, 100% 19%, 100% 34%, 92% 34%, 92% 39%, 84% 39%, 84% 34%, 79% 34%, 79% 100%, 21% 100%, 21% 34%, 16% 34%, 16% 39%, 8% 39%, 8% 34%, 0 34%, 0 19%, 3% 19%, 3% 11%, 12% 11%, 12% 5%, 22% 5%);
      background:
        var(--jersey-detail),
        linear-gradient(90deg, transparent 0 48%, color-mix(in srgb, var(--jersey-trim) 80%, transparent) 48% 49.5%, var(--jersey-secondary) 49.5% 50.5%, color-mix(in srgb, var(--jersey-trim) 80%, transparent) 50.5% 52%, transparent 52% 100%),
        repeating-linear-gradient(90deg, transparent 0 13px, color-mix(in srgb, var(--jersey-secondary) 26%, transparent) 13px 15px, transparent 15px 27px),
        linear-gradient(180deg, var(--jersey-secondary) 0 6%, var(--jersey-trim) 6% 9%, transparent 9% 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 5%, transparent 5% 95%, rgba(0, 0, 0, 0.16) 95% 100%),
        var(--jersey-primary);
    }

    .jersey.sport-baseball::before {
      top: 5%;
      left: 35%;
      width: 30%;
      height: 18%;
      clip-path: polygon(0 0, 100% 0, 100% 50%, 78% 50%, 78% 66%, 61% 66%, 61% 80%, 39% 80%, 39% 66%, 22% 66%, 22% 50%, 0 50%);
    }

    .jersey.sport-baseball::after {
      inset: 20% 20% 15%;
      background:
        linear-gradient(180deg, transparent 0 20%, var(--jersey-secondary) 20% 24%, transparent 24% 39%, var(--jersey-secondary) 39% 43%, transparent 43% 58%, var(--jersey-secondary) 58% 62%, transparent 62% 100%),
        linear-gradient(90deg, transparent 0 48%, color-mix(in srgb, var(--jersey-secondary) 50%, transparent) 48% 52%, transparent 52% 100%);
      opacity: 0.66;
    }

    .jersey.sport-baseball#jersey1 {
      --jersey-detail:
        linear-gradient(180deg, transparent 0 16%, color-mix(in srgb, var(--jersey-secondary) 70%, transparent) 16% 20%, transparent 20% 100%);
    }

    .jersey.sport-baseball#jersey2 {
      --jersey-detail:
        linear-gradient(90deg, transparent 0 23%, color-mix(in srgb, var(--jersey-trim) 70%, transparent) 23% 26%, transparent 26% 74%, color-mix(in srgb, var(--jersey-trim) 70%, transparent) 74% 77%, transparent 77% 100%);
    }

    .jersey.sport-baseball#jersey3 {
      --jersey-detail:
        linear-gradient(180deg, transparent 0 74%, var(--jersey-secondary) 74% 80%, var(--jersey-trim) 80% 83%, transparent 83% 100%);
    }

    .jersey-name {
      display: none;
    }

    .jersey-input,
    .jersey-number,
    .jersey-placeholder {
      position: relative;
      z-index: 1;
      grid-column: 1;
      grid-row: 2;
      width: 98%;
      min-width: 0;
      height: 58px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--jersey-number);
      font-family: var(--font-pixel);
      font-size: calc(var(--number-font-size) * var(--number-scale));
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-shadow:
        var(--number-outline) 0 0 var(--jersey-number-shadow),
        calc(var(--number-outline) * -1) 0 0 var(--jersey-number-shadow),
        0 var(--number-outline) 0 var(--jersey-number-shadow),
        0 calc(var(--number-outline) * -1) 0 var(--jersey-number-shadow);
      font-variant-numeric: tabular-nums;
    }

    .jersey.sport-baseball .jersey-input,
    .jersey.sport-baseball .jersey-number,
    .jersey.sport-baseball .jersey-placeholder {
      grid-row: 1 / span 2;
      align-self: start;
      justify-self: start;
      width: 44%;
      height: 42px;
      margin-top: 37%;
      margin-left: 13%;
      font-size: calc(clamp(0.9rem, 14cqw, 1.48rem) * var(--number-scale));
      text-shadow: none;
    }

    .jersey-input {
      appearance: textfield;
      -webkit-appearance: none;
      caret-color: var(--jersey-number);
      outline: 0;
      text-indent: 0;
    }

    .jersey-input::placeholder {
      color: transparent;
      opacity: 1;
      text-shadow: none;
    }

    .jersey-input:placeholder-shown {
      text-shadow: none;
    }

    .jersey-placeholder {
      pointer-events: none;
    }

    .jersey-input:not(:placeholder-shown) + .jersey-placeholder {
      visibility: hidden;
    }

    .jersey-input:focus {
      background: color-mix(in srgb, var(--jersey-trim) 14%, transparent);
      box-shadow: 0 0 0 var(--pixel) color-mix(in srgb, var(--jersey-trim) 72%, transparent);
    }

    /* Baseball wears its number small in the upper chest, not centered; the
       focus box looks like a sticker there, so keep it shadow-free. */
    .jersey.sport-baseball .jersey-input:focus {
      background: transparent;
      box-shadow: none;
    }

    .jersey-input.number-flash {
      animation: flashJerseyNumber 560ms steps(2, end);
    }

    @keyframes flashJerseyNumber {
      0%, 100% {
        filter: none;
        transform: scale(1);
      }
      20%, 60% {
        filter: brightness(1.8);
        transform: scale(1.08);
      }
      40%, 80% {
        filter: brightness(0.75);
        transform: scale(0.96);
      }
    }

    .jersey-input:disabled {
      opacity: 1;
      -webkit-text-fill-color: var(--jersey-number);
    }

    .jersey-sport {
      position: relative;
      z-index: 1;
      grid-column: 1;
      grid-row: 3;
      align-self: end;
      color: color-mix(in srgb, var(--jersey-trim) 72%, var(--jersey-secondary));
      font-size: 0.54rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1;
      text-transform: uppercase;
    }

    .auto-note {
      margin-top: -2px;
      color: var(--accent);
      font-size: 0.52rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status {
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 800;
      line-height: 1.65;
      text-align: center;
      text-transform: uppercase;
    }

    .status.error {
      color: #ffd7cf;
      border-color: color-mix(in srgb, var(--bad) 68%, transparent);
      background: color-mix(in srgb, var(--bad) 18%, rgba(0, 0, 0, 0.28));
    }

    .status.good {
      color: #defee4;
      border-color: color-mix(in srgb, var(--good) 68%, transparent);
      background: color-mix(in srgb, var(--good) 18%, rgba(0, 0, 0, 0.28));
    }

    .status.flash {
      animation: flashStatus 380ms ease;
    }

    @keyframes flashStatus {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .action-row {
      display: grid;
      grid-template-columns: minmax(96px, 0.42fr) minmax(0, 1fr);
      gap: 8px;
    }

    .check-btn,
    .hint-btn {
      width: 100%;
      min-height: 54px;
      border: 2px solid color-mix(in srgb, var(--accent) 74%, white);
      border-radius: 8px;
      background:
        linear-gradient(180deg, color-mix(in srgb, white 26%, transparent) 0%, transparent 46%),
        var(--accent);
      color: #071016;
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent);
      cursor: pointer;
    }

    .hint-btn {
      border-color: color-mix(in srgb, var(--ink) 42%, var(--accent));
      background:
        linear-gradient(180deg, color-mix(in srgb, white 12%, transparent) 0%, transparent 52%),
        color-mix(in srgb, var(--panel-strong) 78%, var(--accent));
      color: var(--ink);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.14),
        0 8px 18px rgba(0, 0, 0, 0.2);
    }

    .check-btn:active,
    .hint-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.24);
    }

    .check-btn:disabled,
    .hint-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .confetti {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      left: var(--x);
      top: -18px;
      width: 10px;
      height: 14px;
      background: var(--c);
      transform: rotate(var(--r));
      animation: confettiDrop var(--d) cubic-bezier(.16,.78,.33,.99) forwards;
    }

    @keyframes confettiDrop {
      100% {
        transform: translate3d(var(--dx), 112dvh, 0) rotate(calc(var(--r) + 540deg));
        opacity: 0.95;
      }
    }

    /* Shorter phones: trim chrome and tighten the stack so all three
       jerseys plus the action row stay reachable without much scrolling. */
    @media (max-height: 720px) {
      .equation {
        --jersey-slot-size: min(100%, 168px);
      }

      .operator,
      .equals {
        min-height: 20px;
        font-size: clamp(1rem, 6vw, 1.4rem);
      }

      .jersey-input,
      .jersey-number,
      .jersey-placeholder {
        height: 46px;
      }
    }

    @media (max-width: 374px) {
      .game-shell {
        padding-left: 8px;
        padding-right: 8px;
      }

      .game-card {
        padding: 10px 8px;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: clamp(0.68rem, 3.2vw, 0.82rem);
        line-height: 1.6;
        letter-spacing: 0;
      }
    }

    @media (max-width: 430px) {
      h1 {
        font-size: 0.72rem;
      }

      .subtitle {
        font-size: 0.46rem;
      }
    }

    /* Tablet / desktop: enough width to lay the equation out as a true
       horizontal row again. */
    @media (min-width: 600px) {
      .game-card {
        padding: 16px;
      }

      .equation {
        --jersey-slot-size: clamp(112px, calc((100cqw - 118px) / 3), 260px);
        display: grid;
        grid-template-columns: var(--jersey-slot-size) auto var(--jersey-slot-size) auto var(--jersey-slot-size);
        justify-content: center;
        align-items: start;
        gap: 8px;
      }

      .jersey-card {
        width: var(--jersey-slot-size);
        max-width: var(--jersey-slot-size);
      }

      .jersey-stage {
        height: auto;
      }

      .operator,
      .equals {
        align-self: start;
        width: auto;
        min-height: 0;
        margin-top: 62px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body data-admin-page="mission-control">
  <main class="game-shell" aria-label="THE JERSEY GAME">
    <section class="game-card">
      <header class="topbar">
        <span class="kicker">The Game Bureau</span>
        <h1>THE JERSEY GAME</h1>
        <p class="subtitle">Fill in the jersey numbers. Type any two. The remaining jersey calculates itself.</p>
      </header>

      <section class="screen" id="loadingScreen" aria-live="polite">
        <div>
          <p class="screen-title">Loading THE JERSEY GAME</p>
          <p class="screen-copy">Pulling a random puzzle from the database.</p>
        </div>
      </section>

      <section class="screen" id="errorScreen" hidden aria-live="polite">
        <div>
          <p class="screen-title">ERROR</p>
          <p class="screen-copy" id="errorCopy"></p>
        </div>
      </section>

      <section class="play-area" id="playArea" hidden>
        <div class="match-meta" aria-label="Puzzle details">
          <span class="pill" id="cityPill"></span>
          <span class="pill" id="teamPill"></span>
        </div>

        <section class="equation" aria-label="Jersey equation">

            <div class="jersey-stage">
              <div class="jersey" id="jersey1">

                <label class="sr-only" for="player1Input" id="player1Label">First jersey number</label>
                <input class="jersey-input" id="player1Input" type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" autocomplete="off" placeholder="?" />
                <span class="jersey-placeholder" aria-hidden="true">?</span>
                <div class="jersey-sport" id="player1Sport"></div>

            <div class="jersey-caption">

            </div>
          </article>

          <div class="operator" id="operatorText" aria-hidden="true">+</div>

          <article class="jersey-card" id="jerseyCard2">
            <span class="jersey-label">Type</span>
            <div class="jersey-stage">
              <div class="jersey" id="jersey2">
                <div class="jersey-name" id="player2Name"></div>
                <label class="sr-only" for="player2Input" id="player2Label">Second jersey number</label>
                <input class="jersey-input" id="player2Input" type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" autocomplete="off" placeholder="?" />
                <span class="jersey-placeholder" aria-hidden="true">?</span>
                <div class="jersey-sport" id="player2Sport"></div>
              </div>
            </div>
            <div class="jersey-caption">
              <span class="jersey-name-callout" id="player2NameCallout"></span>
              <span class="jersey-city" id="player2City"></span>
              <span class="jersey-sport-line" id="player2SportLine"></span>
            </div>
          </article>

          <div class="equals" aria-hidden="true">=</div>

          <article class="jersey-card" id="jerseyCard3">
            <span class="jersey-label">Type</span>
            <div class="jersey-stage">
              <div class="jersey" id="jersey3">
                <div class="jersey-name" id="player3Name"></div>
                <label class="sr-only" for="player3Input" id="player3Label">Third jersey number</label>
                <input class="jersey-input" id="player3Input" type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" autocomplete="off" placeholder="?" aria-live="polite" />
                <span class="jersey-placeholder" aria-hidden="true">?</span>
                <div class="jersey-sport" id="player3Sport"></div>
              </div>
            </div>
            <div class="jersey-caption">
              <span class="jersey-name-callout" id="player3NameCallout"></span>
              <span class="jersey-city" id="player3City"></span>
              <span class="jersey-sport-line" id="player3SportLine"></span>
            </div>
            <span class="auto-note">Calculated</span>
          </article>
        </section>

        <p class="status" id="statusText" aria-live="polite">Enter any two jersey numbers.</p>
        <div class="action-row">
          <button class="hint-btn" id="hintBtn" type="button" aria-label="Reveal one random jersey number">HINT</button>
          <button class="check-btn" id="checkBtn" type="button">CHECK YOUR ANSWERS</button>
        </div>
      </section>
    </section>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const DATA_URL = 'jerseys.json';
      const DEFAULT_PALETTE = {
        fullName: 'The Game Bureau',
        sport: 'football',
        primary: '#d3bc8d',
        secondary: '#101820',
        tertiary: '#ffffff'
      };
      const EXTRA_TEAM_PALETTES = new Map([
        ['nashville predators', {
          fullName: 'Nashville Predators',
          sport: 'hockey',
          primary: '#ffb81c',
          secondary: '#041e42',
          tertiary: '#ffffff'
        }]
      ]);
      const els = {
        loading: document.getElementById('loadingScreen'),
        error: document.getElementById('errorScreen'),
        errorCopy: document.getElementById('errorCopy'),
        play: document.getElementById('playArea'),
        cityPill: document.getElementById('cityPill'),
        teamPill: document.getElementById('teamPill'),
        operator: document.getElementById('operatorText'),
        status: document.getElementById('statusText'),
        check: document.getElementById('checkBtn'),
        hint: document.getElementById('hintBtn'),
        confetti: document.getElementById('confetti'),
        inputs: [
          document.getElementById('player1Input'),
          document.getElementById('player2Input'),
          document.getElementById('player3Input')
        ]
      };

      const state = {
        record: null,
        teams: new Map(),
        calculated: null,
        calculatedSlot: null,
        manualSlots: [],
        hintUsed: false,
        solved: false,
        unsupportedOperator: false
      };
      const returnTarget = getParam(['return', 'returnUrl', 'back']);

      els.inputs.forEach((input, index) => {
        input.addEventListener('focus', () => {
          if (state.calculatedSlot === index && !state.solved) {
            input.value = '';
            input.classList.remove('is-calculated');
            state.calculatedSlot = null;
            setNumberScale(input, '');
          }
        });
        input.addEventListener('blur', () => {
          if (!input.value && state.manualSlots.length === 2) recalculate();
        });
        input.addEventListener('input', () => {
          input.value = sanitizeNumberInput(input.value);
          markManualSlot(index);
          setNumberScale(input, input.value);
          recalculate();
        });
      });
      els.check.addEventListener('click', () => {
        if (state.solved) {
          closeGame();
          return;
        }
        checkAnswers();
      });
      els.hint.addEventListener('click', useHint);

      window.addEventListener('resize', refitNameCallouts);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(refitNameCallouts).catch(() => {});
      }

      loadGame();

      async function loadGame() {
        try {
          const data = await loadJerseyData();
          state.teams = buildTeamCatalog(data.teams);
          const record = normalizeRecord(selectJerseyRecord(data.records));
          if (!record) throw new Error('No jersey puzzle was returned.');
          state.record = record;
          resetInputs();
          renderRecord(record);
          showPlay();
        } catch (error) {
          showError(readableError(error));
        }
      }

      async function loadJerseyData() {
        const response = await fetch(DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load jersey data.');
        const data = await response.json();
        if (!data || !Array.isArray(data.records) || !Array.isArray(data.teams)) {
          throw new Error('Jersey data is malformed.');
        }
        return data;
      }

      function selectJerseyRecord(records) {
        const candidates = Array.isArray(records) ? records.filter(Boolean) : [];
        if (!candidates.length) throw new Error('No jersey puzzles found.');

        const city = normalizeKey(getParam(['city', 'market']));
        if (city) {
          const cityMatches = candidates.filter((record) => normalizeKey(record && record.city) === city);
          if (cityMatches.length) return pickRandom(cityMatches);
        }

        return pickRandom(candidates);
      }

      function pickRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function buildTeamCatalog(rows) {
        const map = new Map();
        (Array.isArray(rows) ? rows : []).forEach((row) => {
          if (!row || typeof row !== 'object') return;
          const team = {
            league: row.league || '',
            code: row.code || '',
            fullName: row.fullName || row.full_name || '',
            firstName: row.firstName || row.first_name || '',
            fanbase: row.fanbase || row.firstName || row.first_name || '',
            mascot: row.mascot || '',
            sport: row.sport || '',
            primary: row.primary || row.primary_color || row.shell || '',
            secondary: row.secondary || row.secondary_color || row.stripe || '',
            tertiary: row.tertiary || row.tertiary_color || row.mask || ''
          };
          const keys = [
            team.fullName,
            team.code,
            team.fanbase,
            team.mascot,
            team.fanbase && team.mascot ? team.fanbase + ' ' + team.mascot : ''
          ];
          keys.forEach((key) => {
            const normalized = normalizeKey(key);
            if (normalized && !map.has(normalized)) map.set(normalized, team);
          });
        });
        return map;
      }

      function normalizeRecord(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const record = {
          city: cleanText(raw.city),
          operator: cleanText(raw.operator),
          players: [
            playerFromRecord(raw, 1),
            playerFromRecord(raw, 2),
            playerFromRecord(raw, 3)
          ]
        };
        if (!record.players.every((player) => player.name && isValidJerseyNumber(player.num))) return null;
        return record;
      }

      function playerFromRecord(raw, index) {
        return {
          name: cleanText(raw['player' + index + 'name']),
          num: Number(raw['player' + index + 'num']),
          sport: cleanText(raw['player' + index + 'sport']),
          team: cleanText(raw['player' + index + 'team'])
        };
      }

      function renderRecord(record) {
        els.cityPill.textContent = record.city || 'Mystery City';
        els.teamPill.textContent = sharedTeamLabel(record) || 'Mixed Teams';
        els.operator.textContent = record.operator || '?';
        state.unsupportedOperator = !isSupportedOperator(record.operator);

        record.players.forEach((player, index) => {
          const number = index + 1;
          const palette = resolveTeamPalette(player);
          const displayName = formatPlayerName(player);
          const jersey = document.getElementById('jersey' + number);
          const nameEl = document.getElementById('player' + number + 'Name');
          const nameCalloutEl = document.getElementById('player' + number + 'NameCallout');
          const sportEl = document.getElementById('player' + number + 'Sport');
          const cityEl = document.getElementById('player' + number + 'City');
          const sportLineEl = document.getElementById('player' + number + 'SportLine');
          const labelEl = document.getElementById('player' + number + 'Label');
          applyJerseyPalette(jersey, palette, player.sport);
          nameEl.textContent = displayName;
          if (nameCalloutEl) {
            renderNameCallout(nameCalloutEl, displayName);
            fitNameCallout(nameCalloutEl);
          }
          sportEl.textContent = player.sport || palette.sport || 'sport';
          if (cityEl) cityEl.textContent = teamLocale(player, palette);
          if (sportLineEl) sportLineEl.textContent = player.sport || palette.sport || '';
          if (labelEl) labelEl.textContent = displayName + ' jersey number';
        });
        els.inputs.forEach((input) => {
          input.disabled = false;
          setNumberScale(input, input.value);
        });

        if (state.unsupportedOperator) {
          setStatus('ERROR', 'error');
          els.check.disabled = true;
          els.hint.disabled = true;
        } else {
          setStatus('Enter any two jersey numbers.', '');
          els.check.disabled = false;
          els.hint.disabled = false;
        }
        recalculate();
      }

      function fitNameCallout(element) {
        if (!element) return;
        element.style.setProperty('--name-scale', '1');
        requestAnimationFrame(() => {
          const available = element.clientWidth;
          const actual = element.scrollWidth;
          if (!available || !actual || actual <= available) return;
          const scale = Math.max(0.5, Math.min(1, available / actual));
          element.style.setProperty('--name-scale', String(scale));
        });
      }

      function refitNameCallouts() {
        document.querySelectorAll('.jersey-name-callout').forEach(fitNameCallout);
      }

      function resolveTeamPalette(player) {
        const direct = state.teams.get(normalizeKey(player.team));
        if (direct) return direct;
        const extra = EXTRA_TEAM_PALETTES.get(normalizeKey(player.team));
        if (extra) return extra;
        const cityTeam = state.teams.get(normalizeKey((state.record && state.record.city || '') + ' ' + player.team));
        if (cityTeam) return cityTeam;
        return {
          ...DEFAULT_PALETTE,
          fullName: player.team || DEFAULT_PALETTE.fullName,
          sport: player.sport || DEFAULT_PALETTE.sport
        };
      }

      function applyJerseyPalette(jersey, palette, sport) {
        if (!jersey) return;
        const primary = safeColor(palette.primary || palette.shell) || DEFAULT_PALETTE.primary;
        const secondary = safeColor(palette.secondary || palette.stripe) || readableTextColor(primary);
        const trim = safeColor(palette.tertiary || palette.mask) || DEFAULT_PALETTE.tertiary;
        const number = contrastEnough(secondary, primary) ? secondary : readableTextColor(primary);
        const shadow = readableTextColor(number);
        jersey.style.setProperty('--jersey-primary', primary);
        jersey.style.setProperty('--jersey-secondary', secondary);
        jersey.style.setProperty('--jersey-trim', trim);
        jersey.style.setProperty('--jersey-number', number);
        jersey.style.setProperty('--jersey-number-shadow', shadow);
        jersey.classList.remove('sport-football', 'sport-hockey', 'sport-basketball', 'sport-baseball');
        jersey.classList.add('sport-' + normalizeSport(sport || palette.sport));
      }

      function resetInputs() {
        state.calculated = null;
        state.calculatedSlot = null;
        state.manualSlots = [];
        state.hintUsed = false;
        state.solved = false;
        els.inputs.forEach((input) => {
          input.value = '';
          input.disabled = false;
          input.classList.remove('is-calculated', 'number-flash');
          setNumberScale(input, '');
        });
        els.check.textContent = 'CHECK YOUR ANSWERS';
        els.hint.disabled = false;
      }

      function markManualSlot(slot) {
        state.manualSlots = state.manualSlots.filter((manualSlot) => manualSlot !== slot);
        if (isValidJerseyNumber(parseInputNumber(els.inputs[slot].value))) {
          state.manualSlots.push(slot);
        }
      }

      function clearSlot(slot) {
        const input = els.inputs[slot];
        if (!input) return;
        input.value = '';
        input.classList.remove('is-calculated', 'number-flash');
        setNumberScale(input, '');
      }

      function setCalculatedSlot(slot, value, options) {
        const input = els.inputs[slot];
        if (!input) return;
        const shouldFlash = Boolean(options && options.flash) || input.value !== value;
        input.value = value;
        input.classList.add('is-calculated');
        setNumberScale(input, value);
        if (shouldFlash) flashNumber(input);
      }

      function recalculate() {
        if (!state.record || state.unsupportedOperator) return;
        state.manualSlots = state.manualSlots.filter((slot) => isValidJerseyNumber(parseInputNumber(els.inputs[slot].value)));
        els.inputs.forEach((input, index) => {
          if (index !== state.calculatedSlot) input.classList.remove('is-calculated');
        });

        if (state.manualSlots.length >= 3) {
          state.calculated = null;
          state.calculatedSlot = null;
          els.inputs.forEach((input) => input.classList.remove('is-calculated'));
          if (!state.solved) setStatus('Now check the jerseys.', '');
          return;
        }

        if (state.manualSlots.length < 2) {
          if (state.calculatedSlot !== null) clearSlot(state.calculatedSlot);
          state.calculated = null;
          state.calculatedSlot = null;
          if (!state.solved) setStatus('Enter any two jersey numbers.', '');
          return;
        }

        const missingSlot = [0, 1, 2].find((slot) => !state.manualSlots.includes(slot));
        const values = els.inputs.map((input) => parseInputNumber(input.value));
        state.calculated = calculateMissingValue(missingSlot, values, state.record.operator);
        if (!isValidJerseyNumber(state.calculated)) {
          clearSlot(missingSlot);
          state.calculated = null;
          state.calculatedSlot = null;
          if (!state.solved) setStatus('Jersey numbers are one or two digits.', 'error');
          return;
        }
        state.calculatedSlot = missingSlot;
        const calculatedText = formatNumber(state.calculated);
        setCalculatedSlot(missingSlot, calculatedText);
        if (!state.solved) setStatus('Now check the jerseys.', '');
      }

      function useHint() {
        if (!state.record || state.unsupportedOperator || state.solved || state.hintUsed) return;
        const finalSlot = Math.floor(Math.random() * els.inputs.length);
        const input = els.inputs[finalSlot];
        const hintValue = formatNumber(state.record.players[finalSlot].num);

        state.calculated = null;
        state.calculatedSlot = null;
        state.manualSlots = [];
        state.hintUsed = true;
        els.inputs.forEach((slotInput, index) => {
          if (index !== finalSlot) clearSlot(index);
          slotInput.disabled = false;
          slotInput.classList.remove('is-calculated');
        });
        input.value = hintValue;
        setNumberScale(input, hintValue);
        markManualSlot(finalSlot);
        flashNumber(input);
        els.hint.disabled = true;

        if (!state.solved) setStatus('Hint added. Enter the two remaining jersey numbers.', '');
      }

      function checkAnswers() {
        if (!state.record || state.unsupportedOperator) return;
        recalculate();
        const values = els.inputs.map((input) => parseInputNumber(input.value));
        const expected = state.record.players;
        const correct = values.every(isValidJerseyNumber)
          && values[0] === expected[0].num
          && values[1] === expected[1].num
          && values[2] === expected[2].num;

        if (!correct) {
          flashTryAgain();
          return;
        }

        state.solved = true;
        els.inputs.forEach((input) => { input.disabled = true; });
        els.hint.disabled = true;
        setStatus('TOUCHDOWN!', 'good');
        els.check.textContent = 'CLOSE';
        fireConfetti();
      }

      function flashNumber(input) {
        if (!input) return;
        input.classList.remove('number-flash');
        void input.offsetWidth;
        input.classList.add('number-flash');
      }

      function flashTryAgain() {
        setStatus('TRY AGAIN', 'error');
        els.status.classList.remove('flash');
        void els.status.offsetWidth;
        els.status.classList.add('flash');
      }

      function fireConfetti() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const colors = ['#d3bc8d', '#ffffff', '#101820', '#75d989', '#ff785f'];
        els.confetti.innerHTML = '';
        for (let i = 0; i < 52; i += 1) {
          const piece = document.createElement('span');
          piece.className = 'confetti-piece';
          piece.style.setProperty('--x', Math.floor(Math.random() * 100) + '%');
          piece.style.setProperty('--dx', (Math.random() * 180 - 90).toFixed(0) + 'px');
          piece.style.setProperty('--r', Math.floor(Math.random() * 360) + 'deg');
          piece.style.setProperty('--d', (900 + Math.random() * 1100).toFixed(0) + 'ms');
          piece.style.setProperty('--c', colors[i % colors.length]);
          els.confetti.appendChild(piece);
        }
        window.setTimeout(() => { els.confetti.innerHTML = ''; }, 2300);
      }

      function closeGame() {
        if (getParam(['embedded']) === '1' && window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'tgb:minigame:complete', game: 'jersey' }, '*');
          return;
        }

        const safeTarget = getSafeReturnUrl(returnTarget);
        if (safeTarget) {
          window.location.href = safeTarget;
          return;
        }
        if (document.referrer) {
          window.location.href = document.referrer;
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
        }
      }

      function showPlay() {
        els.loading.hidden = true;
        els.error.hidden = true;
        els.play.hidden = false;
      }

      function showError(message) {
        els.loading.hidden = true;
        els.play.hidden = true;
        els.error.hidden = false;
        els.errorCopy.textContent = message;
      }

      function setStatus(text, type) {
        els.status.textContent = text;
        els.status.className = 'status' + (type ? ' ' + type : '');
      }

      function calculate(first, operator, second) {
        if (operator === '+') return first + second;
        if (operator === '-') return first - second;
        return null;
      }

      function calculateMissingValue(slot, values, operator) {
        const first = values[0];
        const second = values[1];
        const third = values[2];
        if (slot === 0 && operator === '+') return third - second;
        if (slot === 0 && operator === '-') return third + second;
        if (slot === 1 && operator === '+') return third - first;
        if (slot === 1 && operator === '-') return first - third;
        if (slot === 2) return calculate(first, operator, second);
        return null;
      }

      function isSupportedOperator(operator) {
        return operator === '+' || operator === '-';
      }

      function sharedTeamLabel(record) {
        const teams = Array.from(new Set(record.players.map((player) => player.team).filter(Boolean)));
        return teams.length === 1 ? teams[0] : '';
      }

      function parseInputNumber(value) {
        const text = sanitizeNumberInput(value);
        if (!text) return NaN;
        return Number.parseInt(text, 10);
      }

      function sanitizeNumberInput(value) {
        const raw = String(value || '');
        let result = '';
        for (const char of raw) {
          if (char >= '0' && char <= '9') {
            result += char;
            if (result.length >= 2) break;
          }
        }
        return result;
      }

      function formatNumber(value) {
        if (!isValidJerseyNumber(value)) return '';
        const normalized = Object.is(value, -0) ? 0 : value;
        return String(normalized);
      }

      function isValidJerseyNumber(value) {
        return Number.isInteger(value) && value >= 0 && value <= 99;
      }

      function setNumberScale(element) {
        if (!element) return;
        const isBaseball = !!(element.closest && element.closest('.sport-baseball'));
        element.style.setProperty('--number-scale', '1');
        element.style.setProperty('--number-outline', '2px');
        if (isBaseball) {
          element.style.setProperty('--baseball-number-outline', '2px');
        } else {
          element.style.removeProperty('--baseball-number-outline');
        }
      }

      function readableError(error) {
        return error && error.message ? error.message : '';
      }

      function getParam(names) {
        for (const name of names) {
          const value = params.get(name);
          if (value != null && String(value).trim()) return String(value).trim();
        }
        return '';
      }

      function getSafeReturnUrl(value) {
        if (!value) return '';
        try {
          const url = new URL(value, window.location.href);
          if (url.origin === window.location.origin) return url.href;
        } catch (error) {}
        return '';
      }

      function cleanText(value) {
        return String(value == null ? '' : value).trim();
      }

      function formatPlayerName(player) {
        const source = cleanText(player && player.name);
        if (!source) return '';
        return source;
      }

      // Stack the name like a real nameplate: first name small on top, last
      // name big below. Single-token names just fill the last line.
      function renderNameCallout(element, fullName) {
        if (!element) return;
        const parts = splitPlayerName(fullName);
        element.textContent = '';
        if (parts.first) {
          const first = document.createElement('span');
          first.className = 'jersey-name-line jersey-name-line--first';
          first.textContent = parts.first;
          element.appendChild(first);
        }
        const last = document.createElement('span');
        last.className = 'jersey-name-line jersey-name-line--last';
        last.textContent = parts.last;
        element.appendChild(last);
      }

      function splitPlayerName(fullName) {
        const clean = cleanText(fullName);
        const tokens = clean.split(/\s+/).filter(Boolean);
        if (tokens.length <= 1) return { first: '', last: clean };
        return { first: tokens[0], last: tokens.slice(1).join(' ') };
      }

      // What the team "goes by" — Golden State, Tennessee, New Orleans — even
      // though we search/pull puzzles by the city the TGB game is set in.
      function teamLocale(player, palette) {
        const fromPalette = cleanText(palette && palette.firstName);
        if (fromPalette) return fromPalette;
        const team = cleanText(player && player.team);
        if (team) {
          const tokens = team.split(/\s+/).filter(Boolean);
          if (tokens.length > 1) return tokens.slice(0, -1).join(' ');
          return team;
        }
        return (state.record && state.record.city) || '';
      }

      function normalizeKey(value) {
        return String(value || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
      }

      function normalizeSport(value) {
        const sport = normalizeKey(value);
        if (sport === 'hockey') return 'hockey';
        if (sport === 'basketball') return 'basketball';
        if (sport === 'baseball') return 'baseball';
        return 'football';
      }

      function safeColor(value) {
        const text = cleanText(value);
        return /^(#[0-9a-f]{3}|#[0-9a-f]{6}|#[0-9a-f]{8})$/i.test(text) ? text : '';
      }

      function readableTextColor(bg) {
        const rgb = hexToRgb(bg);
        if (!rgb) return '#ffffff';
        const lum = relativeLuminance(rgb);
        return lum > 0.48 ? '#101820' : '#fff7dd';
      }

      function contrastEnough(fg, bg) {
        const a = hexToRgb(fg);
        const b = hexToRgb(bg);
        if (!a || !b) return true;
        const la = relativeLuminance(a) + 0.05;
        const lb = relativeLuminance(b) + 0.05;
        return Math.max(la, lb) / Math.min(la, lb) >= 2.4;
      }

      function hexToRgb(value) {
        let hex = safeColor(value).replace('#', '');
        if (!hex) return null;
        if (hex.length === 3) hex = hex.split('').map((char) => char + char).join('');
        if (hex.length === 8) hex = hex.slice(0, 6);
        const num = Number.parseInt(hex, 16);
        if (!Number.isFinite(num)) return null;
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255
        };
      }

      function relativeLuminance(rgb) {
        const channels = [rgb.r, rgb.g, rgb.b].map((value) => {
          const channel = value / 255;
          return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        });
        return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
      }
    }());
  </script>
