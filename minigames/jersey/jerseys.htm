<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101820" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>THE JERSEY GAME | The Game Bureau</title>
  <link rel="icon" href="/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qmaafbncpzrdmqapkkgr.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101820;
      --panel: rgba(13, 18, 27, 0.88);
      --panel-strong: rgba(22, 29, 42, 0.96);
      --ink: #fff7dd;
      --muted: rgba(255, 247, 221, 0.68);
      --line: rgba(255, 247, 221, 0.18);
      --line-strong: rgba(255, 247, 221, 0.32);
      --accent: #d3bc8d;
      --good: #75d989;
      --bad: #ff785f;
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.36);
      --pixel: 4px;
      --font-pixel: "Press Start 2P", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 38%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 82%, black) 0%, #070a0f 100%);
      color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .game-shell {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: start center;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
      overflow-x: hidden;
      isolation: isolate;
    }

    .game-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
      background-size: 20px 20px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 82%);
    }

    .game-card {
      width: min(100%, 1120px);
      min-width: 0;
      display: grid;
      gap: 12px;
      padding: 12px;
      container-type: inline-size;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar {
      min-width: 0;
      display: grid;
      gap: 6px;
      text-align: center;
    }

    .kicker {
      color: var(--accent);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(1.05rem, 5vw, 1.58rem);
      font-weight: 900;
      line-height: 1.38;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
      text-wrap: balance;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.46);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 700;
      line-height: 1.75;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .screen {
      display: grid;
      min-height: 240px;
      place-items: center;
      padding: 22px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
    }

    .screen[hidden] {
      display: none;
    }

    .screen-title {
      margin: 0 0 8px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: 0.9rem;
      font-weight: 900;
      line-height: 1.5;
    }

    .screen-copy {
      margin: 0;
      max-width: 28rem;
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      font-weight: 700;
      line-height: 1.75;
    }

    .play-area {
      display: grid;
      gap: 12px;
    }

    .play-area[hidden] {
      display: none;
    }

    .match-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 24px;
    }

    .match-meta,
    .jersey-label,
    .jersey-sport,
    .auto-note {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .equation {
      --jersey-slot-size: min(100%, 210px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
      min-width: 0;
      margin-inline: 0;
      padding: 6px 0 2px;
    }

    .operator,
    .equals {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 26px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(1.2rem, 7vw, 1.8rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 34%, transparent);
    }

    .jersey-card {
      container-type: inline-size;
      width: var(--jersey-slot-size);
      max-width: var(--jersey-slot-size);
      min-width: 0;
      display: grid;
      gap: 6px;
      align-content: start;
      justify-items: center;
    }

    .jersey-stage {
      width: 100%;
      display: grid;
      place-items: end center;
      aspect-ratio: 0.92;
    }

    .jersey-caption {
      display: grid;
      gap: 3px;
      justify-items: center;
      width: 100%;
      text-align: center;
      line-height: 1.25;
    }

    .jersey-name-callout {
      --name-scale: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      padding: 0 2px;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: calc(clamp(0.72rem, 9cqw, 1rem) * var(--name-scale));
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.12;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    .jersey-name-callout::before {
      content: none;
    }

    /* First name rides small above the bigger last name, like a real
       nameplate stacked over two rows. */
    .jersey-name-line {
      display: block;
      max-width: 100%;
      white-space: nowrap;
    }

    .jersey-name-line--first {
      font-size: 0.78em;
      font-weight: 800;
      opacity: 0.9;
    }

    .jersey-city {
      max-width: 100%;
      color: var(--ink);
      font-family: var(--font-pixel);
      font-size: clamp(0.48rem, 2.6vw, 0.62rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .jersey-sport-line {
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: clamp(0.4rem, 2.1vw, 0.5rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .jersey-label {
      min-height: 12px;
      color: var(--muted);
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .jersey {
      --jersey-primary: #d3bc8d;
      --jersey-secondary: #101820;
      --jersey-trim: #ffffff;
      --jersey-number: #101820;
      --jersey-number-shadow: rgba(255, 247, 221, 0.7);
      --number-font-size: clamp(1.5rem, 23cqw, 2.65rem);
      --number-outline: 2px;
      --number-scale: 1;
      container-type: inline-size;
      position: relative;
      width: 100%;
      max-width: none;
      aspect-ratio: 0.92;
      display: grid;
      grid-template-rows: 20% 1fr 8%;
      align-items: center;
      justify-items: center;
      padding: 7% 8% 7%;
      clip-path: polygon(17% 0, 83% 0, 88% 5%, 95% 9%, 100% 21%, 100% 33%, 90% 38%, 82% 31%, 82% 100%, 18% 100%, 18% 31%, 10% 38%, 0 33%, 0 21%, 5% 9%, 12% 5%);
      background:
        linear-gradient(180deg, var(--jersey-secondary) 0 4%, var(--jersey-trim) 4% 7%, transparent 7% 100%),
        linear-gradient(90deg, transparent 0 9%, var(--jersey-secondary) 9% 15%, transparent 15% 85%, var(--jersey-secondary) 85% 91%, transparent 91% 100%),
        linear-gradient(180deg, color-mix(in srgb, white 9%, transparent) 0%, transparent 36%, rgba(0, 0, 0, 0.14) 100%),
        var(--jersey-primary);
      image-rendering: pixelated;
      filter: drop-shadow(0 7px 0 color-mix(in srgb, black 46%, transparent)) drop-shadow(0 16px 18px rgba(0, 0, 0, 0.26));
      box-shadow:
        inset 0 0 0 var(--pixel) var(--jersey-secondary),
        inset calc(var(--pixel) * -1) 0 0 color-mix(in srgb, black 24%, var(--jersey-secondary)),
        inset 0 0 0 calc(var(--pixel) * 2) color-mix(in srgb, var(--jersey-trim) 70%, transparent);
    }

    .jersey::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 4% 19% 7%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 20% 16% at 50% -7%, transparent 0 54%, color-mix(in srgb, var(--jersey-trim) 92%, transparent) 55% 67%, color-mix(in srgb, var(--jersey-secondary) 94%, black) 68% 80%, transparent 81%),
        linear-gradient(90deg, color-mix(in srgb, black 10%, transparent) 0 var(--pixel), transparent var(--pixel) calc(100% - var(--pixel)), color-mix(in srgb, black 14%, transparent) calc(100% - var(--pixel)) 100%),
        color-mix(in srgb, var(--jersey-primary) 90%, white);
      border-left: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 86%, transparent);
      border-right: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 86%, transparent);
      border-bottom: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 78%, transparent);
      box-shadow:
        inset 0 var(--pixel) 0 color-mix(in srgb, var(--jersey-trim) 42%, transparent),
        inset calc(var(--pixel) * -1) 0 0 color-mix(in srgb, black 12%, transparent);
    }

    .jersey::after {
      content: "";
      position: absolute;
      z-index: 0;
      right: 23%;
      bottom: 20%;
      width: 10%;
      height: 18%;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 0 52%, color-mix(in srgb, var(--jersey-trim) 34%, transparent) 52% 64%, transparent 64% 100%),
        color-mix(in srgb, black 16%, transparent);
      opacity: 0.5;
    }

    .jersey.sport-football {
      grid-template-rows: 20% 1fr 8%;
      padding: 7% 8% 7%;
      clip-path: polygon(16% 0, 84% 0, 89% 5%, 97% 8%, 100% 17%, 100% 39%, 89% 45%, 81% 36%, 81% 100%, 19% 100%, 19% 36%, 11% 45%, 0 39%, 0 17%, 3% 8%, 11% 5%);
      background:
        linear-gradient(180deg, var(--jersey-secondary) 0 6%, var(--jersey-trim) 6% 9%, transparent 9% 100%),
        linear-gradient(180deg, transparent 0 20%, var(--jersey-trim) 20% 23%, var(--jersey-secondary) 23% 28%, transparent 28% 100%),
        linear-gradient(90deg, transparent 0 6%, var(--jersey-secondary) 6% 17%, transparent 17% 83%, var(--jersey-secondary) 83% 94%, transparent 94% 100%),
        linear-gradient(180deg, color-mix(in srgb, white 10%, transparent) 0%, transparent 36%, rgba(0, 0, 0, 0.16) 100%),
        var(--jersey-primary);
    }

    .jersey.sport-football::before {
      inset: 4% 18% 7%;
      background:
        radial-gradient(ellipse 21% 16% at 50% -7%, transparent 0 54%, color-mix(in srgb, var(--jersey-trim) 92%, transparent) 55% 67%, color-mix(in srgb, var(--jersey-secondary) 94%, black) 68% 80%, transparent 81%),
        linear-gradient(90deg, color-mix(in srgb, black 10%, transparent) 0 var(--pixel), transparent var(--pixel) calc(100% - var(--pixel)), color-mix(in srgb, black 14%, transparent) calc(100% - var(--pixel)) 100%),
        color-mix(in srgb, var(--jersey-primary) 90%, white);
      border-top: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 72%, transparent);
    }

    .jersey.sport-football::after {
      right: 21%;
      bottom: 19%;
      width: 12%;
      height: 20%;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--jersey-trim) 48%, transparent) 0 18%, transparent 18% 48%, color-mix(in srgb, var(--jersey-trim) 38%, transparent) 48% 62%, transparent 62% 100%),
        color-mix(in srgb, black 16%, transparent);
    }

    .jersey.sport-hockey {
      background:
        linear-gradient(180deg, transparent 0 17%, var(--jersey-trim) 17% 21%, var(--jersey-secondary) 21% 27%, transparent 27% 70%, var(--jersey-secondary) 70% 76%, var(--jersey-trim) 76% 80%, transparent 80% 100%),
        linear-gradient(90deg, transparent 0 7%, var(--jersey-secondary) 7% 15%, transparent 15% 85%, var(--jersey-secondary) 85% 93%, transparent 93% 100%),
        linear-gradient(180deg, color-mix(in srgb, white 12%, transparent) 0%, transparent 36%, rgba(0, 0, 0, 0.18) 100%),
        var(--jersey-primary);
    }

    .jersey.sport-basketball {
      grid-template-rows: 20% 1fr 9%;
      padding: 7% 9% 8%;
      clip-path: polygon(29% 0, 71% 0, 77% 8%, 83% 16%, 77% 38%, 80% 100%, 20% 100%, 23% 38%, 17% 16%, 23% 8%);
      background:
        linear-gradient(180deg, var(--jersey-secondary) 0 4%, var(--jersey-trim) 4% 7%, transparent 7% 100%),
        linear-gradient(90deg, transparent 0 15%, var(--jersey-secondary) 15% 20%, transparent 20% 80%, var(--jersey-secondary) 80% 85%, transparent 85% 100%),
        linear-gradient(180deg, color-mix(in srgb, white 10%, transparent) 0%, transparent 34%, rgba(0, 0, 0, 0.12) 100%),
        var(--jersey-primary);
    }

    .jersey.sport-basketball::before {
      inset: 4% 21% 7%;
      border-left-width: calc(var(--pixel) * 1.5);
      border-right-width: calc(var(--pixel) * 1.5);
      border-top: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 82%, transparent);
      background:
        radial-gradient(ellipse 23% 17% at 50% -6%, transparent 0 54%, color-mix(in srgb, var(--jersey-trim) 88%, transparent) 55% 67%, color-mix(in srgb, var(--jersey-secondary) 92%, black) 68% 80%, transparent 81%),
        linear-gradient(90deg, color-mix(in srgb, black 8%, transparent) 0 var(--pixel), transparent var(--pixel) calc(100% - var(--pixel)), color-mix(in srgb, black 12%, transparent) calc(100% - var(--pixel)) 100%),
        color-mix(in srgb, var(--jersey-primary) 90%, white);
    }

    .jersey.sport-basketball::after {
      right: 20%;
      bottom: 18%;
      width: 9%;
      height: 16%;
      border-radius: 999px 999px 4px 4px;
      background:
        linear-gradient(180deg, transparent 0 48%, color-mix(in srgb, var(--jersey-trim) 42%, transparent) 48% 64%, transparent 64% 100%),
        color-mix(in srgb, black 12%, transparent);
      opacity: 0.6;
    }

    .jersey.sport-baseball {
      grid-template-rows: 20% 1fr 8%;
      padding: 7% 8% 7%;
      clip-path: polygon(18% 0, 82% 0, 88% 6%, 96% 11%, 100% 21%, 98% 33%, 87% 37%, 81% 31%, 81% 100%, 19% 100%, 19% 31%, 13% 37%, 2% 33%, 0 21%, 4% 11%, 12% 6%);
      background:
        linear-gradient(180deg, var(--jersey-secondary) 0 4%, var(--jersey-trim) 4% 7%, transparent 7% 100%),
        linear-gradient(90deg, transparent 0 7%, var(--jersey-secondary) 7% 12%, transparent 12% 88%, var(--jersey-secondary) 88% 93%, transparent 93% 100%),
        repeating-linear-gradient(90deg, transparent 0 16px, color-mix(in srgb, var(--jersey-secondary) 24%, transparent) 16px 18px, transparent 18px 32px),
        linear-gradient(180deg, color-mix(in srgb, white 11%, transparent) 0%, transparent 32%, rgba(0, 0, 0, 0.08) 100%),
        var(--jersey-primary);
    }

    .jersey.sport-baseball::before {
      inset: 4% 19% 7%;
      background:
        radial-gradient(ellipse 20% 16% at 50% -7%, transparent 0 54%, color-mix(in srgb, var(--jersey-trim) 90%, transparent) 55% 67%, color-mix(in srgb, var(--jersey-secondary) 82%, black) 68% 80%, transparent 81%),
        radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--jersey-secondary) 92%, black) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 47%, color-mix(in srgb, var(--jersey-secondary) 92%, black) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 64%, color-mix(in srgb, var(--jersey-secondary) 92%, black) 0 2px, transparent 3px),
        linear-gradient(90deg, transparent 0 48%, color-mix(in srgb, var(--jersey-trim) 86%, transparent) 48% 49.5%, color-mix(in srgb, var(--jersey-secondary) 42%, transparent) 49.5% 50.5%, color-mix(in srgb, var(--jersey-trim) 86%, transparent) 50.5% 52%, transparent 52% 100%),
        repeating-linear-gradient(90deg, transparent 0 17px, color-mix(in srgb, var(--jersey-secondary) 24%, transparent) 17px 19px, transparent 19px 34px),
        color-mix(in srgb, var(--jersey-primary) 92%, white);
      border-top: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 84%, transparent);
      border-left: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 82%, transparent);
      border-right: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 82%, transparent);
      border-bottom: var(--pixel) solid color-mix(in srgb, var(--jersey-trim) 72%, transparent);
    }

    .jersey.sport-baseball::after {
      content: none;
    }

    .jersey-name {
      display: none;
    }

    .jersey-input,
    .jersey-number,
    .jersey-placeholder {
      position: relative;
      z-index: 1;
      grid-column: 1;
      grid-row: 2;
      width: 98%;
      min-width: 0;
      height: 58px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--jersey-number);
      font-family: var(--font-pixel);
      font-size: calc(var(--number-font-size) * var(--number-scale));
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-shadow:
        var(--number-outline) 0 0 var(--jersey-number-shadow),
        calc(var(--number-outline) * -1) 0 0 var(--jersey-number-shadow),
        0 var(--number-outline) 0 var(--jersey-number-shadow),
        0 calc(var(--number-outline) * -1) 0 var(--jersey-number-shadow);
      font-variant-numeric: tabular-nums;
    }

    .jersey.sport-baseball .jersey-input,
    .jersey.sport-baseball .jersey-number,
    .jersey.sport-baseball .jersey-placeholder {
      grid-row: 1 / span 2;
      align-self: start;
      justify-self: start;
      width: 44%;
      height: 42px;
      margin-top: 37%;
      margin-left: 13%;
      font-size: calc(clamp(0.9rem, 14cqw, 1.48rem) * var(--number-scale));
      text-shadow: none;
    }

    .jersey-input {
      appearance: textfield;
      -webkit-appearance: none;
      caret-color: var(--jersey-number);
      outline: 0;
      text-indent: 0;
    }

    .jersey-input::placeholder {
      color: transparent;
      opacity: 1;
      text-shadow: none;
    }

    .jersey-input:placeholder-shown {
      text-shadow: none;
    }

    .jersey-placeholder {
      pointer-events: none;
    }

    .jersey-input:not(:placeholder-shown) + .jersey-placeholder {
      visibility: hidden;
    }

    .jersey-input:focus {
      background: color-mix(in srgb, var(--jersey-trim) 14%, transparent);
      box-shadow: 0 0 0 var(--pixel) color-mix(in srgb, var(--jersey-trim) 72%, transparent);
    }

    /* Baseball wears its number small in the upper chest, not centered; the
       focus box looks like a sticker there, so keep it shadow-free. */
    .jersey.sport-baseball .jersey-input:focus {
      background: transparent;
      box-shadow: none;
    }

    .jersey-input.number-flash {
      animation: flashJerseyNumber 560ms steps(2, end);
    }

    @keyframes flashJerseyNumber {
      0%, 100% {
        filter: none;
        transform: scale(1);
      }
      20%, 60% {
        filter: brightness(1.8);
        transform: scale(1.08);
      }
      40%, 80% {
        filter: brightness(0.75);
        transform: scale(0.96);
      }
    }

    .jersey-input:disabled {
      opacity: 1;
      -webkit-text-fill-color: var(--jersey-number);
    }

    .jersey-sport {
      position: relative;
      z-index: 1;
      grid-column: 1;
      grid-row: 3;
      align-self: end;
      color: color-mix(in srgb, var(--jersey-trim) 72%, var(--jersey-secondary));
      font-size: 0.54rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1;
      text-transform: uppercase;
    }

    .auto-note {
      margin-top: -2px;
      color: var(--accent);
      font-size: 0.52rem;
      font-weight: 900;

    }

    .status {
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--muted);

      font-size: 0.52rem;
      font-weight: 800;
      line-height: 1.65;
      text-align: center;
      text-transform: uppercase;
    }

    .status.error {

      border-color: color-mix(in srgb, var(--bad) 68%, transparent);
      background: color-mix(in srgb, var(--bad) 18%, rgba(0, 0, 0, 0.28));
    }

    .status.good {
      color: #defee4;
      border-color: color-mix(in srgb, var(--good) 68%, transparent);
      background: color-mix(in srgb, var(--good) 18%, rgba(0, 0, 0, 0.28));
    }

    .status.flash {
      animation: flashStatus 380ms ease;
    }

    @keyframes flashStatus {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .action-row {
      display: grid;
      grid-template-columns: minmax(96px, 0.42fr) minmax(0, 1fr);
      gap: 8px;
    }

    .check-btn,
    .hint-btn {
      width: 100%;
      min-height: 54px;
      border: 2px solid color-mix(in srgb, var(--accent) 74%, white);

      font-weight: 900;

        inset 0 2px 0 rgba(255, 255, 255, 0.3),

      cursor: pointer;
    }

    .hint-btn {
      border-color: color-mix(in srgb, var(--ink) 42%, var(--accent));
      background:
        linear-gradient(180deg, color-mix(in srgb, white 12%, transparent) 0%, transparent 52%),
        color-mix(in srgb, var(--panel-strong) 78%, var(--accent));
      color: var(--ink);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.14),
        0 8px 18px rgba(0, 0, 0, 0.2);
    }

    .check-btn:active,
    .hint-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.24);
    }

    .check-btn:disabled,
    .hint-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .confetti {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      left: var(--x);
      top: -18px;
      width: 10px;
      height: 14px;
      background: var(--c);
      transform: rotate(var(--r));
      animation: confettiDrop var(--d) cubic-bezier(.16,.78,.33,.99) forwards;
    }

      100% {

      }
    }

       jerseys plus the action row stay reachable without much scrolling. */

      async function fetchRandomJerseyRecord() {
        if (getParam(['demo', 'sample']) === '1') {
          return SAMPLE_RECORDS[Math.floor(Math.random() * SAMPLE_RECORDS.length)];
        }

        // If the URL names a city, pull a random record from that city first.
        // Fall back to a fully random record when no city is given or the city
        // has no matching puzzles.
        const city = getParam(['city', 'market']);
        if (city) {
          const cityRecord = await fetchRandomRecord({ city: 'ilike.' + city });
          if (cityRecord) return cityRecord;
        }

        const record = await fetchRandomRecord(null);
        if (record) return record;
        throw new Error('No jersey puzzles found.');

      // Best effort random row with PostgREST count+offset. If count is not
      // available, fall back to a small batch and pick locally. Returns null
      // when no rows match the (optional) filters.
      async function fetchRandomRecord(filters) {
        const baseParams = { select: JERSEY_SELECT, limit: '1', ...(filters || {}) };
        const firstUrl = restUrl(SB_CONFIG.table, baseParams);
        const firstResponse = await fetch(firstUrl, {
          cache: 'no-store',
          headers: supabaseHeaders({ Prefer: 'count=exact' })
        });
        if (!firstResponse.ok) {
          throw new Error(await readSupabaseError(firstResponse, 'Could not load jersey puzzles.'));
        }
        const firstRows = await firstResponse.json();
        const count = parseContentRangeCount(firstResponse.headers.get('content-range'));
        if (count > 1) {
          const offset = Math.floor(Math.random() * count);
          const rowUrl = restUrl(SB_CONFIG.table, { ...baseParams, offset: String(offset) });
          const rowResponse = await fetch(rowUrl, { cache: 'no-store', headers: supabaseHeaders() });
          if (!rowResponse.ok) {
            throw new Error(await readSupabaseError(rowResponse, 'Could not load a random jersey puzzle.'));
          }
          const rows = await rowResponse.json();
          if (Array.isArray(rows) && rows.length) return rows[0];
        }
        if (Array.isArray(firstRows) && firstRows.length) return firstRows[0];

        const fallbackUrl = restUrl(SB_CONFIG.table, { select: JERSEY_SELECT, limit: '100', ...(filters || {}) });
        const fallbackResponse = await fetch(fallbackUrl, { cache: 'no-store', headers: supabaseHeaders() });
        if (!fallbackResponse.ok) {
          throw new Error(await readSupabaseError(fallbackResponse, 'Could not load jersey puzzles.'));

        const fallbackRows = await fallbackResponse.json();
        if (!Array.isArray(fallbackRows) || !fallbackRows.length) return null;
        return fallbackRows[Math.floor(Math.random() * fallbackRows.length)];

        }
      }

      function buildTeamCatalog(rows) {
        const map = new Map();
        (Array.isArray(rows) ? rows : []).forEach((row) => {
          if (!row || typeof row !== 'object') return;
          const team = {
            league: row.league || '',
            code: row.code || '',
            fullName: row.fullName || row.full_name || '',
            firstName: row.firstName || row.first_name || '',
            fanbase: row.fanbase || row.firstName || row.first_name || '',
            mascot: row.mascot || '',
            sport: row.sport || '',
            shell: row.shell || '',
            stripe: row.stripe || '',
            mask: row.mask || ''
          };
          const keys = [
            team.fullName,
            team.code,
            team.fanbase,
            team.mascot,
            team.fanbase && team.mascot ? team.fanbase + ' ' + team.mascot : ''
          ];
          keys.forEach((key) => {
            const normalized = normalizeKey(key);
            if (normalized && !map.has(normalized)) map.set(normalized, team);
          });
        });
        return map;
      }

      function flattenTeamsJson(doc) {
        const rows = [];
        const leagues = doc && doc.leagues && typeof doc.leagues === 'object' ? doc.leagues : {};
        Object.keys(leagues).forEach((league) => {
          const node = leagues[league];
          Object.keys(node || {}).forEach((key) => {
            const value = node[key];
            if (!value || typeof value !== 'object') return;
            if ('fullName' in value || 'fanbase' in value || 'mascot' in value) {
              rows.push({ ...value, league, code: key });
              return;
            }
            Object.keys(value).forEach((code) => {
              const team = value[code];
              if (team && typeof team === 'object') rows.push({ ...team, league, code });
            });
          });
        });
        return rows;
      }

      function normalizeRecord(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const record = {
          city: cleanText(raw.city),
          operator: cleanText(raw.operator),
          players: [
            playerFromRecord(raw, 1),
            playerFromRecord(raw, 2),
            playerFromRecord(raw, 3)
          ]
        };
        if (!record.players.every((player) => player.name && isValidJerseyNumber(player.num))) return null;
        return record;
      }

      function playerFromRecord(raw, index) {
        return {
          name: cleanText(raw['player' + index + 'name']),
          num: Number(raw['player' + index + 'num']),
          sport: cleanText(raw['player' + index + 'sport']),
          team: cleanText(raw['player' + index + 'team'])
        };
      }

      function renderRecord(record) {
        els.cityPill.textContent = record.city || 'Mystery City';
        els.teamPill.textContent = sharedTeamLabel(record) || 'Mixed Teams';
        els.operator.textContent = record.operator || '?';
        state.unsupportedOperator = !isSupportedOperator(record.operator);

        record.players.forEach((player, index) => {
          const number = index + 1;
          const palette = resolveTeamPalette(player);
          const displayName = formatPlayerName(player);
          const jersey = document.getElementById('jersey' + number);
          const nameEl = document.getElementById('player' + number + 'Name');
          const nameCalloutEl = document.getElementById('player' + number + 'NameCallout');
          const sportEl = document.getElementById('player' + number + 'Sport');
          const cityEl = document.getElementById('player' + number + 'City');
          const sportLineEl = document.getElementById('player' + number + 'SportLine');
          const labelEl = document.getElementById('player' + number + 'Label');
          applyJerseyPalette(jersey, palette, player.sport);
          nameEl.textContent = displayName;
          if (nameCalloutEl) {
            renderNameCallout(nameCalloutEl, displayName);
            fitNameCallout(nameCalloutEl);
          }
          sportEl.textContent = player.sport || palette.sport || 'sport';
          if (cityEl) cityEl.textContent = teamLocale(player, palette);
          if (sportLineEl) sportLineEl.textContent = player.sport || palette.sport || '';
          if (labelEl) labelEl.textContent = displayName + ' jersey number';
        });
        els.inputs.forEach((input) => {
          input.disabled = false;
          setNumberScale(input, input.value);
        });

        if (state.unsupportedOperator) {
          setStatus('ERROR', 'error');
          els.check.disabled = true;
          els.hint.disabled = true;
        } else {
          setStatus('Enter any two jersey numbers.', '');
          els.check.disabled = false;
          els.hint.disabled = false;
        }
        recalculate();
      }

      function fitNameCallout(element) {
        if (!element) return;
        element.style.setProperty('--name-scale', '1');
        requestAnimationFrame(() => {
          const available = element.clientWidth;
          const actual = element.scrollWidth;
          if (!available || !actual || actual <= available) return;
          const scale = Math.max(0.5, Math.min(1, available / actual));
          element.style.setProperty('--name-scale', String(scale));
        });
      }

      function refitNameCallouts() {
        document.querySelectorAll('.jersey-name-callout').forEach(fitNameCallout);
      }

      function resolveTeamPalette(player) {
        const direct = state.teams.get(normalizeKey(player.team));
        if (direct) return direct;
        const extra = EXTRA_TEAM_PALETTES.get(normalizeKey(player.team));
        if (extra) return extra;
        const cityTeam = state.teams.get(normalizeKey((state.record && state.record.city || '') + ' ' + player.team));
        if (cityTeam) return cityTeam;
        return {
          ...DEFAULT_PALETTE,
          fullName: player.team || DEFAULT_PALETTE.fullName,
          sport: player.sport || DEFAULT_PALETTE.sport
        };
      }

      function applyJerseyPalette(jersey, palette, sport) {
        if (!jersey) return;
        const primary = safeColor(palette.shell) || DEFAULT_PALETTE.shell;
        const secondary = safeColor(palette.stripe) || readableTextColor(primary);
        const trim = safeColor(palette.mask) || '#ffffff';
        const number = contrastEnough(secondary, primary) ? secondary : readableTextColor(primary);
        const shadow = readableTextColor(number);
        jersey.style.setProperty('--jersey-primary', primary);
        jersey.style.setProperty('--jersey-secondary', secondary);
        jersey.style.setProperty('--jersey-trim', trim);
        jersey.style.setProperty('--jersey-number', number);
        jersey.style.setProperty('--jersey-number-shadow', shadow);
        jersey.classList.remove('sport-football', 'sport-hockey', 'sport-basketball', 'sport-baseball');
        jersey.classList.add('sport-' + normalizeSport(sport || palette.sport));
      }

      function resetInputs() {
        state.calculated = null;
        state.calculatedSlot = null;
        state.manualSlots = [];
        state.hintUsed = false;
        state.solved = false;
        els.inputs.forEach((input) => {
          input.value = '';
          input.disabled = false;
          input.classList.remove('is-calculated', 'number-flash');
          setNumberScale(input, '');
        });
        els.check.textContent = 'CHECK YOUR ANSWERS';
        els.hint.disabled = false;
      }

      function markManualSlot(slot) {
        state.manualSlots = state.manualSlots.filter((manualSlot) => manualSlot !== slot);
        if (isValidJerseyNumber(parseInputNumber(els.inputs[slot].value))) {
          state.manualSlots.push(slot);
        }
      }

      function clearSlot(slot) {
        const input = els.inputs[slot];
        if (!input) return;
        input.value = '';
        input.classList.remove('is-calculated', 'number-flash');
        setNumberScale(input, '');
      }

      function setCalculatedSlot(slot, value, options) {
        const input = els.inputs[slot];
        if (!input) return;
        const shouldFlash = Boolean(options && options.flash) || input.value !== value;
        input.value = value;
        input.classList.add('is-calculated');
        setNumberScale(input, value);
        if (shouldFlash) flashNumber(input);
      }

      function recalculate() {
        if (!state.record || state.unsupportedOperator) return;
        state.manualSlots = state.manualSlots.filter((slot) => isValidJerseyNumber(parseInputNumber(els.inputs[slot].value)));
        els.inputs.forEach((input, index) => {
          if (index !== state.calculatedSlot) input.classList.remove('is-calculated');
        });

        if (state.manualSlots.length >= 3) {
          state.calculated = null;
          state.calculatedSlot = null;
          els.inputs.forEach((input) => input.classList.remove('is-calculated'));
          if (!state.solved) setStatus('Now check the jerseys.', '');
          return;
        }

        if (state.manualSlots.length < 2) {
          if (state.calculatedSlot !== null) clearSlot(state.calculatedSlot);
          state.calculated = null;
          state.calculatedSlot = null;
          if (!state.solved) setStatus('Enter any two jersey numbers.', '');
          return;
        }

        const missingSlot = [0, 1, 2].find((slot) => !state.manualSlots.includes(slot));
        const values = els.inputs.map((input) => parseInputNumber(input.value));
        state.calculated = calculateMissingValue(missingSlot, values, state.record.operator);
        if (!isValidJerseyNumber(state.calculated)) {
          clearSlot(missingSlot);
          state.calculated = null;
          state.calculatedSlot = null;
          if (!state.solved) setStatus('Jersey numbers are one or two digits.', 'error');
          return;
        }
        state.calculatedSlot = missingSlot;
        const calculatedText = formatNumber(state.calculated);
        setCalculatedSlot(missingSlot, calculatedText);
        if (!state.solved) setStatus('Now check the jerseys.', '');
      }

      function useHint() {
        if (!state.record || state.unsupportedOperator || state.solved || state.hintUsed) return;
        const finalSlot = Math.floor(Math.random() * els.inputs.length);
        const input = els.inputs[finalSlot];
        const hintValue = formatNumber(state.record.players[finalSlot].num);

        state.calculated = null;
        state.calculatedSlot = null;
        state.manualSlots = [];
        state.hintUsed = true;
        els.inputs.forEach((slotInput, index) => {
          if (index !== finalSlot) clearSlot(index);
          slotInput.disabled = false;
          slotInput.classList.remove('is-calculated');
        });
        input.value = hintValue;
        setNumberScale(input, hintValue);
        markManualSlot(finalSlot);
        flashNumber(input);
        els.hint.disabled = true;

        if (!state.solved) setStatus('Hint added. Enter the two remaining jersey numbers.', '');
      }

      function checkAnswers() {
        if (!state.record || state.unsupportedOperator) return;
        recalculate();
        const values = els.inputs.map((input) => parseInputNumber(input.value));
        const expected = state.record.players;
        const correct = values.every(isValidJerseyNumber)
          && values[0] === expected[0].num
          && values[1] === expected[1].num
          && values[2] === expected[2].num;

        if (!correct) {
          flashTryAgain();
          return;
        }

        state.solved = true;
        els.inputs.forEach((input) => { input.disabled = true; });
        els.hint.disabled = true;
        setStatus('TOUCHDOWN!', 'good');
        els.check.textContent = 'CLOSE';
        fireConfetti();
      }

      function flashNumber(input) {
        if (!input) return;
        input.classList.remove('number-flash');
        void input.offsetWidth;
        input.classList.add('number-flash');
      }

      function flashTryAgain() {
        setStatus('TRY AGAIN', 'error');
        els.status.classList.remove('flash');
        void els.status.offsetWidth;
        els.status.classList.add('flash');
      }

      function fireConfetti() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const colors = ['#d3bc8d', '#ffffff', '#101820', '#75d989', '#ff785f'];
        els.confetti.innerHTML = '';
        for (let i = 0; i < 52; i += 1) {
          const piece = document.createElement('span');
          piece.className = 'confetti-piece';
          piece.style.setProperty('--x', Math.floor(Math.random() * 100) + '%');
          piece.style.setProperty('--dx', (Math.random() * 180 - 90).toFixed(0) + 'px');
          piece.style.setProperty('--r', Math.floor(Math.random() * 360) + 'deg');
          piece.style.setProperty('--d', (900 + Math.random() * 1100).toFixed(0) + 'ms');
          piece.style.setProperty('--c', colors[i % colors.length]);
          els.confetti.appendChild(piece);
        }
        window.setTimeout(() => { els.confetti.innerHTML = ''; }, 2300);
      }

      function closeGame() {
        if (getParam(['embedded']) === '1' && window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'tgb:minigame:complete', game: 'jersey' }, '*');
          return;
        }

        const safeTarget = getSafeReturnUrl(returnTarget);
        if (safeTarget) {
          window.location.href = safeTarget;
          return;
        }
        if (document.referrer) {
          window.location.href = document.referrer;
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
        }
      }

      function showPlay() {
        els.loading.hidden = true;
        els.error.hidden = true;
        els.play.hidden = false;
      }

      function showError(message) {
        els.loading.hidden = true;
        els.play.hidden = true;
        els.error.hidden = false;
        els.errorCopy.textContent = message;
      }

      function setStatus(text, type) {
        els.status.textContent = text;
        els.status.className = 'status' + (type ? ' ' + type : '');
      }

      function calculate(first, operator, second) {
        if (operator === '+') return first + second;
        if (operator === '-') return first - second;
        return null;
      }

      function calculateMissingValue(slot, values, operator) {
        const first = values[0];
        const second = values[1];
        const third = values[2];
        if (slot === 0 && operator === '+') return third - second;
        if (slot === 0 && operator === '-') return third + second;
        if (slot === 1 && operator === '+') return third - first;
        if (slot === 1 && operator === '-') return first - third;
        if (slot === 2) return calculate(first, operator, second);
        return null;
      }

      function isSupportedOperator(operator) {
        return operator === '+' || operator === '-';
      }

      function sharedTeamLabel(record) {
        const teams = Array.from(new Set(record.players.map((player) => player.team).filter(Boolean)));
        return teams.length === 1 ? teams[0] : '';
      }

      function parseInputNumber(value) {
        const text = sanitizeNumberInput(value);
        if (!text) return NaN;
        return Number.parseInt(text, 10);
      }

      function sanitizeNumberInput(value) {
        const raw = String(value || '');
        let result = '';
        for (const char of raw) {
          if (char >= '0' && char <= '9') {
            result += char;
            if (result.length >= 2) break;
          }
        }
        return result;
      }

      function formatNumber(value) {
        if (!isValidJerseyNumber(value)) return '';
        const normalized = Object.is(value, -0) ? 0 : value;
        return String(normalized);
      }

      function isValidJerseyNumber(value) {
        return Number.isInteger(value) && value >= 0 && value <= 99;
      }

      function setNumberScale(element) {
        if (!element) return;
        const isBaseball = !!(element.closest && element.closest('.sport-baseball'));
        element.style.setProperty('--number-scale', '1');
        element.style.setProperty('--number-outline', '2px');
        if (isBaseball) {
          element.style.setProperty('--baseball-number-outline', '2px');
        } else {
          element.style.removeProperty('--baseball-number-outline');
        }
      }

      function restUrl(table, paramsObj) {
        const url = new URL('/rest/v1/' + encodeURIComponent(table), SB_CONFIG.url + '/');
        Object.keys(paramsObj || {}).forEach((key) => {
          url.searchParams.set(key, paramsObj[key]);
        });
        return url.toString();
      }

      function supabaseHeaders(extra) {
        return {
          apikey: SB_CONFIG.key,
          Authorization: 'Bearer ' + SB_CONFIG.key,
          Accept: 'application/json',
          ...(extra || {})
        };
      }

      async function readSupabaseError(response, fallback) {
        try {
          const text = await response.text();
          if (!text) return fallback;
          try {
            const data = JSON.parse(text);
            return data.message || data.msg || data.error || fallback;
          } catch (error) {
            return text.slice(0, 220) || fallback;
          }
        } catch (error) {
          return fallback;
        }
      }

      function parseContentRangeCount(value) {
        const match = String(value || '').match(/\/(\d+)$/);
        return match ? Number(match[1]) : 0;
      }

      function readableError() {
        return '';
      }

      function getParam(names) {
        for (const name of names) {
          const value = params.get(name);
          if (value != null && String(value).trim()) return String(value).trim();
        }
        return '';
      }

      function getSafeReturnUrl(value) {
        if (!value) return '';
        try {
          const url = new URL(value, window.location.href);
          if (url.origin === window.location.origin) return url.href;
        } catch (error) {}
        return '';
      }

      function cleanText(value) {
        return String(value == null ? '' : value).trim();
      }

      function formatPlayerName(player) {
        const source = cleanText(player && player.name);
        if (!source) return '';
        return titleCasePlayerName(source);
      }

      // Stack the name like a real nameplate: first name small on top, last
      // name big below. Single-token names just fill the last line.
      function renderNameCallout(element, fullName) {
        if (!element) return;
        const parts = splitPlayerName(fullName);
        element.textContent = '';
        if (parts.first) {
          const first = document.createElement('span');
          first.className = 'jersey-name-line jersey-name-line--first';
          first.textContent = parts.first;
          element.appendChild(first);
        }
        const last = document.createElement('span');
        last.className = 'jersey-name-line jersey-name-line--last';
        last.textContent = parts.last;
        element.appendChild(last);
      }

      function splitPlayerName(fullName) {
        const clean = cleanText(fullName);
        const tokens = clean.split(/\s+/).filter(Boolean);
        if (tokens.length <= 1) return { first: '', last: clean };
        return { first: tokens[0], last: tokens.slice(1).join(' ') };
      }

      // What the team "goes by" — Golden State, Tennessee, New Orleans — even
      // though we search/pull puzzles by the city the TGB game is set in.
      function teamLocale(player, palette) {
        const fromPalette = cleanText(palette && palette.firstName);
        if (fromPalette) return fromPalette;
        const team = cleanText(player && player.team);
        if (team) {
          const tokens = team.split(/\s+/).filter(Boolean);
          if (tokens.length > 1) return tokens.slice(0, -1).join(' ');
          return team;
        }
        return (state.record && state.record.city) || '';
      }

      function titleCasePlayerName(value) {
        return cleanText(value)
          .toLowerCase()
          .split(/(\s+|-)/)
          .map((part) => {
            if (!part || /^\s+$/.test(part) || part === '-') return part;
            if (/^[a-z]\.$/.test(part)) return part.toUpperCase();
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join('');
      }

      function playerNameKey(team, name, num) {
        return [normalizeKey(team), normalizeKey(name), String(Number(num))].join('|');
      }

      function normalizeKey(value) {
        return String(value || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
      }

      function normalizeSport(value) {
        const sport = normalizeKey(value);
        if (sport === 'hockey') return 'hockey';
        if (sport === 'basketball') return 'basketball';
        if (sport === 'baseball') return 'baseball';
        return 'football';
      }

      function safeColor(value) {
        const text = cleanText(value);
        return /^(#[0-9a-f]{3}|#[0-9a-f]{6}|#[0-9a-f]{8})$/i.test(text) ? text : '';
      }

      function readableTextColor(bg) {
        const rgb = hexToRgb(bg);
        if (!rgb) return '#ffffff';
        const lum = relativeLuminance(rgb);
        return lum > 0.48 ? '#101820' : '#fff7dd';
      }

      function contrastEnough(fg, bg) {
        const a = hexToRgb(fg);
        const b = hexToRgb(bg);
        if (!a || !b) return true;
        const la = relativeLuminance(a) + 0.05;
        const lb = relativeLuminance(b) + 0.05;
        return Math.max(la, lb) / Math.min(la, lb) >= 2.4;
      }

      function hexToRgb(value) {
        let hex = safeColor(value).replace('#', '');
        if (!hex) return null;
        if (hex.length === 3) hex = hex.split('').map((char) => char + char).join('');
        if (hex.length === 8) hex = hex.slice(0, 6);
        const num = Number.parseInt(hex, 16);
        if (!Number.isFinite(num)) return null;
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255
        };
      }

      function relativeLuminance(rgb) {
        const channels = [rgb.r, rgb.g, rgb.b].map((value) => {
          const channel = value / 255;
          return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
        });
        return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
      }
    }());
  </script>
  <script src="../../assets/admin-bridge.js"></script>
