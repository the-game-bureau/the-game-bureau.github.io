<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>GIFT SHOP | THE GAME BUREAU</title>
  <meta name="description" content="Game souvenirs and other curated memorabilia — books, gear, and local finds tied to the cities our games are played in.">
  <link rel="canonical" href="https://thegamebureau.com/shop/">

  <!-- Social share / link-preview meta. og:image is the shop banner so shared
       links thumbnail with it. Absolute URLs (custom domain) so crawlers resolve
       them regardless of where the page is embedded. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Game Bureau">
  <meta property="og:url" content="https://thegamebureau.com/shop/">
  <meta property="og:title" content="The Game Bureau — Gift Shop">
  <meta property="og:description" content="Game souvenirs and other curated memorabilia — books, gear, and local finds tied to the cities our games are played in.">
  <meta property="og:image" content="https://thegamebureau.com/shop/shop_banner.png">
  <meta property="og:image:width" content="1672">
  <meta property="og:image:height" content="941">
  <meta property="og:image:alt" content="The Game Bureau Gift Shop">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@thegamebureau">
  <meta name="twitter:creator" content="@thegamebureau">
  <meta name="twitter:title" content="The Game Bureau — Gift Shop">
  <meta name="twitter:description" content="Game souvenirs and other curated memorabilia — books, gear, and local finds tied to the cities our games are played in.">
  <meta name="twitter:image" content="https://thegamebureau.com/shop/shop_banner.png">
  <meta name="twitter:image:alt" content="The Game Bureau Gift Shop">

  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@500;600&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site-shell.css">
  <link rel="stylesheet" href="../assets/site-pages.css">
  <script src="../assets/public-account.js"></script>
  <script src="../assets/team-palette.js"></script>
  <script src="../assets/states/us-state-shapes.js"></script>
  <style>
    /* ── Gift shop overrides on top of site-shell.css home-page chrome.
       Body class `home-page` brings the dark night theme, nav, footer,
       Big Shoulders Display + JetBrains Mono. These rules style the
       gift-specific surfaces (grid cards, cart modal) to match. ──── */

    body.home-page .gift-page {
      display: grid;
      gap: 28px;
    }

    body.home-page .hero-kicker {
      margin: 0 0 18px;
      color: var(--accent);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Shorter hero for the gift shop — no scrolling meta panel here, so
       the games-page tall hero is overkill. */
    body.home-page main.gift-page .hero {
      min-height: 0;
      padding: clamp(28px, 4vw, 48px);
      background:
        linear-gradient(95deg,
          rgba(8, 11, 17, 0.94) 0%,
          rgba(8, 11, 17, 0.82) 32%,
          rgba(8, 11, 17, 0.48) 56%,
          rgba(8, 11, 17, 0.20) 78%,
          rgba(8, 11, 17, 0.08) 100%),
        url("/shop/shop_banner.png") center right / cover no-repeat;
    }
    body.home-page main.gift-page .hero-grid {
      min-height: 0;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    /* Container — mirrors body.home-page .selected-games panel. */
    body.home-page .gift-grid-wrap {
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.01)),
        rgba(11, 16, 24, 0.86);
      box-shadow: var(--shadow-panel);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    body.home-page .gift-city-panel {
      display: grid;
      gap: 12px;
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    body.home-page .gift-city-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line);
    }
    body.home-page .gift-city-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }
    body.home-page .gift-city-count {
      color: var(--muted);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    /* Horizontal auto-scrolling city rail (mirrors the Games-page hero list:
       no scrollbar, infinite loop via 3 cloned chunks, click-drag to swipe). */
    body.home-page .gift-city-list {
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      /* Top room so the hover lift + ring isn't clipped; scrollbar hidden. */
      padding: 8px 0 14px;
      -ms-overflow-style: none;
      cursor: grab;
    }
    body.home-page .gift-city-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body.home-page .gift-city-list.is-dragging { cursor: grabbing; }
    body.home-page .gift-city-list.is-dragging .hero-meta-list-item { cursor: grabbing; }
    body.home-page .gift-city-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 8px;
    }
    body.home-page .gift-city-chunk {
      display: flex;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 8px;
    }
    /* City rail chips reuse the shared hero-meta-list-item look from
       site-shell.css (the same rows the Games page uses, incl. the
       country/state geo badges). Sized to their content so the full city name
       stays readable, with the hover shadow trimmed so it doesn't spill. */
    body.home-page .gift-city-list .hero-meta-list-item {
      flex: 0 0 auto;
      width: auto;
      /* Content-size the name column (vs the shared minmax(0,1fr)) so the full
         city name is readable instead of ellipsized. */
      grid-template-columns: 44px auto auto;
    }
    body.home-page .gift-city-list .hero-meta-list-name {
      overflow: visible;
      text-overflow: clip;
    }
    body.home-page .gift-city-list .hero-meta-list-item:hover {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 2px var(--accent),
        0 12px 26px rgba(0, 0, 0, 0.4);
    }

    body.home-page .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Cards: match game-card dark-surface + size treatment ──────── */
    body.home-page .card,
    body.home-page .empty {
      position: relative;
      display: grid;
      grid-template-rows: 154px minmax(0, 1fr);
      /* taller body so a 3-line description + "More" + CTA all fit */
      min-width: 0;
      height: 416px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card-paper);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-chip);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    body.home-page .card:hover,
    body.home-page .card:focus-visible {
      border-color: rgba(245, 180, 97, 0.34);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
      transform: translateY(-3px);
      outline: none;
    }

    body.home-page .card[data-game-color] {
      --card-secondary: var(--card-game-color, var(--accent));
    }

    body.home-page .card-media {
      position: relative;
      height: 154px;
      min-height: 154px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media::before { content: none; }
    body.home-page .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    body.home-page .card-monogram {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    body.home-page .card-media[data-has-image="true"] .card-monogram {
      display: none;
    }
    body.home-page .card-media[data-image-fit="contain"] {
      background:
        linear-gradient(180deg, rgba(8, 11, 17, 0.20), rgba(8, 11, 17, 0.72)),
        var(--gift-contain-image) center / cover no-repeat,
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media[data-image-fit="contain"] .card-image {
      z-index: 1;
      box-sizing: border-box;
      padding: 8px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.36));
    }

    body.home-page .card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px 16px;
      min-height: 0;
      overflow: hidden;
    }

    body.home-page .card-game-eyebrow,
    body.home-page .card-price,
    body.home-page .card-cta {
      color: rgba(243, 238, 220, 0.62);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    body.home-page .card-game-eyebrow { display: none; }
    body.home-page .card-price { color: var(--ink); }
    /* Prices are not shown anywhere in the public gift shop. */
    body.home-page .card-price,
    .gift-detail-price { display: none !important; }

    /* Admin-only logout pill (upper-right). Mirrors admin-bridge's EDIT GIFT
       button; hidden unless admin-bridge has verified a logged-in admin
       (it adds html.tgb-admin-authorized). */
    .gift-admin-logout {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1300;
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #111;
      background: #111;
      color: #fff;
      font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
    }
    html.tgb-admin-authorized .gift-admin-logout { display: inline-flex; }
    .gift-admin-logout:hover,
    .gift-admin-logout:focus-visible {
      background: #fff;
      color: #111;
      outline: none;
      transform: translateY(-1px);
    }

    body.home-page .card-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    body.home-page .card-caption {
      min-height: 0;
      color: rgba(243, 238, 220, 0.72);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* "More" link on cards whose description is truncated — opens the detail
       lightbox. Sits between the caption and the CTA. */
    body.home-page .card-more {
      align-self: flex-start;
      margin-top: 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: underline;
      cursor: pointer;
    }
    body.home-page .card-more:hover,
    body.home-page .card-more:focus-visible { color: #fff; outline: none; }

    /* ── Gift detail lightbox ─────────────────────────────────────────── */
    .gift-detail {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gift-detail[hidden] { display: none; }
    .gift-detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.78);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .gift-detail-panel {
      position: relative;
      width: min(560px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(16, 21, 30, 0.97);
      color: var(--ink);
      box-shadow: 0 28px 64px rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .gift-detail-close {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: rgba(8, 12, 18, 0.6);
      color: var(--ink);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }
    .gift-detail-close:hover { background: rgba(8, 12, 18, 0.85); color: var(--accent); }
    .gift-detail-media {
      position: relative;
      height: 220px;
      flex-shrink: 0;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    .gift-detail-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gift-detail-media.is-clickable { cursor: pointer; }
    .gift-detail-media.is-clickable:hover img { opacity: 0.92; }
    .gift-detail-media.is-clickable:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .gift-detail-monogram {
      position: absolute;
      left: 16px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .gift-detail-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .gift-detail-title {
      margin: 0;
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .gift-detail-price {
      color: var(--ink);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    .gift-detail-desc {
      margin: 0;
      color: rgba(243, 238, 220, 0.82);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.86rem;
      font-weight: 400;
      line-height: 1.55;
      white-space: pre-line;
    }
    .gift-detail-cta-wrap { margin-top: 6px; }
    .gift-detail-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
    }
    .gift-detail-cta:hover { transform: translateY(-1px); }

    /* CTA styled as a full-width button matching .game-card-play —
       accent fill, 6px radius, inset highlight, hover lift + colored
       drop-shadow. The arrow keeps the affiliate "go-elsewhere" hint. */
    body.home-page .card-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: auto 0 0;
      padding: 0 14px;
      min-height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    body.home-page .card-cta::after { content: " \2192"; font-size: 1rem; line-height: 1; }
    body.home-page .card:hover .card-cta,
    body.home-page .card:focus-visible .card-cta {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32) inset,
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: translateY(-1px);
    }

    body.home-page .empty {
      grid-template-rows: auto;
      grid-column: 1 / -1;
      min-height: 180px;
      place-items: center;
      padding: 28px;
      color: rgba(243, 238, 220, 0.62);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    body.home-page .footer-note {
      max-width: 56rem;
      margin: 24px 0 0;
      color: rgba(243, 238, 220, 0.55);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      line-height: 1.6;
      text-transform: none;
    }

    /* ── Buy button — matches .game-card-play accent treatment ───── */
    body.home-page .card-buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }
    body.home-page .card-buy:hover,
    body.home-page .card-buy:focus-visible {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.32) inset,
        0 10px 24px rgba(0, 0, 0, 0.45),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      transform: translateY(-1px);
      outline: none;
    }
    body.home-page .card-buy[disabled] { opacity: 0.6; cursor: progress; }

    /* ── Cart FAB ────────────────────────────────────────────────── */
    .cart-fab {
      position: fixed;
      right: 22px; bottom: 22px;
      z-index: 1200;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(16, 21, 30, 0.92);
      color: var(--ink);
      font-family: "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .cart-fab[hidden] { display: none; }
    .cart-fab:hover { border-color: var(--accent); color: var(--accent); }
    .cart-fab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 6px;
      background: var(--accent);
      color: #080c12;
      font-size: 0.82rem;
      font-weight: 800;
    }

    /* ── Cart modal ──────────────────────────────────────────────── */
    .cart-modal {
      position: fixed;
      inset: 0;
      z-index: 1400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .cart-modal[hidden] { display: none; }
    .cart-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.75);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);

  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',

    };

    const params = new URLSearchParams(location.search);
    const requestedCity = String(params.get('city') || '').trim();
    // Optional game filter. Canonical is ?id=<game-id> (matches the engine
    // URLs); ?game= is also accepted and may be an id or a game name. The raw
    // value is resolved to a real game once the games list loads (loadAllShops).
    const requestedGameParam = String(params.get('id') || params.get('game') || '').trim();

    const statusEl = document.getElementById('status') || { textContent: '', hidden: true };
    const gridEl = document.getElementById('grid');
    const headingEl = document.getElementById('heading');
    const eyebrowEl = document.getElementById('eyebrow');
    const eyebrowSuffixEl = document.getElementById('eyebrowSuffix');
    const leadEl = document.getElementById('lead');

    function setStatus(msg) {

    function setEyebrow(text) {
      const trimmed = String(text || '').trim();

    function cityDisplayName(label) {
      const s = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(s)) return s;
      const parts = s.split(',').map((p) => p.trim()).filter(Boolean);
      return parts[0] || s || '';
    }

    function giftCityHref(city) {
      const url = new URL('/shop/', window.location.origin);
      const trimmed = String(city || '').trim();
      if (trimmed) url.searchParams.set('city', trimmed);
      return url.pathname + url.search;
    }

    function buildGiftCityEntries(shopCities, listings, allItems) {
      const itemIdsByCity = new Map();
      (Array.isArray(listings) ? listings : []).forEach((listing) => {
        const item = listing && listing.gift_shop_items;
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        // Gifts are assigned directly to a city now (gift_shop_listings.city).
        const city = String(listing && listing.city || '').trim();
        if (!city) return;
        if (!itemIdsByCity.has(city)) itemIdsByCity.set(city, new Set());
        itemIdsByCity.get(city).add(item.id);
      });
      const allVisibleItemIds = new Set();
      (Array.isArray(allItems) ? allItems : []).forEach((item) => {
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        allVisibleItemIds.add(item.id);
      });
      const rows = Array.isArray(shopCities) ? shopCities : [];
      const entries = rows
        .map((row) => {
          const city = String(row && row.city || '').trim();
          if (!city) return null;
          const label = String(row && row.label || '').trim() || cityDisplayName(city);
          const itemIds = itemIdsByCity.get(city);
          return {
            city,
            label,
            count: itemIds ? itemIds.size : 0
          };
        })
        .filter(Boolean)
        // Only surface a city that actually has at least one gift in its shop.
        .filter((entry) => entry.count > 0)
        .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base', numeric: true }) ||
          a.city.localeCompare(b.city, undefined, { sensitivity: 'base', numeric: true }));
      return { entries, total: allVisibleItemIds.size };
    }

    // ── Geo badges — mirrors the Games-page BY CITY rows so the shop's city
    // rail uses the same country-oval / state-silhouette badge. ─────────────
    const US_STATES = {
      'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
      'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',
      'hawaii':'HI','idaho':'ID','illinois':'IL','indiana':'IN','iowa':'IA',
      'kansas':'KS','kentucky':'KY','louisiana':'LA','maine':'ME','maryland':'MD',
      'massachusetts':'MA','michigan':'MI','minnesota':'MN','mississippi':'MS','missouri':'MO',
      'montana':'MT','nebraska':'NE','nevada':'NV','new hampshire':'NH','new jersey':'NJ',
      'new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND','ohio':'OH',
      'oklahoma':'OK','oregon':'OR','pennsylvania':'PA','rhode island':'RI','south carolina':'SC',
      'south dakota':'SD','tennessee':'TN','texas':'TX','utah':'UT','vermont':'VT',
      'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI','wyoming':'WY',
      'district of columbia':'DC', 'dc':'DC', 'd.c.':'DC', 'd. c.':'DC'
    };
    const COUNTRY_CODES = {
      'united kingdom':'GBR','england':'GBR','scotland':'GBR','wales':'GBR','northern ireland':'GBR',
      'france':'FRA','germany':'DEU','spain':'ESP','italy':'ITA','portugal':'PRT',
      'netherlands':'NLD','belgium':'BEL','ireland':'IRL','sweden':'SWE','norway':'NOR',
      'denmark':'DNK','finland':'FIN','austria':'AUT','switzerland':'CHE','poland':'POL',
      'czech republic':'CZE','greece':'GRC','turkey':'TUR','russia':'RUS','ukraine':'UKR',
      'mexico':'MEX','canada':'CAN','brazil':'BRA','argentina':'ARG','chile':'CHL',
      'colombia':'COL','peru':'PER','uruguay':'URY',
      'australia':'AUS','new zealand':'NZL','japan':'JPN','china':'CHN','south korea':'KOR',
      'india':'IND','singapore':'SGP','thailand':'THA','indonesia':'IDN','philippines':'PHL',
      'south africa':'ZAF','egypt':'EGY','israel':'ISR','united arab emirates':'ARE',
      'united states':'USA','usa':'USA'
    };

    function cityGeoBadge(label) {
      const labelStr = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(labelStr)) return { kind: 'state', value: 'DC' };
      const parts = labelStr.split(',').map((s) => s.trim()).filter(Boolean);
      for (let i = parts.length - 1; i >= 1; i--) {
        const key = parts[i].toLowerCase();
        if (US_STATES[key]) return { kind: 'state', value: US_STATES[key] };
        if (COUNTRY_CODES[key]) return { kind: 'country', value: COUNTRY_CODES[key] };
      }
      return null;
    }

    function svgPathCenter(pathData, fallbackX, fallbackY) {
      const numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
      if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < numbers.length - 1; i += 2) {
        const x = Number(numbers[i]);
        const y = Number(numbers[i + 1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
      if (![minX, minY, maxX, maxY].every(Number.isFinite)) return { x: fallbackX, y: fallbackY };
      return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
    }

    function buildGeoBadge(badge) {
      const cls = (s) => 'hero-meta-list-geo' + (s ? ' ' + s : '');
      const shapes = window.US_STATE_SHAPES || null;
      if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
        svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', shapes[badge.value]);
        svg.appendChild(path);
        const labelPoint = svgPathCenter(shapes[badge.value], (shapes._w || 40) / 2, (shapes._h || 24) / 2);
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', String(labelPoint.x));
        text.setAttribute('y', String(labelPoint.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('alignment-baseline', 'middle');
        text.setAttribute('dy', '0.04em');
        text.textContent = badge.value;
        svg.appendChild(text);
        return svg;
      }
      const span = document.createElement('span');
      if (badge) {
        span.className = cls('hero-meta-list-geo--' + badge.kind);
        if (badge.kind === 'country') {
          const label = document.createElement('span');
          label.className = 'hero-meta-list-geo-label';
          label.textContent = badge.value;
          span.appendChild(label);
        } else {
          span.textContent = badge.value;
        }
        span.setAttribute('aria-hidden', 'true');
      } else {
        span.className = cls('');
      }
      return span;
    }

    function renderGiftCityRail(cityData) {
      if (!giftCityPanelEl || !giftCityListEl) return;
      const entries = cityData && Array.isArray(cityData.entries) ? cityData.entries : [];
      if (!entries.length) {
        giftCityPanelEl.hidden = true;
        giftCityListEl.innerHTML = '';
        if (giftCityCountEl) giftCityCountEl.textContent = '0 cities';
        return;
      }
      giftCityPanelEl.hidden = false;
      if (giftCityCountEl) {
        giftCityCountEl.textContent = entries.length + ' cit' + (entries.length === 1 ? 'y' : 'ies');
      }

      giftCityListEl.innerHTML = '';
      const chips = [{
        city: '',
        label: 'All Cities',
        count: cityData.total || entries.reduce((sum, entry) => sum + entry.count, 0),
        isAll: true
      }].concat(entries);

      // Three identical chunks [pre | primary | post] in a flex row. We park
      // scrollLeft at the start of the primary chunk; when auto-scroll or a drag
      // pushes it out of range, setGiftCityScroll jumps by exactly one chunk
      // width — invisible because the chunks are clones, so the rail loops.
      const track = document.createElement('div');
      track.className = 'gift-city-track';
      const makeChunk = (hidden) => {
        const chunk = document.createElement('div');
        chunk.className = 'gift-city-chunk';
        if (hidden) chunk.setAttribute('aria-hidden', 'true');
        chips.forEach((entry) => chunk.appendChild(createGiftCityChip(entry)));
        return chunk;
      };
      track.append(makeChunk(true), makeChunk(false), makeChunk(true));
      giftCityListEl.appendChild(track);

      setupGiftCityScroll();
    }

    function createGiftCityChip(entry) {
      const item = document.createElement('a');
      item.className = 'hero-meta-list-item';
      item.href = giftCityHref(entry.city);
      item.dataset.city = entry.city;
      const active = entry.isAll ? !requestedCity : entry.city === requestedCity;
      if (active) {
        item.classList.add('is-active');
        item.setAttribute('aria-current', 'true');
      }
      // Badge slot: geo badge for a real city, empty spacer for "All Cities".
      if (entry.isAll) {
        const spacer = document.createElement('span');
        spacer.className = 'hero-meta-list-helmet hero-meta-list-helmet--spacer';
        item.appendChild(spacer);
      } else {
        item.appendChild(buildGeoBadge(cityGeoBadge(entry.city || entry.label)));
      }
      const copy = document.createElement('span');
      copy.className = 'hero-meta-list-copy';
      const name = document.createElement('span');
      name.className = 'hero-meta-list-name';
      name.textContent = entry.label;
      copy.appendChild(name);
      const count = document.createElement('span');
      count.className = 'hero-meta-list-count';
      count.textContent = entry.count + ' item' + (entry.count === 1 ? '' : 's');
      item.append(copy, count);
      return item;
    }

    // ── City rail: infinite horizontal scroll + click-drag (ports the Games
    // page's hero-list behavior, but on the horizontal axis). ────────────────
    const GIFT_CITY_PX_PER_SEC = 22;
    let giftCityRaf = null, giftCityLastTs = 0, giftCityPos = 0;
    let giftCityDragActive = false, giftCityPauseUntil = 0, giftCityInited = false;
    const giftCityReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function giftCityLoopWidth() {
      if (!giftCityListEl) return 0;
      const chunk = giftCityListEl.querySelector('.gift-city-chunk');
      const track = giftCityListEl.querySelector('.gift-city-track');
      if (!chunk || !track) return 0;
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return Math.max(0, Math.round(chunk.getBoundingClientRect().width + gap));
    }

    function setGiftCityScroll(next, loopW) {
      if (!giftCityListEl) return;
      let v = Number.isFinite(next) ? next : 0;
      if (loopW > 0 && loopW > giftCityListEl.clientWidth) {
        // Keep scrollLeft inside the primary chunk's range [loopW, 2*loopW);
        // jumps of exactly one loopW are invisible (the chunks are clones).
        while (v >= 2 * loopW) v -= loopW;
        while (v < loopW) v += loopW;
      } else {
        const max = Math.max(0, giftCityListEl.scrollWidth - giftCityListEl.clientWidth);
        if (v < 0) v = 0;
        if (v > max) v = max;
      }
      giftCityPos = v;
      giftCityListEl.scrollLeft = v;
    }

    function shouldPauseGiftCity(ts) {
      if (!giftCityListEl) return true;
      if (giftCityDragActive) return true;
      if (giftCityListEl.contains(document.activeElement)) return true;
      return ts < giftCityPauseUntil;
    }

    function startGiftCityAutoScroll() {
      if (giftCityRaf || giftCityReducedMotion || !giftCityListEl) return;
      giftCityLastTs = 0;
      const tick = (ts) => {
        if (!giftCityLastTs) giftCityLastTs = ts;
        const dt = Math.min(40, ts - giftCityLastTs);
        giftCityLastTs = ts;
        const loopW = giftCityLoopWidth();
        if (!shouldPauseGiftCity(ts) && giftCityListEl && loopW > giftCityListEl.clientWidth) {
          setGiftCityScroll(giftCityPos + GIFT_CITY_PX_PER_SEC * (dt / 1000), loopW);
        }
        giftCityRaf = requestAnimationFrame(tick);
      };
      giftCityRaf = requestAnimationFrame(tick);
    }

    function wrapGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      if (loopW <= 0) { giftCityPos = giftCityListEl.scrollLeft; return; }
      setGiftCityScroll(giftCityListEl.scrollLeft, loopW);
    }

    function initGiftCityInteractions() {
      if (!giftCityListEl) return;
      let dragStartX = 0, dragStartScroll = 0, dragSuppressClick = false, pointerDownId = null;
      const DRAG_THRESHOLD = 4;
      giftCityListEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        giftCityDragActive = false;
        pointerDownId = e.pointerId;
        dragStartX = e.clientX;
        giftCityPos = giftCityListEl.scrollLeft;
        dragStartScroll = giftCityListEl.scrollLeft;
        giftCityPauseUntil = performance.now() + 600;
      });
      giftCityListEl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== pointerDownId) return;
        const dx = e.clientX - dragStartX;
        if (!giftCityDragActive && Math.abs(dx) > DRAG_THRESHOLD) {
          giftCityDragActive = true;
          giftCityListEl.classList.add('is-dragging');
          try { giftCityListEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          giftCityListEl.scrollLeft = dragStartScroll - dx;
          wrapGiftCityScroll();
          const consumed = (dragStartScroll - dx) - giftCityListEl.scrollLeft;
          if (consumed !== 0) dragStartScroll -= consumed;
          e.preventDefault();
        }
      });
      const endDrag = (e) => {
        if (e.pointerId === pointerDownId) pointerDownId = null;
        if (giftCityListEl.hasPointerCapture && giftCityListEl.hasPointerCapture(e.pointerId)) {
          try { giftCityListEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          dragSuppressClick = true;
          setTimeout(() => { dragSuppressClick = false; }, 0);
        }
        giftCityDragActive = false;
        giftCityListEl.classList.remove('is-dragging');
        giftCityPauseUntil = performance.now() + 350;
      };
      giftCityListEl.addEventListener('pointerup', endDrag);
      giftCityListEl.addEventListener('pointercancel', endDrag);
      // Swallow the click that follows a drag so a swipe doesn't navigate.
      giftCityListEl.addEventListener('click', (e) => {
        if (dragSuppressClick) { e.preventDefault(); e.stopPropagation(); }
      }, true);
      giftCityListEl.addEventListener('wheel', () => { giftCityPauseUntil = performance.now() + 800; }, { passive: true });
      giftCityListEl.addEventListener('scroll', wrapGiftCityScroll, { passive: true });
    }

    function setupGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      giftCityPos = loopW;
      giftCityListEl.scrollLeft = loopW;
      if (!giftCityInited) { initGiftCityInteractions(); giftCityInited = true; }
      startGiftCityAutoScroll();
    }

    function escapeText(value) {
      return String(value == null ? '' : value);
    }

    // Defensive filter: legacy gift_shop_items rows may have the scraper's
    // admin breadcrumb ("Surfaced from the Amazon search: …") stored in the
    // description column. Hide that from public visitors until an admin (or
    // the AI rewrite pass in gs_stock.py) backfills a real blurb.
    function cleanDescription(raw) {
      const t = String(raw == null ? '' : raw).trim();
      if (!t) return '';
      if (/^Surfaced from the Amazon search:/i.test(t)) return '';
      return t;
    }

    function shouldContainGiftImage(item) {
      const title = String(item && item.title || '');
      const url = String(item && item.url || '');
      const imageUrl = String(item && item.image_url || '');
      return /B00O9KFZIE/i.test(url)
        || /bookshop\.org/i.test(url)
        || /images-us\.bookshop\.org\/ingram/i.test(imageUrl)
        || /\b(blu[-\s]?ray|blue[-\s]?ray|dvd)\b/i.test(title)
        || /\(bd\)/i.test(title)
        || /\bBD\b/.test(title);
    }

    function imageLooksPortraitProduct(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return false;
      return img.naturalHeight / img.naturalWidth >= 1.15;
    }

    function applyGiftImageDisplay(img, item, media) {
      const focus = String(item && item.image_focus || '').trim();
      const applyContain = () => {
        img.style.objectFit = 'contain';
        img.style.objectPosition = focus || '50% 50%';
        if (media) {
          const imageUrl = String(img.currentSrc || img.src || (item && item.image_url) || '').replace(/["\\]/g, '\\$&');
          media.dataset.imageFit = 'contain';
          if (imageUrl) media.style.setProperty('--gift-contain-image', 'url("' + imageUrl + '")');
        }
      };
      if (shouldContainGiftImage(item)) {
        applyContain();
        return;
      }
      if (focus) img.style.objectPosition = focus;
      const applyAutoContain = () => {
        if (imageLooksPortraitProduct(img)) applyContain();
      };
      if (img.complete && img.naturalWidth > 0) applyAutoContain();
      else img.addEventListener('load', applyAutoContain, { once: true });
    }

    function isFandomGame(game) {
      const value = game && game.fandom_game;
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toLowerCase();
      return normalized === 'yes' || normalized === 'true' || normalized === '1';
    }

    // Match Mission Control's city derivation: fandom gifts belong to the
    // visiting fanbase's city; every other gift belongs to the game's city.
    function gameCity(game) {
      if (!game) return '';
      return String((isFandomGame(game) ? game.away_team_city : game.city) || '').trim();
    }

    function cityMatchesGame(game) {
      // A game filter (?id=/?game=) overrides the city filter entirely.
      if (requestedGameId) return true;
      if (!requestedCity) return true;
      return gameCity(game).localeCompare(requestedCity, undefined, { sensitivity: 'base' }) === 0;
    }

    // Resolved id of the ?id=/?game= filter (empty = show every game's gifts).
    // Set in loadAllShops once the games list is available.
    let requestedGameId = '';
    function listingMatchesGameFilter(listing) {
      if (!requestedGameId) return true;
      return String((listing && listing.game_id) || '') === requestedGameId;
    }
    function gameMatchesGameFilter(game) {
      if (!requestedGameId) return true;
      return !!game && String(game.id) === requestedGameId;
    }

    function isYesish(value) {
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toUpperCase();
      return normalized === 'YES' || normalized === 'TRUE' || normalized === '1';
    }

    // Only certified gifts are shown publicly. Current rows use certified_at
    // from Mission Control; tolerate an explicit certified/YES flag too.
    function isCertified(item) {
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified')) {
        return isYesish(item.certified);
      }
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified_yes')) {
        return isYesish(item.certified_yes);
      }
      return !!String(item && item.certified_at || '').trim();
    }

    function isHiddenGiftItem(item) {
      return [item && item.hidden, item && item.archived].some((value) => {
        return isYesish(value);
      });
    }

    // Grid ordering: plain alphabetical by item title.
    function compareGiftEntries(a, b) {
      const at = String(a && a.item && a.item.title || '').trim();
      const bt = String(b && b.item && b.item.title || '').trim();
      return at.localeCompare(bt, undefined, { sensitivity: 'base', numeric: true }) ||
        String(a && a.item && a.item.id || '').localeCompare(String(b && b.item && b.item.id || ''));
    }

    function getMonogram(title) {
      const t = String(title || 'Item').trim();
      const words = t.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'GS';
    }

    function renderEmpty(message) {
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gridEl.appendChild(empty);
    }

    function buildSupabaseUrl(table, query = {}) {
      const url = new URL('rest/v1/' + table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      Object.entries(query).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        throw new Error('Network request to Supabase failed.');
      }
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error('Supabase ' + res.status + ': ' + text.slice(0, 200));
      }
      return res.json();
    }

    async function fetchAllListings() {
      return fetchJson(buildSupabaseUrl('gift_shop_listings', {
        // Listings now carry the city directly; no game join needed.
        select: '*,gift_shop_items(*)',
        archived: 'eq.false',
        order: 'created_at.desc'
      }));
    }

    async function fetchGiftShopCities() {
      return fetchJson(buildSupabaseUrl('gift_shop_cities', {
        select: 'city,label,sort_order',
        archived: 'eq.false',
        order: 'sort_order.asc,city.asc'
      }));
    }

    // Every gift_shop_items row, so the shop can show items even when they have
    // no game listing. Archived / access-code rows are filtered out by the caller.
    async function fetchAllShopItems() {
      return fetchJson(buildSupabaseUrl('gift_shop_items', {
        select: '*',
        order: 'created_at.desc'
      }));
    }

    // Pull every game so we can synthesize access-code purchase options
    // without needing pre-seeded gift_shop_items rows. The server-side
    // gs-create-checkout looks up the price authoritatively from
    // games.price — the only thing the client passes is game_id, so
    // there's no tampering surface.
    async function fetchAllGames() {
      return fetchJson(buildSupabaseUrl('games_with_teams', {
        select: 'id,name,tagline,price,engine,archived,primary_color,city,away_team_city,away_team_mascot,fandom_game,tags,category_icon,away_team_key,home_team_key,away_team_tgbid,home_team_tgbid,away_team,home_team'
      }));
    }

    function getGamePrimaryColor(game, teams) {
      if (window.TgbTeamPalette) {
        return window.TgbTeamPalette.resolveGamePalette(teams, game, 'away').palette.primary;
      }
      return String(game && game.primary_color || '').trim();
    }

    function isGamePaid(game) {
      if (!game) return false;
      const price = String(game.price == null ? '' : game.price).trim();
      if (!price || price.toUpperCase() === 'FREE') return false;
      const archived = String(game.archived == null ? '' : game.archived).trim().toUpperCase();
      if (archived === 'YES') return false;
      // Sanity-check that price parses to something positive — guards
      // against rows like "TBA" or "$" that would fail at checkout.
      const numeric = price.replace(/[^0-9.]/g, '');
      const dollars = parseFloat(numeric);
      return Number.isFinite(dollars) && dollars > 0;
    }

    function gameToGiftCardItem(game) {
      const tagline = String(game && game.tagline || '').trim();
      return {
        id:                'auto-gift:' + game.id,    // synthetic; never persisted
        title:             (game.name || 'Untitled') + ' — Game Access',
        price_display:     game.price,
        description:       tagline || 'Send "' + (game.name || 'this game') + '" as a gift. Your recipient gets an access code that unlocks the game on any device.',
        gift_card_game_id: game.id,
        engine:            game.engine || ''
      };
    }

    // Build the "pick any game" card. Click → opens TgbGift modal at
    // the chooser step, where the buyer picks a game from the list
    // of paid games and continues into the same Stripe flow.
    function createChooseAnyGameCard(paidGames) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card card--gift-card card--gift-card-choose';
      card.style.font = 'inherit';
      card.style.textAlign = 'left';
      card.style.cursor = 'pointer';
      card.dataset.giftCardChoose = 'true';

      const media = document.createElement('div');
      media.className = 'card-media';
      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = '★';
      media.appendChild(monogram);
      const heroImg = document.createElement('img');
      heroImg.className = 'card-image';
      heroImg.src = '/shop/shop_banner.png';
      heroImg.alt = '';
      heroImg.loading = 'lazy';
      heroImg.decoding = 'async';
      heroImg.addEventListener('error', () => {
        heroImg.remove();
        media.dataset.hasImage = 'false';
      });
      media.appendChild(heroImg);
      media.dataset.hasImage = 'true';

      const body = document.createElement('div');
      body.className = 'card-body';

      const eyebrow = document.createElement('p');
      eyebrow.className = 'card-game-eyebrow';
      eyebrow.textContent = 'Gift Shop · Featured';
      body.appendChild(eyebrow);

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = 'Game Access — Your Pick';
      body.appendChild(title);

      const count = (paidGames && paidGames.length) || 0;
      const desc = document.createElement('p');
      desc.className = 'card-caption';
      desc.textContent = count
        ? 'Pick any of our ' + count + ' games at checkout. Recipient gets an access code that unlocks it on any device.'
        : 'Pick any game at checkout. Recipient gets an access code that unlocks it on any device.';
      body.appendChild(desc);

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      body.appendChild(cta);

      card.append(media, body);

      card.addEventListener('click', () => {
        if (!window.TgbGift) return;
        window.TgbGift.openForChoice({ games: paidGames || [] });
      });

      return card;
    }

    // Show a "More" affordance once the description is long enough to clamp.
    function shouldShowMore(desc) {
      return String(desc || '').length > 120;
    }

    // A "More" link that opens the detail lightbox. Built as a role=button span
    // so it can live inside the card's <a>/<button> without nesting a control;
    // preventDefault + stopPropagation keep the card's own click from firing.
    function buildMoreLink(item, opts) {
      const more = document.createElement('span');
      more.className = 'card-more';
      more.textContent = 'More';
      more.setAttribute('role', 'button');
      more.tabIndex = 0;
      const open = (e) => { e.preventDefault(); e.stopPropagation(); openGiftDetail(item, opts); };
      more.addEventListener('click', open);
      more.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
      return more;
    }

    function closeGiftDetail() {
      const el = document.getElementById('giftDetail');
      if (el) el.hidden = true;
    }

    // Populate + open the full-gift lightbox (scrolls if the description is long).
    function openGiftDetail(item, opts = {}) {
      const el = document.getElementById('giftDetail');
      if (!el || !item) return;
      const media   = document.getElementById('giftDetailMedia');
      const titleEl = document.getElementById('giftDetailTitle');
      const priceEl = document.getElementById('giftDetailPrice');
      const descEl  = document.getElementById('giftDetailDesc');
      const ctaWrap = document.getElementById('giftDetailCtaWrap');

      // The CTA element is built further down; capturing it here lets the
      // thumbnail trigger the same action (open the affiliate URL / buy flow).
      let ctaEl = null;

      media.innerHTML = '';
      media.classList.remove('is-clickable');
      media.style.removeProperty('--card-game-color');
      if (opts.gameColor) media.style.setProperty('--card-game-color', opts.gameColor);
      const imageUrl = String(item.image_url || '').trim();
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        media.appendChild(img);
        // Clicking the thumbnail does whatever the CTA does.
        media.classList.add('is-clickable');
        media.setAttribute('role', 'link');
        media.tabIndex = 0;
        const activate = () => { if (ctaEl) ctaEl.click(); };
        media.addEventListener('click', activate);
        media.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
        });
      } else {
        const mono = document.createElement('div');
        mono.className = 'gift-detail-monogram';
        mono.textContent = getMonogram(item.title);
        media.appendChild(mono);
      }

      titleEl.textContent = escapeText(item.title || 'Untitled item');
      const price = String(item.price_display || '').trim();
      priceEl.textContent = price;
      priceEl.hidden = !price;
      descEl.textContent = cleanDescription(item.description) || 'No description available.';

      ctaWrap.innerHTML = '';
      if (item.gift_card_game_id) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gift-detail-cta';
        btn.textContent = 'Buy now';
        btn.addEventListener('click', () => {
          closeGiftDetail();
          if (!window.TgbGift) return;
          window.TgbGift.openForGame({
            id:     item.gift_card_game_id,
            name:   String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                      || (opts.gameName || 'this game'),
            price:  item.price_display || '',
            engine: item.engine || opts.engine || ''
          });
        });
        ctaEl = btn;
        ctaWrap.appendChild(btn);
      } else {
        const url = String(item.url || '').trim();
        if (url) {
          const a = document.createElement('a');
          a.className = 'gift-detail-cta';
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener nofollow sponsored';
          a.textContent = affiliateCtaLabel(url, item.price_display);
          ctaEl = a;
          ctaWrap.appendChild(a);
        }
      }
      // If there's no CTA (e.g. an item with no url), the thumbnail isn't a link.
      if (!ctaEl) {
        media.classList.remove('is-clickable');
        media.removeAttribute('role');
        media.removeAttribute('tabindex');
      }

      el.hidden = false;
      const body = el.querySelector('.gift-detail-body');
      if (body) body.scrollTop = 0;
    }

    // Close on backdrop / × / Escape (delegated so it works no matter when the
    // lightbox node is parsed relative to this script).
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-gift-detail-close]')) closeGiftDetail();
    });
    document.addEventListener('keydown', (e) => {
      const el = document.getElementById('giftDetail');
      if (e.key === 'Escape' && el && !el.hidden) closeGiftDetail();
    });

    function createCard(item, opts = {}) {
      // Access-code items are TGB's own products (not affiliate). They have
      // no external url; clicking the card opens the shared gift-buy
      // modal via /mc/js/gs-buy-modal.js.
      if (item && item.gift_card_game_id) {
        return createGiftCardCard(item, opts);
      }

      const url = String(item.url || '').trim();
      if (!url) return null;

      const card = document.createElement('a');
      card.className = 'card';
      card.href = url;
      card.target = '_blank';
      card.rel = 'noopener nofollow sponsored';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' · ');
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = escapeText(item.title || 'Untitled item');
      body.appendChild(title);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
        if (shouldShowMore(desc)) body.appendChild(buildMoreLink(item, opts));
      }

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = affiliateCtaLabel(url, item.price_display);
      body.appendChild(cta);

      card.append(media, body);
      return card;
    }

    // Every gift button reads "Buy now" (CSS uppercases it to BUY NOW).
    function affiliateCtaLabel() {
      return 'Buy now';
    }

    // Build an access-code card. Clicking it opens the shared gift-buy
    // modal (mc/js/gs-buy-modal.js). No external link — TGB is the
    // seller for these items.
    function createGiftCardCard(item, opts = {}) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card card--gift-card';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';
      // Strip native button styles so the card layout (which inherits
      // anchor-like styling) renders consistently.
      card.style.font = 'inherit';
      card.style.textAlign = 'left';
      card.style.cursor = 'pointer';

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = escapeText(item.title || 'Game access');
      body.appendChild(title);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
        if (shouldShowMore(desc)) body.appendChild(buildMoreLink(item, opts));
      }

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = 'Buy now';
      body.appendChild(cta);

      card.append(media, body);

      card.addEventListener('click', (event) => {
        // Don't fire if the user clicked the admin-edit affordance
        // (admin-bridge.js owns that click path).
        if (event.target.closest('[data-admin-action]')) return;
        if (!window.TgbGift) return;
        window.TgbGift.openForGame({
          id:    item.gift_card_game_id,
          name:  String(item.title || '').replace(/\s*—\s*(?:Gift Card|Game Access)\s*$/i, '').trim()
                  || (opts.gameName || 'this game'),
          price: item.price_display || '',
          engine: item.engine || opts.engine || ''
        });
      });

      return card;
    }

    async function loadAllShops() {
      headingEl.textContent = 'Gift Shop';
      setEyebrow('');
      leadEl.textContent = requestedCity ? 'Gifts curated from ' + requestedCity : 'Game Souvenirs and Other Curated Memorabilia';
      leadEl.hidden = false;
      document.title = (requestedCity ? requestedCity.toUpperCase() + ' ' : '') + 'GIFT SHOP | THE GAME BUREAU';

      setStatus('Loading');
      renderEmpty('Stocking the shelves...');

      try {
        const [listings, allGames, allItems, shopCities, teams] = await Promise.all([
          fetchAllListings().catch(() => []),
          fetchAllGames().catch(() => []),
          fetchAllShopItems().catch(() => []),
          fetchGiftShopCities().catch(() => []),
          window.TgbTeamPalette
            ? window.TgbTeamPalette.loadTeams(SB_CONFIG).catch(() => [])
            : Promise.resolve([])
        ]);
        const safeListings = Array.isArray(listings) ? listings : [];
        const safeGames    = Array.isArray(allGames) ? allGames : [];
        const safeItems    = Array.isArray(allItems) ? allItems : [];
        const safeShopCities = Array.isArray(shopCities) ? shopCities : [];
        const cityData = buildGiftCityEntries(safeShopCities, safeListings, safeItems);
        renderGiftCityRail(cityData);
        const giftCityCount = cityData.entries.length;

        // Resolve the optional ?id=/?game= filter to a real game — match by id
        // first, then by name (case-insensitive) — and scope the shop to it.
        const requestedGame = requestedGameParam
          ? (safeGames.find((g) => String(g.id) === requestedGameParam)
             || safeGames.find((g) => String(g.name || '').trim().toLowerCase() === requestedGameParam.toLowerCase())
             || null)
          : null;
        requestedGameId = requestedGame ? String(requestedGame.id) : '';
        if (requestedGame) {
          setEyebrow(requestedGame.name || '');
          leadEl.textContent = 'Gifts inspired by ';
          const leadGameEm = document.createElement('em');
          const leadGameStrong = document.createElement('strong');
          leadGameStrong.textContent = requestedGame.name || 'this game';
          leadGameEm.appendChild(leadGameStrong);
          leadEl.appendChild(leadGameEm);
          leadEl.appendChild(document.createTextNode('.'));
          document.title = String(requestedGame.name || '').toUpperCase() + ' GIFTS | THE GAME BUREAU';
        }

        // Effective city filter: an explicit ?city=, or the city of a ?id=/?game= game.
        const filterCity = requestedCity || (requestedGame ? gameCity(requestedGame) : '');
        const matchingListings = safeListings.filter((listing) => {
          const city = String(listing && listing.city || '').trim();
          return !filterCity || city.localeCompare(filterCity, undefined, { sensitivity: 'base' }) === 0;
        });

        // Curated gift_shop_items rows take precedence; record their
        // gift_card_game_id so we don't double-render the same game.
        const curatedGiftCardGameIds = new Set();
        for (const listing of matchingListings) {
          const item = listing && listing.gift_shop_items;
          if (item && item.gift_card_game_id) {
            curatedGiftCardGameIds.add(item.gift_card_game_id);
          }
        }

        // Index games by id so we can pick up names and canonical team colors when
        // synthesizing dynamic access-code purchase options.
        // List of currently-giftable games for the "Your Pick" chooser.
        const paidGames = safeGames
          .filter(isGamePaid)
          .filter(cityMatchesGame)
          .filter(gameMatchesGameFilter)
          .map((g) => ({ id: g.id, name: g.name, price: g.price, engine: g.engine || '' }))
          .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));

        // ── Choose-any-game card ("Game Access — Your Pick").
        // Hidden for now — we'll revisit the access-code chooser later. The
        // createChooseAnyGameCard builder + paidGames stay in place so it can
        // be re-enabled by restoring this to use createChooseAnyGameCard.
        const chooseCard = null;

        // ── Affiliate-only curated cards (Amazon, Bookshop, etc.).
        // We deliberately skip listings whose item is an access-code product
        // (gift_card_game_id is set) so the shop no longer shows
        // individual-game access-code cards.
        const grouped = new Map();
        for (const listing of matchingListings) {
          const item = listing && listing.gift_shop_items;
          if (!item || item.id == null) continue;
          if (item.gift_card_game_id) continue; // hidden — chooser owns this
          if (isHiddenGiftItem(item)) continue; // kept for dedupe, hidden from public shop
          if (!isCertified(item)) continue;     // only show certified gifts
          if (!grouped.has(item.id)) grouped.set(item.id, { item });
        }

        // Gifts are city-based now (not game-based), so no per-game name/color tags.
        const giftEntries = [];
        for (const { item } of grouped.values()) {
          giftEntries.push({ item, opts: {} });
        }

        // Every other item that isn't already shown via a listing — so the shop
        // shows everything, with or without a game attached.
        ((requestedCity || requestedGameId) ? [] : safeItems)
          .filter((item) => item && item.id != null)
          .filter((item) => !grouped.has(item.id))   // not already shown via a listing
          .filter((item) => !item.gift_card_game_id)  // access-code products are owned by the chooser
          .filter((item) => !isHiddenGiftItem(item))
          .filter(isCertified)                        // only show certified gifts
          .forEach((item) => giftEntries.push({ item, opts: {} }));

        // Alphabetical by item title.
        giftEntries.sort(compareGiftEntries);
        const itemCards = giftEntries
          .filter(({ item }) => isCertified(item) && !isHiddenGiftItem(item))
          .sort(compareGiftEntries)
          .map(({ item, opts }) => createCard(item, opts))
          .filter(Boolean);

        // Chooser first, then the sorted gift items.
        const cards = []
          .concat(chooseCard ? [chooseCard] : [])
          .concat(itemCards);

        gridEl.innerHTML = '';
        if (!cards.length) {
          renderEmpty(requestedGame
            ? 'No gifts for ' + (requestedGame.name || 'this game') + ' yet.'
            : (requestedCity ? 'No gifts match ' + requestedCity + '.' : 'No items in the gift shop yet.'));
          itemCountEl.textContent = '0';
          shopCountEl.textContent = '0';
          setStatus('');
          return;
        }
        cards.forEach((card) => gridEl.appendChild(card));
        itemCountEl.textContent = String(cards.length);
        // Gifts are grouped by city now.
        shopCountEl.textContent = String(safeShopCities.length);
        setStatus(cards.length + ' item' + (cards.length === 1 ? '' : 's') + ' across ' +
          giftCityCount + ' cit' + (giftCityCount === 1 ? 'y' : 'ies'));
      } catch (error) {
        console.error('[giftshop] all-shops load failed', error);
        renderEmpty('Could not load gift shop.');
        itemCountEl.textContent = '0';
        shopCountEl.textContent = '0';
        setStatus(error instanceof Error ? error.message : String(error));
      }
    }

    loadAllShops();

    // Admin-only logout (the #giftAdminLogout pill is shown by CSS only when
    // admin-bridge has verified a logged-in admin). Clears the shared session,
    // best-effort revokes it server-side, and tells admin-bridge to tear down
    // its EDIT controls — which also hides this button again.
    async function giftShopAdminLogout() {
      const KEY = 'tgb-photo-review-auth-session';
      let token = '';
      try {
        const session = JSON.parse(localStorage.getItem(KEY) || 'null');
        token = (session && session.access_token) || '';
      } catch (_) {}
      if (token) {
        try {
          await fetch(SB_CONFIG.url.replace(/\/+$/, '') + '/auth/v1/logout', {
            method: 'POST',
            headers: { apikey: SB_CONFIG.key, Authorization: 'Bearer ' + token }
          });
        } catch (_) {}
      }
      try { localStorage.removeItem(KEY); } catch (_) {}
      window.dispatchEvent(new CustomEvent('tgb-admin-auth-change', { detail: { signedIn: false } }));
      if (window.TgbPublicAdminBridge) window.TgbPublicAdminBridge.setAuthorized(false);
    }
    document.addEventListener('click', (e) => {
      if (e.target.closest('#giftAdminLogout')) { e.preventDefault(); giftShopAdminLogout(); }
    });
  </script>
