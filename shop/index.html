<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Social share / link-preview meta. og:image is the shop banner so shared
       links thumbnail with it. Absolute URLs (custom domain) so crawlers resolve
       them regardless of where the page is embedded. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Game Bureau">
  <meta property="og:url" content="https://thegamebureau.com/shop/">
  <meta property="og:title" content="The Game Bureau — Gift Shop">
  <meta property="og:description" content="Game souvenirs and other curated memorabilia — books, gear, and local finds tied to the cities our games are played in.">
  <meta property="og:image" content="https://thegamebureau.com/shop/shop_banner.png">
  <meta property="og:image:width" content="1672">
  <meta property="og:image:height" content="941">
  <meta property="og:image:alt" content="The Game Bureau Gift Shop">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@thegamebureau">
  <meta name="twitter:creator" content="@thegamebureau">
  <meta name="twitter:title" content="The Game Bureau — Gift Shop">
  <meta name="twitter:description" content="Game souvenirs and other curated memorabilia — books, gear, and local finds tied to the cities our games are played in.">
  <meta name="twitter:image" content="https://thegamebureau.com/shop/shop_banner.png">
  <meta name="twitter:image:alt" content="The Game Bureau Gift Shop">

  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site-shell.css">
  <link rel="stylesheet" href="../assets/site-pages.css">
  <script src="../assets/public-account.js"></script>
  <script src="../assets/team-palette.js"></script>
  <script src="../assets/states/us-state-shapes.js"></script>
  <script src="../assets/geo.js"></script>
  <script src="../mc/js/supabase-rest.js"></script>
  <style>
    /* ── Gift shop overrides on top of site-shell.css home-page chrome.
       Body class `home-page` brings the dark night theme, nav, footer,
       Big Shoulders Display + IBM Plex Mono. These rules style the
       gift-specific surfaces (grid cards, detail lightbox) to match. ──── */

    /* One shared corner radius for every small interactive/tag/pill/badge
       control (chips, tags, CTAs, badges, search field, close button) so they
       read as one family. Containers (cards, panels, modals) keep their own,
       larger radii. Change this one value to reshape all controls at once. */
    body.home-page { --ctl-radius: 8px; }

    body.home-page .gift-page {
      display: grid;
      gap: 28px;
    }

    /* Hero — formatting mirrors the Highlights hero so the two read as
       siblings (same scrim, padding, type scale + spacing). Only the banner
       image and the single-column grid differ (the shop has no TV panel).
       The kicker intentionally has NO override here so it inherits the shared
       base .hero-kicker, exactly like the Highlights hero. */
    body.home-page main.gift-page .hero {
      min-height: 0;
      padding: 26px 32px;
      background:
        linear-gradient(95deg,
          rgba(8, 11, 17, 0.94) 0%,
          rgba(8, 11, 17, 0.82) 34%,
          rgba(8, 11, 17, 0.52) 58%,
          rgba(8, 11, 17, 0.24) 80%,
          rgba(8, 11, 17, 0.10) 100%),
        url("/shop/shop_hero_shelves.png") center right / cover no-repeat;
    }
    body.home-page main.gift-page .hero-grid {
      min-height: 0;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    body.home-page main.gift-page .hero-headline {
      font-size: 3.35rem;
      letter-spacing: 0;
      line-height: 0.96;
    }

    body.home-page main.gift-page .hero-copy {
      max-width: 690px;
      margin-top: 10px;
      font-size: 0.96rem;
    }

    /* The hook: what this shop actually is. Sits under the tagline so a
       first-time visitor gets the city connection without reading the footer. */
    body.home-page main.gift-page .hero-sub {
      max-width: 620px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    /* Tablet/mobile steps mirror the Highlights hero breakpoints. */
    @media (max-width: 980px) {
      body.home-page main.gift-page .hero {
        padding: 24px 28px;
      }
      body.home-page main.gift-page .hero-headline {
        font-size: 3rem;
      }
    }

    /* Container — mirrors body.home-page .selected-games panel. */
    body.home-page .gift-grid-wrap {
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.01)),
        rgba(11, 16, 24, 0.86);
      box-shadow: var(--shadow-panel);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    /* Filtered-view header inside the grid box — mirrors .gift-city-head. */
    body.home-page .gift-grid-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin: 0 0 20px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line);
    }
    body.home-page .gift-grid-title {
      /* Push the filter + count cluster to the right edge of the row. */
      margin: 0 auto 0 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }
    /* Source filter — slick toggle pills that read as "on" (filled, accent
       ring, check) or "off" (dim, no fill). Multi-select, all on by default.
       Lives inline in the grid-head row, between the title and count badge. */
    body.home-page .gift-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 0;
      padding: 0;
    }
    /* Author display:flex above would otherwise beat the UA [hidden] rule. */
    body.home-page .gift-filter[hidden] { display: none; }
    body.home-page .gift-filter-label {
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    body.home-page .gift-filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    body.home-page .gift-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--ctl-radius);
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease,
        box-shadow 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    body.home-page .gift-filter-chip:hover {
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip:focus-visible {
      outline: none;
      box-shadow: var(--shadow-chip), 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    /* The tick + accent fill only appear when the source is active. */
    body.home-page .gift-filter-chip .gift-filter-tick {
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      color: #0a0e15;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    body.home-page .gift-filter-chip .gift-filter-tick svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    body.home-page .gift-filter-chip .gift-filter-count {
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 16%, rgba(16, 21, 30, 0.78));
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-tick {
      background: var(--accent);
      border-color: var(--accent);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-tick svg {
      opacity: 1;
      transform: scale(1);
    }
    body.home-page .gift-filter-chip[aria-pressed="true"] .gift-filter-count {
      color: var(--accent);
    }
    /* Tag filters (Featured / Sports) show their category icon always — it is
       the chip's identity, not a tick that only appears when selected. */
    body.home-page .gift-filter-chip--tag .gift-filter-tick {
      border: none;
      width: 18px;
      height: 18px;
    }
    body.home-page .gift-filter-chip--tag .gift-filter-tick svg {
      opacity: 1;
      transform: none;
      width: 16px;
      height: 16px;
    }
    body.home-page .gift-filter-chip--tag[aria-pressed="true"] .gift-filter-tick {
      background: transparent;
    }
    body.home-page .gift-filter-chip[aria-pressed="false"] {
      opacity: 0.55;
    }
    body.home-page .gift-filter-chip[aria-pressed="false"]:hover {
      opacity: 0.85;
    }
    body.home-page .gift-city-panel {
      display: grid;
      gap: 12px;
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    body.home-page .gift-city-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line);
    }
    body.home-page .gift-city-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    /* ── Shop By City search: spyglass expands into a field + results dropdown ── */
    body.home-page .city-search {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }
    body.home-page .city-search-input {
      width: 0;
      min-width: 0;
      height: 34px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: rgba(8, 11, 17, 0);
      color: var(--ink);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: width 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.2s ease, padding 0.28s ease, border-color 0.2s ease, background 0.2s ease;
    }
    body.home-page .city-search.is-open .city-search-input {
      width: clamp(150px, 40vw, 240px);
      padding: 0 12px;
      opacity: 1;
      pointer-events: auto;
      border-color: var(--line-strong);
      background: rgba(8, 11, 17, 0.6);
    }
    body.home-page .city-search-input::placeholder { color: rgba(243, 238, 220, 0.42); }
    body.home-page .city-search.is-open .city-search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    body.home-page .city-search-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-left: 4px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: rgba(243, 238, 220, 0.6);
      cursor: pointer;
      transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    body.home-page .city-search-toggle:hover,
    body.home-page .city-search-toggle:focus-visible {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
      outline: none;
    }
    body.home-page .city-search.is-open .city-search-toggle { color: var(--accent); }
    body.home-page .city-search-toggle svg { width: 17px; height: 17px; display: block; }
    /* Portaled to <body> and viewport-fixed (JS sets top/right) so it floats
       above the gift grid — the panel's backdrop-filter would otherwise trap it. */
    body.home-page .city-search-results {
      position: fixed;
      z-index: 3000;
      width: min(280px, 78vw);
      max-height: 264px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(12, 16, 23, 0.97);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    body.home-page .city-search-results[hidden] { display: none; }
    body.home-page .city-search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: var(--ink);
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    body.home-page .city-search-result:hover,
    body.home-page .city-search-result.is-active { background: rgba(245, 180, 97, 0.14); }
    body.home-page .city-search-result-name { flex: 1 1 auto; font-weight: 600; font-size: 0.9rem; }
    body.home-page .city-search-result-count {
      flex: 0 0 auto;
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(243, 238, 220, 0.55);
    }
    body.home-page .city-search-empty {
      padding: 10px 12px;
      color: rgba(243, 238, 220, 0.55);
      font-size: 0.82rem;
    }
    /* While searching, let the dropdown escape the panel's rounded overflow clip
       AND lift the whole panel above the gift grid (a later sibling that would
       otherwise paint on top of the escaping dropdown). */
    body.home-page .gift-city-panel.is-searching {
      overflow: visible;
      position: relative;
      z-index: 60;
    }
    /* Horizontal auto-scrolling city rail (mirrors the Games-page hero list:
       no scrollbar, infinite loop via 3 cloned chunks, click-drag to swipe). */
    body.home-page .gift-city-list {
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      /* Top room so the hover lift + ring isn't clipped; scrollbar hidden. */
      padding: 8px 0 14px;
      -ms-overflow-style: none;
      cursor: grab;
    }
    body.home-page .gift-city-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body.home-page .gift-city-list.is-dragging { cursor: grabbing; }
    body.home-page .gift-city-list.is-dragging .hero-meta-list-item { cursor: grabbing; }
    body.home-page .gift-city-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 8px;
    }
    body.home-page .gift-city-chunk {
      display: flex;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 8px;
    }
    /* City rail chips reuse the shared hero-meta-list-item look from
       site-shell.css (the same rows the Games page uses, incl. the
       country/state geo badges). Sized to their content so the full city name
       stays readable, with the hover shadow trimmed so it doesn't spill. */
    body.home-page .gift-city-list .hero-meta-list-item {
      flex: 0 0 auto;
      width: auto;
      /* Content-size the name column (vs the shared minmax(0,1fr)) so the full
         city name is readable instead of ellipsized. */
      grid-template-columns: 44px auto auto;
    }
    body.home-page .gift-city-list .hero-meta-list-name {
      overflow: visible;
      text-overflow: clip;
    }
    body.home-page .gift-city-list .hero-meta-list-item:hover {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 2px var(--accent),
        0 12px 26px rgba(0, 0, 0, 0.4);
    }
    /* "All Cities" globe badge — sits in the same 44×30 shape slot as the state
       badges, echoing their white-shape + dark-detail treatment (white disc,
       dark lat/long lines) so the rail reads as one set. */
    body.home-page .hero-meta-list-geo--globe .globe-disc {
      fill: #ffffff;
      stroke: none;
    }
    body.home-page .hero-meta-list-geo--globe .globe-grid {
      fill: none;
      stroke: #111111;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    body.home-page .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ── Cards: match game-card dark-surface + size treatment ──────── */
    body.home-page .card,
    body.home-page .empty {
      position: relative;
      display: grid;
      grid-template-rows: 154px minmax(0, 1fr);
      /* taller body so a 3-line description + "More" + CTA all fit */
      min-width: 0;
      height: 416px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card-paper);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-chip);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    /* The source filter hides cards via the [hidden] attribute; the grid
       display above would otherwise win over the UA rule. */
    body.home-page .card[hidden] { display: none !important; }

    body.home-page .card:hover,
    body.home-page .card:focus-visible {
      border-color: rgba(245, 180, 97, 0.34);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
      transform: translateY(-3px);
      outline: none;
    }

    body.home-page .card[data-game-color] {
      --card-secondary: var(--card-game-color, var(--accent));
    }

    body.home-page .card-media {
      position: relative;
      height: 154px;
      min-height: 154px;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
        linear-gradient(135deg, rgba(8, 11, 17, 0.45), rgba(8, 11, 17, 0.85)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media::before { content: none; }
    body.home-page .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 320ms ease;
    }
    /* Subtle zoom on the card image while the card is hovered/focused — the
       media's overflow:hidden keeps it inside the frame. */
    body.home-page .card:hover .card-image,
    body.home-page .card:focus-visible .card-image { transform: scale(1.045); }
    @media (prefers-reduced-motion: reduce) {
      body.home-page .card-image { transition: none; }
      body.home-page .card:hover .card-image,
      body.home-page .card:focus-visible .card-image { transform: none; }
    }
    body.home-page .card-monogram {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: rgba(243, 238, 220, 0.85);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    body.home-page .card-media[data-has-image="true"] .card-monogram {
      display: none;
    }
    /* Contained products (book covers, portrait items) sit on a calm, softly
       game-tinted panel instead of a busy blown-up copy of their own art. */
    body.home-page .card-media[data-image-fit="contain"] {
      background:
        radial-gradient(130% 110% at 50% 0%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 62%),
        linear-gradient(180deg, rgba(10, 13, 19, 0.72), rgba(6, 9, 14, 0.94)),
        var(--card-game-color, var(--accent));
    }
    body.home-page .card-media[data-image-fit="contain"] .card-image {
      z-index: 1;
      box-sizing: border-box;
      padding: 14px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
    }

    /* Zoom affordance: a small corner badge over the image + a zoom-in cursor,
       shown only on cards that actually have a zoomable image (the badge is
       appended by addImageZoomBadge). Clicking the image opens the full-size
       lightbox; the badge itself is inert so the click passes to the image. */
    body.home-page .card-media:has(.card-zoom-badge) { cursor: zoom-in; }
    body.home-page .card-zoom-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--ctl-radius);
      border: 1px solid rgba(243, 238, 220, 0.30);
      background: rgba(4, 6, 10, 0.60);
      color: rgba(243, 238, 220, 0.92);
      pointer-events: none;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }
    body.home-page .card-zoom-badge svg { width: 15px; height: 15px; display: block; }
    body.home-page .card:hover .card-zoom-badge {
      background: rgba(4, 6, 10, 0.78);
      color: #fff;

    const giftTagActive = new Set();

    const giftTagChipsEl = document.getElementById('giftTagChips');

    const TICK_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" ' +

    function applyGiftFilter() {
      let shown = 0;
      giftFilterCards.forEach((card) => {
        const src = card.dataset.giftSource || 'free';
        let visible = giftFilterActive.has(src);
        if (visible) {
          giftTagActive.forEach((tag) => { if (card.dataset[tag] !== '1') visible = false; });
        }
        card.hidden = !visible;
        if (visible) shown += 1;
      });
      setItemCount(shown); // keep the top nav-stats count in sync with the filter
    }

    function setupGiftFilters(itemCards) {
      if (!giftFilterEl || !giftFilterChipsEl) return;
      giftFilterCards = Array.isArray(itemCards) ? itemCards : [];
      const total = giftFilterCards.length;

      // ── Source chips (multi-select, all on; hides below 2 sources). ──
      const counts = {};
      giftFilterCards.forEach((card) => {
        const src = card.dataset.giftSource || 'free';
        counts[src] = (counts[src] || 0) + 1;
      });
      const present = GIFT_SOURCE_DEFS.filter((s) => counts[s.key] > 0);
      giftFilterActive.clear();
      present.forEach((s) => giftFilterActive.add(s.key));
      giftFilterChipsEl.innerHTML = '';
      const showSources = present.length >= 2;
      if (showSources) {
        present.forEach((s) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'gift-filter-chip';
          chip.dataset.source = s.key;
          chip.setAttribute('aria-pressed', 'true');
          chip.innerHTML =
            '<span class="gift-filter-tick">' + TICK_SVG + '</span>' +
            '<span class="gift-filter-name">' + s.label + '</span>' +
            '<span class="gift-filter-count">' + counts[s.key] + '</span>';
          chip.addEventListener('click', () => {
            const on = chip.getAttribute('aria-pressed') === 'true';
            if (on && giftFilterActive.size <= 1) return; // never turn off the last source
            if (on) { giftFilterActive.delete(s.key); chip.setAttribute('aria-pressed', 'false'); }
            else    { giftFilterActive.add(s.key);    chip.setAttribute('aria-pressed', 'true'); }
            applyGiftFilter();
          });
          giftFilterChipsEl.appendChild(chip);
        });
      }
      if (giftSourceLabelEl) giftSourceLabelEl.hidden = !showSources;

      // ── Tag chips (Featured / Sports) — opt-in narrowers. A tag chip only
      // appears when the view has BOTH flagged and un-flagged cards (else it's

      giftTagActive.clear();
      if (giftTagChipsEl) giftTagChipsEl.innerHTML = '';
      let tagCount = 0;
      GIFT_TAG_DEFS.forEach((t) => {
        const n = giftFilterCards.filter((c) => c.dataset[t.attr] === '1').length;
        if (n === 0 || n === total || !giftTagChipsEl) return; // nothing to narrow

        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'gift-filter-chip gift-filter-chip--tag';

          const on = chip.getAttribute('aria-pressed') === 'true';

      // Show the bar if there's anything to filter at all.
      giftFilterEl.hidden = !(showSources || tagCount > 0);

    // Per-view "gifts showing" count (kept for internal bookkeeping / a11y; the

    function cityDisplayName(label) {
      const s = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(s)) return s;
      const parts = s.split(',').map((p) => p.trim()).filter(Boolean);
      return parts[0] || s || '';
    }

    function giftCityHref(city) {
      const url = new URL('/shop/', window.location.origin);
      const trimmed = String(city || '').trim();
      if (trimmed) url.searchParams.set('city', trimmed);
      return url.pathname + url.search;
    }

    function sameCity(a, b) {
      const left = String(a || '').trim();
      const right = String(b || '').trim();
      if (!left || !right) return false;
      return left.localeCompare(right, undefined, { sensitivity: 'base' }) === 0;
    }

    function buildGiftCityEntries(shopCities, listings, allItems, allGames) {
      const itemIdsByCity = new Map();
      (Array.isArray(listings) ? listings : []).forEach((listing) => {
        const item = listing && listing.gift_shop_items;
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        // Gifts are assigned directly to a city now (gift_shop_listings.city).
        const city = String(listing && listing.city || '').trim();
        if (!city) return;
        if (!itemIdsByCity.has(city)) itemIdsByCity.set(city, new Set());
        itemIdsByCity.get(city).add(item.id);
      });
      const allVisibleItemIds = new Set();
      (Array.isArray(allItems) ? allItems : []).forEach((item) => {
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        if (isHiddenGiftItem(item) || !isCertified(item)) return;
        allVisibleItemIds.add(item.id);
      });
      // Also count gifts that only appear via listings (the grid renders those),
      // so the total never undercounts when the items fetch is partial/empty.
      itemIdsByCity.forEach((ids) => ids.forEach((id) => allVisibleItemIds.add(id)));
      const gameIdsByCity = new Map();
      const allVisibleGameIds = new Set();
      (Array.isArray(allGames) ? allGames : []).forEach((game) => {
        if (!isGiftShopGame(game) || !game.id) return;
        // Count every gift-shop game toward the total — the shop surfaces them
        // all (the "All Cities" view shows city-less games too).
        allVisibleGameIds.add(game.id);
        const city = gameCity(game);
        if (!city) return;
        if (!gameIdsByCity.has(city)) gameIdsByCity.set(city, new Set());
        gameIdsByCity.get(city).add(game.id);
      });
      const rowsByCity = new Map();
      (Array.isArray(shopCities) ? shopCities : []).forEach((row) => {
        const city = String(row && row.city || '').trim();
        if (!city) return;
        rowsByCity.set(city, {
          city,
          label: String(row && row.label || '').trim() || cityDisplayName(city)
        });
      });
      gameIdsByCity.forEach((_, city) => {
        if (!rowsByCity.has(city)) rowsByCity.set(city, {
          city,
          label: cityDisplayName(city)
        });
      });
      const entries = Array.from(rowsByCity.values())
        .map((row) => {
          const city = String(row && row.city || '').trim();
          if (!city) return null;
          const label = String(row && row.label || '').trim() || cityDisplayName(city);
          const itemIds = itemIdsByCity.get(city);
          const gameIds = gameIdsByCity.get(city);
          return {
            city,
            label,
            count: (itemIds ? itemIds.size : 0) + (gameIds ? gameIds.size : 0)
          };
        })
        .filter(Boolean)
        // Surface cities that have at least one shop item or game product.
        .filter((entry) => entry.count > 0)
        .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base', numeric: true }) ||
          a.city.localeCompare(b.city, undefined, { sensitivity: 'base', numeric: true }));
      return {
        entries,
        total: allVisibleItemIds.size + allVisibleGameIds.size,
        giftTotal: allVisibleItemIds.size,
        gameTotal: allVisibleGameIds.size
      };
    }

    function cityGeoBadge(label) {
      // Prefer the shared, structured-aware badge (assets/geo.js): resolves
      // 2-letter codes + countries the local map below can't.
      if (window.TgbGeo && typeof window.TgbGeo.geoBadge === 'function') {
        return window.TgbGeo.geoBadge(label);
      }
      const labelStr = String(label || '').trim();
      if (/\bd\.?\s*c\.?$/i.test(labelStr)) return { kind: 'state', value: 'DC' };
      const parts = labelStr.split(',').map((s) => s.trim()).filter(Boolean);
      for (let i = parts.length - 1; i >= 1; i--) {
        const key = parts[i].toLowerCase();
        if (US_STATES[key]) return { kind: 'state', value: US_STATES[key] };
        if (COUNTRY_CODES[key]) return { kind: 'country', value: COUNTRY_CODES[key] };
      }
      return null;
    }

    function svgPathCenter(pathData, fallbackX, fallbackY) {
      const numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
      if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < numbers.length - 1; i += 2) {
        const x = Number(numbers[i]);
        const y = Number(numbers[i + 1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
      if (![minX, minY, maxX, maxY].every(Number.isFinite)) return { x: fallbackX, y: fallbackY };
      return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
    }

    function buildGeoBadge(badge) {
      const cls = (s) => 'hero-meta-list-geo' + (s ? ' ' + s : '');
      const shapes = window.US_STATE_SHAPES || null;
      if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
        svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', shapes[badge.value]);
        svg.appendChild(path);
        const labelPoint = svgPathCenter(shapes[badge.value], (shapes._w || 40) / 2, (shapes._h || 24) / 2);
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', String(labelPoint.x));
        text.setAttribute('y', String(labelPoint.y));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('alignment-baseline', 'middle');
        text.setAttribute('dy', '0.04em');
        text.textContent = badge.value;
        svg.appendChild(text);
        return svg;
      }
      const span = document.createElement('span');
      if (badge) {
        span.className = cls('hero-meta-list-geo--' + badge.kind);
        if (badge.kind === 'country') {
          const label = document.createElement('span');
          label.className = 'hero-meta-list-geo-label';
          label.textContent = badge.value;
          span.appendChild(label);
        } else {
          span.textContent = badge.value;
        }
        span.setAttribute('aria-hidden', 'true');
      } else {
        span.className = cls('');
      }
      return span;
    }

    // Globe badge for the "All Cities" chip. Uses the same geo/shape classes as
    // the state badges so it lands in the identical 44×30 slot and matches their
    // look; a white disc with dark lat/long lines mirrors the state silhouettes.
    function buildAllCitiesGlobe() {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('class', 'hero-meta-list-geo hero-meta-list-geo--shape hero-meta-list-geo--globe');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      const disc = document.createElementNS(NS, 'circle');
      disc.setAttribute('class', 'globe-disc');
      disc.setAttribute('cx', '12');
      disc.setAttribute('cy', '12');
      disc.setAttribute('r', '10');
      svg.appendChild(disc);
      const grid = [
        ['ellipse', { cx: 12, cy: 12, rx: 4.2, ry: 10 }],  // meridian
        ['line', { x1: 2, y1: 12, x2: 22, y2: 12 }],        // equator
        ['line', { x1: 3.8, y1: 6.3, x2: 20.2, y2: 6.3 }],  // upper latitude
        ['line', { x1: 3.8, y1: 17.7, x2: 20.2, y2: 17.7 }],// lower latitude
      ];
      grid.forEach(([tag, attrs]) => {
        const el = document.createElementNS(NS, tag);
        el.setAttribute('class', 'globe-grid');
        Object.keys(attrs).forEach((k) => el.setAttribute(k, String(attrs[k])));
        svg.appendChild(el);
      });
      return svg;
    }

    // City list the search field filters over (set by renderGiftCityRail).
    let giftCitySearchEntries = [];

    // Shop By City search: the spyglass expands into a field; typing shows a
    // live results dropdown; picking a city navigates to it (same as a chip).
    (function setupCitySearch() {
      const wrap = document.getElementById('citySearch');
      const input = document.getElementById('citySearchInput');
      const toggle = document.getElementById('citySearchToggle');
      const results = document.getElementById('citySearchResults');
      if (!wrap || !input || !toggle || !results) return;
      // Portal the dropdown to <body> so it escapes the panel's backdrop-filter
      // stacking context and floats above the gift grid.
      document.body.appendChild(results);
      let matches = [];
      let activeIndex = -1;
      const norm = (s) => String(s || '').toLowerCase().trim();

      // Anchor the fixed dropdown just under the input, right-aligned to it.
      function positionResults() {
        if (results.hidden) return;
        const r = input.getBoundingClientRect();
        results.style.top = (r.bottom + 8) + 'px';
        results.style.right = (window.innerWidth - r.right) + 'px';
        results.style.left = 'auto';
      }
      window.addEventListener('scroll', positionResults, true);
      window.addEventListener('resize', positionResults);

      function openSearch() {
        wrap.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
        input.setAttribute('aria-expanded', 'true');
        input.tabIndex = 0;
        input.focus();
      }
      function hideResults() {
        results.hidden = true;
        results.innerHTML = '';
        matches = [];
        activeIndex = -1;
        if (giftCityPanelEl) giftCityPanelEl.classList.remove('is-searching');
      }
      function closeSearch() {
        wrap.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        input.setAttribute('aria-expanded', 'false');
        input.tabIndex = -1;
        input.value = '';
        hideResults();
      }
      function go(entry) {
        if (entry) window.location.href = giftCityHref(entry.city);
      }
      function setActive(i) {
        activeIndex = i;
        Array.from(results.querySelectorAll('.city-search-result')).forEach((el, idx) => {
          const on = idx === i;
          el.classList.toggle('is-active', on);
          el.setAttribute('aria-selected', on ? 'true' : 'false');
          if (on) el.scrollIntoView({ block: 'nearest' });
        });
      }
      function render() {
        const q = norm(input.value);
        if (!q) { hideResults(); return; }
        matches = (Array.isArray(giftCitySearchEntries) ? giftCitySearchEntries : [])
          .filter((e) => norm(e.label).includes(q) || norm(e.city).includes(q))
          .slice(0, 8);
        activeIndex = matches.length ? 0 : -1;
        results.innerHTML = '';
        if (!matches.length) {
          const empty = document.createElement('div');
          empty.className = 'city-search-empty';
          empty.textContent = 'No cities match “' + input.value.trim() + '”.';
          results.appendChild(empty);
        } else {
          matches.forEach((entry, i) => {
            const a = document.createElement('a');
            a.className = 'city-search-result' + (i === activeIndex ? ' is-active' : '');
            a.href = giftCityHref(entry.city);
            a.setAttribute('role', 'option');
            a.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');
            const name = document.createElement('span');
            name.className = 'city-search-result-name';
            name.textContent = entry.label;
            const count = document.createElement('span');
            count.className = 'city-search-result-count';
            count.textContent = entry.count + ' gift' + (entry.count === 1 ? '' : 's');
            a.append(name, count);
            a.addEventListener('mouseenter', () => setActive(i));
            a.addEventListener('click', (e) => {
              // Let modifier/middle clicks use the real href (open in new tab).
              if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
              e.preventDefault();
              go(entry);
            });
            results.appendChild(a);
          });
        }
        results.hidden = false;
        positionResults();
        if (giftCityPanelEl) giftCityPanelEl.classList.add('is-searching');
      }

      toggle.addEventListener('click', () => {
        if (wrap.classList.contains('is-open')) closeSearch();
        else openSearch();
      });
      input.addEventListener('input', render);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); closeSearch(); toggle.focus(); return; }
        if (!matches.length) { if (e.key === 'Enter') e.preventDefault(); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive((activeIndex + 1) % matches.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((activeIndex - 1 + matches.length) % matches.length); }
        else if (e.key === 'Enter') { e.preventDefault(); go(matches[Math.max(0, activeIndex)]); }
      });
      // Click outside the widget (and outside the portaled dropdown) collapses it.
      document.addEventListener('click', (e) => {
        if (wrap.contains(e.target) || results.contains(e.target)) return;
        if (wrap.classList.contains('is-open')) closeSearch();
      });
    })();

    function renderGiftCityRail(cityData) {
      if (!giftCityPanelEl || !giftCityListEl) return;
      const entries = cityData && Array.isArray(cityData.entries) ? cityData.entries : [];
      // Feed the Shop By City search (the spyglass field) the same city list.
      giftCitySearchEntries = entries;
      if (!entries.length) {
        giftCityPanelEl.hidden = true;
        giftCityListEl.innerHTML = '';
        return;
      }
      giftCityPanelEl.hidden = false;

      giftCityListEl.innerHTML = '';
      const chips = [{
        city: '',
        label: 'All Cities',
        count: cityData.total || entries.reduce((sum, entry) => sum + entry.count, 0),
        isAll: true
      }].concat(entries);

      // Three identical chunks [pre | primary | post] in a flex row. We park
      // scrollLeft at the start of the primary chunk; when auto-scroll or a drag
      // pushes it out of range, setGiftCityScroll jumps by exactly one chunk
      // width — invisible because the chunks are clones, so the rail loops.
      const track = document.createElement('div');
      track.className = 'gift-city-track';
      const makeChunk = (hidden) => {
        const chunk = document.createElement('div');
        chunk.className = 'gift-city-chunk';
        if (hidden) chunk.setAttribute('aria-hidden', 'true');
        chips.forEach((entry) => chunk.appendChild(createGiftCityChip(entry)));
        return chunk;
      };
      track.append(makeChunk(true), makeChunk(false), makeChunk(true));
      giftCityListEl.appendChild(track);

      setupGiftCityScroll();
    }

    function createGiftCityChip(entry) {
      const item = document.createElement('a');
      item.className = 'hero-meta-list-item';
      item.href = entry.isAll ? '/shop/' : giftCityHref(entry.city);
      item.dataset.city = entry.city;
      const active = entry.isAll ? showAllGifts : entry.city === requestedCity;
      if (active) {
        item.classList.add('is-active');
        item.setAttribute('aria-current', 'true');
      }
      // Badge slot: a globe for "All Cities", the geo (state/country) badge for
      // a real city.
      if (entry.isAll) {
        item.appendChild(buildAllCitiesGlobe());
      } else {
        item.appendChild(buildGeoBadge(cityGeoBadge(entry.city || entry.label)));
      }
      const copy = document.createElement('span');
      copy.className = 'hero-meta-list-copy';
      const name = document.createElement('span');
      name.className = 'hero-meta-list-name';
      name.textContent = entry.label;
      copy.appendChild(name);
      const count = document.createElement('span');
      count.className = 'hero-meta-list-count';
      count.textContent = entry.count + ' gift' + (entry.count === 1 ? '' : 's');
      item.append(copy, count);
      return item;
    }

    // ── City rail: infinite horizontal scroll + click-drag (ports the Games
    // page's hero-list behavior, but on the horizontal axis). ────────────────
    const GIFT_CITY_PX_PER_SEC = 22;
    let giftCityRaf = null, giftCityLastTs = 0, giftCityPos = 0;
    let giftCityDragActive = false, giftCityPauseUntil = 0, giftCityInited = false;
    const giftCityReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function giftCityLoopWidth() {
      if (!giftCityListEl) return 0;
      const chunk = giftCityListEl.querySelector('.gift-city-chunk');
      const track = giftCityListEl.querySelector('.gift-city-track');
      if (!chunk || !track) return 0;
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return Math.max(0, Math.round(chunk.getBoundingClientRect().width + gap));
    }

    function setGiftCityScroll(next, loopW) {
      if (!giftCityListEl) return;
      let v = Number.isFinite(next) ? next : 0;
      if (loopW > 0 && loopW > giftCityListEl.clientWidth) {
        // Keep scrollLeft inside the primary chunk's range [loopW, 2*loopW);
        // jumps of exactly one loopW are invisible (the chunks are clones).
        while (v >= 2 * loopW) v -= loopW;
        while (v < loopW) v += loopW;
      } else {
        const max = Math.max(0, giftCityListEl.scrollWidth - giftCityListEl.clientWidth);
        if (v < 0) v = 0;
        if (v > max) v = max;
      }
      giftCityPos = v;
      giftCityListEl.scrollLeft = v;
    }

    function shouldPauseGiftCity(ts) {
      if (!giftCityListEl) return true;
      if (giftCityDragActive) return true;
      if (giftCityListEl.contains(document.activeElement)) return true;
      return ts < giftCityPauseUntil;
    }

    function startGiftCityAutoScroll() {
      if (giftCityRaf || giftCityReducedMotion || !giftCityListEl) return;
      giftCityLastTs = 0;
      const tick = (ts) => {
        if (!giftCityLastTs) giftCityLastTs = ts;
        const dt = Math.min(40, ts - giftCityLastTs);
        giftCityLastTs = ts;
        const loopW = giftCityLoopWidth();
        if (!shouldPauseGiftCity(ts) && giftCityListEl && loopW > giftCityListEl.clientWidth) {
          setGiftCityScroll(giftCityPos + GIFT_CITY_PX_PER_SEC * (dt / 1000), loopW);
        }
        giftCityRaf = requestAnimationFrame(tick);
      };
      giftCityRaf = requestAnimationFrame(tick);
    }

    function wrapGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      if (loopW <= 0) { giftCityPos = giftCityListEl.scrollLeft; return; }
      setGiftCityScroll(giftCityListEl.scrollLeft, loopW);
    }

    function initGiftCityInteractions() {
      if (!giftCityListEl) return;
      let dragStartX = 0, dragStartScroll = 0, dragSuppressClick = false, pointerDownId = null;
      const DRAG_THRESHOLD = 4;
      giftCityListEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        giftCityDragActive = false;
        pointerDownId = e.pointerId;
        dragStartX = e.clientX;
        giftCityPos = giftCityListEl.scrollLeft;
        dragStartScroll = giftCityListEl.scrollLeft;
        giftCityPauseUntil = performance.now() + 600;
      });
      giftCityListEl.addEventListener('pointermove', (e) => {
        if (e.pointerId !== pointerDownId) return;
        const dx = e.clientX - dragStartX;
        if (!giftCityDragActive && Math.abs(dx) > DRAG_THRESHOLD) {
          giftCityDragActive = true;
          giftCityListEl.classList.add('is-dragging');
          try { giftCityListEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          giftCityListEl.scrollLeft = dragStartScroll - dx;
          wrapGiftCityScroll();
          const consumed = (dragStartScroll - dx) - giftCityListEl.scrollLeft;
          if (consumed !== 0) dragStartScroll -= consumed;
          e.preventDefault();
        }
      });
      const endDrag = (e) => {
        if (e.pointerId === pointerDownId) pointerDownId = null;
        if (giftCityListEl.hasPointerCapture && giftCityListEl.hasPointerCapture(e.pointerId)) {
          try { giftCityListEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        if (giftCityDragActive) {
          dragSuppressClick = true;
          setTimeout(() => { dragSuppressClick = false; }, 0);
        }
        giftCityDragActive = false;
        giftCityListEl.classList.remove('is-dragging');
        giftCityPauseUntil = performance.now() + 350;
      };
      giftCityListEl.addEventListener('pointerup', endDrag);
      giftCityListEl.addEventListener('pointercancel', endDrag);
      // Swallow the click that follows a drag so a swipe doesn't navigate.
      giftCityListEl.addEventListener('click', (e) => {
        if (dragSuppressClick) { e.preventDefault(); e.stopPropagation(); }
      }, true);
      giftCityListEl.addEventListener('wheel', () => { giftCityPauseUntil = performance.now() + 800; }, { passive: true });
      giftCityListEl.addEventListener('scroll', wrapGiftCityScroll, { passive: true });
    }

    function setupGiftCityScroll() {
      if (!giftCityListEl) return;
      const loopW = giftCityLoopWidth();
      giftCityPos = loopW;
      giftCityListEl.scrollLeft = loopW;
      if (!giftCityInited) { initGiftCityInteractions(); giftCityInited = true; }
      startGiftCityAutoScroll();
    }

    // Coerce any value to a display string. NOTE: this does NOT escape HTML —
    // callers must assign the result via textContent (never innerHTML).
    function asText(value) {
      return String(value == null ? '' : value);
    }

    // Defensive filter: legacy gift_shop_items rows may have the scraper's
    // admin breadcrumb ("Surfaced from the Amazon search: …") stored in the
    // description column. Hide that from public visitors until an admin (or
    // the AI rewrite pass in gs_stock.py) backfills a real blurb.
    function cleanDescription(raw) {
      const t = String(raw == null ? '' : raw).trim();
      if (!t) return '';
      if (/^Surfaced from the Amazon search:/i.test(t)) return '';
      return t;
    }

    function shouldContainGiftImage(item) {
      const title = String(item && item.title || '');
      const url = String(item && item.url || '');
      const imageUrl = String(item && item.image_url || '');
      return /B00O9KFZIE/i.test(url)
        || /bookshop\.org/i.test(url)
        || /images-us\.bookshop\.org\/ingram/i.test(imageUrl)
        || /\b(blu[-\s]?ray|blue[-\s]?ray|dvd)\b/i.test(title)
        || /\(bd\)/i.test(title)
        || /\bBD\b/.test(title);
    }

    function imageLooksPortraitProduct(img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return false;
      return img.naturalHeight / img.naturalWidth >= 1.15;
    }

    function applyGiftImageDisplay(img, item, media) {
      const focus = String(item && item.image_focus || '').trim();
      const applyContain = () => {
        img.style.objectFit = 'contain';
        img.style.objectPosition = '50% 50%';
        if (media) media.dataset.imageFit = 'contain';
      };
      if (shouldContainGiftImage(item)) {
        applyContain();
        return;
      }
      if (focus) img.style.objectPosition = focus;
      const applyAutoContain = () => {
        if (imageLooksPortraitProduct(img)) applyContain();
      };
      if (img.complete && img.naturalWidth > 0) applyAutoContain();
      else img.addEventListener('load', applyAutoContain, { once: true });
    }

    function isFandomGame(game) {
      const value = game && game.fandom_game;
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toLowerCase();
      return normalized === 'yes' || normalized === 'true' || normalized === '1';
    }

    // Match Mission Control's city derivation: fandom gifts belong to the
    // visiting fanbase's city; every other gift belongs to the game's city.
    function gameCity(game) {
      if (!game) return '';
      return String((isFandomGame(game) ? game.away_team_city : game.city) || '').trim();
    }

    function gameMatchesCity(game, city) {
      const filter = String(city || '').trim();
      if (!filter) return true;
      return sameCity(gameCity(game), filter);
    }

    // Resolved id of the ?id=/?game= filter (empty = show every game's gifts).
    // Set in loadAllShops once the games list is available.
    let requestedGameId = '';
    function listingMatchesGameFilter(listing) {
      if (!requestedGameId) return true;
      return String((listing && listing.game_id) || '') === requestedGameId;
    }
    function gameMatchesGameFilter(game) {
      if (!requestedGameId) return true;
      return !!game && String(game.id) === requestedGameId;
    }

    function isYesish(value) {
      if (value === true) return true;
      const normalized = String(value == null ? '' : value).trim().toUpperCase();
      return normalized === 'YES' || normalized === 'TRUE' || normalized === '1';
    }

    // Only certified gifts are shown publicly. Current rows use certified_at
    // from Mission Control; tolerate an explicit certified/YES flag too.
    function isCertified(item) {
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified')) {
        return isYesish(item.certified);
      }
      if (item && Object.prototype.hasOwnProperty.call(item, 'certified_yes')) {
        return isYesish(item.certified_yes);
      }
      return !!String(item && item.certified_at || '').trim();
    }

    // Featured flag (gift_shop_items.featured), same 'YES'/null convention as
    // games. Drives the default /shop/ view.
    function isFeatured(item) {
      return isYesish(item && item.featured);
    }

    // Sports flag (gift_shop_items.sports) — team / sports merch, for the filter.
    function isSports(item) {
      return isYesish(item && item.sports);
    }

    function isHiddenGiftItem(item) {
      // A SHELVED item (rejected_at set) is never shown publicly, same as one in Review.
      if (item && String(item.rejected_at || '').trim()) return true;
      return [item && item.hidden, item && item.archived].some((value) => {
        return isYesish(value);
      });
    }

    // Grid ordering: plain alphabetical by item title.
    function compareGiftEntries(a, b) {
      const at = String(a && a.item && a.item.title || '').trim();
      const bt = String(b && b.item && b.item.title || '').trim();
      return at.localeCompare(bt, undefined, { sensitivity: 'base', numeric: true }) ||
        String(a && a.item && a.item.id || '').localeCompare(String(b && b.item && b.item.id || ''));
    }

    function normalizeGiftCities(cities) {
      const seen = new Map();
      (Array.isArray(cities) ? cities : []).forEach((cityValue) => {
        const city = String(cityValue || '').trim();
        if (!city) return;
        const key = city.toLowerCase();
        if (!seen.has(key)) seen.set(key, city);
      });
      return Array.from(seen.values())
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }));
    }

    function appendGiftCityTags(body, cities) {
      const labels = normalizeGiftCities(cities);
      if (!labels.length || !body) return;
      const tags = document.createElement('div');
      tags.className = 'card-city-tags';
      labels.forEach((city) => {
        const tag = document.createElement('span');
        tag.className = 'card-city-tag';
        tag.setAttribute('role', 'link');
        tag.tabIndex = 0;
        tag.dataset.city = city;
        tag.textContent = cityDisplayName(city) || city;
        tag.title = 'Shop ' + city;
        const openCity = (event) => {
          event.preventDefault();
          event.stopPropagation();
          window.location.href = giftCityHref(city);
        };
        tag.addEventListener('click', openCity);
        tag.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') openCity(event);
        });
        tags.appendChild(tag);
      });
      attachCityTagDragScroll(tags);
      body.appendChild(tags);
    }

    // Make a horizontal city-tag row draggable: click-drag with the mouse (or
    // swipe on touch) advances/rewinds the strip. A drag is distinguished from a
    // click by a small movement threshold; once dragging, the trailing click is
    // swallowed in the capture phase so it neither navigates to a city nor fires
    // the parent card's click handler.
    function attachCityTagDragScroll(el) {
      let down = false, moved = false, startX = 0, startScroll = 0, pid = null;
      el.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button > 0) return; // primary button / touch only
        down = true;
        moved = false;
        startX = e.clientX;
        startScroll = el.scrollLeft;
        pid = e.pointerId;
      });
      el.addEventListener('pointermove', (e) => {
        if (!down) return;
        const dx = e.clientX - startX;
        if (!moved && Math.abs(dx) > 4) {
          moved = true;
          el.classList.add('is-dragging');
          try { el.setPointerCapture(pid); } catch (_) {}
        }
        if (moved) {
          e.preventDefault();
          el.scrollLeft = startScroll - dx;
        }
      });
      const end = () => {
        if (!down) return;
        down = false;
        if (moved) {
          el.classList.remove('is-dragging');
          try { el.releasePointerCapture(pid); } catch (_) {}
        }
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      // Capture-phase click guard: if the pointer moved (a drag), cancel the
      // click before it reaches a city chip or the card itself.
      el.addEventListener('click', (e) => {
        if (moved) {
          e.preventDefault();
          e.stopPropagation();
          moved = false;
        }
      }, true);
    }

    function buildGiftItemCities(listings) {
      const citiesByItemId = new Map();
      (Array.isArray(listings) ? listings : []).forEach((listing) => {
        const item = listing && listing.gift_shop_items;
        if (!item || item.id == null) return;
        if (item.gift_card_game_id) return;
        const city = String(listing && listing.city || '').trim();
        if (!city) return;
        const id = String(item.id);
        if (!citiesByItemId.has(id)) citiesByItemId.set(id, new Set());
        citiesByItemId.get(id).add(city);
      });
      const result = new Map();
      citiesByItemId.forEach((cities, id) => {
        result.set(id, normalizeGiftCities(Array.from(cities)));
      });
      return result;
    }

    function getMonogram(title) {
      const t = String(title || 'Item').trim();
      const words = t.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'GS';
    }

    function renderEmpty(message) {
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gridEl.appendChild(empty);
    }

    // Placeholder cards shown while the shop loads — keeps the grid's shape so
    // it doesn't flash a single text box before the real cards arrive.
    function renderSkeleton(count = 8) {
      gridEl.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        card.setAttribute('aria-hidden', 'true');
        const media = document.createElement('div');
        media.className = 'skeleton-media skeleton-shimmer';
        const body = document.createElement('div');
        body.className = 'skeleton-body';
        ['skeleton-line--title', '', 'skeleton-line--short'].forEach((mod) => {
          const line = document.createElement('div');
          line.className = 'skeleton-line skeleton-shimmer' + (mod ? ' ' + mod : '');
          body.appendChild(line);
        });
        const cta = document.createElement('div');
        cta.className = 'skeleton-cta skeleton-shimmer';
        body.appendChild(cta);
        card.append(media, body);
        gridEl.appendChild(card);
      }
    }

    // Reserve the city-rail height with placeholder pills so the panel doesn't
    // start collapsed and then push the grid down when the real cities arrive.
    function renderCityRailSkeleton() {
      if (!giftCityPanelEl || !giftCityListEl) return;
      giftCityPanelEl.hidden = false;
      giftCityListEl.innerHTML = '';
      const track = document.createElement('div');
      track.className = 'gift-city-track';
      [128, 152, 136, 168, 132, 148, 160, 124].forEach((w) => {
        const chip = document.createElement('div');
        chip.className = 'gift-city-skeleton-chip skeleton-shimmer';
        chip.style.width = w + 'px';
        chip.setAttribute('aria-hidden', 'true');
        track.appendChild(chip);
      });
      giftCityListEl.appendChild(track);
    }

    // Reserve the grid-header height with a shimmer title line (only for the
    // views that will actually show a header — not the single-item preview).
    function renderGridHeadSkeleton() {
      if (!giftGridHeadEl || !giftGridTitleEl) return;
      giftGridTitleEl.innerHTML = '';
      const line = document.createElement('span');
      line.className = 'gift-grid-title-skeleton skeleton-shimmer';
      line.setAttribute('aria-hidden', 'true');
      giftGridTitleEl.appendChild(line);
      giftGridHeadEl.hidden = false;
    }

    // Paint the full loading layout up front so first paint matches the final
    // shape — city rail, grid header, and grid all hold their space, then fill
    // in place with no reflow. The single-item preview has neither rail nor head.
    function renderLoadingLayout() {
      renderSkeleton();
      if (requestedItemId) {
        if (giftCityPanelEl) giftCityPanelEl.hidden = true;
        if (giftGridHeadEl) giftGridHeadEl.hidden = true;
        return;
      }
      renderCityRailSkeleton();
      // A game filter scopes the shop and shows no grid header (it uses the hero
      // lead instead); every other view gets the header.
      if (requestedGameParam) {
        if (giftGridHeadEl) giftGridHeadEl.hidden = true;
      } else {
        renderGridHeadSkeleton();
      }
    }

    function buildSupabaseUrl(table, query = {}) {
      const url = new URL('rest/v1/' + table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      Object.entries(query).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        throw new Error('Network request to Supabase failed.');
      }
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error('Supabase ' + res.status + ': ' + text.slice(0, 200));
      }
      return res.json();
    }

    // "Load the whole table" reads must paginate past PostgREST's 1000-row cap,
    // or the tail silently vanishes once a table grows past 1000 rows (see
    // CLAUDE.md). TgbRest.fetchAll loops with the Range header; fall back to a
    // single unpaginated read only if the helper failed to load.
    async function fetchAllRows(url) {
      if (window.TgbRest && typeof window.TgbRest.fetchAll === 'function') {
        return window.TgbRest.fetchAll(url, {});
      }
      return fetchJson(url);
    }

    async function fetchAllListings() {
      return fetchAllRows(buildSupabaseUrl('gift_shop_listings', {
        // Listings now carry the city directly; no game join needed.
        select: '*,gift_shop_items(*)',
        archived: 'eq.false',
        order: 'created_at.desc'
      }));
    }

    // Venue-only cities (cities.ignored) are not shopping cities. select=* so
    // this keeps working before 2026072205_cities_ignored.sql is applied.
    async function fetchGiftShopCities() {
      const rows = await fetchAllRows(buildSupabaseUrl('cities', {
        select: '*',
        order: 'sort_order.asc,city.asc'
      }));
      return (Array.isArray(rows) ? rows : []).filter((row) => row && row.ignored !== true);

    // Every gift_shop_items row, so the shop can show items even when they have
    // no game listing. Archived / access-code rows are filtered out by the caller.
    async function fetchAllShopItems() {

      }));

    // Pull every game so we can synthesize access-code purchase options
    // without needing pre-seeded gift_shop_items rows. The server-side
    // gs-create-checkout looks up the price authoritatively from
    // games.price — the only thing the client passes is game_id, so
    // there's no tampering surface.
    async function fetchAllGames() {
      return fetchAllRows(buildSupabaseUrl('games_with_teams', {

    function getGamePrimaryColor(game, teams) {
      if (window.TgbTeamPalette) {
        return window.TgbTeamPalette.resolveGamePalette(teams, game, 'away').palette.primary;
      }
      return String(game && game.primary_color || '').trim();

    function isGamePaid(game) {
      if (!game) return false;
      const price = String(game.price == null ? '' : game.price).trim();
      if (!price || price.toUpperCase() === 'FREE') return false;
      const archived = String(game.archived == null ? '' : game.archived).trim().toUpperCase();
      if (archived === 'YES') return false;
      // Sanity-check that price parses to something positive — guards
      // against rows like "TBA" or "$" that would fail at checkout.
      const numeric = price.replace(/[^0-9.]/g, '');
      const dollars = parseFloat(numeric);
      return Number.isFinite(dollars) && dollars > 0;
    }

    // TEMPORARY: TGB games are pulled from the gift shop(s). Flip this back to
    // true (or delete it and the guard below) to show game products again.
    // Gating here removes games from BOTH the card grid and the city-rail counts,
    // since both surfaces route through isGiftShopGame().
    const SHOW_TGB_GAMES_IN_SHOP = false;

    function isGiftShopGame(game) {
      if (!SHOW_TGB_GAMES_IN_SHOP) return false;

    function gameShopImageUrl(game) {
      // Strict separation: the shop card is the GAME's image, so it uses the
