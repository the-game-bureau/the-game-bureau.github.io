  <script src="https://js.stripe.com/v3"></script>
  <script>
    // ── Storefront cart + Stripe Embedded Checkout ───────────────────
    //
    // STRIPE_PUBLISHABLE_KEY must be the matching pk_test_… / pk_live_… for
    // the STRIPE_SECRET_KEY set on the create-stripe-session Edge Function.
    // Leave it empty to disable the cart entirely (affiliate-only mode).
    //
    // PAUSED 2026-05-26: POD / Printful integration is parked. All gift_shop
    // items render as affiliate links regardless of price_cents /
    // printful_variant_id. Restore by pasting the publishable key back in.
    // The pk_test_… key previously here:
    //   pk_test_51MF10bBFJf3v75ByzCOFJB7TL7MxnJ8I2ATlm3zszzjek7ki62BrhJ5TI0ZzTLBMk8ixoNUdsoG9pOjM8S1zR8wv00zYSpHYvw
    const STRIPE_PUBLISHABLE_KEY = '';
    const EDGE_BASE = SB_CONFIG.url.replace('.supabase.co', '.functions.supabase.co');
    const CREATE_SESSION_URL = EDGE_BASE + '/create-stripe-session';

    const CART_STORAGE_KEY = 'tgb-gift-cart-v1';
    const cartFab          = document.getElementById('cartFab');
    const cartFabCount     = document.getElementById('cartFabCount');
    const cartModal        = document.getElementById('cartModal');
    const cartBackdrop     = document.getElementById('cartBackdrop');
    const cartCloseBtn     = document.getElementById('cartCloseBtn');
    const cartBody         = document.getElementById('cartBody');
    const cartFoot         = document.getElementById('cartFoot');
    const cartTotalEl      = document.getElementById('cartTotal');
    const cartCheckoutBtn  = document.getElementById('cartCheckoutBtn');
    const cartStatus       = document.getElementById('cartStatus');
    const checkoutPane     = document.getElementById('checkoutPane');
    const checkoutSuccess  = document.getElementById('checkoutSuccess');
    const stripeMount      = document.getElementById('stripeCheckoutMount');

    let cart            = readCart();
    let itemsCache      = new Map();   // item_id → {title, image_url, price_cents, currency, printful_variant_id}
    let stripe          = null;
    let checkoutHandle  = null;        // Stripe Embedded Checkout handle (mount/unmount)
    let checkoutLoading = false;

    function readCart() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr.filter((l) => l && l.item_id && Number(l.qty) > 0) : [];
      } catch { return []; }
    }
    function writeCart() {
      try { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart)); }
      catch { /* private mode */ }
    }
    function clearCart() {
      cart = [];
      writeCart();
      renderCart();
    }
    function cartIsEmpty() {
      return !cart.length;
    }

    function rememberItem(item) {
      if (!item || !item.id) return;
      itemsCache.set(item.id, {
        title: item.title || 'Untitled item',
        image_url: item.image_url || '',
        price_cents: Number(item.price_cents) || 0,
        currency: (item.currency || 'usd').toLowerCase(),
        printful_variant_id: item.printful_variant_id || ''
      });
    }

    function isBuyable(item) {
      return !!(STRIPE_PUBLISHABLE_KEY && Number(item?.price_cents) > 0 && item?.printful_variant_id);
    }

    function formatPriceCents(cents, currency) {
      if (!Number.isFinite(cents)) return '';
      const c = (currency || 'usd').toUpperCase();
      try {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: c }).format(cents / 100);
      } catch {
        return '$' + (cents / 100).toFixed(2);
      }
    }

    function addToCart(itemId) {
      const existing = cart.find((l) => l.item_id === itemId);
      if (existing) existing.qty = Math.min(20, existing.qty + 1);
      else cart.push({ item_id: itemId, qty: 1 });
      writeCart();
      renderCart();
      openCart();
    }
    function setLineQty(itemId, qty) {
      const next = Math.max(0, Math.min(20, Math.floor(qty)));
      cart = cart.map((l) => l.item_id === itemId ? { ...l, qty: next } : l).filter((l) => l.qty > 0);
      writeCart();
      renderCart();
    }
    function removeLine(itemId) {
      cart = cart.filter((l) => l.item_id !== itemId);
      writeCart();
      renderCart();
    }

    function cartTotalCents() {
      let total = 0;
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (it) total += (it.price_cents || 0) * line.qty;
      }
      return total;
    }
    function cartCurrency() {
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (it && it.currency) return it.currency;
      }
      return 'usd';
    }

    function renderCart() {
      // FAB visibility + count
      const count = cart.reduce((acc, l) => acc + (Number(l.qty) || 0), 0);
      cartFabCount.textContent = String(count);
      cartFab.hidden = !STRIPE_PUBLISHABLE_KEY || count === 0;

      cartBody.innerHTML = '';
      if (!cart.length) {
        const empty = document.createElement('p');
        empty.className = 'cart-empty';
        empty.textContent = 'Your cart is empty.';
        cartBody.appendChild(empty);
        cartTotalEl.textContent = formatPriceCents(0, 'usd');
        cartCheckoutBtn.disabled = true;
        return;
      }
      for (const line of cart) {
        const it = itemsCache.get(line.item_id);
        if (!it) continue;
        const row = document.createElement('div');
        row.className = 'cart-line';

        const img = document.createElement('img');
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        if (it.image_url) img.src = it.image_url;
        row.appendChild(img);

        const meta = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'cart-line-title';
        title.textContent = it.title;
        const sub = document.createElement('div');
        sub.className = 'cart-line-sub';
        sub.textContent = formatPriceCents(it.price_cents, it.currency) + ' each';
        meta.appendChild(title);
        meta.appendChild(sub);
        row.appendChild(meta);

        const qty = document.createElement('div');
        qty.className = 'cart-line-qty';
        const minus = document.createElement('button');
        minus.type = 'button'; minus.textContent = '−';
        minus.addEventListener('click', () => setLineQty(line.item_id, line.qty - 1));
        const num = document.createElement('span');
        num.textContent = String(line.qty);
        const plus = document.createElement('button');
        plus.type = 'button'; plus.textContent = '+';
        plus.addEventListener('click', () => setLineQty(line.item_id, line.qty + 1));
        qty.append(minus, num, plus);
        row.appendChild(qty);

        const price = document.createElement('div');
        price.className = 'cart-line-price';
        price.textContent = formatPriceCents(it.price_cents * line.qty, it.currency);
        row.appendChild(price);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'cart-line-remove';
        remove.setAttribute('aria-label', 'Remove');
        remove.textContent = '×';
        remove.addEventListener('click', () => removeLine(line.item_id));
        row.appendChild(remove);

        cartBody.appendChild(row);
      }
      cartTotalEl.textContent = formatPriceCents(cartTotalCents(), cartCurrency());
      cartCheckoutBtn.disabled = checkoutLoading || cart.length === 0;
    }

    function openCart() {
      if (!STRIPE_PUBLISHABLE_KEY) return; // cart disabled
      hideCheckoutPanes();
      cartBody.hidden = false;
      cartFoot.hidden = false;
      cartModal.hidden = false;
      setCartStatus('');
    }
    function closeCart() {
      // If a Stripe Checkout session is mounted, tear it down so a future
      // open() can mount a fresh one with the latest cart contents.
      if (checkoutHandle) {
        try { checkoutHandle.destroy(); } catch { /* noop */ }
        checkoutHandle = null;
      }
      cartModal.hidden = true;
    }
    function hideCheckoutPanes() {
      checkoutPane.hidden = true;
      checkoutSuccess.hidden = true;
    }
    function setCartStatus(message, state) {
      cartStatus.textContent = message || '';
      cartStatus.classList.toggle('error', state === 'error');
      cartStatus.classList.toggle('success', state === 'success');
    }

    cartFab.addEventListener('click', openCart);
    cartCloseBtn.addEventListener('click', closeCart);
    cartBackdrop.addEventListener('click', () => { if (!checkoutLoading) closeCart(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !cartModal.hidden && !checkoutLoading) closeCart();
    });

    cartCheckoutBtn.addEventListener('click', async () => {
      if (!cart.length || checkoutLoading) return;
      checkoutLoading = true;
      cartCheckoutBtn.disabled = true;
      setCartStatus('Starting secure checkout…');
      try {
        if (!stripe) {
          if (!window.Stripe) throw new Error('Stripe.js failed to load.');
          stripe = window.Stripe(STRIPE_PUBLISHABLE_KEY);
        }
        const resp = await fetch(CREATE_SESSION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart.map((l) => ({ item_id: l.item_id, qty: l.qty })) })
        });
        const raw = await resp.text();
        let payload = {};
        try { payload = raw ? JSON.parse(raw) : {}; } catch { /* ignore */ }
        if (!resp.ok) throw new Error(payload.error || ('HTTP ' + resp.status));

        cartBody.hidden = true;
        cartFoot.hidden = true;
        checkoutPane.hidden = false;

        checkoutHandle = await stripe.initEmbeddedCheckout({
          clientSecret: payload.client_secret,
        });
        checkoutHandle.mount(stripeMount);
        setCartStatus('');
      } catch (error) {
        console.error('[gift] checkout failed', error);
        setCartStatus(error instanceof Error ? error.message : String(error), 'error');
        cartBody.hidden = false;
        cartFoot.hidden = false;
        checkoutPane.hidden = true;
      } finally {
        checkoutLoading = false;
        cartCheckoutBtn.disabled = cart.length === 0;
      }
    });

    document.getElementById('checkoutSuccessClose').addEventListener('click', () => {
      closeCart();
      history.replaceState({}, '', location.pathname);
    });

    // If Stripe redirected us back with ?checkout=complete, render the
    // success pane right away and clear local cart state.
    (function handleCheckoutReturn() {
      const completed = params.get('checkout') === 'complete';
      if (!completed) return;
      clearCart();
      hideCheckoutPanes();
      cartBody.hidden = true;
      cartFoot.hidden = true;
      checkoutSuccess.hidden = false;
      cartModal.hidden = false;
    })();

    // Patch the existing createCard() so POD items render a Buy button.
    // We keep the affiliate code path unchanged for items without
    // price_cents / printful_variant_id.
    const __origCreateCard = createCard;
    createCard = function (item, opts = {}) {
      rememberItem(item);
      if (!isBuyable(item)) return __origCreateCard(item, opts);

      // Buyable card: render as a <div> (not an <a>) so the Buy button is
      // the only navigation target.
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.adminEdit = 'gift-item';
      card.dataset.adminId = item.id || '';
      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';
      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        applyGiftImageDisplay(img, item, media);
        img.addEventListener('error', () => { img.remove(); media.dataset.hasImage = 'false'; });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' / ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = item.title || 'Untitled item';
      body.appendChild(title);

      const priceEl = document.createElement('div');
      priceEl.className = 'card-price';
      priceEl.textContent = formatPriceCents(item.price_cents, item.currency);
      body.appendChild(priceEl);

      const desc = cleanDescription(item.description);
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
      }

      const buy = document.createElement('button');
      buy.type = 'button';
      buy.className = 'card-buy';
      buy.textContent = 'Buy now';
      buy.addEventListener('click', () => addToCart(item.id));
      body.appendChild(buy);

      card.append(media, body);
      return card;
    };

    // Initial paint so the FAB count matches any pre-existing cart from a
    // previous visit. Item titles/prices populate as cards render.
    renderCart();
  </script>

  <script src="../mc/js/gs-buy-modal.js"></script>

  <!-- Admin-only: paints a hidden "EDIT GIFT" button on each gift card for
       logged-in admins (verified against admin_users), linking to that gift in
       shop/admin/?item=<id> in a new tab. Invisible to the public. -->
  <script src="../assets/admin-bridge.js"></script>
</body>
</html>
