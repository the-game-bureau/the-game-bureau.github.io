  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .admin-nav { display: flex; gap: 4px; }
    .admin-nav-group { position: relative; display: inline-flex; }
    .admin-nav-submenu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      display: none;
      flex-direction: column;
      padding: 6px;
      gap: 2px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }
    .admin-nav-group:hover > .admin-nav-submenu,
    .admin-nav-group:focus-within > .admin-nav-submenu { display: flex; }
    .admin-nav-submenu .admin-nav-link {
      white-space: nowrap;
      font-size: 0.78rem;
      min-height: 34px;
      padding: 0 12px;
    }
    .admin-nav-split {
      display: inline-flex;
      border: 2px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-nav-split .admin-nav-link {
      border-radius: 0;
      background: #fff;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit {
      padding: 0 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      background: #d1d5db;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit:hover {
      background: #c5c9d1;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active:hover {
      background: rgba(var(--bic-blue-rgb), 0.85);
      color: #fff;
    }
    .admin-nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav-link:hover { background: var(--line); color: var(--ink); }
    .admin-nav-link--active { background: var(--accent); color: #fff; }
    .toolbar-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; }

    .topbar-actions > a.btn[href="./"] { display: none; }

    .section-head { display: grid; gap: 4px; margin: 0 0 14px; }

    .section-head--gears {
      position: relative;
      overflow: hidden;
      gap: 6px;
      margin-bottom: 18px;
      padding: 20px 22px 22px;
      padding-right: clamp(136px, 30vw, 220px);
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .section-head--gears > :not(.section-gear-art):not(.section-head-actions) {
      position: relative;
      z-index: 1;
    }

    .section-head-actions {
      position: absolute;
      top: 50%;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
      transform: translateY(-50%);
    }

    .section-head-actions .btn[aria-disabled="true"] {
      opacity: 0.38;
      pointer-events: none;
    }

    .section-head--gears .copy {
      max-width: 440px;
    }

    .section-gear-art {
      position: absolute;
      top: -4px;
      right: -2px;
      z-index: 0;
      width: 320px;
      height: 188px;
      pointer-events: none;
      opacity: 0.96;
      overflow: visible;
    }

    .section-head--gears .header-gear {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-atmosphere {
      opacity: 0.9;
    }

    .section-head--gears .header-gear--large {
      stroke: rgba(var(--bic-blue-rgb), 0.28);
    }

    .section-head--gears .header-gear--small {
      stroke: rgba(var(--bic-blue-rgb), 0.22);
    }

    .section-head--gears .header-gear-body {
      fill: rgba(var(--bic-blue-rgb), 0.045);
      stroke-width: 3.4;
    }

    .section-head--gears .header-gear-ring {
      fill: rgba(var(--bic-blue-rgb), 0.018);
      stroke-width: 3;
    }

    .section-head--gears .header-gear-inner {
      fill: none;
      stroke-width: 2.4;
      opacity: 0.92;
    }

    .section-head--gears .header-gear-spoke {
      fill: rgba(var(--bic-blue-rgb), 0.1);
      stroke: none;
    }

    .section-head--gears .header-gear-core {
      fill: rgba(var(--bic-blue-rgb), 0.08);
      stroke-width: 2.2;
    }

    .section-head--gears .header-gear-halo {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.14);
      stroke-width: 2;
      stroke-dasharray: 4 8;
    }

    .section-head--gears .header-gear-bore {
      fill: none;
      stroke-width: 2;
    }

    .section-head--gears .header-gear-wire {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.12);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-wire--bold {
      stroke: rgba(var(--bic-blue-rgb), 0.17);
      stroke-width: 1.8;
    }

    .section-head--gears .header-gear-guide {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.1);
      stroke-width: 1.2;
      stroke-dasharray: 2 7;
    }

    .section-head--gears .header-gear-node {
      fill: rgba(var(--bic-blue-rgb), 0.17);
    }

    .section-head--gears .header-gear-speck {
      fill: rgba(var(--bic-blue-rgb), 0.11);
    }

    .section-head--gears .header-gear-crosshair {
      stroke: rgba(var(--bic-blue-rgb), 0.15);
      stroke-width: 1.4;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3rem;
      letter-spacing: 0;
      line-height: 1;
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 2.4rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy { margin: 0; color: var(--muted); line-height: 1.5; max-width: 620px; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar input[type="search"],
    .toolbar select {
      appearance: none;
      -webkit-appearance: none;
      flex: 1;
      min-width: min(100%, 260px);
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .toolbar input[type="search"] {
      min-width: min(100%, 300px);
    }
    .toolbar select::-ms-expand { display: none; }

    button, .btn, .admin-nav-link, [class*="-btn"] {
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .btn:hover { background: rgba(255,255,255,1); border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--bic-blue); border-color: var(--bic-blue); }

    .btn.danger {
      color: var(--danger);
      border-color: rgba(160, 63, 45, 0.45);
      background: rgba(255,255,255,0.92);
    }
    .btn.danger:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--bic-blue-rgb), 0.52);
      backdrop-filter: blur(6px);
    }

    .auth-modal.hidden {
      display: none !important;
    }

    .auth {
      position: relative;
      width: min(430px, 100%);
      margin: 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }

    .auth-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .auth-close:hover { background: var(--line); color: var(--ink); }

    .auth h1 { margin-bottom: 10px; font-size: 2.4rem; }
    .auth-form { display: grid; gap: 12px; margin-top: 18px; }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions .btn.primary { flex: 1; }
    .auth label {
      display: grid; gap: 6px;
      color: var(--muted); font-size: 0.9rem; font-weight: 700;
    }
    .auth input {
      height: 44px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: rgba(255,255,255,0.86);
    }
    .auth input:focus,
    .toolbar input[type="search"]:focus,
    .toolbar select:focus,
    .item input:focus,
    .item textarea:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    .home-icon-btn {
      letter-spacing: 0.06em;
    }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .signout-btn svg { display: block; width: 31px; height: 31px; }

    .mb-menu {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mb-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.15s, border-color 0.15s;
    }

    .mb-trigger:hover,
    .mb-trigger:focus-visible,
    .mb-menu.open .mb-trigger {
      background: rgba(255,255,255,1);
      border-color: var(--accent);
      outline: none;
    }

    .mb-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }

    .mb-section {
      padding: 6px 14px 4px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mb-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .mb-item:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
    }

    .mb-item.is-active {
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--accent);
    }

    .mb-sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }

    #shopStatus,
    #shopStatus.success {
      color: var(--ink);
      font-weight: 600;
    }

    .items {
      display: grid;
      gap: 14px;
    }
    .items-more { display: flex; justify-content: center; margin-top: 14px; }
    .item.paged-out { display: none; }
    .item-review {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .item-review-meta,
    .item-review-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .item-review-title {
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .item-certify-date {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
    }
    .item-review-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }
    .item-review-check input { cursor: pointer; }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px var(--paper-shadow);
    }

    .item.is-hidden { opacity: 0.65; }
    .item.is-new { border-color: var(--accent); }
    .item.is-targeted {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(215, 58, 49, 0.16), 0 10px 24px var(--paper-shadow);
    }

    .item-focus-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      width: 220px;
      flex-shrink: 0;
    }
    .item-focus-caption {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      line-height: 1.4;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: left;
    }
    /* Aspect-ratio + height match the public gift card's .card-media
       (154px tall × ≥280px wide). Scaled up 1.43x for an easier drag
       target while preserving WYSIWYG crop. max-width keeps it from
       overflowing narrow viewports — aspect-ratio handles the height. */
    .item-focus {
      position: relative;
      width: 400px;
      max-width: 100%;
      aspect-ratio: 400 / 220;
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.06);
      border: 1px solid var(--line);
      overflow: hidden;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      touch-action: none;
    }
    .item-focus [data-focus-placeholder] {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
    }
    .item-focus[data-image-fit="contain"] {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.80)),
        var(--gift-contain-image) center / cover no-repeat,
        rgba(var(--bic-blue-rgb), 0.06);
    }
    .item-focus img {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      max-width: none;
      max-height: none;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    .item-focus[data-image-fit="contain"] img {
      filter: drop-shadow(0 8px 16px rgba(var(--bic-blue-rgb), 0.24));
    }
    .item-focus[data-has-image="true"] {
      cursor: grab;
    }
    .item-focus[data-image-fit="contain"][data-has-image="true"] {
      cursor: default;
    }
    .item-focus[data-dragging="true"] {
      cursor: grabbing;
    }

    .item-fields {
      display: grid;
      grid-template-columns: 1fr 140px 130px;
      gap: 10px;
      align-items: end;
    }

    .item-fields .field-wide { grid-column: 1 / -1; }
    .item-fields label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-fields input,
    .item-fields textarea,
    .item-fields select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .item-fields textarea {
      height: 64px;
      padding: 8px 10px;
      resize: vertical;
      min-height: 64px;
    }

    .item-listings {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.03);
    }
    .item-listings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-listings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .listing-row {
      display: grid;
      grid-template-columns: 1fr 90px auto auto;
      gap: 6px;
      align-items: center;
    }
    .listing-row select,
    .listing-row input[type="number"] {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .listing-row select[multiple] {
      height: auto;
      min-height: 132px;
      padding: 4px 6px;
      overflow-y: auto;
    }
    .listing-row select[multiple] option { padding: 2px 6px; }
    .listing-row select[multiple] option:checked {
      background: linear-gradient(0deg, rgba(var(--bic-blue-rgb), 0.18), rgba(var(--bic-blue-rgb), 0.18));
      color: var(--ink);
    }
    .listing-row.is-multi { align-items: start; }
    .listing-row.is-multi .listing-remove,
    .listing-row.is-multi input[type="number"] { margin-top: 2px; }
    .listing-multi-hint {
      grid-column: 1 / -1;
      margin: -2px 0 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    /* Search-to-add combobox (new listing rows) */
    .listing-search-wrap { position: relative; }
    .listing-search {
      width: 100%;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .item-listings-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .item-listings-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .listing-picker-select {
      width: 100%;
      min-height: 168px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--ink);
      font-size: 0.85rem;
    }
    .listing-picker-select option { padding: 3px 6px; }
    .listing-picker-select option:checked {
      background: linear-gradient(0deg, rgba(var(--bic-blue-rgb), 0.2), rgba(var(--bic-blue-rgb), 0.2));
      color: var(--ink);
    }
    .listing-picker-actions { display: flex; gap: 6px; }
    .listing-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .listing-chips.has-chips { margin-bottom: 4px; }
    .listing-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px 2px 8px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.10);
      font-size: 0.78rem;
      color: var(--ink);
    }
    .listing-chip-label { color: inherit; text-decoration: none; cursor: pointer; }
    .listing-chip-label:hover { text-decoration: underline; }
    .listing-chip .muted { color: var(--muted); font-size: 0.7rem; }
    .listing-chip-remove {
      width: 16px;
      height: 16px;
      padding: 0;
      line-height: 1;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
    }
    .listing-chip-remove:hover { color: var(--danger); }
    .listing-search-results {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      z-index: 40;
      max-height: 220px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 8px 24px var(--paper-shadow);
    }
    .listing-search-result {
      padding: 7px 10px;
      font-size: 0.82rem;
      color: var(--ink);
      cursor: pointer;
    }
    .listing-search-result:hover,
    .listing-search-result.is-active { background: rgba(var(--bic-blue-rgb), 0.12); }
    .listing-search-result .muted { color: var(--muted); font-size: 0.74rem; }
    .listing-search-empty {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .listing-row .listing-remove {
      width: 30px; height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .listing-row .listing-remove:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .listing-row.is-removed { display: none; }
    .item-listings-empty {
      padding: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    .item-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
      margin-top: 4px;
    }

    /* ── Suggest lightbox ─────────────────────────────────────── */
    .suggest-modal {
      position: fixed; inset: 0; z-index: 1500;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .suggest-modal[hidden] { display: none; }
    .suggest-backdrop {
      position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }
    .suggest-panel {
      position: relative;
      width: min(720px, 100%);
      max-height: 90vh;
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
      overflow: hidden;
    }
    .suggest-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .suggest-panel-head h2 { margin: 0; font-size: 1rem; }
    .suggest-close {
      background: transparent; border: 0;
      font-size: 1.3rem; line-height: 1;
      color: var(--muted); cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
    }
    .suggest-close:hover { background: rgba(0,0,0,0.05); color: var(--ink); }
    .suggest-form, .suggest-results {
      padding: 16px 18px;
      overflow: auto;
      flex: 1;
    }
    .suggest-form { display: grid; gap: 12px; }
    .suggest-form label {
      display: grid; gap: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted);
    }
    .suggest-form input[type="text"],
    .suggest-form input[type="number"],
    .suggest-form select,
    .suggest-form textarea {
      height: 36px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 6px;
      font-family: inherit; font-size: 0.9rem;
      color: var(--ink); background: #fff;
    }
    .suggest-form textarea {
      min-height: min(52vh, 520px);
      padding: 10px;
      resize: vertical;
      line-height: 1.45;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 0.76rem;
      text-transform: none;
      letter-spacing: 0;
      white-space: pre;
    }
    .suggest-form .suggest-check {
      flex-direction: row; align-items: center; gap: 8px;
      font-family: inherit;
      text-transform: none; letter-spacing: 0;
      font-size: 0.85rem; font-weight: 500; color: var(--ink);
    }
    .suggest-form .suggest-check input { width: auto; height: auto; }
    .suggest-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 4px;
    }
    .suggest-status {
      min-height: 1.4em; margin: 0;
      font-size: 0.85rem; color: var(--muted);
    }
    .suggest-status.error { color: var(--danger); font-weight: 700; }
    .suggest-status.success { color: var(--ok, #2f6b3d); font-weight: 700; }
    .suggest-results-head {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .suggest-results-head label {
      display: inline-flex; gap: 6px; align-items: center;
      font-size: 0.85rem;
    }
    .suggest-results-count {
      flex: 1;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .suggest-results-list {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .suggest-result {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      align-items: center;
      background: rgba(255,255,255,0.96);
    }
    .suggest-result img {
      width: 56px; height: 56px;
      object-fit: contain;
      border-radius: 6px;
      background: #f5f5f5;
    }
    .suggest-result-meta {
      display: flex; flex-direction: column; gap: 2px;
      min-width: 0;
    }
    .suggest-result-title {
      font-size: 0.88rem; font-weight: 700;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-sub {
      font-size: 0.7rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-desc {
      margin: 2px 0 0;
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--ink);
      opacity: 0.82;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .suggest-hint {
      margin: 0 0 6px; font-size: 0.82rem; color: var(--muted); line-height: 1.4;
    }
    .suggest-advanced { margin: 2px 0; }
    .suggest-advanced > summary {
      cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.04em; text-transform: uppercase; list-style: revert;
      padding: 4px 0;
    }
    .suggest-advanced[open] > summary { margin-bottom: 6px; }
    .suggest-source {
      display: inline-block; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 999px; margin-right: 6px;
      vertical-align: middle;
    }
    .suggest-source--bookshop { background: rgba(82, 58, 164, 0.12); color: #523AA4; }
    .suggest-source--amazon { background: rgba(255, 153, 0, 0.16); color: #8a5a00; }
    .suggest-result-actions {
      display: flex; flex-direction: column; gap: 4px;
      align-items: flex-end;
    }
    .suggest-result-badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .suggest-result.is-existing { opacity: 0.55; }
    .suggest-result-check { width: 18px; height: 18px; cursor: pointer; }
    .suggest-result a.suggest-result-link {
      color: inherit; text-decoration: none;
    }
    .suggest-result a.suggest-result-link:hover .suggest-result-title {
      text-decoration: underline;
    }

    .item-status {
      flex: 1;
      text-align: right;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .item-status.error { color: var(--danger); font-weight: 700; }
    .item-status.success { color: var(--success); font-weight: 700; }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    html.admin-embedded body {
      min-height: 100%;
      background: transparent;
    }

    html.admin-embedded .app {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    html.admin-embedded .topbar,
    html.admin-embedded .section-head--gears,
    html.admin-embedded .home-icon-btn {
      display: none !important;
    }

    @media (max-width: 720px) {
      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions .mb-menu {
        flex: 1;
      }

      .topbar-actions .mb-trigger {
        width: 100%;
      }

      .topbar-actions .signout-btn {
        flex: 0 0 42px;
      }

      h1 { font-size: 2.4rem; }

      .section-head--gears {
        padding: 18px 18px 112px;
      }

      .section-head--gears .copy {
        max-width: none;
      }

      .section-gear-art {
        top: auto;
        right: -22px;
        bottom: -26px;
        width: 250px;
        height: 147px;
      }

      .toolbar {
        display: grid;
      }

      .toolbar > * {
        width: 100%;
      }

      .item { grid-template-columns: auto 1fr; }
      .item-focus-col { max-width: 100%; }
      .item-fields { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 540px) {
      .item-fields { grid-template-columns: 1fr; }
    }

  <div class="suggest-modal" id="suggestModal" hidden>
    <div class="suggest-backdrop"></div>

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script src="/mc/js/admin-nav-menu.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const signOutBtn   = document.getElementById('signOutBtn');
    const shopStatus   = document.getElementById('shopStatus');
    const addItemBtn   = document.getElementById('addItemBtn');
    const itemSearch   = document.getElementById('itemSearch');
    const suggestItemsBtn = document.getElementById('suggestItemsBtn');
    const amazonPromptBtn = document.getElementById('amazonPromptBtn');
    const itemsList    = document.getElementById('itemsList');
    const showMoreItemsBtn = document.getElementById('showMoreItemsBtn');
    const cityFilter   = document.getElementById('cityFilter');

    // Items list pagination: show 5 at a time (city-filtered + sorted),
    // reveal more in 5s. Unsaved (.is-new) items always show.
    const ITEMS_PAGE_SIZE = 50;
    let itemsPageLimit = ITEMS_PAGE_SIZE;
    function applyItemsPagination() {
      let shown = 0;
      let pagedOut = 0;
      itemsList.querySelectorAll('.item').forEach((item) => {
        if (item.classList.contains('hidden')) { item.classList.remove('paged-out'); return; }
        if (item.classList.contains('is-new')) { item.classList.remove('paged-out'); return; }
        if (shown < itemsPageLimit) { item.classList.remove('paged-out'); shown++; }
        else { item.classList.add('paged-out'); pagedOut++; }
      });
      if (showMoreItemsBtn) {
        showMoreItemsBtn.hidden = pagedOut === 0;
        showMoreItemsBtn.textContent = 'Show more (' + pagedOut + ' more)';
      }
    }
    if (showMoreItemsBtn) {
      showMoreItemsBtn.addEventListener('click', () => {
        itemsPageLimit += ITEMS_PAGE_SIZE;
        applyItemsPagination();
      });
    }
    if (itemSearch) {
      itemSearch.addEventListener('input', applyCityFilter);
    }
    const viewGiftShopBtn = document.getElementById('viewGiftShopBtn');
    const itemTemplate = document.getElementById('itemTemplate');
    const initialParams = new URLSearchParams(window.location.search);
    const initialItemId = String(initialParams.get('item') || '').trim();
    const initialShopCity = String(initialParams.get('city') || '').trim();
    let initialItemFocusPending = !!initialItemId;
    const BOOKSHOP_AFFILIATE_ID = '87073';
    const BOOKSHOP_IMPORT_HELPER_SQL = 'supabase/gs-bookshop-prompt-import.sql';
    const AMAZON_TAG = 'thegamebureau-20';
    const AMAZON_STORE = 'nolanatives-20';
    const AMAZON_IMPORT_HELPER_SQL = 'supabase/gs-amazon-prompt-import.sql';
    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        await showShop();
      },
      onSignedOut: () => {
        itemsList.innerHTML = '';
        gamesById = new Map();
        allGiftItemsCache = [];
        gameOptionsHtml = '<option value="">— Pick a game —</option>';
        if (itemSearch) {
          itemSearch.value = '';
          itemSearch.disabled = true;
        }
        if (cityFilter) cityFilter.innerHTML = '<option value="">All cities</option>';
        updateViewGiftShopLink();
        addItemBtn.disabled = true;
        setSuggestItemsButtonEnabled(false);
        setStatus(shopStatus, '');
        renderEmpty();
      }
    });
    window.TgbMcAdminNav.init({ signOutButton: signOutBtn, auth: adminAuth });

    // Every game we know about (live + archived), keyed by id, so we
    // can populate per-item dropdowns AND label rows whose game has
    // been archived since the item was created.
    let gamesById = new Map();
    let gameOptionsHtml = '<option value="">— Pick a game —</option>';
    // Flat list backing the search-to-add combobox: live games first, archived after.
    let gameSearchList = [];
    let allGiftItemsCache = [];

    function restUrl(table, params = {}) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function setStatus(el, message, state = '') {
      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('error', state === 'error');
      el.classList.toggle('success', state === 'success');
    }

    function setSuggestItemsButtonEnabled(enabled) {
      const session = adminAuth.getSession ? adminAuth.getSession() : null;
      const signedIn = !!(session && session.access_token);
      const canUse = !!enabled && signedIn;
      [suggestItemsBtn, amazonPromptBtn].forEach((button) => {
        if (!button) return;
        button.disabled = !canUse;
        button.removeAttribute('title');
      });
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) { return text; }
      } catch (_) { return fallback; }
    }

    function authHeaders(extra = {}) {
      return adminAuth.authHeaders(extra);
    }

    // ── Games ────────────────────────────────────────────────────────
    async function fetchGames() {
      const response = await fetch(restUrl('games', { select: 'id,name,city,away_team_city,away_team_mascot,home_team_mascot,fandom_game,archived', order: 'name.asc' }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load games.'));
      return response.json();
    }

    function isLive(game) {
      const dead = (v) => typeof v === 'boolean' ? v : (typeof v === 'string' && v.trim() && v.trim().toLowerCase() !== 'false' && v.trim() !== '0');
      return !dead(game.archived);
    }

    function isHiddenGiftItem(item) {
      return [item && item.hidden, item && item.archived].some((value) => {
        if (value === true) return true;
        const normalized = String(value == null ? '' : value).trim().toUpperCase();
        return normalized === 'YES' || normalized === 'TRUE' || normalized === '1';
      });
    }

    function shouldContainGiftImage(item) {
      const title = String(item && item.title || '');
      const url = String(item && item.url || '');
      return /B00O9KFZIE/i.test(url)
        || /\b(blu[-\s]?ray|blue[-\s]?ray|dvd)\b/i.test(title)
        || /\(bd\)/i.test(title)
        || /\bBD\b/.test(title);
    }

    // "away @ home" mascot matchup, e.g. " (Bengals @ Commanders)" (display only).
    function gameMatchupText(g) {
      const away = String(g && g.away_team_mascot || '').trim();
      const home = String(g && g.home_team_mascot || '').trim();
      return (away || home) ? ' (' + away + ' @ ' + home + ')' : '';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadGames() {
      const games = await fetchGames();
      gamesById = new Map(games.map((g) => [g.id, g]));
      // Live games first, archived games grouped after.
      const live = games.filter(isLive);
      const dead = games.filter((g) => !isLive(g));
      const renderOpt = (g, suffix) =>
        '<option value="' + escapeHtml(g.id) + '">' +
        escapeHtml((g.name || g.id) + (suffix ? ' ' + suffix : '')) +
        '</option>';
      gameOptionsHtml =
        '<option value="">— Pick a game —</option>' +
        live.map((g) => renderOpt(g, '')).join('') +
        dead.map((g) => renderOpt(g, '(archived)')).join('');

      gameSearchList = live.map((g) => ({ id: g.id, name: g.name || g.id, matchup: gameMatchupText(g), archived: false }))
        .concat(dead.map((g) => ({ id: g.id, name: g.name || g.id, matchup: gameMatchupText(g), archived: true })));

      // City filter — one list. A game's city is the away team's city for a
      // fandom game, otherwise its start city.
      const cities = new Set();
      games.forEach((g) => { const c = gameCity(g); if (c) cities.add(c); });
      if (cityFilter) {
        const keep = cityFilter.value;
        cityFilter.innerHTML =
          '<option value="">All cities</option>' +
          Array.from(cities).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
            .map((c) => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');
        if (keep && cities.has(keep)) cityFilter.value = keep;
      }
      updateViewGiftShopLink();
    }

    function isFandom(g) {
      const v = g && g.fandom_game;
      if (v === true) return true;
      const s = String(v == null ? '' : v).trim().toLowerCase();
      return s === 'yes' || s === 'true' || s === '1';
    }

    // A game's city: the away team's city for fandom games, else the start city.
    function gameCity(g) {
      if (!g) return '';
      return String((isFandom(g) ? g.away_team_city : g.city) || '').trim();
    }

    // The games an item is listed in (from its current chip selection).
    function itemGames(item) {
      const state = item._listings;
      if (!state) return [];
      return Array.from(state.entries.keys()).map((id) => gamesById.get(id)).filter(Boolean);
    }

    function itemSearchText(item) {
      const field = (name) => String(item.querySelector('[data-field="' + name + '"]')?.value || '');
      const gamesText = itemGames(item)
        .map((g) => [
          g && g.id,
          g && g.name,
          gameCity(g),
          g && g.city,
          g && g.away_team_city,
          g && g.home_team_city,
          gameMatchupText(g)
        ].filter(Boolean).join(' '))
        .join(' ');
      return [
        item.dataset.id,
        field('title'),
        field('url'),
        field('image_url'),
        field('price_display'),
        field('description'),
        item.classList.contains('is-hidden') ? 'hidden' : 'visible',
        item.dataset.certifiedAt ? 'certified' : 'uncertified',
        gamesText
      ].filter(Boolean).join(' ').toLowerCase();
    }

    function applyCityFilter() {
      const city = cityFilter ? cityFilter.value : '';
      const query = itemSearch ? String(itemSearch.value || '').trim().toLowerCase() : '';
      const terms = query ? query.split(/\s+/).filter(Boolean) : [];
      const items = itemsList.querySelectorAll('.item');
      let visible = 0;
      items.forEach((item) => {
        const cityMatch = !city || itemGames(item).some((g) => gameCity(g) === city);
        const searchText = terms.length ? itemSearchText(item) : '';
        const searchMatch = !terms.length || terms.every((term) => searchText.includes(term));
        const show = cityMatch && searchMatch;
        item.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      updateItemsStatus();
      // Changing the filter resets pagination back to the first page.
      itemsPageLimit = ITEMS_PAGE_SIZE;
      applyItemsPagination();
    }

    // Status line: "N items · C certified". Recounts from the DOM, so it can be
    // called after a live "Certify Today" toggle to keep the count fresh.
    function updateItemsStatus() {
      const items = itemsList.querySelectorAll('.item');
      const total = items.length;
      let certified = 0;
      items.forEach((item) => { if (item.dataset.certifiedAt) certified++; });
      setStatus(shopStatus,
        total + ' item' + (total === 1 ? '' : 's') + ' · ' + certified + ' certified',
        'success');
    }

    function updateViewGiftShopLink() {
      if (!viewGiftShopBtn) return;
      const url = new URL('/shop/', window.location.origin);
      const city = cityFilter ? cityFilter.value : initialShopCity;
      if (city) url.searchParams.set('city', city);
      viewGiftShopBtn.href = url.href;
    }

    if (viewGiftShopBtn) {
      viewGiftShopBtn.addEventListener('click', updateViewGiftShopLink);
      updateViewGiftShopLink();
    }

    // Order to surface what needs attention: visible never-certified items
    // first, then visible certified items, then hidden items regardless of
    // certification status. Dates/title break ties within each bucket.
    function sortItems() {
      const titleOf = (el) => String(el.querySelector('[data-field="title"]')?.value || '').trim();
      const byTitle = (a, b) => titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: 'base', numeric: true });
      const hidden = (el) => el.classList.contains('is-hidden');
      const addedTime = (el) => {
        const t = Date.parse(el.dataset.createdAt || '');
        return Number.isNaN(t) ? Infinity : t;   // unsaved/new → newest
      };
      const certTime = (el) => {
        const v = el.dataset.certifiedAt || '';
        if (!v) return null;                       // never certified
        const t = Date.parse(v);
        return Number.isNaN(t) ? null : t;
      };
      Array.from(itemsList.querySelectorAll('.item'))
        .sort((a, b) => {
          const ta = certTime(a);
          const tb = certTime(b);
          const ba = hidden(a) ? 2 : (ta === null ? 0 : 1);
          const bb = hidden(b) ? 2 : (tb === null ? 0 : 1);
          if (ba !== bb) return ba - bb;
          if (ba === 2) return byTitle(a, b) || (addedTime(a) - addedTime(b));
          if (ta === null && tb === null) return (addedTime(a) - addedTime(b)) || byTitle(a, b);
          if (ta === null) return -1;              // never-certified group first
          if (tb === null) return 1;
          return (ta - tb) || byTitle(a, b);       // certified: oldest → newest
        })
        .forEach((item) => itemsList.appendChild(item));
      applyItemsPagination();
    }

    // ── Items ────────────────────────────────────────────────────────
    async function fetchAllItems() {
      // Embed each item's listings so we can render the full edit UI in
      // one round-trip. Order is title-asc; per-listing position is
      // surfaced inside each card, not at the catalog level.
      const response = await fetch(restUrl('gift_shop_items', {
        select: '*,gift_shop_listings(*)',
        order: 'title.asc.nullslast'
      }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load gift shop items.'));
      return response.json();
    }

    async function insertItem(payload) {
      const response = await fetch(restUrl('gift_shop_items'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Insert failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateItem(id, payload) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Update failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteItem(id) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Delete failed.'));
    }

    // ── Listings ─────────────────────────────────────────────────────
    async function insertListing(payload) {
      const response = await fetch(restUrl('gift_shop_listings'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateListing(id, payload) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not update listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteListing(id) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not remove listing.'));
    }

    function renderEmpty() {
      itemsList.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'No items yet. Click ADD to start.';
      itemsList.appendChild(div);
    }

    function buildItemPayload(article) {
      const get = (name) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        return el ? el.value : '';
      };
      const focus = String(article.dataset.imageFocus || '50% 50%');
      return {
        kind: 'amazon_link',
        title: get('title').trim() || null,
        url: get('url').trim(),
        image_url: get('image_url').trim() || null,
        image_focus: focus,
        price_display: get('price_display').trim() || null,
        description: get('description').trim() || null,
        archived: !!article.querySelector('[data-field="hidden"]')?.checked
      };
    }

    // Listings UI: current games render as deletable chips. "+ Add to shops"
    // opens a searchable native multi-select listbox (Ctrl/Cmd+click toggles,
    // Shift+click selects a range), then "Add selected" turns the picks into
    // chips. Selection lives on article._listings; syncListings persists it.
    function bindListings(article, item) {
      const chipsEl  = article.querySelector('[data-listings-chips]');
      const picker   = article.querySelector('[data-listings-picker]');
      const searchEl = picker.querySelector('[data-listings-search]');
      const selectEl = picker.querySelector('[data-listings-select]');
      const addSelectedBtn = picker.querySelector('[data-action="add-selected"]');

      const entries = new Map();  // gameId -> { listingId|null, position }
      const removed = [];         // listing ids to DELETE on save
      (Array.isArray(item.gift_shop_listings) ? item.gift_shop_listings : []).forEach((l) => {
        if (!l || !l.game_id) return;
        entries.set(l.game_id, { listingId: l.id || null, position: l.position == null ? 0 : l.position });
      });
      article._listings = { entries, removed };

      function renderChips() {
        chipsEl.innerHTML = '';
        const ids = Array.from(entries.keys()).sort((a, b) =>
          String(gamesById.get(a)?.name || a).localeCompare(String(gamesById.get(b)?.name || b), undefined, { sensitivity: 'base' }));
        if (!ids.length) {
          const empty = document.createElement('div');
          empty.className = 'item-listings-empty';
          empty.textContent = 'Not in any shop yet.';
          chipsEl.appendChild(empty);
          return;
        }
        ids.forEach((id) => {
          const g = gamesById.get(id);
          const chip = document.createElement('span');
          chip.className = 'listing-chip';
          let label = escapeHtml(g ? (g.name || id) : id);
          // Show the matchup "away @ home" mascots in parens (display only — not persisted).
          const awayMascot = g && String(g.away_team_mascot || '').trim();
          const homeMascot = g && String(g.home_team_mascot || '').trim();
          if (awayMascot || homeMascot) {
            label += ' <span class="muted">(' + escapeHtml(awayMascot) + ' @ ' + escapeHtml(homeMascot) + ')</span>';
          }
          if (g && !isLive(g)) label += ' <span class="muted">(arch)</span>';
          if (!g) label += ' <span class="muted">(missing)</span>';
          // Clicking the label (not the ×) opens this game's gift shop in a new tab.
          const link = document.createElement('a');
          link.className = 'listing-chip-label';
          link.href = '/shop/?id=' + encodeURIComponent(id);
          link.target = '_blank';
          link.rel = 'noopener';
          link.title = "Open this game's gift shop";
          link.innerHTML = label;
          chip.appendChild(link);
          const x = document.createElement('button');
          x.type = 'button';
          x.className = 'listing-chip-remove';
          x.setAttribute('aria-label', 'Remove');
          x.textContent = '×';
          x.addEventListener('click', () => {
            const e = entries.get(id);
            if (e && e.listingId) removed.push(e.listingId);
            entries.delete(id);
            renderChips();
          });
          chip.appendChild(x);
          chipsEl.appendChild(chip);
        });
      }

      function renderOptions(query) {
        const q = String(query || '').trim().toLowerCase();
        selectEl.innerHTML = '';
        gameSearchList
          .filter((g) => !entries.has(g.id))
          .filter((g) => !q || (g.name + ' ' + (g.matchup || '')).toLowerCase().includes(q))
          .forEach((g) => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.name + (g.matchup || '') + (g.archived ? ' (archived)' : '');
            selectEl.appendChild(opt);
          });
      }

      function commitSelected() {
        Array.from(selectEl.selectedOptions).forEach((o) => {
          if (o.value && !entries.has(o.value)) entries.set(o.value, { listingId: null, position: 0 });
        });
        renderChips();
        // Refresh the list so just-added games drop out; keep the picker ready.
        searchEl.value = '';
        renderOptions('');
      }

      addSelectedBtn.addEventListener('click', commitSelected);
      searchEl.addEventListener('input', () => renderOptions(searchEl.value));
      searchEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commitSelected(); }
        else if (e.key === 'Escape') { e.preventDefault(); searchEl.value = ''; renderOptions(''); }
      });
      selectEl.addEventListener('dblclick', commitSelected);

      renderChips();
      renderOptions('');
    }

    // Persist chip selection: DELETE removed listings, INSERT newly-added games
    // (existing listings are left untouched). Returns true if >1 listing was
    // added so the caller can refresh the shop view.
    async function syncListings(article, itemId) {
      const state = article._listings;
      if (!state) return false;
      for (const id of state.removed.splice(0)) {
        await deleteListing(id);
      }
      let added = 0;
      for (const [gameId, e] of state.entries) {
        if (e.listingId) continue;
        const created = await insertListing({ item_id: itemId, game_id: gameId, position: e.position || 0 });
        if (created && created.id) { e.listingId = created.id; added++; }
      }
      return added > 1;
    }

    // Format an ISO timestamp as a local "Mon D, YYYY, h:mm AM/PM".
    function formatCertDate(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function bindItem(article, item) {
      article.dataset.id = item.id || '';
      article.dataset.createdAt = item.created_at || '';
      article.dataset.certifiedAt = item.certified_at || '';
      article.classList.toggle('is-new', !item.id);
      article.classList.toggle('is-hidden', isHiddenGiftItem(item));

      const set = (name, value) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!value;
        else el.value = value == null ? '' : String(value);
      };

      set('title', item.title);
      set('url', item.url);
      set('image_url', item.image_url);
      set('price_display', item.price_display);
      set('description', item.description);
      set('hidden', isHiddenGiftItem(item));

      // Current shops render as deletable chips; "+ Add to shops" opens a
      // searchable multi-select picker. State + persistence live in bindListings.
      bindListings(article, item);

      // ── Certify Today ──────────────────────────────────────────────
      // Show the last certified date; the checkbox is always unchecked on
      // load. Checking it writes certified_at = today to Supabase right away
      // (no Save needed) and updates the label.
      const certifyDateEl = article.querySelector('[data-certify-date]');
      const certifyCheck  = article.querySelector('[data-certify-today]');
      const setCertifyLabel = (value) => {
        const formatted = formatCertDate(value);
        certifyDateEl.textContent = 'Last certified: ' + (formatted || 'never');
      };
      setCertifyLabel(item.certified_at);
      if (certifyCheck) {
        certifyCheck.checked = false;
        certifyCheck.addEventListener('change', async () => {
          if (!certifyCheck.checked) return;
          const id = article.dataset.id;
          if (!id) {
            certifyCheck.checked = false;
            setItemStatus('Save the item before certifying.', 'error');
            return;
          }
          const iso = new Date().toISOString();
          certifyCheck.disabled = true;
          try {
            await updateItem(id, { certified_at: iso });
            article.dataset.certifiedAt = iso;
            sortItems();
            applyCityFilter();
            setCertifyLabel(iso);
            setItemStatus('Certified ' + formatCertDate(iso) + '.', 'success');
            setTimeout(() => setItemStatus(''), 2200);
          } catch (error) {
            console.error(error);
            certifyCheck.checked = false;
            setItemStatus(error instanceof Error ? error.message : String(error), 'error');
          } finally {
            certifyCheck.disabled = false;
          }
        });
      }

      // Focus picker: 400×220 frame matching the public card-media
      // aspect ratio (154px tall × ≥280px wide, scaled up for usability).
      // Image lives behind the frame at "cover" scale (smaller dim
      // matches the frame's same dim, longer dim overflows). Drag the
      // image to slide it under the window; the resulting top-left as
      // a fraction of overflow becomes the object-position saved back
      // to the row.
      const FRAME_W = 400;
      const FRAME_H = 220;
      const focusBox = article.querySelector('.item-focus');
      const placeholder = focusBox.querySelector('[data-focus-placeholder]');
      const currentImageFitItem = () => ({
        title: article.querySelector('[data-field="title"]')?.value || '',
        url: article.querySelector('[data-field="url"]')?.value || ''
      });

      const parseFocus = (raw) => {
        const m = String(raw || '').match(/(-?\d+(?:\.\d+)?)\s*%\s+(-?\d+(?:\.\d+)?)\s*%/);
        if (!m) return { x: 50, y: 50 };
        return {
          x: Math.min(100, Math.max(0, parseFloat(m[1]))),
          y: Math.min(100, Math.max(0, parseFloat(m[2])))
        };
      };

      let currentFocus = parseFocus(item.image_focus);
      let lastLayout = null;

      const writeFocus = () => {
        article.dataset.imageFocus =
          currentFocus.x.toFixed(1) + '% ' + currentFocus.y.toFixed(1) + '%';
      };
      writeFocus();

      const applyTransform = () => {
        const img = focusBox.querySelector('img');
        if (!img || !lastLayout) return;
        if (lastLayout.contain) {
          img.style.left = '50%';
          img.style.top = '50%';
          img.style.transform = 'translate3d(-50%, -50%, 0)';
          return;
        }
        img.style.left = '0';
        img.style.top = '0';
        const tx = -(currentFocus.x / 100) * lastLayout.overflowX;
        const ty = -(currentFocus.y / 100) * lastLayout.overflowY;
        img.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0)';
      };

      const sizeImage = () => {
        const img = focusBox.querySelector('img');
        if (!img || !img.naturalWidth || !img.naturalHeight) {
          lastLayout = null;
          return;
        }
        // Measure the frame at runtime so responsive shrinkage (mobile
        // max-width: 100%) doesn't desync the cover math from reality.
        const frameW = focusBox.clientWidth || FRAME_W;
        const frameH = focusBox.clientHeight || FRAME_H;
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const contain = shouldContainGiftImage(currentImageFitItem());
        const scale = contain ? Math.min(frameW / W, frameH / H) : Math.max(frameW / W, frameH / H);
        const dispW = W * scale;
        const dispH = H * scale;
        focusBox.dataset.imageFit = contain ? 'contain' : 'cover';
        const imageUrl = article.querySelector('[data-field="image_url"]').value.trim();
        if (contain && imageUrl) {
          focusBox.style.setProperty('--gift-contain-image', 'url("' + imageUrl.replace(/["\\]/g, '\\$&') + '")');
        } else {
          focusBox.style.removeProperty('--gift-contain-image');
        }
        lastLayout = {
          dispW, dispH, frameW, frameH, contain,
          overflowX: Math.max(0, dispW - frameW),
          overflowY: Math.max(0, dispH - frameH)
        };
        img.style.width = dispW + 'px';
        img.style.height = dispH + 'px';
        applyTransform();
      };

      const refreshFocusImage = () => {
        const url = article.querySelector('[data-field="image_url"]').value.trim();
        const existingImg = focusBox.querySelector('img');
        if (existingImg) existingImg.remove();
        lastLayout = null;
        if (url) {
          const img = document.createElement('img');
          img.alt = '';
          img.referrerPolicy = 'no-referrer';
          img.draggable = false;
          const onLoad = () => {
            focusBox.dataset.hasImage = 'true';
            placeholder.style.display = 'none';
            sizeImage();
          };
          const onError = () => {
            img.remove();
            focusBox.dataset.hasImage = 'false';
            delete focusBox.dataset.imageFit;
            focusBox.style.removeProperty('--gift-contain-image');
            placeholder.style.display = '';
            lastLayout = null;
          };
          img.addEventListener('load', onLoad);
          img.addEventListener('error', onError);
          focusBox.insertBefore(img, placeholder);
          img.src = url;
          // Cached images may already be complete before our listener
          // attaches — fire onLoad synchronously in that case.
          if (img.complete && img.naturalWidth > 0) onLoad();
        } else {
          focusBox.dataset.hasImage = 'false';
          delete focusBox.dataset.imageFit;
          focusBox.style.removeProperty('--gift-contain-image');
          placeholder.style.display = '';
        }
      };
      refreshFocusImage();
      article.querySelector('[data-field="image_url"]').addEventListener('input', refreshFocusImage);
      article.querySelector('[data-field="title"]').addEventListener('input', sizeImage);
      article.querySelector('[data-field="url"]').addEventListener('input', sizeImage);

      // Drag the image behind the frame. Pointer delta translates 1:1
      // into transform offset (since frame and image share screen px).
      // Translate is clamped so the frame stays filled (no white edges).
      let dragging = false;
      let dragStart = null;
      focusBox.addEventListener('pointerdown', (e) => {
        if (focusBox.dataset.hasImage !== 'true' || !lastLayout) return;
        if (lastLayout.contain) return;
        dragging = true;
        focusBox.dataset.dragging = 'true';
        try { focusBox.setPointerCapture(e.pointerId); } catch { /* ignore */ }
        dragStart = {
          tx: -(currentFocus.x / 100) * lastLayout.overflowX,
          ty: -(currentFocus.y / 100) * lastLayout.overflowY,
          px: e.clientX,
          py: e.clientY
        };
        e.preventDefault();
      });
      focusBox.addEventListener('pointermove', (e) => {
        if (!dragging || !lastLayout || !dragStart) return;
        const dx = e.clientX - dragStart.px;
        const dy = e.clientY - dragStart.py;
        const tx = Math.max(-lastLayout.overflowX, Math.min(0, dragStart.tx + dx));
        const ty = Math.max(-lastLayout.overflowY, Math.min(0, dragStart.ty + dy));
        currentFocus.x = lastLayout.overflowX > 0 ? (-tx / lastLayout.overflowX) * 100 : 50;
        currentFocus.y = lastLayout.overflowY > 0 ? (-ty / lastLayout.overflowY) * 100 : 50;
        writeFocus();
        applyTransform();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        dragStart = null;
        delete focusBox.dataset.dragging;
        try { focusBox.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
      };
      focusBox.addEventListener('pointerup', endDrag);
      focusBox.addEventListener('pointercancel', endDrag);

      const statusEl = article.querySelector('[data-status]');
      const setItemStatus = (msg, kind = '') => setStatus(statusEl, msg, kind);

      article.querySelector('[data-action="save"]').addEventListener('click', async () => {
        const payload = buildItemPayload(article);
        // All fields are mandatory.
        if (!payload.title) {
          setItemStatus('Title is required.', 'error');
          return;
        }
        if (!payload.url) {
          setItemStatus('Address is required.', 'error');
          return;
        }
        if (!payload.image_url) {
          setItemStatus('Image is required.', 'error');
          return;
        }
        if (!payload.description) {
          setItemStatus('Description is required.', 'error');
          return;
        }
        // Validate listings before doing any writes: require at least one shop.
        // (Selection is keyed by game id, so duplicates are impossible.)
        const listingsState = article._listings;
        const allGameIds = listingsState ? Array.from(listingsState.entries.keys()) : [];
        if (!allGameIds.length) {
          setItemStatus('Add this item to at least one shop first.', 'error');
          return;
        }
        setItemStatus('Saving…');
        try {
          let saved;
          if (article.dataset.id) {
            saved = await updateItem(article.dataset.id, payload);
          } else {
            saved = await insertItem(payload);
          }
          if (saved && saved.id) {
            article.dataset.id = saved.id;
            article.classList.remove('is-new');
          }
          article.classList.toggle('is-hidden', !!payload.archived);
          const fannedOut = await syncListings(article, article.dataset.id);
          setItemStatus('Saved.', 'success');
          setTimeout(() => setItemStatus(''), 2200);
          if (fannedOut) {
            await showShop();
          } else {
            sortItems();
            applyCityFilter();
          }
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });

      article.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        const id = article.dataset.id;
        if (!id) {
          // Brand-new row never saved — just remove from DOM.
          article.remove();
          if (!itemsList.children.length) renderEmpty();
          applyItemsPagination();
          return;
        }
        if (!window.confirm('Delete this item?')) return;
        setItemStatus('Deleting…');
        try {
          await deleteItem(id);
          article.remove();
          if (!itemsList.children.length) renderEmpty();
          applyItemsPagination();
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });
    }

    function appendItemRow(item = {}) {
      // Replace the empty-state placeholder if it's currently shown.
      const empty = itemsList.querySelector('.empty');
      if (empty) empty.remove();
      const fragment = itemTemplate.content.cloneNode(true);
      const article = fragment.querySelector('.item');
      itemsList.appendChild(article);
      bindItem(article, item);
      return article;
    }

    async function renderAllItems() {
      itemsList.innerHTML = '';
      setStatus(shopStatus, 'Loading items…');
      try {
        const items = await fetchAllItems();
        allGiftItemsCache = Array.isArray(items) ? items : [];
        if (!items.length) {
          renderEmpty();
          setStatus(shopStatus, '');
          return;
        }
        items.forEach((item) => appendItemRow(item));
        sortItems();
        applyCityFilter();
        updateViewGiftShopLink();
        focusInitialItem();
      } catch (error) {
        console.error(error);
        renderEmpty();
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    function focusInitialItem() {
      if (!initialItemFocusPending || !initialItemId) return;
      const article = itemsList.querySelector('.item[data-id="' + CSS.escape(initialItemId) + '"]');
      if (!article) return;
      initialItemFocusPending = false;
      // Make sure the deep-linked item isn't hidden behind pagination.
      if (article.classList.contains('paged-out')) {
        const all = Array.from(itemsList.querySelectorAll('.item'));
        itemsPageLimit = Math.max(itemsPageLimit, all.indexOf(article) + 1);
        applyItemsPagination();
      }
      article.classList.add('is-targeted');
      article.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const titleInput = article.querySelector('[data-field="title"]');
      if (titleInput) titleInput.focus({ preventScroll: true });
      setTimeout(() => article.classList.remove('is-targeted'), 3000);
    }

    addItemBtn.addEventListener('click', () => {
      const article = appendItemRow({});
      const titleInput = article.querySelector('[data-field="title"]');
      if (titleInput) titleInput.focus();
    });

    // ── Search prompt lightbox ───────────────────────────────────
    const suggestModal = document.getElementById('suggestModal');
    const suggestTitle = document.getElementById('suggestTitle');
    const suggestHint = document.getElementById('suggestHint');
    const suggestPromptText = document.getElementById('suggestPromptText');
    const suggestStatus = document.getElementById('suggestStatus');
    const copyPromptBtn = document.getElementById('copyPromptBtn');

    function promptClean(value, maxLength = 180) {
      const text = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
      if (!maxLength || text.length <= maxLength) return text;
      return text.slice(0, maxLength - 1).trimEnd() + '…';
    }

    function buildPromptGameSnapshot() {
      const allGames = Array.from(gamesById.values()).filter(Boolean);
      const liveGames = allGames.filter(isLive);
      const source = liveGames.length ? liveGames : allGames;
      return source
        .map((game) => {
          const matchup = promptClean(gameMatchupText(game).replace(/[()]/g, ''), 120);
          const row = {
            id: String(game.id || '').trim(),
            name: promptClean(game.name || game.id, 140),
            city: promptClean(gameCity(game), 90)
          };
          if (matchup) row.context = matchup;
          return row;
        })
        .filter((game) => game.id && game.name)
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true }));
    }

    function buildPromptExistingItemsSnapshot() {
      const seen = new Set();
      return (Array.isArray(allGiftItemsCache) ? allGiftItemsCache : [])
        .filter((item) => item && !item.gift_card_game_id)
        .map((item) => ({
          title: promptClean(item.title, 180),
          url: promptClean(item.url, 260),
          hidden: isHiddenGiftItem(item),
          certified: !!String(item.certified_at || '').trim()
        }))
        .filter((item) => item.title || item.url)
        .filter((item) => {
          const key = (item.url || item.title).toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base', numeric: true }));
    }

    function buildBookshopImportHelperSql() {
      return String.raw`
alter table public.gift_shop_items
  add column if not exists certified_at timestamptz;

create or replace function public.tgb_import_bookshop_prompt_items(items jsonb)
returns table (
  action text,
  title text,
  item_id text,
  listings_added integer,
  note text
)
language plpgsql
as $$
declare
  v_entry jsonb;
  v_title text;
  v_isbn text;
  v_url text;
  v_image_url text;
  v_price_display text;
  v_description text;
  v_game_ids jsonb;
  v_game_id_text text;
  v_game_id public.games.id%type;
  v_item_id public.gift_shop_items.id%type;
  v_existing_item_id public.gift_shop_items.id%type;
  v_position integer;
  v_listings_added integer;
  v_rows integer;
begin
  if items is null or jsonb_typeof(items) <> 'array' then
    raise exception 'Expected a JSON array of Bookshop item objects.';
  end if;

  for v_entry in select value from jsonb_array_elements(items)
  loop
    v_title := nullif(btrim(v_entry->>'title'), '');
    v_isbn := upper(regexp_replace(
      coalesce(
        nullif(v_entry->>'isbn', ''),
        substring(coalesce(v_entry->>'url', '') from '/a/87073/([0-9Xx-]+)'),
        ''
      ),
      '[^0-9Xx]',
      '',
      'g'
    ));

    if v_title is null then
      return query select 'skipped'::text, null::text, null::text, 0, 'missing title'::text;
      continue;
    end if;

    if length(v_isbn) not in (10, 13) then
      return query select 'skipped'::text, v_title, null::text, 0, 'missing ISBN-10/ISBN-13'::text;
      continue;
    end if;

    if jsonb_typeof(v_entry->'game_ids') = 'array' then
      v_game_ids := v_entry->'game_ids';
    elsif nullif(v_entry->>'game_id', '') is not null then
      v_game_ids := jsonb_build_array(v_entry->>'game_id');
    else
      v_game_ids := '[]'::jsonb;
    end if;

    if jsonb_array_length(v_game_ids) = 0 then
      return query select 'skipped'::text, v_title, null::text, 0, 'missing game_ids'::text;
      continue;
    end if;

    v_url := 'https://bookshop.org/a/87073/' || v_isbn;
    v_image_url := coalesce(
      nullif(btrim(v_entry->>'image_url'), ''),
      'https://images-us.bookshop.org/ingram/' || v_isbn || '.jpg'
    );
    v_price_display := nullif(btrim(v_entry->>'price_display'), '');
    v_description := nullif(left(btrim(coalesce(v_entry->>'description', '')), 700), '');

    v_existing_item_id := null;
    -- Hidden/archived and uncertified rows still count as existing inventory.
    select i.id
      into v_existing_item_id
      from public.gift_shop_items i
     where lower(btrim(coalesce(i.url, ''))) = lower(v_url)
        or lower(btrim(coalesce(i.title, ''))) = lower(v_title)
     limit 1;

    if v_existing_item_id is not null then
      return query select 'skipped'::text, v_title, v_existing_item_id::text, 0, 'existing title or URL'::text;
      continue;
    end if;

    insert into public.gift_shop_items (
      kind, title, url, image_url, image_focus, price_display,
      description, archived, certified_at
    )
    values (
      'amazon_link',
      v_title,
      v_url,
      v_image_url,
      '50% 50%',
      v_price_display,
      v_description,
      false,
      null
    )
    returning id into v_item_id;

    v_listings_added := 0;
    v_position := 0;

    for v_game_id_text in select value from jsonb_array_elements_text(v_game_ids)
    loop
      begin
        v_game_id := v_game_id_text;
      exception when others then
        continue;
      end;

      if not exists (
        select 1
          from public.games g
         where g.id = v_game_id
           and (g.archived is null or g.archived = '' or upper(g.archived) <> 'YES')
      ) then
        continue;
      end if;

      insert into public.gift_shop_listings (item_id, game_id, position, archived)
      select v_item_id, v_game_id, v_position, false
      where not exists (
        select 1
          from public.gift_shop_listings l
         where l.item_id = v_item_id
           and l.game_id = v_game_id
      );

      get diagnostics v_rows = row_count;
      v_listings_added := v_listings_added + v_rows;
      v_position := v_position + 1;
    end loop;

    if v_listings_added = 0 then
      delete from public.gift_shop_items where id = v_item_id;
      return query select 'skipped'::text, v_title, null::text, 0, 'no valid live game listings'::text;
    else
      return query select 'inserted'::text, v_title, v_item_id::text, v_listings_added, null::text;
    end if;
  end loop;
end;
$$;`.trim();
    }
