    function buildAmazonImportHelperSql() {
      return String.raw`
alter table public.gift_shop_items
  add column if not exists certified_at timestamptz;

create or replace function public.tgb_import_amazon_prompt_items(items jsonb)
returns table (
  action text,
  title text,
  item_id text,
  listings_added integer,
  note text
)
language plpgsql
as $$
declare
  v_entry jsonb;
  v_title text;
  v_asin text;
  v_url text;
  v_image_url text;
  v_price_display text;
  v_description text;
  v_game_ids jsonb;
  v_game_id_text text;
  v_game_id public.games.id%type;
  v_item_id public.gift_shop_items.id%type;
  v_existing_item_id public.gift_shop_items.id%type;
  v_position integer;
  v_listings_added integer;
  v_rows integer;
begin
  if items is null or jsonb_typeof(items) <> 'array' then
    raise exception 'Expected a JSON array of Amazon item objects.';
  end if;

  for v_entry in select value from jsonb_array_elements(items)
  loop
    v_title := nullif(btrim(v_entry->>'title'), '');
    v_asin := upper(regexp_replace(
      coalesce(
        nullif(v_entry->>'asin', ''),
        substring(coalesce(v_entry->>'url', '') from '/dp/([A-Za-z0-9]{10})'),
        substring(coalesce(v_entry->>'url', '') from '/gp/product/([A-Za-z0-9]{10})'),
        ''
      ),
      '[^A-Z0-9]',
      '',
      'g'
    ));

    if v_title is null then
      return query select 'skipped'::text, null::text, null::text, 0, 'missing title'::text;
      continue;
    end if;

    if v_asin !~ '^[A-Z0-9]{10}$' then
      return query select 'skipped'::text, v_title, null::text, 0, 'missing 10-character ASIN'::text;
      continue;
    end if;

    if jsonb_typeof(v_entry->'game_ids') = 'array' then
      v_game_ids := v_entry->'game_ids';
    elsif nullif(v_entry->>'game_id', '') is not null then
      v_game_ids := jsonb_build_array(v_entry->>'game_id');
    else
      v_game_ids := '[]'::jsonb;
    end if;

    if jsonb_array_length(v_game_ids) = 0 then
      return query select 'skipped'::text, v_title, null::text, 0, 'missing game_ids'::text;
      continue;
    end if;

    v_url := 'https://www.amazon.com/dp/' || v_asin || '?tag=thegamebureau-20&ascsubtag=nolanatives-20&store=nolanatives-20';
    v_image_url := nullif(btrim(v_entry->>'image_url'), '');
    v_price_display := nullif(btrim(v_entry->>'price_display'), '');
    v_description := nullif(left(btrim(coalesce(v_entry->>'description', '')), 700), '');

    if v_image_url is null then
      return query select 'skipped'::text, v_title, null::text, 0, 'missing image_url'::text;
      continue;
    end if;

    v_existing_item_id := null;
    -- Hidden/archived and uncertified rows still count as existing inventory.
    select i.id
      into v_existing_item_id
      from public.gift_shop_items i
     where lower(btrim(coalesce(i.url, ''))) = lower(v_url)
        or coalesce(i.url, '') ilike '%/dp/' || v_asin || '%'
        or coalesce(i.url, '') ilike '%/gp/product/' || v_asin || '%'
        or lower(btrim(coalesce(i.title, ''))) = lower(v_title)
     limit 1;

    if v_existing_item_id is not null then
      return query select 'skipped'::text, v_title, v_existing_item_id::text, 0, 'existing title or ASIN'::text;
      continue;
    end if;

    insert into public.gift_shop_items (
      kind, title, url, image_url, image_focus, price_display,
      description, archived, certified_at
    )
    values (
      'amazon_link',
      v_title,
      v_url,
      v_image_url,
      '50% 50%',
      v_price_display,
      v_description,
      false,
      null
    )
    returning id into v_item_id;

    v_listings_added := 0;
    v_position := 0;

    for v_game_id_text in select value from jsonb_array_elements_text(v_game_ids)
    loop
      begin
        v_game_id := v_game_id_text;
      exception when others then
        continue;
      end;

      if not exists (
        select 1
          from public.games g
         where g.id = v_game_id
           and (g.archived is null or g.archived = '' or upper(g.archived) <> 'YES')
      ) then
        continue;
      end if;

      insert into public.gift_shop_listings (item_id, game_id, position, archived)
      select v_item_id, v_game_id, v_position, false
      where not exists (
        select 1
          from public.gift_shop_listings l
         where l.item_id = v_item_id
           and l.game_id = v_game_id
      );

      get diagnostics v_rows = row_count;
      v_listings_added := v_listings_added + v_rows;
      v_position := v_position + 1;
    end loop;

    if v_listings_added = 0 then
      delete from public.gift_shop_items where id = v_item_id;
      return query select 'skipped'::text, v_title, null::text, 0, 'no valid live game listings'::text;
    else
      return query select 'inserted'::text, v_title, v_item_id::text, v_listings_added, null::text;
    end if;
  end loop;
end;
$$;`.trim();
    }

    function buildBookshopSearchPrompt() {
      const generatedAt = new Date();
      const games = buildPromptGameSnapshot();
      const existingItems = buildPromptExistingItemsSnapshot();
      const referralBase = 'https://bookshop.org/a/' + BOOKSHOP_AFFILIATE_ID + '/';
      const helperSql = buildBookshopImportHelperSql();
      const sqlExample = [
        helperSql,
        '',
        'select *',
        'from public.tgb_import_bookshop_prompt_items($tgb$',
        '[',
        '  {',
        '    "title": "Example Book Title",',
        '    "isbn": "9780000000000",',
        '    "url": "' + referralBase + '9780000000000",',
        '    "image_url": "https://images-us.bookshop.org/ingram/9780000000000.jpg",',
        '    "price_display": "$19.99",',
        '    "description": "One original shopper-facing sentence explaining why this book fits the game.",',
        '    "game_ids": ["game-id-from-list"]',
        '  }',
        ']',
        '$tgb$::jsonb);'
      ].join('\n');

      return [
        'You are helping The Game Bureau build gift-shop inventory.',
        '',
        'Task: search Bookshop.org and return a Supabase SQL import for exactly 100 NEW book items related to the current, non-archived games below.',
        '',
        'Hard requirements:',
        '- Use Bookshop.org product pages only. Do not use Amazon or non-book retailers.',
        '- Every item must be a real book currently findable on Bookshop.org.',
        '- Every item must use this referral URL pattern exactly: ' + referralBase + '<ISBN_WITHOUT_HYPHENS>.',
        '- Prefer ISBN-13. Strip hyphens/spaces from ISBNs.',
        '- Do not include any current gift-shop inventory item listed below. Hidden, archived, or uncertified rows still count as already-owned inventory. Avoid duplicate titles, duplicate ISBNs, and duplicate URLs.',
        '- The JSON array must contain exactly 100 objects.',
        '- Each JSON object needs: title, isbn, url, image_url, price_display, description, game_ids.',
        '- url and image_url must be raw URL strings only, never Markdown links like [url](url).',
        '- game_ids must use only ids from the current games JSON below. Pick one to three genuinely relevant games per item unless the item is city-themed.',
        '- For a city-themed item, add it to every current game whose title/name contains that city in "{CITY} Fans" format, or contains that city elsewhere in the title/name in a non-takeover format. Use the game title/name for this decision, not the game city field. Do not count a city mention when it appears as "Takeover {CITY}"; for example, Baltimore gifts can go on "Baltimore Fans Takeover Atlanta" but not "Chicago Fans Takeover Baltimore." This city-wide rule overrides the one-to-three game limit.',
        '- Description must be original, concise, and shopper-facing. Do not paste long publisher jacket copy.',
        '- image_url should be a Bookshop cover image when available. If needed, use https://images-us.bookshop.org/ingram/<ISBN>.jpg.',
        '- Do not set certified_at. New imports must remain uncertified/unchecked; the import helper sets certified_at to null.',
        '- Do not put the literal sequence $tgb$ inside any JSON string value.',
        '- Return SQL only: no markdown fence, no explanation, no bullets outside SQL.',
        '',
        'Return one self-contained Supabase SQL script. It must begin with the helper setup below, then call the helper with the 100-item JSON array. Do not omit the helper setup; the database may not have it yet. Use this exact SQL shape:',
        sqlExample,
        '',
        'Reusable helper source also lives in this repo at ' + BOOKSHOP_IMPORT_HELPER_SQL + ', but the SQL you return must include the helper setup inline.',
        '',
        'Current games JSON:',
        JSON.stringify(games, null, 2),
        '',
        'Current gift-shop inventory to exclude JSON (includes hidden/archived/uncertified rows; do not recreate any of them):',
        JSON.stringify(existingItems, null, 2),
        '',
        'Generated at: ' + generatedAt.toISOString()
      ].join('\n');
    }

    function buildAmazonSearchPrompt() {
      const generatedAt = new Date();
      const games = buildPromptGameSnapshot();
      const existingItems = buildPromptExistingItemsSnapshot();
      const exampleAsin = 'B000000000';
      const helperSql = buildAmazonImportHelperSql();
      const sqlExample = [
        helperSql,
        '',
        'select *',
        'from public.tgb_import_amazon_prompt_items($tgb$',
        '[',
        '  {',
        '    "title": "Example Gift Item",',
        '    "asin": "' + exampleAsin + '",',
        '    "url": "' + amazonAffiliateUrl(exampleAsin) + '",',
        '    "image_url": "https://m.media-amazon.com/images/I/example.jpg",',
        '    "price_display": "$24.99",',
        '    "description": "One original shopper-facing sentence explaining why this item fits the game.",',
        '    "game_ids": ["game-id-from-list"]',
        '  }',
        ']',
        '$tgb$::jsonb);'
      ].join('\n');

      return [
        'You are helping The Game Bureau build gift-shop inventory.',
        '',
        'Task: search Amazon.com and return a Supabase SQL import for exactly 100 NEW physical gift items related to the current, non-archived games below.',
        '',
        'Hard requirements:',
        '- Use Amazon.com product pages only.',
        '- Expand beyond books. Prioritize physical giftable items such as puzzles, maps, field notebooks, pens, cards, local-history objects, sports fan gear, tailgate gear, travel accessories, guide tools, playful desk items, apparel, ornaments, posters, and other game-relevant souvenirs.',
        '- Avoid Kindle ebooks, Audible products, subscriptions, gift cards, groceries, perishable items, weapons, restricted items, and anything that looks counterfeit or unsafe.',
        '- Books are allowed only when an item is unusually perfect and not already covered by the Bookshop prompt; most results should be non-book products.',
        '- Every item must have a real Amazon ASIN and a raw Amazon product image URL.',
        '- Every item must use this referral URL pattern exactly: https://www.amazon.com/dp/<ASIN>?tag=' + AMAZON_TAG + '&ascsubtag=' + AMAZON_STORE + '&store=' + AMAZON_STORE + '.',
        '- Prefer stable /dp/<ASIN> URLs. Strip tracking junk and do not use shortened links.',
        '- Do not include any current gift-shop inventory item listed below. Hidden, archived, or uncertified rows still count as already-owned inventory. Avoid duplicate titles, duplicate ASINs, and duplicate URLs.',
        '- The JSON array must contain exactly 100 objects.',
        '- Each JSON object needs: title, asin, url, image_url, price_display, description, game_ids.',
        '- url and image_url must be raw URL strings only, never Markdown links like [url](url).',
        '- game_ids must use only ids from the current games JSON below. Pick one to three genuinely relevant games per item unless the item is city-themed.',
        '- For a city-themed item, add it to every current game whose title/name contains that city in "{CITY} Fans" format, or contains that city elsewhere in the title/name in a non-takeover format. Use the game title/name for this decision, not the game city field. Do not count a city mention when it appears as "Takeover {CITY}"; for example, Baltimore gifts can go on "Baltimore Fans Takeover Atlanta" but not "Chicago Fans Takeover Baltimore." This city-wide rule overrides the one-to-three game limit.',
        '- Description must be original, concise, and shopper-facing. Do not paste long manufacturer copy.',
        '- Do not set certified_at. New imports must remain uncertified/unchecked; the import helper sets certified_at to null.',
        '- Do not put the literal sequence $tgb$ inside any JSON string value.',
        '- Return SQL only: no markdown fence, no explanation, no bullets outside SQL.',
        '',
        'Return one self-contained Supabase SQL script. It must begin with the helper setup below, then call the helper with the 100-item JSON array. Do not omit the helper setup; the database may not have it yet. Use this exact SQL shape:',
        sqlExample,
        '',
        'Reusable helper source should be saved in this repo at ' + AMAZON_IMPORT_HELPER_SQL + ' if needed later, but the SQL you return must include the helper setup inline.',
        '',
        'Current games JSON:',
        JSON.stringify(games, null, 2),
        '',
        'Current gift-shop inventory to exclude JSON (includes hidden/archived/uncertified rows; do not recreate any of them):',
        JSON.stringify(existingItems, null, 2),
        '',
        'Generated at: ' + generatedAt.toISOString()
      ].join('\n');
    }

    function openSuggestModal(mode = 'book') {
      const isAmazon = mode === 'amazon';
      const prompt = isAmazon ? buildAmazonSearchPrompt() : buildBookshopSearchPrompt();
      if (suggestTitle) suggestTitle.textContent = isAmazon ? 'Amazon search prompt' : 'Book search prompt';
      if (suggestHint) {
        suggestHint.textContent = isAmazon
          ? 'Copy this fresh prompt into a web-capable assistant. It asks for 100 broader Amazon gift items, excludes current inventory including hidden rows, and includes your Amazon referral tags.'
          : 'Copy this fresh prompt into a web-capable assistant. It asks for 100 Bookshop.org book items, excludes current inventory including hidden rows, and returns Supabase SQL using the import helper.';
      }
      suggestPromptText.value = prompt;
      setStatus(
        suggestStatus,
        (isAmazon ? 'Amazon' : 'Book') + ' prompt refreshed with ' + buildPromptGameSnapshot().length + ' game(s) and ' +
          buildPromptExistingItemsSnapshot().length + ' existing item(s).',
        'success'
      );
      suggestModal.hidden = false;
      setTimeout(() => {
        suggestPromptText.focus();
        suggestPromptText.setSelectionRange(0, 0);
      }, 0);
    }

    function closeSuggestModal(reason) {
      console.info('[search-prompt] close (' + (reason || 'unknown') + ')');
      suggestModal.hidden = true;
    }

    document.querySelectorAll('[data-suggest-dismiss]').forEach((el) => {
      el.addEventListener('click', () => closeSuggestModal(el.tagName + (el.id ? '#' + el.id : '') + (el.className ? '.' + el.className.replace(/\s+/g, '.') : '')));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !suggestModal.hidden) closeSuggestModal('Escape key');
    });

    if (copyPromptBtn) {
      copyPromptBtn.addEventListener('click', async () => {
        const original = copyPromptBtn.textContent;
        try {
          await navigator.clipboard.writeText(suggestPromptText.value);
          copyPromptBtn.textContent = 'Copied';
          setStatus(suggestStatus, 'Prompt copied.', 'success');
        } catch (_) {
          suggestPromptText.focus();
          suggestPromptText.select();
          setStatus(suggestStatus, 'Select-all is ready if clipboard access is blocked.', 'error');
          copyPromptBtn.textContent = 'Select Prompt';
        }
        setTimeout(() => { copyPromptBtn.textContent = original; }, 2200);
      });
    }

    suggestItemsBtn.addEventListener('click', () => openSuggestModal('book'));
    if (amazonPromptBtn) amazonPromptBtn.addEventListener('click', () => openSuggestModal('amazon'));

    async function showShop() {
      addItemBtn.disabled = true;
      if (itemSearch) itemSearch.disabled = true;
      setSuggestItemsButtonEnabled(false);
      try {
        await loadGames();
        await renderAllItems();
        addItemBtn.disabled = false;
        if (itemSearch) itemSearch.disabled = false;
        setSuggestItemsButtonEnabled(true);
      } catch (error) {
        console.error(error);
        addItemBtn.disabled = false;
        if (itemSearch) itemSearch.disabled = false;
        setSuggestItemsButtonEnabled(true);
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    document.querySelectorAll('[data-admin-logoff]').forEach((button) => {
      button.addEventListener('click', () => {
        adminAuth.signOut();
      });
    });

    (async function init() {
      try {
        await adminAuth.init();
      } catch (error) {
        console.error(error);
        adminAuth.showAuth(error instanceof Error ? error.message : String(error), 'error');
      }
    })();
  </script>
  <script>
    (function () {
      document.querySelectorAll('[data-admin-menu]').forEach((menu) => {
        const trigger = menu.querySelector('.mb-trigger');
        const panel = menu.querySelector('.mb-panel');
        if (!trigger || !panel) return;

        function closeMenu() {
          menu.classList.remove('open');
          panel.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
        }

        trigger.addEventListener('click', (event) => {
          event.stopPropagation();
          const isOpen = !panel.hidden;
          document.querySelectorAll('[data-admin-menu]').forEach((otherMenu) => {
            otherMenu.classList.remove('open');
            const otherTrigger = otherMenu.querySelector('.mb-trigger');
            const otherPanel = otherMenu.querySelector('.mb-panel');
            if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            if (otherPanel) otherPanel.hidden = true;
          });
          if (isOpen) return;
          menu.classList.add('open');
          panel.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
        });

        panel.addEventListener('click', (event) => {
          event.stopPropagation();
          if (event.target.closest('.mb-item')) closeMenu();
        });

        document.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeMenu();
        });
      });
    }());
  </script>
