<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">The Game Bureau Gift Shop hero art</title>
  <desc id="desc">A warmly lit shelf scene of city books and sports memorabilia, including hats, pennants, scarves, pins, and mugs.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2130"/>
      <stop offset="55%" stop-color="#2b3245"/>
      <stop offset="100%" stop-color="#46331e"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d7a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f3d7a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6840"/>
      <stop offset="100%" stop-color="#6d4329"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8dee5"/>
      <stop offset="100%" stop-color="#7f8b99"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect width="1672" height="941" fill="url(#light)"/>
  <rect width="1672" height="941" filter="url(#grain)"/>

  <ellipse cx="1180" cy="180" rx="520" ry="180" fill="#ffcf86" opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="440" cy="230" rx="380" ry="140" fill="#ffd8a8" opacity="0.1" filter="url(#soft)"/>

  <!-- back wall line art -->
  <g opacity="0.2" stroke="#f2dcb9" stroke-width="2" fill="none">
    <path d="M90 164h340l45 52h210"/>
    <path d="M1310 104h210l62 70"/>
    <path d="M220 320h190l40 44h220"/>
    <path d="M1320 300h190"/>
  </g>

  <!-- shelves -->
  <rect x="80" y="290" width="1512" height="24" rx="6" fill="url(#wood)"/>
  <rect x="65" y="585" width="1542" height="28" rx="6" fill="url(#wood)"/>
  <rect x="52" y="863" width="1568" height="34" rx="6" fill="url(#wood)"/>

  <!-- top shelf: city books -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#efe6d8">
    <rect x="120" y="146" width="70" height="144" rx="4" fill="#436a85"/>
    <text x="155" y="274" text-anchor="middle" font-size="15" transform="rotate(-90 155 274)">NASHVILLE</text>

    <rect x="194" y="132" width="48" height="158" rx="4" fill="#8f5b37"/>
    <text x="218" y="274" text-anchor="middle" font-size="12" transform="rotate(-90 218 274)">NEW YORK ATLAS</text>

    <rect x="246" y="158" width="56" height="132" rx="4" fill="#6c4c7d"/>
    <text x="274" y="274" text-anchor="middle" font-size="12" transform="rotate(-90 274 274)">CHICAGO GUIDE</text>

    <rect x="306" y="142" width="42" height="148" rx="4" fill="#305a3a"/>
    <text x="327" y="275" text-anchor="middle" font-size="11" transform="rotate(-90 327 275)">DETROIT</text>

    <rect x="352" y="150" width="58" height="140" rx="4" fill="#9a3242"/>
    <text x="381" y="275" text-anchor="middle" font-size="11" transform="rotate(-90 381 275)">NEW ORLEANS</text>

    <rect x="418" y="162" width="48" height="128" rx="4" fill="#58687a"/>
    <text x="442" y="276" text-anchor="middle" font-size="10" transform="rotate(-90 442 276)">PITTSBURGH</text>

    <rect x="470" y="152" width="62" height="138" rx="4" fill="#8f7844"/>
    <text x="501" y="276" text-anchor="middle" font-size="11" transform="rotate(-90 501 276)">BUFFALO 100</text>
  </g>

  <!-- top shelf objects -->
  <g>
    <path d="M640 236c0-54 40-92 98-92s98 38 98 92v54H640z" fill="#2f3645"/>
    <path d="M656 228c0-43 30-72 82-72s82 29 82 72v12H656z" fill="#121722"/>
    <rect x="716" y="252" width="44" height="16" rx="8" fill="#d3a449"/>

    <polygon points="896,178 1096,242 896,306" fill="#8e1b27"/>
    <text x="948" y="247" font-family="Arial Black, Arial, sans-serif" font-size="28" fill="#fff">CITY FAN</text>

    <rect x="1128" y="184" width="230" height="68" rx="10" fill="#f0d9ac"/>
    <path d="M1138 198h210M1138 218h190M1138 238h160" stroke="#9f7d52" stroke-width="3"/>
    <text x="1148" y="177" font-family="Arial, sans-serif" font-size="14" fill="#f2e7cc">VISITOR GUIDE</text>
  </g>

  <!-- middle shelf: team gear and souvenirs -->
  <g>
    <rect x="140" y="470" width="170" height="110" rx="12" fill="#243044"/>
    <path d="M154 486h140M154 508h120M154 530h132" stroke="#d6e1f2" stroke-width="4" opacity="0.55"/>
    <text x="164" y="562" font-family="Arial Black, Arial, sans-serif" font-size="20" fill="#fff">TRAVEL NOTES</text>

    <path d="M402 505c0-50 36-84 90-84s90 34 90 84v75H402z" fill="#2a1f1d"/>
    <path d="M414 496c0-38 28-62 78-62s78 24 78 62v10H414z" fill="#ceab62"/>
    <circle cx="493" cy="541" r="13" fill="#4f2b1f"/>

    <rect x="636" y="458" width="320" height="122" rx="14" fill="#52285d"/>
    <path d="M636 520h320" stroke="#dcb6ea" stroke-width="8" stroke-dasharray="24 14"/>
    <text x="654" y="504" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#fff">GAME DAY SCARF</text>
    <text x="654" y="557" font-family="Arial, sans-serif" font-size="22" fill="#f0dcff">PURPLE + GOLD</text>

    <g transform="translate(1020 460)">
      <rect x="0" y="0" width="118" height="120" rx="14" fill="#e8ecef"/>
      <rect x="22" y="18" width="74" height="78" rx="8" fill="#beccd8"/>
      <text x="59" y="112" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" fill="#41576a">CITY MUG</text>
    </g>

    <g transform="translate(1194 446)">
      <rect x="0" y="0" width="126" height="134" rx="10" fill="#141b26"/>
      <circle cx="64" cy="53" r="30" fill="#d9b35e"/>
      <path d="M48 55l10 10 22-22" stroke="#1b2434" stroke-width="7" fill="none" stroke-linecap="round"/>
      <text x="63" y="116" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" fill="#f4e7cd">ENAMEL PIN</text>
    </g>

    <g transform="translate(1372 466)">
      <rect x="0" y="0" width="156" height="114" rx="12" fill="#d2b07b"/>
      <path d="M14 22h128M14 42h118M14 62h108" stroke="#896740" stroke-width="4"/>
      <text x="18" y="99" font-family="Arial Black, Arial, sans-serif" font-size="16" fill="#573f25">STADIUM TICKETS</text>
    </g>
  </g>

  <!-- bottom shelf: stacked books and map roll -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#f1e8d8">
    <rect x="120" y="682" width="86" height="180" rx="4" fill="#5b6f8e"/>
    <text x="163" y="846" text-anchor="middle" font-size="13" transform="rotate(-90 163 846)">VIRGINIA + DC</text>

    <rect x="212" y="706" width="66" height="156" rx="4" fill="#7d5d3f"/>
    <text x="245" y="846" text-anchor="middle" font-size="12" transform="rotate(-90 245 846)">BALTIMORE</text>

    <rect x="282" y="724" width="74" height="138" rx="4" fill="#3f5c42"/>
    <text x="319" y="846" text-anchor="middle" font-size="11" transform="rotate(-90 319 846)">CINCINNATI</text>

    <rect x="360" y="696" width="58" height="166" rx="4" fill="#8f3f47"/>
    <text x="389" y="845" text-anchor="middle" font-size="10" transform="rotate(-90 389 845)">LOST CITY</text>
  </g>

  <g>
    <rect x="520" y="730" width="310" height="120" rx="18" fill="#ece0c4"/>
    <path d="M540 750h270M540 774h252M540 798h228" stroke="#9c7d52" stroke-width="4"/>
    <text x="540" y="718" font-family="Arial, sans-serif" font-size="17" fill="#f3e4c4">FOLDED CITY MAPS</text>

    <g transform="translate(892 700)">
      <rect x="0" y="0" width="300" height="162" rx="16" fill="#17314a"/>
      <rect x="16" y="18" width="268" height="126" rx="12" fill="#254b6f"/>
      <text x="28" y="62" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#f6f8fb">CHAMPIONS</text>
      <text x="28" y="98" font-family="Arial, sans-serif" font-size="22" fill="#d8e6f6">CITY EDITION CAP</text>
      <text x="28" y="128" font-family="Arial, sans-serif" font-size="18" fill="#a9c7e4">LIMITED DROP</text>
    </g>

    <g transform="translate(1242 710)">
      <path d="M0 38h180v114H0z" fill="#0f1621"/>
      <path d="M20 38l32 114M52 38l32 114M84 38l32 114M116 38l32 114" stroke="#ece6d7" stroke-width="5"/>
      <text x="14" y="28" font-family="Arial Black, Arial, sans-serif" font-size="18" fill="#f6ead1">TEAM SCARVES</text>
    </g>
  </g>

  <!-- subtle foreground vignette -->
  <rect x="0" y="0" width="1672" height="941" fill="none" stroke="#0d1118" stroke-width="48" opacity="0.26"/>
</svg>
