<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>SOUNDTRACKS | THE GAME BUREAU</title>
  <meta name="description" content="City playlists from The Game Bureau: local music, team anthems, and songs that call the city by name.">
  <link rel="canonical" href="https://thegamebureau.com/sound/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Game Bureau">
  <meta property="og:url" content="https://thegamebureau.com/sound/">
  <meta property="og:title" content="The Game Bureau - Sound">
  <meta property="og:description" content="City playlists from The Game Bureau: local music, team anthems, and songs that call the city by name.">
  <meta property="og:image" content="https://thegamebureau.com/sound/sound_banner.png">
  <meta property="og:image:alt" content="The Game Bureau city playlist banner">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@thegamebureau">
  <meta name="twitter:creator" content="@thegamebureau">
  <meta name="twitter:title" content="The Game Bureau - Sound">
  <meta name="twitter:description" content="City playlists from The Game Bureau: local music, team anthems, and songs that call the city by name.">
  <meta name="twitter:image" content="https://thegamebureau.com/sound/sound_banner.png">
  <meta name="twitter:image:alt" content="The Game Bureau city playlist banner">

  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site-shell.css">
  <link rel="stylesheet" href="../assets/site-pages.css">
  <script src="../mc/js/admin-auth.js"></script>
  <script src="../assets/site-nav-login.js" defer></script>

  <style>
    body.home-page {
      --ctl-radius: 8px;
      overflow-x: hidden;
    }

    body.home-page .sound-page {
      display: grid;
      gap: 28px;
      min-width: 0;
    }

    body.home-page main.sound-page .hero {
      min-height: 0;
      padding: 26px 32px;
      background:
        linear-gradient(95deg,
          rgba(8, 11, 17, 0.94) 0%,
          rgba(8, 11, 17, 0.82) 34%,
          rgba(8, 11, 17, 0.52) 58%,
          rgba(8, 11, 17, 0.24) 80%,
          rgba(8, 11, 17, 0.10) 100%),
        url("/sound/sound_banner.png") center right / cover no-repeat;
    }

    body.home-page main.sound-page .hero-grid {
      min-height: 0;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    body.home-page main.sound-page .hero-headline {
      max-width: 760px;
      font-size: clamp(3rem, 8vw, 5.8rem);
      letter-spacing: 0;
      line-height: 0.92;
    }

    body.home-page main.sound-page .hero-sub {
      max-width: 650px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    body.home-page main.sound-page .hero-copy {
      max-width: min(690px, 100%);
      margin-top: 10px;
      font-size: 0.96rem;
    }

    body.home-page .sound-hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    body.home-page .sound-jump {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--ctl-radius);
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      color: var(--ink);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-decoration: none;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    body.home-page .sound-jump:hover,
    body.home-page .sound-jump:focus-visible {
      border-color: var(--accent);
      background: rgba(245, 180, 97, 0.12);
      color: var(--accent);
      outline: none;
      transform: translateY(-1px);
    }

    body.home-page .sound-grid-wrap {
      padding: 28px;
      overflow: hidden;
      min-width: 0;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0.01)),
        rgba(11, 16, 24, 0.86);
      box-shadow: var(--shadow-panel);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    body.home-page .sound-grid-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 18px;
      margin: 0 0 20px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line);
    }

    body.home-page .sound-grid-title {
      margin: 0 auto 0 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    body.home-page .sound-grid-count {
      flex: 0 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 4px;
      padding: 8px 18px;
      border: 1px solid var(--line-strong);
      border-radius: var(--ctl-radius);
      background: rgba(16, 21, 30, 0.78);
      box-shadow: var(--shadow-chip);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      line-height: 1;
      text-align: center;
    }

    body.home-page .sound-grid-count-num {
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    body.home-page .sound-grid-count-label {
      color: rgba(243, 238, 220, 0.62);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    body.home-page .playlist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    body.home-page .playlist-card {
      --city-accent: var(--accent);
      --city-secondary: var(--accent-deep);
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card-paper);
      color: var(--ink);
      box-shadow: var(--shadow-chip);
      scroll-margin-top: 20px;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    body.home-page .playlist-card:hover {
      border-color: color-mix(in srgb, var(--city-accent) 44%, transparent);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42);
      transform: translateY(-3px);
    }

    body.home-page .playlist-body {
      display: grid;
      gap: 12px;
      min-width: 0;
      padding: 14px;
    }

    body.home-page .playlist-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    body.home-page .playlist-kicker {
      margin: 0;
      color: color-mix(in srgb, var(--city-accent) 76%, #ffffff 24%);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    body.home-page .playlist-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 0.95;
      text-transform: uppercase;
    }

    body.home-page .spotify-panel {
      display: grid;
      min-width: 0;
    }

    body.home-page .spotify-embed {
      width: 100%;
      height: 1100px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #121212;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.34);
    }

    body.home-page .spotify-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    body.home-page .spotify-empty {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 10px;
      min-height: 1100px;
      padding: 22px;
      border: 1px dashed color-mix(in srgb, var(--city-accent) 45%, var(--line-strong));
      border-radius: 12px;
      background:
        radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--city-accent) 16%, transparent), transparent 36%),
        rgba(18, 18, 18, 0.88);
      text-align: center;
    }

    body.home-page .spotify-empty-title {
      margin: 0;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    body.home-page .spotify-empty-copy {
      max-width: 26rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      body.home-page main.sound-page .hero {
        padding: 24px 28px;
      }

      body.home-page .playlist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      body.home-page .sound-page {
        gap: 18px;
      }

      body.home-page main.sound-page .hero {
        padding: 20px;
        background:
          linear-gradient(95deg,
            rgba(8, 11, 17, 0.96) 0%,
            rgba(8, 11, 17, 0.88) 42%,
            rgba(8, 11, 17, 0.62) 72%,
            rgba(8, 11, 17, 0.44) 100%),
          url("/sound/sound_banner.png") center right / cover no-repeat;
      }

      body.home-page main.sound-page .hero-headline {
        max-width: 100%;
        font-size: clamp(2rem, 9.5vw, 2.55rem);
        line-height: 0.96;
      }

      body.home-page .sound-grid-wrap {
        padding: 14px;
        border-radius: 8px;
      }

      body.home-page .playlist-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      body.home-page .playlist-heading {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }

      body.home-page .spotify-embed {
        height: 1100px;
      }

      body.home-page .spotify-empty {
        min-height: 1100px;
      }
    }
  </style>
</head>
<body class="home-page" data-admin-page="sound">
  <div class="page-shell">
    <header class="site-nav" data-site-nav></header>
    <script src="../assets/site-nav.js"></script>

    <main class="sound-page">
      <section class="hero" aria-label="Sound overview">
        <div class="hero-grid">
          <div>
            <p class="hero-kicker">City Playlists</p>
            <h1 class="hero-headline">Soundtracks for the streets</h1>
            <p class="hero-sub">Local artists, stadium chants, fight-night cues, and songs that say the city out loud.</p>
            <div class="sound-hero-actions" aria-label="Jump to a city">
              <a class="sound-jump" href="#dallas">Dallas</a>
              <a class="sound-jump" href="#new-orleans">New Orleans</a>
              <a class="sound-jump" href="#pittsburgh">Pittsburgh</a>
            </div>
          </div>
        </div>
      </section>

      <section class="sound-grid-wrap" aria-label="City playlists">
        <header class="sound-grid-head">
          <h2 class="sound-grid-title">Playlists By City</h2>
          <span class="sound-grid-count">
            <span class="sound-grid-count-num">3</span>
            <span class="sound-grid-count-label">cities</span>
          </span>
        </header>

        <!-- Keep city cards alphabetized by city name. -->
        <div class="playlist-grid">
          <article class="playlist-card" id="dallas" style="--city-accent: #b7a05a; --city-secondary: #1f5d8f;">
            <div class="playlist-body">
              <div class="playlist-heading">
                <h2 class="playlist-title">Dallas</h2>
                <p class="playlist-kicker">Texas</p>
              </div>

              <div class="spotify-panel" aria-label="Dallas Spotify playlist">
                <div class="spotify-embed">
                  <iframe
                    title="Dallas: The Game Bureau Spotify playlist"
                    src="https://open.spotify.com/embed/playlist/2sH2k1p1RB9OZAFh9VLtrX?utm_source=generator&theme=0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
                </div>
              </div>
            </div>
          </article>

          <article class="playlist-card" id="new-orleans" style="--city-accent: #d8a13a; --city-secondary: #147b77;">
            <div class="playlist-body">
              <div class="playlist-heading">
                <h2 class="playlist-title">New Orleans</h2>
                <p class="playlist-kicker">Louisiana</p>
              </div>

              <div class="spotify-panel" aria-label="New Orleans Spotify playlist">
                <div class="spotify-embed">
                  <iframe
                    title="New Orleans: The Game Bureau Spotify playlist"
                    src="https://open.spotify.com/embed/playlist/1jeexdy2NOKvxdvFFCIRmY?utm_source=generator&theme=0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
                </div>
              </div>
            </div>
          </article>

          <article class="playlist-card" id="pittsburgh" style="--city-accent: #f5c542; --city-secondary: #2f5e8f;">
            <div class="playlist-body">
              <div class="playlist-heading">
                <h2 class="playlist-title">Pittsburgh</h2>
                <p class="playlist-kicker">Pennsylvania</p>
              </div>

              <div class="spotify-panel" aria-label="Pittsburgh Spotify playlist">
                <div class="spotify-embed">
                  <iframe
                    title="Pittsburgh: The Game Bureau Spotify playlist"
                    src="https://open.spotify.com/embed/playlist/0ws20uBk7rQQd91HAgc8Xk?utm_source=generator&theme=0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
                </div>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
    <script src="../assets/site-footer.js"></script>
  </div>

  <script src="../assets/admin-bridge.js"></script>
</body>
</html>
