        var leftSpool = svgEl('circle', { cx: '30', cy: '30', r: TOTAL_RADIUS }, 'tgb-cass-spool tgb-cass-spool--left');
        var rightSpool = svgEl('circle', { cx: '70', cy: '30', r: GEAR_RADIUS }, 'tgb-cass-spool tgb-cass-spool--right');
        win.appendChild(leftSpool);
        win.appendChild(rightSpool);
        // Album art shows through the window when available: a 12x12 SQUARE centered
        // in the 20-wide window (no distortion — art is square). Click opens a
        // full-size popup. Hidden until art loads (then the reels peek at the sides).
        var art = svgEl('image', {
          x: '44', y: '24', width: '12', height: '12',
          preserveAspectRatio: 'xMidYMid slice', 'clip-path': 'url(#tgbCassWindow)',
        }, 'tgb-cass-art');
        art.style.display = 'none';
        art.setAttribute('role', 'button');
        art.setAttribute('aria-label', 'Show album art');
        win.appendChild(art);
        svg.appendChild(win);
        art.addEventListener('click', function () { if (state.artUrl) openArtLightbox(); });

        // hub gears — a sprocket (circle + radial teeth) that rotates while
        // playing. Drawn centered on its own hub so a CSS rotate spins in place.
        for (var g = 0; g < 2; g++) {
          var gx = 30 + g * 40, gy = 30;
          var hub = svgEl('g', {}, 'tgb-cass-hub tgb-cass-hub--' + (g ? 'right' : 'left'));
          hub.appendChild(svgEl('circle', { cx: gx, cy: gy, r: '5' }, 'tgb-cass-gear'));
          for (var tooth = 0; tooth < 6; tooth++) {
            var ang = (Math.PI / 3) * tooth;
            hub.appendChild(svgEl('line', {
              x1: (gx + Math.cos(ang) * 2.1).toFixed(2), y1: (gy + Math.sin(ang) * 2.1).toFixed(2),
              x2: (gx + Math.cos(ang) * 4.7).toFixed(2), y2: (gy + Math.sin(ang) * 4.7).toFixed(2),
              'stroke-width': '1.1', 'stroke-linecap': 'round'
            }, 'tgb-cass-tooth'));
          }
          svg.appendChild(hub);
        }

        // play + pause buttons (on the tape)
        var play = svgEl('path', { d: 'M47 48 53 51 47 54 z', 'stroke-linejoin': 'round', 'aria-label': 'Play' }, 'tgb-cass-btn tgb-cass-play');
        play.setAttribute('role', 'button');
        play.setAttribute('tabindex', '0');
        svg.appendChild(play);
        var pause = svgEl('g', { 'pointer-events': 'bounding-box', 'aria-label': 'Pause' }, 'tgb-cass-btn tgb-cass-pause');
        pause.setAttribute('role', 'button');
        pause.style.display = 'none';
        for (var p = 0; p < 2; p++) pause.appendChild(svgEl('line', { x1: 47.5 + p * 5, y1: '47.5', x2: 47.5 + p * 5, y2: '54.5', 'stroke-width': '2.25', stroke: '#eee7d6' }));
        svg.appendChild(pause);

        // bottom holes
        for (var hn = 0; hn < 2; hn++) {
          svg.appendChild(svgEl('circle', { cx: 25 + hn * 50, cy: '54', r: '1.75' }, 'tgb-cass-hole'));
          svg.appendChild(svgEl('path', { d: 'M' + (35 + hn * 30) + ' 51 ' + (37 + hn * 26) + ' 51 ' + (37 + hn * 26) + ' 53 ' + (35 + hn * 30) + ' 53 z' }, 'tgb-cass-hole'));
        }

        // ruled label lines
        for (var ln = 0; ln < 2; ln++) svg.appendChild(svgEl('line', { x1: '12.5', y1: 12.5 + ln * 5, x2: '87.5', y2: 12.5 + ln * 5 }, 'tgb-cass-line'));

        // three handwritten metadata lines: artist / title / blurb
        var artist = svgEl('text', { x: '50', y: '12' }, 'tgb-cass-text tgb-cass-text--artist');
        var title = svgEl('text', { x: '50', y: '17.4' }, 'tgb-cass-text tgb-cass-text--title');
        var blurb = svgEl('text', { x: '50', y: '21.4' }, 'tgb-cass-text tgb-cass-text--blurb');
        svg.appendChild(artist);
        svg.appendChild(title);
        svg.appendChild(blurb);

        // Brand signature, centered in the cream band below the tape window.
        var brand = svgEl('text', { x: '50', y: '41.3' }, 'tgb-cass-text tgb-cass-text--brand');
        brand.textContent = 'The Game Bureau';
        svg.appendChild(brand);

        // Explicit-lyrics mark: the word "DIRTY" scrawled in red marker, placed
        // just after the title in renderModal. Hidden unless the song is flagged.
        var explicit = svgEl('g', { 'aria-label': 'Explicit lyrics' }, 'tgb-cass-explicit');
        explicit.style.display = 'none';
        var dirtyWord = svgEl('text', { x: '0', y: '0' }, 'tgb-cass-explicit-word');
        dirtyWord.textContent = 'DIRTY';
        explicit.appendChild(dirtyWord);
        svg.appendChild(explicit);

        // play/pause wiring
        play.addEventListener('click', togglePlayback);
        pause.addEventListener('click', togglePlayback);
        play.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePlayback(); } });

        cass = { svg: svg, leftSpool: leftSpool, rightSpool: rightSpool, play: play, pause: pause, artist: artist, title: title, blurb: blurb, explicit: explicit, art: art, stripes: stripeEls };
        return svg;
      }

      // Show/hide + position "DIRTY" just past the (centered) title, tilted like
      // a marker scrawl and clamped to stay on the label.
      function setExplicitBadge(isExplicit) {
        if (!cass || !cass.explicit) return;
        if (!isExplicit) { cass.explicit.style.display = 'none'; return; }
        cass.explicit.style.display = ''; // show first so the word can be measured
        var tw = 0, dw = 11;
        try { tw = cass.title.getComputedTextLength(); } catch (e) {}
        try { dw = cass.explicit.querySelector('text').getComputedTextLength(); } catch (e) {}
        var x = Math.min(88 - dw / 2, 50 + tw / 2 + 2 + dw / 2);
        cass.explicit.setAttribute('transform', 'translate(' + x.toFixed(2) + ', 17.2) rotate(-6)');
      }

      // Load the track's cover art (Spotify oembed thumbnail) and show it in the
      // cassette window. token guards against a late fetch for a since-changed song.
      function clearArt() {
        state.artUrl = '';
        if (cass && cass.art) {
          cass.art.style.display = 'none';
          cass.art.removeAttributeNS('http://www.w3.org/1999/xlink', 'href');
          cass.art.removeAttribute('href');
        }
      }
      function showArt(url) {
        state.artUrl = url;
        if (!cass || !cass.art) return;
        cass.art.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url);
        cass.art.setAttribute('href', url);
        cass.art.style.display = '';
      }
      function loadAlbumArt(song, token) {
        clearArt();
        var id = trackIdFromHref(song.href);
        if (!id) return;
        if (artCache[id]) { showArt(artCache[id]); return; }
        if (artCache[id] === null) return;
        fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(song.href))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            var src = data && data.thumbnail_url;
            artCache[id] = src || null;
            if (artRenderToken === token && src) showArt(src);
          })
          .catch(function () { artCache[id] = null; });
      }

      // Full-size album-art popup (its own layer above the cassette).
      var artLightbox = null;
      function openArtLightbox() {
        if (!state.artUrl) return;
        if (!artLightbox) {
          artLightbox = document.createElement('div');
          artLightbox.className = 'sx-artbox';
          artLightbox.innerHTML = '<button class="sx-artbox-close" type="button" aria-label="Close album art">X</button><img class="sx-artbox-img" alt="Album art">';
          document.body.appendChild(artLightbox);
          artLightbox.addEventListener('click', function (e) { if (e.target === artLightbox || e.target.classList.contains('sx-artbox-close')) closeArtLightbox(); });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && artLightbox && !artLightbox.hidden) closeArtLightbox(); });
        }
        artLightbox.querySelector('.sx-artbox-img').src = state.artUrl;
        artLightbox.hidden = false;
      }
      function closeArtLightbox() {
        if (artLightbox) artLightbox.hidden = true;
      }

      // Current city as shown on the open cassette (full "City, Region" label).
      function currentCityLabel() {
        return String((state.card && (state.card.getAttribute('data-location')
          || (state.card.querySelector('.playlist-title') || {}).textContent)) || state.pendingCity || '').trim();
      }
      // Just the city name (before the first comma), for the Suggest button copy.
      function currentCityName() {
        return currentCityLabel().split(',')[0].trim();
      }
      // "Suggest a song for the {City} Soundtrack" on the footer button.
      function updateSuggestLabel() {
        if (!modal) return;
        var btn = modal.querySelector('.sx-suggest');
        if (!btn) return;
        var name = currentCityName();
        btn.textContent = name ? ('Suggest a song for the ' + name + ' Soundtrack') : 'Suggest a song';
      }

      // Shrink an SVG <text> to fit maxWidth (label is ~80 units wide).
      function fitText(el, str, maxWidth) {
        el.removeAttribute('textLength');
        el.removeAttribute('lengthAdjust');
        el.textContent = str || '';
        if (!str) return;
        var len = 0;
        try { len = el.getComputedTextLength(); } catch (e) { return; }
        if (len > maxWidth) {
          el.setAttribute('lengthAdjust', 'spacingAndGlyphs');
          el.setAttribute('textLength', String(maxWidth));
        }
      }

      // Resize spools for the current progress (0..1): playing tape moves from
      // the left reel to the right, so left shrinks as right grows.
      function updateSpools(progress) {
        if (!cass) return;
        var p = Math.max(0, Math.min(1, progress || 0));
        var totalArea = Math.PI * TOTAL_RADIUS * TOTAL_RADIUS;
        var gearArea = Math.PI * GEAR_RADIUS * GEAR_RADIUS;
        var tapeArea = totalArea - gearArea;
        cass.leftSpool.setAttribute('r', Math.sqrt((gearArea + tapeArea * (1 - p)) / Math.PI));
        cass.rightSpool.setAttribute('r', Math.sqrt((gearArea + tapeArea * p) / Math.PI));
      }

      function togglePlayback() {
        var song = state.songs[state.index];
        if (!song) return;
        if (!spotifyUriFromHref(song.href)) { window.open(song.href, '_blank', 'noopener'); return; }
        state.playing = !state.playing;
        if (state.playing) {
          // If the controller hasn't attached yet, remember the intent so it
          // starts the moment it is ready (this click is the needed gesture).
          state.wantAutoplay = !playerController;
          playSpotifyPlayer();
        } else {
          state.wantAutoplay = false;
          pauseSpotifyPlayer();
        }
        updatePlaybackUi();
      }

      // Drag the tape left/right to seek within the current track.
      function seekByFraction(fraction) {
        if (!playerController || !state.duration) return;
        var target = Math.max(0, Math.min(state.duration, (state.position || 0) + state.duration * fraction));
        try { if (typeof playerController.seek === 'function') playerController.seek(target); } catch (e) {}
      }

      function songFromLink(link) {
        return {
          href: link.href,
          title: (link.querySelector('.song-title') || {}).textContent || 'Track',
          artist: (link.querySelector('.song-artist') || {}).textContent || 'Spotify',
          blurb: (link.querySelector('.song-blurb') || {}).textContent || '',
          explicit: link.getAttribute('data-explicit') === '1',
        };
      }

      function songsFor(card) {
        if (card && Array.isArray(card._tgbSongs)) return card._tgbSongs.slice();
        return Array.prototype.slice.call(card.querySelectorAll('.song-link')).map(songFromLink);
      }

      function firstPlayableIndex(songs) {
        for (var i = 0; i < songs.length; i += 1) {
          if (spotifyUriFromHref(songs[i].href)) return i;
        }
        return 0;
      }

      function trackIdFromHref(href) {
        var match = String(href || '').match(new RegExp('open\\.spotify\\.com/track/([A-Za-z0-9]+)'));
        return match ? match[1] : '';
      }

      function spotifyUriFromHref(href) {
        var id = trackIdFromHref(href);
        return id ? 'spotify:track:' + id : '';
      }

      function embedSrc(href) {
        var id = trackIdFromHref(href);
        return id ? 'https://open.spotify.com/embed/track/' + id + '?utm_source=generator&theme=0' : '';
      }

      function ensureSpotifyIframeApi(callback) {
        if (spotifyIframeApi) {
          callback(spotifyIframeApi);
          return;
        }
        spotifyIframeApiCallbacks.push(callback);
        if (spotifyIframeApiRequested) return;
        spotifyIframeApiRequested = true;
        var previousReady = window.onSpotifyIframeApiReady;
        window.onSpotifyIframeApiReady = function (IFrameAPI) {
          spotifyIframeApi = IFrameAPI;
          if (typeof previousReady === 'function') {
            try { previousReady(IFrameAPI); } catch (error) {}
          }
          spotifyIframeApiCallbacks.splice(0).forEach(function (fn) {
            try { fn(IFrameAPI); } catch (error) {}
          });
        };
        var script = document.createElement('script');
        script.src = 'https://open.spotify.com/embed/iframe-api/v1';
        script.async = true;
        script.dataset.spotifyIframeApi = 'true';
        document.body.appendChild(script);
      }

      function updatePlaybackUi() {
        if (!modal) return;
        var wrap = modal.querySelector('.tgb-cass');
        var panel = modal.querySelector('.sx-panel');
        var song = state.songs[state.index];
        var playable = song && spotifyUriFromHref(song.href);
        var isPlaying = !!(playable && state.playing);
        if (cass) {
          cass.play.style.display = isPlaying ? 'none' : 'inherit';
          cass.pause.style.display = isPlaying ? 'inherit' : 'none';
        }
        if (wrap) wrap.classList.toggle('is-playing', isPlaying);
        if (panel) panel.classList.toggle('is-playing', isPlaying);
      }

      // Stamp allow="autoplay" onto the Spotify-built iframe as soon as it lands
      // in the mount, so mobile Chrome lets a parent gesture start its audio.
      function forceAutoplayPermission(mount) {
        if (!mount || typeof MutationObserver !== 'function') return;
        var ALLOW = 'autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write';
        var stamp = function (ifr) {
          if (!ifr || ifr.getAttribute('allow') === ALLOW) return;
          try { ifr.setAttribute('allow', ALLOW); } catch (e) {}
          try { ifr.setAttribute('allowfullscreen', 'true'); } catch (e) {}
        };
        stamp(mount.querySelector('iframe'));
        var obs = new MutationObserver(function () { stamp(mount.querySelector('iframe')); });
        obs.observe(mount, { childList: true, subtree: true });
        window.setTimeout(function () { obs.disconnect(); }, 10000);
      }

      function playSpotifyPlayer() {
        if (!playerController) return;
        try {
          if (typeof playerController.play === 'function') playerController.play();
          else if (typeof playerController.resume === 'function') playerController.resume();
          else if (typeof playerController.togglePlay === 'function') playerController.togglePlay();
        } catch (error) {}
      }

      function pauseSpotifyPlayer() {
        if (!playerController || typeof playerController.pause !== 'function') return;
        try { playerController.pause(); } catch (error) {}
      }

      function setPlayerVolume(ratio) {
        if (!playerController) return;
        var value = Math.max(0, Math.min(1, Number(ratio) || 0));
        try {
          if (typeof playerController.setVolume === 'function') playerController.setVolume(value);
          else if (typeof playerController.setVolumePercent === 'function') playerController.setVolumePercent(value * 100);
          else if (typeof playerController.setPlaybackVolume === 'function') playerController.setPlaybackVolume(value);
        } catch (error) {}
      }

      // Brief visual nudge of the tape when stepping tracks.
      function pulseTransport(mode) {
        if (!modal) return;
        var mount = modal.querySelector('.tgb-cass-mount');
        if (!mount) return;
        var cls = mode === 'rewind' ? 'nudge-prev' : (mode === 'forward' ? 'nudge-next' : '');
        window.clearTimeout(transportPulseTimer);
        mount.classList.remove('nudge-prev', 'nudge-next');
        if (cls) mount.classList.add(cls);
        transportPulseTimer = window.setTimeout(function () {
          mount.classList.remove('nudge-prev', 'nudge-next');
        }, 240);
      }

      function attachPlayerEvents(controller) {
        if (!controller || typeof controller.addListener !== 'function') return;
        controller.addListener('playback_started', function () {
          state.playing = true;
          updatePlaybackUi();
          // Now that audio is actually playing, warm the next track so the first
          // Next tap promotes instantly.
          schedulePreloadNext();
        });
        controller.addListener('playback_update', function (event) {
          if (!event || !event.data) return;
          var d = event.data;
          if (typeof d.isPaused === 'boolean') state.playing = !d.isPaused;
          // Spotify reports position/duration in milliseconds.
          if (typeof d.duration === 'number' && d.duration > 0) {
            state.duration = d.duration / 1000;
            state.position = (Number(d.position) || 0) / 1000;
            updateSpools(state.position / state.duration);
            if (!d.isPaused) state.maxPos = Math.max(state.maxPos || 0, state.position);
            // Auto-advance: fire when the track reaches its end, or when the
            // controller pauses right at the end (a finished preview). Latched
            // so it runs once per track.
            var reachedEnd = state.position >= state.duration - 0.4;
            var pausedAtEnd = d.isPaused && (state.maxPos || 0) >= state.duration - 1;
            if (state.songs.length > 1 && !state.autoAdvanced && (reachedEnd || pausedAtEnd)) {
              state.autoAdvanced = true;
              autoAdvanceNext();
            }
          }
          updatePlaybackUi();
        });
      }

      function renderPlainSpotifyIframe(host, song) {
        host.textContent = '';
        var iframe = document.createElement('iframe');
        iframe.title = song.title + ' on Spotify';
        iframe.src = embedSrc(song.href);
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.loading = 'lazy';
        host.appendChild(iframe);
        // The controller failed, so the SVG buttons can't drive audio. Reveal the
        // real Spotify embed (with its own play button) so the song is still
        // playable, and mark the cassette so its dead play/pause is hidden.
        host.classList.add('is-visible');
        if (modal) {
          var stage = modal.querySelector('.tgb-cass-stage');
          if (stage) stage.classList.add('is-fallback');
        }
      }

      function renderPlayer(song) {
        var host = activePlayerHost || modal.querySelector('.sx-player-host');
        var spotifyUri = spotifyUriFromHref(song.href);
        window.clearTimeout(playerFallbackTimer);
        if (!spotifyUri) {
          if (playerController && typeof playerController.destroy === 'function') {
            try { playerController.destroy(); } catch (error) {}
          }
          playerController = null;
          playerHostElement = null;
          playerEntity = '';
          state.playing = false;
          host.textContent = '';
          var fallback = document.createElement('a');
          fallback.className = 'sx-player-fallback';
          fallback.href = song.href;
          fallback.target = '_blank';
          fallback.rel = 'noopener';
          fallback.textContent = 'Open track in Spotify';
          host.appendChild(fallback);
          updatePlaybackUi();
          return;
        }

        if (playerController && playerEntity !== song.href) {
          playerEntity = song.href;
          try {
            if (typeof playerController.loadEntity === 'function') playerController.loadEntity(song.href);
            else if (typeof playerController.loadUri === 'function') playerController.loadUri(spotifyUri);
          } catch (error) {}
          if (state.playing || state.wantAutoplay) window.setTimeout(playSpotifyPlayer, 250);
          state.wantAutoplay = false;
          updatePlaybackUi();
          return;
        }

        if (playerController && playerEntity === song.href) {
          updatePlaybackUi();
          return;
        }

        host.textContent = '';
        host.classList.remove('is-visible');
        var stageEl = modal.querySelector('.tgb-cass-stage');
        if (stageEl) stageEl.classList.remove('is-fallback');
        playerEntity = song.href;
        var mount = document.createElement('div');
        mount.className = 'sx-spotify-embed';
        host.appendChild(mount);
        // Mobile Chrome blocks a parent from playing a cross-origin iframe unless
        // that iframe carries allow="autoplay". The Spotify API builds the iframe
        // itself, so stamp the permission on it the moment it appears.
        forceAutoplayPermission(mount);
        playerHostElement = mount;
        playerFallbackTimer = window.setTimeout(function () {
          if (!playerController && host.contains(mount) && playerEntity === song.href) {
            renderPlainSpotifyIframe(host, song);
          }
        }, 8000);
        ensureSpotifyIframeApi(function (IFrameAPI) {
          if (!modal || !host.contains(mount) || playerEntity !== song.href) return;
          IFrameAPI.createController(mount, {
            url: song.href,
            width: '100%',
            height: 80
          }, function (controller) {
            window.clearTimeout(playerFallbackTimer);
            playerController = controller;
            attachPlayerEvents(controller);
            setPlayerVolume(state.volume / 100);
            if (state.playing || state.wantAutoplay) window.setTimeout(playSpotifyPlayer, 120);
            state.wantAutoplay = false;
            updatePlaybackUi();
          });
        });
        updatePlaybackUi();
      }

      // ── Next-track preloading (double buffer) ──────────────────────────────
      function preloadHost() {
        for (var i = 0; i < playerHosts.length; i++) {
          if (playerHosts[i] !== activePlayerHost) return playerHosts[i];
        }
        return null;
      }

      function clearPreload() {
        window.clearTimeout(preloadTimer);
        if (preloadController && typeof preloadController.destroy === 'function') {
          try { preloadController.destroy(); } catch (e) {}
        }
        preloadController = null;
        preloadEntity = '';
        var h = preloadHost();
        if (h) h.textContent = '';
      }

      // Fully tear down the active Spotify controller (removes its iframe) so no
      // audio can keep playing or buffering. Pausing alone isn't enough — a
      // hidden/display:none iframe can resume, so we destroy + empty the host.
      function destroyActivePlayer() {
        window.clearTimeout(playerFallbackTimer);
        try { pauseSpotifyPlayer(); } catch (e) {}
        if (playerController && typeof playerController.destroy === 'function') {
          try { playerController.destroy(); } catch (e) {}
        }
        playerController = null;
        playerHostElement = null;
        playerEntity = '';
        if (activePlayerHost) { activePlayerHost.textContent = ''; activePlayerHost.classList.remove('is-visible'); }
        if (playerHosts.length) activePlayerHost = playerHosts[0];
      }

      // Warm a song's cover art into the cache (no display) for instant paint.
      function prefetchArt(song) {
        if (!song) return;
        var id = trackIdFromHref(song.href);
        if (!id || artCache[id] !== undefined) return;
        fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(song.href))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { artCache[id] = (d && d.thumbnail_url) || null; })
          .catch(function () { artCache[id] = null; });
      }

      // Debounced so rapid skipping doesn't spin up a pile of controllers.
      function schedulePreloadNext() {
        window.clearTimeout(preloadTimer);
        preloadTimer = window.setTimeout(preloadNext, 650);
      }

      // Prefetch adjacent art always; spin up an idle controller for the NEXT
      // track (only while actively playing) so a Next tap promotes instantly.
      function preloadNext() {
        if (!modal || modal.hidden || !state.songs.length) return;
        var len = state.songs.length;
        var next = state.songs[(state.index + 1) % len];
        prefetchArt(next);
        prefetchArt(state.songs[(state.index - 1 + len) % len]);
        if (!state.playing || !next) return;
        var uri = spotifyUriFromHref(next.href);
        if (!uri || next.href === preloadEntity || next.href === playerEntity) return;
        clearPreload();
        var host = preloadHost();
        if (!host) return;
        host.textContent = '';
        var mount = document.createElement('div');
        mount.className = 'sx-spotify-embed';
        host.appendChild(mount);
        forceAutoplayPermission(mount);
        preloadEntity = next.href;
        ensureSpotifyIframeApi(function (IFrameAPI) {
          if (!host.contains(mount) || preloadEntity !== next.href) return;
          IFrameAPI.createController(mount, { url: next.href, width: '100%', height: 80 }, function (controller) {
            if (preloadEntity !== next.href) { try { controller.destroy(); } catch (e) {} return; }
            preloadController = controller;
            try { if (typeof controller.setVolume === 'function') controller.setVolume(0); } catch (e) {}
          });
        });
      }

      // Promote the preloaded controller to active (and play it) when the newly
      // selected track is the one we preloaded. Returns true when it swapped.
      function promotePreloaded(song) {
        if (!song || !preloadController || preloadEntity !== song.href) return false;
        if (playerController && typeof playerController.destroy === 'function') {
          try { playerController.destroy(); } catch (e) {}
        }
        if (activePlayerHost) { activePlayerHost.textContent = ''; activePlayerHost.classList.remove('is-visible'); }
        activePlayerHost = preloadHost();           // preload host becomes active
        playerController = preloadController;
        playerEntity = preloadEntity;
        playerHostElement = null;
        preloadController = null;
        preloadEntity = '';
        window.clearTimeout(playerFallbackTimer);
        attachPlayerEvents(playerController);
        setPlayerVolume(state.volume / 100);        // restore from the muted preload
        state.wantAutoplay = false;
        state.playing = true;
        // Play synchronously so it stays inside the Next-tap gesture — mobile
        // Chrome only starts audio when play() runs within the user activation.
        playSpotifyPlayer();
        return true;
      }

      function buildModal() {
        var node = document.createElement('div');
        node.className = 'sx-modal';
        node.hidden = true;
        node.innerHTML = '' +
          '<div class="sx-panel" role="dialog" aria-modal="true" aria-label="City cassette player">' +
            '<button class="sx-close" type="button" aria-label="Close cassette">X</button>' +
            '<div class="tgb-cass-stage">' +
              '<button class="tgb-cass-nav tgb-cass-prev" type="button" aria-label="Previous track">&#9664;&#9664;</button>' +
              '<div class="tgb-cass tgb-cass-mount"></div>' +
              '<button class="tgb-cass-nav tgb-cass-next" type="button" aria-label="Next track">&#9654;&#9654;</button>' +
              '<div class="sx-player-host" aria-hidden="true"></div>' +
              '<div class="sx-player-host sx-player-host--pre" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="sx-foot">' +
              '<button class="sx-suggest" type="button">Suggest a song for this city</button>' +
              '<a class="sx-open" target="_blank" rel="noopener">Open in Spotify</a>' +
            '</div>' +
          '</div>';
        document.body.appendChild(node);

        // Build + mount the SVG cassette.
        var mount = node.querySelector('.tgb-cass-mount');
        mount.appendChild(buildCassetteSvg());

        // Two hidden hosts for double-buffered playback (active + preload).
        playerHosts = Array.prototype.slice.call(node.querySelectorAll('.sx-player-host'));
        activePlayerHost = playerHosts[0];

        node.querySelector('.sx-close').addEventListener('click', closeModal);
        node.querySelector('.sx-suggest').addEventListener('click', function () {
          var city = (state.card && (state.card.getAttribute('data-location')
            || (state.card.querySelector('.playlist-title') || {}).textContent))
            || state.pendingCity || '';
          var subject = 'Song suggestion' + (city ? ' for ' + city : '');
          var body = 'Suggested song for ' + city + '\n\nSong title:\nArtist:\nWhy it fits the city:\n';
          window.location.href = 'mailto:soundtrack@thegamebureau.com?subject='
            + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        });
        node.addEventListener('click', function (event) { if (event.target === node) closeModal(); });

        var prevButton = node.querySelector('.tgb-cass-prev');
        var nextButton = node.querySelector('.tgb-cass-next');
        prevButton.addEventListener('click', function () { pulseTransport('rewind'); step(-1); });
        nextButton.addEventListener('click', function () { pulseTransport('forward'); step(1); });

        // Drag the tape to seek. Works for mouse + touch; a small horizontal
        // drag maps to a fraction of the track and calls the Spotify seek().
        var dragX = null;
        function dragStart(clientX) { dragX = clientX; mount.classList.add('is-seeking'); }
        function dragEnd(clientX) {
          if (dragX === null) return;
          var rect = mount.getBoundingClientRect();
          var frac = rect.width ? (clientX - dragX) / rect.width : 0;
          dragX = null;
          mount.classList.remove('is-seeking');
          if (Math.abs(frac) > 0.01) seekByFraction(frac);
        }
        // Skip drag-seek when starting on the play/pause buttons or the album art
        // (those have their own click actions).
        var noDrag = function (e) { return e.target.closest('.tgb-cass-btn, .tgb-cass-art'); };
        mount.addEventListener('mousedown', function (e) { if (noDrag(e)) return; dragStart(e.clientX); });
        window.addEventListener('mouseup', function (e) { dragEnd(e.clientX); });
        mount.addEventListener('touchstart', function (e) { if (noDrag(e)) return; dragStart(e.touches[0].clientX); }, { passive: true });
        mount.addEventListener('touchend', function (e) { dragEnd((e.changedTouches[0] || {}).clientX || dragX); });

        document.addEventListener('keydown', function (event) {
          if (node.hidden) return;
          if (event.key === 'Escape') closeModal();
          if (event.key === 'ArrowLeft') { pulseTransport('rewind'); step(-1); }
          if (event.key === 'ArrowRight') { pulseTransport('forward'); step(1); }
          if (event.key === ' ' && !/^(BUTTON|A|INPUT)$/.test((event.target.tagName || ''))) { event.preventDefault(); togglePlayback(); }
        });
        return node;
      }

      // Read a CSS custom prop off an element, trimmed.
      function readVar(el, name) {
        try { return (getComputedStyle(el).getPropertyValue(name) || '').trim(); } catch (e) { return ''; }
      }

      // Apply a city's accent to the cassette (body/center/gears). Falls back to
      // a default teal when the card defines no --city-accent.
      function applyCassetteAccent(card) {
        var mount = modal.querySelector('.tgb-cass-mount');
        if (!mount) return;
        var accent = (card && readVar(card, '--city-accent')) || '';
        if (!/^#?[0-9a-fA-F]{3,6}$/.test(accent)) accent = '#2a5a66';
        if (accent[0] !== '#') accent = '#' + accent;
        mount.style.setProperty('--tgb-accent', accent);
        mount.style.setProperty('--tgb-accent-dark', shade(accent, -0.34) || '#16323a');
      }

      // Convert a computed "rgb(...)"/"rgba(...)" color to hex; null if fully
      // transparent (so we can tell "no stripe" from a real color).
      function cssColorToHex(str) {
        var m = String(str || '').match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        var parts = m[1].split(',').map(function (s) { return parseFloat(s); });
        if (parts.length > 3 && !(parts[3] > 0)) return null;
        var hx = function (c) { return ('0' + Math.max(0, Math.min(255, Math.round(c || 0))).toString(16)).slice(-2); };
        return '#' + hx(parts[0]) + hx(parts[1]) + hx(parts[2]);
      }

      // Resolve a CSS custom property to a concrete hex color via a probe (so
      // var() chains like --label-stripe: var(--case-stripe) get resolved).
      function resolveVarColor(card, name) {
        if (!card) return null;
        var probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(' + name + ',transparent);';
        card.appendChild(probe);
        var c = getComputedStyle(probe).color;
        card.removeChild(probe);
        return cssColorToHex(c);
      }

      // Colour the five stripes as a light→dark gradient centered on the case's
      // stripe colour (--label-stripe). Falls back to --case-stripe / accent.
      function applyStripes(card) {
        if (!cass || !cass.stripes) return;
        var base = resolveVarColor(card, '--label-stripe')
          || resolveVarColor(card, '--case-stripe')
          || resolveVarColor(card, '--city-accent')
          || '#f5b461';
        var ramp = [0.42, 0.2, 0, -0.2, -0.42]; // middle stripe (index 2) = base
        for (var i = 0; i < cass.stripes.length; i++) {
          cass.stripes[i].setAttribute('fill', shade(base, ramp[i]) || base);
        }
        // The whole shell is now driven by the stripe colour: the play-head
        // (bottom trapezoid) is the stripe itself, the rest of the body is a
        // darker shade of it.
        var mount = modal.querySelector('.tgb-cass-mount');
        if (mount) {
          mount.style.setProperty('--tgb-stripe', base);
          mount.style.setProperty('--tgb-stripe-body', shade(base, -0.32) || base);
        }
      }

      function renderModal() {
        if (!modal || !state.songs.length) return;
        var song = state.songs[state.index];
        applyCassetteAccent(state.card);
        applyStripes(state.card);
        state.duration = 0;
        state.position = 0;
        state.maxPos = 0;
        state.autoAdvanced = false;
        updateSpools(0);
        renderPlayer(song);
        var artToken = ++artRenderToken;
        if (cass) {
          fitText(cass.artist, song.artist, 78);
          // Leave room for the "DIRTY" mark after the title when explicit.
          fitText(cass.title, song.title, song.explicit ? 56 : 80);
          fitText(cass.blurb, song.blurb || '', 82);
          setExplicitBadge(song.explicit);
          loadAlbumArt(song, artToken);
        }
        updateSuggestLabel();
        modal.querySelector('.sx-open').href = song.href;
        updatePlaybackUi();
        schedulePreloadNext();
      }

      function openCard(card) {
        modal = modal || buildModal();
        modal.querySelector('.sx-panel').classList.remove('sx-empty');
        state.pendingCity = '';
        state.card = card;
        state.songs = songsFor(card);
        state.index = firstPlayableIndex(state.songs);
        // Attempt autoplay, but let the ACTUAL Spotify events set state.playing —
        // browsers block autoplay-with-sound, so the tape shows "play" until the
        // controller confirms playback, keeping the first click a real Play.
        state.playing = false;
        state.wantAutoplay = true;
        cards.forEach(function (item) { item.classList.toggle('is-playing', item === card); });
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        renderModal();
        modal.querySelector('.sx-close').focus();
      }

      function closeModal() {
        if (!modal) return;
        modal.hidden = true;
        closeArtLightbox();
        clearPreload();          // destroy the preloaded (next-track) controller
        destroyActivePlayer();   // destroy the active controller so audio fully stops
        state.playing = false;
        state.wantAutoplay = false;
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        document.body.style.overflow = '';
        updatePlaybackUi();
      }

      // A track finished on its own → roll on to the next (looping the playlist),
      // keeping playback going and using the preloaded controller when ready.
      function autoAdvanceNext() {
        if (state.songs.length < 2) return;
        var newIndex = (state.index + 1) % state.songs.length;
        state.playing = true;
        promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        renderModal();
      }

      function step(delta) {
        if (!state.songs.length) return;
        var wasPlaying = state.playing;
        var newIndex = (state.index + delta + state.songs.length) % state.songs.length;
        // A forward skip while playing can promote the preloaded controller for
        // an instant transition (falls back to a normal load if not ready yet).
        if (delta > 0 && wasPlaying) promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        state.playing = wasPlaying;
        renderModal();
      }

      // Give each city name on its case spine a slight, consistent print tilt.
      // Seeded off the slug so it's stable across reloads.
      function slugSeed(str) {
        var h = 0;
        for (var i = 0; i < str.length; i += 1) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        return h;
      }
      // Keep the city name aligned on the spine and apply only a small tilt.
      function jitterTitle(card, title) {
        if (!title) return;
        var seed = slugSeed(card.id || title.textContent || 'city');
        var tilt = ((seed % 200) / 100) - 1;          // -1deg..+1deg
        title.style.transform = 'rotate(' + tilt.toFixed(2) + 'deg)';
      }

      function buildSupabaseUrl(table, params) {
        var pairs = [];
        Object.keys(params || {}).forEach(function (key) {
          if (params[key] == null) return;
          pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
        });
        return SUPABASE_URL + '/rest/v1/' + table + (pairs.length ? '?' + pairs.join('&') : '');
      }

      function fetchJson(url, options) {
        return fetch(url, options || {}).then(function (response) {
          if (!response.ok) throw new Error('Request failed: ' + response.status + ' ' + url);
          return response.json();
        });
      }

      function slugify(value) {
        return String(value || '')
          .toLowerCase()
          .replace(/&/g, ' and ')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function citySlug(row) {
        return slugify(row && (row.slug || row.city_slug || row.city || row.city_name));
      }

      function cityLabel(row) {
        if (!row) return '';
        if (row.city) return String(row.city).trim();
        if (window.TgbGeo && typeof window.TgbGeo.composeGeo === 'function') {
          return window.TgbGeo.composeGeo(row) || row.city_name || '';
        }
        return row.city_name || '';
      }

      function cityShortLabel(row) {
        var stem = (row && row.city_name) || '';
        if (stem) return String(stem).trim();
        return cityLabel(row).split(',')[0].trim();
      }

      function songHref(song) {
        if (song && song.spotifyId) return 'https://open.spotify.com/track/' + encodeURIComponent(song.spotifyId);
        return 'https://open.spotify.com/search/' + encodeURIComponent(((song && song.artist) || '') + ' ' + ((song && song.title) || ''));
      }

      function normalizedSong(song) {
        return {
          href: songHref(song),
          title: (song && song.title) || 'Track',
          artist: (song && song.artist) || 'Spotify',
          blurb: (song && song.blurb) || '',
          explicit: !!(song && song.explicit)
        };
      }

      function appendText(parent, cls, value) {
        var span = document.createElement('span');
        span.className = cls;
        span.textContent = value || '';
        parent.appendChild(span);
        return span;
      }

      function createSongItem(song) {
        var item = document.createElement('li');
        var link = document.createElement('a');
        link.className = 'song-link';
        link.href = song.href;
        link.target = '_blank';
        link.rel = 'noopener';
        if (song.explicit) link.dataset.explicit = '1';
        var main = document.createElement('span');
        main.className = 'song-main';
        appendText(main, 'song-title', song.title);
        appendText(main, 'song-artist', song.artist);
        link.appendChild(main);
        appendText(link, 'song-blurb', song.blurb);
        appendText(link, 'song-play', 'Play');
        item.appendChild(link);
        return item;
      }

      function soundtrackTracks(soundtrack) {
        return ((soundtrack && Array.isArray(soundtrack.songs)) ? soundtrack.songs : [])
          .filter(function (song) {
            return song && (song.spotifyId || song.title || song.artist || song.href);
          });
      }

      function soundtrackTrackCount(soundtrack) {
        return soundtrackTracks(soundtrack).length;
      }

      function soundtrackSpineTitle(cityTitle, soundtrack) {
        var title = String(cityTitle || '').trim();
        var tag = String((soundtrack && soundtrack.spine_tag) || '').trim();
        if (!tag) return title;
        var position = String((soundtrack && soundtrack.spine_tag_position) || 'after').toLowerCase();
        return position === 'before' ? (tag + ' ' + title).trim() : (title + ' ' + tag).trim();
      }

      function createTapeCard(city, soundtrack) {
        var slug = citySlug(city);
        var label = cityLabel(city);
        var displayLabel = cityShortLabel(city) || label;
        var spineTitle = soundtrackSpineTitle(displayLabel, soundtrack);
        var article = document.createElement('article');
        article.className = 'playlist-card';
        article.id = slug;
        article.dataset.citySlug = slug;
        article.dataset.location = label;
        article._tgbSongs = soundtrackTracks(soundtrack).map(normalizedSong);

        var body = document.createElement('div');
        body.className = 'playlist-body';
        var heading = document.createElement('div');
        heading.className = 'playlist-heading';
        var title = document.createElement('h2');
        title.className = 'playlist-title';
        title.textContent = spineTitle;
        heading.appendChild(title);
        var list = document.createElement('ol');
        list.className = 'song-list';
        article._tgbSongs.forEach(function (song) { list.appendChild(createSongItem(song)); });
        body.append(heading, list);
        article.appendChild(body);
        return article;
      }

      function wireCard(card) {
        var title = card.querySelector('.playlist-title');
        var label = title ? title.textContent.trim() : 'city';
        jitterTitle(card, title);
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', 'Play ' + label + ' tape');
        card.addEventListener('click', function () { openCard(card); });
        card.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCard(card);
          }
        });
      }

      function indexCards() {
        cardByCity = {};
        cards.forEach(function (card) {
          var title = card.querySelector('.playlist-title');
          var byTitle = normCityKey(title ? title.textContent : '');
          var byLocation = normCityKey(card.getAttribute('data-location') || '');
          var bySlug = String(card.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          if (byTitle && !cardByCity[byTitle]) cardByCity[byTitle] = card;
          if (byLocation && !cardByCity[byLocation]) cardByCity[byLocation] = card;
          if (bySlug && !cardByCity[bySlug]) cardByCity[bySlug] = card;
        });
      }

      function renderSoundGrid(cities) {
        if (!grid) return;
        var withTapes = cities
          .map(function (city) {
            var slug = citySlug(city);
            return { city: city, soundtrack: soundtracksBySlug[slug] || null };
          })
          .filter(function (entry) { return soundtrackTrackCount(entry.soundtrack) > 0; });

        grid.innerHTML = '';
        if (!withTapes.length) {
          var empty = document.createElement('p');
          empty.className = 'sound-grid-status';
          empty.textContent = 'No city tapes are available yet.';
          grid.appendChild(empty);
          cards = [];
          indexCards();
          return;
        }
        withTapes.forEach(function (entry) { grid.appendChild(createTapeCard(entry.city, entry.soundtrack)); });
        cards = Array.prototype.slice.call(grid.querySelectorAll('.playlist-card'));
        cards.forEach(wireCard);
        indexCards();
      }

      // ── LISTEN BY CITY: open a city's cassette from the search or rail ──────
      // Normalize a city string to a comparison key: name portion (before the
      // first comma), lowercased, non-alphanumerics stripped. Robust to
      // "City, Region", "Washington, D.C.", "London, England, United Kingdom".
      function normCityKey(str) {
        return String(str || '').split(',')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
      }
      function cardForCity(cityStr) {
        return cardByCity[normCityKey(cityStr)] || null;
      }

      // Open the cassette in a "no soundtrack yet" state: city on the label, a
      // clear message where the now-playing info goes, transport dimmed, and
      // the Suggest-a-song button (pre-filled for this city) made prominent.
      function openNoSoundtrack(cityLabel) {
        modal = modal || buildModal();
        var panel = modal.querySelector('.sx-panel');
        state.card = null;
        state.songs = [];
        state.index = 0;
        state.playing = false;
        state.pendingCity = cityLabel || '';
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        panel.classList.add('sx-empty');
        // Tear down any live Spotify controller left over from a prior open.
        clearPreload();
        destroyActivePlayer();
        var wrap = modal.querySelector('.tgb-cass');
        if (wrap) wrap.classList.remove('is-playing');
        applyCassetteAccent(null);
        applyStripes(null);
        state.duration = 0;
        state.position = 0;
        updateSpools(0);
        if (cass) {
          fitText(cass.artist, cityLabel || '', 78);
          fitText(cass.title, 'No soundtrack yet', 80);
          fitText(cass.blurb, 'Be the first — suggest a song', 82);
          setExplicitBadge(false);
          clearArt();
        }
        updateSuggestLabel();
        var host = modal.querySelector('.sx-player-host');
        host.textContent = '';
        modal.querySelector('.sx-open').removeAttribute('href');
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        updatePlaybackUi();
        modal.querySelector('.sx-close').focus();
      }

      // Entry point for the search + rail: jump straight to the cassette.
      function openCityByName(cityStr, displayLabel) {
        var card = cardForCity(cityStr);
        if (card) openCard(card);
        else openNoSoundtrack(displayLabel || cityStr);
      }

      // ── Geo badge helpers (ported from the shop's Shop By City) ────────────
      function cityGeoBadge(label) {
        if (window.TgbGeo && typeof window.TgbGeo.geoBadge === 'function') {
          return window.TgbGeo.geoBadge(label);
        }
        return null;
      }
      function svgPathCenter(pathData, fallbackX, fallbackY) {
        var numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
        if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < numbers.length - 1; i += 2) {
          var x = Number(numbers[i]);
          var y = Number(numbers[i + 1]);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          minX = Math.min(minX, x); minY = Math.min(minY, y);
          maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
        }
        if (![minX, minY, maxX, maxY].every(Number.isFinite)) return { x: fallbackX, y: fallbackY };
        return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
      }
      function buildGeoBadge(badge) {
        var cls = function (s) { return 'hero-meta-list-geo' + (s ? ' ' + s : ''); };
        var shapes = window.US_STATE_SHAPES || null;
        if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
          var NS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
          svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
          svg.setAttribute('aria-hidden', 'true');
          svg.setAttribute('focusable', 'false');
          var path = document.createElementNS(NS, 'path');
          path.setAttribute('d', shapes[badge.value]);
          svg.appendChild(path);
          var pt = svgPathCenter(shapes[badge.value], (shapes._w || 40) / 2, (shapes._h || 24) / 2);
          var text = document.createElementNS(NS, 'text');
          text.setAttribute('x', String(pt.x));
          text.setAttribute('y', String(pt.y));
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('dominant-baseline', 'middle');
          text.setAttribute('alignment-baseline', 'middle');
          text.setAttribute('dy', '0.04em');
          text.textContent = badge.value;
          svg.appendChild(text);
          return svg;
        }
        var span = document.createElement('span');
        if (badge) {
          span.className = cls('hero-meta-list-geo--' + badge.kind);
          if (badge.kind === 'country') {
            var lbl = document.createElement('span');
            lbl.className = 'hero-meta-list-geo-label';
            lbl.textContent = badge.value;
            span.appendChild(lbl);
          } else {
            span.textContent = badge.value;
          }
          span.setAttribute('aria-hidden', 'true');
        } else {
          span.className = cls('');
        }
        return span;
      }

      // ── City panel: fetch all cities, build the rail + spyglass search ─────
      // Venue-only cities (cities.ignored) are not listening cities. select=*
      // so this keeps working before 2026072205_cities_ignored.sql is applied;
      // the filter treats a missing column as "not ignored".
      function fetchCities() {
        return fetchJson(buildSupabaseUrl('cities', {
          select: '*',
          order: 'city.asc'
        }), {
          headers: SB_HEADERS,
          cache: 'no-store'
        }).then(function (rows) {
          return (Array.isArray(rows) ? rows : []).filter(function (row) {
            return row && row.ignored !== true;
          });
        });
      }

      function displayNameFromSlug(slug) {
        var special = {
          'rio-de-janeiro': 'Rio de Janeiro',
          'saint-denis': 'Saint-Denis',
          'st-louis': 'St. Louis',
          'washington-dc': 'Washington, D.C.'
        };
        if (special[slug]) return special[slug];
        return String(slug || '')
          .split('-')
          .filter(Boolean)
          .map(function (part) {
            return part.length <= 2 ? part.toUpperCase() : part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');
      }

      function fallbackCityRowsFromSoundtracks(soundtracks) {
        return (soundtracks || [])
          .filter(function (tracklist) { return tracklist && tracklist.city_slug && soundtrackTrackCount(tracklist) > 0; })
          .map(function (tracklist, index) {
            var label = displayNameFromSlug(tracklist.city_slug);
            return {
              slug: tracklist.city_slug,
              city: label,
              label: label,
              city_name: label,
              sort_order: index + 1
            };
          });
      }

      function indexSoundtracks(data) {
        var soundtracks = Array.isArray(data && data.soundtracks) ? data.soundtracks : [];
        soundtracksBySlug = {};
        soundtracks.forEach(function (tracklist) {
          var slug = slugify(tracklist && tracklist.city_slug);
          if (slug) soundtracksBySlug[slug] = tracklist;
        });
        return soundtracks;
      }

      function setCityEntries(rows) {
        var seen = {};
        var rowsWithSoundtracks = (Array.isArray(rows) ? rows : [])
          .filter(function (row) {
            var slug = citySlug(row);
            if (!slug || seen[slug] || soundtrackTrackCount(soundtracksBySlug[slug]) <= 0) return false;
            seen[slug] = true;
            return true;
          });
        Object.keys(soundtracksBySlug).forEach(function (slug) {
          var tracklist = soundtracksBySlug[slug];
          if (!slug || seen[slug] || soundtrackTrackCount(tracklist) <= 0) return;
          var label = displayNameFromSlug((tracklist && tracklist.city_slug) || slug);
          seen[slug] = true;
          rowsWithSoundtracks.push({
            slug: slug,
            city: label,
            label: label,
            city_name: label
          });
        });
        cityEntries = rowsWithSoundtracks
          // Alphabetical by city name (full "City, Region" as the tiebreak).
          .sort(function (a, b) {
            return cityShortLabel(a).localeCompare(cityShortLabel(b), undefined, { sensitivity: 'base', numeric: true })
              || cityLabel(a).localeCompare(cityLabel(b), undefined, { sensitivity: 'base' });
          });
        renderSoundGrid(cityEntries);
        setupListenCityPanel();
      }

      function loadSoundPageData() {
        fetchJson('soundtracks.json', { cache: 'no-store' })
          .then(function (data) {
            var soundtracks = indexSoundtracks(data || {});
            return fetchCities()
              .catch(function (error) {
                console.warn('City catalog unavailable; rendering soundtrack slug fallback.', error);
                return fallbackCityRowsFromSoundtracks(soundtracks);
              })
              .then(function (rows) {
                var cityRows = Array.isArray(rows) && rows.length ? rows : fallbackCityRowsFromSoundtracks(soundtracks);
                setCityEntries(cityRows);
              });
          })
          .catch(function (error) {
            console.error(error);
            if (statusEl) statusEl.textContent = 'Could not load soundtracks.';
          });
      }

      function setupListenCityPanel() {
        var panel = document.getElementById('listenCityPanel');
        var listEl = document.getElementById('lcList');
        if (!panel || !listEl) return;

        var searchEntries = [];

        function chipCount(entry) {
          return entry.hasTape ? (entry.count + ' song' + (entry.count === 1 ? '' : 's')) : 'Add one';
        }

        function createChip(entry) {
          var item = document.createElement('a');
          item.className = 'hero-meta-list-item' + (entry.hasTape ? '' : ' lc-chip--empty');
          item.href = '#';
          item.setAttribute('role', 'button');
          item.dataset.city = entry.city;
          var badge = cityGeoBadge(entry.row || entry.city || entry.label);
          if (badge) item.appendChild(buildGeoBadge(badge));
          else item.classList.add('lc-chip--no-geo');
          var copy = document.createElement('span');
          copy.className = 'hero-meta-list-copy';
          var name = document.createElement('span');
          name.className = 'hero-meta-list-name';
          name.textContent = entry.label;
          copy.appendChild(name);
          var count = document.createElement('span');
          count.className = 'hero-meta-list-count';
          count.textContent = chipCount(entry);
          item.append(copy, count);
          item.addEventListener('click', function (e) {
            e.preventDefault();
            openCityByName(entry.city, entry.city);
          });
          return item;
        }

        // ── Rail: infinite horizontal scroll + click-drag ──
        var PX_PER_SEC = 22;
        var raf = null, lastTs = 0, pos = 0;
        var dragActive = false, pauseUntil = 0, inited = false;
        var reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        function loopWidth() {
          var chunk = listEl.querySelector('.lc-chunk');
          var track = listEl.querySelector('.lc-track');
          if (!chunk || !track) return 0;
          var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
          return Math.max(0, Math.round(chunk.getBoundingClientRect().width + gap));
        }
        function setScroll(next, loopW) {
          var v = Number.isFinite(next) ? next : 0;
          if (loopW > 0 && loopW > listEl.clientWidth) {
            while (v >= 2 * loopW) v -= loopW;
            while (v < loopW) v += loopW;
          } else {
            var max = Math.max(0, listEl.scrollWidth - listEl.clientWidth);
            if (v < 0) v = 0;
            if (v > max) v = max;
          }
          pos = v;
          listEl.scrollLeft = v;
        }
        function shouldPause(ts) {
          if (dragActive) return true;
          if (listEl.contains(document.activeElement)) return true;
          return ts < pauseUntil;
        }
        function startAutoScroll() {
          if (raf || reducedMotion) return;
          lastTs = 0;
          var tick = function (ts) {
            if (!lastTs) lastTs = ts;
            var dt = Math.min(40, ts - lastTs);
            lastTs = ts;
            var loopW = loopWidth();
            if (!shouldPause(ts) && loopW > listEl.clientWidth) {
              setScroll(pos + PX_PER_SEC * (dt / 1000), loopW);
            }
            raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
        }
        function wrapScroll() {
          var loopW = loopWidth();
          if (loopW <= 0) { pos = listEl.scrollLeft; return; }
          setScroll(listEl.scrollLeft, loopW);
        }
        function initInteractions() {
          var dragStartX = 0, dragStartScroll = 0, suppressClick = false, downId = null;
          var THRESH = 4;
          listEl.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragActive = false;
            downId = e.pointerId;
            dragStartX = e.clientX;
            pos = listEl.scrollLeft;
            dragStartScroll = listEl.scrollLeft;
            pauseUntil = performance.now() + 600;
          });
          listEl.addEventListener('pointermove', function (e) {
            if (e.pointerId !== downId) return;
            var dx = e.clientX - dragStartX;
            if (!dragActive && Math.abs(dx) > THRESH) {
              dragActive = true;
              listEl.classList.add('is-dragging');
              try { listEl.setPointerCapture(e.pointerId); } catch (err) {}
            }
            if (dragActive) {
              listEl.scrollLeft = dragStartScroll - dx;
              wrapScroll();
              var consumed = (dragStartScroll - dx) - listEl.scrollLeft;
              if (consumed !== 0) dragStartScroll -= consumed;
              e.preventDefault();
            }
          });
          var endDrag = function (e) {
            if (e.pointerId === downId) downId = null;
            if (listEl.hasPointerCapture && listEl.hasPointerCapture(e.pointerId)) {
              try { listEl.releasePointerCapture(e.pointerId); } catch (err) {}
            }
            if (dragActive) {
              suppressClick = true;
              setTimeout(function () { suppressClick = false; }, 0);
            }
            dragActive = false;
            listEl.classList.remove('is-dragging');
            pauseUntil = performance.now() + 350;
          };
          listEl.addEventListener('pointerup', endDrag);
          listEl.addEventListener('pointercancel', endDrag);
          listEl.addEventListener('click', function (e) {
            if (suppressClick) { e.preventDefault(); e.stopPropagation(); }
          }, true);
          listEl.addEventListener('wheel', function () { pauseUntil = performance.now() + 800; }, { passive: true });
          listEl.addEventListener('scroll', wrapScroll, { passive: true });
        }

        function renderRail(entries) {
          listEl.innerHTML = '';
          var track = document.createElement('div');
          track.className = 'lc-track';
          var makeChunk = function (hidden) {
            var chunk = document.createElement('div');
            chunk.className = 'lc-chunk';
            if (hidden) chunk.setAttribute('aria-hidden', 'true');
            entries.forEach(function (entry) { chunk.appendChild(createChip(entry)); });
            return chunk;
          };
          track.append(makeChunk(true), makeChunk(false), makeChunk(true));
          listEl.appendChild(track);
          var loopW = loopWidth();
          pos = loopW;
          listEl.scrollLeft = loopW;
          if (!inited) { initInteractions(); inited = true; }
          startAutoScroll();
        }

        // ── Spyglass search: expands into a field with a live dropdown ──
        function setupSearch() {
          var wrap = document.getElementById('lcSearch');
          var input = document.getElementById('lcSearchInput');
          var toggle = document.getElementById('lcSearchToggle');
          var results = document.getElementById('lcSearchResults');
          if (!wrap || !input || !toggle || !results) return;
          document.body.appendChild(results);
          var matches = [];
          var activeIndex = -1;
          var norm = function (s) { return String(s || '').toLowerCase().trim(); };

          function positionResults() {
            if (results.hidden) return;
            var r = input.getBoundingClientRect();
            results.style.top = (r.bottom + 8) + 'px';
            results.style.right = (window.innerWidth - r.right) + 'px';
            results.style.left = 'auto';
          }
          window.addEventListener('scroll', positionResults, true);
          window.addEventListener('resize', positionResults);

          function openSearch() {
            wrap.classList.add('is-open');
            toggle.setAttribute('aria-expanded', 'true');
            input.setAttribute('aria-expanded', 'true');
            input.tabIndex = 0;
            input.focus();
          }
          function hideResults() {
            results.hidden = true;
            results.innerHTML = '';
            matches = [];
            activeIndex = -1;
            panel.classList.remove('is-searching');
          }
          function closeSearch() {
            wrap.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            input.setAttribute('aria-expanded', 'false');
            input.tabIndex = -1;
            input.value = '';
            hideResults();
          }
          function go(entry) {
            if (!entry) return;
            closeSearch();
            openCityByName(entry.city, entry.city);
          }
          function setActive(i) {
            activeIndex = i;
            Array.prototype.forEach.call(results.querySelectorAll('.lc-search-result'), function (el, idx) {
              var on = idx === i;
              el.classList.toggle('is-active', on);
              el.setAttribute('aria-selected', on ? 'true' : 'false');
              if (on) el.scrollIntoView({ block: 'nearest' });
            });
          }
          function render() {
            var q = norm(input.value);
            if (!q) { hideResults(); return; }
            matches = searchEntries.filter(function (e) {
              return norm(e.label).indexOf(q) !== -1 || norm(e.city).indexOf(q) !== -1;
            }).slice(0, 8);
            activeIndex = matches.length ? 0 : -1;
            results.innerHTML = '';
            if (!matches.length) {
              var empty = document.createElement('div');
              empty.className = 'lc-search-empty';
              empty.textContent = 'No cities match “' + input.value.trim() + '”.';
              results.appendChild(empty);
            } else {
              matches.forEach(function (entry, i) {
                var a = document.createElement('button');
                a.type = 'button';
                a.className = 'lc-search-result' + (i === activeIndex ? ' is-active' : '');
                a.setAttribute('role', 'option');
                a.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');
                var name = document.createElement('span');
                name.className = 'lc-search-result-name';
                name.textContent = entry.label;
                var count = document.createElement('span');
                count.className = 'lc-search-result-count';
                count.textContent = chipCount(entry);
                a.append(name, count);
                a.addEventListener('mouseenter', function () { setActive(i); });
                a.addEventListener('click', function () { go(entry); });
                results.appendChild(a);
              });
            }
            results.hidden = false;
            positionResults();
            panel.classList.add('is-searching');
          }

          toggle.addEventListener('click', function () {
            if (wrap.classList.contains('is-open')) closeSearch();
            else openSearch();
          });
          input.addEventListener('input', render);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { e.preventDefault(); closeSearch(); toggle.focus(); return; }
            if (!matches.length) { if (e.key === 'Enter') e.preventDefault(); return; }
            if (e.key === 'ArrowDown') { e.preventDefault(); setActive((activeIndex + 1) % matches.length); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((activeIndex - 1 + matches.length) % matches.length); }
            else if (e.key === 'Enter') { e.preventDefault(); go(matches[Math.max(0, activeIndex)]); }
          });
          document.addEventListener('click', function (e) {
            if (wrap.contains(e.target) || results.contains(e.target)) return;
            if (wrap.classList.contains('is-open')) closeSearch();
          });
        }

        function buildEntry(row) {
          var city = cityLabel(row);
          var label = cityShortLabel(row) || city;
          var card = cardForCity(city) || cardForCity(citySlug(row));
          var soundtrack = soundtracksBySlug[citySlug(row)] || null;
          return {
            city: city,
            label: label,
            row: row,
            hasTape: !!card,
            count: soundtrackTrackCount(soundtrack)
          };
        }

        setupSearch();
        var entries = cityEntries.map(buildEntry).filter(function (e) { return e.city; });
        if (!entries.length) return; // keep the reserved panel; no pop
        searchEntries = entries;
        renderRail(entries);
      }

      loadSoundPageData();
    })();
  </script>
</body>
</html>
