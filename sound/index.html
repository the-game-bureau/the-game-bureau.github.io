  <style>
    body.home-page {
      --ctl-radius: 8px;
      overflow-x: hidden;
    }

    body.home-page .sound-page {
      display: grid;
      gap: 28px;
      min-width: 0;
    }

    /* Hero background: "a pile of colorful cassette tapes" by Igor Omilaev on
       Unsplash (Unsplash License — free commercial use, no attribution required). */
    body.home-page main.sound-page .hero {
      min-height: 0;
      padding: 26px 32px;
      background:
        linear-gradient(95deg, rgba(8, 11, 17, 0.93) 0%, rgba(8, 11, 17, 0.82) 32%, rgba(8, 11, 17, 0.56) 56%, rgba(8, 11, 17, 0.34) 80%, rgba(8, 11, 17, 0.22) 100%),
        url("/sound/soundtrack_hero.jpg") center / cover no-repeat;
    }

    body.home-page main.sound-page .hero-grid {
      min-height: 0;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    body.home-page main.sound-page .hero-headline {
      max-width: 760px;
      font-size: 3.35rem;
      letter-spacing: 0;
      line-height: 0.96;
    }

    body.home-page main.sound-page .hero-sub {
      max-width: 650px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    /* Kicker inherits the shared base .hero-kicker (IBM Plex Mono), matching the
       Gift Shop hero. */

    body.home-page .sound-grid-wrap {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    /* Tablet step mirrors the Gift Shop hero so the two heroes shrink in lock-step. */
    @media (max-width: 980px) {
      body.home-page main.sound-page .hero {
        padding: 24px 28px;
      }
      body.home-page main.sound-page .hero-headline {
        font-size: 3rem;
      }
    }

    body.home-page .playlist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px 20px;
      align-items: start;
      width: min(1120px, 100%);
      margin-inline: auto;
      padding-inline: 4px;
    }

    body.home-page .playlist-card {
      --city-accent: #f5b461;
      --city-secondary: #4aa8cf;
      --case-shell: #151923;
      --case-spine: #10141d;
      --case-stripe: var(--city-accent);
      --case-stripe-right: var(--case-stripe);
      --label-bg: #fffdf7;
      --case-ink: #0b1322;
      --case-offset: 0px;
      --case-tilt: -0.4deg;
      position: relative;
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      aspect-ratio: 6.55 / 1;
      overflow: hidden;
      border: 1px solid rgba(3, 5, 12, 0.95);
      border-radius: 2px;
      background:
        linear-gradient(180deg, #252b38 0%, #151b26 42%, #0a0e16 100%),
        var(--case-shell);
      color: var(--case-ink);
      box-shadow:
        2px 3px 0 rgba(3, 5, 13, 0.95),
        0 8px 18px rgba(2, 4, 12, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      cursor: pointer;
      scroll-margin-top: 18px;
      transform: translateX(var(--case-offset)) rotate(var(--case-tilt));
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }

    body.home-page .playlist-card:nth-child(6n + 1) { --case-stripe: #ff9f43; }
    body.home-page .playlist-card:nth-child(6n + 2) { --case-offset: 2px; --case-tilt: 0.25deg; --case-stripe: #55c7ef; }
    body.home-page .playlist-card:nth-child(6n + 3) { --case-offset: -1px; --case-tilt: -0.65deg; --case-stripe: #cda7ff; }
    body.home-page .playlist-card:nth-child(6n + 4) { --case-offset: 3px; --case-tilt: 0.45deg; --case-stripe: #68f27d; }
    body.home-page .playlist-card:nth-child(6n + 5) { --case-offset: -2px; --case-tilt: -0.2deg; --case-stripe: #ff6f91; }
    body.home-page .playlist-card:nth-child(6n) { --case-offset: 1px; --case-tilt: 0.15deg; --case-stripe: #ffcc2e; }
    body.home-page .playlist-card:nth-child(4n + 1) { --label-bg: #fffdf7; }
    body.home-page .playlist-card:nth-child(4n + 2) { --label-bg: #fff6df; }
    body.home-page .playlist-card:nth-child(4n + 3) { --label-bg: #ffffff; }
    body.home-page .playlist-card:nth-child(4n) { --label-bg: #f4f8fb; }
    body.home-page .playlist-card#minneapolis { --case-stripe: #8b5cf6; }

    body.home-page .playlist-card::before {
      display: none;
    }

    body.home-page .playlist-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 2px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0 1px, transparent 1px calc(100% - 1px), rgba(0, 0, 0, 0.28) calc(100% - 1px) 100%),
        linear-gradient(105deg, transparent 0 18%, rgba(255, 255, 255, 0.14) 18% 19%, transparent 19% 100%);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
    }

    body.home-page .playlist-card:hover,
    body.home-page .playlist-card:focus-visible,
    body.home-page .playlist-card.is-playing {
      border-color: var(--case-stripe);
      box-shadow:
        2px 3px 0 rgba(3, 5, 13, 0.95),
        0 0 0 1px var(--case-stripe),
        0 10px 20px rgba(2, 4, 12, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      outline: none;
      transform: translate(calc(var(--case-offset) - 1px), -1px) rotate(var(--case-tilt));
    }

    body.home-page .playlist-body {
      position: relative;
      z-index: 2;
      height: 100%;
      box-sizing: border-box;
      padding: 6px 7px;
    }

    body.home-page .playlist-body::before {
      display: none;
    }

    body.home-page .playlist-body::after {
      display: none;
    }

    body.home-page .playlist-heading {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      padding: 5px 22px;
      border: 1px solid #060816;
      border-radius: 1px;
      background:
        linear-gradient(90deg, var(--case-stripe) 0 8px, var(--label-bg) 8px calc(100% - 8px), var(--case-stripe-right) calc(100% - 8px) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    body.home-page .playlist-heading::before {
      content: "";
      position: absolute;
      inset: 1px 9px;
      z-index: 1;
      border-radius: 1px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.16) 32%, transparent 66%),
        linear-gradient(103deg, transparent 0 34%, rgba(255, 255, 255, 0.28) 34% 36%, transparent 36% 100%);
      opacity: 0.38;
      pointer-events: none;
    }

    body.home-page .playlist-heading::after {
      display: none;
    }

    body.home-page .playlist-title {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      max-width: none;
      margin: 0;
      color: var(--case-ink);
      font-family: "Reenie Beanie", cursive;
      font-size: 1.5rem;
      font-weight: 700;
      /* Reenie Beanie sits low with tall ascenders/descenders — a roomy
         line-height keeps the glyphs off the clip edges of the label. */
      line-height: 1.3;
      letter-spacing: 0;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.36);
      text-transform: none;
      transform: rotate(-0.5deg);
      transform-origin: center;
      justify-self: stretch;
      margin: 0 !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    body.home-page .playlist-card:nth-child(6n + 1) .playlist-title { color: #07101f; font-size: 1.56rem; }
    body.home-page .playlist-card:nth-child(6n + 2) .playlist-title { color: #0d3c49; font-size: 1.46rem; }
    body.home-page .playlist-card:nth-child(6n + 3) .playlist-title { color: #3d193f; font-size: 1.54rem; }
    body.home-page .playlist-card:nth-child(6n + 4) .playlist-title { color: #385114; font-size: 1.42rem; }
    body.home-page .playlist-card:nth-child(6n + 5) .playlist-title { color: #15345a; font-size: 1.58rem; }
    body.home-page .playlist-card:nth-child(6n) .playlist-title { color: #68233f; font-size: 1.5rem; }

    body.home-page .song-list { display: none !important; }

    body.home-page .sound-grid-status {
      grid-column: 1 / -1;
      min-height: 160px;
      margin: 0;
      display: grid;
      place-items: center;
      border: 2px solid #28344a;
      background: rgba(9, 14, 25, 0.78);
      color: rgba(243, 238, 220, 0.7);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      line-height: 1.5;
      text-align: center;
    }

    /* ── LISTEN BY CITY: spyglass search + auto-scrolling city rail ──────────
       Mirrors the shop's "Shop By City" component, tuned to the sound page's
       dark / pixel aesthetic. Picking a city (dropdown OR rail chip) opens the
       cassette popup for that city instead of navigating. */
    body.home-page .listen-city-panel {
      display: grid;
      gap: 4px;
      /* Match the hero's width: on body.home-page the hero is width:100% of the
         page-shell content box (site-shell.css). Fill the same track here. */
      width: 100%;
      margin-inline: auto;
      padding: 14px 16px 8px;
      border: 2px solid #28344a;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.86), rgba(8, 12, 22, 0.86));
    }
    body.home-page .listen-city-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 8px;
      border-bottom: 1px solid #28344a;
    }
    /* Matches the Gift Shop's "Shop By City" title. */
    body.home-page .listen-city-title {
      margin: 0;
      color: #f7f0dc;
      font-family: "Big Shoulders Display", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    /* Inconspicuous city search: a spyglass that expands into a field. */
    body.home-page .lc-search {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }
    body.home-page .lc-search-input {
      width: 0;
      min-width: 0;
      height: 34px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: rgba(8, 11, 17, 0);
      color: #f7f0dc;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: width 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.2s ease, padding 0.28s ease, border-color 0.2s ease, background 0.2s ease;
    }
    body.home-page .lc-search.is-open .lc-search-input {
      width: clamp(150px, 40vw, 240px);
      padding: 0 12px;
      opacity: 1;
      pointer-events: auto;
      border-color: #344154;
      background: rgba(8, 11, 17, 0.6);
    }
    body.home-page .lc-search-input::placeholder { color: rgba(247, 240, 220, 0.42); }
    body.home-page .lc-search.is-open .lc-search-input:focus {
      outline: none;
      border-color: #f5b461;
      box-shadow: 0 0 0 3px rgba(245, 180, 97, 0.28);
    }
    body.home-page .lc-search-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-left: 4px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: rgba(247, 240, 220, 0.6);
      cursor: pointer;
      transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    body.home-page .lc-search-toggle:hover,
    body.home-page .lc-search-toggle:focus-visible {
      color: #f7f0dc;
      background: rgba(255, 255, 255, 0.06);
      outline: none;
    }
    body.home-page .lc-search.is-open .lc-search-toggle { color: #f5b461; }
    body.home-page .lc-search-toggle svg { width: 17px; height: 17px; display: block; }
    /* Portaled to <body> and viewport-fixed (JS sets top/right) so it floats
       above the grid — the panel's backdrop would otherwise clip it. */
    body.home-page .lc-search-results {
      position: fixed;
      z-index: 3000;
      width: min(280px, 78vw);
      max-height: 264px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid #344154;
      border-radius: 10px;
      background: rgba(12, 16, 23, 0.98);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    body.home-page .lc-search-results[hidden] { display: none; }
    body.home-page .lc-search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: #f7f0dc;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    body.home-page .lc-search-result:hover,
    body.home-page .lc-search-result.is-active { background: rgba(245, 180, 97, 0.16); }
    body.home-page .lc-search-result-name { flex: 1 1 auto; font-weight: 600; font-size: 0.9rem; }
    body.home-page .lc-search-result-count {
      flex: 0 0 auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(247, 240, 220, 0.55);
    }
    body.home-page .lc-search-empty {
      padding: 10px 12px;
      color: rgba(247, 240, 220, 0.55);
      font-size: 0.82rem;
    }
    body.home-page .listen-city-panel.is-searching {
      overflow: visible;
      position: relative;
      z-index: 60;
    }

    /* Horizontal auto-scrolling city rail (no scrollbar, infinite loop via 3
       cloned chunks, click-drag to swipe). */
    body.home-page .lc-list {
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      padding: 8px 0 12px;
      /* Reserve the rail's height before the cities load so nothing pops in. */
      min-height: 58px;
      -ms-overflow-style: none;
      cursor: -webkit-grab; cursor: grab;
    }
    body.home-page .lc-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body.home-page .lc-list.is-dragging { cursor: -webkit-grabbing; cursor: grabbing; }
    body.home-page .lc-list.is-dragging .hero-meta-list-item { cursor: -webkit-grabbing; cursor: grabbing; }
    body.home-page .lc-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 8px;
    }
    body.home-page .lc-chunk {
      display: flex;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 8px;
    }
    /* Rail chips reuse the shared hero-meta-list-item look from site-shell.css
       (state / country geo badges), re-tinted for the dark cassette page. */
    body.home-page .lc-list .hero-meta-list-item {
      flex: 0 0 auto;
      width: auto;
      grid-template-columns: 44px auto auto;
      color: #f7f0dc;
      border-color: #28344a;
      border-radius: 6px;
      background: rgba(13, 20, 34, 0.6);
    }
    body.home-page .lc-list .hero-meta-list-item.lc-chip--no-geo {
      grid-template-columns: auto auto;
      padding-left: 18px;
    }
    body.home-page .lc-list .hero-meta-list-name {
      overflow: visible;
      text-overflow: clip;
    }
    body.home-page .lc-list .hero-meta-list-count { color: rgba(247, 240, 220, 0.5); }
    body.home-page .lc-list .hero-meta-list-item:hover {
      background: rgba(245, 180, 97, 0.12);
      border-color: #f5b461;
      color: #f7f0dc;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 2px #f5b461,
        0 12px 26px rgba(0, 0, 0, 0.45);
    }
    body.home-page .lc-list .hero-meta-list-item.lc-chip--empty .hero-meta-list-name { opacity: 0.72; }

    /* No-soundtrack cassette state: dim the tape + arrows, spotlight Suggest. */
    body.home-page .sx-panel.sx-empty .tgb-cass-mount { opacity: 0.5; }
    body.home-page .sx-panel.sx-empty .tgb-cass-nav { pointer-events: none; opacity: 0.3; }
    body.home-page .sx-player-empty {
      display: grid;
      place-items: center;
      min-height: 80px;
      padding: 8px 12px;
      color: rgba(247, 240, 220, 0.72);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.5rem;
      line-height: 1.6;
      text-align: center;
    }
    body.home-page .sx-panel.sx-empty .sx-suggest {
      border-color: #f5b461;
      background: #f5b461;
      color: #0b1322;
      font-size: 0.56rem;
    }
    body.home-page .sx-panel.sx-empty .sx-suggest:hover,
    body.home-page .sx-panel.sx-empty .sx-suggest:focus-visible {
      background: #ffcc7a;
      border-color: #ffcc7a;
      color: #0b1322;
    }

    .sx-modal[hidden] { display: none; }
    .sx-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 8, 14, 0.82);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .sx-panel {
      position: relative;
      display: grid;
      gap: 16px;
      width: min(760px, 100%);
      max-height: min(94dvh, 820px);
      padding: 18px 18px 16px;
      overflow: visible;
      border: 2px solid #28344a;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0, rgba(245, 180, 97, 0.10), transparent 34%),
        linear-gradient(180deg, #161a22 0, #0b1019 64%, #070b12 100%);
      box-shadow:
        8px 8px 0 #02040a,
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .sx-close {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 2px solid #344154;
      border-radius: 0;
      background: #101725;
      color: #f7f0dc;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* ── City cassette (inline SVG, built from scratch in JS) ───────────────
       The cassette is drawn as an SVG and themed per city via --tgb-accent /
       --tgb-accent-dark set on .tgb-cass by JS. Play/pause lives on the tape;
       prev/next are the round buttons flanking it; drag the tape to seek. */
    .tgb-cass-stage {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: min(600px, 100%);
      margin: 0 auto;
      min-height: 260px;
    }
    .tgb-cass-mount {
      position: relative;
      z-index: 1;
      min-width: 0;
      filter: drop-shadow(7px 9px 0 rgba(2, 4, 10, 0.9));
      transition: transform 0.18s ease;
    }
    .tgb-cass-mount svg {
      display: block;
      width: 100%;
      height: auto;
      cursor: -webkit-grab; cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }
    .tgb-cass-mount.is-seeking { transform: none; }
    .tgb-cass-mount.is-seeking svg { cursor: -webkit-grabbing; cursor: grabbing; }
