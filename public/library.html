<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05090a">
  <title>LIBRARY | THE GAME BUREAU</title>
  <link rel="icon" href="assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/public-theme.css">
  <script src="assets/public-account.js"></script>
  <script src="assets/games/helmets/helmet.js"></script>
  <style>
    .public-library .admin-btn { display: none; }

    .page-footer {
      margin-top: 2.5rem;
      padding: 1.5rem 0 1rem;
      display: flex;
      justify-content: center;
      border-top: 1px solid var(--line);
    }

    .public-library main {
      display: grid;
      gap: 1rem;
    }

    .public-library .metric-grid {
      grid-template-columns: 1fr;
    }


    .library-hero {
      margin-bottom: 0;
    }

    .library-hero-copy {
      display: grid;
      align-content: center;
      gap: 1.4rem;
    }

    .library-title {
      max-width: 11ch;
      text-wrap: balance;
    }

    .library-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .library-spotlight-shell {
      display: grid;
      align-content: start;
      gap: 0.9rem;
    }

    .library-spotlight-label {
      color: rgba(244, 240, 230, 0.68);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .library-spotlight-card {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      min-height: 100%;
    }

    .library-spotlight-card[data-empty="true"] {
      align-content: center;
      justify-items: start;
    }

    .library-spotlight-visual {
      position: relative;
      min-height: 230px;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.22), transparent 30%),
        linear-gradient(155deg, var(--spotlight-secondary, #667d76) 0%, var(--spotlight-primary, #15211d) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .library-spotlight-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(9, 14, 13, 0.03), rgba(9, 14, 13, 0.5)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: auto, 32px 32px;
      pointer-events: none;
    }

    .library-spotlight-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .library-spotlight-monogram {
      position: absolute;
      right: 1rem;
      bottom: 0.75rem;
      left: 1rem;
      z-index: 1;
      color: var(--spotlight-ink, #fffaf0);
      font-family: "Newsreader", serif;
      font-size: clamp(3rem, 7vw, 4.8rem);
      font-weight: 500;
      letter-spacing: -0.08em;
      line-height: 0.9;
    }

    .library-spotlight-body {
      display: grid;
      gap: 0.85rem;
    }

    .library-spotlight-topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    .library-spotlight-badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(244, 240, 230, 0.86);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .library-spotlight-name {
      margin: 0;
      color: #fffaf0;
      font-family: "Newsreader", serif;
      font-size: clamp(2rem, 4.2vw, 2.9rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.05em;
      text-wrap: balance;
    }

    .library-spotlight-copy {
      margin: 0;
      color: rgba(244, 240, 230, 0.8);
      font-size: 1rem;
      line-height: 1.68;
    }

    .library-spotlight-notes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.7rem;
    }

    .library-spotlight-note {
      padding: 0.85rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    .library-spotlight-empty-title {
      margin: 0;
      color: #fffaf0;
      font-family: "Newsreader", serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .library-spotlight-empty-copy {
      margin: 0;
      color: rgba(244, 240, 230, 0.76);
      line-height: 1.65;
    }

    .library-counts {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .public-library .editorial-band.library-dashboard {
      grid-template-columns: 1fr;
      align-items: stretch;
    }


    .library-browse-panel,
    .library-state-panel {
      display: grid;
      gap: 1.15rem;
    }

    .library-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: end;
    }

    .library-search-wrap {
      display: grid;
      gap: 0.4rem;
    }

    .library-search-input {
      width: 100%;
      min-height: 54px;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.46);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .library-search-input::placeholder {
      color: var(--muted);
    }

    .library-search-input:hover,
    .library-search-input:focus {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 0 0 4px rgba(41, 67, 61, 0.08);
      outline: none;
    }

    .city-filter {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 0.45rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .city-filter li {
      min-width: 0;
      max-width: 100%;
    }

    .fan-filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }
    .fan-filter-group[hidden] { display: none; }

    .city-chip-helmet {
      width: 18px;
      height: 18px;
      image-rendering: pixelated;
      flex-shrink: 0;
      margin-left: -0.2rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .filter-divider {
      position: relative;
      align-self: stretch;
      width: 1px;
      background: var(--line);
      display: flex;
      justify-content: center;
    }

    .filter-row:has(.fan-filter-group[hidden]) .filter-divider { display: none; }

    .filter-divider span {
      position: absolute;
      top: 0;
      transform: translateY(-50%);
      padding: 0 0.5rem;
      background: var(--surface);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted-strong);
    }

    @media (max-width: 700px) {
      .filter-row {
        grid-template-columns: 1fr;
      }
      .filter-divider {
        width: 100%;
        height: 1px;
      }
      .filter-divider span {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    }

    .city-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 28px;
      padding: 0 0.7rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      color: var(--muted-strong);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition);
    }

    .city-chip:hover,
    .city-chip:focus-visible {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
      outline: none;
    }

    .city-chip[aria-pressed="true"] {
      border-color: rgba(255, 255, 255, 0.1);
      background: var(--pine);
      color: #f8f6ef;
      box-shadow: 0 16px 28px rgba(25, 40, 36, 0.18);
    }

    .city-chip-count {
      opacity: 0.6;
      font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
    }

    .city-chip[aria-pressed="true"] .city-chip-count {
      opacity: 0.82;
    }

    .library-state-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .library-state-title {
      margin: 0;
      color: #fffaf0;
      font-family: "Newsreader", serif;
      font-size: clamp(1.7rem, 4vw, 2.35rem);
      font-weight: 500;
      letter-spacing: -0.05em;
      line-height: 0.98;
    }

    .library-state-copy {
      margin: 0;
      color: rgba(244, 240, 230, 0.8);
      font-size: 0.98rem;
      line-height: 1.68;
    }

    .library-state-list {
      display: grid;
      gap: 0.65rem;
    }

    .library-state-item {
      display: grid;
      gap: 0.2rem;
      padding: 0.85rem 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    .library-state-item-city {
      color: rgba(244, 240, 230, 0.62);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .library-state-item-name {
      color: #fffaf0;
      font-family: "Newsreader", serif;
      font-size: 1.18rem;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .library-state-empty {
      padding: 0.95rem 0;
      color: rgba(244, 240, 230, 0.68);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      display: grid;
      min-height: 100%;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.86) 0%, rgba(248, 246, 239, 0.96) 100%);
      box-shadow: 0 18px 40px rgba(21, 33, 29, 0.08);
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      animation: library-card-enter 560ms ease both;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--line-strong);
      box-shadow: 0 24px 56px rgba(21, 33, 29, 0.14);
      outline: none;
    }

    .card-visual {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.26), transparent 28%),
        linear-gradient(155deg, var(--game-secondary, #667d76) 0%, var(--game-primary, #15211d) 100%);
    }

    .card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 14, 13, 0.02), rgba(9, 14, 13, 0.52));
      pointer-events: none;
    }

    .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-monogram {
      position: absolute;
      right: 1rem;
      bottom: 0.85rem;
      left: 1rem;
      z-index: 1;
      color: var(--game-ink, #fffaf0);
      font-family: "Newsreader", serif;
      font-size: clamp(2.9rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.08em;
      line-height: 0.9;
    }

    .card-badges {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      left: 0.85rem;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.55rem;
    }

    .card-city,
    .card-featured {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 0.7rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .card-city {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(248, 247, 241, 0.16);
      color: #fffaf0;
    }

    .card-featured {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(248, 247, 241, 0.9);
      color: var(--ink);
      margin-left: auto;
    }

    .card-meta {
      display: grid;
      gap: 0.75rem;
      padding: 1rem 1.05rem 1.1rem;
    }

    .card-name {
      margin: 0;
      color: var(--ink);
      font-family: "Newsreader", serif;
      font-size: 1.32rem;
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .card-copy {
      margin: 0;
      color: var(--muted-strong);
      font-size: 0.92rem;
      line-height: 1.62;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-detail {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-top: 0.15rem;
    }

    .card-swatches {
      display: flex;
      align-items: center;
      gap: 0.38rem;
    }

    .card-swatch {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(21, 33, 29, 0.16);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.44);
    }

    .card-link {
      color: var(--pine);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .empty {
      min-height: 240px;
      padding: 2rem;
    }

    .empty strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--ink);
      font-family: "Newsreader", serif;
      font-size: 1.45rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    @keyframes library-card-enter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 960px) {
      .library-controls {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .library-counts {
        justify-self: start;
      }
    }

    @media (max-width: 720px) {
      .library-title {
        max-width: none;
      }

      .library-actions .button,
      .library-actions .ghost-button {
        flex: 1 1 220px;
      }

      .library-spotlight-visual,
      .card-visual {
        min-height: 200px;
      }

      .library-spotlight-notes {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .city-chip,
      .library-search-input {
        animation: none;
        transition: none;
      }
    }

    /* Index-matched library theme */
    body.public-library {
      --ink: #f8fafc;
      --muted: rgba(248, 250, 252, 0.62);
      --muted-strong: rgba(248, 250, 252, 0.78);
      --surface: rgba(3, 8, 9, 0.72);
      --surface-strong: rgba(8, 17, 18, 0.88);
      --line: rgba(85, 214, 207, 0.2);
      --line-strong: rgba(85, 214, 207, 0.48);
      --pine: #55d6cf;
      --brass: #78fff5;
      --cream: #f8fafc;
      --transition: 160ms ease;
      --shadow-soft: 0 20px 58px rgba(0, 0, 0, 0.34);
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 18%, rgba(85, 214, 207, 0.12), transparent 28%),
        linear-gradient(180deg, #05090a 0%, #081112 62%, #030606 100%);
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
    }

    body.public-library,
    body.public-library * {
      font-family: "Montserrat", Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    body.public-library::before {
      opacity: 1;
      background:
        linear-gradient(114deg, transparent 0 20%, rgba(85, 214, 207, 0.18) 20.3% 21.2%, transparent 21.6% 100%),
        linear-gradient(52deg, transparent 0 36%, rgba(120, 255, 245, 0.12) 36.4% 37.1%, transparent 37.5% 100%),
        linear-gradient(158deg, transparent 0 48%, rgba(85, 214, 207, 0.14) 48.3% 49.1%, transparent 49.5% 100%),
        linear-gradient(90deg, rgba(18, 61, 56, 0.14) 1px, transparent 1px),
        linear-gradient(0deg, rgba(31, 100, 209, 0.08) 1px, transparent 1px);
      background-position:
        50% 0,
        82% 18%,
        18% 42%,
        0 0,
        0 0;
      background-size:
        840px 620px,
        680px 480px,
        760px 520px,
        48px 48px,
        48px 48px;
      mix-blend-mode: normal;
    }

    body.public-library::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 72% 28%, rgba(85, 214, 207, 0.1), transparent 24%),
        linear-gradient(90deg, rgba(5, 9, 10, 0.94), rgba(5, 9, 10, 0.48) 52%, rgba(5, 9, 10, 0.84)),
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.46) 100%);
    }

    .public-library .page-shell {
      width: min(1180px, calc(100% - 32px));
      min-height: 100svh;
      padding: 22px 0 64px;
    }

    .public-library .site-nav {
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(3, 8, 9, 0.64);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        0 18px 44px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    .public-library .brand-lockup {
      gap: 8px;
    }

    .public-library .brand-lockup--page .brand-name {
      color: #78fff5 !important;
      font-size: 0.78rem !important;
      font-weight: 800 !important;
      text-shadow:
        0 0 10px rgba(120, 255, 245, 0.62),
        0 0 24px rgba(85, 214, 207, 0.32);
    }

    .public-library .page-headline {
      color: #ffffff;
      font-size: 4.85rem;
      font-weight: 700;
      line-height: 0.88;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.62),
        0 0 24px rgba(85, 214, 207, 0.42),
        0 0 54px rgba(85, 214, 207, 0.22),
        0 24px 64px rgba(0, 0, 0, 0.58);
    }

    .public-library .page-count-line {
      color: rgba(247, 251, 247, 0.72);
      font-size: 0.86rem;
    }

    .public-library .page-count-line span {
      color: #ffffff;
    }

    .public-library main {
      gap: 1rem;
      padding-top: 16px;
    }

    .public-library .nav-links {
      gap: 8px;
      min-width: 0;
      max-width: 100%;
    }

    .public-library .nav-link,
    .public-library .utility-link,
    .public-library .button,
    .public-library .ghost-button {
      min-height: 42px;
      border-color: rgba(85, 214, 207, 0.34);
      border-radius: 8px;
      background: rgba(3, 8, 9, 0.7);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 800;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
    }

    .public-library .nav-link:hover,
    .public-library .nav-link:focus-visible,
    .public-library .utility-link:hover,
    .public-library .utility-link:focus-visible,
    .public-library .button:hover,
    .public-library .button:focus-visible,
    .public-library .ghost-button:hover,
    .public-library .ghost-button:focus-visible {
      border-color: rgba(85, 214, 207, 0.78);
      background: rgba(10, 37, 39, 0.84);
      color: #ffffff;
      box-shadow:
        0 20px 42px rgba(0, 0, 0, 0.26),
        0 0 28px rgba(85, 214, 207, 0.2);
    }

    .public-library .nav-link--active,
    .public-library .button {

<body class="public-library">
  <div class="page-shell">
    <header class="site-nav">
      <div class="brand-lockup brand-lockup--page">
        <span class="brand-name">The Game Bureau</span>
        <span class="page-headline">Library</span>
        <p class="page-count-line"><span id="headerGameCount">0</span> live games in <span id="headerCityCount">0</span> cities</p>
      </div>
      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link nav-link--active" href="library.html">Library</a>
        <a class="nav-link" href="gift.html">Gift Shop</a>
        <a class="nav-link nav-link--account" href="account.html" data-account-link>Account</a>
      </nav>
    </header>

    <main>
      <section class="editorial-band library-dashboard" aria-label="Library controls" id="libraryDirectory">
        <article class="section-shell">
          <div class="section-inner library-browse-panel">
            <div class="filter-row">
              <div class="filter-group">
                <p class="info-label">Search by Game City</p>
                <ul class="city-filter" id="cityFilter" role="list" aria-label="Search by game city"></ul>
              </div>
              <div class="filter-divider" aria-hidden="true"><span>OR</span></div>
              <div class="fan-filter-group" id="fanFilterGroup" hidden>
                <p class="info-label">Search by Your Team</p>
                <ul class="city-filter" id="fanFilter" role="list" aria-label="Search by your team"></ul>
              </div>
            </div>
          </div>
        </article>
      </section>

      <section class="metric-grid" aria-label="Library metrics">
        <article class="metric-card">
          <span class="metric-label">Visible Now</span>
          <span class="metric-value" id="metricVisible">0</span>
          <p class="metric-copy">The size of the slice created by your current filter and search.</p>
        </article>
      </section>

      <section aria-label="Games">
        <div class="grid" id="grid" aria-live="polite"></div>
      </section>

      <footer class="page-footer">
        <a class="utility-link admin-btn" href="mc/index.html">Mission Control</a>
      </footer>
    </main>
  </div>

  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3',
      table: 'games'
    };

    const ALL_CITIES = '__all__';
    const ALL_FANS = '__all_fans__';
    const cityFilterEl = document.getElementById('cityFilter');
    const fanFilterEl = document.getElementById('fanFilter');
    const fanFilterGroupEl = document.getElementById('fanFilterGroup');
    const gridEl = document.getElementById('grid');
    const visibleMetricEl = document.getElementById('metricVisible');
    const headerGameCountEl = document.getElementById('headerGameCount');
    const headerCityCountEl = document.getElementById('headerCityCount');

    let allGames = [];
    let activeCity = ALL_CITIES;
    let activeFan = ALL_FANS;
    let searchTerm = '';

    function getFanTeam(game) {
      const name = String(game?.name || '').trim();
      const match = name.match(/^(.+?)\s+Fans Takeover\s+/i);
      return match ? match[1].trim() : '';
    }

    function getSearchLabel() {
      return '';
    }

    function isTrueish(value) {
      if (typeof value === 'boolean') return value;
      if (typeof value === 'string') {
        const trimmed = value.trim().toLowerCase();
        return !!trimmed && trimmed !== 'false' && trimmed !== '0' && trimmed !== 'no';
      }
      return !!value;
    }

    function isLiveGame(game) {
      return !isTrueish(game?.archived) && !isTrueish(game?.erased);
    }

    function isFeatured(game) {
      if (typeof game?.featured === 'boolean') return game.featured;
      if (typeof game?.featured === 'string' && game.featured.trim()) return true;
      const tags = Array.isArray(game?.tags) ? game.tags : [];
      return tags.some((tag) => String(tag || '').trim().toLowerCase() === 'featured');
    }

    function getCity(game) {
      return String(game?.city || '').trim();
    }

    function getGameDate(game) {
      const raw = String(game?.game_date || '').trim();
      if (!raw) return '';
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return raw;
      const [, year, month, day] = match;
      const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString('en-US', {
        timeZone: 'UTC',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function plainText(value) {
      return String(value || '')
        .replace(/<[^>]*>/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function truncate(text, maxLength = 140) {
      const normalized = plainText(text);
      if (!normalized) return '';
      return normalized.length > maxLength
        ? normalized.slice(0, maxLength - 1).trimEnd() + '…'
        : normalized;
    }

    function getPalette(game) {
      return {
        primary: String(game?.primary_color || '').trim() || '#15211d',
        secondary: String(game?.secondary_color || '').trim() || '#667d76'
      };
    }

    function sanitizeAssetUrl(value) {
      const raw = String(value || '').trim().replace(/\\/g, '/')
        .replace('https://the-game-bureau.github.io/the-game-bureau/', 'https://thegamebureau.com/')
        .replace('https://the-game-bureau.github.io/', 'https://thegamebureau.com/');
      if (!raw) return '';
      if (raw.startsWith('data:') || raw.startsWith('blob:')) return raw;
      try {
        const base = /^assets\//i.test(raw) ? new URL('', window.location.href).toString() : window.location.href;
        const resolved = new URL(raw, base);
        const proto = String(resolved.protocol || '').toLowerCase();
        return proto === 'http:' || proto === 'https:' ? resolved.toString() : '';
      } catch (e) {
        return '';
      }
    }

    function getImageUrl(game) {
      return sanitizeAssetUrl(game?.logo_url || game?.guide_image_url || '');
    }

    function getGuideName(game) {
      return plainText(game?.guide_name || '');
    }

    function getLocationLabel(game) {
      return plainText(game?.starting_location || '');
    }

    function getSummaryCopy(game) {
      const candidates = [game?.tagline, game?.body, game?.how_to_play, game?.guide_bio];
      for (const candidate of candidates) {
        const text = truncate(candidate, 150);
        if (text) return text;
      }
      return 'Open the route and let the city reveal itself one clue at a time.';
    }

    function getMonogram(name) {
      const words = plainText(name).match(/[A-Za-z0-9]+/g) || [];
      const letters = words.slice(0, 2).map((word) => word.charAt(0).toUpperCase()).join('');
      return letters || 'TGB';
    }

    async function fetchGames() {
      const url = new URL('rest/v1/' + SB_CONFIG.table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      url.searchParams.set('select', '*');
      url.searchParams.set('order', 'name.asc');
      const response = await fetch(url.toString());
      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error('Supabase ' + response.status + ': ' + text.slice(0, 200));
      }
      return response.json();
    }

    function sortGames(games) {
      return [...games].sort((left, right) => {
        const featuredDelta = Number(isFeatured(right)) - Number(isFeatured(left));
        if (featuredDelta !== 0) return featuredDelta;
        return String(left?.name || '').localeCompare(String(right?.name || ''), undefined, { sensitivity: 'base' });
      });
    }

    function pluralize(n, one, many) {
      return n === 1 ? one : many;
    }

    function pickContrastInk(hex) {
      const m = String(hex || '').trim().match(/^#?([0-9a-f]{6})$/i);
      if (!m) return '#fffaf0';
      const v = parseInt(m[1], 16);
      const r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.65 ? '#15211d' : '#fffaf0';
    }

    function matchesSearch(game) {
      if (!searchTerm) return true;
      const haystack = [
        game?.name,
        game?.city,
        game?.tagline,
        game?.body,
        game?.how_to_play,
        game?.guide_name
      ].map(plainText).join(' ').toLowerCase();
      return haystack.includes(searchTerm);
    }

    function getVisibleGames() {
      return allGames.filter((game) => {
        if (activeCity !== ALL_CITIES && getCity(game) !== activeCity) return false;
        if (activeFan !== ALL_FANS && getFanTeam(game) !== activeFan) return false;
        return matchesSearch(game);
      });
    }

    function getSliceTitle() {
      if (activeFan !== ALL_FANS && activeCity !== ALL_CITIES) return activeFan + ' fans in ' + activeCity;
      if (activeFan !== ALL_FANS) return activeFan + ' fans';
      if (activeCity !== ALL_CITIES) return activeCity;
      if (searchTerm) return 'Search results';
      return 'All cities';
    }

    function createColorSwatch(color) {
      const swatch = document.createElement('span');
      swatch.className = 'card-swatch';
      swatch.style.background = color;
      return swatch;
    }

    function createCard(game, index = 0) {
      const id = String(game?.id || '').trim();
      const palette = getPalette(game);
      const name = String(game?.name || '').trim() || 'Untitled';
      const city = getCity(game);
      const imageUrl = getImageUrl(game);
      const summary = getSummaryCopy(game);
      const detail = city
        ? 'Takes place on the streets of ' + city
        : 'Takes place on the streets';

      const card = document.createElement('a');
      card.className = 'card';
      card.href = '../game/run/index.html?id=' + encodeURIComponent(id);
      card.setAttribute('aria-label', name + (city ? ' in ' + city : ''));
      card.style.setProperty('--game-primary', palette.primary);
      card.style.setProperty('--game-secondary', palette.secondary);
      card.style.setProperty('--game-ink', pickContrastInk(palette.primary));
      card.style.animationDelay = Math.min(index, 12) * 36 + 'ms';

      const visual = document.createElement('div');
      visual.className = 'card-visual';

      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.addEventListener('error', () => img.remove());
        visual.appendChild(img);
      } else {
        const monogram = document.createElement('div');
        monogram.className = 'card-monogram';
        monogram.textContent = getMonogram(name);
        visual.appendChild(monogram);
      }

      const badgeRow = document.createElement('div');
      badgeRow.className = 'card-badges';
      const gameDateLabel = getGameDate(game);
      if (gameDateLabel) {
        const dateBadge = document.createElement('span');
        dateBadge.className = 'card-city';
        dateBadge.textContent = gameDateLabel;
        badgeRow.appendChild(dateBadge);
      }
      if (isFeatured(game)) {
        const badge = document.createElement('span');
        badge.className = 'card-featured';
        badge.textContent = 'Featured';
        badgeRow.appendChild(badge);
      }
      if (badgeRow.childNodes.length) visual.appendChild(badgeRow);

      const meta = document.createElement('div');
      meta.className = 'card-meta';

      const nameEl = document.createElement('h2');
      nameEl.className = 'card-name';
      nameEl.textContent = name;
      meta.appendChild(nameEl);

      if (summary) {
        const summaryEl = document.createElement('p');
        summaryEl.className = 'card-copy';
        summaryEl.textContent = summary;
        meta.appendChild(summaryEl);
      }

      const detailEl = document.createElement('div');
      detailEl.className = 'card-detail';
      detailEl.textContent = detail;
      meta.appendChild(detailEl);

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const swatches = document.createElement('div');
      swatches.className = 'card-swatches';
      swatches.append(createColorSwatch(palette.primary), createColorSwatch(palette.secondary));

      const linkEl = document.createElement('span');
      linkEl.className = 'card-link';
      linkEl.textContent = 'Play';

      footer.append(swatches, linkEl);
      meta.appendChild(footer);

      card.append(visual, meta);
      return card;
    }

    function renderMetrics(visibleGames) {
      const cities = new Set(allGames.map(getCity).filter(Boolean)).size;
      visibleMetricEl.textContent = String(visibleGames.length);
      if (headerGameCountEl) headerGameCountEl.textContent = String(allGames.length);
      if (headerCityCountEl) headerCityCountEl.textContent = String(cities);
    }

    function renderCityFilter() {
      const cityCounts = new Map();
      allGames.forEach((g) => {
        const c = getCity(g);
        if (!c) return;
        cityCounts.set(c, (cityCounts.get(c) || 0) + 1);
      });
      const cities = [...cityCounts.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      cityFilterEl.innerHTML = '';
      const entries = [
        { key: ALL_CITIES, label: 'All', count: allGames.length },
        ...cities.map((c) => ({ key: c, label: c, count: cityCounts.get(c) }))
      ];

      entries.forEach((entry) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'city-chip';
        btn.setAttribute('aria-pressed', String(entry.key === activeCity));
        btn.textContent = entry.label;
        const count = document.createElement('span');
        count.className = 'city-chip-count';
        count.textContent = entry.count;
        btn.appendChild(count);
        btn.addEventListener('click', () => setActiveCity(entry.key));
        li.appendChild(btn);
        cityFilterEl.appendChild(li);
      });
    }

    function setActiveCity(city) {
      activeCity = city;
      if (city !== ALL_CITIES) activeFan = ALL_FANS;
      renderCityFilter();
      renderFanFilter();
      renderGrid();
    }

    function renderFanFilter() {
      const fanCounts = new Map();
      const fanGameSample = new Map();
      allGames.forEach((g) => {
        const fan = getFanTeam(g);
        if (!fan) return;
        fanCounts.set(fan, (fanCounts.get(fan) || 0) + 1);
        if (!fanGameSample.has(fan)) fanGameSample.set(fan, g);
      });
      const fans = [...fanCounts.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      if (!fans.length) {
        fanFilterGroupEl.hidden = true;
        return;
      }
      fanFilterGroupEl.hidden = false;

      const totalFanGames = fans.reduce((sum, f) => sum + fanCounts.get(f), 0);
      const entries = [
        { key: ALL_FANS, label: 'All', count: totalFanGames, helmet: null },
        ...fans.map((f) => ({ key: f, label: f, count: fanCounts.get(f), helmet: fanGameSample.get(f) }))
      ];

      fanFilterEl.innerHTML = '';
      entries.forEach((entry) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'city-chip';
        btn.setAttribute('aria-pressed', String(entry.key === activeFan));

        if (entry.helmet && typeof window.helmetSVG === 'function') {
          const img = document.createElement('img');
          img.className = 'city-chip-helmet';
          img.alt = '';
          img.src = window.helmetSVG(
            entry.helmet.primary_color,
            entry.helmet.secondary_color,
            entry.helmet.tertiary_color
          );
          btn.appendChild(img);
        }

        const labelSpan = document.createElement('span');
        labelSpan.textContent = entry.label;
        btn.appendChild(labelSpan);

        const count = document.createElement('span');
        count.className = 'city-chip-count';
        count.textContent = entry.count;
        btn.appendChild(count);
        btn.addEventListener('click', () => setActiveFan(entry.key));
        li.appendChild(btn);
        fanFilterEl.appendChild(li);
      });
    }

    function setActiveFan(fan) {
      activeFan = fan;
      if (fan !== ALL_FANS) activeCity = ALL_CITIES;
      renderCityFilter();
      renderFanFilter();
      renderGrid();
    }

    function renderGrid() {
      const visible = getVisibleGames();

      gridEl.innerHTML = '';
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        const title = document.createElement('strong');
        title.textContent = 'No games in this slice';
        const copy = document.createElement('span');
        copy.textContent = searchTerm || activeCity !== ALL_CITIES
          ? 'Try a different city or clear the search to widen the catalog.'
          : 'No live games have been published yet.';
        empty.append(title, copy);
        gridEl.appendChild(empty);
      } else {
        visible.forEach((game, index) => gridEl.appendChild(createCard(game, index)));
      }
      renderMetrics(visible);
    }

    function renderErrorState(message) {
      renderMetrics([]);

      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      const title = document.createElement('strong');
      title.textContent = 'Library unavailable';
      const copy = document.createElement('span');
      copy.textContent = message;
      empty.append(title, copy);
      gridEl.appendChild(empty);
    }

    async function load() {
      try {
        const games = await fetchGames();
        allGames = sortGames((Array.isArray(games) ? games : []).filter(isLiveGame));
        renderCityFilter();
        renderFanFilter();
        renderGrid();
      } catch (error) {
        console.error(error);
        renderErrorState(error instanceof Error ? error.message : String(error));
      }
    }

    load();
  </script>
  <script>
    (function () {
      try {
        const session = JSON.parse(localStorage.getItem('tgb-photo-review-auth-session') || 'null');
        const expiresAt = Number(session && session.expires_at || 0) * 1000;
        if (session && session.access_token && (!expiresAt || expiresAt > Date.now())) {
          const btn = document.querySelector('.admin-btn');
          if (btn) btn.style.display = 'inline-flex';
        }
      } catch (_) {}
    }());
  </script>
</body>
</html>
