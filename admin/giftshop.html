<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ADMIN | GIFT SHOP | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .section-head { display: grid; gap: 4px; margin: 0 0 14px; }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3.6rem;
      letter-spacing: 0;
      line-height: 0.95;
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 2.4rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy { margin: 0; color: var(--muted); line-height: 1.5; max-width: 620px; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar select {
      flex: 1;
      min-width: min(100%, 260px);
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .btn:hover { background: rgba(255,255,255,1); border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--bic-blue); border-color: var(--bic-blue); }

    .btn.danger {
      color: var(--danger);
      border-color: rgba(160, 63, 45, 0.45);
      background: rgba(255,255,255,0.92);
    }
    .btn.danger:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }

    .auth {
      width: min(430px, 100%);
      margin: 12vh auto 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }
    .auth h1 { margin-bottom: 10px; font-size: 2.4rem; }
    .auth-form { display: grid; gap: 12px; margin-top: 18px; }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions .btn.primary { flex: 1; }
    .auth label {
      display: grid; gap: 6px;
      color: var(--muted); font-size: 0.9rem; font-weight: 700;
    }
    .auth input {
      height: 44px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: rgba(255,255,255,0.86);
    }
    .auth input:focus,
    .toolbar select:focus,
    .item input:focus,
    .item textarea:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    .home-icon-btn {
      width: 44px;
      min-width: 44px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .home-icon-btn svg { display: block; width: 22px; height: 22px; }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .signout-btn svg { display: block; width: 31px; height: 31px; }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }

    .items {
      display: grid;
      gap: 14px;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px var(--paper-shadow);
    }

    .item.is-archived { opacity: 0.65; }
    .item.is-new { border-color: var(--accent); }

    .item-focus-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      width: 220px;
      flex-shrink: 0;
    }
    .item-focus-caption {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      line-height: 1.4;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: left;
    }
    .item-focus {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.06);
      border: 1px solid var(--line);
      overflow: hidden;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      touch-action: none;
    }
    .item-focus [data-focus-placeholder] {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .item-focus img {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      max-height: none;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    .item-focus[data-has-image="true"] {
      cursor: grab;
    }
    .item-focus[data-dragging="true"] {
      cursor: grabbing;
    }

    .item-fields {
      display: grid;
      grid-template-columns: 1fr 140px 130px;
      gap: 10px;
      align-items: end;
    }

    .item-fields .field-wide { grid-column: 1 / -1; }
    .item-fields label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-fields input,
    .item-fields textarea,
    .item-fields select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .item-fields textarea {
      height: 64px;
      padding: 8px 10px;
      resize: vertical;
      min-height: 64px;
    }

    .item-listings {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.03);
    }
    .item-listings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-listings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .listing-row {
      display: grid;
      grid-template-columns: 1fr 90px auto auto;
      gap: 6px;
      align-items: center;
    }
    .listing-row select,
    .listing-row input[type="number"] {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .listing-row .listing-archive {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .listing-row .listing-archive input { width: auto; height: auto; }
    .listing-row .listing-remove {
      width: 30px; height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .listing-row .listing-remove:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .listing-row.is-removed { display: none; }
    .item-listings-empty {
      padding: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    .item-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
      margin-top: 4px;
    }

    .item-archive-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .item-archive-toggle input { width: auto; height: auto; }

    .item-status {
      flex: 1;
      text-align: right;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .item-status.error { color: var(--danger); font-weight: 700; }
    .item-status.success { color: var(--success); font-weight: 700; }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      h1 { font-size: 2.4rem; }
      .item { grid-template-columns: auto 1fr; }
      .item-focus-col { max-width: 100%; }
      .item-fields { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 540px) {
      .item-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="auth" id="authPanel">
      <p class="kicker">The Game Bureau</p>
      <h1>Admin</h1>
      <p class="copy">Sign in with an admin account.</p>
      <form class="auth-form" id="authForm">
        <label>
          Email
          <input id="emailInput" type="email" autocomplete="username" required>
        </label>
        <label>
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required>
        </label>
        <div class="auth-actions">
          <button class="btn primary" id="signInBtn" type="submit">Sign In</button>
          <a class="btn home-icon-btn" href="../" aria-label="Home" title="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 11.2 12 4l8 7.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.5 10.5V20h11v-9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </form>
      <p class="status" id="authStatus" aria-live="polite"></p>
    </section>

    <section id="shopPanel" class="hidden">
      <div class="topbar">
        <div class="section-head">
          <p class="kicker">Manage</p>
          <h1>Gift Shop</h1>
          <p class="copy">Every gift shop item across all games. Each row picks its own game.</p>
        </div>
        <div class="topbar-actions">
          <a class="btn" href="./">← Admin</a>
          <button class="btn signout-btn" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5.5 19.5c1.2-3.4 3.8-5.1 6.5-5.1s5.3 1.7 6.5 5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="addItemBtn" type="button" disabled>+ Add item</button>
        <select id="previewShopSelect" aria-label="Pick a shop to preview">
          <option value="">All shops</option>
        </select>
        <a class="btn" id="previewBtn" href="../giftshop/" target="_blank" rel="noopener">Preview</a>
      </div>

      <p class="status" id="shopStatus" aria-live="polite"></p>
      <div class="items" id="itemsList"></div>
    </section>
  </main>

  <template id="itemTemplate">
    <article class="item" data-id="">
      <div class="item-focus-col">
        <div class="item-focus" data-has-image="false">
          <span data-focus-placeholder>IMG</span>
        </div>
        <p class="item-focus-caption">This is the actual size and crop the gift shop will show. Drag the image to choose what's visible.</p>
      </div>
      <div class="item-fields">
        <label class="field-wide">
          Title
          <input data-field="title" type="text" placeholder="Field Notebook">
        </label>
        <label class="field-wide">
          Price (display)
          <input data-field="price_display" type="text" placeholder="$12.99">
        </label>
        <label class="field-wide">
          Amazon URL
          <input data-field="url" type="url" placeholder="https://www.amazon.com/dp/…">
        </label>
        <label class="field-wide">
          Image URL (optional)
          <input data-field="image_url" type="url" placeholder="https://m.media-amazon.com/images/…">
        </label>
        <label class="field-wide">
          Description (optional)
          <textarea data-field="description" placeholder="Short blurb shown under the title."></textarea>
        </label>
        <div class="item-listings" data-listings>
          <div class="item-listings-head">
            <span>Listed in shops</span>
            <button class="btn" data-action="add-listing" type="button">+ Add to a shop</button>
          </div>
          <div class="item-listings-list" data-listings-list></div>
        </div>
        <div class="item-actions">
          <button class="btn primary" data-action="save" type="button">Save</button>
          <button class="btn danger" data-action="delete" type="button">Delete</button>
          <span class="item-status" data-status></span>
        </div>
      </div>
    </article>
  </template>

  <template id="listingRowTemplate">
    <div class="listing-row" data-listing data-listing-id="">
      <select data-listing-field="game_id" required>
        <option value="">— Pick a shop —</option>
      </select>
      <input data-listing-field="position" type="number" inputmode="numeric" min="0" step="1" placeholder="Pos">
      <label class="listing-archive">
        <input data-listing-field="archived" type="checkbox">
        Archived
      </label>
      <button class="listing-remove" data-action="remove-listing" type="button" title="Remove from this shop" aria-label="Remove">×</button>
    </div>
  </template>

  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const AUTH_STORAGE_KEY = 'tgb-photo-review-auth-session'; // shared with library.html

    const authPanel    = document.getElementById('authPanel');
    const shopPanel    = document.getElementById('shopPanel');
    const authForm     = document.getElementById('authForm');
    const emailInput   = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signInBtn    = document.getElementById('signInBtn');
    const signOutBtn   = document.getElementById('signOutBtn');
    const authStatus   = document.getElementById('authStatus');
    const shopStatus   = document.getElementById('shopStatus');
    const addItemBtn   = document.getElementById('addItemBtn');
    const previewBtn   = document.getElementById('previewBtn');
    const previewShopSelect = document.getElementById('previewShopSelect');
    const itemsList    = document.getElementById('itemsList');
    const itemTemplate = document.getElementById('itemTemplate');
    const listingRowTemplate = document.getElementById('listingRowTemplate');

    let currentSession = null;
    // Every game we know about (live + archived), keyed by id, so we
    // can populate per-item dropdowns AND label rows whose game has
    // been archived since the item was created.
    let gamesById = new Map();
    let gameOptionsHtml = '<option value="">— Pick a game —</option>';

    function authUrl(path) {
      return new URL('/auth/v1/' + String(path || '').replace(/^\/+/, ''), SUPABASE_CONFIG.url + '/').toString();
    }

    function restUrl(table, params = {}) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function setStatus(el, message, state = '') {
      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('error', state === 'error');
      el.classList.toggle('success', state === 'success');
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) { return text; }
      } catch (_) { return fallback; }
    }

    function readStoredSession() {
      try { return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null'); }
      catch (_) { return null; }
    }
    function storeSession(session) {
      try {
        if (session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
        else localStorage.removeItem(AUTH_STORAGE_KEY);
      } catch (_) {}
    }

    async function signIn(email, password) {
      const response = await fetch(authUrl('token?grant_type=password'), {
        method: 'POST',
        headers: { apikey: SUPABASE_CONFIG.publishableKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (!response.ok) throw new Error(await readError(response, 'Sign in failed.'));
      return response.json();
    }

    async function refreshSession(session) {
      if (!session || !session.refresh_token) return null;
      const response = await fetch(authUrl('token?grant_type=refresh_token'), {
        method: 'POST',
        headers: { apikey: SUPABASE_CONFIG.publishableKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!response.ok) return null;
      return response.json();
    }

    async function getUsableSession() {
      const stored = readStoredSession();
      if (!stored || !stored.access_token) return null;
      const expiresAt = Number(stored.expires_at || 0) * 1000;
      if (expiresAt && expiresAt > Date.now() + 60000) return stored;
      const refreshed = await refreshSession(stored);
      if (refreshed && refreshed.access_token) { storeSession(refreshed); return refreshed; }
      storeSession(null);
      return null;
    }

    function authHeaders(extra = {}) {
      return {
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + currentSession.access_token,
        ...extra
      };
    }

    async function verifyAdmin() {
      const email = currentSession && currentSession.user ? currentSession.user.email : '';
      const response = await fetch(restUrl('admin_users', { select: 'email', email: 'eq.' + email, limit: '1' }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not verify admin access.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length > 0;
    }

    // ── Games ────────────────────────────────────────────────────────
    async function fetchGames() {
      const response = await fetch(restUrl('games', { select: 'id,name,archived,erased', order: 'name.asc' }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load games.'));
      return response.json();
    }

    function isLive(game) {
      const dead = (v) => typeof v === 'boolean' ? v : (typeof v === 'string' && v.trim() && v.trim().toLowerCase() !== 'false' && v.trim() !== '0');
      return !dead(game.archived) && !dead(game.erased);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadGames() {
      const games = await fetchGames();
      gamesById = new Map(games.map((g) => [g.id, g]));
      // Live games first, archived/erased grouped after.
      const live = games.filter(isLive);
      const dead = games.filter((g) => !isLive(g));
      const renderOpt = (g, suffix) =>
        '<option value="' + escapeHtml(g.id) + '">' +
        escapeHtml((g.name || g.id) + (suffix ? ' ' + suffix : '')) +
        '</option>';
      gameOptionsHtml =
        '<option value="">— Pick a game —</option>' +
        live.map((g) => renderOpt(g, '')).join('') +
        dead.map((g) => renderOpt(g, '(archived)')).join('');

      // Top-level preview picker — only live shops.
      previewShopSelect.innerHTML =
        '<option value="">All shops</option>' +
        live.map((g) => renderOpt(g, '')).join('');
      updatePreviewHref();
    }

    function updatePreviewHref() {
      const id = previewShopSelect.value;
      previewBtn.href = id
        ? '../giftshop/?game=' + encodeURIComponent(id)
        : '../giftshop/';
    }

    previewShopSelect.addEventListener('change', updatePreviewHref);

    // ── Items ────────────────────────────────────────────────────────
    async function fetchAllItems() {
      // Embed each item's listings so we can render the full edit UI in
      // one round-trip. Order is title-asc; per-listing position is
      // surfaced inside each card, not at the catalog level.
      const response = await fetch(restUrl('gift_shop_items', {
        select: '*,gift_shop_listings(*)',
        order: 'title.asc.nullslast'
      }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load gift shop items.'));
      return response.json();
    }

    async function insertItem(payload) {
      const response = await fetch(restUrl('gift_shop_items'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Insert failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateItem(id, payload) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Update failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteItem(id) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Delete failed.'));
    }

    // ── Listings ─────────────────────────────────────────────────────
    async function insertListing(payload) {
      const response = await fetch(restUrl('gift_shop_listings'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateListing(id, payload) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not update listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteListing(id) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not remove listing.'));
    }

    function renderEmpty() {
      itemsList.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'No items yet. Click + Add item to start.';
      itemsList.appendChild(div);
    }

    function buildItemPayload(article) {
      const get = (name) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        return el ? el.value : '';
      };
      const focus = String(article.dataset.imageFocus || '50% 50%');
      return {
        kind: 'amazon_link',
        title: get('title').trim() || null,
        url: get('url').trim(),
        image_url: get('image_url').trim() || null,
        image_focus: focus,
        price_display: get('price_display').trim() || null,
        description: get('description').trim() || null
      };
    }

    function readListingRow(row) {
      const game_id = String(row.querySelector('[data-listing-field="game_id"]').value || '').trim();
      const positionRaw = String(row.querySelector('[data-listing-field="position"]').value || '').trim();
      const position = positionRaw === '' ? 0 : Math.max(0, Math.floor(Number(positionRaw) || 0));
      const archived = !!row.querySelector('[data-listing-field="archived"]').checked;
      return { id: row.dataset.listingId || '', game_id, position, archived };
    }

    function appendListingRow(listingsList, listing = {}) {
      const fragment = listingRowTemplate.content.cloneNode(true);
      const row = fragment.querySelector('.listing-row');
      const sel = row.querySelector('[data-listing-field="game_id"]');
      sel.innerHTML = gameOptionsHtml;
      const targetId = listing.game_id || '';
      if (targetId) {
        const exists = sel.querySelector('option[value="' + CSS.escape(targetId) + '"]');
        if (!exists) {
          const opt = document.createElement('option');
          opt.value = targetId;
          opt.textContent = (gamesById.get(targetId)?.name || targetId) + ' (missing)';
          sel.appendChild(opt);
        }
        sel.value = targetId;
      }
      row.querySelector('[data-listing-field="position"]').value =
        listing.position == null ? '' : String(listing.position);
      row.querySelector('[data-listing-field="archived"]').checked = !!listing.archived;
      row.dataset.listingId = listing.id || '';
      row.querySelector('[data-action="remove-listing"]').addEventListener('click', () => {
        // For unsaved rows just drop them; for persisted rows mark for
        // deletion and hide so syncListings can DELETE on save.
        if (row.dataset.listingId) {
          row.classList.add('is-removed');
          row.dataset.removed = 'true';
        } else {
          row.remove();
        }
        refreshListingsEmpty(listingsList);
      });
      listingsList.appendChild(row);
      refreshListingsEmpty(listingsList);
      return row;
    }

    function refreshListingsEmpty(listingsList) {
      const live = listingsList.querySelectorAll('.listing-row:not(.is-removed)');
      let empty = listingsList.querySelector('.item-listings-empty');
      if (!live.length) {
        if (!empty) {
          empty = document.createElement('div');
          empty.className = 'item-listings-empty';
          empty.textContent = 'Not in any shop yet.';
          listingsList.appendChild(empty);
        }
      } else if (empty) {
        empty.remove();
      }
    }

    async function syncListings(article, itemId) {
      const rows = Array.from(article.querySelectorAll('.listing-row'));
      // 1) Removed rows that already had an id → DELETE
      const toDelete = rows.filter((r) => r.dataset.removed === 'true' && r.dataset.listingId);
      for (const row of toDelete) {
        await deleteListing(row.dataset.listingId);
        row.remove();
      }
      // 2) Live rows: insert if no id, otherwise update.
      const liveRows = rows.filter((r) => r.dataset.removed !== 'true');
      for (const row of liveRows) {
        const data = readListingRow(row);
        if (!data.game_id) continue; // skip blanks rather than erroring
        if (data.id) {
          const updated = await updateListing(data.id, {
            game_id: data.game_id,
            position: data.position,
            archived: data.archived
          });
          if (updated && updated.id) row.dataset.listingId = updated.id;
        } else {
          const created = await insertListing({
            item_id: itemId,
            game_id: data.game_id,
            position: data.position,
            archived: data.archived
          });
          if (created && created.id) row.dataset.listingId = created.id;
        }
      }
    }

    function bindItem(article, item) {
      article.dataset.id = item.id || '';
      article.classList.toggle('is-new', !item.id);

      const set = (name, value) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!value;
        else el.value = value == null ? '' : String(value);
      };

      set('title', item.title);
      set('url', item.url);
      set('image_url', item.image_url);
      set('price_display', item.price_display);
      set('description', item.description);

      // Render existing listings (from the embedded select) and wire
      // up the "+ Add to a shop" button. New blank items get one empty
      // row so the user has somewhere to pick a shop without an extra
      // click.
      const listingsList = article.querySelector('[data-listings-list]');
      listingsList.innerHTML = '';
      const listings = Array.isArray(item.gift_shop_listings) ? item.gift_shop_listings : [];
      const sortedListings = listings.slice().sort((a, b) => {
        const ka = (gamesById.get(a.game_id)?.name || '').toLowerCase();
        const kb = (gamesById.get(b.game_id)?.name || '').toLowerCase();
        if (ka < kb) return -1;
        if (ka > kb) return 1;
        return 0;
      });
      sortedListings.forEach((l) => appendListingRow(listingsList, l));
      if (!sortedListings.length && !item.id) {
        appendListingRow(listingsList, {});
      }
      refreshListingsEmpty(listingsList);

      article.querySelector('[data-action="add-listing"]').addEventListener('click', () => {
        const row = appendListingRow(listingsList, {});
        const sel = row.querySelector('[data-listing-field="game_id"]');
        if (sel) sel.focus();
      });

      // Focus picker: a fixed 220×220 frame matching the public site's
      // minimum card-image size. The image lives behind the frame at
      // "cover" scale (smaller dim = frame size, longer dim overflows).
      // Drag the image to slide it under the window; the resulting
      // top-left as a fraction of overflow is the object-position
      // we save back to the row.
      const FRAME_SIDE = 220;
      const focusBox = article.querySelector('.item-focus');
      const placeholder = focusBox.querySelector('[data-focus-placeholder]');

      const parseFocus = (raw) => {
        const m = String(raw || '').match(/(-?\d+(?:\.\d+)?)\s*%\s+(-?\d+(?:\.\d+)?)\s*%/);
        if (!m) return { x: 50, y: 50 };
        return {
          x: Math.min(100, Math.max(0, parseFloat(m[1]))),
          y: Math.min(100, Math.max(0, parseFloat(m[2])))
        };
      };

      let currentFocus = parseFocus(item.image_focus);
      let lastLayout = null;

      const writeFocus = () => {
        article.dataset.imageFocus =
          currentFocus.x.toFixed(1) + '% ' + currentFocus.y.toFixed(1) + '%';
      };
      writeFocus();

      const applyTransform = () => {
        const img = focusBox.querySelector('img');
        if (!img || !lastLayout) return;
        const tx = -(currentFocus.x / 100) * lastLayout.overflowX;
        const ty = -(currentFocus.y / 100) * lastLayout.overflowY;
        img.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0)';
      };

      const sizeImage = () => {
        const img = focusBox.querySelector('img');
        if (!img || !img.naturalWidth || !img.naturalHeight) {
          lastLayout = null;
          return;
        }
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const scale = Math.max(FRAME_SIDE / W, FRAME_SIDE / H);
        const dispW = W * scale;
        const dispH = H * scale;
        lastLayout = {
          dispW, dispH,
          overflowX: Math.max(0, dispW - FRAME_SIDE),
          overflowY: Math.max(0, dispH - FRAME_SIDE)
        };
        img.style.width = dispW + 'px';
        img.style.height = dispH + 'px';
        applyTransform();
      };

      const refreshFocusImage = () => {
        const url = article.querySelector('[data-field="image_url"]').value.trim();
        const existingImg = focusBox.querySelector('img');
        if (existingImg) existingImg.remove();
        lastLayout = null;
        if (url) {
          const img = document.createElement('img');
          img.alt = '';
          img.referrerPolicy = 'no-referrer';
          img.draggable = false;
          const onLoad = () => {
            focusBox.dataset.hasImage = 'true';
            placeholder.style.display = 'none';
            sizeImage();
          };
          const onError = () => {
            img.remove();
            focusBox.dataset.hasImage = 'false';
            placeholder.style.display = '';
            lastLayout = null;
          };
          img.addEventListener('load', onLoad);
          img.addEventListener('error', onError);
          focusBox.insertBefore(img, placeholder);
          img.src = url;
          // Cached images may already be complete before our listener
          // attaches — fire onLoad synchronously in that case.
          if (img.complete && img.naturalWidth > 0) onLoad();
        } else {
          focusBox.dataset.hasImage = 'false';
          placeholder.style.display = '';
        }
      };
      refreshFocusImage();
      article.querySelector('[data-field="image_url"]').addEventListener('input', refreshFocusImage);

      // Drag the image behind the frame. Pointer delta translates 1:1
      // into transform offset (since frame and image share screen px).
      // Translate is clamped so the frame stays filled (no white edges).
      let dragging = false;
      let dragStart = null;
      focusBox.addEventListener('pointerdown', (e) => {
        if (focusBox.dataset.hasImage !== 'true' || !lastLayout) return;
        dragging = true;
        focusBox.dataset.dragging = 'true';
        try { focusBox.setPointerCapture(e.pointerId); } catch { /* ignore */ }
        dragStart = {
          tx: -(currentFocus.x / 100) * lastLayout.overflowX,
          ty: -(currentFocus.y / 100) * lastLayout.overflowY,
          px: e.clientX,
          py: e.clientY
        };
        e.preventDefault();
      });
      focusBox.addEventListener('pointermove', (e) => {
        if (!dragging || !lastLayout || !dragStart) return;
        const dx = e.clientX - dragStart.px;
        const dy = e.clientY - dragStart.py;
        const tx = Math.max(-lastLayout.overflowX, Math.min(0, dragStart.tx + dx));
        const ty = Math.max(-lastLayout.overflowY, Math.min(0, dragStart.ty + dy));
        currentFocus.x = lastLayout.overflowX > 0 ? (-tx / lastLayout.overflowX) * 100 : 50;
        currentFocus.y = lastLayout.overflowY > 0 ? (-ty / lastLayout.overflowY) * 100 : 50;
        writeFocus();
        applyTransform();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        dragStart = null;
        delete focusBox.dataset.dragging;
        try { focusBox.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
      };
      focusBox.addEventListener('pointerup', endDrag);
      focusBox.addEventListener('pointercancel', endDrag);

      const statusEl = article.querySelector('[data-status]');
      const setItemStatus = (msg, kind = '') => setStatus(statusEl, msg, kind);

      article.querySelector('[data-action="save"]').addEventListener('click', async () => {
        const payload = buildItemPayload(article);
        if (!payload.url) {
          setItemStatus('Amazon URL is required.', 'error');
          return;
        }
        // Validate listings before doing any writes. Collect live shop
        // ids and reject if there are duplicates or none.
        const liveRows = Array.from(
          article.querySelectorAll('.listing-row:not(.is-removed)')
        );
        const liveData = liveRows.map(readListingRow).filter((d) => d.game_id);
        if (!liveData.length) {
          setItemStatus('Add this item to at least one shop first.', 'error');
          return;
        }
        const seen = new Set();
        for (const d of liveData) {
          if (seen.has(d.game_id)) {
            setItemStatus('This item is listed in the same shop twice.', 'error');
            return;
          }
          seen.add(d.game_id);
        }
        setItemStatus('Saving…');
        try {
          let saved;
          if (article.dataset.id) {
            saved = await updateItem(article.dataset.id, payload);
          } else {
            saved = await insertItem(payload);
          }
          if (saved && saved.id) {
            article.dataset.id = saved.id;
            article.classList.remove('is-new');
          }
          await syncListings(article, article.dataset.id);
          setItemStatus('Saved.', 'success');
          setTimeout(() => setItemStatus(''), 2200);
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });

      article.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        const id = article.dataset.id;
        if (!id) {
          // Brand-new row never saved — just remove from DOM.
          article.remove();
          if (!itemsList.children.length) renderEmpty();
          return;
        }
        if (!window.confirm('Delete this item?')) return;
        setItemStatus('Deleting…');
        try {
          await deleteItem(id);
          article.remove();
          if (!itemsList.children.length) renderEmpty();
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });
    }

    function appendItemRow(item = {}) {
      // Replace the empty-state placeholder if it's currently shown.
      const empty = itemsList.querySelector('.empty');
      if (empty) empty.remove();
      const fragment = itemTemplate.content.cloneNode(true);
      const article = fragment.querySelector('.item');
      itemsList.appendChild(article);
      bindItem(article, item);
      return article;
    }

    async function renderAllItems() {
      itemsList.innerHTML = '';
      setStatus(shopStatus, 'Loading items…');
      try {
        const items = await fetchAllItems();
        if (!items.length) {
          renderEmpty();
          setStatus(shopStatus, '');
          return;
        }
        items.forEach((item) => appendItemRow(item));
        setStatus(shopStatus, items.length + ' item' + (items.length === 1 ? '' : 's') + '.');
      } catch (error) {
        console.error(error);
        renderEmpty();
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    addItemBtn.addEventListener('click', () => {
      const article = appendItemRow({});
      const titleInput = article.querySelector('[data-field="title"]');
      if (titleInput) titleInput.focus();
    });

    function showAuth() {
      authPanel.classList.remove('hidden');
      shopPanel.classList.add('hidden');
      setStatus(authStatus, 'Sign in with an admin account.');
    }

    async function showShop(session) {
      currentSession = session;
      authPanel.classList.add('hidden');
      shopPanel.classList.remove('hidden');
      addItemBtn.disabled = true;
      try {
        await loadGames();
        addItemBtn.disabled = false;
        await renderAllItems();
      } catch (error) {
        console.error(error);
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = String(emailInput.value || '').trim();
      const password = String(passwordInput.value || '');
      if (!email || !password) return;
      signInBtn.disabled = true;
      setStatus(authStatus, 'Signing in…');
      try {
        const session = await signIn(email, password);
        currentSession = session;
        storeSession(session);
        const isAdmin = await verifyAdmin();
        if (!isAdmin) {
          storeSession(null);
          currentSession = null;
          throw new Error('This account is signed in, but it is not on the admin list.');
        }
        passwordInput.value = '';
        setStatus(authStatus, '');
        await showShop(session);
      } catch (error) {
        setStatus(authStatus, error instanceof Error ? error.message : String(error), 'error');
      } finally {
        signInBtn.disabled = false;
      }
    });

    signOutBtn.addEventListener('click', () => {
      currentSession = null;
      storeSession(null);
      itemsList.innerHTML = '';
      gamesById = new Map();
      gameOptionsHtml = '<option value="">— Pick a game —</option>';
      previewShopSelect.innerHTML = '<option value="">All shops</option>';
      previewBtn.href = '../giftshop/';
      addItemBtn.disabled = true;
      showAuth();
    });

    (async function init() {
      const session = await getUsableSession();
      if (!session) { showAuth(); return; }
      currentSession = session;
      try {
        const isAdmin = await verifyAdmin();
        if (!isAdmin) {
          storeSession(null);
          currentSession = null;
          showAuth();
          setStatus(authStatus, 'This account is signed in, but it is not on the admin list.', 'error');
          return;
        }
        await showShop(session);
      } catch (error) {
        console.error(error);
        storeSession(null);
        currentSession = null;
        showAuth();
        setStatus(authStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    })();
  </script>
</body>
</html>
