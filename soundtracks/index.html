    body.home-page .playlist-card {

      --case-offset: 0px;

      display: block;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      aspect-ratio: 6.55 / 1;
      overflow: hidden;
      border: 1px solid rgba(3, 5, 12, 0.95);
      border-radius: 2px;
      background:
        linear-gradient(180deg, #252b38 0%, #151b26 42%, #0a0e16 100%),

      color: var(--case-ink);
      box-shadow:
        2px 3px 0 rgba(3, 5, 13, 0.95),
        0 8px 18px rgba(2, 4, 12, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      cursor: pointer;
      scroll-margin-top: 18px;
      transform: translateX(var(--case-offset)) rotate(var(--case-tilt));

    body.home-page .playlist-card:nth-child(6n + 4) { --case-offset: 3px; --case-tilt: 0.45deg; --case-stripe: #68f27d; }
    body.home-page .playlist-card:nth-child(6n + 5) { --case-offset: -2px; --case-tilt: -0.2deg; --case-stripe: #c8503a; }

    .sx-modal[hidden] { display: none; }
    .sx-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 8, 14, 0.82);

    .sx-panel {
      position: relative;
      display: grid;
      gap: 16px;

    }

    .tgb-cass-key { cursor: pointer; }

    .tgb-cass-screw-head {
      fill: #d5cec1;
      stroke: rgba(20, 14, 8, 0.5);
      stroke-width: 0.22;
      transition: fill 0.12s ease;
    }
    .tgb-cass-screw-slot {
      stroke: #322b22;
      stroke-width: 0.5;
      stroke-linecap: round;
      fill: none;
      pointer-events: none;
      transition: stroke 0.12s ease;
    }

    .tgb-cass-key {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    @media (prefers-reduced-motion: reduce) {

    }
    .tgb-cass-key:focus { outline: none; }
    .tgb-cass-key:focus-visible { outline: none; }

    body.home-page .sx-modal .sx-panel {

      background: transparent;
      box-shadow: none;
    }

    .tgb-cass-stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: min(600px, 100%);
      margin: 0 auto;
      min-height: 260px;
    }
    .tgb-cass-mount {
      position: relative;
      z-index: 1;
      min-width: 0;
      filter: drop-shadow(7px 9px 0 rgba(2, 4, 10, 0.9));
      transition: transform 0.18s ease;
    }
    .tgb-cass-mount svg {
      display: block;
      width: 100%;
      height: auto;
      cursor: -webkit-grab; cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }
    .tgb-cass-mount.is-seeking { transform: none; }
    .tgb-cass-mount.is-seeking svg { cursor: -webkit-grabbing; cursor: grabbing; }
    .tgb-cass-mount.nudge-prev { transform: translateX(-6px) rotate(-0.6deg); }
    .tgb-cass-mount.nudge-next { transform: translateX(6px) rotate(0.6deg); }

    .tgb-cass svg text { pointer-events: none; }
    .tgb-cass-body { fill: var(--tgb-stripe-body, #16323a); stroke: var(--tgb-stripe-body, #16323a); }
    .tgb-cass-bottom { fill: var(--tgb-stripe, #2a5a66); }
    .tgb-cass-center { fill: var(--tgb-stripe-body, #16323a); stroke: var(--tgb-stripe-body, #16323a); }
    .tgb-cass-label-bg { fill: #f3ede0; }
    .tgb-cass-hole { fill: #000000; }
    .tgb-cass-line { stroke: #bcb3a3; stroke-width: 0.25; }
    .tgb-cass-gear { fill: none; }
    .tgb-cass-tooth { stroke: var(--tgb-stripe, #2a5a66); }
    .tgb-cass-hub { transform-box: fill-box; transform-origin: center; }
    .tgb-cass-spool { fill: #14110d; transform-box: fill-box; transform-origin: center; }
    .tgb-cass-btn { fill: #eee7d6; cursor: pointer; transition: fill 0.12s ease; }

    .tgb-cass-btn:focus,
    .tgb-cass-btn:focus-visible { outline: none; }
    .tgb-cass-btn:hover,
    .tgb-cass-btn:focus-visible { fill: #ffffff; }

    .tgb-cass-btn:focus-visible .tgb-cass-hole { stroke: #eee7d6; stroke-width: 0.5; }

      function readVar(el, name) {

        var mount = modal.querySelector('.tgb-cass-mount');
        if (!mount) return;
        var accent = (card && readVar(card, '--city-accent')) || '';
        if (!/^#?[0-9a-fA-F]{3,6}$/.test(accent)) accent = '#2a5a66';
        if (accent[0] !== '#') accent = '#' + accent;
        mount.style.setProperty('--tgb-accent', accent);
        mount.style.setProperty('--tgb-accent-dark', shade(accent, -0.34) || '#16323a');
      }

      function cssColorToHex(str) {
        var m = String(str || '').match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        var parts = m[1].split(',').map(function (s) { return parseFloat(s); });
        if (parts.length > 3 && !(parts[3] > 0)) return null;
        var hx = function (c) { return ('0' + Math.max(0, Math.min(255, Math.round(c || 0))).toString(16)).slice(-2); };
        return '#' + hx(parts[0]) + hx(parts[1]) + hx(parts[2]);
      }

      function resolveVarColor(card, name) {
        if (!card) return null;
        var probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(' + name + ',transparent);';
        card.appendChild(probe);
        var c = getComputedStyle(probe).color;
        card.removeChild(probe);
        return cssColorToHex(c);
      }

      function applyStripes(card) {

          || resolveVarColor(card, '--case-stripe')
          || resolveVarColor(card, '--city-accent')
          || '#f5b461';
        var ramp = [0.42, 0.2, 0, -0.2, -0.42];
        for (var i = 0; i < cass.stripes.length; i++) {
          cass.stripes[i].setAttribute('fill', shade(base, ramp[i]) || base);

        var mount = modal.querySelector('.tgb-cass-mount');
        if (mount) {
          mount.style.setProperty('--tgb-stripe', base);
          mount.style.setProperty('--tgb-stripe-body', shade(base, -0.32) || base);
        }
      }

      function renderModal() {
        if (!modal || !state.songs.length) return;
        var song = state.songs[state.index];
        applyCassetteAccent(state.card);
        applyStripes(state.card);
        state.duration = 0;
        state.position = 0;
        state.maxPos = 0;
        updateSpotifyMark();
        state.autoAdvanced = false;
        updateSpools(0);
        renderPlayer(song);
        var artToken = ++artRenderToken;
        if (cass) {
          fitText(cass.artist, song.artist, 78);

          fitText(cass.title, song.title, song.explicit ? 56 : 80);
          fitText(cass.blurb, song.blurb || '', 82);
          setExplicitBadge(song.explicit);
          updateBrandLine();
          loadAlbumArt(song, artToken);
        }

        setSpotifyLink(song.href);
        updatePlaybackUi();
        schedulePreloadNext();
        saveCassetteSession(true);
      }

      function openCard(card, opts) {
        modal = modal || buildModal();
        modal.querySelector('.sx-panel').classList.remove('sx-empty');
        state.pendingCity = '';
        state.card = card;

        state.songs = shuffled(songsFor(card));
        var cleanAt = (opts && opts.clean) ? firstCleanPlayableIndex(state.songs) : -1;
        state.index = cleanAt >= 0 ? cleanAt : firstPlayableIndex(state.songs);

        state.playing = false;
        state.wantAutoplay = !(opts && opts.silent);
        cards.forEach(function (item) { item.classList.toggle('is-playing', item === card); });
        modal.hidden = false;

        if (window.TgbCassette) window.TgbCassette.handoff();
        minimized = false;

        if (!modal.classList.contains('sx-modal--inline')) {

      }

      function closeModal() {
        if (!modal) return;
        modal.hidden = true;
        minimized = false;
        closeArtLightbox();
        clearPreload();
        destroyActivePlayer();
        state.playing = false;
        state.wantAutoplay = false;
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        document.body.style.overflow = '';
        updatePlaybackUi();

        if (window.TgbCassette) window.TgbCassette.clear();
      }

      function stopPlayback() {
        if (!modal) return;
        if (!modal.classList.contains('sx-modal--inline')) { closeModal(); return; }
        closeArtLightbox();
        clearPreload();
        destroyActivePlayer();
        state.playing = false;
        state.wantAutoplay = false;
        updatePlaybackUi();
      }

      function setMinimized(on) {
        if (!on) { expandFromCase(); return; }
        if (!modal || modal.hidden) return;

        if (modal.classList.contains('sx-modal--inline')) {
          pauseSpotifyPlayer();
          state.playing = false;
          state.wantAutoplay = false;
          updatePlaybackUi();
          saveCassetteSession(true);
          return;
        }

        state.playing = false;
        saveCassetteSession(true);
        modal.hidden = true;
        minimized = true;
        document.body.style.overflow = '';
        closeArtLightbox();
        clearPreload();
        destroyActivePlayer();
        updatePlaybackUi();
        mountMiniCase();
      }

      function mountMiniCase() {
        if (!window.TgbCassette) return;

      }

      function expandFromCase() {
        if (!window.TgbCassette) return;
        var session = window.TgbCassette.handoff();
        minimized = false;
        if (!session || !session.city) return;
        var card = cardForCity(session.city);
        if (!card) return;
        openCard(card);
        var wanted = (session.songs[session.index] || {}).href;
        for (var i = 0; i < state.songs.length; i++) {
          if (state.songs[i].href === wanted) { state.index = i; break; }
        }
        state.resumeAt = Math.max(0, Number(session.position) || 0);
        state.wantAutoplay = !!session.playing;
        renderModal();
      }

      function cassetteSessionPayload() {
        var mount = modal && modal.querySelector('.tgb-cass-mount');
        return {
          songs: state.songs.map(function (song) {

            return { href: song.href, title: song.title, artist: song.artist, blurb: song.blurb };
          }),
          index: state.index,
          position: state.position || 0,
          duration: state.duration || 0,
          playing: !!state.playing,
          city: currentCityLabel(),
          accent: (mount && mount.style.getPropertyValue('--tgb-accent').trim()) || '',
          artUrl: state.artUrl || ''
        };
      }

      var sessionSaveAt = 0;
      function saveCassetteSession(force) {
        if (!window.TgbCassette || !modal || modal.hidden || !state.songs.length) return;
        var now = new Date().getTime();
        if (!force && now - sessionSaveAt < 1000) return;
        sessionSaveAt = now;
        window.TgbCassette.write(cassetteSessionPayload());
      }

      function autoAdvanceNext() {
        if (state.songs.length < 2) return;
        var newIndex = (state.index + 1) % state.songs.length;
        state.playing = true;
        promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        renderModal();
      }

      function step(delta) {
        if (!state.songs.length) return;
        var wasPlaying = state.playing;
        var newIndex = (state.index + delta + state.songs.length) % state.songs.length;

        if (delta > 0 && wasPlaying) promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        state.playing = wasPlaying;
        renderModal();
      }

      function slugSeed(str) {
        var h = 0;
        for (var i = 0; i < str.length; i += 1) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        return h;
      }

      function jitterTitle(card, title) {
        if (!title) return;
        var seed = slugSeed(card.id || title.textContent || 'city');
        var tilt = ((seed % 200) / 100) - 1;
        title.style.transform = 'rotate(' + tilt.toFixed(2) + 'deg)';
      }

      function buildSupabaseUrl(table, params) {
        var pairs = [];
        Object.keys(params || {}).forEach(function (key) {
          if (params[key] == null) return;
          pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
        });

      function slugify(value) {

          .replace(/&/g, ' and ')

      }

      function citySlug(row) {
        return slugify(row && (row.slug || row.city_slug || row.city || row.city_name));
      }

      function cityLabel(row) {
        if (!row) return '';
        if (row.city) return String(row.city).trim();
        if (window.TgbGeo && typeof window.TgbGeo.composeGeo === 'function') {
          return window.TgbGeo.composeGeo(row) || row.city_name || '';
        }
        return row.city_name || '';
      }

      function cityShortLabel(row) {
        var stem = (row && row.city_name) || '';
        if (stem) return String(stem).trim();
        return cityLabel(row).split(',')[0].trim();
      }

      function songHref(song) {
        if (song && song.spotifyId) return 'https://open.spotify.com/track/' + encodeURIComponent(song.spotifyId);
        return 'https://open.spotify.com/search/' + encodeURIComponent(((song && song.artist) || '') + ' ' + ((song && song.title) || ''));
      }

      function normalizedSong(song) {
        return {
          href: songHref(song),
          title: (song && song.title) || 'Track',
          artist: (song && song.artist) || 'Spotify',
          blurb: (song && song.blurb) || '',
          explicit: !!(song && song.explicit)
        };
      }

      function appendText(parent, cls, value) {
        var span = document.createElement('span');
        span.className = cls;
        span.textContent = value || '';
        parent.appendChild(span);
        return span;
      }

      function createSongItem(song) {
        var item = document.createElement('li');
        var link = document.createElement('a');
        link.className = 'song-link';
        link.href = song.href;
        link.target = '_blank';
        link.rel = 'noopener';
        if (song.explicit) link.dataset.explicit = '1';
        var main = document.createElement('span');
        main.className = 'song-main';
        appendText(main, 'song-title', song.title);
        appendText(main, 'song-artist', song.artist);
        link.appendChild(main);
        appendText(link, 'song-blurb', song.blurb);
        appendText(link, 'song-play', 'Play');
        item.appendChild(link);
        return item;
      }

      function truthyFlag(value) {

      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);

      function soundtrackTracks(soundtrack) {
        return ((soundtrack && Array.isArray(soundtrack.songs)) ? soundtrack.songs : [])
          .filter(function (song) {
            return song && !isArchivedSong(song) && (song.spotifyId || song.title || song.artist || song.href);
          });
      }

      function soundtrackTrackCount(soundtrack) {
        return soundtrackTracks(soundtrack).length;
      }

      function soundtrackSpineTitle(cityTitle, soundtrack) {
        var title = String(cityTitle || '').trim();
        var tag = String((soundtrack && soundtrack.spine_tag) || '').trim();
        if (!tag) return title;
        var position = String((soundtrack && soundtrack.spine_tag_position) || 'after').toLowerCase();
        return position === 'before' ? (tag + ' ' + title).trim() : (title + ' ' + tag).trim();
      }

      function createTapeCard(city, soundtrack) {
        var slug = citySlug(city);
        var label = cityLabel(city);
        var displayLabel = cityShortLabel(city) || label;
        var spineTitle = soundtrackSpineTitle(displayLabel, soundtrack);
        var article = document.createElement('article');
        article.className = 'playlist-card';
        article.id = slug;
        article.dataset.citySlug = slug;
        article.dataset.location = label;
        article._tgbSongs = soundtrackTracks(soundtrack).map(normalizedSong);

        var body = document.createElement('div');
        body.className = 'playlist-body';
        var heading = document.createElement('div');
        heading.className = 'playlist-heading';
        var title = document.createElement('h2');
        title.className = 'playlist-title';
        title.textContent = spineTitle;
        heading.appendChild(title);
        var list = document.createElement('ol');
        list.className = 'song-list';
        article._tgbSongs.forEach(function (song) { list.appendChild(createSongItem(song)); });
        body.append(heading, list);
        article.appendChild(body);
        return article;
      }

      function wireCard(card) {
        var title = card.querySelector('.playlist-title');
        var label = title ? title.textContent.trim() : 'city';
        jitterTitle(card, title);
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', 'Play ' + label + ' tape');
        card.addEventListener('click', function () { openCard(card); });
        card.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCard(card);
          }
        });
      }

      function indexCards() {
        cardByCity = {};
        cards.forEach(function (card) {
          var byKey = String(card.id || '').toLowerCase();
          if (byKey && !cardByCity[byKey]) cardByCity[byKey] = card;
          var title = card.querySelector('.playlist-title');
          var byTitle = normCityKey(title ? title.textContent : '');
          var byLocation = normCityKey(card.getAttribute('data-location') || '');
          var bySlug = String(card.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          if (byTitle && !cardByCity[byTitle]) cardByCity[byTitle] = card;
          if (byLocation && !cardByCity[byLocation]) cardByCity[byLocation] = card;
          if (bySlug && !cardByCity[bySlug]) cardByCity[bySlug] = card;
        });
      }

      function cardForTapeKey(key) {
        return cardByCity[String(key || '').toLowerCase()] || null;
      }

      function renderSoundGrid(cities) {
        if (!grid) return;
        var withTapes = cities
          .map(function (city) {
            var slug = citySlug(city);
            return { city: city, soundtrack: soundtracksBySlug[slug] || null };
          })
          .filter(function (entry) { return soundtrackTrackCount(entry.soundtrack) > 0; });

        grid.innerHTML = '';
        if (!withTapes.length) {
          var empty = document.createElement('p');
          empty.className = 'sound-grid-status';
          empty.textContent = 'No city tapes are available yet.';
          grid.appendChild(empty);
          cards = [];
          indexCards();
          return;
        }
        withTapes.forEach(function (entry) { grid.appendChild(createTapeCard(entry.city, entry.soundtrack)); });

        cards.forEach(wireCard);
        indexCards();
      }

      function normCityKey(str) {
        return String(str || '').split(',')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
      }
      function cardForCity(cityStr) {
        return cardByCity[normCityKey(cityStr)] || null;
      }

      function openNoSoundtrack(cityLabel) {
        modal = modal || buildModal();
        var panel = modal.querySelector('.sx-panel');
        state.card = null;
        state.songs = [];
        state.index = 0;
        state.playing = false;
        state.pendingCity = cityLabel || '';
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        panel.classList.add('sx-empty');

        clearPreload();
        destroyActivePlayer();
        var wrap = modal.querySelector('.tgb-cass');
        if (wrap) wrap.classList.remove('is-playing');
        applyCassetteAccent(null);
        applyStripes(null);
        state.duration = 0;
        state.position = 0;
        updateSpools(0);
        if (cass) {
          fitText(cass.artist, cityLabel || '', 78);
          fitText(cass.title, 'No soundtrack yet', 80);
          fitText(cass.blurb, 'Be the first — suggest a track', 82);
          setExplicitBadge(false);
          updateBrandLine();
          clearArt();
        }
        updateSuggestLabel();
        var host = modal.querySelector('.sx-player-host');
        host.textContent = '';
        setSpotifyLink('');
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        updatePlaybackUi();
      }

      function openTapeEntry(entry) {
        var card = entry && entry.key ? cardForTapeKey(entry.key) : null;
        if (card) openCard(card);
        else openCityByName(entry && entry.city, entry && (entry.label || entry.city));
      }

      function openCityByName(cityStr, displayLabel) {
        var card = cardForCity(cityStr);
        if (card) openCard(card);
        else openNoSoundtrack(displayLabel || cityStr);
      }

      function displayNameFromSlug(slug) {
        var special = {
          'rio-de-janeiro': 'Rio de Janeiro',
          'saint-denis': 'Saint-Denis',
          'st-louis': 'St. Louis',
          'washington-dc': 'Washington, D.C.'
        };
        if (special[slug]) return special[slug];
        return String(slug || '')
          .split('-')
          .filter(Boolean)
          .map(function (part) {
            return part.length <= 2 ? part.toUpperCase() : part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');
      }

      // THE CITY ROWS ARE BUILT FROM THE TAPES. `public.soundtrack` carries its
      // own `city`, `state_code` and `country_code` as of 2026-08-25, so this
      // page reads no city table at all: one fewer request, and a tape can name
      // a city the catalogue has never held.
      //
      // `displayNameFromSlug` is the last resort only, for a row filed before
      // the label existed. A stored label always wins.
      function cityRowsFromSoundtracks(soundtracks) {
        return (soundtracks || [])
          .filter(function (tracklist) { return tracklist && tracklist.city_slug && soundtrackTrackCount(tracklist) > 0; })
          .map(function (tracklist, index) {
            var label = String((tracklist && tracklist.city) || '').trim()
              || displayNameFromSlug(tracklist.city_slug);
            return {
              slug: tapeKey(tracklist),
              city: label,
              label: label,
              city_name: label,
              state_code: tracklist.state_code || '',
              country_code: tracklist.country_code || '',
              sort_order: index + 1
            };
          });
      }

      function indexSoundtracks(data) {
        var soundtracks = Array.isArray(data && data.soundtracks) ? data.soundtracks : [];
        soundtracksBySlug = {};
        soundtracks.forEach(function (tracklist) {
          var key = tapeKey(tracklist);
          if (key) soundtracksBySlug[key] = tracklist;
        });

      }

      function tapeKey(tracklist) {
        if (!tracklist) return '';
        return slugify(tracklist.key || tracklist.city_slug);

      function fetchAllRows(url) {
        var PAGE = 1000;
        var all = [];
        function page(from) {
          return fetch(url, {
            headers: Object.assign({}, SB_HEADERS, {
              Range: from + '-' + (from + PAGE - 1)

            cache: 'no-store'
          }).then(function (response) {
            if (!response.ok) throw new Error('Request failed: ' + response.status + ' ' + url);
            return response.json();
          }).then(function (rows) {
            var list = Array.isArray(rows) ? rows : [];
            all = all.concat(list);
            if (list.length < PAGE) return all;
            return page(from + PAGE);
          });
        }
        return page(0);

      function soundtracksFromRows(tapeRows) {
        // ONE TABLE, ONE ROW PER TRACK. The tape is (city_slug, tape) and the
        // cards are grouped out of the tracks here.
        //
        // A TAPE IS SHELVED WHEN EVERY TRACK ON IT IS. There is no tape row to
        // carry the flag; a tape whose tracks are all archived simply produces
        // no live songs and is dropped below, which is what shelving did.
        var byTape = {};
        var order = [];
        var seenCity = {};
        (Array.isArray(tapeRows) ? tapeRows : []).forEach(function (row) {
          var slug = slugify(row && row.city_slug);
          if (!slug) return;
          var name = String((row && row.tape) || '').trim();
          var pairKey = JSON.stringify([slug, name]);
          var tape = byTape[pairKey];
          if (!tape) {

            // still lands. Later tapes take the tape's own name, which is stable
            // and readable -- the surrogate id it used to borrow is gone.
            var key = seenCity[slug] ? (slug + '--' + slugify(name)) : slug;
            seenCity[slug] = true;

              key: key,
              city_slug: row.city_slug,
              spine_tag: name,
              spine_tag_position: row.tape_label_position || '',
              songs: []
            };
            order.push(pairKey);
          }
          tape.songs.push({
            position: Number(row.position) || 0,
            id: row.id,
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || '',
            spotifyId: row.spotify_id || '',
            explicit: !!row.explicit,
            archived: !!row.archived
          });
        });

        order.forEach(function (pairKey) {
          byTape[pairKey].songs.sort(function (a, b) {
            return (a.position - b.position) || (Number(a.id) - Number(b.id));
          });
        });
        return { soundtracks: order.map(function (pairKey) { return byTape[pairKey]; }) };
      }

      function fetchSoundtracks() {
        return Promise.all([

          // NAMED COLUMNS, NOT `*`, AND THIS IS A PRIVACY BOUNDARY RATHER THAN
          // TIDINESS. Audit findings were folded onto these rows on 2026-08-25,
          // and a finding is an INTERNAL editorial note -- "this song has no
          // real tie to the city". They were admin-read only as their own
          // table and stay admin-read as a column: `anon` holds a per-column
          // grant that excludes `findings`, so `select=*` now answers 42501
          // permission denied for the whole request.
          //
          // **Do not put `*` back.** Add a column here when the page needs one.
          fetchAllRows(buildSupabaseUrl('soundtrack', {
            select: 'id,city_slug,city,state_code,country_code,tape,tape_label_position,position,title,artist,blurb,spotify_id,explicit,archived',
            // A SHELVED TRACK NEVER LEAVES THE DATABASE, so the filter is here
            // rather than in the grouping: it halves what crosses the wire and
            // a tape with nothing live then has no rows at all.
            archived: 'eq.false',
            order: 'city_slug.asc,tape.asc,position.asc,id.asc'
          }))
        ]).then(function (results) {
          var data = soundtracksFromRows(results[0]);
          if (!data.soundtracks.length) throw new Error('No soundtrack rows returned.');
          return data;
        });

      }

      function setSoundHeroTitle(count) {
        if (!soundHeroTitleEl) return;
        var n = Math.max(0, Math.round(Number(count) || 0));

        soundHeroTitleEl.textContent = '';
        var line = function (value) {
          var span = document.createElement('span');
          span.className = 'hero-headline-line';
          span.textContent = value;
          soundHeroTitleEl.appendChild(span);
        };
        if (n) line(String(n));
        line(n === 1 ? 'Soundtrack' : 'Soundtracks');
      }

      function tapeKeysForCity(slug) {
        var keys = [];
        Object.keys(soundtracksBySlug).forEach(function (key) {
          if (slugify(soundtracksBySlug[key].city_slug) === slug) keys.push(key);
        });
        return keys;
      }

      function setCityEntries(rows, allowSoundtrackSlugFallback) {
        var seen = {};
        var rowsList = Array.isArray(rows) ? rows : [];

        var rowsWithSoundtracks = [];
        rowsList.forEach(function (row) {

          // NO `hide_from_soundtracks` TEST. That flag lives on public.cities,
          // which this page no longer reads. Nothing is lost in practice: a tape
          // only reaches this page when a human has put a track live on it, so
          // the decision is already made by hand further upstream.
          var slug = citySlug(row);
          if (!slug || seen[slug]) return;
          seen[slug] = true;
          tapeKeysForCity(slug).forEach(function (key) {
            if (soundtrackTrackCount(soundtracksBySlug[key]) <= 0) return;

            var entry = Object.assign({}, row, { slug: key });
            seen[key] = true;
            rowsWithSoundtracks.push(entry);
          });
        });
        if (allowSoundtrackSlugFallback) {
          Object.keys(soundtracksBySlug).forEach(function (slug) {
            var tracklist = soundtracksBySlug[slug];
            if (!slug || seen[slug] || soundtrackTrackCount(tracklist) <= 0) return;
            var label = displayNameFromSlug((tracklist && tracklist.city_slug) || slug);
            seen[slug] = true;
            rowsWithSoundtracks.push({
              slug: slug,
              city: label,
              label: label,
              city_name: label
            });
          });
        }
        cityEntries = rowsWithSoundtracks

          .sort(function (a, b) {
            return cityShortLabel(a).localeCompare(cityShortLabel(b), undefined, { sensitivity: 'base', numeric: true })
              || cityLabel(a).localeCompare(cityLabel(b), undefined, { sensitivity: 'base' });
          });
        setSoundHeroTitle(cityEntries.length);
        renderSoundGrid(cityEntries);
        setupListenCityPanel();

        if (!openCardFromHash()) openRandomCard();
      }

      function loadSoundPageData() {
        fetchSoundtracks()
          .then(function (data) {
            var soundtracks = indexSoundtracks(data || {});

            // NO SECOND REQUEST. Everything the rail needs is on the tracks.
            setCityEntries(cityRowsFromSoundtracks(soundtracks), true);
          })
          .catch(function (error) {
            console.error(error);
            if (statusEl) statusEl.textContent = 'Could not load soundtracks.';
          });
      }

      function setupListenCityPanel() {
        var panel = document.getElementById('listenCityPanel');
        if (!panel) return;

        var searchEntries = [];

        function chipCount(entry) {
          return entry.hasTape ? (entry.count + ' track' + (entry.count === 1 ? '' : 's')) : 'Add one';
        }

        function setupSearch() {
          var wrap = document.getElementById('lcSearch');
          var input = document.getElementById('lcSearchInput');
          var toggle = document.getElementById('lcSearchToggle');
          var results = document.getElementById('lcSearchResults');
          if (!wrap || !input || !toggle || !results) return;
          document.body.appendChild(results);
          var matches = [];
          var activeIndex = -1;
          var norm = function (s) { return String(s || '').toLowerCase().trim(); };

          function positionResults() {
            if (results.hidden) return;
            var r = input.getBoundingClientRect();
            results.style.top = (r.bottom + 8) + 'px';
            results.style.right = (window.innerWidth - r.right) + 'px';
            results.style.left = 'auto';
          }
          window.addEventListener('scroll', positionResults, true);
          window.addEventListener('resize', positionResults);

          function openSearch() {
            wrap.classList.add('is-open');
            toggle.setAttribute('aria-expanded', 'true');
            input.setAttribute('aria-expanded', 'true');
            input.tabIndex = 0;
            input.focus();
          }
          function hideResults() {
            results.hidden = true;
            results.innerHTML = '';
            matches = [];
            activeIndex = -1;
            panel.classList.remove('is-searching');
          }
          function closeSearch() {
            wrap.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            input.setAttribute('aria-expanded', 'false');
            input.tabIndex = -1;
            input.value = '';
            hideResults();
          }
          function go(entry) {
            if (!entry) return;
            closeSearch();

            openTapeEntry(entry);
          }
          function setActive(i) {
            activeIndex = i;
            Array.prototype.forEach.call(results.querySelectorAll('.lc-search-result'), function (el, idx) {
              var on = idx === i;
              el.classList.toggle('is-active', on);
              el.setAttribute('aria-selected', on ? 'true' : 'false');
              if (on) el.scrollIntoView({ block: 'nearest' });
            });
          }
          function render() {
            var q = norm(input.value);
            if (!q) { hideResults(); return; }
            matches = searchEntries.filter(function (e) {
              return norm(e.label).indexOf(q) !== -1 || norm(e.city).indexOf(q) !== -1;
            }).slice(0, 8);
            activeIndex = matches.length ? 0 : -1;
            results.innerHTML = '';
            if (!matches.length) {
              var empty = document.createElement('div');
              empty.className = 'lc-search-empty';
              empty.textContent = 'No cities match “' + input.value.trim() + '”.';
              results.appendChild(empty);
            } else {
              matches.forEach(function (entry, i) {
                var a = document.createElement('button');
                a.type = 'button';
                a.className = 'lc-search-result' + (i === activeIndex ? ' is-active' : '');
                a.setAttribute('role', 'option');
                a.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');
                var name = document.createElement('span');
                name.className = 'lc-search-result-name';
                name.textContent = entry.label;
                var count = document.createElement('span');
                count.className = 'lc-search-result-count';
                count.textContent = chipCount(entry);
                a.append(name, count);
                a.addEventListener('mouseenter', function () { setActive(i); });
                a.addEventListener('click', function () { go(entry); });
                results.appendChild(a);
              });
            }
            results.hidden = false;
            positionResults();
            panel.classList.add('is-searching');
          }

          toggle.addEventListener('click', function () {
            if (wrap.classList.contains('is-open')) closeSearch();
            else openSearch();
          });
          input.addEventListener('input', render);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { e.preventDefault(); closeSearch(); toggle.focus(); return; }
            if (!matches.length) { if (e.key === 'Enter') e.preventDefault(); return; }
            if (e.key === 'ArrowDown') { e.preventDefault(); setActive((activeIndex + 1) % matches.length); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((activeIndex - 1 + matches.length) % matches.length); }
            else if (e.key === 'Enter') { e.preventDefault(); go(matches[Math.max(0, activeIndex)]); }
          });
          document.addEventListener('click', function (e) {
            if (wrap.contains(e.target) || results.contains(e.target)) return;
            if (wrap.classList.contains('is-open')) closeSearch();
          });
        }

        function buildEntry(row) {
          var city = cityLabel(row);
          var key = citySlug(row);
          var soundtrack = soundtracksBySlug[key] || null;
          var shortLabel = cityShortLabel(row) || city;

          var spine = String((soundtrack && soundtrack.spine_tag) || '').trim();
          var pos = String((soundtrack && soundtrack.spine_tag_position) || '').trim();

          var label = !spine ? shortLabel
            : (pos === 'before' ? (spine + ' ' + shortLabel) : (shortLabel + ' ' + spine));
          return {
            city: city,
            key: key,
            label: label,
            row: row,
            hasTape: !!cardForTapeKey(key),
            count: soundtrackTrackCount(soundtrack)
          };
        }

        setupSearch();
        var entries = cityEntries.map(buildEntry).filter(function (e) { return e.city; });
        if (!entries.length) return;
        searchEntries = entries;
      }

      function openRandomCard() {
        var playable = cards.filter(function (card) {
          return songsFor(card).length > 0;
        });
        if (!playable.length) return false;

        var clean = playable.filter(function (card) {
          return firstCleanPlayableIndex(songsFor(card)) >= 0;
        });
        var pool = clean.length ? clean : playable;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        openCard(pick, { clean: true, silent: true });
        return true;
      }

      function citySlugFromHash() {
        var raw = String(window.location.hash || '').replace(/^#/, '');
        if (!raw) return '';
        try { raw = decodeURIComponent(raw); } catch (e) {}
        return raw;
      }

      function openCardFromHash() {
        var wanted = citySlugFromHash();
        if (!wanted) return false;

        var card = cardForCity(wanted);
        if (!card) return false;
        try {
          card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } catch (error) {
          card.scrollIntoView();
        }
        openCard(card);
        return true;
      }

      window.addEventListener('hashchange', openCardFromHash);

      loadSoundPageData();
    })();
  </script>
</body>
</html>
