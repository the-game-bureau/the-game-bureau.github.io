  <style>
    body.home-page {
      --ctl-radius: 8px;
      overflow-x: hidden;
    }

    body.home-page .sound-page {
      display: grid;
      gap: 28px;
      min-width: 0;
    }

    /* The hero is deliberately unstyled here: /soundtracks/ wears the same civic
       treatment as the Gift Shop and Games heroes straight from
       assets/civic-modernist-pages.css — photo background, white card panel with
       a blue top rule, 4rem uppercase headline. The hero photo ("a pile of
       colorful cassette tapes" by Igor Omilaev on Unsplash — Unsplash License,
       free commercial use, no attribution required) is wired to this page by the
       body[data-admin-page="sound"] selector in that stylesheet. */

    body.home-page .sound-grid-wrap {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    body.home-page .playlist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px 20px;
      align-items: start;
      width: min(1120px, 100%);
      margin-inline: auto;
      padding-inline: 4px;
    }

    body.home-page .playlist-card {
      --city-accent: #f5b461;
      --city-secondary: #4aa8cf;
      --case-shell: #151923;
      --case-spine: #10141d;
      --case-stripe: var(--city-accent);
      --case-stripe-right: var(--case-stripe);
      --label-bg: #fffdf7;
      --case-ink: #0b1322;
      --case-offset: 0px;
      --case-tilt: -0.4deg;
      position: relative;
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      aspect-ratio: 6.55 / 1;
      overflow: hidden;
      border: 1px solid rgba(3, 5, 12, 0.95);
      border-radius: 2px;
      background:
        linear-gradient(180deg, #252b38 0%, #151b26 42%, #0a0e16 100%),
        var(--case-shell);
      color: var(--case-ink);
      box-shadow:
        2px 3px 0 rgba(3, 5, 13, 0.95),
        0 8px 18px rgba(2, 4, 12, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      cursor: pointer;
      scroll-margin-top: 18px;
      transform: translateX(var(--case-offset)) rotate(var(--case-tilt));
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }

    /* Spine colours. Three of the six are sampled from the shells in the hero
       photograph — blue #5570d8, red #c8503a and yellow #dec348 are the median
       lit values of those cassettes, nudged up a touch in chroma so an 8px
       stripe still reads as a colour rather than as grime. Orange, lavender and
       green are the original palette, kept for spread. */
    body.home-page .playlist-card:nth-child(6n + 1) { --case-stripe: #ff9f43; }
    body.home-page .playlist-card:nth-child(6n + 2) { --case-offset: 2px; --case-tilt: 0.25deg; --case-stripe: #5570d8; }
    body.home-page .playlist-card:nth-child(6n + 3) { --case-offset: -1px; --case-tilt: -0.65deg; --case-stripe: #cda7ff; }
    body.home-page .playlist-card:nth-child(6n + 4) { --case-offset: 3px; --case-tilt: 0.45deg; --case-stripe: #68f27d; }
    body.home-page .playlist-card:nth-child(6n + 5) { --case-offset: -2px; --case-tilt: -0.2deg; --case-stripe: #c8503a; }
    body.home-page .playlist-card:nth-child(6n) { --case-offset: 1px; --case-tilt: 0.15deg; --case-stripe: #dec348; }
    body.home-page .playlist-card:nth-child(4n + 1) { --label-bg: #fffdf7; }
    body.home-page .playlist-card:nth-child(4n + 2) { --label-bg: #fff6df; }
    body.home-page .playlist-card:nth-child(4n + 3) { --label-bg: #ffffff; }
    body.home-page .playlist-card:nth-child(4n) { --label-bg: #f4f8fb; }
    body.home-page .playlist-card#minneapolis { --case-stripe: #8b5cf6; }

    body.home-page .playlist-card::before {
      display: none;
    }

    body.home-page .playlist-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 2px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0 1px, transparent 1px calc(100% - 1px), rgba(0, 0, 0, 0.28) calc(100% - 1px) 100%),
        linear-gradient(105deg, transparent 0 18%, rgba(255, 255, 255, 0.14) 18% 19%, transparent 19% 100%);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
    }

    body.home-page .playlist-card:hover,
    body.home-page .playlist-card:focus-visible,
    body.home-page .playlist-card.is-playing {
      border-color: var(--case-stripe);
      box-shadow:
        2px 3px 0 rgba(3, 5, 13, 0.95),
        0 0 0 1px var(--case-stripe),
        0 10px 20px rgba(2, 4, 12, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.42);
      outline: none;
      transform: translate(calc(var(--case-offset) - 1px), -1px) rotate(var(--case-tilt));
    }

    body.home-page .playlist-body {
      position: relative;
      z-index: 2;
      height: 100%;
      box-sizing: border-box;
      padding: 6px 7px;
    }

    body.home-page .playlist-body::before {
      display: none;
    }

    body.home-page .playlist-body::after {
      display: none;
    }

    body.home-page .playlist-heading {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      padding: 5px 22px;
      border: 1px solid #060816;
      border-radius: 1px;
      background:
        linear-gradient(90deg, var(--case-stripe) 0 8px, var(--label-bg) 8px calc(100% - 8px), var(--case-stripe-right) calc(100% - 8px) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    body.home-page .playlist-heading::before {
      content: "";
      position: absolute;
      inset: 1px 9px;
      z-index: 1;
      border-radius: 1px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.16) 32%, transparent 66%),
        linear-gradient(103deg, transparent 0 34%, rgba(255, 255, 255, 0.28) 34% 36%, transparent 36% 100%);
      opacity: 0.38;
      pointer-events: none;
    }

    body.home-page .playlist-heading::after {
      display: none;
    }

    body.home-page .playlist-title {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      max-width: none;
      margin: 0;
      color: var(--case-ink);
      font-family: "Reenie Beanie", cursive;
      font-size: 1.5rem;
      font-weight: 700;
      /* Reenie Beanie sits low with tall ascenders/descenders — a roomy
         line-height keeps the glyphs off the clip edges of the label. */
      line-height: 1.3;
      letter-spacing: 0;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.36);
      text-transform: none;
      transform: rotate(-0.5deg);
      transform-origin: center;
      justify-self: stretch;
      margin: 0 !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    body.home-page .playlist-card:nth-child(6n + 1) .playlist-title { color: #07101f; font-size: 1.56rem; }
    body.home-page .playlist-card:nth-child(6n + 2) .playlist-title { color: #0d3c49; font-size: 1.46rem; }
    body.home-page .playlist-card:nth-child(6n + 3) .playlist-title { color: #3d193f; font-size: 1.54rem; }
    body.home-page .playlist-card:nth-child(6n + 4) .playlist-title { color: #385114; font-size: 1.42rem; }
    body.home-page .playlist-card:nth-child(6n + 5) .playlist-title { color: #15345a; font-size: 1.58rem; }
    body.home-page .playlist-card:nth-child(6n) .playlist-title { color: #68233f; font-size: 1.5rem; }

    body.home-page .song-list { display: none !important; }

    body.home-page .sound-grid-status {
      grid-column: 1 / -1;
      min-height: 160px;
      margin: 0;
      display: grid;
      place-items: center;
      border: 2px solid #28344a;
      background: rgba(9, 14, 25, 0.78);
      color: rgba(243, 238, 220, 0.7);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      line-height: 1.5;
      text-align: center;
    }

    /* ── LISTEN BY CITY: spyglass search + auto-scrolling city rail ──────────
       Mirrors the shop's "Shop By City" component, tuned to the sound page's
       dark / pixel aesthetic. Picking a city (dropdown OR rail chip) opens the
       cassette popup for that city instead of navigating. */
    body.home-page .listen-city-panel {
      display: grid;
      gap: 4px;
      /* Match the hero's width: on body.home-page the hero is width:100% of the
         page-shell content box (site-shell.css). Fill the same track here. */
      width: 100%;
      margin-inline: auto;
      padding: 14px 16px 8px;
      border: 2px solid #28344a;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.86), rgba(8, 12, 22, 0.86));
    }
    body.home-page .listen-city-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 8px;
      border-bottom: 1px solid #28344a;
    }
    /* Matches the Gift Shop's "Shop By City" title. */
    body.home-page .listen-city-title {
      margin: 0;
      color: #f7f0dc;
      font-family: "Big Shoulders Display", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    /* Inconspicuous city search: a spyglass that expands into a field. */
    body.home-page .lc-search {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }
    body.home-page .lc-search-input {
      width: 0;
      min-width: 0;
      height: 34px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: rgba(8, 11, 17, 0);
      color: #f7f0dc;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transition: width 0.28s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.2s ease, padding 0.28s ease, border-color 0.2s ease, background 0.2s ease;
    }
    body.home-page .lc-search.is-open .lc-search-input {
      width: clamp(150px, 40vw, 240px);
      padding: 0 12px;
      opacity: 1;
      pointer-events: auto;
      border-color: #344154;
      background: rgba(8, 11, 17, 0.6);
    }
    body.home-page .lc-search-input::placeholder { color: rgba(247, 240, 220, 0.42); }
    body.home-page .lc-search.is-open .lc-search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    body.home-page .lc-search-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-left: 4px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: rgba(247, 240, 220, 0.6);
      cursor: pointer;
      transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    body.home-page .lc-search-toggle:hover,
    body.home-page .lc-search-toggle:focus-visible {
      color: #f7f0dc;
      background: rgba(255, 255, 255, 0.06);
      outline: none;
    }
    body.home-page .lc-search.is-open .lc-search-toggle { color: var(--accent); }
    body.home-page .lc-search-toggle svg { width: 17px; height: 17px; display: block; }
    /* Portaled to <body> and viewport-fixed (JS sets top/right) so it floats
       above the grid — the panel's backdrop would otherwise clip it. */
    body.home-page .lc-search-results {
      position: fixed;
      z-index: 3000;
      width: min(280px, 78vw);
      max-height: 264px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid #344154;
      border-radius: 10px;
      background: rgba(12, 16, 23, 0.98);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    body.home-page .lc-search-results[hidden] { display: none; }
    body.home-page .lc-search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--ctl-radius);
      background: transparent;
      color: #f7f0dc;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    body.home-page .lc-search-result:hover,
    body.home-page .lc-search-result.is-active { background: rgba(245, 180, 97, 0.16); }
    body.home-page .lc-search-result-name { flex: 1 1 auto; font-weight: 600; font-size: 0.9rem; }
    body.home-page .lc-search-result-count {
      flex: 0 0 auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(247, 240, 220, 0.55);
    }
    body.home-page .lc-search-empty {
      padding: 10px 12px;
      color: rgba(247, 240, 220, 0.55);
      font-size: 0.82rem;
    }
    body.home-page .listen-city-panel.is-searching {
      overflow: visible;
      position: relative;
      z-index: 60;
    }

    /* Horizontal auto-scrolling city rail (no scrollbar, infinite loop via 3
       cloned chunks, click-drag to swipe). */
    body.home-page .lc-list {
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      padding: 8px 0 12px;
      /* Reserve the rail's height before the cities load so nothing pops in. */
      min-height: 58px;
      -ms-overflow-style: none;
      cursor: -webkit-grab; cursor: grab;
    }
    body.home-page .lc-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body.home-page .lc-list.is-dragging { cursor: -webkit-grabbing; cursor: grabbing; }
    body.home-page .lc-list.is-dragging .hero-meta-list-item { cursor: -webkit-grabbing; cursor: grabbing; }
    body.home-page .lc-track {
      display: flex;
      flex-wrap: nowrap;
      width: max-content;
      gap: 8px;
    }
    body.home-page .lc-chunk {
      display: flex;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 8px;
    }
    /* THE HEADER IS AS TALL AS ITS CONTENTS.
       site-shell.css gives every home-page hero a min-height of clamp(620px..)
       and its grid another clamp(520px..). Those exist for the landing pages,
       where the hero is a full-bleed picture with copy floating in it. Here the
       header holds a headline and a cassette, and the two clamps between them
       pushed the tape's transport below the fold on a laptop.
       Scoped to .sound-header so the shared rule is untouched everywhere else. */
    body.home-page .hero.sound-header {
      min-height: 0;
      /* Tighter than the shared clamp(36px, 5vw, 64px). The header is a
         headline and a tape: the padding was adding 80px of nothing above and
         below a 300px cassette. */
      padding: clamp(16px, 1.6vw, 24px) clamp(20px, 2.4vw, 32px);
    }

    /* TWO EQUAL HALVES. Words left, tape right, and the split is even rather
       than content-sized: 1fr auto let the cassette set the divide, so the
       headline's column changed width whenever the tape did. Neither half is
       drawn; they only decide where the middle is. */
    /* main.sound-page IS LOAD-BEARING IN THIS SELECTOR. site-shell.css carries
       `body.home-page main.sound-page .hero-grid { grid-template-columns:
       minmax(0,1fr) }` -- a single column, aimed at this page specifically, from
       when the header was words only with the rail beneath. It outranks a
       selector without main.sound-page, so `1fr 1fr` was being ignored and the
       two halves came out 760 and 1128. */
    body.home-page main.sound-page .sound-header .hero-grid {
      min-height: 0;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: clamp(16px, 2vw, 28px);
    }

    /* ── THE DECK ─────────────────────────────────────────────────────────
       The player sits in the header, to the RIGHT of the title and centred
       against it. The hero was one column of words with an overlay waiting
       behind it; it is two columns now, and the second one is always playing.

       minmax(0, 1fr) on the words so a long title cannot shove the deck off
       the end, and auto on the deck so it takes exactly the cassette's width. */
    body.home-page .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
    }

    /* THE WORDS, CENTRED IN THEIR HALF, both ways. site-shell.css already
       centres this cell vertically (a flex column with justify-content: center);
       what it does not do is centre the text horizontally, because on the
       landing pages the copy is a left-aligned column against a picture.
       align-items centres the LINES within the column, text-align centres the
       words within each line: both are needed, and neither does the other's job.
       max-width: none clears the shared 700px clamp, which in a 551px half was
       doing nothing except keeping the block left of centre. */
    /* THE ATTRIBUTE IS PART OF THE SELECTOR ON PURPOSE.
       civic-modernist-pages.css carries
       body[data-admin-page="sound"].home-page main.sound-page .sound-header ...
       for both the grid and this cell, setting align-items: start and a 760px
       max-width. An attribute selector outranks any number of the classes I had,
       so the plain version of this rule was ignored: the words stayed at the top
       of the cell and left of its centre.
       AND .hero IS ADDED ON TOP OF MATCHING IT, because civic-modernist-pages.css
       is linked at the BOTTOM of this document, after this <style> block. Equal
       specificity therefore loses on order alone: the selector has to be one
       class heavier, not merely equal. */
    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-grid {
      align-items: center;
      padding-top: 0;
    }

    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-grid > div:first-child {
      align-items: center;
      justify-content: center;
      max-width: none;
      text-align: center;
    }

    /* THE TITLE IS THE OTHER HALF OF THE HEADER, so it is sized like it.
       civic-modernist-pages.css caps it at clamp(1.7rem, 2.8vw, 2.2rem), which
       is a subheading: it was set when this hero was a wide band of copy over a
       photo, with the title one line among several. The header is now two
       halves, a cassette on the right and this on the left, and at 2.2rem the
       left half read as a caption for the tape.
       .hero is in the selector to outrank that sheet, which is linked at the
       BOTTOM of this document and therefore wins any tie on order alone. */
    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-headline {
      max-width: none;
      /* Sized off the WIDER LINE, which is always the word rather than the
         count. The ceiling is what "Soundtracks" fits on one line at in the
         left half of the header; going past it is what made it wrap, and a
         wrapped headline here reads as three lines of nothing in particular. */
      font-size: clamp(1.9rem, 3.4vw, 3.1rem);
      /* Under 1 so the two lines sit as one block rather than as two lines that
         happen to be near each other. */
      line-height: 0.94;
      letter-spacing: -0.01em;
    }

    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-headline-line {
      display: block;
      /* NEVER BREAK A LINE. The break between them is authored in the markup;
         any other break is the cell being too narrow, which the clamp answers
         by shrinking the type. */
      white-space: nowrap;
    }

    /* THE COUNT IS THE BIGGER OF THE TWO LINES. It is the only part of this
       header that changes, and the number is the news: how many tapes are on
       the shelf. "Soundtracks" underneath is the label telling you what the
       number counts.
       Sized in em so it stays in proportion as the clamp on the parent shrinks
       the block at narrower viewports, rather than needing a clamp of its own
       that would have to be kept in step with it. */
    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-headline-line:first-child {
      font-size: 1.55em;
      line-height: 0.9;
    }

    body[data-admin-page="sound"].home-page main.sound-page .hero.sound-header .hero-sub {
      /* One line as well, for the same reason: it is a caption under a
         two-line title, and a third and fourth row of small text turns the
         left half into a paragraph. */
      max-width: none;
      margin-top: 12px;
      white-space: nowrap;
      font-size: clamp(0.72rem, 1.05vw, 0.95rem);
    }

    /* DEAD CENTRE OF THE RIGHT HALF, both ways. The hero no longer carries a
       520px min-height (see above), so the cell is the height of its contents
       and centring means what it says. */
    body.home-page .hero-deck {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      min-width: 0;
      /* NO POP. The tape is built in JS after the tables load, so the header
         was one height for the first second and another once the cassette
         appeared, shoving the whole grid down as it arrived.
         332px is the panel's MEASURED height once the tape is in it, not the
         sum of its parts: 296 was the stage plus padding on paper and left the
         header 36px short, so it still jumped. Measure, do not derive. */
      min-height: 332px;
    }

    /* INLINE, not an overlay. The same node the modal always was, with the
       fixed positioning, the scrim and the full-viewport box taken off it. */
    /* TWO classes on .sx-modal, deliberately. The base .sx-modal rule paints
       the scrim and is declared LATER in this same sheet, so at equal
       specificity it won and the inline deck kept a dark box behind it. */
    body.home-page .sx-modal.sx-modal--inline {
      position: static;
      display: block;
      /* THE FLEX ITEM IS THIS, not the panel inside it. Without a width here it
         shrank to its content at 336px, and the panel's width:100% then
         resolved against that 336 rather than against the half it sits in. */
      width: 100%;
      inset: auto;
      height: auto;
      padding: 0;
      background: none;
      backdrop-filter: none;
      z-index: auto;
    }

    /* BIGGER. The cassette is the point of this header, and at 420 it read as
       a thumbnail beside a 74-point headline. */
    /* HIDDEN HAS TO STILL MEAN HIDDEN. display:block above is a plain
       declaration and the [hidden] attribute is only a UA-sheet display:none,
       so setting .hidden on the inline deck silently did nothing: minimize
       mounted the corner case exactly as it always had while the full cassette
       stayed sitting in the header, which made the whole press read as "it just
       paused the music". Same trap the admin dialogs hit with
       `section.tool-modal-panel:not([hidden])`.
       The header keeps its height either way, because .hero-deck reserves it. */
    body.home-page .sx-modal.sx-modal--inline[hidden] { display: none; }

    body.home-page .sx-modal.sx-modal--inline .sx-panel {
      /* An explicit WIDTH, not a max-width. The deck is a flex row and the panel
         is a flex item, so it sizes to its content and settles small however
         high a cap goes. 100% of the half, capped so it stays a cassette rather
         than a billboard on a wide screen. */
      width: 100%;
      /* The full half, capped only by the stage's own 600px. It was 560, which
         left the tape smaller than the column it sits in for no reason. */
      max-width: none;
      margin: 0;
    }

    /* One column under the fold: the cassette is wide, and squeezing it beside
       a headline on a phone leaves neither readable. */
    @media (max-width: 860px) {
      body.home-page main.sound-page .sound-header .hero-grid { grid-template-columns: minmax(0, 1fr); }
      body.home-page .hero-deck { justify-content: center; }
      body.home-page .sx-modal.sx-modal--inline .sx-panel { max-width: 100%; }
    }

    /* ── THE SHELF ────────────────────────────────────────────────────────
       A row of cassettes seen edge on. The rail used to be pills carrying a
       geo badge and a track count, which was an alphabetical index sitting
       directly above an alphabetical index. A shelf says the one thing the
       grid cannot: these are tapes, and there are a lot of them.

       Everything below is the SPINE. The scroll, the drag and the three-chunk
       loop are unchanged and still live on .lc-list / .lc-track / .lc-chunk. */
    body.home-page .lc-track,
    body.home-page .lc-chunk { gap: 5px; align-items: flex-end; }

    body.home-page .tape-spine {
      position: relative;
      flex: 0 0 auto;
      display: block;
      /* Wide enough for a label to WRAP TO TWO LINES rather than tall enough
         for one. The longest name in the catalogue, "Indianapolis Songs from
         the Heartland", wants 225px on a single line: a header that tall is a
         wall, and shrinking the type to fit it is unreadable. Two columns of
         ~115px each carry every name we hold. */
      width: 44px;
      height: 150px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.55);
      border-radius: 2px;
      /* The shell: a dark plastic with a highlight down its left edge, which is
         what stops 74 rectangles reading as a bar chart. */
      background:
        linear-gradient(90deg,
          rgba(255, 255, 255, 0.18) 0 1px,
          rgba(255, 255, 255, 0.05) 1px 3px,
          rgba(0, 0, 0, 0.16) 3px 100%),
        var(--spine-ink, #2b3550);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 -10px 14px rgba(0, 0, 0, 0.28);
      text-decoration: none;
      overflow: hidden;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    /* SIX INKS, cycled by position. Real shelves are not one colour, and a
       repeating six is enough to break the run without looking like a system
       the reader has to decode. */
    body.home-page .tape-spine--0 { --spine-ink: #2b3550; }
    body.home-page .tape-spine--1 { --spine-ink: #7a2f35; }
    body.home-page .tape-spine--2 { --spine-ink: #1f4f45; }
    body.home-page .tape-spine--3 { --spine-ink: #6b4a1e; }
    body.home-page .tape-spine--4 { --spine-ink: #3d2f5c; }
    body.home-page .tape-spine--5 { --spine-ink: #244a63; }

    /* The paper label, set INTO the shell rather than printed on it: inset a
       couple of pixels, cream, with its own thin edge. */
    body.home-page .tape-spine-label {
      position: absolute;
      inset: 14px 3px 3px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 2px;
      border-radius: 1px;
      background: linear-gradient(180deg, #f7f0dc 0%, #ece3c9 100%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
      color: #1b2438;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.25;
      text-align: left;
      /* BOTTOM TO TOP, which is how a cassette on a shelf is actually read and
         the only orientation where the title starts at the spine's foot. */
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      /* Wraps into a second column. overflow stays hidden as the backstop for
         a name longer than two columns hold, which nothing currently is. */
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: hidden;
    }

    /* The two hubs, in the strip above the label. They are what make a
       rectangle read as a cassette before you have read a word of it. */
    body.home-page .tape-spine-hubs {
      position: absolute;
      top: 4px;
      left: 0;
      right: 0;
      height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    body.home-page .tape-spine-hubs::before,
    body.home-page .tape-spine-hubs::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    /* Pulled half out of the shelf. The lift is the whole interaction: you are
       picking a tape up, not highlighting a link. */
    body.home-page .tape-spine:hover,
    body.home-page .tape-spine:focus-visible {
      transform: translateY(-10px);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.5), inset 0 -10px 14px rgba(0, 0, 0, 0.28);
      outline: none;
    }

    body.home-page .tape-spine:focus-visible { box-shadow: 0 0 0 2px var(--accent), 0 10px 18px rgba(0, 0, 0, 0.5); }

    /* A city with no tape yet: an empty case, no label paper. */
    body.home-page .tape-spine--empty { opacity: 0.45; }
    body.home-page .tape-spine--empty .tape-spine-label { background: rgba(247, 240, 220, 0.35); }

    /* The shelf itself: a lip under the tapes so they are standing on
       something rather than floating in the header. */
    body.home-page .lc-list {
      padding-bottom: 10px;
      border-bottom: 3px solid rgba(0, 0, 0, 0.5);
      box-shadow: 0 4px 10px -6px rgba(0, 0, 0, 0.6);
    }

    @media (prefers-reduced-motion: reduce) {
      body.home-page .tape-spine { transition: none; }
      body.home-page .tape-spine:hover { transform: none; }
    }

    /* No-soundtrack cassette state: dim the tape + arrows, spotlight Suggest. */
    body.home-page .sx-panel.sx-empty .tgb-cass-mount { opacity: 0.5; }
    /* "No soundtrack yet" is precisely when we want a suggestion, so the ?
       key stays live and at full strength while the rest of the tape dims. */
    body.home-page .sx-panel.sx-empty .tgb-cass-suggest { opacity: 2; pointer-events: auto; }
    body.home-page .sx-player-empty {
      display: grid;
      place-items: center;
      min-height: 80px;
      padding: 8px 12px;
      color: rgba(247, 240, 220, 0.72);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.5rem;
      line-height: 1.6;
      text-align: center;
    }

    .sx-modal[hidden] { display: none; }
    .sx-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(5, 8, 14, 0.82);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .sx-panel {
      position: relative;
      display: grid;
      gap: 16px;
      width: min(760px, 100%);
      max-height: min(94dvh, 820px);
      padding: 18px 18px 16px;
      overflow: visible;
      border: 2px solid #28344a;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 0, rgba(245, 180, 97, 0.10), transparent 34%),
        linear-gradient(180deg, #161a22 0, #0b1019 64%, #070b12 100%);
      box-shadow:
        8px 8px 0 #02040a,
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    /* ── Tape chrome: minimize + close ─────────────────────────────────────
       Bare glyphs in the shell band above the label — no background, no border,
       nothing to box them in. Drawn in the SVG so they scale with the tape and
       stay clear of the handwriting at any size; the pressable area is a
       transparent rect wider than the glyph, so the whole key works, not just
       the strokes. Hover picks up --tgb-stripe, the colour of the band behind
       the play button, so they read as part of the same control set. */
    .tgb-cass-key { cursor: pointer; }
    /* Philips screw head for the close key: pale metal disc, dark cross slot. */
    .tgb-cass-screw-head {
      fill: #d5cec1;
      stroke: rgba(20, 14, 8, 0.5);
      stroke-width: 0.22;
      transition: fill 0.12s ease;
    }
    .tgb-cass-screw-slot {
      stroke: #322b22;
      stroke-width: 0.5;
      stroke-linecap: round;
      fill: none;
      pointer-events: none;
      transition: stroke 0.12s ease;
    }
    /* Neither screw changes colour. Both sit off true, the way driven screws
       do, and answer a hover by turning a little further — the feedback is the
       movement. transform-box: fill-box keeps each pivot on its own head. */
    .tgb-cass-key {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.18s ease;
    }
    .tgb-cass-key--flat { transform: rotate(-7deg); }
    .tgb-cass-key--flat:hover,
    .tgb-cass-key--flat:focus-visible { transform: rotate(6deg); }
    .tgb-cass-key--philips { transform: rotate(30deg); }
    .tgb-cass-key--philips:hover,
    .tgb-cass-key--philips:focus-visible { transform: rotate(43deg); }
    @media (prefers-reduced-motion: reduce) {
      .tgb-cass-key { transition: none; }
    }
    .tgb-cass-key:focus { outline: none; }
    .tgb-cass-key:focus-visible { outline: none; }

    /* ── The panel is a frame, not a box ───────────────────────────────────
       No card behind the tape: the cassette, its transport arrows and the foot
       buttons float directly on the page. Needs the .sx-modal descendant to
       outrank civic-modernist-pages.css, which loads later and paints
       `body.home-page .sx-panel` white with a border. */
    body.home-page .sx-modal .sx-panel {
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    /* ── City cassette (inline SVG, built from scratch in JS) ───────────────
       The cassette is drawn as an SVG and themed per city via --tgb-accent /
       --tgb-accent-dark set on .tgb-cass by JS. The whole transport lives on the
       tape itself — prev / play-pause / next sit in the bottom band; drag the
       tape to seek. */
    .tgb-cass-stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: min(600px, 100%);
      margin: 0 auto;
      min-height: 260px;
    }
    .tgb-cass-mount {
      position: relative;
      z-index: 1;
      min-width: 0;
      filter: drop-shadow(7px 9px 0 rgba(2, 4, 10, 0.9));
      transition: transform 0.18s ease;
    }
    .tgb-cass-mount svg {
      display: block;
      width: 100%;
      height: auto;
      cursor: -webkit-grab; cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }
    .tgb-cass-mount.is-seeking { transform: none; }
    .tgb-cass-mount.is-seeking svg { cursor: -webkit-grabbing; cursor: grabbing; }
    .tgb-cass-mount.nudge-prev { transform: translateX(-6px) rotate(-0.6deg); }
    .tgb-cass-mount.nudge-next { transform: translateX(6px) rotate(0.6deg); }
    .tgb-cass-stage.is-empty .tgb-cass-mount { opacity: 0.5; filter: grayscale(0.4) drop-shadow(7px 9px 0 rgba(2, 4, 10, 0.9)); }


    /* SVG internals — filled from CSS custom props / classes set in JS. */
    .tgb-cass svg text { pointer-events: none; }
    .tgb-cass-body { fill: var(--tgb-stripe-body, #16323a); stroke: var(--tgb-stripe-body, #16323a); }
    .tgb-cass-bottom { fill: var(--tgb-stripe, #2a5a66); }        /* play-head area = stripe colour */
    .tgb-cass-center { fill: var(--tgb-stripe-body, #16323a); stroke: var(--tgb-stripe-body, #16323a); }
    .tgb-cass-label-bg { fill: #f3ede0; }
    .tgb-cass-hole { fill: #000000; }                             /* spool-window background = black */
    .tgb-cass-line { stroke: #bcb3a3; stroke-width: 0.25; }
    .tgb-cass-gear { fill: none; }                               /* reel disc is open — label shows through the spokes */
    .tgb-cass-tooth { stroke: var(--tgb-stripe, #2a5a66); }      /* spindle spokes stay the stripe colour */
    .tgb-cass-hub { transform-box: fill-box; transform-origin: center; }
    .tgb-cass-spool { fill: #14110d; transform-box: fill-box; transform-origin: center; }
    .tgb-cass-btn { fill: #eee7d6; cursor: pointer; transition: fill 0.12s ease; }
    /* :focus as well as :focus-visible — clicking an SVG <g tabindex> leaves it
       in plain :focus, where Chrome paints its default ring (a dark ring plus a
       white contrast halo) straight across the tape. focus-visible alone does
       not catch that case. */
    .tgb-cass-btn:focus,
    .tgb-cass-btn:focus-visible { outline: none; }
    .tgb-cass-btn:hover,
    .tgb-cass-btn:focus-visible { fill: #ffffff; }
    /* Keyboard focus still needs to be visible: outline the black key in the
       label cream rather than letting the browser draw over the artwork. */
    .tgb-cass-btn:focus-visible .tgb-cass-hole { stroke: #eee7d6; stroke-width: 0.5; }
    /* No playlist loaded → the on-tape transport is inert, matching the dimmed
       tape (the flanking nav buttons that used to carry this state are gone). */
    .tgb-cass-stage.is-empty .tgb-cass-step,
    .sx-panel.sx-empty .tgb-cass-step { pointer-events: none; }
    .tgb-cass-text {
      font-family: "Reenie Beanie", cursive;
      fill: #241f18;
      text-anchor: middle;
    }
    .tgb-cass-text--artist { font-size: 5px; font-weight: 700; }
    .tgb-cass-text--title { font-size: 5.6px; font-weight: 700; }
    .tgb-cass-text--blurb { font-size: 3.8px; font-weight: 600; opacity: 0.72; }
    .tgb-cass-text--brand { font-size: 3.4px; font-weight: 700; fill: #3a332a; opacity: 0.85; }

    /* Album art shown through the cassette window; click for the full-size popup. */
    .tgb-cass-art { cursor: zoom-in; }

    /* Suggest-a-song key in the LEFT hub hole: black disc, cream "?". Pairs
       with the Spotify mark opposite it so the tape has two moulded keys rather
       than one key and one leftover hole. Its hover wording (with the city
       name) lives in the <title>, set by updateSuggestLabel. */
    .tgb-cass-suggest { cursor: pointer; }
    .tgb-cass-suggest-mark {
      fill: #f3ede0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 3.6px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }
    .tgb-cass-suggest:hover .tgb-cass-suggest-mark,
    .tgb-cass-suggest:focus-visible .tgb-cass-suggest-mark { fill: #ffffff; }
    .tgb-cass-suggest:hover .tgb-cass-hole,
    .tgb-cass-suggest:focus-visible .tgb-cass-hole { stroke: #eee7d6; stroke-width: 0.4; }
    .tgb-cass-suggest:focus { outline: none; }
    .tgb-cass-suggest:focus-visible { outline: none; }

    /* Spotify mark sitting in the right hub hole. Brand green is fixed by
       Spotify's guidelines, so this one stays a literal and does not follow the
       site skin. */
    .tgb-cass-spotify { cursor: pointer; }
    .tgb-cass-spotify-disc { fill: #1db954; }
    .tgb-cass-spotify-wave { stroke: #000000; fill: none; }
    .tgb-cass-spotify:hover .tgb-cass-spotify-disc,
    .tgb-cass-spotify:focus-visible .tgb-cass-spotify-disc { fill: #1ed760; }
    .tgb-cass-spotify:focus { outline: none; }
    .tgb-cass-spotify:focus-visible { outline: none; }
    .tgb-cass-spotify:focus-visible .tgb-cass-hole { stroke: #eee7d6; stroke-width: 0.5; }
    .tgb-cass-spotify.is-inert { cursor: default; pointer-events: none; }
    .tgb-cass-spotify.is-inert .tgb-cass-spotify-disc,
    .tgb-cass-spotify.is-inert .tgb-cass-spotify-wave { display: none; }

    /* Full-size album-art popup. */
    .sx-artbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(4, 6, 12, 0.82);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .sx-artbox[hidden] { display: none; }
    .sx-artbox-img {
      width: min(80vmin, 560px);
      height: min(80vmin, 560px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      cursor: zoom-out;
    }
    .sx-artbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border: 2px solid #f7f0dc;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.9);
      color: #f7f0dc;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .sx-artbox-close:hover { border-color: var(--accent); color: var(--accent); }

    /* Explicit-lyrics mark: "DIRTY" scrawled in thick red marker next to the
       title. A matching stroke (painted under the fill) fattens the glyphs into
       a bold Sharpie stroke. */
    .tgb-cass-explicit-word {
      fill: #d61f26;
      stroke: #d61f26;
      stroke-width: 0.5px;
      stroke-linejoin: round;
      stroke-linecap: round;
      paint-order: stroke;
      font-family: "Permanent Marker", "Reenie Beanie", cursive;
      font-size: 4.4px;
      font-weight: 400;
      letter-spacing: 0.1px;
      text-anchor: middle;
    }

    /* Reels wobble + gear hubs spin while playing; both freeze when paused. */
    @keyframes tgbWobbleA { from { transform: translateX(0.16px); } to { transform: translateX(-0.16px); } }
    @keyframes tgbWobbleB { from { transform: translateX(-0.16px); } to { transform: translateX(0.16px); } }
    @keyframes tgbSpin { to { transform: rotate(360deg); } }
    .tgb-cass.is-playing .tgb-cass-spool--left { animation: 1s infinite alternate tgbWobbleA; }
    .tgb-cass.is-playing .tgb-cass-spool--right { animation: 1.3s infinite alternate tgbWobbleB; }
    .tgb-cass.is-playing .tgb-cass-hub { animation: tgbSpin 2.6s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .tgb-cass.is-playing .tgb-cass-hub,
      .tgb-cass.is-playing .tgb-cass-spool--left,
      .tgb-cass.is-playing .tgb-cass-spool--right { animation: none; }
    }


    /* The Spotify iframe is the actual audio. Kept rendered at real size but
       tucked behind the cassette (z-index 0, near-zero opacity) so the browser
       does not throttle its audio the way it would for a display:none frame. */
    .sx-player-host {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      width: 260px;
      height: 80px;
      overflow: hidden;
      opacity: 0.001;
      pointer-events: none;
    }

    .sx-player-host iframe {
      display: block;
      width: 100%;
      height: 80px;
      border: 0;
    }

    /* Controller failed → show the real Spotify embed so the song still plays. */
    .sx-player-host.is-visible {
      opacity: 1;
      pointer-events: auto;
      z-index: 4;
      width: min(320px, 84%);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(2, 4, 10, 0.5);
    }
    .tgb-cass-stage.is-fallback .tgb-cass-play,
    .tgb-cass-stage.is-fallback .tgb-cass-pause { display: none !important; }
    .sx-player-fallback {
      display: grid;
      place-items: center;
      min-height: 80px;
      color: #f7f0dc;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
    }

    @media (max-width: 980px) {
      body.home-page .playlist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: min(760px, 100%);
      }
    }

    @media (max-width: 720px) {
      body.home-page .sound-page { gap: 18px; }
      body.home-page main.sound-page .hero,
      body.home-page .listen-city-panel,

            var back = cx + dir * (-t * W);

              d: 'M' + tip + ' ' + CY + ' ' + back + ' ' + (CY - H) + ' ' + back + ' ' + (CY + H) + ' z',
              'stroke-linejoin': 'round'
            }));
          }
          return g;
        }
        var prevBtn = transportButton(36, -1, 'Previous track');
        var nextBtn = transportButton(64, 1, 'Next track');
        svg.appendChild(prevBtn);
        svg.appendChild(nextBtn);
        prevBtn.addEventListener('click', function () { pulseTransport('rewind'); step(-1); });
        nextBtn.addEventListener('click', function () { pulseTransport('forward'); step(1); });
        prevBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pulseTransport('rewind'); step(-1); } });
        nextBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pulseTransport('forward'); step(1); } });

        // ruled label lines
        for (var ln = 0; ln < 2; ln++) svg.appendChild(svgEl('line', { x1: '12.5', y1: 12.5 + ln * 5, x2: '87.5', y2: 12.5 + ln * 5 }, 'tgb-cass-line'));

        // three handwritten metadata lines: artist / title / blurb
        var artist = svgEl('text', { x: '50', y: '12' }, 'tgb-cass-text tgb-cass-text--artist');
        var title = svgEl('text', { x: '50', y: '17.4' }, 'tgb-cass-text tgb-cass-text--title');
        // y 20.4, not 21.4: the label stripes start at y 21.5, and at this font
        // size the descenders of y/g/p drop ~0.95 below the baseline — enough to
        // hang off the white label onto the stripe band.
        var blurb = svgEl('text', { x: '50', y: '20.4' }, 'tgb-cass-text tgb-cass-text--blurb');
        svg.appendChild(artist);
        svg.appendChild(title);
        svg.appendChild(blurb);

        // Brand signature, centered in the cream band below the tape window.
        // Filled per city by updateBrandLine (this is only the fallback copy).
        var brand = svgEl('text', { x: '50', y: '41.3' }, 'tgb-cass-text tgb-cass-text--brand');
        brand.textContent = 'The Game Bureau';
        svg.appendChild(brand);

        // Explicit-lyrics mark: the word "DIRTY" scrawled in red marker, placed
        // just after the title in renderModal. Hidden unless the song is flagged.
        var explicit = svgEl('g', { 'aria-label': 'Explicit lyrics' }, 'tgb-cass-explicit');
        explicit.style.display = 'none';
        var dirtyWord = svgEl('text', { x: '0', y: '0' }, 'tgb-cass-explicit-word');
        dirtyWord.textContent = 'DIRTY';
        explicit.appendChild(dirtyWord);
        svg.appendChild(explicit);

        // play/pause wiring
        play.addEventListener('click', togglePlayback);
        pause.addEventListener('click', togglePlayback);
        play.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePlayback(); } });

        cass = { svg: svg, leftSpool: leftSpool, rightSpool: rightSpool, play: play, pause: pause, artist: artist, title: title, blurb: blurb, explicit: explicit, art: art, stripes: stripeEls, spotify: spotify, brand: brand };
        return svg;
      }

      // Show/hide + position "DIRTY" just past the (centered) title, tilted like
      // a marker scrawl and clamped to stay on the label.
      function setExplicitBadge(isExplicit) {
        if (!cass || !cass.explicit) return;
        if (!isExplicit) { cass.explicit.style.display = 'none'; return; }
        cass.explicit.style.display = ''; // show first so the word can be measured
        var tw = 0, dw = 11;
        try { tw = cass.title.getComputedTextLength(); } catch (e) {}
        try { dw = cass.explicit.querySelector('text').getComputedTextLength(); } catch (e) {}
        var x = Math.min(88 - dw / 2, 50 + tw / 2 + 2 + dw / 2);
        cass.explicit.setAttribute('transform', 'translate(' + x.toFixed(2) + ', 17.2) rotate(-6)');
      }

      // Load the track's cover art (Spotify oembed thumbnail) and show it in the
      // cassette window. token guards against a late fetch for a since-changed song.
      function clearArt() {
        state.artUrl = '';
        if (cass && cass.art) {
          cass.art.style.display = 'none';
          cass.art.removeAttributeNS('http://www.w3.org/1999/xlink', 'href');
          cass.art.removeAttribute('href');
        }
      }
      function showArt(url) {
        state.artUrl = url;
        saveCassetteSession(true);   // the case on the next page shows this art
        if (!cass || !cass.art) return;
        cass.art.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url);
        cass.art.setAttribute('href', url);
        cass.art.style.display = '';
      }
      function loadAlbumArt(song, token) {
        clearArt();
        var id = trackIdFromHref(song.href);
        if (!id) return;
        if (artCache[id]) { showArt(artCache[id]); return; }
        if (artCache[id] === null) return;
        fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(song.href))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            var src = data && data.thumbnail_url;
            artCache[id] = src || null;
            if (artRenderToken === token && src) showArt(src);
          })
          .catch(function () { artCache[id] = null; });
      }

      // Full-size album-art popup (its own layer above the cassette).
      var artLightbox = null;
      function openArtLightbox() {
        if (!state.artUrl) return;
        if (!artLightbox) {
          artLightbox = document.createElement('div');
          artLightbox.className = 'sx-artbox';
          artLightbox.innerHTML = '<button class="sx-artbox-close" type="button" aria-label="Close album art">X</button><img class="sx-artbox-img" alt="Album art">';
          document.body.appendChild(artLightbox);
          artLightbox.addEventListener('click', function (e) { if (e.target === artLightbox || e.target.classList.contains('sx-artbox-close')) closeArtLightbox(); });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && artLightbox && !artLightbox.hidden) closeArtLightbox(); });
        }
        artLightbox.querySelector('.sx-artbox-img').src = state.artUrl;
        artLightbox.hidden = false;
      }
      function closeArtLightbox() {
        if (artLightbox) artLightbox.hidden = true;
      }

      // The Spotify mark is the whole notice: while Spotify is serving a
      // 30-second preview it explains why and sends the visitor to log in;
      // otherwise it opens the track, which is also the attribution link.
      var SPOTIFY_LOGIN_URL = 'https://accounts.spotify.com/login';
      var PREVIEW_COPY = 'Hearing a 30-second preview — log in to Spotify Premium for full tracks';
      var spotifyTrackHref = '';

      function setSpotifyLink(href) {
        spotifyTrackHref = href || '';
        updateSpotifyMark();
      }

      function updateSpotifyMark() {
        if (!cass || !cass.spotify) return;
        var XLINK = 'http://www.w3.org/1999/xlink';
        var d = Number(state.duration) || 0;
        var preview = d > 0 && d <= PREVIEW_MAX_SECONDS;
        var href = preview ? SPOTIFY_LOGIN_URL : spotifyTrackHref;
        var label = preview ? PREVIEW_COPY : 'Open in Spotify';
        if (spotifyTitle) spotifyTitle.textContent = label;
        cass.spotify.setAttribute('aria-label', label);
        // An SVG <a> needs href (SVG2) and the xlink form for older engines.
        if (href) {
          cass.spotify.setAttribute('href', href);
          cass.spotify.setAttributeNS(XLINK, 'xlink:href', href);
          cass.spotify.classList.remove('is-inert');
        } else {
          cass.spotify.removeAttribute('href');
          cass.spotify.removeAttributeNS(XLINK, 'href');
          // Hide the green mark only — the black hole stays so the tape keeps
          // its moulding.
          cass.spotify.classList.add('is-inert');
        }
      }

      // Current city as shown on the open cassette (full "City, Region" label).
      function currentCityLabel() {
        return String((state.card && (state.card.getAttribute('data-location')
          || (state.card.querySelector('.playlist-title') || {}).textContent)) || state.pendingCity || '').trim();
      }
      // Just the city name (before the first comma), for the Suggest button copy.
      function currentCityName() {
        return currentCityLabel().split(',')[0].trim();
      }
      // "Suggest a track for the {City} Soundtrack" on the footer button.
      // The tooltip on the tape's "?" key. Same wording the footer button used
      // to carry, city and all.
      function updateSuggestLabel() {
        if (!suggestTitle) return;
        var name = currentCityName();
        suggestTitle.textContent = name
          ? ('Suggest a track for the ' + name + ' Soundtrack')
          : 'Suggest a track';
      }

      // Open a pre-filled track suggestion for whichever city is on the tape.
      function suggestSong() {
        var city = (state.card && (state.card.getAttribute('data-location')
          || (state.card.querySelector('.playlist-title') || {}).textContent))
          || state.pendingCity || '';
        var subject = 'Track suggestion' + (city ? ' for ' + city : '');
        var body = 'Suggested track for ' + city + '\n\nTrack title:\nArtist:\nWhy it fits the city:\n';
        window.location.href = 'mailto:soundtrack@thegamebureau.com?subject='
          + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }

      // The soundtrack's own name, as written on its cassette card spine
      // (e.g. "Songs for Atlanta", "Baltimore Street Sounds").
      function currentSoundtrackName() {
        var el = state.card && state.card.querySelector('.playlist-title');
        return el ? String(el.textContent || '').trim() : '';
      }

      // Signature under the tape window: "The Game Bureau's {soundtrack}
      // Cassingle", falling back to the plain wordmark when no tape is loaded.
      function updateBrandLine() {
        if (!cass || !cass.brand) return;
        var name = currentSoundtrackName();
        fitText(cass.brand, name ? ("The Game Bureau's " + name + ' Cassingle') : 'The Game Bureau', 82);
      }

      // Spotify's embed serves 30-second previews to signed-out listeners and
      // the whole track to a signed-in Premium one — nothing here can change
      // that, but the reported duration tells us which is playing, so the mark
      // only offers the login when the visitor is actually missing something.
      var PREVIEW_MAX_SECONDS = 31;

      // Shrink an SVG <text> to fit maxWidth (label is ~80 units wide).
      function fitText(el, str, maxWidth) {
        el.removeAttribute('textLength');
        el.removeAttribute('lengthAdjust');
        el.textContent = str || '';
        if (!str) return;
        var len = 0;
        try { len = el.getComputedTextLength(); } catch (e) { return; }
        if (len > maxWidth) {
          el.setAttribute('lengthAdjust', 'spacingAndGlyphs');
          el.setAttribute('textLength', String(maxWidth));
        }
      }

      // Resize spools for the current progress (0..1): playing tape moves from
      // the left reel to the right, so left shrinks as right grows.
      function updateSpools(progress) {
        if (!cass) return;
        var p = Math.max(0, Math.min(1, progress || 0));
        var totalArea = Math.PI * TOTAL_RADIUS * TOTAL_RADIUS;
        var gearArea = Math.PI * GEAR_RADIUS * GEAR_RADIUS;
        var tapeArea = totalArea - gearArea;
        cass.leftSpool.setAttribute('r', Math.sqrt((gearArea + tapeArea * (1 - p)) / Math.PI));
        cass.rightSpool.setAttribute('r', Math.sqrt((gearArea + tapeArea * p) / Math.PI));
      }

      function togglePlayback() {
        var song = state.songs[state.index];
        if (!song) return;
        if (!spotifyUriFromHref(song.href)) { window.open(song.href, '_blank', 'noopener'); return; }
        state.playing = !state.playing;
        if (state.playing) {
          // If the controller hasn't attached yet, remember the intent so it
          // starts the moment it is ready (this click is the needed gesture).
          state.wantAutoplay = !playerController;
          playSpotifyPlayer();
        } else {
          state.wantAutoplay = false;
          pauseSpotifyPlayer();
        }
        updatePlaybackUi();
      }

      // Drag the tape left/right to seek within the current track.
      function seekByFraction(fraction) {
        if (!playerController || !state.duration) return;
        var target = Math.max(0, Math.min(state.duration, (state.position || 0) + state.duration * fraction));
        try { if (typeof playerController.seek === 'function') playerController.seek(target); } catch (e) {}
      }

      function songFromLink(link) {
        return {
          href: link.href,
          title: (link.querySelector('.song-title') || {}).textContent || 'Track',
          artist: (link.querySelector('.song-artist') || {}).textContent || 'Spotify',
          blurb: (link.querySelector('.song-blurb') || {}).textContent || '',
          explicit: link.getAttribute('data-explicit') === '1',
        };
      }

      function songsFor(card) {
        if (card && Array.isArray(card._tgbSongs)) return card._tgbSongs.slice();
        return Array.prototype.slice.call(card.querySelectorAll('.song-link')).map(songFromLink);
      }

      // Fisher-Yates on a copy — songsFor already hands back a fresh array, but
      // never shuffle a card's stored list in place: reopening a city would keep
      // re-scrambling the same array and the song list on the card would drift.
      function shuffled(songs) {
        var arr = songs.slice();
        for (var i = arr.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var swap = arr[i];
          arr[i] = arr[j];
          arr[j] = swap;
        }
        return arr;
      }

      function firstPlayableIndex(songs) {
        for (var i = 0; i < songs.length; i += 1) {
          if (spotifyUriFromHref(songs[i].href)) return i;
        }
        return 0;
      }

      // NOTHING EXPLICIT STARTS BY ITSELF. A tape opened by a person is a tape
      // they asked for, and every track on it is fair game once they are
      // driving; a tape that starts on its own the instant the page paints is
      // not, because nobody chose it and it can be playing out loud before the
      // reader knows the page has sound. So the load-time pick skips the tracks
      // marked explicit and starts on the first clean one instead.
      //
      // It is a STARTING POINT, not a filter: the explicit tracks stay in the
      // running order and Next reaches them normally. Only the first track the
      // page chooses for you is constrained.
      function firstCleanPlayableIndex(songs) {
        for (var i = 0; i < songs.length; i += 1) {
          if (!songs[i].explicit && spotifyUriFromHref(songs[i].href)) return i;
        }
        return -1;
      }

      function trackIdFromHref(href) {
        var match = String(href || '').match(new RegExp('open\\.spotify\\.com/track/([A-Za-z0-9]+)'));
        return match ? match[1] : '';
      }

      function spotifyUriFromHref(href) {
        var id = trackIdFromHref(href);
        return id ? 'spotify:track:' + id : '';
      }

      function embedSrc(href) {
        var id = trackIdFromHref(href);
        return id ? 'https://open.spotify.com/embed/track/' + id + '?utm_source=generator&theme=0' : '';
      }

      function ensureSpotifyIframeApi(callback) {
        // The floating case may have loaded the API before the cassette opened
        // (arriving mid-session, then maximizing). onSpotifyIframeApiReady only
        // ever fires once, so a second request here would wait forever, no
        // controller would be built, and the 8s fallback would reveal the raw
        // Spotify embed on top of the tape. Take the shared object instead.
        if (!spotifyIframeApi && window.__tgbSpotifyIframeApi) {
          spotifyIframeApi = window.__tgbSpotifyIframeApi;
        }
        if (spotifyIframeApi) {
          callback(spotifyIframeApi);
          return;
        }
        spotifyIframeApiCallbacks.push(callback);
        if (spotifyIframeApiRequested) return;
        spotifyIframeApiRequested = true;
        var previousReady = window.onSpotifyIframeApiReady;
        window.onSpotifyIframeApiReady = function (IFrameAPI) {
          spotifyIframeApi = IFrameAPI;
          // Share it with the floating case: the API fires this hook once per
          // page, so the case cannot load its own copy after we've taken it.
          window.__tgbSpotifyIframeApi = IFrameAPI;
          if (window.TgbCassette && window.TgbCassette.setApi) window.TgbCassette.setApi(IFrameAPI);
          if (typeof previousReady === 'function') {
            try { previousReady(IFrameAPI); } catch (error) {}
          }
          spotifyIframeApiCallbacks.splice(0).forEach(function (fn) {
            try { fn(IFrameAPI); } catch (error) {}
          });
        };
        var script = document.createElement('script');
        script.src = 'https://open.spotify.com/embed/iframe-api/v1';
        script.async = true;
        script.dataset.spotifyIframeApi = 'true';
        document.body.appendChild(script);
      }

      function updatePlaybackUi() {
        if (!modal) return;
        var wrap = modal.querySelector('.tgb-cass');
        var panel = modal.querySelector('.sx-panel');
        var song = state.songs[state.index];
        var playable = song && spotifyUriFromHref(song.href);
        var isPlaying = !!(playable && state.playing);
        if (cass) {
          cass.play.style.display = isPlaying ? 'none' : 'inherit';
          cass.pause.style.display = isPlaying ? 'inherit' : 'none';
        }
        if (wrap) wrap.classList.toggle('is-playing', isPlaying);
        if (panel) panel.classList.toggle('is-playing', isPlaying);
        // Keep the roaming session in step with what the tape is actually doing.
        saveCassetteSession(false);
      }

      // Stamp allow="autoplay" onto the Spotify-built iframe as soon as it lands
      // in the mount, so mobile Chrome lets a parent gesture start its audio.
      function forceAutoplayPermission(mount) {
        if (!mount || typeof MutationObserver !== 'function') return;
        var ALLOW = 'autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write';
        var stamp = function (ifr) {
          if (!ifr || ifr.getAttribute('allow') === ALLOW) return;
          try { ifr.setAttribute('allow', ALLOW); } catch (e) {}
          try { ifr.setAttribute('allowfullscreen', 'true'); } catch (e) {}
        };
        stamp(mount.querySelector('iframe'));
        var obs = new MutationObserver(function () { stamp(mount.querySelector('iframe')); });
        obs.observe(mount, { childList: true, subtree: true });
        window.setTimeout(function () { obs.disconnect(); }, 10000);
      }

      function playSpotifyPlayer() {
        if (!playerController) return;
        try {
          if (typeof playerController.play === 'function') playerController.play();
          else if (typeof playerController.resume === 'function') playerController.resume();
          else if (typeof playerController.togglePlay === 'function') playerController.togglePlay();
        } catch (error) {}
      }

      function pauseSpotifyPlayer() {
        if (!playerController || typeof playerController.pause !== 'function') return;
        try { playerController.pause(); } catch (error) {}
      }

      function setPlayerVolume(ratio) {
        if (!playerController) return;
        var value = Math.max(0, Math.min(1, Number(ratio) || 0));
        try {
          if (typeof playerController.setVolume === 'function') playerController.setVolume(value);
          else if (typeof playerController.setVolumePercent === 'function') playerController.setVolumePercent(value * 100);
          else if (typeof playerController.setPlaybackVolume === 'function') playerController.setPlaybackVolume(value);
        } catch (error) {}
      }

      // Brief visual nudge of the tape when stepping tracks.
      function pulseTransport(mode) {
        if (!modal) return;
        var mount = modal.querySelector('.tgb-cass-mount');
        if (!mount) return;
        var cls = mode === 'rewind' ? 'nudge-prev' : (mode === 'forward' ? 'nudge-next' : '');
        window.clearTimeout(transportPulseTimer);
        mount.classList.remove('nudge-prev', 'nudge-next');
        if (cls) mount.classList.add(cls);
        transportPulseTimer = window.setTimeout(function () {
          mount.classList.remove('nudge-prev', 'nudge-next');
        }, 240);
      }

      function attachPlayerEvents(controller) {
        if (!controller || typeof controller.addListener !== 'function') return;
        controller.addListener('playback_started', function () {
          state.playing = true;
          updatePlaybackUi();
          // Now that audio is actually playing, warm the next track so the first
          // Next tap promotes instantly.
          schedulePreloadNext();
        });
        controller.addListener('playback_update', function (event) {
          if (!event || !event.data) return;
          var d = event.data;
          if (typeof d.isPaused === 'boolean') state.playing = !d.isPaused;
          // Spotify reports position/duration in milliseconds.
          if (typeof d.duration === 'number' && d.duration > 0) {
            state.duration = d.duration / 1000;
            state.position = (Number(d.position) || 0) / 1000;
            updateSpotifyMark();
            updateSpools(state.position / state.duration);
            if (!d.isPaused) state.maxPos = Math.max(state.maxPos || 0, state.position);
            // Auto-advance: fire when the track reaches its end, or when the
            // controller pauses right at the end (a finished preview). Latched
            // so it runs once per track.
            var reachedEnd = state.position >= state.duration - 0.4;
            var pausedAtEnd = d.isPaused && (state.maxPos || 0) >= state.duration - 1;
            if (state.songs.length > 1 && !state.autoAdvanced && (reachedEnd || pausedAtEnd)) {
              state.autoAdvanced = true;
              autoAdvanceNext();
            }
          }
          updatePlaybackUi();
        });
      }

      function renderPlainSpotifyIframe(host, song) {
        host.textContent = '';
        var iframe = document.createElement('iframe');
        iframe.title = song.title + ' on Spotify';
        iframe.src = embedSrc(song.href);
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.loading = 'lazy';
        host.appendChild(iframe);
        // The controller failed, so the SVG buttons can't drive audio. Reveal the
        // real Spotify embed (with its own play button) so the song is still
        // playable, and mark the cassette so its dead play/pause is hidden.
        host.classList.add('is-visible');
        if (modal) {
          var stage = modal.querySelector('.tgb-cass-stage');
          if (stage) stage.classList.add('is-fallback');
        }
      }

      function renderPlayer(song) {
        var host = activePlayerHost || modal.querySelector('.sx-player-host');
        var spotifyUri = spotifyUriFromHref(song.href);
        window.clearTimeout(playerFallbackTimer);
        if (!spotifyUri) {
          if (playerController && typeof playerController.destroy === 'function') {
            try { playerController.destroy(); } catch (error) {}
          }
          playerController = null;
          playerHostElement = null;
          playerEntity = '';
          state.playing = false;
          host.textContent = '';
          var fallback = document.createElement('a');
          fallback.className = 'sx-player-fallback';
          fallback.href = song.href;
          fallback.target = '_blank';
          fallback.rel = 'noopener';
          fallback.textContent = 'Open track in Spotify';
          host.appendChild(fallback);
          updatePlaybackUi();
          return;
        }

        if (playerController && playerEntity !== song.href) {
          playerEntity = song.href;
          try {
            if (typeof playerController.loadEntity === 'function') playerController.loadEntity(song.href);
            else if (typeof playerController.loadUri === 'function') playerController.loadUri(spotifyUri);
          } catch (error) {}
          if (state.playing || state.wantAutoplay) window.setTimeout(playSpotifyPlayer, 250);
          state.wantAutoplay = false;
          updatePlaybackUi();
          return;
        }

        if (playerController && playerEntity === song.href) {
          updatePlaybackUi();
          return;
        }

        host.textContent = '';
        host.classList.remove('is-visible');
        var stageEl = modal.querySelector('.tgb-cass-stage');
        if (stageEl) stageEl.classList.remove('is-fallback');
        playerEntity = song.href;
        var mount = document.createElement('div');
        mount.className = 'sx-spotify-embed';
        host.appendChild(mount);
        // Mobile Chrome blocks a parent from playing a cross-origin iframe unless
        // that iframe carries allow="autoplay". The Spotify API builds the iframe
        // itself, so stamp the permission on it the moment it appears.
        forceAutoplayPermission(mount);
        playerHostElement = mount;
        playerFallbackTimer = window.setTimeout(function () {
          if (!playerController && host.contains(mount) && playerEntity === song.href) {
            renderPlainSpotifyIframe(host, song);
          }
        }, 8000);
        ensureSpotifyIframeApi(function (IFrameAPI) {
          if (!modal || !host.contains(mount) || playerEntity !== song.href) return;
          IFrameAPI.createController(mount, {
            url: song.href,
            width: '100%',
            height: 80
          }, function (controller) {
            window.clearTimeout(playerFallbackTimer);
            playerController = controller;
            attachPlayerEvents(controller);
            setPlayerVolume(state.volume / 100);
            // Restored from another page: drop the needle where the case left
            // off before asking for audio.
            if (state.resumeAt > 1) {
              try { controller.seek(state.resumeAt); } catch (error) {}
              state.resumeAt = 0;
            }
            if (state.playing || state.wantAutoplay) window.setTimeout(playSpotifyPlayer, 120);
            state.wantAutoplay = false;
            updatePlaybackUi();
          });
        });
        updatePlaybackUi();
      }

      // ── Next-track preloading (double buffer) ──────────────────────────────
      function preloadHost() {
        for (var i = 0; i < playerHosts.length; i++) {
          if (playerHosts[i] !== activePlayerHost) return playerHosts[i];
        }
        return null;
      }

      function clearPreload() {
        window.clearTimeout(preloadTimer);
        if (preloadController && typeof preloadController.destroy === 'function') {
          try { preloadController.destroy(); } catch (e) {}
        }

        preloadEntity = '';
        var h = preloadHost();
        if (h) h.textContent = '';
      }

      // Fully tear down the active Spotify controller (removes its iframe) so no
      // audio can keep playing or buffering. Pausing alone isn't enough — a
      // hidden/display:none iframe can resume, so we destroy + empty the host.
      function destroyActivePlayer() {
        window.clearTimeout(playerFallbackTimer);
        try { pauseSpotifyPlayer(); } catch (e) {}
        if (playerController && typeof playerController.destroy === 'function') {
          try { playerController.destroy(); } catch (e) {}
        }
        playerController = null;
        playerHostElement = null;
        playerEntity = '';
        if (activePlayerHost) { activePlayerHost.textContent = ''; activePlayerHost.classList.remove('is-visible'); }
        if (playerHosts.length) activePlayerHost = playerHosts[0];
      }

      // Warm a song's cover art into the cache (no display) for instant paint.
      function prefetchArt(song) {
        if (!song) return;
        var id = trackIdFromHref(song.href);
        if (!id || artCache[id] !== undefined) return;
        fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(song.href))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { artCache[id] = (d && d.thumbnail_url) || null; })
          .catch(function () { artCache[id] = null; });
      }

      // Debounced so rapid skipping doesn't spin up a pile of controllers.
      function schedulePreloadNext() {
        window.clearTimeout(preloadTimer);
        preloadTimer = window.setTimeout(preloadNext, 650);
      }

      // Prefetch adjacent art always; spin up an idle controller for the NEXT
      // track (only while actively playing) so a Next tap promotes instantly.
      function preloadNext() {
        if (!modal || modal.hidden || !state.songs.length) return;
        var len = state.songs.length;
        var next = state.songs[(state.index + 1) % len];
        prefetchArt(next);
        prefetchArt(state.songs[(state.index - 1 + len) % len]);
        if (!state.playing || !next) return;
        var uri = spotifyUriFromHref(next.href);
        if (!uri || next.href === preloadEntity || next.href === playerEntity) return;
        clearPreload();
        var host = preloadHost();
        if (!host) return;
        host.textContent = '';
        var mount = document.createElement('div');
        mount.className = 'sx-spotify-embed';
        host.appendChild(mount);
        forceAutoplayPermission(mount);
        preloadEntity = next.href;
        ensureSpotifyIframeApi(function (IFrameAPI) {
          if (!host.contains(mount) || preloadEntity !== next.href) return;
          IFrameAPI.createController(mount, { url: next.href, width: '100%', height: 80 }, function (controller) {
            if (preloadEntity !== next.href) { try { controller.destroy(); } catch (e) {} return; }
            preloadController = controller;
            try { if (typeof controller.setVolume === 'function') controller.setVolume(0); } catch (e) {}
          });
        });
      }

      // Promote the preloaded controller to active (and play it) when the newly
      // selected track is the one we preloaded. Returns true when it swapped.
      function promotePreloaded(song) {
        if (!song || !preloadController || preloadEntity !== song.href) return false;
        if (playerController && typeof playerController.destroy === 'function') {
          try { playerController.destroy(); } catch (e) {}
        }
        if (activePlayerHost) { activePlayerHost.textContent = ''; activePlayerHost.classList.remove('is-visible'); }
        activePlayerHost = preloadHost();           // preload host becomes active
        playerController = preloadController;
        playerEntity = preloadEntity;
        playerHostElement = null;
        preloadController = null;
        preloadEntity = '';
        window.clearTimeout(playerFallbackTimer);
        attachPlayerEvents(playerController);
        setPlayerVolume(state.volume / 100);        // restore from the muted preload
        state.wantAutoplay = false;
        state.playing = true;
        // Play synchronously so it stays inside the Next-tap gesture — mobile
        // Chrome only starts audio when play() runs within the user activation.
        playSpotifyPlayer();
        return true;
      }

      function buildModal() {
        var node = document.createElement('div');
        node.className = 'sx-modal';
        node.hidden = true;
        node.innerHTML = '' +
          '<div class="sx-panel" role="dialog" aria-modal="true" aria-label="City cassette player">' +
            '<div class="tgb-cass-stage">' +
              '<div class="tgb-cass tgb-cass-mount"></div>' +
              '<div class="sx-player-host" aria-hidden="true"></div>' +
              '<div class="sx-player-host sx-player-host--pre" aria-hidden="true"></div>' +
            '</div>' +
          '</div>';
        // INTO THE HEADER when there is a deck to sit in, onto the body only as
        // a fallback. Same node, same panel, same player: what changed is where
        // it hangs, so nothing that reads or drives it had to change with it.
        var deck = document.getElementById('heroDeck');
        if (deck) {
          node.classList.add('sx-modal--inline');
          deck.appendChild(node);
        } else {
          document.body.appendChild(node);
        }

        // Build + mount the SVG cassette.
        var mount = node.querySelector('.tgb-cass-mount');
        mount.appendChild(buildCassetteSvg());

        // Two hidden hosts for double-buffered playback (active + preload).
        playerHosts = Array.prototype.slice.call(node.querySelectorAll('.sx-player-host'));
        activePlayerHost = playerHosts[0];

        // Backdrop click closes — but only when the gesture BEGINS on the
        // backdrop too. Without the mousedown check, a press that starts on the
        // tape and releases off it fires a click whose target is the modal
        // (the common ancestor of the two), and the player closes under a
        // gesture the visitor aimed at the cassette.
        var pressStartedOnBackdrop = false;
        node.addEventListener('mousedown', function (event) { pressStartedOnBackdrop = (event.target === node); });
        node.addEventListener('touchstart', function (event) {
          pressStartedOnBackdrop = (event.target === node);
        }, { passive: true });
        node.addEventListener('click', function (event) {
          if (event.target === node && pressStartedOnBackdrop) closeModal();
          pressStartedOnBackdrop = false;
        });


        // Drag the tape to seek. Works for mouse + touch; a small horizontal
        // drag maps to a fraction of the track and calls the Spotify seek().
        var dragX = null;
        function dragStart(clientX) { dragX = clientX; mount.classList.add('is-seeking'); }
        function dragEnd(clientX) {
          if (dragX === null) return;
          var rect = mount.getBoundingClientRect();
          var frac = rect.width ? (clientX - dragX) / rect.width : 0;
          dragX = null;
          mount.classList.remove('is-seeking');
          if (Math.abs(frac) > 0.01) seekByFraction(frac);
        }
        // Skip drag-seek when starting on the play/pause buttons or the album art
        // (those have their own click actions).
        var noDrag = function (e) { return e.target.closest('.tgb-cass-btn, .tgb-cass-art, .tgb-cass-spotify, .tgb-cass-suggest'); };
        mount.addEventListener('mousedown', function (e) { if (noDrag(e)) return; dragStart(e.clientX); });
        window.addEventListener('mouseup', function (e) { dragEnd(e.clientX); });
        mount.addEventListener('touchstart', function (e) { if (noDrag(e)) return; dragStart(e.touches[0].clientX); }, { passive: true });
        mount.addEventListener('touchend', function (e) { dragEnd((e.changedTouches[0] || {}).clientX || dragX); });

        // real offset rather than the last throttled save.
        window.addEventListener('pagehide', function () { saveCassetteSession(true); });

        document.addEventListener('keydown', function (event) {
          if (node.hidden) return;
          if (event.key === 'Escape') closeModal();
          if (event.key === 'ArrowLeft') { pulseTransport('rewind'); step(-1); }
          if (event.key === 'ArrowRight') { pulseTransport('forward'); step(1); }
