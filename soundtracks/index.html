      }

      // Read a CSS custom prop off an element, trimmed.
      function readVar(el, name) {
        try { return (getComputedStyle(el).getPropertyValue(name) || '').trim(); } catch (e) { return ''; }
      }

      // Apply a city's accent to the cassette (body/center/gears). Falls back to
      // a default teal when the card defines no --city-accent.
      function applyCassetteAccent(card) {
        var mount = modal.querySelector('.tgb-cass-mount');
        if (!mount) return;
        var accent = (card && readVar(card, '--city-accent')) || '';
        if (!/^#?[0-9a-fA-F]{3,6}$/.test(accent)) accent = '#2a5a66';
        if (accent[0] !== '#') accent = '#' + accent;

        mount.style.setProperty('--tgb-accent-dark', shade(accent, -0.34) || '#16323a');
      }

      // Convert a computed "rgb(...)"/"rgba(...)" color to hex; null if fully
      // transparent (so we can tell "no stripe" from a real color).
      function cssColorToHex(str) {
        var m = String(str || '').match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        var parts = m[1].split(',').map(function (s) { return parseFloat(s); });
        if (parts.length > 3 && !(parts[3] > 0)) return null;
        var hx = function (c) { return ('0' + Math.max(0, Math.min(255, Math.round(c || 0))).toString(16)).slice(-2); };

      // Resolve a CSS custom property to a concrete hex color via a probe (so
      // var() chains like --label-stripe: var(--case-stripe) get resolved).
      function resolveVarColor(card, name) {

        probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(' + name + ',transparent);';
        card.appendChild(probe);

      }

      // Colour the five stripes as a light→dark gradient centered on the case's
      // stripe colour (--label-stripe). Falls back to --case-stripe / accent.
      function applyStripes(card) {
        if (!cass || !cass.stripes) return;
        var base = resolveVarColor(card, '--label-stripe')
          || resolveVarColor(card, '--case-stripe')
          || resolveVarColor(card, '--city-accent')
          || '#f5b461';
        var ramp = [0.42, 0.2, 0, -0.2, -0.42]; // middle stripe (index 2) = base
        for (var i = 0; i < cass.stripes.length; i++) {
          cass.stripes[i].setAttribute('fill', shade(base, ramp[i]) || base);
        }

        // (bottom trapezoid) is the stripe itself, the rest of the body is a
        // darker shade of it.
        var mount = modal.querySelector('.tgb-cass-mount');
        if (mount) {
          mount.style.setProperty('--tgb-stripe', base);
          mount.style.setProperty('--tgb-stripe-body', shade(base, -0.32) || base);
        }
      }

      function renderModal() {
        if (!modal || !state.songs.length) return;
        var song = state.songs[state.index];
        applyCassetteAccent(state.card);
        applyStripes(state.card);
        state.duration = 0;
        state.position = 0;
        state.maxPos = 0;
        updateSpotifyMark();
        state.autoAdvanced = false;
        updateSpools(0);
        renderPlayer(song);
        var artToken = ++artRenderToken;
        if (cass) {
          fitText(cass.artist, song.artist, 78);
          // Leave room for the "DIRTY" mark after the title when explicit.
          fitText(cass.title, song.title, song.explicit ? 56 : 80);
          fitText(cass.blurb, song.blurb || '', 82);
          setExplicitBadge(song.explicit);
          updateBrandLine();
          loadAlbumArt(song, artToken);
        }
        updateSuggestLabel();
        setSpotifyLink(song.href);
        updatePlaybackUi();
        schedulePreloadNext();
        saveCassetteSession(true);
      }

      // opts.clean asks for a non-explicit opening track, which the unattended
      // load-time pick sets and nothing a human presses does. See
      // firstCleanPlayableIndex for why the distinction is on who chose the tape.
      function openCard(card, opts) {
        modal = modal || buildModal();
        modal.querySelector('.sx-panel').classList.remove('sx-empty');
        state.pendingCity = '';
        state.card = card;
        // Fresh running order every time a tape is opened.
        state.songs = shuffled(songsFor(card));
        var cleanAt = (opts && opts.clean) ? firstCleanPlayableIndex(state.songs) : -1;
        state.index = cleanAt >= 0 ? cleanAt : firstPlayableIndex(state.songs);
        // Attempt autoplay, but let the ACTUAL Spotify events set state.playing —
        // browsers block autoplay-with-sound, so the tape shows "play" until the
        // controller confirms playback, keeping the first click a real Play.
        state.playing = false;
        state.wantAutoplay = true;
        cards.forEach(function (item) { item.classList.toggle('is-playing', item === card); });
        modal.hidden = false;
        // Picking a city is a request for the full cassette, so any floating
        // case steps aside (its audio stops; this card's is about to start).
        if (window.TgbCassette) window.TgbCassette.handoff();
        minimized = false;
        // The player is part of the page now, so it does not take the page
        // hostage: locking the scroll behind an element that is always on
        // screen would make the grid unreachable.
        if (!modal.classList.contains('sx-modal--inline')) {
          document.body.style.overflow = 'hidden';
        }
        renderModal();
      }

      function closeModal() {
        if (!modal) return;
        modal.hidden = true;
        minimized = false;
        closeArtLightbox();
        clearPreload();          // destroy the preloaded (next-track) controller
        destroyActivePlayer();   // destroy the active controller so audio fully stops
        state.playing = false;
        state.wantAutoplay = false;
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        document.body.style.overflow = '';
        updatePlaybackUi();
        // Closing is the one action that ends the roaming session. Until this
        // happens the case follows the listener onto games / shop / highlights.
        if (window.TgbCassette) window.TgbCassette.clear();
      }

      // STOP: silence the deck and leave it standing.
      //
      // closeModal is still here and still used by the overlay path (a page
      // without a #heroDeck falls back to it) and by the roaming case. What this
      // does NOT do is hide the player or clear the roaming session: the tape
      // stays loaded, the transport shows Play, and pressing Play starts it
      // again. Hiding a permanent fixture would leave a hole in the header.
      function stopPlayback() {
        if (!modal) return;
        if (!modal.classList.contains('sx-modal--inline')) { closeModal(); return; }
        closeArtLightbox();
        clearPreload();          // the preloaded next-track controller
        destroyActivePlayer();   // the active one, so the audio really stops
        state.playing = false;
        state.wantAutoplay = false;
        updatePlaybackUi();
      }

      // ── Minimize + the roaming session ────────────────────────────────────
      // Minimizing hands playback to the SAME floating case the other pages
      // use, so the minimized player looks identical everywhere. The cost is a
      // brief gap: the case builds its own Spotify embed, and an iframe cannot
      // be moved between DOM positions without reloading. The click is a user
      // gesture, so the new embed is allowed to start itself.
      function setMinimized(on) {
        if (!on) { expandFromCase(); return; }
        if (!modal || modal.hidden) return;
        // MINIMIZE PAUSES. The session is written BEFORE the state is changed,
        // and playing is forced false in it, so the case picks the tape up
        // stopped rather than carrying the sound on into the corner.
        //
        // The order matters: cassetteSessionPayload reads state.playing, so
        // clearing it after the write would save the old value and the case
        // would start playing anyway.
        state.playing = false;
        saveCassetteSession(true);
        modal.hidden = true;
        minimized = true;
        document.body.style.overflow = '';
        closeArtLightbox();
        clearPreload();
        destroyActivePlayer();
        state.playing = false;
        updatePlaybackUi();
        mountMiniCase();
      }

      function mountMiniCase() {
        if (!window.TgbCassette) return;
        window.TgbCassette.mount({ onExpand: expandFromCase });
      }

      // Case → full cassette. Takes the case down without ending the session so
      // the modal can resume at whatever position the case reached.
      function expandFromCase() {
        if (!window.TgbCassette) return;
        var session = window.TgbCassette.handoff();
        minimized = false;
        if (!session || !session.city) return;
        var card = cardForCity(session.city);
        if (!card) return;
        openCard(card);
        var wanted = (session.songs[session.index] || {}).href;
        for (var i = 0; i < state.songs.length; i++) {

        }
        state.resumeAt = Math.max(0, Number(session.position) || 0);
        state.wantAutoplay = !!session.playing;
        renderModal();
      }

      // Snapshot enough for another page to rebuild this exact moment: the
      // playlist, where we are in it, and how far into the track.
      function cassetteSessionPayload() {
        var mount = modal && modal.querySelector('.tgb-cass-mount');
        return {
          songs: state.songs.map(function (song) {
            // blurb rides along: the case shows the same track explanation the
            // cassette label carries.
            return { href: song.href, title: song.title, artist: song.artist, blurb: song.blurb };
          }),
          index: state.index,
          position: state.position || 0,
          duration: state.duration || 0,
          playing: !!state.playing,
          city: currentCityLabel(),
          accent: (mount && mount.style.getPropertyValue('--tgb-accent').trim()) || '',

      }

      var sessionSaveAt = 0;
      function saveCassetteSession(force) {
        if (!window.TgbCassette || !modal || modal.hidden || !state.songs.length) return;
        var now = new Date().getTime();

        sessionSaveAt = now;
        window.TgbCassette.write(cassetteSessionPayload());
      }

      // Coming back from another page: reopen that city's cassette, minimized,
      // on the same track and offset the case was showing.
      // Arriving with a session in flight (from another page, or a reload):
      // show the floating case, exactly as any other page would. Expanding it
      // opens the full cassette at the same spot.
      // Returns TRUE when it restored something, so the caller knows not to
      // open a random tape over the top of it. It used to return undefined on
      // every path, which made the random pick unconditional and would have
      // thrown away a session carried in from another page.
      // THIS PAGE ALWAYS SHOWS THE FULL DECK. The little floating case is for
      // everywhere ELSE: it exists so a tape keeps playing while you walk over
      // to the games or the shop, and it is the only player those pages have.
      // Here there is a deck in the header, permanently, so arriving with a
      // session in progress and getting a thumbnail in the corner meant the page
      // about cassettes was the one page not showing you one.
      //
      // The ?expand=1 branch went with it. It existed to force the full player
      // when arriving from the case's maximize button, which is now what every
      // arrival does, so the flag had nothing left to switch. The URL is still
      // tidied if it turns up on an old link.

      // A track finished on its own → roll on to the next (looping the playlist),
      // keeping playback going and using the preloaded controller when ready.
      function autoAdvanceNext() {
        if (state.songs.length < 2) return;
        var newIndex = (state.index + 1) % state.songs.length;
        state.playing = true;
        promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        renderModal();
      }

      function step(delta) {
        if (!state.songs.length) return;
        var wasPlaying = state.playing;
        var newIndex = (state.index + delta + state.songs.length) % state.songs.length;
        // A forward skip while playing can promote the preloaded controller for
        // an instant transition (falls back to a normal load if not ready yet).
        if (delta > 0 && wasPlaying) promotePreloaded(state.songs[newIndex]);
        state.index = newIndex;
        state.playing = wasPlaying;
        renderModal();
      }

      // Give each city name on its case spine a slight, consistent print tilt.
      // Seeded off the slug so it's stable across reloads.
      function slugSeed(str) {

        for (var i = 0; i < str.length; i += 1) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        return h;
      }
      // Keep the city name aligned on the spine and apply only a small tilt.
      function jitterTitle(card, title) {
        if (!title) return;

        var tilt = ((seed % 200) / 100) - 1;          // -1deg..+1deg
        title.style.transform = 'rotate(' + tilt.toFixed(2) + 'deg)';
      }

      function buildSupabaseUrl(table, params) {
        var pairs = [];
        Object.keys(params || {}).forEach(function (key) {
          if (params[key] == null) return;
          pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));

      }

      function fetchJson(url, options) {
        return fetch(url, options || {}).then(function (response) {
          if (!response.ok) throw new Error('Request failed: ' + response.status + ' ' + url);
          return response.json();
        });
      }

      function slugify(value) {
        return String(value || '')
          .toLowerCase()
          .replace(/&/g, ' and ')
          .replace(/[^a-z0-9]+/g, '-')

      }

      function citySlug(row) {
        return slugify(row && (row.slug || row.city_slug || row.city || row.city_name));
      }

      function cityLabel(row) {
        if (!row) return '';
        if (row.city) return String(row.city).trim();

      function cityShortLabel(row) {

      }

      function songHref(song) {

      }

      function normalizedSong(song) {
        return {
          href: songHref(song),
          title: (song && song.title) || 'Track',
          artist: (song && song.artist) || 'Spotify',
          blurb: (song && song.blurb) || '',
          explicit: !!(song && song.explicit)
        };
      }

      function appendText(parent, cls, value) {
        var span = document.createElement('span');
        span.className = cls;
        span.textContent = value || '';
        parent.appendChild(span);
        return span;
      }

      function createSongItem(song) {
        var item = document.createElement('li');
        var link = document.createElement('a');
        link.className = 'song-link';
        link.href = song.href;
        link.target = '_blank';
        link.rel = 'noopener';
        if (song.explicit) link.dataset.explicit = '1';
        var main = document.createElement('span');
        main.className = 'song-main';
        appendText(main, 'song-title', song.title);
        appendText(main, 'song-artist', song.artist);
        link.appendChild(main);
        appendText(link, 'song-blurb', song.blurb);
        appendText(link, 'song-play', 'Play');
        item.appendChild(link);
        return item;
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();

      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);
      }

      function soundtrackTracks(soundtrack) {
        return ((soundtrack && Array.isArray(soundtrack.songs)) ? soundtrack.songs : [])
          .filter(function (song) {
            return song && !isArchivedSong(song) && (song.spotifyId || song.title || song.artist || song.href);
          });
      }

      function soundtrackTrackCount(soundtrack) {
        return soundtrackTracks(soundtrack).length;
      }

      function soundtrackSpineTitle(cityTitle, soundtrack) {
        var title = String(cityTitle || '').trim();
        var tag = String((soundtrack && soundtrack.spine_tag) || '').trim();
        if (!tag) return title;
        var position = String((soundtrack && soundtrack.spine_tag_position) || 'after').toLowerCase();
        return position === 'before' ? (tag + ' ' + title).trim() : (title + ' ' + tag).trim();
      }

      function createTapeCard(city, soundtrack) {
        var slug = citySlug(city);
        var label = cityLabel(city);
        var displayLabel = cityShortLabel(city) || label;
        var spineTitle = soundtrackSpineTitle(displayLabel, soundtrack);
        var article = document.createElement('article');
        article.className = 'playlist-card';
        article.id = slug;
        article.dataset.citySlug = slug;
        article.dataset.location = label;
        article._tgbSongs = soundtrackTracks(soundtrack).map(normalizedSong);

        var body = document.createElement('div');
        body.className = 'playlist-body';
        var heading = document.createElement('div');
        heading.className = 'playlist-heading';
        var title = document.createElement('h2');
        title.className = 'playlist-title';
        title.textContent = spineTitle;
        heading.appendChild(title);
        var list = document.createElement('ol');
        list.className = 'song-list';
        article._tgbSongs.forEach(function (song) { list.appendChild(createSongItem(song)); });
        body.append(heading, list);
        article.appendChild(body);
        return article;
      }

      function wireCard(card) {
        var title = card.querySelector('.playlist-title');
        var label = title ? title.textContent.trim() : 'city';
        jitterTitle(card, title);
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', 'Play ' + label + ' tape');
        card.addEventListener('click', function () { openCard(card); });
        card.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCard(card);
          }
        });
      }

      // BY TAPE KEY FIRST, then by the old city keys as a fallback.
      //
      // A city can hold several tapes now, so a city string no longer names one
      // card: New Orleans has three, and every one of them was landing on the
      // same entry in this map, so all three rail chips opened the first card.
      // The tape key (the card's own id) is unique by construction.
      //
      // The city keys are kept because they are what a shared #city= link and a
      // carried-over session speak, and for a one-tape city they still name the
      // right card. First writer wins, so a city with several tapes resolves to
      // its first, which is what those links always meant.
      function indexCards() {
        cardByCity = {};
        cards.forEach(function (card) {
          var byKey = String(card.id || '').toLowerCase();
          if (byKey && !cardByCity[byKey]) cardByCity[byKey] = card;
          var title = card.querySelector('.playlist-title');
          var byTitle = normCityKey(title ? title.textContent : '');
          var byLocation = normCityKey(card.getAttribute('data-location') || '');
          var bySlug = String(card.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          if (byTitle && !cardByCity[byTitle]) cardByCity[byTitle] = card;
          if (byLocation && !cardByCity[byLocation]) cardByCity[byLocation] = card;
          if (bySlug && !cardByCity[bySlug]) cardByCity[bySlug] = card;
        });
      }

      // A card by the tape key alone. Used by the rail, which knows exactly
      // which tape each chip stands for.
      function cardForTapeKey(key) {
        return cardByCity[String(key || '').toLowerCase()] || null;
      }

      function renderSoundGrid(cities) {
        if (!grid) return;
        var withTapes = cities
          .map(function (city) {
            var slug = citySlug(city);
            return { city: city, soundtrack: soundtracksBySlug[slug] || null };
          })
          .filter(function (entry) { return soundtrackTrackCount(entry.soundtrack) > 0; });

        grid.innerHTML = '';
        if (!withTapes.length) {
          var empty = document.createElement('p');
          empty.className = 'sound-grid-status';
          empty.textContent = 'No city tapes are available yet.';
          grid.appendChild(empty);
          cards = [];
          indexCards();
          return;
        }
        withTapes.forEach(function (entry) { grid.appendChild(createTapeCard(entry.city, entry.soundtrack)); });
        cards = Array.prototype.slice.call(grid.querySelectorAll('.playlist-card'));
        cards.forEach(wireCard);
        indexCards();
      }

      // ── LISTEN BY CITY: open a city's cassette from the search or rail ──────
      // Normalize a city string to a comparison key: name portion (before the
      // first comma), lowercased, non-alphanumerics stripped. Robust to
      // "City, Region", "Washington, D.C.", "London, England, United Kingdom".
      function normCityKey(str) {
        return String(str || '').split(',')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
      }
      function cardForCity(cityStr) {
        return cardByCity[normCityKey(cityStr)] || null;
      }

      // Open the cassette in a "no soundtrack yet" state: city on the label, a
      // clear message where the now-playing info goes, transport dimmed, and
      // the Suggest-a-song button (pre-filled for this city) made prominent.
      function openNoSoundtrack(cityLabel) {
        modal = modal || buildModal();
        var panel = modal.querySelector('.sx-panel');
        state.card = null;
        state.songs = [];
        state.index = 0;
        state.playing = false;
        state.pendingCity = cityLabel || '';
        cards.forEach(function (item) { item.classList.remove('is-playing'); });
        panel.classList.add('sx-empty');
        // Tear down any live Spotify controller left over from a prior open.
        clearPreload();
        destroyActivePlayer();
        var wrap = modal.querySelector('.tgb-cass');
        if (wrap) wrap.classList.remove('is-playing');
        applyCassetteAccent(null);
        applyStripes(null);
        state.duration = 0;
        state.position = 0;
        updateSpools(0);
        if (cass) {
          fitText(cass.artist, cityLabel || '', 78);
          fitText(cass.title, 'No soundtrack yet', 80);
          fitText(cass.blurb, 'Be the first — suggest a track', 82);
          setExplicitBadge(false);
          updateBrandLine();
          clearArt();
        }
        updateSuggestLabel();
        var host = modal.querySelector('.sx-player-host');
        host.textContent = '';
        setSpotifyLink('');
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        updatePlaybackUi();
      }

      // Entry point for the search + rail: jump straight to the cassette.
      // Open the card a rail chip or a search result stands for. By KEY, so a
      // city's second and third tapes open themselves rather than the first.
      function openTapeEntry(entry) {
        var card = entry && entry.key ? cardForTapeKey(entry.key) : null;
        if (card) openCard(card);
        else openCityByName(entry && entry.city, entry && (entry.label || entry.city));
      }

      function openCityByName(cityStr, displayLabel) {
        var card = cardForCity(cityStr);
        if (card) openCard(card);
        else openNoSoundtrack(displayLabel || cityStr);
      }

      // ── Geo badge helpers (ported from the shop's Shop By City) ────────────
      function cityGeoBadge(label) {
        if (window.TgbGeo && typeof window.TgbGeo.geoBadge === 'function') {
          return window.TgbGeo.geoBadge(label);
        }
        return null;
      }
      function svgPathCenter(pathData, fallbackX, fallbackY) {
        var numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
        if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < numbers.length - 1; i += 2) {
          var x = Number(numbers[i]);
          var y = Number(numbers[i + 1]);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          minX = Math.min(minX, x); minY = Math.min(minY, y);
          maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
        }
        if (![minX, minY, maxX, maxY].every(Number.isFinite)) return { x: fallbackX, y: fallbackY };
        return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
      }
      function buildGeoBadge(badge) {
        var cls = function (s) { return 'hero-meta-list-geo' + (s ? ' ' + s : ''); };
        var shapes = window.US_STATE_SHAPES || null;
        if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
          var NS = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
          svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
          svg.setAttribute('aria-hidden', 'true');
          svg.setAttribute('focusable', 'false');
          var path = document.createElementNS(NS, 'path');
          path.setAttribute('d', shapes[badge.value]);
          svg.appendChild(path);
          var pt = svgPathCenter(shapes[badge.value], (shapes._w || 40) / 2, (shapes._h || 24) / 2);
          var text = document.createElementNS(NS, 'text');
          text.setAttribute('x', String(pt.x));
          text.setAttribute('y', String(pt.y));
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('dominant-baseline', 'middle');
          text.setAttribute('alignment-baseline', 'middle');
          text.setAttribute('dy', '0.04em');
          text.textContent = badge.value;
          svg.appendChild(text);
          return svg;
        }
        var span = document.createElement('span');
        if (badge) {
          span.className = cls('hero-meta-list-geo--' + badge.kind);
          if (badge.kind === 'country') {
            var lbl = document.createElement('span');
            lbl.className = 'hero-meta-list-geo-label';
            lbl.textContent = badge.value;
            span.appendChild(lbl);
          } else {
            span.textContent = badge.value;
          }
          span.setAttribute('aria-hidden', 'true');
        } else {
          span.className = cls('');
        }
        return span;
      }

      // ── City panel: fetch the cities behind the tapes, build the rail ──────
      // Only a city that HAS a tape is ever rendered here, so ask for those rows
      // rather than the whole catalogue. That catalogue is ~1350 rows / ~370 KB
      // and about 78 of them matter, which made it the single heaviest thing on
      // the page (measured 2026-08-06).
      //
      // Two rules this must not break:
      //   * `select` stays '*'. Naming columns 400s on a database that has not
      //     run a migration yet, which is why the whole page avoids column lists.
      //     This narrows ROWS, not columns, so that property is untouched.
      //   * the filter is on `slug` only — the primary key, which cannot be
      //     missing or renamed. No dependency on a hide flag is introduced.
      //
      // Falls back to the unfiltered fetch when there are no slugs yet, or when
      // the list is long enough to risk a URL-length limit; correctness first,
      // the saving is only an optimisation.
      var CITY_FILTER_MAX_SLUGS = 300;

      function fetchCities(slugs) {
        var params = { select: '*', order: 'city.asc' };
        var list = (Array.isArray(slugs) ? slugs : []).filter(Boolean);
        if (list.length && list.length <= CITY_FILTER_MAX_SLUGS) {
          // Slugs are [a-z0-9-] by construction (tgb_city_slug), so they need no
          // quoting inside in.(); buildSupabaseUrl encodes the value as a whole.
          params.slug = 'in.(' + list.join(',') + ')';
        }
        return fetchJson(buildSupabaseUrl('cities', params), {
          headers: SB_HEADERS,
          cache: 'no-store'
        });
      }

      function displayNameFromSlug(slug) {
        var special = {
          'rio-de-janeiro': 'Rio de Janeiro',
          'saint-denis': 'Saint-Denis',
          'st-louis': 'St. Louis',
          'washington-dc': 'Washington, D.C.'
        };
        if (special[slug]) return special[slug];
        return String(slug || '')
          .split('-')
          .filter(Boolean)
          .map(function (part) {
            return part.length <= 2 ? part.toUpperCase() : part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');
      }

      function fallbackCityRowsFromSoundtracks(soundtracks) {
        return (soundtracks || [])
          .filter(function (tracklist) { return tracklist && tracklist.city_slug && soundtrackTrackCount(tracklist) > 0; })
          .map(function (tracklist, index) {
            var label = displayNameFromSlug(tracklist.city_slug);
            return {
              // The TAPE key, so a city's second tape is a second lifeboat row
              // rather than a duplicate of the first.
              slug: tapeKey(tracklist),
              city: label,
              label: label,
              city_name: label,
              sort_order: index + 1
            };
          });
      }

      // KEYED BY TAPE, NOT BY CITY (2026-08-16). A city may hold several tapes,
      // so the key is the tape's own: the city's FIRST tape keeps the bare city
      // slug and every later one takes "<slug>--<tape id>".
      //
      // The first tape keeping the plain slug is the load-bearing half. Every
      // #city= deep link ever shared, and every carried-over cassette session,
      // is a city slug, and they all still resolve to the tape they always
      // meant. A scheme that keyed all of them by tape id would break the lot.
      function indexSoundtracks(data) {
        var soundtracks = Array.isArray(data && data.soundtracks) ? data.soundtracks : [];
        soundtracksBySlug = {};
        soundtracks.forEach(function (tracklist) {
          var key = tapeKey(tracklist);
          if (key) soundtracksBySlug[key] = tracklist;
        });
        return soundtracks;
      }

      function tapeKey(tracklist) {
        if (!tracklist) return '';
        return slugify(tracklist.key || tracklist.city_slug);
      }

      // ── Tapes come from Supabase; the JSON file is only a lifeboat ──────────
      // public.soundtracks (one row per tape) + public.soundtrack_songs (one row
      // per track) replaced soundtracks/soundtracks.json as the source of truth on
      // 2026-07-29. The file is still committed and still read, but only when
      // Supabase cannot be reached.

      // PostgREST caps a response at 1000 rows and truncates silently, so the
      // song read pages with Range until a short page comes back. There are 929
      // songs today — this crosses the cap on its own within months.
      function fetchAllRows(url) {
        var PAGE = 1000;
        var all = [];
        function page(from) {
          return fetch(url, {
            headers: Object.assign({}, SB_HEADERS, {
              Range: from + '-' + (from + PAGE - 1)
            }),
            cache: 'no-store'
          }).then(function (response) {
            if (!response.ok) throw new Error('Request failed: ' + response.status + ' ' + url);
            return response.json();
          }).then(function (rows) {
            var list = Array.isArray(rows) ? rows : [];
            all = all.concat(list);
            if (list.length < PAGE) return all;
            return page(from + PAGE);
          });
        }
        return page(0);
      }

      // Rebuild the shape the rest of this page already speaks, so the cassette
      // renderer, the spine copy, and the archived-song filter are unchanged
      // whichever source won.
      function soundtracksFromRows(tapeRows, songRows) {
        var byTape = {};
        var order = [];
        var seenCity = {};
        (Array.isArray(tapeRows) ? tapeRows : []).forEach(function (row) {
          var slug = slugify(row && row.city_slug);
          if (!slug || truthyFlag(row && row.archived)) return;
          // The first live tape in a city answers to the city slug; the rest get
          // their own key. Rows arrive ordered by city then id, so "first" is
          // stable across loads rather than whichever one the database returned
          // first, which would move a shared link from one tape to another.
          var key = seenCity[slug] ? (slug + '--' + row.id) : slug;
          seenCity[slug] = true;
          if (byTape[key]) return;
          byTape[key] = {
            key: key,
            tape_id: row.id,
            city_slug: row.city_slug,
            spine_tag: row.spine_tag || '',
            spine_tag_position: row.spine_tag_position || '',
            songs: []
          };
          order.push(key);
        });
        // Songs join on tape_id now. Joining on city_slug would put every Denver
        // song on whichever Denver tape came first, which is exactly the bug
        // this whole change exists to remove.
        var byTapeId = {};
        order.forEach(function (key) { byTapeId[byTape[key].tape_id] = byTape[key]; });
        (Array.isArray(songRows) ? songRows : []).forEach(function (row) {
          var tape = byTapeId[row && row.tape_id];
          if (!tape) return;
          tape.songs.push({
            position: Number(row.position) || 0,
            id: row.id,
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || '',
            spotifyId: row.spotify_id || '',
            explicit: !!row.explicit,
            archived: !!row.archived
          });
        });
        // Play order is the position column, id breaking ties — the same order
        // the songs sat in inside the JSON file.
        order.forEach(function (slug) {
          byTape[slug].songs.sort(function (a, b) {
            return (a.position - b.position) || (Number(a.id) - Number(b.id));
          });
        });
        return { soundtracks: order.map(function (slug) { return byTape[slug]; }) };
      }

      function fetchSoundtracks() {
        return Promise.all([
          // Ordered by city then id so "the city's first tape" is the same tape
          // on every load. See tapeKey.
          fetchAllRows(buildSupabaseUrl('soundtracks', { select: '*', order: 'city_slug.asc,id.asc' })),
          fetchAllRows(buildSupabaseUrl('soundtrack_songs', {
            select: '*',
            order: 'tape_id.asc,position.asc,id.asc'
          }))
        ]).then(function (results) {
          var data = soundtracksFromRows(results[0], results[1]);
          if (!data.soundtracks.length) throw new Error('No soundtrack rows returned.');
          return data;
        });
        // No fallback file. Until 2026-08-06 a failure here fell back to a
        // committed soundtracks.json, which meant an outage rendered a silently
        // stale catalogue that looked fine — the failure mode was invisible, and
        // the file had to be regenerated and committed forever to stay honest.
        // The tables are the only source now, so a failure surfaces as
        // "Could not load soundtracks." in the caller's catch. Don't reintroduce
        // a snapshot; fix the fetch.
      }

      function setSoundHeroTitle(count) {
        if (!soundHeroTitleEl) return;
        var n = Math.max(0, Math.round(Number(count) || 0));
        // TWO DELIBERATE LINES, not a wrap: the count on its own, the word
        // under it. Left to wrap naturally the break lands wherever the cell
        // happens to end, which on this two-column header moves with the
        // viewport. Explicit spans put it in the same place every time, and the
        // CSS keeps each line unbreakable so a narrow cell shrinks the type
        // rather than splitting "SOUNDTRACKS" across two rows.
        soundHeroTitleEl.textContent = '';
        var line = function (value) {
          var span = document.createElement('span');
          span.className = 'hero-headline-line';
          span.textContent = value;
          soundHeroTitleEl.appendChild(span);
        };
        if (n) line(String(n));
        line(n === 1 ? 'Soundtrack' : 'Soundtracks');
      }

      // Every tape key belonging to a city, in load order, so a city's cards sit
      // together and in the same sequence on every visit.
      function tapeKeysForCity(slug) {
        var keys = [];
        Object.keys(soundtracksBySlug).forEach(function (key) {
          if (slugify(soundtracksBySlug[key].city_slug) === slug) keys.push(key);
        });
        return keys;
      }

      function setCityEntries(rows, allowSoundtrackSlugFallback) {
        var seen = {};
        var rowsList = Array.isArray(rows) ? rows : [];
        // ONE CARD PER TAPE. A city row can now produce several: it is expanded
        // into one entry per tape it holds, each carrying that tape's key as its
        // slug, which is what the grid, the rail and the deep links look tapes up
        // by. A city with one tape produces exactly the entry it always did.
        var rowsWithSoundtracks = [];
        rowsList.forEach(function (row) {
          // Prefers the per-surface hide_from_soundtracks column, falling back
          // to the retired `ignored` flag only when that column is absent, so
          // this works before and after 2026072901_cities_hide_flags.sql.
          if (row && row.hide_from_soundtracks === true) return;
          if (row && row.hide_from_soundtracks === undefined && row.ignored === true) return;
          var slug = citySlug(row);
          if (!slug || seen[slug]) return;
          seen[slug] = true;
          tapeKeysForCity(slug).forEach(function (key) {
            if (soundtrackTrackCount(soundtracksBySlug[key]) <= 0) return;
            // A COPY carrying the tape's key as its slug. The city row itself is
            // shared by every tape in the city and must not be mutated, or the
            // second tape would rename the first.
            var entry = Object.assign({}, row, { slug: key });
            seen[key] = true;
            rowsWithSoundtracks.push(entry);
          });
        });
        if (allowSoundtrackSlugFallback) {
          Object.keys(soundtracksBySlug).forEach(function (slug) {
            var tracklist = soundtracksBySlug[slug];
            if (!slug || seen[slug] || soundtrackTrackCount(tracklist) <= 0) return;
            var label = displayNameFromSlug((tracklist && tracklist.city_slug) || slug);
            seen[slug] = true;
            rowsWithSoundtracks.push({
              slug: slug,
              city: label,
              label: label,
              city_name: label
            });
          });
        }
        cityEntries = rowsWithSoundtracks
          // Alphabetical by city name (full "City, Region" as the tiebreak).
          .sort(function (a, b) {
            return cityShortLabel(a).localeCompare(cityShortLabel(b), undefined, { sensitivity: 'base', numeric: true })
              || cityLabel(a).localeCompare(cityLabel(b), undefined, { sensitivity: 'base' });
          });
        setSoundHeroTitle(cityEntries.length);
        renderSoundGrid(cityEntries);
        setupListenCityPanel();
        // Cards exist now, so a session carried in from another page can be
        // reopened against the right city. An explicit #city deep link wins over
        // reopening a carried-over session.
        // A NEW TAPE EVERY TIME YOU ARRIVE.
        //
        // Only a link outranks it: #tape= or #track= names something specific
        // and must never be overwritten by a random pick. Everything else gets
        // a fresh tape.
        //
        // A CARRIED SESSION NO LONGER WINS HERE, deliberately. Restoring it
        // meant a reload played the same tape again and again, which is the
        // opposite of what this deck is for; the session still exists and the
        // roaming case still picks it up on the OTHER pages, which is the only
        // place it was ever doing real work.
        if (!openCardFromHash()) openRandomCard();
      }

      function loadSoundPageData() {
        fetchSoundtracks()
          .then(function (data) {
            var soundtracks = indexSoundtracks(data || {});
            // soundtracksBySlug is filled by indexSoundtracks above, so the tape
            // slugs are known here and the city fetch can ask for just those.
            // CITY slugs, not tape keys: a key can be "denver--204", which is
            // not a row in public.cities and would narrow the fetch to nothing.
            var citySlugs = {};
            soundtracks.forEach(function (tape) {
              var slug = slugify(tape && tape.city_slug);
              if (slug) citySlugs[slug] = true;
            });
            return fetchCities(Object.keys(citySlugs))
              .catch(function (error) {
                console.warn('City catalog unavailable; rendering soundtrack slug fallback.', error);
                return fallbackCityRowsFromSoundtracks(soundtracks);
              })
              .then(function (rows) {
                var hasCityCatalog = Array.isArray(rows) && rows.length > 0;
                var cityRows = hasCityCatalog ? rows : fallbackCityRowsFromSoundtracks(soundtracks);
                setCityEntries(cityRows, !hasCityCatalog);
              });
          })
          .catch(function (error) {
            console.error(error);
            if (statusEl) statusEl.textContent = 'Could not load soundtracks.';
          });
      }

      function setupListenCityPanel() {
        var panel = document.getElementById('listenCityPanel');
        if (!panel) return;

        var searchEntries = [];

        function chipCount(entry) {
          return entry.hasTape ? (entry.count + ' track' + (entry.count === 1 ? '' : 's')) : 'Add one';
        }

        // ── The rail is gone ────────────────────────────────────────────
        // Deleted with the shelf: PX_PER_SEC, the rAF loop, the drag handlers,
        // the three-chunk clone trick and renderRail. All of it existed to move
        // a row of chips that no longer exists.
        //
        // createChip and the spine CSS went too. If a shelf ever comes back it
        // is a new thing, not this one revived: it belongs somewhere that is not
        // the header, because the header now holds the player.

        function setupSearch() {
          var wrap = document.getElementById('lcSearch');
          var input = document.getElementById('lcSearchInput');
          var toggle = document.getElementById('lcSearchToggle');
          var results = document.getElementById('lcSearchResults');
          if (!wrap || !input || !toggle || !results) return;
          document.body.appendChild(results);
          var matches = [];
          var activeIndex = -1;
          var norm = function (s) { return String(s || '').toLowerCase().trim(); };

          function positionResults() {
            if (results.hidden) return;
            var r = input.getBoundingClientRect();
            results.style.top = (r.bottom + 8) + 'px';
            results.style.right = (window.innerWidth - r.right) + 'px';
            results.style.left = 'auto';
          }
          window.addEventListener('scroll', positionResults, true);
          window.addEventListener('resize', positionResults);

          function openSearch() {
            wrap.classList.add('is-open');
            toggle.setAttribute('aria-expanded', 'true');
            input.setAttribute('aria-expanded', 'true');
            input.tabIndex = 0;
            input.focus();
          }
          function hideResults() {
            results.hidden = true;
            results.innerHTML = '';
            matches = [];
            activeIndex = -1;
            panel.classList.remove('is-searching');
          }
          function closeSearch() {
            wrap.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            input.setAttribute('aria-expanded', 'false');
            input.tabIndex = -1;
            input.value = '';
            hideResults();
          }
          function go(entry) {
            if (!entry) return;
            closeSearch();
            // The same tape the result names, not its city's first tape.
            openTapeEntry(entry);
          }
          function setActive(i) {
            activeIndex = i;
            Array.prototype.forEach.call(results.querySelectorAll('.lc-search-result'), function (el, idx) {
              var on = idx === i;
              el.classList.toggle('is-active', on);
              el.setAttribute('aria-selected', on ? 'true' : 'false');
              if (on) el.scrollIntoView({ block: 'nearest' });
            });
          }
          function render() {
            var q = norm(input.value);
            if (!q) { hideResults(); return; }
            matches = searchEntries.filter(function (e) {
              return norm(e.label).indexOf(q) !== -1 || norm(e.city).indexOf(q) !== -1;
            }).slice(0, 8);
            activeIndex = matches.length ? 0 : -1;
            results.innerHTML = '';
            if (!matches.length) {
              var empty = document.createElement('div');
              empty.className = 'lc-search-empty';
              empty.textContent = 'No cities match “' + input.value.trim() + '”.';
              results.appendChild(empty);
            } else {
              matches.forEach(function (entry, i) {
                var a = document.createElement('button');
                a.type = 'button';
                a.className = 'lc-search-result' + (i === activeIndex ? ' is-active' : '');
                a.setAttribute('role', 'option');
                a.setAttribute('aria-selected', i === activeIndex ? 'true' : 'false');
                var name = document.createElement('span');
                name.className = 'lc-search-result-name';
                name.textContent = entry.label;
                var count = document.createElement('span');
                count.className = 'lc-search-result-count';
                count.textContent = chipCount(entry);
                a.append(name, count);
                a.addEventListener('mouseenter', function () { setActive(i); });
                a.addEventListener('click', function () { go(entry); });
                results.appendChild(a);
              });
            }
            results.hidden = false;
            positionResults();
            panel.classList.add('is-searching');
          }

          toggle.addEventListener('click', function () {
            if (wrap.classList.contains('is-open')) closeSearch();
            else openSearch();
          });
          input.addEventListener('input', render);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { e.preventDefault(); closeSearch(); toggle.focus(); return; }
            if (!matches.length) { if (e.key === 'Enter') e.preventDefault(); return; }
            if (e.key === 'ArrowDown') { e.preventDefault(); setActive((activeIndex + 1) % matches.length); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((activeIndex - 1 + matches.length) % matches.length); }
            else if (e.key === 'Enter') { e.preventDefault(); go(matches[Math.max(0, activeIndex)]); }
          });
          document.addEventListener('click', function (e) {
            if (wrap.contains(e.target) || results.contains(e.target)) return;
            if (wrap.classList.contains('is-open')) closeSearch();
          });
        }

        // ONE ENTRY PER TAPE, labelled with the tape's own name.
        //
        // The rail used to be one chip per city carrying the city's name, which
        // read as three identical New Orleans chips the day a city could hold
        // three tapes, all of them opening the same card. The label is now the
        // name as it reads down the spine, so the chips are told apart by what
        // they actually are.
        function buildEntry(row) {
          var city = cityLabel(row);
          var key = citySlug(row);
          var soundtrack = soundtracksBySlug[key] || null;
          var shortLabel = cityShortLabel(row) || city;
          // trim() rather than text(): that helper belongs to the admin page,
          // and calling it here threw a ReferenceError inside buildEntry, which
          // emptied the entry list and left the whole rail unbuilt.
          var spine = String((soundtrack && soundtrack.spine_tag) || '').trim();
          var pos = String((soundtrack && soundtrack.spine_tag_position) || '').trim();
          // Same order the cassette spine uses, so the chip and the card agree.
          var label = !spine ? shortLabel
            : (pos === 'before' ? (spine + ' ' + shortLabel) : (shortLabel + ' ' + spine));
          return {
            city: city,
            key: key,
            label: label,
            row: row,
            hasTape: !!cardForTapeKey(key),
            count: soundtrackTrackCount(soundtrack)
          };
        }

        setupSearch();
        var entries = cityEntries.map(buildEntry).filter(function (e) { return e.city; });
        if (!entries.length) return; // keep the reserved panel; no pop
        searchEntries = entries;
      }

      // ONE TAPE, AT RANDOM, for a page that has just loaded and been asked for
      // nothing in particular. Only from tapes that actually have tracks: an
      // empty case in the deck is a worse first impression than silence.
      //
      // Autoplay is REQUESTED, not assumed. openCard sets wantAutoplay and lets
      // the real Spotify events decide: browsers block sound without a gesture,
      // so the tape sits showing Play until playback is genuinely confirmed.
      // That is the existing behaviour and the reason this is safe to do on
      // load rather than obnoxious.
      function openRandomCard() {
        var playable = cards.filter(function (card) {
          return songsFor(card).length > 0;
        });
        if (!playable.length) return false;
        // Prefer a tape that HAS a clean track to open on. Constraining the
        // starting track is not enough on its own: a tape whose tracks are all
        // explicit would fall back to its first one and play it, which is the
        // thing being avoided. Only if no tape on the shelf has a clean track
        // does the whole shelf come back into play, since silence on load is a
        // worse answer than the last resort.
        var clean = playable.filter(function (card) {
          return firstCleanPlayableIndex(songsFor(card)) >= 0;
        });
        var pool = clean.length ? clean : playable;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        openCard(pick, { clean: true });
        return true;
      }

      // Deep link: /soundtracks/#milwaukee opens that city's cassette. The Tape Room's
      // "Open Tape" buttons point here. Needed because the cards are built after
      // the Supabase fetch resolves, so the browser's own anchor jump fires while
      // the grid is still a loading message and lands nowhere — openCardFromHash
      // runs once the cards exist instead, and again on hashchange for a link
      // followed while the page is already open.
      function citySlugFromHash() {
        var raw = String(window.location.hash || '').replace(/^#/, '');
        if (!raw) return '';
        try { raw = decodeURIComponent(raw); } catch (e) {}
        return raw;
      }

      function openCardFromHash() {
        var wanted = citySlugFromHash();
        if (!wanted) return false;
        // cardForCity normalizes to letters+digits, so it matches a slug
        // ("kansas-city") and a display name ("Kansas City") alike.
        var card = cardForCity(wanted);
        if (!card) return false;
        try {
          card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } catch (error) {
          card.scrollIntoView();
        }
        openCard(card);
        return true;
      }

      window.addEventListener('hashchange', openCardFromHash);

      loadSoundPageData();
    })();
  </script>
</body>
</html>
