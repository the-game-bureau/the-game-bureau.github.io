<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TAPE ROOM (SOUNDTRACKS ADMIN) | THE GAME BUREAU</title>
  <link rel="icon" href="/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --mc-shell-width: 1180px;
      /* Vertical rhythm between the header and the panels below it, matching
         the Stock Room / Waypoints shells. */
      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
      /* Matched to /mc/socials/ on 2026-08-06 so the admin rooms read as one
         place. The command bar was a neutral grey with hairline edges; socials
         tints it blue and draws the edges roughly twice as strong, which is what
         makes its controls look like a defined panel rather than a faint box. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a {
      color: var(--accent);
    }

    .prompt-layout {
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto;
    }

    .prompt-main {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .prompt-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-top: 8px solid var(--accent);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 36px var(--paper-shadow);
      overflow: hidden;
    }

    .work-panel {
      min-inline-size: 0;
      padding: 6px 14px 13px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
      overflow: visible;
      /* Tighter than the shared .prompt-panel cushion (0 18px 36px). That wide
         soft shadow is right for a modal floating over the page; under a long
         list it just blurs the panel's own edge. Modals keep it. Matched to
         socials' .queue-panel on 2026-08-06. */
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.05);
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      outline: none;
    }

    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn,
      .tape-summary,
      .issue-group-head,
      .tape-summary::before { transition: none; }
    }

    .btn:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      background: rgba(var(--bic-blue-rgb), 0.05);
    }

    .btn.primary:hover {
      background: #24396a;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #24396a;
      color: #fff;
    }

    .btn[disabled] {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      cursor: default;
      opacity: 1;
      pointer-events: none;
    }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .command-bar > legend {
      float: none;
      width: auto;
      padding: 0 7px;
      margin: 0 0 0 10px;
      background: var(--cut-panel-bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .work-panel > legend {
      float: none;
      width: auto;
      padding: 0 7px;
      margin: 0 0 0 10px;
      background: var(--cut-panel-bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .panel-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 12px;
    }

    .panel-tools:empty { display: none; }

    .panel-head-actions select,
    .panel-tools select {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 28px 0 11px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .panel-head-actions select:focus-visible,
    .panel-tools select:focus-visible,
    .btn:focus-visible,
    .tape-summary:focus-visible,
    .editor-field input:focus-visible,
    .editor-field textarea:focus-visible,
    .editor-field select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    

    

    /* A caption line in the panel head, under the counts — not a card. The dot
       is the whole signal: green when the routine ran, red past 26 hours. */
    .run-status {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    /* Green by default. Red is the only state worth interrupting for: past 26
       hours with no new song row, which means a run failed or is paused. */
    .run-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1e7a4b;
    }

    .run-status[data-state="stale"] .run-dot {
      background: var(--bic-red);
    }

    /* Always one line now that this sits under the room title: it wraps only by
       losing the tail to an ellipsis, so the header never grows a second row. */
    .run-body {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .run-body .run-sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Counts, then the run signal, on a single line under the title. Everything
       else about this element comes from .room-substat in admin-shell.css; only
       the row behaviour is local. The middle dot is drawn by CSS so neither half
       has to know about the other. */
    .room-substat--row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .room-substat--row > * { flex: 0 0 auto; }
    .room-substat--row .run-status { min-width: 0; overflow: hidden; }

    .room-substat--row #trackArchiveStatus::after {
      content: "\00b7";
      margin-left: 10px;
      color: var(--line);
    }

    /* Plain text, same weight and colour as the counts line above it. The dot
       carries the state on its own, so the words do not need to shout. */
    .run-line,
    .run-sub {
      color: inherit;
      font: inherit;
    }

    .panel-status {
      min-height: 34px;
      margin: 0 0 12px;
      padding: 9px 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    /* Without this an emptied status leaves a bare grey strip above the list. */
    .panel-status:empty { display: none; }

    /* In the panel head, under the title: a caption, not a banded strip, so it
       drops the status bar's fill, borders and block padding. */
    .panel-headcol {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .panel-status--sub {
      min-height: 0;
      padding: 0;
      border: 0;
      background: none;
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .panel-status.is-error { color: #a03f2d; font-weight: 800; }
    .panel-status.is-success { color: var(--success); font-weight: 800; }
    .panel-status.is-warn { color: #9a4a18; font-weight: 800; }

    .empty {
      padding: 16px;
      border: 1px dashed rgba(var(--bic-blue-rgb), 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.64);
      color: var(--muted);
      line-height: 1.55;
    }

    

    

    

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .chip.warn {
      border-color: rgba(154, 74, 24, 0.28);
      background: rgba(154, 74, 24, 0.08);
      color: #9a4a18;
    }

    .chip.success {
      border-color: rgba(47, 107, 61, 0.28);
      background: rgba(47, 107, 61, 0.08);
      color: var(--success);
    }

    

    

    

    

    

    

    

    

    

    .track-list {
      display: grid;
      gap: 10px;
      max-height: 70vh;
      overflow: auto;
      padding: 0;
    }

    /* Shared by the Track Archive and the Fresh Review list: both are lists of
       collapsible cities. */
    .tape-group {
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .tape-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      cursor: pointer;
      font-weight: 600;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      list-style: none;
    }

    .tape-summary::-webkit-details-marker { display: none; }

    /* Same dashed treatment an archived track gets, one level up. */
    .tape-group.is-archived {
      border-style: dashed;
      background: rgba(var(--bic-blue-rgb), 0.045);
    }

    .tape-group.is-archived > .tape-summary .tape-name {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
      color: var(--muted);
    }

    .tape-archive-btn { white-space: nowrap; }

    /* Own marker so it sits ahead of the city name and rotates when open. */
    .tape-summary::before {
      content: '';
      flex: 0 0 auto;
      width: 0;
      height: 0;
      border-left: 6px solid rgba(var(--bic-blue-rgb), 0.55);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: transform 120ms ease;
    }

    .tape-group[open] > .tape-summary::before {
      transform: rotate(90deg);
    }

    .tape-summary:hover,
    .tape-summary:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.06);
    }

    .tape-name {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* City stays the bold anchor whichever side the spine phrase reads on. */
    .tape-city { font-weight: 800; }

    .tape-spine {
      color: var(--muted);
      font-weight: 500;
    }

    /* Counts sit with the city, not with the buttons, and take the slack so the
       action group stays pinned right. */
    .tape-tally {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .tape-counts {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tape-tracks {
      display: grid;
      gap: 10px;
      padding: 0 11px 11px;
      border-top: 1px solid rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(255, 255, 255, 0.52);
      padding-top: 11px;
    }

    .track-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    .track-row.is-archived {
      border-style: dashed;
      background: rgba(var(--bic-blue-rgb), 0.045);
    }

    .issue-count {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .issue-count.has-open { color: var(--bic-red); }

    /* Nothing flagged is the normal state, and a full panel saying so every day
       is noise. When it is clear the card collapses to its title line; the
       accent bar going grey is the at-a-glance signal. */
    #issuesCard.is-clear {
      border-top-color: var(--line);
      box-shadow: none;
    }

    #issuesCard.is-clear .panel-status,
    #issuesCard.is-clear .issue-list,
    #issuesCard.is-clear .panel-tools { display: none; }

    #issuesCard.is-clear > legend { color: var(--muted); }

    .issue-list {
      display: grid;
      gap: 10px;
      padding: 0;
    }

    .issue-row {
      display: grid;
      /* The actions column is capped so three buttons sit on one line without
         eating the width the detail text needs to stay readable. */
      grid-template-columns: minmax(0, 1fr) minmax(0, auto);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--control-line);
      border-left: 4px solid var(--muted);
      border-radius: 8px;
      background: #fff;
    }

    .issue-row[data-severity="high"] { border-left-color: var(--bic-red); }
    .issue-row[data-severity="warn"] { border-left-color: #d98324; }
    .issue-row[data-severity="info"] { border-left-color: rgba(var(--bic-blue-rgb), 0.45); }

    .issue-main { min-width: 0; display: grid; gap: 6px; }

    .issue-detail {
      margin: 0;
      color: var(--ink);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .issue-suggestion {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .issue-suggestion b { color: var(--ink); }

    /* Rolled-up issues: one collapsible block per tape. */
    .issue-group {
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .issue-group + .issue-group { margin-top: 8px; }
    .issue-group > .issue-row { border-radius: 0; border-left-width: 4px; }
    .issue-group[open] > .issue-group-head { border-bottom: 1px solid var(--line); }
    .issue-group-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 12px; cursor: pointer; list-style: none; background: rgba(255, 255, 255, 0.72);
    }
    .issue-group-head::-webkit-details-marker { display: none; }
    .issue-group-head::before { content: '▸'; color: var(--muted); }
    .issue-group[open] > .issue-group-head::before { content: '▾'; }
    .issue-group-city { font-weight: 700; }

    /* The row you were sent to by Edit on an issue. */
    .track-row.is-flagged-focus {
      border-color: var(--bic-red);
      box-shadow: 0 0 0 2px rgba(194, 55, 55, 0.18);
    }

    /* One row, wrapping. This was a stacked column back when a finding had two
       buttons; at three it made every row three buttons tall and pushed the
       detail text into a narrow strip. */
    .issue-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 6px;
    }

    /* Warning chip on an affected track row, so a finding is visible while
       browsing the tapes and not only in the panel above. */
    .track-flag {
      border-color: rgba(194, 55, 55, 0.4);
      background: rgba(194, 55, 55, 0.08);
      color: var(--bic-red);
      font-weight: 700;
      cursor: help;
    }

    /* Inline editor. Spans both columns of .track-row so the fields get the
       full width instead of the narrow text column. */
    .track-editor {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
      margin-top: 4px;
      padding: 12px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .editor-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .editor-field.wide { grid-column: 1 / -1; }

    .editor-field > span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .editor-field input[type="text"],
    .editor-field textarea,
    .editor-field select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.28);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
    }

    .editor-field textarea {
      min-height: 62px;
      resize: vertical;
      line-height: 1.5;
    }

    .editor-check {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: end;
      padding-bottom: 8px;
      color: var(--ink);
      font-size: 0.9rem;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .editor-move {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding-top: 10px;
      border-top: 1px dashed rgba(var(--bic-blue-rgb), 0.22);
    }

    .editor-move select { max-width: 220px; }

    .editor-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .editor-note.error { color: var(--bic-red); font-weight: 700; }

    .track-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .track-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .track-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .track-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 840px) {

      /* The page is one column at every width now, so the old ordering rules
         that interleaved a sidebar into the main column are gone with the cards
         they moved. */
      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head-actions,
      .panel-tools {
        width: 100%;
      }
