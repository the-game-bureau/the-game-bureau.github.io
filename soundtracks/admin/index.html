  <script>
    (function () {
      'use strict';

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var trackArchiveStatus = document.getElementById('trackArchiveStatus');
      var trackArchiveList = document.getElementById('trackArchiveList');
      var archiveExpandBtn = document.getElementById('archiveExpandBtn');
      var trackStatusSelect = document.getElementById('trackStatusSelect');
      // '' = every track. Otherwise one of REVIEW / LIVE / SHELVED; a tape with
      // no matching track drops out of the list entirely.
      var trackStatusFilter = '';
      var issuesList = document.getElementById('issuesList');
      var issuesStatus = document.getElementById('issuesStatus');
      var issueCountEl = document.getElementById('issueCount');
      var issueKindSelect = document.getElementById('issueKindSelect');
      var issueExpandBtn = document.getElementById('issueExpandBtn');
      // One switch for the whole panel, not one per city. Null means "nobody has
      // pressed it", which is when the per-tape default below applies; once it is
      // true or false every group follows it, including groups that appear on a
      // later refresh.
      var issuesAllExpanded = null;
      var soundtrackIssues = [];
      // Staleness threshold for the routine card's last-run line. The bot runs
      // twice a day, ~12 hours apart, so 14 hours means one missed run shows up
      // rather than needing two. It was 26 when the schedule was once daily.
      var REVIEW_HOURS = 14;
      var soundtrackArchiveData = null;
      var expandedTapes = Object.create(null);

      // ── Supabase REST ───────────────────────────────────────────────────────
      // Tapes moved from a committed soundtracks.json into public.soundtracks /
      // public.soundtrack_songs on 2026-07-29, so this page reads and writes the
      // database directly instead of editing a downloaded copy of the file.
      // Reads use the publishable key; writes ride the admin session token, which
      // is what RLS gates the write policies on.
      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) {
        return SUPABASE_CONFIG.url + '/rest/v1/' + path;
      }

      // PostgREST returns at most 1000 rows and truncates silently, so anything
      // that expects a whole table pages with Range. soundtrack_songs is already
      // past 900 rows.
      // useAuth for tables RLS gates behind an admin session — soundtrack_issues
      // is not publicly readable, unlike the tapes and songs themselves.
      async function fetchAllRows(path, useAuth) {
        var PAGE = 1000;
        var all = [];
        var headersFor = useAuth ? authHeaders : anonHeaders;
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: headersFor({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function patchRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'PATCH',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;
        // An UPDATE that RLS filters out is not an error to PostgREST — it
        // returns 200 with an empty array, so a signed-out or expired session
        // would otherwise look like a successful archive. No row back, no write.
        if (!row) throw new Error('Nothing was updated — sign in again and retry.');
        return row;
      }

      // What the last run wrote, per tape: "Bangkok 15 tracks, Denver 3 tracks".
      // Biggest first, so the new city leads and the top-up follows. Returns ''
      // rather than throwing — this is detail on the last-run line, not a reason
      // to fail it. The RPC caps a call at 60 songs, so this never pages.
      async function runTally(sinceIso) {
        try {
          var res = await fetch(
            restUrl('soundtrack_songs?select=city_slug&created_at=gte.' + encodeURIComponent(sinceIso)),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) return '';
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return '';
          var byCity = Object.create(null);
          rows.forEach(function (r) {
            var slug = text(r && r.city_slug);
            if (!slug) return;
            byCity[slug] = (byCity[slug] || 0) + 1;
          });
          return Object.keys(byCity)
            .sort(function (a, b) {
              return byCity[b] - byCity[a] || soundCityLabel(a).localeCompare(soundCityLabel(b));
            })
            .map(function (slug) {
              return soundCityLabel(slug) + ' ' + byCity[slug]
                + ' track' + (byCity[slug] === 1 ? '' : 's');
            })
            .join(', ');
        } catch (error) {
          return '';
        }
      }

      async function insertRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'POST',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;
        // Same RLS trap as patchRow: an INSERT the policy filters out comes back
        // 200 with an empty array rather than an error.
        if (!row) throw new Error('Nothing was inserted — sign in again and retry.');
        return row;
      }

      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          loadSoundtrackArchive().catch(function () { /* status already shown */ });
        },
        onSignedOut: function () {
          resetSoundtrackArchive();
        }
      });

      // Reload was removed on 2026-08-01. It re-read the tables and collapsed
      // every tape, but every write on this page already refreshes what it
      // touched, so its only real job was collapse-all — which is now its own
      // button and does not throw away the loaded data to do it.
      if (archiveExpandBtn) archiveExpandBtn.addEventListener('click', function () {
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        if (!groups.length) return;
        var allOpen = Array.prototype.every.call(groups, function (g) { return g.open; });
        var next = !allOpen;
        // expandedTapes is what survives a re-render, so it has to move too --
        // setting details.open alone would be undone by the next write.
        Array.prototype.forEach.call(groups, function (g) {
          g.open = next;
          if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = next;
        });
        syncArchiveExpandBtn();
      });
      if (trackStatusSelect) trackStatusSelect.addEventListener('change', function () {
        trackStatusFilter = trackStatusSelect.value || '';
        // Opening every tape when filtering is the point: with "Shelved only" on,
        // a collapsed list of city names says nothing. Clearing the filter puts
        // the list back to collapsed rather than leaving 60 tapes open.
        if (trackStatusFilter) {
          Object.keys(expandedTapes).forEach(function (k) { delete expandedTapes[k]; });
          renderTrackArchive();
          var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
          Array.prototype.forEach.call(groups, function (g) {
            g.open = true;
            if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = true;
          });
          syncArchiveExpandBtn();
        } else {
          expandedTapes = Object.create(null);
          renderTrackArchive();
        }
      });

      // The button names what pressing it will do, same as the Issues one.
      function syncArchiveExpandBtn() {
        if (!archiveExpandBtn) return;
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        archiveExpandBtn.disabled = !groups.length;
        var allOpen = groups.length > 0 && Array.prototype.every.call(groups, function (g) { return g.open; });
        archiveExpandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        archiveExpandBtn.title = allOpen ? 'Close every tape' : 'Open every tape';
      }
      if (issueKindSelect) issueKindSelect.addEventListener('change', function () { renderIssues(); });

      function text(value) {
        return String(value == null ? '' : value).trim();
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();
        return !!v && ['false', 'f', 'no', 'n', '0'].indexOf(v) === -1;
      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);
      }

      // A track's review status, derived the same way the gift shop derives a
      // gift's: REVIEW is the automatic state, only rejected_at makes it
      // SHELVED, only certified_at makes it LIVE.
      //
      // The one difference from the gift shop is the fallback. A database that
      // has not run 2026080104 returns neither stamp on any row, which would put
      // the entire catalogue in Review. So a row with no stamps AND no archived
      // flag is treated as LIVE — that is what it was before the queue existed.
      // Once the migration's backfill has run, every row carries a stamp and
      // this branch stops mattering.
      function songStatus(song) {
        if (!song) return 'REVIEW';
        if (text(song.rejectedAt)) return 'SHELVED';
        if (text(song.certifiedAt)) return 'LIVE';
        return isArchivedSong(song) ? 'REVIEW' : 'LIVE';
      }
      function isReviewSong(song) { return songStatus(song) === 'REVIEW'; }

      function formatDate(date) {
        if (!(date instanceof Date) || !Number.isFinite(date.getTime())) return '';
        return date.toLocaleString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function emptyNode(message) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.textContent = message;
        return div;
      }

      function chip(label, tone) {
        var span = document.createElement('span');
        span.className = 'chip' + (tone ? ' ' + tone : '');
        span.textContent = label;
        return span;
      }

      function actionLink(href, label, external) {
        var a = document.createElement('a');
        a.className = 'btn small';
        a.href = href;
        a.textContent = label;
        if (external) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        return a;
      }

      function setArchiveStatus(message, tone) {
        if (!trackArchiveStatus) return;
        trackArchiveStatus.textContent = message || '';
        trackArchiveStatus.classList.toggle('is-error', tone === 'error');
        trackArchiveStatus.classList.toggle('is-success', tone === 'success');
        trackArchiveStatus.classList.toggle('is-warn', tone === 'warn');
      }

      function resetSoundtrackArchive() {
        soundtrackArchiveData = null;
        trackStatusFilter = '';
        if (trackStatusSelect) { trackStatusSelect.value = ''; trackStatusSelect.disabled = true; }
        if (archiveExpandBtn) { archiveExpandBtn.disabled = true; archiveExpandBtn.textContent = 'Expand all'; }
        expandedTapes = Object.create(null);
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Sign in to manage tapes and tracks.'));
        }
        setArchiveStatus('Waiting for sign-in.', '');
        soundtrackIssues = [];
        if (issueKindSelect) { issueKindSelect.value = ''; issueKindSelect.disabled = true; }
        issuesAllExpanded = null;
        if (issueExpandBtn) { issueExpandBtn.disabled = true; issueExpandBtn.textContent = 'Expand all'; }
        if (issuesList) issuesList.innerHTML = '';
        if (issueCountEl) { issueCountEl.textContent = ''; issueCountEl.classList.remove('has-open'); }
        // Signed out is not "clear" — show the head and the reason.
        var signedOutIssuesCard = document.getElementById('issuesCard');
        if (signedOutIssuesCard) signedOutIssuesCard.classList.remove('is-clear');
        setIssuesStatus('Waiting for sign-in.', '');
      }

      function setIssuesStatus(message, tone) {
        if (!issuesStatus) return;
        issuesStatus.textContent = message || '';
        issuesStatus.classList.toggle('is-error', tone === 'error');
        issuesStatus.classList.toggle('is-success', tone === 'success');
        issuesStatus.classList.toggle('is-warn', tone === 'warn');
      }

      var ISSUE_KIND_LABEL = {
        spotify: 'Spotify ID',
        spelling: 'Spelling',
        relevance: 'Relevance',
        facts: 'Facts'
      };

      // A finding against a SHELVED track is not worth anyone's attention: the
      // track is already off /soundtracks/ and can never be re-picked for that
      // city, so whatever is wrong with it has already been dealt with by the
      // strongest action available. Shelving is therefore also a way to clear an
      // issue — deal with the track and its findings stop showing.
      //
      // Filtered here rather than resolved in the database on purpose. The row
      // stays `open` in public.soundtrack_issues, so un-shelving a track brings
      // its findings back with it; marking them fixed would silently discard
      // them the moment someone shelved anything.
      function isSuppressedIssue(issue) {
        var song = songById(issue && issue.song_id);
        return !!song && songStatus(song) === 'SHELVED';
      }

      function openIssues() {
        var all = Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
        return all.filter(function (issue) { return !isSuppressedIssue(issue); });
      }

      function suppressedIssueCount() {
        var all = Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
        return all.filter(isSuppressedIssue).length;
      }

      // songId -> its open findings, for the warning chip on a track row. Rebuilt
      // once per list render rather than per row: the track list is 900+ rows and
      // this would otherwise be quadratic.
      var issueSongMap = Object.create(null);

      function rebuildIssueSongMap() {
        var map = Object.create(null);
        openIssues().forEach(function (issue) {
          if (issue.song_id == null) return;
          var key = String(issue.song_id);
          (map[key] || (map[key] = [])).push(issue);
        });
        issueSongMap = map;
      }

      function renderIssues(message, tone) {
        if (!issuesList) return;
        if (message) setIssuesStatus(message, tone);
        var all = openIssues();
        var kind = issueKindSelect ? issueKindSelect.value : '';
        var rows = kind ? all.filter(function (issue) { return issue.kind === kind; }) : all.slice();

        if (issueKindSelect) issueKindSelect.disabled = !all.length;
        if (issueCountEl) {
          issueCountEl.textContent = all.length ? (all.length + ' open') : 'nothing flagged';
          issueCountEl.classList.toggle('has-open', all.length > 0);
        }
        // Collapse the whole card to its title line when there is nothing to
        // clear -- the normal state, and a full empty panel every day is noise.
        var issuesCard = document.getElementById('issuesCard');
        if (issuesCard) issuesCard.classList.toggle('is-clear', all.length === 0);

        // high first, then warn, then info; newest first inside a severity.
        var rank = { high: 0, warn: 1, info: 2 };
        rows.sort(function (a, b) {
          var byRank = (rank[a.severity] == null ? 3 : rank[a.severity]) - (rank[b.severity] == null ? 3 : rank[b.severity]);
          if (byRank) return byRank;
          return String(b.created_at || '').localeCompare(String(a.created_at || ''));
        });

        issuesList.innerHTML = '';
        if (!rows.length) {
          issuesList.appendChild(emptyNode(all.length
            ? 'No open issues of that kind.'
            : 'Nothing flagged. The daily audit reports here when it finds something.'));
          if (!message) setIssuesStatus(all.length ? '' : 'The last audit found nothing to report.', '');
          syncIssueExpandBtn();
          return;
        }

        // Rolled up by tape. Flat, the panel was a list of findings that happened
        // to be about tapes; grouped, it is a list of tapes that need work, which
        // is the unit you actually act on — you open one city, fix what is wrong
        // there, and move on. A tape with five findings was also five rows of
        // repeated city name.
        var order = [];
        var byTape = Object.create(null);
        rows.forEach(function (issue) {
          var slug = text(issue.city_slug) || '(no city)';
          if (!byTape[slug]) { byTape[slug] = []; order.push(slug); }
          byTape[slug].push(issue);
        });

        order.forEach(function (slug) {
          var group = byTape[slug];
          var box = document.createElement('details');
          box.className = 'issue-group';
          // Expand all / Collapse all wins once pressed. Until then: open when
          // there is one tape to look at, or when this tape has something
          // high-severity in it, so a long list stays scannable.
          box.open = issuesAllExpanded === null
            ? (order.length === 1 || group.some(function (i) { return i.severity === 'high'; }))
            : issuesAllExpanded;
          // Opening or closing one group by hand drops the panel back to
          // per-group control rather than silently fighting the button.
          box.addEventListener('toggle', function () {
            if (issuesAllExpanded !== null && box.open !== issuesAllExpanded) {
              issuesAllExpanded = null;
              syncIssueExpandBtn();
            }
          });

          var head = document.createElement('summary');
          head.className = 'issue-group-head';
          var label = document.createElement('span');
          label.className = 'issue-group-city';
          label.textContent = soundCityLabel(slug);
          var tally = document.createElement('span');
          tally.className = 'item-meta';
          tally.appendChild(chip(group.length + (group.length === 1 ? ' finding' : ' findings'),
            group.some(function (i) { return i.severity === 'high'; }) ? 'warn' : ''));
          var kinds = Object.create(null);
          group.forEach(function (i) { kinds[i.kind] = (kinds[i.kind] || 0) + 1; });
          Object.keys(kinds).sort().forEach(function (k) {
            tally.appendChild(chip((ISSUE_KIND_LABEL[k] || k) + ' ' + kinds[k]));
          });
          head.append(label, tally);
          box.appendChild(head);

          group.forEach(function (issue) { box.appendChild(renderIssueRow(issue)); });
          issuesList.appendChild(box);
        });
        syncIssueExpandBtn();

        if (!message) {
          var hidden = suppressedIssueCount();
          setIssuesStatus(all.length + ' open ' + (all.length === 1 ? 'finding' : 'findings')
            + ' across ' + countIssueTapes(all) + ' '
            + (countIssueTapes(all) === 1 ? 'tape' : 'tapes') + '.'
            + (hidden ? ' ' + hidden + ' more ' + (hidden === 1 ? 'is' : 'are')
                + ' against shelved tracks and not shown.' : ''), 'warn');
        }
      }

      // The button says what pressing it will do. With nothing pressed yet the
      // panel is a mix of open and closed groups, and "Expand all" is the more
      // useful of the two from there.
      function syncIssueExpandBtn() {
        if (!issueExpandBtn) return;
        var groups = issuesList ? issuesList.querySelectorAll('.issue-group') : [];
        issueExpandBtn.disabled = !groups.length;
        var allOpen = groups.length > 0 && Array.prototype.every.call(groups, function (g) { return g.open; });
        issueExpandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        issueExpandBtn.title = allOpen
          ? 'Close every tape in this panel'
          : 'Open every tape in this panel';
      }

      if (issueExpandBtn) {
        issueExpandBtn.addEventListener('click', function () {
          var groups = issuesList ? issuesList.querySelectorAll('.issue-group') : [];
          if (!groups.length) return;
          var allOpen = Array.prototype.every.call(groups, function (g) { return g.open; });
          issuesAllExpanded = !allOpen;
          Array.prototype.forEach.call(groups, function (g) { g.open = issuesAllExpanded; });
          syncIssueExpandBtn();
        });
      }

      function countIssueTapes(rows) {
        var seen = Object.create(null);
        rows.forEach(function (issue) { seen[text(issue.city_slug)] = true; });
        return Object.keys(seen).length;
      }

      function renderIssueRow(issue) {
        var row = document.createElement('article');
        row.className = 'issue-row';
        row.setAttribute('data-severity', text(issue.severity) || 'warn');

        var main = document.createElement('div');
        main.className = 'issue-main';

        var meta = document.createElement('div');
        meta.className = 'item-meta';
        meta.appendChild(chip(ISSUE_KIND_LABEL[issue.kind] || issue.kind, issue.severity === 'high' ? 'warn' : ''));
        // The city is on the group header now — repeating it on every row was
        // most of what made the flat list hard to read.
        var song = songById(issue.song_id);
        if (song) meta.appendChild(chip(songDisplay(song)));
        else if (issue.song_id != null) {
          // Named a track we cannot find: it was deleted, or moved to a city
          // whose tape row is missing. Say so, since Shelve is unavailable and
          // the reason is not otherwise visible.
          var gone = chip('track ' + issue.song_id + ' not found', 'warn');
          gone.title = 'The finding names a track that is no longer in the loaded tapes — deleted, or moved. Clear it.';
          meta.appendChild(gone);
        } else meta.appendChild(chip('whole tape'));

        var detail = document.createElement('p');
        detail.className = 'issue-detail';
        detail.textContent = text(issue.detail);

        main.append(meta, detail);

        if (text(issue.suggestion)) {
          var suggestion = document.createElement('p');
          suggestion.className = 'issue-suggestion';
          var lead = document.createElement('b');
          lead.textContent = 'Suggested: ';
          suggestion.append(lead, document.createTextNode(text(issue.suggestion)));
          main.appendChild(suggestion);
        }

        var actions = document.createElement('div');
        actions.className = 'issue-actions';

        // Shelve first, because for most findings it is the answer: a track with
        // a wrong Spotify ID, a bad fact, or no real tie to the city usually
        // should not be on the tape at all. It also clears the finding on its
        // own — a shelved track's issues are suppressed — so this is one press
        // instead of Edit, judge, come back, Clear.
        if (song) {
          var shelveBtn = document.createElement('button');
          shelveBtn.type = 'button';
          shelveBtn.className = 'btn small';
          shelveBtn.textContent = 'Shelve';
          shelveBtn.title = 'Take this track off /soundtracks/ and drop the finding with it. The row stays on the city, so the bot never picks it again.';
          shelveBtn.addEventListener('click', async function () {
            var at = locateSong(issue.song_id);
            if (!at) { setIssuesStatus('That track is no longer loaded. Refresh and try again.', 'error'); return; }
            shelveBtn.disabled = true;
            var ok = await setTrackStatus(at.tapeIndex, at.songIndex, 'SHELVED');
            if (!ok) shelveBtn.disabled = false;
          });
          actions.appendChild(shelveBtn);
        }

        // Edit is always offered, because there is always somewhere to go.
        // With a track it opens that row's editor; a whole-tape finding (song_id
        // null — how the audit files things like "this tape has 17 live tracks")
        // has no row to edit, so it opens the tape instead. Hiding the button
        // there just left the finding with nowhere to act on it.
        var editIssueBtn = document.createElement('button');
        editIssueBtn.type = 'button';
        editIssueBtn.className = 'btn small';
        editIssueBtn.textContent = song ? 'Edit' : 'Open tape';
        editIssueBtn.title = song
          ? 'Open this track below with its editor already open'
          : 'Open this tape below. This finding is about the tape as a whole, not one track.';
        editIssueBtn.addEventListener('click', function () { focusTrackForIssue(issue); });
        actions.appendChild(editIssueBtn);

        var fixedBtn = document.createElement('button');
        fixedBtn.type = 'button';
        fixedBtn.className = 'btn small primary';
        fixedBtn.textContent = 'Clear issue';
        fixedBtn.title = 'You dealt with it. If tomorrow’s audit still sees it, it comes back — which is how you know the fix landed.';

        // There is no "Not an issue" any more. Clearing only takes the finding
        // out of the queue; it never silences it. If the problem is still there
        // tomorrow the audit raises it again, which is the only honest way to
        // learn that a fix did not land — and a permanent silence was a decision
        // nobody could see afterwards.
        fixedBtn.addEventListener('click', async function () {
          fixedBtn.disabled = true;
          var ok = await resolveIssue(issue, 'fixed');
          if (!ok) fixedBtn.disabled = false;
        });

        actions.append(fixedBtn);
        row.append(main, actions);
        return row;
      }

      function songById(id) {
        if (id == null) return null;
        var found = null;
        soundtracks().forEach(function (tape) {
          (tape.songs || []).forEach(function (song) {
            if (song && String(song.id) === String(id)) found = song;
          });
        });
        return found;
      }

      // setTrackStatus addresses a track by its position in the loaded data, so
      // acting on a song from the Issues panel needs those two indices back.
      function locateSong(id) {
        if (id == null) return null;
        var hit = null;
        soundtracks().forEach(function (tape, tapeIndex) {
          (tape.songs || []).forEach(function (song, songIndex) {
            if (song && String(song.id) === String(id)) hit = { tapeIndex: tapeIndex, songIndex: songIndex };
          });
        });
        return hit;
      }

      // Clearing is a human action under an admin session; the reporting RPC
      // cannot reach this column.
      //
      // Always 'fixed', never 'dismissed'. Clearing empties the queue and
      // nothing more: the partial unique index only blocks a re-report while a
      // finding is `open` or `dismissed`, so a cleared one is free to come back
      // on the next audit if the problem is still there. That recurrence IS the
      // check that the fix landed. The page no longer writes 'dismissed' at all.
      async function resolveIssue(issue, status) {
        try {
          await patchRow('soundtrack_issues?id=eq.' + encodeURIComponent(issue.id), { status: status || 'fixed' });
        } catch (error) {
          console.error(error);
          setIssuesStatus('Could not clear that finding. ' + error.message, 'error');
          return false;
        }
        soundtrackIssues = openIssues().filter(function (row) { return row.id !== issue.id; });
        renderIssues('Cleared. If it is still a problem, the next audit reports it again.', 'success');
        // The chip on the affected track row has to go too.
        renderTrackArchive();
        return true;
      }

      async function loadSoundtrackArchive() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) {
          resetSoundtrackArchive();
          return;
        }
        setArchiveStatus('Loading soundtrack tracks...', '');
        setIssuesStatus('Loading findings...', '');
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Loading tracks...'));
        }
        try {
          soundtrackArchiveData = await fetchSoundtrackTables();
          renderTrackArchive();
          renderIssues();
        } catch (error) {
          console.error(error);
          soundtrackArchiveData = null;
          setArchiveStatus('Could not load the soundtrack tables.', 'error');
          if (trackArchiveList) {
            trackArchiveList.innerHTML = '';
            trackArchiveList.appendChild(emptyNode('public.soundtracks / public.soundtrack_songs did not load. Check the Supabase project.'));
          }
          throw error;
        }
      }

      // Reads both tables and rebuilds the nested shape this page (and the
      // exported fallback file) already speaks: one object per tape with its
      // songs inside, in play order. Each song keeps its row `id` so Archive and
      // Restore can PATCH exactly one row.
      async function fetchSoundtrackTables() {
        var results = await Promise.all([
          fetchAllRows('soundtracks?select=*&order=city_slug.asc'),
          fetchAllRows('soundtrack_songs?select=*&order=city_slug.asc,position.asc,id.asc'),
          // Open findings only. Fixed and dismissed rows are history; the panel
          // never shows them, and loading 900 of them would be pointless.
          // Tolerated as empty when the migration has not been applied yet, so
          // the page still works against an older database.
          fetchAllRows('soundtrack_issues?select=*&status=eq.open&order=created_at.desc', true)
            .catch(function (error) {
              console.warn('soundtrack_issues unavailable', error);
              return [];
            })
        ]);
        soundtrackIssues = Array.isArray(results[2]) ? results[2] : [];
        var byTape = {};
        var tapes = results[0].map(function (row) {
          var tape = {
            city_slug: row.city_slug,
            spine_tag: row.spine_tag || '',
            created_at: row.created_at || '',
            songs: []
          };
          if (row.spine_tag_position) tape.spine_tag_position = row.spine_tag_position;
          if (row.archived) tape.archived = true;
          byTape[row.city_slug] = tape;
          return tape;
        });
        results[1].forEach(function (row) {
          var tape = byTape[row.city_slug];
          if (!tape) return;
          var song = {
            id: row.id,
            position: Number(row.position) || 0,
            created_at: row.created_at || '',
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || ''
          };
          if (row.spotify_id) song.spotifyId = row.spotify_id;
          if (row.explicit) song.explicit = true;
          if (row.archived) song.archived = true;
          if (row.archived_with_tape) song.archivedWithTape = true;
          // The two review stamps. A row from a database that has not run
          // 2026080104 has neither, which reads as LIVE below — the pre-queue
          // behaviour, so the page works either side of the migration.
          if (row.certified_at) song.certifiedAt = row.certified_at;
          if (row.rejected_at) song.rejectedAt = row.rejected_at;
          tape.songs.push(song);
        });
        return { soundtracks: tapes };
      }

      function soundtracks() {
        return Array.isArray(soundtrackArchiveData && soundtrackArchiveData.soundtracks)
          ? soundtrackArchiveData.soundtracks
          : [];
      }

      function songHasContent(song) {
        return !!(song && (text(song.spotifyId) || text(song.title) || text(song.artist) || text(song.href)));
      }

      function allSongs(tape) {
        return ((tape && Array.isArray(tape.songs)) ? tape.songs : []).filter(songHasContent);
      }

      function songDate(song) {
        var raw = song && song.created_at;
        if (!raw) return null;
        var date = new Date(raw);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function tapeDate(tape) {
        var raw = tape && tape.created_at;
        if (!raw) return null;
        var date = new Date(raw);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      // Newest track on a tape -- what "Track added" sorts tapes by, and what the
      // old Fresh Review panel keyed its 26-hour window off before the two panels
      // became one.
      function newestSongDate(tape) {
        var newest = null;
        ((tape && tape.songs) || []).forEach(function (song) {
          var date = songDate(song);
          if (date && (!newest || date > newest)) newest = date;
        });
        return newest;
      }

      function songDisplay(song) {
        return [text(song && song.title) || '(untitled song)', text(song && song.artist) || '(unknown artist)'].join(' - ');
      }

      function trackCityLabel(tape) {
        return soundCityLabel(tape && tape.city_slug);
      }

      function tapeCounts(tape) {
        var active = 0;
        var archived = 0;
        allSongs(tape).forEach(function (song) {
          if (isArchivedSong(song)) archived += 1;
          else active += 1;
        });
        return { active: active, archived: archived };
      }

      function archiveSummary() {
        var tapes = soundtracks();
        var active = 0;
        var archived = 0;
        var hiddenTapes = 0;
        tapes.forEach(function (tape) {
          var counts = tapeCounts(tape);
          active += counts.active;
          archived += counts.archived;
          if (truthyFlag(tape && tape.archived)) hiddenTapes += 1;
        });
        return {
          tapes: tapes.length,
          hiddenTapes: hiddenTapes,
          active: active,
          archived: archived
        };
      }

      function renderTrackArchive(message, tone) {
        if (!trackArchiveList) return;
        trackArchiveList.innerHTML = '';
        if (!soundtrackArchiveData) {
          trackArchiveList.appendChild(emptyNode('Sign in to manage tapes and tracks.'));
          setArchiveStatus('Waiting for sign-in.', '');
          return;
        }

        rebuildIssueSongMap();

        // Grouped by city and collapsed, always in city order, always including
        // hidden tracks. A flat list is 900+ rows deep, which buries the one tape
        // you came here for; the tracks of a single city are the only unit anyone
        // acts on. Hidden rows are part of a tape's real contents -- they are the
        // do-not-rescrape record -- so they are never filtered out.
        var groups = [];
        soundtracks().forEach(function (tape, tapeIndex) {
          var rows = [];
          allSongs(tape).forEach(function (song, localIndex) {
            if (trackStatusFilter && songStatus(song) !== trackStatusFilter) return;
            var songIndex = tape.songs.indexOf(song);
            if (songIndex < 0) songIndex = localIndex;
            rows.push({ song: song, songIndex: songIndex });
          });
          if (!rows.length) return;
          groups.push({ tape: tape, tapeIndex: tapeIndex, slug: text(tape && tape.city_slug), rows: rows });
        });

        groups.forEach(function (group) {
          trackArchiveList.appendChild(renderTapeGroup(group, false, 'city'));
        });
        if (!groups.length) {
          trackArchiveList.appendChild(emptyNode(trackStatusFilter
            ? 'No ' + trackStatusFilter.toLowerCase() + ' tracks on any tape.'
            : 'No tapes yet.'));
        }
        if (trackStatusSelect) trackStatusSelect.disabled = !soundtracks().length;
        syncArchiveExpandBtn();

        var summary = archiveSummary();
        setArchiveStatus(
          message || (summary.tapes + ' tapes'
            + (summary.hiddenTapes ? ' (' + summary.hiddenTapes + ' shelved)' : '')
            + ' - ' + summary.active + ' live tracks - ' + summary.archived + ' shelved.'),
          tone || ''
        );
      }

      // One collapsible city. Rows are built on first open, not up front — 69
      // tapes' worth of DOM is the thing that made the flat list slow to paint.
      // A tape's name is two halves. The city comes from public.cities via the
      // city_slug foreign key and is not editable here; the spine phrase is, and
      // it is what reads down the side of the cassette on /soundtracks/.
      function buildTapeEditor(group, ownerBtn) {
        var box = document.createElement('div');
        box.className = 'track-editor tape-editor';

        var grid = document.createElement('div');
        grid.className = 'editor-grid';

        var tagWrap = document.createElement('label');
        tagWrap.className = 'editor-field';
        var tagName = document.createElement('span');
        tagName.textContent = 'Spine phrase';
        var tagInput = document.createElement('input');
        tagInput.type = 'text';
        tagInput.value = text(group.tape && group.tape.spine_tag);
        tagInput.placeholder = 'Soundtrack, Soul Mix, Street Sounds, Jams…';
        tagInput.autocomplete = 'off';
        tagWrap.append(tagName, tagInput);

        var posWrap = document.createElement('label');
        posWrap.className = 'editor-field';
        var posName = document.createElement('span');
        posName.textContent = 'Reads';
        var posSelect = document.createElement('select');
        [['after', 'After the city — "Denver Soul Mix"'],
         ['before', 'Before the city — "Sounds of Denver"']].forEach(function (pair) {
          var option = document.createElement('option');
          option.value = pair[0];
          option.textContent = pair[1];
          posSelect.appendChild(option);
        });
        posSelect.value = text(group.tape && group.tape.spine_tag_position) === 'before' ? 'before' : 'after';
        posWrap.append(posName, posSelect);

        grid.append(tagWrap, posWrap);

        var note = document.createElement('p');
        note.className = 'editor-note';
        note.textContent = 'City name comes from public.cities and is not editable here.';

        var actions = document.createElement('div');
        actions.className = 'editor-actions';
        var saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'btn small primary';
        saveBtn.textContent = 'Save tape';
        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn small';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', function () {
          if (ownerBtn) ownerBtn.textContent = 'Edit tape';
          box.remove();
        });
        actions.append(saveBtn, cancelBtn);

        saveBtn.addEventListener('click', async function () {
          saveBtn.disabled = true;
          cancelBtn.disabled = true;
          note.classList.remove('error');
          note.textContent = 'Saving…';
          var result = await saveTapeName(group.tapeIndex, {
            // Blank clears the phrase rather than storing an empty string.
            spine_tag: tagInput.value.trim() || null,
            spine_tag_position: posSelect.value === 'before' ? 'before' : null
          });
          if (!result.ok) {
            saveBtn.disabled = false;
            cancelBtn.disabled = false;
            note.classList.add('error');
            note.textContent = result.message;
          }
        });

        box.append(grid, actions, note);
        return box;
      }

      // One PATCH on public.soundtracks. 'after' is stored as null because that
      // is the column's default reading -- the CHECK allows only 'before',
      // 'after' or null, and null keeps rows consistent with the seed.
      async function saveTapeName(tapeIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        if (!slug) return { ok: false, message: 'That tape is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtracks?city_slug=eq.' + encodeURIComponent(slug), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        tape.spine_tag = fields.spine_tag || '';
        if (fields.spine_tag_position) tape.spine_tag_position = fields.spine_tag_position;
        else delete tape.spine_tag_position;
        renderTrackArchive('Renamed the ' + trackCityLabel(tape) + ' tape.', 'success');
        return { ok: true };
      }

      function renderTapeGroup(group, autoOpen, sortBy) {
        var details = document.createElement('details');
        details.className = 'tape-group';
        if (group && group.slug) details.dataset.slug = group.slug;

        var summary = document.createElement('summary');
        summary.className = 'tape-summary';
        var name = document.createElement('span');
        name.className = 'tape-name';
        var cityEl = document.createElement('span');
        cityEl.className = 'tape-city';
        cityEl.textContent = trackCityLabel(group.tape);
        // The spine phrase is the editable half of a tape's name -- the city
        // half is the FK to public.cities and cannot be renamed from here. Show
        // it on the side it actually reads on the cassette: spine_tag_position
        // 'before' is for phrases that lead, like "Sounds of". Sorting is
        // unaffected -- the list is still ordered by city.
        var spine = text(group.tape && group.tape.spine_tag);
        if (spine) {
          var spineEl = document.createElement('span');
          spineEl.className = 'tape-spine';
          spineEl.textContent = spine;
          if (text(group.tape && group.tape.spine_tag_position) === 'before') {
            name.append(spineEl, cityEl);
          } else {
            name.append(cityEl, spineEl);
          }
        } else {
          name.appendChild(cityEl);
        }

        // Counts sit immediately after the city, on the left. The right-hand
        // group is actions only.
        var tally = tapeCounts(group.tape);
        var tapeArchived = truthyFlag(group.tape && group.tape.archived);
        details.classList.toggle('is-archived', tapeArchived);
        var tallyEl = document.createElement('span');
        tallyEl.className = 'tape-tally';
        if (tapeArchived) tallyEl.appendChild(chip('Tape shelved', 'warn'));
        tallyEl.appendChild(chip(tally.active + ' live tracks'));
        if (tally.archived) tallyEl.appendChild(chip(tally.archived + ' shelved tracks', 'warn'));
        if (group.rows.length !== tally.active + tally.archived) {
          tallyEl.appendChild(chip(group.rows.length + ' shown',
            trackStatusFilter ? 'warn' : ''));
        }

        var counts = document.createElement('span');
        counts.className = 'tape-counts';
        // Show the stamp the current sort is ordering on, so the order explains
        // itself instead of looking arbitrary.
        var stampDate = sortBy === 'tape_added' ? tapeDate(group.tape)
          : sortBy === 'track_added' ? newestSongDate(group.tape)
          : null;
        if (stampDate) {
          var stampChip = chip(relativeTime(stampDate, new Date()));
          stampChip.title = (sortBy === 'tape_added' ? 'Tape created ' : 'Newest track added ')
            + formatDate(stampDate);
          counts.appendChild(stampChip);
        }

        // Archiving the whole tape pulls the city off /soundtracks/ in one move,
        // without touching a single song: soundtracks.archived, which the public
        // page filters on. For a city that should not be published at all yet,
        // that beats archiving fifteen tracks one at a time.
        var tapeToggle = document.createElement('button');
        tapeToggle.type = 'button';
        tapeToggle.className = 'btn small tape-archive-btn';
        tapeToggle.textContent = tapeArchived ? 'Restore tape' : 'Shelve tape';
        tapeToggle.title = tapeArchived
          ? 'Put this tape back on /soundtracks/, restoring the tracks it took with it (tracks shelved on their own stay shelved)'
          : 'Take this whole city tape off /soundtracks/, hiding every track on it';
        tapeToggle.addEventListener('click', async function (event) {
          // Inside a <summary>, so stop the click from opening/closing the city.
          event.preventDefault();
          event.stopPropagation();
          tapeToggle.disabled = true;
          var ok = await setTapeArchived(group.tapeIndex, !tapeArchived);
          if (!ok) tapeToggle.disabled = false;
        });
        var nameBtn = document.createElement('button');
        nameBtn.type = 'button';
        nameBtn.className = 'btn small tape-archive-btn';
        nameBtn.textContent = 'Edit tape';
        nameBtn.title = 'Change the spine phrase printed down the cassette on /soundtracks/. The city half comes from public.cities and cannot be renamed here.';

        counts.append(nameBtn, tapeToggle);
        summary.append(name, tallyEl, counts);
        details.appendChild(summary);

        var body = document.createElement('div');
        body.className = 'tape-tracks';
        details.appendChild(body);

        nameBtn.addEventListener('click', function (event) {
          // Inside a <summary>, so stop the click from toggling the city open.
          event.preventDefault();
          event.stopPropagation();
          var open = body.querySelector('.tape-editor');
          if (open) { open.remove(); nameBtn.textContent = 'Edit tape'; return; }
          details.open = true;
          fill();
          nameBtn.textContent = 'Close';
          body.insertBefore(buildTapeEditor(group, nameBtn), body.firstChild);
        });

        function fill() {
          if (body.dataset.filled === 'true') return;
          group.rows.forEach(function (row) {
            body.appendChild(renderTrackRow(group.tape, group.tapeIndex, row.song, row.songIndex));
          });
          body.dataset.filled = 'true';
        }

        // Only a real click or keypress on the summary changes the remembered
        // state. Auto-opening for a search must not leave twenty cities expanded
        // once the search is cleared, and every archive/restore re-renders this
        // whole list, so the remembered set is what keeps your place.
        var userToggled = false;
        summary.addEventListener('click', function () { userToggled = true; });
        details.addEventListener('toggle', function () {
          if (userToggled) {
            expandedTapes[group.slug] = details.open;
            userToggled = false;
          }
          if (details.open) fill();
        });

        if (autoOpen || expandedTapes[group.slug]) {
          details.open = true;
          fill();
        }
        return details;
      }

      function renderTrackRow(tape, tapeIndex, song, songIndex) {
        var row = document.createElement('article');
        row.className = 'track-row';
        if (song && song.id != null) row.dataset.songId = String(song.id);
        var archived = isArchivedSong(song);
        row.classList.toggle('is-archived', archived);

        var main = document.createElement('div');
        main.className = 'track-main';

        var title = document.createElement('h3');
        title.className = 'track-title';
        title.textContent = songDisplay(song);

        var copy = document.createElement('p');
        copy.className = 'track-copy';
        copy.textContent = text(song && song.blurb) || text(song && song.spotifyId) || 'No blurb.';

        var meta = document.createElement('div');
        meta.className = 'item-meta';
        meta.appendChild(chip(trackCityLabel(tape)));
        // Status first, because it is what decides whether this row needs you.
        var status = songStatus(song);
        var statusChip = chip(
          status === 'LIVE' ? 'Live' : status === 'SHELVED' ? 'Shelved' : 'Review',
          status === 'LIVE' ? 'success' : 'warn'
        );
        statusChip.title = status === 'LIVE'
          ? 'Approved and on /soundtracks/.'
          : status === 'SHELVED'
            ? 'Rejected. The row stays on this city so the daily routine never picks the track again.'
            : 'Waiting on you. The daily routine filed this; it is not on /soundtracks/ yet.';
        meta.appendChild(statusChip);
        if (archived && song && song.archivedWithTape) {
          var withTape = chip('tape is shelved', 'warn');
          withTape.title = 'Off the site because the whole tape is shelved, not because this track was turned down. Restoring the tape brings it back.';
          meta.appendChild(withTape);
        }
        if (text(song && song.spotifyId)) meta.appendChild(chip('Spotify ID'));
        // Open findings against this exact track, so an issue is visible while
        // browsing the tapes and not only in the panel above.
        var flags = (song && song.id != null) ? (issueSongMap[String(song.id)] || []) : [];
        if (flags.length) {
          var flag = chip('⚠ ' + (flags.length === 1
            ? (ISSUE_KIND_LABEL[flags[0].kind] || flags[0].kind)
            : flags.length + ' issues'));
          flag.classList.add('track-flag');
          flag.title = flags.map(function (issue) {
            return (ISSUE_KIND_LABEL[issue.kind] || issue.kind) + ': ' + text(issue.detail);
          }).join('\n\n') + '\n\nClear it in the Issues panel above.';
          meta.appendChild(flag);
        }
        // When the track landed. Absolute date and time, relative form on hover:
        // "3 hours ago" answers "did the last run write this?", the timestamp
        // answers "which run was that?".
        var added = songDate(song);
        if (added) {
          var addedChip = chip('Added ' + formatDate(added));
          addedChip.title = relativeTime(added, new Date());
          meta.appendChild(addedChip);
        }

        main.append(title, copy, meta);

        var actions = document.createElement('div');
        actions.className = 'track-actions';

        // A successful write re-renders the whole list, so only a failure has to
        // hand the button back.
        function statusBtn(label, target, primary, why) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn small' + (primary ? ' primary' : '');
          b.textContent = label;
          b.title = why;
          b.addEventListener('click', async function () {
            b.disabled = true;
            var ok = await setTrackStatus(tapeIndex, songIndex, target);
            if (!ok) b.disabled = false;
          });
          return b;
        }

        // Two verbs, one axis: Live or Shelved. There is no separate Hide any
        // more — "hidden" and "shelved" were the same effect described two ways
        // (off /soundtracks/, kept on the city as a tombstone), and having both
        // meant every track offered three buttons for two outcomes.
        if (status === 'LIVE') {
          actions.appendChild(statusBtn('Shelve', 'SHELVED', false,
            'Take this track off /soundtracks/. The row stays on the city, so the routine never picks it again.'));
        } else {
          actions.appendChild(statusBtn('Live', 'LIVE', true,
            status === 'REVIEW'
              ? 'Approve this track and put it on /soundtracks/'
              : 'Change your mind: put this track back on /soundtracks/'));
          actions.appendChild(status === 'REVIEW'
            ? statusBtn('Shelve', 'SHELVED', false,
                'Turn this track down. The row stays on the city, so the routine never picks it again.')
            : statusBtn('Review', 'REVIEW', false,
                'Put this track back in the review queue, undecided'));
        }

        var editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn small track-edit-btn';
        editBtn.textContent = 'Edit';
        editBtn.title = 'Change the words, the Spotify ID, or which tape this track sits on';
        actions.appendChild(editBtn);

        if (text(song && song.spotifyId)) {
          actions.appendChild(actionLink('https://open.spotify.com/track/' + encodeURIComponent(text(song.spotifyId)), 'Spotify', true));
        }

        row.append(main, actions);

        function openEditor() {
          if (row.querySelector('.track-editor')) return;
          editBtn.textContent = 'Close';
          row.appendChild(buildTrackEditor(tape, tapeIndex, song, songIndex));
        }

        editBtn.addEventListener('click', function () {
          var open = row.querySelector('.track-editor');
          if (open) {
            open.remove();
            editBtn.textContent = 'Edit';
            return;
          }
          openEditor();
        });

        // Arrived here from Edit on an issue: open the editor and bring the row
        // into view. Cleared immediately so an unrelated later re-render does not
        // pop the editor open again.
        if (pendingFocusSongId && song && String(song.id) === pendingFocusSongId) {
          pendingFocusSongId = '';
          openEditor();
          row.classList.add('is-flagged-focus');
          window.setTimeout(function () {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 0);
        }

        return row;
      }

      // Jump from an issue to the track it is about. The tape group is opened
      // first, because rows are built lazily when a group expands — without this
      // the row does not exist to scroll to.
      var pendingFocusSongId = '';
      function focusTrackForIssue(issue) {
        var song = songById(issue && issue.song_id);
        var slug = text(issue && issue.city_slug);
        if (!slug) return;
        expandedTapes[slug] = true;
        pendingFocusSongId = song && song.id != null ? String(song.id) : '';
        renderTrackArchive();
        if (!song) {
          // A whole-tape finding, or a track that has since been deleted: open
          // the tape and say so rather than silently doing nothing.
          var group = document.querySelector('.tape-group[data-slug="' + slug + '"]');
          if (group && group.scrollIntoView) group.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Inline field editor + move/copy, built per row on demand. Everything here
      // writes straight to public.soundtrack_songs under the admin session, so a
      // save is live on /soundtracks/ the moment it resolves — same as Hide/Show.
      function buildTrackEditor(tape, tapeIndex, song, songIndex) {
        var box = document.createElement('div');
        box.className = 'track-editor';

        var grid = document.createElement('div');
        grid.className = 'editor-grid';

        function field(label, wide, control) {
          var wrap = document.createElement('label');
          wrap.className = 'editor-field' + (wide ? ' wide' : '');
          var name = document.createElement('span');
          name.textContent = label;
          wrap.append(name, control);
          grid.appendChild(wrap);
          return control;
        }

        function input(value) {
          var el = document.createElement('input');
          el.type = 'text';
          el.value = value == null ? '' : String(value);
          el.autocomplete = 'off';
          el.spellcheck = false;
          return el;
        }

        var titleInput = field('Title', false, input(text(song && song.title)));
        var artistInput = field('Artist', false, input(text(song && song.artist)));

        var blurbInput = document.createElement('textarea');
        blurbInput.value = text(song && song.blurb);
        blurbInput.spellcheck = true;
        blurbInput.placeholder = 'One line on why this song belongs to this city.';
        field('Blurb', true, blurbInput);

        var spotifyInput = field('Spotify ID', false, input(text(song && song.spotifyId)));
        spotifyInput.placeholder = '22 characters, or blank';
        // The column's CHECK is ^[A-Za-z0-9]{22}$ or null. Blank is always a safe
        // answer: the player falls back to a Spotify search for artist + title.
        spotifyInput.title = 'Leave blank rather than guess — a made-up ID passes every format check and silently plays nothing.';

        var positionInput = field('Position', false, input(song && song.position != null ? song.position : 0));
        positionInput.inputMode = 'numeric';

        var explicitWrap = document.createElement('label');
        explicitWrap.className = 'editor-check';
        var explicitInput = document.createElement('input');
        explicitInput.type = 'checkbox';
        explicitInput.checked = !!(song && song.explicit);
        var explicitText = document.createElement('span');
        explicitText.textContent = 'Explicit';
        explicitWrap.append(explicitInput, explicitText);
        grid.appendChild(explicitWrap);

        var note = document.createElement('p');
        note.className = 'editor-note';

        function say(message, isError) {
          note.textContent = message || '';
          note.classList.toggle('error', !!isError);
        }

        var actions = document.createElement('div');
        actions.className = 'editor-actions';

        var saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'btn small primary';
        saveBtn.textContent = 'Save changes';

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn small';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', function () {
          var host = box.closest('.track-row');
          var btn = host && host.querySelector('.track-edit-btn');
          if (btn) btn.textContent = 'Edit';
          box.remove();
        });

        actions.append(saveBtn, cancelBtn);

        // Move / copy. Only tapes that already exist are offered — soundtrack_songs
        // has an FK to soundtracks.city_slug, so there is no such thing as moving
        // a track to a city with no tape.
        var move = document.createElement('div');
        move.className = 'editor-move';

        var moveLabel = document.createElement('span');
        moveLabel.className = 'editor-note';
        moveLabel.textContent = 'Other tape:';

        var tapeSelect = document.createElement('select');
        tapeSelect.setAttribute('aria-label', 'Choose another tape');
        soundtracks().forEach(function (other) {
          if (text(other.city_slug) === text(tape && tape.city_slug)) return;
          var option = document.createElement('option');
          option.value = text(other.city_slug);
          option.textContent = trackCityLabel(other);
          tapeSelect.appendChild(option);
        });

        var moveBtn = document.createElement('button');
        moveBtn.type = 'button';
        moveBtn.className = 'btn small';
        moveBtn.textContent = 'Move';
        moveBtn.title = 'Take this track off ' + trackCityLabel(tape) + ' and put it on the chosen tape';

        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'btn small';
        copyBtn.textContent = 'Copy';
        copyBtn.title = 'Leave this track where it is and add it to the chosen tape as well';

        if (!tapeSelect.options.length) {
          tapeSelect.disabled = true;
          moveBtn.disabled = true;
          copyBtn.disabled = true;
          moveLabel.textContent = 'No other tape to move to yet.';
        }

        move.append(moveLabel, tapeSelect, moveBtn, copyBtn);
        box.append(grid, actions, move, note);

        function busy(on) {
          [saveBtn, cancelBtn, moveBtn, copyBtn, tapeSelect].forEach(function (el) {
            el.disabled = on || (el !== saveBtn && el !== cancelBtn && !tapeSelect.options.length);
          });
        }

        saveBtn.addEventListener('click', async function () {
          var nextTitle = titleInput.value.trim();
          var nextArtist = artistInput.value.trim();
          var nextSpotify = spotifyInput.value.trim();
          if (!nextTitle || !nextArtist) {
            say('Title and artist are both required.', true);
            return;
          }
          if (nextSpotify && !/^[A-Za-z0-9]{22}$/.test(nextSpotify)) {
            say('A Spotify ID is exactly 22 letters and digits. Clear the box instead of guessing.', true);
            return;
          }
          busy(true);
          say('Saving…');
          var ok = await saveTrackFields(tapeIndex, songIndex, {
            title: nextTitle,
            artist: nextArtist,
            blurb: blurbInput.value.trim() || null,
            spotify_id: nextSpotify || null,
            explicit: !!explicitInput.checked,
            position: Number(positionInput.value) || 0
          });
          if (!ok.ok) {
            busy(false);
            say(ok.message, true);
          }
        });

        moveBtn.addEventListener('click', async function () {
          busy(true);
          say('Moving…');
          var result = await moveTrackToTape(tapeIndex, songIndex, tapeSelect.value, false);
          if (!result.ok) {
            busy(false);
            say(result.message, true);
          }
        });

        copyBtn.addEventListener('click', async function () {
          busy(true);
          say('Copying…');
          var result = await moveTrackToTape(tapeIndex, songIndex, tapeSelect.value, true);
          if (!result.ok) {
            busy(false);
            say(result.message, true);
          }
        });

        return box;
      }

      // The one write error worth translating. Every tape carries a unique index on
      // (city_slug, lower(btrim(title)), lower(btrim(artist))) -- the thing that
      // makes hidden tracks work as do-not-rescrape tombstones -- so a rename or a
      // move onto a tape that already knows the song comes back as 23505.
      function friendlyWriteError(error, cityLabel) {
        var message = (error && error.message) || 'Write failed.';
        if (/23505|duplicate key/i.test(message)) {
          return 'The ' + cityLabel + ' tape already has that title and artist. '
            + 'It may already be there as a shelved track.';
        }
        if (/soundtrack_songs_spotify_id_check|violates check constraint/i.test(message)) {
          return 'Supabase rejected the Spotify ID. It has to be 22 letters and digits, or blank.';
        }
        return message;
      }

      // setTrackArchived was removed on 2026-08-01 when Hide/Show merged into
      // Shelve. Every track write now goes through setTrackStatus, so `archived`
      // can never drift out of step with the two review stamps.

      // Move a track between the three review states. One PATCH: the two stamps
      // and `archived` always travel together, because a half-applied state is
      // the thing that would actually hurt — a certified row still archived is
      // invisible with no sign of why, and a cleared archived flag with no
      // certification would put an unreviewed track straight onto the site.
      //
      //   LIVE     certified_at = now, rejected_at = null, archived = false
      //   SHELVED  rejected_at  = now, archived = true; certification is LEFT
      //            ALONE so shelving a live track and restoring it later does
      //            not lose the fact that it was once approved
      //   REVIEW   both stamps null, archived = true (back into the queue)
      async function setTrackStatus(tapeIndex, songIndex, status) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return false;

        var stamp = new Date().toISOString();
        var patch;
        if (status === 'LIVE') patch = { certified_at: stamp, rejected_at: null, archived: false };
        else if (status === 'SHELVED') patch = { rejected_at: stamp, archived: true };
        else patch = { certified_at: null, rejected_at: null, archived: true };

        try {
          await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), patch);
        } catch (error) {
          console.error(error);
          setArchiveStatus('Could not update ' + songDisplay(song) + '. ' + error.message, 'error');
          return false;
        }

        if (patch.certified_at) song.certifiedAt = patch.certified_at; else delete song.certifiedAt;
        if (patch.rejected_at) song.rejectedAt = patch.rejected_at; else delete song.rejectedAt;
        if (patch.archived) song.archived = true; else { delete song.archived; delete song.archivedWithTape; }

        var said = {
          LIVE: ' is live on /soundtracks/ now.',
          SHELVED: ' is shelved — it stays on the city so the routine never picks it again.',
          REVIEW: ' is back in the review queue.'
        };
        renderTrackArchive(songDisplay(song) + (said[status] || ' updated.'), 'success');
        // Findings against a shelved track are suppressed, so the Issues panel
        // has to be rebuilt on every status change — both directions. Shelving
        // drops this track's findings out of the queue; un-shelving brings them
        // back, which is the point of filtering rather than resolving them.
        renderIssues();
        return true;
      }

      // Field edit. Title and artist are part of the tape's unique index, so a
      // rename can collide with a track already on the city -- including a hidden
      // one, which is exactly the case a bare "duplicate key" would not explain.
      async function saveTrackFields(tapeIndex, songIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        song.title = fields.title;
        song.artist = fields.artist;
        song.position = fields.position;
        if (fields.blurb) song.blurb = fields.blurb; else delete song.blurb;
        if (fields.spotify_id) song.spotifyId = fields.spotify_id; else delete song.spotifyId;
        if (fields.explicit) song.explicit = true; else delete song.explicit;
        renderTrackArchive('Saved ' + songDisplay(song) + '.', 'success');
        return { ok: true };
      }

      // Move = one PATCH of city_slug. Copy = one INSERT on the target tape.
      // Either way the track lands at the end of the target tape's running order;
      // reorder from the Position field afterwards if it matters.
      //
      // Worth knowing before you move a hidden track: `archived` is a
      // do-not-rescrape tombstone scoped to its city, so moving one takes the
      // tombstone with it and the daily routine becomes free to pick that song for
      // the old city again. Copy leaves the original -- and its tombstone -- alone.
      async function moveTrackToTape(tapeIndex, songIndex, targetSlug, asCopy) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        var target = tapeBySlug(text(targetSlug));
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        if (!target) return { ok: false, message: 'Pick a tape to ' + (asCopy ? 'copy' : 'move') + ' to.' };

        var targetLabel = trackCityLabel(target);
        var nextPosition = allSongs(target).reduce(function (max, other) {
          return Math.max(max, Number(other.position) || 0);
        }, 0) + 1;

        try {
          if (asCopy) {
            await insertRow('soundtrack_songs', {
              city_slug: text(target.city_slug),
              position: nextPosition,
              title: text(song.title),
              artist: text(song.artist),
              blurb: text(song.blurb) || null,
              spotify_id: text(song.spotifyId) || null,
              explicit: !!song.explicit,
              // A copy always arrives live. Carrying `archived` across would plant
              // a tombstone on a city that never rejected the song.
              archived: false
            });
          } else {
            await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), {
              city_slug: text(target.city_slug),
              position: nextPosition
            });
          }
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, targetLabel) };
        }

        var label = songDisplay(song);
        var wasHidden = songStatus(song) !== 'LIVE';
        // The tape grouping changed underneath the loaded copy, so reload rather
        // than shuffle it locally.
        await loadSoundtrackArchive();
        renderTrackArchive(
          asCopy
            ? (label + ' is now on the ' + targetLabel + ' tape as well.')
            : (label + ' moved to the ' + targetLabel + ' tape.'
                + (wasHidden ? ' Its do-not-reuse marker moved with it, so tomorrow’s run can pick that song for ' + trackCityLabel(tape) + ' again.' : '')),
          'success'
        );
        return { ok: true };
      }

      // Whole-tape archive. One PATCH on public.soundtracks.archived; a trigger
      // (2026073001) archives the tape's live songs with it and, on restore, puts
      // back exactly the ones it took -- a song archived on its own stays
      // archived, because that row is a do-not-rescrape tombstone.
      //
      // Because the trigger rewrites rows underneath the tape, the loaded copy is
      // stale as soon as the PATCH returns, so this reloads instead of flipping a
      // local flag.
      async function setTapeArchived(tapeIndex, archived) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        var label = trackCityLabel(tape);
        if (!slug) return false;
        try {
          await patchRow('soundtracks?city_slug=eq.' + encodeURIComponent(slug), { archived: !!archived });
          await loadSoundtrackArchive();
        } catch (error) {
          console.error(error);
          setArchiveStatus((archived ? 'Could not hide the ' : 'Could not show the ')
            + label + ' tape. ' + error.message, 'error');
          return false;
        }
        var counts = tapeCounts(tapeBySlug(slug));
        renderTrackArchive(
          archived
            ? ('The whole ' + label + ' tape is off /soundtracks/ now, with its '
              + counts.archived + ' track' + (counts.archived === 1 ? '' : 's') + ' hidden.')
            : ('The ' + label + ' tape is back on /soundtracks/ with ' + counts.active
              + ' active track' + (counts.active === 1 ? '' : 's')
              + (counts.archived ? ' — ' + counts.archived + ' stayed hidden.' : '.')),
          'success'
        );
        return true;
      }

      function tapeBySlug(slug) {
        var found = null;
        soundtracks().forEach(function (tape) {
          if (text(tape && tape.city_slug) === slug) found = tape;
        });
        return found;
      }

      function soundCityLabel(slug) {
        var s = text(slug);
        if (!s) return '(unknown city)';
        return s.split('-').map(function (part) {
          return part ? part.charAt(0).toUpperCase() + part.slice(1) : '';
        }).join(' ');
      }

      // Last run of the daily routine. The routine commits nothing now that the
      // tapes are rows, so there is no commit feed to read: the newest song row
      // IS the receipt, exactly like the gift shop treats its freshest Review
      // candidate. A run that errored writes nothing, so a stale timestamp is the
      // failure signal - hence the 14-hour check against a 12-hour cadence.
      var STALE_AFTER_HOURS = REVIEW_HOURS;

      function relativeTime(then, now) {
        if (!(then instanceof Date) || !Number.isFinite(then.getTime())) return '';
        var mins = Math.round((now - then) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
        var hours = Math.round(mins / 60);
        if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
        var days = Math.round(hours / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
      }

      async function loadLastRun() {
        var wrap = document.getElementById('runStatus');
        var when = document.getElementById('runWhen');
        var what = document.getElementById('runWhat');
        if (!wrap || !when || !what) return;

        try {
          // One row: the newest song on any tape, plus the city it landed on.
          var res = await fetch(
            restUrl('soundtrack_songs?select=city_slug,title,artist,created_at&order=created_at.desc&limit=1'),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) throw new Error('Supabase ' + res.status);
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) throw new Error('no songs');

          var row = rows[0];
          var stamp = new Date(row.created_at);
          if (!Number.isFinite(stamp.getTime())) throw new Error('no timestamp');
          var now = new Date();
          var stale = (now - stamp) / 3600000 > STALE_AFTER_HOURS;

          wrap.dataset.state = stale ? 'stale' : 'ok';
          when.textContent = 'Last run ' + relativeTime(stamp, now);

          // The newest row IS the run receipt, so name what it actually wrote.
          // A run touches more than one tape — a new city AND a top-up of the
          // emptiest existing one — so this breaks the count down per city
          // rather than naming only the tape the newest row happened to land on.
          // "The run" is every row written within the hour before that newest
          // one: the RPC writes them in a single call, so an hour is generous.
          var since = new Date(stamp.getTime() - 3600000).toISOString();
          var wrote = await runTally(since);

          what.textContent = stamp.toLocaleString([], {
            weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit'
          }) + (wrote ? ' · ' + wrote : ' · ' + soundCityLabel(row.city_slug));

          if (stale) {
            what.appendChild(document.createTextNode(
              ' · no new track in over a day — check the routine.'
            ));
          }
        } catch (error) {
          wrap.dataset.state = 'error';
          when.textContent = 'Last run unavailable';
          what.textContent = 'Could not read public.soundtrack_songs. Open the routine to check directly.';
        }
      }

      loadLastRun();

      // Sign in / sign out is the padlock in the shared admin nav. Deliberately
      // NOT TgbMcAdminNav.init, which injects TGB HOME / MISSION CONTROL buttons
      // and then deletes the account button on every non-hub page.
      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);
      adminAuth.init();
    }());
  </script>
</body>
</html>
