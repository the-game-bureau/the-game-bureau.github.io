<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… | The Game Bureau</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/icon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://thegamebureau.com/mc/games/">
  <!-- editgames.html was merged into what is now mc/games/. This stub
       forwards any old bookmarks / links to the game editor, preserving the
       query string so editgames.html?id=… lands on marquee.html?id=….
       The target moved twice: mc/editgames.html -> games/admin/marquee.html
       (merge) -> mc/games/ (2026-08-07). Only this stub survives both,
       because GitHub Pages serves no 301 and a moved page leaves nothing
       behind unless someone parks a file at the old path. -->
  <script>
    (function () {
      var target = '/mc/games/' + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
  <!-- No-JS fallback (does not carry the query string, but still lands on the editor). -->
  <meta http-equiv="refresh" content="0; url=/mc/games/">
</head>
<body>
  <p>This page moved to <a href="/mc/games/">mc/games/</a>. Redirecting…</p>
</body>
</html>
