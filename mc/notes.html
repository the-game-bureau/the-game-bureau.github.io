<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BUREAU NOTES | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea { font: inherit; }

    .section-head {
      display: grid;
      gap: 6px;
      margin: 0 0 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }
    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 0.92rem; }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.danger { color: var(--danger); border-color: var(--danger); background: #fff; }
    .btn.danger:hover { background: rgba(160,63,45,0.08); }
    .btn.icon { min-width: 38px; padding: 0 10px; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .signout-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    @media (max-width: 880px) {
      .columns { grid-template-columns: 1fr; }
    }

    .panel {
      display: grid;
      gap: 12px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .panel-title {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .panel-count { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

    .add-form {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: rgba(var(--bic-blue-rgb), 0.03);
    }
    .add-form textarea,
    .add-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .add-form textarea { min-height: 64px; resize: vertical; }
    .add-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) {
      .add-form-row { grid-template-columns: 1fr; }
    }
    .add-form-actions { display: flex; justify-content: flex-end; }

    .item-list { display: grid; gap: 8px; }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      transition: opacity 0.15s;
    }
    .item.is-done { opacity: 0.55; }
    .item.is-done .item-body { text-decoration: line-through; }

    .item-check {
      width: 22px;
      height: 22px;
      margin-top: 3px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .item-bullet {
      width: 22px;
      margin-top: 3px;
      text-align: center;
      color: var(--muted);
    }
    .item-body {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: pointer;
    }
    .item-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }
    .item-actions { display: flex; gap: 6px; }
    .item-edit-form {
      grid-column: 1 / -1;
      display: grid;
      gap: 6px;
    }
    .item-edit-form textarea,
    .item-edit-form input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }
    .item-edit-form textarea { min-height: 60px; resize: vertical; }
    .item-edit-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .item-edit-form .actions { display: flex; gap: 6px; justify-content: flex-end; }

    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }
  </style>
  <link rel="stylesheet" href="admin-shell.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="topbar-actions" style="margin-left:auto;">
        <button class="btn mc-back-btn" type="button" data-mc-back data-mc-back-fallback="../index.html">Back</button>
        <button class="signout-btn" id="signOutBtn" type="button" aria-label="ADMIN LOGIN" title="ADMIN LOGIN">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5.5 19.5c1.2-3.4 3.8-5.1 6.5-5.1s5.3 1.7 6.5 5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <section class="section-head">
      <p class="kicker">TGB MISSION CONTROL</p>
      <h2>BUREAU NOTES</h2>
      <p class="status" id="pageStatus" aria-live="polite">Sign in with an admin account.</p>
    </section>

    <section class="columns">
      <div class="panel" id="todosPanel">
        <div class="panel-head">
          <h3 class="panel-title">To-dos</h3>
          <span class="panel-count" id="todosCount"></span>
        </div>
        <form class="add-form" id="todoAddForm" autocomplete="off">
          <textarea name="body" id="todoAddBody" placeholder="New to-do..." required></textarea>
          <div class="add-form-row">
            <input name="url" id="todoAddUrl" type="url" placeholder="Link URL (optional)">
            <input name="url_label" id="todoAddUrlLabel" type="text" placeholder="Link label (e.g. Notion brief)">
          </div>
          <div class="add-form-actions">
            <button class="btn primary" type="submit">Add to-do</button>
          </div>
        </form>
        <div class="item-list" id="todosList"></div>
      </div>

      <div class="panel" id="notesPanel">
        <div class="panel-head">
          <h3 class="panel-title">Notes</h3>
          <span class="panel-count" id="notesCount"></span>
        </div>
        <form class="add-form" id="noteAddForm" autocomplete="off">
          <textarea name="body" id="noteAddBody" placeholder="New note..." required></textarea>
          <div class="add-form-row">
            <input name="url" id="noteAddUrl" type="url" placeholder="Link URL (optional)">
            <input name="url_label" id="noteAddUrlLabel" type="text" placeholder="Link label">
          </div>
          <div class="add-form-actions">
            <button class="btn primary" type="submit">Add note</button>
          </div>
        </form>
        <div class="item-list" id="notesList"></div>
      </div>
    </section>
  </main>

  <script src="admin-auth.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-nav-menu.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const pageStatus  = document.getElementById('pageStatus');
    const signOutBtn  = document.getElementById('signOutBtn');
    const todosList   = document.getElementById('todosList');
    const notesList   = document.getElementById('notesList');
    const todosCount  = document.getElementById('todosCount');
    const notesCount  = document.getElementById('notesCount');
    const todoAddForm = document.getElementById('todoAddForm');
    const noteAddForm = document.getElementById('noteAddForm');

    const state = { todos: [], notes: [], authed: false, editingId: null };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading...');
        await refreshAll();
      },
      onSignedOut: () => {
        state.authed = false;
        state.todos = [];
        state.notes = [];
        render();
        setStatus('Sign in with an admin account.');
      }
    });

    function setStatus(text, kind) {
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function authHeaders(extra) {
      const session = adminAuth.getSession();
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') {
          url.searchParams.set(key, String(value));
        }
      });
      return url.toString();
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) {
          return text;
        }
      } catch (_) {
        return fallback;
      }
    }

    async function fetchList(table) {
      const url = restUrl(table, { select: '*', order: 'sort_order.asc,created_at.desc' });
      const response = await fetch(url, { headers: authHeaders(), cache: 'no-store' });
      if (!response.ok) throw new Error(await readError(response, 'Could not load ' + table));
      return response.json();
    }

    async function insertRow(table, row) {
      const response = await fetch(restUrl(table), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(row)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not save'));
      return response.json();
    }

    async function patchRow(table, id, patch) {
      const response = await fetch(restUrl(table, { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(Object.assign({ updated_at: new Date().toISOString() }, patch))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not update'));
      return response.json();
    }

    async function deleteRow(table, id) {
      const response = await fetch(restUrl(table, { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not delete'));
    }

    async function refreshAll() {
      try {
        const [todos, notes] = await Promise.all([
          fetchList('bureau_todos'),
          fetchList('bureau_notes')
        ]);
        state.todos = Array.isArray(todos) ? todos : [];
        state.notes = Array.isArray(notes) ? notes : [];
        render();
        setStatus('');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Load failed', 'error');
      }
    }

    function plainText(value) {
      return String(value == null ? '' : value);
    }

    function renderList(listEl, rows, kind) {
      listEl.innerHTML = '';
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = kind === 'todo' ? 'No to-dos. Add one above.' : 'No notes. Add one above.';
        listEl.appendChild(empty);
        return;
      }
      // Open todos float to the top, done ones sink.
      const ordered = kind === 'todo'
        ? [...rows].sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1))
        : rows;
      ordered.forEach((row) => listEl.appendChild(renderItem(row, kind)));
    }

    function renderItem(row, kind) {
      const item = document.createElement('article');
      item.className = 'item';
      item.dataset.id = row.id;
      if (kind === 'todo' && row.done) item.classList.add('is-done');

      if (state.editingId === row.id) {
        item.appendChild(renderEditForm(row, kind));
        return item;
      }

      if (kind === 'todo') {
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'item-check';
        check.checked = !!row.done;
        check.setAttribute('aria-label', 'Mark done');
        check.addEventListener('change', () => toggleDone(row, check.checked));
        item.appendChild(check);
      } else {
        const bullet = document.createElement('div');
        bullet.className = 'item-bullet';
        bullet.textContent = '•';
        bullet.setAttribute('aria-hidden', 'true');
        item.appendChild(bullet);
      }

      const content = document.createElement('div');
      const body = document.createElement('p');
      body.className = 'item-body';
      body.textContent = plainText(row.body);
      body.title = 'Click to edit';
      body.addEventListener('click', () => {
        state.editingId = row.id;
        render();
      });
      content.appendChild(body);

      if (row.url) {
        const link = document.createElement('a');
        link.className = 'item-link';
        link.href = row.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = plainText(row.url_label || row.url);
        content.appendChild(link);
      }
      item.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'item-actions';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn icon';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => {
        state.editingId = row.id;
        render();
      });
      actions.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn icon danger';
      delBtn.textContent = '×';
      delBtn.setAttribute('aria-label', 'Delete');
      delBtn.addEventListener('click', () => removeItem(row, kind));
      actions.appendChild(delBtn);

      item.appendChild(actions);
      return item;
    }

    function renderEditForm(row, kind) {
      const form = document.createElement('form');
      form.className = 'item-edit-form';

      const body = document.createElement('textarea');
      body.value = plainText(row.body);
      body.required = true;
      form.appendChild(body);

      const linkRow = document.createElement('div');
      linkRow.className = 'row';
      const urlInput = document.createElement('input');
      urlInput.type = 'url';
      urlInput.placeholder = 'Link URL';
      urlInput.value = plainText(row.url);
      const labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = 'Link label';
      labelInput.value = plainText(row.url_label);
      linkRow.append(urlInput, labelInput);
      form.appendChild(linkRow);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => {
        state.editingId = null;
        render();
      });
      const save = document.createElement('button');
      save.type = 'submit';
      save.className = 'btn primary';
      save.textContent = 'Save';
      actions.append(cancel, save);
      form.appendChild(actions);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const patch = {
          body: body.value.trim(),
          url: urlInput.value.trim() || null,
          url_label: labelInput.value.trim() || null
        };
        if (!patch.body) return;
        saveEdit(row, kind, patch);
      });

      // Auto-focus the body field when entering edit mode.
      setTimeout(() => body.focus(), 0);
      return form;
    }

    function tableFor(kind) {
      return kind === 'todo' ? 'bureau_todos' : 'bureau_notes';
    }

    async function toggleDone(row, done) {
      try {
        const updated = await patchRow('bureau_todos', row.id, { done });
        const fresh = (Array.isArray(updated) && updated[0]) || null;
        if (fresh) {
          state.todos = state.todos.map((t) => (t.id === row.id ? fresh : t));
          render();
        } else {
          await refreshAll();
        }
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Update failed', 'error');
      }
    }

    async function saveEdit(row, kind, patch) {
      try {
        const updated = await patchRow(tableFor(kind), row.id, patch);
        const fresh = (Array.isArray(updated) && updated[0]) || null;
        if (fresh) {
          if (kind === 'todo') {
            state.todos = state.todos.map((t) => (t.id === row.id ? fresh : t));
          } else {
            state.notes = state.notes.map((n) => (n.id === row.id ? fresh : n));
          }
        }
        state.editingId = null;
        render();
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Save failed', 'error');
      }
    }

    async function removeItem(row, kind) {
      if (!confirm('Delete this ' + (kind === 'todo' ? 'to-do' : 'note') + '?')) return;
      try {
        await deleteRow(tableFor(kind), row.id);
        if (kind === 'todo') {
          state.todos = state.todos.filter((t) => t.id !== row.id);
        } else {
          state.notes = state.notes.filter((n) => n.id !== row.id);
        }
        render();
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Delete failed', 'error');
      }
    }

    function readForm(form) {
      const fd = new FormData(form);
      const body = String(fd.get('body') || '').trim();
      if (!body) return null;
      return {
        body,
        url: String(fd.get('url') || '').trim() || null,
        url_label: String(fd.get('url_label') || '').trim() || null
      };
    }

    todoAddForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const row = readForm(todoAddForm);
      if (!row) return;
      try {
        const inserted = await insertRow('bureau_todos', row);
        const fresh = (Array.isArray(inserted) && inserted[0]) || null;
        if (fresh) state.todos = [fresh, ...state.todos];
        todoAddForm.reset();
        render();
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Add failed', 'error');
      }
    });

    noteAddForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const row = readForm(noteAddForm);
      if (!row) return;
      try {
        const inserted = await insertRow('bureau_notes', row);
        const fresh = (Array.isArray(inserted) && inserted[0]) || null;
        if (fresh) state.notes = [fresh, ...state.notes];
        noteAddForm.reset();
        render();
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Add failed', 'error');
      }
    });

    function render() {
      renderList(todosList, state.todos, 'todo');
      renderList(notesList, state.notes, 'note');
      const openCount = state.todos.filter((t) => !t.done).length;
      todosCount.textContent = openCount + ' open · ' + state.todos.length + ' total';
      notesCount.textContent = state.notes.length + ' total';
    }

    window.TgbMcAdminNav.init({ signOutButton: signOutBtn, auth: adminAuth });

    render();
    adminAuth.init();
  </script>
</body>
</html>
