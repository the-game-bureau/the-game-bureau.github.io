<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ISSUES | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    /* THE TAPE ROOM'S OWN TOKENS AND CHROME. This room is its sibling: the
       findings that used to be drawn inside it live here now, so the two have
       to read as one product. When either changes, change both. */
    :root {
      --mc-shell-width: 1180px;
      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: #1b2438;
      --muted: #6b7280;
      --line: rgba(27, 36, 56, 0.16);
      --accent: var(--bic-blue);
      --success: #1f7a44;
      --danger: #a03f2d;
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 0 60px;
      background: var(--paper-base);
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      max-width: var(--mc-shell-width);
      margin: 0 auto;
      padding: 0 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.small { min-height: 30px; padding: 0 10px; font-size: 0.66rem; }
    .btn[disabled] { opacity: 0.45; cursor: default; }

    /* ── The command bars, folder tabs like every other room ────────────── */
    .bar-row { display: flex; gap: 12px; margin-bottom: var(--stack-gap); }

    .command-bar {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      padding: 8px 12px 10px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
    }

    .command-bar--view { flex: 0 0 auto; }

    .command-bar > legend {
      position: relative;
      isolation: isolate;
      margin-left: 4px;
      padding: 0 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* The arch that cuts the panel border around the label. Copied from the
       Socializer verbatim, `isolation: isolate` and all: it cannot be a border
       on the legend itself. */
    .command-bar > legend::before {
      content: "";
      position: absolute;
      inset: -1px -1px 50% -1px;
      z-index: -1;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ── Room head ──────────────────────────────────────────────────────── */
    .room-stats {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0 6px;
      margin: 3px 0 0;
      font: 500 0.72rem/1.4 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .room-stats-count { font-weight: 700; }
    .room-stats-count.is-open { color: var(--bic-red); }
    .room-stats-sep { opacity: 0.7; }

    .work-panel {
      padding: 12px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
    }

    .issue-lines { display: grid; gap: 8px; }

/* ── ONE FINDING, ONE CARD ──────────────────────────────────────────── */
    .issue-item {
      display: grid;
      gap: 6px;
      padding: 12px 14px;
      border: 1px solid var(--control-line);
      border-radius: 10px;
      background: #fff;
      /* THE LEFT EDGE IS THE SEVERITY, four pixels of it, so a page of findings
         is triaged by looking down it rather than by reading every chip. */
      box-shadow: inset 4px 0 0 0 var(--control-line);
    }

    .issue-item.is-high { box-shadow: inset 4px 0 0 0 var(--bic-red); }
    .issue-item.is-warn { box-shadow: inset 4px 0 0 0 #d99a36; }

    /* A CLEARED ONE STAYS PUT AND GOES QUIET. Removing it would shift every row
       under the pointer, so the next press lands on something else. */
    .issue-item.is-cleared { opacity: 0.5; }
    .issue-item.is-cleared:hover { opacity: 1; }

    .issue-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* THE SOUNDTRACK LABEL LEADS, and it is the loudest thing on the card: it
       is what tells you which of 113 tapes this is about. */
    /* BLUE, NOT BLACK. It was `--ink`, which is this project's near-black navy
       and reads as text like any other; the soundtrack label is the one thing on
       a card that is a NAME, and the room's own blue is what marks a name here.
       It is also the thing you scan for down a page of forty findings. */
    .issue-tape {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bic-blue);
    }

    .issue-chip {
      padding: 1px 7px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .issue-chip--spotify { border-color: var(--bic-red); color: var(--bic-red); }

    .issue-about {
      margin-left: auto;
      font-size: 0.8rem;
      font-style: italic;
      color: var(--muted);
    }

    .issue-detail { margin: 0; font-size: 0.92rem; line-height: 1.45; color: var(--ink); }

    /* THE SUGGESTION IS THE BOT'S, not ours, so it is set apart from the
       statement above it rather than reading as part of it. */
    .issue-suggestion {
      margin: 0;
      padding-left: 10px;
      border-left: 2px solid var(--control-line);
      font-size: 0.85rem;
      color: var(--muted);
    }


    /* ── SELECTING SEVERAL ──────────────────────────────────────────────── */
    .issue-pick {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .issue-pick--all { min-height: 42px; }

    .issue-pick-word {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      user-select: none;
    }

    /* IT FLOATS, so it costs the bar no width and cannot be scrolled away from.
       `[hidden]` HAS TO BE RE-ASSERTED: `.btn` carries an author
       `display: inline-flex` and `[hidden]` is only a UA-sheet `display: none`,
       so the author rule wins and hiding it silently does nothing. */
    .issue-batch-float {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      box-shadow: 0 6px 18px -6px rgba(16, 24, 40, 0.5);
    }

    .issue-batch-float[hidden] { display: none; }

    #issueBatchCard .btn.warn { border-color: var(--bic-red); color: var(--bic-red); }
    #issueBatchCard .btn.warn:hover { background: var(--bic-red); color: #fff; }
    #issueBatchCard .prompt-foot { display: flex; flex-wrap: wrap; gap: 8px; }

    .issue-acts { display: flex; gap: 8px; }

    /* THE ONE IRREVERSIBLE BUTTON ON THE CARD, and it wears the red pen so it
       cannot be pressed by mistake for the one beside it. Outlined rather than
       filled: it is not the action you came for. */
    .issue-del { border-color: var(--bic-red); color: var(--bic-red); }
    .issue-del:hover { background: var(--bic-red); border-color: var(--bic-red); color: #fff; }

    #issueDelCard .btn.warn { border-color: var(--bic-red); color: var(--bic-red); }
    #issueDelCard .btn.warn:hover { background: var(--bic-red); color: #fff; }
    #issueDelCard .prompt-foot { display: flex; flex-wrap: wrap; gap: 8px; }

    /* WHAT HAPPENED, WHERE THE BUTTONS WERE. A settled card keeps its place in
       the list and says what settled it, rather than leaving an empty row. */
    .issue-settled {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .issue-acts .btn { min-height: 30px; padding: 0 10px; font-size: 0.66rem; }

    .empty-note {
      padding: 22px 12px;
      border: 1px dashed var(--control-line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

  </style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">

    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title" id="pageTitle">ISSUES</h1>
        <p class="room-blurb" id="pageTagline" data-room-blurb="issues"></p>
        <p class="room-stats" id="roomStats"></p>
        <span class="room-scribble" id="pageNotice" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="bar-row">
      <fieldset class="command-bar">
        <legend>Add</legend>
        <div class="command-bar-inner">
          <a class="btn" id="soundtrackBotBtn"
             href="https://claude.ai/code/routines/trig_014sqaUyU7557svq9mGA1E4a"
             target="_blank" rel="noopener noreferrer"
             title="The routine that files these findings. It audits five tapes a run.">TGB SOUNDTRACK BOT</a>
        </div>
      </fieldset>

      <!-- SELECT IS ITS OWN BOX, as in the Tape Room: VIEW holds doors and
           nothing else, and a control that PICKS things is not a door. -->
      <fieldset class="command-bar command-bar--select">
        <legend>Select</legend>
        <div class="command-bar-inner">
          <label class="issue-pick issue-pick--all" title="Select every open finding.">
            <span class="issue-pick-word">All</span>
            <input id="issuePickAll" type="checkbox" aria-label="Select every open finding">
          </label>
        </div>
      </fieldset>

      <fieldset class="command-bar command-bar--view">
        <legend>View</legend>
        <div class="command-bar-inner">
          <a class="btn" href="/mc/soundtracks/"
             title="The room these findings are about.">TAPE ROOM</a>
          <a class="btn" href="/soundtracks/" target="_blank" rel="noopener noreferrer"
             title="The public page. Only live tracks appear on it.">SOUNDTRACKS</a>
        </div>
      </fieldset>
    </div>

    <!-- IT FLOATS, so it costs the bar no width and cannot be scrolled away
         from, and it appears only once there are two findings to act on.
         `[hidden]` has to be re-asserted over `.btn`'s author `display`. -->
    <button class="btn primary issue-batch-float" id="issueBatchBtn" type="button" hidden></button>

    <div class="tool-backdrop" id="issueBatchBackdrop" hidden></div>
    <section class="prompt-panel tool-modal-panel" id="issueBatchCard" role="dialog"
             aria-modal="true" aria-labelledby="issueBatchTitle" hidden>
      <div class="panel-head prompt-head">
        <div class="prompt-headline">
          <h2 class="panel-title" id="issueBatchTitle">Findings</h2>
        </div>
      </div>
      <div class="prompt-body">
        <p class="bulk-words" id="issueBatchWords"></p>
      </div>
      <div class="prompt-foot" id="issueBatchFoot"></div>
    </section>

    <!-- THE DELETE QUESTION. Its own dialog, because it is the one thing this
         page does that cannot be undone. -->
    <div class="tool-backdrop" id="issueDelBackdrop" hidden></div>
    <section class="prompt-panel tool-modal-panel" id="issueDelCard" role="dialog"
             aria-modal="true" aria-labelledby="issueDelTitle" hidden>
      <div class="panel-head prompt-head">
        <div class="prompt-headline">
          <h2 class="panel-title" id="issueDelTitle">Delete track</h2>
        </div>
      </div>
      <div class="prompt-body">
        <p class="bulk-words" id="issueDelWords"></p>
      </div>
      <div class="prompt-foot" id="issueDelFoot"></div>
    </section>

    <div class="work-panel" id="roomBody">
      <div class="issue-lines" id="issueList"></div>
    </div>

  </main>

  <script src="/mc/js/room-blurbs.js"></script>
  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script>
    (function () {
      'use strict';

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var pageNotice = document.getElementById('pageNotice');
      var issueList = document.getElementById('issueList');
      var roomStats = document.getElementById('roomStats');

      function text(value) { return String(value == null ? '' : value).trim(); }

      // ONE ERROR CHANNEL, the red pen beside the room name. A success clears
      // itself after six seconds because a stale confirmation is a lie about
      // what is currently true; an error stays until the next action.
      var noticeTimer = 0;
      function setNotice(message, tone) {
        if (!pageNotice) return;
        clearTimeout(noticeTimer);
        pageNotice.textContent = message || '';
        pageNotice.classList.toggle('is-error', tone === 'error');
        if (message && tone === 'success') {
          noticeTimer = setTimeout(function () { pageNotice.textContent = ''; }, 6000);
        }
      }

      function restUrl(path) { return SUPABASE_CONFIG.url + '/rest/v1/' + path; }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      // PostgREST CAPS A RESPONSE AT 1000 ROWS AND TRUNCATES SILENTLY, so every
      // whole-table read here pages. There are 285 findings today and that is
      // exactly the sort of number that grows past the cap unnoticed.
      async function fetchAllRows(path) {
        var PAGE = 1000;
        var all = [];
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: authHeaders({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      var findings = [];

      function paintStats() {
        if (!roomStats) return;
        var open = findings.filter(function (f) { return text(f.status) === 'open'; }).length;
        roomStats.textContent = '';
        function part(word, n, cls) {
          var w = document.createElement('span');
          w.className = 'room-stats-word';
          w.textContent = word;
          var v = document.createElement('span');
          v.className = 'room-stats-count' + (cls ? ' ' + cls : '');
          v.textContent = String(n);
          roomStats.append(w, v);
        }
        part('findings', findings.length, '');
        var sep = document.createElement('span');
        sep.className = 'room-stats-sep';
        sep.textContent = '|';
        roomStats.appendChild(sep);
        part('open', open, open ? 'is-open' : '');
      }

      // ── ONE FINDING, ONE ITEM ───────────────────────────────────────────
      //
      // A finding is a fact about a TRACK on a TAPE, so a list of them has to
      // carry both -- that is the cost the Tape Room paid to get findings off
      // its rows, and the label is how this page pays it back. Every item says
      // which soundtrack it is about, and offers the only two things this page
      // can honestly do: take you to it, or clear it.
      function findingItem(f) {
        var item = document.createElement('article');
        item.className = 'issue-item is-' + (text(f.severity) || 'info');
        item.dataset.findingId = String(f.id);

        var head = document.createElement('div');
        head.className = 'issue-head';
        // THE TICK LEADS THE HEADER, left of the label, where a list of things
        // to pick from puts it.
        if (text(f.status) === 'open') head.appendChild(pickBox(f));

        // THE SOUNDTRACK LABEL LEADS IT. `city_slug` is a slug, so it is
        // written out: a list keyed by `baton-rouge` is a list you have to
        // translate before you can read it.
        var label = document.createElement('span');
        label.className = 'issue-tape';
        label.textContent = cityLabel(f.city_slug) + '  ·  ' + (text(f.tape) || 'no tape name');
        head.appendChild(label);

        var kind = document.createElement('span');
        kind.className = 'issue-chip issue-chip--' + (text(f.kind) || 'facts');
        kind.textContent = text(f.kind) || 'facts';
        head.appendChild(kind);

        var sev = document.createElement('span');
        sev.className = 'issue-chip issue-chip--sev';
        sev.textContent = text(f.severity) || 'info';
        head.appendChild(sev);

        // A TAPE-SCOPE FINDING NAMES NO TRACK, and several of them are
        // statements about the LIST rather than about a song. Saying so is what
        // stops it reading as a finding whose track went missing.
        var about = document.createElement('span');
        about.className = 'issue-about';
        about.textContent = text(f.scope) === 'tape'
          ? 'about the whole tape'
          : (text(f.song_title) || 'track ' + text(f.song_id));
        head.appendChild(about);

        item.appendChild(head);

        var detail = document.createElement('p');
        detail.className = 'issue-detail';
        detail.textContent = text(f.detail);
        item.appendChild(detail);

        if (text(f.suggestion)) {
          var sug = document.createElement('p');
          sug.className = 'issue-suggestion';
          sug.textContent = text(f.suggestion);
          item.appendChild(sug);
        }

        var acts = document.createElement('div');
        acts.className = 'issue-acts';

        // GO TO IS A REAL LINK, not a button that navigates. Middle-click and
        // ctrl-click work, and it survives this page's JavaScript failing.
        var go = document.createElement('a');
        go.className = 'btn small';
        go.textContent = 'Go to';
        go.href = tapeRoomHref(f);
        go.title = text(f.scope) === 'tape'
          ? 'Open the Tape Room on this tape.'
          : 'Open the Tape Room on this track, and ring it.';
        acts.appendChild(go);

        // ONLY WHERE THERE IS A TRACK TO DELETE. A tape-scope finding names
        // none, so the button is absent rather than greyed.
        if (text(f.scope) !== 'tape' && f.song_id != null) {
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'btn small issue-del';
          del.textContent = 'Delete track';
          del.title = 'Delete the track this finding is about. It asks first, and '
            + 'offers shelving instead while the track is still live.';
          del.addEventListener('click', function () { openTrackDelete(f); });
          acts.appendChild(del);
        }

        var clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'btn small';
        clear.textContent = 'Clear issue';
        // CLEARING EMPTIES THE QUEUE; IT DOES NOT SILENCE THE FINDING. The
        // audit re-reports an open one whose fingerprint it has seen, so a
        // cleared finding comes straight back on the next run if the problem is
        // still there. That recurrence is the only check that a fix landed.
        clear.title = 'Mark this as dealt with. If the problem is still there, the '
          + 'next audit files it again, which is the only check that a fix landed.';
        clear.addEventListener('click', function () { clearFinding(f, clear); });
        acts.appendChild(clear);

        item.appendChild(acts);
        return item;
      }

      // THE TAPE ROOM'S OWN QUERY CONTRACT, and this page must not invent a
      // second one. `?tape=` positions the room's PAGER, so you arrive with the
      // tape in front of you; `?track=` does the same and then rings the badge.
      //
      // NOT `#tape=` / `#track=`, WHICH OPEN THE TRACKS POPUP. A dialog over a
      // list you have not seen, with no sense of where you are in it, is the one
      // place an arriving link should not put you.
      //
      // A TAPE HAS NO id OF ITS OWN -- it is `(city_slug, tape)` -- so the key
      // is that pair, built exactly as the room builds it.
      function tapeRoomHref(f) {
        var room = '/mc/soundtracks/';
        if (text(f.scope) !== 'tape' && f.song_id != null) {
          return room + '?track=' + encodeURIComponent(String(f.song_id));
        }
        var key = JSON.stringify([text(f.city_slug), text(f.tape)]);
        return room + '?tape=' + encodeURIComponent(key);
      }

      // A SLUG IS NOT A LABEL. `baton-rouge` reads as data; the list is read by
      // a person deciding what to work on next.
      function cityLabel(slug) {
        var s = text(slug);
        if (!s) return '(unknown city)';
        return s.split('-').map(function (part) {
          return part ? part.charAt(0).toUpperCase() + part.slice(1) : part;
        }).join(' ');
      }

      // CLEARING WRITES `fixed`, NEVER `dismissed`. `dismissed` is a permanent
      // silence: a decision nobody can see afterwards, and one a wrong press
      // cannot take back without SQL. This page refuses to write it.
      async function clearFinding(f, btn) {
        btn.disabled = true;
        var was = btn.textContent;
        btn.textContent = 'Clearing';
        var ok = false;
        try {
          var res = await fetch(restUrl('rpc/tgb_resolve_soundtrack_finding'), {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ p_id: f.id, p_status: 'fixed' })
          });
          if (!res.ok) throw new Error('Supabase ' + res.status
            + ((await res.text().catch(function () { return ''; })).slice(0, 160)));
          // THE FUNCTION ANSWERS TRUE OR FALSE, and false means it matched no
          // open finding. Reporting that as success would leave a row on screen
          // that a reload brings straight back.
          ok = await res.json().catch(function () { return false; });
        } catch (error) {
          console.error(error);
          setNotice('could not clear that finding: ' + ((error && error.message) || 'write failed'), 'error');
          btn.disabled = false;
          btn.textContent = was;
          return;
        }
        if (!ok) {
          setNotice('that finding was already cleared by somebody else', 'error');
          btn.disabled = false;
          btn.textContent = was;
          return;
        }
        // THE ITEM STAYS PUT AND GOES QUIET. Removing it would shift every row
        // under the pointer, so the next press lands on something else, and
        // after three you would not know what you had just done.
        var item = document.querySelector('[data-finding-id="' + f.id + '"]');
        if (item) {
          item.classList.add('is-cleared');
          btn.textContent = 'Cleared';
        }
        f.status = 'fixed';
        paintStats();
        setNotice('cleared', 'success');
      }


      // ── DELETE THE TRACK A FINDING IS ABOUT ─────────────────────────────
      //
      // Some findings have only one answer: a track with no genuine tie to the
      // city, a duplicate, a karaoke recording. Reading the finding here and
      // then walking to the Tape Room to delete it is two rooms for one
      // decision.
      //
      // NOT OFFERED ON A TAPE-SCOPE FINDING. Those name no track, being
      // statements about the LIST, so there is nothing for this button to act
      // on and a greyed one would be a promise the finding cannot keep.
      var pendingDelete = null;

      function openTrackDelete(f) {
        pendingDelete = f;
        paintTrackDelete();
      }

      function closeTrackDelete() {
        pendingDelete = null;
        paintTrackDelete();
      }

      async function paintTrackDelete() {
        var card = document.getElementById('issueDelCard');
        var backdrop = document.getElementById('issueDelBackdrop');
        var words = document.getElementById('issueDelWords');
        var title = document.getElementById('issueDelTitle');
        var foot = document.getElementById('issueDelFoot');
        if (!card || !backdrop || !words || !title || !foot) return;

        var f = pendingDelete;
        if (!f) {
          card.hidden = true;
          backdrop.hidden = true;
          return;
        }

        title.textContent = 'Delete ' + (text(f.song_title) || 'this track') + '?';
        words.textContent = 'This cannot be undone, and the bot may find it and file it '
          + 'again. The finding goes with it.';
        foot.textContent = '';
        backdrop.hidden = false;
        card.hidden = false;

        // WHETHER SHELVING WOULD DO ANYTHING IS A FACT THIS PAGE DOES NOT HOLD.
        // `soundtrack_findings` carries no `archived`, so the state is asked for
        // when the question opens rather than guessed: offering Shelve instead
        // on an already shelved track would write true over true and report a
        // success that changed nothing.
        var isLive = null;
        try {
          var res = await fetch(restUrl('soundtrack?select=archived&id=eq.'
            + encodeURIComponent(String(f.song_id))), { headers: authHeaders(), cache: 'no-store' });
          if (res.ok) {
            var rows = await res.json().catch(function () { return []; });
            if (Array.isArray(rows) && rows.length) isLive = rows[0].archived === false;
          }
        } catch (error) {
          console.error(error);
        }
        if (pendingDelete !== f) return;

        if (isLive) {
          words.textContent = 'This cannot be undone, and the bot may find it and file it '
            + 'again. Shelving keeps it off /soundtracks/ and stops that. The finding '
            + 'goes either way.';
        }

        function btn(label, cls, onClick) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn small ' + cls;
          b.textContent = label;
          b.addEventListener('click', onClick);
          foot.appendChild(b);
          return b;
        }

        if (isLive) btn('Shelve instead', 'primary', function () { shelveTrack(f); });
        var go = btn('Delete anyway', 'warn', function () { go.disabled = true; deleteTrack(f); });
        btn('Cancel', '', closeTrackDelete);
      }

      // `return=representation` ON BOTH. PostgREST answers 200 with an EMPTY
      // ARRAY when RLS refuses a write, so without reading the row back a
      // refused delete reports success and the card settles until a reload
      // brings it straight back.
      async function writeTrack(f, method, body) {
        var headers = { Prefer: 'return=representation' };
        if (body) headers['Content-Type'] = 'application/json';
        var opts = { method: method, headers: authHeaders(headers) };
        if (body) opts.body = JSON.stringify(body);
        var res = await fetch(restUrl('soundtrack?id=eq.'
          + encodeURIComponent(String(f.song_id))), opts);
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 160) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        return Array.isArray(rows) ? rows : [];
      }

      async function deleteTrack(f) {
        var rows;
        try {
          rows = await writeTrack(f, 'DELETE', null);
        } catch (error) {
          console.error(error);
          setNotice('could not delete that track: ' + ((error && error.message) || 'write failed'), 'error');
          closeTrackDelete();
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          closeTrackDelete();
          return;
        }
        // THE FINDING WENT WITH THE ROW. Findings are a jsonb column ON the
        // track, so deleting the track deletes them: there is nothing left to
        // clear, and the card says so rather than keeping a button that would
        // now match no open finding.
        markSettled(f, 'track deleted');
        closeTrackDelete();
        setNotice('deleted ' + (text(f.song_title) || 'the track') + ', and its findings with it', 'success');
      }

      async function shelveTrack(f) {
        var rows;
        try {
          rows = await writeTrack(f, 'PATCH', { archived: true });
        } catch (error) {
          console.error(error);
          setNotice('could not shelve that track: ' + ((error && error.message) || 'write failed'), 'error');
          closeTrackDelete();
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          closeTrackDelete();
          return;
        }
        // SHELVING IS NOT CLEARING. The track is off /soundtracks/; whether the
        // finding is dealt with is a separate judgement, so the card keeps its
        // Clear button and simply says what happened.
        closeTrackDelete();
        setNotice('shelved ' + (text(f.song_title) || 'the track')
          + '. Clear the finding too if it is dealt with.', 'success');
      }

      function markSettled(f, why) {
        f.status = 'fixed';
        var item = document.querySelector('[data-finding-id="' + f.id + '"]');
        if (!item) return;
        item.classList.add('is-cleared');
        var acts = item.querySelector('.issue-acts');
        if (acts) {
          acts.textContent = '';
          var said = document.createElement('span');
          said.className = 'issue-settled';
          said.textContent = why;
          acts.appendChild(said);
        }
        paintStats();
      }


      // ── SELECTING SEVERAL FINDINGS ──────────────────────────────────────
      //
      // A run files forty at a time and many of them have the same answer, so
      // clearing them one press each is the thing this page is for and also the
      // thing that makes it tedious.
      //
      // TWO OR MORE, like the Tape Room. One selected finding has every control
      // it needs on its own card, so a batch button for a selection of one
      // offers a second way to do what is already in front of you.
      var picked = Object.create(null);

      function pickedIds() { return Object.keys(picked); }
      function pickedFindings() {
        return findings.filter(function (f) { return picked[String(f.id)]; });
      }

      // PRUNED TO WHAT IS DRAWN, on every render. A tick on a card nobody can
      // see is a batch press that lands somewhere silent.
      function prunePicked() {
        var live = Object.create(null);
        findings.forEach(function (f) {
          var id = String(f.id);
          if (picked[id] && text(f.status) === 'open') live[id] = true;
        });
        picked = live;
      }

      function pickBox(f) {
        var wrap = document.createElement('label');
        wrap.className = 'issue-pick';
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !!picked[String(f.id)];
        box.setAttribute('aria-label', 'Select this finding');
        box.title = 'Select this finding. Two or more brings up the batch button.';
        box.addEventListener('change', function () {
          if (box.checked) picked[String(f.id)] = true;
          else delete picked[String(f.id)];
          paintPickAll();
          paintBatchButton();
        });
        wrap.appendChild(box);
        return wrap;
      }

      function paintBatchButton() {
        var btn = document.getElementById('issueBatchBtn');
        if (!btn) return;
        var n = pickedIds().length;
        btn.hidden = n < 2;
        if (n < 2) return;
        btn.textContent = 'Batch edit ' + n + (n === 1 ? ' finding' : ' findings');
        btn.title = 'Act on the ' + n + ' selected findings at once.';
      }

      function paintPickAll() {
        var box = document.getElementById('issuePickAll');
        if (!box) return;
        var open = findings.filter(function (f) { return text(f.status) === 'open'; });
        var n = open.length;
        var got = open.filter(function (f) { return picked[String(f.id)]; }).length;
        box.checked = n > 0 && got === n;
        box.indeterminate = got > 0 && got < n;
        box.disabled = !n;
        // `onchange`, NOT `addEventListener`: this element is not rebuilt, so a
        // listener added on every paint would stack up one per render.
        box.onchange = function () {
          var on = got !== n;
          open.forEach(function (f) {
            if (on) picked[String(f.id)] = true; else delete picked[String(f.id)];
          });
          render();
        };
      }

      // ── THE BATCH DIALOG, IN TWO STATES ─────────────────────────────────
      //
      // First what a selection can be made to do, then the question about
      // deleting, in the same panel: a second dialog over a dialog is worse
      // than a panel that changes its mind, and the way back is Back.
      var batchOpen = false;
      var batchPendingDelete = false;

      function openBatch() { batchOpen = true; batchPendingDelete = false; paintBatch(); }
      function closeBatch() { batchOpen = false; batchPendingDelete = false; paintBatch(); }

      function paintBatch() {
        var card = document.getElementById('issueBatchCard');
        var backdrop = document.getElementById('issueBatchBackdrop');
        var title = document.getElementById('issueBatchTitle');
        var words = document.getElementById('issueBatchWords');
        var foot = document.getElementById('issueBatchFoot');
        if (!card || !backdrop || !title || !words || !foot) return;

        var list = pickedFindings();
        var n = list.length;
        if (!batchOpen || n < 2) {
          card.hidden = true;
          backdrop.hidden = true;
          return;
        }

        // ONLY THE FINDINGS THAT NAME A TRACK CAN HAVE THEIR TRACK TOUCHED, and
        // several of a run's findings are about the LIST. Counting them is what
        // lets the buttons say how many they will really reach instead of
        // implying all of them.
        var withTrack = list.filter(function (f) {
          return text(f.scope) !== 'tape' && f.song_id != null;
        });
        var trackIds = withTrack.map(function (f) { return String(f.song_id); });
        // ONE TRACK MAY CARRY SEVERAL FINDINGS, so the count of tracks is not
        // the count of findings and saying otherwise would overstate the act.
        var uniqueTracks = Object.keys(trackIds.reduce(function (m, id) { m[id] = 1; return m; }, {}));

        foot.textContent = '';
        function btn(label, cls, onClick) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn small ' + cls;
          b.textContent = label;
          b.addEventListener('click', onClick);
          foot.appendChild(b);
          return b;
        }

        if (!batchPendingDelete) {
          title.textContent = n + ' findings selected';
          words.textContent = uniqueTracks.length
            ? ('They name ' + uniqueTracks.length
               + (uniqueTracks.length === 1 ? ' track' : ' distinct tracks') + '.'
               + (uniqueTracks.length < n ? ' The rest are about a tape rather than a track.' : ''))
            : 'All of them are about a tape rather than a track, so only clearing applies.';
          btn('Clear all', 'primary', function () { batchClear(list); });
          if (uniqueTracks.length) {
            btn('Shelve tracks', '', function () { batchShelve(uniqueTracks, list); });
            btn('Delete tracks', 'warn', function () { batchPendingDelete = true; paintBatch(); });
          }
          btn('Done', '', closeBatch);
        } else {
          title.textContent = 'Delete ' + uniqueTracks.length
            + (uniqueTracks.length === 1 ? ' track' : ' tracks') + ' for good?';
          words.textContent = 'This cannot be undone, and the bot may find them and file '
            + 'them again. Their findings go with them. Shelving keeps them off '
            + '/soundtracks/ and stops that.';
          btn('Shelve instead', 'primary', function () {
            batchPendingDelete = false;
            batchShelve(uniqueTracks, list);
          });
          var go = btn('Delete ' + uniqueTracks.length
            + (uniqueTracks.length === 1 ? ' track' : ' tracks'), 'warn', function () {
            go.disabled = true;
            batchDelete(uniqueTracks, withTrack);
          });
          btn('Back', '', function () { batchPendingDelete = false; paintBatch(); });
        }

        backdrop.hidden = false;
        card.hidden = false;
      }

      // CLEARING IS ONE CALL PER FINDING, because `tgb_resolve_soundtrack_finding`
      // takes ONE id: a finding lives inside a jsonb array on its track, so there
      // is no filter that reaches several at once. The count of successes is
      // reported rather than assumed -- the function answers false when it
      // matched no OPEN finding, and calling that a success would leave rows on
      // screen that a reload brings straight back.
      async function batchClear(list) {
        var done = 0, refused = 0;
        for (var i = 0; i < list.length; i++) {
          var f = list[i];
          try {
            var res = await fetch(restUrl('rpc/tgb_resolve_soundtrack_finding'), {
              method: 'POST',
              headers: authHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({ p_id: f.id, p_status: 'fixed' })
            });
            if (!res.ok) throw new Error('Supabase ' + res.status);
            var ok = await res.json().catch(function () { return false; });
            if (ok) { markSettled(f, 'cleared'); done += 1; } else refused += 1;
          } catch (error) {
            console.error(error);
            refused += 1;
          }
        }
        closeBatch();
        picked = Object.create(null);
        paintPickAll();
        paintBatchButton();
        setNotice('cleared ' + done + (refused ? ', ' + refused + ' were refused' : ''),
          refused ? 'error' : 'success');
      }

      // ONE REQUEST FOR THE LOT, `id=in.(...)`, not a loop: a loop can
      // half-finish with nothing saying which half.
      async function batchWriteTracks(ids, method, body) {
        var headers = { Prefer: 'return=representation' };
        if (body) headers['Content-Type'] = 'application/json';
        var opts = { method: method, headers: authHeaders(headers) };
        if (body) opts.body = JSON.stringify(body);
        var res = await fetch(restUrl('soundtrack?id=in.('
          + ids.map(encodeURIComponent).join(',') + ')'), opts);
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 160) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        return Array.isArray(rows) ? rows : [];
      }

      async function batchShelve(ids, list) {
        var rows;
        try {
          rows = await batchWriteTracks(ids, 'PATCH', { archived: true });
        } catch (error) {
          console.error(error);
          setNotice('could not shelve those tracks: ' + ((error && error.message) || 'write failed'), 'error');
          closeBatch();
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          closeBatch();
          return;
        }
        // SHELVING IS NOT CLEARING, so the findings stay open and selected: the
        // track is off /soundtracks/ and whether each note is dealt with is
        // still a judgement somebody has to make.
        closeBatch();
        var missed = ids.length - rows.length;
        var short = missed ? ' (' + missed + (missed === 1 ? ' was' : ' were') + ' refused)' : '';
        setNotice('shelved ' + rows.length + (rows.length === 1 ? ' track' : ' tracks') + short
          + '. Their findings are still open.', short ? 'error' : 'success');
      }

      async function batchDelete(ids, withTrack) {
        var rows;
        try {
          rows = await batchWriteTracks(ids, 'DELETE', null);
        } catch (error) {
          console.error(error);
          setNotice('could not delete those tracks: ' + ((error && error.message) || 'write failed'), 'error');
          closeBatch();
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          closeBatch();
          return;
        }
        // THE FINDINGS WENT WITH THE ROWS, findings being a jsonb column on the
        // track itself, so every card naming one of these tracks is settled --
        // including the ones that were not selected.
        var gone = ids.reduce(function (m, id) { m[String(id)] = 1; return m; }, {});
        findings.forEach(function (f) {
          if (f.song_id != null && gone[String(f.song_id)]) markSettled(f, 'track deleted');
        });
        closeBatch();
        picked = Object.create(null);
        paintPickAll();
        paintBatchButton();
        var missed = ids.length - rows.length;
        var short = missed ? ' (' + missed + (missed === 1 ? ' was' : ' were') + ' refused)' : '';
        setNotice('deleted ' + rows.length + (rows.length === 1 ? ' track' : ' tracks') + short
          + ', and their findings with them', short ? 'error' : 'success');
      }

      function render() {
        if (!issueList) return;
        issueList.textContent = '';
        paintStats();

        if (!findings.length) {
          var note = document.createElement('div');
          note.className = 'empty-note';
          note.textContent = 'No findings on file. TGB SOUNDTRACK BOT audits five tapes a run '
            + 'and reports what it finds here.';
          issueList.appendChild(note);
          return;
        }

        // OPEN ONES FIRST, THEN BY SEVERITY. A cleared finding stays on the
        // page rather than vanishing under the pointer, so it has to sink or it
        // would sit among the work.
        prunePicked();
        var rank = { high: 0, warn: 1, info: 2 };
        findings.slice().sort(function (a, b) {
          var ao = text(a.status) === 'open' ? 0 : 1;
          var bo = text(b.status) === 'open' ? 0 : 1;
          if (ao !== bo) return ao - bo;
          var as = rank[text(a.severity)] == null ? 3 : rank[text(a.severity)];
          var bs = rank[text(b.severity)] == null ? 3 : rank[text(b.severity)];
          if (as !== bs) return as - bs;
          return String(b.created_at).localeCompare(String(a.created_at));
        }).forEach(function (f) {
          var item = findingItem(f);
          if (text(f.status) !== 'open') item.classList.add('is-cleared');
          issueList.appendChild(item);
        });

        paintPickAll();
        paintBatchButton();
        paintBatch();
      }

      async function load() {
        try {
          // THE VIEW, NOT THE TABLE. Findings live in a jsonb array on
          // public.soundtrack, which PostgREST cannot count or list;
          // soundtrack_findings flattens them to one row each. It is
          // security_invoker and granted to `authenticated` only, because a
          // finding is an internal editorial note.
          findings = await fetchAllRows(
            'soundtrack_findings?select=*&order=created_at.desc');
          render();
          setNotice('');
        } catch (error) {
          console.error(error);
          findings = [];
          render();
          setNotice((error && error.message) || 'could not read the findings', 'error');
        }
      }

      var issueBatchBtnEl = document.getElementById('issueBatchBtn');
      if (issueBatchBtnEl) issueBatchBtnEl.addEventListener('click', openBatch);
      var issueBatchBackdropEl = document.getElementById('issueBatchBackdrop');
      if (issueBatchBackdropEl) issueBatchBackdropEl.addEventListener('click', closeBatch);
      var issueDelBackdropEl = document.getElementById('issueDelBackdrop');
      if (issueDelBackdropEl) issueDelBackdropEl.addEventListener('click', closeTrackDelete);

      // THE DELETE QUESTION TAKES ESCAPE FIRST, being the thing on top when it
      // is open.
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        var del = document.getElementById('issueDelCard');
        if (del && !del.hidden) { closeTrackDelete(); return; }
        var batch = document.getElementById('issueBatchCard');
        if (batch && !batch.hidden) closeBatch();
      });

      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          load().catch(function (error) {
            console.error(error);
            setNotice('could not read the findings', 'error');
          });
        },
        onSignedOut: function () {
          findings = [];
          if (issueList) issueList.textContent = '';
          if (roomStats) roomStats.textContent = '';
        }
      });

      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);
      adminAuth.init();
    }());
  </script>
</body>
</html>
