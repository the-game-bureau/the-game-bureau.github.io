<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HIGHLIGHTS ADMIN | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
          document.documentElement.classList.add('admin-embedded');
        }
      } catch (error) {}
    }());
  </script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --mist: var(--paper-base);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .topbar-actions--end {
      margin-left: auto;
    }

    .topbar-actions > a.btn[href="./"] {
      display: none;
    }

    .admin-nav { display: flex; gap: 4px; }
    .admin-nav-group { position: relative; display: inline-flex; }
    .admin-nav-submenu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      display: none;
      flex-direction: column;
      padding: 6px;
      gap: 2px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }
    .admin-nav-group:hover > .admin-nav-submenu,
    .admin-nav-group:focus-within > .admin-nav-submenu { display: flex; }
    .admin-nav-submenu .admin-nav-link {
      white-space: nowrap;
      font-size: 0.78rem;
      min-height: 34px;
      padding: 0 12px;
    }
    .admin-nav-split {
      display: inline-flex;
      border: 2px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-nav-split .admin-nav-link {
      border-radius: 0;
      background: #fff;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit {
      padding: 0 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      background: #d1d5db;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit:hover {
      background: #c5c9d1;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active:hover {
      background: rgba(var(--bic-blue-rgb), 0.85);
      color: #fff;
    }
    .admin-nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav-link:hover { background: var(--line); color: var(--ink); }
    .admin-nav-link--active { background: var(--accent); color: #fff; }
    .toolbar-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; }

    .brand {
      display: grid;
      gap: 4px;
    }

    .section-head {
      display: grid;
      gap: 4px;
      margin: 0 0 14px;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 4.5rem;
      letter-spacing: 0;
      line-height: 0.92;
      text-shadow: 0 6px 14px rgba(var(--bic-blue-rgb), 0.08);
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar input {
      min-width: min(100%, 260px);
      flex: 1;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
    }

    .toolbar input:focus,
    .auth input:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    button, .btn, .admin-nav-link, [class*="-btn"] {
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.danger {
      border-color: #c23737;
      color: #c23737;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      line-height: 0;
    }

    .signout-btn svg {
      width: 31px;
      height: 31px;
      display: block;
      flex: 0 0 auto;
    }

    .mb-menu {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mb-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .mb-trigger:hover,
    .mb-trigger:focus-visible,
    .mb-menu.open .mb-trigger {
      background: rgba(255,255,255,1);
      border-color: var(--accent);
      outline: none;
    }

    .mb-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }

    .mb-section {
      padding: 6px 14px 4px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mb-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .mb-item:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
    }

    .mb-item.is-active {
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--accent);
    }

    .mb-sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--bic-blue-rgb), 0.52);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .auth-modal.hidden {
      display: none !important;
    }

    .auth {
      position: relative;
      width: min(430px, 100%);
      margin: 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }

    .auth-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .auth-close:hover { background: var(--line); color: var(--ink); }

    .auth h1 {
      margin-bottom: 10px;
      font-size: 2.4rem;
    }

    .auth-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .auth-actions {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .auth-actions .btn.primary {
      flex: 1 1 auto;
    }

    .home-icon-btn {
      letter-spacing: 0.06em;
    }

    .auth label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .auth input {
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .status.success {
      color: var(--success);
      font-weight: 700;
    }

    /* Same as the gift shop's counts line: beats the tone classes so a status
       update does not go green, and otherwise matches .room-substat. */
    #darkroomStatus,
    #darkroomStatus.success {
      color: var(--muted);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .admin-section {
      margin-top: 34px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .photo-card.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 18px 36px var(--paper-shadow);
    }

    .photo-card.is-targeted {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), 0.2), 0 18px 36px var(--paper-shadow);
    }

    .photo-select {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      -webkit-user-select: none;
      user-select: none;
    }

    .photo-select:hover { background: var(--paper); }
    .photo-select[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .photo-link {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        rgba(var(--bic-blue-rgb), 0.08);
      background-size: 24px 24px, 24px 24px, 100% 100%;
      border: 0;
      padding: 0;
      cursor: zoom-in;
    }

    .photo-link img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .meta {
      display: grid;
      gap: 6px;
      padding: 12px;
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .meta strong {
      font-size: 0.95rem;
    }

    .meta span {
      color: var(--muted);
      word-break: break-word;
    }

    .photo-status {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,0.7);
    }
    .photo-status--approved { color: var(--success); border-color: var(--success); }
    .photo-status--rejected { color: var(--danger);  border-color: var(--danger);  }
    .photo-status--hidden   { opacity: 0.7; }

    .photo-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .photo-actions button {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .photo-actions button:hover:not(:disabled),
    .photo-actions button:focus-visible:not(:disabled) {
      border-color: var(--accent);
      outline: none;
    }
    .photo-actions button:disabled { opacity: 0.5; cursor: default; }
    .photo-actions button.is-approved {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .photo-actions button.is-rejected {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .empty {
      display: grid;
      place-items: center;
      grid-column: 1 / -1;
      min-height: 260px;
      padding: 24px;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 6, 23, 0.88);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      background: #fff;
    }

    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      color: #fff;
      background: rgba(0,0,0,0.35);
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 18px;
    }

    #pageIndicator {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      min-width: 60px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    html.admin-embedded body {
      min-height: 100%;
      background: transparent;
    }

    html.admin-embedded .app {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    html.admin-embedded .topbar,
    html.admin-embedded .home-icon-btn {
      display: none !important;
    }

    @media (max-width: 700px) {
      .app {
        width: min(100vw - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions .btn {
        flex: 1;
      }

      .topbar-actions .mb-menu {
        flex: 1;
      }

      .topbar-actions .mb-trigger {
        width: 100%;
      }

      .topbar-actions .signout-btn {
        flex: 0 0 42px;
      }

      h1 {
        font-size: 3rem;
      }

      h2 {
        font-size: 2rem;
      }


      .toolbar {
        display: grid;
      }

      .toolbar input,
      .toolbar .btn {
        width: 100%;
      }

    }
  </style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <!-- Shared admin nav. Looks like the public site nav; every button goes to
         that section's ADMIN page. See mc/js/admin-site-nav.js. -->
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <section id="reviewPanel">
      <!-- No topbar: its Mission Control link is gone and sign-in is the padlock
           in the shared admin nav above, so the row had nothing left in it. -->

      <section class="admin-section" aria-labelledby="photosHeading">
        <!-- Room hero, matching the gift shop and soundtracks rooms: the
             title straight under the shared admin nav, with the page status
             on one line below it. No gear card — the nav carries the only
             watermark now, and no public HIGHLIGHTS button, since the nav
             has a public link under every section. -->
        <div class="room-head">
          <div class="room-titlecol">
            <h1 class="room-title" id="photosHeading">HIGHLIGHTS ADMIN</h1>
            <p class="room-substat" id="darkroomStatus" aria-live="polite"></p>
          </div>
        </div>

        <div class="toolbar" id="uploadBar">
          <span class="toolbar-label">Upload</span>
          <input id="uploadGameId" type="text" placeholder="Game id (required)">
          <input id="uploadInstanceId" type="text" placeholder="Instance id (optional)">
          <input id="uploadPlayerId" type="text" placeholder="Player id (optional)">
          <input id="uploadFileInput" type="file" accept="image/*" multiple title="Choose photos to upload" aria-label="Choose photos to upload">
          <button class="btn primary" id="uploadBtn" type="button" disabled>Upload</button>
        </div>
        <p class="status" id="uploadStatus" aria-live="polite"></p>

        <div class="toolbar">
          <input id="gameFilterInput" type="text" placeholder="Filter by game id">
          <button class="btn primary" id="refreshBtn" type="button">Refresh</button>
          <button class="btn" id="clearFilterBtn" type="button">Clear</button>
          <button class="btn" id="selectAllBtn" type="button" disabled>Select All</button>
          <button class="btn" id="deselectAllBtn" type="button" disabled>Deselect</button>
          <button class="btn primary" id="downloadZipBtn" type="button" disabled>Download ZIP</button>
          <button class="btn danger" id="deleteSelectedBtn" type="button" disabled>Delete</button>
        </div>

        <p class="status" id="reviewStatus" aria-live="polite"></p>
        <div class="grid" id="photoGrid"></div>
        <div class="pagination" id="pagination" hidden>
          <button class="btn" id="prevBtn" type="button" aria-label="Previous page">&larr;</button>
          <span id="pageIndicator"></span>
          <button class="btn" id="nextBtn" type="button" aria-label="Next page">&rarr;</button>
        </div>
      </section>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">x</button>
    <img id="lightboxImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
  </div>

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const PHOTO_BUCKET = 'game-photo-submissions';

    // Sign in / sign out is the padlock in the shared admin nav. Deliberately
    // NOT TgbMcAdminNav.init, which removes the account button on every non-hub
    // page and left this one with no way back in once the modal was dismissed.
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    function restUrl(table, params = {}) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') {
          url.searchParams.set(key, String(value));
        }
      });
      return url.toString();
    }

    function encodeStoragePath(path) {
      return String(path || '').split('/').map(encodeURIComponent).join('/');
    }

    function storageSignUrl(bucket, path) {
      const objectPath = encodeURIComponent(bucket) + '/' + encodeStoragePath(path);
      return new URL('/storage/v1/object/sign/' + objectPath, SUPABASE_CONFIG.url + '/').toString();
    }

    function resolveSignedStorageUrl(value) {
      const signed = String(value || '').trim();
      if (!signed) return '';
      if (/^https?:\/\//i.test(signed)) return signed;

      const origin = new URL(SUPABASE_CONFIG.url).origin;
      if (signed.startsWith('/storage/v1/')) return origin + signed;
      if (signed.startsWith('/object/')) return origin + '/storage/v1' + signed;
      if (signed.startsWith('storage/v1/')) return origin + '/' + signed;
      if (signed.startsWith('object/')) return origin + '/storage/v1/' + signed;

      return new URL(signed, origin + '/storage/v1/').toString();
    }

    function setStatus(el, message, state = '') {
      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('error', state === 'error');
      el.classList.toggle('success', state === 'success');
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          const message = payload.message || payload.msg || payload.error_description || payload.error || text;
          if (/public\.admin_users|admin_users/i.test(message) && /schema cache|could not find/i.test(message)) {
            return 'Admin access is not set up yet. Run mc/_dev/docs/supabase/photo-submissions.sql in Supabase, then add your email to public.admin_users.';
          }
          return message;
        } catch (error) {
          return text;
        }
      } catch (error) {
        return fallback;
      }
    }

    function authHeaders(extra = {}) {
      return adminAuth.authHeaders(extra);
    }

    async function fetchSubmissions(offset = 0) {
      const gameFilter = String(gameFilterInput.value || '').trim();
      const params = {
        select: 'id,created_at,game_id,player_id,instance_id,storage_bucket,storage_path,thumb_storage_path,file_name,mime_type,file_size,stop_id,stop_title,stop_index,flow_kind,status',
        order: 'created_at.desc',
        limit: String(PAGE_LIMIT),
        offset: String(offset)
      };
      if (photoFilterId) params.id = 'eq.' + photoFilterId;
      else if (gameFilter) params.game_id = 'eq.' + gameFilter;

      const response = await fetch(restUrl('photo_submissions', params), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(await readError(response, 'Could not load photos.'));
      }

      return response.json();
    }

    async function fetchTotalPhotoCount() {
      const params = { select: 'id', limit: '1' };
      if (photoFilterId) params.id = 'eq.' + photoFilterId;
      else {
        const gameFilter = String(gameFilterInput.value || '').trim();
        if (gameFilter) params.game_id = 'eq.' + gameFilter;
      }
      const response = await fetch(restUrl('photo_submissions', params), {
        headers: authHeaders({ Accept: 'application/json', Prefer: 'count=exact' }),
        cache: 'no-store'
      });
      if (!response.ok) return null;
      const range = response.headers.get('Content-Range') || '';
      const match = range.match(/\/(\d+)$/);
      return match ? parseInt(match[1], 10) : null;
    }

    async function signStoragePath(bucket, path) {
      const response = await fetch(storageSignUrl(bucket, path), {
        method: 'POST',
        headers: authHeaders({
          'Content-Type': 'application/json',
          Accept: 'application/json'
        }),
        body: JSON.stringify({ expiresIn: SIGNED_URL_SECONDS })
      });

      if (!response.ok) {
        throw new Error(await readError(response, 'Could not sign photo URL.'));
      }

      const payload = await response.json();
      const signed = payload.signedURL || payload.signedUrl || payload.signed_url || '';
      return resolveSignedStorageUrl(signed);
    }

    async function createSignedUrl(row) {
      const bucket = row.storage_bucket || PHOTO_BUCKET;
      return signStoragePath(bucket, row.storage_path);
    }

    // Sign the thumbnail when one exists, otherwise return '' so the caller
    // can fall back to the full-res signed URL.
    async function createThumbSignedUrl(row) {
      if (!row || !row.thumb_storage_path) return '';
      const bucket = row.storage_bucket || PHOTO_BUCKET;
      try {
        return await signStoragePath(bucket, row.thumb_storage_path);
      } catch (err) {
        console.warn('Could not sign thumb URL, falling back to original.', row && row.id, err);
        return '';
      }
    }

    function formatDate(value) {
      if (!value) return '';
      try {
        return new Intl.DateTimeFormat(undefined, {
          dateStyle: 'medium',
          timeStyle: 'short'
        }).format(new Date(value));
      } catch (error) {
        return String(value);
      }
    }

    function formatSize(bytes) {
      const size = Number(bytes || 0);
      if (!size) return '';
      if (size < 1024 * 1024) return Math.round(size / 1024) + ' KB';
      return (size / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function openLightbox(src, alt) {
      lightboxImage.src = src;
      lightboxImage.alt = alt || 'Submitted photo';
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImage.src = '';
      lightboxImage.alt = '';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => (
        ch === '&' ? '&amp;'
          : ch === '<' ? '&lt;'
          : ch === '>' ? '&gt;'
          : ch === '"' ? '&quot;'
          : '&#39;'
      ));
    }

    function renderEmpty(message) {
      photoGrid.innerHTML = '<div class="empty">' + escapeHtml(message) + '</div>';
    }

    let currentPhotos = [];
    let currentPage = 0;
    let totalPhotoCount = 0;
    const selectedPhotoIds = new Set();

    function updateSelectionUi() {
      const count = selectedPhotoIds.size;
      if (downloadZipBtn) {
        downloadZipBtn.disabled = count === 0;
        downloadZipBtn.textContent = count > 0 ? `Download ZIP (${count})` : 'Download ZIP';
      }
      if (deleteSelectedBtn) {
        deleteSelectedBtn.disabled = count === 0;
        deleteSelectedBtn.textContent = count > 0 ? `Delete (${count})` : 'Delete';
      }
      if (selectAllBtn) selectAllBtn.disabled = !currentPhotos.length;
      if (deselectAllBtn) deselectAllBtn.disabled = count === 0;
      renderDarkroomStatusLine();
    }

    function renderDarkroomStatusLine() {
      const total = totalPhotoCount;
      const selected = selectedPhotoIds.size;
      setStatus(darkroomStatus, total + ' photos, ' + selected + ' selected.');
    }

    function togglePhotoSelection(id, force) {
      if (!id) return;
      const shouldSelect = typeof force === 'boolean' ? force : !selectedPhotoIds.has(id);
      if (shouldSelect) selectedPhotoIds.add(id);
      else selectedPhotoIds.delete(id);
      const card = photoGrid.querySelector('[data-card-id="' + CSS.escape(id) + '"]');
      if (card) {
        card.classList.toggle('is-selected', shouldSelect);
        const btn = card.querySelector('.photo-select');
        if (btn) btn.setAttribute('aria-pressed', shouldSelect ? 'true' : 'false');
      }
      updateSelectionUi();
    }

    function renderPhotos(items) {
      currentPhotos = Array.isArray(items) ? items : [];
      const validIds = new Set(currentPhotos.map((item) => String(item.id || '')));
      [...selectedPhotoIds].forEach((id) => { if (!validIds.has(id)) selectedPhotoIds.delete(id); });

      if (!currentPhotos.length) {
        renderEmpty('No photos found.');

      photoGrid.innerHTML = currentPhotos.map((item, index) => {
        const id = String(item.id || '');

        const isRejected = status === 'rejected';
        const instanceMeta = item.instance_id ? '<span>Instance: ' + escapeHtml(item.instance_id) + '</span>' : '';
        const fileMeta = escapeHtml(item.file_name || '') + (item.file_size ? ' - ' + escapeHtml(formatSize(item.file_size)) : '');
        return [
          '<article class="photo-card' + (isSelected ? ' is-selected' : '') + '" data-card-id="' + escapeAttr(id) + '">',
            '<button class="photo-select" type="button" data-select-id="' + escapeAttr(id) + '" aria-pressed="' + isSelected + '" aria-label="Select photo">' + (isSelected ? '\u2713' : '') + '</button>',
            '<button class="photo-link" type="button" data-index="' + index + '" aria-label="Open photo">',
              '<img src="' + escapeHtml(item.thumbSignedUrl || item.signedUrl) + '" alt="' + escapeHtml(item.file_name || 'Submitted photo') + '" loading="lazy">',
            '</button>',
            '<div class="meta">',
              '<strong>' + escapeHtml(item.stop_title || item.game_id || 'Photo') + '</strong>',
              '<span>' + escapeHtml(formatDate(item.created_at)) + '</span>',
              '<span>Game: ' + escapeHtml(item.game_id) + '</span>',
              '<span>Player: ' + escapeHtml(item.player_id) + '</span>',

              '<span>' + fileMeta + '</span>',
              '<span class="photo-status photo-status--' + escapeAttr(status) + '">' + escapeHtml(status) + '</span>',
              '<div class="photo-actions">',
                '<button type="button" data-status-id="' + escapeAttr(id) + '" data-status-set="' + (isApproved ? 'submitted' : 'approved') + '" class="' + (isApproved ? 'is-approved' : '') + '" aria-pressed="' + isApproved + '">' + (isApproved ? 'Approved \u2713' : 'Approve') + '</button>',
                '<button type="button" data-status-id="' + escapeAttr(id) + '" data-status-set="' + (isRejected ? 'submitted' : 'rejected') + '" class="' + (isRejected ? 'is-rejected' : '') + '" aria-pressed="' + isRejected + '">' + (isRejected ? 'Rejected \u2717' : 'Reject') + '</button>',
              '</div>',
            '</div>',
          '</article>'
        ].join('');
      }).join('');

      photoGrid.querySelectorAll('.photo-link').forEach((button) => {
        button.addEventListener('click', () => {

    async function setPhotoStatus(id, status, button) {
      if (!id || !status) return;
      const originalLabel = button ? button.textContent : '';
      if (button) {
        button.disabled = true;
        button.textContent = status === 'approved' ? 'Approving…'
                            : status === 'rejected' ? 'Rejecting…'
                            : 'Updating…';
      }
      try {
        const url = restUrl('photo_submissions', { id: 'eq.' + id });
        const response = await fetch(url, {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
          body: JSON.stringify({ status, reviewed_at: new Date().toISOString() })
        });
        if (!response.ok) {
          throw new Error(await readError(response, 'Could not update status.'));
        }
        const item = currentPhotos.find((row) => String(row.id) === String(id));
        if (item) item.status = status;
        renderPhotos(currentPhotos);
        const verb = status === 'approved' ? 'approved'
                   : status === 'rejected' ? 'rejected'
                   : status === 'hidden'   ? 'hidden'
                   : 'reset';
        setStatus(reviewStatus, `Photo ${verb}.`, 'success');
      } catch (err) {
        console.error('Status update failed:', err);
        if (button) {
          button.disabled = false;
          button.textContent = originalLabel;
        }
        setStatus(reviewStatus, 'Status update failed: ' + (err instanceof Error ? err.message : String(err)), 'error');
      }
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function buildZipFileName(item, usedNames) {
      const originalName = String(item && item.file_name || '').trim();
      const safeGame = String(item && item.game_id || 'game').replace(/[^A-Za-z0-9_-]+/g, '_');
      const safePlayer = String(item && item.player_id || 'player').replace(/[^A-Za-z0-9_-]+/g, '_');
      const ext = (originalName.match(/\.[A-Za-z0-9]+$/) || ['.jpg'])[0];
      const baseName = originalName
        ? originalName.replace(/[^A-Za-z0-9._-]+/g, '_')
        : `${safePlayer}_${String(item.id || '').slice(0, 8)}${ext}`;
      let candidate = `${safeGame}/${baseName}`;
      let counter = 2;
      while (usedNames.has(candidate)) {
        const dot = baseName.lastIndexOf('.');
        const stem = dot > 0 ? baseName.slice(0, dot) : baseName;
        const tail = dot > 0 ? baseName.slice(dot) : '';
        candidate = `${safeGame}/${stem}_${counter}${tail}`;
        counter += 1;
      }
      usedNames.add(candidate);
      return candidate;
    }

    async function downloadSelectedAsZip() {
      if (typeof JSZip !== 'function') {
        setStatus(reviewStatus, 'ZIP library failed to load.', 'error');
        return;
      }
      const selected = currentPhotos.filter((item) => selectedPhotoIds.has(String(item.id || '')));
      if (!selected.length) return;

      downloadZipBtn.disabled = true;
      const originalLabel = downloadZipBtn.textContent;
      downloadZipBtn.textContent = `Zipping 0/${selected.length}...`;
      setStatus(reviewStatus, `Building ZIP for ${selected.length} photo${selected.length === 1 ? '' : 's'}...`);

      try {
        const zip = new JSZip();
        const usedNames = new Set();
        let done = 0;
        for (const item of selected) {
          if (!item.signedUrl) { done += 1; continue; }
          try {
            const response = await fetch(item.signedUrl);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const blob = await response.blob();
            zip.file(buildZipFileName(item, usedNames), blob);
          } catch (err) {
            console.warn('Could not fetch for zip:', item.id, err);
          }
          done += 1;
          downloadZipBtn.textContent = `Zipping ${done}/${selected.length}...`;
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' }, (meta) => {
          downloadZipBtn.textContent = `Packing ${Math.round(meta.percent)}%`;
        });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `photos-${new Date().toISOString().slice(0, 10)}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);

        setStatus(reviewStatus, `Downloaded ${selected.length} photo${selected.length === 1 ? '' : 's'}.`, 'success');
      } catch (err) {
        console.error(err);
        setStatus(reviewStatus, 'Could not build ZIP: ' + (err instanceof Error ? err.message : String(err)), 'error');
      } finally {
        downloadZipBtn.textContent = originalLabel;
        updateSelectionUi();
      }
    }

    async function deleteSelectedPhotos() {
      const selected = currentPhotos.filter((item) => selectedPhotoIds.has(String(item.id || '')));
      if (!selected.length) return;
      const confirmed = window.confirm(
        `Permanently delete ${selected.length} photo${selected.length === 1 ? '' : 's'}?\n\n`
        + `This removes the file from storage and the submission record from the database. Cannot be undone.`
      );
      if (!confirmed) return;

      deleteSelectedBtn.disabled = true;
      const originalLabel = deleteSelectedBtn.textContent;
      deleteSelectedBtn.textContent = `Deleting 0/${selected.length}...`;
      setStatus(reviewStatus, `Deleting ${selected.length} photo${selected.length === 1 ? '' : 's'}...`);

      let deletedCount = 0;
      const failures = [];
      async function deleteStorageObject(bucket, path, label) {
        const storageUrl = new URL(
          '/storage/v1/object/' + encodeURIComponent(bucket) + '/' + encodeStoragePath(path),
          SUPABASE_CONFIG.url + '/'
        ).toString();
        const storageRes = await fetch(storageUrl, { method: 'DELETE', headers: authHeaders() });
        if (!storageRes.ok && storageRes.status !== 404) {
          throw new Error(await readError(storageRes, label + ' DELETE failed'));
        }
      }

      for (const item of selected) {
        try {
          // Remove storage objects first so we don't end up with orphans if the row delete fails.
          const bucket = item.storage_bucket || PHOTO_BUCKET;
          if (item.storage_path) {
            await deleteStorageObject(bucket, item.storage_path, 'storage');
          }
          if (item.thumb_storage_path) {
            try {
              await deleteStorageObject(bucket, item.thumb_storage_path, 'thumb');
            } catch (thumbErr) {
              // Orphaned thumbs are harmless — log and continue with the row delete.
              console.warn('Thumb delete failed, continuing.', item.id, thumbErr);
            }
          }

          const rowUrl = restUrl('photo_submissions', { id: 'eq.' + item.id });
          const rowRes = await fetch(rowUrl, { method: 'DELETE', headers: authHeaders() });
          if (!rowRes.ok) {
            throw new Error(await readError(rowRes, 'row DELETE failed'));
          }

          selectedPhotoIds.delete(String(item.id));
          deletedCount += 1;
          deleteSelectedBtn.textContent = `Deleting ${deletedCount}/${selected.length}...`;
        } catch (err) {
          console.error('Delete failed for', item && item.id, err);
          failures.push(item && item.id);
        }
      }

      deleteSelectedBtn.textContent = originalLabel;

      if (failures.length) {
        setStatus(
          reviewStatus,
          `Deleted ${deletedCount}; ${failures.length} failed.`,
          failures.length === selected.length ? 'error' : ''
        );
      } else {
        setStatus(reviewStatus, `Deleted ${deletedCount} photo${deletedCount === 1 ? '' : 's'}.`, 'success');
      }

      await loadPhotos();
    }

    const UPLOAD_MAX_BYTES = 10 * 1024 * 1024;
    const UPLOAD_ALLOWED_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'heic', 'heif'];
    const UPLOAD_MIME_BY_EXT = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
      webp: 'image/webp', gif: 'image/gif', heic: 'image/heic', heif: 'image/heif'
    };

    function sanitizePathSegment(value, fallback) {
      const slug = String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
      return slug || fallback;
    }

    function uploadFileExt(file) {
      const nameExt = (String(file && file.name || '').match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
      if (UPLOAD_ALLOWED_EXT.includes(nameExt)) return nameExt;
      const mime = String(file && file.type || '').toLowerCase();
      const found = Object.keys(UPLOAD_MIME_BY_EXT).find((ext) => UPLOAD_MIME_BY_EXT[ext] === mime);
      return found || 'jpg';
    }

    function uploadFileMime(file, ext) {
      return String(file && file.type || '') || UPLOAD_MIME_BY_EXT[ext] || 'application/octet-stream';
    }

    // Storage policy requires: seg/seg/seg/filename.ext (lowercase a-z0-9_-).
    function buildUploadStoragePath(gameId, playerId, instanceId, ext) {
      const g = sanitizePathSegment(gameId, 'game');
      const p = sanitizePathSegment(playerId, 'admin');
      const i = sanitizePathSegment(instanceId, 'upload');
      const nonce = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      return `${g}/${p}/${i}/${nonce}.${ext}`;
    }

    function updateUploadButton() {
      const hasGame = !!String(uploadGameId.value || '').trim();
      const hasFiles = !!(uploadFileInput.files && uploadFileInput.files.length);
      uploadBtn.disabled = !(hasGame && hasFiles);
    }

    async function uploadOneFile(file, gameId, playerId, instanceId) {
      if (file.size > UPLOAD_MAX_BYTES) throw new Error('over 10 MB');
      const ext = uploadFileExt(file);
      const mime = uploadFileMime(file, ext);
      const storagePath = buildUploadStoragePath(gameId, playerId, instanceId, ext);

      const objectUrl = new URL(
        '/storage/v1/object/' + encodeURIComponent(PHOTO_BUCKET) + '/' + encodeStoragePath(storagePath),
        SUPABASE_CONFIG.url + '/'
      ).toString();
      const upload = await fetch(objectUrl, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': mime, 'x-upsert': 'false' }),
        body: file
      });
      if (!upload.ok) throw new Error(await readError(upload, 'Storage upload failed.'));

      const row = {
        game_id: gameId,
        player_id: playerId || 'admin',
        instance_id: instanceId || null,
        storage_bucket: PHOTO_BUCKET,
        storage_path: storagePath,
        file_name: String(file.name || storagePath.split('/').pop()),
        mime_type: mime,
        file_size: Number.isFinite(file.size) ? file.size : null,
        flow_kind: 'admin_upload'
      };
      const insert = await fetch(restUrl('photo_submissions'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(row)
      });
      if (!insert.ok) throw new Error(await readError(insert, 'Metadata insert failed.'));
    }

    async function uploadPhotos() {
      const gameId = String(uploadGameId.value || '').trim();
      const instanceId = String(uploadInstanceId.value || '').trim();
      const playerId = String(uploadPlayerId.value || '').trim() || 'admin';
      const files = Array.from(uploadFileInput.files || []);
      if (!gameId) { setStatus(uploadStatus, 'Enter a game id.', 'error'); return; }
      if (!files.length) { setStatus(uploadStatus, 'Choose at least one photo.', 'error'); return; }

      uploadBtn.disabled = true;
      const originalLabel = uploadBtn.textContent;
      let done = 0;
      const failures = [];
      for (const file of files) {
        uploadBtn.textContent = `Uploading ${done + 1}/${files.length}...`;
        setStatus(uploadStatus, `Uploading ${file.name}...`);
        try {
          await uploadOneFile(file, gameId, playerId, instanceId);
          done += 1;
        } catch (err) {
          console.error('Upload failed for', file && file.name, err);
          failures.push((file && file.name || 'file') + ': ' + (err instanceof Error ? err.message : String(err)));
        }
      }
      uploadBtn.textContent = originalLabel;

      if (failures.length) {
        setStatus(uploadStatus, `Uploaded ${done}/${files.length}. Failed — ${failures.join('; ')}`, done ? '' : 'error');
      } else {
        setStatus(uploadStatus, `Uploaded ${done} photo${done === 1 ? '' : 's'}.`, 'success');
      }
      uploadFileInput.value = '';
      updateUploadButton();

      // Surface the freshly uploaded photos by filtering to their game.
      gameFilterInput.value = gameId;
      photoFilterId = '';
      currentPage = 0;
      await loadPhotos();
    }

    function updatePagination() {
      const totalPages = Math.ceil(totalPhotoCount / PAGE_LIMIT);
      pagination.hidden = totalPages <= 1;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage >= totalPages - 1;
      pageIndicator.textContent = totalPages > 0 ? (currentPage + 1) + ' / ' + totalPages : '';
    }

    async function loadPhotos() {
      refreshBtn.disabled = true;
      setStatus(reviewStatus, 'Loading...');
      renderEmpty('Loading...');

      try {
        const offset = currentPage * PAGE_LIMIT;
        const [rows, total] = await Promise.all([fetchSubmissions(offset), fetchTotalPhotoCount()]);
        const withUrls = await Promise.all(rows.map(async (row) => {
          try {
            const [signedUrl, thumbSignedUrl] = await Promise.all([
              createSignedUrl(row),
              createThumbSignedUrl(row)
            ]);
            return { ...row, signedUrl, thumbSignedUrl };
          } catch (error) {
            console.warn('Could not sign photo URL.', row && row.storage_path, error);
            return { ...row, signedUrl: '', thumbSignedUrl: '' };
          }
        }));
        const visibleRows = withUrls.filter((row) => row.signedUrl);
        renderPhotos(visibleRows);
        if (total !== null) {
          totalPhotoCount = total;
          renderDarkroomStatusLine();
        }
        updatePagination();
        const skipped = withUrls.length - visibleRows.length;
        setStatus(reviewStatus, skipped ? skipped + ' could not be previewed.' : '');
      } catch (error) {
        console.error(error);
        renderEmpty('Could not load photos.');
        setStatus(reviewStatus, error instanceof Error ? error.message : String(error), 'error');
      } finally {
        refreshBtn.disabled = false;
      }
    }

    document.querySelectorAll('[data-admin-logoff]').forEach((button) => {
      button.addEventListener('click', () => {
        adminAuth.signOut();
      });
    });

    refreshBtn.addEventListener('click', loadPhotos);
    if (uploadBtn) uploadBtn.addEventListener('click', uploadPhotos);
    if (uploadFileInput) uploadFileInput.addEventListener('change', updateUploadButton);
    if (uploadGameId) uploadGameId.addEventListener('input', updateUploadButton);
    clearFilterBtn.addEventListener('click', () => {
      photoFilterId = '';
      gameFilterInput.value = '';
      currentPage = 0;
      loadPhotos();
    });
    if (selectAllBtn) {
      selectAllBtn.addEventListener('click', () => {
        currentPhotos.forEach((item) => {
          const id = String(item.id || '');
          if (id) togglePhotoSelection(id, true);
        });
      });
    }
    if (deselectAllBtn) {
      deselectAllBtn.addEventListener('click', () => {
        [...selectedPhotoIds].forEach((id) => togglePhotoSelection(id, false));
      });
    }
    if (downloadZipBtn) {
      downloadZipBtn.addEventListener('click', downloadSelectedAsZip);
    }
    if (deleteSelectedBtn) {
      deleteSelectedBtn.addEventListener('click', deleteSelectedPhotos);
    }
    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) { currentPage -= 1; loadPhotos(); }
    });
    nextBtn.addEventListener('click', () => {
      const totalPages = Math.ceil(totalPhotoCount / PAGE_LIMIT);
      if (currentPage < totalPages - 1) { currentPage += 1; loadPhotos(); }
    });
    gameFilterInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      photoFilterId = '';
      currentPage = 0;
      loadPhotos();
    });
    gameFilterInput.addEventListener('input', () => {
      if (photoFilterId) photoFilterId = '';
    });

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    lightboxClose.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLightbox();
    });

    (async function init() {
      gameFilterInput.value = initialParams.get('game') || initialParams.get('id') || '';
      if (uploadGameId) uploadGameId.value = gameFilterInput.value;
      if (uploadInstanceId) uploadInstanceId.value = initialParams.get('instance') || '';
      updateUploadButton();

      try {
        await adminAuth.init();
      } catch (error) {
        console.error(error);
        adminAuth.showAuth(error instanceof Error ? error.message : String(error), 'error');
      }
    })();
  </script>
  <script>
    (function () {
      document.querySelectorAll('[data-admin-menu]').forEach((menu) => {
        const trigger = menu.querySelector('.mb-trigger');
        const panel = menu.querySelector('.mb-panel');
        if (!trigger || !panel) return;

        function closeMenu() {
          menu.classList.remove('open');
          panel.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
        }

        trigger.addEventListener('click', (event) => {
          event.stopPropagation();
          const isOpen = !panel.hidden;
          document.querySelectorAll('[data-admin-menu]').forEach((otherMenu) => {
            otherMenu.classList.remove('open');
            const otherTrigger = otherMenu.querySelector('.mb-trigger');
            const otherPanel = otherMenu.querySelector('.mb-panel');
            if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            if (otherPanel) otherPanel.hidden = true;
          });
          if (isOpen) return;
          menu.classList.add('open');
          panel.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
        });

        panel.addEventListener('click', (event) => {
          event.stopPropagation();
          if (event.target.closest('.mb-item')) closeMenu();
        });

        document.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeMenu();
        });
      });
    }());
  </script>
</body>
</html>
