# Supabase project config.
#
# Minimal on purpose: it only pins the one per-function setting we care about.
# The other edge functions are intentionally NOT listed here — they keep
# whatever verify_jwt they are deployed with (via their own deploy flags), so
# adding this file does not change their behavior.
project_id = "qmaafbncpzrdmqapkkgr"

# The "Grab" button in shop/admin calls this function straight from the browser.
# With verify_jwt on, Supabase's gateway rejects the credential-less CORS
# preflight (OPTIONS) before it reaches the handler, so every call fails with
# "Failed to fetch". Turning it off lets the preflight through; the function
# does its own thing (scraping a public product URL — no user data, no RLS).
#
# With this set, a plain `supabase functions deploy scrape-amazon` is enough —
# no --no-verify-jwt flag required.
[functions.scrape-amazon]
verify_jwt = false

# The gift-shop error report's "AI audit" button calls this straight from the
# browser too. Same reason as scrape-amazon: verify_jwt on would reject the
# credential-less CORS preflight. The function gates itself — it verifies the
# caller's session (GoTrue /auth/v1/user) before spending any Anthropic tokens.
[functions.shop-coherence-check]
verify_jwt = false
