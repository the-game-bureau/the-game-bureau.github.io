<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GIFT SHOP | THE GAME BUREAU</title>
  <link rel="icon" href="/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
          document.documentElement.classList.add('admin-embedded');
        }
      } catch (error) {}
    }());1
  </script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .admin-nav { display: flex; gap: 4px; }
    .admin-nav-group { position: relative; display: inline-flex; }
    .admin-nav-submenu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      display: none;
      flex-direction: column;
      padding: 6px;
      gap: 2px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }
    .admin-nav-group:hover > .admin-nav-submenu,
    .admin-nav-group:focus-within > .admin-nav-submenu { display: flex; }
    .admin-nav-submenu .admin-nav-link {
      white-space: nowrap;
      font-size: 0.78rem;
      min-height: 34px;
      padding: 0 12px;
    }
    .admin-nav-split {
      display: inline-flex;
      border: 2px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-nav-split .admin-nav-link {
      border-radius: 0;
      background: #fff;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit {
      padding: 0 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      background: #d1d5db;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit:hover {
      background: #c5c9d1;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active:hover {
      background: rgba(var(--bic-blue-rgb), 0.85);
      color: #fff;
    }
    .admin-nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav-link:hover { background: var(--line); color: var(--ink); }
    .admin-nav-link--active { background: var(--accent); color: #fff; }
    .toolbar-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; }

    .topbar-actions > a.btn[href="./"] { display: none; }

    .section-head { display: grid; gap: 4px; margin: 0 0 14px; }

    .section-head--gears {
      position: relative;
      overflow: hidden;
      gap: 6px;
      margin-bottom: 18px;
      padding: 20px 22px 22px;
      padding-right: clamp(136px, 30vw, 220px);
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .section-head--gears > :not(.section-gear-art):not(.section-head-actions) {
      position: relative;
      z-index: 1;
    }

    .section-head-actions {
      position: absolute;
      top: 50%;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
      transform: translateY(-50%);
    }

    .section-head-actions .btn[aria-disabled="true"] {
      opacity: 0.38;
      pointer-events: none;
    }

    .section-head--gears .copy {
      max-width: 440px;
    }

    .section-gear-art {
      position: absolute;
      top: -4px;
      right: -2px;
      z-index: 0;
      width: 320px;
      height: 188px;
      pointer-events: none;
      opacity: 0.96;
      overflow: visible;
    }

    .section-head--gears .header-gear {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-atmosphere {
      opacity: 0.9;
    }

    .section-head--gears .header-gear--large {
      stroke: rgba(var(--bic-blue-rgb), 0.28);
    }

    .section-head--gears .header-gear--small {
      stroke: rgba(var(--bic-blue-rgb), 0.22);
    }

    .section-head--gears .header-gear-body {
      fill: rgba(var(--bic-blue-rgb), 0.045);
      stroke-width: 3.4;
    }

    .section-head--gears .header-gear-ring {
      fill: rgba(var(--bic-blue-rgb), 0.018);
      stroke-width: 3;
    }

    .section-head--gears .header-gear-inner {
      fill: none;
      stroke-width: 2.4;
      opacity: 0.92;
    }

    .section-head--gears .header-gear-spoke {
      fill: rgba(var(--bic-blue-rgb), 0.1);
      stroke: none;
    }

    .section-head--gears .header-gear-core {
      fill: rgba(var(--bic-blue-rgb), 0.08);
      stroke-width: 2.2;
    }

    .section-head--gears .header-gear-halo {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.14);
      stroke-width: 2;
      stroke-dasharray: 4 8;
    }

    .section-head--gears .header-gear-bore {
      fill: none;
      stroke-width: 2;
    }

    .section-head--gears .header-gear-wire {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.12);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-wire--bold {
      stroke: rgba(var(--bic-blue-rgb), 0.17);
      stroke-width: 1.8;
    }

    .section-head--gears .header-gear-guide {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.1);
      stroke-width: 1.2;
      stroke-dasharray: 2 7;
    }

    .section-head--gears .header-gear-node {
      fill: rgba(var(--bic-blue-rgb), 0.17);
    }

    .section-head--gears .header-gear-speck {
      fill: rgba(var(--bic-blue-rgb), 0.11);
    }

    .section-head--gears .header-gear-crosshair {
      stroke: rgba(var(--bic-blue-rgb), 0.15);
      stroke-width: 1.4;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3rem;
      letter-spacing: 0;
      line-height: 1;
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 2.4rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy { margin: 0; color: var(--muted); line-height: 1.5; max-width: 620px; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar select {
      appearance: none;
      -webkit-appearance: none;
      flex: 1;
      min-width: min(100%, 260px);
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .toolbar select::-ms-expand { display: none; }

    button, .btn, .admin-nav-link, [class*="-btn"] {
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .btn:hover { background: rgba(255,255,255,1); border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--bic-blue); border-color: var(--bic-blue); }

    .btn.danger {
      color: var(--danger);
      border-color: rgba(160, 63, 45, 0.45);
      background: rgba(255,255,255,0.92);
    }
    .btn.danger:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--bic-blue-rgb), 0.52);
      backdrop-filter: blur(6px);
    }

    .auth-modal.hidden {
      display: none !important;
    }

    .auth {
      position: relative;
      width: min(430px, 100%);
      margin: 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }

    .auth-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .auth-close:hover { background: var(--line); color: var(--ink); }

    .auth h1 { margin-bottom: 10px; font-size: 2.4rem; }
    .auth-form { display: grid; gap: 12px; margin-top: 18px; }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions .btn.primary { flex: 1; }
    .auth label {
      display: grid; gap: 6px;
      color: var(--muted); font-size: 0.9rem; font-weight: 700;
    }
    .auth input {
      height: 44px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: rgba(255,255,255,0.86);
    }
    .auth input:focus,
    .toolbar select:focus,
    .item input:focus,
    .item textarea:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    .home-icon-btn {
      letter-spacing: 0.06em;
    }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .signout-btn svg { display: block; width: 31px; height: 31px; }

    .mb-menu {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mb-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.15s, border-color 0.15s;
    }

    .mb-trigger:hover,
    .mb-trigger:focus-visible,
    .mb-menu.open .mb-trigger {
      background: rgba(255,255,255,1);
      border-color: var(--accent);
      outline: none;
    }

    .mb-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }

    .mb-section {
      padding: 6px 14px 4px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mb-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .mb-item:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
    }

    .mb-item.is-active {
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--accent);
    }

    .mb-sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }

    #shopStatus,
    #shopStatus.success {
      color: var(--ink);
      font-weight: 600;
    }

    .items {
      display: grid;
      gap: 14px;
    }
    .items-more { display: flex; justify-content: center; margin-top: 14px; }
    .item.paged-out { display: none; }
    .item-certify {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .item-certify-date {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
    }
    .item-certify-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }
    .item-certify-check input { cursor: pointer; }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px var(--paper-shadow);
    }

    .item.is-archived { opacity: 0.65; }
    .item.is-new { border-color: var(--accent); }
    .item.is-targeted {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(215, 58, 49, 0.16), 0 10px 24px var(--paper-shadow);
    }

    .item-focus-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      width: 220px;
      flex-shrink: 0;
    }
    .item-focus-caption {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      line-height: 1.4;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: left;
    }
    /* Aspect-ratio + height match the public gift card's .card-media
       (154px tall × ≥280px wide). Scaled up 1.43x for an easier drag
       target while preserving WYSIWYG crop. max-width keeps it from
       overflowing narrow viewports — aspect-ratio handles the height. */
    .item-focus {
      position: relative;
      width: 400px;
      max-width: 100%;
      aspect-ratio: 400 / 220;
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.06);
      border: 1px solid var(--line);
      overflow: hidden;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      touch-action: none;
    }
    .item-focus [data-focus-placeholder] {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .item-focus img {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      max-height: none;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    .item-focus[data-has-image="true"] {
      cursor: grab;
    }
    .item-focus[data-dragging="true"] {
      cursor: grabbing;
    }

    .item-fields {
      display: grid;
      grid-template-columns: 1fr 140px 130px;
      gap: 10px;
      align-items: end;
    }

    .item-fields .field-wide { grid-column: 1 / -1; }
    .item-fields label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-fields input,
    .item-fields textarea,
    .item-fields select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .item-fields textarea {
      height: 64px;
      padding: 8px 10px;
      resize: vertical;
      min-height: 64px;
    }

    .item-listings {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.03);
    }
    .item-listings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-listings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .listing-row {
      display: grid;
      grid-template-columns: 1fr 90px auto auto;
      gap: 6px;
      align-items: center;
    }
    .listing-row select,
    .listing-row input[type="number"] {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .listing-row select[multiple] {
      height: auto;
      min-height: 132px;
      padding: 4px 6px;
      overflow-y: auto;
    }
    .listing-row select[multiple] option { padding: 2px 6px; }
    .listing-row select[multiple] option:checked {
      background: linear-gradient(0deg, rgba(var(--bic-blue-rgb), 0.18), rgba(var(--bic-blue-rgb), 0.18));
      color: var(--ink);
    }
    .listing-row.is-multi { align-items: start; }
    .listing-row.is-multi .listing-remove,
    .listing-row.is-multi input[type="number"] { margin-top: 2px; }
    .listing-multi-hint {
      grid-column: 1 / -1;
      margin: -2px 0 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    /* Search-to-add combobox (new listing rows) */
    .listing-search-wrap { position: relative; }
    .listing-search {
      width: 100%;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .item-listings-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .item-listings-picker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .listing-picker-select {
      width: 100%;
      min-height: 168px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--ink);
      font-size: 0.85rem;
    }
    .listing-picker-select option { padding: 3px 6px; }
    .listing-picker-select option:checked {
      background: linear-gradient(0deg, rgba(var(--bic-blue-rgb), 0.2), rgba(var(--bic-blue-rgb), 0.2));
      color: var(--ink);
    }
    .listing-picker-actions { display: flex; gap: 6px; }
    .listing-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .listing-chips.has-chips { margin-bottom: 4px; }
    .listing-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px 2px 8px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.10);
      font-size: 0.78rem;
      color: var(--ink);
    }
    .listing-chip-label { color: inherit; text-decoration: none; cursor: pointer; }
    .listing-chip-label:hover { text-decoration: underline; }
    .listing-chip .muted { color: var(--muted); font-size: 0.7rem; }
    .listing-chip-remove {
      width: 16px;
      height: 16px;
      padding: 0;
      line-height: 1;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
    }
    .listing-chip-remove:hover { color: var(--danger); }
    .listing-search-results {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      z-index: 40;
      max-height: 220px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 8px 24px var(--paper-shadow);
    }
    .listing-search-result {
      padding: 7px 10px;
      font-size: 0.82rem;
      color: var(--ink);
      cursor: pointer;
    }
    .listing-search-result:hover,
    .listing-search-result.is-active { background: rgba(var(--bic-blue-rgb), 0.12); }
    .listing-search-result .muted { color: var(--muted); font-size: 0.74rem; }
    .listing-search-empty {
      padding: 8px 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .listing-row .listing-remove {
      width: 30px; height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .listing-row .listing-remove:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .listing-row.is-removed { display: none; }
    .item-listings-empty {
      padding: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    .item-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
      margin-top: 4px;
    }

    /* ── Suggest lightbox ─────────────────────────────────────── */
    .suggest-modal {
      position: fixed; inset: 0; z-index: 1500;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .suggest-modal[hidden] { display: none; }
    .suggest-backdrop {
      position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }
    .suggest-panel {
      position: relative;
      width: min(720px, 100%);
      max-height: 90vh;
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
      overflow: hidden;
    }
    .suggest-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .suggest-panel-head h2 { margin: 0; font-size: 1rem; }
    .suggest-close {
      background: transparent; border: 0;
      font-size: 1.3rem; line-height: 1;
      color: var(--muted); cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
    }
    .suggest-close:hover { background: rgba(0,0,0,0.05); color: var(--ink); }
    .suggest-form, .suggest-results {
      padding: 16px 18px;
      overflow: auto;
      flex: 1;
    }
    .suggest-form { display: grid; gap: 12px; }
    .suggest-form label {
      display: grid; gap: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted);
    }
    .suggest-form input[type="text"],
    .suggest-form input[type="number"],
    .suggest-form select {
      height: 36px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 6px;
      font-family: inherit; font-size: 0.9rem;
      color: var(--ink); background: #fff;
    }
    .suggest-form .suggest-check {
      flex-direction: row; align-items: center; gap: 8px;
      font-family: inherit;
      text-transform: none; letter-spacing: 0;
      font-size: 0.85rem; font-weight: 500; color: var(--ink);
    }
    .suggest-form .suggest-check input { width: auto; height: auto; }
    .suggest-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 4px;
    }
    .suggest-status {
      min-height: 1.4em; margin: 0;
      font-size: 0.85rem; color: var(--muted);
    }
    .suggest-status.error { color: var(--danger); font-weight: 700; }
    .suggest-status.success { color: var(--ok, #2f6b3d); font-weight: 700; }
    .suggest-results-head {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .suggest-results-head label {
      display: inline-flex; gap: 6px; align-items: center;
      font-size: 0.85rem;
    }
    .suggest-results-count {
      flex: 1;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .suggest-results-list {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .suggest-result {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      align-items: center;
      background: rgba(255,255,255,0.96);
    }
    .suggest-result img {
      width: 56px; height: 56px;
      object-fit: contain;
      border-radius: 6px;
      background: #f5f5f5;
    }
    .suggest-result-meta {
      display: flex; flex-direction: column; gap: 2px;
      min-width: 0;
    }
    .suggest-result-title {
      font-size: 0.88rem; font-weight: 700;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-sub {
      font-size: 0.7rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-desc {
      margin: 2px 0 0;
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--ink);
      opacity: 0.82;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .suggest-hint {
      margin: 0 0 6px; font-size: 0.82rem; color: var(--muted); line-height: 1.4;
    }
    .suggest-advanced { margin: 2px 0; }
    .suggest-advanced > summary {
      cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.04em; text-transform: uppercase; list-style: revert;
      padding: 4px 0;
    }
    .suggest-advanced[open] > summary { margin-bottom: 6px; }
    .suggest-source {
      display: inline-block; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 999px; margin-right: 6px;
      vertical-align: middle;
    }
    .suggest-source--bookshop { background: rgba(82, 58, 164, 0.12); color: #523AA4; }
    .suggest-source--amazon { background: rgba(255, 153, 0, 0.16); color: #8a5a00; }
    .suggest-result-actions {
      display: flex; flex-direction: column; gap: 4px;
      align-items: flex-end;
    }
    .suggest-result-badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .suggest-result.is-existing { opacity: 0.55; }
    .suggest-result-check { width: 18px; height: 18px; cursor: pointer; }
    .suggest-result a.suggest-result-link {
      color: inherit; text-decoration: none;
    }
    .suggest-result a.suggest-result-link:hover .suggest-result-title {
      text-decoration: underline;
    }

    .item-archive-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .item-archive-toggle input { width: auto; height: auto; }

    .item-status {
      flex: 1;
      text-align: right;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .item-status.error { color: var(--danger); font-weight: 700; }
    .item-status.success { color: var(--success); font-weight: 700; }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    html.admin-embedded body {
      min-height: 100%;
      background: transparent;
    }

    html.admin-embedded .app {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    html.admin-embedded .topbar,
    html.admin-embedded .section-head--gears,
    html.admin-embedded .home-icon-btn {
      display: none !important;
    }

    @media (max-width: 720px) {
      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions .mb-menu {
        flex: 1;
      }

      .topbar-actions .mb-trigger {
        width: 100%;
      }

      .topbar-actions .signout-btn {
        flex: 0 0 42px;
      }

      h1 { font-size: 2.4rem; }

      .section-head--gears {
        padding: 18px 18px 112px;
      }

      .section-head--gears .copy {
        max-width: none;
      }

      .section-gear-art {
        top: auto;
        right: -22px;
        bottom: -26px;
        width: 250px;
        height: 147px;
      }

      .toolbar {
        display: grid;
      }

      .toolbar > * {
        width: 100%;
      }

      .item { grid-template-columns: auto 1fr; }
      .item-focus-col { max-width: 100%; }
      .item-fields { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 540px) {
      .item-fields { grid-template-columns: 1fr; }
    }
  </style>
