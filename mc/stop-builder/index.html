  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --warn: rgba(190, 55, 55, 0.9);
      /* THE SOCIALIZER'S PALETTE. Copied, not approximated: mc/socializer/index.html
         is the reference room and this is a copy of it, so when either one's
         chrome changes, change both. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --bic-red: #c23737;
      --success: #276740;
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      /* THE TWO HALVES ARE TOLD APART BY COLOUR, and the pair was MEASURED
         rather than picked. The Events room set the precedent when its five
         band hues were chosen: contrast against the ground the text sits on,
         and separation in Lab -- because HUE ANGLE ALONE IS THE WRONG METRIC.

           forest #1d5c33   7.98:1 on the panel   dE 65.7 from the ink   dE 87.1 from the red pen
           violet #6b3fa0   7.37:1 on the panel   dE 32.8 from the ink   dE 80.5 from the red pen
           between them: dE 94.4

         WHY NOT THE FURTHEST-APART PAIR. indigo/burnt measured dE 99.8 and both
         halves were disqualified by what they sat NEXT to: indigo is only 26.6
         from this room's own ink, so it would read as ordinary text, and burnt
         is 32.7 from the red pen, so it would read as an error. Distance from
         each other is necessary and is not sufficient.

         WHICH WAY ROUND: green is the WAYPOINT, which is what green means on every
         map anybody has ever read; violet is the thing you DO there, and it is
         the one hue in this palette that carries no other meaning already. */
      --wp-ink: #1d5c33;
      --wp-rgb: 29, 92, 51;
      --ch-ink: #6b3fa0;
      --ch-rgb: 107, 63, 160;
    }

    body {
      margin: 0;
      background: var(--paper-base);
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
    }

    .app { width: min(100%, var(--mc-shell-width, 1400px)); margin: 0 auto; padding: 0 18px 60px; }

    /* ---- bars ------------------------------------------------------------ */
    .bar-row { display: flex; gap: 10px; align-items: stretch; margin: 10px 0; flex-wrap: wrap; }

    .command-bar {
      margin: 0; border: 1px solid var(--cut-panel-line); border-radius: 8px;
      background: var(--cut-panel-bg); padding: 2px 9px 8px;
    }
    .command-bar > legend {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      padding: 0 6px; margin-left: 2px;
    }
    .command-bar-inner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* FIND TAKES THE SLACK, ADD DOES NOT. One flexible bar per row, or the free
       space splits between them and neither end stays pinned. */
    .command-bar--find { flex: 1 1 auto; min-width: 0; }
    .command-bar--check { flex: 0 0 auto; }
    /* A WIDTH FLOOR, so the face does not change the bar's shape as it swings
       between `Check`, `Check (137)` and `Show all`. Declared AFTER
       `.command-bar .btn`, which sets `min-width: 0` at the same weight and
       would otherwise win on source order. */
    .command-bar--check .btn { min-width: 11ch; }
    .command-bar--find input[type="search"] { flex: 1 1 220px; min-width: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 0 12px;
      border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff; color: var(--ink);
      font: 600 0.78rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: rgba(var(--bic-blue-rgb), 0.07); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #24396a; }
    .btn.warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.5); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    /* [hidden] HAS TO BE RE-ASSERTED over .btn's author display, or setting
       .hidden silently does nothing. This project has hit that rule a dozen
       times; it is cheaper to write the line than to find it again. */
    .btn[hidden] { display: none !important; }

    input[type="text"], input[type="search"], input[type="number"], textarea, select {
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.86rem;
      color: var(--ink); background: #fff;
      border: 1px solid var(--control-line); border-radius: 7px;
      padding: 7px 9px; min-height: 34px;
    }
    textarea { resize: vertical; line-height: 1.4; }

    /* ---- panels ---------------------------------------------------------- */
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
      box-shadow: 0 1px 4px var(--paper-shadow); margin: 0 0 14px; overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; background: var(--cut-panel-bg);
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      font: 600 0.74rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .panel-count { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .panel-head .spacer { margin-left: auto; }

    /* THE LIST SCROLLS INSIDE ITS OWN PANEL rather than growing the document,
       so the head stays on screen over 500-odd rows. */
    .panel-body { max-height: 70vh; overflow-y: auto; }

    /* ---- a waypoint row -------------------------------------------------- */
    .ch {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      padding: 7px 12px; border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.09);
      cursor: pointer;
    }
    .ch:last-child { border-bottom: 0; }
    .ch:hover { background: var(--panel-soft); }
    .dlg-panel--wide { width: min(920px, 100%); }
    .ai-howto { margin: 0 0 10px; font-size: 0.86rem; line-height: 1.45; color: var(--muted); }
    .ai-options, .ai-doors {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
      padding: 6px 10px 9px; border: 1px solid var(--line); border-radius: 8px;
    }
    .ai-doors { margin: 0; }
    .ai-options-label {
      padding: 0 6px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    .ai-options input[type="text"] {
      flex: 1 1 260px; min-width: 0; min-height: 32px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
    }
    .ai-sheet {
      width: 100%; min-height: 330px; resize: vertical;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
      background: repeating-linear-gradient(
        to bottom, #fff, #fff 21px, rgba(var(--bic-blue-rgb), 0.09) 21px, rgba(var(--bic-blue-rgb), 0.09) 22px);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; line-height: 22px;
      white-space: pre; overflow: auto;
    }
    .batch-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 6px 12px; border-bottom: 1px solid var(--line);
    }
    .batch-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .batch-all, .batch-count {
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    /* SELECT ALL AND THE COUNT ARE TOLD APART BY INK AND A HAIRLINE. Side by
       side in one weight they read as one phrase: "SELECT ALL NONE SELECTED". */
    .batch-all { color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .batch-count { color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); }
    .batch-all input, .ch-pick {
      width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer;
    }
    .batch-row input[type="text"] {
      width: 13ch; min-height: 30px; padding: 3px 7px;
      border: 1px solid var(--line); border-radius: 6px;
      background: #fff; color: var(--ink); font-size: 0.78rem;
    }
    /* `aria-disabled`, NEVER `disabled`: a disabled button dispatches no click
       at all, so on a touch screen the reason it is off is unreachable. */
    .batch-row .btn[aria-disabled="true"] { opacity: 0.45; cursor: help; }
    .batch-row .bar-sep { width: 1px; align-self: stretch; background: var(--line); }
    .btn.warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.45); }

    .ch-name { font-weight: 700; font-size: 0.95rem; }
    .ch-name a { color: inherit; text-decoration: none; }
    .ch-name a:hover { text-decoration: underline dotted; }
    .ch-where { color: var(--muted); font-size: 0.82rem; }
    .ch-tags { margin-left: auto; display: flex; gap: 5px; flex: 0 0 auto; }
    .ch-tag {
      font: 600 0.6rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 6px; border-radius: 999px;
      border: 1px solid var(--control-line); color: var(--muted);
    }
    /* MISSING IS THE ONLY TAG WITH A COLOUR. A row that is short of something
       is the one you act on; everything else is furniture. */
    .ch-tag--missing { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.45); }

    /* THE ROW ITSELF IS THE FLAG, as in the Events room: a red left edge and
       the reason written underneath, so nothing has to be opened to find out
       what is wrong. */
    .ch.is-review {
      border-color: rgba(194, 55, 55, 0.55);
      box-shadow: inset 3px 0 0 var(--bic-red);
      background: rgba(194, 55, 55, 0.035);
    }
    .ch-note {
      flex: 1 0 100%;
      margin: 2px 0 0;
      color: var(--bic-red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }
    .ch-empty { padding: 22px 14px; color: var(--muted); font-size: 0.9rem; }

    /* ---- map ------------------------------------------------------------- */
    #map { height: 340px; width: 100%; }

    /* ---- the editor ------------------------------------------------------ */
    .dlg {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
      background: rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg.is-open { display: flex; }
    .dlg-panel {
      width: min(680px, 100%); background: #fff;
      border: 1px solid var(--cut-panel-line); border-radius: 12px;
      box-shadow: 0 10px 40px rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--cut-panel-bg);
      border-radius: 12px 12px 0 0;
    }
    .dlg-title { font: 700 0.9rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .dlg-sub { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .dlg-body { padding: 14px 16px; display: grid; gap: 10px; grid-template-columns: 1fr; }
    .dlg-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    /* DESTRUCTIVE HARD LEFT, PRIMARY HARD RIGHT, and the gap between them is
       the point: Delete is the only irreversible control on this form. */
    .dlg-foot .spacer { margin-left: auto; }

    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field--wide { grid-column: 1 / -1; }
    .field > span {
      font: 600 0.64rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .field input, .field textarea { width: 100%; }
    .field-read {
      font: 500 0.78rem/1.4 'IBM Plex Mono', monospace; color: var(--muted);
      padding: 7px 0;
    }
    .dlg-msg { padding: 0 16px 12px; color: var(--bic-red); font-size: 0.82rem; }
    .dlg-msg:empty { display: none; }

    @media (max-width: 760px) {
      .command-bar { flex: 1 1 100%; }
    }
  

    /* ---- what a challenge row shows -------------------------------------- */
    .ch { align-items: flex-start; }
    .ch-line { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
    .ch-prompt {
      flex: 1 0 100%; margin: 3px 0 0; color: var(--muted);
      font-size: 0.86rem; line-height: 1.45;
    }
    /* A VARIABLE IS DRAWN AS A VARIABLE, in the prompt and in the preview, so a
       writer can see at a glance which words the game fills in. */
    .var {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.86em;
      padding: 0 3px; border-radius: 3px;
      background: rgba(var(--bic-blue-rgb), 0.1); color: var(--bic-blue);
    }
    .var.is-bad { background: rgba(190, 55, 55, 0.12); color: var(--bic-red); }

    /* THE KIND AND THE SCOPE ARE THE TWO FACTS YOU SCAN FOR, so they are chips
       rather than words in a sentence. Scope carries the outline because it is
       the one that decides whether a challenge can be reused; kind does not. */
    .ch-kind {
      font: 600 0.58rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
      white-space: nowrap;
    }

    /* ---- the editor ------------------------------------------------------ */
    .preview {
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--panel-soft); padding: 10px 12px;
      font-size: 0.9rem; line-height: 1.5; min-height: 3.2em;
    }
    .preview-empty { color: var(--muted); font-style: italic; }
    .preview-answer {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .preview-answer-label {
      font: 700 0.58rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted);
    }
    .varbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .varbar button {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem;
      padding: 3px 7px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--control-line); background: #fff; color: var(--bic-blue);
    }
    .varbar button:hover { background: var(--cut-panel-bg); }
</style>  <link rel="stylesheet" href="/mc/js/admin-shell.css">
  <style>
    /* ---- the three pickers ------------------------------------------------
       ONE LINE, THREE COMBOS, because a stop is one thought: this waypoint, this
       thing to do, in this city. Three stacked bars would say they were three
       decisions. Same arrangement the Game Builder's ANCHOR box settled on. */
    .stop-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .stop-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 240px; min-width: 0; }
    .stop-field > span {
      font: 700 0.64rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    /* `min-width: 0` on the FIELD as well as the box, or a long value inside a
       flex item refuses to shrink and pushes the row wider than the bar. */
    .stop-field input {
      min-width: 0; width: 100%; height: 34px; padding: 0 8px;
      border: 1px solid var(--control-line); border-radius: 6px;
      background: #fff; color: var(--ink); font: inherit; font-size: 0.86rem;
    }
    .stop-field input[data-invalid="true"] { border-color: var(--bic-red); }
    /* ---- THE LABEL IS THE DOOR --------------------------------------------
       The word WAYPOINT opens the Waypoint Library and CHALLENGE opens the
       Challenge Bank. It was a `<label for>` with a small `new` beside it, which
       is two things where one will do: the label already names the room, and a
       second word on the line was the only lowercase thing on a row of
       uppercase labels.
         AN ANCHOR, NOT A `<label for>`, AND IT CANNOT BE BOTH. A label's click
       focuses its input and a link's navigates, so one element doing both is a
       control that does two things at once. **The input carries `aria-label`
       instead, or it has no accessible name at all** -- the same trade the Game
       Builder's three legend doors already make.
         NOT NESTED IN A LABEL EITHER, which is the nesting browsers disagree
       about; the span is a plain span.
         A NEW TAB, because the room is a glance and a half-filled form must not
       be lost to one. That is what the `new` links did and the reason survives
       them.
         IT READS AS A LABEL FIRST: it inherits the span's own size, weight,
       letter-spacing and case, so at rest it looks exactly like the label it
       replaced. **The hue arrives on hover only**, and it is the half's own --
       green for a waypoint, violet for a challenge -- which is the same hue the
       kicker on a row and the popup's side already carry, so the door says
       which side it opens without being read. */
    .stop-door {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted currentColor;
    }
    .stop-door:hover, .stop-door:focus-visible {
      color: var(--half-ink, var(--bic-blue));
      border-bottom-style: solid;
    }
    /* The two fields take the hue of the half they open, so the door, the
       kicker on a row and the popup's side all agree. */
    /* AND / OR IS THE ONE CHOICE ON THE DIALOG BESIDES THE TAGS, so it reads as
       a control rather than as two words: both options outlined, the chosen one
       filled. It wore the label's own type when it was tacked onto a field label
       in the Add bar -- correct there, and unreadable here, where it sits alone
       on a row with nothing around it to read as part of. */
    .tag-mode { display: inline-flex; gap: 0; }
    .tag-mode label { position: relative; cursor: pointer; }
    .tag-mode input {
      position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer;
    }
    /* THEY TOUCH, with only the outer corners rounded, so the two read as one
       control with two positions rather than as two loose chips. */
    .tag-mode span {
      display: block; padding: 3px 10px;
      font: 600 0.72rem/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.04em;
      border: 1px solid var(--control-line); color: var(--muted);
      background: #fff;
    }
    .tag-mode label:first-child span { border-radius: 5px 0 0 5px; }
    .tag-mode label:last-child span { border-radius: 0 5px 5px 0; margin-left: -1px; }
    .tag-mode input:checked + span {
      background: var(--ink); border-color: var(--ink); color: #fff;
    }
    /* THE RING GOES ON THE SPAN, or the control is unusable by keyboard: the
       input it belongs to is invisible. */
    .tag-mode input:focus-visible + span { outline: 2px solid var(--bic-blue); outline-offset: 1px; }
    .stop-field--wp { --half-ink: var(--wp-ink); }
    .stop-field--ch { --half-ink: var(--ch-ink); }

    /* ---- a stop is TWO EQUAL HALVES --------------------------------------
       THE TWO BLOCKS ARE `1fr 1fr`, NOT `auto`, which is the whole ask: a stop
       is a waypoint AND a challenge, and a grid sized to content would make the
       one with more words look like the point of the row. Equal columns say
       they are two of the same kind of thing.
       THE CITY LOST ITS OWN COLUMN ON 2026-09-03 and is the fourth line of the
       waypoint, because that is whose fact it is: a waypoint is in exactly one
       place, and `stops.city` was a second copy of it that could disagree --
       and did, on one of six rows. A leading column here would be that copy
       drawn back on. */
    .stop {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      align-items: start;
      gap: 8px 16px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .stop:hover { background: var(--panel-soft); }
    .stop:focus-visible { outline: 2px solid var(--bic-blue); outline-offset: -2px; }
    /* THE DELETE IS THE LAST COLUMN, so neither half carries a control the
       other does not. */

    /* THE KICKER CARRIES THE COLOUR AND THE EDGE CONFIRMS IT, which is the
       lesson the Events room's bands recorded: at the alpha a row can carry,
       two washes are within a few channel values of each other, so THE FILL IS
       A HINT AND THE LABEL IS THE SIGNAL. */
    .stop-half {
      min-width: 0;
      padding-left: 9px;
      border-left: 3px solid var(--half-ink, var(--line));
    }
    .stop-half--wp { --half-ink: var(--wp-ink); --half-rgb: var(--wp-rgb); }
    .stop-half--ch { --half-ink: var(--ch-ink); --half-rgb: var(--ch-rgb); }
    .stop-kicker {
      font: 700 0.58rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--half-ink, var(--muted));
      display: block; margin-bottom: 3px;
    }
    .stop-name { font-weight: 700; overflow-wrap: anywhere; }
    .stop-sub {
      font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere;
      display: block; margin-top: 2px;
    }
    /* RANDOM IS DRAWN AS A WORD, NEVER AS AN EMPTY BLOCK. A null challenge means
       random, and a blank half would let it pass for a row somebody had not
       finished.
       IT TAKES THE CHALLENGE HALF'S OWN HUE rather than the room's accent: with
       the two halves coloured, an accent here would be a THIRD colour in a row
       that has just been given two, and a reader would have to learn what it
       meant. In the half's own hue it reads as that half speaking up. */
    /* THE CITY IS THE WAYPOINT'S FOURTH LINE, and it keeps the voice it had as
       a column of its own -- mono, uppercase, muted -- so it still reads as a
       key rather than as a second address. Under the address, because the
       address is the more specific of the two and this is what it is in.
       THE CHALLENGE HALF HAS NO SUCH LINE, and that is the point: a challenge
       is not anywhere. `half()` draws it only when it is passed one. */
    .stop-where {
      font: 700 0.66rem/1.35 'IBM Plex Mono', monospace;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
      display: block; margin-top: 3px; overflow-wrap: anywhere;
    }
    .stop-name.is-random { color: var(--ch-ink); font-style: italic; }
    .stop-empty { padding: 18px 12px; color: var(--muted); }

    @media (max-width: 860px) {
      .stop { grid-template-columns: 1fr; }
    }

    /* ---- the popup --------------------------------------------------------
       WAYPOINT LEFT, CHALLENGE RIGHT, and equal, for the same reason the row is
       equal. The dialog is the room's own chrome from admin-shell.css; only the
       split and the panorama are local. */
    .sv-backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(16, 22, 38, 0.55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .sv-backdrop[hidden] { display: none; }
    .sv-panel {
      background: #fff; border: 1px solid var(--cut-panel-line); border-radius: 10px;
      width: min(1080px, 100%); max-height: min(760px, 92vh);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sv-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 10px 14px; background: var(--cut-panel-bg);
      border-bottom: 1px solid var(--cut-panel-line);
    }
    .sv-panel--tags { width: min(560px, 100%); }
    /* THE TWO COMBOS SHARE A LINE and wrap together on a phone, which is the
       same arrangement the ADD bar keeps. `min-width: 0` on each, or a long
       waypoint label refuses to shrink and pushes the row past the panel. */
    .sv-edit {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    .sv-edit .stop-field { flex: 1 1 240px; min-width: 0; }
    .sv-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    .sv-spacer { margin-left: auto; }
    .sv-saved { font: 500 0.7rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    /* THE FIELD MAY NOT KEEP THE ADD BAR'S FLEX BASIS. `.stop-field` is
       `flex: 1 1 240px`, written for a ROW where 240px is a width floor; this
       body is a COLUMN, so the basis is a HEIGHT and a 34px input opened a
       240px box -- 410px of panel for three controls, most of it a hole.
       Same fault the Game Builder hit when `flex: 0 1 44rem` in a column set
       its tagline 704px tall. */
    .tag-body .stop-field { flex: 0 0 auto; }
    .tag-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    /* SCROLLS RATHER THAN GROWING THE PANEL. 25 tags today and the bank grows;
       a dialog that gets taller with the catalogue is one that eventually will
       not fit. */
    .tag-picks {
      display: flex; flex-wrap: wrap; gap: 6px;
      max-height: 220px; overflow-y: auto;
    }
    .tag-pick {
      display: inline-flex; align-items: baseline; gap: 5px;
      padding: 4px 9px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--control-line); background: #fff;
      font: 600 0.74rem/1.2 'IBM Plex Mono', monospace; color: var(--ink);
    }
    .tag-pick .n { font-weight: 500; font-size: 0.66rem; color: var(--muted); }
    .tag-pick:hover { border-color: var(--ink); }
    /* CHOSEN IS FILLED, the same statement the AND / OR pair makes, so the two
       controls on this dialog say `on` the same way. */
    .tag-pick[aria-pressed="true"] {
      background: var(--ink); border-color: var(--ink); color: #fff;
    }
    .tag-pick[aria-pressed="true"] .n { color: rgba(255, 255, 255, 0.72); }
    .tag-pick:focus-visible { outline: 2px solid var(--bic-blue); outline-offset: 1px; }
    .tag-none { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .tag-mode-row { display: flex; align-items: center; gap: 10px; }
    .tag-mode-say { font-size: 0.78rem; color: var(--muted); }
    .tag-foot { display: flex; justify-content: flex-end; }
    .sv-title { font-weight: 700; }
    .sv-city { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .sv-close { margin-left: auto; }
    .sv-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      min-height: 0; overflow: auto;
    }
    /* THE POPUP WEARS THE SAME TWO HUES AS THE ROW, or opening a stop would
       mean learning the sides again. The top rule is what carries it, since a
       full wash behind a panorama would tint the photograph. */
    .sv-side {
      padding: 14px; min-width: 0;
      border-top: 3px solid var(--half-ink, var(--line));
    }
    .sv-side + .sv-side { border-left: 1px solid var(--line); }
    #svWaypoint { --half-ink: var(--wp-ink); --half-rgb: var(--wp-rgb); }
    #svChallenge { --half-ink: var(--ch-ink); --half-rgb: var(--ch-rgb); }
    .sv-label { color: var(--half-ink, var(--muted)); }
    /* THE PANORAMA IS A 4:3 BOX WITH ITS OWN GROUND, so a frame that is slow or
       refuses is a grey rectangle rather than a collapsed nothing. */
    .sv-pano {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      background: #e8ecf3; border: 1px solid var(--line); border-radius: 8px;
      overflow: hidden; margin-bottom: 10px;
    }
    .sv-pano iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .sv-nopano {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 16px;
      font-size: 0.82rem; color: var(--muted);
    }
    .sv-field { margin-bottom: 9px; }
    /* NO `color` HERE. The rule above sets it from the side's own hue, and this
       one is declared LATER at the same weight -- a colour here would win on
       source order and quietly undo the whole thing. Same tie the Tape Room's
       playing-case rule had to settle. */
    .sv-label {
      font: 700 0.58rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase;
      display: block; margin-bottom: 2px;
    }
    .sv-value { overflow-wrap: anywhere; }
    .sv-value.is-empty { color: var(--muted); font-style: italic; }

    /* ---- PLAYING THE CHALLENGE ------------------------------------------
       The right half is a rehearsal, so it is laid out as a question and an
       answer control rather than as a list of columns. */
    .sv-playhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .sv-playname { font-weight: 800; color: var(--ch-ink); }
    .sv-kind {
      font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ch-ink); border: 1px solid rgba(var(--ch-rgb), .35);
      border-radius: 999px; padding: 1px 7px;
    }
    .sv-prompt { font-size: 1.02rem; line-height: 1.45; margin-bottom: 14px; }
    /* A FILLED VARIABLE IS MARKED, so it is obvious which words the row wrote
       and which the stop supplied. An UNFILLED one is the red pen: that is
       exactly what a team would see, braces and all. */
    .sv-var { background: rgba(var(--ch-rgb), .10); border-radius: 3px; padding: 0 3px; }
    .sv-var.is-unknown { background: rgba(160, 63, 45, .12); color: #a03f2d; }

    .sv-choices { display: grid; gap: 8px; margin-bottom: 12px; }
    .sv-choice {
      font: inherit; text-align: left; padding: 9px 12px; cursor: pointer;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
      color: var(--ink);
    }
    .sv-choice:hover:not(:disabled) { border-color: var(--ch-ink); }
    .sv-choice:disabled { cursor: default; }
    /* THE RIGHT ONE IS ALWAYS MARKED, whichever was pressed, or a wrong answer
       tells you only that you were wrong. */
    .sv-choice.is-right { border-color: #276740; background: rgba(39, 103, 64, .10); font-weight: 700; }
    .sv-choice.is-wrong { border-color: #a03f2d; background: rgba(160, 63, 45, .10); }

    .sv-typed { display: flex; gap: 8px; margin-bottom: 12px; }
    .sv-answerbox {
      font: inherit; flex: 1 1 auto; min-width: 0; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .sv-verdict { font-weight: 800; margin: 4px 0 10px; }
    .sv-verdict.is-right { color: #276740; }
    .sv-verdict.is-wrong { color: #a03f2d; }
    .sv-verdict.is-done { color: var(--ch-ink); }
    /* SAID EVERY TIME, because a rehearsal that looks like play is one somebody
       will assume was recorded. */
    .sv-playfoot {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
      font-size: .72rem; color: var(--muted);
    }
    .sv-prompt { white-space: pre-wrap; }
    @media (max-width: 820px) {
      .sv-body { grid-template-columns: 1fr; }
      .sv-side + .sv-side { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>

    <div class="room-head">
      <div class="room-titlecol">
        <!-- THE TITLE IS THE ROOM NAME, and the count moved into the blurb --
             the third room to make that move, after the Waypoint Library and
             the Challenge Bank. The count-in-the-title convention leads with
             the room OWN NOUN, and it only works while the name IS that noun:
             `41 STOPS` reads and `41 STOPS BUILDER` does not. -->
        <h1 class="room-title" id="roomTitle">STOPS BUILDER</h1>
        <!-- IT SHIPS ITS OWN `?`, or the wrong answer is on screen for the
             first second whatever the painter does afterwards. It is never a
             `0`: everything loads before the first render, so a zero on the way
             would be WRONG rather than not yet known. -->
        <p class="room-blurb"><span id="blurbCount">?</span> Stops. Waypoint + Challenge = Stop.</p>
        <span class="status room-scribble" id="pageStatus" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="bar-row">
      <fieldset class="command-bar command-bar--find" style="flex: 1 1 100%;">
        <legend>Add a stop</legend>
        <div class="command-bar-inner stop-form">
          <div class="stop-field stop-field--wp">
            <span><a class="stop-door" href="/mc/waypoints/" target="_blank" rel="noopener noreferrer"
                     title="Open the Waypoint Library in a new tab. This form keeps what you have typed.">Waypoint</a></span>
            <input id="wpInput" list="wpList" autocomplete="off"
                   aria-label="Waypoint"
                   placeholder="Choose a Waypoint"
                   title="Every waypoint we hold. Each one carries its own city.">
          </div>
          <div class="stop-field stop-field--ch">
            <span><a class="stop-door" href="/mc/challenges/" target="_blank" rel="noopener noreferrer"
                     title="Open the Challenge Bank in a new tab. This form keeps what you have typed.">Challenge</a></span>
            <input id="chalInput" list="chalList" autocomplete="off"
                   aria-label="Challenge"
                   placeholder="Choose a Challenge"
                   title="Pick one, or RANDOM to draw at play time. Leaving it empty is RANDOM.">
          </div>
          <button class="btn primary" id="addBtn" type="button">Add stop</button>
        </div>
      </fieldset>

      <fieldset class="command-bar command-bar--find">
        <legend>Search</legend>
        <div class="command-bar-inner">
          <input type="search" id="q" placeholder="Any word on the waypoint or the challenge..." autocomplete="off">
          <button class="btn" id="clearBtn" type="button" aria-disabled="true">Clear</button>
        </div>
      </fieldset>
    </div>

    <datalist id="wpList"></datalist>
    <datalist id="chalList"></datalist>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Stops</span>
        <span class="panel-count" id="listCount"></span>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <!-- THE TAG FILTER, ASKED WHEN A RANDOM CHALLENGE IS CHOSEN.
       It was a third field in the Add bar, which put a control that applies to
       one of two answers permanently beside both of them: the bar read as three
       decisions when a stop is two. Asked for as a popup, and that is the right
       shape -- the tags are a refinement OF the challenge choice, so they are
       asked at the moment that choice is made and the answer goes back into the
       challenge box itself.
         SO THE BAR IS TWO FIELDS AGAIN and the box says what it holds:
       `RANDOM`, or `RANDOM tagged sports and chicago`. -->
  <div class="sv-backdrop" id="tagBackdrop" hidden>
    <section class="sv-panel sv-panel--tags" role="dialog" aria-modal="true" aria-labelledby="tagTitle">
      <div class="sv-head">
        <span class="sv-title" id="tagTitle">Which challenges may this stop pick from?</span>
        <span class="sv-city" id="tagCount"></span>
        <button class="btn small sv-close" id="tagCancel" type="button">Cancel</button>
      </div>
      <div class="tag-body">
        <!-- EVERY TAG IN USE, EACH A TOGGLE. It was one text box bound to a
             datalist, and **A DATALIST PICK REPLACES THE WHOLE VALUE** -- so
             choosing a second tag wiped the first and the only way to more than
             one was typing the comma yourself. Choosing is the gesture the
             control is for, so choosing is what it does.
               BUILT FROM THE ROWS, so it cannot offer a tag no challenge
             carries, and each says how many are behind it. -->
        <div class="tag-picks" id="tagPicks"></div>
        <p class="tag-none" id="tagNone" hidden>No challenge carries a tag yet.</p>
        <!-- AND / OR IS A RADIO GROUP. Two buttons with `aria-pressed` would
             need a hand-rolled exclusion set kept in step with the paint -- a
             control painted in one place and read in another, which this
             project has been caught by. Here the browser keeps the rule.
               DRAWN ONLY AT TWO TAGS OR MORE: with one tag AND and OR pick the
             same set, so the choice would be noise. -->
        <div class="tag-mode-row" id="tagMode" hidden>
          <span class="tag-mode">
            <label><input type="radio" name="tagsMatch" value="all" checked><span>AND</span></label>
            <label><input type="radio" name="tagsMatch" value="any"><span>OR</span></label>
          </span>
          <span class="tag-mode-say" id="tagModeSay"></span>
        </div>
        <div class="tag-foot">
          <button class="btn primary" id="tagUse" type="button">Use these</button>
        </div>
      </div>
    </section>
  </div>

  <!-- THE STOP, OPENED. Waypoint left, challenge right, equal halves. -->
  <div class="sv-backdrop" id="svBackdrop" hidden>
    <section class="sv-panel" role="dialog" aria-modal="true" aria-labelledby="svTitle">
      <div class="sv-head">
        <span class="sv-title" id="svTitle"></span>
        <span class="sv-city" id="svCity"></span>
        <button class="btn small sv-close" id="svClose" type="button">Close</button>
      </div>
      <div class="sv-body">
        <div class="sv-side" id="svWaypoint"></div>
        <div class="sv-side" id="svChallenge"></div>
      </div>
      <!-- BOTH HALVES ARE EDITABLE HERE. A stop is a waypoint and a challenge,
           and until now the only way to change either was to delete the stop
           and add it again, which threw away the row.
             THE LABELS ARE PLAIN, deliberately, where the ADD bar's are doors
           into the two rooms: this is a modal, and a door out of it is a way to
           lose what you have typed. The bar is two steps away. -->
      <div class="sv-edit">
        <div class="stop-field">
          <span>Waypoint</span>
          <input id="svWpInput" list="wpList" autocomplete="off" aria-label="Waypoint"
                 placeholder="Choose a Waypoint"
                 title="Every waypoint we hold. Each one carries its own city.">
        </div>
        <div class="stop-field">
          <span>Challenge</span>
          <input id="svChalInput" list="chalList" autocomplete="off" aria-label="Challenge"
                 placeholder="Choose a Challenge"
                 title="Every challenge we hold. Leaving it on RANDOM stores no challenge and picks one at play time.">
        </div>
      </div>
      <!-- DESTRUCTIVE HARD LEFT, PRIMARY HARD RIGHT, and the gap between them
           is the point: Delete is the only irreversible control in here. -->
      <div class="sv-foot">
        <button class="btn small warn" id="svDelete" type="button">Delete</button>
        <span class="sv-spacer"></span>
        <span class="sv-saved" id="svSaved"></span>
        <button class="btn small primary" id="svSave" type="button">Save</button>
      </div>
    </section>
  </div>

  <script src="/mc/js/admin-site-nav.js"></script>
  <script src="/mc/js/admin-auth.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };
    const TABLE = 'stops';

    // RANDOM IS THE FIRST OPTION AND IT IS A REAL CHOICE, not a blank. It is
    // stored as a NULL challenge_id, which is unambiguous ONLY because this
    // picker has no empty option: leaving the box alone means Random, and there
    // is no way to say "not decided yet". Nothing generates the pick yet; that
    // is the code still to be written, and this column is its shape.
    const RANDOM_LABEL = 'RANDOM';

    const state = { rows: [], waypoints: [], challenges: [],
                    q: '', authed: false, loaded: false, open: null, play: null,
                    /* WHAT THE TAG DIALOG LAST SETTLED ON. The challenge box
                       DISPLAYS it and this is what is READ -- parsing the box's
                       prose back into tags would be a second implementation of
                       the composer, free to disagree with it. */
                    pendingTags: { tags: [], mode: 'all' },
                    /* THE POPUP'S OWN SETTLED FILTER, kept apart from the bar's.
                       One shared slot would carry a filter set in the popup, and
                       cancelled, into the next thing added from the bar. */
                    editTags: { tags: [], mode: 'all' },
                    /* WHICH BOX THE TAG DIALOG IS SERVING, `add` or `edit`. The
                       dialog is modal so only one can be open, but the SETTLED
                       value has to go back where it came from. */
                    tagHost: 'add',
                    /* WHAT THE OPEN DIALOG IS HOLDING. Separate from
                       `pendingTags` so Cancel really cancels: with the chips
                       writing straight to the settled value there would be
                       nothing to go back to. */
                    tagDraft: { tags: [], mode: 'all' },
                    /* WHAT THIS REHEARSAL HAS ALREADY DRAWN. Reset on every
                       open, because it models one play of one stop. */
                    picked: [] };

    function el(id) { return document.getElementById(id); }
    function clean(v) { return String(v == null ? '' : v).trim(); }

    function rpcUrl(fn) {
      return SUPABASE_CONFIG.url + '/rest/v1/rpc/' + encodeURIComponent(fn);
    }

    function restUrl(table, params) {
      const u = new URL(SUPABASE_CONFIG.url + '/rest/v1/' + encodeURIComponent(table));
      Object.keys(params || {}).forEach((k) => u.searchParams.set(k, params[k]));
      return u.toString();
    }
    function authHeaders(extra) {
      const s = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + ((s && s.access_token) || SUPABASE_CONFIG.publishableKey)
      }, extra || {});
    }

    // TRANSLATE THE CODES THIS TABLE CAN ACTUALLY PRODUCE. A raw 23505 is a
    // statement about our schema and tells nobody what to do about it.
    async function readError(res, verb) {
      let text = '';
      try { text = await res.text(); } catch (e) { /* body already consumed */ }
      /* ONE WAYPOINT IS ONE STOP. `stops_one_per_waypoint` replaced
         `(city, waypoint_id)` on 2026090302 -- the same rule with the redundant
         half removed, since a waypoint is in exactly one place. */
      /* THE MESSAGE FITS THE ACT. It said "rather than adding a second", which
         is right for the ADD bar and wrong on an edit, where nothing is being
         added -- and a finding that does not fit what you just did is the fault
         this project keeps removing. */
      if (/stops_one_per_waypoint|stops_pkey|duplicate key/.test(text)) {
        return verb === 'move'
          ? 'Another stop is already at that waypoint. One waypoint is one stop, '
            + 'so edit that one instead.'
          : 'That waypoint is already a stop. One waypoint is one stop, so edit '
            + 'the one that is there rather than adding a second.';
      }
      if (/stops_fixed_or_filtered/.test(text)) {
        return 'A stop either names a challenge or filters by tag, never both.';
      }
      if (/stops_challenge_tags_not_blank/.test(text)) return 'One of those tags is empty.';
      if (/stops_waypoint_id_fkey/.test(text)) return 'That waypoint is not on file any more. Reload and pick again.';
      if (/PGRST205|does not exist/.test(text)) {
        return 'public.stops is not there. Run mc/supabase/migrations/2026083103_stops_rebuilt.sql.';
      }
      /* A DATABASE THAT HAS NOT RUN THE DROP IS NAMED, not handed a raw 23502.
         `city` is NOT NULL there, so every insert from this room is refused
         until the migration is applied -- and the reason is a column this page
         no longer knows exists. */
      if (/\bcity\b/i.test(text)) {
        return 'public.stops still has a city column. Run '
             + 'mc/supabase/migrations/2026090302_a_stop_is_a_waypoint_and_a_challenge.sql.';
      }
      return 'The database refused it (' + res.status + '). ' + text.slice(0, 200);
    }

    function say(message, tone) {
      const box = el('pageStatus');
      if (!box) return;
      box.textContent = message || '';
      box.className = 'status room-scribble' + (tone ? ' ' + tone : '');
    }

    /* ---- reading ---------------------------------------------------------
       EVERY READ PAGES. PostgREST caps a response at 1000 rows and truncates in
       SILENCE; waypoints is already 536 and stops will outgrow it. */
    async function readAll(table, params) {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const res = await fetch(restUrl(table, params), {
          headers: authHeaders({ Range: from + '-' + (from + 999) })
        });
        if (!res.ok) throw new Error(await readError(res));
        const page = await res.json();
        if (!Array.isArray(page) || !page.length) break;
        out.push.apply(out, page);
        if (page.length < 1000) break;
      }
      return out;
    }

    /* THE AUDIENCES READ IS GONE, and it went with the field it filled. This
       room asked `audiences` for a list of towns so the add bar could offer
       one; a stop does not carry a town any more, so that is one fewer table
       this room depends on. The function is kept nowhere -- a reader with no
       caller is what makes somebody re-point it at the wrong thing. */
    async function loadAll() {
      const parts = await Promise.all([
        /* THREE IDS AND NOTHING ELSE, so `select=*` is the whole row.
           ORDERED BY WAYPOINT. It was `city.asc` until 2026090302 dropped the
           column, and an order naming a column that is gone 400s the WHOLE
           request -- the room would have come back empty with nothing saying
           why. Postgres puts NULLs last on an ascending order and the
           client-side sort after an add matches it; two orders that disagree
           would move a row on its own the moment you added one. */
        readAll(TABLE, { select: '*', order: 'waypoint_id.asc' }),
        readAll('waypoints', {
          select: 'wpid,name,city,state,address,zip,description,lat,lon,source_url',
          order: 'name.asc'
        }),
        /* `choices` IS WHAT DECIDES THE ANSWER CONTROL, so the simulation cannot
           work without it: present it draws buttons, absent it draws a box. A
           column the page does not ask for comes back undefined and every
           multiple choice would silently become a text box. */
        readAll('challenges', { select: 'id,name,prompt,answer,type,choices,tags', order: 'name.asc' })
      ]);
      state.rows = parts[0];
      state.waypoints = parts[1];
      state.challenges = parts[2];
      state.loaded = true;
    }

    /* ---- labels ----------------------------------------------------------
       A LABEL CARRIES EVERY WORD SOMEBODY MIGHT TYPE, because a datalist
       matches on the option's value and nothing else. */
    function wpWhere(w) { return [w.city, w.state].filter(Boolean).join(', '); }
    function wpLabel(w) {
      const where = wpWhere(w);
      return where ? w.name + ' - ' + where : String(w.name || '');
    }
    function typeLabel(v) { return clean(v).split('_').join(' '); }
    function chalLabel(c) { return c.name + (c.type ? ' (' + typeLabel(c.type) + ')' : ''); }

    function wpById(id) {
      return state.waypoints.filter(function (w) { return String(w.wpid) === String(id); })[0] || null;
    }
    function chalById(id) {
      return state.challenges.filter(function (c) { return String(c.id) === String(id); })[0] || null;
    }

    function wpFromLabel(text) {
      const v = clean(text).toLowerCase();
      if (!v) return null;
      return state.waypoints.filter(function (w) { return wpLabel(w).toLowerCase() === v; })[0]
          || state.waypoints.filter(function (w) { return String(w.wpid) === v; })[0]
          || null;
    }
    // 'random' is a real answer here and null means "no such challenge", so the
    // caller can tell a deliberate RANDOM from a typo.
    /* ---- TAGS: ONE FILTER FOR A TEAM, A CITY OR A TYPE ------------------
       `challenges.tags` has held these since 2026082902 and already mixes all
       three -- sports, chicago, trivia, photo, JFK -- which is why a stop needs
       no separate idea of kind.

       BUILT FROM THE ROWS, so the picker can only offer a tag with challenges
       behind it: an empty result is not a state this control can produce.
       GROUPED CASE-INSENSITIVELY, because two of the tags on file are
       capitalised (`History`, `JFK`) and `history` and `History` are one tag. */
    function tagsInUse() {
      const by = {};
      state.challenges.forEach(function (c) {
        (Array.isArray(c.tags) ? c.tags : []).forEach(function (t) {
          const raw = clean(t);
          if (!raw) return;
          const key = raw.toLowerCase();
          if (!by[key]) by[key] = { tag: raw, count: 0, spell: {} };
          by[key].count += 1;
          by[key].spell[raw] = (by[key].spell[raw] || 0) + 1;
        });
      });
      /* WHICH SPELLING TO SHOW WHEN A TAG HAS TWO. `history` and `History` are
         one tag to the resolver, so they are one chip -- and taking whichever
         challenge happened to be read first makes the chip depend on iteration
         order. The most-used spelling wins, and a tie goes to the lowercase
         one, which is the convention 23 of the 25 tags on file already keep.
           THE REAL FIX IS THE DATA, in the Challenge Bank. This only stops the
         display wobbling while both spellings are on file. */
      return Object.keys(by).sort().map(function (k) {
        const e = by[k];
        e.tag = Object.keys(e.spell).sort(function (a, b) {
          if (e.spell[b] !== e.spell[a]) return e.spell[b] - e.spell[a];
          const la = a === a.toLowerCase(), lb = b === b.toLowerCase();
          if (la !== lb) return la ? -1 : 1;
          return a.localeCompare(b);
        })[0];
        return e;
      });
    }

    /* COMMA SEPARATED, TRIMMED, BLANKS DROPPED AND DEDUPED CASE-INSENSITIVELY.
       A trailing comma costs nothing and a tag typed twice is asked for once.
       A BLANK MEMBER IS REFUSED BY `stops_challenge_tags_not_blank`, so
       dropping it here is what stops the database having to. */
    /* `parseTags` LIVED HERE and went with the text box. It turned a comma
       string into tags; there is no comma string any more, and the row's own
       `challenge_tags` is already an array. Do not rebuild it for a control
       that no longer exists. */

    /* EVERY TAG, NOT ANY: more tags is NARROWER, which is what "filter" means
       and what the database's contains-all does. Matched case-insensitively on
       both sides, so neither row is rewritten to make a comparison work. */
    function challengeHasTags(c, tags, mode) {
      if (!tags.length) return true;
      const has = (Array.isArray(c.tags) ? c.tags : []).map(function (t) {
        return clean(t).toLowerCase();
      });
      const test = function (t) { return has.indexOf(t.toLowerCase()) !== -1; };
      return mode === 'any' ? tags.some(test) : tags.every(test);
    }

    /* HOW MANY THE FILTER WOULD ACTUALLY REACH. A count of 0 is a real state --
       most tags are carried by a handful of rows and 39 of the 63 challenges
       carry none at all -- and it leaves a team with no challenge at play time,
       so the room counts rather than waiting for somebody to find out. */
    function tagsMatchMode() {
      const on = document.querySelector('input[name="tagsMatch"]:checked');
      return on && on.value === 'any' ? 'any' : 'all';
    }

    function tagMatchCount(tags, mode) {
      return state.challenges.filter(function (c) {
        if (!tags.length && c.type === 'operations') return false;
        return challengeHasTags(c, tags, mode);
      }).length;
    }

    /* ANY LABEL OPENING WITH `RANDOM` IS RANDOM, because the box now displays
       the filter in words -- `RANDOM tagged sports and chicago`. THE TAGS ARE
       NOT PARSED BACK OUT OF IT: `state.pendingTags` is what is read, so there
       is one composer and no second implementation to disagree with it. */
    function chalFromLabel(text) {
      const v = clean(text).toLowerCase();
      if (!v || v === RANDOM_LABEL.toLowerCase()) return 'random';
      if (v.indexOf(RANDOM_LABEL.toLowerCase() + ' ') === 0) return 'random';
      return state.challenges.filter(function (c) { return chalLabel(c).toLowerCase() === v; })[0] || null;
    }

    /* ---- the pickers ------------------------------------------------------
       EVERY WAYPOINT IS OFFERED. The list narrowed to a chosen city until
       2026090302 and there is no city here to narrow by -- so what is lost is a
       shorter list, and what pays for it is `wpLabel`, which carries the town
       in the option itself: typing a city still reaches its waypoints, because
       a datalist matches on the whole option value rather than on a prefix. */
    /* ---- THE TAG DIALOG ---------------------------------------------------
       ASKED WHEN A RANDOM CHALLENGE IS CHOSEN, and never otherwise. It was a
       third field in the Add bar, permanently beside two others, which made a
       stop read as three decisions when it is two. */
    /* THE CHIPS ARE BUILT ONCE PER OPEN AND NEVER REBUILT BY A PRESS.
       Rebuilding on every toggle DESTROYS THE BUTTON THAT WAS JUST PRESSED --
       focus goes to the body, so a keyboard user cannot choose a second tag,
       and any handle taken before the press is left holding a detached node. */
    function buildTagChips() {
      const host = el('tagPicks');
      if (!host) return;
      const inUse = tagsInUse();
      const none = el('tagNone');
      if (none) none.hidden = inUse.length > 0;
      host.innerHTML = '';
      inUse.forEach(function (t) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag-pick';
        b.setAttribute('aria-pressed', 'false');
        b.dataset.tag = t.tag;
        const w = document.createElement('span');
        w.textContent = t.tag;
        const c = document.createElement('span');
        c.className = 'n';
        c.textContent = t.count;
        b.appendChild(w);
        b.appendChild(c);
        host.appendChild(b);
      });
    }

    function paintTagDialog() {
      const host = el('tagPicks');
      if (!host) return;
      const tags = state.tagDraft.tags;
      const mode = tagsMatchMode();
      // THE PRESSED STATE IS WRITTEN ONTO THE BUTTONS THAT ARE THERE.
      host.querySelectorAll('.tag-pick').forEach(function (b) {
        const on = tags.some(function (x) {
          return x.toLowerCase() === String(b.dataset.tag).toLowerCase();
        });
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      const row = el('tagMode');
      if (row) row.hidden = tags.length < 2;
      const say = el('tagModeSay');
      if (say) {
        say.textContent = mode === 'any'
          ? 'at least one of them' : 'every one of them';
      }
      const n = tagMatchCount(tags, mode);
      const count = el('tagCount');
      if (count) {
        count.textContent = n + (n === 1 ? ' challenge' : ' challenges')
          + (tags.length ? '' : ' -- everything');
      }
      /* THE RED PEN RATHER THAN A REFUSAL. The bank grows, so a filter matching
         nothing today may match tomorrow; what must not happen is filing one
         without seeing it. */
      if (count) {
        if (tags.length && n === 0) count.setAttribute('data-invalid', 'true');
        else count.removeAttribute('data-invalid');
      }
    }

    /* ONE CHIP IS ONE TAG, ADDED OR TAKEN AWAY. Matched case-insensitively,
       because the resolver is: `history` and `History` are one tag, so picking
       one must not leave the other addable. */
    function toggleTag(tag) {
      const key = clean(tag).toLowerCase();
      if (!key) return;
      const kept = state.tagDraft.tags.filter(function (t) {
        return t.toLowerCase() !== key;
      });
      const next = kept.length === state.tagDraft.tags.length
        ? state.tagDraft.tags.concat([clean(tag)])
        : kept;
      /* SORTED, SO THE ORDER THEY WERE PRESSED IN CARRIES NOTHING. The resolver
         does not care -- `all` is contains-all and `any` is overlap, both
         order-independent -- so one filter chosen two ways must read and store
         one way, or two identical stops look different on the list. */
      next.sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
      state.tagDraft.tags = next;
      paintTagDialog();
    }

    /* THE TWO HOSTS, so the dialog reads and writes the right slot and the
       right box. Adding a third is one entry. */
    const TAG_HOSTS = {
      add: { input: 'chalInput', slot: 'pendingTags' },
      edit: { input: 'svChalInput', slot: 'editTags' }
    };
    function tagHost() { return TAG_HOSTS[state.tagHost] || TAG_HOSTS.add; }
    function settledTags() { return state[tagHost().slot]; }

    function openTagDialog(which) {
      const host = el('tagPicks');
      if (!host) return;
      state.tagHost = TAG_HOSTS[which] ? which : 'add';
      // OPENED ON WHAT WAS LAST SETTLED, so reopening to change one tag does not
      // start from nothing. COPIED, never the same array -- editing the settled
      // one would make Cancel a lie.
      state.tagDraft = {
        tags: settledTags().tags.slice(),
        mode: settledTags().mode === 'any' ? 'any' : 'all'
      };
      document.querySelectorAll('input[name="tagsMatch"]').forEach(function (r) {
        r.checked = r.value === state.tagDraft.mode;
      });
      buildTagChips();
      paintTagDialog();
      el('tagBackdrop').hidden = false;
      const first = host.querySelector('.tag-pick');
      if (first) first.focus();
    }

    function closeTagDialog() {
      const back = el('tagBackdrop');
      if (back) back.hidden = true;
    }

    /* THE ANSWER GOES BACK INTO THE CHALLENGE BOX, which is what keeps the bar
       two fields and makes the choice visible without a second control. */
    function useTagDialog() {
      const tags = state.tagDraft.tags.slice();
      const h = tagHost();
      state[h.slot] = { tags: tags, mode: tagsMatchMode() };
      setBoxValue(h.input, randomLabel(tags, state[h.slot].mode));
      closeTagDialog();
      keepNext[h.input] = true;
      el(h.input).focus();
      /* THE PREVIEW FOLLOWS THE FILTER TOO. Writing the box does not fire
         `change`, so without this the right side would go on describing the
         filter from before the dialog -- and the filter is exactly what a
         RANDOM stop's panel is showing. The ADD bar has no preview. */
      if (state.tagHost === 'edit') previewFromBoxes();
    }

    function paintPickers() {
      /* THE WAYPOINTS ARE OFFERED BY CITY, then by name within it. A stop is
         built for a walk in one town, so the useful grouping is the town rather
         than the alphabet across 575 places in 72 of them.
           ONE DATALIST FEEDS BOTH BOXES -- the ADD bar's and the popup's -- so
         this sorts both, and they cannot drift into two orders.
           SORTED ON WHAT THE OPTION SHOWS, through `wpWhere`, which is the same
         `City, ST` the label carries. Ordering a list by something no reader can
         see looks exactly like a broken control.
           A COPY, NEVER `state.waypoints` ITSELF. That array is read by the
         resolver and by the preview, and re-ordering it under them would be a
         side effect of drawing a dropdown.
           A WAYPOINT WITH NO CITY SINKS, in a list grouped by city it has no
         place in, and ties break on the id so the order is stable. */
      const wpBox = el('wpList');
      if (wpBox) {
        wpBox.innerHTML = '';
        state.waypoints.slice().sort(function (a, b) {
          const ca = wpWhere(a), cb = wpWhere(b);
          if (!ca && cb) return 1;
          if (ca && !cb) return -1;
          if (ca !== cb) {
            return ca.localeCompare(cb, undefined, { sensitivity: 'base', numeric: true });
          }
          const na = clean(a.name), nb = clean(b.name);
          if (na !== nb) {
            return na.localeCompare(nb, undefined, { sensitivity: 'base', numeric: true });
          }
          return (Number(a.wpid) || 0) - (Number(b.wpid) || 0);
        }).forEach(function (w) {
          const o = document.createElement('option');
          o.value = wpLabel(w);
          wpBox.appendChild(o);
        });
      }

      const chalBox = el('chalList');
      if (chalBox) {
        chalBox.innerHTML = '';
        // RANDOM FIRST, ALWAYS. It is the default and the first thing offered.
        const rnd = document.createElement('option');
        rnd.value = RANDOM_LABEL;
        rnd.label = 'whatever fits at play time';
        chalBox.appendChild(rnd);
        state.challenges.forEach(function (c) {
          const o = document.createElement('option');
          o.value = chalLabel(c);
          chalBox.appendChild(o);
        });
      }
    }

    /* ---- the list ---------------------------------------------------------
       THE SEARCH READS EVERY FIELD ON BOTH HALVES, and it is DERIVED from the
       rows rather than written out: a column added to either `select` is
       searchable without anybody remembering to add it here. It was four terms
       by hand -- the city, the name, the address and the challenge's name --
       so a description, a zip, a source, a prompt, an answer, a kind and a
       kind were all on screen and none of them was findable.
         AN ARRAY IS FLATTENED, so `choices` is searched option by option; a
       number is read as its own text, which is what makes a wpid or a zip work.
         `wpWhere` AND `RANDOM_LABEL` ARE APPENDED because neither is a column:
       one is the town composed from two fields, the other is the word this room
       draws where a null challenge is. */
    function searchTerms(obj) {
      const out = [];
      if (!obj) return out;
      Object.keys(obj).forEach(function (k) {
        const v = obj[k];
        if (v === null || v === undefined) return;
        if (Array.isArray(v)) { v.forEach(function (x) { if (x != null) out.push(String(x)); }); return; }
        if (typeof v === 'object') return;
        out.push(String(v));
      });
      return out;
    }

    function matches(row) {
      const q = state.q.toLowerCase();
      if (!q) return true;
      const w = wpById(row.waypoint_id);
      const c = row.challenge_id == null ? null : chalById(row.challenge_id);
      const terms = searchTerms(w).concat(searchTerms(c));
      if (w) terms.push(wpWhere(w));
      if (!c) terms.push(RANDOM_LABEL);
      return terms.some(function (v) {
        return v.toLowerCase().indexOf(q) !== -1;
      });
    }

    /* A ROW IS IDENTIFIED BY ITS OWN `stop_id`, in the DOM and in a delete
       alike. It was `(city, waypoint_id)`, which cannot identify a stop whose
       waypoint has been stripped -- two of those were both `[city, null]` and
       were treated as the same row.
         THE KEY IS `stop_id` SINCE 2026090303, so the three columns all say
       what they point at and `maps.stop_id` shares the name of the column it
       references. */
    function rowKey(row) { return String(row.stop_id); }

    /* `where` IS THE FOURTH LINE AND ONLY THE WAYPOINT GETS ONE. A challenge is
       not anywhere, so passing it one would be inventing a fact. */
    /* WHAT A STOP WITH NO NAMED CHALLENGE ASKS FOR, in one place, because the
       row and the popup have to say the same thing. */
    /* THE ONE PLACE A FILTER IS TURNED INTO WORDS, because the challenge box,
       the row and the popup all have to say it the same way. */
    function randomLabel(tags, mode) {
      if (!tags.length) return RANDOM_LABEL;
      return RANDOM_LABEL + ' tagged ' + tags.join(mode === 'any' ? ' or ' : ' and ');
    }

    function randomSpec(row) {
      const tags = Array.isArray(row.challenge_tags) ? row.challenge_tags.filter(clean) : [];
      if (!tags.length) {
        return { name: RANDOM_LABEL, sub: 'whatever fits at play time', tags: [], count: 0 };
      }
      const mode = clean(row.challenge_tags_match) === 'any' ? 'any' : 'all';
      const n = tagMatchCount(tags, mode);
      return {
        name: randomLabel(tags, mode),
        sub: n + (n === 1 ? ' challenge to pick from' : ' challenges to pick from'),
        tags: tags,
        count: n
      };
    }

    function half(kicker, name, sub, isRandom, which, where) {
      const box = document.createElement('div');
      box.className = 'stop-half stop-half--' + which;
      const k = document.createElement('span');
      k.className = 'stop-kicker';
      k.textContent = kicker;
      box.appendChild(k);
      const n = document.createElement('span');
      n.className = 'stop-name' + (isRandom ? ' is-random' : '');
      n.textContent = name;
      box.appendChild(n);
      if (sub) {
        const s = document.createElement('span');
        s.className = 'stop-sub';
        s.textContent = sub;
        box.appendChild(s);
      }
      if (where) {
        const p = document.createElement('span');
        p.className = 'stop-where';
        p.textContent = where;
        box.appendChild(p);
      }
      return box;
    }

    function render() {
      const shown = state.rows.filter(matches);
      /* THE BLURB CARRIES THE TOTAL, and does NOT move with a filter: it is the
         standing measure of the room, and a figure that shrank as you typed
         would read as the filter breaking. The panel below says how much a
         filter has left, which is the one thing the blurb cannot. */
      const blurbCount = el('blurbCount');
      if (blurbCount) blurbCount.textContent = state.loaded ? String(state.rows.length) : '?';
      const count = el('listCount');
      if (count) {
        count.textContent = state.loaded
          ? (shown.length === state.rows.length ? '' : shown.length + ' shown')
          : '';
      }
      const clear = el('clearBtn');
      if (clear) clear.setAttribute('aria-disabled', state.q ? 'false' : 'true');

      const list = el('list');
      if (!list) return;
      list.innerHTML = '';
      if (!shown.length) {
        const p = document.createElement('p');
        p.className = 'stop-empty';
        p.textContent = state.loaded
          ? (state.rows.length ? 'Nothing matches that search.' : 'No stops yet. Add one above.')
          : 'Loading...';
        list.appendChild(p);
        return;
      }

      shown.forEach(function (row) {
        const w = wpById(row.waypoint_id);
        const c = row.challenge_id == null ? null : chalById(row.challenge_id);

        const line = document.createElement('div');
        line.className = 'stop';
        line.dataset.key = rowKey(row);
        // A REAL CONTROL, because the whole row opens something. Focusable and
        // announced, and Enter and Space work; a div with a click handler is
        // reachable by a mouse and by nothing else.
        line.tabIndex = 0;
        line.setAttribute('role', 'button');
        line.title = 'Open this stop';

        /* THE ROW IS THE PAIR AND THE ONE CONTROL. A WAYPOINT WE NO LONGER HOLD
           IS NAMED BY ITS ID rather than drawn blank: a blank reads as a row
           that failed to load.
           THE ADDRESS IS THE THIRD LINE AND THE CITY IS THE FOURTH, and the
           address no longer falls back to the city -- with both drawn, a
           waypoint with no address would have printed its town twice. */
        line.appendChild(half('Waypoint',
          w ? w.name : (row.waypoint_id === null ? 'waypoint deleted'
                                                 : 'waypoint ' + row.waypoint_id),
          w ? clean(w.address) : 'not on file any more', false, 'wp',
          w ? wpWhere(w) : ''));

        /* A FILTERED STOP SAYS WHAT IT ASKS FOR. Drawn as a bare RANDOM, a
           stop narrowed to sports-in-chicago would be indistinguishable from
           one that takes anything. */
        const spec = c ? null : randomSpec(row);
        line.appendChild(half('Challenge',
          c ? c.name : spec.name,
          c ? typeLabel(c.type) : spec.sub,
          !c, 'ch'));

        /* THE ROW HAS NO DELETE. It moved into the popup (2026-09-03), where it
           sits beside the waypoint and the challenge it destroys -- and where
           you have necessarily looked at the stop first. On the row it was one
           click from a list, and it needed `stopPropagation` so removing a stop
           did not open the popup over the row it had just removed. */

        line.addEventListener('click', function () { openStop(row); });
        line.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStop(row); }
        });

        list.appendChild(line);
      });
    }

    /* ---- the popup --------------------------------------------------------
       STREET VIEW WITHOUT AN API KEY. `google.com/maps?layer=c&cbll=...&output=svembed`
       is the keyless panorama embed; the Static Street View and Embed APIs both
       need a billed key, and this project holds none. So the panorama is best
       effort and the address, the description and the source sit under it --
       the half is still worth opening when there is no panorama.
       A WAYPOINT WITH NO COORDINATES SAYS SO rather than drawing a grey box,
       which is 18 of 536 today. */
    function svUrl(w) {
      const lat = Number(w && w.lat), lon = Number(w && w.lon);
      if (w == null || w.lat == null || w.lon == null) return '';
      if (!isFinite(lat) || !isFinite(lon)) return '';
      if (lat === 0 && lon === 0) return '';
      return 'https://www.google.com/maps?layer=c&cbll=' + lat + ',' + lon
           + '&cbp=11,0,0,0,0&output=svembed';
    }

    function field(parent, label, value, prompt) {
      const wrap = document.createElement('div');
      wrap.className = 'sv-field';
      const l = document.createElement('span');
      l.className = 'sv-label';
      l.textContent = label;
      wrap.appendChild(l);
      const v = document.createElement('div');
      v.className = 'sv-value' + (value ? '' : ' is-empty') + (prompt ? ' sv-prompt' : '');
      v.textContent = value || 'none';
      wrap.appendChild(v);
      parent.appendChild(wrap);
      return wrap;
    }

    /* ---- PLAYING A CHALLENGE, NOT READING ONE ---------------------------
       The right half used to list Challenge / Kind / Scope / Prompt / Answer,
       which hands you the answer before you have met the question. A challenge
       that reads fine in a list can be unanswerable standing in a street, and
       the only way to find that out is to meet it the way a team does -- which
       is the whole argument the Trivia room already makes for its own popup.

       THE ANSWER CONTROL FOLLOWS THE ROW, NEVER A SETTING, so the panel cannot
       offer a shape the row does not have. Measured on the live table:
       31 of 38 trivia rows carry `choices` and 7 do not; question rows never
       do; and photo, freeform and most minigames carry NO ANSWER AT ALL, which
       is not a gap to fill but the fact that a person judges them. */
    const VARIABLES = {
      away_team_geo: 'Chicago', away_team_nickname: 'Bears',
      home_team_geo: 'Denver', home_team_nickname: 'Broncos',
      league: 'NFL', sport: 'Football',
      venue: 'Empower Field at Mile High', venue_city: 'Denver, Colorado',
      waypoint: ''
    };
    const VAR_RE = /\{\{\s*([a-z_]+)\s*\}\}/g;

    /* THE STOP KNOWS TWO OF THEM FOR REAL, which is the difference between
       simulating here and previewing in the Challenge Bank: that room has only
       a worked example, and this one is standing at an actual waypoint in an
       actual city. The rest stay the worked example, because a stop knows
       nothing about which clubs are playing. */
    function varsFor(row, w) {
      const v = Object.assign({}, VARIABLES);
      if (w && clean(w.name)) v.waypoint = clean(w.name);
      /* THE CITY COMES OFF THE WAYPOINT. It was `row.city` until 2026090302
         dropped that column, and reading it now would leave `{{venue_city}}`
         on the worked example's Denver in a rehearsal standing in Boston --
         a variable that is filled, plausible and wrong, which is the one
         shape this panel exists to catch. */
      if (w && wpWhere(w)) v.venue_city = wpWhere(w);
      return v;
    }

    /* AN UNKNOWN VARIABLE IS LEFT UNFILLED AND MARKED, exactly as it would be
       at play time. Showing it resolved would hide the fault -- and a mistyped
       token is not an error anywhere else in the system, it simply prints as
       braces in front of a team standing in the street. */
    function promptNode(text, vals) {
      const box = document.createElement('div');
      box.className = 'sv-value sv-prompt';
      const src = clean(text);
      let at = 0;
      src.replace(VAR_RE, (token, key, i) => {
        if (i > at) box.appendChild(document.createTextNode(src.slice(at, i)));
        const filled = Object.prototype.hasOwnProperty.call(vals, key) && vals[key];
        const span = document.createElement('span');
        span.className = filled ? 'sv-var' : 'sv-var is-unknown';
        span.textContent = filled ? vals[key] : token;
        if (!filled) span.title = 'No such variable, so a team would see the braces.';
        box.appendChild(span);
        at = i + token.length;
        return token;
      });
      if (at < src.length) box.appendChild(document.createTextNode(src.slice(at)));
      return box;
    }

    /* CASE AND SURROUNDING SPACE ARE THE ONLY THINGS FORGIVEN, which is the
       Trivia room's rule and the right one: forgiving more starts accepting a
       different word. */
    function sameAnswer(a, b) {
      return clean(a).toLowerCase() === clean(b).toLowerCase();
    }

    function shuffled(list) {
      const out = list.slice();
      for (let i = out.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = out[i]; out[i] = out[j]; out[j] = t;
      }
      return out;
    }

    /* SHUFFLED ONCE PER OPEN, INTO state.shown, NEVER IN THE PAINTER. The
       painter runs again the instant an answer is judged, so shuffling there
       would rearrange the buttons under the pointer at exactly the moment
       somebody is reading which one they got wrong. */
    function paintPlay() {
      const right = el('svChallenge');
      right.innerHTML = '';
      const play = state.play;
      if (!play) return;
      const c = play.challenge;

      const head = document.createElement('div');
      head.className = 'sv-playhead';
      const name = document.createElement('span');
      name.className = 'sv-playname';
      name.textContent = c.name;
      const kind = document.createElement('span');
      kind.className = 'sv-kind';
      kind.textContent = typeLabel(c.type);
      head.appendChild(name); head.appendChild(kind);
      right.appendChild(head);

      right.appendChild(promptNode(c.prompt, play.vars));

      const answered = play.verdict !== '';
      const opts = play.shown;
      const hasAnswer = !!clean(c.answer);

      if (opts && opts.length) {
        const list = document.createElement('div');
        list.className = 'sv-choices';
        opts.forEach((opt) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'sv-choice';
          b.textContent = opt;
          if (answered) {
            /* JUDGED BY VALUE, NEVER BY INDEX, which is what lets the shown
               order differ from the row's own array safely. */
            if (sameAnswer(opt, c.answer)) b.classList.add('is-right');
            else if (sameAnswer(opt, play.given)) b.classList.add('is-wrong');
            b.disabled = true;
          } else {
            b.addEventListener('click', () => {
              play.given = opt;
              play.verdict = sameAnswer(opt, c.answer) ? 'right' : 'wrong';
              paintPlay();
            });
          }
          list.appendChild(b);
        });
        right.appendChild(list);
      } else if (hasAnswer) {
        const row2 = document.createElement('div');
        row2.className = 'sv-typed';
        const box = document.createElement('input');
        box.type = 'text';
        box.className = 'sv-answerbox';
        box.placeholder = clean(c.type) === 'operations' ? 'Type AGREE' : 'Type the answer';
        box.value = play.given;
        box.disabled = answered;
        const go = document.createElement('button');
        go.type = 'button';
        go.className = 'btn small';
        go.textContent = 'Check';
        go.disabled = answered;
        const judge = () => {
          play.given = box.value;
          if (!clean(play.given)) return;
          play.verdict = sameAnswer(play.given, c.answer) ? 'right' : 'wrong';
          paintPlay();
        };
        go.addEventListener('click', judge);
        box.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); judge(); } });
        row2.appendChild(box); row2.appendChild(go);
        right.appendChild(row2);
        if (!answered) setTimeout(() => { try { box.focus(); } catch (e) { /* not focusable yet */ } }, 0);
      } else {
        /* NO ANSWER IS NOT A GAP. A photo, a freeform reply and most minigames
           are judged by the team that did them, so there is nothing to check
           against and inventing a box would be inventing a rule. */
        const note = document.createElement('div');
        note.className = 'sv-value is-empty';
        note.textContent = 'This one is judged by the team that did it. There is no '
          + 'stored answer to check against.';
        right.appendChild(note);
        if (!answered) {
          const done = document.createElement('button');
          done.type = 'button';
          done.className = 'btn small';
          done.textContent = 'Mark as done';
          done.addEventListener('click', () => { play.verdict = 'done'; paintPlay(); });
          right.appendChild(done);
        }
      }

      if (answered) {
        const said = document.createElement('div');
        said.className = 'sv-verdict is-' + play.verdict;
        said.textContent = play.verdict === 'right' ? 'Right.'
          : play.verdict === 'wrong' ? 'Wrong.' : 'Done.';
        right.appendChild(said);
