        /* THE ANSWER IS SHOWN ONLY AFTER IT HAS BEEN MET. Up front it makes the
           panel a listing again. */
        if (hasAnswer) field(right, 'Answer', clean(c.answer));
        const again = document.createElement('button');
        again.type = 'button';
        again.className = 'btn small';
        /* A FILTERED STOP DRAWS A DIFFERENT ONE; a fixed stop replays its own.
           Two verbs, because they are two different acts. */
        const filtered = state.open && state.open.challenge_id == null;
        again.textContent = filtered ? 'Draw another' : 'Play again';
        again.addEventListener('click', () => {
          if (filtered) drawChallenge(state.open);
          else startPlay(state.open);
        });
        right.appendChild(again);
      }

      /* NOTHING IS RECORDED, AND THE PANEL SAYS SO. `game_responses` is
         append-only and is written by the ENGINE at play time; a rehearsal in
         an admin room must not land in it. */
      const foot = document.createElement('div');
      foot.className = 'sv-playfoot';
      foot.textContent = 'A rehearsal. Nothing is recorded.';
      right.appendChild(foot);
    }

    /* THE DRAW GOES THROUGH `tgb_pick_challenge`, NEVER A COPY OF ITS RULES.
       That function is what play time will call, so a client-side pick here
       would be a second implementation free to disagree with it -- which is the
       fault this project keeps removing. The cost is a round trip per draw,
       which is nothing for a rehearsal.
         AND IT PASSES WHAT IT HAS ALREADY DRAWN, which is how the no-repeat
       rule is demonstrated rather than described: press again and the set walks
       down until it runs out. */
    async function drawChallenge(row) {
      const right = el('svChallenge');
      try {
        const res = await fetch(rpcUrl('tgb_pick_challenge'), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_stop_id: row.stop_id, p_used: state.picked })
        });
        if (!res.ok) throw new Error(await readError(res));
        const id = await res.json();
        if (id === null || id === undefined) {
          const spec = randomSpec(row);
          const note = document.createElement('div');
          note.className = 'sv-value is-empty';
          note.textContent = state.picked.length
            ? 'That is all of them: ' + state.picked.length
              + (state.picked.length === 1 ? ' challenge' : ' challenges')
              + ' drawn and none repeated. A game would have run out here.'
            : 'Nothing carries ' + (spec.tags.length ? spec.tags.join(' and ') : 'that filter')
              + ', so this stop would reach a team with no challenge.';
          right.innerHTML = '';
          right.appendChild(specHead(row));
          right.appendChild(note);
          return;
        }
        state.picked.push(id);
        const c = chalById(id);
        if (!c) { say('Picked challenge ' + id + ', which is not in the list. Reload.', 'error'); return; }
        playChallenge(row, c);
      } catch (err) {
        say(err.message, 'error');
      }
    }

    /* WHAT THE STOP ASKS FOR, ON TOP OF THE REHEARSAL, so a drawn challenge is
       plainly one OF something rather than the stop's own. */
    function specHead(row) {
      const spec = randomSpec(row);
      const box = document.createElement('div');
      box.className = 'sv-playhead';
      const name = document.createElement('span');
      name.className = 'sv-playname';
      name.textContent = spec.name;
      const kind = document.createElement('span');
      kind.className = 'sv-kind';
      kind.textContent = spec.sub;
      box.appendChild(name); box.appendChild(kind);
      return box;
    }

    function playChallenge(row, c) {
      const opts = Array.isArray(c.choices) ? c.choices.filter((x) => clean(x)) : [];
      state.play = {
        challenge: c,
        vars: varsFor(row, wpById(row.waypoint_id)),
        shown: opts.length ? shuffled(opts) : null,
        given: '',
        verdict: ''
      };
      paintPlay();
    }

    function startPlay(row) {
      const c = row && row.challenge_id != null ? chalById(row.challenge_id) : null;
      const right = el('svChallenge');
      right.innerHTML = '';
      if (!c) {
        state.play = null;
        right.appendChild(specHead(row));
        const note = document.createElement('div');
        note.className = 'sv-value is-empty';
        note.textContent = 'This stop picks one at play time. Draw one to meet what a '
          + 'team would; a draw never repeats one already taken.';
        right.appendChild(note);
        const go = document.createElement('button');
        go.type = 'button';
        go.className = 'btn small';
        go.textContent = 'Draw one';
        go.addEventListener('click', function () { drawChallenge(row); });
        right.appendChild(go);
        const foot = document.createElement('div');
        foot.className = 'sv-playfoot';
        foot.textContent = 'A rehearsal. Nothing is recorded.';
        right.appendChild(foot);
        return;
      }
      const opts = Array.isArray(c.choices) ? c.choices.filter((x) => clean(x)) : [];
      state.play = {
        challenge: c,
        vars: varsFor(row, wpById(row.waypoint_id)),
        shown: opts.length ? shuffled(opts) : null,
        given: '',
        verdict: ''
      };
      paintPlay();
    }

    /* ---- THE PREVIEW, DRAWN FROM A ROW ------------------------------------
       LIFTED OUT OF `openStop` so the EDIT BOXES can redraw it. It used to
       follow the stored row and nothing else, so changing the waypoint left the
       street view, the address and the rehearsal describing the place you had
       just moved away from until you saved.
         IT TAKES A ROW RATHER THAN READING `state.open`, because what it draws
       while you are editing is the PENDING stop -- what the boxes say -- and
       that is a different thing from what is filed. Nothing here writes. */
    function paintPreview(row) {
      const w = wpById(row.waypoint_id);
      /* THE REHEARSAL STARTS AGAIN. It models one play of one stop, so a
         different challenge is a different rehearsal and the drawn list has to
         go with it. */
      state.picked = [];

      /* A STOP WHOSE WAYPOINT WAS DELETED KEEPS ITS CHALLENGE and needs a new
         waypoint: 2026083117 strips the waypoint rather than removing the
         stop, because the challenge and the position are editorial work. */
      el('svTitle').textContent = w ? w.name
        : (row.waypoint_id === null ? 'Waypoint deleted, this stop needs a new waypoint'
                                    : 'Waypoint ' + row.waypoint_id);
      /* THE HEAD SAYS WHERE, off the waypoint. A stop no longer carries a town
         of its own, and this line is the only place in the popup that says one
         before you reach the address. */
      el('svCity').textContent = w ? wpWhere(w) : '';

      // ---- left: the waypoint ----
      const left = el('svWaypoint');
      left.innerHTML = '';
      const pano = document.createElement('div');
      pano.className = 'sv-pano';
      const url = svUrl(w);
      if (url) {
        const frame = document.createElement('iframe');
        frame.src = url;
        frame.loading = 'lazy';
        frame.referrerPolicy = 'no-referrer-when-downgrade';
        frame.title = 'Street view of ' + (w ? w.name : 'this waypoint');
        frame.allowFullscreen = true;
        pano.appendChild(frame);
      } else {
        const note = document.createElement('div');
        note.className = 'sv-nopano';
        note.textContent = w
          ? 'No coordinates on this waypoint, so there is no street view to show. Add them in the Waypoints room.'
          : 'That waypoint is not on file any more.';
        pano.appendChild(note);
      }
      left.appendChild(pano);
      if (w) {
        field(left, 'Address', clean(w.address) || clean(wpWhere(w)));
        field(left, 'Description', clean(w.description), true);
        const src = clean(w.source_url);
        const box = field(left, 'Source', src);
        if (src && /^https?:/i.test(src)) {
          const a = document.createElement('a');
          a.href = src; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = src;
          const v = box.querySelector('.sv-value');
          v.textContent = '';
          v.appendChild(a);
        }
      }

      // ---- right: play the challenge ----
      startPlay(row);
    }

    function openStop(row) {
      const w = wpById(row.waypoint_id);
      const c = row.challenge_id == null ? null : chalById(row.challenge_id);
      state.open = row;

      /* THE EDIT BOXES OPEN ON WHAT THE ROW HOLDS, through the SAME labellers
         the ADD bar uses -- `wpLabel` and `chalLabel` -- so a value picked here
         and one picked there resolve identically. A second labeller would drift
         the first time either changed. */
      setBoxValue('svWpInput', w ? wpLabel(w) : '');
      el('svWpInput').removeAttribute('data-invalid');
      state.editTags = {
        tags: Array.isArray(row.challenge_tags) ? row.challenge_tags.slice() : [],
        mode: clean(row.challenge_tags_match) === 'any' ? 'any' : 'all'
      };
      setBoxValue('svChalInput', c
        ? chalLabel(c)
        : randomLabel(state.editTags.tags, state.editTags.mode));
      el('svChalInput').removeAttribute('data-invalid');
      el('svSaved').textContent = '';

      paintPreview(row);

      el('svBackdrop').hidden = false;
      el('svClose').focus();
    }

    function closeStop() {
      const back = el('svBackdrop');
      if (!back || back.hidden) return;
      back.hidden = true;
      // THE FRAME IS TORN DOWN, NOT HIDDEN. A hidden Google frame goes on
      // loading and goes on being a third-party request; the Tape Room learned
      // the same about a hidden Spotify embed, which kept playing.
      el('svWaypoint').innerHTML = '';
      el('svChallenge').innerHTML = '';
      state.play = null;
      state.picked = [];
      state.open = null;
    }

    /* ---- writing ----------------------------------------------------------
       `return=representation` ON EVERY WRITE. PostgREST answers 200 with an
       EMPTY ARRAY when RLS refuses, so without reading the row back a refused
       write reports success and the page shows a stop the table never took. */
    async function addStop() {
      const wpField = el('wpInput');
      const chalField = el('chalInput');
      const wpText = clean(wpField.value);
      const chalText = clean(chalField.value);

      [wpField, chalField].forEach(function (f) { f.removeAttribute('data-invalid'); });

      const wp = wpFromLabel(wpText);
      if (!wp) {
        wpField.setAttribute('data-invalid', 'true');
        say(wpText ? 'No waypoint called "' + wpText + '". Pick one from the list.'
                   : 'A stop needs a waypoint.', 'error');
        return;
      }
      // A TYPED CHALLENGE THE LIST DOES NOT HOLD IS REFUSED RATHER THAN STORED
      // AS RANDOM. Silently turning a typo into a real choice is the one
      // outcome nobody could see afterwards.
      const tags = state.pendingTags.tags;
      const chal = chalFromLabel(chalText);
      if (chal === null) {
        chalField.setAttribute('data-invalid', 'true');
        say('No challenge called "' + chalText + '". Pick one, or leave it on '
            + RANDOM_LABEL + '.', 'error');
        return;
      }

      try {
        const res = await fetch(restUrl(TABLE), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          /* THREE IDS, AND THE ROW'S OWN IS THE DATABASE'S TO ASSIGN. `city`
             went on 2026090302: sending it now would be refused as an unknown
             column and the whole insert would fail. */
          /* A FIXED CHALLENGE AND A FILTER ARE EXCLUSIVE, which
             `stops_fixed_or_filtered` enforces: whichever this is, the other
             goes as null rather than being left off, or a later edit would
             leave a row saying both. */
          body: JSON.stringify({
            waypoint_id: wp.wpid,
            challenge_id: chal === 'random' ? null : chal.id,
            challenge_tags: chal === 'random' && tags.length ? tags : null,
            /* SENT ALWAYS, because the column is NOT NULL: leaving it off would
               take the default, which is right for `all` and silently wrong for
               `any`. */
            challenge_tags_match: state.pendingTags.mode
          })
        });
        if (!res.ok) throw new Error(await readError(res));
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) {
          throw new Error('The database refused the write and said nothing. Check you are signed in.');
        }
        state.rows.push(rows[0]);
        /* SORTED THE WAY THE SERVER SENT THEM: waypoint id ascending, NULLS
           LAST, which is what Postgres does on an ascending order. A bare
           subtraction is NaN against a null and leaves the new row wherever it
           landed, so the list would disagree with itself until a reload. */
        state.rows.sort(function (a, b) {
          if (a.waypoint_id == null && b.waypoint_id == null) return 0;
          if (a.waypoint_id == null) return 1;
          if (b.waypoint_id == null) return -1;
          return a.waypoint_id - b.waypoint_id;
        });
        wpField.value = '';
        chalField.value = '';
        state.pendingTags = { tags: [], mode: 'all' };
        render();
        say('Added ' + wp.name + (wpWhere(wp) ? ' in ' + wpWhere(wp) : '') + '.', 'success');
      } catch (err) {
        say(err.message, 'error');
      }
    }

    /* SAVING A STOP IS THE SAME TWO DECISIONS AS ADDING ONE, resolved through
       the same functions: `wpFromLabel` and `chalFromLabel` are the only idea of
       what a valid waypoint and challenge are, so the popup cannot accept
       something the bar would refuse.
         A TYPO IS REFUSED, NEVER STORED AS RANDOM. Silently turning a mistyped
       challenge into "pick one at play time" is the one outcome nobody could see
       afterwards, which is why the ADD bar refuses it too. */
    async function saveStop() {
      const row = state.open;
      if (!row) return;
      const wpField = el('svWpInput');
      const chalField = el('svChalInput');
      [wpField, chalField].forEach(function (f) { f.removeAttribute('data-invalid'); });

      const wp = wpFromLabel(clean(wpField.value));
      if (!wp) {
        wpField.setAttribute('data-invalid', 'true');
        say(clean(wpField.value)
          ? 'No waypoint called "' + clean(wpField.value) + '". Pick one from the list.'
          : 'A stop needs a waypoint.', 'error');
        return;
      }
      const chal = chalFromLabel(clean(chalField.value));
      if (chal === null) {
        chalField.setAttribute('data-invalid', 'true');
        say('No challenge called "' + clean(chalField.value) + '". Pick one, or leave it on '
            + RANDOM_LABEL + '.', 'error');
        return;
      }

      const tags = state.editTags.tags;
      const body = {
        waypoint_id: wp.wpid,
        /* A FIXED CHALLENGE AND A FILTER ARE EXCLUSIVE, which
           `stops_fixed_or_filtered` enforces. Whichever this is, the other goes
           as NULL rather than being left off: a PATCH that omits a key leaves
           the old value, so moving from a filter to a named challenge would
           otherwise leave a row saying both and be refused. */
        challenge_id: chal === 'random' ? null : chal.id,
        challenge_tags: chal === 'random' && tags.length ? tags : null,
        challenge_tags_match: state.editTags.mode
      };

      try {
        /* FILTERED ON `stop_id`, the row's own key. `waypoint_id` is the unique
           and it is NULLABLE, so a stripped stop is `waypoint_id=eq.null` --
           a filter that matches nothing and reports as a refusal. */
        const res = await fetch(restUrl(TABLE, { stop_id: 'eq.' + row.stop_id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json',
                                 Prefer: 'return=representation' }),
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await readError(res, 'move'));
        const rows = await res.json();
        /* POSTGREST ANSWERS 200 WITH AN EMPTY ARRAY WHEN RLS REFUSES, so a
           refused save would otherwise report success and the popup would show
           a value the table never took. */
        if (!Array.isArray(rows) || !rows.length) {
          throw new Error('The database refused the change and said nothing. Check you are signed in.');
        }
        const saved = rows[0];
        state.rows = state.rows.map(function (r) {
          return rowKey(r) === rowKey(row) ? saved : r;
        });
        state.open = saved;
        render();
        /* REOPENED ON WHAT CAME BACK, not on what was sent: the row is redrawn
           from the stored values, so the street view, the address and the
           rehearsal all follow the waypoint that actually landed. */
        openStop(saved);
        el('svSaved').textContent = 'Saved.';
        say('Saved the stop at ' + wp.name + '.', 'success');
      } catch (err) {
        say(err.message || 'Could not save the stop.', 'error');
      }
    }

    async function removeStop(row) {
      const w = wpById(row.waypoint_id);
      const name = w ? w.name : 'this stop';
      const where = w ? wpWhere(w) : '';
      if (!window.confirm('Delete ' + name + (where ? ' in ' + where : '') + '? '
          + 'The waypoint and the challenge are untouched; only the stop goes.')) return;
      try {
        /* FILTERED ON THE ROW'S OWN `stop_id`, which is now the only thing that
           could address it: `waypoint_id` is the unique, and it is NULLABLE, so
           two stripped stops are both `waypoint_id=eq.null` -- a filter that
           matches nothing and reports as the database refusing the delete. The
           row you most want to fix would be the one you could not remove. */
        const res = await fetch(restUrl(TABLE, { stop_id: 'eq.' + row.stop_id }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=representation' })
        });
        if (!res.ok) throw new Error(await readError(res));
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) {
          throw new Error('The database refused the delete and said nothing. Check you are signed in.');
        }
        state.rows = state.rows.filter(function (r) { return rowKey(r) !== rowKey(row); });
        if (state.open && rowKey(state.open) === rowKey(row)) closeStop();
        render();
        say('Deleted the stop at ' + name + '.', 'success');
      } catch (err) {
        say(err.message, 'error');
      }
    }

    /* ---- wiring -----------------------------------------------------------
       DEFENSIVE, because one dead reference in this block kills the rest of it
       INCLUDING adminAuth.init(), and admin-shell.css hides every child of
       body.mc-auth-protected until init() adds .mc-auth-authorized. A missing
       element should cost one control, not the whole page. */
    function on(id, event, fn) {
      const node = el(id);
      if (node) node.addEventListener(event, fn);
      else console.warn('stop builder: no element #' + id);
    }

    on('addBtn', 'click', addStop);
    /* CHOOSING A RANDOM CHALLENGE ASKS WHICH ONES. On `change` rather than
       `input`: a datalist pick fires both, and typing R-A-N-D-O-M would open
       the dialog on the last keystroke of a word somebody was still writing. */
    /* ---- THE DOWN ARROW OFFERS THE WHOLE LIST -----------------------------
       A DATALIST FILTERS ITS OPTIONS BY WHAT IS IN THE BOX, so a field already
       holding a full label offers exactly one entry: itself. **The whole list
       is there and hidden behind an exact match**, which is what the popup's
       boxes do on every open, since they are filled from the row.
         SO THE BOX EMPTIES ON FOCUS. Same fix the Game Builder's game picker
       already carries, and the same reason.
         AND THE VALUE COMES BACK ON BLUR IF NOTHING WAS CHOSEN. **An empty box
       is not an instruction** -- it is what you get from clicking in and
       clicking away again -- and in the popup an emptied waypoint would be
       refused by Save for a value nobody deleted.
         ONE HELPER FOR ALL FOUR BOXES, so the bar and the popup cannot drift
       into behaving differently. */
    const heldValue = {};
    const keepNext = {};
    function offerWholeList(id) {
      const box = el(id);
      if (!box) return;
      box.addEventListener('focus', function () {
        /* A PROGRAMMATIC FOCUS IS NOT SOMEBODY ASKING FOR THE LIST. The tag
           dialog fills this box and then focuses it so keyboard focus does not
           die with the modal -- and emptying there shows a blank box a moment
           after it was filled, which two suites caught. `keepNext` is set at
           that one call site and spent on the next focus. */
        if (keepNext[id]) { keepNext[id] = false; return; }
        heldValue[id] = box.value;
        box.value = '';
      });
      box.addEventListener('blur', function () {
        if (!clean(box.value) && heldValue[id]) box.value = heldValue[id];
      });
    }
    ['wpInput', 'chalInput', 'svWpInput', 'svChalInput'].forEach(offerWholeList);

    /* ANYTHING THAT WRITES ONE OF THESE BOXES USES THIS, or the value is lost
       the moment the box is focused. **The tag dialog wrote the label and then
       called `.focus()`, and the focus handler emptied it** -- the box came back
       blank, which is a fault I introduced and two suites caught. Setting the
       held value alongside means a focus empties it and a blur puts THIS value
       back rather than the one from before the dialog. */
    function setBoxValue(id, v) {
      const box = el(id);
      if (!box) return;
      box.value = v;
      heldValue[id] = v;
    }

    /* ---- the popup's own edit ---- */
    /* THE PREVIEW FOLLOWS THE BOXES, NOT THE STORED ROW. Picking a different
       waypoint redraws the street view, the address and the rehearsal; picking
       a different challenge restarts the rehearsal on it. **Nothing is saved by
       looking**, which is what makes it a preview -- closing without Save still
       writes nothing.
         `change`, NOT `input`. A datalist fires it on a pick and on leaving the
       box, where `input` fires on every keystroke and would thrash the street
       view through every half-typed name.
         AN UNRESOLVABLE VALUE LEAVES THE PREVIEW ALONE rather than blanking it:
       mid-edit is not a state worth drawing, and Save is what refuses a typo. */
    function previewFromBoxes() {
      if (!state.open) return;
      const wp = wpFromLabel(clean(el('svWpInput').value));
      const chal = chalFromLabel(clean(el('svChalInput').value));
      if (!wp || chal === null) return;
      paintPreview({
        stop_id: state.open.stop_id,
        waypoint_id: wp.wpid,
        challenge_id: chal === 'random' ? null : chal.id,
        challenge_tags: chal === 'random' && state.editTags.tags.length
          ? state.editTags.tags : null,
        challenge_tags_match: state.editTags.mode
      });
    }
    on('svWpInput', 'change', previewFromBoxes);
    on('svChalInput', 'change', previewFromBoxes);

    on('svSave', 'click', saveStop);
    on('svDelete', 'click', function () { if (state.open) removeStop(state.open); });
    /* THE SAME TWO GESTURES THE ADD BAR KEEPS: choosing RANDOM asks which
       challenges, and pressing a box that already holds a filter reopens it --
       the box shows prose and nothing else edits it. `change` rather than
       `input`, or the dialog opens on the last keystroke of a word somebody is
       still typing. */
    on('svChalInput', 'change', function () {
      if (chalFromLabel(el('svChalInput').value) === 'random') openTagDialog('edit');
    });
    /* ONLY WHEN THERE IS A FILTER TO EDIT. This fired on a BARE `RANDOM` too,
       so clicking the box -- the arrow included -- opened the tag dialog and the
       challenge list could not be reached by pointer at all. A bare RANDOM has
       no filter to reopen, and choosing RANDOM already opens the dialog through
       `change`.
         IT ASKS THE SETTLED SLOT, NEVER THE BOX'S PROSE. `randomLabel` is the
       one composer and the tags are deliberately not parsed back out of what it
       wrote. */
    on('svChalInput', 'mousedown', function (e) {
      if (state.editTags.tags.length
          && chalFromLabel(el('svChalInput').value) === 'random') {
        e.preventDefault();
        openTagDialog('edit');
      }
    });
    /* NAMING A CHALLENGE DROPS THE FILTER, or the row would carry both and
       `stops_fixed_or_filtered` would refuse it. */
    on('svChalInput', 'input', function () {
      if (chalFromLabel(el('svChalInput').value) !== 'random') {
        state.editTags = { tags: [], mode: 'all' };
      }
      el('svSaved').textContent = '';
    });
    on('svWpInput', 'input', function () { el('svSaved').textContent = ''; });

    on('chalInput', 'change', function () {
      if (chalFromLabel(el('chalInput').value) === 'random') openTagDialog('add');
    });
    /* AND PRESSING THE BOX WHILE IT HOLDS ONE REOPENS IT, which is the only way
       back to a filter already chosen: the box shows prose and nothing else
       edits it. */
    on('chalInput', 'mousedown', function (e) {
      if (state.pendingTags.tags.length
          && chalFromLabel(el('chalInput').value) === 'random') {
        e.preventDefault();
        openTagDialog('add');
      }
    });
    /* NAMING A CHALLENGE DROPS THE FILTER. A filter that no longer applies must
       not be filed, and `stops_fixed_or_filtered` would refuse the pair anyway. */
    on('chalInput', 'input', function () {
      if (chalFromLabel(el('chalInput').value) !== 'random') {
        state.pendingTags = { tags: [], mode: 'all' };
      }
    });
    /* BOUND ONCE ON THE HOST, never per chip: `paintTagDialog` rebuilds them on
       every press, so binding inside it would stack a listener per repaint and
       the count would grow all session. */
    on('tagPicks', 'click', function (e) {
      const b = e.target.closest ? e.target.closest('.tag-pick') : null;
      if (b) toggleTag(b.dataset.tag);
    });
    on('tagUse', 'click', useTagDialog);
    on('tagCancel', 'click', closeTagDialog);
    on('tagBackdrop', 'click', function (e) {
      if (e.target === el('tagBackdrop')) closeTagDialog();
    });
    document.querySelectorAll('input[name="tagsMatch"]').forEach(function (r) {
      r.addEventListener('change', function () {
        state.tagDraft.mode = tagsMatchMode();
        paintTagDialog();
      });
    });
    on('q', 'input', function () { state.q = clean(el('q').value); render(); });
    on('clearBtn', 'click', function () { el('q').value = ''; state.q = ''; render(); });
    on('svClose', 'click', closeStop);
    on('svBackdrop', 'click', function (e) {
      // The backdrop only, never a click inside the panel.
      if (e.target === el('svBackdrop')) closeStop();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      // THE ONE ON TOP FIRST. Both are never open together today, and leaving
      // the order to chance is how Escape dismisses the wrong thing later.
      const tags = el('tagBackdrop');
      if (tags && !tags.hidden) { closeTagDialog(); return; }
      closeStop();
    });

    const adminAuth = TgbMcAdminAuth.create({
      // THE OPTION IS `supabaseConfig`, AN OBJECT. Passing supabaseUrl and
      // supabaseKey reads naturally, lands in Object.assign, is never looked at,
      // and the room then blames the PROJECT for a fault in its own call.
      supabaseConfig: {
        url: SUPABASE_CONFIG.url,
        publishableKey: SUPABASE_CONFIG.publishableKey
      },
      onAuthorized: async function () {
        state.authed = true;
        try {
          await loadAll();
          paintPickers();
          render();
        } catch (err) {
          say(err.message, 'error');
        }
      }
    });

    render();
    adminAuth.init();
  </script>
</body>
</html>
