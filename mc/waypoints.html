<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WAYPOINTS | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }

    .section-head {
      display: grid;
      gap: 6px;
      margin: 0 0 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .legend {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.warn { color: var(--danger); border-color: rgba(160,63,45,0.45); }
    .btn.warn:hover { background: rgba(160,63,45,0.08); border-color: var(--danger); }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .signout-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar .btn { flex: 0 0 auto; white-space: nowrap; }

    .toolbar input {
      flex: 1 1 80px;
      min-width: 0;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    .toolbar select {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }


    .panel {
      display: grid;
      gap: 12px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }

    /* Navigation group (lives in the card action row, left of Delete). */
    .wp-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(var(--bic-blue-rgb), 0.04);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .wp-pager-status { margin: 0; text-align: center; min-width: 7em; }
    .wp-count-total { font-weight: 700; }
    .wp-count-num { cursor: pointer; text-decoration: underline dotted; color: var(--accent); font-weight: 700; }
    .wp-count-num:hover { text-decoration-style: solid; }
    .wp-count-input {
      width: 3.5em;
      padding: 1px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      text-align: center;
    }
    /* Saved/Unsaved badge in the card's lower-right, under the description. */
    .wp-card-foot { display: flex; justify-content: flex-end; margin-top: 2px; }
    .wp-saved { font-weight: 700; letter-spacing: 0.02em; font-size: 0.85rem; }

    .wp-list { display: grid; gap: 12px; }

    .wp-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .wp-card.is-dirty {
      border-color: rgba(194,55,55,0.55);
      box-shadow: 0 0 0 3px rgba(194,55,55,0.08);
    }
    .wp-card.is-saving { opacity: 0.68; }

    .wp-card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .wp-card-head > .wp-nav { justify-self: center; }
    .wp-card-head > .card-actions { justify-self: end; }

    .wp-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .wp-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .wp-id {
      font-family: "IBM Plex Mono", monospace;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .field-grid { display: grid; gap: 10px; }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .field-row--3 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.7fr) minmax(0, 0.9fr); }

    .field { display: grid; gap: 5px; }

    .field label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .field textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.4;
    }

    .field-hint {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }

    .w3w-row { display: flex; gap: 6px; align-items: center; }
    .w3w-row input { flex: 1; min-width: 0; }

    .wp-card-body {
      display: grid;
      grid-template-columns: minmax(200px, 300px) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .wp-map-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .wp-map-wrap .wp-map-preview { flex: 1; }
    .wp-map-cap { font-size: 0.72rem; color: var(--muted); text-align: center; }
    .wp-map-preview {
      width: 100%;
      height: 100%;
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(var(--bic-blue-rgb), 0.04);
      cursor: zoom-in;
    }
    .wp-map-preview .leaflet-container { width: 100%; height: 100%; }
    /* Magnifying-glass cursor over the map (overrides Leaflet's grab cursor). */
    .wp-map-preview .leaflet-grab,
    .wp-map-preview .leaflet-interactive,
    .wp-map-preview .leaflet-container { cursor: zoom-in; }
    .wp-map-preview .leaflet-control a { cursor: pointer; }
    /* Street View button (a Leaflet bar control) */
    .wp-map-preview a.wp-sv-btn {
      display: block;
      width: auto;
      padding: 0 8px;
      height: 28px;
      line-height: 28px;
      background: #fff;
      font: 700 0.72rem/28px 'Space Grotesk', system-ui, sans-serif;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .wp-map-preview a.wp-sv-btn:hover { background: #f3f4f6; }
    /* Live what3words readout under the cursor (bottom-left of the map). */
    .wp-w3w-readout {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 650;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 7px;
      font: 600 0.78rem/1.2 'IBM Plex Mono', monospace;
      color: #c23737;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
    }
    .wp-w3w-readout[hidden] { display: none; }
    @keyframes wp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .wp-blink { animation: wp-blink 0.45s ease-in-out infinite; }
    .wp-map-empty {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 10px;
    }

    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    /* Above Leaflet's panes/controls (which reach z-index ~1000) so the map and
       its zoom buttons sit behind the dialog. */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15,23,42,0.42);
    }
    .modal-backdrop[hidden] { display: none; }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2001;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(560px, calc(100vw - 32px));
      max-height: min(72vh, calc(100vh - 32px));
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(15,23,42,0.28);
      overflow: hidden;
    }
    .modal[hidden] { display: none; }

    .modal-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(var(--bic-blue-rgb), 0.06);
    }
    .modal-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .modal-status { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

    .prompt-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .prompt-search { display: flex; gap: 8px; }
    .prompt-search input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .prompt-search select {
      flex: 0 0 auto;
      max-width: 40%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }
    .zip-list { display: grid; gap: 5px; }
    .zip-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      font: inherit;
    }
    .zip-row:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.5);
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .zip-code { font-weight: 800; }
    .zip-desc { color: var(--muted); font-size: 0.82rem; }
    .prompt-text {
      width: 100%;
      min-height: 48vh;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      padding: 12px;
      font: 0.78rem/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: var(--ink, #1e293b);
      background: #fff;
      white-space: pre-wrap;
    }
    .prompt-text:focus { outline: none; }

    #dedupDialog { width: min(720px, calc(100vw - 32px)); }
    #importDialog, #finderDialog, #bulkDialog { width: min(760px, calc(100vw - 32px)); }
    .import-text {
      width: 100%;
      min-height: 38vh;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      padding: 12px;
      font: 0.82rem/1.45 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre;
      overflow: auto;
    }
    .pick-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pick-tools a { font-size: 0.8rem; cursor: pointer; color: var(--accent); text-decoration: underline; }
    .pick-list { display: grid; gap: 5px; }
    .pick-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }
    .pick-row.dup { background: rgba(194, 55, 55, 0.06); border-color: rgba(194, 55, 55, 0.4); }
    .pick-row input[type="checkbox"] { margin-top: 3px; flex: 0 0 auto; width: 16px; height: 16px; cursor: pointer; }
    .pick-main { display: flex; flex-direction: column; min-width: 0; gap: 2px; flex: 1; }
    .pick-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .pick-sub { font-size: 0.76rem; color: var(--muted); word-break: break-word; }
    .pick-dupnote { font-size: 0.74rem; color: #c23737; }
    .dedup-reason { font-size: 0.82rem; color: var(--muted); }
    .dedup-grid {
      display: grid;
      grid-template-columns: 6.5em 1fr 1fr;
      gap: 6px;
      align-items: stretch;
    }
    .dedup-h {
      font-weight: 800;
      font-size: 0.76rem;
      letter-spacing: 0.03em;
    }
    .dedup-flabel { align-self: center; font-size: 0.8rem; color: var(--muted); }
    .dedup-cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      font: inherit;
      text-align: left;
      min-height: 1.6em;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
    }
    .dedup-cell.dedup-h { overflow: hidden; text-overflow: ellipsis; }
    .dedup-cell:hover { border-color: rgba(var(--bic-blue-rgb), 0.5); }
    .dedup-cell.chosen {
      border-color: rgba(var(--bic-blue-rgb), 0.9);
      background: rgba(var(--bic-blue-rgb), 0.08);
      box-shadow: inset 0 0 0 1px rgba(var(--bic-blue-rgb), 0.4);
    }
    .dedup-cell.empty { color: var(--muted); font-style: italic; }
    .dedup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

    .near-list {
      overflow: auto;
      padding: 10px 12px;
      display: grid;
      gap: 5px;
      align-content: start;
    }
    .near-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .near-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .near-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .near-sub { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 720px) {
      .wp-card-body { grid-template-columns: 1fr; }
      .wp-map-preview { min-height: 180px; }
    }

    @media (max-width: 640px) {
      .wp-card-head { grid-template-columns: minmax(0, 1fr); }
      .wp-card-head > .wp-nav { justify-self: center; }
      .wp-card-head > .card-actions { justify-self: stretch; }
      .card-actions { grid-column: 1 / -1; justify-content: stretch; }
      .card-actions .btn { flex: 1 1 auto; }
      .field-row { grid-template-columns: 1fr; }

      /* Toolbar wraps onto multiple rows; search takes a full row. */
      .toolbar { flex-wrap: wrap; }
      .toolbar input { flex: 1 1 100%; }
      .toolbar .btn { flex: 1 1 auto; }

      /* Dialogs (Find waypoints, Prompt, Import, Dedup, Near) fill the screen. */
      .modal,
      #dedupDialog, #importDialog, #finderDialog, #bulkDialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
      .modal-bar { flex-wrap: wrap; padding: 10px; }
      .modal-title { flex: 1 1 100%; }
      .modal-bar .btn { flex: 1 1 auto; }

      /* Find-stops / Prompt picker: stack state, city, and the action button. */
      .prompt-search { flex-wrap: wrap; }
      .prompt-search select,
      .prompt-search input,
      .prompt-search .btn { flex: 1 1 100%; max-width: none; }

      /* Dedup merge grid: tighter label column so two values fit. */
      .dedup-grid { grid-template-columns: 4.5em 1fr 1fr; }
    }
  </style>
  <link rel="stylesheet" href="js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <div class="topbar">
      <div class="topbar-actions" style="margin-left:auto;">
        <button class="signout-btn" id="signOutBtn" type="button" aria-label="ADMIN LOGIN" title="ADMIN LOGIN">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5.5 19.5c1.2-3.4 3.8-5.1 6.5-5.1s5.3 1.7 6.5 5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <section class="section-head">
      <p class="kicker">TGB MISSION CONTROL</p>
      <h2>WAYPOINTS</h2>
      <p class="legend">Waypoints are real-world places that become walking-tour stops. One waypoint can be used in many games. <strong>Waypoint + Challenge = Game Stop.</strong></p>
    </section>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search waypoints" autocomplete="off">
      <select id="filterSelect" title="Filter waypoints by what's missing">
        <option value="">All waypoints</option>
        <option value="no_w3w">Missing what3words</option>
        <option value="no_address">Missing address</option>
        <option value="no_zip">Missing ZIP</option>
        <option value="no_city">Missing city</option>
        <option value="no_coords">Missing coordinates</option>
        <option value="no_description">Missing description</option>
      </select>
      <button class="btn small" id="selectBtn" type="button" title="Bulk Fill or Delete the waypoints currently shown by the filter/search">Select</button>
      <button class="btn small" id="newBtn" type="button" title="Search the world for the text in the box, or add a blank waypoint when empty">New</button>
      <button class="btn small" id="findStopsBtn" type="button" title="Pull real tour-worthy places from OpenStreetMap for a city">Find waypoints</button>
      <button class="btn small" id="promptBtn" type="button" title="Generate an AI prompt that returns walking-tour stops as CSV">Prompt</button>
      <button class="btn small" id="importBtn" type="button" title="Paste CSV/spreadsheet rows and add them all as waypoints">Import</button>
      <button class="btn small" id="dedupBtn" type="button" title="Find waypoints with the same or similar name or address">Dedup</button>
    </div>

    <section class="panel">
      <div class="wp-list" id="wpList"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="nearBackdrop" hidden></div>
  <section class="modal" id="nearDialog" hidden role="dialog" aria-modal="true" aria-labelledby="nearTitle">
    <div class="modal-bar">
      <h3 class="modal-title" id="nearTitle">Nearby points of interest</h3>
      <span class="modal-status" id="nearStatus" aria-live="polite"></span>

      <h3 class="modal-title" id="bulkTitle">Bulk edit</h3>
      <button class="btn small" id="bulkFillBtn" type="button">Fill</button>
      <button class="btn warn small" id="bulkDeleteBtn" type="button">Delete</button>

  <script src="js/admin-auth.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin-nav-menu.js"></script>
  <script src="js/supabase-rest.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const TABLE = 'waypoints';
    const PK = 'wpid';
    // Columns read from the table. wpid is the identity primary key.
    const WAYPOINT_COLUMNS = ['wpid', 'city', 'state', 'zip', 'address', 'name', 'description', 'w3w', 'lat', 'lon'];
    // Editable text fields (everything except the auto-number PK and lat/lon).
    const EDITABLE_FIELDS = ['name', 'city', 'state', 'zip', 'address', 'description', 'w3w'];
    // Fields actually persisted on save / used for change detection — the editable
    // text fields plus the stored exact coordinates (lat/lon are not form fields).
    const SAVED_FIELDS = EDITABLE_FIELDS.concat(['lat', 'lon']);
    const round6 = (n) => Math.round(n * 1e6) / 1e6;

    // --- DOM refs ------------------------------------------------------------
    const pageStatus = document.getElementById('pageStatus');
    const signOutBtn = document.getElementById('signOutBtn');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const newBtn = document.getElementById('newBtn');
    const wpList = document.getElementById('wpList');

    const state = {
      rows: [],
      authed: false,
      filter: '',
      fieldFilter: '',  // dropdown filter: '', 'no_w3w', 'no_address', 'no_zip', 'no_city', 'no_coords', 'no_description'
      // The single waypoint currently shown. Exactly one is featured at a time;
      // Back/Next/Random step through the (optionally filtered) set.
      randomId: null,
      dirtyIds: new Set(),
      savingIds: new Set()
    };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading waypoints...');
        loadCatalogCities().catch(() => {}); // warm the city catalog for the chooser
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.rows = [];
        state.dirtyIds.clear();
        state.savingIds.clear();
        render();
        setStatus('Sign in with an admin account.');
      }
    });

    function setStatus(text, kind) {
      // Status notifications were removed from the UI; keep this a no-op so the
      // many setStatus(...) calls throughout still work. Errors go to console.
      if (!pageStatus) return;
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') {
        return adminAuth.authHeaders(extra || {});
      }
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
        try { await adminAuth.ensureFreshSession(); } catch (error) {}
      }
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (error) {
          return text;
        }
      } catch (error) {
        return fallback;
      }
    }

    // Reload from the DB. Pass keepId to stay on (feature) a specific waypoint
    // after a save; otherwise feature a fresh random one.
    async function refresh(keepId) {
      try {
        await ensureFreshSession();
        // TgbRest.fetchAll paginates past PostgREST's 1000-row cap.
        const url = restUrl(TABLE, { select: WAYPOINT_COLUMNS.join(','), order: PK + '.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        state.rows = normalizeRows(rows);
        rebuildPristine();
        state.dirtyIds.clear();
        state.savingIds.clear();
        if (keepId != null && findRow(keepId)) {
          state.randomId = keepId;
          render();
        } else {
          state.randomId = highestId();
          render();
          setStatus('Loaded ' + state.rows.length + ' waypoints (highest WPID first).', 'success');
        }
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Load failed.', 'error');
        render();
      }
    }

    function normalizeRows(rows) {
      return (Array.isArray(rows) ? rows : []).map(normalizeRow);
    }

    function normalizeRow(row) {
      const r = row && typeof row === 'object' ? row : {};
      return {
        wpid: r.wpid == null ? '' : String(r.wpid),
        city: String(r.city || ''),
        state: String(r.state || ''),
        zip: String(r.zip || ''),
        address: String(r.address || ''),
        name: String(r.name || ''),
        description: String(r.description || ''),
        w3w: String(r.w3w || ''),
        lat: (r.lat == null || r.lat === '') ? null : Number(r.lat),
        lon: (r.lon == null || r.lon === '') ? null : Number(r.lon)
      };
    }

    function cleanText(value) {
      return String(value == null ? '' : value).trim();
    }

    // PATCH/POST payload — editable columns plus the stored exact coordinates.
    function payloadFromRow(row) {
      const payload = {};
      EDITABLE_FIELDS.forEach((field) => { payload[field] = cleanText(row[field]) || null; });
      payload.lat = Number.isFinite(row.lat) ? row.lat : null;
      payload.lon = Number.isFinite(row.lon) ? row.lon : null;
      return payload;
    }

    async function patchRow(wpid, row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not save waypoint.'));
      const rows = await response.json();
      const fresh = Array.isArray(rows) && rows[0] ? rows[0] : null;
      return fresh ? normalizeRow(fresh) : normalizeRow(Object.assign({}, findRow(wpid), row));
    }

    // Insert one waypoint (editable fields only; wpid is trigger-assigned).
    async function postWaypoint(row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, {}), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add waypoint.'));
      const rows = await response.json();
      return normalizeRow(Array.isArray(rows) && rows[0] ? rows[0] : {});
    }

    async function saveRow(wpid) {
      const row = findRow(wpid);
      if (!row || state.savingIds.has(wpid)) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Saving ' + displayName(row) + '...');
      try {
        await patchRow(wpid, row);
        state.dirtyIds.delete(wpid);
        // Reload from the DB and stay on this waypoint.
        await refresh(wpid);
        const fresh = findRow(wpid);
        setStatus('Saved ' + (fresh ? displayName(fresh) : ('#' + wpid)) + '.', 'success');
      } catch (error) {
        console.error(error);
        state.savingIds.delete(wpid);
        setStatus(error.message || 'Save failed.', 'error');
        render();
      }
    }

    async function deleteWaypoint(wpid) {
      const row = findRow(wpid);
      if (!row) return;
      if (!window.confirm('Delete waypoint #' + wpid + (row.name ? ' (' + row.name + ')' : '') + '? This cannot be undone.')) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Deleting ' + displayName(row) + '...');
      try {
        await ensureFreshSession();
        const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=minimal' })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not delete waypoint.'));
        state.rows = state.rows.filter((r) => r.wpid !== wpid);
        state.dirtyIds.delete(wpid);
        // render()'s ensureCurrent() re-features the highest remaining waypoint
        // when the deleted one was current.
        render();
        setStatus('Deleted waypoint #' + wpid + '.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Delete failed.', 'error');
      } finally {
        state.savingIds.delete(wpid);
      }
    }

    function findRow(wpid) {
      return state.rows.find((row) => row.wpid === wpid) || null;
    }


    // Snapshot of a row's saved (pristine) field values, for change detection.
    const pristine = new Map();
    function snapshot(row) {
      return SAVED_FIELDS.map((f) => cleanText(row[f])).join('~|~');
    }
    function rebuildPristine() {
      pristine.clear();
      state.rows.forEach((r) => pristine.set(r.wpid, snapshot(r)));
    }

    // Mark dirty only if the row actually differs from its saved snapshot —
    // editing a field back to its original value clears the dirty flag again.
    function markDirty(wpid) {
      const row = findRow(wpid);
      if (row && snapshot(row) === pristine.get(wpid)) {
        state.dirtyIds.delete(wpid);
      } else {
        state.dirtyIds.add(wpid);
      }
      updateCardState(wpid);
      updateSummary();
    }

    function updateField(wpid, field, value) {
      const row = findRow(wpid);
      if (!row) return;
      row[field] = String(value || '');
      // Editing the address invalidates the stored coordinates — drop them so the
      // map re-geocodes the new address (Fill will set precise coords again).
      if (field === 'address') { row.lat = null; row.lon = null; }
      markDirty(wpid);
    }

    // --- Interactive map (Leaflet / OpenStreetMap) ---------------------------
    // The preview is a clickable map: click a spot to search nearby. One map
    // instance at a time, with the what3words 3m grid overlaid when zoomed in.
    let leafletMap = null;
    let w3wGridLayer = null;
    let w3wGridAbort = null;      // in-flight grid request, so we can cancel it
    let w3wGridTimer = null;      // debounce for pan/zoom grid refreshes
    let w3wHoverAbort = null;     // in-flight hover convert-to-3wa request
    let w3wHoverTimer = null;     // debounce for the hover readout
    const W3W_GRID_MIN_ZOOM = 18; // grid is illegible / too large to fetch below this

    async function setupMap(row) {
      if (typeof L === 'undefined') return;
      const container = wpList.querySelector('[data-map-preview]');
      if (!container) return;
      if (leafletMap) { try { leafletMap.remove(); } catch (error) {} leafletMap = null; }
      // Cancel any pending grid work from the previous map so it can't keep the
      // page in a "loading" (busy/hourglass cursor) state.
      if (w3wGridTimer) { clearTimeout(w3wGridTimer); w3wGridTimer = null; }
      if (w3wGridAbort) { try { w3wGridAbort.abort(); } catch (error) {} w3wGridAbort = null; }
      if (w3wHoverTimer) { clearTimeout(w3wHoverTimer); w3wHoverTimer = null; }
      if (w3wHoverAbort) { try { w3wHoverAbort.abort(); } catch (error) {} w3wHoverAbort = null; }
      container.innerHTML = '';

      // Center priority: stored coordinates -> what3words -> address -> city/state,
      // else a wide New Orleans view so a blank waypoint is still usable.
      const stale = () => wpList.querySelector('[data-map-preview]') !== container || !container.isConnected;
      let center = null;

      // 0) stored exact coordinates — most reliable, no geocoding.
      if (Number.isFinite(row.lat) && Number.isFinite(row.lon)) center = { lat: row.lat, lon: row.lon };

      // 1) what3words (only when the key plan supports words -> coordinates).
      if (W3W_TO_COORDS) {
        const words = parseW3W(cleanText(row.w3w));
        if (words) { try { center = await w3wToPoint(words); } catch (error) {} if (stale()) return; }
      }

      // 2) address (decode coords/Plus Code locally, else geocode it WITH the
      //    city/state/zip so a bare street like "1427 Washington Avenue" doesn't
      //    resolve to the wrong city).
      if (!center) {
        const address = cleanText(row.address);
        center = addressToPoint(address);
        if (!center && address) {
          const q = [address, cleanText(row.city), cleanText(row.state), cleanText(row.zip)].filter(Boolean).join(', ');
          try { center = await geocodeCoords(q); } catch (error) {}
          if (stale()) return;
        }
      }

      // 3) city, state, zip.
      if (!center) {
        const loc = [cleanText(row.city), cleanText(row.state), cleanText(row.zip)].filter(Boolean).join(', ');
        if (loc) { try { center = await geocodeCoords(loc); } catch (error) {} if (stale()) return; }
      }

      // A waypoint that HAS a location but couldn't be geocoded (usually a
      // transient rate-limit) must not show a misleading default — show a retry
      // note. A truly blank waypoint gets the wide New Orleans click-to-create view.
      if (!center && (cleanText(row.address) || cleanText(row.city) || cleanText(row.name))) {
        const ph = document.createElement('div');
        ph.className = 'wp-map-empty';
        ph.textContent = 'Couldn’t place this waypoint on the map — try again in a moment.';
        container.appendChild(ph);
        return;
      }

      const has = !!center;
      const view = center || { lat: 29.9584, lon: -90.0644 };
      // Open located waypoints zoomed in past W3W_GRID_MIN_ZOOM so the what3words grid shows immediately.
      const map = L.map(container, { scrollWheelZoom: false, maxZoom: 22 }).setView([view.lat, view.lon], has ? 19 : 12);
      // Satellite (keyless Esri World Imagery) is the default; Streets is a toggle.
      const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 22, maxNativeZoom: 19, attribution: 'Tiles &copy; Esri'
      });
      const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; OpenStreetMap'
      });
      satellite.addTo(map);
      L.control.layers({ 'Satellite': satellite, 'Streets': streets }, null, { position: 'topright' }).addTo(map);
      if (has) L.marker([view.lat, view.lon]).addTo(map);
      // Street View button: opens Google Street View for the current map center.
      const SvControl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function (m) {
          const btn = L.DomUtil.create('a', 'leaflet-bar wp-sv-btn');
          btn.href = '#';
          btn.textContent = 'Street View';
          btn.title = 'Open Google Street View for the center of the map';
          L.DomEvent.on(btn, 'click', L.DomEvent.stop);
          L.DomEvent.on(btn, 'click', () => {
            const c = m.getCenter();
            window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + c.lat + ',' + c.lng, '_blank', 'noopener');
          });
          return btn;
        }
      });
      map.addControl(new SvControl());
      // what3words button: opens this waypoint's exact 3m square on what3words.com.
      const w3wWords = parseW3W(cleanText(row.w3w));
      if (w3wWords) {
        const W3wControl = L.Control.extend({
          options: { position: 'topleft' },
          onAdd: function () {
            const btn = L.DomUtil.create('a', 'leaflet-bar wp-sv-btn');
            btn.href = '#';
            btn.textContent = 'what3words';
            btn.title = 'Open this waypoint’s what3words square (///' + w3wWords + ')';
            L.DomEvent.on(btn, 'click', L.DomEvent.stop);
            L.DomEvent.on(btn, 'click', () => {
              window.open('https://what3words.com/' + encodeURIComponent(w3wWords), '_blank', 'noopener');
            });
            return btn;
          }
        });
        map.addControl(new W3wControl());
      }
      leafletMap = map;

      // what3words 3m grid overlay — refreshed on pan/zoom (debounced), shown only when close.
      w3wGridLayer = null;
      map.on('moveend zoomend', () => {
        if (w3wGridTimer) clearTimeout(w3wGridTimer);
        w3wGridTimer = setTimeout(() => updateW3WGrid(map), 250);
      });
      updateW3WGrid(map);

      // Live what3words readout: hover the map and the ///words under the cursor
      // appears (when you pause) — no click, no search.
      const readout = document.createElement('div');
      readout.className = 'wp-w3w-readout';
      readout.hidden = true;
      container.appendChild(readout);
      map.on('mousemove', (e) => {
        if (w3wHoverTimer) clearTimeout(w3wHoverTimer);
        const latlng = e.latlng;
        w3wHoverTimer = setTimeout(() => showHoverW3W(map, latlng, readout), 300);
      });
      map.on('mouseout', () => { if (w3wHoverTimer) clearTimeout(w3wHoverTimer); readout.hidden = true; });

      map.on('click', async (e) => {
        const popup = L.popup({ closeButton: false, autoClose: false, closeOnClick: false })
          .setLatLng(e.latlng).setContent('<span class="wp-blink">Finding…</span>').openOn(map);
        try {
          await onMapClick(e.latlng.lat, e.latlng.lng);
        } finally {
          map.closePopup(popup);
        }
      });

      // Right-click a spot to see its what3words address.
      map.on('contextmenu', (e) => {
        if (e.originalEvent && e.originalEvent.preventDefault) e.originalEvent.preventDefault();
        showW3WAt(map, e.latlng.lat, e.latlng.lng);
      });
      setTimeout(() => { try { map.invalidateSize(); } catch (error) {} }, 0);
    }

    // Overlay the what3words 3m grid (GeoJSON lines) for the current view. Only
    // fetched when zoomed in enough to be legible (and small enough for the API).
    async function updateW3WGrid(map) {
      if (map !== leafletMap) return; // stale map
      const removeGrid = () => { if (w3wGridLayer) { try { map.removeLayer(w3wGridLayer); } catch (error) {} w3wGridLayer = null; } };
      if (!W3W_API_KEY || map.getZoom() < W3W_GRID_MIN_ZOOM) { removeGrid(); return; }
      const b = map.getBounds();
      const bbox = b.getSouth() + ',' + b.getWest() + ',' + b.getNorth() + ',' + b.getEast();
      // Cancel any earlier request; cap this one so a slow response can't hang
      // the page (which shows as a persistent busy/hourglass cursor).
      if (w3wGridAbort) { try { w3wGridAbort.abort(); } catch (error) {} }
      const controller = new AbortController();
      w3wGridAbort = controller;
      const timer = setTimeout(() => { try { controller.abort(); } catch (error) {} }, 7000);
      try {
        const url = 'https://api.what3words.com/v3/grid-section?bounding-box=' + encodeURIComponent(bbox)
          + '&format=geojson&key=' + encodeURIComponent(W3W_API_KEY);
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok || map !== leafletMap) return;
        const geo = await res.json();
        if (!geo || geo.error || map !== leafletMap) return;
        removeGrid();
        w3wGridLayer = L.geoJSON(geo, {
          interactive: false,
          style: { color: '#c23737', weight: 0.5, opacity: 0.45 }
        }).addTo(map);
      } catch (error) {
        // aborted or network error — leave the grid as-is
      } finally {
        clearTimeout(timer);
        if (w3wGridAbort === controller) w3wGridAbort = null;
      }
    }

    // Hover readout: show the what3words address under the cursor (debounced),
    // without clicking or starting a search.
    async function showHoverW3W(map, latlng, readout) {
      if (map !== leafletMap || !W3W_API_KEY) return;
      if (w3wHoverAbort) { try { w3wHoverAbort.abort(); } catch (error) {} }
      const controller = new AbortController();
      w3wHoverAbort = controller;
      const timer = setTimeout(() => { try { controller.abort(); } catch (error) {} }, 5000);
      try {
        const url = 'https://api.what3words.com/v3/convert-to-3wa?coordinates=' + latlng.lat + ',' + latlng.lng
          + '&key=' + encodeURIComponent(W3W_API_KEY);
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok || map !== leafletMap) return;
        const data = await res.json();
        if (!data || !data.words || map !== leafletMap) return;
        readout.textContent = '///' + data.words;
        readout.hidden = false;
      } catch (error) {
        // aborted or network error — leave the readout as-is
      } finally {
        clearTimeout(timer);
        if (w3wHoverAbort === controller) w3wHoverAbort = null;
      }
    }

    // Right-click handler: show the what3words address at a point, with a link
    // and a button to create a new waypoint there (reverse-geocoded + w3w).
    async function showW3WAt(map, lat, lon) {
      if (!W3W_API_KEY) return;
      const popup = L.popup({ closeButton: true }).setLatLng([lat, lon]).setContent('Looking up what3words…').openOn(map);
      let words = '';
      try {
        const url = 'https://api.what3words.com/v3/convert-to-3wa?coordinates=' + lat + ',' + lon + '&key=' + encodeURIComponent(W3W_API_KEY);
        const res = await fetch(url);
        const data = await res.json();
        words = data && data.words ? data.words : '';
      } catch (error) {}
      if (map !== leafletMap) return;
      if (!words) { popup.setContent('Couldn’t get a what3words address here.'); return; }
      const href = 'https://w3w.co/' + words;
      const wrap = document.createElement('div');
      wrap.style.display = 'grid';
      wrap.style.gap = '6px';
      wrap.style.justifyItems = 'start';
      const link = document.createElement('a');
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '///' + words;
      link.style.fontWeight = '700';
      const streetView = document.createElement('a');
      streetView.href = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + lat + ',' + lon;
      streetView.target = '_blank';
      streetView.rel = 'noopener';
      streetView.textContent = 'Street View ↗';
      const newBtn = document.createElement('button');
      newBtn.type = 'button';
      newBtn.className = 'btn small';
      newBtn.textContent = 'New Waypoint';
      newBtn.title = 'Create a new waypoint here, filled from this point';
      newBtn.addEventListener('click', async () => {
        newBtn.disabled = true;
        newBtn.textContent = 'Adding…';
        const point = { lat: lat, lon: lon };
        const payload = {};
        try {
          const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          const place = await res.json();
          if (place && !place.error) await fillFieldsFromPlace(payload, place, point, true);
        } catch (error) {}
        // Always carry the exact what3words address and a coordinate fallback.
        if (!cleanText(payload.w3w)) payload.w3w = href;
        if (!cleanText(payload.address)) payload.address = lat + ', ' + lon;
        Object.keys(payload).forEach((k) => { if (!cleanText(payload[k])) delete payload[k]; });
        try { map.closePopup(popup); } catch (error) {}
        await insertWaypointAndGo(payload, null);
      });
      wrap.append(link, streetView, newBtn);
      popup.setContent(wrap);
    }

    // Clicking the map searches for nearby places at the clicked spot and offers
    // them to add as NEW waypoints — like the Near button, seeded by the click.
    async function onMapClick(lat, lon) {
      // Show the Near button's finding state for map-click searches too.
      const nearBtn = wpList.querySelector('[data-action="near"]');
      if (nearBtn) { nearBtn.disabled = true; nearBtn.textContent = 'Finding…'; }
      try {
        // Reverse-geocode for a city/state fallback on whatever gets added.
        let fallback = { city: '', state: '' };
        try {
          const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon
            + '&format=jsonv2&addressdetails=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          const place = await res.json();
          if (place && !place.error) {
            const addr = place.address || {};
            fallback = {
              city: cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.suburb || addr.municipality || addr.county),
              state: cleanText(addr.state)
            };
          }
        } catch (error) {}
        let pois = [];
        try { pois = await fetchNearbyPois({ lat, lon }, NEAR_RADIUS_M); } catch (error) { console.error(error); }
        const items = pois.map((poi) => ({
          name: poi.name,
          sub: [poi.cat, formatDistance(poi.dist) + ' away'].filter(Boolean).join(' · '),
          onAdd: (btn) => addPoiAsWaypoint(poi, fallback, btn)
        }));
        showResults('Waypoints near the clicked spot', items,
          'No named points of interest within ' + Math.round(NEAR_RADIUS_M * 3.28084) + ' ft of that spot.');
      } finally {
        if (nearBtn) { nearBtn.disabled = false; nearBtn.textContent = 'Near'; }
      }
    }

    // The Address field accepts: a street address, "lat, lon" coordinates, a
    // full Google Plus Code, or a what3words reference (///words or a
    // what3words.com URL). Coordinates and Plus Codes decode locally (keyless);
    // what3words uses the API key (same one as mc/js/add-w3w.mjs).
    // NOTE: this key's plan currently allows convert-to-3wa (coords->words) but
    // NOT convert-to-coordinates (words->coords), so pasted ///words will fail
    // with QuotaExceeded until the plan is upgraded — coords/Plus Code/address
    // all still work.
    const W3W_API_KEY = 'CSNL2XHT';
    // Words -> coordinates is not in this key's plan, so don't waste a (failing)
    // call centering the map from a what3words address. Flip to true if upgraded.
    const W3W_TO_COORDS = false;

    function parseLatLon(text) {
      const m = cleanText(text).match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
      if (!m) return null;
      const lat = parseFloat(m[1]);
      const lon = parseFloat(m[2]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat, lon };
    }

    // Open Location Code (Google Plus Code) decoder — full/global codes only.
    const OLC_ALPHABET = '23456789CFGHJMPQRVWX';
    function decodePlusCode(text) {
      const match = cleanText(text).toUpperCase().replace(/\s+/g, '').match(/[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3}/);
      if (!match) return null;
      const code = match[0];
      if (code.indexOf('+') !== 8 || code.indexOf('0') > -1) return null; // require a full code, no padding
      const digits = code.replace('+', '');
      for (const ch of digits) { if (OLC_ALPHABET.indexOf(ch) === -1) return null; }
      let southLat = 0, westLng = 0, latRes = 400, lngRes = 400, i = 0;
      while (i < digits.length) {
        if (i < 10) {
          latRes /= 20; lngRes /= 20;
          southLat += OLC_ALPHABET.indexOf(digits.charAt(i)) * latRes;
          if (i + 1 < digits.length) westLng += OLC_ALPHABET.indexOf(digits.charAt(i + 1)) * lngRes;
          i += 2;
        } else {
          const d = OLC_ALPHABET.indexOf(digits.charAt(i));
          latRes /= 5; lngRes /= 4;
          southLat += Math.floor(d / 4) * latRes;
          westLng += (d % 4) * lngRes;
          i += 1;
        }
      }
      const lat = (southLat - 90) + latRes / 2;
      const lon = (westLng - 180) + lngRes / 2;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat: parseFloat(lat.toFixed(6)), lon: parseFloat(lon.toFixed(6)) };
    }

    // Extract "word.word.word" from a what3words URL, ///prefix, or bare triple.
    function parseW3W(text) {
      const t = cleanText(text);
      const url = t.match(/^(?:\/\/\/|https?:\/\/(?:www\.)?(?:what3words\.com|w3w\.co|w3w\.com)\/)([^\/?#\s]+)/i);
      const words = url ? url[1] : t;
      return /^[^.\s\/]+\.[^.\s\/]+\.[^.\s\/]+$/.test(words) ? words : null;
    }

    async function w3wToPoint(words) {
      if (!W3W_API_KEY || !words) return null;
      try {
        const url = 'https://api.what3words.com/v3/convert-to-coordinates?words=' + encodeURIComponent(words) + '&key=' + encodeURIComponent(W3W_API_KEY);
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        const c = data && data.coordinates;
        return c && Number.isFinite(c.lat) && Number.isFinite(c.lng) ? { lat: c.lat, lon: c.lng } : null;
      } catch (error) { return null; }
    }

    // Point → what3words address (///word.word.word). This key's plan allows
    // convert-to-3wa (coords -> words), so Fill can generate/store a w3w address.
    async function pointToW3W(lat, lon) {
      if (!W3W_API_KEY || !Number.isFinite(lat) || !Number.isFinite(lon)) return '';
      try {
        const url = 'https://api.what3words.com/v3/convert-to-3wa?coordinates=' + lat + ',' + lon + '&key=' + encodeURIComponent(W3W_API_KEY);
        const res = await fetch(url);
        if (!res.ok) return '';
        const data = await res.json();
        return data && data.words ? 'https://w3w.co/' + data.words : '';
      } catch (error) { return ''; }
    }

    // Build a what3words URL from any w3w form (URL, ///, or bare words).
    function w3wHref(value) {
      const words = parseW3W(value);
      return words ? 'https://w3w.co/' + words : '';
    }

    // Coordinates or Plus Code → a precise point, locally (no network).
    function addressToPoint(text) {
      return parseLatLon(text) || decodePlusCode(text) || null;
    }

    // Resolve the Address field to a point: coordinates or a Plus Code, locally.
    // (what3words lives in its own field — it is not an address-field option.)
    function resolveAddressPoint(text) {
      return addressToPoint(text);
    }


    // Geocode-friendly query for Fill. Nominatim is a structured-address matcher,
    // not a business directory — a venue name like "Duckworth's Grill & Taphouse"
    // makes it miss, while the bare street address resolves cleanly. So prefer
    // the address alone; only fall back to the name when there is no address.
    function geocodeQuery(row) {
      const address = cleanText(row.address);
      const zip = cleanText(row.zip);
      if (address) return [address, zip].filter(Boolean).join(', ');
      return [cleanText(row.name), cleanText(row.city), cleanText(row.state), zip].filter(Boolean).join(', ');
    }

    // Ordered lookup queries built from EVERY filled field — richest first, then
    // degrading. Nominatim often needs the venue name dropped to match a street
    // address, so the all-fields query is tried first, then name-less variants.
    function fillQueries(row) {
      const name = cleanText(row.name);
      const address = cleanText(row.address);
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      const zip = cleanText(row.zip);
      const queries = [];
      const add = (...parts) => {
        const q = parts.map(cleanText).filter(Boolean).join(', ');
        if (q && !queries.includes(q)) queries.push(q);
      };
      if (address) {
        add(address, city, state, zip);  // full address + locality + ZIP — most precise
        add(address, zip);               // street address + ZIP
        add(address);                    // street address alone
        add(name, address);              // name + address
      }
      add(name, city, state, zip);       // name + locality + ZIP
      add(city, state, zip);             // locality + ZIP
      add(city, state);                  // locality only
      add(zip);                          // ZIP alone (Nominatim resolves US ZIPs)
      add(name);                         // last resort
      return queries;
    }

    // Try each query in order, returning the first that geocodes. Tolerant of a
    // single bad/rate-limited (non-JSON) response — it just moves to the next.
    async function geocodeFirst(queries) {
      for (let i = 0; i < queries.length; i += 1) {
        if (i > 0) await new Promise((resolve) => setTimeout(resolve, 1100)); // Nominatim ~1 req/sec
        try {
          const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(queries[i])
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&limit=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          if (!res.ok) continue;
          const arr = await res.json();
          if (Array.isArray(arr) && arr.length) return { place: arr[0], query: queries[i] };
        } catch (error) { /* bad/non-JSON response — try the next query */ }
      }
      return null;
    }

    // A precise point from the most authoritative filled field: the Address
    // (coords / Plus Code / what3words) or the dedicated what3words field.
    async function bestPoint(row) {
      // Stored exact coordinates win — no geocoding needed.
      if (Number.isFinite(row.lat) && Number.isFinite(row.lon)) return { lat: row.lat, lon: row.lon };
      let pt = await resolveAddressPoint(cleanText(row.address));
      if (pt) return pt;
      const words = parseW3W(cleanText(row.w3w));
      if (words) { pt = await w3wToPoint(words); if (pt) return pt; }
      return null;
    }

    // Brief inline feedback on a card button (it sits below the fold, so the
    // top-of-page status line alone is easy to miss).
    function flashButton(button, text) {
      if (!button) return;
      button.textContent = text;
      clearTimeout(button._flashTimer);
      button._flashTimer = setTimeout(() => { button.textContent = 'Fill'; }, 1600);
    }

    // Fill `row` from a geocoded `place` (+ optional precise `point`). With
    // overwrite=false (Fill button) only blank fields are set, keeping existing
    // values. With overwrite=true (map click) every field is cleared and
    // replaced with the location's details. Returns the fields it touched.
    async function fillFieldsFromPlace(row, place, point, overwrite) {
      const addr = place.address || {};
      const lat = point ? point.lat : parseFloat(place.lat);
      const lon = point ? point.lon : parseFloat(place.lon);
      const hasCoords = Number.isFinite(lat) && Number.isFinite(lon);

      const name = cleanText(placeName(place, addr));
      const city = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.suburb || addr.municipality || addr.county);
      const state = cleanText(addr.state);
      const zip = cleanText(addr.postcode);
      // Address is the STREET ONLY (house number + road) — city/state/zip live in
      // their own fields. No street? fall back to coordinates, else leave blank.
      const streetAddress = [cleanText(addr.house_number), cleanText(addr.road)].filter(Boolean).join(' ');
      const address = streetAddress || (hasCoords ? lat + ', ' + lon : '');

      if (overwrite) {
        // Clear-then-fill: replace every field with the clicked location.
        const description = cleanText(await resolveDescription(place, addr, { name: name }));
        const w3w = cleanText(await pointToW3W(lat, lon));
        row.name = name;
        row.city = city;
        row.state = state;
        row.zip = zip;
        row.address = address;
        row.description = description;
        row.w3w = w3w;
        if (hasCoords) { row.lat = round6(lat); row.lon = round6(lon); }
        return ['name', 'city', 'state', 'zip', 'address', 'description', 'w3w'];
      }

      // Fill blanks only — keep anything already entered.
      const filled = [];
      const setIfBlank = (field, value) => {
        const v = cleanText(value);
        if (v && !cleanText(row[field])) { row[field] = v; filled.push(field); }
      };
      setIfBlank('name', name);
      setIfBlank('city', city);
      setIfBlank('state', state);
      setIfBlank('zip', zip);
      setIfBlank('address', address);
      if (!cleanText(row.description)) {
        const desc = await resolveDescription(place, addr, row);
        if (desc) { row.description = desc; filled.push('description'); }
      }
      if (!cleanText(row.w3w)) {
        const words = await pointToW3W(lat, lon);
        if (words) { row.w3w = words; filled.push('w3w'); }
      }
      // Store the exact coordinates when we don't already have them.
      if (hasCoords && !(Number.isFinite(row.lat) && Number.isFinite(row.lon))) {
        row.lat = round6(lat);
        row.lon = round6(lon);
      }
      return filled;
    }

    // Use EVERY filled field to locate the place, then fill ONLY the blank
    // fields (name, city, state, address, description, w3w). Existing values are
    // kept. A precise point (coords / Plus Code / what3words) takes priority;
    // otherwise the richest text query is tried first, degrading until one hits.
    async function fillWaypoint(wpid, button) {
      const row = findRow(wpid);
      if (!row) return;
      const geoFields = ['name', 'city', 'state', 'zip', 'address', 'description', 'w3w'];
      const blanks = geoFields.filter((field) => !cleanText(row[field]));
      if (!blanks.length) {
        flashButton(button, 'All set');
        setStatus(displayName(row) + ' is already complete — nothing blank to fill.');
        return;
      }
      const point = await bestPoint(row);
      const queries = fillQueries(row);
      if (!point && !queries.length) {
        flashButton(button, 'Need info');
        setStatus('Fill in a name or address first, then hit Fill.', 'error');
        return;
      }
      if (button) { button.disabled = true; button.textContent = 'Filling…'; }
      try {
        let place;
        if (point) {
          // A precise point (coordinates / Plus Code / what3words) wins — reverse-geocode it.
          const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + point.lat + '&lon=' + point.lon
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          place = await res.json();
          if (!place || place.error) {
            flashButton(button, 'No match');
            setStatus('No place found at that point.', 'error');
            return;
          }
        } else {
          // Use every filled field — richest query first, degrading until one hits.
          const found = await geocodeFirst(queries);
          if (!found) {
            flashButton(button, 'No match');
            setStatus('No match found for this waypoint.', 'error');
            return;
          }
          place = found.place;
        }
        const filled = await fillFieldsFromPlace(row, place, point);
        if (!filled.length) {
          flashButton(button, 'No new data');
          setStatus('Found a match, but nothing new to fill.');
          return;
        }
        markDirty(wpid);
        render();
        setStatus('Filled ' + filled.join(', ') + ' for ' + displayName(row) + '. Review, then Save.', 'success');
      } catch (error) {
        console.error(error);
        flashButton(button, 'Failed');
        setStatus('Lookup failed.', 'error');
      } finally {
        if (button) {
          button.disabled = false;
          if (button.textContent === 'Filling…') button.textContent = 'Fill';
        }
      }
    }

    // Generic OSM types that say nothing useful about a place — drop them so we
    // don't write "a house in Charlotte".
    const GENERIC_PLACE_TYPES = new Set([
      'house', 'yes', 'residential', 'administrative', 'postcode', 'address',
      'road', 'construction', 'locality', 'neighbourhood', 'suburb', 'town',
      'city', 'village', 'hamlet', 'county', 'state', 'country', 'unclassified'
    ]);

    // Best available description: a real Wikipedia summary ONLY when the article
    // is actually about this waypoint (its name matches the geocoded place, or it
    // has no name yet). Otherwise a geocoded address can drag in the Wikipedia
    // entry for a containing building or a nearby landmark — the wrong place.
    async function resolveDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rowName = cleanText(row && row.name);
      const samePlace = !rowName || namesSimilar(rowName, cleanText(place && place.name));
      if (samePlace) {
        let title = wikipediaTitle(extratags);
        if (!title && /^Q\d+$/.test(cleanText(extratags.wikidata))) {
          title = await wikidataEnTitle(cleanText(extratags.wikidata));
        }
        if (title) {
          const summary = await fetchWikiSummary(title);
          if (summary) return summary;
        }
      }
      return buildLocalDescription(place, addr, row);
    }

    function normalizeName(value) {
      return cleanText(value)
        .normalize('NFD').replace(/[̀-ͯ]/g, '') // fold accents: Café -> Cafe
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\b(the|a|an|of|and)\b/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function namesSimilar(a, b) {
      const na = normalizeName(a);
      const nb = normalizeName(b);
      if (!na || !nb) return false;
      return na === nb || na.includes(nb) || nb.includes(na);
    }

    // Pull an English Wikipedia article title from OSM's wikipedia tag
    // ("en:Madison Square Garden"). Non-English tags are skipped.
    function wikipediaTitle(extratags) {
      const w = cleanText(extratags && extratags.wikipedia);
      if (!w) return '';
      const m = w.match(/^([a-z-]+):(.+)$/i);
      if (m) return m[1].toLowerCase() === 'en' ? cleanText(m[2]) : '';
      return w;
    }

    // Resolve a Wikidata id (Q…) to its English Wikipedia title (origin=* → CORS).
    async function wikidataEnTitle(qid) {
      try {
        const url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + encodeURIComponent(qid)
          + '&props=sitelinks&format=json&origin=*';
        const res = await fetch(url);
        if (!res.ok) return '';
        const data = await res.json();
        const entity = data && data.entities && data.entities[qid];
        const link = entity && entity.sitelinks && entity.sitelinks.enwiki;
        return link ? cleanText(link.title) : '';
      } catch (error) { return ''; }
    }

    // Fetch a Wikipedia REST summary and trim it to a couple of sentences.
    async function fetchWikiSummary(title) {
      try {
        const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return '';
        const data = await res.json();
        if (data && (data.type === 'disambiguation')) return '';
        const extract = cleanText(data && data.extract);
        return extract ? trimSentences(extract, 2, 320) : '';
      } catch (error) { return ''; }
    }

    function trimSentences(text, maxSentences, maxChars) {
      const parts = String(text).match(/[^.!?]+[.!?]+/g) || [text];
      let out = parts.slice(0, maxSentences).join(' ').trim();
      if (out.length > maxChars) out = out.slice(0, maxChars - 1).replace(/\s+\S*$/, '').trim() + '…';
      return out;
    }

    // Composed fallback when there is no Wikipedia article: name + category +
    // neighborhood + locality, e.g. "Duckworth's Grill & Taphouse in Uptown,
    // Charlotte, North Carolina."
    function buildLocalDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rawType = cleanText(place.type || place.addresstype || place.category).toLowerCase();
      const type = GENERIC_PLACE_TYPES.has(rawType) ? '' : rawType.replace(/_/g, ' ');
      const cuisine = cleanText(extratags.cuisine).replace(/_/g, ' ').replace(/;/g, ', ');
      const descriptor = [cuisine, type].filter(Boolean).join(' ');
      const name = cleanText(row && row.name) || cleanText(place.name);
      const hood = cleanText(addr.neighbourhood || addr.suburb || addr.quarter || addr.city_district);
      const town = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.municipality || addr.county);
      const where = [hood, town, cleanText(addr.state)].filter(Boolean).join(', ');
      if (name && descriptor && where) return name + ', a ' + descriptor + ' in ' + where + '.';
      if (name && where) return name + ' in ' + where + '.';
      if (descriptor && where) return capitalize(descriptor) + ' in ' + where + '.';
      if (where) return where + '.';
      return cleanText(place.display_name);
    }

    function capitalize(text) {
      const t = cleanText(text);
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
    }

    // --- Near: nearby points of interest -------------------------------------
    const NEAR_RADIUS_M = 100; // ~330 ft — walking-distance, not miles.

    // Near: find POIs around the current waypoint's location.
    async function nearWaypoint(wpid, button) {
      const row = findRow(wpid);
      if (!row) return;
      const query = geocodeQuery(row);
      const hasPoint = !!addressToPoint(cleanText(row.address));
      if (!query && !hasPoint) {
        setStatus('Add an address or name first, then hit Near.', 'error');
        return;
      }
      if (button) { button.disabled = true; button.textContent = 'Finding…'; }
      try {
        // Coordinates / Plus Code resolve to a point directly; else geocode.
        let coords = resolveAddressPoint(cleanText(row.address));
        if (!coords && query) coords = await geocodeCoords(query);
        if (!coords) {
          setStatus('Could not locate ' + displayName(row) + '.', 'error');
          return;
        }
        const pois = await fetchNearbyPois(coords, NEAR_RADIUS_M);
        const items = pois.map((poi) => ({
          name: poi.name,
          sub: [poi.cat, formatDistance(poi.dist) + ' away'].filter(Boolean).join(' · '),
          onAdd: (btn) => addPoiAsWaypoint(poi, row, btn)
        }));
        showResults('Near ' + displayName(row), items, 'No named points of interest within ' + Math.round(NEAR_RADIUS_M * 3.28084) + ' ft.');
      } catch (error) {
        console.error(error);
        setStatus('Nearby lookup failed.', 'error');
      } finally {
        if (button) { button.disabled = false; button.textContent = 'Near'; }
      }
    }

    // Cached geocode. Successful results (and confirmed-empty ones) are cached so
    // re-rendering the same waypoint never re-hits Nominatim; transient failures
    // (rate-limit / HTML error pages) are NOT cached and return null gracefully.
    const geocodeCache = new Map();
    async function geocodeCoords(query) {
      const key = cleanText(query).toLowerCase();
      if (!key) return null;
      if (geocodeCache.has(key)) return geocodeCache.get(key);
      try {
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=jsonv2&limit=1';
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null; // transient (e.g. rate-limited) — don't cache
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) { geocodeCache.set(key, null); return null; }
        const lat = parseFloat(arr[0].lat);
        const lon = parseFloat(arr[0].lon);
        const result = Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : null;
        geocodeCache.set(key, result);
        return result;
      } catch (error) {
        return null; // non-JSON / network error — don't cache
      }
    }

    // Overpass (OpenStreetMap) nearby named POIs within `radius` metres — keyless.
    async function fetchNearbyPois(coords, radius) {
      const kinds = ['amenity', 'tourism', 'shop', 'leisure', 'historic'];
      const around = 'around:' + radius + ',' + coords.lat + ',' + coords.lon;
      const q = '[out:json][timeout:25];('
        + kinds.map((k) => 'node(' + around + ')["name"]["' + k + '"];way(' + around + ')["name"]["' + k + '"];').join('')
        + ');out center tags 80;';
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass ' + res.status);
      const data = await res.json();
      const seen = new Set();
      const out = [];
      (data.elements || []).forEach((el) => {
        const tags = el.tags || {};
        const name = cleanText(tags.name);
        if (!name) return;
        const plat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const plon = el.lon != null ? el.lon : (el.center && el.center.lon);
        if (plat == null || plon == null) return;
        const key = name.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const cat = cleanText(tags.amenity || tags.tourism || tags.shop || tags.leisure || tags.historic).replace(/_/g, ' ');
        out.push({ name, cat, lat: plat, lon: plon, tags, dist: haversineMeters(coords.lat, coords.lon, plat, plon) });
      });
      out.sort((a, b) => a.dist - b.dist);
      return out;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const toRad = (d) => d * Math.PI / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Nearness in walking steps (~2,000 steps per mile), or miles once it's far.
    function formatDistance(m) {
      const miles = m / 1609.34;
      if (miles >= 0.25) return miles.toFixed(1) + ' mi';
      const steps = Math.max(1, Math.round(miles * 2000));
      return steps + (steps === 1 ? ' step' : ' steps');
    }

    // Cities pulled from the shared public.cities catalog — the same table the
    // shop and sound pages read. Cached after the first load. select=* so it
    // still works before the cities-ignored migration (per project convention:
    // never name the 'ignored' column in a query). Archived cities are dropped;
    // everything else — including venue-only "ignored" cities, which are real
    // places you'd add waypoints for — is offered.
    let catalogCitiesPromise = null;
    let catalogCitiesList = []; // sync snapshot (for the Save-typed dedup check)
    function loadCatalogCities() {
      if (catalogCitiesPromise) return catalogCitiesPromise;
      catalogCitiesPromise = (async () => {
        const url = restUrl('cities', { select: '*', order: 'city.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        const seen = new Set();
        const out = [];
        (Array.isArray(rows) ? rows : []).forEach((r) => {
          const city = cleanText(r && r.city);
          if (!city || r.archived) return;
          const key = city.toLowerCase();
          if (seen.has(key)) return;
          seen.add(key);
          out.push(city);
        });
        out.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        catalogCitiesList = out;
        return out;
      })().catch((err) => { catalogCitiesPromise = null; throw err; });

    }

    // --- Dedup: find waypoints with the same/similar name or address ----------
    let dedupPairs = [];
    let dedupIdx = 0;
    let dedupCurrent = null;
    let dedupSkipped = new Set();  // pair keys the user marked "not a duplicate"
    const DEDUP_NAME_T = 0.86;     // name similarity threshold
    const DEDUP_ADDR_T = 0.88;     // address similarity threshold
    const DEDUP_FIELD_LABELS = { name: 'Name', city: 'City', state: 'State', zip: 'ZIP', address: 'Address', description: 'Description', w3w: 'w3w' };
    // Description is ignored throughout dedup — not matched on, not shown as a
    // merge choice, and the kept row's description is preserved untouched.
    const DEDUP_MERGE_FIELDS = EDITABLE_FIELDS.filter((f) => f !== 'description');

    function dedupKey(value) {
      return cleanText(value).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      let prev = new Array(n + 1);
      for (let j = 0; j <= n; j++) prev[j] = j;
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) {
          const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        prev = cur;
      }
      return prev[n];
    }

    function dedupSimilarity(rawA, rawB) {
      const a = dedupKey(rawA), b = dedupKey(rawB);
      if (!a || !b) return 0;
      if (a === b) return 1;
      // Containment (e.g. "Cafe du Monde" vs "Cafe du Monde Decatur St") counts high.
      if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0)) return 0.95;
      return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    }

    // Leading house number of an address ("800 Decatur St" -> "800"). Empty when
    // the address has no number (e.g. just a street, or "lat, lon" coords).
    function houseNumber(value) {
      const m = cleanText(value).match(/^\s*#?\s*(\d{1,6})\b/);
      return m ? m[1] : '';
    }

    // Two addresses with DIFFERENT house numbers are not the same place, even if
    // the rest of the street matches. (Missing numbers don't conflict.)
    function streetNumbersConflict(a, b) {
      const na = houseNumber(a), nb = houseNumber(b);
      return Boolean(na && nb && na !== nb);
    }

    function addressSimilarity(a, b) {
      if (!cleanText(a) || !cleanText(b)) return 0;
      if (streetNumbersConflict(a, b)) return 0;
      return dedupSimilarity(a, b);
    }

    // Compare every pair of waypoints; flag those with a matching name or address.
    function findDuplicatePairs() {
      const rows = state.rows;
      const pairs = [];
      for (let i = 0; i < rows.length; i++) {
        for (let j = i + 1; j < rows.length; j++) {
          const a = rows[i], b = rows[j];
          const nameSim = (cleanText(a.name) && cleanText(b.name)) ? dedupSimilarity(a.name, b.name) : 0;
          const addrSim = addressSimilarity(a.address, b.address);
          let reason = '', score = 0;
          if (nameSim >= DEDUP_NAME_T) { reason = nameSim >= 0.999 ? 'identical name' : 'similar name'; score = nameSim; }
          if (addrSim >= DEDUP_ADDR_T && addrSim > score) { reason = addrSim >= 0.999 ? 'identical address' : 'similar address'; score = addrSim; }
          if (reason) pairs.push({ a: a.wpid, b: b.wpid, reason: reason, score: score });
        }
      }
      pairs.sort((x, y) => y.score - x.score);
      return pairs;
    }

    function dedupPairKey(pair) {
      return [pair.a, pair.b].slice().sort().join('|');
    }

    // Live list of unresolved pairs: a fresh scan minus the ones marked "not a
    // duplicate". Recomputed after each merge so 3-way duplicates (a third copy
    // that only matched the row you just merged away) get re-paired.
    function computeDedupPairs() {
      return findDuplicatePairs().filter((p) => !dedupSkipped.has(dedupPairKey(p)));
    }

    function openDedupDialog() {
      dedupSkipped = new Set();
      dedupPairs = computeDedupPairs();
      dedupIdx = 0;
      const dialog = document.getElementById('dedupDialog');
      const backdrop = document.getElementById('dedupBackdrop');
      if (dialog) dialog.hidden = false;

      if (pair) dedupSkipped.add(dedupPairKey(pair));
      dedupIdx++;
