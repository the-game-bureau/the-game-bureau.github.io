<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TAPE ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --mc-shell-width: 1180px;

      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.05);
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      outline: none;
    }

    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      background: rgba(var(--bic-blue-rgb), 0.05);
    }

    .btn.primary:hover {
      background: #24396a;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #24396a;
      color: #fff;
    }

    .btn[disabled] {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      cursor: default;
      opacity: 1;
      pointer-events: none;
    }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .command-bar > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;

      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto var(--stack-gap);
    }

    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    .command-bar--view { flex: 0 0 auto; }
    @media (max-width: 720px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
      .bar-row .command-bar--view { flex: 1 1 100%; }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .room-head .room-blurb { max-width: none; }

    .btn.is-stale {
      border-color: rgba(194, 55, 55, 0.5);
      color: var(--bic-red);
    }

    .btn.is-stale:hover {
      border-color: var(--bic-red);
      background: rgba(194, 55, 55, 0.07);
    }

    .chip.warn {
      border-color: rgba(154, 74, 24, 0.28);
      background: rgba(154, 74, 24, 0.08);
      color: #9a4a18;
    }

    .chip.success {
      border-color: rgba(47, 107, 61, 0.28);
      background: rgba(47, 107, 61, 0.08);
      color: var(--success);
    }
    @media (max-width: 840px) {

      .tool-modal-panel > .panel-head {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }

      .tool-modal-panel > .panel-head .panel-title { flex: 1 1 100%; }
    }

    @media (max-width: 840px) {

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head-actions .btn,
      .panel-head-actions select,
      .command-bar .btn {
        flex: 1 1 auto;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a { color: var(--accent); }

    .tape-head,

    .tape-lines { --tape-cols: 11ch 13ch minmax(0, 1fr) 17ch 84px 72px minmax(12ch, 0.5fr) 30px; }

    .tape-lines { display: grid; gap: 6px; }

    .tape-head,
    .tape-lines {
      --col-label: 0.68rem;
      --col-value: 0.78rem;
      --col-text: 0.78rem;
    }

    .tape-line { cursor: pointer; }

    .tape-line:hover {
      border-color: var(--accent);
      box-shadow: 0 1px 4px rgba(16, 24, 40, 0.1);
    }

    .tape-line .tape-air,
    .tape-line .tape-air * { cursor: pointer; }

    /* A FLEX BAR, NOT A GRID. It was eight fixed columns because there were
       113 of these and they had to line up; there is one now, so the columns
       bought nothing and cost the name editor its room -- two inputs and a flip
       button squeezed into `minmax(0, 1fr)` while `11ch` sat half empty beside
       it. Everything that was on the row is still on it. */
    .tape-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      padding: 7px 10px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    /* THE NAME TAKES THE SLACK so everything after it stays put. */
    .tape-line > .tape-line-name { flex: 1 1 240px; min-width: 0; }

    /* The place, quiet and first, at their own width rather than a fixed one. */
    .tape-line > .tape-line-country,
    .tape-line > .tape-line-state { flex: 0 1 auto; max-width: 14ch; }

    .tape-line > .tape-line-num { flex: 0 0 auto; }

    /* `grid-column` MEANS NOTHING IN A FLEX BOX, so the two full-width blocks
       are given a basis instead. This is the fault that made the finding line
       invisible the first time it shipped. */
    .tape-line > .tape-line-findings,
    .tape-line > .track-confirm { flex: 1 0 100%; }

    .tape-line-state,
    .tape-line-country {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;

      font-size: var(--col-text);
      color: var(--muted);
    }

    .tape-line-name {
      min-width: 0;
      color: var(--muted);
      /* NOT `anywhere`. It broke "Akron" into "Akro" and "n" the moment the
         column got tight, which reads as a rendering fault rather than a wrap.
         A name may wrap BETWEEN its two halves and never inside a word. */
      overflow-wrap: normal;
      word-break: keep-all;
    }

    /* The city is the half you scan down, so it holds its line whatever
       happens; the spine phrase is what gives way. */
    .tape-line-city { white-space: nowrap; }

    .tape-new {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 999px;

      background: var(--success, #2f855a);
      color: #fff;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      cursor: help;
      white-space: nowrap;
    }

    .issue-pip {
      flex: 0 0 auto;
      box-sizing: border-box;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--bic-red, #c23737);
    }

    .issue-pip.is-tape {
      background: #fff;
      border: 3px solid var(--bic-red, #c23737);
    }

    .tape-line-issues { gap: 6px; }

    .issue-pip-more {
      flex: 0 0 auto;
      margin-left: 1px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--bic-red, #c23737);
    }

    .tape-head > :nth-child(4),
    .tape-line > :nth-child(4) { border-radius: 6px 0 0 6px; }

    .tape-head > :nth-child(6),
    .tape-line > :nth-child(6) { border-radius: 0 6px 6px 0; }

    .tape-head-label--num,
    .tape-line-num {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      min-width: 0;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-value);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--muted);
    }

    .tape-line-num strong { font-weight: 700; color: var(--ink); }
    .tape-line-num.is-empty,
    .tape-line-num.is-empty strong { color: var(--muted); font-weight: 500; }

    .head-figure {
      display: inline-flex;
      flex-direction: column;

      align-items: center;

      gap: 0;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .head-word {
      font-size: var(--col-label);

      letter-spacing: 0.1em;
    }

    .head-count {
      font-size: var(--col-value);
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-transform: none;
    }

    /* LITTLE FILTER BADGES. Word and count side by side in one small rounded
       chip rather than stacked over an underline: stacked they were as tall as
       the bar and read as headings, and the underline that marked one as ON was
       the quietest possible way to say so. */
    .head-figure--filter {
      cursor: pointer;
      position: relative;
      flex-direction: row;
      align-items: baseline;
      gap: 5px;
      padding: 2px 8px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      line-height: 1.4;
    }

    .head-figure--filter .head-word,
    .head-figure--filter .head-count { font-size: 0.66rem; }

    .head-figure--filter .head-count {
      font-weight: 700;
      color: var(--ink);
    }

    .head-figure--filter:hover { color: var(--ink); border-color: var(--accent); }
    .head-figure--filter:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

    .head-figure--filter input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ON IS A FILLED BADGE. A badge you have pressed should not need looking
       at twice to tell from one you have not. */
    .head-figure--filter.is-on,
    .head-figure--filter.is-on .head-count {
      color: #fff;
    }

    .head-figure--filter.is-on {
      background: var(--accent);
      border-color: var(--accent);
    }

    .head-figure--new.is-zero { color: var(--muted); }
    .head-figure--new.is-zero { color: var(--muted); }

    .tape-findings {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--control-line);
    }

    .tape-findings[hidden] { display: none; }

    .track-issues {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--control-line);
    }

    .track-issues .issue-item { margin: 0; }

    .track-head,
    .track-lines {

      --track-cols: 30px 44px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.45fr) 130px 28px 122px 28px;
    }

    section.tool-modal-panel#tracksCard:not([hidden]) {
      display: flex;
      flex-direction: column;
      max-height: min(88vh, 900px);
    }

    #tracksCard .panel-head,
    #tracksCard .prompt-foot { flex: 0 0 auto; }

    #tracksCard .tracks-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;

      padding: 0 2px 4px;
    }

    .track-head { box-shadow: 0 6px 10px -8px rgba(16, 24, 40, 0.35); }

    #tracksTitle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      min-width: 0;
    }

    #tracksTitle .tape-name-editor {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    #tracksTitle .city-input,
    #tracksTitle .spine-input {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .tracks-sub {
      margin: 3px 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--track-cols);
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 6px;
      padding: 8px 10px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head-label {
      min-width: 0;
      padding: 0 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-head-label--mid { padding: 0; text-align: center; }

    #trackAirAll { justify-self: center; }

    .track-lines { display: grid; gap: 6px; }

    /* SHORTER ROWS. There are 15 to 55 of these under a tape and every pixel
       is paid 55 times, so the row is trimmed rather than the type: the fields
       are still the same size to read and to hit. */
    .track-line {
      display: grid;
      grid-template-columns: var(--track-cols);
      gap: 2px 8px;

      align-items: center;
      padding: 2px 8px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    .track-line.is-shelved {
      border-style: dashed;
      opacity: 0.62;
    }
    .track-line.is-shelved:hover,
    .track-line.is-shelved:focus-within { opacity: 1; }

    .track-line.is-live { box-shadow: inset 3px 0 0 var(--success, #2f855a); }

    .track-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      font-size: 0.6rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      align-self: center;
    }

    .track-play:hover {
      border-color: var(--success, #2f855a);
      color: var(--success, #2f855a);
    }

    .track-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .track-play.is-playing {
      border-color: var(--success, #2f855a);
      background: var(--success, #2f855a);
      color: #fff;
    }

    .track-line.is-focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.18);
    }

    .track-stage {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    .track-stage .queue-player {
      display: block;
      width: 100%;
      height: 80px;
      border: 0;
      border-radius: 10px;
    }

    .track-stage .queue-noplayer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      border: 1px dashed var(--control-line);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .track-line.is-flagged { box-shadow: inset 3px 0 0 var(--bic-red, #c23737); }

    .track-input {
      width: 100%;
      min-width: 0;
      /* 30px WAS THE ROW'S REAL FLOOR, not the padding. 26px is still a
         comfortable hit target and takes 4px off every row. */
      min-height: 26px;
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font: inherit;
      font-size: 0.86rem;
      color: var(--ink);
    }

    .track-input:hover { border-color: var(--control-line); }
    .track-input:focus { border-color: var(--accent); background: #fff; outline: none; }

    .track-input--num { text-align: center; font-family: "IBM Plex Mono", monospace; }
    .track-input--id { font-family: "IBM Plex Mono", monospace; font-size: 0.74rem; }
    .track-input--title { font-weight: 700; }

    .track-input--blurb::placeholder { color: var(--bic-red, #c23737); opacity: 0.8; }

    textarea.track-input--blurb {
      resize: vertical;
      /* CLIPPED AT REST, so a wrapping blurb cannot push the row taller. It is
         `auto` while focused, or you could not scroll a long one you are
         editing. */
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      padding-top: 3px;
      padding-bottom: 3px;

      min-height: 30px;
    }

    textarea.track-input--blurb.is-manual,
    textarea.track-input--blurb:focus { overflow: auto; }

    .track-input--id::placeholder { color: var(--muted); opacity: 0.75; }

    .track-explicit { display: flex; align-items: center; justify-content: center; }

    .track-del {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin: 0 auto;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font-size: 0.9rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }

    .track-del:hover { border-color: var(--bic-red); color: var(--bic-red); background: rgba(194, 55, 55, 0.08); }
    .track-del:focus-visible { outline: 2px solid var(--bic-red); outline-offset: 1px; }

    .track-air { transform: scale(0.86); transform-origin: center; }

    .tape-line-del {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: center;
    }

    .track-del.is-armed {
      border-color: var(--bic-red, #c23737);
      background: var(--bic-red, #c23737);
      color: #fff;
    }

    .tape-line .track-confirm { grid-column: 1 / -1; }

    .track-confirm {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;

    .issue-item {
      display: grid;
      gap: 6px;
      padding: 11px 12px;

    .issue-item[data-severity] { border-left-color: var(--control-line); }

    .issue-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .issue-scope-chip {
      border-color: var(--accent);

    }

    .issue-item.is-kept {
      opacity: 0.5;

    }

    .issue-kept-note {
      align-self: center;
      font-family: "IBM Plex Mono", monospace;

    .issue-foot-note {

    .tape-line-name.is-empty { opacity: 0.55; font-style: italic; }

    .tape-line-name {

         under it instead of squeezing the name it belongs to. */
      flex-wrap: wrap;

      gap: 0.32em;
      min-width: 0;
    }

    .city-input {

      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;

    .city-input::-webkit-calendar-picker-indicator {

    }

    .city-input:hover { border-color: var(--control-line); background: #fff; text-decoration: none; }
    .city-input:focus { border-color: var(--accent); background: #fff; outline: none; text-decoration: none; }
    .city-input.is-saving { opacity: 0.5; }

    .spine-flip {

      width: 19px;
      height: 19px;

      border-radius: 5px;
      background: #fff;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .spine-flip:hover { border-color: var(--accent); color: var(--ink); }
    .spine-flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .spine-flip:disabled { opacity: 0.5; cursor: progress; }

    .spine-input {
      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      font: inherit;
      color: inherit;

      text-decoration: underline dotted rgba(var(--bic-blue-rgb), 0.35);
      text-underline-offset: 3px;
    }

    .spine-input:hover {
      border-color: var(--control-line);
      background: #fff;
      text-decoration: none;
    }

    .spine-input:focus {
      border-color: var(--accent);
      background: #fff;
      outline: none;
      text-decoration: none;
    }

    .spine-input.is-saving { opacity: 0.5; }

    .spine-input::placeholder { color: var(--muted); opacity: 0.5; font-style: italic; }

    .bot-field { display: grid; gap: 4px; }

    .bot-field > span {
      font: 700 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bot-input {
      font: 500 0.98rem/1.3 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      padding: 9px 10px;
      width: 100%;
    }

    .bot-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .bot-hint {
      margin: 10px 0 0;
      font: 500 0.86rem/1.45 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
    }

    .bot-hint b { color: var(--ink); font-weight: 700; }

    /* `display: block` BEATS `.tape-line-num`'s flex, and it has to. In a flex
       box the three pieces of "55 tracks, 10 live" become separate flex items
       and the spaces between them are dropped. */
    .tape-line-counts {
      display: block;
      justify-self: start;
      align-self: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font: 500 0.78rem/1.2 "IBM Plex Mono", monospace;
      color: var(--muted);
    }

    .tape-line-counts strong { color: var(--ink); font-weight: 700; }

    .tape-line-live { color: var(--success); font-weight: 700; }

    /* A LIVE COUNT OF ZERO IS NOT GOOD NEWS, so it does not wear the green. */
    .tape-line-live.is-none { color: var(--muted); font-weight: 500; }

    /* THE TRACK ROW ON THE MAIN LIST. It is the popup's row, so it needs the
       popup's column widths, which were scoped to `.track-head, .track-lines`
       and would otherwise resolve to nothing out here and collapse every
       column to zero. */
    .track-line--in-list {
      --track-cols: 30px 44px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.45fr) 130px 28px 122px 28px;
      margin-left: 22px;
      margin-bottom: 2px;
      border-color: var(--cut-panel-line);
    }

    .track-titlecell { display: grid; gap: 0; min-width: 0; align-content: center; }

    /* TINY, AND QUIET. It is context for the line below it, not a heading: at
       any weight it would compete with the title it sits over. */
    .track-tapetag {
      /* TINY. 0.5rem is 8px at a default root, which is below anything else in
         this project: the Socializer's own floor is 0.72rem. It is legible here
         because it is UPPERCASE MONO at weight 700, it is one short line, and
         it is not something you read, it is something you glance at to place a
         row you are already looking at. */
      font: 700 0.5rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* NOT IN THE POPUP. There the tape's name is the dialog's own title, so
       this would be the same thing said twice a few pixels apart. */
    .track-lines .track-tapetag { display: none; }

    .tape-pager-of {
      flex: 0 0 auto;
      margin-right: 4px;
      font: 500 0.72rem/1 "IBM Plex Mono", monospace;
      color: var(--muted);
      white-space: nowrap;
    }

    /* THE TWO STEP BUTTONS ARE THE ROW'S END CAPS. Square, so they read as
       one control each rather than as two more labelled things to consider. */
    /* THE PAIR TOUCHES. Two buttons doing one job, so they read as one
       control with two ends rather than as two separate things. */
    .tape-step {
      flex: 0 0 auto;
      min-width: 26px;
      padding: 0 7px;
      font-size: 0.95rem;
      line-height: 1;
    }

    .tape-step[disabled] { opacity: 0.35; cursor: default; }

    /* The gap between the pair is the row's gap otherwise, which reads as two
       controls. -6px pulls them together without a wrapper element. */
    .tape-step + .tape-step { margin-left: -6px; }

    /* THE TAPE'S OWN FINDINGS, under its line and spanning the whole row. Its
       own, not its tracks': those are drawn on the track rows below. */
    .tape-line-findings {
      display: grid;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--control-line);
    }

    .tape-line-findings .issue-item { margin: 0; }

    /* THE ROOM'S SORT AND FILTER BAR. It was a grid pretending to be a column
       header; with one tape on screen there is nothing up here to align to. */
    /* THE ROOM'S BAR IS THE QUIET ONE. It is reference: you set it once and
       read past it, so it is not sticky and it is a shade smaller. The TAPE's
       bar below is the one worth pinning. */
    .room-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 6px;
      padding: 6px 10px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
      font-size: 0.92em;
    }

    .ctl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .ctl-label {
      font: 700 0.62rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* THE ONE FIGURE THAT IS NOT A FILTER sits at the far end, away from the
       three controls, so it does not read as a fourth thing to press. */
    .room-titlerow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

    /* SMALL AND QUIET, beside a heading rather than under it. It is a standing
       figure, not news, so it must not compete with the room's name. */
    .room-total {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      font: 500 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
    }

    .room-total-word { text-transform: uppercase; }
    .room-total-count { font-weight: 700; color: var(--ink); }

    /* THE TAPE'S BAR IS THE ONE YOU ACT ON, so it keeps the white card. */
    .tape-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      margin-bottom: 8px;
    }

    .tape-bar > .tape-line { margin: 0; }

    .tape-air {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;

      justify-self: end;
    }

    .tape-air { position: relative; }

    .tape-air-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .tape-air-track {
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 19px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.1);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .tape-air-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 120ms ease, background 120ms ease;
    }

    .tape-air-input:checked + .tape-air-track {
      border-color: var(--success);
      background: var(--success);
    }

    .tape-air-input:checked + .tape-air-track::after {
      background: #fff;
      transform: translateX(15px);
    }

    .tape-air-input:focus-visible + .tape-air-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tape-air-input:disabled + .tape-air-track { opacity: 0.5; cursor: progress; }

    .tape-air-input:indeterminate + .tape-air-track {
      border-color: var(--control-line);
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .tape-air-input:indeterminate + .tape-air-track::after {
      background: var(--muted);
      transform: translateX(7.5px);
    }

    .tape-air--all .tape-air-word { font-weight: 700; }

    .tape-air-word--off { text-align: right; }
    .tape-air-word--on { text-align: left; }

    .tape-air-word { opacity: 0.38; font-weight: 500; }
    .tape-air-word.is-current { opacity: 1; font-weight: 700; }
    .tape-air-word--on.is-current { color: var(--success); }
    .tape-air-word--off.is-current { color: var(--ink); }

    .tape-air-word {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tape-line.is-shelved .tape-line-name,
    .tape-line.is-shelved .tape-line-city { opacity: 0.55; }

    @media (max-width: 700px) {

      .tape-line {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 2px 8px;
      }
      .tape-line-name { grid-column: 1; }
      .tape-air { grid-column: 2 / -1; justify-self: end; }
    }

        <div class="room-controls" id="tapeHead">

            <label class="head-figure head-figure--filter" id="liveOnlyPill"

    (function () {

      var keyLegend = document.getElementById('keyLegend');

      var citySearchTerm = '';

      // THE SHELVED / LIVE SWITCH IN A HEADER IS A FILTER, NOT A STATUS
      // CHANGER. It used to rewrite every row it summarised, which is the most
      // destructive act in the room sitting in the quietest control, one press
      // from a confirm nobody reads. It reads as a filter, it sits in a header
      // beside two other filters, and it is one now.
      //
      // 'all' is the NEUTRAL middle and is what the knob rests on. Per-row
      // switches are untouched: those are the status changers.
      // ONE TAPE AT A TIME. The room showed all 113 tapes and all 1,643 track
      // rows at once, which is 27,000 nodes and 10,000 form controls on one
      // page. It is a position into the FILTERED, SORTED list rather than a
      // tape id, so a filter that removes the tape you were on lands you on
      // whatever moved into its place instead of on nothing.
      var tapeAt = 0;

      var airFilter = 'all';          // the tape list
      var trackAirFilter = 'all';     // the tracks inside an open tape

      var pageNotice = document.getElementById('pageNotice');
      var soundtrackIssues = [];

      var soundtrackArchiveData = null;
      var expandedTapes = Object.create(null);

      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) {
        return SUPABASE_CONFIG.url + '/rest/v1/' + path;
      }

      async function fetchAllRows(path, useAuth) {
        var PAGE = 1000;
        var all = [];
        var headersFor = useAuth ? authHeaders : anonHeaders;
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: headersFor({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function patchRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'PATCH',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;

        if (!row) throw new Error('Nothing was updated — sign in again and retry.');
        return row;
      }

      async function runTally(sinceIso) {
        try {
          var res = await fetch(
            restUrl('soundtrack?select=city_slug&created_at=gte.' + encodeURIComponent(sinceIso)),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) return '';
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return '';
          var byCity = Object.create(null);
          rows.forEach(function (r) {
            var slug = text(r && r.city_slug);
            if (!slug) return;
            byCity[slug] = (byCity[slug] || 0) + 1;
          });
          return Object.keys(byCity)
            .sort(function (a, b) {
              return byCity[b] - byCity[a] || soundCityLabel(a).localeCompare(soundCityLabel(b));
            })
            .map(function (slug) {
              return soundCityLabel(slug) + ' ' + byCity[slug]
                + ' track' + (byCity[slug] === 1 ? '' : 's');
            })
            .join(', ');
        } catch (error) {
          return '';
        }
      }

      async function deleteRow(path) {
        var res = await fetch(restUrl(path), { method: 'DELETE', headers: authHeaders({}) });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Delete failed: ' + res.status + ' ' + detail);

        return true;

      var adminAuth = window.TgbMcAdminAuth.create({

      function tabsOf(strip) {
        return strip ? Array.prototype.slice.call(strip.querySelectorAll('.queue-tab')) : [];
      }

      function selectTab(strip, value) {
        tabsOf(strip).forEach(function (tab) {
          var on = (tab.dataset.tab || '') === value;
          tab.classList.toggle('is-active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');

        tabsOf(strip).forEach(function (tab) {
          var key = tab.dataset.tab || '';

          var el = tab.querySelector('.queue-tab-count');
          if (el) el.textContent = String(n);
          tab.classList.toggle('is-empty', n === 0);
          tab.classList.toggle('has-work', n > 0);

        if (!strip) return;

        if (!archiveExpandBtn) return;
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        archiveExpandBtn.disabled = !groups.length;

        archiveExpandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        archiveExpandBtn.title = allOpen ? 'Close every tape' : 'Open every tape';
      }
      function text(value) {
        return String(value == null ? '' : value).trim();
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();
        return !!v && ['false', 'f', 'no', 'n', '0'].indexOf(v) === -1;

        return truthyFlag(song && song.archived);

        return isArchivedSong(song) ? 'SHELVED' : 'LIVE';
      }

      var STATUS_LABEL = { LIVE: 'Live', SHELVED: 'Shelved' };
      var STATUS_VERB = { LIVE: 'Live', SHELVED: 'Shelve' };

      function emptyNode(message) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.textContent = message;
        return div;
      }

        var span = document.createElement('span');
        span.className = 'chip' + (tone ? ' ' + tone : '');
        span.textContent = label;
        return span;
      }

      function actionLink(href, label, external) {
        var a = document.createElement('a');
        a.className = 'btn small';
        a.href = href;
        a.textContent = label;
        if (external) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

        return a;

      function setArchiveStatus(message, tone) {
        if (!trackArchiveStatus) return;
        trackArchiveStatus.textContent = message || '';

        trackArchiveStatus.classList.toggle('is-success', tone === 'success');
        trackArchiveStatus.classList.toggle('is-warn', tone === 'warn');

      function setNotice(message, tone) {
        if (!pageNotice) return;
        window.clearTimeout(noticeTimer);
        pageNotice.textContent = message || '';

        if (message && tone !== 'error' && tone !== 'hold') {
          noticeTimer = window.setTimeout(function () {

            if (pageNotice.textContent === message) pageNotice.textContent = '';
          }, 6000);
        }
      }

      function resetSoundtrackArchive() {
        soundtrackArchiveData = null;
        trackStatusFilter = '';
        selectTab(trackStatusTabs, '');

        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Sign in to manage tapes and tracks.'));
        }
        setArchiveStatus('Waiting for sign-in.', '');
        setNotice('', '');
        soundtrackIssues = [];
        focusSongId = null;
      }

      var ISSUE_KIND_LABEL = {
        spotify: 'Spotify ID',
        spelling: 'Spelling',
        relevance: 'Relevance',
        facts: 'Facts'
      };

      function openIssues() {
        return Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
      }

      // A SLUG FROM A TYPED LABEL. With no catalogue to look one up in, a city
      // this room has never held has to be derived, and the rule is the one
      // `public.cities` itself uses: the city NAME only, lowercased, hyphenated.
      // "St. Louis, Missouri" gives `st-louis`, which is the slug already filed.
      function slugFromLabel(label) {
        var name = text(label).split(',')[0];
        return name.toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function cityByLabel(label) {
        var want = text(label).toLowerCase();
        if (!want) return null;
        var hit = null;
        Object.keys(cityMap).forEach(function (slug) {
          if (hit) return;
          var row = cityMap[slug];
          var canonical = text(row.city).toLowerCase();
          if (canonical === want || canonical.split(',')[0].trim() === want) hit = row;
        });
        return hit;
      }

      function paintCityOptions() {
        var list = document.getElementById('cityOptions');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(cityMap).sort().forEach(function (slug) {
          var row = cityMap[slug];
          // NO `hide_from_soundtracks` TEST ANY MORE. That flag lives on
          // public.cities, which this room no longer reads, and every city in
          // this map already holds a tape -- so a venue town could only appear
          // here by already having one.

          var opt = document.createElement('option');
          opt.value = text(row.city);

          var held = soundtracks().filter(function (t) { return text(t.city_slug) === slug; }).length;
          if (held) opt.label = text(row.city) + '  (' + held + (held === 1 ? ' tape' : ' tapes') + ' already)';
          list.appendChild(opt);
        });
      }

      async function moveTapeToCity(tapeId, toSlug, label) {
        var tape = tapeById(tapeId);
        if (!tape) return false;
        var fromSlug = text(tape.city_slug);
        try {

          // A TAPE IS EVERY ROW OF IT NOW, so moving one is a write across all
          // of them and goes through the function that scopes it.
          // THE LABEL TRAVELS WITH THE SLUG. `city` lives on the row now, so a
          // move that sent only the slug would leave every row wearing the old
          // city's name, which is the half a human actually reads.
          var to = (label && label.city) ? label : cityMap[toSlug];
          await callRpc('tgb_rename_tape', {
            p_city: fromSlug, p_tape: tape.spine_tag || '',
            p_new_city: toSlug, p_new_tape: null,
            p_new_label: to && to.city ? to.city : toSlug,
            p_state_code: to ? (to.state_code || null) : null,
            p_state_name: to ? (to.state_name || null) : null,
            p_country_code: to ? (to.country_code || null) : null,
            p_country_name: to ? (to.country_name || null) : null
          });
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(fromSlug)), 'error');
          return false;
        }
        tape.city_slug = toSlug;
        (tape.songs || []).forEach(function (song) { song.city_slug = toSlug; });
        paintCityOptions();
        renderTrackArchive('moved the tape from ' + cityFullLabel(fromSlug)
          + ' to ' + cityFullLabel(toSlug), 'success');
        return true;
      }

      function issueAsPrompt(issue) {

        if (song) {

            : 'none, which is allowed'));

          L.push('');
          L.push('## RULES, ALL OF WHICH ARE ENFORCED SOMEWHERE');

          L.push('  LENGTH: four true words beat eight padded ones. Never lengthen a blurb that is fine.');

          L.push('- The track must have a genuine tie to ' + cityFullLabel(issue.city_slug) + '. If it has');
          L.push('  none, the fix is not an edit: say the track should be shelved by a human and return');
          L.push('  no SQL.');
          L.push('- Never propose a track with the word KARAOKE anywhere in it, in any field or casing.');
        } else {
          var tapeTally = tape ? tapeCounts(tape) : { LIVE: 0, SHELVED: 0 };
          var liveCount = tapeTally.LIVE;

          L.push('Scope: the whole tape, not one track.');

          L.push('   ]}]\'::jsonb);');

          L.push('');

          L.push(isEmpty
            ? '- PROPOSE EXACTLY 5 SONGS. This tape has no live songs, and an empty tape gets five'

                + liveCount + ' live to 15'));

            ? '  rather than fifteen, so a human can judge whether the city is worth filling before'
            : '  live. Songs still shelved do not count toward that figure, so do not read the tape');
          L.push(isEmpty
            ? '  reading fifteen blurbs. Not 6, not 15. This overrides every other count here.'
            : '  as fuller than the number above says.');

          L.push('  lyrics, a hometown artist, recorded there, or genuinely used by the city\'s teams.');
          L.push('  Verify a stadium or fight song is actually that team\'s before claiming it.');
          L.push('- Max 2 songs per artist across the tape, counting what is already there.');
          L.push('- Every song needs a blurb: 10 words or fewer, no trailing period, city-specific.');
          L.push('- NEVER invent a spotify_id. Omit the field entirely rather than guess; a fabricated');
          L.push('  22-character id passes every check and then plays nothing.');
          L.push('- Never propose a track with the word KARAOKE anywhere in it, in any field or casing.');
          L.push('- Real commercial recordings only. No tribute, sped-up, slowed or re-recorded versions.');
        }

        L.push('- NO EM DASHES anywhere in what you hand back, in the SQL or around it. Not the');
        L.push('  character and not the entity. Use a comma, a colon, a semicolon or brackets. It is');
        L.push('  the clearest single tell that a machine wrote the line, and this text goes on a');
        L.push('  public page under our name.');
        L.push('');
        L.push('Return the SQL only. A human runs it in the Supabase SQL editor; you have no access.');
