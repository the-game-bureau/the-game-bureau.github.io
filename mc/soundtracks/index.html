<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TAPE ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      /* 1,400px, NOT 1,180. Measured rather than felt: the VIEW bar now carries
         the pager, four filters and four doors, which need about 1,089px, and
         ADD's two buttons want about 380 more. At 1,180 the row left ADD 47px
         and clipped both its buttons to nothing. This is the room with the
         widest table on the site -- twelve columns at 14pt -- and it is the one
         page here that has earned a frame of its own. */
      --mc-shell-width: 1400px;

      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.05);
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      outline: none;
    }

    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* THE ONE RED BUTTON IN THE ROOM. Outlined rather than filled: it is a door
       to somewhere, not the action the room is for, and a filled red button
       beside four white ones reads as a warning about pressing it. */
    .btn--issues {
      border-color: var(--bic-red);
      color: var(--bic-red);
    }

    .btn--issues:hover {
      border-color: var(--bic-red);
      background: var(--bic-red);
      color: #fff;
    }

    .btn:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      background: rgba(var(--bic-blue-rgb), 0.05);
    }

    .btn.primary:hover {
      background: #24396a;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #24396a;
      color: #fff;
    }

    .btn[disabled] {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      cursor: default;
      opacity: 1;
      pointer-events: none;
    }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .command-bar > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;

      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto var(--stack-gap);
    }

    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    /* ADD TAKES THE SLACK; the two on its right stay their own width. */
    /* THE TAPE NAV IN THE VIEW BAR. Square end caps and the count between
       them, so the pair reads as one control with two ends. */
    .tape-step {
      min-width: 34px;
      padding: 0 8px;
      font-size: 1rem;
      line-height: 1;
    }

    /* NO PULL BETWEEN THE ARROWS. They stopped being adjacent when the count
       moved between them; a negative margin would drag it under one. */
    .tape-step[disabled] { opacity: 0.35; cursor: default; }

    .tape-where {
      font: 500 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* A hairline marking where the room's own navigation stops and the places
       you leave for begin. */
    .bar-sep {
      width: 1px;
      align-self: stretch;
      min-height: 26px;
      margin: 0 2px;
      background: var(--control-line);
    }

    .command-bar--view,
    .command-bar--filter,
    .command-bar--nav { flex: 0 0 auto; }
    @media (max-width: 720px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
      .bar-row .command-bar--view,
      .bar-row .command-bar--filter,
      .bar-row .command-bar--nav { flex: 1 1 100%; }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .room-head .room-blurb { max-width: none; }

    /* ── ONE SIZE AND ONE COLOUR UNDER THE ROOM'S NAME ──────────────────────
       The catalogue figures, the line about the tape you are on, and the
       room's standing sentence were three sizes and three colours: 0.72rem
       muted mono with `--ink` on the live counts, against 0.95rem muted prose.
       Three treatments for three lines that are read as one block.

       0.95rem IS THE LARGEST OF THEM, so it is the one they all take: setting
       them to the smallest would have shrunk the only line anybody reads as a
       sentence.

       BLACK, NOT `--muted`. These are statements about what you are looking at,
       not chrome, and the muted blue put them a shade away from the room name
       above them without making them quieter in any useful way.

       IT HAS TO OUT-SPECIFY `admin-shell.css`, which is linked AFTER this
       page's own <style> and sets `.room-blurb` at 0.95rem/`--muted`. Hence
       `.room-head` in front of every selector.

       THE SCRIBBLE IS DELIBERATELY NOT IN HERE. It lives in the same column and
       is the room's error channel: it is a red pen whatever the news is. */
    /* ── ONE SIZE AND ONE COLOUR UNDER THE ROOM'S NAME ──────────────────
       The catalogue figures, the line about the tape you are on and the room's
       standing sentence were three sizes and three colours. They are read as
       one block, so they are set as one: **0.95rem, the largest of the three**,
       and black.

       BLACK RATHER THAN `--muted`: these are statements about what you are
       looking at, not chrome.

       THE SCRIBBLE IS DELIBERATELY OUT OF IT. It sits in the same column and is
       the room's error channel: a red pen whatever the news is. */
    .room-head .room-blurb { color: #000; }

    .btn.is-stale {
      border-color: rgba(194, 55, 55, 0.5);
      color: var(--bic-red);
    }

    .btn.is-stale:hover {
      border-color: var(--bic-red);
      background: rgba(194, 55, 55, 0.07);
    }

    .chip.warn {
      border-color: rgba(154, 74, 24, 0.28);
      background: rgba(154, 74, 24, 0.08);
      color: #9a4a18;
    }

    .chip.success {
      border-color: rgba(47, 107, 61, 0.28);
      background: rgba(47, 107, 61, 0.08);
      color: var(--success);
    }
    @media (max-width: 840px) {

      .tool-modal-panel > .panel-head {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }

      .tool-modal-panel > .panel-head .panel-title { flex: 1 1 100%; }
    }

    @media (max-width: 840px) {

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head-actions .btn,
      .panel-head-actions select,
      .command-bar .btn {
        flex: 1 1 auto;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a { color: var(--accent); }

    /* THE COLUMNS ARE DECLARED ON THE LIST, ONCE, AND BOTH THE HEADER AND THE
       ROWS READ THEM FROM HERE. They used to be written out on `.track-head`,
       on `.track-line--in-list` and on `.track-lines` -- three copies of one
       string, and this file already warned that missing one puts every label a
       column away from the field it names. Inherited from the container they
       cannot differ, because there is only one of them. */
    .tape-lines {
      display: grid;
      gap: 6px;
      --track-cols: 30px 48px 32px 48px minmax(0, 2fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 130px 82px 74px 196px 32px;
    }

    .tape-lines {
      --col-label: 0.68rem;
      --col-value: 0.78rem;
      --col-text: 0.78rem;
    }


    /* ── THE SELECTION ──────────────────────────────────────────────────── */

    /* THE TICK ON A BADGE. Its header twin went with the header row; the
       select-all lives in NAV and is styled there. */
    .track-pick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .track-pick-box { cursor: pointer; }

    /* THE BATCH DIALOG. It borrows the room's own panel; only its own pieces are
       set here. `section.tool-modal-panel:not([hidden])` elsewhere in this sheet
       is what makes `hidden` win over the panel's `display: flex` -- without the
       `:not`, this dialog would be open on load. */
    .bulk-words { margin: 0; font-size: 0.95rem; line-height: 1.45; }

    /* THE IRREVERSIBLE BUTTON IS THE RED ONE, and it is never the primary. */
    #bulkCard .btn.warn { border-color: var(--bic-red); color: var(--bic-red); }
    #bulkCard .btn.warn:hover { background: var(--bic-red); color: #fff; }
    #bulkCard .prompt-foot,
    #trackDelCard .prompt-foot { display: flex; flex-wrap: wrap; gap: 8px; }
    #trackDelCard .btn.warn { border-color: var(--bic-red); color: var(--bic-red); }
    #trackDelCard .btn.warn:hover { background: var(--bic-red); color: #fff; }

    /* THE HEADER'S OWN CONTROL CELLS WENT ON 2026-08-26, with the tape switch,
       the X and then the two flag filters. It labels its columns and holds the
       tick and the batch button; it narrows and writes nothing.

*/
    /* THE BADGE LEADS THE ROW and holds a fixed width whether or not it has a
       badge in it, so the rows below it line up down the left edge. */
    .track-line-new {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      min-width: 42px;
    }


    .tape-line-name {
      min-width: 0;
      color: var(--muted);
      /* NOT `anywhere`. It broke "Akron" into "Akro" and "n" the moment the
         column got tight, which reads as a rendering fault rather than a wrap.
         A name may wrap BETWEEN its two halves and never inside a word. */
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .tape-new {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 999px;

      background: var(--success, #2f855a);
      color: #fff;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      cursor: help;
      white-space: nowrap;
    }


    /* THE FILTERS ARE BUTTONS. They sit in a folder tab beside ADD and VIEW,
       whose contents are all `.btn`, so anything else in there reads as a
       different kind of control. They take `.btn` itself and add only what a
       filter needs: the count, and a pressed state. */
    .head-figure--filter {
      position: relative;
      gap: 7px;
      font-size: 0.72rem;
    }

    /* PRESSED IS THE ROOM'S OWN PRIMARY FILL, the same one Save and Add wear,
       so a filter that is on is unmistakable at a glance. `aria-pressed` is not
       available on a label, so the state is the class plus the checkbox inside
       it, which is what a screen reader reads. */
    .head-figure--filter.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* THE POPUP'S OWN DECLARATION, ON THE ONE ELEMENT THAT CONTAINS BOTH its
       header and its rows. It was on `.track-head, .track-lines`, which also
       matched the MAIN list's header -- so that header took its columns from
       here while the rows under it took theirs from `.tape-lines`, two copies
       that had to be kept identical by hand. There is now one declaration per
       list and neither header can drift from its own rows. */
    .tracks-body {
      --track-cols: 30px 48px 32px 48px minmax(0, 2fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 130px 82px 74px 196px 32px;
    }

    section.tool-modal-panel#tracksCard:not([hidden]) {
      display: flex;
      flex-direction: column;
      max-height: min(88vh, 900px);
    }

    #tracksCard .panel-head,
    #tracksCard .prompt-foot { flex: 0 0 auto; }

    #tracksCard .tracks-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;

      padding: 0 2px 4px;
    }

    .track-head { box-shadow: 0 6px 10px -8px rgba(16, 24, 40, 0.35); }

    #tracksTitle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      min-width: 0;
    }

    #tracksTitle .tape-name-editor {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    #tracksTitle .city-input,
    #tracksTitle .spine-input {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .tracks-sub {
      margin: 3px 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--track-cols);
      /* THE SAME HORIZONTAL PADDING AND THE SAME COLUMN GAP AS A TRACK ROW.
         `.track-line` is `3px 9px` with an 8px gap; at 10px and a 4px gap the
         header's eleven columns started a pixel out and drifted from there. The
         VERTICAL padding is still the header's own -- it is a bar, not a row. */
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 6px;
      padding: 8px 9px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* THE LABEL'S PADDING IS THE FIELD'S PADDING. `.track-input` is `2px 6px`;
       at 7px every label sat a pixel off the value under it, which over eleven
       columns reads as the header being out of step rather than as one pixel. */
    .track-head-label {
      min-width: 0;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-head-label--mid { padding: 0; text-align: center; }



/* THE FILTER RADIOS. Five labelled options, exactly one on, which is what
       "one filter at a time" means said in the control rather than enforced
       between three of them. */
    .track-filters {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: stretch;
      gap: 0;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .track-filter {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 9px;
      min-height: 42px;
      cursor: pointer;
      border-right: 1px solid var(--control-line);
      background: #fff;
      transition: background 120ms ease, color 120ms ease;
    }

    .track-filter:last-child { border-right: 0; }
    .track-filter:hover { background: rgba(var(--bic-blue-rgb), 0.06); }

    /* THE CHOSEN ONE IS THE ROOM'S PRIMARY FILL, the same one Save and Add wear,
       so a filter that is ON reads the way every pressed control here does. */
    .track-filter.is-on { background: var(--accent); }
    .track-filter.is-on .track-filter-word { color: #fff; }

    .track-filter-word {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
    }

    /* THE DOT STAYS VISIBLE. A radio drawn only as a filled segment is a
       segmented button, and this is a radio group: the input is what says so to
       a screen reader and it should say so on screen too. */
    .track-filter input { margin: 0; cursor: pointer; }



    /* LITTLE BITTY. These are the two narrowest columns on the row and they now
       hold a word rather than a letter, so the label is set below the rest of
       the header. It is not something you read, it is something you glance at
       to tell two checkboxes apart. */
    .track-head-label--tiny {
      font-size: 0.5rem;
      letter-spacing: 0.04em;
    }

    #trackAirAll { justify-self: center; }

    .track-lines { display: grid; gap: 6px; }

    /* ONE TRACK ROW, ONE SIZE. The main list and the popup draw the same row,
       so they are measured the same: trimming this for the list alone made the
       two disagree about how tall a track is.
       TRIMMED AROUND THE BLURB, NOT INSTEAD OF IT. The blurb still grows to its
       content, which is what a row's height really follows; everything around
       it is as tight as it can be without the fields becoming hard to hit. */
    /* ── THE BADGE ───────────────────────────────────────────────────────────
       A track is a CARD, not a row in a grid. Twelve columns gave a title, a
       checkbox and a delete button the same weight, and the whole thing was only
       legible against a header that no longer exists.

       THREE PARTS, EACH ANSWERING ONE QUESTION:
         RAIL   what you do with it
         BODY   what it IS
         TAIL   what we know about it                                       */
    .track-line {
      position: relative;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) minmax(0, 330px);
      align-items: center;
      gap: 0 16px;
      padding: 12px 16px 12px 12px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 14px;
      background: #fff;
      /* THE LEFT EDGE IS THE STATE. Four pixels of colour, so a shelved track
         and a live one are told apart down the whole list without reading a
         word. It is an inset shadow rather than a border so the radius stays
         round at the corner. */
      box-shadow: inset 4px 0 0 0 var(--control-line),
                  0 1px 2px rgba(16, 24, 40, 0.05);
      transition: box-shadow 140ms ease, transform 140ms ease, border-color 140ms ease;
    }

    .track-line.is-live {
      box-shadow: inset 4px 0 0 0 var(--success),
                  0 1px 2px rgba(16, 24, 40, 0.05);
    }

    .track-line:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.45);
      box-shadow: inset 4px 0 0 0 var(--accent),
                  0 6px 16px -8px rgba(16, 24, 40, 0.35);
    }

    /* A SHELVED BADGE IS QUIETER, NOT HIDDEN. It is most of the catalogue, so
       it has to stay readable; what it loses is prominence. */
    .track-line.is-shelved { background: #fcfcfd; }
    .track-line.is-shelved .badge-body { opacity: 0.82; }
    .track-line.is-shelved:hover .badge-body { opacity: 1; }

    /* ── RAIL: tick, play, and the popup's tape position ── */
    .badge-rail {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    /* THE PLAY BUTTON IS THE BADGE'S ONE ROUND THING, which is what makes it
       findable at a glance in a list of squares. 38px is a comfortable target
       and still smaller than the title beside it. */
    .badge-play {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      color: var(--accent);
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease,
                  border-color 140ms ease, transform 140ms ease;
    }

    .badge-play svg { width: 20px; height: 20px; display: block; }

    .badge-play:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: scale(1.06);
    }

    .badge-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* PLAYING IS FILLED AND STAYS FILLED, so the one track making a noise is
       obvious without opening anything. */
    .badge-play.is-playing {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* THE POSITION IS THE TRACK NUMBER ON THE TAPE, so it is set like one:
       tabular, quiet, and it does not look like a field until you reach it. */
    .track-input--num {
      flex: 0 0 auto;
      width: 34px;
      padding: 2px 0;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* ── BODY: what the track is ── */
    .badge-body {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    /* THE TITLE IS THE BADGE'S HEADLINE and is set like one. Everything else in
       the body is context for it. */
    .track-input--title {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .track-input--artist { font-size: 0.86rem; color: var(--muted); }

    textarea.track-input--blurb {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ── TAIL: what we know about it ── */
    .badge-tail {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: end;
      gap: 6px;
      min-width: 0;
    }

    .badge-flags { display: flex; align-items: center; gap: 6px; }

    /* THE TWO FLAGS ARE PILLS, so an unticked one is a quiet outline and a
       ticked one is a filled mark you can see from across the list. */
    .track-explicit {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 7px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .track-explicit:hover { border-color: var(--accent); }
    .track-explicit:has(input:checked) {
      background: rgba(var(--bic-blue-rgb), 0.1);
      border-color: var(--accent);
    }
    .track-explicit:has(input:checked) .track-flagword { color: var(--accent); }

    .track-flagword {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
    }

    /* THE SPOTIFY ID IS THE QUIETEST THING ON THE BADGE. It is 22 characters of
       machine text nobody reads; it is here to be pasted into and checked. */
    /* THE BOX AND ITS BUTTON ARE ONE CELL, so the button cannot drift away
       from the field it fills when the row narrows. */
    .track-idcell { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .track-idcell .track-input--id { flex: 1 1 auto; min-width: 0; }

    /* QUIET UNTIL IT IS WANTED. It sits on every row and most rows already have
       an id, so at rest it is an outline and nothing more.

       IT IS THE THIRD EXCEPTION to the rule that no child of a track row
       declares its own size, and it is the flag words' exception exactly: a
       CONTROL carrying a three-letter label rather than a field carrying a
       value. At the row's 14pt it would be the loudest thing on the row sitting
       beside the quietest. The check in the harness names it. */
    .track-lookup {
      flex: 0 0 auto;
      padding: 2px 6px;
      border: 1px solid var(--control-line);
      border-radius: 5px;
      background: #fff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
    }

    .track-lookup:hover,
    .track-lookup:focus-visible { border-color: var(--bic-blue); color: var(--bic-blue); }
    .track-lookup[disabled] { opacity: 0.55; cursor: progress; }

    .match-list { display: flex; flex-direction: column; gap: 6px; }

    .match-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .match-row:hover,
    .match-row:focus-visible { border-color: var(--bic-blue); background: rgba(45, 72, 128, 0.05); }
    .match-main { font-weight: 700; color: #000; }
    .match-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .track-input--id {
      width: 100%;
      max-width: 260px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      color: var(--muted);
      text-align: right;
    }

    .track-input--id:focus { text-align: left; }

    /* THE NEW BADGE PINS TO THE CORNER, because it is news about the row rather
       than a column that is empty on 1,600 of 1,643 of them. */
    .track-line-new {
      position: absolute;
      top: -8px;
      left: 12px;
      z-index: 2;
    }

    /* ── THE PLAYER DIALOG ── */
    .player-stage { min-height: 152px; }
    .player-stage iframe { width: 100%; height: 152px; border: 0; border-radius: 12px; }


    .track-line.is-shelved {
      border-style: dashed;
      opacity: 0.62;
    }
    .track-line.is-shelved:hover,
    .track-line.is-shelved:focus-within { opacity: 1; }

    .track-line.is-live { box-shadow: inset 3px 0 0 var(--success, #2f855a); }


    .track-line.is-focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.18);
    }

    /* THE INLINE STAGE WENT WITH THE INLINE PLAYER on 2026-08-26. `trackPlayer`
       still builds `.queue-player` and `.queue-noplayer`; they are drawn in the
       DIALOG now, so their rules moved with them and are scoped to it. */
    #playerStage .queue-player {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: 12px;
    }

    #playerStage .queue-noplayer {
      display: grid;
      gap: 8px;
      justify-items: start;
      padding: 16px;
      border: 1px dashed var(--control-line);
      border-radius: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .track-input {
      width: 100%;
      min-width: 0;
      min-height: 26px;
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }

    .track-input:hover { border-color: var(--control-line); }
    .track-input:focus { border-color: var(--accent); background: #fff; outline: none; }

    .track-input--num { text-align: center; font-family: "IBM Plex Mono", monospace; }
    .track-input--id { font-family: "IBM Plex Mono", monospace; }
    .track-input--title { font-weight: 700; }

    .track-input--blurb::placeholder { color: var(--bic-red, #c23737); opacity: 0.8; }

    textarea.track-input--blurb {
      /* NEVER A SCROLLBAR, AND NOTHING TO DRAG. The box is sized to its content
         by `grow()` on every render, so a scrollbar could only ever mean the
         sizing had failed -- and for a while it did, permanently. */
      resize: none;
      overflow: hidden;
      /* THE ONE CHILD OF A TRACK ROW WITH A SIZE OF ITS OWN, and it is earned:
         the blurb column is about 139px and this is the only field that WRAPS,
         so at the row's 14pt it was three or four words a line and it alone set
         every row's height. Everything else on the row shrinks to fit its column
         instead; a wrapping box cannot. */
      font-size: 0.72rem;
      line-height: 1.28;
      padding-top: 2px;
      padding-bottom: 2px;

      min-height: 30px;
    }

    /* NOT EVEN ON FOCUS. `overflow: auto` here was the other half of the
       scrollbar: the box you are typing in is the one that most needs to show
       all of itself. */

    .track-input--id::placeholder { color: var(--muted); opacity: 0.75; }

    .track-explicit { display: flex; align-items: center; justify-content: center; }

    /* THE WORD BESIDE THE BOX. The header that named these two columns is gone,
       so each box carries its own name -- little bitty, because it is not
       something you read, it is something you glance at to tell two checkboxes
       apart. It is the size the header's own labels were. */
    .track-flagword {
      font-size: 0.5rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
    }

    .track-explicit { gap: 4px; justify-content: flex-start; padding-left: 4px; }

    /* SELECT ALL SAYS WHAT IT SELECTS. One tick in a bar of worded buttons is a
       control with no name; `All` is the shortest true one. */
    .view-pick { gap: 5px; }

    .view-pick-word {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      user-select: none;
    }


    .track-del {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin: 0 auto;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }

    .track-del:hover { border-color: var(--bic-red); color: var(--bic-red); background: rgba(194, 55, 55, 0.08); }
    .track-del:focus-visible { outline: 2px solid var(--bic-red); outline-offset: 1px; }

    /* IT IS A GRID OF `1fr auto 1fr` and its words are as wide as they are, so
       in a column narrower than its content it overflowed both ways -- which is
       what put SHELVED across the S column beside it. It is centred in its own
       cell and clips rather than spilling. */
    .track-air {
      transform: scale(0.86);
      transform-origin: center;
      justify-self: center;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }


    /* THE X IS OFF, NOT ABSENT, WITH NOTHING TICKED. A control that vanished
       would move the ones beside it, so the position of the one you want would
       depend on the state of the selection. It stays pressable so it can say
       why it is off -- on a touch screen there is no tooltip to hover. */
    .track-del.is-off { opacity: 0.3; cursor: help; }
    .track-del.is-off:hover { border-color: transparent; color: inherit; background: transparent; }

    .track-del.is-armed {
      border-color: var(--bic-red, #c23737);
      background: var(--bic-red, #c23737);
      color: #fff;
    }

    .track-confirm {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      padding: 8px 10px;
      border: 1px dashed var(--bic-red, #c23737);
      border-radius: 7px;
      background: rgba(194, 55, 55, 0.06);
      font-size: 0.85rem;
    }

    .track-confirm p { margin: 0; flex: 1 1 260px; min-width: 0; }
    .track-confirm strong { color: var(--bic-red, #c23737); }

    .issue-foot-note {
      flex: 1 1 100%;
      margin: 0 0 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .tape-line-name.is-empty { opacity: 0.55; font-style: italic; }

    .tape-line-name {
      display: flex;
      align-items: baseline;
      /* WRAPS NOW. With the city held on one line, a long spine phrase drops
         under it instead of squeezing the name it belongs to. */
      flex-wrap: wrap;

      gap: 0.32em;
      min-width: 0;
    }

    .city-input {

      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      font: inherit;
      font-weight: 700;
      color: inherit;
      text-decoration: underline dotted rgba(var(--bic-blue-rgb), 0.35);
      text-underline-offset: 3px;
    }

    .city-input::-webkit-calendar-picker-indicator {
      display: none !important;
    }

    .city-input:hover { border-color: var(--control-line); background: #fff; text-decoration: none; }
    .city-input:focus { border-color: var(--accent); background: #fff; outline: none; text-decoration: none; }
    .city-input.is-saving { opacity: 0.5; }

    .spine-flip {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 5px;
      background: #fff;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .spine-flip:hover { border-color: var(--accent); color: var(--ink); }
    .spine-flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .spine-flip:disabled { opacity: 0.5; cursor: progress; }

    .spine-input {
      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      font: inherit;
      color: inherit;

      text-decoration: underline dotted rgba(var(--bic-blue-rgb), 0.35);
      text-underline-offset: 3px;
    }

    .spine-input:hover {
      border-color: var(--control-line);
      background: #fff;
      text-decoration: none;
    }

    .spine-input:focus {
      border-color: var(--accent);
      background: #fff;
      outline: none;
      text-decoration: none;
    }

    .spine-input.is-saving { opacity: 0.5; }

    .spine-input::placeholder { color: var(--muted); opacity: 0.5; font-style: italic; }

    .bot-field { display: grid; gap: 4px; }

    .bot-field > span {
      font: 700 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bot-input {
      font: 500 0.98rem/1.3 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      padding: 9px 10px;
      width: 100%;
    }

    .bot-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .bot-hint {
      margin: 10px 0 0;
      font: 500 0.86rem/1.45 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
    }

    .bot-hint b { color: var(--ink); font-weight: 700; }

    /* WHAT THE TAPE HOLDS, right after its name. Sized to its content so it
       sits with the name rather than being pushed away from it. */
    .tape-line-counts {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      font: 500 0.74rem/1.2 "IBM Plex Mono", monospace;
      color: var(--muted);
    }

    .tape-line-figure { font-weight: 700; color: var(--muted); }

    /* THE LIVE FIGURE IS THE ONE YOU ACT ON, so it is the only one in ink, and
       a live count of zero is not good news and does not wear the green. */
    .tape-line-figure.is-live { color: var(--success); }
    .tape-line-figure.is-none { color: var(--muted); }
    .tape-line-figure-word { opacity: 0.75; }
    .tape-line-figure-sep { opacity: 0.5; }

    .tape-line-counts strong { color: var(--ink); font-weight: 700; }


    /* THE TRACK BADGES ON THE MAIN LIST. The popup still uses the wider editor
       row; this surface is for scanning a tape at web size. */
    #trackArchiveList.tape-lines {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      gap: 14px;
    }

    #trackArchiveList > .empty {
      grid-column: 1 / -1;
      padding: 18px 20px;
      border: 1px dashed var(--control-line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-weight: 700;
    }

    .track-line--in-list {
      margin-bottom: 2px;
      border-color: var(--cut-panel-line);
    }

    #trackArchiveList .track-line.track-line--in-list {
      --track-text: 0.86rem;
      --badge-state: var(--control-line);
      --badge-warm: #d99a36;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      /* FOUR ROWS NOW: the tape's name, the rail, the body, the tail. */
      /* FIVE ROWS: the header, the blurb, the rail, the tape line, the tail.
         THE BLURB TAKES THE FLEXIBLE ONE, being the only field that grows: slack
         in a 258px badge goes to the sentence rather than to white space under
         the buttons. */
      grid-template-rows: auto minmax(0, 1fr) auto auto auto;
      align-items: stretch;
      gap: 10px;
      min-height: 258px;
      margin: 0;
      padding: 15px 14px 13px;
      overflow: visible;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.26);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(var(--bic-blue-rgb), 0.11) 0 22%, transparent 22% 100%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(var(--bic-blue-rgb), 0.045));
      box-shadow:
        inset 0 6px 0 var(--badge-state),
        0 10px 22px rgba(var(--bic-blue-rgb), 0.12),
        0 1px 0 rgba(255, 255, 255, 0.9);
    }

    #trackArchiveList .track-line.track-line--in-list::before {
      content: "";
      position: absolute;
      inset: 6px 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--badge-warm), transparent);
      opacity: 0.8;
      pointer-events: none;
    }

    #trackArchiveList .track-line.track-line--in-list.is-live {
      --badge-state: var(--success);
      border-color: rgba(39, 103, 64, 0.34);
      box-shadow:
        inset 0 6px 0 var(--badge-state),
        0 12px 24px rgba(39, 103, 64, 0.14),
        0 1px 0 rgba(255, 255, 255, 0.9);
    }

    #trackArchiveList .track-line.track-line--in-list.is-shelved {
      --badge-state: rgba(var(--bic-blue-rgb), 0.32);
      border-style: dashed;
      opacity: 0.76;
      background:
        linear-gradient(135deg, rgba(var(--bic-blue-rgb), 0.07) 0 22%, transparent 22% 100%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(var(--bic-blue-rgb), 0.035));
    }

    #trackArchiveList .track-line.track-line--in-list:hover,
    #trackArchiveList .track-line.track-line--in-list:focus-within {
      opacity: 1;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow:
        inset 0 6px 0 var(--badge-state),
        0 16px 30px rgba(var(--bic-blue-rgb), 0.18),
        0 0 0 2px rgba(var(--bic-blue-rgb), 0.08);
    }

    #trackArchiveList .track-line.track-line--in-list.is-focused {
      border-color: var(--accent);
      box-shadow:
        inset 0 6px 0 var(--badge-state),
        0 0 0 3px rgba(var(--bic-blue-rgb), 0.16),
        0 16px 30px rgba(var(--bic-blue-rgb), 0.16);
    }

    #trackArchiveList .track-line.track-line--in-list .badge-rail {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding-bottom: 9px;
      border-bottom: 1px dashed rgba(var(--bic-blue-rgb), 0.22);
    }

    #trackArchiveList .track-line.track-line--in-list .badge-play {
      width: 34px;
      height: 34px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(var(--bic-blue-rgb), 0.1);
    }

    #trackArchiveList .track-line.track-line--in-list .track-input--num {
      display: none;
    }

    #trackArchiveList .track-line.track-line--in-list .badge-body {
      align-content: start;
      gap: 1px;
      min-width: 0;
    }

    #trackArchiveList .track-line.track-line--in-list .track-tapegeo,
    #trackArchiveList .track-line.track-line--in-list .track-tapetag {
      font-size: 0.62rem;
    }

    /* THE MASTHEAD: the track title and artist, with DELETE on the same row. */
    #trackArchiveList .track-line.track-line--in-list .badge-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "pick title del";
      align-items: center;
      column-gap: 8px;
      gap: 1px;
      min-width: 0;
      margin: -15px -14px 0;
      padding: 12px 14px 10px;
      border-radius: 7px 7px 0 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      background: linear-gradient(135deg, var(--accent), #203d78);
      color: #fff;
      box-shadow: inset 0 -1px 0 rgba(var(--bic-blue-rgb), 0.24);
    }

    /* THE TICK'S CELL. Named rather than positional, so adding a third thing to
       this header cannot silently push the title into the delete's place. */
    #trackArchiveList .track-line.track-line--in-list .badge-top .track-pick {
      grid-area: pick;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* THE BLURB IS ITS OWN ROW, hard under the header, and the only field on the
       badge that grows. It carries no label because the sentence IS the label:
       nothing else on the card is prose. */
    #trackArchiveList .track-line.track-line--in-list > textarea.track-input--blurb {
      align-self: stretch;
      width: 100%;
      margin: 0;
    }

    #trackArchiveList .track-line.track-line--in-list .badge-top .track-title-line {
      grid-area: title;
      min-width: 0;
    }

    #trackArchiveList .track-line.track-line--in-list .badge-top .track-input {
      color: #fff;
    }

    #trackArchiveList .track-line.track-line--in-list .badge-top .track-input::placeholder {

    #trackArchiveList .track-line.track-line--in-list .badge-top .track-input:hover {

    /* THE NAME IS THE LOUDER HALF and the address the quieter one, which is the

    #trackArchiveList .track-line.track-line--in-list .badge-body .track-tapetag {

    #trackArchiveList .track-line.track-line--in-list .badge-body .track-tapegeo {

    #trackArchiveList .track-line.track-line--in-list .track-title-line {

      }

    @media (max-width: 720px) {

        grid-template-columns: minmax(0, 1fr);

      #trackArchiveList .track-line.track-line--in-list {

    /* `overflow: hidden` IS WHAT KEEPS THE CELL IN ITS COLUMN. The tape's name
       and its country line are both wider than this column at the row's size,
       and without it they ran straight across the artist beside them. */
    /* TINY, AND QUIET. It is context for the line below it, not a heading: at
       any weight it would compete with the title it sits over. */
    .track-tapetag {
      /* TINY. 0.5rem is 8px at a default root, which is below anything else in
         this project: the Socializer's own floor is 0.72rem. It is legible here
         because it is UPPERCASE MONO at weight 700, it is one short line, and
         it is not something you read, it is something you glance at to place a
         row you are already looking at. */
      /* NO SIZE OF ITS OWN. It was 0.5rem, set when this was a glance-at tag
         rather than the tape's name editor; it takes the row's size now. */
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ONE SIZE FOR EVERY WORD ON A TRACK ROW. The row had collected five type
       sizes -- the fields, the position, the tape tag at 0.5rem, the status
       words, the delete -- each set for its own reasons and none of them for
       the row. `--track-text` is the one knob; change it here and the whole row
       follows, in the popup and on the main list alike.
       THE UNIVERSAL SELECTOR IS THE POINT: several children set their own size,
       so anything narrower leaves one of them behind and the row goes back to
       being two sizes. */
    /* ONE SIZE, SET ONCE AND INHERITED. It was `.track-line *`, a blanket rule
       reaching past every child that had an opinion -- which meant it had to
       out-specify each of them, and it lost one tie to `.tape-air-word` and left
       two words behind. The row declares the size and the children simply do not
       declare one, which cannot lose a tie because there is nothing to tie with.
       BIG BY DEFAULT, SMALLER WHEN THE CONTENT NEEDS IT. `shrinkToFit` steps a
       field down until it fits its column, so a long title is readable at 14pt
       and a very long one is readable at 11 rather than clipped at 14. */
    .track-line { --track-text: 14pt; font-size: var(--track-text); }

    /* WHERE THE TAPE IS. Quiet, because it is the same address on every row of
       the tape and you read it once after the song name leads. */
/* THE PLACE LINE IS THREE BOXES. They look like the text they replaced until
       you reach for one -- no border, no fill at rest -- because a tape's own
       address is read far more often than it is corrected. */
    .geo-input {
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: inherit;
      min-width: 2ch;
      padding: 0 2px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
    }

    .geo-input:hover,
    .geo-input:focus {
      border-color: var(--control-line);
      background: #fff;
      outline: none;
    }

    .geo-input::placeholder { opacity: 0.5; }

    .geo-sep { opacity: 0.45; padding: 0 1px; }

    /* THE CITY IN THE TAPE'S NAME IS LOCKED. It is edited on the place line,
       where changing it is plainly a move; a box that looks editable and is not
       is worse than one that says so. */
    .city-input.is-locked {
      cursor: default;
      opacity: 0.75;
      border-color: transparent;
      background: transparent;
    }

    .track-tapegeo {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.75;
    }

    /* NOT IN THE POPUP, for the reason the tape tag is not: there the tape's
       name is the dialog's own title and this would be the same thing said
       twice a few pixels apart. */
    .track-lines .track-tapegeo { display: none; }

    /* THE TAG IS THE NAME EDITOR NOW, so it is a flex row rather than a line of
       text -- and everything inside it inherits the tag's own tiny mono rather
       than the input default, or a track row doubles in height. */
    .track-tapetag {
      display: flex;
      align-items: center;
      gap: 0.3em;
      min-width: 0;
      overflow: hidden;
    }

    .track-tapetag .city-input,
    .track-tapetag .spine-input,
    .track-tapetag .spine-flip {
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      min-height: 0;
      height: auto;
      padding: 0 2px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: inherit;
    }

    /* THE BORDER ONLY APPEARS WHEN YOU REACH FOR IT. Thirty outlined boxes over
       thirty titles is a form, not a list. */
    .track-tapetag .city-input:hover,
    .track-tapetag .spine-input:hover,
    .track-tapetag .city-input:focus,
    .track-tapetag .spine-input:focus {
      border-color: var(--control-line);
      background: #fff;
      outline: none;
    }

    .track-tapetag .spine-flip { cursor: pointer; opacity: 0.5; }
    .track-tapetag .spine-flip:hover { opacity: 1; color: var(--accent); }

    /* NOT IN THE POPUP. There the tape's name is the dialog's own title, so
       this would be the same thing said twice a few pixels apart. */
    .track-lines .track-tapetag { display: none; }

    /* THE TWO STEP BUTTONS ARE THE ROW'S END CAPS. Square, so they read as
       one control each rather than as two more labelled things to consider. */
    /* THE PAIR TOUCHES. Two buttons doing one job, so they read as one
       control with two ends rather than as two separate things. */
    .tape-step {
      flex: 0 0 auto;
      min-width: 26px;
      padding: 0 7px;
      font-size: 0.95rem;
      line-height: 1;
    }

    /* The gap between the pair is the row's gap otherwise, which reads as two
       controls. -6px pulls them together without a wrapper element. */
    /* NO PULL BETWEEN THE ARROWS. They stopped being adjacent when the count
       moved between them; a negative margin would drag it under one. */

    /* IT WEARS `.btn` AND HAS TO UNDO WHAT A `select` BRINGS. A native control
       carries its own font and its own chrome, so without these it reads as a
       different kind of thing from the buttons either side of it.
       CAPPED, BECAUSE THE BAR DOES NOT WRAP. A country name is as long as it is
       and the widest option must not be able to push the doors off the end. */
    .tape-filter {
      flex: 0 1 auto;
      max-width: 26ch;
      padding: 0 26px 0 10px;
      font: inherit;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      appearance: none;
      -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    /* THE OPEN LIST IS DRAWN BY THE BROWSER and inherits none of the above, so
       its own type is set here or the options come back at the page default. */
    .tape-filter option {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: normal;
      text-transform: none;
    }

    /* A CHOSEN FILTER IS A STATE, so it says so the way every pressed control in
       this room says so. */
    .tape-filter:not([data-all]) { border-color: var(--accent); color: var(--accent); }

    /* THE ROOM'S SORT AND FILTER BAR. It was a grid pretending to be a column
       header; with one tape on screen there is nothing up here to align to. */
    /* THE CATALOGUE, UNDER THE ROOM'S NAME. Small mono, one line, the two
       live figures in ink and everything else muted: it is a standing figure,
       read at a glance and not news.
       COUNTED OVER EVERYTHING, never over what the filters have left. */
    .room-stats {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0 6px;
      margin: 3px 0 0;
      /* THE SIZE IS IN A SHORTHAND, so it is changed HERE rather than
         overridden further up: a longhand `font-size` has to beat a `font`
         shorthand, and that is a fight not worth having in three places. */
      font: 500 0.95rem/1.4 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: #000;
      text-transform: uppercase;
    }

    /* THE TAPE'S OWN LINE, quieter than the catalogue's above it: the same kind
       of figure at a narrower scope, and it must not compete with the room's. */
    /* NOT DIMMED. It was 0.9 so the tape's line sat behind the catalogue's;
       they are one block now. */
    .room-stats--tape { opacity: 1; }
    /* THE TAPE'S OWN LINE IS THE SAME BLOCK. `.tape-line-counts` and its
       figures carry their own type and their own three colours -- muted, green
       for the live figure, ink for the strong one -- because the same builder
       draws them elsewhere. Up here they are levelled with everything else
       under the room's name.

       SCOPED TO `.room-stats--tape`, so the builder's own colours survive
       wherever else it is used. */
    .room-stats--tape .tape-line-counts,
    .room-stats--tape .tape-line-counts *,
    .room-stats--tape .tape-line-figure,
    .room-stats--tape .tape-line-figure.is-live,
    .room-stats--tape .tape-line-figure.is-none,
    .room-stats--tape .tape-line-counts strong { font: inherit; color: #000; }

    /* The weights and the quiet separators stay: only size and colour moved. */
    .room-stats--tape .tape-line-figure,
    .room-stats--tape .tape-line-counts strong { font-weight: 700; }
    .room-stats--tape .tape-line-figure-word { opacity: 0.75; }
    .room-stats--tape .tape-line-figure-sep { opacity: 0.5; }

    .room-stats-count { font-weight: 700; }
    .room-stats-count.is-live { color: #000; }
    .room-stats-sep { opacity: 0.7; }
    /* THE WEIGHTS STAY. A figure is still bold and a separator still quiet, so
       the line reads as figures rather than as a sentence; only the size and
       the colour were levelled. */

    /* THE TRACK HEADER ON THE MAIN LIST. It takes its columns from `.tape-lines`
       above it, like the rows do, so the two cannot drift.
       NO LEFT INDENT. It carried `margin-left: 22px`, from when the rows sat
       under a tape line and were indented to read as belonging to it. There is
       no tape line, so the indent was 22px of nothing that made the list
       narrower than the ADD/VIEW bar above it: 1,126px against 1,148px. Both are
       1,148 now, and the two edges line up down the page. */
    .track-head--main {
      margin-bottom: 4px;
    }

    .tape-air {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;

      justify-self: end;
    }

    .tape-air { position: relative; }

    .tape-air-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .tape-air-track {
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 19px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.1);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .tape-air-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 120ms ease, background 120ms ease;
    }

    .tape-air-input:checked + .tape-air-track {
      border-color: var(--success);
      background: var(--success);
    }

    .tape-air-input:checked + .tape-air-track::after {
      background: #fff;
      transform: translateX(15px);
    }

    .tape-air-input:focus-visible + .tape-air-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tape-air-input:disabled + .tape-air-track { opacity: 0.5; cursor: progress; }

    .tape-air-input:indeterminate + .tape-air-track {
      border-color: var(--control-line);
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .tape-air-input:indeterminate + .tape-air-track::after {
      background: var(--muted);
      transform: translateX(7.5px);
    }

    .tape-air--all .tape-air-word { font-weight: 700; }

    .tape-air-word--off { text-align: right; }
    .tape-air-word--on { text-align: left; }

    .tape-air-word { opacity: 0.38; font-weight: 500; }
    .tape-air-word.is-current { opacity: 1; font-weight: 700; }
    .tape-air-word--on.is-current { color: var(--success); }
    .tape-air-word--off.is-current { color: var(--ink); }

    .tape-air-word {
      /* ONE WORD EACH, SO THEY CANNOT WRAP; what they do instead is shrink,
         through the row's own fit pass. Without `nowrap` a narrow cell would
         break SHELVED across two lines and double the row's height. */
      white-space: nowrap;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }


    .app { max-width: var(--mc-shell-width); margin: 0 auto; padding: 16px; }
    .bar-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
    .command-bar { flex: 1 1 240px; margin: 0; padding: 8px; }
    .command-bar-inner { display: flex; flex-wrap: wrap; gap: 6px; }

/* FOUR BOXES ON ONE ROW, AND THE ROW MAY WRAP BETWEEN THEM. Each box keeps
       its own items on one line -- that was the rule and it still holds -- but
       the row itself is allowed to break, because four boxes of real controls
       do not fit 1,368px and the alternative is clipping ADD to nothing again.
       ADD takes the slack; VIEW, FILTER, and NAV are sized to what they hold. */
    .bar-row { flex-wrap: wrap; }
    .bar-row .command-bar-inner { flex-wrap: nowrap; }
    .bar-row .command-bar--add { flex: 1 1 320px; min-width: 0; }

    /* THE WORKING ROW. Select and Filter hold their width; NAV is pushed to the
       far end, so it stays pinned however wide the two before it turn out to be.
       FILTER TAKES THE SLACK, being the box whose one long control -- the place
       picker -- is the only thing here that wants room. */
    .bar-row--work .command-bar--filter { flex: 1 1 auto; min-width: 0; }
    .bar-row--work .command-bar--select { flex: 0 0 auto; }
    .bar-row .command-bar--filter,
    .bar-row .command-bar--nav,
    .bar-row .command-bar--select,
    .bar-row .command-bar--filter,
    .bar-row .command-bar--view { flex: 0 0 auto; }

    /* NAV SITS AT THE FAR END. It is the one box you leave the tape by, and the
       row reads left to right as: put things in, go somewhere, pick, narrow --
       then step. `margin-left: auto` pushes it there, so it stays pinned however
       wide the boxes before it turn out to be. */
    .bar-row .command-bar--nav { margin-left: auto; }
    .bar-row .command-bar--filter .command-bar-inner { flex-wrap: wrap; }
    .bar-row .command-bar--nav .command-bar-inner { flex-wrap: nowrap; }
    .bar-row .command-bar--add .command-bar-inner { min-width: 0; }
    .bar-row .command-bar--add .btn {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    /* SELECT ALL, IN THE FILTER BOX. 30px, and it leads because it acts on
       exactly the list the rest of that box decides. */
    .view-pick {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 42px;
      cursor: pointer;
    }

    /* IT IS OFF, NOT ABSENT, WITH FEWER THAN TWO TICKED, and that is the
       change from the floating version. A button that appeared and disappeared
       moved the tick beside it, so the control you were aiming at depended on
       the state of the selection; holding its place costs the bar a fixed width
       and nothing else.

       `aria-disabled`, NEVER `disabled`. A disabled button dispatches no click
       at all, so on a touch screen -- where there is no hover and therefore no
       tooltip -- the reason it is off would be completely unreachable. Pressing
       it says what to do instead. Same rule the track header's x already keeps. */
    #batchBtn[aria-disabled="true"] {
      opacity: 0.5;
      cursor: help;
      box-shadow: none;
    }


    /* BLACK TEXT IN THE BADGE. Everything here inherited `--ink`, which is the
       room's navy: right for chrome, and on a white card it reads as a tint
       rather than as text. The quiet lines stay quiet by being GREY, not by
       being a lighter blue -- a badge should look printed, not skinned. */
    #trackArchiveList .track-line.track-line--in-list,
    #trackArchiveList .track-line.track-line--in-list .track-input,
    #trackArchiveList .track-line.track-line--in-list .geo-input,
    #trackArchiveList .track-line.track-line--in-list .city-input,
    #trackArchiveList .track-line.track-line--in-list .spine-input {
      color: #000;
    }

    /* THE THREE QUIET LINES: the tape's name, its address, the blurb. Neutral
       grey rather than the muted blue, so the card has one hue in it and it is
       black. */
    #trackArchiveList .track-line.track-line--in-list .track-tapetag,
    #trackArchiveList .track-line.track-line--in-list .track-tapegeo,
    #trackArchiveList .track-line.track-line--in-list .geo-input,
    #trackArchiveList .track-line.track-line--in-list textarea.track-input--blurb,
    #trackArchiveList .track-line.track-line--in-list .track-input--artist {
      color: #3f3f46;
    }

    #trackArchiveList .track-line.track-line--in-list .track-input--title { color: #000; }

    #trackArchiveList .track-line.track-line--in-list .track-flagword { color: #52525b; }

/* THE BADGE YOU WERE SENT TO. Transient, and it rings rather than fills:
       arriving on a track should say WHICH one without changing what it looks
       like, since the next thing you do is read it. */
    #trackArchiveList .track-line.track-line--in-list.is-arrived {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      animation: arrivedPulse 2.6s ease-out 1;
    }

    @keyframes arrivedPulse {
      0%   { outline-color: var(--accent); }
      70%  { outline-color: var(--accent); }
      100% { outline-color: transparent; }
    }

    /* A LINK MUST NOT BE THE ONE THING THAT MOVES. Somebody who has asked for
       less motion still gets the ring, just not the fade. */
    @media (prefers-reduced-motion: reduce) {
      #trackArchiveList .track-line.track-line--in-list.is-arrived { animation: none; }
    }

    /* THE PHONE IS THE ESCAPE HATCH. Two bars on one line is not something
       390px can hold, so there they stack and wrap as they did. */
    @media (max-width: 720px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar-inner { flex-wrap: wrap; }
      .bar-row .command-bar--view,

    "Exactly 15 LIVE songs per city that already has some: certified_at set, not archived. Songs still in review do not count toward the 15, so a tape can look short until its candidates are approved; propose enough to fill it, not enough to fill it twice.",

    "Audit every track on the tapes in scope, live or shelved. A finding is a STATEMENT, not an instruction, and a human decides what to do with it. This reverses the old rule, which refused to report against a shelved track on the grounds that shelving was the strongest available fix; with everything landing shelved that rule would have silenced the audit on the whole catalogue.",
