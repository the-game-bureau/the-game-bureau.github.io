      }

      function issueScopeSummary(tapeFlags, trackFlags) {
        return tapeFlags + (tapeFlags === 1 ? ' TAPE ISSUE, ' : ' TAPE ISSUES, ')
          + trackFlags + (trackFlags === 1 ? ' TRACK ISSUE' : ' TRACK ISSUES');
      }

      function tapeIssues(tape) {
        if (!tape) return [];
        var firstInCity = tapesInCity(tape.city_slug)[0];
        var isFirst = !!firstInCity && String(firstInCity.id) === String(tape.id);
        return openIssues().filter(function (issue) {
          if (issue.song_id != null) return false;
          if (issue.tape_id != null) return String(issue.tape_id) === String(tape.id);
          return isFirst && text(issue.city_slug) === text(tape.city_slug);
        });
      }

      function issuesForTape(tape) {
        if (!tape) return [];
        var mine = tapeIssues(tape);
        var songIds = {};
        (tape.songs || []).forEach(function (song) {
          if (song && song.id != null) songIds[String(song.id)] = true;
        });
        openIssues().forEach(function (issue) {
          if (issue.song_id != null && songIds[String(issue.song_id)]) mine.push(issue);
        });
        return mine;
      }

      function songIssues(song) {
        if (!song || song.id == null) return [];
        var key = String(song.id);
        var all = Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
        return all.filter(function (issue) {
          return issue.song_id != null && String(issue.song_id) === key;
        });
      }

      function songById(id) {
        if (id == null) return null;
        var found = null;
        soundtracks().forEach(function (tape) {
          (tape.songs || []).forEach(function (song) {
            if (song && String(song.id) === String(id)) found = song;
          });
        });
        return found;
      }

      function locateSong(id) {
        if (id == null) return null;
        var hit = null;
        soundtracks().forEach(function (tape, tapeIndex) {
          (tape.songs || []).forEach(function (song, songIndex) {
            if (song && String(song.id) === String(id)) hit = { tapeIndex: tapeIndex, songIndex: songIndex };
          });
        });
        return hit;
      }

      async function resolveIssue(issue, status, quiet) {
        try {
          await patchFindingStatus(issue, status || 'fixed');
        } catch (error) {
          console.error(error);
          setNotice('Could not skip that finding. ' + error.message, 'error');
          return false;
        }

        soundtrackIssues = (Array.isArray(soundtrackIssues) ? soundtrackIssues : [])
          .filter(function (row) { return row.id !== issue.id; });
        if (!quiet) setNotice('Skipped. If it is still a problem, the next audit reports it again.', 'success');

        renderTrackArchive();
        return true;
      }

      async function loadSoundtrackArchive() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) {
          resetSoundtrackArchive();
          return;
        }
        setArchiveStatus('Loading tapes and tracks…', '');
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Loading tracks...'));
        }
        try {
          soundtrackArchiveData = await fetchSoundtrackTables();

          paintCityOptions();
          renderTrackArchive();

          openTracksFromHash();
        } catch (error) {
          console.error(error);
          soundtrackArchiveData = null;
          setArchiveStatus('Nothing loaded.', '');
          setNotice('could not load the tables', 'error');
          if (trackArchiveList) {
            trackArchiveList.innerHTML = '';
            trackArchiveList.appendChild(emptyNode('public.soundtrack did not load. Check the Supabase project.'));
          }
          throw error;
        }
      }

      // ── Findings, folded onto their row (2026-08-25) ────────────────────
      //
      // `soundtrack_issues` is retired in place: nothing reads it any more. A
      // finding lives in the `findings` jsonb array of the row it is about,
      // which is a track when it names one and the TAPE otherwise -- 66 of the
      // 285 name no track, being statements about the list itself.
      //
      // AN ARRAY AND NOT COLUMNS, because a row can carry more than one: three
      // tracks hold three findings each today, and the four kinds are
      // independent.
      // ONE LIST OF TRACKS IN, THE FLAT ARRAY THIS PAGE HAS ALWAYS HELD OUT.
      // A finding carrying "scope":"tape" is about the LIST rather than the
      // track it happens to be stored on, so it comes back with song_id null,
      // which is exactly what the old tape-level rows looked like. Everything
      // downstream -- songIssues(), the FLAGGED filter, renderFindings() -- is
      // untouched.
      function collectFindings(trackRows) {
        var out = [];
        (Array.isArray(trackRows) ? trackRows : []).forEach(function (row) {
          if (!Array.isArray(row.findings)) return;
          row.findings.forEach(function (f) {
            if (!f || f.status !== 'open') return;
            var onTape = f.scope === 'tape';
            out.push({
              id: f.id,
              kind: f.kind,
              severity: f.severity,
              detail: f.detail,
              suggestion: f.suggestion,
              status: f.status,
              fingerprint: f.fingerprint,
              created_at: f.created_at,
              resolved_at: f.resolved_at,
              scope: f.scope || 'track',
              // The row it is STORED on, which the writer needs and which is not
              // the same as the row it is ABOUT when scope is tape.
              stored_on: row.id,
              song_id: onTape ? null : row.id,
              tape_id: tapeKey(row.city_slug, row.tape),
              city_slug: row.city_slug
            });
          });
        });
        out.sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
        return out;
      }

      // THE TAPE HAS NO id ANY MORE. It is (city_slug, tape), and this is the
      // string the page uses wherever it used to hold a tape id -- as a map key
      // and as a row's tape_id. `tapePath` turns it back into a filter.
      function tapeKey(citySlug, tapeName) {
        return JSON.stringify([String(citySlug || ''), String(tapeName || '')]);
      }
      // A TAPE-WIDE WRITE GOES THROUGH A FUNCTION, never a PATCH. With one
      // table a tape IS every row of it, so a filter somebody forgets to scope
      // rewrites the whole city -- and the shelve cascade has to stay in the
      // database anyway, or psql and the table editor lose the tombstone rule.
      async function callRpc(name, args) {
        var res = await fetch(restUrl('rpc/' + name), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'application/json' }),
          body: JSON.stringify(args || {})
        });
        if (!res.ok) throw new Error(await res.text() || ('rpc ' + name + ' failed'));
        return res.json().catch(function () { return null; });
      }

      function tapePath(tape) {
        return 'soundtrack?city_slug=eq.' + encodeURIComponent(tape.city_slug) +
               '&tape=eq.' + encodeURIComponent(tape.spine_tag || '');
      }

      // WRITING ONE BACK IS A READ, AN EDIT AND A PATCH OF THE WHOLE ARRAY.
      // Postgres has no way to update one element of a jsonb array by predicate
      // from PostgREST, so the row is read, the matching element's status is
      // changed, and the array goes back whole. **The read is what makes this
      // safe against a stale page**: the array that goes back is the one the
      // database holds now, with one element changed, not the one this page
      // loaded some minutes ago.
      async function patchFindingStatus(issue, status) {
        // `stored_on` AND NOT `song_id`. A tape-scope finding is ABOUT the list
        // and is STORED on the tape's lowest-position track, so writing by
        // song_id would look for a row that is null.
        var table = 'soundtrack';
        var id = issue.stored_on != null ? issue.stored_on : issue.song_id;
        var rows = await fetchAllRows(table + '?select=id,findings&id=eq.' + encodeURIComponent(id), true);
        var row = Array.isArray(rows) ? rows[0] : null;
        if (!row) throw new Error('That row is no longer there, so the finding could not be updated.');
        var next = (Array.isArray(row.findings) ? row.findings : []).map(function (f) {
          if (!f || String(f.id) !== String(issue.id)) return f;
          var copy = {};
          Object.keys(f).forEach(function (k) { copy[k] = f[k]; });
          copy.status = status;
          copy.resolved_at = status === 'open' ? null : new Date().toISOString();
          return copy;
        });
        await patchRow(table + '?id=eq.' + encodeURIComponent(id), { findings: next });
      }

      async function fetchSoundtrackTables() {
        var results = await Promise.all([
          // ONE TABLE, ONE READ. public.soundtrack is one row per TRACK; the
          // TAPE is (city_slug, tape) and is grouped out below. There is no
          // tapes table, no tape id and no findings table any more.
          // `true` IS useAuth AND IT IS LOAD-BEARING. `findings` is revoked from
          // `anon` by per-column grant, and PostgREST expands `*` to columns the
          // caller cannot read, so this exact request answers **401 / 42501**
          // without a session. The room is admin-gated and needs the findings,
          // so it reads as the signed-in admin rather than naming its columns.
          fetchAllRows('soundtrack?select=*&order=city_slug.asc,tape.asc,position.asc,id.asc', true),
          Promise.resolve([]),
          Promise.resolve([])
        ]);
        // Rebuilt from the rows, flattened back into the flat list the rest of
        // this page expects: each finding carries the song_id / tape_id /
        // city_slug it used to have as columns, so songIssues(), the FLAGGED
        // filter and renderFindings() all keep working unchanged.
        soundtrackIssues = collectFindings(results[0]);
        rebuildCityMap(results[0]);

        // THE TAPES ARE GROUPED OUT OF THE TRACKS, in the SAME SHAPE this page
        // has always held one, so everything downstream is untouched. The only
        // real difference is that a tape has no `id`: `tape.key` is
        // (city_slug, tape) and `tapePath(tape)` is how you write to it.
        //
        // A TAPE IS SHELVED WHEN EVERY TRACK ON IT IS. There is no tape row to
        // carry the flag any more, and that is what it always meant.
        var byTape = {};
        var tapes = [];
        results[0].forEach(function (row) {
          var key = tapeKey(row.city_slug, row.tape);
          var tape = byTape[key];
          if (!tape) {
            tape = {
              key: key,
              id: key,                       // legacy readers key on tape.id
              city_slug: row.city_slug,
              spine_tag: row.tape || '',
              created_at: row.created_at || '',
              archived: true,                // narrowed by the first live track
              songs: []
            };
            if (row.tape_label_position) tape.spine_tag_position = row.tape_label_position;
            if (row.last_audit_at) tape.last_audit_at = row.last_audit_at;
            byTape[key] = tape;
            tapes.push(tape);
          }
          if (row.created_at && row.created_at < tape.created_at) tape.created_at = row.created_at;

          var song = {
            id: row.id,
            position: Number(row.position) || 0,
            created_at: row.created_at || '',
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || ''
          };
          if (row.spotify_id) song.spotifyId = row.spotify_id;
          if (row.explicit) song.explicit = true;
          if (row.archived) song.archived = true; else tape.archived = false;
          if (row.archived_with_tape) song.archivedWithTape = true;

          tape.songs.push(song);
        });
        return { soundtracks: tapes };
      }

      function soundtracks() {
        return Array.isArray(soundtrackArchiveData && soundtrackArchiveData.soundtracks)
          ? soundtrackArchiveData.soundtracks
          : [];
      }

      function songHasContent(song) {
        return !!(song && (text(song.spotifyId) || text(song.title) || text(song.artist) || text(song.href)));
      }

      function allSongs(tape) {
        return ((tape && Array.isArray(tape.songs)) ? tape.songs : []).filter(songHasContent);
      }

      function songDate(song) {
        var raw = song && song.created_at;
        if (!raw) return null;
        var date = new Date(raw);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function songDisplay(song) {
        return [text(song && song.title) || '(untitled song)', text(song && song.artist) || '(unknown artist)'].join(' - ');
      }

      function trackCityLabel(tape) {
        return soundCityLabel(tape && tape.city_slug);
      }

      function tapeCounts(tape) {
        var counts = { active: 0, archived: 0, LIVE: 0, SHELVED: 0 };
        allSongs(tape).forEach(function (song) {
          if (isArchivedSong(song)) counts.archived += 1;
          else counts.active += 1;
          counts[songStatus(song)] += 1;
        });
        return counts;
      }

      var focusSongId = null;

      function focusedAt() {
        if (focusSongId == null) return null;
        return locateSong(focusSongId);
      }

      function visibleSongIds() {
        if (!trackArchiveList) return [];
        return Array.prototype.map.call(
          trackArchiveList.querySelectorAll('.track-row[data-song-id]'),
          function (el) { return el.dataset.songId; });
      }

      function focusSong(id, scroll) {
        focusSongId = id == null ? null : id;
        renderTrackArchive();
        if (!scroll) return;
        var el = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }

      function focusStep(delta) {
        var ids = visibleSongIds();
        if (!ids.length) return;
        var at = focusSongId == null ? -1 : ids.indexOf(String(focusSongId));
        if (at === -1) { focusSong(ids[0], true); return; }
        var next = ids[(at + delta + ids.length) % ids.length];
        focusSong(next, true);
      }

      function spotifyIdFrom(value) {
        var raw = text(value);
        if (!raw) return '';
        var base22 = /^[A-Za-z0-9]{22}$/;
        if (base22.test(raw)) return raw;
        var m = raw.match(/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/);
        if (m) return m[1];
        return '';
      }

      function trackPlayer(song) {
        var id = text(song && song.spotify_id) || text(song && song.spotifyId);
        if (id) {
          var frame = document.createElement('iframe');
          frame.className = 'queue-player';
          frame.src = 'https://open.spotify.com/embed/track/' + encodeURIComponent(id) + '?utm_source=generator';
          frame.setAttribute('loading', 'lazy');
          frame.setAttribute('allow', 'clipboard-write; encrypted-media; fullscreen; picture-in-picture');
          frame.setAttribute('title', 'Spotify player: ' + songDisplay(song));
          return frame;
        }
        var box = document.createElement('div');
        box.className = 'queue-noplayer';
        var words = document.createElement('span');
        words.textContent = 'No Spotify ID on this track, so there is nothing to play here.';
        box.appendChild(words);
        box.appendChild(actionLink(
          'https://open.spotify.com/search/' + encodeURIComponent([text(song.title), text(song.artist)].join(' ')),
          'Search Spotify', true));
        var how = document.createElement('span');
        how.className = 'queue-noplayer-how';
        how.textContent = 'Find it, press Share, then paste the link into the Spotify box on the row.';
        box.appendChild(how);
        return box;
      }

      function trackKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var el = event.target;
        var tag = el && el.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

        if (!soundtrackArchiveData) return;
        var key = event.key.toLowerCase();
        if (key === 'arrowdown') { event.preventDefault(); focusStep(1); return; }
        if (key === 'arrowup') { event.preventDefault(); focusStep(-1); return; }
        var at = focusedAt();
        if (!at) return;

        if (key === 'l' || key === 'k') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'LIVE'); return; }
        if (key === 's') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'SHELVED'); return; }
        if (key === 'n') { event.preventDefault(); focusStep(1); return; }
        if (key === 'e') {
          event.preventDefault();
          var row = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
          var btn = row && row.querySelector('.track-edit-btn');
          if (btn) btn.click();
        }
      }

      function paintKeyLegend() {
        if (!keyLegend) return;
        keyLegend.innerHTML = '';
        var lead = document.createElement('span');
        lead.className = 'key-legend-lead';
        lead.textContent = 'Keys';
        keyLegend.appendChild(lead);
        [['L', 'live'], ['S', 'shelve'], ['E', 'edit'], ['N', 'next']].forEach(function (pair) {
          var span = document.createElement('span');
          span.className = 'key-legend-pair';
          var kbd = document.createElement('kbd');
          kbd.textContent = pair[0];

          span.append(kbd, document.createTextNode(' ' + pair[1]));
          keyLegend.appendChild(span);
        });
        keyLegend.title = 'Keyboard shortcuts for the track you have selected: L puts it live, S shelves it, E opens its editor, N moves to the next one. Arrow keys move up and down. K still works as an alias for L.';
      }

      var refocusing = false;

      function renderTrackArchive(message, tone) {
        if (!trackArchiveList) return;
        trackArchiveList.innerHTML = '';

        if (!soundtrackArchiveData) {
          trackArchiveList.appendChild(emptyNode('Sign in to see the tapes.'));
          return;
        }

        function byLabel(x, y, dir) {
          if (!x && !y) return 0;
          if (!x) return 1;
          if (!y) return -1;

          return x.localeCompare(y) * (dir || 1);
        }
        var tapes = soundtracks().slice();

        if (newOnly) {
          tapes = tapes.filter(isNewTape);
        }
        if (flaggedOnly) {
          tapes = tapes.filter(function (tape) {
            return issuesForTape(tape).length > 0;
          });
        }
        if (airFilter !== 'all') {
          tapes = tapes.filter(function (tape) {
            return airMatches(airFilter, truthyFlag(tape && tape.archived));
          });
        }

        // ONE ORDER: by city, A to Z. The three sort buttons are gone, and
        // with one tape on screen a sort was choosing the order you PAGE
        // through rather than the order you read, which is not what a column
        // header looks like it does. Alphabetical is the order you can predict
        // and the one you can find a city in.
        tapes = tapes.sort(function (a, b) {
          var sa = text(a && a.city_slug), sb = text(b && b.city_slug);
          return byLabel(soundCityLabel(sa), soundCityLabel(sb), 1) || byLabel(sa, sb, 1);
        });

        if (!tapes.length) {

          trackArchiveList.appendChild(emptyNode(
            airFilter !== 'all'
              ? ('No ' + airFilter + ' tapes'
                  + (newOnly || flaggedOnly ? ' match the other filters.' : '.')
                  + ' Press ' + (airFilter === 'live' ? 'Live' : 'Shelved') + ' again to show both.')
              : newOnly && flaggedOnly
                ? 'No tape from the last ' + NEW_FOR_HOURS + ' hours has an open issue.'
                : newOnly
                  ? 'Nothing added in the last ' + NEW_FOR_HOURS + ' hours. TGB SOUNDTRACK BOT runs twice a day.'
                  : flaggedOnly
                    ? 'No open issues on any tape. The daily audit reports here when it finds something.'
                    : 'No tapes yet.'));
          paintMasterAir();
          setArchiveStatus('', '');
          return;
        }

        // CLAMPED, NEVER WRAPPED. Running off the end onto the first tape
        // makes a long list feel like it has no end; stopping is honest, and
        // the buttons grey out to say why.
        if (tapeAt >= tapes.length) tapeAt = tapes.length - 1;
        if (tapeAt < 0) tapeAt = 0;
        var headRow = document.getElementById('tapeHeadRow');
        if (headRow) headRow.textContent = '';

        tapes.slice(tapeAt, tapeAt + 1).forEach(function (tape) {
          var slug = text(tape && tape.city_slug);
          var row = document.createElement('div');
          row.className = 'tape-line';
          if (slug) row.dataset.slug = slug;
          row.dataset.tapeId = String(tape.id);
          row.title = 'Open ' + cityFullLabel(slug);

          row.addEventListener('click', function (event) {
            if (event.target.closest('input, button, label, a, select, textarea')) return;
            openTracks(tape.id);
          });

          var newCell = document.createElement('span');
          newCell.className = 'tape-line-num tape-line-new';
          if (isNewTape(tape)) newCell.appendChild(newBadge(tape));

          var country = document.createElement('span');
          country.className = 'tape-line-country';
          country.textContent = cityCountryLabel(slug);

          var state = document.createElement('span');
          state.className = 'tape-line-state';
          state.textContent = cityStateLabel(slug);

          // THE NAME IS EDITABLE ON THE LINE. It was read-only here and
          // editable only as the tracks popup's title, so renaming a tape or
          // moving it to another city meant opening a dialog to change two
          // words. `buildTapeNameEditor` is the SAME editor the popup uses, so
          // there is one of it and not two.
          var name = buildTapeNameEditor(tape.id);
          name.classList.add('tape-line-name');

          var issues = document.createElement('span');
          issues.className = 'tape-line-num tape-line-issues';

          // IT GOES ON THE ROW, NOT IN THE NAME CELL, and that is the whole
          // reason the first cut of this was invisible: `.tape-line-name` is a
          // `display: flex; flex-wrap: nowrap` box, so a child of it became a
          // flex item squeezed onto the same line, and its `grid-column` was
          // inert because its parent is a flex container rather than the grid.
          var findingNote = null;

          var flags = issuesForTape(tape);
          if (flags.length) {
            var tapeFlags = tapeIssues(tape).length;
            var trackFlags = flags.length - tapeFlags;

            var MAX_PIPS = 8;
            var shown = Math.min(flags.length, MAX_PIPS);
            for (var pi = 0; pi < shown; pi++) {
              var pip = document.createElement('span');
              pip.className = 'issue-pip' + (pi < tapeFlags ? ' is-tape' : '');
              issues.appendChild(pip);
            }

            if (flags.length > MAX_PIPS) {
              var more = document.createElement('span');
              more.className = 'issue-pip-more';
              more.textContent = '+' + (flags.length - MAX_PIPS);
              issues.appendChild(more);
            }

            issues.title = issueScopeSummary(tapeFlags, trackFlags);

            // THE TAPE'S OWN FINDINGS, AS FULL ITEMS YOU CAN ACT ON. A finding
            // about the LIST (short of 15, over 15, a hidden city) names no
            // track, so it has nowhere else on this page to live. It used to be
            // a single red sentence here with no buttons, which meant opening
            // the popup to clear it.
            //
            // TRACK FINDINGS ARE NOT REPEATED HERE. They are drawn on the track
            // row itself, a few pixels below, by the same builder.
            var tapeOwn = tapeIssues(tape);
            if (tapeOwn.length) {
              findingNote = document.createElement('div');
              findingNote.className = 'tape-line-findings';
              tapeOwn.forEach(function (issue) {
                findingNote.appendChild(buildIssueItem(issue, {
                  onDone: function () { renderTrackArchive(); repaintTracks(); }
                }));
              });
            }
          }

          var shelved = truthyFlag(tape && tape.archived);

          var air = document.createElement('label');
          air.className = 'tape-air';

          var input = document.createElement('input');
          input.className = 'tape-air-input';
          input.type = 'checkbox';
          input.setAttribute('aria-label', 'On air: ' + tapeFullName(tape));

          var track = document.createElement('span');
          track.className = 'tape-air-track';
          track.setAttribute('aria-hidden', 'true');

          var wordOff = document.createElement('span');
          wordOff.className = 'tape-air-word tape-air-word--off';
          wordOff.textContent = 'Shelved';

          var wordOn = document.createElement('span');
          wordOn.className = 'tape-air-word tape-air-word--on';
          wordOn.textContent = 'Live';

          function paintAir(isShelved) {
            input.checked = !isShelved;
            wordOff.classList.toggle('is-current', isShelved);
            wordOn.classList.toggle('is-current', !isShelved);
            row.classList.toggle('is-shelved', isShelved);
            input.title = isShelved
              ? 'Shelved. Switch on to put this tape back on /soundtracks/, restoring the tracks it took down with it. A track shelved on its own stays shelved.'
              : 'Live on /soundtracks/. Switch off to take the whole city tape down, hiding every track on it.';
          }

          input.addEventListener('change', async function () {
            var want = !input.checked;
            var label = cityFullLabel(slug);
            input.disabled = true;
            try {
              await callRpc('tgb_set_tape_archived', {
                p_city: tape.city_slug, p_tape: tape.spine_tag || '', p_archived: want
              });
            } catch (error) {
              console.error(error);
              setNotice((want ? 'could not shelve ' : 'could not restore ') + label, 'error');
              paintAir(!want);
              input.disabled = false;
              return;
            }
            if (tape) tape.archived = want;
            shelved = want;
            paintAir(want);
            input.disabled = false;
            setNotice((want ? 'shelved ' : 'back on air, ') + label, 'success');
          });

          paintAir(shelved);

          row.repaintAir = paintAir;

          air.append(wordOff, input, track, wordOn);

          // THE COUNTS IN WORDS, which is what the tracks popup said about the
          // tape. `10/55` needed the header to be read before it meant anything,
          // and then still left you working out which number was which.
          var tracksCell = document.createElement('span');
          tracksCell.className = 'tape-line-num tape-line-counts';
          var counts = tapeCounts(tape);
          var total = counts.LIVE + counts.SHELVED;
          if (!total) tracksCell.classList.add('is-empty');
          // EVERY PIECE IS AN ELEMENT AND EVERY SPACE IS NON-BREAKING, so this
          // reads the same whether the cell ends up a block or a flex box.
          // `.tape-line-num` sets `display: flex`, and in a flex container a
          // BARE TEXT NODE becomes an anonymous flex item with its whitespace
          // stripped: that is what rendered "15tracks" on screen while
          // ", 15 live", being inside a span, kept its own space. The cell also
          // sets `display: block` to win that cascade, but nothing here depends
          // on it any more.
          var NB = String.fromCharCode(160);
          var totalEl = document.createElement('strong');
          totalEl.textContent = String(total);
          tracksCell.appendChild(totalEl);

          var unitEl = document.createElement('span');
          unitEl.textContent = NB + (total === 1 ? 'track' : 'tracks');
          tracksCell.appendChild(unitEl);

          if (total) {
            var liveEl = document.createElement('span');
            liveEl.className = 'tape-line-live' + (counts.LIVE ? '' : ' is-none');
            liveEl.textContent = ',' + NB + counts.LIVE + NB + 'live';
            tracksCell.appendChild(liveEl);
          }
          tracksCell.title = counts.LIVE + ' live on /soundtracks/, '
            + counts.SHELVED + ' shelved.';

          var delCell = document.createElement('span');
          delCell.className = 'tape-line-del';
          var armed = String(tapePendingDelete) === String(tape.id);
          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'track-del' + (armed ? ' is-armed' : '');
          delBtn.textContent = '×';
          delBtn.setAttribute('aria-label', 'Delete the ' + tapeNameOf(tape) + ' tape');
          delBtn.title = armed
            ? 'Put the question away'
            : 'Delete this tape, its tracks and their findings';
          delBtn.addEventListener('click', function (event) {

            event.stopPropagation();
            tapePendingDelete = armed ? null : tape.id;
            renderTrackArchive();
          });
          delCell.appendChild(delBtn);

          // BOTH ARROWS AT THE FAR LEFT, SIDE BY SIDE. Split to the two ends
          // they were a long way apart for one job, and you had to cross the
          // whole row to change direction. The count goes with them: it is the
          // pager's own reading and reads as orphaned anywhere else.
          row.append(buildPagerCell('back', tapes), buildPagerCell('next', tapes),
                     buildPagerCell('of', tapes),
                     country, state, name, tracksCell, issues, newCell, air, delCell);
          if (findingNote) row.appendChild(findingNote);

          var confirmStrip = renderTapeConfirm(tape);
          if (confirmStrip) row.appendChild(confirmStrip);

          // THE TAPE'S OWN LINE GOES IN FIRST. It used to be appended after
          // its tracks, which put the heading UNDER the rows it heads: the
          // track block below is appended to the list, and the row was not
          // added until the end of this loop.
          // INTO THE HEADER, not the list. The list below is tracks only.
          (document.getElementById('tapeHeadRow') || trackArchiveList).appendChild(row);

          // THE TRACKS THEMSELVES, under the tape they belong to. The row above
          // is the tape's own line and still carries its counts, its findings
          // and its air switch; these are the tracks, drawn by the SAME builder
          // the popup uses, so there is one track row in this project and not
          // two to keep in step.
          var tapeIndex = tapeIndexById(tape.id);
          var songsHere = allSongs(tape).filter(function (song) {
            return airMatches(airFilter, songStatus(song) !== 'LIVE');
          });

          // THE COLUMN HEADER GOES HERE, between the tape and its tracks, not
          // in the page's static markup above the pager: up there it named
          // columns that were three bars away from the rows they belonged to.
          allSongs(tape).slice().sort(function (a, b) {
            return (Number(a.position) || 0) - (Number(b.position) || 0)
              || (Number(a.id) - Number(b.id));
          }).forEach(function (song) {
            if (!airMatches(airFilter, songStatus(song) !== 'LIVE')) return;
            var line = renderTrackLine(tape, tapeIndex, song);
            line.classList.add('track-line--in-list');
            trackArchiveList.appendChild(line);
          });


        });

        fitRowInputs();
        if (document.fonts && document.fonts.ready && !fontsFitted) {
          document.fonts.ready.then(function () { fontsFitted = true; fitRowInputs(); });
        }

        paintMasterAir();
        paintFilterPills();
        paintNewTotal();
        paintTrackTotal();
        paintIssueTotal();
        setArchiveStatus(tapes.length + (tapes.length === 1 ? ' tape' : ' tapes')
          + (flaggedOnly ? ' with issues' : ''), '');
        if (message) setNotice(message, tone);
      }

      async function saveTapeName(tapeIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        if (!slug) return { ok: false, message: 'That tape is no longer loaded. Press Reload.' };
        // A TAPE MUST HAVE A NAME, because the name is half of what identifies
        // it: (city_slug, tape). Blank used to be storable and would now leave
        // the rename silently doing nothing, which is worse than refusing.
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag')
            && !text(fields.spine_tag)) {
          return { ok: false, message: 'A tape needs a name. It is half of what tells two tapes in one city apart.' };
        }
        try {
          await callRpc('tgb_rename_tape', {
            p_city: slug, p_tape: tape.spine_tag || '',
            p_new_city: null,
            p_new_tape: Object.prototype.hasOwnProperty.call(fields, 'spine_tag')
              ? (fields.spine_tag || '') : null,
            p_label_position: Object.prototype.hasOwnProperty.call(fields, 'spine_tag_position')
              ? (fields.spine_tag_position || null) : null
          });
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag')) {
          tape.spine_tag = fields.spine_tag || '';
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag_position')) {
          if (fields.spine_tag_position) tape.spine_tag_position = fields.spine_tag_position;
          else delete tape.spine_tag_position;
        }

        setNotice('saved ' + tapeFullName(tape), 'success');
        return { ok: true };
      }

      function friendlyWriteError(error, cityLabel) {
        var message = (error && error.message) || 'Write failed.';
        if (/23505|duplicate key/i.test(message)) {
          return 'The ' + cityLabel + ' tape already has that title and artist. '
            + 'It may already be there as a shelved track.';
        }
        if (/soundtrack_spotify_id_check|violates check constraint/i.test(message)) {
          return 'Supabase rejected the Spotify ID. It has to be 22 letters and digits, or blank.';
        }
        return message;
      }

      async function setTrackStatus(tapeIndex, songIndex, status, quiet) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return false;

        var patch = { archived: status !== 'LIVE' };

        try {
          await patchRow('soundtrack?id=eq.' + encodeURIComponent(song.id), patch);
        } catch (error) {
          console.error(error);
          setNotice('could not update ' + songDisplay(song), 'error');
          return false;
        }

        if (patch.archived) song.archived = true; else { delete song.archived; delete song.archivedWithTape; }

        if (quiet) return true;
        var said = { LIVE: 'live', SHELVED: 'shelved' };
        renderTrackArchive((said[status] || 'updated') + ' — ' + songDisplay(song), 'success');
        return true;
      }

      async function saveTrackFields(tapeIndex, songIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtrack?id=eq.' + encodeURIComponent(song.id), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        song.title = fields.title;
        song.artist = fields.artist;
        song.position = fields.position;
        if (fields.blurb) song.blurb = fields.blurb; else delete song.blurb;
        if (fields.spotify_id) song.spotifyId = fields.spotify_id; else delete song.spotifyId;
        if (fields.explicit) song.explicit = true; else delete song.explicit;
        renderTrackArchive('saved — ' + songDisplay(song), 'success');
        return { ok: true };
      }

      async function setTapeArchived(tapeIndex, archived) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        var label = trackCityLabel(tape);
        if (!slug) return false;
        try {
          await callRpc('tgb_set_tape_archived', {
            p_city: slug, p_tape: tape.spine_tag || '', p_archived: !!archived
          });
          await loadSoundtrackArchive();
        } catch (error) {
          console.error(error);
          setNotice((archived ? 'could not shelve the ' : 'could not restore the ')
            + label + ' tape', 'error');
          return false;
        }
        var counts = tapeCounts(tapeById(issue.tape_id) || tapesInCity(slug)[0]);
        renderTrackArchive(
          archived
            ? ('shelved the whole ' + label + ' tape — ' + counts.archived
              + ' track' + (counts.archived === 1 ? '' : 's') + ' off the site')
            : ('restored ' + label + ' — ' + counts.LIVE + ' live'
              + (counts.SHELVED ? ', ' + counts.SHELVED + ' stayed shelved' : '')),
          'success'
        );
        return true;
      }

      function tapeById(id) {
        if (id == null) return null;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return all[i];
        }
        return null;
      }

      function tapeIndexById(id) {
        if (id == null) return -1;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return i;
        }
        return -1;
      }

      function tapesInCity(slug) {
        var key = text(slug);
        return soundtracks().filter(function (tape) { return text(tape.city_slug) === key; });
      }

      var ISSUE_SEVERITY_LABEL = { high: 'Breaks for a visitor', warn: 'Wrong', info: 'Nitpick' };

      function humaniseIssueText(str) {
        var out = text(str);
        if (!out) return '';

        out = out.replace(/\b(song|song_id|track)\s*#?\s*=?\s*(\d+)/gi,
          function (whole, word, id) {
            var song = songById(id);
            return song ? ('"' + text(song.title) + '" by ' + text(song.artist)) : whole;
          });

        out = out.replace(/\b(tape|tape_id|id)\s*#?\s*=?\s*(\d+)/gi,
          function (whole, word, id, offset, source) {

            var sql = /\b(delete|update|insert|select)\b[\s\S]{0,60}\b(from|into|where|set)\b/i.test(source);
            var before = String(source).slice(Math.max(0, offset - 10), offset).toLowerCase();
            if (sql && /\b(where|and|or)\s*$/.test(before)) return whole;
            var tape = tapeById(id);
            return tape ? ('the ' + tapeNameOf(tape) + ' tape') : whole;
          });

        return out;
      }

      function buildIssueItem(issue, opts) {

        var item = document.createElement('article');          var item = document.createElement('article');

      function buildTapeNameEditor(tapeId) {
        var tape = tapeById(tapeId);
        var slug = text(tape && tape.city_slug);
        var name = document.createElement('span');
        name.className = 'tape-line-name tape-name-editor';
        if (!tape) return name;

        var cityHalf = document.createElement('input');
        cityHalf.className = 'city-input';
        cityHalf.type = 'text';
        cityHalf.setAttribute('list', 'cityOptions');
        cityHalf.value = soundCityLabel(slug);
        cityHalf.setAttribute('aria-label', 'City for this tape');
        cityHalf.title = 'Which city this tape belongs to. Pick from the catalogue; a city that already has a tape is not offered. Enter saves, Escape cancels.';
        function sizeCity() { fitInput(cityHalf); }
        sizeCity();
        cityHalf.addEventListener('input', sizeCity);

        var cityWas = cityHalf.value;
        async function commitCity() {
          var typed = cityHalf.value.trim();
          if (typed === cityWas) { cityHalf.value = cityWas; sizeCity(); return; }
          // A CITY THIS ROOM HAS NEVER HELD IS ACCEPTED NOW, because there is
          // no catalogue left to refuse it against. What it cannot be is
          // unusable: a label that yields no slug is refused, since the slug is
          // half the tape's key.
          var target = cityByLabel(typed);
          if (!target) {
            var madeSlug = slugFromLabel(typed);
            if (!madeSlug) {
              setNotice('"' + typed + '" does not give a usable city name', 'error');
              cityHalf.value = cityWas; sizeCity();
              return;
            }
            target = { slug: madeSlug, city: typed, isNew: true };
          }

          var wanted = text(tape.spine_tag).toLowerCase();
          var clash = soundtracks().filter(function (other) {
            return other !== tape
              && text(other.city_slug) === target.slug
              && text(other.spine_tag).toLowerCase() === wanted;
          })[0];
          if (clash) {
            setNotice(cityFullLabel(target.slug) + ' already has a tape called "'
              + (text(clash.spine_tag) || 'no spine phrase') + '", rename this one first', 'error');
            cityHalf.value = cityWas; sizeCity();
            return;
          }
          cityHalf.disabled = true;
          cityHalf.classList.add('is-saving');
          var ok = await moveTapeToCity(tape.id, target.slug, target);
          cityHalf.disabled = false;
          cityHalf.classList.remove('is-saving');
          if (!ok) { cityHalf.value = cityWas; sizeCity(); return; }

          if (tracksOpen()) renderTracks();

        }

        cityHalf.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); cityHalf.blur(); return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            cityHalf.value = cityWas;
            sizeCity();
            cityHalf.blur();
          }
        });
        cityHalf.addEventListener('blur', commitCity);

        var spine = document.createElement('input');
        spine.className = 'spine-input';
        spine.type = 'text';
        spine.value = text(tape && tape.spine_tag);
        spine.placeholder = 'no spine phrase';
        spine.setAttribute('aria-label', 'Spine phrase for ' + soundCityLabel(slug));
        spine.title = 'The phrase printed down the side of the cassette on /soundtracks/. Enter saves, Escape cancels.';

        function sizeSpine() { fitInput(spine); }
        sizeSpine();
        spine.addEventListener('input', sizeSpine);

        var leads = text(tape && tape.spine_tag_position) === 'before';

        var flip = document.createElement('button');
        flip.type = 'button';
        flip.className = 'spine-flip';

        flip.textContent = '\u21c4';
        flip.setAttribute('aria-label', 'Swap the order of the city and the spine phrase');
        flip.title = leads
          ? 'Swap: put the city first, "' + soundCityLabel(slug) + ' ' + (text(tape && tape.spine_tag) || '\u2026') + '"'
          : 'Swap: put the city last, "' + (text(tape && tape.spine_tag) || '\u2026') + ' ' + soundCityLabel(slug) + '"';
        flip.addEventListener('click', async function () {
          var at = tapeIndexById(tape.id);
          if (at < 0) { setNotice('that tape is no longer loaded, reload the page', 'error'); return; }
          flip.disabled = true;

          var result = await saveTapeName(at, { spine_tag_position: leads ? null : 'before' });
          flip.disabled = false;
          if (result && result.ok) { renderTrackArchive(); renderTracks(); }
          else setNotice((result && result.message) || 'could not move the city', 'error');
        });

        var spineWas = spine.value;
        async function commitSpine() {
          var next = spine.value.trim();
          if (next === spineWas) { spine.value = spineWas; sizeSpine(); return; }
          var at = tapeIndexById(tape.id);
          if (at < 0) {
            setNotice('that tape is no longer loaded, reload the page', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spine.disabled = true;
          spine.classList.add('is-saving');

          var result = await saveTapeName(at, { spine_tag: next });
          spine.disabled = false;
          spine.classList.remove('is-saving');
          if (!result || !result.ok) {
            setNotice((result && result.message) || 'could not rename that tape', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spineWas = next;
          spine.value = next;
          sizeSpine();
        }

        spine.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); spine.blur(); return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            spine.value = spineWas;
            sizeSpine();
            spine.blur();
          }
        });
        spine.addEventListener('blur', commitSpine);

        if (leads) name.append(spine, flip, cityHalf);
        else name.append(cityHalf, flip, spine);
        return name;
      }

      var tracksCard = document.getElementById('tracksCard');
      var tracksBackdrop = document.getElementById('tracksBackdrop');
      var tracksTitle = document.getElementById('tracksTitle');
      var tracksSub = document.getElementById('tracksSub');
      var tracksFoot = document.getElementById('tracksFoot');
      var trackLines = document.getElementById('trackLines');
      var tapeFindings = document.getElementById('tapeFindings');

      var tracksTapeId = null;
      var tracksOnlySongId = null;

      var focusTrackId = null;

      var trackPendingDelete = null;

      function tracksOpen() { return !!(tracksCard && !tracksCard.hidden); }

      function tapeNameOf(tape) {
        var city = soundCityLabel(tape && tape.city_slug);
        var spine = text(tape && tape.spine_tag);
        if (!spine) return city;
        return text(tape && tape.spine_tag_position) === 'before'
          ? (spine + ' ' + city)
          : (city + ' ' + spine);
      }

      function setTracksHash(tapeId, songId) {
        if (!window.history || !history.replaceState) return;
        var base = location.pathname + location.search;
        var hash = songId != null ? ('#track=' + encodeURIComponent(songId))
          : tapeId != null ? ('#tape=' + encodeURIComponent(tapeId)) : '';
        history.replaceState(null, '', base + hash);
      }

      function openTracks(tapeId, onlySongId) {
        tracksTapeId = tapeId == null ? null : tapeId;
        tracksOnlySongId = onlySongId == null ? null : onlySongId;

        focusTrackId = onlySongId == null ? null : onlySongId;
        trackPendingDelete = null;
        if (!tapeById(tracksTapeId)) {
          setNotice('that tape is no longer loaded, reload the page', 'error');
          return;
        }
        if (tracksBackdrop) tracksBackdrop.hidden = false;
        if (tracksCard) tracksCard.hidden = false;
        document.body.style.overflow = 'hidden';
        setTracksHash(tracksTapeId, tracksOnlySongId);
        renderTracks();
      }

      function openTrackById(songId) {
        var at = locateSong(songId);
        if (!at) { setNotice('no track ' + songId + ' in the catalogue', 'error'); return; }
        var tape = soundtracks()[at.tapeIndex];
        openTracks(tape && tape.id, songId);
      }

      function closeTracks() {
        if (tracksBackdrop) tracksBackdrop.hidden = true;
        if (tracksCard) tracksCard.hidden = true;
        tracksTapeId = null;
        tracksOnlySongId = null;
        focusTrackId = null;
        trackPendingDelete = null;
        setTracksHash('', null);
        document.body.style.overflow = '';
      }

      var trackAirAll = document.getElementById('trackAirAll');
      var trackAirAllInput = document.getElementById('trackAirAllInput');

      // Every track on the open tape, before any filter. The switch's counts
      // read this; the list reads visibleTrackSongs below.
      function allTrackSongs() {
        var tape = tapeById(tracksTapeId);
        return tape ? allSongs(tape) : [];
      }

      function visibleTrackSongs() {
        var songs = allTrackSongs();
        if (tracksOnlySongId != null) {
          return songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        }
        if (trackAirFilter === 'all') return songs;
        return songs.filter(function (song) {
          return airMatches(trackAirFilter, songStatus(song) !== 'LIVE');
        });
      }

      function paintTrackMasterAir() {
        // COUNTS OVER THE WHOLE TAPE, never over what the filter has left. A
        // count that shrank as you filtered would read as the filter breaking,
        // and the question it answers is how many there are.
        var songs = allTrackSongs();
        var live = 0, shelved = 0;
        songs.forEach(function (song) {
          if (songStatus(song) === 'LIVE') live += 1; else shelved += 1;
        });
        paintAirSwitch(trackAirAll, trackAirAllInput, trackAirFilter,
          { live: live, shelved: shelved, total: songs.length }, 'tracks');
      }

      wireAirSwitch(trackAirAll, trackAirAllInput,
        function () { return trackAirFilter; },
        function (value) { trackAirFilter = value; renderTracks(); });

      var tapePendingDelete = null;

      function renderTapeConfirm(tape) {
        if (!tape || tapePendingDelete == null) return null;
        if (String(tapePendingDelete) !== String(tape.id)) return null;

        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;
        var findings = issuesForTape(tape).length;

        var box = document.createElement('div');
        box.className = 'track-confirm';
        var words = document.createElement('p');
        var lead = document.createElement('strong');
        lead.textContent = 'Delete ' + tapeNameOf(tape) + ' for good? ';
        words.appendChild(lead);
        words.appendChild(document.createTextNode(
          'This also deletes ' + total + (total === 1 ? ' track' : ' tracks')
          + (findings ? ' and ' + findings + (findings === 1 ? ' issue' : ' issues') : '')
          + '. The tracks take their do-not-rescrape tombstones with them, so the '
          + 'routine is free to propose every one of them again. Shelving keeps all '
          + 'of it and simply takes the tape off /soundtracks/.'));

        var shelveBtn = document.createElement('button');
        shelveBtn.type = 'button';
        shelveBtn.className = 'btn small primary';
        shelveBtn.textContent = 'Shelve instead';
        shelveBtn.disabled = truthyFlag(tape.archived);
        shelveBtn.title = shelveBtn.disabled ? 'This tape is already shelved.' : '';
        shelveBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          tapePendingDelete = null;
          await setTapeArchived(tapeIndexById(tape.id), true);
        });

        var reallyBtn = document.createElement('button');
        reallyBtn.type = 'button';
        reallyBtn.className = 'btn small';
        reallyBtn.textContent = 'Delete anyway';
        reallyBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          reallyBtn.disabled = true;
          await deleteTape(tape);
        });

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn small';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          tapePendingDelete = null;
          renderTrackArchive();
        });

        box.append(words, shelveBtn, reallyBtn, cancelBtn);
        return box;
      }

      async function deleteTape(tape) {
        if (!tape || tape.id == null) return false;
        var label = tapeNameOf(tape);
        try {
          // DELETING A TAPE IS DELETING ITS TRACKS, because they are the tape.
          await deleteRow(tapePath(tape));
        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + label, 'error');
          return false;
        }
        tapePendingDelete = null;

        if (tracksOpen() && String(tracksTapeId) === String(tape.id)) closeTracks();

        await loadSoundtrackArchive();
        renderTrackArchive('deleted the ' + label + ' tape, its tracks and their '
          + 'tombstones went with it', 'hold');
        return true;
      }

      function renderTracks() {
        if (!trackLines || !tracksOpen()) return;
        var tape = tapeById(tracksTapeId);
        if (!tape) { closeTracks(); return; }
        var tapeIndex = tapeIndexById(tracksTapeId);
        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;

        tracksTitle.textContent = '';
        tracksTitle.appendChild(buildTapeNameEditor(tracksTapeId));

        // BOTH TAKE A SLUG. They were handed the tape id, so the state and the
        // country have never drawn on this subtitle -- silently, since an
        // unknown slug returns '' rather than complaining.
        var whereBits = [cityStateLabel(tape.city_slug), cityCountryLabel(tape.city_slug)]
          .map(text).filter(Boolean);
        var bits = [];
        if (whereBits.length) bits.push(whereBits.join(', '));
        bits.push(total + (total === 1 ? ' track' : ' tracks'));
        bits.push(counts.LIVE + ' live');
        if (counts.SHELVED) bits.push(counts.SHELVED + ' shelved');
        if (truthyFlag(tape.archived)) bits.push('tape shelved');
        tracksSub.textContent = bits.join('  ·  ');

        var songs = allSongs(tape).slice().sort(function (a, b) {
          return (Number(a.position) || 0) - (Number(b.position) || 0) || (Number(a.id) - Number(b.id));
        });
        if (tracksOnlySongId != null) {
          songs = songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        } else if (trackAirFilter !== 'all') {
          // THE HEADER SWITCH IS A FILTER. `visibleTrackSongs` says the same
          // thing for the keyboard and the counts, but this list is built here,
          // so the filter has to be applied here too or the switch does
          // nothing and says nothing about why.
          songs = songs.filter(function (song) {
            return airMatches(trackAirFilter, songStatus(song) !== 'LIVE');
          });
        }

        var tapeOwn = tapeIssues(tape);
        if (tapeFindings) {
          tapeFindings.textContent = '';
          tapeFindings.hidden = tapeOwn.length === 0;
          tapeOwn.forEach(function (issue) {
            tapeFindings.appendChild(buildIssueItem(issue, {
              onDone: function () { renderTrackArchive(); renderTracks(); }
            }));
          });
        }

        trackLines.textContent = '';

        if (!songs.length) {
          trackLines.appendChild(emptyNode(tracksOnlySongId != null
            ? 'That track is not on this tape any more.'
            : 'No tracks on this tape yet. They come from the PROMPT or TGB SOUNDTRACK BOT.'));
        } else {
          songs.forEach(function (song) {
            trackLines.appendChild(renderTrackLine(tape, tapeIndex, song));
          });
        }

        growBlurbs();

        Array.prototype.forEach.call(
          tracksTitle.querySelectorAll('.city-input, .spine-input'),
          function (el) { fitInput(el); });
        paintTrackMasterAir();

        tracksFoot.textContent = '';
        if (tracksOnlySongId != null) {
          var back = document.createElement('button');
          back.type = 'button';
          back.className = 'btn small';
          back.textContent = 'Show the whole tape';
          back.addEventListener('click', function () { openTracks(tracksTapeId); });
          tracksFoot.appendChild(back);
        } else {
          tracksFoot.textContent = 'Every field saves when you leave it. Enter saves, Escape puts the old value back.';
        }
      }

      function growBlurbs() {
        if (!trackLines) return;
        Array.prototype.forEach.call(
          trackLines.querySelectorAll('textarea.track-input--blurb'),
          function (area) { if (typeof area.growToFit === 'function') area.growToFit(); });
      }

      // A TRACK IS DRAWN IN TWO PLACES NOW: the main list and the tracks
      // popup. `renderTracks()` returns early when the popup is shut, so every
      // repaint inside a track row went through this instead -- otherwise
      // saving, shelving or deleting a track on the main list would change the
      // database and leave the row on screen showing the old value.
      function repaintTracks() {
        renderTrackArchive();
        renderTracks();
      }

      function renderTrackLine(tape, tapeIndex, song) {
        var line = document.createElement('div');
        line.className = 'track-line';
        var status = songStatus(song);
        line.classList.toggle('is-shelved', status === 'SHELVED');
        line.classList.toggle('is-flagged', songIssues(song).length > 0);
        line.classList.toggle('is-live', status === 'LIVE');
        line.dataset.songId = String(song.id);
        var isFocused = focusTrackId != null && String(focusTrackId) === String(song.id);
        line.classList.toggle('is-focused', isFocused);

        line.addEventListener('click', function (event) {
          var el = event.target;
          if (el.closest('input, textarea, button, select, label, a')) return;
          focusTrackId = isFocused ? null : song.id;
          repaintTracks();
        });

        function commit(input, original, apply) {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list, so nothing was saved - press Reload and try again', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          var fields = {
            title: text(titleEl.value),
            artist: text(artistEl.value),
            position: Number(posEl.value) || 0,
            blurb: text(blurbEl.value) || null,
            spotify_id: spotifyIdFrom(idEl.value) || null,
            explicit: !!explicitEl.checked
          };
          if (apply) apply(fields);
          if (!fields.title || !fields.artist) {
            setNotice('a track needs a title and an artist', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          if (text(idEl.value) && !fields.spotify_id) {
            setNotice('that is not a Spotify track id. Paste the whole share link, or the 22-character id out of it', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          saveTrackFields(tapeIndex, songIndex, fields).then(function (result) {
            if (result && result.ok) repaintTracks();
            else {
              if (input && 'value' in input) input.value = original;
              setNotice((result && result.message) || 'could not save that track', 'error');
            }
          });
        }

        function field(cls, value, placeholder, label) {
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'track-input ' + cls;
          input.value = value;
          if (placeholder) input.placeholder = placeholder;
          input.setAttribute('aria-label', label + ' for ' + songDisplay(song));
          var was = value;
          input.addEventListener('focus', function () { was = input.value; trackPendingDelete = null; });
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
            if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); input.value = was; input.blur(); }
          });
          input.addEventListener('blur', function () {
            if (input.value === was) return;
            commit(input, was);
          });
          return input;
        }

        function blurbField(value) {
          var area = document.createElement('textarea');
          area.className = 'track-input track-input--blurb';
          area.rows = 1;
          area.value = value;
          area.placeholder = 'no blurb';
          area.setAttribute('aria-label', 'Blurb for ' + songDisplay(song));
          area.title = 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          var was = value;

          var manual = false;

          var applied = 0;

          // ONE LINE AT REST, THE WHOLE BLURB WHEN YOU ARE IN IT. This is what
          // actually sets a track row's height: a ten-word blurb wraps to two or
          // three lines in its column, so every row was two or three lines tall
          // and trimming the padding moved almost nothing.
          //
          // NOTHING IS HIDDEN THAT YOU CANNOT GET AT: the box grows the moment
          // it takes focus, its tooltip carries the full text, and a blurb that
          // fits on one line looks no different from before.
          var COMPACT_H = 26;

          // THE TOOLTIP IS SET WHATEVER HAPPENS, and outside `grow()`: that
          // function returns early when the box is not yet in the document,
          // which it never is when the row is being built, so a tooltip set in
          // there would only ever appear after a later resize.
          function paintBlurbTitle() {
            area.title = text(area.value)
              ? area.value
              : 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          }
          paintBlurbTitle();

          function grow() {
            if (manual) return;
            if (!area.isConnected) return;

            // AT REST THE HEIGHT IS NOT SET AT ALL: `rows="1"` plus the CSS
            // min-height give one line, and clearing the inline height is what
            // lets the box shrink back after it has been grown. An explicit
            // COMPACT_H here would fight a future change to that min-height.
            if (area !== document.activeElement) {
              area.style.height = '';
              applied = COMPACT_H;
              return;
            }
            area.style.height = 'auto';
            applied = Math.max(COMPACT_H, area.scrollHeight);
            area.style.height = applied + 'px';
          }
          grow();

          area.growToFit = grow;

          if (window.ResizeObserver) {
            var ro = new ResizeObserver(function (entries) {
              if (manual || !entries.length) return;
              var h = Math.round(entries[0].contentRect.height + 10);

              if (applied && Math.abs(h - applied) > 2) {
                manual = true;
                area.classList.add('is-manual');
                ro.disconnect();
              }
            });
            ro.observe(area);
          }

          area.addEventListener('focus', function () {
            was = area.value; trackPendingDelete = null;
            grow();
          });
          area.addEventListener('blur', function () { paintBlurbTitle(); grow(); });
          area.addEventListener('input', function () {

            var NL = String.fromCharCode(10);
            if (area.value.indexOf(NL) >= 0) {
              area.value = area.value.split(NL).join(' ').replace(/  +/g, ' ');
            }
            grow();
          });
          area.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); area.blur(); }
            if (event.key === 'Escape') {
              event.stopPropagation();
              event.preventDefault();
              area.value = was;
              grow();
              area.blur();
            }
          });
          area.addEventListener('blur', function () {
            if (area.value === was) return;
            commit(area, was);
          });
          return area;
        }

        var playBtn = document.createElement('button');

        // WHICH TAPE THIS TRACK IS ON, above its title. On the main list the
        // rows run past 1,643 of them and the tape heading scrolls away, so a

          });

      async function deleteTrack(tapeIndex, song) {
        var tape = soundtracks()[tapeIndex];
        if (!tape || !song || song.id == null) return false;
        try {
          await deleteRow('soundtrack?id=eq.' + encodeURIComponent(song.id));
        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + songDisplay(song), 'error');
          return false;
        }
        var at = (tape.songs || []).indexOf(song);
        if (at >= 0) tape.songs.splice(at, 1);

        var dropped = 0;
        if (Array.isArray(soundtrackIssues)) {
          for (var i = soundtrackIssues.length - 1; i >= 0; i--) {
            if (String(soundtrackIssues[i].song_id) === String(song.id)) {
              soundtrackIssues.splice(i, 1);
              dropped += 1;
            }
          }
        }

        trackPendingDelete = null;

        renderTrackArchive('deleted ' + songDisplay(song)
          + (dropped ? ', and its ' + dropped + (dropped === 1 ? ' issue' : ' issues') : '')
          + ', its tombstone went with it, so the routine may propose it again', 'hold');
        return true;
      }

      var blurbResizeTimer = null;
      window.addEventListener('resize', function () {
        if (!tracksOpen()) return;
        clearTimeout(blurbResizeTimer);
        blurbResizeTimer = setTimeout(growBlurbs, 120);
      });

      if (tracksBackdrop) tracksBackdrop.addEventListener('click', closeTracks);
      if (tracksCard) {
        Array.prototype.forEach.call(tracksCard.querySelectorAll('[data-tracks-close]'), function (btn) {
          btn.addEventListener('click', closeTracks);
        });
      }
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape' || !tracksOpen()) return;

        if (trackPendingDelete != null) { trackPendingDelete = null; renderTracks(); return; }
        closeTracks();
      });

      function openTracksFromHash() {
        var hash = text(location.hash).replace(/^#/, '');
        var m = /^tape=(.+)$/.exec(hash);
        if (m) { openTracks(decodeURIComponent(m[1])); return true; }

        m = /^tracks=(.+)$/.exec(hash);
        if (m) {
          var first = tapesInCity(decodeURIComponent(m[1]))[0];
          if (first) openTracks(first.id);
          else setNotice('no tape for ' + decodeURIComponent(m[1]), 'error');
          return true;
        }
        m = /^track=(.+)$/.exec(hash);
        if (m) { openTrackById(decodeURIComponent(m[1])); return true; }
        return false;
      }


      var issueTotalBtn = document.getElementById('issueTotal');

      var newTotalEl = document.getElementById('newTotal');

      function paintNewTotal() {
        if (!newTotalEl) return;
        var n = soundtracks().filter(isNewTape).length;

        newTotalEl.textContent = String(n);

        var pill = document.getElementById('newTotalPill');
        if (pill) pill.classList.toggle('is-zero', n === 0);
        newTotalEl.title = n
          ? (n + (n === 1 ? ' tape' : ' tapes') + ' added, or added to, in the last '
             + NEW_FOR_HOURS + ' hours. Tick to see only those.')
          : ('Nothing added in the last ' + NEW_FOR_HOURS + ' hours.');
      }

      var trackTotalEl = document.getElementById('trackTotal');

      function paintTrackTotal() {
        if (!trackTotalEl) return;
        var live = 0, all = 0;
        soundtracks().forEach(function (tape) {
          var c = tapeCounts(tape);
          live += c.LIVE;
          all += c.LIVE + c.SHELVED;
        });
        trackTotalEl.textContent = live + '/' + all;
        trackTotalEl.title = live + ' LIVE, ' + (all - live) + ' SHELVED, across every tape';
      }

      function paintIssueTotal() {
        if (!issueTotalBtn) return;
        var all = openIssues();

        var tapeFlags = all.filter(function (i) { return i.song_id == null; }).length;
        var trackFlags = all.length - tapeFlags;
        issueTotalBtn.textContent = String(all.length);

        var pill = document.getElementById('issueTotalPill');
        if (pill) pill.title = issueScopeSummary(tapeFlags, trackFlags)
          + ' across every tape. Press to see only the tapes carrying them.';
