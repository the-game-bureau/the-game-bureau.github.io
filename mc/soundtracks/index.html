      function buildTapeNameEditor(tapeId) {
        var tape = tapeById(tapeId);
        var slug = text(tape && tape.city_slug);
        var name = document.createElement('span');
        name.className = 'tape-line-name tape-name-editor';
        if (!tape) return name;

        var cityHalf = document.createElement('input');
        cityHalf.className = 'city-input';
        cityHalf.type = 'text';
        cityHalf.setAttribute('list', 'cityOptions');
        cityHalf.value = soundCityLabel(slug);
        cityHalf.setAttribute('aria-label', 'City for this tape');
        cityHalf.title = 'Which city this tape belongs to. Pick from the catalogue; a city that already has a tape is not offered. Enter saves, Escape cancels.';
        function sizeCity() { fitInput(cityHalf); }
        sizeCity();
        cityHalf.addEventListener('input', sizeCity);

        var cityWas = cityHalf.value;
        async function commitCity() {
          var typed = cityHalf.value.trim();
          if (typed === cityWas) { cityHalf.value = cityWas; sizeCity(); return; }
          var target = cityByLabel(typed);
          if (!target) {
            setNotice('no city called "' + typed + '" in the catalogue', 'error');
            cityHalf.value = cityWas; sizeCity();
            return;
          }

          var wanted = text(tape.spine_tag).toLowerCase();
          var clash = soundtracks().filter(function (other) {
            return other !== tape
              && text(other.city_slug) === target.slug
              && text(other.spine_tag).toLowerCase() === wanted;
          })[0];
          if (clash) {
            setNotice(cityFullLabel(target.slug) + ' already has a tape called "'
              + (text(clash.spine_tag) || 'no spine phrase') + '", rename this one first', 'error');
            cityHalf.value = cityWas; sizeCity();
            return;
          }
          cityHalf.disabled = true;
          cityHalf.classList.add('is-saving');
          var ok = await moveTapeToCity(tape.id, target.slug);
          cityHalf.disabled = false;
          cityHalf.classList.remove('is-saving');
          if (!ok) { cityHalf.value = cityWas; sizeCity(); return; }

          if (tracksOpen()) renderTracks();

        }

        cityHalf.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); cityHalf.blur(); return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            cityHalf.value = cityWas;
            sizeCity();
            cityHalf.blur();
          }
        });
        cityHalf.addEventListener('blur', commitCity);

        var spine = document.createElement('input');
        spine.className = 'spine-input';
        spine.type = 'text';
        spine.value = text(tape && tape.spine_tag);
        spine.placeholder = 'no spine phrase';
        spine.setAttribute('aria-label', 'Spine phrase for ' + soundCityLabel(slug));
        spine.title = 'The phrase printed down the side of the cassette on /soundtracks/. Enter saves, Escape cancels.';

        function sizeSpine() { fitInput(spine); }
        sizeSpine();
        spine.addEventListener('input', sizeSpine);

        var leads = text(tape && tape.spine_tag_position) === 'before';

        var flip = document.createElement('button');
        flip.type = 'button';
        flip.className = 'spine-flip';

        flip.textContent = '\u21c4';
        flip.setAttribute('aria-label', 'Swap the order of the city and the spine phrase');
        flip.title = leads
          ? 'Swap: put the city first, "' + soundCityLabel(slug) + ' ' + (text(tape && tape.spine_tag) || '\u2026') + '"'
          : 'Swap: put the city last, "' + (text(tape && tape.spine_tag) || '\u2026') + ' ' + soundCityLabel(slug) + '"';
        flip.addEventListener('click', async function () {
          var at = tapeIndexById(tape.id);
          if (at < 0) { setNotice('that tape is no longer loaded, reload the page', 'error'); return; }
          flip.disabled = true;

          var result = await saveTapeName(at, { spine_tag_position: leads ? null : 'before' });
          flip.disabled = false;
          if (result && result.ok) { renderTrackArchive(); renderTracks(); }
          else setNotice((result && result.message) || 'could not move the city', 'error');
        });

        var spineWas = spine.value;
        async function commitSpine() {
          var next = spine.value.trim();
          if (next === spineWas) { spine.value = spineWas; sizeSpine(); return; }
          var at = tapeIndexById(tape.id);
          if (at < 0) {
            setNotice('that tape is no longer loaded, reload the page', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spine.disabled = true;
          spine.classList.add('is-saving');

          var result = await saveTapeName(at, { spine_tag: next });
          spine.disabled = false;
          spine.classList.remove('is-saving');
          if (!result || !result.ok) {
            setNotice((result && result.message) || 'could not rename that tape', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spineWas = next;
          spine.value = next;
          sizeSpine();
        }

        spine.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); spine.blur(); return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            spine.value = spineWas;
            sizeSpine();
            spine.blur();
          }
        });
        spine.addEventListener('blur', commitSpine);

        if (leads) name.append(spine, flip, cityHalf);
        else name.append(cityHalf, flip, spine);
        return name;
      }

      function tapeFillPrompt(tape) {
        var NL = String.fromCharCode(10);
        var counts = tapeCounts(tape);
        var want = Math.max(0, 15 - counts.LIVE);
        var city = cityFullLabel(tape.city_slug);
        var L = [];

        L.push('You are filling a city soundtrack for The Game Bureau.');
        L.push('Research by web search FIRST, then answer with ONE ```sql block and nothing else.');
        L.push('');
        L.push('## THE TAPE');

        if (text(tape.spine_tag)) {
          L.push('Spine phrase: "' + text(tape.spine_tag) + '"');
          L.push('THE PHRASE IS A BRIEF, not decoration. It narrows what belongs here on mood,');
          L.push('genre, era, scene or time of day. The city still has to be true: a genre tape is');
          L.push('that genre FOR THAT CITY, not a genre playlist wearing a city label. A phrase');
          L.push('that says nothing (Soundtrack, Mix Tape, Jams) leaves the city as the whole brief.');
        } else {
          L.push('Spine phrase: none, so the city is the whole brief.');
        }
        L.push('It holds ' + counts.LIVE + ' live '
          + (counts.LIVE === 1 ? 'track' : 'tracks')
          + (counts.SHELVED ? ' and ' + counts.SHELVED + ' shelved, which do not count' : ''));
        L.push('');
        L.push('## WHAT TO DO');
        L.push('1. Read what is already on this tape so you do not propose a duplicate, including');
        L.push('   the shelved ones: a shelved track is a do-not-rescrape tombstone and the');
        L.push('   database will silently drop a repeat of it. This URL is public and opens as it');
        L.push('   stands:');
        L.push('   https://qmaafbncpzrdmqapkkgr.supabase.co/rest/v1/soundtrack_songs'
          + '?select=title,artist,archived&tape_id=eq.' + tape.id
          + '&order=position.asc&apikey=' + SUPABASE_CONFIG.publishableKey);
        L.push('2. Research ' + want + ' more '
          + (want === 1 ? 'track' : 'tracks') + ' and return a call to the RPC:');
        L.push('');
        L.push('   select public.tgb_pull_soundtrack_songs(\'[{"city_slug":"'
          + text(tape.city_slug) + '","songs":[');
        L.push('     {"title":"...","artist":"...","spotify_id":"...","blurb":"...","explicit":false}');
        L.push('   ]}]\'::jsonb);');
        L.push('');
        L.push('   The argument is a BARE ARRAY. Do not wrap it in {"tapes": [...]}: that is the');
        L.push('   PostgREST spelling, where a top-level key names a parameter over HTTP. In SQL');
        L.push('   the call is positional, and the wrapper makes the function stop with');
        L.push('   "Expected a JSON array of tape objects".');
        L.push('');
        L.push('   Do NOT write an INSERT. The function is what guarantees a new track arrives');
        L.push('   shelved rather than straight onto the public page, and it refuses a hidden city.');
        if (tapesInCity(tape.city_slug).length > 1) {
          L.push('');
          L.push('   THIS CITY HAS MORE THAN ONE TAPE. Send the spine phrase exactly as written');
          L.push('   above, or the songs land on the wrong one:');
          L.push('     "city_slug":"' + text(tape.city_slug) + '","spine_tag":"' + text(tape.spine_tag) + '"');
        } else {
          L.push('');
          L.push('   OMIT spine_tag. Sending one addresses a tape by that name and would create a');
          L.push('   SECOND tape for this city rather than filling this one.');
        }
        L.push('');
        L.push('## WHAT BELONGS ON A TAPE, in rough priority');
        L.push('- Songs that name the place: the city, its streets, its neighbourhoods.');
        L.push('- Hometown artists: people from there, and records made there.');
        L.push('- Sports and game-day music: college and pro fight songs, the victory anthem, a');
        L.push('  stadium walk-up or goal song, what fans sing in the car park. Aim for 2 or 3.');
        L.push('  VERIFY THE TEAM ACTUALLY USES IT. Stadium-song lore is the most error-prone');
        L.push('  thing on these tapes: Thunderstruck is the Cowboys, Crazy Train the Patriots,');
        L.push('  Enter Sandman the Yankees. If you cannot confirm the pairing, pick a hometown');
        L.push('  artist instead.');
        L.push('- Local scenes and labels the city is known for.');
        L.push('Keep the mix varied across eras and genres where the city supports it.');
        L.push('');
        L.push('## RULES, ALL OF WHICH ARE ENFORCED SOMEWHERE');
        L.push('- PROPOSE EXACTLY ' + want + '. That is what takes this tape to fifteen live.');
        L.push('- Max 2 songs per artist across the tape, counting what is already there. Watch for');
        L.push('  one act spelled two ways: that is one artist, not two.');
        L.push('- Every song needs a title, an artist, and a city-specific blurb of 10 words or');
        L.push('  fewer with no trailing period. There is no minimum LENGTH: four true words beat');
        L.push('  eight padded ones.');
        L.push('- NEVER invent a spotify_id. It is 22 characters and a fabricated one passes the');
        L.push('  CHECK constraint and then silently plays nothing. Copy it from a real');
        L.push('  open.spotify.com track page you actually opened, or omit the field entirely.');
        L.push('  Omitting is always correct; guessing never is.');
        L.push('- Never propose a track with the word KARAOKE anywhere in it, in any field or');
        L.push('  casing, including anything Spotify shows for it.');
        L.push('- Real commercial recordings only. No tribute, sped-up, slowed or re-recorded');
        L.push('  versions; a remaster of the original master is fine.');
        L.push('- NO EM DASHES anywhere in what you hand back, in the SQL or around it. Not the');
        L.push('  character and not the entity. It is the clearest single tell that a machine wrote');
        L.push('  the line, and a blurb is read off a cassette on a public page.');
        L.push('');
        L.push('Return the SQL only. A human runs it in the Supabase SQL editor; you have no access.');
        return L.join(NL);

      var tracksCard = document.getElementById('tracksCard');
      var tracksBackdrop = document.getElementById('tracksBackdrop');
      var tracksTitle = document.getElementById('tracksTitle');
      var tracksSub = document.getElementById('tracksSub');
      var tracksFoot = document.getElementById('tracksFoot');
      var trackLines = document.getElementById('trackLines');
      var fillPromptBtn = document.getElementById('fillPromptBtn');
      var tapeFindings = document.getElementById('tapeFindings');

      var tracksTapeId = null;
      var tracksOnlySongId = null;

      var focusTrackId = null;

      var trackPendingDelete = null;

      function tracksOpen() { return !!(tracksCard && !tracksCard.hidden); }

      function tapeNameOf(tape) {
        var city = soundCityLabel(tape && tape.city_slug);
        var spine = text(tape && tape.spine_tag);
        if (!spine) return city;
        return text(tape && tape.spine_tag_position) === 'before'
          ? (spine + ' ' + city)
          : (city + ' ' + spine);
      }

      function setTracksHash(tapeId, songId) {
        if (!window.history || !history.replaceState) return;
        var base = location.pathname + location.search;
        var hash = songId != null ? ('#track=' + encodeURIComponent(songId))
          : tapeId != null ? ('#tape=' + encodeURIComponent(tapeId)) : '';
        history.replaceState(null, '', base + hash);
      }

      function openTracks(tapeId, onlySongId) {
        tracksTapeId = tapeId == null ? null : tapeId;
        tracksOnlySongId = onlySongId == null ? null : onlySongId;

        focusTrackId = onlySongId == null ? null : onlySongId;
        trackPendingDelete = null;
        if (!tapeById(tracksTapeId)) {
          setNotice('that tape is no longer loaded, reload the page', 'error');
          return;
        }
        if (tracksBackdrop) tracksBackdrop.hidden = false;
        if (tracksCard) tracksCard.hidden = false;
        document.body.style.overflow = 'hidden';
        setTracksHash(tracksTapeId, tracksOnlySongId);
        renderTracks();
      }

      function openTrackById(songId) {
        var at = locateSong(songId);
        if (!at) { setNotice('no track ' + songId + ' in the catalogue', 'error'); return; }
        var tape = soundtracks()[at.tapeIndex];
        openTracks(tape && tape.id, songId);
      }

      function closeTracks() {
        if (tracksBackdrop) tracksBackdrop.hidden = true;
        if (tracksCard) tracksCard.hidden = true;
        tracksTapeId = null;
        tracksOnlySongId = null;
        focusTrackId = null;
        trackPendingDelete = null;
        setTracksHash('', null);
        var others = ['promptCard', 'manualCard'];
        for (var i = 0; i < others.length; i++) {
          var el = document.getElementById(others[i]);
          if (el && !el.hidden) return;
        }
        document.body.style.overflow = '';
      }

      var trackAirAll = document.getElementById('trackAirAll');
      var trackAirAllInput = document.getElementById('trackAirAllInput');

      function visibleTrackSongs() {
        var tape = tapeById(tracksTapeId);
        if (!tape) return [];
        var songs = allSongs(tape);
        if (tracksOnlySongId == null) return songs;
        return songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
      }

      function paintTrackMasterAir() {
        if (!trackAirAll || !trackAirAllInput) return;
        var songs = visibleTrackSongs();
        var live = 0, shelved = 0;
        songs.forEach(function (song) {
          if (songStatus(song) === 'LIVE') live += 1; else shelved += 1;
        });
        var allLive = songs.length > 0 && shelved === 0;
        var allShelved = songs.length > 0 && live === 0;
        trackAirAllInput.indeterminate = !allLive && !allShelved;
        trackAirAllInput.checked = allLive;
        trackAirAllInput.disabled = songs.length === 0;
        trackAirAll.querySelector('.tape-air-word--off').classList.toggle('is-current', allShelved);
        trackAirAll.querySelector('.tape-air-word--on').classList.toggle('is-current', allLive);
        trackAirAllInput.title = songs.length === 0
          ? 'No tracks on this tape.'
          : live + ' live, ' + shelved + ' shelved. Switching this puts every track here the same way.';
      }

      if (trackAirAllInput) trackAirAllInput.addEventListener('change', async function () {
        var want = trackAirAllInput.checked ? 'LIVE' : 'SHELVED';
        var tape = tapeById(tracksTapeId);
        var tapeIndex = tapeIndexById(tracksTapeId);
        if (!tape) return;
        var moving = visibleTrackSongs().filter(function (song) { return songStatus(song) !== want; });
        if (!moving.length) { paintTrackMasterAir(); return; }

        if (want === 'SHELVED' && moving.length > 1 && !window.confirm(
            'Shelve ' + moving.length + ' tracks on ' + tapeNameOf(tape) + '?'
            + String.fromCharCode(10) + String.fromCharCode(10)
            + 'Each one comes off /soundtracks/ and keeps its row as a tombstone, so the routine never picks it for this tape again.')) {
          paintTrackMasterAir();
          return;
        }

        trackAirAllInput.disabled = true;
        var done = 0;
        for (var i = 0; i < moving.length; i++) {
          var at = (tape.songs || []).indexOf(moving[i]);
          if (at < 0) continue;

          if (await setTrackStatus(tapeIndex, at, want, true)) done += 1;
        }
        trackAirAllInput.disabled = false;

        renderTrackArchive();
        renderTracks();
        setNotice(done
          ? (done + (done === 1 ? ' track ' : ' tracks ') + (want === 'LIVE' ? 'live' : 'shelved')
            + ' on ' + tapeNameOf(tape))
          : 'could not change those tracks', done ? 'success' : 'error');
      });

      var tapePendingDelete = null;

      function renderTapeConfirm(tape) {
        if (!tape || tapePendingDelete == null) return null;
        if (String(tapePendingDelete) !== String(tape.id)) return null;

        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;
        var findings = issuesForTape(tape).length;

        var box = document.createElement('div');
        box.className = 'track-confirm';
        var words = document.createElement('p');
        var lead = document.createElement('strong');
        lead.textContent = 'Delete ' + tapeNameOf(tape) + ' for good? ';
        words.appendChild(lead);
        words.appendChild(document.createTextNode(
          'This also deletes ' + total + (total === 1 ? ' track' : ' tracks')
          + (findings ? ' and ' + findings + (findings === 1 ? ' issue' : ' issues') : '')
          + '. The tracks take their do-not-rescrape tombstones with them, so the '
          + 'routine is free to propose every one of them again. Shelving keeps all '
          + 'of it and simply takes the tape off /soundtracks/.'));

        var shelveBtn = document.createElement('button');
        shelveBtn.type = 'button';
        shelveBtn.className = 'btn small primary';
        shelveBtn.textContent = 'Shelve instead';
        shelveBtn.disabled = truthyFlag(tape.archived);
        shelveBtn.title = shelveBtn.disabled ? 'This tape is already shelved.' : '';
        shelveBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          tapePendingDelete = null;
          await setTapeArchived(tapeIndexById(tape.id), true);
        });

        var reallyBtn = document.createElement('button');
        reallyBtn.type = 'button';
        reallyBtn.className = 'btn small';
        reallyBtn.textContent = 'Delete anyway';
        reallyBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          reallyBtn.disabled = true;
          await deleteTape(tape);
        });

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn small';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          tapePendingDelete = null;
          renderTrackArchive();
        });

        box.append(words, shelveBtn, reallyBtn, cancelBtn);
        return box;
      }

      async function deleteTape(tape) {
        if (!tape || tape.id == null) return false;
        var label = tapeNameOf(tape);
        try {
          await deleteRow('soundtracks?id=eq.' + encodeURIComponent(tape.id));
        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + label, 'error');
          return false;
        }
        tapePendingDelete = null;

        if (tracksOpen() && String(tracksTapeId) === String(tape.id)) closeTracks();

        await loadSoundtrackArchive();
        renderTrackArchive('deleted the ' + label + ' tape, its tracks and their '
          + 'tombstones went with it', 'hold');
        return true;
      }

      function renderTracks() {
        if (!trackLines || !tracksOpen()) return;
        var tape = tapeById(tracksTapeId);
        if (!tape) { closeTracks(); return; }
        var tapeIndex = tapeIndexById(tracksTapeId);
        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;

        tracksTitle.textContent = '';
        tracksTitle.appendChild(buildTapeNameEditor(tracksTapeId));

        var whereBits = [cityStateLabel(tracksTapeId), cityCountryLabel(tracksTapeId)]
          .map(text).filter(Boolean);
        var bits = [];
        if (whereBits.length) bits.push(whereBits.join(', '));
        bits.push(total + (total === 1 ? ' track' : ' tracks'));
        bits.push(counts.LIVE + ' live');
        if (counts.SHELVED) bits.push(counts.SHELVED + ' shelved');
        if (truthyFlag(tape.archived)) bits.push('tape shelved');
        tracksSub.textContent = bits.join('  ·  ');

        var songs = allSongs(tape).slice().sort(function (a, b) {
          return (Number(a.position) || 0) - (Number(b.position) || 0) || (Number(a.id) - Number(b.id));
        });
        if (tracksOnlySongId != null) {
          songs = songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        }

        if (fillPromptBtn) {
          var want = Math.max(0, 15 - counts.LIVE);
          fillPromptBtn.hidden = want === 0;
          fillPromptBtn.textContent = 'Fill prompt';
          fillPromptBtn.title = 'Copy a prompt that researches the ' + want
            + (want === 1 ? ' track' : ' tracks')
            + ' this tape needs and hands back one SQL statement to run.';
        }

        var tapeOwn = tapeIssues(tape);
        if (tapeFindings) {
          tapeFindings.textContent = '';
          tapeFindings.hidden = tapeOwn.length === 0;
          tapeOwn.forEach(function (issue) {
            tapeFindings.appendChild(buildIssueItem(issue, {
              onDone: function () { renderTrackArchive(); renderTracks(); }
            }));
          });
        }

        trackLines.textContent = '';

        if (!songs.length) {
          trackLines.appendChild(emptyNode(tracksOnlySongId != null
            ? 'That track is not on this tape any more.'
            : 'No tracks on this tape yet. They come from the PROMPT or TGB SOUNDTRACK BOT.'));
        } else {
          songs.forEach(function (song) {
            trackLines.appendChild(renderTrackLine(tape, tapeIndex, song));
          });
        }

        growBlurbs();

        Array.prototype.forEach.call(
          tracksTitle.querySelectorAll('.city-input, .spine-input'),
          function (el) { fitInput(el); });
        paintTrackMasterAir();

        tracksFoot.textContent = '';
        if (tracksOnlySongId != null) {
          var back = document.createElement('button');
          back.type = 'button';
          back.className = 'btn small';
          back.textContent = 'Show the whole tape';
          back.addEventListener('click', function () { openTracks(tracksTapeId); });
          tracksFoot.appendChild(back);
        } else {
          tracksFoot.textContent = 'Every field saves when you leave it. Enter saves, Escape puts the old value back.';
        }
      }

      function growBlurbs() {
        if (!trackLines) return;
        Array.prototype.forEach.call(
          trackLines.querySelectorAll('textarea.track-input--blurb'),
          function (area) { if (typeof area.growToFit === 'function') area.growToFit(); });
      }

      function renderTrackLine(tape, tapeIndex, song) {
        var line = document.createElement('div');
        line.className = 'track-line';
        var status = songStatus(song);
        line.classList.toggle('is-shelved', status === 'SHELVED');
        line.classList.toggle('is-flagged', songIssues(song).length > 0);
        line.classList.toggle('is-live', status === 'LIVE');
        line.dataset.songId = String(song.id);
        var isFocused = focusTrackId != null && String(focusTrackId) === String(song.id);
        line.classList.toggle('is-focused', isFocused);

        line.addEventListener('click', function (event) {
          var el = event.target;
          if (el.closest('input, textarea, button, select, label, a')) return;
          focusTrackId = isFocused ? null : song.id;
          renderTracks();
        });

        function commit(input, original, apply) {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list, so nothing was saved - press Reload and try again', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          var fields = {
            title: text(titleEl.value),
            artist: text(artistEl.value),
            position: Number(posEl.value) || 0,
            blurb: text(blurbEl.value) || null,
            spotify_id: spotifyIdFrom(idEl.value) || null,
            explicit: !!explicitEl.checked
          };
          if (apply) apply(fields);
          if (!fields.title || !fields.artist) {
            setNotice('a track needs a title and an artist', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          if (text(idEl.value) && !fields.spotify_id) {
            setNotice('that is not a Spotify track id. Paste the whole share link, or the 22-character id out of it', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          saveTrackFields(tapeIndex, songIndex, fields).then(function (result) {
            if (result && result.ok) renderTracks();
            else {
              if (input && 'value' in input) input.value = original;
              setNotice((result && result.message) || 'could not save that track', 'error');
            }
          });
        }

        function field(cls, value, placeholder, label) {
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'track-input ' + cls;
          input.value = value;
          if (placeholder) input.placeholder = placeholder;
          input.setAttribute('aria-label', label + ' for ' + songDisplay(song));
          var was = value;
          input.addEventListener('focus', function () { was = input.value; trackPendingDelete = null; });
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
            if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); input.value = was; input.blur(); }
          });
          input.addEventListener('blur', function () {
            if (input.value === was) return;
            commit(input, was);
          });
          return input;
        }

        function blurbField(value) {
          var area = document.createElement('textarea');
          area.className = 'track-input track-input--blurb';
          area.rows = 1;
          area.value = value;
          area.placeholder = 'no blurb';
          area.setAttribute('aria-label', 'Blurb for ' + songDisplay(song));
          area.title = 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          var was = value;

          var manual = false;

          var applied = 0;

          function grow() {
            if (manual) return;

            if (!area.isConnected) return;

            area.style.height = 'auto';
            applied = Math.max(30, area.scrollHeight);
            area.style.height = applied + 'px';
          }
          grow();

          area.growToFit = grow;

          if (window.ResizeObserver) {
            var ro = new ResizeObserver(function (entries) {
              if (manual || !entries.length) return;
              var h = Math.round(entries[0].contentRect.height + 10);

              if (applied && Math.abs(h - applied) > 2) {
                manual = true;
                area.classList.add('is-manual');
                ro.disconnect();
              }
            });
            ro.observe(area);
          }

          area.addEventListener('focus', function () { was = area.value; trackPendingDelete = null; });
          area.addEventListener('input', function () {

            var NL = String.fromCharCode(10);
            if (area.value.indexOf(NL) >= 0) {
              area.value = area.value.split(NL).join(' ').replace(/  +/g, ' ');
            }
            grow();
          });
          area.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); area.blur(); }
            if (event.key === 'Escape') {
              event.stopPropagation();
              event.preventDefault();
              area.value = was;
              grow();
              area.blur();
            }
          });
          area.addEventListener('blur', function () {
            if (area.value === was) return;
            commit(area, was);
          });
          return area;
        }

        var playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'track-play' + (isFocused ? ' is-playing' : '');
        playBtn.textContent = isFocused ? '\u25a0' : '\u25b6';
        playBtn.setAttribute('aria-label', (isFocused ? 'Close the player for ' : 'Play ')
          + songDisplay(song));
        playBtn.setAttribute('aria-pressed', isFocused ? 'true' : 'false');
        playBtn.title = isFocused
          ? 'Close the player'
          : (text(song.spotifyId)
              ? 'Play this track'
              : 'No Spotify id on this track, so this opens a Spotify search instead');
        playBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          focusTrackId = isFocused ? null : song.id;
          renderTracks();
        });

        var posEl = field('track-input--num', String(Number(song.position) || 0), '', 'Position');
        var titleEl = field('track-input--title', text(song.title), '', 'Title');
        var artistEl = field('', text(song.artist), '', 'Artist');

        var blurbEl = blurbField(text(song.blurb));

        var idEl = field('track-input--id', text(song.spotifyId), 'none', 'Spotify id');
        idEl.title = 'Paste the Spotify share link straight in and the 22-character id is taken out of it.'
          + ' A raw id or a spotify:track: URI works too. Blank is always allowed and is better than a guess:'
          + ' a made-up id passes every check and silently plays nothing.';

        var explicitWrap = document.createElement('span');
        explicitWrap.className = 'track-explicit';
        var explicitEl = document.createElement('input');
        explicitEl.type = 'checkbox';
        explicitEl.checked = !!song.explicit;
        explicitEl.setAttribute('aria-label', 'Explicit, for ' + songDisplay(song));
        explicitEl.title = 'Marked explicit on Spotify';
        explicitEl.addEventListener('change', function () {
          commit(null, null, function (f) { f.explicit = !!explicitEl.checked; });
        });
        explicitWrap.appendChild(explicitEl);

        var air = document.createElement('label');
        air.className = 'tape-air track-air';
        var off = document.createElement('span');
        off.className = 'tape-air-word tape-air-word--off';
        off.textContent = 'Shelved';
        var box = document.createElement('input');
        box.className = 'tape-air-input';
        box.type = 'checkbox';
        box.checked = status === 'LIVE';
        box.setAttribute('aria-label', 'Status of ' + songDisplay(song));
        box.title = status === 'LIVE'
          ? 'On /soundtracks/. Switch to shelve it: the row stays on the tape, so the routine never picks it again.'
          : 'Off /soundtracks/. Switch to keep it.';
        var switchTrack = document.createElement('span');
        switchTrack.className = 'tape-air-track';
        switchTrack.setAttribute('aria-hidden', 'true');
        var on = document.createElement('span');
        on.className = 'tape-air-word tape-air-word--on';
        on.textContent = 'Live';
        box.addEventListener('change', function () {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list - press Reload and try again', 'error');
            return;
          }
          trackPendingDelete = null;
          box.disabled = true;
          setTrackStatus(tapeIndex, songIndex, box.checked ? 'LIVE' : 'SHELVED').then(function (ok) {
            box.disabled = false;
            if (!ok) box.checked = !box.checked;
            renderTracks();
          });
        });
        air.append(off, box, switchTrack, on);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'track-del';
        del.textContent = '×';
        del.setAttribute('aria-label', 'Delete ' + songDisplay(song));
        del.title = 'Delete this row outright. Shelving is almost always what you want instead.';
        del.addEventListener('click', function () {
          trackPendingDelete = trackPendingDelete === song.id ? null : song.id;
          renderTracks();
        });

        line.append(playBtn, posEl, titleEl, artistEl, blurbEl, idEl, explicitWrap, air, del);

        if (isFocused) {
          var stage = document.createElement('div');
          stage.className = 'track-stage';
          stage.appendChild(trackPlayer(song));
          line.appendChild(stage);
        }

        var mine = songIssues(song);
        if (mine.length) {
          var box = document.createElement('div');
          box.className = 'track-issues';
          mine.forEach(function (issue) {
            box.appendChild(buildIssueItem(issue, {
              onDone: function () { renderTrackArchive(); renderTracks(); }
            }));
          });
          line.appendChild(box);
        }

        if (trackPendingDelete === song.id) {
          var confirmEl = document.createElement('div');
          confirmEl.className = 'track-confirm';
          var words = document.createElement('p');
          var lead = document.createElement('strong');
          lead.textContent = 'Delete this row for good? ';
          words.appendChild(lead);
          words.appendChild(document.createTextNode(
            'Shelving keeps it here as a do-not-rescrape tombstone, so the routine never picks it '
            + 'for this tape again. Deleting throws that away, and the song can come straight back '
            + 'on the next run.'));
          var shelveBtn = document.createElement('button');
          shelveBtn.type = 'button';
          shelveBtn.className = 'btn small primary';
          shelveBtn.textContent = 'Shelve instead';
          shelveBtn.addEventListener('click', function () {
            var songIndex = (tape.songs || []).indexOf(song);
            trackPendingDelete = null;
            if (songIndex < 0) { renderTracks(); return; }
            setTrackStatus(tapeIndex, songIndex, 'SHELVED').then(function () { renderTracks(); });
          });
          var reallyBtn = document.createElement('button');
          reallyBtn.type = 'button';
          reallyBtn.className = 'btn small';
          reallyBtn.textContent = 'Delete anyway';
          reallyBtn.addEventListener('click', function () {
            reallyBtn.disabled = true;
            deleteTrack(tapeIndex, song).then(function () { renderTracks(); });
          });
          var cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'btn small';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.addEventListener('click', function () { trackPendingDelete = null; renderTracks(); });
          confirmEl.append(words, shelveBtn, reallyBtn, cancelBtn);
          line.appendChild(confirmEl);
        }

        return line;
      }

      async function deleteTrack(tapeIndex, song) {
        var tape = soundtracks()[tapeIndex];
        if (!tape || !song || song.id == null) return false;
        try {
          await deleteRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id));
        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + songDisplay(song), 'error');
          return false;
        }
        var at = (tape.songs || []).indexOf(song);
        if (at >= 0) tape.songs.splice(at, 1);

        var dropped = 0;
        if (Array.isArray(soundtrackIssues)) {
          for (var i = soundtrackIssues.length - 1; i >= 0; i--) {
            if (String(soundtrackIssues[i].song_id) === String(song.id)) {
              soundtrackIssues.splice(i, 1);
              dropped += 1;
            }
          }
        }

        trackPendingDelete = null;

        renderTrackArchive('deleted ' + songDisplay(song)
          + (dropped ? ', and its ' + dropped + (dropped === 1 ? ' issue' : ' issues') : '')
          + ', its tombstone went with it, so the routine may propose it again', 'hold');
        return true;
      }

      if (fillPromptBtn) fillPromptBtn.addEventListener('click', function () {

        var done = function () {
          fillPromptBtn.textContent = 'Copied';

          setTimeout(function () {
            fillPromptBtn.textContent = 'Fill prompt';
            fillPromptBtn.classList.remove('is-copied');
          }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(said).then(done, function () {
            setNotice('could not reach the clipboard, the prompt is in the console', 'error');
            console.log(said);
          });
        } else {
          setNotice('this browser has no clipboard access, the prompt is in the console', 'error');

      if (tracksBackdrop) tracksBackdrop.addEventListener('click', closeTracks);

      document.addEventListener('keydown', function (event) {

      function openTracksFromHash() {
        var hash = text(location.hash).replace(/^#/, '');
        var m = /^tape=(.+)$/.exec(hash);
        if (m) { openTracks(decodeURIComponent(m[1])); return true; }

        m = /^tracks=(.+)$/.exec(hash);
        if (m) {
          var first = tapesInCity(decodeURIComponent(m[1]))[0];
          if (first) openTracks(first.id);
          else setNotice('no tape for ' + decodeURIComponent(m[1]), 'error');
          return true;
        }
        m = /^track=(.+)$/.exec(hash);
        if (m) { openTrackById(decodeURIComponent(m[1])); return true; }
        return false;
      }

      var manualCard = document.getElementById('manualCard');
      var manualBackdrop = document.getElementById('manualBackdrop');
      var manualCityInput = document.getElementById('manualCity');
      var manualSpineInput = document.getElementById('manualSpine');
      var manualAirInput = document.getElementById('manualAirInput');
      var manualAddBtn = document.getElementById('manualAddBtn');
      var manualNote = document.getElementById('manualNote');
      var manualPreview = document.getElementById('manualPreview');

      var manualLeads = false;

      function paintManualPreview() {
        if (!manualPreview) return;
        manualPreview.textContent = '';
        var cityRow = cityByLabel(text(manualCityInput && manualCityInput.value));
        var cityStr = cityRow ? soundCityLabel(cityRow.slug) : '';
        var spineStr = text(manualSpineInput && manualSpineInput.value);

        if (!cityStr && !spineStr) {
          manualPreview.classList.add('is-empty');

        manualPreview.classList.remove('is-empty');

        flip.disabled = !spineStr;
        flip.title = !spineStr
          ? 'Type a spine phrase and this swaps which side of the city it reads on'
          : (manualLeads
              ? 'Swap: put the city first, "' + (cityStr || 'city') + ' ' + spineStr + '"'
              : 'Swap: put the city last, "' + spineStr + ' ' + (cityStr || 'city') + '"');

      function ordinalWord(n) {
        return ({ 2: 'second', 3: 'third', 4: 'fourth', 5: 'fifth' })[n] || (n + 'th');
      }

      function manualTarget() {
        var typed = text(manualCityInput && manualCityInput.value);
        if (!typed) return { ok: false, quiet: true, why: '' };
        var row = cityByLabel(typed);
        if (!row) return { ok: false, why: 'No city called "' + typed + '" in the catalogue.' };

        var wanted = text(manualSpineInput && manualSpineInput.value).toLowerCase();
        var clash = soundtracks().filter(function (tape) {
          return text(tape.city_slug) === row.slug
            && text(tape.spine_tag).toLowerCase() === wanted;
        })[0];
        if (clash) {
          return { ok: false, why: wanted
            ? (cityFullLabel(row.slug) + ' already has a tape called "' + text(clash.spine_tag) + '". Give this one a different spine phrase.')
            : (cityFullLabel(row.slug) + ' already has a tape with no spine phrase. Give this one a phrase to tell them apart.') };
        }
        if (truthyFlag(row.hide_from_soundtracks)) {

          return { ok: false, why: cityFullLabel(row.slug) + ' is hidden from /soundtracks/, so it cannot have a tape.' };
        }
        return { ok: true, row: row };
      }

      function paintManual() {
        paintManualPreview();

        var foot = document.getElementById('manualFootNote');
        if (foot) {
          foot.textContent = (manualAirInput && manualAirInput.checked)
            ? 'The tape starts LIVE and empty, so it appears on /soundtracks/ as soon as a track on it is live. Tracks come from the PROMPT, from TGB SOUNDTRACK BOT, or from a paste into Supabase.'
            : 'The tape starts SHELVED and empty, so nothing reaches /soundtracks/ until you say so. Tracks come from the PROMPT, from TGB SOUNDTRACK BOT, or from a paste into Supabase.';
        }
        var t = manualTarget();
        if (manualAddBtn) manualAddBtn.disabled = !t.ok;
        if (!manualNote) return;
        manualNote.classList.toggle('is-error', !t.ok && !t.quiet);
        manualNote.classList.toggle('is-ready', !!t.ok);
        manualNote.textContent = t.ok
          ? ('Ready: a shelved tape for ' + text(t.row.city)
              + (tapesInCity(t.row.slug).length ? ', which will be its '
                  + ordinalWord(soundtracks().filter(function (x) { return text(x.city_slug) === t.row.slug; }).length + 1)
                  + '.' : ', slug "' + t.row.slug + '".'))
          : (t.why || '');
      }

      function openManual() {
        if (manualCityInput) manualCityInput.value = '';
        if (manualSpineInput) manualSpineInput.value = '';

        if (manualAirInput) manualAirInput.checked = false;
        manualLeads = false;
        paintManual();
        if (manualBackdrop) manualBackdrop.hidden = false;
        if (manualCard) manualCard.hidden = false;

      function closeManual() {
        if (manualBackdrop) manualBackdrop.hidden = true;
        if (manualCard) manualCard.hidden = true;
        var others = ['promptCard', 'manualCard'];
        for (var i = 0; i < others.length; i++) {
          var el = document.getElementById(others[i]);
          if (el && !el.hidden) return;
        }
        document.body.style.overflow = '';
      }

      var manualBtn = document.getElementById('manualBtn');
      if (manualBtn) manualBtn.addEventListener('click', openManual);
      if (manualBackdrop) manualBackdrop.addEventListener('click', closeManual);
      if (manualCard) {
        Array.prototype.forEach.call(manualCard.querySelectorAll('[data-manual-close]'), function (btn) {
          btn.addEventListener('click', closeManual);
        });
      }
      if (manualCityInput) manualCityInput.addEventListener('input', paintManual);
      if (manualAirInput) manualAirInput.addEventListener('change', paintManual);

      if (manualSpineInput) manualSpineInput.addEventListener('input', paintManual);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && manualCard && !manualCard.hidden) closeManual();
      });

      if (manualAddBtn) manualAddBtn.addEventListener('click', async function () {
        var t = manualTarget();
        if (!t.ok) return;
        manualAddBtn.disabled = true;

        var goLive = !!(manualAirInput && manualAirInput.checked);
        var body = { city_slug: t.row.slug, archived: !goLive };
        var spine = text(manualSpineInput && manualSpineInput.value);
        if (spine) body.spine_tag = spine;

        if (spine && manualLeads) body.spine_tag_position = 'before';
        var made;
        try {
          made = await insertRow('soundtracks', body);
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(t.row.slug)), 'error');
          manualAddBtn.disabled = false;
          return;
        }

        var list = soundtrackArchiveData && soundtrackArchiveData.soundtracks;
        if (Array.isArray(list)) {
          list.push({
            city_slug: made.city_slug,
            spine_tag: made.spine_tag || '',
            spine_tag_position: made.spine_tag_position || '',
            archived: made.archived === undefined ? !goLive : made.archived,
            created_at: made.created_at || '',
            songs: []
          });
        }
        closeManual();

        paintCityOptions();

        renderTrackArchive('started a tape for ' + cityFullLabel(made.city_slug)
          + (goLive
              ? ', live but empty until you add tracks'
              : ', shelved and empty until you add tracks and put it live'), 'hold');

      var issueTotalBtn = document.getElementById('issueTotal');

      var newTotalEl = document.getElementById('newTotal');

      function paintNewTotal() {
        if (!newTotalEl) return;
        var n = soundtracks().filter(isNewTape).length;

        newTotalEl.textContent = String(n);

        var pill = document.getElementById('newTotalPill');
        if (pill) pill.classList.toggle('is-zero', n === 0);
        newTotalEl.title = n
          ? (n + (n === 1 ? ' tape' : ' tapes') + ' added, or added to, in the last '
             + NEW_FOR_HOURS + ' hours. Tick to see only those.')
          : ('Nothing added in the last ' + NEW_FOR_HOURS + ' hours.');
      }

      var trackTotalEl = document.getElementById('trackTotal');

      function paintTrackTotal() {
        if (!trackTotalEl) return;
        var live = 0, all = 0;
        soundtracks().forEach(function (tape) {
          var c = tapeCounts(tape);
          live += c.LIVE;
          all += c.LIVE + c.SHELVED;
        });
        trackTotalEl.textContent = live + '/' + all;
        trackTotalEl.title = live + ' LIVE, ' + (all - live) + ' SHELVED, across every tape';
      }

      function paintIssueTotal() {
        if (!issueTotalBtn) return;
        var all = openIssues();

        var tapeFlags = all.filter(function (i) { return i.song_id == null; }).length;
        var trackFlags = all.length - tapeFlags;
        issueTotalBtn.textContent = String(all.length);

        var pill = document.getElementById('issueTotalPill');
        if (pill) pill.title = issueScopeSummary(tapeFlags, trackFlags)
          + ' across every tape. Press to see only the tapes carrying them.';

      var tapeAirAll = document.getElementById('tapeAirAll');
      var tapeAirAllInput = document.getElementById('tapeAirAllInput');

      function airCounts() {
        var live = 0, shelved = 0;
        soundtracks().forEach(function (tape) {
          if (truthyFlag(tape && tape.archived)) shelved += 1; else live += 1;
        });
        return { live: live, shelved: shelved, total: live + shelved };
      }

      function paintMasterAir() {
        if (!tapeAirAllInput || !tapeAirAll) return;
        var n = airCounts();
        var allLive = n.total > 0 && n.shelved === 0;
        var allShelved = n.total > 0 && n.live === 0;
        tapeAirAllInput.indeterminate = !allLive && !allShelved;
        tapeAirAllInput.checked = allLive;
        tapeAirAllInput.disabled = n.total === 0;
        tapeAirAll.querySelector('.tape-air-word--off')
          .classList.toggle('is-current', allShelved);
        tapeAirAll.querySelector('.tape-air-word--on')
          .classList.toggle('is-current', allLive);
        tapeAirAllInput.title = n.total === 0
          ? 'No tapes loaded.'
          : n.live + ' live, ' + n.shelved + ' shelved. Switching this puts every tape the same way.';
      }

      if (tapeAirAllInput) tapeAirAllInput.addEventListener('change', async function () {
        var want = !tapeAirAllInput.checked;
        var n = airCounts();
        var affected = want ? n.live : n.shelved;
        if (!affected) { paintMasterAir(); return; }

        var question = want
          ? ('Shelve every tape?\n\n' + affected + ' live tape' + (affected === 1 ? '' : 's')
            + ' will come off /soundtracks/, along with every track on them. The public page will be empty.')
          : ('Put every tape back on air?\n\n' + affected + ' shelved tape' + (affected === 1 ? '' : 's')
            + ' will return to /soundtracks/, with the tracks each one took down. A track shelved on its own stays shelved.');
        if (!window.confirm(question)) { paintMasterAir(); return; }

        tapeAirAllInput.disabled = true;
        try {

          await patchRow('soundtracks?archived=is.' + (want ? 'false' : 'true'),
            { archived: want });
        } catch (error) {
          console.error(error);
          setNotice((want ? 'could not shelve every tape' : 'could not put every tape back'), 'error');
          paintMasterAir();
          return;
        }

        soundtracks().forEach(function (tape) { tape.archived = want; });
        if (trackArchiveList) {
          Array.prototype.forEach.call(trackArchiveList.querySelectorAll('.tape-line'), function (row) {
            if (typeof row.repaintAir === 'function') row.repaintAir(want);
          });
        }
        paintMasterAir();
        setNotice((want ? 'shelved every tape, ' : 'put every tape back on air, ')
          + affected + ' changed', want ? 'hold' : 'success');

      function fitInput(el) {

        if (!el || !el.isConnected) return;
        var css = window.getComputedStyle(el);
        var borders = parseFloat(css.borderLeftWidth) + parseFloat(css.borderRightWidth);
        el.style.width = '0px';
        var need = el.scrollWidth;

        el.style.width = Math.ceil(need + borders + 2) + 'px';
      }

      var TEXT_FLOOR_PX = 9;

      function fitText(el) {
        if (!el || !el.isConnected) return;
        el.style.fontSize = '';
        if (el.scrollWidth <= el.clientWidth) return;
        var size = parseFloat(window.getComputedStyle(el).fontSize);
        while (el.scrollWidth > el.clientWidth && size > TEXT_FLOOR_PX) {
          size -= 0.5;
          el.style.fontSize = size + 'px';
        }
      }

      var fontsFitted = false;

      function fitRowInputs() {
        if (!trackArchiveList) return;
        Array.prototype.forEach.call(
          trackArchiveList.querySelectorAll('.city-input, .spine-input'), fitInput);
        Array.prototype.forEach.call(
          trackArchiveList.querySelectorAll('.tape-line-country, .tape-line-state'), fitText);
      }

      var refitTimer = 0;
      window.addEventListener('resize', function () {
        window.clearTimeout(refitTimer);
        refitTimer = window.setTimeout(fitRowInputs, 120);
      });

      var cityMap = Object.create(null);

      function rebuildCityMap(rows) {
        var map = Object.create(null);
        (Array.isArray(rows) ? rows : []).forEach(function (row) {
          if (row && row.slug) map[String(row.slug)] = row;
        });
        cityMap = map;
      }

      function cityRow(slug) {
        var s = text(slug);
        return s ? (cityMap[s] || null) : null;
      }

      function soundCityLabel(slug) {
        var s = text(slug);
        if (!s) return '(unknown city)';
        var row = cityRow(s);
        var canonical = row ? text(row.city) : '';
        if (canonical) return canonical.split(',')[0].trim();
        var named = row ? text(row.city_name) : '';
        if (named) return named;

        return s.split('-').map(function (part) {
          return part ? part.charAt(0).toUpperCase() + part.slice(1) : '';
        }).join(' ');
      }

      function cityStateLabel(slug) {
        var row = cityRow(slug);
        if (!row) return '';
        var name = text(row.state_name);
        if (name) return name;
        var code = text(row.state_code);
        if (code) return code;
        var canonical = text(row.city);
        var parts = canonical ? canonical.split(',') : [];

        return parts.length > 2 ? parts[1].trim() : '';
      }

      function cityCountryLabel(slug) {
        var row = cityRow(slug);
        if (!row) return '';
        var name = text(row.country_name);
        if (name) return name;
        var code = text(row.country_code);
        if (code) return code;
        var canonical = text(row.city);
        var parts = canonical ? canonical.split(',') : [];
        return parts.length === 2 ? parts[1].trim() : '';
      }

      var NEW_FOR_HOURS = 72;

      function tapeNewsAt(tape) {
        var newest = null;
        var made = tape && tape.created_at ? new Date(tape.created_at) : null;
        if (made && Number.isFinite(made.getTime())) newest = made;
        ((tape && tape.songs) || []).forEach(function (song) {
          var at = songDate(song);
          if (at && (!newest || at > newest)) newest = at;
        });
        return newest;
      }

      function newBadge(tape) {
        var madeAt = tape && tape.created_at ? new Date(tape.created_at) : null;
        var tapeIsNew = madeAt && Number.isFinite(madeAt.getTime())
          && (Date.now() - madeAt.getTime()) < NEW_FOR_HOURS * 3600 * 1000;
        var badge = document.createElement('span');
        badge.className = 'tape-new';
        badge.textContent = 'New';
        badge.title = (tapeIsNew ? 'This tape was added ' : 'A track was added to this tape ')
          + relativeTime(tapeNewsAt(tape), new Date())
          + '. The badge clears itself after ' + NEW_FOR_HOURS + ' hours.';
        return badge;
      }

      function isNewTape(tape) {
        var at = tapeNewsAt(tape);
        if (!at) return false;
        return (Date.now() - at.getTime()) < NEW_FOR_HOURS * 3600 * 1000;
      }

      function tapeFullName(tape) {
        var city = soundCityLabel(tape && tape.city_slug);
        var spine = text(tape && tape.spine_tag);
        if (!spine) return city;
        return text(tape && tape.spine_tag_position) === 'before'
          ? spine + ' ' + city
          : city + ' ' + spine;
      }

      function cityFullLabel(slug) {
        var row = cityRow(slug);
        if (!row) return soundCityLabel(slug);
        return text(row.city) || soundCityLabel(slug);
      }

      var STALE_AFTER_HOURS = REVIEW_HOURS;

      function relativeTime(then, now) {
        if (!(then instanceof Date) || !Number.isFinite(then.getTime())) return '';
        var mins = Math.round((now - then) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
        var hours = Math.round(mins / 60);
        if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
        var days = Math.round(hours / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
      }

      async function loadLastRun() {
        var botBtn = document.getElementById('soundtrackBotBtn');
        if (!botBtn) return;

        function say(when, what, stale) {
          botBtn.title = [text(when), text(what)].filter(Boolean).join(' — ');
          botBtn.classList.toggle('is-stale', !!stale);
        }

        try {

          var res = await fetch(
            restUrl('soundtrack_songs?select=city_slug,title,artist,created_at&order=created_at.desc&limit=1'),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) throw new Error('Supabase ' + res.status);
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) throw new Error('no songs');

          var row = rows[0];
          var stamp = new Date(row.created_at);
          if (!Number.isFinite(stamp.getTime())) throw new Error('no timestamp');
          var now = new Date();
          var stale = (now - stamp) / 3600000 > STALE_AFTER_HOURS;

          var since = new Date(stamp.getTime() - 3600000).toISOString();
          var wrote = await runTally(since);

          var detail = stamp.toLocaleString([], {
            weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit'
          }) + (wrote ? ' · ' + wrote : ' · ' + soundCityLabel(row.city_slug))
            + (stale ? ' · no new track in over a day — check the routine.' : '');

          say('Last run ' + relativeTime(stamp, now), detail, stale);
        } catch (error) {

          say('Last run unavailable',
            'Could not read public.soundtrack_songs. Open the routine to check directly.', true);
        }
      }

      loadLastRun();

      (function () {
        var promptBtn = document.getElementById('promptBtn');
        var promptBackdrop = document.getElementById('promptBackdrop');
        var promptCard = document.getElementById('promptCard');
        var promptEl = document.getElementById('promptText');
        var copyStatus = document.getElementById('copyStatus');
        var copyBtn = document.getElementById('copyPromptTop');
        var copyPromptLabel = document.getElementById('copyPromptLabel');
        var promptAiRow = document.getElementById('promptAiRow');
        var citySelect = document.getElementById('promptCity');
        var cityNote = document.getElementById('promptCityNote');
        if (!promptBtn || !promptCard || !promptBackdrop) return;
        var copyResetTimer = 0;

        var BASE_PROMPT = promptEl ? promptEl.value : '';
        var citiesLoaded = false;

        async function loadPromptCities() {
          if (citiesLoaded || !citySelect) return;
          citiesLoaded = true;
          citySelect.disabled = true;
          if (cityNote) { cityNote.classList.remove('is-warn'); cityNote.textContent = 'loading…'; }
          try {

            var rows = await fetchAllRows('cities?select=*&order=city.asc');

            var have = Object.create(null);
            soundtracks().forEach(function (tape) {
              have[text(tape && tape.city_slug)] = tapeCounts(tape);
            });
            var added = 0;
            rows.forEach(function (row) {
              var hidden = row.hide_from_soundtracks != null
                ? truthyFlag(row.hide_from_soundtracks)
                : truthyFlag(row.ignored);
              if (hidden) return;
              var slug = text(row.slug);
              if (!slug) return;
              var opt = document.createElement('option');
              opt.value = slug;
              var counts = have[slug];
              opt.textContent = text(row.city) || slug;
              if (counts) opt.textContent += '  — ' + counts.LIVE + ' live'
                + (counts.SHELVED ? ', ' + counts.SHELVED + ' shelved' : '');
              citySelect.appendChild(opt);
              added += 1;
            });
            citySelect.disabled = false;
            if (cityNote) cityNote.textContent = added + ' cities';
          } catch (error) {
            console.error(error);

            citiesLoaded = false;
            if (cityNote) {
              cityNote.classList.add('is-warn');
              cityNote.textContent = 'city list unavailable — leave blank';
            }
          }
        }

        function applyPromptCity() {
          if (!promptEl) return;
          var slug = citySelect ? text(citySelect.value) : '';
          if (!slug) { promptEl.value = BASE_PROMPT; return; }
          var label = citySelect.options[citySelect.selectedIndex].textContent.split('  — ')[0];
          promptEl.value =
            'CITY FOR THIS RUN — ALREADY CHOSEN\n'
            + 'Build the tape for ' + label + '. Its city_slug is exactly "' + slug + '";\n'
            + 'use that string verbatim and do not look it up or reshape it.\n'
            + 'Skip the tier ladder below — it only applies when I have not named\n'
            + 'a city. Everything else in this prompt still holds.\n\n'
            + BASE_PROMPT;
        }

        if (citySelect) citySelect.addEventListener('change', applyPromptCity);

        function openTool(card, backdrop, focusEl) {
          if (!card) return;
          if (backdrop) backdrop.hidden = false;
          card.hidden = false;
          document.body.style.overflow = 'hidden';
          window.setTimeout(function () {
            var target = focusEl || card.querySelector('input, textarea, select, button, a');
            if (target && typeof target.focus === 'function') target.focus();
          }, 0);
        }

        function closeTool(card, backdrop) {
          if (backdrop) backdrop.hidden = true;
          if (card) card.hidden = true;
          if (promptCard && !promptCard.hidden) return;

          var tracks = document.getElementById('tracksCard');
          if (tracks && !tracks.hidden) return;
          var manual = document.getElementById('manualCard');
          if (manual && !manual.hidden) return;
          document.body.style.overflow = '';
        }

        function resetCopyButton() {
          window.clearTimeout(copyResetTimer);
          if (copyBtn) copyBtn.classList.remove('is-done');
          if (copyPromptLabel) copyPromptLabel.textContent = 'Copy prompt';
        }

        function openPrompt() {
          resetCopyButton();
          if (copyStatus) copyStatus.textContent = '';
          openTool(promptCard, promptBackdrop, copyBtn);

          loadPromptCities();
        }

        function closePrompt() { closeTool(promptCard, promptBackdrop); }

        async function copyPromptText() {
          if (!promptEl) return false;
          window.clearTimeout(copyResetTimer);
          try {
            await navigator.clipboard.writeText(promptEl.value || '');
            if (copyBtn) copyBtn.classList.add('is-done');
            if (copyPromptLabel) copyPromptLabel.textContent = 'Copied';
            if (copyStatus) copyStatus.textContent = '';
            copyResetTimer = window.setTimeout(resetCopyButton, 1800);
            return true;
          } catch (error) {
            resetCopyButton();
            if (copyStatus) copyStatus.textContent = 'Select the text and copy it by hand';
            return false;
          }
        }

        promptBtn.addEventListener('click', openPrompt);
        promptBackdrop.addEventListener('click', closePrompt);
        Array.prototype.forEach.call(document.querySelectorAll('[data-prompt-close]'), function (button) {
          button.addEventListener('click', closePrompt);
        });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && !promptCard.hidden) closePrompt();
        });
        if (copyBtn) copyBtn.addEventListener('click', copyPromptText);

        if (promptAiRow) promptAiRow.addEventListener('click', function (event) {
          var link = event.target && event.target.closest ? event.target.closest('a') : null;
          if (!link || !promptAiRow.contains(link)) return;
          copyPromptText();
        });
      }());

      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);
      adminAuth.init();
    }());
  </script>
</body>
</html>
