      function closeTracks() {
        if (tracksBackdrop) tracksBackdrop.hidden = true;
        if (tracksCard) tracksCard.hidden = true;
        tracksTapeId = null;
        tracksOnlySongId = null;
        focusTrackId = null;
        trackPendingDelete = null;
        setTracksHash('', null);
        document.body.style.overflow = '';
      }

      var trackAirAll = document.getElementById('trackAirAll');
      var trackAirAllInput = document.getElementById('trackAirAllInput');

      // Every track on the open tape, before any filter. The switch's counts
      // read this; the list reads visibleTrackSongs below.
      function allTrackSongs() {
        var tape = tapeById(tracksTapeId);
        return tape ? allSongs(tape) : [];
      }

      function visibleTrackSongs() {
        var songs = allTrackSongs();
        if (tracksOnlySongId != null) {
          return songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        }
        // ONE TEST, SHARED WITH THE MAIN LIST. Two readers of "what is visible"
        // is how the air switch ended up silently inert once already.
        return songs.filter(trackPassesFilters);
      }

      function paintTrackMasterAir() {
        // COUNTS OVER THE WHOLE TAPE, never over what the filter has left. A
        // count that shrank as you filtered would read as the filter breaking,
        // and the question it answers is how many there are.
        var songs = allTrackSongs();
        var live = 0, shelved = 0;
        songs.forEach(function (song) {
          if (songStatus(song) === 'LIVE') live += 1; else shelved += 1;
        });
        paintAirSwitch(trackAirAll, trackAirAllInput, trackAirFilter,
          { live: live, shelved: shelved, total: songs.length }, 'tracks');
      }

      // ONE QUESTION ASKED FROM TWO PLACES. The popup's switch and the one on
      // the main list's header are the same filter, so both go through here and
      // both surfaces repaint: setting it in the popup and finding the list
      // behind it unchanged is the sort of disagreement nobody notices until it
      // has cost them something.
      function setTrackAir(value) {
        trackAirFilter = value;
        // CHOOSING ONE CLEARS THE OTHERS. See `setTrackFlag` for the argument.
        if (value !== 'all') trackFlagFilter = '';
        renderTrackArchive();
        if (tracksOpen()) renderTracks();
      }

      wireAirSwitch(trackAirAll, trackAirAllInput,
        function () { return trackAirFilter; },
        setTrackAir);

      // THE X IN THE HEADER DELETES WHAT IS TICKED, AND NOTHING ELSE.
      //
      // It deleted the whole TAPE until 2026-08-26, and it does not any more:
      // it removes the ticked tracks and touches nothing else. THERE IS NO
      // TAPE-LEVEL DELETE NOW, which is a real capability removed rather than
      // relocated -- do not describe this button as the same thing reached a
      // different way.
      //
      // IT IS OFF, NOT ABSENT, WHEN NOTHING IS TICKED. A control that vanished
      // would move the two beside it, so the position of the one you want would
      // depend on the state of the selection. `aria-disabled` rather than
      // `disabled`, because a disabled button dispatches no click at all and on
      // a touch screen the reason it is off would be unreachable.
      function buildSelectionDelete() {
        var n = selectedCount();
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'track-del' + (bulkPendingDelete ? ' is-armed' : '')
          + (n ? '' : ' is-off');
        btn.textContent = '\u00d7';
        btn.setAttribute('aria-label', n
          ? ('Delete ' + n + (n === 1 ? ' selected track' : ' selected tracks'))
          : 'Delete selected tracks');
        btn.setAttribute('aria-disabled', n ? 'false' : 'true');
        btn.title = !n
          ? 'Tick the tracks you want to delete first. This acts on the selection only.'
          : (bulkPendingDelete
              ? 'Put the question away'
              : 'Delete the ' + n + (n === 1 ? ' selected track' : ' selected tracks'));
        btn.addEventListener('click', function (event) {
          event.stopPropagation();
          if (!n) {
            setNotice('tick the tracks you want to delete first', 'error');
            return;
          }
          bulkPendingDelete = !bulkPendingDelete;
          renderTrackArchive();
        });
        return btn;
      }

      // THE QUESTION, IN THE HEADER, WITH THE CONSEQUENCE NOBODY EXPECTS IN IT.
      // That the rows go is obvious. That the tracks take their do-not-rescrape
      // tombstones with them is not, and it is the reason shelving is almost
      // always the right answer instead.
      function renderSelectionConfirm(tape) {
        var n = selectedCount();
        if (!bulkPendingDelete || !n) return null;

        var box = document.createElement('div');
        box.className = 'track-confirm track-confirm--head';

        var words = document.createElement('p');
        var lead = document.createElement('strong');
        lead.textContent = 'Delete ' + n + (n === 1 ? ' track' : ' tracks') + ' for good? ';
        words.appendChild(lead);
        words.appendChild(document.createTextNode(
          'This cannot be undone. They take their do-not-rescrape tombstones with '
          + 'them, so the routine is free to propose every one of them again. '
          + 'Shelving keeps all of it and simply takes them off /soundtracks/.'));

        var shelveBtn = document.createElement('button');
        shelveBtn.type = 'button';
        shelveBtn.className = 'btn small primary';
        shelveBtn.textContent = 'Shelve instead';
        shelveBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          bulkPendingDelete = false;
          applyToSelection(tape, { archived: true }, 'Shelve');
        });

        var reallyBtn = document.createElement('button');
        reallyBtn.type = 'button';
        reallyBtn.className = 'btn small';
        reallyBtn.textContent = 'Delete anyway';
        reallyBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          reallyBtn.disabled = true;
          await deleteSelection(tape);
        });

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn small';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          bulkPendingDelete = false;
          renderTrackArchive();
        });

        box.append(words, shelveBtn, reallyBtn, cancelBtn);
        return box;
      }

      // `tapePendingDelete`, `renderTapeConfirm` and `deleteTape` went here on
      // 2026-08-26, when the header's X stopped acting on the tape. They were
      // the only tape-level delete, so THAT CAPABILITY IS GONE rather than
      // moved: deleting a tape is now deleting its tracks, which is a different
      // act with a different scope even where the outcome looks the same.

      function renderTracks() {
        if (!trackLines || !tracksOpen()) return;
        var tape = tapeById(tracksTapeId);
        if (!tape) { closeTracks(); return; }
        var tapeIndex = tapeIndexById(tracksTapeId);
        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;

        tracksTitle.textContent = '';
        tracksTitle.appendChild(buildTapeNameEditor(tracksTapeId));

        // BOTH TAKE A SLUG. They were handed the tape id, so the state and the
        // country have never drawn on this subtitle -- silently, since an
        // unknown slug returns '' rather than complaining.
        var whereBits = [cityStateLabel(tape.city_slug), cityCountryLabel(tape.city_slug)]
          .map(text).filter(Boolean);
        var bits = [];
        if (whereBits.length) bits.push(whereBits.join(', '));
        bits.push(total + (total === 1 ? ' track' : ' tracks'));
        bits.push(counts.LIVE + ' live');
        if (counts.SHELVED) bits.push(counts.SHELVED + ' shelved');
        // NOT "TAPE SHELVED". A tape has no state; what is true of one with no
        // live track is that /soundtracks/ does not draw it, which is the thing
        // somebody standing here wants to know.
        if (!counts.LIVE) bits.push('not on /soundtracks/');
        tracksSub.textContent = bits.join('  ·  ');

        var songs = allSongs(tape).slice().sort(function (a, b) {
          return (Number(a.position) || 0) - (Number(b.position) || 0) || (Number(a.id) - Number(b.id));
        });
        if (tracksOnlySongId != null) {
          songs = songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        } else {
          // THE HEADER'S CONTROLS ARE FILTERS. `visibleTrackSongs` says the same
          // thing for the keyboard and the counts, but this list is built here,
          // so the test has to run here too or the switch does nothing and says
          // nothing about why.
          songs = songs.filter(trackPassesFilters);
        }


        trackLines.textContent = '';

        if (!songs.length) {
          trackLines.appendChild(emptyNode(tracksOnlySongId != null
            ? 'That track is not on this tape any more.'
            : 'No tracks on this tape yet. They come from the PROMPT or TGB SOUNDTRACK BOT.'));
        } else {
          songs.forEach(function (song) {
            trackLines.appendChild(renderTrackLine(tape, tapeIndex, song));
          });
        }

        growBlurbs();

        Array.prototype.forEach.call(
          tracksTitle.querySelectorAll('.city-input, .spine-input'),
          function (el) { fitInput(el); });
        paintTrackMasterAir();

        tracksFoot.textContent = '';
        if (tracksOnlySongId != null) {
          var back = document.createElement('button');
          back.type = 'button';
          back.className = 'btn small';
          back.textContent = 'Show the whole tape';
          back.addEventListener('click', function () { openTracks(tracksTapeId); });
          tracksFoot.appendChild(back);
        } else {
          tracksFoot.textContent = 'Every field saves when you leave it. Enter saves, Escape puts the old value back.';
        }
      }

      // BOTH LISTS. This swept `trackLines` alone, which is the popup, so the
      // main list's blurbs stayed clipped at one line while the popup's grew to
      // two: the same row rendered two different heights depending on where you
      // were looking at it.
      function growBlurbs() {
        [trackLines, trackArchiveList].forEach(function (root) {
          if (!root) return;
          Array.prototype.forEach.call(
            root.querySelectorAll('textarea.track-input--blurb'),
            function (area) { if (typeof area.growToFit === 'function') area.growToFit(); });
        });
      }

      // A TRACK IS DRAWN IN TWO PLACES NOW: the main list and the tracks
      // popup. `renderTracks()` returns early when the popup is shut, so every
      // repaint inside a track row went through this instead -- otherwise
      // saving, shelving or deleting a track on the main list would change the
      // database and leave the row on screen showing the old value.
      function repaintTracks() {
        renderTrackArchive();
        renderTracks();
      }

      function renderTrackLine(tape, tapeIndex, song) {
        var line = document.createElement('div');
        line.className = 'track-line';
        var status = songStatus(song);
        line.classList.toggle('is-shelved', status === 'SHELVED');
        line.classList.toggle('is-live', status === 'LIVE');
        line.dataset.songId = String(song.id);
        var isFocused = focusTrackId != null && String(focusTrackId) === String(song.id);
        line.classList.toggle('is-focused', isFocused);

        line.addEventListener('click', function (event) {
          var el = event.target;
          if (el.closest('input, textarea, button, select, label, a')) return;
          focusTrackId = isFocused ? null : song.id;
          repaintTracks();
        });

        function commit(input, original, apply) {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list, so nothing was saved - press Reload and try again', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          var fields = {
            title: text(titleEl.value),
            artist: text(artistEl.value),
            position: Number(posEl.value) || 0,
            blurb: text(blurbEl.value) || null,
            spotify_id: spotifyIdFrom(idEl.value) || null,
            explicit: !!explicitEl.checked,
            sports: !!sportsEl.checked
          };
          if (apply) apply(fields);
          if (!fields.title || !fields.artist) {
            setNotice('a track needs a title and an artist', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          if (text(idEl.value) && !fields.spotify_id) {
            setNotice('that is not a Spotify track id. Paste the whole share link, or the 22-character id out of it', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          saveTrackFields(tapeIndex, songIndex, fields).then(function (result) {
            if (result && result.ok) repaintTracks();
            else {
              if (input && 'value' in input) input.value = original;
              setNotice((result && result.message) || 'could not save that track', 'error');
            }
          });
        }

        function field(cls, value, placeholder, label) {
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'track-input ' + cls;
          input.value = value;
          if (placeholder) input.placeholder = placeholder;
          input.setAttribute('aria-label', label + ' for ' + songDisplay(song));
          var was = value;
          input.addEventListener('focus', function () { was = input.value; trackPendingDelete = null; });
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
            if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); input.value = was; input.blur(); }
          });
          input.addEventListener('blur', function () {
            if (input.value === was) return;
            commit(input, was);
          });
          return input;
        }

        function blurbField(value) {
          var area = document.createElement('textarea');
          area.className = 'track-input track-input--blurb';
          area.rows = 1;
          area.value = value;
          area.placeholder = 'no blurb';
          area.setAttribute('aria-label', 'Blurb for ' + songDisplay(song));
          area.title = 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          var was = value;

          var manual = false;

          var applied = 0;

          // ONE LINE AT REST, THE WHOLE BLURB WHEN YOU ARE IN IT. This is what
          // actually sets a track row's height: a ten-word blurb wraps to two or
          // three lines in its column, so every row was two or three lines tall
          // and trimming the padding moved almost nothing.
          //
          // NOTHING IS HIDDEN THAT YOU CANNOT GET AT: the box grows the moment
          // it takes focus, its tooltip carries the full text, and a blurb that
          // fits on one line looks no different from before.
          var MIN_H = 26;

          // THE TOOLTIP IS SET WHATEVER HAPPENS, and outside `grow()`: that
          // function returns early when the box is not yet in the document,
          // which it never is when the row is being built, so a tooltip set in
          // there would only ever appear after a later resize.
          function paintBlurbTitle() {
            area.title = text(area.value)
              ? area.value
              : 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          }
          paintBlurbTitle();

          function grow() {
            if (manual) return;
            if (!area.isConnected) return;

            // IT GROWS TO ITS CONTENT, wherever it is drawn. It was one line at
            // rest, which made a track row on the main list a different height
            // from the same row in the popup.
            area.style.height = 'auto';
            applied = Math.max(MIN_H, area.scrollHeight);
            area.style.height = applied + 'px';
          }
          grow();

          area.growToFit = grow;

          if (window.ResizeObserver) {
            var ro = new ResizeObserver(function (entries) {
              if (manual || !entries.length) return;
              var h = Math.round(entries[0].contentRect.height + 10);

              if (applied && Math.abs(h - applied) > 2) {
                manual = true;
                area.classList.add('is-manual');
                ro.disconnect();
              }
            });
            ro.observe(area);
          }

          area.addEventListener('focus', function () {
            was = area.value; trackPendingDelete = null;
            grow();
          });
          area.addEventListener('blur', function () { paintBlurbTitle(); grow(); });
          area.addEventListener('input', function () {

            var NL = String.fromCharCode(10);
            if (area.value.indexOf(NL) >= 0) {
              area.value = area.value.split(NL).join(' ').replace(/  +/g, ' ');
            }
            grow();
          });
          area.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); area.blur(); }
            if (event.key === 'Escape') {
              event.stopPropagation();
              event.preventDefault();
              area.value = was;
              grow();
              area.blur();
            }
          });
          area.addEventListener('blur', function () {
            if (area.value === was) return;
            commit(area, was);
          });
          return area;
        }

        var playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'track-play' + (isFocused ? ' is-playing' : '');
        playBtn.textContent = isFocused ? '\u25a0' : '\u25b6';
        playBtn.setAttribute('aria-label', (isFocused ? 'Close the player for ' : 'Play ')
          + songDisplay(song));
        playBtn.setAttribute('aria-pressed', isFocused ? 'true' : 'false');
        playBtn.title = isFocused
          ? 'Close the player'
          : (text(song.spotifyId)
              ? 'Play this track'
              : 'No Spotify id on this track, so this opens a Spotify search instead');
        playBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          focusTrackId = isFocused ? null : song.id;
          repaintTracks();
        });

        var posEl = field('track-input--num', String(Number(song.position) || 0), '#', 'Position');
        posEl.title = 'Play order on the cassette. Edit it to reorder.';
        // THE PLACEHOLDER IS THE COLUMN LABEL NOW. The legend row above the
        // tracks was the room's third stacked header and went; without a
        // placeholder an empty Title field would be an unmarked white box.
        var titleEl = field('track-input--title', text(song.title), 'Title', 'Title');
        titleEl.title = 'Title. Enter saves, Escape cancels.';
        // NAMED SO THE SHRINK PASS CAN FIND IT. It was the one field on the row
        // with no class of its own, which is exactly how a field gets left out
        // of a sweep and nobody notices.
        var artistEl = field('track-input--artist', text(song.artist), 'Artist', 'Artist');
        artistEl.title = 'Artist. Enter saves, Escape cancels.';

        var blurbEl = blurbField(text(song.blurb));

        var idEl = field('track-input--id', text(song.spotifyId), 'Spotify id', 'Spotify id');
        idEl.title = 'Paste the Spotify share link straight in and the 22-character id is taken out of it.'
          + ' A raw id or a spotify:track: URI works too. Blank is always allowed and is better than a guess:'
          + ' a made-up id passes every check and silently plays nothing.';

        var explicitWrap = document.createElement('span');
        explicitWrap.className = 'track-explicit';
        var explicitEl = document.createElement('input');
        explicitEl.type = 'checkbox';
        explicitEl.checked = !!song.explicit;
        explicitEl.setAttribute('aria-label', 'Explicit, for ' + songDisplay(song));
        explicitEl.title = 'Marked explicit on Spotify';
        explicitEl.addEventListener('change', function () {
          commit(null, null, function (f) { f.explicit = !!explicitEl.checked; });
        });
        explicitWrap.appendChild(explicitEl);

        // SPORTS. A fight song, a victory anthem, a stadium walk-up or goal
        // song, something a crowd sings outside the ground. Per TRACK, because
        // a tape is a city's tape with two or three of these on it rather than
        // a sports tape. Nothing reads it yet; it is for filtering at play time
        // in a game.
        var sportsWrap = document.createElement('span');
        sportsWrap.className = 'track-explicit track-sports';
        var sportsEl = document.createElement('input');
        sportsEl.type = 'checkbox';
        sportsEl.checked = !!song.sports;
        sportsEl.setAttribute('aria-label', 'Sports music, for ' + songDisplay(song));
        sportsEl.title = 'Sports music: a fight song, a victory anthem, a stadium walk-up or goal song, '
          + 'something a crowd sings outside the ground. Nothing reads it yet; it is for filtering at play time.';
        sportsEl.addEventListener('change', function () {
          commit(null, null, function (f) { f.sports = !!sportsEl.checked; });
        });
        sportsWrap.appendChild(sportsEl);

        var air = document.createElement('label');
        air.className = 'tape-air track-air';
        var off = document.createElement('span');
        off.className = 'tape-air-word tape-air-word--off';
        off.textContent = 'Shelved';
        var box = document.createElement('input');
        box.className = 'tape-air-input';
        box.type = 'checkbox';
        box.checked = status === 'LIVE';
        box.setAttribute('aria-label', 'Status of ' + songDisplay(song));
        box.title = status === 'LIVE'
          ? 'On /soundtracks/. Switch to shelve it: the row stays on the tape, so the routine never picks it again.'
          : 'Off /soundtracks/. Switch to keep it.';
        var switchTrack = document.createElement('span');
        switchTrack.className = 'tape-air-track';
        switchTrack.setAttribute('aria-hidden', 'true');
        var on = document.createElement('span');
        on.className = 'tape-air-word tape-air-word--on';
        on.textContent = 'Live';
        box.addEventListener('change', function () {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list - press Reload and try again', 'error');
            return;
          }
          trackPendingDelete = null;
          box.disabled = true;
          setTrackStatus(tapeIndex, songIndex, box.checked ? 'LIVE' : 'SHELVED').then(function (ok) {
            box.disabled = false;
            if (!ok) box.checked = !box.checked;
            repaintTracks();
          });
        });
        air.append(off, box, switchTrack, on);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'track-del';
        del.textContent = '×';
        del.setAttribute('aria-label', 'Delete ' + songDisplay(song));
        del.title = 'Delete this row outright. Shelving is almost always what you want instead.';
        del.addEventListener('click', function () {
          trackPendingDelete = trackPendingDelete === song.id ? null : song.id;
          repaintTracks();
        });

        // WHICH TAPE THIS TRACK IS ON, above its title. On the main list the
        // rows run past 1,643 of them and the tape heading scrolls away, so a
        // row that says only "Abilene / George Hamilton IV" leaves you scrolling
        // back to find out where it belongs.
        //
        // IT IS HIDDEN INSIDE THE POPUP by CSS rather than by a branch here,
        // because there the tape's name is the dialog's own title and this
        // would be the same thing said twice. One builder, no argument.
        var titleCell = document.createElement('span');
        titleCell.className = 'track-titlecell';
        var slugOfTape = text(tape && tape.city_slug);

        // WHERE THE TAPE IS, ABOVE ITS NAME, AS A PATH. Country to city, widest
        // first, so it reads as one address narrowing rather than three facts.
        // An empty part is dropped rather than left as an empty segment: most
        // of the world has no state, and "United Kingdom / / London" reads as a
        // fault.
        var geoLine = document.createElement('span');
        geoLine.className = 'track-tapegeo';
        geoLine.textContent = [cityCountryLabel(slugOfTape), cityStateLabel(slugOfTape),
          soundCityLabel(slugOfTape)].filter(Boolean).join(' / ');
        geoLine.title = 'Where this tape is.';

        // THE TAPE'S NAME IS EDITED HERE, ON THE ROW. This tag has always said
        // which tape a track is on; it is the editor now, so the name and the
        // swap are on the track row rather than on a header above it.
        // IT IS THE SAME BUILDER the tracks popup uses as its title, so there is
        // one tape name editor in this project and not two.
        // THE COST, PLAINLY: one editor per row, all of them the same tape, so
        // editing any changes all. That is what putting it on the row means.
        var tapeTag = buildTapeNameEditor(tape.id);
        tapeTag.className = 'track-tapetag';
        tapeTag.title = 'The tape this track is on. Rename it, move it to another city, or swap the two halves.';
        titleCell.append(geoLine, tapeTag, titleEl);

        // THE BADGE LEADS THE TRACK ROW TOO, at the same left edge as the
        // tape's, so a new track and a new tape are marked the same way in the
        // same place.
        var newCell = document.createElement('span');
        newCell.className = 'track-line-new';
        if (isNewTrack(song)) newCell.appendChild(trackNewBadge(song));

        line.append(buildSelectBox(song), newCell, playBtn, posEl, titleCell, artistEl, blurbEl, idEl, explicitWrap, sportsWrap, air, del);

        if (isFocused) {
          var stage = document.createElement('div');
          stage.className = 'track-stage';
          stage.appendChild(trackPlayer(song));
          line.appendChild(stage);
        }

        if (trackPendingDelete === song.id) {
          var confirmEl = document.createElement('div');
          confirmEl.className = 'track-confirm';
          var words = document.createElement('p');
          var lead = document.createElement('strong');
          lead.textContent = 'Delete this row for good? ';
          words.appendChild(lead);
          words.appendChild(document.createTextNode(
            'Shelving keeps it here as a do-not-rescrape tombstone, so the routine never picks it '
            + 'for this tape again. Deleting throws that away, and the song can come straight back '
            + 'on the next run.'));
          var shelveBtn = document.createElement('button');
          shelveBtn.type = 'button';
          shelveBtn.className = 'btn small primary';
          shelveBtn.textContent = 'Shelve instead';
          shelveBtn.addEventListener('click', function () {
            var songIndex = (tape.songs || []).indexOf(song);
            trackPendingDelete = null;
            if (songIndex < 0) { repaintTracks(); return; }
            setTrackStatus(tapeIndex, songIndex, 'SHELVED').then(function () { repaintTracks(); });
          });
          var reallyBtn = document.createElement('button');
          reallyBtn.type = 'button';
          reallyBtn.className = 'btn small';
          reallyBtn.textContent = 'Delete anyway';
          reallyBtn.addEventListener('click', function () {
            reallyBtn.disabled = true;
            deleteTrack(tapeIndex, song).then(function () { repaintTracks(); });
          });
          var cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'btn small';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.addEventListener('click', function () { trackPendingDelete = null; repaintTracks(); });
          confirmEl.append(words, shelveBtn, reallyBtn, cancelBtn);
          line.appendChild(confirmEl);
        }

        return line;
      }

      async function deleteTrack(tapeIndex, song) {
        var tape = soundtracks()[tapeIndex];
        if (!tape || !song || song.id == null) return false;
        try {
          await deleteRow('soundtrack?id=eq.' + encodeURIComponent(song.id));
        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + songDisplay(song), 'error');
          return false;
        }
        var at = (tape.songs || []).indexOf(song);
        if (at >= 0) tape.songs.splice(at, 1);

        var dropped = 0;
        if (Array.isArray(soundtrackIssues)) {
          for (var i = soundtrackIssues.length - 1; i >= 0; i--) {
            if (String(soundtrackIssues[i].song_id) === String(song.id)) {
              soundtrackIssues.splice(i, 1);
              dropped += 1;
            }
          }
        }

        trackPendingDelete = null;

        renderTrackArchive('deleted ' + songDisplay(song)
          + (dropped ? ', and its ' + dropped + (dropped === 1 ? ' issue' : ' issues') : '')
          + ', its tombstone went with it, so the routine may propose it again', 'hold');
        return true;
      }

      var blurbResizeTimer = null;
      window.addEventListener('resize', function () {
        if (!tracksOpen()) return;
        clearTimeout(blurbResizeTimer);
        blurbResizeTimer = setTimeout(growBlurbs, 120);
      });

      if (tracksBackdrop) tracksBackdrop.addEventListener('click', closeTracks);
      if (tracksCard) {
        Array.prototype.forEach.call(tracksCard.querySelectorAll('[data-tracks-close]'), function (btn) {
          btn.addEventListener('click', closeTracks);
        });
      }
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape' || !tracksOpen()) return;

        if (trackPendingDelete != null) { trackPendingDelete = null; renderTracks(); return; }
        closeTracks();
      });

      function openTracksFromHash() {
        var hash = text(location.hash).replace(/^#/, '');
        var m = /^tape=(.+)$/.exec(hash);
        if (m) { openTracks(decodeURIComponent(m[1])); return true; }

        m = /^tracks=(.+)$/.exec(hash);
        if (m) {
          var first = tapesInCity(decodeURIComponent(m[1]))[0];
          if (first) openTracks(first.id);
          else setNotice('no tape for ' + decodeURIComponent(m[1]), 'error');
          return true;
        }
        m = /^track=(.+)$/.exec(hash);
        if (m) { openTrackById(decodeURIComponent(m[1])); return true; }
        return false;
      }



      var trackTotalEl = document.getElementById('roomStats');

      // TAPES ## LIVE / ## SHELVED  |  TRACKS #### LIVE / #### SHELVED
      //
      // COUNTED OVER THE WHOLE CATALOGUE, never over what the filters have
      // left. It is the standing figure the room is measured by, and one that
      // shrank as you narrowed would be answering a different question from the
      // one it asks.
      function paintTrackTotal() {
        if (!trackTotalEl) return;
        var live = 0, shelved = 0;
        soundtracks().forEach(function (tape) {
          var c = tapeCounts(tape);
          live += c.LIVE;
          shelved += c.SHELVED;
        });
        var t = airCounts();
        trackTotalEl.textContent = '';

        function part(word, n, cls) {
          var w = document.createElement('span');
          w.className = 'room-stats-word';
          w.textContent = word;
          var v = document.createElement('span');
          v.className = 'room-stats-count' + (cls ? ' ' + cls : '');
          v.textContent = String(n);
          trackTotalEl.append(w, v);
        }
        function sep(text) {
          var el = document.createElement('span');
          el.className = 'room-stats-sep';
          el.textContent = text;
          trackTotalEl.appendChild(el);
        }

        // TAPES ARE COUNTED, NOT STATED. "113 tapes, 1 with a live track" is a
        // fact about tracks; "1 live / 112 shelved" would be the tape state this
        // room no longer has.
        // THREE GROUPS SEPARATED BY PIPES, never a comma. `.room-stats` is a
        // flex row, so the space around a bare separator comes from the row's
        // gap: "113 , 1" is what a comma renders as here.
        part('tapes', t.total, '');
        sep('|');
        part('', t.onAir, t.onAir ? 'is-live' : '');
        sep('with a live track');
        sep('|');
        part('tracks', live, 'is-live');
        sep('live /');
        part('', shelved, '');
        sep('shelved');

        trackTotalEl.title = t.total + ' tapes, ' + t.onAir + ' with at least one live '
          + 'track and so on /soundtracks/. ' + live + ' live tracks and ' + shelved
          + ' shelved. The whole catalogue, whatever the filters are set to.';
      }

      // ONE TRI-STATE, WORN BY TWO CONTROLS. A checkbox cannot be put into
      // `indeterminate` by a user click, so the label's own click is taken over
      // and the input is painted from the state rather than driving it.
      var AIR_CYCLE = { all: 'live', live: 'shelved', shelved: 'all' };

      function paintAirSwitch(label, input, value, counts, noun) {
        if (!label || !input) return;
        input.indeterminate = value === 'all';
        input.checked = value === 'live';
        input.disabled = false;
        label.querySelector('.tape-air-word--off')
          .classList.toggle('is-current', value === 'shelved');
        label.querySelector('.tape-air-word--on')
          .classList.toggle('is-current', value === 'live');
        input.title = counts.live + ' live, ' + counts.shelved + ' shelved. '
          + (value === 'all'
              ? 'Showing both. Press a word to show only those ' + noun + '.'
              : 'Showing ' + value + ' ' + noun + ' only. Press again to show both.');
      }

      // Pressing a WORD picks that state, or clears it when it is already on;
      // pressing the knob cycles. Both beat the native toggle, which would
      // otherwise flip the checkbox underneath us.
      function wireAirSwitch(label, input, get, set) {
        if (!label || !input) return;
        label.addEventListener('click', function (event) {
          event.preventDefault();
          var word = event.target && event.target.closest
            ? event.target.closest('.tape-air-word') : null;
          var now = get();
          if (word && word.classList.contains('tape-air-word--off')) {
            set(now === 'shelved' ? 'all' : 'shelved');
          } else if (word && word.classList.contains('tape-air-word--on')) {
            set(now === 'live' ? 'all' : 'live');
          } else {
            set(AIR_CYCLE[now] || 'all');
          }
        });
        input.addEventListener('keydown', function (event) {
          if (event.key !== ' ' && event.key !== 'Enter') return;
          event.preventDefault();
          set(AIR_CYCLE[get()] || 'all');
        });
        // A checkbox still fires change on some keyboards; the state is the
        // truth, so repaint from it rather than reading the box.
        input.addEventListener('change', function (event) { event.preventDefault(); set(get()); });
      }

      function airMatches(value, isShelved) {
        if (value === 'live') return !isShelved;
        if (value === 'shelved') return !!isShelved;
        return true;
      }

      // A TAPE HAS NO STATE, so this counts the only thing that is true of one:
      // how many hold at least one live track, which is exactly the test
      // /soundtracks/ applies when it decides whether to draw a card.
      function airCounts() {
        var onAir = 0, total = 0;
        soundtracks().forEach(function (tape) {
          total += 1;
          if (tapeCounts(tape).LIVE > 0) onAir += 1;
        });
        return { onAir: onAir, total: total };
      }

      // THE TRACK COLUMN HEADER, built rather than written in the markup
      // because it is emitted under the tape whose tracks it names. It is the
      // popup's own header, cell for cell, so the two lists read the same.
      var TRACK_HEAD_CELLS = [
        // THE TICK COLUMN. Its header cell is replaced by the select-all box.
        ['', ''],
        ['', ''],
        ['', ''],
        ['#', 'Play order on the cassette. Edit it to reorder.'],
        ['Title', ''],
        ['Artist', ''],
        ['Blurb', 'The sentence under this track on /soundtracks/. Ten words or fewer.'],
        ['Spotify', 'The 22-character Spotify track id. Blank is fine and better than a guess: the player falls back to a search.'],
        // SPELLED OUT, IN LITTLE BITTY TEXT. `E` and `S` were two unlabelled
        // checkboxes side by side with a single letter each: you had to hover
        // one to learn which was which, every time. A word is unambiguous at
        // any size, and these two do not need to be read, only recognised.
        ['Explicit', 'Marked explicit on Spotify'],
        ['Sports', 'Sports music: a fight song, a victory anthem, a stadium walk-up or goal song.'],
        ['', 'Live on /soundtracks/, or shelved off it.'],
        ['Del', 'Delete the row outright. Shelving is almost always what you want instead.']
      ];

      // ── THE SELECTION ───────────────────────────────────────────────────
      //
      // Ticked track ids, so a header control can act on many rows at once. It
      // is an object rather than an array because every question asked of it is
      // "is this one in", and because a re-render must repaint a hundred boxes
      // without a hundred scans.
      var selectedTracks = {};

      function selectedIds() { return Object.keys(selectedTracks); }
      function selectedCount() { return selectedIds().length; }
      function isSelected(song) { return !!(song && selectedTracks[String(song.id)]); }

      // A TICK ON A ROW NOBODY CAN SEE IS A TRAP. The filter and the pager both
      // change what is on screen, and a bulk press that reached a hidden row
      // would be the worst kind of surprise: silent, and to somebody else's
      // work. The selection is pruned to what is drawn, on every render.
      function pruneSelection(shown) {
        var live = {};
        (shown || []).forEach(function (song) {
          var id = String(song.id);
          if (selectedTracks[id]) live[id] = true;
        });
        selectedTracks = live;
      }

      function toggleSelection(song, on) {
        var id = String(song.id);
        if (on) selectedTracks[id] = true; else delete selectedTracks[id];
      }

      function repaintAfterSelection() {
        renderTrackArchive();
        if (tracksOpen()) renderTracks();
      }

      // THE TICK ON A TRACK ROW. It selects; it changes nothing about the track.
      function buildSelectBox(song) {
        var cell = document.createElement('span');
        cell.className = 'track-pick';
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.className = 'track-pick-box';
        box.checked = isSelected(song);
        box.setAttribute('aria-label', 'Select ' + songDisplay(song));
        box.title = 'Select this track. The bar at the top of the header acts on everything selected at once.';
        box.addEventListener('click', function (event) { event.stopPropagation(); });
        box.addEventListener('change', function () {
          toggleSelection(song, box.checked);
          repaintAfterSelection();
        });
        cell.appendChild(box);
        return cell;
      }

      // SELECT ALL, IN THE HEADER'S OWN TICK COLUMN. Indeterminate when some are
      // ticked, which is the only honest third state for a box answering "are
      // all of these in".
      function buildSelectAll(shown) {
        var box = document.createElement('input');
        box.type = 'checkbox';
        box.className = 'track-pick-box';
        var n = (shown || []).length;
        var picked = (shown || []).filter(isSelected).length;
        box.checked = n > 0 && picked === n;
        box.indeterminate = picked > 0 && picked < n;
        box.disabled = !n;
        box.setAttribute('aria-label', 'Select every track shown');
        box.title = !n ? 'Nothing to select.'
          : (picked === n ? 'All ' + n + ' selected. Press to clear.'
                          : 'Select all ' + n + ' tracks shown.');
        box.addEventListener('change', function () {
          var on = picked !== n;
          (shown || []).forEach(function (song) { toggleSelection(song, on); });
          repaintAfterSelection();
        });
        return box;
      }

      // ── ONE FILTER AT A TIME ────────────────────────────────────────────
      //
      // Three questions can narrow the track list: is it live, is it explicit,
      // is it sports. They are STANDALONE: choosing one clears the others, so
      // the header can never be showing an intersection nobody asked for and
      // there is never more than one control to look at to know why a list is
      // short.
      //
      // `trackAirFilter` holds the first ('all' when off) and `trackFlagFilter`
      // the other two (''), and the two setters clear each other. Two variables
      // rather than one because the air switch is a tri-state with its own
      // painter and the flags are plain toggles.
      var trackFlagFilter = '';

      function setTrackFlag(kind) {
        trackFlagFilter = (trackFlagFilter === kind) ? '' : kind;
        // CHOOSING ONE CLEARS THE OTHER. `all` is the air switch's own resting
        // value, so this is the same as switching it off.
        if (trackFlagFilter) trackAirFilter = 'all';
        renderTrackArchive();
        if (tracksOpen()) renderTracks();
      }

      // THE ONE TEST EVERY LIST OF TRACKS RUNS. `renderTracks` and
      // `renderTrackArchive` both call it, so the popup and the page cannot
      // disagree about what is visible -- which is exactly how the air switch
      // was silently inert for a while.
      function trackPassesFilters(song) {
        if (trackFlagFilter === 'explicit') return !!(song && song.explicit);
        if (trackFlagFilter === 'sports') return !!(song && song.sports);
        return airMatches(trackAirFilter, songStatus(song) !== 'LIVE');
      }

      // WHY THE LIST IS SHORT, IN WORDS, for the empty state to say.
      function activeFilterName() {
        if (trackFlagFilter) return trackFlagFilter;
        if (trackAirFilter !== 'all') return trackAirFilter;
        return '';
      }

      // A COLUMN HEADER THAT FILTERS ON ITS OWN COLUMN. It is a real button, so
      // it is focusable and says `aria-pressed`; the label alone would have been
      // a word that silently did something when clicked.
      function buildFlagFilter(kind, label, tip) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'track-head-filter';
        btn.textContent = label;
        var on = trackFlagFilter === kind;
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.classList.toggle('is-on', on);
        btn.title = tip + (on
          ? ' Showing only these. Press again to show all.'
          : ' Press to show only these.');
        btn.addEventListener('click', function (event) {
          event.stopPropagation();
          setTrackFlag(kind);
        });
        return btn;
      }

      // ── WHAT THE HEADER DOES TO A SELECTION ─────────────────────────────
      //
      // A BAR, NOT THE FILTER. The Status header is a filter and must stay one:
      // this room has already had the most destructive act in it hiding inside
      // its quietest control, and a header switch that sometimes filtered and
      // sometimes wrote would be that again. These are separate controls, they
      // are worded as verbs, and they appear only when something is selected,
      // so they can never be mistaken for a filter.
      var bulkPendingDelete = false;

      function buildBulkBar(tape) {
        var n = selectedCount();
        if (!n) { bulkPendingDelete = false; return null; }

        var bar = document.createElement('div');
        bar.className = 'track-bulk';

        var count = document.createElement('strong');
        count.className = 'track-bulk-count';
        count.textContent = n + (n === 1 ? ' track selected' : ' tracks selected');
        bar.appendChild(count);

        function act(word, title, patch) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn small';
          btn.textContent = word;
          btn.title = title;
          btn.addEventListener('click', function () { applyToSelection(tape, patch, word); });
          bar.appendChild(btn);
        }
        function rule() {
          var el = document.createElement('span');
          el.className = 'track-bulk-sep';
          el.setAttribute('aria-hidden', 'true');
          bar.appendChild(el);
        }

        act('Live', 'Put every selected track on /soundtracks/.', { archived: false });
        act('Shelve', 'Take every selected track off /soundtracks/.', { archived: true });
        rule();
        act('Explicit', 'Mark every selected track explicit.', { explicit: true });
        act('Not explicit', 'Clear explicit on every selected track.', { explicit: false });
        act('Sports', 'Mark every selected track as sports music.', { sports: true });
        act('Not sports', 'Clear sports on every selected track.', { sports: false });
        rule();

        // NO DELETE ON THIS BAR. The X at the end of the header is the one
        // control that deletes a selection; a second button doing the same
        // thing a few inches away is the duplication this room keeps removing.

        var clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'btn small ghost track-bulk-clear';
        clear.textContent = 'Clear';
        clear.title = 'Untick everything.';
        clear.addEventListener('click', function () {
          selectedTracks = {};
          bulkPendingDelete = false;
          repaintAfterSelection();
        });
        bar.appendChild(clear);

        return bar;
      }

      // ONE REQUEST FOR THE WHOLE SELECTION, and the rows are read back.
      // PostgREST answers 200 with an EMPTY ARRAY when RLS refuses a write, so
      // without checking the reply a refused bulk press reports success and the
      // page shows a state the database never took.
      async function writeSelection(method, body) {
        var ids = selectedIds();
        var path = 'soundtrack?id=in.(' + ids.map(encodeURIComponent).join(',') + ')';
        var headers = { Prefer: 'return=representation' };
        var opts = { method: method, headers: null };
        if (body) headers['Content-Type'] = 'application/json';
        opts.headers = authHeaders(headers);
        if (body) opts.body = JSON.stringify(body);
        var res = await fetch(restUrl(path), opts);
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        return Array.isArray(rows) ? rows : [];
      }

      async function applyToSelection(tape, patch, word) {
        var ids = selectedIds();
        if (!ids.length) return;
        var rows;
        try {
          rows = await writeSelection('PATCH', patch);
        } catch (error) {
          console.error(error);
          setNotice('could not set ' + word.toLowerCase() + ' on ' + ids.length
            + (ids.length === 1 ? ' track: ' : ' tracks: ')
            + friendlyWriteError(error, trackCityLabel(tape)), 'error');
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          return;
        }
        // A SHORT REPLY IS REPORTED, NOT ROUNDED UP. It means some rows were
        // refused, and saying "12 updated" about 9 is the quiet sort of lie this
        // room has been caught by before.
        var short = rows.length < ids.length
          ? (' (' + (ids.length - rows.length) + ' were refused)') : '';
        try {
          await loadSoundtrackArchive();
        } catch (error) {
          console.error(error);
          setNotice('wrote ' + rows.length + ', but the page could not reload. Press Reload.', 'error');
          return;
        }
        setNotice(word.toLowerCase() + ' on ' + rows.length
          + (rows.length === 1 ? ' track' : ' tracks') + short, short ? 'error' : 'success');
      }

      async function deleteSelection(tape) {
        var ids = selectedIds();
        if (!ids.length) return;
        var rows;
        try {
          rows = await writeSelection('DELETE', null);
        } catch (error) {
          console.error(error);
          setNotice('could not delete those tracks: '
            + friendlyWriteError(error, trackCityLabel(tape)), 'error');
          return;
        }
        if (!rows.length) {
          setNotice('the database refused that. Sign in again and retry.', 'error');
          return;
        }
        selectedTracks = {};
        bulkPendingDelete = false;
        try {
          await loadSoundtrackArchive();
        } catch (error) {
          console.error(error);
          setNotice('deleted ' + rows.length + ', but the page could not reload. Press Reload.', 'error');
          return;
        }
        setNotice('deleted ' + rows.length + (rows.length === 1 ? ' track' : ' tracks'), 'success');
      }

      // THE STATUS COLUMN'S HEADER IS A FILTER, NOT A LABEL. A switch on a ROW
      // changes that track's state; a switch in a HEADER narrows what the list
      // shows. Same shape, and the position is what tells them apart.
      //
      // IT CARRIES NO id. The popup's own copy is `#trackAirAll`, and a second
      // element with that id would make `getElementById` answer for whichever
      // came first.
      function buildAirFilter(tape) {
        var label = document.createElement('label');
        label.className = 'tape-air track-air tape-air--all';

        var off = document.createElement('span');
        off.className = 'tape-air-word tape-air-word--off';
        off.textContent = 'Shelved';

        var input = document.createElement('input');
        input.className = 'tape-air-input';
        input.type = 'checkbox';
        input.setAttribute('aria-label', 'Show shelved tracks, live tracks, or both');

        var knob = document.createElement('span');
        knob.className = 'tape-air-track';
        knob.setAttribute('aria-hidden', 'true');

        var on = document.createElement('span');
        on.className = 'tape-air-word tape-air-word--on';
        on.textContent = 'Live';

        label.append(off, input, knob, on);

        var counts = tapeCounts(tape);
        paintAirSwitch(label, input, trackAirFilter,
          { live: counts.LIVE, shelved: counts.SHELVED }, 'tracks');
        wireAirSwitch(label, input,
          function () { return trackAirFilter; }, setTrackAir);
        return label;
      }

      function buildTrackHead() {
        var head = document.createElement('div');
        head.className = 'track-head track-head--main';
        head.setAttribute('role', 'row');
        TRACK_HEAD_CELLS.forEach(function (cell, i) {
          var el = document.createElement('span');
          el.className = 'track-head-label'
            // A LABEL IS CENTRED WHEN THE FIELD UNDER IT IS. `#` is a
            // `text-align: center` input, so a left-aligned label over it sat
            // half a column away from the number it names.
            + (i === 0 || i === 3 || i === 8 || i === 9 || i === 11 ? ' track-head-label--mid' : '')
            // The two spelled-out columns are the narrowest on the row, so
            // their labels are set smaller than the rest of the header.
            + (i === 8 || i === 9 ? ' track-head-label--tiny' : '');
          el.textContent = cell[0];
          if (cell[1]) el.title = cell[1];
          head.appendChild(el);
        });
        return head;
      }

      function fitInput(el) {

        if (!el || !el.isConnected) return;
        var css = window.getComputedStyle(el);
        var borders = parseFloat(css.borderLeftWidth) + parseFloat(css.borderRightWidth);
        el.style.width = '0px';
        var need = el.scrollWidth;

        el.style.width = Math.ceil(need + borders + 2) + 'px';
      }

      // BIG BY DEFAULT, SMALLER WHEN THE CONTENT NEEDS IT.
      //
      // The row declares one size and every field inherits it. A field whose
      // value is too long for its column then steps DOWN until it fits, rather
      // than clipping at the row's size -- so a long title is readable at 11px
      // where it would otherwise be a readable 14pt with its end cut off.
      //
      // IT CLEARS THE INLINE SIZE FIRST, so a field that has been edited shorter
      // goes back up. Setting a number and never clearing it is how a column
      // ends up permanently small because of a value that is no longer in it.
      //
      // THERE IS A FLOOR. Past it the answer is not a smaller font, it is a
      // shorter value or a wider column, and 8px of a track title helps nobody.
      var TRACK_TEXT_FLOOR_PX = 10;

      function shrinkToFit(el) {
        if (!el || !el.isConnected) return;
        el.style.fontSize = '';
        if (el.scrollWidth <= el.clientWidth) return;
        var size = parseFloat(window.getComputedStyle(el).fontSize);
        while (el.scrollWidth > el.clientWidth && size > TRACK_TEXT_FLOOR_PX) {
          size -= 0.5;
          el.style.fontSize = size + 'px';
        }
      }

      // WHAT IS SHRUNK: the fields that hold a value on one line, plus the two
      // words of the status switch and the two lines above a title. The BLURB is
      // deliberately absent -- it is a textarea that wraps, so it never overflows
      // its width and shrinking it would make a paragraph smaller for no reason.
      var SHRINK_SELECTOR = [
        '.track-input--num',
        '.track-input--title',
        '.track-input--artist',
        '.track-input--id',
        '.track-tapegeo',
        '.tape-air-word'
      ].join(', .track-line ');

      var fontsFitted = false;

      function fitRowInputs() {
        if (!trackArchiveList) return;
        Array.prototype.forEach.call(
          trackArchiveList.querySelectorAll('.city-input, .spine-input'), fitInput);
        Array.prototype.forEach.call(
          trackArchiveList.querySelectorAll('.track-line ' + SHRINK_SELECTOR), shrinkToFit);
      }

      var refitTimer = 0;
      window.addEventListener('resize', function () {
        window.clearTimeout(refitTimer);
        refitTimer = window.setTimeout(fitRowInputs, 120);
      });

      // THE ROOM READS NO CITY TABLE. `public.soundtrack` carries its own
      // `city`, `state_code`, `state_name`, `country_code` and `country_name`,
      // so this map is built from the tracks themselves and there is one entry
      // per city that actually holds a tape.
      //
      // WHAT THAT COSTS, said plainly: the picker can only OFFER a city that
      // already has one. The box is free text, so a new city is still typed in;
      // it simply is not suggested. That is the trade for the tie being cut.
      var cityMap = Object.create(null);

      function rebuildCityMap(rows) {
        var map = Object.create(null);
        (Array.isArray(rows) ? rows : []).forEach(function (row) {
          var slug = row && text(row.city_slug);
          if (!slug || map[slug]) return;
          map[slug] = {
            slug: slug,
            city: text(row.city),
            state_code: text(row.state_code),
            state_name: text(row.state_name),
            country_code: text(row.country_code),
            country_name: text(row.country_name)
          };
        });
        cityMap = map;
      }

      function cityRow(slug) {
        var s = text(slug);
        return s ? (cityMap[s] || null) : null;
      }

      function soundCityLabel(slug) {
        var s = text(slug);
        if (!s) return '(unknown city)';
        var row = cityRow(s);
        var canonical = row ? text(row.city) : '';
        if (canonical) return canonical.split(',')[0].trim();

        return s.split('-').map(function (part) {
          return part ? part.charAt(0).toUpperCase() + part.slice(1) : '';
        }).join(' ');
      }

      function cityStateLabel(slug) {
        var row = cityRow(slug);
        if (!row) return '';
        var name = text(row.state_name);
        if (name) return name;
        var code = text(row.state_code);
        if (code) return code;
        var canonical = text(row.city);
        var parts = canonical ? canonical.split(',') : [];

        return parts.length > 2 ? parts[1].trim() : '';
      }

      function cityCountryLabel(slug) {
        var row = cityRow(slug);
        if (!row) return '';
        var name = text(row.country_name);
        if (name) return name;
        var code = text(row.country_code);
        if (code) return code;
        var canonical = text(row.city);
        var parts = canonical ? canonical.split(',') : [];
        return parts.length === 2 ? parts[1].trim() : '';
      }

      var NEW_FOR_HOURS = 72;

      function tapeNewsAt(tape) {
        var newest = null;
        var made = tape && tape.created_at ? new Date(tape.created_at) : null;
        if (made && Number.isFinite(made.getTime())) newest = made;
        ((tape && tape.songs) || []).forEach(function (song) {
          var at = songDate(song);
          if (at && (!newest || at > newest)) newest = at;
        });
        return newest;
      }

      function isNewTrack(song) {
        var at = songDate(song);
        return !!at && (Date.now() - at.getTime()) < NEW_FOR_HOURS * 3600 * 1000;
      }

      function trackNewBadge(song) {
        var badge = document.createElement('span');
        badge.className = 'tape-new';
        badge.textContent = 'New';
        badge.title = 'Filed ' + relativeTime(songDate(song), new Date())
          + '. The badge clears itself after ' + NEW_FOR_HOURS + ' hours.';
        return badge;
      }

      function newBadge(tape) {
        var madeAt = tape && tape.created_at ? new Date(tape.created_at) : null;
        var tapeIsNew = madeAt && Number.isFinite(madeAt.getTime())
          && (Date.now() - madeAt.getTime()) < NEW_FOR_HOURS * 3600 * 1000;
        var badge = document.createElement('span');
        badge.className = 'tape-new';
        badge.textContent = 'New';
        badge.title = (tapeIsNew ? 'This tape was added ' : 'A track was added to this tape ')
          + relativeTime(tapeNewsAt(tape), new Date())
          + '. The badge clears itself after ' + NEW_FOR_HOURS + ' hours.';
        return badge;
      }

      function isNewTape(tape) {
        var at = tapeNewsAt(tape);
        if (!at) return false;
        return (Date.now() - at.getTime()) < NEW_FOR_HOURS * 3600 * 1000;
      }

      function tapeFullName(tape) {
        var city = soundCityLabel(tape && tape.city_slug);
        var spine = text(tape && tape.spine_tag);
        if (!spine) return city;
        return text(tape && tape.spine_tag_position) === 'before'
          ? spine + ' ' + city
          : city + ' ' + spine;
      }

      function cityFullLabel(slug) {
        var row = cityRow(slug);
        if (!row) return soundCityLabel(slug);
        return text(row.city) || soundCityLabel(slug);
      }

      function relativeTime(then, now) {
        if (!(then instanceof Date) || !Number.isFinite(then.getTime())) return '';
        var mins = Math.round((now - then) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
        var hours = Math.round(mins / 60);
        if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
        var days = Math.round(hours / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
      }

      // PRESSING THE BOT ASKS WHICH CITY FIRST, THEN OPENS THE ROUTINE.
      //
      // The routine takes no parameters: it reads its brief out of
      // mc/soundtracks/soundtracks.md every run, and a static page cannot
      // parameterise a cloud trigger. So the city travels on the CLIPBOARD and
      // a human pastes it into the run. That is the same bargain every prompt
      // door in this project makes, and it is stated on the dialog rather than
      // left for somebody to discover.
      //
      // BLANK IS A REAL ANSWER and is the default: it means work the tier
      // ladder, which is what the brief does unaided. So an untouched dialog
      // copies NOTHING and simply opens the routine.
      var botCard = document.getElementById('botCard');
      var botBackdrop = document.getElementById('botBackdrop');
      var botCityInput = document.getElementById('botCity');
      var botHint = document.getElementById('botHint');
      var botFootNote = document.getElementById('botFootNote');
      var botGoBtn = document.getElementById('botGoBtn');

      function botDirective() {
        var city = text(botCityInput && botCityInput.value);
        return city ? ('Work ' + city + ' this run.') : '';
      }

      function paintBotDialog() {
        var said = botDirective();
        if (!botHint) return;
        botHint.textContent = '';
        if (!said) {
          botHint.textContent = 'No city named, so the run works the tier ladder '
            + 'in mc/soundtracks/soundtracks.md: a club city first, then a college town, '
            + 'then any other US city.';
        } else {
          botHint.appendChild(document.createTextNode('Copies '));
          var b = document.createElement('b');
          b.textContent = '"' + said + '"';
          botHint.appendChild(b);
          botHint.appendChild(document.createTextNode(
            ' to the clipboard. Paste it into the routine when you run it, or the '
            + 'run picks its own city.'));
        }
        if (botGoBtn) botGoBtn.textContent = said ? 'Copy and open' : 'Open';
      }

      function openBotDialog() {
        if (!botCard || !botBackdrop) return;
        if (botCityInput) botCityInput.value = '';
        if (botFootNote) botFootNote.textContent = '';
        paintCityOptions();
        paintBotDialog();
        botBackdrop.hidden = false;
        botCard.hidden = false;
        document.body.style.overflow = 'hidden';
        if (botCityInput) botCityInput.focus();
      }

      function closeBotDialog() {
        if (!botCard || !botBackdrop) return;
        botBackdrop.hidden = true;
        botCard.hidden = true;
        var tracks = document.getElementById('tracksCard');
        if (!tracks || tracks.hidden) document.body.style.overflow = '';
      }

      // THE WINDOW, OPENED FROM THE DIALOG'S OWN CLICK so it keeps the user
      // gesture a popup blocker requires. Returns the window, or null.
      function openBotWindow(url) {
        // CLAMPED TO THE SCREEN, not a flat 1180x900. On a laptop that is
        // wider than the display, and a window bigger than the screen opens
        // with its own controls off the edge.
        var availW = screen.availWidth || screen.width || 1180;
        var availH = screen.availHeight || screen.height || 900;
        var w = Math.min(1180, Math.max(640, availW - 80));
        var h = Math.min(900, Math.max(480, availH - 80));
        var left = Math.max(0, Math.round((availW - w) / 2));
        var top = Math.max(0, Math.round((availH - h) / 2));
        // `noopener` MUST NOT GO IN THE FEATURES STRING. With it, window.open
        // returns null even when it succeeded, which is indistinguishable from
        // a blocked popup -- and this function's caller decides what to say
        // from exactly that. The opener is cut below instead.
        var win = window.open(url, 'tgbSoundtrackBot',
          'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top
          + ',resizable=yes,scrollbars=yes');
        if (!win) return null;
        try { win.focus(); } catch (error) {}
        try { win.opener = null; } catch (error) {}
        return win;
      }

      async function loadLastRun() {
        var botBtn = document.getElementById('soundtrackBotBtn');
        if (!botBtn) return;
        // ASK FIRST. The href stays real, so middle-click and ctrl-click go
        // straight to the routine without the dialog, which is the escape
        // hatch for somebody who does not want to name a city.
        botBtn.addEventListener('click', function (event) {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();
          openBotDialog();
        });

        // NO STALENESS ON A GAP ANY MORE. TGB SOUNDTRACK BOT has no schedule
        // as of 2026-08-25: it is run by hand, so a quiet week is a decision
        // rather than a failure, and a red edge that is permanently on is a
        // signal nobody reads. `stale` survives for the one thing that is still
        // a fault: not being able to read the table at all.
        function say(when, what, stale) {
          botBtn.title = [text(when), text(what)].filter(Boolean).join(' — ');
          botBtn.classList.toggle('is-stale', !!stale);
        }

        try {

          var res = await fetch(
            restUrl('soundtrack?select=city_slug,title,artist,created_at&order=created_at.desc&limit=1'),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) throw new Error('Supabase ' + res.status);
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) throw new Error('no songs');

          var row = rows[0];
          var stamp = new Date(row.created_at);
          if (!Number.isFinite(stamp.getTime())) throw new Error('no timestamp');
          var now = new Date();

          var since = new Date(stamp.getTime() - 3600000).toISOString();
          var wrote = await runTally(since);

          var detail = stamp.toLocaleString([], {
            weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit'
          }) + (wrote ? ' · ' + wrote : ' · ' + soundCityLabel(row.city_slug))
            + ' · run it from the routine when you want more.';

          say('Last run ' + relativeTime(stamp, now), detail, false);
        } catch (error) {

          say('Last run unavailable',
            'Could not read public.soundtrack. Open the routine to check directly.', true);
        }
      }

      var tapePrevBtn = document.getElementById('tapePrev');
      var tapeNextBtn = document.getElementById('tapeNext');
      if (tapePrevBtn) tapePrevBtn.addEventListener('click', function () { stepTape(-1); });
      if (tapeNextBtn) tapeNextBtn.addEventListener('click', function () { stepTape(1); });

      var tapeFilterEl = document.getElementById('tapeFilter');
      if (tapeFilterEl) tapeFilterEl.addEventListener('change', function () {
        tapeFilter = tapeFilterEl.value || '';
        // A FILTER RESETS TO THE TOP. Keeping the position would land you on
        // whatever happens to be fiftieth in a completely different list.
        tapeAt = 0;
        renderTrackArchive();
      });

      loadLastRun();

      if (botCityInput) botCityInput.addEventListener('input', paintBotDialog);
      if (botBackdrop) botBackdrop.addEventListener('click', closeBotDialog);
      Array.prototype.forEach.call(document.querySelectorAll('[data-bot-close]'), function (btn) {
        btn.addEventListener('click', closeBotDialog);
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && botCard && !botCard.hidden) closeBotDialog();
      });
      if (botCityInput) botCityInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && botGoBtn) { event.preventDefault(); botGoBtn.click(); }
      });

      if (botGoBtn) botGoBtn.addEventListener('click', function () {
        var said = botDirective();
        var href = document.getElementById('soundtrackBotBtn');
        href = href ? href.href : '';

        // THE COPY IS STARTED BEFORE THE WINDOW AND NEITHER IS AWAITED. Both
        // need the user gesture this click carries, and awaiting the clipboard
        // would push the open into a later task, which is exactly what a popup
        // blocker refuses.
        var copied = null;
        if (said && navigator.clipboard && navigator.clipboard.writeText) {
          copied = navigator.clipboard.writeText(said);
        }
        var win = openBotWindow(href);

        if (!win) {
          // A BLOCKED WINDOW IS SAID OUT LOUD and the dialog stays open, so the
          // clipboard is not wasted and there is still a way through.
          if (botFootNote) {
            botFootNote.textContent = 'The browser blocked the window. '
              + (said ? 'The line is on your clipboard. ' : '')
              + 'Open the routine from the button behind this dialog.';
          }
          return;
        }
        closeBotDialog();
        if (!said) { setNotice('opened TGB SOUNDTRACK BOT', 'success'); return; }
        if (!copied) {
          setNotice('opened TGB SOUNDTRACK BOT, but this browser has no clipboard access. '
            + 'Tell the run: ' + said, 'hold');
          return;
        }
        copied.then(function () {
          setNotice('opened TGB SOUNDTRACK BOT, and "' + said + '" is on the clipboard', 'success');
        }, function () {
          setNotice('opened TGB SOUNDTRACK BOT, but the clipboard refused. Tell the run: '
            + said, 'hold');
        });
      });


      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);
      adminAuth.init();
    }());
  </script>
</body>
</html>
