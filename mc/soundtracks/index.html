  <!-- The room blurb under the title is rendered from one shared string,
       so this room and its Ancillary Things card at /mc/ cannot drift apart.
       Its <p> is empty in the markup on purpose; see the file. -->
  <script src="/mc/js/room-blurbs.js"></script>
  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script>
    (function () {
      'use strict';

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var trackArchiveStatus = document.getElementById('trackArchiveStatus');
      var trackArchiveList = document.getElementById('trackArchiveList');
      var archiveExpandBtn = document.getElementById('archiveExpandBtn');
      var trackStatusTabs = document.getElementById('trackStatusTabs');

      var trackStatusFilter = '';
      var keyLegend = document.getElementById('keyLegend');
      var citySearch = document.getElementById('citySearch');

      var citySearchTerm = '';


      // THE SHELVED / LIVE SWITCH IN A HEADER IS A FILTER, NOT A STATUS
      // CHANGER. It used to rewrite every row it summarised, which is the most
      // destructive act in the room sitting in the quietest control, one press
      // from a confirm nobody reads. It reads as a filter, it sits in a header
      // beside two other filters, and it is one now.
      //
      // 'all' is the NEUTRAL middle and is what the knob rests on. Per-row
      // switches are untouched: those are the status changers.
      // ONE TAPE AT A TIME. A position into the FILTERED, SORTED list rather
      // than a tape id, so if the list ever changes under it you land on
      // whatever moved into that place instead of on nothing.
      var tapeAt = 0;
      var requestedTapeUrlId = readTapeUrlId();

      var trackAirFilter = 'all';     // the tracks inside an open tape

      var pageNotice = document.getElementById('pageNotice');

      var soundtrackArchiveData = null;
      var expandedTapes = Object.create(null);

      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) {
        return SUPABASE_CONFIG.url + '/rest/v1/' + path;
      }

      function fnUrl(name) {
        return SUPABASE_CONFIG.url + '/functions/v1/' + name;
      }

      async function fetchAllRows(path, useAuth) {
        var PAGE = 1000;
        var all = [];
        var headersFor = useAuth ? authHeaders : anonHeaders;
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: headersFor({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function patchRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'PATCH',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;

        if (!row) throw new Error('Nothing was updated — sign in again and retry.');
        return row;
      }

      async function runTally(sinceIso) {
        try {
          var res = await fetch(
            restUrl('soundtrack?select=city_slug&created_at=gte.' + encodeURIComponent(sinceIso)),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) return '';
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return '';
          var byCity = Object.create(null);
          rows.forEach(function (r) {
            var slug = text(r && r.city_slug);
            if (!slug) return;
            byCity[slug] = (byCity[slug] || 0) + 1;
          });
          return Object.keys(byCity)
            .sort(function (a, b) {
              return byCity[b] - byCity[a] || soundCityLabel(a).localeCompare(soundCityLabel(b));
            })
            .map(function (slug) {
              return soundCityLabel(slug) + ' ' + byCity[slug]
                + ' track' + (byCity[slug] === 1 ? '' : 's');
            })
            .join(', ');
        } catch (error) {
          return '';
        }
      }

      async function deleteRow(path) {
        var res = await fetch(restUrl(path), { method: 'DELETE', headers: authHeaders({}) });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Delete failed: ' + res.status + ' ' + detail);
        }
        return true;
      }

      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          loadSoundtrackArchive().catch(function (error) {
            console.error(error);
            setNotice((error && error.message) || 'could not load the tapes', 'error');
          });
        },
        onSignedOut: function () {
          resetSoundtrackArchive();
        }
      });

      if (archiveExpandBtn) archiveExpandBtn.addEventListener('click', function () {
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        if (!groups.length) return;
        var allOpen = Array.prototype.every.call(groups, function (g) { return g.open; });
        var next = !allOpen;

        Array.prototype.forEach.call(groups, function (g) {
          g.open = next;
          if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = next;
        });
        syncArchiveExpandBtn();
      });

      function tabsOf(strip) {
        return strip ? Array.prototype.slice.call(strip.querySelectorAll('.queue-tab')) : [];
      }

      function selectTab(strip, value) {
        tabsOf(strip).forEach(function (tab) {
          var on = (tab.dataset.tab || '') === value;
          tab.classList.toggle('is-active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }

      function setTabCounts(strip, counts) {
        tabsOf(strip).forEach(function (tab) {
          var key = tab.dataset.tab || '';
          var n = Number(counts[key] || 0);
          var el = tab.querySelector('.queue-tab-count');
          if (el) el.textContent = String(n);
          tab.classList.toggle('is-empty', n === 0);
          tab.classList.toggle('has-work', n > 0);
        });
      }

      function bindTabs(strip, onPick) {
        if (!strip) return;
        strip.addEventListener('click', function (event) {
          var tab = event.target.closest ? event.target.closest('.queue-tab') : null;
          if (!tab || !strip.contains(tab)) return;
          onPick(tab.dataset.tab || '');
        });
      }

      paintKeyLegend();

      bindTabs(trackStatusTabs, function (value) {
        if (value === trackStatusFilter) return;
        trackStatusFilter = value;
        selectTab(trackStatusTabs, trackStatusFilter);

        if (trackStatusFilter) {
          Object.keys(expandedTapes).forEach(function (k) { delete expandedTapes[k]; });
          renderTrackArchive();
          var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
          Array.prototype.forEach.call(groups, function (g) {
            g.open = true;
            if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = true;
          });
          syncArchiveExpandBtn();
        } else {
          expandedTapes = Object.create(null);
          renderTrackArchive();
        }
      });

      if (citySearch) citySearch.addEventListener('input', function () {
        citySearchTerm = citySearch.value.trim().toLowerCase();
        renderTrackArchive();
      });

      document.addEventListener('keydown', trackKeydown);



      function syncArchiveExpandBtn() {
        if (!archiveExpandBtn) return;
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        archiveExpandBtn.disabled = !groups.length;
        var allOpen = groups.length > 0 && Array.prototype.every.call(groups, function (g) { return g.open; });
        archiveExpandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        archiveExpandBtn.title = allOpen ? 'Close every tape' : 'Open every tape';
      }
      function text(value) {
        return String(value == null ? '' : value).trim();
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();
        return !!v && ['false', 'f', 'no', 'n', '0'].indexOf(v) === -1;
      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);
      }

      function songStatus(song) {
        return isArchivedSong(song) ? 'SHELVED' : 'LIVE';
      }

      var STATUS_LABEL = { LIVE: 'Live', SHELVED: 'Shelved' };
      var STATUS_VERB = { LIVE: 'Live', SHELVED: 'Shelve' };

      function emptyNode(message) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.textContent = message;
        return div;
      }

      function chip(label, tone) {
        var span = document.createElement('span');
        span.className = 'chip' + (tone ? ' ' + tone : '');
        span.textContent = label;
        return span;
      }

      function actionLink(href, label, external) {
        var a = document.createElement('a');
        a.className = 'btn small';
        a.href = href;
        a.textContent = label;
        if (external) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        return a;
      }

      function setArchiveStatus(message, tone) {
        if (!trackArchiveStatus) return;
        trackArchiveStatus.textContent = message || '';
        trackArchiveStatus.classList.toggle('is-error', tone === 'error');
        trackArchiveStatus.classList.toggle('is-success', tone === 'success');
        trackArchiveStatus.classList.toggle('is-warn', tone === 'warn');
      }

      var noticeTimer = 0;
      function setNotice(message, tone) {
        if (!pageNotice) return;
        window.clearTimeout(noticeTimer);
        pageNotice.textContent = message || '';

        if (message && tone !== 'error' && tone !== 'hold') {
          noticeTimer = window.setTimeout(function () {

            if (pageNotice.textContent === message) pageNotice.textContent = '';
          }, 6000);
        }
      }

      function resetSoundtrackArchive() {
        soundtrackArchiveData = null;
        trackStatusFilter = '';
        selectTab(trackStatusTabs, '');
        setTabCounts(trackStatusTabs, {});
        if (archiveExpandBtn) { archiveExpandBtn.disabled = true; archiveExpandBtn.textContent = 'Expand all'; }
        expandedTapes = Object.create(null);
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Sign in to manage tapes and tracks.'));
        }
        setArchiveStatus('Waiting for sign-in.', '');
        setNotice('', '');
        focusSongId = null;
      }

      var ISSUE_KIND_LABEL = {
        spotify: 'Spotify ID',
        spelling: 'Spelling',
        relevance: 'Relevance',
        facts: 'Facts'
      };

      // A SLUG FROM A TYPED LABEL. With no catalogue to look one up in, a city
      // this room has never held has to be derived, and the rule is the one
      // `public.cities` itself uses: the city NAME only, lowercased, hyphenated.
      // "St. Louis, Missouri" gives `st-louis`, which is the slug already filed.
      function slugFromLabel(label) {
        var name = text(label).split(',')[0];
        return name.toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function cityByLabel(label) {
        var want = text(label).toLowerCase();
        if (!want) return null;
        var hit = null;
        Object.keys(cityMap).forEach(function (slug) {
          if (hit) return;
          var row = cityMap[slug];
          var canonical = text(row.city).toLowerCase();
          if (canonical === want || canonical.split(',')[0].trim() === want) hit = row;
        });
        return hit;
      }

      function paintCityOptions() {
        var list = document.getElementById('cityOptions');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(cityMap).sort().forEach(function (slug) {
          var row = cityMap[slug];
          // NO `hide_from_soundtracks` TEST ANY MORE. That flag lives on
          // public.cities, which this room no longer reads, and every city in
          // this map already holds a tape -- so a venue town could only appear
          // here by already having one.

          var opt = document.createElement('option');
          opt.value = text(row.city);

          var held = soundtracks().filter(function (t) { return text(t.city_slug) === slug; }).length;
          if (held) opt.label = text(row.city) + '  (' + held + (held === 1 ? ' tape' : ' tapes') + ' already)';
          list.appendChild(opt);
        });
      }

      async function moveTapeToCity(tapeId, toSlug, label) {
        var tape = tapeById(tapeId);
        if (!tape) return false;
        var fromSlug = text(tape.city_slug);
        try {

          // A TAPE IS EVERY ROW OF IT NOW, so moving one is a write across all
          // of them and goes through the function that scopes it.
          // THE LABEL TRAVELS WITH THE SLUG. `city` lives on the row now, so a
          // move that sent only the slug would leave every row wearing the old
          // city's name, which is the half a human actually reads.
          var to = (label && label.city) ? label : cityMap[toSlug];
          await callRpc('tgb_rename_tape', {
            p_city: fromSlug, p_tape: tape.spine_tag || '',
            p_new_city: toSlug, p_new_tape: null,
            p_new_label: to && to.city ? to.city : toSlug,
            p_state_code: to ? (to.state_code || null) : null,
            p_state_name: to ? (to.state_name || null) : null,
            p_country_code: to ? (to.country_code || null) : null,
            p_country_name: to ? (to.country_name || null) : null
          });
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(fromSlug)), 'error');
          return false;
        }
        tape.city_slug = toSlug;
        (tape.songs || []).forEach(function (song) { song.city_slug = toSlug; });
        paintCityOptions();
        renderTrackArchive('moved the tape from ' + cityFullLabel(fromSlug)
          + ' to ' + cityFullLabel(toSlug), 'success');
        return true;
      }

      function locateSong(id) {
        if (id == null) return null;
        var hit = null;
        soundtracks().forEach(function (tape, tapeIndex) {
          (tape.songs || []).forEach(function (song, songIndex) {
            if (song && String(song.id) === String(id)) hit = { tapeIndex: tapeIndex, songIndex: songIndex };
          });
        });
        return hit;
      }

      async function loadSoundtrackArchive() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) {
          resetSoundtrackArchive();
          return;
        }
        setArchiveStatus('Loading tapes and tracks…', '');
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Loading tracks...'));
        }
        try {
          soundtrackArchiveData = await fetchSoundtrackTables();

          paintCityOptions();
          renderTrackArchive();

          openTracksFromHash();
        } catch (error) {
          console.error(error);
          soundtrackArchiveData = null;
          setArchiveStatus('Nothing loaded.', '');
          // THE FETCH AND THE RENDER ARE BOTH INSIDE THIS TRY, so a bug in the
          // drawing surfaced as "the database did not load", which sends the
          // next person to check Supabase about a fault in this file. The
          // message says which it was.
          var wasFetch = /Supabase \d|Failed to fetch|NetworkError/i.test((error && error.message) || '');
          setNotice(wasFetch ? 'could not read the tapes' : 'the tapes loaded but the page could not draw them, see the console',
            'error');
          if (trackArchiveList) {
            trackArchiveList.innerHTML = '';
            trackArchiveList.appendChild(emptyNode(wasFetch
              ? 'public.soundtrack did not load. Check the Supabase project.'
              : 'The tapes loaded and the page could not draw them. The console has the error.'));
          }
          throw error;
        }
      }

      // ── Findings, folded onto their row (2026-08-25) ────────────────────
      //
      // THE TAPE HAS NO id ANY MORE. It is (city_slug, tape), and this is the
      // string the page uses wherever it used to hold a tape id -- as a map key
      // and as a row's tape_id.
      function tapeKey(citySlug, tapeName) {
        return JSON.stringify([String(citySlug || ''), String(tapeName || '')]);
      }

      function tapeUrlId(tape) {
        if (!tape) return '';
        var city = text(tape.city_slug);
        var spine = text(tape.spine_tag);
        if (city || spine) return tapeKey(city, spine);
        return text(tape.id || tape.key);
      }

      function readTapeUrlId() {
        try {
          return text(new URLSearchParams(location.search).get('tape'));
        } catch (error) {
          return '';
        }
      }

      // CHOOSING ALL TAPES GIVES THE BARE URL, ONCE.
      //
      // `?tape=` records which tape you are on. Going back to ALL TAPES is
      // stepping back to the catalogue, so the address should be the catalogue:
      // /mc/soundtracks/ with nothing on it.
      //
      // A ONE-SHOT FLAG, not a rule about position. The obvious alternative --
      // write no `?tape=` while sitting on the first tape -- would make the
      // first tape the one page in this room you cannot link to, which is worse
      // than the thing it fixes. Stepping with the arrows writes the id again.
      var suppressTapeUrlOnce = false;

      function writeTapeUrlId(tape) {
        if (!window.history || !history.replaceState) return;
        if (suppressTapeUrlOnce) { suppressTapeUrlOnce = false; tape = null; }
        var nextId = tapeUrlId(tape);
        var params;
        try {
          params = new URLSearchParams(location.search);
        } catch (error) {
          return;
        }

        if (nextId) params.set('tape', nextId);
        else params.delete('tape');

        var query = params.toString();
        var next = location.pathname + (query ? '?' + query : '') + location.hash;
        var here = location.pathname + location.search + location.hash;
        if (next !== here) history.replaceState(null, '', next);
      }

      function paintPublicSoundtracksLink(tape) {
        var link = document.getElementById('publicSoundtracksBtn');
        if (!link) return;
        var id = tapeUrlId(tape);
        link.href = id ? ('/soundtracks/?tape=' + encodeURIComponent(id)) : '/soundtracks/';
        link.title = id
          ? 'Open this tape on the public Soundtracks page. Only live tracks appear there.'
          : 'The public Soundtracks page. Only live tracks appear there.';
      }

      // A LINK LANDS YOU ON THE TAPE, NOT IN A DIALOG.
      //
      // `?tape=` already did this: it positions the PAGER, so you arrive with
      // the tape in front of you and the room in its normal state. `?track=`
      // does the same and then marks the badge, because a link that says "this
      // track" and drops you at the top of a fifteen-badge tape has not
      // finished the job.
      //
      // THE OLD `#tape=` AND `#track=` OPENED THE POPUP, which is the one place
      // an arriving link should not put you: a dialog over a list you have not
      // seen, with no sense of where you are in it.
      var requestedTrackId = readTrackUrlId();
      var arrivedTrackId = null;

      function readTrackUrlId() {
        try {
          return text(new URLSearchParams(location.search).get('track'));
        } catch (error) {
          return '';
        }
      }

      // A REQUESTED TRACK CLEARS THE FILTERS FIRST. Arriving from a link with a

          // switch carry titles -- so the loss is "which column is this VALUE
          // in", answered by position now. **This room has made that trade once
          // before and reversed it**; if the labels come back, they come back
          // as `buildTrackHead`, which the popup still uses.
          //
          // The tape's NEW badge went with the row it led. A track keeps its
          // own.


          // A TAPE HAS NO STATE OF ITS OWN ANY MORE. Live and shelved are facts
          // about a TRACK; a tape is simply the tracks that carry its name, and
          // /soundtracks/ shows it when at least one of them is live. The
          // switch that used to sit here wrote every row of the tape at once.
          //
          // WHAT THAT COSTS, PLAINLY: taking a whole city off /soundtracks/ is
          // now one press per track rather than one press. `tgb_set_tape_archived`
          // still exists in the database and still carries the shelve cascade,
          // so the one-press version is a call away if it is wanted back.

          // THE COUNTS IN WORDS, which is what the tracks popup said about the
          // tape. `10/55` needed the header to be read before it meant anything,
          // and then still left you working out which number was which.
          // WHAT THE TAPE HOLDS, immediately after its name: N LIVE / N
          // SHELVED. It read "55 tracks, 10 live", which needed subtracting to
          // learn the thing you actually act on, which is how many are still
          // waiting.
          var tracksCell = document.createElement('span');
          tracksCell.className = 'tape-line-counts';
          var counts = tapeCounts(tape);
          var total = counts.LIVE + counts.SHELVED;
          if (!total) tracksCell.classList.add('is-empty');
          // EVERY PIECE IS AN ELEMENT AND EVERY SPACE IS NON-BREAKING, so this
          // reads the same whether the cell ends up a block or a flex box.
          // A flex container turns a bare text node into an anonymous item, and
          // BARE TEXT NODE becomes an anonymous flex item with its whitespace
          // stripped: that is what rendered "15tracks" on screen while
          // ", 15 live", being inside a span, kept its own space. The cell also
          // sets `display: block` to win that cascade, but nothing here depends
          // on it any more.
          // EVERY SPACE IS NON-BREAKING and every piece is an element. This
          // cell can end up in a flex box, where a bare text node becomes an
          // anonymous flex item and its whitespace is dropped: that is what
          // once rendered "15tracks" on screen.
          var NB = String.fromCharCode(160);
          function figure(n, word, cls) {
            var v = document.createElement('strong');
            v.className = 'tape-line-figure' + (cls ? ' ' + cls : '');
            v.textContent = String(n);
            var w = document.createElement('span');
            w.className = 'tape-line-figure-word';
            w.textContent = NB + word;
            tracksCell.append(v, w);
          }
          figure(counts.LIVE, 'live', counts.LIVE ? 'is-live' : 'is-none');
          var slash = document.createElement('span');
          slash.className = 'tape-line-figure-sep';
          slash.textContent = NB + '/' + NB;
          tracksCell.appendChild(slash);
          figure(counts.SHELVED, 'shelved', '');

          tracksCell.title = counts.LIVE + ' live on /soundtracks/, '
            + counts.SHELVED + ' shelved, ' + total + ' in all.';

          // WHAT THE SELECT-ALL AND THE BATCH BUTTON ACT ON: the rows actually
          // on screen, which is this tape's tracks after the VIEW bar's own
          // filters. Anything else would tick rows nobody can see.
          var shown = allSongs(tape).filter(trackPassesFilters);
          pruneSelection(shown);
          shownNow = shown;

          // WHERE THE TAPE IS AND WHAT IT HOLDS, on the room's own head with the
          // catalogue's figures. Those are standing readings rather than
          // controls, and the alternatives were both worse: the VIEW bar has to
          // stay on one line, and a bar of their own is the tape header again.
          paintTapeStats(tape, tracksCell);

          paintBulkDialog(tape);
          paintTrackDeleteDialog();
          paintPlayerDialog();

          // THE TRACKS THEMSELVES, under the tape they belong to. The row above
          // is the tape's own line and still carries its counts, its findings
          // and its air switch; these are the tracks, drawn by the SAME builder
          // the popup uses, so there is one track row in this project and not
          // two to keep in step.
          var tapeIndex = tapeIndexById(tape.id);
          var songsHere = allSongs(tape);
          // `shown` is computed above, before the header is built: the
          // select-all and the bulk bar have to know what is on screen, and a
          // second reader of "what is visible" is how a control ends up
          // silently inert.
          if (songsHere.length && !shown.length) {
            // THE EMPTY STATE NAMES THE WAY OUT. The filter lives in the header
            // above, so a bare "nothing here" would leave somebody looking at a
            // tape they know has tracks with no idea what hid them.
            var none = emptyNode('No ' + activeFilterName() + ' tracks on this tape. '
              + 'Press that word in the header again to show them all.');
            none.classList.add('track-line--in-list');
            trackArchiveList.appendChild(none);
          }

          shown.slice().sort(function (a, b) {
            return (Number(a.position) || 0) - (Number(b.position) || 0)
              || (Number(a.id) - Number(b.id));
          }).forEach(function (song) {
            var line = renderTrackLine(tape, tapeIndex, song, { inArchiveList: true });
            trackArchiveList.appendChild(line);
          });



        });

        paintSelectAll(shownNow);
        paintBatchButton();
        markArrivedTrack();

        fitRowInputs();
        // THE BLURBS HAVE TO BE GROWN HERE TOO. `growBlurbs` was called only by
        // the popup's render, so the same track was two lines tall in the popup
        // and one on the main list.
        growBlurbs();
        if (document.fonts && document.fonts.ready && !fontsFitted) {
          document.fonts.ready.then(function () { fontsFitted = true; fitRowInputs(); growBlurbs(); });
        }

        paintTrackTotal();
        setArchiveStatus(tapes.length + (tapes.length === 1 ? ' tape' : ' tapes'), '');
        if (message) setNotice(message, tone);
      }

      async function saveTapeName(tapeIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        if (!slug) return { ok: false, message: 'That tape is no longer loaded. Press Reload.' };
        // A TAPE MUST HAVE A NAME, because the name is half of what identifies
        // it: (city_slug, tape). Blank used to be storable and would now leave
        // the rename silently doing nothing, which is worse than refusing.
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag')
            && !text(fields.spine_tag)) {
          return { ok: false, message: 'A tape needs a name. It is half of what tells two tapes in one city apart.' };
        }
        try {
          await callRpc('tgb_rename_tape', {
            p_city: slug, p_tape: tape.spine_tag || '',
            p_new_city: null,
            p_new_tape: Object.prototype.hasOwnProperty.call(fields, 'spine_tag')
              ? (fields.spine_tag || '') : null,
            p_label_position: Object.prototype.hasOwnProperty.call(fields, 'spine_tag_position')
              ? (fields.spine_tag_position || null) : null
          });
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag')) {
          tape.spine_tag = fields.spine_tag || '';
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag_position')) {
          if (fields.spine_tag_position) tape.spine_tag_position = fields.spine_tag_position;
          else delete tape.spine_tag_position;
        }

        setNotice('saved ' + tapeFullName(tape), 'success');
        return { ok: true };
      }

      function friendlyWriteError(error, cityLabel) {
        var message = (error && error.message) || 'Write failed.';
        if (/23505|duplicate key/i.test(message)) {
          return 'The ' + cityLabel + ' tape already has that title and artist. '
            + 'It may already be there as a shelved track.';
        }
        if (/soundtrack_spotify_id_check|violates check constraint/i.test(message)) {
          return 'Supabase rejected the Spotify ID. It has to be 22 letters and digits, or blank.';
        }
        return message;
      }

      async function setTrackStatus(tapeIndex, songIndex, status, quiet) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return false;

        var patch = { archived: status !== 'LIVE' };

        try {
          await patchRow('soundtrack?id=eq.' + encodeURIComponent(song.id), patch);
        } catch (error) {
          console.error(error);
          setNotice('could not update ' + songDisplay(song), 'error');
          return false;
        }

        if (patch.archived) song.archived = true; else { delete song.archived; delete song.archivedWithTape; }

        if (quiet) return true;
        var said = { LIVE: 'live', SHELVED: 'shelved' };
        renderTrackArchive((said[status] || 'updated') + ' — ' + songDisplay(song), 'success');
        return true;
      }

      async function saveTrackFields(tapeIndex, songIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtrack?id=eq.' + encodeURIComponent(song.id), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        song.title = fields.title;
        song.artist = fields.artist;
        song.position = fields.position;
        if (fields.blurb) song.blurb = fields.blurb; else delete song.blurb;
        if (fields.spotify_id) song.spotifyId = fields.spotify_id; else delete song.spotifyId;
        if (fields.explicit) song.explicit = true; else delete song.explicit;
        // SPORTS WAS MISSING HERE AND THE WRITE WAS ALWAYS FINE. The PATCH
        // carried `"sports":true` and landed; this loop then rebuilt the row
        // from the in-memory song, which still said false, so the box flicked
        // back the instant it was ticked and the tag read as not sticking.
        //
        // THE FAILURE IS INVISIBLE TO A WRITE-PATH TEST. Anything that asserts
        // the request was sent, or reads the row back from the database, passes.
        // Only a check that reads the CHECKBOX after the repaint catches it.
        //
        // EVERY FIELD ON `fields` HAS TO BE COPIED BACK, and this is the second
        // list that has to agree with it. If a column is ever added here, add it
        // in both places.
        if (fields.sports) song.sports = true; else delete song.sports;
        renderTrackArchive('saved — ' + songDisplay(song), 'success');
        return { ok: true };
      }

      function tapeById(id) {
        if (id == null) return null;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return all[i];
        }
        return null;
      }

      function tapeIndexById(id) {
        if (id == null) return -1;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return i;
        }
        return -1;
      }

      function tapesInCity(slug) {
        var key = text(slug);
        return soundtracks().filter(function (tape) { return text(tape.city_slug) === key; });
      }

      var ISSUE_SEVERITY_LABEL = { high: 'Breaks for a visitor', warn: 'Wrong', info: 'Nitpick' };

      // ── THE TAPE'S PLACE IS EDITABLE, AND IT IS THE WHOLE TAPE ──────────
      //
      // Country, state and city, each its own box, on the badge's tape line.
      // They are columns on EVERY ROW of the tape, so editing one is a tape-wide
      // write -- and this room's standing rule is that a tape-wide write goes
      // through a FUNCTION, never a PATCH: a filter somebody forgets to scope
      // rewrites a whole city.
      //
      // `tgb_rename_tape` IS THAT FUNCTION and already takes the four parts. It
      // only writes them on a MOVE, though, the geo following the slug -- so a
      // country or state edit passes the tape's OWN slug as `p_new_city`, which
      // takes the same branch and leaves the key exactly where it is.
      async function saveTapeGeo(tape, parts) {
        var slug = text(tape && tape.city_slug);
        if (!slug) return false;
        var label = [text(parts.city) || soundCityLabel(slug),
                     text(parts.state_name), text(parts.country_name)]
          .filter(Boolean).join(', ');
        try {
          await callRpc('tgb_rename_tape', {
            p_city: slug, p_tape: tape.spine_tag || '',
            p_new_city: slug,
            p_new_tape: null,
            p_new_label: label,
            p_state_code: parts.state_code || null,
            p_state_name: text(parts.state_name) || null,
            p_country_code: parts.country_code || null,
            p_country_name: text(parts.country_name) || null
          });
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(slug)), 'error');
          return false;
        }
        try {
          await loadSoundtrackArchive();
        } catch (error) {
          console.error(error);
          setNotice('saved, but the page could not reload. Press Reload.', 'error');
          return false;
        }
        renderTrackArchive('saved the place for every track on this tape', 'success');
        return true;
      }

      // COUNTRY / STATE / CITY, EACH ITS OWN BOX. It was one span of text.
      function buildTapeGeoEditor(tape) {
        var wrap = document.createElement('span');
        wrap.className = 'track-tapegeo';
        if (!tape) return wrap;
        var slug = text(tape.city_slug);
        var row = (tape.songs && tape.songs[0]) || {};

        function box(value, placeholder, label, commit) {
          var input = document.createElement('input');
          input.className = 'geo-input';
          input.type = 'text';
          input.value = value;
          input.placeholder = placeholder;
          input.setAttribute('aria-label', label + ' for this tape');
          input.title = label + '. Editing it writes every track on this tape.';
          function size() { fitInput(input); }
          size();
          input.addEventListener('input', size);
          var was = input.value;
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); return; }
            if (event.key === 'Escape') {
              event.preventDefault();
              event.stopPropagation();
              input.value = was;
              size();
              input.blur();
            }
          });
          // ON BLUR, NOT ON KEYDOWN. Worth knowing before writing a check against
          // these: a test that fires Enter sees nothing happen and reads as a
          // broken write path when the path is fine.
          input.addEventListener('blur', function () {
            var now = input.value.trim();
            if (now === was.trim()) { input.value = was; size(); return; }
            commit(now, function () { input.value = was; size(); });
          });
          return input;
        }

        var countryBox = box(cityCountryLabel(slug), 'Country', 'Country', function (value, undo) {
          // A CHANGED NAME MAKES THE OLD CODE A LIE. Clearing it is honest;
          // keeping `USA` beside `France` is not, and this page has no catalogue
          // left to look the right one up in.
          var keep = text(value).toLowerCase() === text(cityCountryLabel(slug)).toLowerCase();
          saveTapeGeo(tape, {
            city: soundCityLabel(slug),
            state_name: cityStateLabel(slug),
            state_code: text(row.state_code) || null,
            country_name: value,
            country_code: keep ? (text(row.country_code) || null) : null
          }).then(function (ok) { if (!ok) undo(); });
        });

        var stateBox = box(cityStateLabel(slug), 'State', 'State or province', function (value, undo) {
          var keep = text(value).toLowerCase() === text(cityStateLabel(slug)).toLowerCase();
          saveTapeGeo(tape, {
            city: soundCityLabel(slug),
            state_name: value,
            state_code: keep ? (text(row.state_code) || null) : null,
            country_name: cityCountryLabel(slug),
            country_code: text(row.country_code) || null
          }).then(function (ok) { if (!ok) undo(); });
        });

        // THE CITY IS A MOVE, NOT A RELABEL, and that is why editing it here
        // replaces the box in the tape's name rather than duplicating it.
        // `city_slug` is the tape's key and half of what identifies it, so
        // changing the city has to change the slug too -- which is exactly what
        // `moveTapeToCity` does, clash check and all.
        var cityBox = box(soundCityLabel(slug), 'City', 'City', function (value, undo) {
          var target = cityByLabel(value);
          if (!target) {
            var made = slugFromLabel(value);
            if (!made) {
              setNotice('"' + value + '" does not give a usable city name', 'error');
              undo();
              return;
            }
            target = { slug: made, city: value, isNew: true };
          }
          var wanted = text(tape.spine_tag).toLowerCase();
          var clash = soundtracks().filter(function (other) {
            return other !== tape && text(other.city_slug) === target.slug
              && text(other.spine_tag).toLowerCase() === wanted;
          })[0];
          if (clash) {
            setNotice(cityFullLabel(target.slug) + ' already has a tape called "'
              + (text(clash.spine_tag) || 'no spine phrase') + '", rename this one first', 'error');
            undo();
            return;
          }
          moveTapeToCity(tape.id, target.slug, target).then(function (ok) { if (!ok) undo(); });
        });

        function sep() {
          var el = document.createElement('span');
          el.className = 'geo-sep';
          el.textContent = '/';
          return el;
        }

        wrap.append(countryBox, sep(), stateBox, sep(), cityBox);
        return wrap;
      }

      function buildTapeNameEditor(tapeId) {
        var tape = tapeById(tapeId);
        var slug = text(tape && tape.city_slug);
        var name = document.createElement('span');
        name.className = 'tape-line-name tape-name-editor';
        if (!tape) return name;

        // THE CITY IS READ-ONLY HERE. It is edited on the tape's place line,
        // where it sits with the state and the country it belongs to, and where
        // it is plainly a MOVE rather than a rename. Two boxes that both change
        // the tape's key is two ways to get that wrong.
        var cityHalf = document.createElement('input');
        cityHalf.className = 'city-input is-locked';
        cityHalf.type = 'text';
        cityHalf.readOnly = true;
        cityHalf.tabIndex = -1;
        cityHalf.value = soundCityLabel(slug);
        cityHalf.setAttribute('aria-label', 'City for this tape, edited on the place line');
        cityHalf.title = 'Which city this tape belongs to. Edit it on the place line above, where changing it moves the tape and every track on it.';
        function sizeCity() { fitInput(cityHalf); }
        sizeCity();
        cityHalf.addEventListener('input', sizeCity);

        // `commitCity` WENT WITH THE BOX'S EDITABILITY. A read-only input with
        // a live blur handler is a locked control that is not locked.




        var spine = document.createElement('input');
        spine.className = 'spine-input';
        spine.type = 'text';
        spine.value = text(tape && tape.spine_tag);
        spine.placeholder = 'no spine phrase';
        spine.setAttribute('aria-label', 'Spine phrase for ' + soundCityLabel(slug));
        spine.title = 'The phrase printed down the side of the cassette on /soundtracks/. Enter saves, Escape cancels.';

        function sizeSpine() { fitInput(spine); }
        sizeSpine();
        spine.addEventListener('input', sizeSpine);

        var leads = text(tape && tape.spine_tag_position) === 'before';

        var flip = document.createElement('button');
        flip.type = 'button';
        flip.className = 'spine-flip';

        flip.textContent = '\u21c4';
        flip.setAttribute('aria-label', 'Swap the order of the city and the spine phrase');
        flip.title = leads
          ? 'Swap: put the city first, "' + soundCityLabel(slug) + ' ' + (text(tape && tape.spine_tag) || '\u2026') + '"'
          : 'Swap: put the city last, "' + (text(tape && tape.spine_tag) || '\u2026') + ' ' + soundCityLabel(slug) + '"';
        flip.addEventListener('click', async function () {
          var at = tapeIndexById(tape.id);
          if (at < 0) { setNotice('that tape is no longer loaded, reload the page', 'error'); return; }
          flip.disabled = true;

          var result = await saveTapeName(at, { spine_tag_position: leads ? null : 'before' });
          flip.disabled = false;
          if (result && result.ok) { renderTrackArchive(); renderTracks(); }
          else setNotice((result && result.message) || 'could not move the city', 'error');
        });

        var spineWas = spine.value;
        async function commitSpine() {
          var next = spine.value.trim();
          if (next === spineWas) { spine.value = spineWas; sizeSpine(); return; }
          var at = tapeIndexById(tape.id);
          if (at < 0) {
            setNotice('that tape is no longer loaded, reload the page', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spine.disabled = true;
          spine.classList.add('is-saving');

          var result = await saveTapeName(at, { spine_tag: next });
          spine.disabled = false;
          spine.classList.remove('is-saving');
          if (!result || !result.ok) {
            setNotice((result && result.message) || 'could not rename that tape', 'error');
            spine.value = spineWas; sizeSpine();
            return;
          }
          spineWas = next;
          spine.value = next;
          sizeSpine();
        }

        spine.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); spine.blur(); return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            spine.value = spineWas;
            sizeSpine();
            spine.blur();
          }
        });
        spine.addEventListener('blur', commitSpine);

        if (leads) name.append(spine, flip, cityHalf);
        else name.append(cityHalf, flip, spine);
        return name;
      }

      var tracksCard = document.getElementById('tracksCard');

      var tracksOnlySongId = null;

      var trackAirAll = document.getElementById('trackAirAll');
      var trackAirAllInput = document.getElementById('trackAirAllInput');

      // Every track on the open tape, before any filter. The switch's counts
      // read this; the list reads visibleTrackSongs below.
      function allTrackSongs() {
        var tape = tapeById(tracksTapeId);
        return tape ? allSongs(tape) : [];
      }

      function visibleTrackSongs() {
        var songs = allTrackSongs();
        if (tracksOnlySongId != null) {
          return songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        }
        // ONE TEST, SHARED WITH THE MAIN LIST. Two readers of "what is visible"
        // is how the air switch ended up silently inert once already.

      }

      function paintTrackMasterAir() {
        // COUNTS OVER THE WHOLE TAPE, never over what the filter has left. A
        // count that shrank as you filtered would read as the filter breaking,
        // and the question it answers is how many there are.
        var songs = allTrackSongs();
        var live = 0, shelved = 0;
        songs.forEach(function (song) {
          if (songStatus(song) === 'LIVE') live += 1; else shelved += 1;
        });
        paintAirSwitch(trackAirAll, trackAirAllInput, trackAirFilter,
          { live: live, shelved: shelved, total: songs.length }, 'tracks');
      }

      // ONE QUESTION ASKED FROM TWO PLACES. The popup's switch and the one on
      // the main list's header are the same filter, so both go through here and
      // both surfaces repaint: setting it in the popup and finding the list
      // behind it unchanged is the sort of disagreement nobody notices until it
      // has cost them something.
      function setTrackAir(value) {
        trackAirFilter = value;
        // CHOOSING ONE CLEARS THE OTHERS. See `chooseTrackFilter`.
        if (value !== 'all') trackFlagFilter = '';
        renderTrackArchive();
        if (tracksOpen()) renderTracks();
      }

      wireAirSwitch(trackAirAll, trackAirAllInput,
        function () { return trackAirFilter; },
        setTrackAir);

      // THERE IS NO X ON THE HEADER. It deleted the tape, then the selection,
      // and now nothing: deleting is the bulk bar's Delete and nowhere else.
      // The Del column's header is a plain label again, naming the column of
      // per-row delete buttons under it.

      // THE DELETE QUESTION, AS A DIALOG. It was a strip appended into the
      // header, which put an irreversible question inside a bar you scan past.
      //
      // ONE STATE DRIVES IT. `bulkPendingDelete` is set by the bar's Delete and
      // cleared by every way out, and this paints from it on every render, so
      // the dialog cannot be open about a selection that has since changed.
      // THE SINGLE-TRACK DELETE QUESTION, AS A DIALOG.
      //
      // It was a strip appended inside the badge, which changed the card's
      // height and shoved the grid around it -- and it asked an irreversible
      // question in the middle of a list you were scanning.
      //
      // IT IS ITS OWN DIALOG rather than a mode of the batch one. They read
      // almost the same, and that is the argument FOR keeping them apart: one
      // acts on a selection you built, the other on the row your finger is on,
      // and a panel that silently means either is a panel you have to read twice
      // before answering.
      // ── LOOKING UP A SPOTIFY ID ──────────────────────────────────────────
      //
      // The function reads the public catalogue and hands back a shortlist with
      // the album and the year AS SPOTIFY HAS THEM, because those are the two
      // things that tell a live cut, a re-recording or a cover from the record
      // somebody meant. That judgement is the reason a human is still here.
      //
      // ONE ANSWER FILLS THE BOX. Several open a picker. Neither saves: the box
      // commits on blur like any other, so the save is a second, deliberate act
      // by somebody who has looked at what was found.
      async function lookupSpotifyId(song, idEl, btn) {
        var title = text(song.title);
        if (!title) {
          setNotice('that track has no title to look up', 'error');
          return;
        }
        var was = btn.textContent;
        btn.disabled = true;
        btn.textContent = '...';
        var data;
        try {
          var res = await fetch(fnUrl('spotify-lookup'), {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ title: title, artist: text(song.artist) })
          });
          if (!res.ok) throw new Error('Supabase ' + res.status);
          data = await res.json();
        } catch (error) {
          console.error(error);
          // A FUNCTION THAT IS NOT DEPLOYED IS THE LIKELIEST CAUSE and is the
          // one thing a raw status code will not tell you.
          setNotice('the Spotify lookup did not answer. It may not be deployed yet: '
            + 'cd mc && supabase functions deploy spotify-lookup', 'error');
          btn.disabled = false;
          btn.textContent = was;
          return;
        }
        btn.disabled = false;
        btn.textContent = was;

        var matches = (data && Array.isArray(data.matches)) ? data.matches : [];
        if (!matches.length) {
          // THE FUNCTION'S OWN SENTENCE, which names a missing secret or says
          // Spotify has nothing. Both are things somebody can act on.
          setNotice((data && data.reason) || 'Spotify found nothing for that track', 'error');
          return;
        }
        if (matches.length === 1) {
          fillSpotifyId(idEl, matches[0]);
          return;
        }
        openMatchPicker(song, idEl, matches);
      }

      // FILLED, NOT SAVED, and it says what it filled in. The id itself is 22
      // characters of machine text nobody can check by looking, so the notice
      // carries the title, artist, album and year instead.
      function fillSpotifyId(idEl, match) {
        idEl.value = match.id;
        idEl.focus();
        setNotice('found ' + match.title + ' by ' + match.artist
          + (match.album ? ' on ' + match.album : '')
          + (match.year ? ' (' + match.year + ')' : '')
          + '. Check it is the right recording, then click away to save.', 'hold');
      }

      var matchPickerOpen = false;

      function openMatchPicker(song, idEl, matches) {
        var card = document.getElementById('matchCard');
        var backdrop = document.getElementById('matchBackdrop');
        var title = document.getElementById('matchTitle');
        var list = document.getElementById('matchList');
        if (!card || !backdrop || !title || !list) return;
        matchPickerOpen = true;
        title.textContent = 'Which recording?';
        list.textContent = '';
        matches.forEach(function (m) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'match-row';
          var main = document.createElement('span');
          main.className = 'match-main';
          main.textContent = m.title + ' - ' + m.artist;
          var sub = document.createElement('span');
          sub.className = 'match-sub';
          // THE ALBUM AND THE YEAR ARE THE WHOLE POINT OF THE LIST. Without
          // them every row of a search for a standard reads the same.
          sub.textContent = [m.album, m.year, m.explicit ? 'explicit' : '']
            .filter(Boolean).join('  |  ');
          row.append(main, sub);
          row.addEventListener('click', function () {
            closeMatchPicker();
            fillSpotifyId(idEl, m);
          });
          list.appendChild(row);
        });
        card.hidden = false;
        backdrop.hidden = false;
      }

      function closeMatchPicker() {
        matchPickerOpen = false;
        var card = document.getElementById('matchCard');
        var backdrop = document.getElementById('matchBackdrop');
        if (card) card.hidden = true;
        if (backdrop) backdrop.hidden = true;
      }

      function paintTrackDeleteDialog() {
        var card = document.getElementById('trackDelCard');
        var backdrop = document.getElementById('trackDelBackdrop');
        var words = document.getElementById('trackDelWords');
        var title = document.getElementById('trackDelTitle');
        var foot = document.getElementById('trackDelFoot');
        if (!card || !backdrop || !words || !title || !foot) return;

        var at = trackPendingDelete == null ? null : locateSong(trackPendingDelete);
        var tape = at ? soundtracks()[at.tapeIndex] : null;
        var song = tape && tape.songs ? tape.songs[at.songIndex] : null;
        if (!song) {
          card.hidden = true;
          backdrop.hidden = true;
          return;
        }

        title.textContent = 'Delete ' + (text(song.title) || 'this track') + '?';
        // PLAIN WORDS, the same ones the batch question uses: what a person
        // decides with is that a deleted track can come back on the next run and
        // a shelved one cannot.
        var isLive = songStatus(song) === 'LIVE';
        words.textContent = 'This cannot be undone, and the bot may find it and file it again.'
          + (isLive ? ' Shelving keeps it off /soundtracks/ and stops that.' : '');

        foot.textContent = '';
        function btn(label, cls, onClick) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn ' + cls;
          b.textContent = label;
          b.addEventListener('click', onClick);
          foot.appendChild(b);
          return b;
        }

        // SHELVING IS ONLY OFFERED WHEN IT WOULD DO SOMETHING, exactly as on the
        // batch question: on an already shelved track it would write
        // `archived = true` over `archived = true`.
        if (isLive) {
          btn('Shelve instead', 'primary', function () {
            var songIndex = (tape.songs || []).indexOf(song);
            trackPendingDelete = null;
            if (songIndex < 0) { repaintTracks(); return; }
            setTrackStatus(at.tapeIndex, songIndex, 'SHELVED').then(function () { repaintTracks(); });
          });
        }
        var go = btn('Delete anyway', 'warn', function () {
          go.disabled = true;
          deleteTrack(at.tapeIndex, song).then(function () { repaintTracks(); });
        });
        btn('Cancel', '', closeTrackDelete);

        backdrop.hidden = false;
        card.hidden = false;
      }

      function closeTrackDelete() {
        trackPendingDelete = null;
        repaintTracks();
      }

      // THE BATCH DIALOG, IN TWO STATES.
      //
      // First it offers what a selection can be made to do; pressing Delete
      // turns it into the question about deleting, in the same panel, because a
      // second dialog over a dialog is worse than a panel that changes its mind.
      //
      // IT PAINTS FROM STATE ON EVERY RENDER, so it cannot be open about a
      // selection that has since changed underneath it.
      function paintBulkDialog(tape) {
        var card = document.getElementById('bulkCard');
        var backdrop = document.getElementById('bulkBackdrop');
        var words = document.getElementById('bulkWords');
        var title = document.getElementById('bulkTitle');
        var foot = document.getElementById('bulkFoot');
        if (!card || !backdrop || !words || !title || !foot) return;

        var n = selectedCount();
        if (!bulkOpen || !n) {
          card.hidden = true;
          backdrop.hidden = true;
          return;
        }

        var tracks = n + (n === 1 ? ' track' : ' tracks');
        var it = n === 1 ? 'it' : 'them';
        // SHELVING IS ONLY OFFERED WHEN IT WOULD DO SOMETHING. On a selection
        // already shelved it would write `archived = true` over `archived = true`
        // and report a success that changed nothing.
        var anyLive = allSongs(tape).filter(isSelected).some(function (song) {
          return songStatus(song) === 'LIVE';
        });
        var anyShelved = allSongs(tape).filter(isSelected).some(function (song) {
          return songStatus(song) !== 'LIVE';
        });

        foot.textContent = '';
        function btn(label, cls, onClick, tip) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn ' + cls;
          b.textContent = label;
          if (tip) b.title = tip;
          b.addEventListener('click', onClick);
          foot.appendChild(b);
          return b;
        }

        if (!bulkPendingDelete) {
          title.textContent = tracks + ' selected';
          words.textContent = 'Everything here acts on all ' + n + ' at once.';
          // ONLY THE MOVES THAT WOULD CHANGE SOMETHING. A selection that is
          // already live has nothing to gain from Live.
          if (anyShelved) {
            btn('Go live', 'primary', function () {
              applyToSelection(tape, { archived: false }, 'Live');
            }, 'Put every selected track on /soundtracks/.');
          }
          if (anyLive) {
            btn('Shelve', 'primary', function () {
              applyToSelection(tape, { archived: true }, 'Shelve');
            }, 'Take every selected track off /soundtracks/.');
          }
          btn('Delete', 'warn', function () {
            bulkPendingDelete = true;
            renderTrackArchive();
          }, 'Delete every selected track.');
          // DONE, NOT CANCEL. Every button above it acts at once and closes the
          // panel, so by the time you reach this one there is nothing to undo --
          // you are finished. `Cancel` promised to take something back.
          btn('Done', '', closeBulkDialog);
        } else {
          title.textContent = 'Delete ' + tracks + ' for good?';
          // PLAIN WORDS. What a person needs is the consequence: the bot can
          // find a deleted track and file it again, and a shelved one it leaves
          // alone.
          words.textContent = 'This cannot be undone, and the bot may find ' + it
            + ' and file ' + it + ' again.'
            + (anyLive ? ' Shelving keeps ' + it + ' off /soundtracks/ and stops that.' : '');
          if (anyLive) {
            btn('Shelve instead', 'primary', function () {
              bulkPendingDelete = false;
              applyToSelection(tape, { archived: true }, 'Shelve');
            });
          }
          var go = btn('Delete ' + tracks, 'warn', async function () {
            go.disabled = true;
            await deleteSelection(tape);
          });
          // BACK, NOT CANCEL. The panel changed its mind rather than opening a
          // new dialog, so the way out of this state is the way back to the one
          // before it.
          btn('Back', '', function () {
            bulkPendingDelete = false;
            renderTrackArchive();
          });
        }

        backdrop.hidden = false;
        card.hidden = false;
      }

      // `tapePendingDelete`, `renderTapeConfirm` and `deleteTape` went here on
      // 2026-08-26, when the header's X stopped acting on the tape. They were
      // the only tape-level delete, so THAT CAPABILITY IS GONE rather than
      // moved: deleting a tape is now deleting its tracks, which is a different
      // act with a different scope even where the outcome looks the same.

      function renderTracks() {
        if (!trackLines || !tracksOpen()) return;
        var tape = tapeById(tracksTapeId);
        if (!tape) { closeTracks(); return; }
        var tapeIndex = tapeIndexById(tracksTapeId);
        var counts = tapeCounts(tape);
        var total = counts.LIVE + counts.SHELVED;

        tracksTitle.textContent = '';
        tracksTitle.appendChild(buildTapeNameEditor(tracksTapeId));

        // BOTH TAKE A SLUG. They were handed the tape id, so the state and the
        // country have never drawn on this subtitle -- silently, since an
        // unknown slug returns '' rather than complaining.
        var whereBits = [cityStateLabel(tape.city_slug), cityCountryLabel(tape.city_slug)]
          .map(text).filter(Boolean);
        var bits = [];
        if (whereBits.length) bits.push(whereBits.join(', '));
        bits.push(total + (total === 1 ? ' track' : ' tracks'));
        bits.push(counts.LIVE + ' live');
        if (counts.SHELVED) bits.push(counts.SHELVED + ' shelved');
        // NOT "TAPE SHELVED". A tape has no state; what is true of one with no
        // live track is that /soundtracks/ does not draw it, which is the thing
        // somebody standing here wants to know.
        if (!counts.LIVE) bits.push('not on /soundtracks/');
        tracksSub.textContent = bits.join('  ·  ');

        var songs = allSongs(tape).slice().sort(function (a, b) {
          return (Number(a.position) || 0) - (Number(b.position) || 0) || (Number(a.id) - Number(b.id));
        });
        if (tracksOnlySongId != null) {
          songs = songs.filter(function (song) { return String(song.id) === String(tracksOnlySongId); });
        } else {
          // THE HEADER'S CONTROLS ARE FILTERS. `visibleTrackSongs` says the same
          // thing for the keyboard and the counts, but this list is built here,
          // so the test has to run here too or the switch does nothing and says
          // nothing about why.
          songs = songs.filter(trackPassesFilters);
        }


        trackLines.textContent = '';

        if (!songs.length) {
          trackLines.appendChild(emptyNode(tracksOnlySongId != null
            ? 'That track is not on this tape any more.'
            : 'No tracks on this tape yet. They come from the PROMPT or TGB SOUNDTRACK BOT.'));
        } else {
          songs.forEach(function (song) {
            trackLines.appendChild(renderTrackLine(tape, tapeIndex, song));
          });
        }

        growBlurbs();

        Array.prototype.forEach.call(
          tracksTitle.querySelectorAll('.city-input, .spine-input'),
          function (el) { fitInput(el); });
        paintTrackMasterAir();

        tracksFoot.textContent = '';
        if (tracksOnlySongId != null) {
          var back = document.createElement('button');
          back.type = 'button';
          back.className = 'btn small';
          back.textContent = 'Show the whole tape';
          back.addEventListener('click', function () { openTracks(tracksTapeId); });
          tracksFoot.appendChild(back);
        } else {
          tracksFoot.textContent = 'Every field saves when you leave it. Enter saves, Escape puts the old value back.';
        }
      }

      // BOTH LISTS. This swept `trackLines` alone, which is the popup, so the
      // main list's blurbs stayed clipped at one line while the popup's grew to
      // two: the same row rendered two different heights depending on where you
      // were looking at it.
      function growBlurbs() {
        [trackLines, trackArchiveList].forEach(function (root) {
          if (!root) return;
          Array.prototype.forEach.call(
            root.querySelectorAll('textarea.track-input--blurb'),
            function (area) { if (typeof area.growToFit === 'function') area.growToFit(); });
        });
      }

      // A TRACK IS DRAWN IN TWO PLACES NOW: the main list and the tracks
      // popup. `renderTracks()` returns early when the popup is shut, so every
      // repaint inside a track row went through this instead -- otherwise
      // saving, shelving or deleting a track on the main list would change the
      // database and leave the row on screen showing the old value.
      function repaintTracks() {
        renderTrackArchive();
        renderTracks();
      }

      function renderTrackLine(tape, tapeIndex, song, options) {
        var inArchiveList = !!(options && options.inArchiveList);
        var line = document.createElement('div');
        line.className = 'track-line' + (inArchiveList ? ' track-line--in-list' : '');
        var status = songStatus(song);
        line.classList.toggle('is-shelved', status === 'SHELVED');
        line.classList.toggle('is-live', status === 'LIVE');
        line.dataset.songId = String(song.id);
        var isFocused = focusTrackId != null && String(focusTrackId) === String(song.id);
        line.classList.toggle('is-focused', isFocused);

        line.addEventListener('click', function (event) {
          var el = event.target;
          if (el.closest('input, textarea, button, select, label, a')) return;
          focusTrackId = isFocused ? null : song.id;
          repaintTracks();
        });

        function commit(input, original, apply) {
          var songIndex = (tape.songs || []).indexOf(song);
          if (songIndex < 0) {
            setNotice('that track is out of step with the list, so nothing was saved - press Reload and try again', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          var fields = {
            title: text(titleEl.value),
            artist: text(artistEl.value),
            position: Number(posEl.value) || 0,
            blurb: text(blurbEl.value) || null,
            spotify_id: spotifyIdFrom(idEl.value) || null,
            explicit: !!explicitEl.checked,
            sports: !!sportsEl.checked
          };
          if (apply) apply(fields);
          if (!fields.title || !fields.artist) {
            setNotice('a track needs a title and an artist', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          if (text(idEl.value) && !fields.spotify_id) {
            setNotice('that is not a Spotify track id. Paste the whole share link, or the 22-character id out of it', 'error');
            if (input && 'value' in input) input.value = original;
            return;
          }
          saveTrackFields(tapeIndex, songIndex, fields).then(function (result) {
            if (result && result.ok) repaintTracks();
            else {
              if (input && 'value' in input) input.value = original;
              setNotice((result && result.message) || 'could not save that track', 'error');
            }
          });
        }

        function field(cls, value, placeholder, label) {
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'track-input ' + cls;
          input.value = value;
          if (placeholder) input.placeholder = placeholder;
          input.setAttribute('aria-label', label + ' for ' + songDisplay(song));
          var was = value;
          input.addEventListener('focus', function () { was = input.value; trackPendingDelete = null; });
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
            if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); input.value = was; input.blur(); }
          });
          input.addEventListener('blur', function () {
            if (input.value === was) return;
            commit(input, was);
          });
          return input;
        }

        function blurbField(value) {
          var area = document.createElement('textarea');
          area.className = 'track-input track-input--blurb';
          area.rows = 1;
          area.value = value;
          area.placeholder = 'no blurb';
          area.setAttribute('aria-label', 'Blurb for ' + songDisplay(song));
          area.title = 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          var was = value;

          // ONE LINE AT REST, THE WHOLE BLURB WHEN YOU ARE IN IT. This is what
          // actually sets a track row's height: a ten-word blurb wraps to two or
          // three lines in its column, so every row was two or three lines tall
          // and trimming the padding moved almost nothing.
          //
          // NOTHING IS HIDDEN THAT YOU CANNOT GET AT: the box grows the moment
          // it takes focus, its tooltip carries the full text, and a blurb that
          // fits on one line looks no different from before.
          var MIN_H = 26;

          // THE TOOLTIP IS SET WHATEVER HAPPENS, and outside `grow()`: that
          // function returns early when the box is not yet in the document,
          // which it never is when the row is being built, so a tooltip set in
          // there would only ever appear after a later resize.
          function paintBlurbTitle() {
            area.title = text(area.value)
              ? area.value
              : 'The sentence under this track on /soundtracks/. Ten words or fewer, no trailing period. Required: a missing one is reported by the audit.';
          }
          paintBlurbTitle();

          // IT GROWS TO ITS CONTENT AND NEVER SCROLLS. It grows wherever it is
          // drawn, so a track is the same height on the main list and in the
          // popup.
          //
          // THE `manual` LATCH AND ITS ResizeObserver ARE GONE, and they are why
          // every blurb on screen had a scrollbar. The observer set `manual` the
          // moment the box's height differed from what `grow` had applied by
          // more than 2px -- which is not only a human dragging the resize grip,
          // it is the COLUMN SETTLING: the grid resolving, a webfont arriving.
          // Once latched, `grow()` returned early forever and `.is-manual`
          // turned `overflow: auto` on. A guard against one thing fired on
          // another, permanently, and looked like a styling fault.
          //
          // The grip is gone with it (`resize: none`), so there is nothing left
          // for such an observer to watch.
          function grow() {
            if (!area.isConnected) return;
            area.style.height = 'auto';
            area.style.height = Math.max(MIN_H, area.scrollHeight) + 'px';
          }
          grow();

          area.growToFit = grow;

          area.addEventListener('focus', function () {
            was = area.value; trackPendingDelete = null;
            grow();
          });
          area.addEventListener('blur', function () { paintBlurbTitle(); grow(); });
          area.addEventListener('input', function () {

            var NL = String.fromCharCode(10);
            if (area.value.indexOf(NL) >= 0) {
              area.value = area.value.split(NL).join(' ').replace(/  +/g, ' ');
            }
            grow();
          });
          area.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); area.blur(); }
            if (event.key === 'Escape') {
              event.stopPropagation();
              event.preventDefault();
              area.value = was;
              grow();
              area.blur();
            }
          });
          area.addEventListener('blur', function () {
            if (area.value === was) return;
            commit(area, was);
          });
          return area;
        }

        // THE PLAY BUTTON OPENS THE PLAYER DIALOG. It used to open a stage
        // under the row, which pushed every badge below it down by 152px and
        // moved the one you were looking at.
        var isPlaying = playingTrackId != null && String(playingTrackId) === String(song.id);
        var playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'badge-play' + (isPlaying ? ' is-playing' : '');
        // A DRAWN TRIANGLE, NOT A GLYPH. This project has already found that no
        // face it loads carries the four arrows it wanted; a play triangle is
        // the same risk at a bigger size, and an SVG takes its colour from
        // `currentColor` so hover and pressed need no second rule.
        playBtn.appendChild(playGlyph(isPlaying));
        playBtn.setAttribute('aria-label', (isPlaying ? 'Stop playing ' : 'Play ')
          + songDisplay(song));
        playBtn.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
        playBtn.title = isPlaying
          ? 'Close the player'
          : (text(song.spotifyId)
              ? 'Play this track'
              : 'No Spotify id on this track, so this opens a Spotify search instead');
        playBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          if (isPlaying) closePlayer(); else openPlayer(song);
        });

        var posEl = field('track-input--num', String(Number(song.position) || 0), '#', 'Position');
        posEl.title = 'Play order on the cassette. Edit it to reorder.';
        // THE PLACEHOLDER IS THE COLUMN LABEL NOW. The legend row above the
        // tracks was the room's third stacked header and went; without a
        // placeholder an empty Title field would be an unmarked white box.
        var titleEl = field('track-input--title', text(song.title), 'Title', 'Title');
        titleEl.title = 'Title. Enter saves, Escape cancels.';
        // NAMED SO THE SHRINK PASS CAN FIND IT. It was the one field on the row
        // with no class of its own, which is exactly how a field gets left out
        // of a sweep and nobody notices.
        var artistEl = field('track-input--artist', text(song.artist), 'Artist', 'Artist');
        artistEl.title = 'Artist. Enter saves, Escape cancels.';

        var blurbEl = blurbField(text(song.blurb));

      async function deleteTrack(tapeIndex, song) {

        } catch (error) {
          console.error(error);
          setNotice('could not delete ' + songDisplay(song), 'error');
          return false;
        }
        var at = (tape.songs || []).indexOf(song);
        if (at >= 0) tape.songs.splice(at, 1);

        trackPendingDelete = null;

          + '. The bot may find it and file it again; shelving would have stopped that.', 'hold');

        if (trackPendingDelete != null) { trackPendingDelete = null; renderTracks(); return; }

      function openTracksFromHash() {

        m = /^tracks=(.+)$/.exec(hash);
        if (m) {
          var first = tapesInCity(decodeURIComponent(m[1]))[0];
          if (first) openTracks(first.id);
          else setNotice('no tape for ' + decodeURIComponent(m[1]), 'error');
          return true;

        m = /^track=(.+)$/.exec(hash);

      var trackTotalEl = document.getElementById('roomStats');

      // left. It is the standing figure the room is measured by, and one that
      // shrank as you narrowed would be answering a different question from the
      // one it asks.
      function paintTrackTotal() {
        if (!trackTotalEl) return;
        var live = 0, shelved = 0;
        soundtracks().forEach(function (tape) {
          var c = tapeCounts(tape);
          live += c.LIVE;
          shelved += c.SHELVED;
        });
        var t = airCounts();
        trackTotalEl.textContent = '';

        function part(word, n, cls) {
          var w = document.createElement('span');
          w.className = 'room-stats-word';
          w.textContent = word;
          var v = document.createElement('span');
          v.className = 'room-stats-count' + (cls ? ' ' + cls : '');
          v.textContent = String(n);
          trackTotalEl.append(w, v);
        }
        function sep(text) {
          var el = document.createElement('span');
          el.className = 'room-stats-sep';
          el.textContent = text;
          trackTotalEl.appendChild(el);
        }

        // TAPES ARE COUNTED, NOT STATED. "113 tapes, 1 with a live track" is a
        // fact about tracks; "1 live / 112 shelved" would be the tape state this
        // room no longer has.
        // THREE GROUPS SEPARATED BY PIPES, never a comma. `.room-stats` is a
        // flex row, so the space around a bare separator comes from the row's
        // gap: "113 , 1" is what a comma renders as here.
        part('tapes', t.total, '');
        sep('|');
        part('', t.onAir, t.onAir ? 'is-live' : '');
        sep('with a live track');
        sep('|');
        part('tracks', live, 'is-live');
        sep('live /');
        part('', shelved, '');

      function paintAirSwitch(label, input, value, counts, noun) {
        if (!label || !input) return;

        input.checked = value === 'live';
        input.disabled = false;
        label.querySelector('.tape-air-word--off')
          .classList.toggle('is-current', value === 'shelved');
        label.querySelector('.tape-air-word--on')
          .classList.toggle('is-current', value === 'live');

          + (value === 'all'

      // Pressing a WORD picks that state, or clears it when it is already on;

      // otherwise flip the checkbox underneath us.
      function wireAirSwitch(label, input, get, set) {
        if (!label || !input) return;
        label.addEventListener('click', function (event) {
          event.preventDefault();
          var word = event.target && event.target.closest
            ? event.target.closest('.tape-air-word') : null;

          if (word && word.classList.contains('tape-air-word--off')) {
            set(now === 'shelved' ? 'all' : 'shelved');
          } else if (word && word.classList.contains('tape-air-word--on')) {

      function airCounts() {

      function paintSelectAll(shown) {

        var wrap = document.getElementById('viewPickWrap');

        box.disabled = !n;

        // listener added on every render would stack up one per repaint.

      // THE BATCH BUTTON FLOATS. It was pinned beside the header's tick and the

      // be scrolled away from, and appears only while there is a selection.
      function paintBatchButton() {
        var btn = document.getElementById('batchBtn');
        if (!btn) return;
        var n = selectedCount();

        // badge -- the switch, the flags, its delete -- so a batch button for a
        // selection of one offers a second way to do what is already in front of

      // disagree about what is visible -- which is exactly how the air switch
