<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TAPE ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --mc-shell-width: 1180px;

      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.05);
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      outline: none;
    }

    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* THE ONE RED BUTTON IN THE ROOM. Outlined rather than filled: it is a door
       to somewhere, not the action the room is for, and a filled red button
       beside four white ones reads as a warning about pressing it. */
    .btn--issues {
      border-color: var(--bic-red);
      color: var(--bic-red);
    }

    .btn--issues:hover {
      border-color: var(--bic-red);
      background: var(--bic-red);
      color: #fff;
    }

    .btn:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      background: rgba(var(--bic-blue-rgb), 0.05);
    }

    .btn.primary:hover {
      background: #24396a;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #24396a;
      color: #fff;
    }

    .btn[disabled] {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      cursor: default;
      opacity: 1;
      pointer-events: none;
    }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .command-bar > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;

      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto var(--stack-gap);
    }

    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    /* ADD TAKES THE SLACK; the two on its right stay their own width. */
    /* THE TAPE NAV IN THE VIEW BAR. Square end caps and the count between
       them, so the pair reads as one control with two ends. */
    .tape-step {
      min-width: 34px;
      padding: 0 8px;
      font-size: 1rem;
      line-height: 1;
    }

    .tape-step + .tape-step { margin-left: -6px; }
    .tape-step[disabled] { opacity: 0.35; cursor: default; }

    .tape-where {
      font: 500 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* A hairline marking where the room's own navigation stops and the places
       you leave for begin. */
    .bar-sep {
      width: 1px;
      align-self: stretch;
      min-height: 26px;
      margin: 0 2px;
      background: var(--control-line);
    }

    .command-bar--view,
    .command-bar--filter { flex: 0 0 auto; }
    @media (max-width: 720px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
      .bar-row .command-bar--view,
      .bar-row .command-bar--filter { flex: 1 1 100%; }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .room-head .room-blurb { max-width: none; }

    .btn.is-stale {
      border-color: rgba(194, 55, 55, 0.5);
      color: var(--bic-red);
    }

    .btn.is-stale:hover {
      border-color: var(--bic-red);
      background: rgba(194, 55, 55, 0.07);
    }

    .chip.warn {
      border-color: rgba(154, 74, 24, 0.28);
      background: rgba(154, 74, 24, 0.08);
      color: #9a4a18;
    }

    .chip.success {
      border-color: rgba(47, 107, 61, 0.28);
      background: rgba(47, 107, 61, 0.08);
      color: var(--success);
    }
    @media (max-width: 840px) {

      .tool-modal-panel > .panel-head {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }

      .tool-modal-panel > .panel-head .panel-title { flex: 1 1 100%; }
    }

    @media (max-width: 840px) {

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head-actions .btn,
      .panel-head-actions select,
      .command-bar .btn {
        flex: 1 1 auto;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a { color: var(--accent); }

    /* THE COLUMNS ARE DECLARED ON THE LIST, ONCE, AND BOTH THE HEADER AND THE
       ROWS READ THEM FROM HERE. They used to be written out on `.track-head`,
       on `.track-line--in-list` and on `.track-lines` -- three copies of one
       string, and this file already warned that missing one puts every label a
       column away from the field it names. Inherited from the container they
       cannot differ, because there is only one of them. */
    .tape-lines {
      display: grid;
      gap: 6px;
      --track-cols: 30px 48px 32px 48px minmax(0, 2fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 130px 48px 48px 196px 32px;
    }

    .tape-lines {
      --col-label: 0.68rem;
      --col-value: 0.78rem;
      --col-text: 0.78rem;
    }

    /* THE TAPE'S TWO CONTROLS SIT IN THE HEADER'S OWN CELLS, at the top of the
       columns they act on: the switch above the tracks' switches, the delete
       above theirs. The header is column labels again -- a strip above them was
       a tape header by another name. */

    /* ── THE SELECTION ──────────────────────────────────────────────────── */

    .track-pick,
    .track-head-label--pick {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      padding: 0;
    }

    /* THE TICK IS THE ROW'S OWN SIZE, so it reads as part of the row rather
       than as chrome bolted to the side of it. */
    .track-pick-box { cursor: pointer; }

    /* THE BULK BAR, ACROSS THE HEADER, ONLY WHEN SOMETHING IS SELECTED. It is
       drawn in the room's primary ink rather than the muted grey of the labels
       above it: these are things that WRITE, and the bar beside them filters. */
    .track-bulk {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--control-line);
      font-size: 0.72rem;
      letter-spacing: normal;
      text-transform: none;
    }

    .track-bulk-count {
      margin-right: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .track-bulk-sep {
      width: 1px;
      height: 18px;
      margin: 0 4px;
      background: var(--control-line);
    }

    /* DESTRUCTIVE HARD RIGHT OF THE SETTERS, with the way out after it: the
       irreversible button belongs as far as the row goes from the ones you
       actually came to press. */
    .track-bulk .btn.warn {
      margin-left: auto;
      border-color: var(--bic-red);
      color: var(--bic-red);
    }

    .track-bulk .btn.warn.is-armed {
      background: var(--bic-red);
      border-color: var(--bic-red);
      color: #fff;
    }

    .track-bulk .btn.ghost { border-color: transparent; color: var(--muted); }
    .track-bulk .btn.ghost:hover { color: var(--ink); }

    .track-head-label--tapeair,
    .track-head-label--tapedel {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      padding: 0;
    }

    /* THE FILTER IS THE HEADER'S OWN SIZE, not the row's. It sits among column
       labels, so at 14pt it would be the loudest thing in a bar of 0.62rem
       words; the switches it filters keep the row's size. */
    .track-head-label--tapeair .tape-air-word { font-size: 0.62rem; }
    .track-head-label--tapeair .tape-air { transform: none; }

    .track-confirm--head { margin-top: 8px; }

    /* THE BADGE LEADS THE ROW and holds a fixed width whether or not it has a
       badge in it, so the rows below it line up down the left edge. */
    .track-line-new {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      min-width: 42px;
    }


    .tape-line-name {
      min-width: 0;
      color: var(--muted);
      /* NOT `anywhere`. It broke "Akron" into "Akro" and "n" the moment the
         column got tight, which reads as a rendering fault rather than a wrap.
         A name may wrap BETWEEN its two halves and never inside a word. */
      overflow-wrap: normal;
      word-break: keep-all;
    }

    .tape-new {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 999px;

      background: var(--success, #2f855a);
      color: #fff;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      cursor: help;
      white-space: nowrap;
    }


    /* THE FILTERS ARE BUTTONS. They sit in a folder tab beside ADD and VIEW,
       whose contents are all `.btn`, so anything else in there reads as a
       different kind of control. They take `.btn` itself and add only what a
       filter needs: the count, and a pressed state. */
    .head-figure--filter {
      position: relative;
      gap: 7px;
      font-size: 0.72rem;
    }

    /* PRESSED IS THE ROOM'S OWN PRIMARY FILL, the same one Save and Add wear,
       so a filter that is on is unmistakable at a glance. `aria-pressed` is not
       available on a label, so the state is the class plus the checkbox inside
       it, which is what a screen reader reads. */
    .head-figure--filter.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* THE POPUP'S OWN DECLARATION, ON THE ONE ELEMENT THAT CONTAINS BOTH its
       header and its rows. It was on `.track-head, .track-lines`, which also
       matched the MAIN list's header -- so that header took its columns from
       here while the rows under it took theirs from `.tape-lines`, two copies
       that had to be kept identical by hand. There is now one declaration per
       list and neither header can drift from its own rows. */
    .tracks-body {
      --track-cols: 30px 48px 32px 48px minmax(0, 2fr) minmax(0, 1.1fr) minmax(0, 1.5fr) 130px 48px 48px 196px 32px;
    }

    section.tool-modal-panel#tracksCard:not([hidden]) {
      display: flex;
      flex-direction: column;
      max-height: min(88vh, 900px);
    }

    #tracksCard .panel-head,
    #tracksCard .prompt-foot { flex: 0 0 auto; }

    #tracksCard .tracks-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;

      padding: 0 2px 4px;
    }

    .track-head { box-shadow: 0 6px 10px -8px rgba(16, 24, 40, 0.35); }

    #tracksTitle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      min-width: 0;
    }

    #tracksTitle .tape-name-editor {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    #tracksTitle .city-input,
    #tracksTitle .spine-input {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .tracks-sub {
      margin: 3px 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--track-cols);
      /* THE SAME HORIZONTAL PADDING AND THE SAME COLUMN GAP AS A TRACK ROW.
         `.track-line` is `3px 9px` with an 8px gap; at 10px and a 4px gap the
         header's eleven columns started a pixel out and drifted from there. The
         VERTICAL padding is still the header's own -- it is a bar, not a row. */
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 6px;
      padding: 8px 9px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* THE LABEL'S PADDING IS THE FIELD'S PADDING. `.track-input` is `2px 6px`;
       at 7px every label sat a pixel off the value under it, which over eleven
       columns reads as the header being out of step rather than as one pixel. */
    .track-head-label {
      min-width: 0;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-head-label--mid { padding: 0; text-align: center; }


    /* A COLUMN HEADER THAT FILTERS ON ITS OWN COLUMN. It has to look like the
       labels beside it at rest -- it IS the column's label -- and say plainly
       when it is on. */
    .track-head-filter {
      min-width: 0;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      font: inherit;
      font-size: 0.5rem;
      letter-spacing: 0.04em;
      text-transform: inherit;
      color: inherit;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-head-filter:hover { border-color: var(--control-line); color: var(--ink); }

    .track-head-filter.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* LITTLE BITTY. These are the two narrowest columns on the row and they now
       hold a word rather than a letter, so the label is set below the rest of
       the header. It is not something you read, it is something you glance at
       to tell two checkboxes apart. */
    .track-head-label--tiny {
      font-size: 0.5rem;
      letter-spacing: 0.04em;
    }

    #trackAirAll { justify-self: center; }

    .track-lines { display: grid; gap: 6px; }

    /* ONE TRACK ROW, ONE SIZE. The main list and the popup draw the same row,
       so they are measured the same: trimming this for the list alone made the
       two disagree about how tall a track is.
       TRIMMED AROUND THE BLURB, NOT INSTEAD OF IT. The blurb still grows to its
       content, which is what a row's height really follows; everything around
       it is as tight as it can be without the fields becoming hard to hit. */
    .track-line {
      display: grid;
      grid-template-columns: var(--track-cols);
      gap: 2px 8px;

      align-items: center;
      padding: 3px 9px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    .track-line.is-shelved {
      border-style: dashed;
      opacity: 0.62;
    }
    .track-line.is-shelved:hover,
    .track-line.is-shelved:focus-within { opacity: 1; }

    .track-line.is-live { box-shadow: inset 3px 0 0 var(--success, #2f855a); }

    .track-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      /* NO SIZE OF ITS OWN, like every other child of a track row: the row sets
         one and this inherits it. */
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      align-self: center;
    }

    .track-play:hover {
      border-color: var(--success, #2f855a);
      color: var(--success, #2f855a);
    }

    .track-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .track-play.is-playing {
      border-color: var(--success, #2f855a);
      background: var(--success, #2f855a);
      color: #fff;
    }

    .track-line.is-focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.18);
    }

    .track-stage {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    .track-stage .queue-player {
      display: block;
      width: 100%;
      height: 80px;
      border: 0;
      border-radius: 10px;
    }

    .track-stage .queue-noplayer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      border: 1px dashed var(--control-line);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .track-input {
      width: 100%;
      min-width: 0;
      min-height: 26px;
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }

    .track-input:hover { border-color: var(--control-line); }
    .track-input:focus { border-color: var(--accent); background: #fff; outline: none; }

    .track-input--num { text-align: center; font-family: "IBM Plex Mono", monospace; }
    .track-input--id { font-family: "IBM Plex Mono", monospace; }
    .track-input--title { font-weight: 700; }

    .track-input--blurb::placeholder { color: var(--bic-red, #c23737); opacity: 0.8; }

    textarea.track-input--blurb {
      resize: vertical;
      overflow: hidden;
      line-height: 1.28;
      padding-top: 2px;
      padding-bottom: 2px;

      min-height: 30px;
    }

    textarea.track-input--blurb.is-manual,
    textarea.track-input--blurb:focus { overflow: auto; }

    .track-input--id::placeholder { color: var(--muted); opacity: 0.75; }

    .track-explicit { display: flex; align-items: center; justify-content: center; }

    .track-del {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin: 0 auto;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }

    .track-del:hover { border-color: var(--bic-red); color: var(--bic-red); background: rgba(194, 55, 55, 0.08); }
    .track-del:focus-visible { outline: 2px solid var(--bic-red); outline-offset: 1px; }

    /* IT IS A GRID OF `1fr auto 1fr` and its words are as wide as they are, so
       in a column narrower than its content it overflowed both ways -- which is
       what put SHELVED across the S column beside it. It is centred in its own
       cell and clips rather than spilling. */
    .track-air {
      transform: scale(0.86);
      transform-origin: center;
      justify-self: center;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }


    /* THE X IS OFF, NOT ABSENT, WITH NOTHING TICKED. A control that vanished
       would move the ones beside it, so the position of the one you want would
       depend on the state of the selection. It stays pressable so it can say
       why it is off -- on a touch screen there is no tooltip to hover. */
    .track-del.is-off { opacity: 0.3; cursor: help; }
    .track-del.is-off:hover { border-color: transparent; color: inherit; background: transparent; }

    .track-del.is-armed {
      border-color: var(--bic-red, #c23737);
      background: var(--bic-red, #c23737);
      color: #fff;
    }

    .track-confirm {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      padding: 8px 10px;
      border: 1px dashed var(--bic-red, #c23737);
      border-radius: 7px;
      background: rgba(194, 55, 55, 0.06);
      font-size: 0.85rem;
    }

    .track-confirm p { margin: 0; flex: 1 1 260px; min-width: 0; }
    .track-confirm strong { color: var(--bic-red, #c23737); }

    .issue-foot-note {
      flex: 1 1 100%;
      margin: 0 0 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .tape-line-name.is-empty { opacity: 0.55; font-style: italic; }

    .tape-line-name {
      display: flex;
      align-items: baseline;
      /* WRAPS NOW. With the city held on one line, a long spine phrase drops
         under it instead of squeezing the name it belongs to. */
      flex-wrap: wrap;

      gap: 0.32em;
      min-width: 0;
    }

    .city-input {

      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      font: inherit;
      font-weight: 700;
      color: inherit;
      text-decoration: underline dotted rgba(var(--bic-blue-rgb), 0.35);
      text-underline-offset: 3px;
    }

    .city-input::-webkit-calendar-picker-indicator {
      display: none !important;
    }

    .city-input:hover { border-color: var(--control-line); background: #fff; text-decoration: none; }
    .city-input:focus { border-color: var(--accent); background: #fff; outline: none; text-decoration: none; }
    .city-input.is-saving { opacity: 0.5; }

    .spine-flip {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 5px;
      background: #fff;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .spine-flip:hover { border-color: var(--accent); color: var(--ink); }
    .spine-flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .spine-flip:disabled { opacity: 0.5; cursor: progress; }

    .spine-input {
      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
      padding: 1px 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      font: inherit;
      color: inherit;

      text-decoration: underline dotted rgba(var(--bic-blue-rgb), 0.35);
      text-underline-offset: 3px;
    }

    .spine-input:hover {
      border-color: var(--control-line);
      background: #fff;
      text-decoration: none;
    }

    .spine-input:focus {
      border-color: var(--accent);
      background: #fff;
      outline: none;
      text-decoration: none;
    }

    .spine-input.is-saving { opacity: 0.5; }

    .spine-input::placeholder { color: var(--muted); opacity: 0.5; font-style: italic; }

    .bot-field { display: grid; gap: 4px; }

    .bot-field > span {
      font: 700 0.72rem/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bot-input {
      font: 500 0.98rem/1.3 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      padding: 9px 10px;
      width: 100%;
    }

    .bot-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .bot-hint {
      margin: 10px 0 0;
      font: 500 0.86rem/1.45 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
    }

    .bot-hint b { color: var(--ink); font-weight: 700; }

    /* WHAT THE TAPE HOLDS, right after its name. Sized to its content so it
       sits with the name rather than being pushed away from it. */
    .tape-line-counts {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
      font: 500 0.74rem/1.2 "IBM Plex Mono", monospace;
      color: var(--muted);
    }

    .tape-line-figure { font-weight: 700; color: var(--muted); }

    /* THE LIVE FIGURE IS THE ONE YOU ACT ON, so it is the only one in ink, and
       a live count of zero is not good news and does not wear the green. */
    .tape-line-figure.is-live { color: var(--success); }
    .tape-line-figure.is-none { color: var(--muted); }
    .tape-line-figure-word { opacity: 0.75; }
    .tape-line-figure-sep { opacity: 0.5; }

    .tape-line-counts strong { color: var(--ink); font-weight: 700; }


    /* THE TRACK ROW ON THE MAIN LIST. It is the popup's row; its columns come
       from `.tape-lines`, the same declaration the header above it reads. */
    .track-line--in-list {
      margin-left: 22px;
      margin-bottom: 2px;
      border-color: var(--cut-panel-line);
    }

    /* `overflow: hidden` IS WHAT KEEPS THE CELL IN ITS COLUMN. The tape's name
       and its country line are both wider than this column at the row's size,
       and without it they ran straight across the artist beside them. */
    .track-titlecell {
      display: grid;
      gap: 0;
      min-width: 0;
      overflow: hidden;
      align-content: center;
    }

    /* TINY, AND QUIET. It is context for the line below it, not a heading: at
       any weight it would compete with the title it sits over. */
    .track-tapetag {
      /* TINY. 0.5rem is 8px at a default root, which is below anything else in
         this project: the Socializer's own floor is 0.72rem. It is legible here
         because it is UPPERCASE MONO at weight 700, it is one short line, and
         it is not something you read, it is something you glance at to place a
         row you are already looking at. */
      /* NO SIZE OF ITS OWN. It was 0.5rem, set when this was a glance-at tag
         rather than the tape's name editor; it takes the row's size now. */
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ONE SIZE FOR EVERY WORD ON A TRACK ROW. The row had collected five type
       sizes -- the fields, the position, the tape tag at 0.5rem, the status
       words, the delete -- each set for its own reasons and none of them for
       the row. `--track-text` is the one knob; change it here and the whole row
       follows, in the popup and on the main list alike.
       THE UNIVERSAL SELECTOR IS THE POINT: several children set their own size,
       so anything narrower leaves one of them behind and the row goes back to
       being two sizes. */
    /* ONE SIZE, SET ONCE AND INHERITED. It was `.track-line *`, a blanket rule
       reaching past every child that had an opinion -- which meant it had to
       out-specify each of them, and it lost one tie to `.tape-air-word` and left
       two words behind. The row declares the size and the children simply do not
       declare one, which cannot lose a tie because there is nothing to tie with.
       BIG BY DEFAULT, SMALLER WHEN THE CONTENT NEEDS IT. `shrinkToFit` steps a
       field down until it fits its column, so a long title is readable at 14pt
       and a very long one is readable at 11 rather than clipped at 14. */
    .track-line { --track-text: 14pt; font-size: var(--track-text); }

    /* WHERE THE TAPE IS, ABOVE ITS NAME. Quiet, because it is the same address
       on every row of the tape and you read it once. */
    .track-tapegeo {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.75;
    }

    /* NOT IN THE POPUP, for the reason the tape tag is not: there the tape's
       name is the dialog's own title and this would be the same thing said
       twice a few pixels apart. */
    .track-lines .track-tapegeo { display: none; }

    /* THE TAG IS THE NAME EDITOR NOW, so it is a flex row rather than a line of
       text -- and everything inside it inherits the tag's own tiny mono rather
       than the input default, or a track row doubles in height. */
    .track-tapetag {
      display: flex;
      align-items: center;
      gap: 0.3em;
      min-width: 0;
      overflow: hidden;
    }

    .track-tapetag .city-input,
    .track-tapetag .spine-input,
    .track-tapetag .spine-flip {
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      min-height: 0;
      height: auto;
      padding: 0 2px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: inherit;
    }

    /* THE BORDER ONLY APPEARS WHEN YOU REACH FOR IT. Thirty outlined boxes over
       thirty titles is a form, not a list. */
    .track-tapetag .city-input:hover,
    .track-tapetag .spine-input:hover,
    .track-tapetag .city-input:focus,
    .track-tapetag .spine-input:focus {
      border-color: var(--control-line);
      background: #fff;
      outline: none;
    }

    .track-tapetag .spine-flip { cursor: pointer; opacity: 0.5; }
    .track-tapetag .spine-flip:hover { opacity: 1; color: var(--accent); }

    /* NOT IN THE POPUP. There the tape's name is the dialog's own title, so
       this would be the same thing said twice a few pixels apart. */
    .track-lines .track-tapetag { display: none; }

    /* THE TWO STEP BUTTONS ARE THE ROW'S END CAPS. Square, so they read as
       one control each rather than as two more labelled things to consider. */
    /* THE PAIR TOUCHES. Two buttons doing one job, so they read as one
       control with two ends rather than as two separate things. */
    .tape-step {
      flex: 0 0 auto;
      min-width: 26px;
      padding: 0 7px;
      font-size: 0.95rem;
      line-height: 1;
    }

    /* The gap between the pair is the row's gap otherwise, which reads as two
       controls. -6px pulls them together without a wrapper element. */
    .tape-step + .tape-step { margin-left: -6px; }

    /* IT WEARS `.btn` AND HAS TO UNDO WHAT A `select` BRINGS. A native control
       carries its own font and its own chrome, so without these it reads as a
       different kind of thing from the buttons either side of it.
       CAPPED, BECAUSE THE BAR DOES NOT WRAP. A country name is as long as it is
       and the widest option must not be able to push the doors off the end. */
    .tape-filter {
      flex: 0 1 auto;
      max-width: 30ch;
      padding: 0 26px 0 10px;
      font: inherit;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      appearance: none;
      -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                        linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    /* THE OPEN LIST IS DRAWN BY THE BROWSER and inherits none of the above, so
       its own type is set here or the options come back at the page default. */
    .tape-filter option {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: normal;
      text-transform: none;
    }

    /* A CHOSEN FILTER IS A STATE, so it says so the way every pressed control in
       this room says so. */
    .tape-filter:not([data-all]) { border-color: var(--accent); color: var(--accent); }

    /* THE ROOM'S SORT AND FILTER BAR. It was a grid pretending to be a column
       header; with one tape on screen there is nothing up here to align to. */
    /* THE CATALOGUE, UNDER THE ROOM'S NAME. Small mono, one line, the two
       live figures in ink and everything else muted: it is a standing figure,
       read at a glance and not news.
       COUNTED OVER EVERYTHING, never over what the filters have left. */
    .room-stats {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0 6px;
      margin: 3px 0 0;
      font: 500 0.72rem/1.4 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* THE TAPE'S OWN LINE, quieter than the catalogue's above it: the same kind
       of figure at a narrower scope, and it must not compete with the room's. */
    .room-stats--tape { opacity: 0.9; }
    .room-stats--tape .tape-line-counts {
      font: inherit;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .room-stats-count { font-weight: 700; }
    .room-stats-count.is-live { color: var(--ink); }
    .room-stats-sep { opacity: 0.7; }

    /* THE TRACK HEADER ON THE MAIN LIST. It takes its columns from `.tape-lines`
       above it, like the rows do, so the two cannot drift. */
    .track-head--main {
      margin-left: 22px;
      margin-bottom: 4px;
    }

    .tape-air {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;

      justify-self: end;
    }

    .tape-air { position: relative; }

    .tape-air-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .tape-air-track {
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 19px;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.1);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .tape-air-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 120ms ease, background 120ms ease;
    }

    .tape-air-input:checked + .tape-air-track {
      border-color: var(--success);
      background: var(--success);
    }

    .tape-air-input:checked + .tape-air-track::after {
      background: #fff;
      transform: translateX(15px);
    }

    .tape-air-input:focus-visible + .tape-air-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tape-air-input:disabled + .tape-air-track { opacity: 0.5; cursor: progress; }

    .tape-air-input:indeterminate + .tape-air-track {
      border-color: var(--control-line);
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .tape-air-input:indeterminate + .tape-air-track::after {
      background: var(--muted);
      transform: translateX(7.5px);
    }

    .tape-air--all .tape-air-word { font-weight: 700; }

    .tape-air-word--off { text-align: right; }
    .tape-air-word--on { text-align: left; }

    .tape-air-word { opacity: 0.38; font-weight: 500; }
    .tape-air-word.is-current { opacity: 1; font-weight: 700; }
    .tape-air-word--on.is-current { color: var(--success); }
    .tape-air-word--off.is-current { color: var(--ink); }

    .tape-air-word {
      /* ONE WORD EACH, SO THEY CANNOT WRAP; what they do instead is shrink,
         through the row's own fit pass. Without `nowrap` a narrow cell would
         break SHELVED across two lines and double the row's height. */
      white-space: nowrap;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }


    .app { max-width: 1180px; margin: 0 auto; padding: 16px; }
    .bar-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
    .command-bar { flex: 1 1 240px; margin: 0; padding: 8px; }
    .command-bar-inner { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ONE LINE EACH, AND VIEW IS THE ONE THAT HOLDS ITS WIDTH. It is the bar you
       aim at -- the tape nav and the four doors out of the room -- so it is
       sized to its contents and never wraps. ADD gives way instead: its two
       buttons narrow rather than dropping onto a second line, which would push
       the whole room down by a row. */
    .bar-row { flex-wrap: nowrap; }
    .bar-row .command-bar-inner { flex-wrap: nowrap; }
    .bar-row .command-bar--view { flex: 0 0 auto; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    .bar-row .command-bar:first-child .command-bar-inner { min-width: 0; }
    .bar-row .command-bar:first-child .btn {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    /* THE PHONE IS THE ESCAPE HATCH. Two bars on one line is not something
       390px can hold, so there they stack and wrap as they did. */
    @media (max-width: 720px) {

      .bar-row .command-bar-inner { flex-wrap: wrap; }
      .bar-row .command-bar--view { flex: 1 1 100%; }
    }
    .queue-tab.is-active { font-weight: 700; }
    .queue-tab-count { margin-left: 4px; }
    .key-legend { display: flex; gap: 10px; }

    .tape-group { margin: 0 0 24px; }

    .track-row { padding: 8px 0; }

    .queue-player { width: 100%; height: 80px; border: 0; }
    .queue-noplayer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .queue-noplayer-how { flex-basis: 100%; font-size: 0.78rem; color: var(--muted); }

    .prompt-layout {
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto;
    }

    .prompt-panel {
      min-width: 0;
      border: 1px solid var(--line);

      left: 50%;

  <script>
    (function () {
      'use strict';

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var trackArchiveStatus = document.getElementById('trackArchiveStatus');
      var trackArchiveList = document.getElementById('trackArchiveList');
      var archiveExpandBtn = document.getElementById('archiveExpandBtn');
      var trackStatusTabs = document.getElementById('trackStatusTabs');

      var trackStatusFilter = '';
      var keyLegend = document.getElementById('keyLegend');
      var citySearch = document.getElementById('citySearch');

      var citySearchTerm = '';


      // THE SHELVED / LIVE SWITCH IN A HEADER IS A FILTER, NOT A STATUS
      // CHANGER. It used to rewrite every row it summarised, which is the most
      // destructive act in the room sitting in the quietest control, one press
      // from a confirm nobody reads. It reads as a filter, it sits in a header
      // beside two other filters, and it is one now.
      //
      // 'all' is the NEUTRAL middle and is what the knob rests on. Per-row
      // switches are untouched: those are the status changers.
      // ONE TAPE AT A TIME. A position into the FILTERED, SORTED list rather
      // than a tape id, so if the list ever changes under it you land on
      // whatever moved into that place instead of on nothing.
      var tapeAt = 0;

      var trackAirFilter = 'all';     // the tracks inside an open tape

      var pageNotice = document.getElementById('pageNotice');
      var soundtrackIssues = [];

      var soundtrackArchiveData = null;
      var expandedTapes = Object.create(null);

      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) {
        return SUPABASE_CONFIG.url + '/rest/v1/' + path;
      }

      async function fetchAllRows(path, useAuth) {
        var PAGE = 1000;
        var all = [];
        var headersFor = useAuth ? authHeaders : anonHeaders;
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: headersFor({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function patchRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'PATCH',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;

        if (!row) throw new Error('Nothing was updated — sign in again and retry.');
        return row;
      }

      async function runTally(sinceIso) {
        try {
          var res = await fetch(
            restUrl('soundtrack?select=city_slug&created_at=gte.' + encodeURIComponent(sinceIso)),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) return '';
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return '';
          var byCity = Object.create(null);
          rows.forEach(function (r) {
            var slug = text(r && r.city_slug);
            if (!slug) return;
            byCity[slug] = (byCity[slug] || 0) + 1;
          });
          return Object.keys(byCity)
            .sort(function (a, b) {
              return byCity[b] - byCity[a] || soundCityLabel(a).localeCompare(soundCityLabel(b));
            })
            .map(function (slug) {
              return soundCityLabel(slug) + ' ' + byCity[slug]
                + ' track' + (byCity[slug] === 1 ? '' : 's');
            })
            .join(', ');
        } catch (error) {
          return '';
        }
      }

      async function deleteRow(path) {
        var res = await fetch(restUrl(path), { method: 'DELETE', headers: authHeaders({}) });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Delete failed: ' + res.status + ' ' + detail);
        }
        return true;
      }

      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          loadSoundtrackArchive().catch(function (error) {
            console.error(error);
            setNotice((error && error.message) || 'could not load the tapes', 'error');
          });
        },
        onSignedOut: function () {
          resetSoundtrackArchive();
        }
      });

      if (archiveExpandBtn) archiveExpandBtn.addEventListener('click', function () {
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        if (!groups.length) return;
        var allOpen = Array.prototype.every.call(groups, function (g) { return g.open; });
        var next = !allOpen;

        Array.prototype.forEach.call(groups, function (g) {
          g.open = next;
          if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = next;
        });
        syncArchiveExpandBtn();
      });

      function tabsOf(strip) {
        return strip ? Array.prototype.slice.call(strip.querySelectorAll('.queue-tab')) : [];
      }

      function selectTab(strip, value) {
        tabsOf(strip).forEach(function (tab) {
          var on = (tab.dataset.tab || '') === value;
          tab.classList.toggle('is-active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }

      function setTabCounts(strip, counts) {
        tabsOf(strip).forEach(function (tab) {
          var key = tab.dataset.tab || '';
          var n = Number(counts[key] || 0);
          var el = tab.querySelector('.queue-tab-count');
          if (el) el.textContent = String(n);
          tab.classList.toggle('is-empty', n === 0);
          tab.classList.toggle('has-work', n > 0);
        });
      }

      function bindTabs(strip, onPick) {
        if (!strip) return;
        strip.addEventListener('click', function (event) {
          var tab = event.target.closest ? event.target.closest('.queue-tab') : null;
          if (!tab || !strip.contains(tab)) return;
          onPick(tab.dataset.tab || '');
        });
      }

      paintKeyLegend();

      bindTabs(trackStatusTabs, function (value) {
        if (value === trackStatusFilter) return;
        trackStatusFilter = value;
        selectTab(trackStatusTabs, trackStatusFilter);

        if (trackStatusFilter) {
          Object.keys(expandedTapes).forEach(function (k) { delete expandedTapes[k]; });
          renderTrackArchive();
          var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
          Array.prototype.forEach.call(groups, function (g) {

      function syncArchiveExpandBtn() {

        archiveExpandBtn.disabled = !groups.length;
        var allOpen = groups.length > 0 && Array.prototype.every.call(groups, function (g) { return g.open; });

        archiveExpandBtn.title = allOpen ? 'Close every tape' : 'Open every tape';
      }
      function text(value) {
        return String(value == null ? '' : value).trim();
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();
        return !!v && ['false', 'f', 'no', 'n', '0'].indexOf(v) === -1;
      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);
      }

        return isArchivedSong(song) ? 'SHELVED' : 'LIVE';
      }

      var STATUS_VERB = { LIVE: 'Live', SHELVED: 'Shelve' };

      function resetSoundtrackArchive() {

      var ISSUE_KIND_LABEL = {
        spotify: 'Spotify ID',
        spelling: 'Spelling',
        relevance: 'Relevance',
        facts: 'Facts'
      };

      // A SLUG FROM A TYPED LABEL. With no catalogue to look one up in, a city
      // this room has never held has to be derived, and the rule is the one
      // `public.cities` itself uses: the city NAME only, lowercased, hyphenated.
      // "St. Louis, Missouri" gives `st-louis`, which is the slug already filed.
      function slugFromLabel(label) {
        var name = text(label).split(',')[0];
        return name.toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function cityByLabel(label) {
        var want = text(label).toLowerCase();
        if (!want) return null;
        var hit = null;
        Object.keys(cityMap).forEach(function (slug) {
          if (hit) return;
          var row = cityMap[slug];
          var canonical = text(row.city).toLowerCase();
          if (canonical === want || canonical.split(',')[0].trim() === want) hit = row;
        });
        return hit;
      }

      function paintCityOptions() {
        var list = document.getElementById('cityOptions');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(cityMap).sort().forEach(function (slug) {
          var row = cityMap[slug];
          // NO `hide_from_soundtracks` TEST ANY MORE. That flag lives on
          // public.cities, which this room no longer reads, and every city in
          // this map already holds a tape -- so a venue town could only appear
          // here by already having one.

          var opt = document.createElement('option');
          opt.value = text(row.city);

          var held = soundtracks().filter(function (t) { return text(t.city_slug) === slug; }).length;
          if (held) opt.label = text(row.city) + '  (' + held + (held === 1 ? ' tape' : ' tapes') + ' already)';
          list.appendChild(opt);
        });
      }

      async function moveTapeToCity(tapeId, toSlug, label) {
        var tape = tapeById(tapeId);
        if (!tape) return false;
        var fromSlug = text(tape.city_slug);
        try {

          // A TAPE IS EVERY ROW OF IT NOW, so moving one is a write across all
          // of them and goes through the function that scopes it.
          // THE LABEL TRAVELS WITH THE SLUG. `city` lives on the row now, so a
          // move that sent only the slug would leave every row wearing the old
          // city's name, which is the half a human actually reads.
          var to = (label && label.city) ? label : cityMap[toSlug];
          await callRpc('tgb_rename_tape', {
            p_city: fromSlug, p_tape: tape.spine_tag || '',
            p_new_city: toSlug, p_new_tape: null,
            p_new_label: to && to.city ? to.city : toSlug,
            p_state_code: to ? (to.state_code || null) : null,
            p_state_name: to ? (to.state_name || null) : null,
            p_country_code: to ? (to.country_code || null) : null,
            p_country_name: to ? (to.country_name || null) : null
          });
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(fromSlug)), 'error');
          return false;
        }
        tape.city_slug = toSlug;
        (tape.songs || []).forEach(function (song) { song.city_slug = toSlug; });
        paintCityOptions();
        renderTrackArchive('moved the tape from ' + cityFullLabel(fromSlug)
          + ' to ' + cityFullLabel(toSlug), 'success');
        return true;
      }

      function locateSong(id) {
        if (id == null) return null;
        var hit = null;
        soundtracks().forEach(function (tape, tapeIndex) {
          (tape.songs || []).forEach(function (song, songIndex) {
            if (song && String(song.id) === String(id)) hit = { tapeIndex: tapeIndex, songIndex: songIndex };
          });
        });
        return hit;
      }

      async function loadSoundtrackArchive() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) {
          resetSoundtrackArchive();
          return;
        }
        setArchiveStatus('Loading tapes and tracks…', '');
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Loading tracks...'));
        }
        try {
          soundtrackArchiveData = await fetchSoundtrackTables();

          paintCityOptions();
          renderTrackArchive();

          openTracksFromHash();
        } catch (error) {
          console.error(error);
          soundtrackArchiveData = null;
          setArchiveStatus('Nothing loaded.', '');
          // THE FETCH AND THE RENDER ARE BOTH INSIDE THIS TRY, so a bug in the
          // drawing surfaced as "the database did not load", which sends the
          // next person to check Supabase about a fault in this file. The
          // message says which it was.
          var wasFetch = /Supabase \d|Failed to fetch|NetworkError/i.test((error && error.message) || '');
          setNotice(wasFetch ? 'could not read the tapes' : 'the tapes loaded but the page could not draw them, see the console',
            'error');
          if (trackArchiveList) {
            trackArchiveList.innerHTML = '';
            trackArchiveList.appendChild(emptyNode(wasFetch
              ? 'public.soundtrack did not load. Check the Supabase project.'
              : 'The tapes loaded and the page could not draw them. The console has the error.'));
          }
          throw error;
        }
      }

      // ── Findings, folded onto their row (2026-08-25) ────────────────────
      //
      // `soundtrack_issues` is retired in place: nothing reads it any more. A
      // finding lives in the `findings` jsonb array of the row it is about,
      // which is a track when it names one and the TAPE otherwise -- 66 of the
      // 285 name no track, being statements about the list itself.
      //
      // AN ARRAY AND NOT COLUMNS, because a row can carry more than one: three
      // tracks hold three findings each today, and the four kinds are
      // independent.
      // ONE LIST OF TRACKS IN, THE FLAT ARRAY THIS PAGE HAS ALWAYS HELD OUT.
      // A finding carrying "scope":"tape" is about the LIST rather than the
      // track it happens to be stored on, so it comes back with song_id null,
      // which is exactly what the old tape-level rows looked like. Everything
      // NOTHING IN THIS ROOM DRAWS A FINDING ANY MORE (2026-08-26): the issues
      // UI was removed and is going on a page of its own. This is kept because
      // the data is still read on every load and the future page will want the
      // same flat shape; it costs one pass over rows already in memory.
      function collectFindings(trackRows) {
        var out = [];
        (Array.isArray(trackRows) ? trackRows : []).forEach(function (row) {
          if (!Array.isArray(row.findings)) return;
          row.findings.forEach(function (f) {
            if (!f || f.status !== 'open') return;
            var onTape = f.scope === 'tape';
            out.push({
              id: f.id,
              kind: f.kind,
              severity: f.severity,
              detail: f.detail,
              suggestion: f.suggestion,
              status: f.status,
              fingerprint: f.fingerprint,
              created_at: f.created_at,
              resolved_at: f.resolved_at,
              scope: f.scope || 'track',
              // The row it is STORED on, which the writer needs and which is not
              // the same as the row it is ABOUT when scope is tape.
              stored_on: row.id,
              song_id: onTape ? null : row.id,
              tape_id: tapeKey(row.city_slug, row.tape),
              city_slug: row.city_slug
            });
          });
        });
        out.sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
        return out;
      }

      // THE TAPE HAS NO id ANY MORE. It is (city_slug, tape), and this is the
      // string the page uses wherever it used to hold a tape id -- as a map key
      // and as a row's tape_id.
      function tapeKey(citySlug, tapeName) {
        return JSON.stringify([String(citySlug || ''), String(tapeName || '')]);
      }
      // A TAPE-WIDE WRITE GOES THROUGH A FUNCTION, never a PATCH. With one
      // table a tape IS every row of it, so a filter somebody forgets to scope
      // rewrites the whole city -- and the shelve cascade has to stay in the
      // database anyway, or psql and the table editor lose the tombstone rule.
      async function callRpc(name, args) {
        var res = await fetch(restUrl('rpc/' + name), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', Accept: 'application/json' }),
          body: JSON.stringify(args || {})
        });
        if (!res.ok) throw new Error(await res.text() || ('rpc ' + name + ' failed'));
        return res.json().catch(function () { return null; });
      }

      // `tapePath` went with the tape delete on 2026-08-26. It built a filter
      // matching EVERY ROW OF A TAPE, which is precisely the scope nothing in
      // this room writes to any more: the X acts on ticked ids and the bulk bar
      // acts on ticked ids. **Do not bring it back for convenience** -- a
      // tape-wide filter somebody forgets to scope rewrites a whole city.


      // WRITING ONE BACK IS A READ, AN EDIT AND A PATCH OF THE WHOLE ARRAY.
      // Postgres has no way to update one element of a jsonb array by predicate
      // from PostgREST, so the row is read, the matching element's status is
      // changed, and the array goes back whole. **The read is what makes this
      // safe against a stale page**: the array that goes back is the one the
      // database holds now, with one element changed, not the one this page
      // loaded some minutes ago.
      async function fetchSoundtrackTables() {
        var results = await Promise.all([
          // ONE TABLE, ONE READ. public.soundtrack is one row per TRACK; the
          // TAPE is (city_slug, tape) and is grouped out below. There is no
          // tapes table, no tape id and no findings table any more.
          // `true` IS useAuth AND IT IS LOAD-BEARING. `findings` is revoked from
          // `anon` by per-column grant, and PostgREST expands `*` to columns the
          // caller cannot read, so this exact request answers **401 / 42501**
          // without a session. The room is admin-gated and needs the findings,
          // so it reads as the signed-in admin rather than naming its columns.
          fetchAllRows('soundtrack?select=*&order=city_slug.asc,tape.asc,position.asc,id.asc', true),
          Promise.resolve([]),
          Promise.resolve([])
        ]);
        // Read but not drawn: see collectFindings.
        soundtrackIssues = collectFindings(results[0]);
        rebuildCityMap(results[0]);

        // THE TAPES ARE GROUPED OUT OF THE TRACKS, in the SAME SHAPE this page
        // has always held one, so everything downstream is untouched. The only
        // real difference is that a tape has no `id`: `tape.key` is
        // (city_slug, tape).
        //
        // A TAPE IS SHELVED WHEN EVERY TRACK ON IT IS. There is no tape row to
        // carry the flag any more, and that is what it always meant.
        var byTape = {};
        var tapes = [];
        results[0].forEach(function (row) {
          var key = tapeKey(row.city_slug, row.tape);
          var tape = byTape[key];
          if (!tape) {
            tape = {
              key: key,
              id: key,                       // legacy readers key on tape.id
              city_slug: row.city_slug,
              spine_tag: row.tape || '',
              created_at: row.created_at || '',
              archived: true,                // narrowed by the first live track
              songs: []
            };
            if (row.tape_label_position) tape.spine_tag_position = row.tape_label_position;
            if (row.last_audit_at) tape.last_audit_at = row.last_audit_at;
            byTape[key] = tape;
            tapes.push(tape);
          }
          if (row.created_at && row.created_at < tape.created_at) tape.created_at = row.created_at;

          var song = {
            id: row.id,
            position: Number(row.position) || 0,
            created_at: row.created_at || '',
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || ''
          };
          if (row.spotify_id) song.spotifyId = row.spotify_id;
          if (row.explicit) song.explicit = true;
          if (row.sports) song.sports = true;
          if (row.archived) song.archived = true; else tape.archived = false;
          if (row.archived_with_tape) song.archivedWithTape = true;

          tape.songs.push(song);
        });
        return { soundtracks: tapes };
      }

      function soundtracks() {
        return Array.isArray(soundtrackArchiveData && soundtrackArchiveData.soundtracks)
          ? soundtrackArchiveData.soundtracks
          : [];
      }

      function songHasContent(song) {
        return !!(song && (text(song.spotifyId) || text(song.title) || text(song.artist) || text(song.href)));
      }

      function allSongs(tape) {
        return ((tape && Array.isArray(tape.songs)) ? tape.songs : []).filter(songHasContent);
      }

      function songDate(song) {
        var raw = song && song.created_at;
        if (!raw) return null;
        var date = new Date(raw);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function songDisplay(song) {
        return [text(song && song.title) || '(untitled song)', text(song && song.artist) || '(unknown artist)'].join(' - ');
      }

      function trackCityLabel(tape) {
        return soundCityLabel(tape && tape.city_slug);
      }

      function tapeCounts(tape) {
        var counts = { active: 0, archived: 0, LIVE: 0, SHELVED: 0 };
        allSongs(tape).forEach(function (song) {
          if (isArchivedSong(song)) counts.archived += 1;
          else counts.active += 1;
          counts[songStatus(song)] += 1;
        });
        return counts;
      }

      var focusSongId = null;

      function focusedAt() {
        if (focusSongId == null) return null;
        return locateSong(focusSongId);
      }

      function visibleSongIds() {
        if (!trackArchiveList) return [];
        return Array.prototype.map.call(
          trackArchiveList.querySelectorAll('.track-row[data-song-id]'),
          function (el) { return el.dataset.songId; });
      }

      function focusSong(id, scroll) {
        focusSongId = id == null ? null : id;
        renderTrackArchive();
        if (!scroll) return;
        var el = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }

      function focusStep(delta) {
        var ids = visibleSongIds();
        if (!ids.length) return;
        var at = focusSongId == null ? -1 : ids.indexOf(String(focusSongId));
        if (at === -1) { focusSong(ids[0], true); return; }
        var next = ids[(at + delta + ids.length) % ids.length];
        focusSong(next, true);
      }

      function spotifyIdFrom(value) {
        var raw = text(value);
        if (!raw) return '';
        var base22 = /^[A-Za-z0-9]{22}$/;
        if (base22.test(raw)) return raw;
        var m = raw.match(/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/);
        if (m) return m[1];
        return '';
      }

      function trackPlayer(song) {
        var id = text(song && song.spotify_id) || text(song && song.spotifyId);
        if (id) {
          var frame = document.createElement('iframe');
          frame.className = 'queue-player';
          frame.src = 'https://open.spotify.com/embed/track/' + encodeURIComponent(id) + '?utm_source=generator';
          frame.setAttribute('loading', 'lazy');
          frame.setAttribute('allow', 'clipboard-write; encrypted-media; fullscreen; picture-in-picture');
          frame.setAttribute('title', 'Spotify player: ' + songDisplay(song));
          return frame;
        }
        var box = document.createElement('div');
        box.className = 'queue-noplayer';
        var words = document.createElement('span');
        words.textContent = 'No Spotify ID on this track, so there is nothing to play here.';
        box.appendChild(words);
        box.appendChild(actionLink(
          'https://open.spotify.com/search/' + encodeURIComponent([text(song.title), text(song.artist)].join(' ')),
          'Search Spotify', true));
        var how = document.createElement('span');
        how.className = 'queue-noplayer-how';
        how.textContent = 'Find it, press Share, then paste the link into the Spotify box on the row.';
        box.appendChild(how);
        return box;
      }

      function trackKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var el = event.target;
        var tag = el && el.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

        if (!soundtrackArchiveData) return;
        var key = event.key.toLowerCase();
        if (key === 'arrowdown') { event.preventDefault(); focusStep(1); return; }
        if (key === 'arrowup') { event.preventDefault(); focusStep(-1); return; }
        var at = focusedAt();
        if (!at) return;

        if (key === 'l' || key === 'k') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'LIVE'); return; }
        if (key === 's') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'SHELVED'); return; }
        if (key === 'n') { event.preventDefault(); focusStep(1); return; }
        if (key === 'e') {
          event.preventDefault();
          var row = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
          var btn = row && row.querySelector('.track-edit-btn');
          if (btn) btn.click();
        }
      }

      function paintKeyLegend() {
        if (!keyLegend) return;
        keyLegend.innerHTML = '';
        var lead = document.createElement('span');
        lead.className = 'key-legend-lead';
        lead.textContent = 'Keys';
        keyLegend.appendChild(lead);
        [['L', 'live'], ['S', 'shelve'], ['E', 'edit'], ['N', 'next']].forEach(function (pair) {
          var span = document.createElement('span');
          span.className = 'key-legend-pair';
          var kbd = document.createElement('kbd');
          kbd.textContent = pair[0];

          span.append(kbd, document.createTextNode(' ' + pair[1]));
          keyLegend.appendChild(span);
        });
        keyLegend.title = 'Keyboard shortcuts for the track you have selected: L puts it live, S shelves it, E opens its editor, N moves to the next one. Arrow keys move up and down. K still works as an alias for L.';
      }

      var refocusing = false;

      // IT READS THE LIST IT IS GIVEN rather than recomputing one, so it can
      // never disagree with what is on screen about how many there are or which
      // one this is.
      // WHICH TAPES THE ARROWS STEP THROUGH.
      //
      // ONE LINE PER PLACE, AND A PLACE IS A CITY: "New Orleans, Louisiana,
      // United States". A state or a country on its own is not offered. It was,
      // for one pass, and it made the list two things at once -- a place to look
      // a city up and a set of broad buckets -- with no heading to say which a
      // line was, since the headings had already been taken out for being a
      // heading you had to read before a name meant anything.
      //
      // THE VALUE IS THE LABEL. A city name alone is not unique -- this
      // catalogue holds two Portlands and two Alexandrias -- so matching on it
      // would quietly select both. The whole place is unique by construction,
      // and it is already the text on screen.
      var tapeFilter = '';
      var tapeFilterSig = '';

      // An empty part is dropped rather than left as an empty segment: most of
      // the world has no state.
      function tapePlaceLabel(tape) {
        var slug = text(tape && tape.city_slug);
        return [soundCityLabel(slug), cityStateLabel(slug), cityCountryLabel(slug)]
          .map(text).filter(Boolean).join(', ');
      }

      function tapeMatchesFilter(tape) {
        if (!tapeFilter) return true;
        return tapePlaceLabel(tape) === tapeFilter;
      }

      // THE OPTIONS ARE BUILT FROM THE CATALOGUE, so the list can only offer a
      // choice that has tapes behind it. An empty result is therefore not a
      // state this control can produce.
      function paintTapeFilter() {
        var sel = document.getElementById('tapeFilter');
        if (!sel) return;

        var counts = {};
        soundtracks().forEach(function (tape) {
          var label = tapePlaceLabel(tape);
          if (label) counts[label] = (counts[label] || 0) + 1;
        });

        var rows = Object.keys(counts).sort(function (a, b) {
          return a.localeCompare(b);
        }).map(function (label) {
          return { label: label, n: counts[label] };
        });

        var sig = JSON.stringify(rows);
        // REBUILT ONLY WHEN THE CATALOGUE CHANGES. Rebuilding on every render
        // would close the list under the pointer while somebody is reading it.
        if (sig === tapeFilterSig) { sel.value = tapeFilter; markAll(sel); return; }
        tapeFilterSig = sig;

        sel.textContent = '';
        var all = document.createElement('option');
        all.value = '';
        all.textContent = 'ALL TAPES';
        sel.appendChild(all);

        rows.forEach(function (row) {
          var opt = document.createElement('option');
          opt.value = row.label;
          // A COUNT ONLY PAST ONE TAPE. "(1)" beside a line that already names
          // one place is a number that never tells anybody anything; a city with
          // two tapes is the case worth marking, and this catalogue has some.
          opt.textContent = row.n > 1 ? (row.label + '  (' + row.n + ')') : row.label;
          sel.appendChild(opt);
        });

        // A FILTER WHOSE VALUE HAS GONE takes the list back to everything rather
        // than sitting on a choice the catalogue no longer holds.
        var found = Array.prototype.some.call(sel.options, function (o) {
          return o.value === tapeFilter;
        });
        if (!found) tapeFilter = '';
        sel.value = tapeFilter;
        markAll(sel);
      }

      // `data-all` IS THE RESTING STATE, and the CSS colours its absence. An
      // attribute rather than a class because there is exactly one of these and
      // the question it answers is binary.
      function markAll(sel) {
        if (tapeFilter) sel.removeAttribute('data-all');
        else sel.setAttribute('data-all', '');
      }

      function paintTapeNav(tapes) {
        var prev = document.getElementById('tapePrev');
        var next = document.getElementById('tapeNext');
        var where = document.getElementById('tapeWhere');
        if (!prev || !next || !where) return;
        var n = tapes.length;
        if (!n) {
          where.textContent = 'no tapes';
          prev.disabled = true;
          next.disabled = true;
          return;
        }
        where.textContent = (tapeAt + 1) + ' of ' + n;
        prev.disabled = tapeAt <= 0;
        next.disabled = tapeAt >= n - 1;
        prev.title = prev.disabled ? 'This is the first tape.' : 'Back to ' + tapeFullName(tapes[tapeAt - 1]);
        next.title = next.disabled ? 'This is the last tape.' : 'On to ' + tapeFullName(tapes[tapeAt + 1]);
      }

      // THE TAPE'S OWN READING, under the catalogue's. Both are standing
      // figures about what you are looking at, which is what this part of the
      // head is for; the difference is scope, and the label says which.
      function paintTapeStats(tape, counts) {
        var line = document.getElementById('tapeStats');
        if (!line) return;
        line.textContent = '';
        if (!tape) return;
        var word = document.createElement('span');
        word.className = 'room-stats-word';
        word.textContent = 'this tape';
        line.appendChild(word);
        // NO GEOGRAPHY HERE ANY MORE. Every track row carries the tape's own
        // country / state / city above its name, so this line said the same
        // thing a second time a few pixels away. What it still answers is the
        // one question the rows cannot: how much of the tape is live.
        if (counts) line.appendChild(counts);
      }

      function stepTape(by) {
        tapeAt += by;
        renderTrackArchive();

      function renderTrackArchive(message, tone) {
        if (!trackArchiveList) return;
        trackArchiveList.innerHTML = '';

        if (!soundtrackArchiveData) {
          trackArchiveList.appendChild(emptyNode('Sign in to see the tapes.'));
          return;
        }

        function byLabel(x, y, dir) {
          if (!x && !y) return 0;
          if (!x) return 1;
          if (!y) return -1;

          return x.localeCompare(y) * (dir || 1);
        }
        var tapes = soundtracks().slice();


        // ONE ORDER: by city, A to Z. The three sort buttons are gone, and
        // with one tape on screen a sort was choosing the order you PAGE
        // through rather than the order you read, which is not what a column
        // header looks like it does. Alphabetical is the order you can predict
        // and the one you can find a city in.
        tapes = tapes.sort(function (a, b) {
          var sa = text(a && a.city_slug), sb = text(b && b.city_slug);
          return byLabel(soundCityLabel(sa), soundCityLabel(sb), 1) || byLabel(sa, sb, 1);
        });

        paintTapeFilter();
        // NARROWED AFTER THE SORT, so the order inside a filter is the order the
        // whole catalogue has: city, A to Z.
        tapes = tapes.filter(tapeMatchesFilter);

            'No tapes yet.'));
