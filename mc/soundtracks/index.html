<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TAPE ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/soundtracks/soundtracks.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --mc-shell-width: 1180px;

      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      white-space: nowrap;
    }

    .btn:hover,
    .btn:focus-visible {
      background: rgba(var(--bic-blue-rgb), 0.05);
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      outline: none;
    }

    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.42);
      background: rgba(var(--bic-blue-rgb), 0.05);
    }

    .btn.primary:hover {
      background: #24396a;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
      background: #24396a;
      color: #fff;
    }

    .btn[disabled] {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      cursor: default;
      opacity: 1;
      pointer-events: none;
    }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .command-bar > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;

      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto var(--stack-gap);
    }

    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    .command-bar--view { flex: 0 0 auto; }
    @media (max-width: 720px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
      .bar-row .command-bar--view { flex: 1 1 100%; }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .queue-bar > .btn { flex: 0 0 auto; }

    .room-head .room-blurb { max-width: none; }

    .btn.is-stale {
      border-color: rgba(194, 55, 55, 0.5);
      color: var(--bic-red);
    }

    .btn.is-stale:hover {
      border-color: var(--bic-red);
      background: rgba(194, 55, 55, 0.07);
    }

    .panel-headcol {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .chip.warn {
      border-color: rgba(154, 74, 24, 0.28);
      background: rgba(154, 74, 24, 0.08);
      color: #9a4a18;
    }

    .chip.success {
      border-color: rgba(47, 107, 61, 0.28);
      background: rgba(47, 107, 61, 0.08);
      color: var(--success);
    }

    .tape-tally .chip {
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
    }

    .tape-tally .chip.warn { color: #9a4a18; font-weight: 800; }
    .tape-tally .chip.track-flag { color: var(--bic-red); font-weight: 800; }

    .track-actions .btn { min-height: 38px; }
    .prompt-ai .btn { background: #fff; }
    @media (max-width: 840px) {

      .tool-modal-panel > .panel-head {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }

      .tool-modal-panel > .panel-head .panel-title { flex: 1 1 100%; }
      .prompt-ai-row .btn { flex: 1 1 auto; }
    }

    @media (max-width: 840px) {

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head-actions .btn,
      .panel-head-actions select,
      .command-bar .btn {
        flex: 1 1 auto;
      }
      .queue-bar > .btn { flex: 1 1 auto; }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    a { color: var(--accent); }

    .tape-head,

    .tape-lines { --tape-cols: 12ch 15ch minmax(0, 1fr) 132px 132px 84px minmax(13ch, 0.58fr) 30px; }

    .tape-lines { display: grid; gap: 6px; }

    .tape-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--tape-cols);
      gap: 4px 8px;

      align-items: center;

      margin-bottom: 6px;
      padding: 9px 12px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
    }

    .tape-head,
    .tape-lines {
      --col-label: 0.68rem;
      --col-value: 0.78rem;
      --col-text: 0.78rem;
    }

    .tape-head-btn,
    .tape-head-label {
      padding: 0;
      border: 0;
      background: none;
      font-family: "IBM Plex Mono", monospace;
      font-size: var(--col-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: left;

      line-height: 21px;
      color: var(--muted);
    }

    .tape-head-btn { cursor: pointer; }
    .tape-head-btn:hover { color: var(--ink); text-decoration: underline; }
    .tape-head-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tape-head-btn[data-dir="ascending"]::after { content: ' \25b2'; font-size: 0.62rem; }
    .tape-head-btn[data-dir="descending"]::after { content: ' \25bc'; font-size: 0.62rem; }

    .tape-head-btn::after { margin-left: 4px; }

    .tape-head-btn { justify-content: flex-start; }

    .tape-head-btn[data-dir="off"]::after { content: none; }
    .tape-head-btn[data-dir="off"] { color: var(--muted); }

    .tape-head-btn[data-dir="ascending"],
    .tape-head-btn[data-dir="descending"] { color: var(--ink); }

    .sort-rank {
      display: none;
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin-left: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--cut-panel-bg);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 15px;
      text-align: center;

      font-variant-numeric: tabular-nums;
      cursor: help;
    }

    .tape-head-btn[data-dir="ascending"],
    .tape-head-btn[data-dir="descending"] {
      display: inline-flex;
      align-items: center;
    }

    .tape-head-btn[data-dir="ascending"] .sort-rank,
    .tape-head-btn[data-dir="descending"] .sort-rank { display: inline-block; }

    .tape-line { cursor: pointer; }

    .tape-line:hover {
      border-color: var(--accent);
      box-shadow: 0 1px 4px rgba(16, 24, 40, 0.1);
    }

    .tape-line .tape-air,
    .tape-line .tape-air * { cursor: pointer; }

    .tape-line {
      display: grid;
      grid-template-columns: var(--tape-cols);
      gap: 4px 8px;
      align-items: baseline;
      padding: 9px 12px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    .tape-line-state,
    .tape-line-country {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;

      font-size: var(--col-text);
      color: var(--muted);
    }

    .tape-line-city {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .tape-line-name {
      min-width: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .tape-new {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 999px;

      background: var(--success, #2f855a);
      color: #fff;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-label);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      cursor: help;
      white-space: nowrap;
    }

    .tape-issues {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 34px;
      height: 19px;
      padding: 0 5px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.35);
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.08);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      cursor: help;
      vertical-align: 1px;
    }

    .tape-issues:hover { border-color: var(--accent); background: rgba(var(--bic-blue-rgb), 0.16); }
    .tape-issues:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tape-line-city { font-weight: 700; color: var(--ink); }
    .tape-line-phrase { font-weight: 500; color: var(--ink); opacity: 0.82; }

    .issue-pip {
      flex: 0 0 auto;
      box-sizing: border-box;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--bic-red, #c23737);
    }

    .issue-pip.is-tape {
      background: #fff;
      border: 3px solid var(--bic-red, #c23737);
    }

    .tape-line-issues { gap: 6px; }

    .issue-pip-more {
      flex: 0 0 auto;
      margin-left: 1px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--bic-red, #c23737);
    }

    .tape-head > :nth-child(4),
    .tape-line > :nth-child(4) { border-radius: 6px 0 0 6px; }

    .tape-head > :nth-child(6),
    .tape-line > :nth-child(6) { border-radius: 0 6px 6px 0; }

    .tape-head-label--num,
    .tape-line-num {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      min-width: 0;
      font-family: "IBM Plex Mono", monospace;

      font-size: var(--col-value);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: var(--muted);
    }

    .tape-line-num strong { font-weight: 700; color: var(--ink); }
    .tape-line-num.is-empty,
    .tape-line-num.is-empty strong { color: var(--muted); font-weight: 500; }

    .head-figure {
      display: inline-flex;
      flex-direction: column;

      align-items: center;

      gap: 0;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .head-word {
      font-size: var(--col-label);

      letter-spacing: 0.1em;
    }

    .head-count {
      font-size: var(--col-value);
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-transform: none;
    }

    .head-figure--filter {
      cursor: pointer;
      position: relative;
      border-bottom: 2px solid transparent;
    }

    .head-figure--filter:hover { color: var(--ink); }
    .head-figure--filter:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }

    .head-figure--filter input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .head-figure--filter.is-on {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .head-figure--new.is-zero { color: var(--muted); }
    .head-figure--new.is-zero { color: var(--muted); }

    .tape-head-label--new {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      align-self: center;

      gap: 7px;
      white-space: nowrap;
    }

    .tape-findings {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--control-line);
    }

    .tape-findings[hidden] { display: none; }

    .track-issues {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--control-line);
    }

    .track-issues .issue-item { margin: 0; }

    .track-head,
    .track-lines {

      --track-cols: 30px 44px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.45fr) 130px 28px 122px 28px;
    }

    section.tool-modal-panel#tracksCard:not([hidden]) {
      display: flex;
      flex-direction: column;
      max-height: min(88vh, 900px);
    }

    #tracksCard .panel-head,
    #tracksCard .prompt-foot { flex: 0 0 auto; }

    #tracksCard .tracks-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;

      padding: 0 2px 4px;
    }

    .track-head { box-shadow: 0 6px 10px -8px rgba(16, 24, 40, 0.35); }

    #tracksTitle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      min-width: 0;
    }

    #tracksTitle .tape-name-editor {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    #tracksTitle .city-input,
    #tracksTitle .spine-input {
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .tracks-sub {
      margin: 3px 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--track-cols);
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 6px;
      padding: 8px 10px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 8px;
      background: var(--cut-panel-bg);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .track-head-label {
      min-width: 0;
      padding: 0 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-head-label--mid { padding: 0; text-align: center; }

    #trackAirAll { justify-self: center; }

    .track-lines { display: grid; gap: 6px; }

    .track-line {
      display: grid;
      grid-template-columns: var(--track-cols);
      gap: 4px 8px;

      align-items: center;
      padding: 7px 10px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
    }

    .track-line.is-shelved {
      border-style: dashed;
      opacity: 0.62;
    }
    .track-line.is-shelved:hover,
    .track-line.is-shelved:focus-within { opacity: 1; }

    .track-line.is-live { box-shadow: inset 3px 0 0 var(--success, #2f855a); }

    .track-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--control-line);
      border-radius: 999px;
      background: #fff;
      font-size: 0.6rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      align-self: center;
    }

    .track-play:hover {
      border-color: var(--success, #2f855a);
      color: var(--success, #2f855a);
    }

    .track-play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .track-play.is-playing {
      border-color: var(--success, #2f855a);
      background: var(--success, #2f855a);
      color: #fff;
    }

    .track-line.is-focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.18);
    }

    .track-stage {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    .track-stage .queue-player {
      display: block;
      width: 100%;
      height: 80px;
      border: 0;
      border-radius: 10px;
    }

    .track-stage .queue-noplayer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      border: 1px dashed var(--control-line);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .track-line.is-flagged { box-shadow: inset 3px 0 0 var(--bic-red, #c23737); }

    .track-input {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      padding: 3px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font: inherit;
      font-size: 0.86rem;
      color: var(--ink);
    }

    .track-input:hover { border-color: var(--control-line); }
    .track-input:focus { border-color: var(--accent); background: #fff; outline: none; }

    .track-input--num { text-align: center; font-family: "IBM Plex Mono", monospace; }
    .track-input--id { font-family: "IBM Plex Mono", monospace; font-size: 0.74rem; }
    .track-input--title { font-weight: 700; }

        <textarea class="prompt" id="promptText" spellcheck="false" readonly aria-label="Paste-ready prompt">You are researching one city soundtrack for The Game Bureau.

WHAT A TAPE IS
A city soundtrack is a free, non-commercial gift for our players: 15 songs
chosen to make somebody curious about visiting that city. Curiosity about the
city is what sells the game; the tape is what starts it.

PICK THE CITY: US FIRST, AND IN THIS ORDER
If I have already named a city, use it. Otherwise pick one yourself, working
DOWN this ladder and stopping at the first tier that still has a city wanting a
tape. Do not skip a tier because a lower one looks more interesting.

  TIER 1  A fanbase city of an NFL, NBA, MLB or NHL club.
  TIER 2  A college football town, where an NCAAF program actually plays.
  TIER 3  Any other US city in public.cities.
  TIER 4  Non-US cities. ONLY once tiers 1-3 are exhausted.

Within a tier, take a city with NO TAPE AT ALL before one that merely needs
topping up, and break ties alphabetically so two runs never fight over the same
city. Say which tier you picked from and why, in one line, before the SQL.

READ THESE FIRST. They are public and need no login
  US cities     https://qmaafbncpzrdmqapkkgr.supabase.co/rest/v1/cities?select=slug,city&amp;country_code=eq.USA&amp;hide_from_soundtracks=is.false&amp;order=city.asc&amp;apikey=sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3
  how full      https://qmaafbncpzrdmqapkkgr.supabase.co/rest/v1/soundtrack_stats?select=city_slug,active_songs&amp;order=city_slug.asc&amp;apikey=sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3
  teams         https://qmaafbncpzrdmqapkkgr.supabase.co/rest/v1/teams?select=league,code,fanbase,mascot&amp;order=league.asc&amp;apikey=sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3

The cities list is FILTERED TO THE US and to cities that are allowed a tape,
which is tiers 1-3 and about 490 rows. That filter is not just convenience: the
catalogue is over 1300 cities, the API silently stops at 1000 and tells you
nothing, so an unfiltered read would hand you the alphabet up to roughly M and
look complete. Only if you genuinely reach TIER 4 should you drop
country_code=eq.USA, and then read it in two halves with &amp;limit=1000 and
&amp;offset=1000, or you will hit the same cliff.

If you cannot open URLs, ask me to paste those lists in and wait. Do not guess
at the catalogue: a city_slug that is not in public.cities is refused by the
function and the whole run is wasted.

FOUR THINGS THAT WILL TRIP YOU UP HERE
  - THE FANBASE CITY, NEVER THE VENUE TOWN. Boston not Foxborough, Buffalo not
    Orchard Park, Dallas not Arlington, Miami not Miami Gardens, New York not
    East Rutherford, San Francisco not Santa Clara, Phoenix not Glendale, Las
    Vegas not Paradise, Los Angeles not Inglewood. Nobody makes a mixtape of
    Orchard Park. Those towns are in public.cities carrying
    hide_from_soundtracks, so the flag stops you anyway, but pick by fanbase
    and you will never meet it.
  - COLLEGE ROWS NAME A SCHOOL, NOT A CITY. teams.fanbase reads "Alabama" or
    "Ohio State" for NCAAF, so YOU have to resolve the town: Alabama is
    Tuscaloosa, Ohio State is Columbus, Ole Miss is Oxford. Resolve it, then
    check that town is in public.cities.
  - THE TWO TABLES SPELL A CITY DIFFERENTLY. teams say "Buffalo, NY"; cities say
    "Buffalo, New York". Match on the city name, not on the whole string.
  - A city with hide_from_soundtracks set is OFF LIMITS at every tier.

Use the exact slug from public.cities as city_slug.

AN EMPTY CITY GETS EXACTLY 5 SONGS. THIS OVERRIDES EVERY OTHER RULE HERE.
If the city you picked has no tape at all, or has a tape with no live songs,
propose 5 and stop. Not 6, not 15. Wherever anything below says 15, or says to
fill a tape, or says how many a city should end up with, this line wins.

A city that already has live songs is a TOP-UP and is unaffected: those go to 15
as before.

Why: an empty city is a guess about a place nobody has looked at yet, and five
songs is enough to see whether the guess is any good. Fifteen wrong ones is a
human reading fifteen wrong blurbs.

PICK FOR THE TAPE'S NAME, NOT JUST THE CITY
A tape has a spine phrase as well as a city, and the phrase is a brief. "Denver
Late Night" is not the same tape as "Denver Rumba Mix", and a song that belongs
on one can be wrong on the other. Read the phrase and let it narrow the pick:
mood, genre, era, scene, time of day, whatever it is claiming.

Two rules on top of that:
  - The city still has to be true. A tape named for a genre is a genre tape FOR
    THAT CITY, not a genre playlist with a city label on it.
  - When a tape is only called Soundtrack, Mix Tape, Jams or the like, the
    phrase is saying nothing and the city is the whole brief. Do not invent a
    theme it does not have.

If you are creating the tape, pick the phrase FIRST and then find songs that
answer it. A phrase chosen after the fact describes the songs you happened to
find, which is not a brief, it is a label.

FIND THE SONGS
Draw from all four of these, in roughly this order of preference:
  - songs that name the city, its streets, its neighbourhoods
  - hometown artists and records actually made there
  - sports and game-day music: fight songs, victory anthems, stadium walk-up
    and goal songs, what fans sing outside the ground. Aim for 2 or 3 of the 15
    where the city has a real sports identity, and confirm the team actually
    plays the song
  - local scenes and labels the city is known for

RULES, ALL OF WHICH ARE ENFORCED SOMEWHERE
  - Real commercial recordings only. No tribute, sped-up, slowed or
    re-recorded versions.
  - NEVER propose a track with the word KARAOKE anywhere in it. Not the title,
    not the description or blurb, not the artist, not the album, and not ANY
    field Spotify shows for it, in any casing and in any language. This is a
    string test rather than a judgement call: if the word is there the track is
    out, whatever the recording turns out to be. Check the Spotify page you are
    already opening to verify the id, and if the word appears on it, drop the
    track and find another.
  - At most 2 songs per artist on one city.
  - No duplicate title plus artist pair on one city. A unique index enforces
    this, so a duplicate is silently dropped and the tape ends up short.
  - Every song needs a title, an artist, and a city-specific blurb. The blurb
    runs to ten words at most and does not end in a period. There is NO MINIMUM
    LENGTH beyond having one at all: four words that say something true beat
    eight padded out to hit a count, and no blurb is ever too short.
  - spotify_id is 22 characters and must be VERIFIED against a real
    open.spotify.com/track page you actually opened. OMIT IT rather than guess.
    A fabricated id passes every format check and then silently plays nothing.
  - explicit is true only if Spotify itself says so.

NO EM DASHES ANYWHERE IN WHAT YOU HAND BACK. Not in a blurb, not in a spine
phrase, not in the summary you write around the SQL. Not as the character and
not as the `&mdash;` entity. Use a comma, a colon, a semicolon, a full stop or
brackets; every one of them is available and one of them always fits. An em dash
is the single clearest tell that a machine wrote the line, and a blurb is read
aloud off a cassette. This prompt does not use one either, deliberately: if the
instructions were littered with them you would copy the habit.

WHAT HAPPENS TO YOUR WORK
Nothing you file is published. Every track lands in a review queue as a
candidate and stays invisible on /soundtracks/ until a human puts it live on
it, or Shelve, which takes it off the tape for good. Write the tape as though it
were publishing tomorrow anyway: a candidate you would not defend is not worth
filing.

DELIVERABLE
Reply with ONE sql code block and nothing else around it: a single call to the
pull function, with your songs as the jsonb argument.

  select public.tgb_pull_soundtrack_songs('
  [
    {
      "city_slug": "denver",
      "spine_tag": "Soul Mix",
      "songs": [
        {
          "title": "",
          "artist": "",
          "spotify_id": "",
          "blurb": "",
          "explicit": false
        }
      ]
    }
  ]
  '::jsonb);

Notes on that shape:
  - THE ARGUMENT IS A BARE ARRAY. Do not wrap it in {"tapes": [...]}. That
    wrapper is how PostgREST names arguments over HTTP, where a top-level key
    is matched to a PARAMETER NAME; in SQL you are calling the function
    positionally, so the argument is the array itself. Wrapping it makes the
    argument an object and the function stops with
    "Expected a JSON array of tape objects", which reads like your JSON is
    malformed when it is only in the wrong container.
  - spine_tag is the short phrase printed down the side of the cassette. It is
    applied ONLY when the tape row is created, and ignored on a tape that
    already exists.
  - Leave spotify_id out entirely rather than sending an empty string or a
    guess.
  - One tape per call is plenty. The function accepts at most 4 tapes and 60
    songs in one go.
  - Escape any apostrophe in a title, artist or blurb by doubling it, or the
    statement will not parse.

Then stop. Do not explain the SQL, do not summarise the tape, and do not add
prose before or after the code block.</textarea>

    "A tape over 15 live songs is trimmed by SHELVING the most recently added tracks (newest created_at first, ties broken by highest id) until 15 remain. Never shelve an older track to keep a newer one; the earlier fifteen are the considered set. The agent cannot shelve, so it reports an over-full tape as a facts issue naming the surplus tracks and a human presses Shelve.",
    "Max 2 active songs per artist per city.",
    "No duplicate title+artist pair in a city, archived rows included: a unique index enforces it, so a duplicate is dropped and the tape ends up short.",
    "Every song needs a title, an artist, and a city-specific blurb with no trailing period. A blurb is REQUIRED and a missing one is a facts issue; what has NO MINIMUM is its LENGTH. Keep it to 10 words or fewer, and four words that say something true beat eight padded out to hit a count. No blurb is ever too short to pass; shortness alone is never worth reporting.",
    "spotify_id must be verified against a real open.spotify.com/track page. Omit it rather than guess: a fabricated id passes every format check and silently plays nothing.",
    "TWO STATES, and one column holds both: SHELVED is archived = true, LIVE is archived = false. Everything this routine writes is SHELVED. Only a human moves a song to LIVE, by switching it live in the Tape Room, where the two words on screen are exactly LIVE and SHELVED. There is no third state and no review queue: shelved plus recently added is what a human works through, which the room shows as its NEW filter. SKIP in that room means only one thing (taking a FINDING off the Issues list), so never use it for a song. Write any suggestion a human will read in those words.",
    "A shelved song keeps its row on the city as a do-not-rescrape tombstone: it is excluded from live counts and can never be re-picked for that city. Do not re-propose a track that is already there in any state.",
    "A tombstone is scoped to one city, not to the song: the unique index is (city_slug, lower(title), lower(artist)). A track shelved on one tape can be added to another tape and go live there. Being wrong for one city is not evidence about another.",
    "Audit every track on the tapes in scope, live or shelved. A finding is a STATEMENT, not an instruction, and a human decides what to do with it. This reverses the old rule, which refused to report against a shelved track on the grounds that shelving was the strongest available fix; with everything landing shelved that rule would have silenced the audit on the whole catalogue.",
    "No tapes for cities where public.cities.hide_from_soundtracks is true.",
    "Real commercial recordings only: no tribute, sped-up, slowed, or re-recorded versions.",
    "NEVER propose a track with the word KARAOKE anywhere in it: not the title, not the description or blurb, not the artist, not the album, and not any field Spotify shows for it, in any casing and in any language. It is a string test rather than a judgement call, so if the word is there the track is out whatever the recording turns out to be. You are already opening the Spotify page to verify the id, so check it there."

  <!-- The room blurb under the title is rendered from one shared string,
       so this room and its Ancillary Things card at /mc/ cannot drift apart.
       Its <p> is empty in the markup on purpose; see the file. -->
  <script src="/mc/js/room-blurbs.js"></script>

  <script>
    (function () {
      'use strict';

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var trackArchiveStatus = document.getElementById('trackArchiveStatus');
      var trackArchiveList = document.getElementById('trackArchiveList');
      var archiveExpandBtn = document.getElementById('archiveExpandBtn');
      var trackStatusTabs = document.getElementById('trackStatusTabs');

      var trackStatusFilter = '';
      var keyLegend = document.getElementById('keyLegend');
      var citySearch = document.getElementById('citySearch');

      var citySearchTerm = '';

      var sortKeys = [{ key: 'country', dir: -1 }, { key: 'city', dir: 1 }];

      function sortEntry(key) {
        for (var i = 0; i < sortKeys.length; i++) {
          if (sortKeys[i].key === key) return sortKeys[i];
        }
        return null;
      }

      function cycleSort(key) {
        var at = -1;
        for (var i = 0; i < sortKeys.length; i++) if (sortKeys[i].key === key) at = i;
        if (at === -1) sortKeys.push({ key: key, dir: 1 });
        else if (sortKeys[at].dir === 1) sortKeys[at].dir = -1;
        else sortKeys.splice(at, 1);
      }

      var flaggedOnly = false;
      var newOnly = false;

      var pageNotice = document.getElementById('pageNotice');
      var soundtrackIssues = [];

      var REVIEW_HOURS = 14;
      var soundtrackArchiveData = null;
      var expandedTapes = Object.create(null);

      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) {
        return SUPABASE_CONFIG.url + '/rest/v1/' + path;
      }

      async function fetchAllRows(path, useAuth) {
        var PAGE = 1000;
        var all = [];
        var headersFor = useAuth ? authHeaders : anonHeaders;
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: headersFor({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function patchRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'PATCH',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;

        if (!row) throw new Error('Nothing was updated — sign in again and retry.');
        return row;
      }

      async function runTally(sinceIso) {
        try {
          var res = await fetch(
            restUrl('soundtrack_songs?select=city_slug&created_at=gte.' + encodeURIComponent(sinceIso)),
            { headers: anonHeaders(), cache: 'no-store' }
          );
          if (!res.ok) return '';
          var rows = await res.json();
          if (!Array.isArray(rows) || !rows.length) return '';
          var byCity = Object.create(null);
          rows.forEach(function (r) {
            var slug = text(r && r.city_slug);
            if (!slug) return;
            byCity[slug] = (byCity[slug] || 0) + 1;
          });
          return Object.keys(byCity)
            .sort(function (a, b) {
              return byCity[b] - byCity[a] || soundCityLabel(a).localeCompare(soundCityLabel(b));
            })
            .map(function (slug) {
              return soundCityLabel(slug) + ' ' + byCity[slug]
                + ' track' + (byCity[slug] === 1 ? '' : 's');
            })
            .join(', ');
        } catch (error) {
          return '';
        }
      }

      async function deleteRow(path) {
        var res = await fetch(restUrl(path), { method: 'DELETE', headers: authHeaders({}) });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Delete failed: ' + res.status + ' ' + detail);
        }
        return true;
      }

      async function insertRow(path, body) {
        var res = await fetch(restUrl(path), {
          method: 'POST',
          headers: authHeaders({
            'Content-Type': 'application/json',
            Prefer: 'return=representation'
          }),
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;

        if (!row) throw new Error('Nothing was inserted — sign in again and retry.');
        return row;
      }

      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          loadSoundtrackArchive().catch(function (error) {
            console.error(error);
            setNotice((error && error.message) || 'could not load the tapes', 'error');
          });
        },
        onSignedOut: function () {
          resetSoundtrackArchive();
        }
      });

      if (archiveExpandBtn) archiveExpandBtn.addEventListener('click', function () {
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        if (!groups.length) return;
        var allOpen = Array.prototype.every.call(groups, function (g) { return g.open; });
        var next = !allOpen;

        Array.prototype.forEach.call(groups, function (g) {
          g.open = next;
          if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = next;
        });
        syncArchiveExpandBtn();
      });

      function tabsOf(strip) {
        return strip ? Array.prototype.slice.call(strip.querySelectorAll('.queue-tab')) : [];
      }

      function selectTab(strip, value) {
        tabsOf(strip).forEach(function (tab) {
          var on = (tab.dataset.tab || '') === value;
          tab.classList.toggle('is-active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }

      function setTabCounts(strip, counts) {
        tabsOf(strip).forEach(function (tab) {
          var key = tab.dataset.tab || '';
          var n = Number(counts[key] || 0);
          var el = tab.querySelector('.queue-tab-count');
          if (el) el.textContent = String(n);
          tab.classList.toggle('is-empty', n === 0);
          tab.classList.toggle('has-work', n > 0);
        });
      }

      function bindTabs(strip, onPick) {
        if (!strip) return;
        strip.addEventListener('click', function (event) {
          var tab = event.target.closest ? event.target.closest('.queue-tab') : null;
          if (!tab || !strip.contains(tab)) return;
          onPick(tab.dataset.tab || '');
        });
      }

      paintKeyLegend();
      paintSortHeaders();

      bindTabs(trackStatusTabs, function (value) {
        if (value === trackStatusFilter) return;
        trackStatusFilter = value;
        selectTab(trackStatusTabs, trackStatusFilter);

        if (trackStatusFilter) {
          Object.keys(expandedTapes).forEach(function (k) { delete expandedTapes[k]; });
          renderTrackArchive();
          var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
          Array.prototype.forEach.call(groups, function (g) {
            g.open = true;
            if (g.dataset && g.dataset.slug) expandedTapes[g.dataset.slug] = true;
          });
          syncArchiveExpandBtn();
        } else {
          expandedTapes = Object.create(null);
          renderTrackArchive();
        }
      });

      if (citySearch) citySearch.addEventListener('input', function () {
        citySearchTerm = citySearch.value.trim().toLowerCase();
        renderTrackArchive();
      });

      document.addEventListener('keydown', trackKeydown);

      var newOnlyBox = document.getElementById('newOnly');

      function paintFilterPills() {
        var pairs = [['newTotalPill', newOnly], ['issueTotalPill', flaggedOnly]];
        pairs.forEach(function (pair) {
          var el = document.getElementById(pair[0]);
          if (el) el.classList.toggle('is-on', !!pair[1]);
        });
      }

      if (newOnlyBox) newOnlyBox.addEventListener('change', function () {
        newOnly = !!newOnlyBox.checked;
        paintFilterPills();
        renderTrackArchive();
      });

      var flaggedOnlyBox = document.getElementById('flaggedOnly');
      if (flaggedOnlyBox) flaggedOnlyBox.addEventListener('change', function () {
        flaggedOnly = !!flaggedOnlyBox.checked;
        paintFilterPills();
        renderTrackArchive();
      });

      function paintSortHeaders() {
        var head = document.getElementById('tapeHead');
        if (!head) return;
        Array.prototype.forEach.call(head.querySelectorAll('.tape-head-btn'), function (el) {
          var key = el.dataset.sort;
          var entry = sortEntry(key);
          var rank = entry ? (sortKeys.indexOf(entry) + 1) : 0;
          var dir = !entry ? 'off' : (entry.dir === 1 ? 'ascending' : 'descending');
          el.setAttribute('data-dir', dir);

          el.setAttribute('aria-sort', rank === 1 ? dir : 'none');
          var badge = el.querySelector('.sort-rank');
          if (badge) {
            badge.textContent = rank ? String(rank) : '';

            badge.title = 'SORT ORDER';
          }
        });
      }

      var tapeHead = document.getElementById('tapeHead');
      if (tapeHead) tapeHead.addEventListener('click', function (event) {
        var btn = event.target.closest ? event.target.closest('.tape-head-btn') : null;
        if (!btn || !tapeHead.contains(btn)) return;
        cycleSort(btn.dataset.sort || 'city');
        paintSortHeaders();
        renderTrackArchive();
      });

      function syncArchiveExpandBtn() {
        if (!archiveExpandBtn) return;
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        archiveExpandBtn.disabled = !groups.length;
        var allOpen = groups.length > 0 && Array.prototype.every.call(groups, function (g) { return g.open; });
        archiveExpandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
        archiveExpandBtn.title = allOpen ? 'Close every tape' : 'Open every tape';
      }
      function text(value) {
        return String(value == null ? '' : value).trim();
      }

      function truthyFlag(value) {
        if (value === true) return true;
        if (value === false || value == null) return false;
        var v = String(value).trim().toLowerCase();
        return !!v && ['false', 'f', 'no', 'n', '0'].indexOf(v) === -1;
      }

      function isArchivedSong(song) {
        return truthyFlag(song && song.archived);
      }

      function songStatus(song) {
        return isArchivedSong(song) ? 'SHELVED' : 'LIVE';
      }

      var STATUS_LABEL = { LIVE: 'Live', SHELVED: 'Shelved' };
      var STATUS_VERB = { LIVE: 'Live', SHELVED: 'Shelve' };

      function statusLabel(status) { return STATUS_LABEL[status] || 'Shelved'; }

      function formatDate(date) {
        if (!(date instanceof Date) || !Number.isFinite(date.getTime())) return '';
        return date.toLocaleString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function emptyNode(message) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.textContent = message;
        return div;
      }

      function chip(label, tone) {
        var span = document.createElement('span');
        span.className = 'chip' + (tone ? ' ' + tone : '');
        span.textContent = label;
        return span;
      }

      function actionLink(href, label, external) {
        var a = document.createElement('a');
        a.className = 'btn small';
        a.href = href;
        a.textContent = label;
        if (external) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        return a;
      }

      function setArchiveStatus(message, tone) {
        if (!trackArchiveStatus) return;
        trackArchiveStatus.textContent = message || '';
        trackArchiveStatus.classList.toggle('is-error', tone === 'error');
        trackArchiveStatus.classList.toggle('is-success', tone === 'success');
        trackArchiveStatus.classList.toggle('is-warn', tone === 'warn');
      }

      var noticeTimer = 0;
      function setNotice(message, tone) {
        if (!pageNotice) return;
        window.clearTimeout(noticeTimer);
        pageNotice.textContent = message || '';

        if (message && tone !== 'error' && tone !== 'hold') {
          noticeTimer = window.setTimeout(function () {

            if (pageNotice.textContent === message) pageNotice.textContent = '';
          }, 6000);
        }
      }

      function resetSoundtrackArchive() {
        soundtrackArchiveData = null;
        trackStatusFilter = '';
        selectTab(trackStatusTabs, '');
        setTabCounts(trackStatusTabs, {});
        if (archiveExpandBtn) { archiveExpandBtn.disabled = true; archiveExpandBtn.textContent = 'Expand all'; }
        expandedTapes = Object.create(null);
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Sign in to manage tapes and tracks.'));
        }
        setArchiveStatus('Waiting for sign-in.', '');
        setNotice('', '');
        soundtrackIssues = [];
        focusSongId = null;
      }

      function setIssuesStatus(message, tone) {
        if (message) setNotice(message, tone);
      }

      var ISSUE_KIND_LABEL = {
        spotify: 'Spotify ID',
        spelling: 'Spelling',
        relevance: 'Relevance',
        facts: 'Facts'
      };

      function openIssues() {
        return Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
      }

      function cityByLabel(label) {
        var want = text(label).toLowerCase();
        if (!want) return null;
        var hit = null;
        Object.keys(cityMap).forEach(function (slug) {
          if (hit) return;
          var row = cityMap[slug];
          var canonical = text(row.city).toLowerCase();
          if (canonical === want || canonical.split(',')[0].trim() === want) hit = row;
        });
        return hit;
      }

      function paintCityOptions() {
        var list = document.getElementById('cityOptions');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(cityMap).sort().forEach(function (slug) {
          var row = cityMap[slug];
          if (truthyFlag(row.hide_from_soundtracks)) return;

          var opt = document.createElement('option');
          opt.value = text(row.city);

          var held = soundtracks().filter(function (t) { return text(t.city_slug) === slug; }).length;
          if (held) opt.label = text(row.city) + '  (' + held + (held === 1 ? ' tape' : ' tapes') + ' already)';
          list.appendChild(opt);
        });
      }

      async function moveTapeToCity(tapeId, toSlug) {
        var tape = tapeById(tapeId);
        if (!tape) return false;
        var fromSlug = text(tape.city_slug);
        try {

          await patchRow('soundtracks?id=eq.' + encodeURIComponent(tape.id),
            { city_slug: toSlug });
        } catch (error) {
          console.error(error);
          setNotice(friendlyWriteError(error, cityFullLabel(fromSlug)), 'error');
          return false;
        }
        tape.city_slug = toSlug;
        (tape.songs || []).forEach(function (song) { song.city_slug = toSlug; });
        paintCityOptions();
        renderTrackArchive('moved the tape from ' + cityFullLabel(fromSlug)
          + ' to ' + cityFullLabel(toSlug), 'success');
        return true;
      }

      function issueAsPrompt(issue) {
        var NL = String.fromCharCode(10);
        var song = songById(issue.song_id);

        var tape = tapeById(issue.tape_id) || tapesInCity(issue.city_slug)[0];
        var kind = ISSUE_KIND_LABEL[issue.kind] || issue.kind;
        var L = [];

        L.push('You are fixing one flagged item on The Game Bureau city soundtracks.');
        L.push('Verify everything by web search FIRST, then answer with ONE ```sql block and nothing else.');
        L.push('');
        L.push('## THE FINDING');
        L.push(kind + ', severity ' + (text(issue.severity) || 'unset'));
        L.push(humaniseIssueText(issue.detail));
        if (text(issue.suggestion)) {
          L.push('Suggested by the auditor, unverified: ' + humaniseIssueText(issue.suggestion));
        }
        L.push('');
        L.push('## THE ROW');
        L.push('Tape: ' + cityFullLabel(issue.city_slug) + ', city_slug ' + text(issue.city_slug)
          + (tape && tape.spine_tag ? ', spine phrase "' + text(tape.spine_tag) + '"' : ''));

        if (song) {
          L.push('Track: ' + text(song.title) + ' by ' + text(song.artist));
          L.push('soundtrack_songs.id = ' + song.id + '  <- the only row you may change');
          L.push('spotify_id: ' + (text(song.spotifyId)
            ? text(song.spotifyId) + '  (https://open.spotify.com/track/' + text(song.spotifyId) + ')'
            : 'none, which is allowed'));
          L.push('blurb: ' + (text(song.blurb) || 'MISSING, and a blurb is required'));
          L.push('');
          L.push('## WHAT TO DO');
          L.push('1. Check the claim against a real source before changing anything. If the finding is');
          L.push('   WRONG, say so in one line and return no SQL at all. That is a valid answer and');
          L.push('   more useful than a confident edit.');
          L.push('2. If it is right, write ONE update against that id:');
          L.push('');
          L.push('   update public.soundtrack_songs');
          L.push('      set <only the columns that are actually wrong>');
          L.push('    where id = ' + song.id + ';');
          L.push('');

      function issueScopeSummary(tapeFlags, trackFlags) {
        return tapeFlags + (tapeFlags === 1 ? ' TAPE ISSUE, ' : ' TAPE ISSUES, ')
          + trackFlags + (trackFlags === 1 ? ' TRACK ISSUE' : ' TRACK ISSUES');
      }

      function tapeIssues(tape) {
        if (!tape) return [];
        var firstInCity = tapesInCity(tape.city_slug)[0];
        var isFirst = !!firstInCity && String(firstInCity.id) === String(tape.id);
        return openIssues().filter(function (issue) {
          if (issue.song_id != null) return false;
          if (issue.tape_id != null) return String(issue.tape_id) === String(tape.id);
          return isFirst && text(issue.city_slug) === text(tape.city_slug);
        });
      }

      function issuesForTape(tape) {
        if (!tape) return [];
        var mine = tapeIssues(tape);
        var songIds = {};
        (tape.songs || []).forEach(function (song) {
          if (song && song.id != null) songIds[String(song.id)] = true;
        });
        openIssues().forEach(function (issue) {
          if (issue.song_id != null && songIds[String(issue.song_id)]) mine.push(issue);
        });
        return mine;
      }

      function songIssues(song) {
        if (!song || song.id == null) return [];
        var key = String(song.id);
        var all = Array.isArray(soundtrackIssues) ? soundtrackIssues : [];
        return all.filter(function (issue) {
          return issue.song_id != null && String(issue.song_id) === key;
        });
      }

      function songById(id) {
        if (id == null) return null;
        var found = null;
        soundtracks().forEach(function (tape) {
          (tape.songs || []).forEach(function (song) {
            if (song && String(song.id) === String(id)) found = song;
          });
        });
        return found;
      }

      function locateSong(id) {
        if (id == null) return null;
        var hit = null;
        soundtracks().forEach(function (tape, tapeIndex) {
          (tape.songs || []).forEach(function (song, songIndex) {
            if (song && String(song.id) === String(id)) hit = { tapeIndex: tapeIndex, songIndex: songIndex };
          });
        });
        return hit;
      }

      async function resolveIssue(issue, status, quiet) {
        try {
          await patchRow('soundtrack_issues?id=eq.' + encodeURIComponent(issue.id), { status: status || 'fixed' });
        } catch (error) {
          console.error(error);
          setNotice('Could not skip that finding. ' + error.message, 'error');
          return false;
        }

        soundtrackIssues = (Array.isArray(soundtrackIssues) ? soundtrackIssues : [])
          .filter(function (row) { return row.id !== issue.id; });
        if (!quiet) setNotice('Skipped. If it is still a problem, the next audit reports it again.', 'success');

        renderTrackArchive();
        return true;
      }

      async function loadSoundtrackArchive() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) {
          resetSoundtrackArchive();
          return;
        }
        setArchiveStatus('Loading tapes and tracks…', '');
        if (trackArchiveList) {
          trackArchiveList.innerHTML = '';
          trackArchiveList.appendChild(emptyNode('Loading tracks...'));
        }
        try {
          soundtrackArchiveData = await fetchSoundtrackTables();

          paintCityOptions();
          renderTrackArchive();

          openTracksFromHash();
        } catch (error) {
          console.error(error);
          soundtrackArchiveData = null;
          setArchiveStatus('Nothing loaded.', '');
          setNotice('could not load the tables', 'error');
          if (trackArchiveList) {
            trackArchiveList.innerHTML = '';
            trackArchiveList.appendChild(emptyNode('public.soundtracks / public.soundtrack_songs did not load. Check the Supabase project.'));
          }
          throw error;
        }
      }

      async function fetchSoundtrackTables() {
        var results = await Promise.all([
          fetchAllRows('soundtracks?select=*&order=city_slug.asc'),
          fetchAllRows('soundtrack_songs?select=*&order=city_slug.asc,position.asc,id.asc'),

          fetchAllRows('soundtrack_issues?select=*&status=eq.open&order=created_at.desc', true)
            .catch(function (error) {
              console.warn('soundtrack_issues unavailable', error);
              return [];
            }),

          fetchAllRows('cities?select=*&order=city.asc')
            .catch(function (error) {
              console.warn('cities unavailable, falling back to slugs', error);
              return [];
            })
        ]);
        soundtrackIssues = Array.isArray(results[2]) ? results[2] : [];
        rebuildCityMap(results[3]);

        var byTape = {};
        var tapes = results[0].map(function (row) {
          var tape = {
            id: row.id,
            city_slug: row.city_slug,
            spine_tag: row.spine_tag || '',
            created_at: row.created_at || '',
            songs: []
          };
          if (row.spine_tag_position) tape.spine_tag_position = row.spine_tag_position;
          if (row.archived) tape.archived = true;
          byTape[row.id] = tape;
          return tape;
        });
        results[1].forEach(function (row) {

          var tape = byTape[row.tape_id];
          if (!tape) return;
          var song = {
            id: row.id,
            position: Number(row.position) || 0,
            created_at: row.created_at || '',
            title: row.title || '',
            artist: row.artist || '',
            blurb: row.blurb || ''
          };
          if (row.spotify_id) song.spotifyId = row.spotify_id;
          if (row.explicit) song.explicit = true;
          if (row.archived) song.archived = true;
          if (row.archived_with_tape) song.archivedWithTape = true;

          tape.songs.push(song);
        });
        return { soundtracks: tapes };
      }

      function soundtracks() {
        return Array.isArray(soundtrackArchiveData && soundtrackArchiveData.soundtracks)
          ? soundtrackArchiveData.soundtracks
          : [];
      }

      function songHasContent(song) {
        return !!(song && (text(song.spotifyId) || text(song.title) || text(song.artist) || text(song.href)));
      }

      function allSongs(tape) {
        return ((tape && Array.isArray(tape.songs)) ? tape.songs : []).filter(songHasContent);
      }

      function songDate(song) {
        var raw = song && song.created_at;
        if (!raw) return null;
        var date = new Date(raw);
        return Number.isFinite(date.getTime()) ? date : null;
      }

      function songDisplay(song) {
        return [text(song && song.title) || '(untitled song)', text(song && song.artist) || '(unknown artist)'].join(' - ');
      }

      function trackCityLabel(tape) {
        return soundCityLabel(tape && tape.city_slug);
      }

      function tapeCounts(tape) {
        var counts = { active: 0, archived: 0, LIVE: 0, SHELVED: 0 };
        allSongs(tape).forEach(function (song) {
          if (isArchivedSong(song)) counts.archived += 1;
          else counts.active += 1;
          counts[songStatus(song)] += 1;
        });
        return counts;
      }

      function archiveSummary() {
        var tapes = soundtracks();
        var out = { tapes: tapes.length, hiddenTapes: 0, active: 0, archived: 0, LIVE: 0, SHELVED: 0 };
        tapes.forEach(function (tape) {
          var counts = tapeCounts(tape);
          out.active += counts.active;
          out.archived += counts.archived;
          out.LIVE += counts.LIVE;
          out.SHELVED += counts.SHELVED;
          if (truthyFlag(tape && tape.archived)) out.hiddenTapes += 1;
        });
        return out;
      }

      var focusSongId = null;

      function focusedAt() {
        if (focusSongId == null) return null;
        return locateSong(focusSongId);
      }

      function visibleSongIds() {
        if (!trackArchiveList) return [];
        return Array.prototype.map.call(
          trackArchiveList.querySelectorAll('.track-row[data-song-id]'),
          function (el) { return el.dataset.songId; });
      }

      function focusSong(id, scroll) {
        focusSongId = id == null ? null : id;
        renderTrackArchive();
        if (!scroll) return;
        var el = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }

      function focusStep(delta) {
        var ids = visibleSongIds();
        if (!ids.length) return;
        var at = focusSongId == null ? -1 : ids.indexOf(String(focusSongId));
        if (at === -1) { focusSong(ids[0], true); return; }
        var next = ids[(at + delta + ids.length) % ids.length];
        focusSong(next, true);
      }

      function nextTape(slug) {
        var groups = trackArchiveList ? trackArchiveList.querySelectorAll('.tape-group') : [];
        var slugs = Array.prototype.map.call(groups, function (g) { return g.dataset.slug; });
        var at = slugs.indexOf(slug);
        if (at === -1 || slugs.length < 2) return;
        var next = slugs[(at + 1) % slugs.length];
        expandedTapes[slug] = false;
        expandedTapes[next] = true;
        focusSongId = null;
        renderTrackArchive();
        var el = trackArchiveList.querySelector('.tape-group[data-slug="' + next + '"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
      }

      function spotifyIdFrom(value) {
        var raw = text(value);
        if (!raw) return '';
        var base22 = /^[A-Za-z0-9]{22}$/;
        if (base22.test(raw)) return raw;
        var m = raw.match(/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/);
        if (m) return m[1];
        return '';
      }

      function trackPlayer(song) {
        var id = text(song && song.spotify_id) || text(song && song.spotifyId);
        if (id) {
          var frame = document.createElement('iframe');
          frame.className = 'queue-player';
          frame.src = 'https://open.spotify.com/embed/track/' + encodeURIComponent(id) + '?utm_source=generator';
          frame.setAttribute('loading', 'lazy');
          frame.setAttribute('allow', 'clipboard-write; encrypted-media; fullscreen; picture-in-picture');
          frame.setAttribute('title', 'Spotify player: ' + songDisplay(song));
          return frame;
        }
        var box = document.createElement('div');
        box.className = 'queue-noplayer';
        var words = document.createElement('span');
        words.textContent = 'No Spotify ID on this track, so there is nothing to play here.';
        box.appendChild(words);
        box.appendChild(actionLink(
          'https://open.spotify.com/search/' + encodeURIComponent([text(song.title), text(song.artist)].join(' ')),
          'Search Spotify', true));
        var how = document.createElement('span');
        how.className = 'queue-noplayer-how';
        how.textContent = 'Find it, press Share, then paste the link into the Spotify box on the row.';
        box.appendChild(how);
        return box;
      }

      function trackKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var el = event.target;
        var tag = el && el.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

        if (!soundtrackArchiveData) return;
        var key = event.key.toLowerCase();
        if (key === 'arrowdown') { event.preventDefault(); focusStep(1); return; }
        if (key === 'arrowup') { event.preventDefault(); focusStep(-1); return; }
        var at = focusedAt();
        if (!at) return;

        if (key === 'l' || key === 'k') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'LIVE'); return; }
        if (key === 's') { event.preventDefault(); setTrackStatus(at.tapeIndex, at.songIndex, 'SHELVED'); return; }
        if (key === 'n') { event.preventDefault(); focusStep(1); return; }
        if (key === 'e') {
          event.preventDefault();
          var row = trackArchiveList && trackArchiveList.querySelector('.track-row.is-focused');
          var btn = row && row.querySelector('.track-edit-btn');
          if (btn) btn.click();
        }
      }

      function paintKeyLegend() {
        if (!keyLegend) return;
        keyLegend.innerHTML = '';
        var lead = document.createElement('span');
        lead.className = 'key-legend-lead';
        lead.textContent = 'Keys';
        keyLegend.appendChild(lead);
        [['L', 'live'], ['S', 'shelve'], ['E', 'edit'], ['N', 'next']].forEach(function (pair) {
          var span = document.createElement('span');
          span.className = 'key-legend-pair';
          var kbd = document.createElement('kbd');
          kbd.textContent = pair[0];

          span.append(kbd, document.createTextNode(' ' + pair[1]));
          keyLegend.appendChild(span);
        });
        keyLegend.title = 'Keyboard shortcuts for the track you have selected: L puts it live, S shelves it, E opens its editor, N moves to the next one. Arrow keys move up and down. K still works as an alias for L.';
      }

      var refocusing = false;

      function renderTrackArchive(message, tone) {
        if (!trackArchiveList) return;
        trackArchiveList.innerHTML = '';

        if (!soundtrackArchiveData) {
          trackArchiveList.appendChild(emptyNode('Sign in to see the tapes.'));
          return;
        }

        function byLabel(x, y, dir) {
          if (!x && !y) return 0;
          if (!x) return 1;
          if (!y) return -1;

          return x.localeCompare(y) * (dir || 1);
        }
        var tapes = soundtracks().slice();

        if (newOnly) {
          tapes = tapes.filter(isNewTape);
        }
        if (flaggedOnly) {
          tapes = tapes.filter(function (tape) {
            return issuesForTape(tape).length > 0;
          });
        }

        tapes = tapes.sort(function (a, b) {
          var sa = text(a && a.city_slug), sb = text(b && b.city_slug);
          var valueOf = {
            country: cityCountryLabel,
            state: cityStateLabel,
            city: soundCityLabel
          };
          for (var i = 0; i < sortKeys.length; i++) {
            var k = sortKeys[i];
            var cmp = byLabel(valueOf[k.key](sa), valueOf[k.key](sb), k.dir);
            if (cmp) return cmp;
          }

          return byLabel(sa, sb, 1);
        });

        if (!tapes.length) {

          trackArchiveList.appendChild(emptyNode(
            newOnly && flaggedOnly
              ? 'No tape from the last ' + NEW_FOR_HOURS + ' hours has an open issue.'
              : newOnly
                ? 'Nothing added in the last ' + NEW_FOR_HOURS + ' hours. TGB SOUNDTRACK BOT runs twice a day.'
                : flaggedOnly
                  ? 'No open issues on any tape. The daily audit reports here when it finds something.'
                  : 'No tapes yet.'));
          paintMasterAir();
          setArchiveStatus('', '');
          return;
        }

        tapes.forEach(function (tape) {
          var slug = text(tape && tape.city_slug);
          var row = document.createElement('div');
          row.className = 'tape-line';
          if (slug) row.dataset.slug = slug;
          row.dataset.tapeId = String(tape.id);
          row.title = 'Open ' + cityFullLabel(slug);

          row.addEventListener('click', function (event) {
            if (event.target.closest('input, button, label, a, select, textarea')) return;
            openTracks(tape.id);
          });

          var newCell = document.createElement('span');
          newCell.className = 'tape-line-num tape-line-new';
          if (isNewTape(tape)) newCell.appendChild(newBadge(tape));

          var country = document.createElement('span');
          country.className = 'tape-line-country';
          country.textContent = cityCountryLabel(slug);

          var state = document.createElement('span');
          state.className = 'tape-line-state';
          state.textContent = cityStateLabel(slug);

          var name = document.createElement('span');
          name.className = 'tape-line-name';

          var cityHalf = document.createElement('strong');
          cityHalf.className = 'tape-line-city';
          cityHalf.textContent = soundCityLabel(slug);

          var spineHalf = text(tape && tape.spine_tag);
          name.title = 'Open this tape to rename it or move it to another city.';
          if (!spineHalf) {
            name.appendChild(cityHalf);
          } else {
            var phrase = document.createElement('span');
            phrase.className = 'tape-line-phrase';
            phrase.textContent = spineHalf;

            if (text(tape && tape.spine_tag_position) === 'before') {
              name.append(phrase, cityHalf);
            } else {
              name.append(cityHalf, phrase);
            }
          }

          var issues = document.createElement('span');
          issues.className = 'tape-line-num tape-line-issues';

          var flags = issuesForTape(tape);
          if (flags.length) {
            var tapeFlags = tapeIssues(tape).length;
            var trackFlags = flags.length - tapeFlags;

            var MAX_PIPS = 8;
            var shown = Math.min(flags.length, MAX_PIPS);
            for (var pi = 0; pi < shown; pi++) {
              var pip = document.createElement('span');
              pip.className = 'issue-pip' + (pi < tapeFlags ? ' is-tape' : '');
              issues.appendChild(pip);
            }

            if (flags.length > MAX_PIPS) {
              var more = document.createElement('span');
              more.className = 'issue-pip-more';
              more.textContent = '+' + (flags.length - MAX_PIPS);
              issues.appendChild(more);
            }

            issues.title = issueScopeSummary(tapeFlags, trackFlags);
          }

          var shelved = truthyFlag(tape && tape.archived);

          var air = document.createElement('label');
          air.className = 'tape-air';

          var input = document.createElement('input');
          input.className = 'tape-air-input';
          input.type = 'checkbox';
          input.setAttribute('aria-label', 'On air: ' + tapeFullName(tape));

          var track = document.createElement('span');
          track.className = 'tape-air-track';
          track.setAttribute('aria-hidden', 'true');

          var wordOff = document.createElement('span');
          wordOff.className = 'tape-air-word tape-air-word--off';
          wordOff.textContent = 'Shelved';

          var wordOn = document.createElement('span');
          wordOn.className = 'tape-air-word tape-air-word--on';
          wordOn.textContent = 'Live';

          function paintAir(isShelved) {
            input.checked = !isShelved;
            wordOff.classList.toggle('is-current', isShelved);
            wordOn.classList.toggle('is-current', !isShelved);
            row.classList.toggle('is-shelved', isShelved);
            input.title = isShelved
              ? 'Shelved. Switch on to put this tape back on /soundtracks/, restoring the tracks it took down with it. A track shelved on its own stays shelved.'
              : 'Live on /soundtracks/. Switch off to take the whole city tape down, hiding every track on it.';
          }

          input.addEventListener('change', async function () {
            var want = !input.checked;

      async function saveTapeName(tapeIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var slug = text(tape && tape.city_slug);
        if (!slug) return { ok: false, message: 'That tape is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtracks?id=eq.' + encodeURIComponent(tape.id), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag')) {
          tape.spine_tag = fields.spine_tag || '';
        }
        if (Object.prototype.hasOwnProperty.call(fields, 'spine_tag_position')) {
          if (fields.spine_tag_position) tape.spine_tag_position = fields.spine_tag_position;
          else delete tape.spine_tag_position;
        }

        setNotice('saved ' + tapeFullName(tape), 'success');
        return { ok: true };
      }

      function friendlyWriteError(error, cityLabel) {
        var message = (error && error.message) || 'Write failed.';
        if (/23505|duplicate key/i.test(message)) {
          return 'The ' + cityLabel + ' tape already has that title and artist. '
            + 'It may already be there as a shelved track.';
        }
        if (/soundtrack_songs_spotify_id_check|violates check constraint/i.test(message)) {
          return 'Supabase rejected the Spotify ID. It has to be 22 letters and digits, or blank.';
        }
        return message;
      }

      async function setTrackStatus(tapeIndex, songIndex, status, quiet) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return false;

        var patch = { archived: status !== 'LIVE' };

        try {
          await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), patch);
        } catch (error) {
          console.error(error);
          setNotice('could not update ' + songDisplay(song), 'error');
          return false;
        }

        if (patch.archived) song.archived = true; else { delete song.archived; delete song.archivedWithTape; }

        if (quiet) return true;
        var said = { LIVE: 'live', SHELVED: 'shelved' };
        renderTrackArchive((said[status] || 'updated') + ' — ' + songDisplay(song), 'success');
        return true;
      }

      async function saveTrackFields(tapeIndex, songIndex, fields) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        try {
          await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), fields);
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, trackCityLabel(tape)) };
        }
        song.title = fields.title;
        song.artist = fields.artist;
        song.position = fields.position;
        if (fields.blurb) song.blurb = fields.blurb; else delete song.blurb;
        if (fields.spotify_id) song.spotifyId = fields.spotify_id; else delete song.spotifyId;
        if (fields.explicit) song.explicit = true; else delete song.explicit;
        renderTrackArchive('saved — ' + songDisplay(song), 'success');
        return { ok: true };
      }

      async function moveTrackToTape(tapeIndex, songIndex, targetSlug, asCopy) {
        var tape = soundtracks()[tapeIndex];
        var song = tape && Array.isArray(tape.songs) ? tape.songs[songIndex] : null;

        var target = tapeById(targetSlug) || tapesInCity(text(targetSlug))[0];
        if (!song || song.id == null) return { ok: false, message: 'That track is no longer loaded. Press Reload.' };
        if (!target) return { ok: false, message: 'Pick a tape to ' + (asCopy ? 'copy' : 'move') + ' to.' };

        var targetLabel = trackCityLabel(target);
        var nextPosition = allSongs(target).reduce(function (max, other) {
          return Math.max(max, Number(other.position) || 0);
        }, 0) + 1;

        try {
          if (asCopy) {
            await insertRow('soundtrack_songs', {
              city_slug: text(target.city_slug),
              position: nextPosition,
              title: text(song.title),
              artist: text(song.artist),
              blurb: text(song.blurb) || null,
              spotify_id: text(song.spotifyId) || null,
              explicit: !!song.explicit,

              archived: false
            });
          } else {
            await patchRow('soundtrack_songs?id=eq.' + encodeURIComponent(song.id), {
              city_slug: text(target.city_slug),
              position: nextPosition
            });
          }
        } catch (error) {
          console.error(error);
          return { ok: false, message: friendlyWriteError(error, targetLabel) };
        }

        var label = songDisplay(song);
        var wasHidden = songStatus(song) !== 'LIVE';

        await loadSoundtrackArchive();
        renderTrackArchive(
          asCopy
            ? ('copied to ' + targetLabel + ' — ' + label)
            : ('moved to ' + targetLabel + ' — ' + label
                + (wasHidden ? '; its do-not-reuse marker went too, so ' + trackCityLabel(tape) + ' can be given that song again' : '')),

          (!asCopy && wasHidden) ? 'hold' : 'success'
        );
        return { ok: true };
      }

      function tapeById(id) {
        if (id == null) return null;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return all[i];
        }
        return null;
      }

      function tapeIndexById(id) {
        if (id == null) return -1;
        var all = soundtracks();
        for (var i = 0; i < all.length; i++) {
          if (String(all[i].id) === String(id)) return i;
        }
        return -1;
      }

      function tapesInCity(slug) {
        var key = text(slug);
        return soundtracks().filter(function (tape) { return text(tape.city_slug) === key; });
      }

      var ISSUE_SEVERITY_LABEL = { high: 'Breaks for a visitor', warn: 'Wrong', info: 'Nitpick' };

      function humaniseIssueText(str) {
        var out = text(str);
        if (!out) return '';

        out = out.replace(/\b(song|song_id|track)\s*#?\s*=?\s*(\d+)/gi,
          function (whole, word, id) {
            var song = songById(id);
            return song ? ('"' + text(song.title) + '" by ' + text(song.artist)) : whole;
          });

        out = out.replace(/\b(tape|tape_id|id)\s*#?\s*=?\s*(\d+)/gi,
          function (whole, word, id, offset, source) {

            var sql = /\b(delete|update|insert|select)\b[\s\S]{0,60}\b(from|into|where|set)\b/i.test(source);
            var before = String(source).slice(Math.max(0, offset - 10), offset).toLowerCase();
            if (sql && /\b(where|and|or)\s*$/.test(before)) return whole;
            var tape = tapeById(id);
            return tape ? ('the ' + tapeNameOf(tape) + ' tape') : whole;
          });

        return out;
      }
