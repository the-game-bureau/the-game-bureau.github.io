<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WAYPOINTS | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- No Leaflet TAG. 144 KB in the head to draw nothing was most of what made
       this page slow to first paint, so ensureLeaflet() injects it the first
       time there is actually a point to show. A library of unlocated waypoints
       never downloads it at all. -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --warn: rgba(190, 55, 55, 0.9);
      /* THE SOCIALIZER'S PALETTE. Copied, not approximated: mc/socializer/index.html
         is the reference room and this is a copy of it, so when either one's
         chrome changes, change both. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --bic-red: #c23737;
      --success: #276740;
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
    }

    body {
      margin: 0;
      background: var(--paper-base);
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
    }

    .app { width: min(100%, var(--mc-shell-width, 1400px)); margin: 0 auto; padding: 0 18px 60px; }

    /* ---- bars ------------------------------------------------------------ */
    .bar-row { display: flex; gap: 10px; align-items: stretch; margin: 10px 0; flex-wrap: wrap; }

    .command-bar {
      margin: 0; border: 1px solid var(--cut-panel-line); border-radius: 8px;
      background: var(--cut-panel-bg); padding: 2px 9px 8px;
    }
    .command-bar > legend {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      padding: 0 6px; margin-left: 2px;
    }
    .command-bar-inner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* FIND TAKES THE SLACK, ADD DOES NOT. One flexible bar per row, or the free
       space splits between them and neither end stays pinned. */
    .command-bar--find { flex: 1 1 auto; min-width: 0; }
    .command-bar--check { flex: 0 0 auto; }
    /* A WIDTH FLOOR, so the face does not change the bar's shape as it swings
       between `Check`, `Check (137)` and `Show all`. Declared AFTER
       `.command-bar .btn`, which sets `min-width: 0` at the same weight and
       would otherwise win on source order. */
    .command-bar--check .btn { min-width: 11ch; }
    .command-bar--find input[type="search"] { flex: 1 1 220px; min-width: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 0 12px;
      border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff; color: var(--ink);
      font: 600 0.78rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: rgba(var(--bic-blue-rgb), 0.07); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #24396a; }
    .btn.warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.5); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    /* [hidden] HAS TO BE RE-ASSERTED over .btn's author display, or setting
       .hidden silently does nothing. This project has hit that rule a dozen
       times; it is cheaper to write the line than to find it again. */
    .btn[hidden] { display: none !important; }

    input[type="text"], input[type="search"], input[type="number"], textarea, select {
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.86rem;
      color: var(--ink); background: #fff;
      border: 1px solid var(--control-line); border-radius: 7px;
      padding: 7px 9px; min-height: 34px;
    }
    textarea { resize: vertical; line-height: 1.4; }

    /* ---- panels ---------------------------------------------------------- */
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
      box-shadow: 0 1px 4px var(--paper-shadow); margin: 0 0 14px; overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; background: var(--cut-panel-bg);
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      font: 600 0.74rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .panel-count { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .panel-head .spacer { margin-left: auto; }

    /* THE LIST SCROLLS INSIDE ITS OWN PANEL rather than growing the document,
       so the head stays on screen over 500-odd rows. */
    .panel-body { max-height: 70vh; overflow-y: auto; }

    /* ---- a waypoint row -------------------------------------------------- */
    .wp {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      padding: 7px 12px; border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.09);
      cursor: pointer;
    }
    .wp:last-child { border-bottom: 0; }
    .wp:hover { background: var(--panel-soft); }
    .wp-name { font-weight: 700; font-size: 0.95rem; }
    .wp-name a { color: inherit; text-decoration: none; }
    .wp-name a:hover { text-decoration: underline dotted; }
    .wp-where { color: var(--muted); font-size: 0.82rem; }
    .wp-tags { margin-left: auto; display: flex; gap: 5px; flex: 0 0 auto; }
    .wp-tag {
      font: 600 0.6rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 6px; border-radius: 999px;
      border: 1px solid var(--control-line); color: var(--muted);
    }
    /* MISSING IS THE ONLY TAG WITH A COLOUR. A row that is short of something
       is the one you act on; everything else is furniture. */
    .wp-tag--missing { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.45); }

    /* THE ROW ITSELF IS THE FLAG, as in the Events room: a red left edge and
       the reason written underneath, so nothing has to be opened to find out
       what is wrong. */
    .wp.is-review {
      border-color: rgba(194, 55, 55, 0.55);
      box-shadow: inset 3px 0 0 var(--bic-red);
      background: rgba(194, 55, 55, 0.035);
    }
    .wp-note {
      flex: 1 0 100%;
      margin: 2px 0 0;
      color: var(--bic-red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }
    .wp-empty { padding: 22px 14px; color: var(--muted); font-size: 0.9rem; }

    /* ---- map ------------------------------------------------------------- */
    #map { height: 340px; width: 100%; }
    .wp-pin {
      background: var(--ink); color: #fff; border: 2px solid #fff; border-radius: 50%;
      width: 14px; height: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* ---- the editor ------------------------------------------------------ */
    .dlg {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
      background: rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg.is-open { display: flex; }
    .dlg-panel {
      width: min(680px, 100%); background: #fff;
      border: 1px solid var(--cut-panel-line); border-radius: 12px;
      box-shadow: 0 10px 40px rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--cut-panel-bg);
      border-radius: 12px 12px 0 0;
    }
    .dlg-title { font: 700 0.9rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .dlg-sub { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .dlg-body { padding: 14px 16px; display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .dlg-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    /* DESTRUCTIVE HARD LEFT, PRIMARY HARD RIGHT, and the gap between them is
       the point: Delete is the only irreversible control on this form. */
    .dlg-foot .spacer { margin-left: auto; }

    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field--wide { grid-column: 1 / -1; }
    .field > span {
      font: 600 0.64rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .field input, .field textarea { width: 100%; }
    .field-read {
      font: 500 0.78rem/1.4 'IBM Plex Mono', monospace; color: var(--muted);
      padding: 7px 0;
    }
    .dlg-msg { padding: 0 16px 12px; color: var(--bic-red); font-size: 0.82rem; }
    .dlg-msg:empty { display: none; }

    @media (max-width: 760px) {
      .dlg-body { grid-template-columns: 1fr; }
      .command-bar { flex: 1 1 100%; }
    }
  
    /* admin-shell.css clamps every room's sentence to 62ch, which is right for
       a short one and cuts this one mid-word, after "challenge t". The second
       half is an equation and must not break across lines at all. Same
       one-line override the Events room carries, for the same reason; the
       shared rule is left alone, since 62ch is the right default. */
    .room-head .room-blurb { max-width: none; }

</style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>

    <!-- THE SHARED HEADER, from mc/js/admin-shell.css. .room-head, .room-title
         and .room-blurb are defined there, not here, which is the whole point:
         they were written out separately in four rooms once and drifted into
         four different title sizes. -->
    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title">WAYPOINTS</h1>
        <!-- THE TAGLINE IS NOT A STATUS LINE. It is the standing description of
             the room, and a message that overwrote it would take the

             in the scribble beside it. -->
        <p class="room-blurb">A Waypoint is a real world location where a game's challenge takes place. Waypoint + Challenge = Game Stop</p>
        <span class="status room-scribble" id="pageStatus" role="status" aria-live="polite"></span>

    <div class="bar-row">

  <!-- THE EDITOR. One waypoint at a time, in a dialog holding a working copy:
       Save writes it, Close discards it. That is what a dialog buys over a

  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-panel">
      <div class="dlg-head">

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-site-nav.js"></script>
  <script>
    'use strict';

    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const TABLE = 'waypoints';

    const el = (id) => document.getElementById(id);
    const clean = (v) => (v == null ? '' : String(v)).trim();

    // THE COLUMNS THIS ROOM WRITES, AND NOTHING ELSE. Everything about a PATH
    // is gone from this page: tour_id, tour_title, tour_shape and walk_order
    // are all still on the table and this room neither reads nor writes one.
    // They are retired in place, not dropped -- dropping is the single
    // irreversible move available, and 22 rows still carry the tour columns.
    const FIELDS = ['name', 'description', 'address', 'city', 'state', 'country',
                    'zip', 'source_url', 'lat', 'lon'];

    // COLUMN PROBING, NOT ASSUMING. Naming a column PostgREST does not have
    // 400s the whole request, so the room learns which optional columns exist
    // from a row it has actually been given and hides the field otherwise. That
    // is what lets `country` ship before 2026082901_waypoints_country.sql has
    // been pasted into the SQL editor.
    const cols = { country: false, source_url: false, latlon: false };

    const state = { authed: false, rows: [], q: '', place: 'any', editing: null,
                    reviewOnly: false };

    /* ---- plumbing -------------------------------------------------------- */

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token
      }, extra || {});
    }

    let statusTimer = 0;
    function setStatus(text, kind) {
      const node = el('pageStatus');
      if (!node) return;
      node.textContent = text || '';
      node.classList.toggle('error', kind === 'error');
      window.clearTimeout(statusTimer);
      // A SUCCESS CLEARS ITSELF AND AN ERROR DOES NOT. A stale "saved" an hour
      // later is a lie about what is currently true; an error is the thing you
      // came back to read.
      if (text && kind !== 'error') statusTimer = window.setTimeout(() => { node.textContent = ''; }, 6000);
    }

    async function readError(res) {
      let detail = '';
      try {
        const body = await res.json();
        detail = body.message || body.hint || body.details || '';
      } catch (e) { /* not JSON; the status is all there is */ }
      // A DATABASE CODE IS A STATEMENT ABOUT OUR SCHEMA, not an instruction to
      // the person at the keyboard. The one this room can actually meet is a
      // missing column, so it names the migration rather than the code.
      if (/country/.test(detail) && /column/.test(detail)) {
        return 'This database has no waypoints.country yet. Run ' +
               'mc/supabase/migrations/2026082901_waypoints_country.sql in the Supabase SQL editor.';
      }
      return detail || ('the database answered ' + res.status);
    }

    /* ---- reading --------------------------------------------------------- */

    // PAGED, BECAUSE POSTGREST STOPS AT 1000 AND SAYS NOTHING. There are 516
    // waypoints today and a silent truncation would look exactly like a
    // catalogue that had stopped growing.
    async function loadAll() {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const res = await fetch(restUrl(TABLE, { select: '*', order: 'name.asc' }), {
          headers: authHeaders({ Range: from + '-' + (from + 999) })
        });
        if (!res.ok) throw new Error('Could not read waypoints: ' + await readError(res));
        const page = await res.json();
        out.push(...page);
        if (page.length < 1000) break;
      }
      state.rows = out;
      probeColumns(out[0]);
    }

    function probeColumns(row) {
      if (!row) return;
      cols.country = Object.prototype.hasOwnProperty.call(row, 'country');
      cols.source_url = Object.prototype.hasOwnProperty.call(row, 'source_url');
      cols.latlon = Object.prototype.hasOwnProperty.call(row, 'lat')
                 && Object.prototype.hasOwnProperty.call(row, 'lon');
      el('countryField').hidden = !cols.country;
      el('sourceField').hidden = !cols.source_url;
      el('latField').hidden = !cols.latlon;
      el('lonField').hidden = !cols.latlon;
    }

    /* ---- what a row is missing ------------------------------------------- */

    // `Number(null)` IS 0 AND `isFinite(0)` IS TRUE, so a row with no point
    // reads as a row at latitude zero to any check written the short way. This
    // project has paid for that twice; hasPoint asks the question properly.
    function hasPoint(w) {
      const lat = w.lat, lon = w.lon;
      if (lat === null || lat === undefined || lat === '') return false;
      if (lon === null || lon === undefined || lon === '') return false;
      const a = Number(lat), b = Number(lon);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
      if (a === 0 && b === 0) return false;
      return true;
    }

    // ---- WHAT COUNTS AS AN ISSUE ----------------------------------------
    //
    // ONE RULE TO BEGIN WITH, and the list is meant to grow. Each carries the
    // sentence a person acts on rather than a category: the Events room learned
    // that a finding explaining the product is a paragraph to read before you
    // can do anything, and a call to action is not.
    //
    // NOTHING IS STORED. `public.waypoints` has no `issues` column -- that
    // flag is the Events table's -- so this is computed over the rows in
    // memory on every render. What that costs, plainly: a finding cannot be
    // found from anywhere but this room, and there is no record that anybody
    // looked. Every rule here is derivable from the row itself, so nothing is
    // lost by recomputing it; the day one is not, it needs a column.
    const CHECK_RULES = [
      {
        key: 'no-point',
        // The row cannot be drawn on the map, cannot be measured against
        // another, and cannot be walked to. It is the one gap that stops a
        // waypoint being usable at all.
        test: (w) => cols.latlon && !hasPoint(w),
        say: 'Add coordinates. Open it and press Fill, or type them in.'
      }
    ];

    function reviewReasons(w) {
      const out = [];
      CHECK_RULES.forEach((rule) => {
        try { if (rule.test(w)) out.push(rule.say); }
        // A BUG IN ONE RULE MUST NOT TELL SOMEBODY THEIR TABLE IS FINE.
        catch (err) { console.error('check rule ' + rule.key + ' threw', err); }
      });
      return out;
    }

    function isInReview(w) { return reviewReasons(w).length > 0; }

    function issueCount() { return state.rows.filter(isInReview).length; }

    function missingBits(w) {
      const out = [];
      if (!clean(w.address)) out.push('address');
      if (!clean(w.city)) out.push('city');
      if (cols.latlon && !hasPoint(w)) out.push('point');
      if (!clean(w.description)) out.push('description');
      if (cols.source_url && !clean(w.source_url)) out.push('source');
      return out;
    }

    function placeOf(w) {
      return [clean(w.city), clean(w.state), cols.country ? clean(w.country) : '']
        .filter(Boolean).join(', ');
    }

    /* ---- filtering ------------------------------------------------------- */

    function matches(w) {
      if (state.reviewOnly && !isInReview(w)) return false;
      if (state.place !== 'any' && placeOf(w) !== state.place) return false;
      if (!state.q) return true;
      const hay = [w.name, w.address, w.city, w.state, w.country, w.zip, w.description]
        .map((v) => clean(v).toLowerCase()).join(' ');
      return hay.includes(state.q);
    }

    function visible() { return state.rows.filter(matches); }

    function anyFilterOn() { return !!(state.q || state.place !== 'any' || state.reviewOnly); }

    /* ---- the place picker ------------------------------------------------ */

    // BUILT FROM THE ROWS, NEVER FROM A CATALOGUE. This room stopped reading
    // public.cities on 2026-08-29: a waypoint carries its own place, so the
    // only places worth offering are the ones some waypoint actually claims.
    // An empty result is not a state this control can produce.
    let placeSig = '';
    function renderPlaceFilter() {
      const counts = new Map();
      state.rows.forEach((w) => {
        const p = placeOf(w) || '(nowhere named)';
        counts.set(p, (counts.get(p) || 0) + 1);
      });
      const places = [...counts.keys()].sort((a, b) => a.localeCompare(b));
      const sig = places.join('|');
      // REBUILT ONLY WHEN THE OPTION SET CHANGES. Every keystroke renders, and
      // rebuilding a select under the pointer shuts it while somebody is
      // reading it.
      if (sig === placeSig) return;
      placeSig = sig;
      const sel = el('placeFilter');
      sel.textContent = '';
      const any = document.createElement('option');
      any.value = 'any';
      any.textContent = 'anywhere (' + state.rows.length + ')';
      sel.appendChild(any);
      places.forEach((p) => {
        const o = document.createElement('option');
        o.value = p;
        o.textContent = p + '  (' + counts.get(p) + ')';
        sel.appendChild(o);
      });
      // A STORED CHOICE THE LIBRARY NO LONGER HOLDS FALLS BACK TO ANY, rather
      // than leaving the picker naming a place with nothing under it.
      if (state.place !== 'any' && !counts.has(state.place)) state.place = 'any';
      sel.value = state.place;
    }

    /* ---- rendering ------------------------------------------------------- */

    function render() {
      renderPlaceFilter();
      paintCheckBtn();
      const rows = visible();
      el('listCount').textContent = rows.length === state.rows.length
        ? state.rows.length + ' waypoints'
        : rows.length + ' of ' + state.rows.length + ' waypoints';

      const clearBtn = el('clearBtn');
      clearBtn.setAttribute('aria-disabled', anyFilterOn() ? 'false' : 'true');
      clearBtn.title = anyFilterOn() ? 'Put the search box and the picker back.' : 'Nothing is filtered.';

      const list = el('list');
      list.textContent = '';
      if (!state.authed) {
        list.appendChild(emptyNode('Sign in with an admin account to load waypoints.'));
        renderMap([]);
        return;
      }
      if (!rows.length) {
        list.appendChild(emptyNode(state.rows.length
          ? 'Nothing matches. Press Clear to see all ' + state.rows.length + '.'
          : 'No waypoints yet. Press Waypoint to add one.'));
        renderMap([]);
        return;
      }
      rows.forEach((w) => list.appendChild(rowNode(w)));
      renderMap(rows);
    }

    function emptyNode(text) {
      const p = document.createElement('p');
      p.className = 'wp-empty';
      p.textContent = text;
      return p;
    }

    function rowNode(w) {
      const row = document.createElement('div');
      row.className = 'wp';
      row.dataset.wpid = String(w.wpid);
      row.addEventListener('click', (e) => {
        // The source is a real link out; clicking it must not also open the
        // editor underneath.
        if (e.target.closest('a')) return;
        openEditor(w);
      });

      const name = document.createElement('span');
      name.className = 'wp-name';
      // A NAME IS A LINK TO ITS SOURCE where there is one, and plain text where
      // there is not -- an anchor that goes nowhere invites the click. Whether
      // we recorded a source is not a fact about the PLACE, so it must not
      // change how the place reads in a list.
      const src = cols.source_url ? clean(w.source_url) : '';
      let ok = false;
      if (src) {
        try {
          const u = new URL(src);
          ok = u.protocol === 'http:' || u.protocol === 'https:';
        } catch (e) { ok = false; }
      }
      if (ok) {
        const a = document.createElement('a');
        a.href = src;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = clean(w.name) || '(unnamed)';
        a.title = 'Open the source: ' + src;
        name.appendChild(a);
      } else {
        name.textContent = clean(w.name) || '(unnamed)';
        name.title = src ? 'The source is not a web address.' : 'No source recorded.';
      }
      row.appendChild(name);

      const where = document.createElement('span');
      where.className = 'wp-where';
      where.textContent = placeOf(w);
      row.appendChild(where);

      const tags = document.createElement('span');
      tags.className = 'wp-tags';
      // THE `missing` TAG STAYS FOR THE GAPS NO RULE COVERS. It reports the
      // other five -- address, city, description, source -- and drops the one
      // the check now draws in words underneath, or the row would say the same
      // thing twice a few pixels apart.
      const gaps = missingBits(w).filter((g) => g !== 'point');
      if (gaps.length) {
        const t = document.createElement('span');
        t.className = 'wp-tag wp-tag--missing';
        t.textContent = 'missing';
        t.title = 'No ' + gaps.join(', no ') + '.';
        tags.appendChild(t);
      }
      row.appendChild(tags);

      const why = reviewReasons(w);
      if (why.length) {
        row.classList.add('is-review');
        why.forEach((line) => {
          const p = document.createElement('p');
          p.className = 'wp-note';
          p.textContent = line;
          row.appendChild(p);
        });
      }
      return row;
    }

    /* ---- the map --------------------------------------------------------- */

    let leafletPromise = null;
    function ensureLeaflet() {
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise((resolve) => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(css);
        const js = document.createElement('script');
        js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        // RESOLVES EVEN ON ERROR. A map that will not load is not a broken
        // page: the list is the point and it is all still there.
        js.onload = () => resolve(window.L || null);
        js.onerror = () => resolve(null);
        document.head.appendChild(js);
      });
      return leafletPromise;
    }

    let map = null;
    let layer = null;
    let lastFit = '';

    async function renderMap(rows) {
      const located = rows.filter(hasPoint);
      el('mapCount').textContent = located.length
        ? located.length + ' with a point'
        : 'nothing to draw';
      if (!located.length) {
        if (layer) layer.clearLayers();
        return;
      }
      const L = await ensureLeaflet();
      if (!L) { note.textContent = 'The map could not load. The list below is unaffected.'; return; }
      if (!map) {
        map = L.map('map', { scrollWheelZoom: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        layer = L.layerGroup().addTo(map);
      }
      layer.clearLayers();
      const pts = [];
      located.forEach((w) => {
        const ll = [Number(w.lat), Number(w.lon)];
        pts.push(ll);
        // THE MAP READS, IT DOES NOT WRITE. A pin was draggable, and a drag is
        // the one gesture with no undo and no confirmation: a nudge nobody
        // meant moved a waypoint and saved it. The coordinates are edited in
        // the form, where the value is visible before it is committed.
        const marker = L.marker(ll, {
          icon: L.divIcon({ className: '', html: '<div class="wp-pin"></div>', iconSize: [14, 14] })
        });
        marker.bindTooltip(clean(w.name) || '(unnamed)');
        layer.addLayer(marker);
      });
      // REFIT ONLY WHEN THE SET OF POINTS CHANGES. Yanking the viewport while
      // somebody is reading the map is what makes a map useless.
      const sig = pts.map((p) => p.join(',')).join('|');
      if (sig !== lastFit) {
        lastFit = sig;
        map.fitBounds(L.latLngBounds(pts), { padding: [28, 28], maxZoom: 15 });
      }
    }

    /* ---- writing --------------------------------------------------------- */

    async function patch(wpid, body) {
      const res = await fetch(restUrl(TABLE, { wpid: 'eq.' + wpid }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('Nothing was saved: ' + await readError(res));
      const rows = await res.json();
      // POSTGREST ANSWERS 200 WITH AN EMPTY ARRAY WHEN RLS REFUSES A WRITE, so
      // without reading the row back a refused save reports success and the
      // page shows a value the table never took.
      if (!rows.length) throw new Error('The database refused that write. Check you are signed in as an admin.');
      const saved = rows[0];
      const at = state.rows.findIndex((r) => String(r.wpid) === String(wpid));
      if (at !== -1) state.rows[at] = saved;
      return saved;
    }

    /* ---- the editor ------------------------------------------------------ */

    function openEditor(row) {
      state.editing = row ? Object.assign({}, row) : null;
      const isNew = !row;
      el('dlgTitle').textContent = isNew ? 'New waypoint' : 'Waypoint';
      el('dlgSub').textContent = isNew ? '' : 'WPID ' + row.wpid;
      el('dlgMsg').textContent = '';
      FIELDS.forEach((f) => {
        const input = el('f' + f.split('_').map((p) => p[0].toUpperCase() + p.slice(1)).join(''));
        if (input) input.value = row ? clean(row[f]) : '';
      });
      el('fCreated').textContent = row && row.created_at ? String(row.created_at).slice(0, 10) : '-';
      // ai_model IS READ-ONLY AND THAT IS THE POINT. It is the only trace of
      // which model produced a bad address, and "what wrote this" is the first
      // question asked of a row that looks wrong.
      el('fModel').textContent = row && clean(row.ai_model) ? clean(row.ai_model) : 'a person';
      // DELETE IS HIDDEN ON A ROW THAT DOES NOT EXIST YET.
      el('deleteBtn').hidden = isNew;
      el('dlg').classList.add('is-open');
      el('fName').focus();
    }

    function closeEditor() {
      el('dlg').classList.remove('is-open');
      state.editing = null;
    }

    function readForm() {
      const out = {};
      FIELDS.forEach((f) => {
        if (f === 'country' && !cols.country) return;
        if (f === 'source_url' && !cols.source_url) return;
        if ((f === 'lat' || f === 'lon') && !cols.latlon) return;
        const input = el('f' + f.split('_').map((p) => p[0].toUpperCase() + p.slice(1)).join(''));
        if (!input) return;
        out[f] = clean(input.value) || null;
      });
      if (cols.latlon) {
        // A PAIR OR NOTHING. A lat with no lon is not half a point, and a row
        // carrying one of the two would read as located wherever the map looked
        // at it. Clearing both writes NULL, which is what "not located yet"
        // already means.
        const lat = Number(out.lat), lon = Number(out.lon);
        const both = out.lat !== null && out.lon !== null
          && Number.isFinite(lat) && Number.isFinite(lon)
          && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
        out.lat = both ? lat : null;
        out.lon = both ? lon : null;
      }
      return out;
    }

    async function saveEditor() {
      const body = readForm();
      if (!body.name) {
        el('dlgMsg').textContent = 'A waypoint needs a name. It is the only thing a place cannot be without.';
        return;
      }
      if (cols.latlon) {
        const one = clean(el('fLat').value), two = clean(el('fLon').value);
        if ((one && !two) || (two && !one)) {
          el('dlgMsg').textContent = 'Coordinates go in as a pair. Fill both, or empty both to clear the point.';
          return;
        }
      }
      el('dlgMsg').textContent = '';
      el('saveBtn').disabled = true;
      try {
        if (state.editing && state.editing.wpid) {
          await patch(state.editing.wpid, body);
          setStatus('Saved ' + body.name + '.', 'success');
        } else {
          const res = await fetch(restUrl(TABLE), {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error('Nothing was created: ' + await readError(res));
          const rows = await res.json();
          if (!rows.length) throw new Error('The database refused that insert. Check you are signed in as an admin.');
          state.rows.push(rows[0]);
          state.rows.sort((a, b) => clean(a.name).localeCompare(clean(b.name)));
          setStatus('Added ' + body.name + '.', 'success');
        }
        closeEditor();
        render();
      } catch (err) {
        el('dlgMsg').textContent = err.message;
      } finally {
        el('saveBtn').disabled = false;
      }
    }

    async function deleteEditing() {
      const row = state.editing;
      if (!row || !row.wpid) return;
      const name = clean(row.name) || 'this waypoint';
      if (!window.confirm('Delete ' + name + ' for good? This cannot be undone.')) return;
      el('deleteBtn').disabled = true;
      try {
        const res = await fetch(restUrl(TABLE, { wpid: 'eq.' + row.wpid }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=representation' })
        });
        if (!res.ok) throw new Error('Nothing was deleted: ' + await readError(res));
        const gone = await res.json();
        // Read the rows back, not the id asked for: an empty array is RLS
        // refusing, and a card that vanished on a refusal comes straight back
        // on the next reload.
        if (!gone.length) throw new Error('The database refused that delete. Check you are signed in as an admin.');
        state.rows = state.rows.filter((r) => String(r.wpid) !== String(row.wpid));
        closeEditor();
        render();
        setStatus('Deleted ' + name + '.', 'success');
      } catch (err) {
        el('dlgMsg').textContent = err.message;
      } finally {
        el('deleteBtn').disabled = false;
      }
    }

    /* ---- wiring ---------------------------------------------------------- */

    el('addBtn').addEventListener('click', () => openEditor(null));
    el('saveBtn').addEventListener('click', saveEditor);
    el('closeBtn').addEventListener('click', closeEditor);
    el('deleteBtn').addEventListener('click', deleteEditing);
    el('dlg').addEventListener('click', (e) => { if (e.target === el('dlg')) closeEditor(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && el('dlg').classList.contains('is-open')) closeEditor();
    });

    el('q').addEventListener('input', (e) => {
      state.q = clean(e.target.value).toLowerCase();
      render();
    });
    el('placeFilter').addEventListener('change', (e) => {
      state.place = e.target.value || 'any';
      render();
    });
    el('clearBtn').addEventListener('click', () => {
      if (!anyFilterOn()) { setStatus('Nothing is filtered.', 'error'); return; }
      state.q = '';
      state.place = 'any';
      state.reviewOnly = false;
      el('q').value = '';
      el('placeFilter').value = 'any';
      render();
      setStatus('Filters cleared.', 'success');
    });

    // THE FACE NAMES WHAT THE PRESS WILL DO, and carries the count. One
    // control, two states -- `Check (137)`, then `Show all`.
    function paintCheckBtn() {
      const btn = el('checkBtn');
      if (!btn) return;
      const n = issueCount();
      btn.textContent = state.reviewOnly ? 'Show all' : (n ? 'Check (' + n + ')' : 'Check');
      btn.title = state.reviewOnly
        ? 'Show every waypoint again.'
        : (n ? 'Show only the ' + n + ' with something wrong.'
             : 'Nothing is wrong with any of them.');
    }

    el('checkBtn').addEventListener('click', () => {
      if (!state.authed) { setStatus('Sign in with an admin account first.', 'error'); return; }
      if (state.reviewOnly) {
        state.reviewOnly = false;
        render();
        setStatus('Showing every waypoint again.', 'success');
        return;
      }
      // EVERY FILTER COMES OFF FIRST. The check reads `state.rows`, so it was
      // never narrowed -- but its ANSWER would be: a search left in the box
      // would hide faulty rows from the very list the count promises.
      state.q = '';
      state.place = 'any';
      el('q').value = '';
      el('placeFilter').value = 'any';
      const n = issueCount();
      state.reviewOnly = n > 0;
      render();
      setStatus(n
        ? 'Filters cleared, and showing the ' + n + ' of ' + state.rows.length
          + ' with something wrong. Press Show all for the rest.'
        : 'Checked all ' + state.rows.length + '. Nothing wrong with any of them.',
        'success');
    });

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading waypoints...');
        try {
          await loadAll();
          render();
          setStatus('');
        } catch (err) {
          console.error(err);
          // The fetch and the render are separate try blocks on purpose: a
          // rendering bug reporting itself as "could not read the table" sends
          // you looking at the data instead of the code.
          setStatus(err.message || 'Could not load waypoints.', 'error');
        }
      },
      onSignedOut: () => {
        state.authed = false;
        state.rows = [];
        render();
        setStatus('Sign in with an admin account.');
      }
    });
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    // Nothing paints until this runs: the body is mc-auth-protected, and
    // admin-shell.css hides every child except the sign-in root that init()
    // creates. Without it the page is a blank screen with no way in.
    adminAuth.init();
  </script>
</body>
</html>
