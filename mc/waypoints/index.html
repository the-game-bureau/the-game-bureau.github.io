<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WAYPOINTS | THE GAME BUREAU</title>
  <link rel="icon" href="../../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --stack-gap: 14px;
      --panel-radius: 10px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }

    /* ── Stock Room header lockup: gear watermark + THE GAME BUREAU eyebrow + big
       title + substat, matching /shop/admin/. ── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    /* The gear art, mirrored — a faint watermark sunk into the page grid at the
       left of the header, bleeding off the left edge. */
    .stockroom-gear {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%) scaleX(-1);
      width: 184px;
      height: 184px;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-gear .header-gear-atmosphere,
    .stockroom-gear .header-gear-halo { display: none; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow:
        0 0 3px var(--paper-base),
        0 0 3px var(--paper-base),
        0 0 5px var(--paper-base);
    }
    .stockroom-title {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .stockroom-titlecol .stockroom-substat {
      margin: 3px 0 0;
      min-height: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-substat.error { color: var(--danger); }
    .stockroom-substat.success { color: var(--success); }
    .stockroom-head-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend {
      margin: 0 0 18px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.warn { color: var(--danger); border-color: rgba(160,63,45,0.45); }
    .btn.warn:hover { background: rgba(160,63,45,0.08); border-color: var(--danger); }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .signout-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar .btn { flex: 0 0 auto; white-space: nowrap; }
    /* Add-waypoints row: the Stock Room's command-bar look — a soft panel with a
       mono label, dividers between groups, and quiet "ghost" reference links. */
    .command-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      margin: -6px 0 0;
      padding: 10px 12px;
      background: #eef0f4;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .command-bar-label {
      flex: 0 0 auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .command-bar-divider {
      width: 1px;
      align-self: stretch;
      min-height: 24px;
      margin: 0 2px;
      background: var(--line);
    }
    .command-bar .btn {
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 12px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    /* Reference links read quieter than the create actions. */
    .command-bar .btn.ghost {
      background: transparent;
      border-style: dashed;
      color: var(--muted);
    }
    .command-bar .btn.ghost:hover { color: var(--ink); border-color: var(--accent); }

    /* Mode toggle on the "With AI" picker: OpenStreetMap vs AI prompt → SQL. */
    .prompt-modes { display: flex; flex-wrap: wrap; gap: 6px; }
    .prompt-mode.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .prompt-mode.is-active:hover { background: rgba(var(--bic-blue-rgb), 0.85); }

    /* Options row on the "With AI" prompt picker (Stops count + keywords). */
    .prompt-opts { display: flex; flex-wrap: wrap; gap: 10px; }
    .prompt-opt {
      display: grid;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .prompt-opt--wide { flex: 1 1 220px; }
    .prompt-opt input {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
    }
    .prompt-opt input[type="number"] { width: 96px; }

    .toolbar input {
      flex: 1 1 80px;
      min-width: 0;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    .toolbar select {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }


    .panel {
      display: grid;
      gap: 12px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }

    /* Navigation group (lives in the card action row, left of Delete). */
    .wp-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(var(--bic-blue-rgb), 0.04);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .wp-pager-status { margin: 0; text-align: center; min-width: 7em; }
    .wp-count-total { font-weight: 700; }
    .wp-count-num { cursor: pointer; text-decoration: underline dotted; color: var(--accent); font-weight: 700; }
    .wp-count-num:hover { text-decoration-style: solid; }
    .wp-count-input {
      width: 3.5em;
      padding: 1px 4px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      text-align: center;
    }
    /* Saved/Unsaved badge in the card's lower-right, under the description. */
    .wp-card-foot { display: flex; justify-content: flex-end; margin-top: 2px; }
    .wp-saved { font-weight: 700; letter-spacing: 0.02em; font-size: 0.85rem; }

    .wp-list { display: grid; gap: 12px; }

    .wp-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    /* The cursor card inside a page of ten — what Back/Next/Random move, and
       what the nav row's "N of M" count refers to. */
    .wp-card.is-current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.12); }

    /* Toolbar pager: ‹ Page 3 of 6 › */
    .wp-pager { display: inline-flex; align-items: center; gap: 6px; }
    .wp-pager[hidden] { display: none; }
    .wp-pager .btn { min-width: 34px; padding: 0 8px; font-size: 1rem; line-height: 1; }
    .wp-pager-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .wp-card.is-dirty {
      border-color: rgba(194,55,55,0.55);
      box-shadow: 0 0 0 3px rgba(194,55,55,0.08);
    }
    .wp-card.is-saving { opacity: 0.68; }

    .wp-card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .wp-card-head > .wp-nav { justify-self: center; }
    .wp-card-head > .card-actions { justify-self: end; }

    .wp-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .wp-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .wp-id {
      font-family: "IBM Plex Mono", monospace;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .field-grid { display: grid; gap: 10px; }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .field-row--3 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.7fr) minmax(0, 0.9fr); }
    .field-row--citystate { grid-template-columns: minmax(0, 2fr) minmax(0, 0.8fr); }

    .field { display: grid; gap: 5px; }
    /* A field whose input shares a row with a button (e.g. Name + Translate). */
    .field-line { display: flex; gap: 6px; align-items: center; }
    .field-line input { flex: 1; min-width: 0; }

    .field label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .field select { min-height: 38px; }
    .wp-citystate-control { display: flex; gap: 6px; align-items: center; }
    .wp-citystate-control select { flex: 1 1 auto; min-width: 0; }
    /* Was a 38px square holding a single '+'; 'NEW' needs room to breathe. */
    .wp-city-add { flex: 0 0 auto; width: auto; padding: 0 10px; white-space: nowrap; }
    .field textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.4;
    }

    .field-hint {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }


    .wp-card-body {
      display: grid;
      grid-template-columns: minmax(200px, 300px) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .wp-map-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .wp-map-wrap .wp-map-preview { flex: 1; }
    .wp-map-preview {
      width: 100%;
      height: 100%;
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(var(--bic-blue-rgb), 0.04);
      cursor: zoom-in;
    }
    .wp-map-preview .leaflet-container { width: 100%; height: 100%; }
    /* Magnifying-glass cursor over the map (overrides Leaflet's grab cursor). */
    .wp-map-preview .leaflet-grab,
    .wp-map-preview .leaflet-interactive,
    .wp-map-preview .leaflet-container { cursor: zoom-in; }
    .wp-map-preview .leaflet-control a { cursor: pointer; }
    /* Street View button (a Leaflet bar control) */
    .wp-map-preview a.wp-sv-btn {
      display: block;
      width: auto;
      padding: 0 8px;
      height: 28px;
      line-height: 28px;
      background: #fff;
      font: 700 0.72rem/28px 'Space Grotesk', system-ui, sans-serif;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .wp-map-preview a.wp-sv-btn:hover { background: #f3f4f6; }
    @keyframes wp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .wp-blink { animation: wp-blink 0.45s ease-in-out infinite; }
    .wp-map-empty {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 10px;
    }

    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    /* Above Leaflet's panes/controls (which reach z-index ~1000) so the map and
       its zoom buttons sit behind the dialog. */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15,23,42,0.42);
    }
    .modal-backdrop[hidden] { display: none; }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2001;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(560px, calc(100vw - 32px));
      /* Tall enough that a form shows all of its fields without scrolling. */
      max-height: min(88vh, calc(100vh - 32px));
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(15,23,42,0.28);
      overflow: hidden;
    }
    .modal[hidden] { display: none; }

    .modal-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(var(--bic-blue-rgb), 0.06);
    }
    .modal-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .modal-status { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

    .prompt-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .prompt-search { display: flex; gap: 8px; }
    .prompt-search input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .prompt-search select {
      flex: 0 0 auto;
      max-width: 40%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }
    .zip-list { display: grid; gap: 5px; }
    .zip-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      font: inherit;
    }
    .zip-row:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.5);
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .zip-code { font-weight: 800; }
    .zip-desc { color: var(--muted); font-size: 0.82rem; }
    .prompt-text {
      width: 100%;
      /* Fill the taller dialog rather than sitting in a short box inside it. */
      min-height: 62vh;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      padding: 12px;
      font: 0.78rem/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: var(--ink, #1e293b);
      background: #fff;
      white-space: pre-wrap;
    }
    .prompt-text:focus { outline: none; }

    /* The manual add form is a single narrow column — size the lightbox to it. */
    #manualDialog { width: min(560px, calc(100vw - 32px)); }
    #manualBody { padding: 14px; }
    /* With AI modal: comfortable for the prompt textarea and the results list. */
    /* Wide enough for Stops + Keywords + Source URL on one row. */
    #promptDialog { width: min(760px, calc(100vw - 32px)); }
    /* "Add selected" sits at the foot of the OpenStreetMap results, staying put
       above the scrolling pick-list. */
    .pick-foot {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      padding: 10px 0 2px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 45%);
    }
    .pick-foot .btn { min-width: 170px; }
    .pick-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pick-tools a { font-size: 0.8rem; cursor: pointer; color: var(--accent); text-decoration: underline; }
    .pick-list { display: grid; gap: 5px; }
    .pick-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }
    .pick-row.dup { background: rgba(194, 55, 55, 0.06); border-color: rgba(194, 55, 55, 0.4); }
    .pick-row input[type="checkbox"] { margin-top: 3px; flex: 0 0 auto; width: 16px; height: 16px; cursor: pointer; }
    .pick-main { display: flex; flex-direction: column; min-width: 0; gap: 2px; flex: 1; }
    .pick-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .pick-sub { font-size: 0.76rem; color: var(--muted); word-break: break-word; }
    .pick-dupnote { font-size: 0.74rem; color: #c23737; }

    .near-list {
      overflow: auto;
      padding: 10px 12px;
      display: grid;

  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const TABLE = 'waypoints';
    const PK = 'wpid';
    // Columns read from the table. wpid is the identity primary key.
    // waypoints.lat / waypoints.lon were dropped from the table on 2026-07-27.
    // Coordinates still exist at RUNTIME — geocoded from the address/city and
    // held on the in-memory row so the map can centre — but they are never
    // selected and never written. PostgREST 400s
    // on an unknown column, so re-adding them here breaks the whole page load.
    const WAYPOINT_COLUMNS = ['wpid', 'city', 'state', 'zip', 'address', 'name', 'description'];
    // Editable text fields (everything except the auto-number PK and lat/lon).
    const EDITABLE_FIELDS = ['name', 'city', 'state', 'zip', 'address', 'description'];
    // Fields actually persisted on save / used for change detection — the editable
    // text fields plus the stored exact coordinates (lat/lon are not form fields).
    const SAVED_FIELDS = EDITABLE_FIELDS.concat(['lat', 'lon']);
    const round6 = (n) => Math.round(n * 1e6) / 1e6;

    // --- DOM refs ------------------------------------------------------------
    const pageStatus = document.getElementById('pageStatus');
    const signOutBtn = document.getElementById('signOutBtn');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const cityFilterSelect = document.getElementById('cityFilterSelect');
    // Declared up here with the other element lookups, not down in the wiring
    // section: updateSummary() calls updateClearButton() on the very first
    // render, which would hit the temporal dead zone on a `const` defined later.
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const sortSelect = document.getElementById('sortSelect');
    // Enabled whenever pressing it would actually change something — a filter,
    // a non-default sort, or a page other than the first. It used to gate on
    // filters alone, so on an unfiltered page 2 the button sat there greyed out
    // and read as broken.
    function updateClearButton() {
      if (!clearFiltersBtn) return;
      clearFiltersBtn.disabled = !isFiltered() && state.sort === DEFAULT_SORT && state.page === 0;
    }
    const newBtn = document.getElementById('newBtn');
    const nearBtn = document.getElementById('nearBtn');
    const wpList = document.getElementById('wpList');

    // Declared above `state` because the state initializer reads it at load.
    const DEFAULT_SORT = 'wpid_desc';

    const state = {
      rows: [],
      authed: false,
      filter: '',
      fieldFilter: '',  // dropdown filter: '', 'no_address', 'no_zip', 'no_city', 'no_description'
      cityFilter: '',   // lowercased city key; '' means every city
      sort: DEFAULT_SORT,
      page: 0,          // 0-based page of PAGE_SIZE cards
      // The cursor: what Back/Next/Random move and what "jump to N" targets. It
      // is no longer the only thing on screen — a page of PAGE_SIZE renders
      // around it — but it stays the anchor for navigation.
      randomId: null,
      dirtyIds: new Set(),
      savingIds: new Set()
    };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading waypoints...');
        // Warm the city catalog for the chooser, then repaint the city filter so
        // venue-only cities grey out once the catalog lands.
        loadCatalogCities().then(renderCityFilter).catch(() => {});
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.rows = [];
        state.dirtyIds.clear();
        state.savingIds.clear();
        render();
        setStatus('Sign in with an admin account.');
      }
    });

    // The substat is normally the count line ("38 waypoints · 1–10 showing").
    // setStatus borrows it for a save confirmation or an error, then hands it
    // back — otherwise the first message of the session would sit there forever
    // and the count would be gone until the next render.
    let statusRestoreTimer = 0;
    function setStatus(text, kind) {
      if (!pageStatus) return;
      window.clearTimeout(statusRestoreTimer);
      if (!text) { renderPageTitle(); return; }
      pageStatus.textContent = text;
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
      // Errors linger; everything else is a quick acknowledgement.
      statusRestoreTimer = window.setTimeout(renderPageTitle, kind === 'error' ? 8000 : 3500);
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') {
        return adminAuth.authHeaders(extra || {});
      }
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
        try { await adminAuth.ensureFreshSession(); } catch (error) {}
      }
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (error) {
          return text;
        }
      } catch (error) {
        return fallback;
      }
    }

    // Reload from the DB. Pass keepId to stay on (feature) a specific waypoint
    // after a save; otherwise feature a fresh random one.
    async function refresh(keepId) {
      try {
        // Always show a state in the list — a blank panel during a slow load or a
        // silent failure reads as "nothing's here".
        if (wpList && !wpList.children.length) {
          wpList.appendChild(emptyNode('Loading waypoints…'));
        }
        await ensureFreshSession();
        // TgbRest.fetchAll paginates past PostgREST's 1000-row cap.
        const url = restUrl(TABLE, { select: WAYPOINT_COLUMNS.join(','), order: PK + '.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        state.rows = normalizeRows(rows);
        rebuildPristine();
        state.dirtyIds.clear();
        state.savingIds.clear();
        renderCityFilter();
        if (keepId != null && findRow(keepId)) {
          state.randomId = keepId;
          render();
        } else {
          state.randomId = highestId();
          render();
          // No "Loaded N waypoints" message any more — the count line under the
          // title says the same thing and does not time out.
        }
      } catch (error) {
        console.error(error);
        const msg = error && error.message ? error.message : 'Load failed.';
        setStatus(msg, 'error');
        // Surface the failure IN the list, not just the small status line, so an
        // auth/session error doesn't look like an empty waypoint set.
        if (wpList) {
          wpList.innerHTML = '';
          const isAuth = /jwt|401|permission|auth|sign/i.test(msg);
          wpList.appendChild(emptyNode(
            (isAuth ? 'Could not load waypoints — sign-in issue. ' : 'Could not load waypoints. ') +
            msg + ' · Reload the page (Ctrl+Shift+R).'
          ));
        }
        updateSummary();
      }
    }

    function normalizeRows(rows) {
      return (Array.isArray(rows) ? rows : []).map(normalizeRow);
    }

    function normalizeRow(row) {
      const r = row && typeof row === 'object' ? row : {};
      return {
        wpid: r.wpid == null ? '' : String(r.wpid),
        city: String(r.city || ''),
        state: String(r.state || ''),
        zip: String(r.zip || ''),
        address: String(r.address || ''),
        name: String(r.name || ''),
        description: String(r.description || ''),
        // Runtime-only, never round-tripped to the database: filled in by
        // geocoding so the map can centre. Always null straight off a fetch.
        lat: (r.lat == null || r.lat === '') ? null : Number(r.lat),
        lon: (r.lon == null || r.lon === '') ? null : Number(r.lon)
      };
    }

    function cleanText(value) {
      return String(value == null ? '' : value).trim();
    }

    // PATCH/POST payload — editable columns plus the stored exact coordinates.
    // Only EDITABLE_FIELDS go to the database. lat/lon are deliberately absent —
    // the columns no longer exist, and sending them makes PostgREST reject the
    // whole write.
    function payloadFromRow(row) {
      const payload = {};
      EDITABLE_FIELDS.forEach((field) => { payload[field] = cleanText(row[field]) || null; });
      return payload;
    }

    // Single choke point for insert payloads, which are assembled from geocoding
    // results and can pick up coordinates along the way.
    function stripDroppedColumns(payload) {
      if (payload && typeof payload === 'object') { delete payload.lat; delete payload.lon; }
      return payload;
    }

    async function patchRow(wpid, row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not save waypoint.'));
      const rows = await response.json();
      const fresh = Array.isArray(rows) && rows[0] ? rows[0] : null;
      return fresh ? normalizeRow(fresh) : normalizeRow(Object.assign({}, findRow(wpid), row));
    }

    // Insert one waypoint (editable fields only; wpid is trigger-assigned).
    async function postWaypoint(row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, {}), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add waypoint.'));
      const rows = await response.json();
      return normalizeRow(Array.isArray(rows) && rows[0] ? rows[0] : {});
    }

    async function saveRow(wpid) {
      const row = findRow(wpid);
      if (!row || state.savingIds.has(wpid)) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Saving ' + displayName(row) + '...');
      try {
        await patchRow(wpid, row);
        state.dirtyIds.delete(wpid);
        // Reload from the DB and stay on this waypoint.
        await refresh(wpid);
        const fresh = findRow(wpid);
        setStatus('Saved ' + (fresh ? displayName(fresh) : ('#' + wpid)) + '.', 'success');
      } catch (error) {
        console.error(error);
        state.savingIds.delete(wpid);
        setStatus(error.message || 'Save failed.', 'error');
        render();
      }
    }

    async function deleteWaypoint(wpid) {
      const row = findRow(wpid);
      if (!row) return;
      if (!window.confirm('Delete waypoint #' + wpid + (row.name ? ' (' + row.name + ')' : '') + '? This cannot be undone.')) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Deleting ' + displayName(row) + '...');
      try {
        await ensureFreshSession();
        const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=minimal' })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not delete waypoint.'));
        state.rows = state.rows.filter((r) => r.wpid !== wpid);
        state.dirtyIds.delete(wpid);
        // render()'s ensureCurrent() re-features the highest remaining waypoint
        // when the deleted one was current.
        render();
        setStatus('Deleted waypoint #' + wpid + '.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Delete failed.', 'error');
      } finally {
        state.savingIds.delete(wpid);
      }
    }

    function findRow(wpid) {
      return state.rows.find((row) => row.wpid === wpid) || null;
    }


    // Snapshot of a row's saved (pristine) field values, for change detection.
    const pristine = new Map();
    function snapshot(row) {
      return SAVED_FIELDS.map((f) => cleanText(row[f])).join('~|~');
    }
    function rebuildPristine() {
      pristine.clear();
      state.rows.forEach((r) => pristine.set(r.wpid, snapshot(r)));
    }

    // Mark dirty only if the row actually differs from its saved snapshot —
    // editing a field back to its original value clears the dirty flag again.
    function markDirty(wpid) {
      const row = findRow(wpid);
      if (row && snapshot(row) === pristine.get(wpid)) {
        state.dirtyIds.delete(wpid);
      } else {
        state.dirtyIds.add(wpid);
      }
      updateCardState(wpid);
      updateSummary();
    }

    function updateField(wpid, field, value) {
      const row = findRow(wpid);
      if (!row) return;
      row[field] = String(value || '');
      // Editing the address invalidates the stored coordinates — drop them so the
      // map re-geocodes the new address (Fill will set precise coords again).
      if (field === 'address') { row.lat = null; row.lon = null; }
      // Moving a waypoint between cities changes the dropdown's options and counts.
      if (field === 'city') renderCityFilter();
      markDirty(wpid);
    }

    // --- Interactive map (Leaflet / OpenStreetMap) ---------------------------
    // The preview is a clickable map: click a spot to search nearby. There is
    // one instance per visible card now, tracked in liveMaps below — the old
    // single `leafletMap` handle was removed with the one-card-at-a-time layout.

    // Ten cards means ten maps, and with lat/lon dropped from the table every
    // map has to GEOCODE its address through Nominatim. Nominatim's usage policy
    // is one request a second and no bulk work, so painting a page of ten
    // eagerly would be abusive and could get us blocked.
    //
    // So maps are lazy and serialized: a card asks for its map only when it
    // scrolls into view, requests queue up, and the queue runs them one at a
    // time with a gap. Scroll fast and you simply get maps filling in behind
    // you; nothing fires for a card you never look at.
    const PAGE_SIZE = 10;
    const GEOCODE_GAP_MS = 1100;   // just over Nominatim's 1/sec ceiling
    const mapQueue = [];
    let mapQueueRunning = false;
    let mapObserver = null;
    const liveMaps = new Map();    // wpid -> Leaflet instance, so we can tear down

    function teardownLazyMaps() {
      if (mapObserver) { try { mapObserver.disconnect(); } catch (error) {} mapObserver = null; }
      mapQueue.length = 0;
      liveMaps.forEach((map) => { try { map.remove(); } catch (error) {} });
      liveMaps.clear();
    }

    async function runMapQueue() {
      if (mapQueueRunning) return;
      mapQueueRunning = true;
      while (mapQueue.length) {
        const job = mapQueue.shift();
        // The card may have been re-rendered or paged away while queued.
        if (!job.container.isConnected) continue;
        try { await setupMap(job.row, job.container); } catch (error) {}
        if (mapQueue.length) await new Promise((r) => setTimeout(r, GEOCODE_GAP_MS));
      }
      mapQueueRunning = false;
    }

    function queueVisibleMaps(page) {
      if (typeof L === 'undefined') return;
      const byId = new Map(page.map((row) => [String(row.wpid), row]));

      const enqueue = (container) => {
        if (container.dataset.mapQueued === 'true') return;
        container.dataset.mapQueued = 'true';
        const row = byId.get(container.dataset.wpid || '');
        if (!row) return;
        mapQueue.push({ row, container });
        runMapQueue();
      };

      const containers = Array.from(wpList.querySelectorAll('[data-map-preview]'));
      if (!('IntersectionObserver' in window)) { containers.forEach(enqueue); return; }

      mapObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          obs.unobserve(entry.target);
          enqueue(entry.target);
        });
      }, { rootMargin: '200px' });   // start a little before it's on screen
      containers.forEach((c) => mapObserver.observe(c));
    }

    async function setupMap(row, containerEl) {
      if (typeof L === 'undefined') return;
      const container = containerEl || wpList.querySelector('[data-map-preview]');
      if (!container) return;
      const key = String(row.wpid);
      const previous = liveMaps.get(key);
      if (previous) { try { previous.remove(); } catch (error) {} liveMaps.delete(key); }
      // Cancel any pending grid work from the previous map so it can't keep the
      // page in a "loading" (busy/hourglass cursor) state.
      container.innerHTML = '';

      // Center priority: stored coordinates -> address -> city/state,
      // else a wide New Orleans view so a blank waypoint is still usable.
      // Was "is this still THE map on the page"; with ten of them the only
      // question is whether this particular card is still mounted.
      const stale = () => !container.isConnected;
      let center = null;

      // 0) stored exact coordinates — most reliable, no geocoding.
      if (Number.isFinite(row.lat) && Number.isFinite(row.lon)) center = { lat: row.lat, lon: row.lon };

      // 2) address (decode coords/Plus Code locally, else geocode it WITH the
      //    city/state/zip so a bare street like "1427 Washington Avenue" doesn't
      //    resolve to the wrong city).
      if (!center) {
        const address = cleanText(row.address);
        center = addressToPoint(address);
        if (!center && address) {
          const q = [address, cleanText(row.city), cleanText(row.state), cleanText(row.zip)].filter(Boolean).join(', ');
          try { center = await geocodeCoords(q); } catch (error) {}
          if (stale()) return;
        }
      }

      // 3) city, state, zip.
      if (!center) {
        const loc = [cleanText(row.city), cleanText(row.state), cleanText(row.zip)].filter(Boolean).join(', ');
        if (loc) { try { center = await geocodeCoords(loc); } catch (error) {} if (stale()) return; }
      }

      // A waypoint that HAS a location but couldn't be geocoded (usually a
      // transient rate-limit) must not show a misleading default — show a retry
      // note. A truly blank waypoint gets the wide New Orleans click-to-create view.
      if (!center && (cleanText(row.address) || cleanText(row.city) || cleanText(row.name))) {
        const ph = document.createElement('div');
        ph.className = 'wp-map-empty';
        ph.textContent = 'Couldn’t place this waypoint on the map — try again in a moment.';
        container.appendChild(ph);
        return;
      }

      const has = !!center;
      const view = center || { lat: 29.9584, lon: -90.0644 };
      // Open located waypoints zoomed in.
      const map = L.map(container, { scrollWheelZoom: false, maxZoom: 22 }).setView([view.lat, view.lon], has ? 19 : 12);
      // Tracked per waypoint so a re-render or a page flip can dispose of every
      // live map — ten leaked Leaflet instances per page adds up fast.
      liveMaps.set(key, map);
      // Satellite (keyless Esri World Imagery) is the default; Streets is a toggle.
      const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 22, maxNativeZoom: 19, attribution: 'Tiles &copy; Esri'
      });
      const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; OpenStreetMap'
      });
      satellite.addTo(map);
      L.control.layers({ 'Satellite': satellite, 'Streets': streets }, null, { position: 'topright' }).addTo(map);
      if (has) L.marker([view.lat, view.lon]).addTo(map);
      // Street View button: opens Google Street View for the current map center.
      const SvControl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function (m) {
          const btn = L.DomUtil.create('a', 'leaflet-bar wp-sv-btn');
          btn.href = '#';
          btn.textContent = 'Street View';
          btn.title = 'Open Google Street View for the center of the map';
          L.DomEvent.on(btn, 'click', L.DomEvent.stop);
          L.DomEvent.on(btn, 'click', () => {
            const c = m.getCenter();
            window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + c.lat + ',' + c.lng, '_blank', 'noopener');
          });
          return btn;
        }
      });
      map.addControl(new SvControl());

      setTimeout(() => { try { map.invalidateSize(); } catch (error) {} }, 0);
    }



    function parseLatLon(text) {
      const m = cleanText(text).match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
      if (!m) return null;
      const lat = parseFloat(m[1]);
      const lon = parseFloat(m[2]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat, lon };
    }

    // Open Location Code (Google Plus Code) decoder — full/global codes only.
    const OLC_ALPHABET = '23456789CFGHJMPQRVWX';
    function decodePlusCode(text) {
      const match = cleanText(text).toUpperCase().replace(/\s+/g, '').match(/[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3}/);
      if (!match) return null;
      const code = match[0];
      if (code.indexOf('+') !== 8 || code.indexOf('0') > -1) return null; // require a full code, no padding
      const digits = code.replace('+', '');
      for (const ch of digits) { if (OLC_ALPHABET.indexOf(ch) === -1) return null; }
      let southLat = 0, westLng = 0, latRes = 400, lngRes = 400, i = 0;
      while (i < digits.length) {
        if (i < 10) {
          latRes /= 20; lngRes /= 20;
          southLat += OLC_ALPHABET.indexOf(digits.charAt(i)) * latRes;
          if (i + 1 < digits.length) westLng += OLC_ALPHABET.indexOf(digits.charAt(i + 1)) * lngRes;
          i += 2;
        } else {
          const d = OLC_ALPHABET.indexOf(digits.charAt(i));
          latRes /= 5; lngRes /= 4;
          southLat += Math.floor(d / 4) * latRes;
          westLng += (d % 4) * lngRes;
          i += 1;
        }
      }
      const lat = (southLat - 90) + latRes / 2;
      const lon = (westLng - 180) + lngRes / 2;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat: parseFloat(lat.toFixed(6)), lon: parseFloat(lon.toFixed(6)) };
    }

    // Coordinates or Plus Code → a precise point, locally (no network).
    function addressToPoint(text) {
      return parseLatLon(text) || decodePlusCode(text) || null;
    }

    // Resolve the Address field to a point: coordinates or a Plus Code, locally.
    function resolveAddressPoint(text) {
      return addressToPoint(text);
    }


    // Geocode-friendly query for Fill. Nominatim is a structured-address matcher,
    // not a business directory — a venue name like "Duckworth's Grill & Taphouse"
    // makes it miss, while the bare street address resolves cleanly. So prefer
    // the address alone; only fall back to the name when there is no address.
    function geocodeQuery(row) {
      const address = cleanText(row.address);
      const zip = cleanText(row.zip);
      if (address) return [address, zip].filter(Boolean).join(', ');
      return [cleanText(row.name), cleanText(row.city), cleanText(row.state), zip].filter(Boolean).join(', ');
    }

    // Ordered lookup queries built from EVERY filled field — richest first, then
    // degrading. Nominatim often needs the venue name dropped to match a street
    // address, so the all-fields query is tried first, then name-less variants.
    function fillQueries(row) {
      const name = cleanText(row.name);
      const address = cleanText(row.address);
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      const zip = cleanText(row.zip);
      const queries = [];
      const add = (...parts) => {
        const q = parts.map(cleanText).filter(Boolean).join(', ');
        if (q && !queries.includes(q)) queries.push(q);
      };
      if (address) {
        add(address, city, state, zip);  // full address + locality + ZIP — most precise
        add(address, zip);               // street address + ZIP
        add(address);                    // street address alone
        add(name, address);              // name + address
      }
      add(name, city, state, zip);       // name + locality + ZIP
      add(city, state, zip);             // locality + ZIP
      add(city, state);                  // locality only
      add(zip);                          // ZIP alone (Nominatim resolves US ZIPs)
      add(name);                         // last resort
      return queries;
    }

    // Try each query in order, returning the first that geocodes. Tolerant of a
    // single bad/rate-limited (non-JSON) response — it just moves to the next.
    async function geocodeFirst(queries) {
      for (let i = 0; i < queries.length; i += 1) {
        if (i > 0) await new Promise((resolve) => setTimeout(resolve, 1100)); // Nominatim ~1 req/sec
        try {
          const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(queries[i])
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&limit=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          if (!res.ok) continue;
          const arr = await res.json();
          if (Array.isArray(arr) && arr.length) return { place: arr[0], query: queries[i] };
        } catch (error) { /* bad/non-JSON response — try the next query */ }
      }
      return null;
    }

    // A precise point from the most authoritative filled field: the Address
    // (coords / Plus Code).
    async function bestPoint(row) {
      // Stored exact coordinates win — no geocoding needed.
      if (Number.isFinite(row.lat) && Number.isFinite(row.lon)) return { lat: row.lat, lon: row.lon };
      let pt = await resolveAddressPoint(cleanText(row.address));
      if (pt) return pt;
      return null;
    }

    // Brief inline feedback on a card button (it sits below the fold, so the
    // top-of-page status line alone is easy to miss).
    function flashButton(button, text) {
      if (!button) return;
      button.textContent = text;
      clearTimeout(button._flashTimer);
      button._flashTimer = setTimeout(() => { button.textContent = 'Fill'; }, 1600);
    }

    // Fill `row` from a geocoded `place` (+ optional precise `point`). With
    // overwrite=false (Fill button) only blank fields are set, keeping existing
    // values. With overwrite=true (map click) every field is cleared and
    // replaced with the location's details. Returns the fields it touched.
    async function fillFieldsFromPlace(row, place, point, overwrite) {
      const addr = place.address || {};
      const lat = point ? point.lat : parseFloat(place.lat);
      const lon = point ? point.lon : parseFloat(place.lon);
      const hasCoords = Number.isFinite(lat) && Number.isFinite(lon);

      const name = cleanText(placeName(place, addr));
      const city = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.suburb || addr.municipality || addr.county);
      const state = cleanText(addr.state);
      const zip = cleanText(addr.postcode);
      // Address is the STREET ONLY (house number + road) — city/state/zip live in
      // their own fields. A street address is always a street address: if the
      // reverse geocode has no street, leave it blank so the "Missing address"
      // filter finds it. It used to fall back to a "lat, lon" string, which put
      // coordinates in a text field nothing could parse, geocode, or show a
      const streetAddress = [cleanText(addr.house_number), cleanText(addr.road)].filter(Boolean).join(' ');
      const address = streetAddress;

      if (overwrite) {
        // Clear-then-fill: replace every field with the clicked location.
        const description = cleanText(await resolveDescription(place, addr, { name: name }));
        row.name = name;
        row.city = city;
        row.state = state;
        row.zip = zip;
        row.address = address;
        row.description = description;
        if (hasCoords) { row.lat = round6(lat); row.lon = round6(lon); }
        return ['name', 'city', 'state', 'zip', 'address', 'description'];
      }

      // Fill blanks only — keep anything already entered.
      const filled = [];
      const setIfBlank = (field, value) => {
        const v = cleanText(value);
        if (v && !cleanText(row[field])) { row[field] = v; filled.push(field); }
      };
      setIfBlank('name', name);
      setIfBlank('city', city);
      setIfBlank('state', state);
      setIfBlank('zip', zip);
      setIfBlank('address', address);
      if (!cleanText(row.description)) {
        const desc = await resolveDescription(place, addr, row);
        if (desc) { row.description = desc; filled.push('description'); }
      }
      // Store the exact coordinates when we don't already have them.
      if (hasCoords && !(Number.isFinite(row.lat) && Number.isFinite(row.lon))) {
        row.lat = round6(lat);
        row.lon = round6(lon);
      }
      return filled;
    }

    // Use EVERY filled field to locate the place, then fill ONLY the blank
    // fields (name, city, state, address, description). Existing values are
    // kept. A precise point (coords / Plus Code) takes priority;
    // otherwise the richest text query is tried first, degrading until one hits.
    async function fillWaypoint(wpid, button) {
      const row = findRow(wpid);
      if (!row) return;
      const geoFields = ['name', 'city', 'state', 'zip', 'address', 'description'];
      const blanks = geoFields.filter((field) => !cleanText(row[field]));
      if (!blanks.length) {
        flashButton(button, 'All set');
        setStatus(displayName(row) + ' is already complete — nothing blank to fill.');
        return;
      }
      const point = await bestPoint(row);
      const queries = fillQueries(row);
      if (!point && !queries.length) {
        flashButton(button, 'Need info');
        setStatus('Fill in a name or address first, then hit Fill.', 'error');
        return;
      }
      if (button) { button.disabled = true; button.textContent = 'Filling…'; }
      try {
        let place;
        if (point) {
          // A precise point (coordinates / Plus Code) wins — reverse-geocode it.
          const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + point.lat + '&lon=' + point.lon
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          place = await res.json();
          if (!place || place.error) {
            flashButton(button, 'No match');
            setStatus('No place found at that point.', 'error');
            return;
          }
        } else {
          // Use every filled field — richest query first, degrading until one hits.
          const found = await geocodeFirst(queries);
          if (!found) {
            flashButton(button, 'No match');
            setStatus('No match found for this waypoint.', 'error');
            return;
          }
          place = found.place;
        }
        const filled = await fillFieldsFromPlace(row, place, point);
        if (!filled.length) {
          flashButton(button, 'No new data');
          setStatus('Found a match, but nothing new to fill.');
          return;
        }
        markDirty(wpid);
        render();
        setStatus('Filled ' + filled.join(', ') + ' for ' + displayName(row) + '. Review, then Save.', 'success');
      } catch (error) {
        console.error(error);
        flashButton(button, 'Failed');
        setStatus('Lookup failed.', 'error');
      } finally {
        if (button) {
          button.disabled = false;
          if (button.textContent === 'Filling…') button.textContent = 'Fill';
        }
      }
    }

    // Generic OSM types that say nothing useful about a place — drop them so we
    // don't write "a house in Charlotte".
    const GENERIC_PLACE_TYPES = new Set([
      'house', 'yes', 'residential', 'administrative', 'postcode', 'address',
      'road', 'construction', 'locality', 'neighbourhood', 'suburb', 'town',
      'city', 'village', 'hamlet', 'county', 'state', 'country', 'unclassified'
    ]);

    // Best available description: a real Wikipedia summary ONLY when the article
    // is actually about this waypoint (its name matches the geocoded place, or it
    // has no name yet). Otherwise a geocoded address can drag in the Wikipedia
    // entry for a containing building or a nearby landmark — the wrong place.
    async function resolveDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rowName = cleanText(row && row.name);
      const samePlace = !rowName || namesSimilar(rowName, cleanText(place && place.name));
      if (samePlace) {
        let title = wikipediaTitle(extratags);
        if (!title && /^Q\d+$/.test(cleanText(extratags.wikidata))) {
          title = await wikidataEnTitle(cleanText(extratags.wikidata));
        }
        if (title) {
          const summary = await fetchWikiSummary(title);
          if (summary) return summary;
        }
      }
      return buildLocalDescription(place, addr, row);
    }

    function normalizeName(value) {
      return cleanText(value)
        .normalize('NFD').replace(/[̀-ͯ]/g, '') // fold accents: Café -> Cafe
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\b(the|a|an|of|and)\b/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function namesSimilar(a, b) {
      const na = normalizeName(a);
      const nb = normalizeName(b);
      if (!na || !nb) return false;
      return na === nb || na.includes(nb) || nb.includes(na);
    }

    // Pull an English Wikipedia article title from OSM's wikipedia tag
    // ("en:Madison Square Garden"). Non-English tags are skipped.
    function wikipediaTitle(extratags) {
      const w = cleanText(extratags && extratags.wikipedia);
      if (!w) return '';
      const m = w.match(/^([a-z-]+):(.+)$/i);
      if (m) return m[1].toLowerCase() === 'en' ? cleanText(m[2]) : '';
      return w;
    }

    // Resolve a Wikidata id (Q…) to its English Wikipedia title (origin=* → CORS).
    async function wikidataEnTitle(qid) {
      try {
        const url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + encodeURIComponent(qid)
          + '&props=sitelinks&format=json&origin=*';
        const res = await fetch(url);
        if (!res.ok) return '';
        const data = await res.json();
        const entity = data && data.entities && data.entities[qid];
        const link = entity && entity.sitelinks && entity.sitelinks.enwiki;
        return link ? cleanText(link.title) : '';
      } catch (error) { return ''; }
    }

    // Fetch a Wikipedia REST summary and trim it to a couple of sentences.
    async function fetchWikiSummary(title) {
      try {
        const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return '';
        const data = await res.json();
        if (data && (data.type === 'disambiguation')) return '';
        const extract = cleanText(data && data.extract);
        return extract ? trimSentences(extract, 2, 320) : '';
      } catch (error) { return ''; }
    }

    function trimSentences(text, maxSentences, maxChars) {
      const parts = String(text).match(/[^.!?]+[.!?]+/g) || [text];
      let out = parts.slice(0, maxSentences).join(' ').trim();
      if (out.length > maxChars) out = out.slice(0, maxChars - 1).replace(/\s+\S*$/, '').trim() + '…';
      return out;
    }

    // Composed fallback when there is no Wikipedia article: name + category +
    // neighborhood + locality, e.g. "Duckworth's Grill & Taphouse in Uptown,
    // Charlotte, North Carolina."
    function buildLocalDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rawType = cleanText(place.type || place.addresstype || place.category).toLowerCase();
      const type = GENERIC_PLACE_TYPES.has(rawType) ? '' : rawType.replace(/_/g, ' ');
      const cuisine = cleanText(extratags.cuisine).replace(/_/g, ' ').replace(/;/g, ', ');
      const descriptor = [cuisine, type].filter(Boolean).join(' ');
      const name = cleanText(row && row.name) || cleanText(place.name);
      const hood = cleanText(addr.neighbourhood || addr.suburb || addr.quarter || addr.city_district);
      const town = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.municipality || addr.county);
      const where = [hood, town, cleanText(addr.state)].filter(Boolean).join(', ');
      if (name && descriptor && where) return name + ', a ' + descriptor + ' in ' + where + '.';
      if (name && where) return name + ' in ' + where + '.';
      if (descriptor && where) return capitalize(descriptor) + ' in ' + where + '.';
      if (where) return where + '.';
      return cleanText(place.display_name);
    }

    function capitalize(text) {
      const t = cleanText(text);
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
    }

    // --- Near: nearby points of interest -------------------------------------
    const NEAR_RADIUS_M = 100; // ~330 ft — walking-distance, not miles.

    // Near: find POIs around the current waypoint's location.
    async function nearWaypoint(wpid, button) {
      const row = findRow(wpid);
      if (!row) return;
      const query = geocodeQuery(row);
      const hasPoint = !!addressToPoint(cleanText(row.address));
      if (!query && !hasPoint) {
        setStatus('Add an address or name first, then hit Near.', 'error');
        return;
      }
      if (button) { button.disabled = true; button.textContent = 'Finding…'; }
      try {
        // Coordinates / Plus Code resolve to a point directly; else geocode.
        let coords = resolveAddressPoint(cleanText(row.address));
        if (!coords && query) coords = await geocodeCoords(query);
        if (!coords) {
          setStatus('Could not locate ' + displayName(row) + '.', 'error');
          return;
        }
        const pois = await fetchNearbyPois(coords, NEAR_RADIUS_M);
        const items = pois.map((poi) => ({
          name: poi.name,
          sub: [poi.cat, formatDistance(poi.dist) + ' away'].filter(Boolean).join(' · '),
          onAdd: (btn) => addPoiAsWaypoint(poi, row, btn)
        }));
        showResults('Near ' + displayName(row), items, 'No named points of interest within ' + Math.round(NEAR_RADIUS_M * 3.28084) + ' ft.');
      } catch (error) {
        console.error(error);
        setStatus('Nearby lookup failed.', 'error');
      } finally {
        if (button) { button.disabled = false; button.textContent = 'Near'; }
      }
    }

    // Cached geocode. Successful results (and confirmed-empty ones) are cached so
    // re-rendering the same waypoint never re-hits Nominatim; transient failures
    // (rate-limit / HTML error pages) are NOT cached and return null gracefully.
    const geocodeCache = new Map();
    async function geocodeCoords(query) {
      const key = cleanText(query).toLowerCase();
      if (!key) return null;
      if (geocodeCache.has(key)) return geocodeCache.get(key);
      try {
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=jsonv2&limit=1';
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null; // transient (e.g. rate-limited) — don't cache
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) { geocodeCache.set(key, null); return null; }
        const lat = parseFloat(arr[0].lat);
        const lon = parseFloat(arr[0].lon);
        const result = Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : null;
        geocodeCache.set(key, result);
        return result;
      } catch (error) {
        return null; // non-JSON / network error — don't cache
      }
    }

    // Overpass (OpenStreetMap) nearby named POIs within `radius` metres — keyless.
    async function fetchNearbyPois(coords, radius) {
      const kinds = ['amenity', 'tourism', 'shop', 'leisure', 'historic'];
      const around = 'around:' + radius + ',' + coords.lat + ',' + coords.lon;
      const q = '[out:json][timeout:25];('
        + kinds.map((k) => 'node(' + around + ')["name"]["' + k + '"];way(' + around + ')["name"]["' + k + '"];').join('')
        + ');out center tags 80;';
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass ' + res.status);
      const data = await res.json();
      const seen = new Set();
      const out = [];
      (data.elements || []).forEach((el) => {
        const tags = el.tags || {};
        const name = cleanText(tags.name);
        if (!name) return;
        const plat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const plon = el.lon != null ? el.lon : (el.center && el.center.lon);
        if (plat == null || plon == null) return;
        const key = name.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const cat = cleanText(tags.amenity || tags.tourism || tags.shop || tags.leisure || tags.historic).replace(/_/g, ' ');
        out.push({ name, cat, lat: plat, lon: plon, tags, dist: haversineMeters(coords.lat, coords.lon, plat, plon) });
      });
      out.sort((a, b) => a.dist - b.dist);
      return out;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const toRad = (d) => d * Math.PI / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Nearness in walking steps (~2,000 steps per mile), or miles once it's far.
    function formatDistance(m) {
      const miles = m / 1609.34;
      if (miles >= 0.25) return miles.toFixed(1) + ' mi';
      const steps = Math.max(1, Math.round(miles * 2000));
      return steps + (steps === 1 ? ' step' : ' steps');
    }

    // Generic results dialog, shared by Near and the New world-search. Each item
    // is { name, sub, onAdd(button) }.
    function showResults(title, items, emptyMsg, showBlank) {

    // Build an AI prompt that asks for REAL walking-tour stops in an area and
    // returns Supabase SQL to run in the dashboard.
    const WAYPOINT_IMPORT_HELPER_SQL_PATH = 'supabase/waypoints-prompt-import.sql';
    const SUPABASE_SQL_URL = 'https://supabase.com/dashboard/project/qmaafbncpzrdmqapkkgr/sql/';

    // The tgb_import_waypoints_prompt_items helper, inlined into the AI prompt so
    // the SQL the model returns is self-contained (the DB may not have it yet).
    // Keep in sync with supabase/waypoints-prompt-import.sql.
    function buildWaypointImportHelperSql() {
      return String.raw`
create or replace function public.tgb_import_waypoints_prompt_items(items jsonb)
returns table (action text, name text, wpid text, note text)
language plpgsql
as $$
declare
  v_entry jsonb;
  v_name text; v_city text; v_state text; v_zip text; v_address text;
  v_description text;
  v_wpid public.waypoints.wpid%type;
  v_existing public.waypoints.wpid%type;
begin
  if items is null or jsonb_typeof(items) <> 'array' then
    raise exception 'Expected a JSON array of waypoint objects.';
  end if;
  for v_entry in select value from jsonb_array_elements(items)
  loop
    v_name := nullif(btrim(v_entry->>'name'), '');
    v_city := nullif(btrim(v_entry->>'city'), '');
    v_state := nullif(btrim(v_entry->>'state'), '');
    v_zip := nullif(btrim(v_entry->>'zip'), '');
    v_address := nullif(btrim(v_entry->>'address'), '');
    v_description := nullif(left(btrim(coalesce(v_entry->>'description', '')), 700), '');
    if v_name is null then
      return query select 'skipped'::text, null::text, null::text, 'missing name'::text; continue;
    end if;
    v_existing := null;
    select w.wpid into v_existing from public.waypoints w
     where lower(btrim(coalesce(w.name, ''))) = lower(v_name)
       and lower(btrim(coalesce(w.city, ''))) = lower(coalesce(v_city, '')) limit 1;
    if v_existing is not null then
      return query select 'skipped'::text, v_name, v_existing::text, 'existing name + city'::text; continue;
    end if;
    insert into public.waypoints as w (name, city, state, zip, address, description)
    values (v_name, v_city, v_state, v_zip, v_address, v_description)
    returning w.wpid into v_wpid;
    return query select 'inserted'::text, v_name, v_wpid::text, null::text;
  end loop;
end;
$$;`.trim();
    }

    // Existing waypoint names in the target city, so the AI won't re-suggest them.
    function existingWaypointNamesFor(area) {
      const city = (parseLocation(area).city || '').toLowerCase();
      if (!city) return [];
      const seen = new Set();
      const out = [];
      state.rows.forEach((r) => {
        if (cleanText(r.city).toLowerCase() !== city) return;
        const n = cleanText(r.name);

        out.push(n);

    }

    function buildWaypointAiPrompt(area, count, keywords, sourceUrl) {

        : 'Task: research real, publicly accessible walking-tour stops in or immediately around ' + area + ' and return a Supabase SQL import for up to ' + n + ' NEW stops.' + (kw ? ' Bias toward: ' + kw + '.' : '');

      const sqlExample = [

      return [

        '- Places that ALREADY appear on real walking tours — guided tours, self-guided tour apps/routes, historical-society markers, official city or visitor-bureau tours.',
        '- Within a comfortable ~1-mile loop of one another; interesting and photogenic (historic sites and markers, landmarks, monuments/memorials, public art and murals, notable architecture, parks and plazas, museums, iconic local businesses).',
        '- Publicly accessible and safe to stand in front of.',
        '',
        ...researchLines,
        '',
        'Hard requirements for each JSON object:',
        '- name: the place name (e.g. "Cafe du Monde"). Required.',
        '- city: the city as a plain string (e.g. "' + (p.city || 'New Orleans') + '").',
        '- state: the 2-letter code for US places (e.g. "' + (region || 'LA') + '"), otherwise the country name.',
        '- zip: the postal/ZIP code as a string, or null.',
        '- address: the STREET ONLY — house number and street name, e.g. "800 Decatur St". Never repeat the city, state, ZIP, or country here; they have their own fields. Null if you do not know the street.',
        '- description: ONE original, concise tour-guide sentence (a fact, or what makes it a stop). No marketing copy.',
        '- Do NOT include a wpid or id — the database assigns it.',
        '- Do not include any stop already in the "existing" list below. Avoid duplicate names.',
        '- The JSON array may contain 1 to ' + n + ' objects. Do not pad with unverifiable entries.',
        '- Do not put the literal sequence $tgb$ inside any JSON string value.',
        '- Output the COMPLETE script as ONE copy-pasteable block: a single fenced ```sql code block (or a code artifact/canvas with a copy button). Do NOT split it across multiple blocks.',
        '- CRITICAL for copy-paste: use ONLY plain ASCII characters. Straight apostrophes and straight double-quotes only; never smart/curly quotes, en/em dashes, non-breaking spaces, or other Unicode punctuation. Do not hard-wrap or reflow long lines. Those silently corrupt the SQL (especially the $tgb$ dollar-quoted JSON).',
        '- The block must contain ONLY SQL — no prose, headings, or commentary before, after, or inside it.',
        '',
        'Put one self-contained Supabase SQL script in that single block. It must begin with the helper setup below, then call the helper with the verified-stop JSON array. Do not omit the helper setup; the database may not have it yet. Use this exact SQL shape:',
        sqlExample,

    // --- Prompt & Find waypoints: choose a city (preset, saved, or typed) ---------
    const US_STATES = [
      ['Alabama', 'AL'], ['Alaska', 'AK'], ['Arizona', 'AZ'], ['Arkansas', 'AR'], ['California', 'CA'],
      ['Colorado', 'CO'], ['Connecticut', 'CT'], ['Delaware', 'DE'], ['District of Columbia', 'DC'],

      ['Mississippi', 'MS'], ['Missouri', 'MO'], ['Montana', 'MT'], ['Nebraska', 'NE'], ['Nevada', 'NV'],
      ['New Hampshire', 'NH'], ['New Jersey', 'NJ'], ['New Mexico', 'NM'], ['New York', 'NY'],
      ['North Carolina', 'NC'], ['North Dakota', 'ND'], ['Ohio', 'OH'], ['Oklahoma', 'OK'], ['Oregon', 'OR'],
      ['Pennsylvania', 'PA'], ['Rhode Island', 'RI'], ['South Carolina', 'SC'], ['South Dakota', 'SD'],
      ['Tennessee', 'TN'], ['Texas', 'TX'], ['Utah', 'UT'], ['Vermont', 'VT'], ['Virginia', 'VA'],

    function stateAbbrOf(value) {
      const v = cleanText(value).toLowerCase();

    function loadCatalogCities(opts) {
