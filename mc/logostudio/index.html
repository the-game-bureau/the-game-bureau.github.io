<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LOGO STUDIO | THE GAME BUREAU</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/icon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --warn: rgba(190, 55, 55, 0.9);
      /* THE SOCIALIZER'S PALETTE. Copied, not approximated: mc/socializer/index.html
         is the reference room and this is a copy of it, so when either one's
         chrome changes, change both. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --bic-red: #c23737;
      --success: #276740;
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);

      /* THE STOP BUILDER'S TWO HUES, copied rather than re-picked: a waypoint
         and a challenge must read the same wherever you meet them, and the
         pair was measured there -- forest 7.98:1 and violet 7.38:1 on the
         panel, dE 94.4 apart, and neither near the red pen or the room ink.
         WHEN EITHER ROOM'S PAIR CHANGES, CHANGE BOTH. */
      --wp-ink: #1d5c33;
      --ch-ink: #6b3fa0;
    }

    body {
      margin: 0;
      background: var(--paper-base);
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
    }

    .app { width: min(100%, var(--mc-shell-width, 1400px)); margin: 0 auto; padding: 0 18px 60px; }

    /* ---- bars ------------------------------------------------------------ */
    .bar-row { display: flex; gap: 10px; align-items: stretch; margin: 10px 0; flex-wrap: wrap; }

    .command-bar {
      margin: 0; border: 1px solid var(--cut-panel-line); border-radius: 8px;
      background: var(--cut-panel-bg); padding: 2px 9px 8px;
    }
    .command-bar > legend {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      padding: 0 6px; margin-left: 2px;
    }
    .command-bar-inner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* FIND TAKES THE SLACK, ADD DOES NOT. One flexible bar per row, or the free
       space splits between them and neither end stays pinned. */
    .command-bar--find { flex: 1 1 auto; min-width: 0; }
    .command-bar--check { flex: 0 0 auto; }
    /* A WIDTH FLOOR, so the face does not change the bar's shape as it swings
       between `Check`, `Check (137)` and `Show all`. Declared AFTER
       `.command-bar .btn`, which sets `min-width: 0` at the same weight and
       would otherwise win on source order. */
    .command-bar--check .btn { min-width: 11ch; }
    .command-bar--find input[type="search"] { flex: 1 1 220px; min-width: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 0 12px;
      border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff; color: var(--ink);
      font: 600 0.78rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: rgba(var(--bic-blue-rgb), 0.07); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #24396a; }
    .btn.warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.5); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    /* [hidden] HAS TO BE RE-ASSERTED over .btn's author display, or setting
       .hidden silently does nothing. This project has hit that rule a dozen
       times; it is cheaper to write the line than to find it again. */
    .btn[hidden] { display: none !important; }

    input[type="text"], input[type="search"], input[type="number"], textarea, select {
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.86rem;
      color: var(--ink); background: #fff;
      border: 1px solid var(--control-line); border-radius: 7px;
      padding: 7px 9px; min-height: 34px;
    }
    textarea { resize: vertical; line-height: 1.4; }

    /* ---- panels ---------------------------------------------------------- */
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
      box-shadow: 0 1px 4px var(--paper-shadow); margin: 0 0 14px; overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; background: var(--cut-panel-bg);
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      font: 600 0.74rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .panel-count { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .panel-head .spacer { margin-left: auto; }

    /* THE LIST SCROLLS INSIDE ITS OWN PANEL rather than growing the document,
       so the head stays on screen over 500-odd rows. */
    .panel-body { max-height: 70vh; overflow-y: auto; }

    /* ---- a waypoint row -------------------------------------------------- */
    .ch {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      padding: 7px 12px; border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.09);
      cursor: pointer;
    }
    .ch:last-child { border-bottom: 0; }
    .ch:hover { background: var(--panel-soft); }
    .dlg-panel--wide { width: min(920px, 100%); }
    .ai-howto { margin: 0 0 10px; font-size: 0.86rem; line-height: 1.45; color: var(--muted); }
    .ai-options, .ai-doors {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
      padding: 6px 10px 9px; border: 1px solid var(--line); border-radius: 8px;
    }
    .ai-doors { margin: 0; }
    .ai-options-label {
      padding: 0 6px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }
    .ai-options input[type="text"] {
      flex: 1 1 260px; min-width: 0; min-height: 32px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
    }
    .ai-sheet {
      width: 100%; min-height: 330px; resize: vertical;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
      background: repeating-linear-gradient(
        to bottom, #fff, #fff 21px, rgba(var(--bic-blue-rgb), 0.09) 21px, rgba(var(--bic-blue-rgb), 0.09) 22px);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; line-height: 22px;
      white-space: pre; overflow: auto;
    }
    .batch-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 6px 12px; border-bottom: 1px solid var(--line);
    }
    .batch-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .batch-all, .batch-count {
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    /* SELECT ALL AND THE COUNT ARE TOLD APART BY INK AND A HAIRLINE. Side by
       side in one weight they read as one phrase: "SELECT ALL NONE SELECTED". */
    .batch-all { color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .batch-count { color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); }
    .batch-all input, .ch-pick {
      width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer;
    }
    .batch-row input[type="text"] {
      width: 13ch; min-height: 30px; padding: 3px 7px;
      border: 1px solid var(--line); border-radius: 6px;
      background: #fff; color: var(--ink); font-size: 0.78rem;
    }
    /* `aria-disabled`, NEVER `disabled`: a disabled button dispatches no click
       at all, so on a touch screen the reason it is off is unreachable. */
    .batch-row .btn[aria-disabled="true"] { opacity: 0.45; cursor: help; }
    .batch-row .bar-sep { width: 1px; align-self: stretch; background: var(--line); }
    .btn.warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.45); }

    .ch-name { font-weight: 700; font-size: 0.95rem; }
    .ch-name a { color: inherit; text-decoration: none; }
    .ch-name a:hover { text-decoration: underline dotted; }
    .ch-where { color: var(--muted); font-size: 0.82rem; }
    .ch-tags { margin-left: auto; display: flex; gap: 5px; flex: 0 0 auto; }
    .ch-tag {
      font: 600 0.6rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 6px; border-radius: 999px;
      border: 1px solid var(--control-line); color: var(--muted);
    }
    /* MISSING IS THE ONLY TAG WITH A COLOUR. A row that is short of something
       is the one you act on; everything else is furniture. */
    .ch-tag--missing { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.45); }

    /* THE ROW ITSELF IS THE FLAG, as in the Events room: a red left edge and
       the reason written underneath, so nothing has to be opened to find out
       what is wrong. */
    .ch.is-review {
      border-color: rgba(194, 55, 55, 0.55);
      box-shadow: inset 3px 0 0 var(--bic-red);
      background: rgba(194, 55, 55, 0.035);
    }
    .ch-note {
      flex: 1 0 100%;
      margin: 2px 0 0;
      color: var(--bic-red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }
    .ch-empty { padding: 22px 14px; color: var(--muted); font-size: 0.9rem; }

    /* ---- map ------------------------------------------------------------- */
    #map { height: 340px; width: 100%; }

    /* ---- the editor ------------------------------------------------------ */
    .dlg {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
      background: rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg.is-open { display: flex; }
    .dlg-panel {
      width: min(680px, 100%); background: #fff;
      border: 1px solid var(--cut-panel-line); border-radius: 12px;
      box-shadow: 0 10px 40px rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--cut-panel-bg);
      border-radius: 12px 12px 0 0;
    }
    .dlg-title { font: 700 0.9rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .dlg-sub { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .dlg-body { padding: 14px 16px; display: grid; gap: 10px; grid-template-columns: 1fr; }
    .dlg-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    /* DESTRUCTIVE HARD LEFT, PRIMARY HARD RIGHT, and the gap between them is
       the point: Delete is the only irreversible control on this form. */
    .dlg-foot .spacer { margin-left: auto; }

    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field--wide { grid-column: 1 / -1; }
    .field > span {
      font: 600 0.64rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .field input, .field textarea { width: 100%; }
    .field-read {
      font: 500 0.78rem/1.4 'IBM Plex Mono', monospace; color: var(--muted);
      padding: 7px 0;
    }
    .dlg-msg { padding: 0 16px 12px; color: var(--bic-red); font-size: 0.82rem; }
    .dlg-msg:empty { display: none; }

    @media (max-width: 760px) {
      .command-bar { flex: 1 1 100%; }
    }
  

    /* ---- what a challenge row shows -------------------------------------- */
    .ch { align-items: flex-start; }
    .ch-line { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
    .ch-prompt {
      flex: 1 0 100%; margin: 3px 0 0; color: var(--muted);
      font-size: 0.86rem; line-height: 1.45;
    }
    /* A VARIABLE IS DRAWN AS A VARIABLE, in the prompt and in the preview, so a
       writer can see at a glance which words the game fills in. */
    .var {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.86em;
      padding: 0 3px; border-radius: 3px;
      background: rgba(var(--bic-blue-rgb), 0.1); color: var(--bic-blue);
    }
    .var.is-bad { background: rgba(190, 55, 55, 0.12); color: var(--bic-red); }

    /* THE KIND AND THE SCOPE ARE THE TWO FACTS YOU SCAN FOR, so they are chips
       rather than words in a sentence. Scope carries the outline because it is
       the one that decides whether a challenge can be reused; kind does not. */
    .ch-kind {
      font: 600 0.58rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
      white-space: nowrap;
    }
    .ch-scope {
      font: 700 0.58rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em;
      text-transform: uppercase; border-radius: 3px; padding: 3px 6px;
      border: 1px solid transparent; white-space: nowrap;
    }
    /* PORTABLE IS THE ONE IN INK, because it is the one that says this row
       will be used again. The three narrow scopes are quieter and told apart by
       the word rather than by hue: a colour each would make a list of chips
       read as a legend to learn. A scope naming nothing takes the red pen. */
    .ch-scope.is-portable { color: var(--bic-blue); border-color: rgba(var(--bic-blue-rgb), 0.45); }
    .ch-scope.is-team,
    .ch-scope.is-city,
    .ch-scope.is-place    { color: var(--muted); border-color: var(--line); }
    .ch-scope.is-loose    { color: var(--bic-red); border-color: rgba(190, 55, 55, 0.45); }

    /* ---- the editor ------------------------------------------------------ */
    .preview {
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--panel-soft); padding: 10px 12px;
      font-size: 0.9rem; line-height: 1.5; min-height: 3.2em;
    }
    .preview-empty { color: var(--muted); font-style: italic; }
    .preview-answer {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .preview-answer-label {
      font: 700 0.58rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted);
    }
    .varbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .varbar button {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem;
      padding: 3px 7px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--control-line); background: #fff; color: var(--bic-blue);
    }
    .varbar button:hover { background: var(--cut-panel-bg); }
</style>  <link rel="stylesheet" href="/mc/js/admin-shell.css">
  <style>
    /* ---- the shelf -------------------------------------------------------
       A CARD PER LOGO: the picture, then its name, then a note. The picture
       leads because it is the thing you are looking for -- a list of names
       is not how anybody finds a logo. */
    .shelf {
      display: grid; gap: 12px; margin-top: 12px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .logo-card {
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
      padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    }
    /* WHITE, AND THE IMAGE IS `contain` BECAUSE OF IT -- the same pair the
       guide bar settled on. A covered image fills the frame edge to edge, so
       the ground would never be seen and there would be no slack for
       "centred" to mean anything. A logo is the case that needs it most:
       they are rarely square and a crop takes the wordmark off. */
    .logo-shot {
      position: relative; width: 100%; aspect-ratio: 16 / 10;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff; padding: 10px; overflow: hidden; cursor: pointer;
    }
    .logo-shot img {
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      object-fit: contain; display: block; margin: auto;
    }
    /* AN EMPTY FRAME SAYS WHAT IT IS FOR. Words in an image frame read as an
       error; this one is an instruction, and the frame is the drop target. */
    .logo-shot--empty { color: var(--muted); font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem; letter-spacing: 0.08em; text-align: center; }
    .logo-shot.is-over { border-color: var(--bic-blue); background: var(--cut-panel-bg); }
    .logo-name {
      font: 600 0.95rem/1.2 "Space Grotesk", system-ui, sans-serif;
      color: var(--ink); border: 1px solid transparent; border-radius: 6px;
      background: transparent; padding: 3px 5px; width: 100%; min-width: 0;
    }
    .logo-notes {
      font: 400 0.76rem/1.35 "Space Grotesk", system-ui, sans-serif;
      color: var(--muted); border: 1px solid transparent; border-radius: 6px;
      background: transparent; padding: 3px 5px; width: 100%; min-width: 0;
      resize: vertical; min-height: 34px;
    }
    /* NO BORDER UNTIL YOU REACH FOR IT. A shelf of outlined boxes is a form,
       not a shelf -- the call the tape-name editor already made. */
    .logo-name:hover, .logo-name:focus, .logo-notes:hover, .logo-notes:focus {
      border-color: var(--control-line); background: #fff; outline: none;
    }
    .logo-foot { display: flex; align-items: center; gap: 8px; }
    .logo-foot .grow { margin-left: auto; }
    .logo-meta { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem;
      color: var(--muted); letter-spacing: 0.06em; }
    .mini {
      font-family: "IBM Plex Mono", monospace; font-size: 0.62rem;
      padding: 4px 8px; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--control-line); background: #fff; color: var(--bic-blue);
    }
    .mini:hover { background: var(--cut-panel-bg); }
    .mini--warn { color: var(--bic-red); border-color: rgba(194, 55, 55, 0.44); }
    /* `[hidden]` HAS TO BE RE-ASSERTED over an author `display`. This project
       has hit that rule a dozen times. */
    .mini[hidden], .shelf[hidden] { display: none; }
    .empty { color: var(--muted); padding: 18px 2px; }
  </style>

        <p class="room-blurb"><span id="blurbCount">?</span> Logos. A Logo is the mark a game wears, and the picture lives here rather than at an address that can rot.</p>

       per logo is a control per row that nothing ever needs two of at once. -->
  <input id="filePicker" type="file" accept="image/*" hidden>

  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };
    const TABLE = 'logos';

    /* THE CEILING IS THE COLUMN'S OWN. `logos_image_sane` refuses anything
       over 256 KB, so the uploader downscales to well under it -- a refusal
       after a person has chosen a file is a worse experience than a resize
       they never see. */
    const LOGO_MAX_PX = 512;
    const IMAGE_MAX_CHARS = 262144;

    const state = { rows: [], q: '', authed: false, loaded: false };

    function el(id) { return document.getElementById(id); }
    function clean(v) { return String(v == null ? '' : v).trim(); }

    function restUrl(table, params) {
      const u = new URL(SUPABASE_CONFIG.url + '/rest/v1/' + encodeURIComponent(table));
      Object.keys(params || {}).forEach((k) => u.searchParams.set(k, params[k]));
      return u.toString();
    }
    function authHeaders(extra) {
      const s = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + ((s && s.access_token) || SUPABASE_CONFIG.publishableKey)
      }, extra || {});
    }

    /* TRANSLATE THE CODES THIS TABLE CAN ACTUALLY PRODUCE. A raw 23514 is a
       statement about our schema and tells nobody what to do about it. */
    async function readError(res) {
      let text = '';
      try { text = await res.text(); } catch (e) { /* body already consumed */ }
      if (/logos_name_present/.test(text)) return 'A logo needs a name.';
      if (/logos_image_sane/.test(text)) {
        return 'That image was refused: it must be an image file, and under 256 KB once encoded. '
             + 'Try a smaller original.';
      }
      if (/games_logo_id_fkey/.test(text)) return 'A game still points at that logo. Reload and try again.';
      if (/PGRST205|does not exist/.test(text)) {
        return 'public.logos is not there. Run mc/supabase/migrations/2026083128_logos.sql.';
      }
      return 'The database refused it (' + res.status + '). ' + text.slice(0, 200);
    }

    function say(message, tone) {
      const box = el('pageStatus');
      if (!box) return;
      box.textContent = message || '';
      box.className = 'status room-scribble' + (tone ? ' ' + tone : '');
    }

    /* ---- reading ---------------------------------------------------------
       IT PAGES. PostgREST caps a response at 1000 rows and truncates in
       SILENCE, and every read in this repo that did not page has eventually
       been caught by it. */
    async function readAll(table, params) {
      const out = [];
      const seen = new Set();
      for (let from = 0; ; from += 1000) {
        const res = await fetch(restUrl(table, params), {
          headers: authHeaders({ Range: from + '-' + (from + 999) })
        });
        if (!res.ok) throw new Error(await readError(res));
        const page = await res.json();
        if (!Array.isArray(page) || !page.length) break;
        let added = 0;
        page.forEach((r) => { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); added += 1; } });
        /* A PAGE THAT ADDS NOTHING ENDS THE LOOP. If anything between here and
           Postgres ignored the Range header, every request would hand back the
           same first page for ever. */
        if (page.length < 1000 || added === 0) break;
      }
      return out;
    }

    async function loadAll() {
      state.rows = await readAll(TABLE, { select: 'id,name,notes,image,created_at,updated_at', order: 'name.asc' });
      state.loaded = true;
    }

    /* ---- writing ---------------------------------------------------------
       EVERY WRITE ASKS FOR THE ROW BACK. PostgREST answers 200 with an EMPTY
       ARRAY when RLS refuses, so without reading it a refused save reports
       success and the shelf shows a value the table never took. */
    async function patch(id, fields) {
      const res = await fetch(restUrl(TABLE, { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(fields)
      });
      if (!res.ok) throw new Error(await readError(res));
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) throw new Error('The database refused that change.');
      const i = state.rows.findIndex((r) => r.id === id);
      if (i !== -1) state.rows[i] = Object.assign({}, state.rows[i], rows[0]);
      return rows[0];
    }

    async function addLogo(name) {
      const res = await fetch(restUrl(TABLE, {}), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify({ name: name })
      });
      if (!res.ok) throw new Error(await readError(res));
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) throw new Error('The database refused it.');
      state.rows.push(rows[0]);
      return rows[0];
    }

    async function removeLogo(id) {
      const res = await fetch(restUrl(TABLE, { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({ Prefer: 'return=representation' })
      });
      if (!res.ok) throw new Error(await readError(res));
      const rows = await res.json();
      /* THE ROWS RETURNED, NEVER THE ID ASKED FOR. A refused delete answers
         200 with an empty array, and clearing the card off the shelf then
         reports work nobody did. */
      if (!Array.isArray(rows) || !rows.length) throw new Error('The database refused the delete.');
      state.rows = state.rows.filter((r) => r.id !== id);
    }

    /* ---- the picture ------------------------------------------------------
       DOWNSCALED IN THE BROWSER BEFORE IT IS SENT, the way the Green Room does
       it: a 2.4 MB original becomes about 60-90 KB, which is what makes a
       shelf of them affordable to render at all. */
    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result || ''));
        fr.onerror = () => reject(new Error('That file could not be read.'));
        fr.readAsDataURL(file);
      });
    }

    function downscale(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, LOGO_MAX_PX / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          if (!ctx) { reject(new Error('This browser would not draw the image.')); return; }
          /* PNG, NOT JPEG, AND THAT IS THE ONE PLACE THIS DIFFERS FROM A GUIDE
             PORTRAIT. A logo is usually a mark on a transparent ground and JPEG
             has no transparency, so a JPEG here would composite every logo onto
             a square of whatever colour the encoder assumed. */
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => reject(new Error('That file is not an image this browser can read.'));
        img.src = dataUrl;
      });
    }

    let uploadFor = null;

    async function acceptFile(id, file) {
      if (!file) return;
      try {
        say('Reading the image...');
        const inline = await downscale(await fileToDataUrl(file));
        if (inline.length > IMAGE_MAX_CHARS) {
          /* SAID HERE RATHER THAN LEFT TO THE DATABASE, because at this point
             we know the number and the person has already chosen a file. */
          throw new Error('That image is still ' + Math.round(inline.length / 1024)
            + ' KB after resizing, and the ceiling is 256 KB. Try a simpler image.');
        }
        await patch(id, { image: inline });
        render();
        say('Image saved.', 'success');
      } catch (err) {
        say(err.message, 'error');
      }
    }

    /* ---- drawing ---------------------------------------------------------- */
    function matches(row) {
      if (!state.q) return true;
      const q = state.q.toLowerCase();
      return (clean(row.name) + ' ' + clean(row.notes)).toLowerCase().indexOf(q) !== -1;
    }

    function card(row) {
      const wrap = document.createElement('div');
      wrap.className = 'logo-card';
      wrap.dataset.logoId = String(row.id);

      const shot = document.createElement('button');
      shot.type = 'button';
      shot.className = 'logo-shot' + (row.image ? '' : ' logo-shot--empty');
      shot.title = row.image ? 'Replace this image' : 'Add an image';
      if (row.image) {
        const img = document.createElement('img');
        img.src = row.image;
        img.alt = clean(row.name) || 'Logo';
        shot.appendChild(img);
      } else {
        shot.textContent = 'ADD AN IMAGE';
      }
      shot.addEventListener('click', function () {
        uploadFor = row.id;
        const picker = el('filePicker');
        if (picker) { picker.value = ''; picker.click(); }
      });
      /* DROP WORKS TOO, on the frame itself. Both `dragover` and `drop` must
         preventDefault or the browser navigates to the file instead. */
      shot.addEventListener('dragover', function (e) { e.preventDefault(); shot.classList.add('is-over'); });
      shot.addEventListener('dragleave', function () { shot.classList.remove('is-over'); });
      shot.addEventListener('drop', function (e) {
        e.preventDefault();
        shot.classList.remove('is-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) acceptFile(row.id, f);
      });
      wrap.appendChild(shot);

      const name = document.createElement('input');
      name.className = 'logo-name';
      name.type = 'text';
      name.value = clean(row.name);
      name.setAttribute('aria-label', 'Logo name');
      name.placeholder = 'Name';
      commitOn(name, row, 'name');
      wrap.appendChild(name);

      const notes = document.createElement('textarea');
      notes.className = 'logo-notes';
      notes.rows = 2;
      notes.value = clean(row.notes);
      notes.setAttribute('aria-label', 'Notes');
      notes.placeholder = 'Notes';
      commitOn(notes, row, 'notes');
      wrap.appendChild(notes);

      const foot = document.createElement('div');
      foot.className = 'logo-foot';
      const meta = document.createElement('span');
      meta.className = 'logo-meta';
      meta.textContent = '#' + row.id;
      foot.appendChild(meta);

      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'mini grow';
      clear.textContent = 'Remove image';
      clear.hidden = !row.image;
      clear.addEventListener('click', async function () {
        try { await patch(row.id, { image: null }); render(); say('Image removed.', 'success'); }
        catch (err) { say(err.message, 'error'); }
      });
      foot.appendChild(clear);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'mini mini--warn';
      del.textContent = 'Delete';
      del.addEventListener('click', async function () {
        /* THE CONSEQUENCE NOBODY EXPECTS. That the row goes is obvious; that
           every game wearing it is left with no logo is not, and the key is
           ON DELETE SET NULL so nothing stops it. */
        if (!window.confirm('Delete "' + (clean(row.name) || 'this logo')
          + '" for good? Any game wearing it is left with no logo. This cannot be undone.')) return;
        try { await removeLogo(row.id); render(); say('Deleted.', 'success'); }
        catch (err) { say(err.message, 'error'); }
      });
      foot.appendChild(del);
      wrap.appendChild(foot);
      return wrap;
    }

    /* COMMIT ON BLUR, AND ONLY WHEN IT CHANGED. A field that writes on every
       keystroke is a request per character; one that writes an unchanged value
       is a write for nothing. */
    function commitOn(input, row, field) {
      input.addEventListener('blur', async function () {
        const next = clean(input.value);
        if (next === clean(row[field])) return;
        if (field === 'name' && !next) {
          /* SAID HERE, because the database would answer with a constraint
             name and the box would look simply dead. */
          input.value = clean(row.name);
          say('A logo needs a name.', 'error');
          return;
        }
        try {
          const saved = await patch(row.id, { [field]: next || null });
          row[field] = saved[field];
          say('Saved.', 'success');
        } catch (err) {
          input.value = clean(row[field]);
          say(err.message, 'error');
        }
      });
    }

    function render() {
      const shelf = el('shelf');
      const note = el('emptyNote');
      const count = el('blurbCount');
      if (count) count.textContent = state.loaded ? String(state.rows.length) : '?';
      if (!shelf) return;
      shelf.textContent = '';
      const rows = state.rows.filter(matches);
      rows.forEach((r) => shelf.appendChild(card(r)));
      if (note) {
        /* THE EMPTY STATE NAMES WHICH EMPTINESS IT IS. "Nothing here" over a
           search that matched nothing reads as a room that failed to load. */
        const empty = !rows.length;
        note.hidden = !empty;
        /* ONLY WRITTEN WHEN IT IS SHOWN. Computing it either way leaves a
           sentence in the DOM that contradicts the shelf beside it. */
        if (empty) {
          note.textContent = !state.loaded ? 'Loading...'
            : (!state.rows.length ? 'No logos yet. Press Logo to make the first one.'
              : 'Nothing matches "' + state.q + '".');
        }
      }
    }

    /* ---- wiring -----------------------------------------------------------
       DEFENSIVE, because one dead reference here kills the rest of the block
       INCLUDING adminAuth.init(), and admin-shell.css hides every child of
       body.mc-auth-protected until init() adds .mc-auth-authorized. */
    function on(id, event, fn) {
      const node = el(id);
      if (node) node.addEventListener(event, fn);
      else console.warn('logos: no element #' + id);
    }

    on('q', 'input', function () { state.q = clean(el('q').value); render(); });
    on('clearBtn', 'click', function () { const b = el('q'); if (b) b.value = ''; state.q = ''; render(); });

    on('addLogoBtn', 'click', async function () {
      const name = window.prompt('Name this logo');
      if (name === null) return;
      if (!clean(name)) { say('A logo needs a name.', 'error'); return; }
      try {
        await addLogo(clean(name));
        state.rows.sort((a, b) => clean(a.name).localeCompare(clean(b.name)));
        render();
        say('Added. Press its frame to give it a picture.', 'success');
      } catch (err) { say(err.message, 'error'); }
    });

    on('filePicker', 'change', function (e) {
      const f = e.target && e.target.files && e.target.files[0];
      const id = uploadFor;
      uploadFor = null;
      if (f && id != null) acceptFile(id, f);
    });

    const adminAuth = TgbMcAdminAuth.create({
      // THE OPTION IS `supabaseConfig`, AN OBJECT. Passing supabaseUrl and
      // supabaseKey reads naturally, lands in Object.assign, is never looked at,
      // and the room then blames the PROJECT for a fault in its own call.
      supabaseConfig: {
        url: SUPABASE_CONFIG.url,
        publishableKey: SUPABASE_CONFIG.publishableKey
      },
      onAuthorized: async function () {
        state.authed = true;
        try { await loadAll(); render(); }
        catch (err) { say(err.message, 'error'); }
      }
    });

    render();
    adminAuth.init();
  </script>
</body>
</html>
