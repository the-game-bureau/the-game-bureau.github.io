      wrap.append(label, line);
      if (!hasSourceUrlColumn) {
        const help = document.createElement('div');
        help.className = 'field-hint';
        help.textContent = 'Not editable yet — run migration 2026072902_waypoints_source_url.sql.';
        wrap.appendChild(help);
      }
      return wrap;
    }

    // City + State as ONE dropdown, sourced from the shared public.cities catalog.
    // Waypoints keep city and state in separate columns, so a pick is split back
    // into them (state normalized to its 2-letter code). A value already on the
    // row that isn't in the catalog is kept as its own selected option so editing
    // one field never wipes an existing out-of-catalog city.
    function renderCityStateField(row) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const id = 'wp-citystate-' + row.wpid;
      const label = document.createElement('label');
      label.setAttribute('for', id);
      label.textContent = 'City · State';
      const sel = document.createElement('select');
      sel.id = id;
      sel.dataset.field = 'city_state';
      const paintCity = () => {
        sel.classList.toggle('is-error', waypointErrors(row).indexOf('city') > -1);
      };
      paintCity();

      const makeOpt = (value, text, city, region) => {
        const o = document.createElement('option');
        o.value = value; o.textContent = text;
        o.dataset.city = city; o.dataset.region = region;
        return o;
      };

      const curCity = cleanText(row.city);
      const curState = cleanText(row.state);
      const curRegion = stateAbbrOf(curState) || curState;
      const curKey = curCity ? (curCity.toLowerCase() + '|' + curRegion.toLowerCase()) : '';

      sel.append(makeOpt('', curKey ? '— clear —' : 'Choose a city…', '', ''));

      // Preserve the current value until (and unless) a catalog match is found.
      let currentOpt = null;
      if (curKey) {
        currentOpt = makeOpt('cur', [curCity, curRegion].filter(Boolean).join(', '), curCity, curRegion);
        sel.append(currentOpt);
        sel.value = 'cur';
      }

      sel.addEventListener('change', () => {
        const opt = sel.selectedOptions[0];
        updateField(row.wpid, 'city', (opt && opt.dataset.city) || '');
        updateField(row.wpid, 'state', (opt && opt.dataset.region) || '');
        paintCity();
      });

      // Fill catalog cities async. If the row's city is in the catalog, use that
      // option and drop the standalone "current" one.
      loadCatalogCities().then((cities) => {
        let matchValue = '';
        cities.forEach((c) => {
          const p = parseLocation(c);
          const key = p.city.toLowerCase() + '|' + (p.region || '').toLowerCase();
          sel.append(makeOpt(c, c, p.city, p.region));
          if (curKey && key === curKey) matchValue = c;
        });
        if (matchValue) {
          if (currentOpt) { currentOpt.remove(); currentOpt = null; }
          sel.value = matchValue;
        }
      }).catch(() => {});

      // "+" adds a new city to the shared public.cities catalog (same dialog the
      // gifts/profiles pages use), then selects it here.
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn small wp-city-add';
      addBtn.textContent = 'NEW';
      addBtn.title = 'Add a new city to the shared list';
      addBtn.addEventListener('click', () => {
        if (!(window.TgbCities && typeof window.TgbCities.openAddDialog === 'function')) return;
        window.TgbCities.openAddDialog({ authHeaders: authHeaders, initialValue: [curCity, curState].filter(Boolean).join(', ') }).then((cityRow) => {
          if (!cityRow || !cityRow.city) return;
          const p = parseLocation(cityRow.city);
          updateField(row.wpid, 'city', p.city);
          updateField(row.wpid, 'state', p.region);
          render(); // rebuild the card; the dropdown now lists and selects the new city
        });
      });

      const controlRow = document.createElement('div');
      controlRow.className = 'wp-citystate-control';
      // '+' leads the row, ahead of the City - State select.
      controlRow.append(addBtn, sel);
      wrap.append(label, controlRow);
      return wrap;
    }

    function emptyNode(text) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = text;
      return empty;
    }

    function totalPages(list) {
      return Math.max(1, Math.ceil((list || navRows()).length / PAGE_SIZE));
    }

    // Keep the visible page containing the cursor. Called after anything that
    // moves the cursor (jump-to-N), so it stays on a visible page.
    function syncPageToCursor() {
      if (state.cityFilter) { state.page = 0; return; }   // cities are unpaged
      const list = navRows();
      const idx = list.findIndex((row) => row.wpid === state.randomId);
      if (idx >= 0) state.page = Math.floor(idx / PAGE_SIZE);
    }

    // The pager is built fresh with each render and appended under the cards.
    // It used to be a permanent span in the toolbar; the toolbar is gone, and a
    // pager belongs next to the thing it pages anyway.
    function renderPagerFor(list) {
      const pages = totalPages(list);
      if (pages <= 1) return null;
      const wrap = document.createElement('div');
      wrap.className = 'wp-pager wp-pager--inline';
      const prev = document.createElement('button');
      prev.type = 'button';
      prev.className = 'btn small';
      prev.textContent = '‹';
      prev.title = 'Previous page';
      prev.disabled = state.page <= 0;
      prev.addEventListener('click', () => goToPage(state.page - 1));
      const label = document.createElement('span');
      label.className = 'wp-pager-label';
      label.textContent = 'Page ' + (state.page + 1) + ' of ' + pages;
      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'btn small';
      next.textContent = '›';
      next.title = 'Next page';
      next.disabled = state.page >= pages - 1;
      next.addEventListener('click', () => goToPage(state.page + 1));
      wrap.append(prev, label, next);
      return wrap;
    }

    async function goToPage(page) {
      const list = navRows();
      const pages = totalPages(list);
      const next = Math.min(Math.max(0, page), pages - 1);
      if (next === state.page) return;
      await maybeSaveDirtyBeforePaging();
      state.page = next;
      // Land the cursor on the new page so "jump to N" and the highlighted card
      // follow what you are looking at.
      const first = list[next * PAGE_SIZE];
      if (first) state.randomId = first.wpid;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateSummary() {
      updateToolbarButtons();
      renderPageTitle();
    }

    // The count line under the title: "38 waypoints · 1–10 showing". The title
    // itself is static now, so this owns the substat — which is also where
    // setStatus writes, hence the restore timer there.
    function renderPageTitle() {
      const el = pageStatus;
      if (!el) return;
      if (!state.authed) { el.textContent = ''; return; }
      const archivedTotal = state.rows.filter(isArchived).length;
      const list = navRows();
      const shown = list.length;
      if (!state.cityFilter) {
        // All: coverage, not position — how much there is and how much is wrong.
        const cities = new Set(list.map(cityKey)).size;
        const errors = list.filter((row) => waypointErrors(row).length).length;
        el.textContent = shown + ' waypoint' + (shown === 1 ? '' : 's')
          + ' across ' + cities + ' cit' + (cities === 1 ? 'y' : 'ies')
          + (errors ? ' · ' + errors + ' with errors' : '')
          + (archivedTotal ? ' · ' + archivedTotal + ' archived' : '');
        el.classList.remove('error', 'success');
        return;
      }
      // Inside a city every waypoint is on screen, so there is no slice to
      // report - just how many there are and how many need work.
      const errors = list.filter((row) => waypointErrors(row).length).length;
      el.textContent = shown + ' waypoint' + (shown === 1 ? '' : 's')
        + (errors ? ' · ' + errors + ' with errors' : '');
      el.classList.remove('error', 'success');
    }


    // `row` is the card this nav belongs to. It used to read state.randomId
    // instead, which was fine when one waypoint was on screen but means all ten
    // cards on a page now report the cursor's position — ten identical
    // "20 of 38" labels. Each card counts itself.
    function renderNav(row) {
      const nav = document.createElement('div');
      nav.className = 'wp-nav';

      // The WPID, which is what you actually reference when talking about a
      // waypoint. It replaced the "N of M" position count on 2026-07-29 — a
      // position is a property of the current sort and filter, so it changed
      // meaning every time either did, and told you nothing durable.
      const id = document.createElement('span');
      id.className = 'wp-id';
      id.textContent = 'WPID' + (row && row.wpid != null ? row.wpid : '—');
      nav.append(id);
      if (isArchived(row)) {
        const badge = document.createElement('span');
        badge.className = 'wp-archived-pill';
        badge.textContent = 'Archived';
        badge.title = 'Kept as a do-not-rescrape tombstone';
        nav.append(badge);
      }

      // The "source" link that used to sit here was removed 2026-07-28: the card
      // now has a Source URL field with its own Open button, so the head link was
      // a second, read-only copy of the same thing.
      return nav;
    }

    function setSavedBadge(el, row) {
      const isDirty = state.dirtyIds.has(row.wpid);
      el.textContent = isDirty ? 'Unsaved' : 'Saved';
      el.style.color = isDirty ? 'var(--danger)' : 'var(--success)';
    }

    function updateToolbarButtons() {
      if (newBtn) newBtn.disabled = !state.authed;
    }

    // --- Wiring --------------------------------------------------------------

    // Closing the tab, reloading, or following a link away with edits still
    // unsaved. Paging is already guarded by maybeSaveDirtyBeforePaging, but that
    // cannot help here — nothing in the page runs once the browser is leaving,
    // so this is the last chance to say anything.
    //
    // The browser shows its own generic wording and ignores whatever string is
    // returned; returnValue just has to be set for the prompt to appear at all.
    // It also only fires if the page has been interacted with, which is fine —
    // you cannot have dirty rows without having typed in one.
    window.addEventListener('beforeunload', (event) => {
      if (!state.dirtyIds.size) return;      // nothing to lose, never nag
      event.preventDefault();
      event.returnValue = '';
    });

    // The search box was removed 2026-07-29 along with state.filter. The city
    // buttons above the toolbar are the navigation now; the world search that
    // Enter used to run lives on the Manual dialog's Name field ("Find online").

    // The filter, Clear, sort and toolbar-pager handlers went with their
    // controls on 2026-07-29. renderCityView builds the pager now, wired
    // straight to goToPage.

    if (newBtn) newBtn.addEventListener('click', openManualDialog);
    const manualCancelBtn = document.getElementById('manualCancelBtn');
    if (manualCancelBtn) manualCancelBtn.addEventListener('click', closeManualDialog);
    const manualAddBtn = document.getElementById('manualAddBtn');
    if (manualAddBtn) manualAddBtn.addEventListener('click', submitManual);
    const manualBackdrop = document.getElementById('manualBackdrop');
    if (manualBackdrop) manualBackdrop.addEventListener('click', closeManualDialog);
    const promptBtn = document.getElementById('promptBtn');
    if (promptBtn) promptBtn.addEventListener('click', openPromptDialog);
    const sportsPromptBtn = document.getElementById('sportsPromptBtn');
    if (sportsPromptBtn) sportsPromptBtn.addEventListener('click', openSportsPromptDialog);
    const tourPlacesPromptBtn = document.getElementById('tourPlacesPromptBtn');
    if (tourPlacesPromptBtn) tourPlacesPromptBtn.addEventListener('click', openTourPlacesPromptDialog);
    const oldBarsPromptBtn = document.getElementById('oldBarsPromptBtn');
    if (oldBarsPromptBtn) oldBarsPromptBtn.addEventListener('click', openOldBarsPromptDialog);
    const nightlyBtn = document.getElementById('nightlyBtn');
    if (nightlyBtn) nightlyBtn.addEventListener('click', openNightlyDialog);
    const saveAllBtn = document.getElementById('saveAllBtn');
    if (saveAllBtn) saveAllBtn.addEventListener('click', saveAllDirty);
    const nightlyCloseBtn = document.getElementById('nightlyCloseBtn');
    if (nightlyCloseBtn) nightlyCloseBtn.addEventListener('click', closeNightlyDialog);
    const nightlyBackdrop = document.getElementById('nightlyBackdrop');
    if (nightlyBackdrop) nightlyBackdrop.addEventListener('click', closeNightlyDialog);
    const nearCloseBtn = document.getElementById('nearCloseBtn');
    if (nearCloseBtn) nearCloseBtn.addEventListener('click', closeNearDialog);
    const nearBlankBtn = document.getElementById('nearBlankBtn');
    if (nearBlankBtn) nearBlankBtn.addEventListener('click', () => { closeNearDialog(); insertWaypointAndGo(blankWaypoint(), null); });
    const nearBackdrop = document.getElementById('nearBackdrop');
    if (nearBackdrop) nearBackdrop.addEventListener('click', closeNearDialog);

    const promptCloseBtn = document.getElementById('promptCloseBtn');
    if (promptCloseBtn) promptCloseBtn.addEventListener('click', closePromptDialog);
    const promptBackdrop = document.getElementById('promptBackdrop');
    if (promptBackdrop) promptBackdrop.addEventListener('click', closePromptDialog);
    const promptCopyBtn = document.getElementById('promptCopyBtn');
    if (promptCopyBtn) promptCopyBtn.addEventListener('click', async () => {
      const ta = document.getElementById('promptText');
      if (!ta) return;
      ta.focus();
      ta.select();
      try {
        await navigator.clipboard.writeText(ta.value);
      } catch (error) {
        document.execCommand('copy');
      }
      promptCopyBtn.textContent = 'Copied';
      setTimeout(() => { promptCopyBtn.textContent = 'Copy'; }, 1200);
    });


    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      const near = document.getElementById('nearDialog');
      if (near && !near.hidden) closeNearDialog();
      const promptDialog = document.getElementById('promptDialog');
      if (promptDialog && !promptDialog.hidden) closePromptDialog();
      const manualDialog = document.getElementById('manualDialog');
      if (manualDialog && !manualDialog.hidden) closeManualDialog();
      const nightlyDialog = document.getElementById('nightlyDialog');
      if (nightlyDialog && !nightlyDialog.hidden) closeNightlyDialog();
    });

    render();
    adminAuth.init();
  </script>
</body>
</html>
