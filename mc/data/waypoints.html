  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script src="/mc/js/admin-site-nav.js"></script>
  <script src="/mc/js/supabase-rest.js"></script>
  <script src="/mc/assets/geo.js"></script>
  <script src="/mc/assets/city-picker.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const TABLE = 'waypoints';
    const PK = 'wpid';
    // Columns read from the table. wpid is the identity primary key.
    // waypoints.lat / waypoints.lon were dropped from the table on 2026-07-27.
    // Coordinates still exist at RUNTIME — geocoded from the address/city and
    // held on the in-memory row so the map can centre — but they are never
    // selected and never written. PostgREST 400s
    // on an unknown column, so re-adding them here breaks the whole page load.
    const WAYPOINT_COLUMNS = ['wpid', 'city', 'state', 'zip', 'address', 'name', 'description'];
    // Editable text fields (everything except the auto-number PK and lat/lon).
    // source_url is editable too but lives in its own list: it is only writable
    // once 2026072902_waypoints_source_url.sql has been applied, so it is added
    // to the payload conditionally (see hasSourceUrlColumn / payloadFromRow).
    const EDITABLE_FIELDS = ['name', 'city', 'state', 'zip', 'address', 'description'];
    const SOURCE_URL_FIELD = 'source_url';
    const ARCHIVED_FIELD = 'archived';
    // Fields actually persisted on save / used for change detection — the editable
    // text fields plus the stored exact coordinates (lat/lon are not form fields).
    const SAVED_FIELDS = EDITABLE_FIELDS.concat([SOURCE_URL_FIELD, ARCHIVED_FIELD, 'lat', 'lon']);
    // Does the table actually have source_url? Set from the shape of a real fetch
    // (select=* returns the key, null or not), so a database that predates the
    // migration still saves — it just leaves the field out of the write.
    let hasSourceUrlColumn = false;
    let hasArchivedColumn = false;
    // lat / lon arrive with 2026080704_waypoints_latlon.sql. Probed rather than
    // assumed, like the two above: naming a column PostgREST does not have 400s
    // the whole page load, so a database that has not run the migration still
    // works — it just falls back to geocoding every pin the slow way.
    let hasLatLonColumns = false;
    // walk_order arrives with 2026080705_waypoints_walk_order.sql.
    let hasWalkOrderColumn = false;
    const round6 = (n) => Math.round(n * 1e6) / 1e6;

    // --- DOM refs ------------------------------------------------------------
    const pageStatus = document.getElementById('pageStatus');
    const newBtn = document.getElementById('newBtn');
    const wpList = document.getElementById('wpList');

    // The list is always newest-first now; the sort dropdown went with the
    // toolbar on 2026-07-29.

    const state = {
      rows: [],
      authed: false,
      cityFilter: '',   // lowercased city key; '' means every city
      page: 0,          // 0-based page of PAGE_SIZE cards
      // The cursor: where the pager lands and what "jump to N" targets. It
      // is no longer the only thing on screen — a page of PAGE_SIZE renders
      // around it — but it stays the anchor for navigation.
      randomId: null,
      dirtyIds: new Set(),
      savingIds: new Set(),
      // A suggested walking order for the city on screen: Map<wpid, position>,
      // or null for none. Never persisted — see suggestWalk() for why order
      // belongs to public.stops and not to the catalog.
      walkOrder: null,
      walkMetres: 0
    };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading waypoints...');
        // Warm the city catalog for the chooser, then repaint the city filter so
        // venue-only cities grey out once the catalog lands.
        loadCatalogCities().then(renderCityBar).catch(() => {});
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.rows = [];
        state.dirtyIds.clear();
        state.savingIds.clear();
        updateSaveAllState();
        render();
        setStatus('Sign in with an admin account.');
      }
    });
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    // The substat is normally the count line ("38 waypoints · 1–10 showing").
    // setStatus borrows it for a save confirmation or an error, then hands it
    // back — otherwise the first message of the session would sit there forever
    // and the count would be gone until the next render.
    let statusRestoreTimer = 0;
    function setStatus(text, kind) {
      if (!pageStatus) return;
      window.clearTimeout(statusRestoreTimer);
      if (!text) { renderPageTitle(); return; }
      pageStatus.textContent = text;
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
      // Errors linger; everything else is a quick acknowledgement.
      statusRestoreTimer = window.setTimeout(renderPageTitle, kind === 'error' ? 8000 : 3500);
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') {
        return adminAuth.authHeaders(extra || {});
      }
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
        try { await adminAuth.ensureFreshSession(); } catch (error) {}
      }
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (error) {
          return text;
        }
      } catch (error) {
        return fallback;
      }
    }

    // Reload from the DB. Pass keepId to stay on (feature) a specific waypoint
    // after a save; otherwise feature a fresh random one.
    async function refresh(keepId) {
      try {
        // Always show a state in the list — a blank panel during a slow load or a
        // silent failure reads as "nothing's here".
        if (wpList && !wpList.children.length) {
          wpList.appendChild(emptyNode('Loading waypoints…'));
        }
        await ensureFreshSession();
        // TgbRest.fetchAll paginates past PostgREST's 1000-row cap.
        // select=* rather than WAYPOINT_COLUMNS: source_url only exists once
        // 2026072902_waypoints_source_url.sql has been applied, and naming a
        // column PostgREST does not have 400s the entire page load. A star
        // works either way — the same reason the cities readers use one.
        const url = restUrl(TABLE, { select: '*', order: PK + '.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        hasSourceUrlColumn = (Array.isArray(rows) ? rows : []).some(
          (r) => r && typeof r === 'object' && Object.prototype.hasOwnProperty.call(r, SOURCE_URL_FIELD)
        );
        hasArchivedColumn = (Array.isArray(rows) ? rows : []).some(
          (r) => r && typeof r === 'object' && Object.prototype.hasOwnProperty.call(r, ARCHIVED_FIELD)
        );
        hasLatLonColumns = (Array.isArray(rows) ? rows : []).some(
          (r) => r && typeof r === 'object' && Object.prototype.hasOwnProperty.call(r, 'lat')
        );
        hasWalkOrderColumn = (Array.isArray(rows) ? rows : []).some(
          (r) => r && typeof r === 'object' && Object.prototype.hasOwnProperty.call(r, 'walk_order')
        );
        state.rows = normalizeRows(rows);
        applyDefaultCityOnce();
        rebuildPristine();
        state.dirtyIds.clear();
        state.savingIds.clear();
        updateSaveAllState();
        renderCityBar();
        if (keepId != null && findRow(keepId)) {
          state.randomId = keepId;
          render();
        } else {
          state.randomId = highestId();
          render();
          // No "Loaded N waypoints" message any more — the count line under the
          // title says the same thing and does not time out.
        }
      } catch (error) {
        console.error(error);
        const msg = error && error.message ? error.message : 'Load failed.';
        setStatus(msg, 'error');
        // Surface the failure IN the list, not just the small status line, so an
        // auth/session error doesn't look like an empty waypoint set.
        if (wpList) {
          wpList.innerHTML = '';
          const isAuth = /jwt|401|permission|auth|sign/i.test(msg);
          wpList.appendChild(emptyNode(
            (isAuth ? 'Could not load waypoints — sign-in issue. ' : 'Could not load waypoints. ') +
            msg + ' · Reload the page (Ctrl+Shift+R).'
          ));
        }
        updateSummary();
      }
    }

    function normalizeRows(rows) {
      return (Array.isArray(rows) ? rows : []).map(normalizeRow);
    }

    function truthyFlag(value) {
      if (value === true) return true;
      if (value === false || value == null) return false;
      const v = String(value).trim().toLowerCase();
      return !!v && !['false', 'f', 'no', 'n', '0'].includes(v);
    }

    function isArchived(row) {
      return truthyFlag(row && row[ARCHIVED_FIELD]);
    }

    function normalizeRow(row) {
      const r = row && typeof row === 'object' ? row : {};
      return {
        wpid: r.wpid == null ? '' : String(r.wpid),
        city: String(r.city || ''),
        state: String(r.state || ''),
        zip: String(r.zip || ''),
        address: String(r.address || ''),
        name: String(r.name || ''),
        description: String(r.description || ''),
        // The page a stop came from. The AI importer fills it; a card can also be
        // edited by hand. normalizeRow used to drop it, which is why the "source"
        // link in the card head never appeared.
        source_url: String(r.source_url || ''),
        archived: truthyFlag(r.archived),
        // Runtime-only, never round-tripped to the database: filled in by
        // geocoding so the map can centre. Always null straight off a fetch.
        lat: (r.lat == null || r.lat === '') ? null : Number(r.lat),
        lon: (r.lon == null || r.lon === '') ? null : Number(r.lon)
      };
    }

    function cleanText(value) {
      return String(value == null ? '' : value).trim();
    }

    // PATCH/POST payload — editable columns plus the stored exact coordinates.
    // Only EDITABLE_FIELDS go to the database. lat/lon are deliberately absent —
    // the columns no longer exist, and sending them makes PostgREST reject the
    // whole write.
    function payloadFromRow(row) {
      const payload = {};
      EDITABLE_FIELDS.forEach((field) => { payload[field] = cleanText(row[field]) || null; });
      // Only when the column exists — naming one PostgREST does not have rejects
      // the whole write, same trap as lat/lon above.
      if (hasSourceUrlColumn) payload[SOURCE_URL_FIELD] = cleanText(row[SOURCE_URL_FIELD]) || null;
      if (hasArchivedColumn) payload[ARCHIVED_FIELD] = !!row[ARCHIVED_FIELD];
      return payload;
    }

    // Single choke point for insert payloads, which are assembled from geocoding
    // results and can pick up coordinates along the way.
    function stripDroppedColumns(payload) {
      if (payload && typeof payload === 'object') { delete payload.lat; delete payload.lon; }
      return payload;
    }

    async function patchRow(wpid, row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not save waypoint.'));
      const rows = await response.json();
      const fresh = Array.isArray(rows) && rows[0] ? rows[0] : null;
      return fresh ? normalizeRow(fresh) : normalizeRow(Object.assign({}, findRow(wpid), row));
    }

    // Insert one waypoint (editable fields only; wpid is trigger-assigned).
    async function postWaypoint(row) {
      await ensureFreshSession();
      const response = await fetch(restUrl(TABLE, {}), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payloadFromRow(row))
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add waypoint.'));
      const rows = await response.json();
      return normalizeRow(Array.isArray(rows) && rows[0] ? rows[0] : {});
    }

    async function saveRow(wpid) {
      const row = findRow(wpid);
      if (!row || state.savingIds.has(wpid)) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Saving ' + displayName(row) + '...');
      try {
        await patchRow(wpid, row);
        state.dirtyIds.delete(wpid);
        // Reload from the DB and stay on this waypoint.
        await refresh(wpid);
        const fresh = findRow(wpid);
        setStatus('Saved ' + (fresh ? displayName(fresh) : ('#' + wpid)) + '.', 'success');
      } catch (error) {
        console.error(error);
        state.savingIds.delete(wpid);
        setStatus(error.message || 'Save failed.', 'error');
        render();
      }
    }

    async function deleteWaypoint(wpid) {
      const row = findRow(wpid);
      if (!row) return;
      if (!window.confirm('Delete waypoint #' + wpid + (row.name ? ' (' + row.name + ')' : '') + '? This cannot be undone.')) return;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus('Deleting ' + displayName(row) + '...');
      try {
        await ensureFreshSession();
        const response = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=minimal' })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not delete waypoint.'));
        state.rows = state.rows.filter((r) => r.wpid !== wpid);
        state.dirtyIds.delete(wpid);
        // render()'s ensureCurrent() re-features the highest remaining waypoint
        // when the deleted one was current.
        render();
        setStatus('Deleted waypoint #' + wpid + '.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Delete failed.', 'error');
      } finally {
        state.savingIds.delete(wpid);
      }
    }

    async function setWaypointArchived(wpid, archived) {
      const row = findRow(wpid);
      if (!row || state.savingIds.has(wpid)) return;
      if (!hasArchivedColumn) {
        setStatus('Run migration 2026072903_waypoints_archived.sql before archiving waypoints.', 'error');
        return;
      }
      const previous = !!row.archived;
      row.archived = !!archived;
      state.savingIds.add(wpid);
      updateCardState(wpid);
      setStatus((row.archived ? 'Archiving ' : 'Restoring ') + displayName(row) + '...');
      try {
        await patchRow(wpid, row);
        state.dirtyIds.delete(wpid);
        await refresh(wpid);
        setStatus((archived ? 'Archived ' : 'Restored ') + displayName(row) + '.', 'success');
      } catch (error) {
        console.error(error);
        row.archived = previous;
        state.savingIds.delete(wpid);
        setStatus(error.message || 'Archive update failed.', 'error');
        render();
      } finally {
        state.savingIds.delete(wpid);
      }
    }

    function findRow(wpid) {
      return state.rows.find((row) => row.wpid === wpid) || null;
    }


    // Snapshot of a row's saved (pristine) field values, for change detection.
    const pristine = new Map();
    function snapshot(row) {
      return SAVED_FIELDS.map((f) => cleanText(row[f])).join('~|~');
    }
    function rebuildPristine() {
      pristine.clear();
      state.rows.forEach((r) => pristine.set(r.wpid, snapshot(r)));
    }

    // Mark dirty only if the row actually differs from its saved snapshot —
    // editing a field back to its original value clears the dirty flag again.
    function markDirty(wpid) {
      const row = findRow(wpid);
      if (row && snapshot(row) === pristine.get(wpid)) {
        state.dirtyIds.delete(wpid);
      } else {
        state.dirtyIds.add(wpid);
      }
      updateCardState(wpid);
      updateSaveAllState();
      updateSummary();
    }

    // Save all: one button for the whole dirty set. Kept in sync from the same
    // places that move rows in and out of state.dirtyIds, so its count cannot
    // disagree with the cards' own Save buttons.
    function updateSaveAllState() {
      const btn = document.getElementById('saveAllBtn');
      if (!btn) return;
      const n = state.dirtyIds.size;
      const busy = state.savingIds.size > 0;
      btn.disabled = !n || busy;
      btn.textContent = n ? 'Save all (' + n + ')' : 'Save all';
      btn.title = n
        ? 'Save every waypoint with unsaved changes'
        : 'No unsaved changes';
      btn.classList.toggle('primary', !!n && !busy);
    }

    async function saveAllDirty() {
      const dirty = Array.from(state.dirtyIds).map(findRow).filter(Boolean);
      if (!dirty.length) return;
      const btn = document.getElementById('saveAllBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      let saved = 0;
      const failed = [];
      // Sequential, not Promise.all: these are PATCHes against one table under
      // one session, and a burst of ten adds nothing but a chance of rate limits.
      for (const row of dirty) {
        try {
          await patchRow(row.wpid, row);
          state.dirtyIds.delete(row.wpid);
          updateCardState(row.wpid);
          saved += 1;
        } catch (error) {
          console.error(error);
          failed.push(displayName(row) + ' (' + (error.message || 'error') + ')');
        }
      }
      updateSaveAllState();
      updateSummary();
      if (failed.length) {
        setStatus('Saved ' + saved + ', failed ' + failed.length + ': ' + failed.join('; '), 'error');
      } else {
        setStatus('Saved ' + saved + ' waypoint' + (saved === 1 ? '' : 's') + '.', 'success');
      }
    }

    function updateField(wpid, field, value) {
      const row = findRow(wpid);
      if (!row) return;
      row[field] = String(value || '');
      // Editing the address invalidates the stored coordinates — drop them so the
      // map re-geocodes the new address (Fill will set precise coords again).
      if (field === 'address') { row.lat = null; row.lon = null; }
      // Moving a waypoint between cities changes the badges and their counts.
      if (field === 'city') renderCityBar();
      // Errors are per-ROW, not per-field: typing a Plus Code into Address
      // clears the ZIP error too, so the whole card is repainted rather than
      // just the input being typed in. The badge count follows the same rule.
      repaintCardErrors(wpid);
      markDirty(wpid);
    }

    // Repaint every error border on one card from waypointErrors, the single
    // source of truth the city badges also count.
    function repaintCardErrors(wpid) {
      const card = wpList.querySelector('[data-wpid="' + cssEscape(wpid) + '"]');
      const row = findRow(wpid);
      if (!card || !row) return;
      const bad = waypointErrors(row);
      ERROR_FIELDS.forEach((field) => {
        const selector = field === 'city'
          ? '[data-field="city_state"]'
          : '[data-field="' + field + '"]';
        const el = card.querySelector(selector);
        if (el) el.classList.toggle('is-error', bad.indexOf(field) > -1);
      });
      renderCityBar();
    }

    // --- One consolidated map per city (Leaflet / Esri imagery) ---------------
    // Until 2026-07-29 every card carried its own aerial photo. Ten cards meant
    // ten Leaflet instances and — since lat/lon were dropped from the table —
    // ten Nominatim geocodes, lazily queued one a second so we would not be
    // blocked for bulk use. A page of ten therefore spent ten seconds trickling
    // in ten pictures of ten unrelated street corners, and told you nothing
    // about how those stops sat relative to each other, which is the only
    // question that matters for a walking tour.
    //
    // Now the page groups by city and paints ONE map per city with every stop
    // on it. Same geocodes, one picture, and the shape of the route is visible.
    const PAGE_SIZE = 10;
    const GEOCODE_GAP_MS = 1100;   // just over Nominatim's 1/sec ceiling
    let cityMap = null;            // the single live Leaflet instance
    let cityMapToken = 0;          // cancels an in-flight fill after a re-render
    const cityMapMarkers = new Map();   // wpid -> marker, for highlight-on-hover
    let cityWalkLine = null;       // the dashed suggested-walk polyline, if any

    function teardownCityMap() {
      cityMapToken += 1;
      cityMapMarkers.clear();
      cityWalkLine = null;         // map.remove() takes its layers with it
      if (cityMap) { try { cityMap.remove(); } catch (error) {} cityMap = null; }
    }

    // Geocodes survive a reload. The per-session Map alone meant every visit
    // re-geocoded the same forty addresses at a request a second; a city that
    // has not been edited should paint instantly the second time you open it.
    // Keyed by the address string, NOT the WPID, so editing an address
    // invalidates exactly one entry instead of the whole city.
    const GEO_STORE_KEY = 'tgb_wp_geo_v2';
    const GEO_STORE_MAX = 3000;
    let geoStore = null;

    function loadGeoStore() {
      if (geoStore) return geoStore;
      try {
        const raw = JSON.parse(localStorage.getItem(GEO_STORE_KEY) || '{}');
        geoStore = (raw && typeof raw === 'object') ? raw : {};
      } catch (error) { geoStore = {}; }
      return geoStore;
    }

    function geoStoreGet(key) {
      const hit = loadGeoStore()[key];
      return (hit && Number.isFinite(hit.lat) && Number.isFinite(hit.lon)) ? hit : null;
    }

    function geoStoreSet(key, point) {
      const store = loadGeoStore();
      if (!point) return;
      store[key] = { lat: point.lat, lon: point.lon, precise: point.precise !== false, at: Date.now() };
      const keys = Object.keys(store);
      if (keys.length > GEO_STORE_MAX) {
        // Oldest out first. A cache that grows without bound eventually blows
        // the 5 MB localStorage quota and every write starts throwing.
        keys.sort((a, b) => (store[a].at || 0) - (store[b].at || 0))
          .slice(0, keys.length - GEO_STORE_MAX)
          .forEach((k) => { delete store[k]; });
      }
      try { localStorage.setItem(GEO_STORE_KEY, JSON.stringify(store)); } catch (error) {}
    }

    function geoKeyFor(row) {
      return [cleanText(row.address), cleanText(row.city), cleanText(row.state), cleanText(row.zip)]
        .join('|').toLowerCase();
    }

    // A row's point without touching the network when we already know it.
    function cachedPointFor(row) {
      // THE STORED POINT WINS. It is the whole reason the map is fast: a row
      // that has been located once is placed from data on every later visit, in
      // every browser, by everyone — where the localStorage cache below only
      // ever helped the machine that already sat through the geocoding.
      const lat = Number(row.lat);
      const lon = Number(row.lon);
      if (Number.isFinite(lat) && Number.isFinite(lon)) return { lat: lat, lon: lon, precise: true };

      const local = addressToPoint(cleanText(row.address));   // coords / full Plus Code
      if (local) return local;
      // A SHORT Plus Code ("CWC8+R9") is ambiguous on its own, so it is recovered
      // against whatever we already know about the city. That reference is only
      // available once some other waypoint in the city has been placed, or the
      // city centre is cached - hence the fallbacks.
      if (isShortPlusCode(row.address)) {
        const ref = cityReferencePoint(row);
        if (ref) {
          const point = recoverNearestPlusCode(row.address, ref.lat, ref.lon);
          if (point) return point;
        }
      }
      return geoStoreGet(geoKeyFor(row));
    }

    // A rough point for the row's city, for short-code recovery: any already
    // placed waypoint in the same city, else the cached city-centre geocode.
    function cityReferencePoint(row) {
      const key = cityKey(row);
      const sibling = state.rows.find((r) => r !== row && cityKey(r) === key
        && (addressToPoint(cleanText(r.address)) || geoStoreGet(geoKeyFor(r))));
      if (sibling) return addressToPoint(cleanText(sibling.address)) || geoStoreGet(geoKeyFor(sibling));
      // Else the city-centre geocode, if the map has already had to look it up.
      // Rough is fine here: recovery only needs a reference within ~40 km.
      const loc = [cleanText(row.city), cleanText(row.state)].filter(Boolean).join(', ').toLowerCase();
      return (loc && geocodeCache.get(loc)) || null;
    }

    // The waypoint's address as one geocodable / searchable string. Street and
    // locality together: a bare street resolves to whichever city Nominatim (or
    // Google) likes best, which is rarely ours.
    function addressQuery(row) {
      return [cleanText(row.address), cleanText(row.city), cleanText(row.state), cleanText(row.zip)]
        .filter(Boolean).join(', ');
    }

    // --- Address → the point the photo is centred on -------------------------
    // Taking Nominatim's first hit is what made the imagery land in the wrong
    // spot: a free-text street query usually matches the ROAD, and a road's
    // point is its midpoint, so the photo showed a random stretch of the street
    // rather than the building. So candidates are now scored, and a match that
    // is only a road (or worse, the whole city) loses to one that resolved to an
    // actual street number.

    // Result classes that are a specific thing at an address rather than a line
    // or an area drawn through the neighbourhood.
    const PRECISE_CLASSES = new Set(['building', 'amenity', 'shop', 'tourism', 'leisure', 'historic', 'office', 'craft', 'club']);
    // Types that mean "we only managed to place the locality".
    const AREA_TYPES = new Set(['city', 'town', 'village', 'hamlet', 'suburb', 'county', 'state', 'postcode', 'country', 'municipality']);

    function addressResultScore(hit, row) {
      const addr = hit.address || {};
      // The right street number in the wrong town is the worst possible photo:
      // it looks completely plausible. Never use one.
      if (!sameLocality(addr, row)) return -1;
      // jsonv2 names the field `category`; the older format calls it `class`.
      const cls = cleanText(hit.class || hit.category).toLowerCase();
      const type = cleanText(hit.addresstype || hit.type).toLowerCase();
      let score = 1;
      if (cleanText(addr.house_number)) score += 4;   // pinned to a street number
      if (PRECISE_CLASSES.has(cls)) score += 3;       // a named place, not a line
      if (cls === 'highway' || type === 'road') score -= 3;
      if (AREA_TYPES.has(type)) score -= 5;
      return score;
    }

    // One Nominatim search (structured or free-text), scored against the row.
    // Returns the best candidate as { point, score } or null.
    async function searchBestPoint(params, row) {
      try {
        const query = new URLSearchParams(Object.assign({ format: 'jsonv2', addressdetails: '1', limit: '5' }, params));
        const res = await fetch('https://nominatim.openstreetmap.org/search?' + query.toString(),
          { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null;
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) return null;
        let best = null;
        arr.forEach((hit) => {
          const lat = parseFloat(hit.lat);
          const lon = parseFloat(hit.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const score = addressResultScore(hit, row);
          if (score < 0) return;
          if (!best || score > best.score) {
            best = { point: { lat: lat, lon: lon, precise: score >= 5 }, score: score };
          }
        });
        return best;
      } catch (error) { return null; }
    }

    // Where to centre the aerial photo for this row's address. Three ways of
    // asking, best-first, stopping as soon as one comes back precise (a street
    // number or a named building). A merely-adequate answer is kept in case the
    // later, better-shaped queries find nothing at all.
    const addressPointCache = new Map();
    async function geocodeAddressPoint(row) {
      // A Plus Code is a point, not a street: cachedPointFor has already decoded
      // it (or recovered it), and handing it to Nominatim as street= would just
      // burn a request to match nothing.
      const street = looksLikePlusCode(row.address) ? '' : cleanText(row.address);
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      const zip = cleanText(row.zip);
      const name = cleanText(row.name);
      if (!street && !name) return null;

      const key = [street, city, state, zip, name].join('|').toLowerCase();
      if (addressPointCache.has(key)) return addressPointCache.get(key);

      const attempts = [];
      // 1. Structured — the endpoint that actually understands house numbers.
      if (street) {
        const structured = { street: street };
        if (city) structured.city = city;
        if (state) structured.state = state;
        if (zip) structured.postalcode = zip;
        attempts.push(structured);
      }
      // 2. The venue by name at its address — a named building beats a road.
      if (name && (city || state)) {
        attempts.push({ q: [name, street, city, state].filter(Boolean).join(', ') });
      }
      // 3. Plain free text, the old behaviour, as a floor.
      if (street) attempts.push({ q: addressQuery(row) });

      let fallback = null;
      let transient = false;
      for (let i = 0; i < attempts.length; i += 1) {
        if (i > 0) await nominatimPause();
        const best = await searchBestPoint(attempts[i], row);
        if (!best) { transient = true; continue; }
        // 5+ means a street number or a named building — good enough to stop.
        if (best.score >= 5) {
          addressPointCache.set(key, best.point);
          return best.point;
        }
        if (!fallback || best.score > fallback.score) fallback = best;
      }
      const result = fallback ? fallback.point : null;
      // Don't cache a miss that may just have been a rate-limited request —
      // scrolling back to the card should get another go.
      if (result || !transient) addressPointCache.set(key, result);
      return result;
    }

    // Google Maps for a waypoint, asked for BY ADDRESS — the official Maps URL
    // search form, so Google geocodes the address and shows the place exactly as
    // it would for someone typing it in. Coordinates are the fallback only: with
    // no address there is nothing to search for, so the clicked point is all we
    // have.
    function googleMapsUrl(row, point) {
      const q = addressQuery(row) || cleanText(row.name);
      if (q) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
      if (point && Number.isFinite(point.lat) && Number.isFinite(point.lon)) {
        return 'https://www.google.com/maps/search/?api=1&query=' + point.lat + ',' + point.lon;
      }
      return '';
    }

    // Paint one map for a whole city: every stop on it, numbered, fitted to the
    // set. Pins fill in as the geocodes resolve rather than all at the end, so a
    // cold city shows its shape building up instead of an empty grey box.
    async function setupCityMap(container, rows) {
      teardownCityMap();
      if (typeof L === 'undefined' || !container) return;
      const token = cityMapToken;
      container.innerHTML = '';

      const map = L.map(container, {
        maxZoom: 22,
        zoomControl: true,
        // A city map IS a map you operate — unlike the per-card photo it
        // replaced, panning and zooming are the point.
        scrollWheelZoom: false,   // except the wheel, which would hijack page scroll
        attributionControl: true
      }).setView([39.5, -98.35], 4);
      cityMap = map;
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 22, maxNativeZoom: 19, attribution: 'Esri'
      }).addTo(map);
      setTimeout(() => { try { map.invalidateSize(); } catch (error) {} }, 0);

      const status = document.getElementById('cityMapStatus');
      const bounds = [];
      let placed = 0;
      let missing = 0;

      const addPin = (row, point, index) => {
        const pin = L.divIcon({
          className: 'wp-map-pin',
          html: '<span class="wp-map-pin-dot">' + (index + 1) + '</span>',
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        const marker = L.marker([point.lat, point.lon], {
          icon: pin,
          title: 'WPID' + row.wpid + ' — ' + displayName(row),
          riseOnHover: true
        }).addTo(map);
        marker.bindTooltip((index + 1) + '. ' + displayName(row), { direction: 'top', offset: [0, -10] });
        // A pin is a way back to the row: jump the cursor to it, page to it if it
        // is not on this page, and flash the card.
        marker.on('click', () => focusWaypoint(row.wpid));
        cityMapMarkers.set(String(row.wpid), marker);
        bounds.push([point.lat, point.lon]);
        placed += 1;
      };

      const paintStatus = () => {
        if (!status) return;
        status.textContent = placed + ' of ' + rows.length + ' placed'
          + (missing ? ' · ' + missing + ' with no locatable address' : '');
      };

      // Pass one: everything already known — typed coordinates and the
      // localStorage cache. No network at all, so a revisited city is instant.
      rows.forEach((row, index) => {
        const point = cachedPointFor(row);
        if (point) addPin(row, point, index);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [28, 28], maxZoom: 17 });
      drawWalkLine(map, rows);
      paintStatus();

      // Nothing cached yet: sit on the city itself rather than a view of the
      // whole continent while the first geocodes trickle in.
      if (!bounds.length) {
        const sample = rows[0] || {};
        const loc = [cleanText(sample.city), cleanText(sample.state)].filter(Boolean).join(', ');
        if (loc) {
          let centre = null;
          try { centre = await geocodeCoords(loc); } catch (error) {}
          if (token !== cityMapToken) return;
          if (centre) map.setView([centre.lat, centre.lon], 12);
        }
      }

      // On All, stop here. Sweeping every waypoint in the table through
      // Nominatim at a request a second would take twenty minutes and abuse a
      // free service to draw a map nobody asked to be complete — All is for
      // seeing the spread, a city is where you check the detail.
      if (!state.cityFilter) {
        if (status) {
          status.textContent = placed + ' of ' + rows.length + ' placed from cache'
            + (placed < rows.length ? ' · open a city to locate the rest' : '');
        }
        return;
      }

      // Pass two: whatever is left, one Nominatim request at a time. Bail the
      // moment the view changes — cityMapToken moving means this map is gone.
      for (let i = 0; i < rows.length; i += 1) {
        if (token !== cityMapToken) return;
        const row = rows[i];
        if (cityMapMarkers.has(String(row.wpid))) continue;
        if (!cleanText(row.address) && !cleanText(row.name)) { missing += 1; paintStatus(); continue; }
        if (status) status.textContent = 'Locating ' + displayName(row) + '…';
        let point = null;
        try { point = await geocodeAddressPoint(row); } catch (error) {}
        if (token !== cityMapToken) return;
        if (point) {
          geoStoreSet(geoKeyFor(row), point);
          // WRITE IT BACK. This is the line that stops the work being repeated:
          // the geocode that cost a second is now a column, so nobody — not
          // another browser, not another person, not this one after a cache
          // clear — ever waits for this row again. Fire and forget; a failed
          // save (not signed in, column not migrated) just means the pin stays
          // local, which is exactly the old behaviour.
          persistPoint(row, point);
          addPin(row, point, i);
        } else {
          missing += 1;
        }
        paintStatus();
        // fitBounds used to run inside the loop — a full map redraw per pin, 37
        // of them on Denver. The view is refit once when the sweep finishes.
        await new Promise((r) => setTimeout(r, GEOCODE_GAP_MS));
      }
      // One refit for the whole sweep.
      if (token === cityMapToken && bounds.length) {
        map.fitBounds(bounds, { padding: [28, 28], maxZoom: 17 });
      }
      if (token === cityMapToken) drawWalkLine(map, rows);
      if (token === cityMapToken && !placed && status) {
        status.textContent = 'Nothing could be placed yet — add addresses, or try again in a moment.';
      }
    }

    // Save a located point onto the row so it is never geocoded again.
    // Deliberately quiet: it is a background improvement, not something the
    // person asked for, so a failure must not interrupt them or mark the card
    // dirty. It PATCHes the two columns directly rather than going through
    // patchRow(), which would send the whole payload and stamp an edit the user
    // did not make.
    function persistPoint(row, point) {
      if (!hasLatLonColumns || !state.authed || !point) return;
      if (!Number.isFinite(point.lat) || !Number.isFinite(point.lon)) return;
      // SAVED_FIELDS already lists lat/lon — a leftover from when these columns
      // existed — so snapshot() covers them and simply setting the pair would
      // mark every located card unsaved. The pristine snapshot is re-taken with
      // them, but ONLY on a row that is currently clean: on a dirty row that
      // would silently swallow the edits in progress.
      //
      // A later Save cannot undo this either way, because payloadFromRow()
      // sends EDITABLE_FIELDS and lat/lon are not among them.
      const wasClean = !state.dirtyIds.has(row.wpid);
      row.lat = point.lat;
      row.lon = point.lon;
      if (wasClean) pristine.set(row.wpid, snapshot(row));
      fetch(restUrl(TABLE, { [PK]: 'eq.' + row.wpid }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ lat: point.lat, lon: point.lon })
      }).catch(function () { /* stays local; the map is already drawn */ });
    }

    // The suggested walk, drawn as a dashed line through the pins in order.
    // Dashed and thin on purpose: it is a suggestion laid over the map, not a
    // route anybody has committed to, and a solid heavy line would read as
    // something the data actually says.
    function drawWalkLine(map, rows) {
      if (cityWalkLine) { try { map.removeLayer(cityWalkLine); } catch (error) {} cityWalkLine = null; }
      if (!state.walkOrder || !map) return;
      const points = rows
        .filter((row) => state.walkOrder.has(Number(row.wpid)))
        .map((row) => ({ row: row, at: state.walkOrder.get(Number(row.wpid)), point: cachedPointFor(row) }))
        .filter((entry) => entry.point)
        .sort((a, b) => a.at - b.at)
        .map((entry) => [entry.point.lat, entry.point.lon]);
      if (points.length < 2) return;
      cityWalkLine = L.polyline(points, {
        color: '#2d4880',
        weight: 2,
        opacity: 0.75,
        dashArray: '5 6',
        interactive: false
      }).addTo(map);
      // Under the pins, never over them: the numbers are what you read.
      if (cityWalkLine.bringToBack) cityWalkLine.bringToBack();
    }

    // Highlight the pin belonging to a card (hover) without moving the map.
    function highlightPin(wpid, on) {
      const marker = cityMapMarkers.get(String(wpid));
      if (!marker) return;
      const el = marker.getElement && marker.getElement();
      if (el) el.classList.toggle('is-hot', !!on);
    }

    function parseLatLon(text) {
      const m = cleanText(text).match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
      if (!m) return null;
      const lat = parseFloat(m[1]);
      const lon = parseFloat(m[2]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat, lon };
    }

    // Open Location Code (Google Plus Code) decoder — full/global codes only.
    const OLC_ALPHABET = '23456789CFGHJMPQRVWX';
    function decodePlusCode(text) {
      const match = cleanText(text).toUpperCase().replace(/\s+/g, '').match(/[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3}/);
      if (!match) return null;
      const code = match[0];
      if (code.indexOf('+') !== 8 || code.indexOf('0') > -1) return null; // require a full code, no padding
      const digits = code.replace('+', '');
      for (const ch of digits) { if (OLC_ALPHABET.indexOf(ch) === -1) return null; }
      let southLat = 0, westLng = 0, latRes = 400, lngRes = 400, i = 0;
      while (i < digits.length) {
        if (i < 10) {
          latRes /= 20; lngRes /= 20;
          southLat += OLC_ALPHABET.indexOf(digits.charAt(i)) * latRes;
          if (i + 1 < digits.length) westLng += OLC_ALPHABET.indexOf(digits.charAt(i + 1)) * lngRes;
          i += 2;
        } else {
          const d = OLC_ALPHABET.indexOf(digits.charAt(i));
          latRes /= 5; lngRes /= 4;
          southLat += Math.floor(d / 4) * latRes;
          westLng += (d % 4) * lngRes;
          i += 1;
        }
      }
      const lat = (southLat - 90) + latRes / 2;
      const lon = (westLng - 180) + lngRes / 2;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat: parseFloat(lat.toFixed(6)), lon: parseFloat(lon.toFixed(6)) };
    }

    // --- Plus Codes as an address ---------------------------------------------
    // A waypoint's Address may hold a Google Plus Code instead of a street: some
    // stops genuinely have no street address (a monument in the middle of a
    // park, a trailhead, a bench with a plaque), and a Plus Code names the exact
    // spot without inventing a street number for it. The codec below mirrors
    // mc/builder.html's — keep the two in step, as the CLAUDE.md note says.

    const OLC_BASE_ = 20;
    const OLC_SEP_POS_ = 8;
    const OLC_PAIR_LEN_ = 10;
    const OLC_MAX_LEN_ = 15;
    const OLC_GRID_COLS_ = 4;
    const OLC_GRID_ROWS_ = 5;
    const OLC_PAIR_PREC_ = Math.pow(OLC_BASE_, 3);
    const OLC_GRID_CODE_LEN_ = OLC_MAX_LEN_ - OLC_PAIR_LEN_;
    const OLC_FINAL_LAT_PREC_ = OLC_PAIR_PREC_ * Math.pow(OLC_GRID_ROWS_, OLC_GRID_CODE_LEN_);
    const OLC_FINAL_LNG_PREC_ = OLC_PAIR_PREC_ * Math.pow(OLC_GRID_COLS_, OLC_GRID_CODE_LEN_);

    // Encode a point as a full/global Plus Code. Default length 11 (~3.5 m), the
    // same default the builder uses so a code copied between them matches.
    function encodePlusCode(latitude, longitude, codeLength) {
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return '';
      codeLength = Math.min(OLC_MAX_LEN_, codeLength || OLC_PAIR_LEN_ + 1);
      let lat = Math.min(90, Math.max(-90, latitude));
      let lon = longitude;
      while (lon < -180) lon += 360;
      while (lon >= 180) lon -= 360;
      if (lat === 90) lat -= 1 / OLC_FINAL_LAT_PREC_;
      let latVal = Math.floor(Math.round((lat + 90) * OLC_FINAL_LAT_PREC_ * 1e6) / 1e6);
      let lngVal = Math.floor(Math.round((lon + 180) * OLC_FINAL_LNG_PREC_ * 1e6) / 1e6);
      let code = '';
      for (let i = 0; i < OLC_GRID_CODE_LEN_; i += 1) {
        const ndx = (latVal % OLC_GRID_ROWS_) * OLC_GRID_COLS_ + (lngVal % OLC_GRID_COLS_);
        code = OLC_ALPHABET.charAt(ndx) + code;
        latVal = Math.floor(latVal / OLC_GRID_ROWS_);
        lngVal = Math.floor(lngVal / OLC_GRID_COLS_);
      }
      for (let i = 0; i < OLC_PAIR_LEN_ / 2; i += 1) {
        code = OLC_ALPHABET.charAt(lngVal % OLC_BASE_) + code;
        code = OLC_ALPHABET.charAt(latVal % OLC_BASE_) + code;
        latVal = Math.floor(latVal / OLC_BASE_);
        lngVal = Math.floor(lngVal / OLC_BASE_);
      }
      code = code.substring(0, OLC_SEP_POS_) + '+' + code.substring(OLC_SEP_POS_);
      return code.substring(0, codeLength + 1);
    }

    // Recover a point from a SHORT code ("CWC8+R9" — the form Google Maps shows
    // and the form people paste) against a nearby reference. Without a reference
    // a short code is ambiguous across the globe, which is why the city matters.
    function recoverNearestPlusCode(shortCode, refLat, refLon) {
      if (!Number.isFinite(refLat) || !Number.isFinite(refLon)) return null;
      const code = cleanText(shortCode).toUpperCase().replace(/\s+/g, '');
      const sepIdx = code.indexOf('+');
      if (sepIdx < 0 || sepIdx >= OLC_SEP_POS_) return null;   // not short
      if (code.indexOf('0') > -1) return null;
      const paddingLength = OLC_SEP_POS_ - sepIdx;
      const resolution = Math.pow(OLC_BASE_, 2 - (paddingLength / 2));
      const halfRes = resolution / 2;
      const reconstructed = encodePlusCode(refLat, refLon, OLC_PAIR_LEN_).substring(0, paddingLength) + code;
      const area = decodePlusCode(reconstructed);
      if (!area) return null;
      let lat = area.lat;
      let lon = area.lon;
      if (refLat + halfRes < lat && lat - resolution >= -90) lat -= resolution;
      else if (refLat - halfRes > lat && lat + resolution <= 90) lat += resolution;
      if (refLon + halfRes < lon) lon -= resolution;
      else if (refLon - halfRes > lon) lon += resolution;
      return { lat: parseFloat(lat.toFixed(6)), lon: parseFloat(lon.toFixed(6)) };
    }

    // Does this text look like somebody meant a Plus Code? Used to label the
    // field and to keep Plus Code rows out of the street-address geocoder.
    function looksLikePlusCode(text) {
      return /^[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3}$/i
        .test(cleanText(text).replace(/\s+/g, ''));
    }
    function isShortPlusCode(text) {
      const c = cleanText(text).replace(/\s+/g, '');
      return looksLikePlusCode(c) && c.indexOf('+') < OLC_SEP_POS_;
    }

    // Coordinates or Plus Code → a precise point, locally (no network).
    function addressToPoint(text) {
      return parseLatLon(text) || decodePlusCode(text) || null;
    }

    // Resolve the Address field to a point: coordinates or a Plus Code, locally.
    function resolveAddressPoint(text) {
      return addressToPoint(text);
    }


    // geocodeQuery lived here — a single "address, ZIP" string that only Near
    // called. Fill builds its own ordered set of queries below (fillQueries),
    // and the map has addressQuery, so it went with the button.

    // Ordered lookup queries built from EVERY filled field — richest first, then
    // degrading. Nominatim often needs the venue name dropped to match a street
    // address, so the all-fields query is tried first, then name-less variants.
    function fillQueries(row) {
      const name = cleanText(row.name);
      // Plus Codes resolve locally; only real street text belongs in a query.
      const address = looksLikePlusCode(row.address) ? '' : cleanText(row.address);
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      const zip = cleanText(row.zip);
      const queries = [];
      const add = (...parts) => {
        const q = parts.map(cleanText).filter(Boolean).join(', ');
        if (q && !queries.includes(q)) queries.push(q);
      };
      if (address) {
        add(address, city, state, zip);  // full address + locality + ZIP — most precise
        add(address, zip);               // street address + ZIP
        add(address);                    // street address alone
        add(name, address);              // name + address
      }
      add(name, city, state, zip);       // name + locality + ZIP
      add(city, state, zip);             // locality + ZIP
      add(city, state);                  // locality only
      add(zip);                          // ZIP alone (Nominatim resolves US ZIPs)
      add(name);                         // last resort
      return queries;
    }

    // Try each query in order, returning the first that geocodes. Tolerant of a
    // single bad/rate-limited (non-JSON) response — it just moves to the next.
    async function geocodeFirst(queries) {
      for (let i = 0; i < queries.length; i += 1) {
        if (i > 0) await new Promise((resolve) => setTimeout(resolve, 1100)); // Nominatim ~1 req/sec
        try {
          const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(queries[i])
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&limit=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          if (!res.ok) continue;
          const arr = await res.json();
          if (Array.isArray(arr) && arr.length) return { place: arr[0], query: queries[i] };
        } catch (error) { /* bad/non-JSON response — try the next query */ }
      }
      return null;
    }

    // A precise point from the most authoritative filled field: the Address
    // (coords / Plus Code).
    async function bestPoint(row) {
      // Stored exact coordinates win — no geocoding needed.
      if (Number.isFinite(row.lat) && Number.isFinite(row.lon)) return { lat: row.lat, lon: row.lon };
      let pt = await resolveAddressPoint(cleanText(row.address));
      if (pt) return pt;
      return null;
    }

    // Brief inline feedback on a card button (it sits below the fold, so the
    // top-of-page status line alone is easy to miss).
    function flashButton(button, text) {
      if (!button) return;
      button.textContent = text;
      clearTimeout(button._flashTimer);
      button._flashTimer = setTimeout(() => { button.textContent = 'Fill'; }, 1600);
    }

    // --- ZIP / postcode resolution -------------------------------------------
    // The ZIP is the field a single forward geocode most often comes back
    // without: Nominatim answers a street query from the road object, and roads
    // carry no postcode even though the buildings on them do. So Fill no longer
    // takes "no postcode in the match" as the answer — it asks again, three
    // progressively looser ways, and only gives up after all of them.

    const nominatimPause = () => new Promise((resolve) => setTimeout(resolve, 1100));

    // US ZIPs are stored as the 5-digit form: OSM sometimes carries ZIP+4, which
    // is more precision than the column means and breaks equality with every
    // other row in the same ZIP. Non-US postcodes are kept verbatim — they have
    // their own shapes ("SW1A 1AA", "75008") and must not be digit-scraped.
    function normalizeZip(value, addr) {
      const raw = cleanText(value);
      if (!raw) return '';
      const country = cleanText(addr && addr.country_code).toLowerCase();
      const looksUS = country === 'us' || (!country && /^\d{5}(-\d{4})?$/.test(raw));
      if (!looksUS) return raw;
      const digits = raw.match(/\d{5}/);
      return digits ? digits[0] : '';
    }

    async function reverseGeocode(lat, lon, zoom) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      try {
        const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon
          + '&format=jsonv2&addressdetails=1' + (zoom ? '&zoom=' + zoom : '');
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null;
        const data = await res.json();
        return (data && !data.error) ? data : null;
      } catch (error) { return null; }
    }

    // Does a candidate result sit in the same place as the row? A postcode from
    // the wrong town is worse than a blank ZIP — it looks entered and checked.
    // Only used on results we did NOT get from the row's own coordinates.
    function sameLocality(addr, row) {
      const city = cleanText(row.city).toLowerCase();
      const state = cleanText(row.state).toLowerCase();
      if (!city && !state) return true;
      const stateKey = (value) => {
        const abbr = stateAbbrOf(value);
        return (abbr || cleanText(value)).toLowerCase();
      };
      const candCities = [addr.city, addr.town, addr.village, addr.hamlet, addr.suburb, addr.municipality, addr.county]
        .map((v) => cleanText(v).toLowerCase())
        .filter(Boolean);
      const candState = stateKey(addr.state);
      // A city can be written a dozen ways ("St. Louis" / "City of St. Louis"),
      // so containment either way counts as a match.
      const cityOk = !city || !candCities.length
        || candCities.some((c) => c === city || c.includes(city) || city.includes(c));
      const stateOk = !state || !candState || candState === stateKey(state);
      return cityOk && stateOk;
    }

    // Nominatim's STRUCTURED endpoint — street/city/state in separate params
    // rather than one string. It matches house numbers that the free-text search
    // misses, and it answers from the address point, which does carry a postcode.
    async function structuredLookup(row) {
      const street = cleanText(row.address);
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      if (!street || !(city || state)) return null;
      try {
        const params = new URLSearchParams({ format: 'jsonv2', addressdetails: '1', limit: '1', street: street });
        if (city) params.set('city', city);
        if (state) params.set('state', state);
        const res = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(),
          { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null;
        const arr = await res.json();
        return (Array.isArray(arr) && arr[0]) ? arr[0] : null;
      } catch (error) { return null; }
    }

    // Best ZIP we can get for `row`, given whatever `place`/`point` Fill already
    // resolved. Returns { zip, approx } — approx means it came from a city-level
    // fallback and names the right town but not necessarily the right block.
    // Order: the match itself → the exact point → the structured address → the
    // city centre. Every step is a network call, hence the pauses (Nominatim
    // allows about one request a second).
    async function resolveZip(row, place, point) {
      const fromAddr = (addr) => normalizeZip(addr && addr.postcode, addr || {});

      // 1. Whatever Fill already matched.
      if (place && place.address) {
        const zip = fromAddr(place.address);
        if (zip) return { zip: zip, approx: false };
      }

      // 2. The exact point, reverse-geocoded at building zoom and then wider.
      // A house has a postcode even when the road it is on does not, and if the
      // building is untagged the enclosing suburb or town usually carries one.
      let lat = point ? point.lat : (place ? parseFloat(place.lat) : NaN);
      let lon = point ? point.lon : (place ? parseFloat(place.lon) : NaN);
      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        const zooms = [18, 16, 14];
        for (let i = 0; i < zooms.length; i += 1) {
          await nominatimPause();
          const rev = await reverseGeocode(lat, lon, zooms[i]);
          const zip = rev ? fromAddr(rev.address) : '';
          // Coordinates we already trust — no locality check needed.
          if (zip) return { zip: zip, approx: zooms[i] < 18 && !cleanText(row.address) };
        }
      }

      // 3. The typed address, asked structurally.
      if (cleanText(row.address)) {
        await nominatimPause();
        const hit = await structuredLookup(row);
        if (hit && hit.address && sameLocality(hit.address, row)) {
          const zip = fromAddr(hit.address);
          if (zip) return { zip: zip, approx: false };
          // The structured hit has coordinates even when it has no postcode.
          const hLat = parseFloat(hit.lat);
          const hLon = parseFloat(hit.lon);
          if (Number.isFinite(hLat) && Number.isFinite(hLon)) {
            await nominatimPause();
            const rev = await reverseGeocode(hLat, hLon, 18);
            const revZip = rev ? fromAddr(rev.address) : '';
            if (revZip && sameLocality(rev.address || {}, row)) return { zip: revZip, approx: false };
          }
        }
      }

      // 4. City centre — a real ZIP for the right town, flagged approximate
      // because a city has many and this is only the one at its middle.
      const city = cleanText(row.city);
      const state = cleanText(row.state);
      if (city) {
        await nominatimPause();
        const found = await geocodeFirst([[city, state].filter(Boolean).join(', ')]);
        const cLat = found ? parseFloat(found.place.lat) : NaN;
        const cLon = found ? parseFloat(found.place.lon) : NaN;
        if (Number.isFinite(cLat) && Number.isFinite(cLon)) {
          await nominatimPause();
          const rev = await reverseGeocode(cLat, cLon, 16);
          const zip = rev ? fromAddr(rev.address) : '';
          if (zip && sameLocality(rev.address || {}, row)) return { zip: zip, approx: true };
        }
      }

      return { zip: '', approx: false };
    }

    // Fill `row` from a geocoded `place` (+ optional precise `point`). With
    // overwrite=false (Fill button) only blank fields are set, keeping existing
    // values. With overwrite=true (map click) every field is cleared and
    // replaced with the location's details. Returns the fields it touched.
    async function fillFieldsFromPlace(row, place, point, overwrite) {
      const addr = place.address || {};
      const lat = point ? point.lat : parseFloat(place.lat);
      const lon = point ? point.lon : parseFloat(place.lon);
      const hasCoords = Number.isFinite(lat) && Number.isFinite(lon);

      const name = cleanText(placeName(place, addr));
      const city = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.suburb || addr.municipality || addr.county);
      const state = cleanText(addr.state);
      const zip = normalizeZip(addr.postcode, addr);
      // Address is the STREET ONLY (house number + road) — city/state/zip live in
      // their own fields. A street address is always a street address: if the
      // reverse geocode has no street, leave it blank so the "Missing address"
      // filter finds it. It used to fall back to a "lat, lon" string, which put
      // coordinates in a text field nothing could parse, geocode, or show a
      const streetAddress = [cleanText(addr.house_number), cleanText(addr.road)].filter(Boolean).join(' ');
      const address = streetAddress;

      if (overwrite) {
        // Clear-then-fill: replace every field with the clicked location.
        const description = cleanText(await resolveDescription(place, addr, { name: name }));
        row.name = name;
        row.city = city;
        row.state = state;
        row.zip = zip;
        row.address = address;
        row.description = description;
        if (hasCoords) { row.lat = round6(lat); row.lon = round6(lon); }
        return ['name', 'city', 'state', 'zip', 'address', 'description'];
      }

      // Fill blanks only — keep anything already entered.
      const filled = [];
      const setIfBlank = (field, value) => {
        const v = cleanText(value);
        if (v && !cleanText(row[field])) { row[field] = v; filled.push(field); }
      };
      setIfBlank('name', name);
      setIfBlank('city', city);
      setIfBlank('state', state);
      setIfBlank('zip', zip);
      setIfBlank('address', address);
      if (!cleanText(row.description)) {
        const desc = await resolveDescription(place, addr, row);
        if (desc) { row.description = desc; filled.push('description'); }
      }
      // Store the exact coordinates when we don't already have them.
      if (hasCoords && !(Number.isFinite(row.lat) && Number.isFinite(row.lon))) {
        row.lat = round6(lat);
        row.lon = round6(lon);
      }
      return filled;
    }

    // Use EVERY filled field to locate the place, then fill ONLY the blank
    // fields (name, city, state, address, description). Existing values are
    // kept. A precise point (coords / Plus Code) takes priority;
    // otherwise the richest text query is tried first, degrading until one hits.
    async function fillWaypoint(wpid, button) {
      const row = findRow(wpid);
      if (!row) return;
      const geoFields = ['name', 'city', 'state', 'zip', 'address', 'description'];
      const blanks = geoFields.filter((field) => !cleanText(row[field]));
      if (!blanks.length) {
        flashButton(button, 'All set');
        setStatus(displayName(row) + ' is already complete — nothing blank to fill.');
        return;
      }
      const point = await bestPoint(row);
      const queries = fillQueries(row);
      if (!point && !queries.length) {
        flashButton(button, 'Need info');
        setStatus('Fill in a name or address first, then hit Fill.', 'error');
        return;
      }
      if (button) { button.disabled = true; button.textContent = 'Filling…'; }
      try {
        let place;
        if (point) {
          // A precise point (coordinates / Plus Code) wins — reverse-geocode it.
          const url = 'https://nominatim.openstreetmap.org/reverse?lat=' + point.lat + '&lon=' + point.lon
            + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1';
          const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
          place = await res.json();
          if (!place || place.error) {
            flashButton(button, 'No match');
            setStatus('No place found at that point.', 'error');
            return;
          }
        } else {
          // Use every filled field — richest query first, degrading until one hits.
          const found = await geocodeFirst(queries);
          if (!found) {
            flashButton(button, 'No match');
            setStatus('No match found for this waypoint.', 'error');
            return;
          }
          place = found.place;
        }
        const filled = await fillFieldsFromPlace(row, place, point);
        // A match with no postcode is the common case, not a dead end — chase the
        // ZIP separately before reporting what Fill managed to get.
        let zipApprox = false;
        if (!cleanText(row.zip)) {
          if (button) button.textContent = 'ZIP…';
          const guess = await resolveZip(row, place, point);
          if (guess.zip) {
            row.zip = guess.zip;
            zipApprox = guess.approx;
            filled.push('zip');
          }
        }
        if (!filled.length) {
          flashButton(button, 'No new data');
          setStatus('Found a match, but nothing new to fill.');
          return;
        }
        markDirty(wpid);
        render();
        setStatus('Filled ' + filled.join(', ') + ' for ' + displayName(row) + '.'
          + (zipApprox ? ' The ZIP is the city-centre one — check it against the address.' : '')
          + ' Review, then Save.', 'success');
      } catch (error) {
        console.error(error);
        flashButton(button, 'Failed');
        setStatus('Lookup failed.', 'error');
      } finally {
        if (button) {
          button.disabled = false;
          // 'ZIP…' as well as 'Filling…' — both are in-progress labels this
          // function set, and neither should survive the run.
          if (button.textContent === 'Filling…' || button.textContent === 'ZIP…') button.textContent = 'Fill';
        }
      }
    }

    // Generic OSM types that say nothing useful about a place — drop them so we
    // don't write "a house in Charlotte".
    const GENERIC_PLACE_TYPES = new Set([
      'house', 'yes', 'residential', 'administrative', 'postcode', 'address',
      'road', 'construction', 'locality', 'neighbourhood', 'suburb', 'town',
      'city', 'village', 'hamlet', 'county', 'state', 'country', 'unclassified'
    ]);

    // Best available description: a real Wikipedia summary ONLY when the article
    // is actually about this waypoint (its name matches the geocoded place, or it
    // has no name yet). Otherwise a geocoded address can drag in the Wikipedia
    // entry for a containing building or a nearby landmark — the wrong place.
    async function resolveDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rowName = cleanText(row && row.name);
      const samePlace = !rowName || namesSimilar(rowName, cleanText(place && place.name));
      if (samePlace) {
        let title = wikipediaTitle(extratags);
        if (!title && /^Q\d+$/.test(cleanText(extratags.wikidata))) {
          title = await wikidataEnTitle(cleanText(extratags.wikidata));
        }
        if (title) {
          const summary = await fetchWikiSummary(title);
          if (summary) return summary;
        }
      }
      return buildLocalDescription(place, addr, row);
    }

    function normalizeName(value) {
      return cleanText(value)
        .normalize('NFD').replace(/[̀-ͯ]/g, '') // fold accents: Café -> Cafe
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\b(the|a|an|of|and)\b/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function namesSimilar(a, b) {
      const na = normalizeName(a);
      const nb = normalizeName(b);
      if (!na || !nb) return false;
      return na === nb || na.includes(nb) || nb.includes(na);
    }

    // Pull an English Wikipedia article title from OSM's wikipedia tag
    // ("en:Madison Square Garden"). Non-English tags are skipped.
    function wikipediaTitle(extratags) {
      const w = cleanText(extratags && extratags.wikipedia);
      if (!w) return '';
      const m = w.match(/^([a-z-]+):(.+)$/i);
      if (m) return m[1].toLowerCase() === 'en' ? cleanText(m[2]) : '';
      return w;
    }

    // Resolve a Wikidata id (Q…) to its English Wikipedia title (origin=* → CORS).
    async function wikidataEnTitle(qid) {
      try {
        const url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + encodeURIComponent(qid)
          + '&props=sitelinks&format=json&origin=*';
        const res = await fetch(url);
        if (!res.ok) return '';
        const data = await res.json();
        const entity = data && data.entities && data.entities[qid];
        const link = entity && entity.sitelinks && entity.sitelinks.enwiki;
        return link ? cleanText(link.title) : '';
      } catch (error) { return ''; }
    }

    // Fetch a Wikipedia REST summary and trim it to a couple of sentences.
    async function fetchWikiSummary(title) {
      try {
        const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return '';
        const data = await res.json();
        if (data && (data.type === 'disambiguation')) return '';
        const extract = cleanText(data && data.extract);
        return extract ? trimSentences(extract, 2, 320) : '';
      } catch (error) { return ''; }
    }

    function trimSentences(text, maxSentences, maxChars) {
      const parts = String(text).match(/[^.!?]+[.!?]+/g) || [text];
      let out = parts.slice(0, maxSentences).join(' ').trim();
      if (out.length > maxChars) out = out.slice(0, maxChars - 1).replace(/\s+\S*$/, '').trim() + '…';
      return out;
    }

    // Composed fallback when there is no Wikipedia article: name + category +
    // neighborhood + locality, e.g. "Duckworth's Grill & Taphouse in Uptown,
    // Charlotte, North Carolina."
    function buildLocalDescription(place, addr, row) {
      const extratags = (place && place.extratags) || {};
      const rawType = cleanText(place.type || place.addresstype || place.category).toLowerCase();
      const type = GENERIC_PLACE_TYPES.has(rawType) ? '' : rawType.replace(/_/g, ' ');
      const cuisine = cleanText(extratags.cuisine).replace(/_/g, ' ').replace(/;/g, ', ');
      const descriptor = [cuisine, type].filter(Boolean).join(' ');
      const name = cleanText(row && row.name) || cleanText(place.name);
      const hood = cleanText(addr.neighbourhood || addr.suburb || addr.quarter || addr.city_district);
      const town = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.municipality || addr.county);
      const where = [hood, town, cleanText(addr.state)].filter(Boolean).join(', ');
      if (name && descriptor && where) return name + ', a ' + descriptor + ' in ' + where + '.';
      if (name && where) return name + ' in ' + where + '.';
      if (descriptor && where) return capitalize(descriptor) + ' in ' + where + '.';
      if (where) return where + '.';
      return cleanText(place.display_name);
    }

    function capitalize(text) {
      const t = cleanText(text);
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
    }

    // The Near button — "points of interest within ~330 ft of the waypoint on
    // screen" — was removed 2026-07-28, along with nearWaypoint and its own
    // Overpass fetch. The New world-search covers finding places to add, and it
    // does not require an existing waypoint to stand next to. The results dialog
    // it shared (still id'd near*) and addPoiAsWaypoint stay — the search uses
    // both.

    // Cached geocode. Successful results (and confirmed-empty ones) are cached so
    // re-rendering the same waypoint never re-hits Nominatim; transient failures
    // (rate-limit / HTML error pages) are NOT cached and return null gracefully.
    const geocodeCache = new Map();
    async function geocodeCoords(query) {
      const key = cleanText(query).toLowerCase();
      if (!key) return null;
      if (geocodeCache.has(key)) return geocodeCache.get(key);
      try {
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=jsonv2&limit=1';
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        if (!res.ok) return null; // transient (e.g. rate-limited) — don't cache
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) { geocodeCache.set(key, null); return null; }
        const lat = parseFloat(arr[0].lat);
        const lon = parseFloat(arr[0].lon);
        const result = Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : null;
        geocodeCache.set(key, result);
        return result;
      } catch (error) {
        return null; // non-JSON / network error — don't cache
      }
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const toRad = (d) => d * Math.PI / 180;
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Nearness in walking steps (~2,000 steps per mile), or miles once it's far.
    function formatDistance(m) {
      const miles = m / 1609.34;
      if (miles >= 0.25) return miles.toFixed(1) + ' mi';
      const steps = Math.max(1, Math.round(miles * 2000));
      return steps + (steps === 1 ? ' step' : ' steps');
    }

    // Generic results dialog, shared by Near and the New world-search. Each item
    // is { name, sub, onAdd(button) }.
    function showResults(title, items, emptyMsg, showBlank) {
      const blankBtn = document.getElementById('nearBlankBtn');
      if (blankBtn) blankBtn.hidden = !showBlank;
      const titleEl = document.getElementById('nearTitle');
      if (titleEl) titleEl.textContent = title;
      const statusEl = document.getElementById('nearStatus');
      if (statusEl) statusEl.textContent = items.length + ' found';
      const list = document.getElementById('nearList');
      if (list) {
        list.innerHTML = '';
        if (!items.length) {
          list.appendChild(emptyNode(emptyMsg || 'No results.'));
        } else {
          items.forEach((it) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'near-row';
            const main = document.createElement('div');
            main.className = 'near-main';
            const name = document.createElement('span');
            name.className = 'near-name';
            name.textContent = it.name;
            const sub = document.createElement('span');
            sub.className = 'near-sub';
            sub.textContent = it.sub || '';
            main.append(name, sub);
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn small';
            addBtn.textContent = 'Add';
            addBtn.title = 'Add as a new waypoint';
            addBtn.addEventListener('click', () => it.onAdd(addBtn));
            rowEl.append(main, addBtn);
            list.appendChild(rowEl);
          });
        }
      }
      const dialog = document.getElementById('nearDialog');
      const backdrop = document.getElementById('nearBackdrop');
      if (dialog) dialog.hidden = false;
      if (backdrop) backdrop.hidden = false;
    }

    function closeNearDialog() {
      const dialog = document.getElementById('nearDialog');
      const backdrop = document.getElementById('nearBackdrop');
      if (dialog) dialog.hidden = true;
      if (backdrop) backdrop.hidden = true;
    }

    // Build an AI prompt that asks for REAL walking-tour stops in an area and
    // returns Supabase SQL to run in the dashboard.
    // THE TABLE, described for a reader who cannot look at it. Every prompt on
    // this page ends up as SQL that writes public.waypoints, and the model
    // producing that SQL has no checkout and no database connection - so if the
    // column list is not in the prompt, it guesses. It guesses "title" for name,
    // "url" for source_url, "notes" for description, and the paste fails on the
    // first insert.
    //
    // Prose AND ddl, deliberately: the prose is what stops a wrong column name
    // being invented, the DDL is what makes the paste run against a database
    // that has not had every migration.
    const WAYPOINTS_TABLE_DOC = [
      'THE TABLE YOU ARE WRITING: public.waypoints. Every stop is one row. These are its columns, and there are no others:',
      '',
      '  wpid        bigint   PRIMARY KEY. NEVER SUPPLY IT. A trigger assigns the lowest free id, reusing gaps left by deletes. Any wpid you write is ignored at best and an error at worst.',

      '  city        text     City only, no state and no country. "New Orleans", never "New Orleans, LA".',
      '  state       text     2-letter code for US places: "LA", "NY". The country name for anywhere else.',
      '  address     text     Street number and street. Nothing else - no city, no state, no zip repeated here.',
      '  zip         text     Postal code, as text. Leading zeros matter: "02035" is not 2035.',
      '  description text     One sentence, read aloud at the stop. Max 700 characters.',
      '  source_url  text     The page you verified this from. Never a search-results page.',
      '  lat, lon    float8   Coordinates. LEAVE THEM NULL - the page geocodes the address itself and writes them back. Never guess a coordinate.',
      '  archived    boolean  A do-not-rescrape tombstone. LEAVE IT ALONE. Never write true.',
      '  walk_order  integer  Position in this tour, 1..n. 1 is the START, the highest is the END.',
      '  tour_id     text     Groups rows into one tour. Rows sharing it ARE that tour.',
      '  tour_title  text     What the tour is called. Repeated on every row of the tour.',
      '  tour_shape  text     loop | out_and_back | point_to_point. Repeated on every row of the tour.',
