    // --- Name/address similarity ----------------------------------------------
    // Powers findSimilarExisting, the warning shown before adding a waypoint
    // that looks like one already on file. (The standalone Dedup tool that also
    // used these was removed on 2026-07-27; the guard is what remains.)
    const DEDUP_NAME_T = 0.86;     // name similarity threshold
    const DEDUP_ADDR_T = 0.88;     // address similarity threshold

    function dedupKey(value) {
      return cleanText(value).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      let prev = new Array(n + 1);
      for (let j = 0; j <= n; j++) prev[j] = j;
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) {
          const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        prev = cur;
      }
      return prev[n];
    }

    function dedupSimilarity(rawA, rawB) {
      const a = dedupKey(rawA), b = dedupKey(rawB);
      if (!a || !b) return 0;
      if (a === b) return 1;
      // Containment (e.g. "Cafe du Monde" vs "Cafe du Monde Decatur St") counts high.
      if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0)) return 0.95;
      return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    }

    // Leading house number of an address ("800 Decatur St" -> "800"). Empty when
    // the address has no number (e.g. just a street, or "lat, lon" coords).
    function houseNumber(value) {
      const m = cleanText(value).match(/^\s*#?\s*(\d{1,6})\b/);
      return m ? m[1] : '';
    }

    // Two addresses with DIFFERENT house numbers are not the same place, even if
    // the rest of the street matches. (Missing numbers don't conflict.)
    function streetNumbersConflict(a, b) {
      const na = houseNumber(a), nb = houseNumber(b);
      return Boolean(na && nb && na !== nb);
    }

    function addressSimilarity(a, b) {
      if (!cleanText(a) || !cleanText(b)) return 0;
      if (streetNumbersConflict(a, b)) return 0;
      return dedupSimilarity(a, b);
    }

    // --- OpenStreetMap finder (a mode of the With AI modal, above) ----------------
    // Pulls real tour-worthy places from OpenStreetMap + Wikipedia and renders the
    // pick/results/add flow inside the prompt (With AI) modal.
    let finderPending = [];
    let finderContext = { loc: '', city: '', region: '' };
    let finderBusy = false;

    // Overpass query for tour-worthy named features inside a bounding box.
    async function fetchTourStops(bbox) {
      const area = '(' + bbox.s + ',' + bbox.w + ',' + bbox.n + ',' + bbox.e + ')';
      const q = '[out:json][timeout:25];('
        + 'nwr["historic"]["name"]' + area + ';'
        + 'nwr["tourism"~"^(attraction|museum|artwork|gallery|viewpoint)$"]["name"]' + area + ';'
        + 'nwr["memorial"]["name"]' + area + ';'
        + ');out center 150;';
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass lookup failed.');
      const data = await res.json();
      return Array.isArray(data.elements) ? data.elements : [];
    }

    function tourStopKind(tags) {
      if (tags.historic) return 'historic ' + tags.historic.replace(/_/g, ' ');
      if (tags.tourism === 'artwork') return 'public art';
      if (tags.tourism) return tags.tourism.replace(/_/g, ' ');
      if (tags.memorial) return 'memorial';
      return 'point of interest';
    }

    // Half the bounding-box diagonal in metres, clamped to Wikipedia geosearch
    // limits (1–10 km) — used as the radius for the Wikipedia lookup.
    function bboxRadiusM(b) {
      const lat1 = parseFloat(b.s), lat2 = parseFloat(b.n), lon1 = parseFloat(b.w), lon2 = parseFloat(b.e);
      const dLat = (lat2 - lat1) * 111000;
      const dLon = (lon2 - lon1) * 111000 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
      return Math.max(1000, Math.min(10000, Math.round(Math.sqrt(dLat * dLat + dLon * dLon) / 2)));
    }

    // Notable nearby places from Wikipedia (CORS-enabled) — title, the Wikidata
    // short description, and coordinates. Great for real, described tour stops.
    async function fetchWikipediaStops(lat, lon, radiusM) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return [];
      const url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
        + '&generator=geosearch&ggscoord=' + lat + '%7C' + lon + '&ggsradius=' + Math.round(radiusM)
        + '&ggslimit=300&prop=coordinates%7Cdescription&colimit=max';
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const pages = (data && data.query && data.query.pages) ? Object.keys(data.query.pages).map((k) => data.query.pages[k]) : [];
      return pages.map((p) => {
        const c = (p.coordinates && p.coordinates[0]) || null;
        return { title: p.title, lat: c ? c.lat : null, lon: c ? c.lon : null, description: p.description || '' };
      }).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
    }

    async function runFinder(loc, list) {
      loc = cleanText(loc);
      list.innerHTML = '';
      if (!loc) { list.append(zipNote('Pick or type a city first.')); return; }
      const parsed = parseLocation(loc);
      finderContext = { loc: loc, city: parsed.city, region: parsed.region };
      list.append(zipNote('Searching OpenStreetMap and Wikipedia…'));
      try {
        // City bounding box + center via Nominatim (works worldwide).
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(loc)
          + '&format=jsonv2&limit=1';
        const geo = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        const hit = (await geo.json())[0];
        if (!hit || !hit.boundingbox) { list.innerHTML = ''; list.append(zipNote('Couldn’t locate “' + loc + '”. Try adding the country.')); return; }
        const bb = hit.boundingbox; // [south, north, west, east]
        const bbox = { s: bb[0], n: bb[1], w: bb[2], e: bb[3] };
        const center = { lat: parseFloat(hit.lat), lon: parseFloat(hit.lon) };

        // Both sources in parallel; if one fails the other still shows.
        const [els, wikis] = await Promise.all([
          fetchTourStops(bbox).catch(() => []),
          fetchWikipediaStops(center.lat, center.lon, bboxRadiusM(bbox)).catch(() => [])
        ]);

        // De-duplicate by name; OSM added first so its street address wins.
        const seen = new Set();
        const items = [];
        const add = (it) => { const k = cleanText(it.name).toLowerCase(); if (!k || seen.has(k)) return; seen.add(k); items.push(it); };

        els.forEach((el) => {
          const tags = el.tags || {};
          const name = cleanText(tags.name);
          if (!name) return;
          const street = [cleanText(tags['addr:housenumber']), cleanText(tags['addr:street'])].filter(Boolean).join(' ');
          const lat = (el.lat != null) ? el.lat : (el.center && el.center.lat);
          const lon = (el.lon != null) ? el.lon : (el.center && el.center.lon);
          const k = tourStopKind(tags);
          add({
            name: name, city: parsed.city, state: parsed.region, zip: cleanText(tags['addr:postcode']), address: street,
            description: cleanText(tags.description) || (k.charAt(0).toUpperCase() + k.slice(1) + '.'),
            kind: k, lat: lat, lon: lon
          });
        });
        // Wikipedia geo-articles include non-places (events, orgs, teams) — skip those.
        const WIKI_SKIP = /\b(convention|festival|organi[sz]ation|company|corporation|election|fire|flood|riot|massacre|shooting|magazine|newspaper|album|song|film|band|team|league|club|diocese|archdiocese|jurisdiction|census|neighborhood|neighbourhood|community|list of)\b/i;
        wikis.forEach((w) => {
          const name = cleanText(w.title).replace(/\s*\([^)]*\)\s*$/, '').trim(); // drop "(City)" disambiguators
          const desc = cleanText(w.description);
          if (!name || (desc && WIKI_SKIP.test(desc))) return;
          add({
            name: name, city: parsed.city, state: parsed.region, zip: '', address: '',
            description: desc, kind: desc || 'Wikipedia', lat: w.lat, lon: w.lon
          });
        });

        if (!items.length) { list.innerHTML = ''; list.append(zipNote('No tour-worthy places found here. Try a larger nearby city.')); return; }
        items.sort((a, b) => a.name.localeCompare(b.name));
        renderFinderResults(items);
      } catch (error) {
        console.error(error);
        list.innerHTML = '';
        list.append(zipNote('Search failed — the sources may be busy. Try again in a moment.'));
      }
    }

    function renderFinderResults(items) {
      setPromptView('results');
      finderPending = items;
      items.forEach((it) => { it._dup = findSimilarExisting(it); it._include = !it._dup; });
      const dupCount = items.filter((it) => it._dup).length;
      const title = document.getElementById('promptTitle');
      if (title) title.textContent = items.length + ' found in ' + finderContext.loc;
      const body = document.getElementById('promptBody');
      if (!body) return;
      body.innerHTML = '';
      if (!items.length) { body.append(zipNote('No tour-worthy places found here. Try a larger nearby city.')); setPromptView('picker'); return; }

      const tools = document.createElement('div');
      tools.className = 'pick-tools';
      const all = document.createElement('a');
      all.textContent = 'Select all';
      const none = document.createElement('a');
      none.textContent = 'Select none';
      const summary = document.createElement('span');
      summary.className = 'zip-desc';
      tools.append(all, none, summary);

      const list = document.createElement('div');
      list.className = 'pick-list';
      // Add button lives at the foot of the results (not in the modal bar).
      const foot = document.createElement('div');
      foot.className = 'pick-foot';
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn primary';
      addBtn.addEventListener('click', finderAdd);
      foot.append(addBtn);
      const checks = [];
      const refresh = () => {
        const n = items.filter((it) => it._include).length;
        summary.textContent = n + ' of ' + items.length + ' selected' + (dupCount ? ' · ' + dupCount + ' already in your list' : '');
        addBtn.textContent = 'Add selected (' + n + ')';
        addBtn.disabled = n === 0;
      };
      items.forEach((it) => {
        const row = document.createElement('label');
        row.className = 'pick-row' + (it._dup ? ' dup' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = it._include;
        cb.addEventListener('change', () => { it._include = cb.checked; refresh(); });
        checks.push(cb);
        const main = document.createElement('div');
        main.className = 'pick-main';
        const nm = document.createElement('span');
        nm.className = 'pick-name';
        nm.textContent = it.name;
        const sub = document.createElement('span');
        sub.className = 'pick-sub';
        sub.textContent = [it.kind, it.address].filter(Boolean).join(' · ');
        main.append(nm, sub);
        if (it._dup) {
          const dn = document.createElement('span');
          dn.className = 'pick-dupnote';
          dn.textContent = 'Already have #' + it._dup.row.wpid + ' — similar ' + it._dup.reason;
          main.append(dn);
        }
        row.append(cb, main);
        list.append(row);
      });
      all.addEventListener('click', () => { items.forEach((it, i) => { it._include = true; checks[i].checked = true; }); refresh(); });
      none.addEventListener('click', () => { items.forEach((it, i) => { it._include = false; checks[i].checked = false; }); refresh(); });
      body.append(tools, list, foot);
      refresh();
    }

    async function finderAdd() {
      if (finderBusy) return; // guard against a double-click / double add
      const items = finderPending.filter((it) => it._include);
      if (!items.length) { setStatus('Nothing selected to add.', 'error'); return; }
      finderBusy = true;
      finderPending.forEach((it) => { it._include = false; }); // can't be re-added
      setPromptView('picker');
      const title = document.getElementById('promptTitle');
      const body = document.getElementById('promptBody');
      if (title) title.textContent = 'Adding…';
      var prog = null;
      if (body) {
        body.innerHTML = '';
        prog = document.createElement('div');
        prog.className = 'zip-desc';
        body.append(prog);
      }
      let added = 0, failed = 0, skipped = 0;
      try {
        for (let i = 0; i < items.length; i++) {
          if (prog) prog.textContent = 'Adding ' + (i + 1) + ' of ' + items.length + '… (' + items[i].name + ')';
          // Skip anything that now matches an existing waypoint — including one
          // added moments ago in this same batch (pushed into state.rows below).
          if (findSimilarExisting(items[i])) { skipped++; continue; }
          const it = items[i];
          try {
            const fresh = await postWaypoint(it);
            if (fresh && fresh.wpid) state.rows.push(fresh);
            added++;
          } catch (error) { console.error(error); failed++; }
        }
        await refresh();
      } finally {
        finderBusy = false;
      }
      if (title) title.textContent = 'Added';
      if (body) {
        body.innerHTML = '';
        const done = document.createElement('div');
        done.className = 'zip-desc';
        const extra = [skipped ? skipped + ' skipped as duplicates' : '', failed ? failed + ' failed' : ''].filter(Boolean).join(', ');
        done.textContent = 'Added ' + added + ' waypoint' + (added === 1 ? '' : 's') + (extra ? ' (' + extra + ')' : '') + '. Use Fill on each to complete the address.';
        const again = document.createElement('button');
        again.type = 'button';
        again.className = 'btn small';
        again.textContent = 'Find more';
        again.addEventListener('click', () => renderPromptChooser());
        body.append(done, again);
      }
      setStatus('Added ' + added + ' stop' + (added === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' duplicate' + (skipped === 1 ? '' : 's') + ' skipped)' : '') + '.', failed ? 'error' : 'success');
    }

    // Find an existing waypoint whose name or address closely matches a payload
    // about to be imported.
    function findSimilarExisting(payload) {
      const name = cleanText(payload && payload.name);
      const address = cleanText(payload && payload.address);
      if (!name && !address) return null;
      for (const row of state.rows) {
        const nameSim = (name && cleanText(row.name)) ? dedupSimilarity(name, row.name) : 0;
        const addrSim = addressSimilarity(address, row.address);
        if (nameSim >= DEDUP_NAME_T || addrSim >= DEDUP_ADDR_T) {
          return { row: row, reason: nameSim >= addrSim ? 'name' : 'address' };
        }
      }
      return null;
    }

    // Insert a new waypoint, prompting to save the current one first, then jump
    // to the new one (clearing any filter so it's visible). Shared by all "Add".
    // Explicit all-null payload for a blank waypoint. (An empty {} can come back
    // with no representation, leaving us without the new row's wpid to jump to.)
    function blankWaypoint() {
      return { name: null, city: null, state: null, zip: null, address: null, description: null };
    }

    async function insertWaypointAndGo(payload, button) {
      // Warn before importing something that looks like an existing waypoint.
      const match = findSimilarExisting(payload);
      if (match) {
        const incoming = cleanText(payload.name) || cleanText(payload.address) || 'this point';
        if (!window.confirm(
          'This looks like a duplicate of existing waypoint #' + match.row.wpid
          + (cleanText(match.row.name) ? ' (' + match.row.name + ')' : '')
          + ' — similar ' + match.reason + '.\n\nImport "' + incoming + '" anyway?'
        )) {
          if (button) { button.disabled = false; button.textContent = 'Add'; }
          return;
        }
      }
      const current = findRow(state.randomId);
      if (current && state.dirtyIds.has(current.wpid)) {
        if (window.confirm('Save changes to "' + displayName(current) + '" before adding?')) {
          try {
            await patchRow(current.wpid, current);
            state.dirtyIds.delete(current.wpid);
          } catch (error) {
            setStatus('Could not save ' + displayName(current) + '.', 'error');
            if (button) { button.disabled = false; button.textContent = 'Add'; }
            return;
          }
        }
      }
      if (button) { button.disabled = true; button.textContent = 'Adding…'; }
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl(TABLE, {}), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify(stripDroppedColumns(payload))
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not add waypoint.'));
        const rows = await res.json();
        const fresh = normalizeRow(Array.isArray(rows) && rows[0] ? rows[0] : {});
        closeNearDialog();
        // Land in the new stop's own city — a "+1" on a city button would be a
        // worse answer to "did that work" than seeing the card.
        state.cityFilter = cityKey(fresh);
        await refresh(fresh.wpid);
        setStatus('Added waypoint #' + fresh.wpid + '.', 'success');
      } catch (error) {
        console.error(error);
        if (button) { button.disabled = false; button.textContent = 'Add'; }
        setStatus(error.message || 'Add failed.', 'error');
      }
    }

    // Add a nearby POI (Overpass) as a new waypoint. `fallback` supplies
    // city/state when the POI's own tags don't.
    async function addPoiAsWaypoint(poi, fallback, button) {
      const t = poi.tags || {};
      const street = [cleanText(t['addr:housenumber']), cleanText(t['addr:street'])].filter(Boolean).join(' ');
      const town = cleanText(t['addr:city']) || cleanText(fallback && fallback.city);
      const st = cleanText(t['addr:state']) || cleanText(fallback && fallback.state);
      const desc = poi.cat ? poi.name + ', a ' + poi.cat + (town ? ' in ' + town : '') + '.' : '';
      await insertWaypointAndGo({
        name: poi.name || null,
        city: town || null,
        state: st || null,
        address: street || null,
        description: desc || null
      }, button);
    }

    // Friendly category words -> OSM tag filters, for "category place" searches.
    const CATEGORY_TAGS = {
      stadium: ['leisure=stadium', 'building=stadium'], arena: ['leisure=sports_centre', 'leisure=stadium'],
      park: ['leisure=park'], garden: ['leisure=garden'], playground: ['leisure=playground'],
      museum: ['tourism=museum'], gallery: ['tourism=gallery'], zoo: ['tourism=zoo'], aquarium: ['tourism=aquarium'],
      hotel: ['tourism=hotel'], motel: ['tourism=motel'], hostel: ['tourism=hostel'],
      restaurant: ['amenity=restaurant'], diner: ['amenity=restaurant'], cafe: ['amenity=cafe'], coffee: ['amenity=cafe'],
      bar: ['amenity=bar', 'amenity=pub'], pub: ['amenity=pub'], brewery: ['craft=brewery', 'microbrewery=yes'],
      bakery: ['shop=bakery'], market: ['amenity=marketplace', 'shop=supermarket'], supermarket: ['shop=supermarket'],
      theater: ['amenity=theatre'], theatre: ['amenity=theatre'], cinema: ['amenity=cinema'], movie: ['amenity=cinema'],
      library: ['amenity=library'], church: ['amenity=place_of_worship'], cathedral: ['amenity=place_of_worship'],
      school: ['amenity=school'], university: ['amenity=university'], college: ['amenity=college'],
      hospital: ['amenity=hospital'], pharmacy: ['amenity=pharmacy'], bank: ['amenity=bank'],
      bookstore: ['shop=books'], bookshop: ['shop=books'], store: ['shop'], shop: ['shop'], mall: ['shop=mall'],
      monument: ['historic=monument', 'historic=memorial'], memorial: ['historic=memorial'],
      statue: ['tourism=artwork', 'historic=memorial'], landmark: ['tourism=attraction'], attraction: ['tourism=attraction'],
      golf: ['leisure=golf_course'], gym: ['leisure=fitness_centre'], pool: ['leisure=swimming_pool'],
      cemetery: ['landuse=cemetery', 'amenity=grave_yard'], hall: ['amenity=townhall'], 'city hall': ['amenity=townhall']
    };

    // The New button: search the world for the box text and offer matches to add.
    // Called from the Manual dialog's "Find online" button, which passes what
    // you have typed in Name. It used to read the toolbar search box, which was
    // removed 2026-07-29.
    async function openWorldSearch(button, queryText) {
      const query = cleanText(queryText);
      if (!query) {
        // Empty box → create a blank waypoint to fill in by hand.
        await insertWaypointAndGo(blankWaypoint(), null);
        return;
      }
      const origLabel = button ? button.textContent : '';
      if (button) { button.disabled = true; button.textContent = 'Searching…'; }
      try {
        // Named place/address matches first...
        const named = await nominatimSearch(query);
        let items = named.map(namedItem);
        // ...then, when the text contains a category word ("stadium charlotte"),
        // append category matches (Overpass) so they always surface.
        if (parseCategory(query)) {
          const cat = await categorySearch(query);
          if (cat && cat.items.length) {
            const seen = new Set(items.map((i) => i.name.toLowerCase()));
            items = items.concat(cat.items.filter((i) => !seen.has(i.name.toLowerCase())));
          }
        }
        // Still nothing? Many businesses aren't in Nominatim by name. If the text
        // ends with a place ("Euclid Records New Orleans"), search OSM by name
        // within that place (Overpass).
        if (!items.length) {
          const nm = await nameSearch(query);
          if (nm && nm.items.length) items = nm.items;
        }
        showResults('Add a waypoint — "' + query + '"', items,
          'Nothing found. For a business, add a city — e.g. "Euclid Records New Orleans".', true);
      } catch (error) {
        console.error(error);
        setStatus('World search failed.', 'error');
      } finally {
        if (button) { button.disabled = false; button.textContent = origLabel; }
      }
    }

    // Named place/address search with a comma-stripped free-text fallback.
    async function nominatimSearch(query) {
      const variants = [query];
      if (query.indexOf(',') >= 0) variants.push(query.replace(/,/g, ' ').replace(/\s+/g, ' ').trim());
      for (let i = 0; i < variants.length; i += 1) {
        if (i > 0) await new Promise((resolve) => setTimeout(resolve, 350));
        const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(variants[i])
          + '&format=jsonv2&addressdetails=1&extratags=1&namedetails=1&limit=10';
        const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
        const arr = await res.json();
        if (Array.isArray(arr) && arr.length) return arr;
      }
      return [];
    }

    function namedItem(p) {
      const addr = p.address || {};
      const nm = placeName(p, addr) || cleanText(p.display_name).split(',')[0];
      return { name: nm, sub: cleanText(p.display_name), onAdd: (btn) => addPlaceAsWaypoint(p, btn) };
    }

    // Pull a category keyword out of the query; the rest is the location.
    function parseCategory(query) {
      const words = query.toLowerCase().replace(/,/g, ' ').split(/\s+/).filter(Boolean);
      let term = null, tags = null, idx = -1;
      for (let i = 0; i < words.length; i += 1) {
        if (CATEGORY_TAGS[words[i]]) { term = words[i]; tags = CATEGORY_TAGS[words[i]]; idx = i; break; }
      }
      if (!term) return null;
      const connectors = new Set(['near', 'in', 'around', 'by', 'at', 'close', 'to', 'the', 'of', 'a']);
      const location = words.filter((w, i) => i !== idx && !connectors.has(w)).join(' ').trim();
      return { term, tags, location };
    }

    // Category mode: geocode the location, then Overpass for the category in its
    // bounding box. Returns dialog items (or null when not a category query).
    async function categorySearch(query) {
      const parsed = parseCategory(query);
      if (!parsed || !parsed.location) return null;
      const geo = await geocodePlace(parsed.location);
      if (!geo || !geo.bbox) return null;
      const pois = await fetchCategoryPois(parsed.tags, geo.bbox, geo.center);
      const fallback = {
        city: cleanText(geo.addr.city || geo.addr.town || geo.addr.village || geo.addr.municipality || geo.addr.county),
        state: cleanText(geo.addr.state)
      };
      const items = pois.map((poi) => ({
        name: poi.name,
        sub: [poi.cat, formatDistance(poi.dist) + ' away'].filter(Boolean).join(' · '),
        onAdd: (btn) => addPoiAsWaypoint(poi, fallback, btn)
      }));
      return { items, term: parsed.term, where: geo.label, label: '"' + parsed.term + '" in ' + geo.label };
    }

    // Geocode a place to a center + bounding box + address.
    async function geocodePlace(q) {
      const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q)
        + '&format=jsonv2&addressdetails=1&limit=1';
      const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const arr = await res.json();
      const p = (Array.isArray(arr) && arr[0]) || null;
      if (!p) return null;
      const lat = parseFloat(p.lat), lon = parseFloat(p.lon);
      const bb = p.boundingbox;
      return {
        center: { lat, lon },
        bbox: bb ? { s: parseFloat(bb[0]), n: parseFloat(bb[1]), w: parseFloat(bb[2]), e: parseFloat(bb[3]) } : null,
        addr: p.address || {},
        label: cleanText(p.display_name).split(',').slice(0, 2).join(', ')
      };
    }

    // Overpass: named POIs of the given tag filters within a bounding box.
    async function fetchCategoryPois(tags, bbox, center) {
      const bb = bbox.s + ',' + bbox.w + ',' + bbox.n + ',' + bbox.e; // overpass: south,west,north,east
      const filters = tags.map((t) => {
        const [k, v] = t.split('=');
        return v ? '["' + k + '"="' + v + '"]' : '["' + k + '"]';
      });
      const q = '[out:json][timeout:25];('
        + filters.map((f) => 'node' + f + '["name"](' + bb + ');way' + f + '["name"](' + bb + ');').join('')
        + ');out center tags 50;';
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass ' + res.status);
      const data = await res.json();
      const seen = new Set();
      const out = [];
      (data.elements || []).forEach((el) => {
        const t = el.tags || {};
        const name = cleanText(t.name);
        if (!name) return;
        const plat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const plon = el.lon != null ? el.lon : (el.center && el.center.lon);
        if (plat == null || plon == null) return;
        const key = name.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const cat = cleanText(t.amenity || t.leisure || t.tourism || t.shop || t.historic || t.building).replace(/_/g, ' ');
        out.push({ name, cat, lat: plat, lon: plon, tags: t, dist: haversineMeters(center.lat, center.lon, plat, plon) });
      });
      out.sort((a, b) => a.dist - b.dist);
      return out.slice(0, 30);
    }

    // Find a business/POI by name within a place. Tries the last 1-3 words of the
    // query as the location and the rest as the name, then Overpass name-matches
    // within that bounding box. Catches names Nominatim doesn't index.
    async function nameSearch(query) {
      const tries = [];
      // 1) Comma split: "Euclid Records, New Orleans" -> name + location.
      const ci = query.lastIndexOf(',');
      if (ci > 0) {
        const nm = cleanText(query.slice(0, ci));
        const loc = cleanText(query.slice(ci + 1));
        if (nm && loc) tries.push({ nm, loc });
      }
      // 2) Word split: last 1-3 words as the location, the rest as the name.
      const words = cleanText(query).replace(/,/g, ' ').replace(/\s+/g, ' ').split(' ').filter(Boolean);
      for (let take = Math.min(3, words.length - 1); take >= 1; take -= 1) {
        const loc = words.slice(words.length - take).join(' ');
        const nm = words.slice(0, words.length - take).join(' ');
        if (nm && loc) tries.push({ nm, loc });
      }
      const seenTry = new Set();
      for (const t of tries) {
        const key = t.nm.toLowerCase() + '|' + t.loc.toLowerCase();
        if (seenTry.has(key)) continue;
        seenTry.add(key);
        const geo = await geocodePlace(t.loc);
        if (!geo || !geo.bbox) continue;
        const pois = await fetchNamedPois(t.nm, geo.bbox, geo.center);
        if (pois.length) {
          const fallback = {
            city: cleanText(geo.addr.city || geo.addr.town || geo.addr.village || geo.addr.municipality || geo.addr.county),
            state: cleanText(geo.addr.state)
          };
          return {
            items: pois.map((poi) => ({
              name: poi.name,
              sub: [poi.cat, formatDistance(poi.dist) + ' away'].filter(Boolean).join(' · '),
              onAdd: (btn) => addPoiAsWaypoint(poi, fallback, btn)
            }))
          };
        }
      }
      return null;
    }

    // Overpass: POIs whose name matches `name` (case-insensitive) within a bbox.
    async function fetchNamedPois(name, bbox, center) {
      const bb = bbox.s + ',' + bbox.w + ',' + bbox.n + ',' + bbox.e;
      const safe = name.replace(/[^\p{L}\p{N}]+/gu, '.').replace(/^\.+|\.+$/g, ''); // lenient; trim seps
      if (!safe) return [];
      const q = '[out:json][timeout:25];(nwr["name"~"' + safe + '",i](' + bb + '););out center tags 30;';
      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: 'data=' + encodeURIComponent(q)
      });
      if (!res.ok) throw new Error('Overpass ' + res.status);
      const data = await res.json();
      const seen = new Set();
      const out = [];
      (data.elements || []).forEach((el) => {
        const t = el.tags || {};
        const nm = cleanText(t.name);
        if (!nm) return;
        const plat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const plon = el.lon != null ? el.lon : (el.center && el.center.lon);
        if (plat == null || plon == null) return;
        const key = nm.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        const cat = cleanText(t.shop || t.amenity || t.leisure || t.tourism || t.historic || t.office || t.craft).replace(/_/g, ' ');
        out.push({ name: nm, cat, lat: plat, lon: plon, tags: t, dist: haversineMeters(center.lat, center.lon, plat, plon) });
      });
      out.sort((a, b) => a.dist - b.dist);
      return out.slice(0, 30);
    }

    // Add a world-search result (a geocoded Nominatim place) as a new waypoint.
    async function addPlaceAsWaypoint(place, button) {
      const lat = parseFloat(place.lat);
      const lon = parseFloat(place.lon);
      const point = (Number.isFinite(lat) && Number.isFinite(lon)) ? { lat, lon } : null;
      const draft = { wpid: '', name: '', city: '', state: '', address: '', description: '' };
      if (button) { button.disabled = true; button.textContent = 'Adding…'; }
      await fillFieldsFromPlace(draft, place, point, true);
      await insertWaypointAndGo({
        name: draft.name || null,
        city: draft.city || null,
        state: draft.state || null,
        address: draft.address || null,
        description: draft.description || null
      }, button);
    }

    // A name for the waypoint even when the geocoded place has none: the POI
    // name, else the street, else the neighbourhood, else the locality, else the
    // leading part of the full address. Fill should never leave the name blank.
    function placeName(place, addr) {
      const nd = place && place.namedetails;
      const direct = cleanText(place && place.name) || cleanText(nd && (nd.name || nd['name:en']));
      if (direct) return direct;
      const street = [cleanText(addr.house_number), cleanText(addr.road)].filter(Boolean).join(' ');
      if (street) return street;
      const hood = cleanText(addr.neighbourhood || addr.suburb || addr.quarter || addr.city_district);
      if (hood) return hood;
      const town = cleanText(addr.city || addr.town || addr.village || addr.hamlet || addr.municipality || addr.county);
      if (town) return town;
      const dn = cleanText(place && place.display_name);
      return dn ? dn.split(',')[0].trim() : '';
    }

    // Tidy "house road, city, ST zip" from Nominatim address components.
    function shortAddress(a) {
      const line = [];
      const street = [a.house_number, a.road].filter(Boolean).join(' ');
      if (street) line.push(street);
      const town = a.city || a.town || a.village || a.hamlet || a.suburb || a.municipality;
      if (town) line.push(town);
      const tail = [a.state, a.postcode].filter(Boolean).join(' ');
      if (tail) line.push(tail);
      return line.join(', ');
    }

    function updateCardState(wpid) {
      const card = wpList.querySelector('[data-wpid="' + cssEscape(wpid) + '"]');
      if (!card) return;
      const row = findRow(wpid);
      card.classList.toggle('is-dirty', state.dirtyIds.has(wpid));
      card.classList.toggle('is-saving', state.savingIds.has(wpid));
      card.classList.toggle('is-archived', isArchived(row));
      const save = card.querySelector('[data-action="save"]');
      if (save) save.disabled = !state.dirtyIds.has(wpid) || state.savingIds.has(wpid);
      updateSaveAllState();
      const archive = card.querySelector('[data-action="archive"]');
      if (archive && row) {
        archive.disabled = state.savingIds.has(wpid);
        archive.textContent = isArchived(row) ? 'Restore' : 'Archive';
        archive.title = isArchived(row)
          ? 'Restore this waypoint to the active working list'
          : 'Archive this waypoint so future AI/nightly reviews do not suggest it again';
      }
      const badge = card.querySelector('[data-saved]');
      if (badge && row) setSavedBadge(badge, row);
    }

    function cssEscape(value) {
      if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value));
      return String(value).replace(/["\\]/g, '\\$&');
    }

    // --- Filtering / ordering / grouping (by city) ---------------------------
    // searchHaystack went with the search box on 2026-07-29 — nothing filters
    // on free text any more; the city buttons and the status dropdown do it all.

    // The filtered + ordered set on screen: one city (or every city, when the
    // All button is active), narrowed by the status filter and sorted.
    function navRows() {
      return state.rows
        .filter(matchesArchiveMode)
        .filter(matchesCityFilter)
        .sort(compareRows);
    }

    // City filter, driven by public.cities (the one catalog) via window.TgbCities.
    //
    // The join is on the city NAME only: waypoints store a bare city ("New
    // Orleans") plus a separate state column, while the catalog stores the
    // canonical "New Orleans, Louisiana". Comparing the two strings whole gives
    // zero matches, so both sides are normalized to the part before the first
    // comma, lowercased. Catalog rows sharing a base name (currently the
    // duplicated Sacramento) collapse into one option - a waypoint holding only
    // "Sacramento" could not be assigned to either row anyway.
    function cityKeyFromName(value) {
      return cleanText(value).split(',')[0].trim().toLowerCase();
    }

    function cityKey(row) { return cityKeyFromName(row && row.city); }

    // The city the page opens on. "All" is 210 waypoints across 59 cities and
    // answers no question you actually arrive with; one city is a walk you can
    // read. Change the constant to move it.
    const DEFAULT_CITY_KEY = 'new orleans';
    let defaultCityApplied = false;

    // ONCE, on the first load of the session, and only when nothing else has
    // already chosen a city. Every other caller of refresh() has a reason for
    // the filter it is on — adding a waypoint lands you in that stop's city,
    // and paging or saving must not yank you back here — so this fires exactly
    // one time and then gets out of the way.
    //
    // It also checks the city is actually in the table. If New Orleans is ever
    // emptied or renamed, the page falls back to All rather than opening on an
    // empty list with no clue why.
    function applyDefaultCityOnce() {
      if (defaultCityApplied) return;
      defaultCityApplied = true;
      if (state.cityFilter) return;
      const exists = state.rows.some((row) => !isArchived(row) && cityKey(row) === DEFAULT_CITY_KEY);
      if (exists) state.cityFilter = DEFAULT_CITY_KEY;
    }

    function matchesCityFilter(row) {
      if (!state.cityFilter) return true;
      return cityKey(row) === state.cityFilter;
    }

    // The status/"missing X" dropdown was removed 2026-07-29 with the rest of
    // the toolbar. The only rows still held back are archived ones: tombstones
    // kept so the AI importers do not rescrape a stop somebody deliberately
    // retired. Everything a filter used to find is now on the city badge as an
    // error count, which is the same information without a control to set.
    function matchesArchiveMode(row) { return !isArchived(row); }

    function isFiltered() { return !!state.cityFilter; }

    function rowsForCityCounts() { return state.rows.filter(matchesArchiveMode); }

    // The city buttons: All first, then every city that HAS waypoints, A-Z, each
    // badged with its count. This replaced the city dropdown on 2026-07-29 —
    // a dropdown hid the one fact you open this page for (where the coverage is)
    // behind a click, and the catalog grouping it did (cities with no waypoints
    // yet, cities missing from the catalog) belongs on the cities admin, not
    // here. A city with nothing in it is not a button worth pressing.
    function renderCityBar() {
      const bar = document.getElementById('cityBar');
      if (!bar) return;
      bar.innerHTML = '';
      if (!state.authed) { bar.hidden = true; return; }
      bar.hidden = false;

      const rows = rowsForCityCounts();
      const groups = new Map();
      rows.forEach((row) => {
        const key = cityKey(row);
        const label = cleanText(row.city) || 'No city';
        if (!groups.has(key)) groups.set(key, { key: key, label: label, count: 0, errors: 0 });
        const g = groups.get(key);
        g.count += 1;
        if (waypointErrors(row).length) g.errors += 1;
      });

      const mk = (key, label, count, errors) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'city-btn' + (state.cityFilter === key ? ' is-active' : '');
        const n = document.createElement('span');
        n.className = 'city-btn-name';
        n.textContent = label;
        const c = document.createElement('span');
        c.className = 'city-btn-count';
        // These are WAYPOINTS: a Stop is a waypoint plus a challenge, and it does
        // not exist until a game puts the two together.
        c.textContent = count + (count === 1 ? ' waypoint' : ' waypoints');
        // The error line is on every button so they stay the same height and the
        // eye can run down the column of red; a clean city says so rather than
        // going blank.
        const e = document.createElement('span');
        e.className = 'city-btn-errors' + (errors ? '' : ' is-clean');
        e.textContent = errors ? errors + (errors === 1 ? ' error' : ' errors') : 'no errors';
        b.append(n, c, e);
        b.addEventListener('click', () => openCity(key));
        return b;
      };

      // All leads the row: the whole table, every city at once.
      bar.append(mk('', 'All', rows.length, rows.filter((r) => waypointErrors(r).length).length));
      Array.from(groups.values())
        .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }))
        .forEach((g) => bar.append(mk(g.key, g.label, g.count, g.errors)));
    }

    // What is wrong with a waypoint, as a list of field names. "Error" means a
    // field a walking tour actually needs: you cannot route to a waypoint with no
    // address, and one with no description gives a challenge writer nothing to
    // build on. ZIP counts because it is what the map falls back to when the
    // street will not geocode. Archived rows are tombstones — never counted.
    // The fields an error can be about — the same list the card paints red, so
    // the badge count and the borders can never disagree.
    const ERROR_FIELDS = ['address', 'city', 'zip', 'description'];

    // A Plus Code in Address is not a missing address — it is a more precise one
    // than a street number, and it is why the field accepts one at all. It also
    // clears the ZIP error: ZIP is only counted because it is what the map falls
    // back to when a street will not geocode, and a Plus Code never needs that
    // fallback. A SHORT code that cannot be recovered is still an error, because
    // it does not locate anything on its own.
    function hasPlusCodeAddress(row) {
      const value = cleanText(row && row.address);
      if (!looksLikePlusCode(value)) return false;
      if (!isShortPlusCode(value)) return !!decodePlusCode(value);
      const ref = cityReferencePoint(row);
      return !!(ref && recoverNearestPlusCode(value, ref.lat, ref.lon));
    }

    function waypointErrors(row) {
      if (isArchived(row)) return [];
      const plusCoded = hasPlusCodeAddress(row);
      return ERROR_FIELDS.filter((field) => {
        if (plusCoded && (field === 'address' || field === 'zip')) return false;
        return !cleanText(row[field]);
      });
    }

    // Always feature exactly one waypoint. Keep the current one if it's still in
    // the navigable set; otherwise fall back to the first.
    function ensureCurrent() {
      const list = navRows();
      if (!list.length) { state.randomId = null; return null; }
      if (!list.some((row) => row.wpid === state.randomId)) state.randomId = list[0].wpid;
      return findRow(state.randomId);
    }

    // The highest wpid — featured on first load.
    function highestId() {
      const rows = navRows();
      if (!rows.length) return null;
      return rows.reduce((a, b) => (Number(a.wpid) >= Number(b.wpid) ? a : b)).wpid;
    }


    // Paging away must not carry unsaved edits off screen. A page of ten can
    // have several cards dirty at once, so this asks once and saves the lot.
    async function maybeSaveDirtyBeforePaging() {
      const dirty = Array.from(state.dirtyIds).map(findRow).filter(Boolean);
      if (!dirty.length) return;
      const names = dirty.map(displayName).join(', ');
      if (!window.confirm('Save changes to ' + dirty.length + ' waypoint' +
          (dirty.length === 1 ? '' : 's') + ' before leaving this page?\n\n' + names)) return;
      for (const row of dirty) {
        try {
          await patchRow(row.wpid, row);
          state.dirtyIds.delete(row.wpid);
        } catch (error) {
          setStatus('Could not save ' + displayName(row) + ': ' + (error.message || 'error'), 'error');
        }
      }
    }



    // Most recent (highest wpid) first, down to the oldest.
    // Sort modes. Newest-first is the default and was the only order until
    // 2026-07-29 — which meant a batch import (20 Boston waypoints) buried 37
    // Denver ones two pages down with no way to reorder.
    function compareRows(a, b) {
      // A suggested walk, when one has been computed for this city, outranks
      // everything: the whole point is to see the cards in the order you would
      // walk them. Rows with no point sink to the bottom rather than vanish.
      // An UNSAVED suggestion (the button) outranks a saved one: you pressed it
      // to see something different from what is stored.
      const orderOf = (row) => {
        if (state.walkOrder) {
          const at = state.walkOrder.get(Number(row.wpid));
          if (at != null) return at;
          return null;
        }
        const saved = Number(row.walk_order);
        return Number.isFinite(saved) && saved > 0 ? saved : null;
      };
      const ia = orderOf(a);
      const ib = orderOf(b);
      if (ia != null || ib != null) {
        // Unsequenced rows sink, rather than disappearing into the middle.
        if (ia == null) return 1;
        if (ib == null) return -1;
        if (ia !== ib) return ia - ib;
      }
      // Newest first, always. The sort dropdown went with the toolbar — inside
      // one city the set is small enough to scan, and "what did I just add"
      // is the only ordering question left.
      return Number(b.wpid) - Number(a.wpid);
    }

    // --- Suggested stop order ------------------------------------------------
    // A walking order for one city, computed from the stored coordinates.
    //
    // IT IS A SUGGESTION AND IT IS NOT SAVED, deliberately. Order belongs to a
    // ROUTE, not to the catalog: public.stops carries `ord`, and the same
    // waypoint sits at different positions in different games. Writing an order
    // onto public.waypoints would make one game's route the property of every
    // game that shares a stop. So this reorders the cards and numbers the pins
    // for as long as you are looking at the city, and the Stop Builder is where
    // an order becomes real.

    // Metres between two points. Haversine on a sphere: at city scale the error
    // against a proper ellipsoid is centimetres, and we are ranking walks, not
    // surveying.
    function metresBetween(a, b) {
      const R = 6371000;
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
    }

    // Nearest neighbour, then 2-opt until it stops improving.
    //
    // Nearest neighbour alone is fast and usually 20-25% worse than optimal —
    // it paints itself into a corner and then has to cross the whole city to
    // pick up what it skipped. 2-opt removes exactly those crossings by
    // reversing any segment that shortens the total, and on the sizes here
    // (37 pins at the worst) it converges in milliseconds. Optimal TSP is not
    // worth solving for a route a person is going to edit anyway.
    function suggestWalk(points) {
      const n = points.length;
      if (n < 3) return points.map((_, i) => i);

      const dist = (i, j) => metresBetween(points[i], points[j]);
      // Start from the northernmost point: an arbitrary but STABLE choice, so
      // pressing the button twice on the same city gives the same walk.
      let start = 0;
      for (let i = 1; i < n; i += 1) if (points[i].lat > points[start].lat) start = i;

      const unvisited = new Set(points.map((_, i) => i));
      const tour = [start];
      unvisited.delete(start);
      while (unvisited.size) {
        const last = tour[tour.length - 1];
        let best = null, bestD = Infinity;
        unvisited.forEach((i) => {
          const d = dist(last, i);
          if (d < bestD) { bestD = d; best = i; }
        });
        tour.push(best);
        unvisited.delete(best);
      }

      // 2-opt. An open walk, not a loop — you do not have to end where you
      // started — so the ends are never joined and the last leg costs nothing.
      const legs = (t) => {
        let sum = 0;
        for (let i = 0; i < t.length - 1; i += 1) sum += dist(t[i], t[i + 1]);
        return sum;
      };
      let improved = true;
      let guard = 0;
      while (improved && guard < 60) {
        improved = false;
        guard += 1;
        for (let i = 0; i < tour.length - 2; i += 1) {
          for (let k = i + 2; k < tour.length; k += 1) {
            const before = dist(tour[i], tour[i + 1])
              + (k + 1 < tour.length ? dist(tour[k], tour[k + 1]) : 0);
            const after = dist(tour[i], tour[k])
              + (k + 1 < tour.length ? dist(tour[i + 1], tour[k + 1]) : 0);
            if (after + 0.01 < before) {
              const seg = tour.slice(i + 1, k + 1).reverse();
              tour.splice(i + 1, seg.length, ...seg);
              improved = true;
            }
          }
        }
      }
      state.walkMetres = Math.round(legs(tour));
      return tour;
    }

    // Build (or clear) the suggested order for the city on screen.
    function buildWalkOrder() {
      const rows = state.rows.filter(matchesArchiveMode).filter(matchesCityFilter);
      const located = [];
      rows.forEach((row) => {
        const point = cachedPointFor(row);
        if (point) located.push({ wpid: Number(row.wpid), lat: point.lat, lon: point.lon });
      });
      if (located.length < 2) return { ok: false, reason: located.length ? 'Only one waypoint here is located.' : 'No waypoints here are located yet — open the map and let it place them first.' };
      const tour = suggestWalk(located);
      const order = new Map();
      tour.forEach((idx, position) => order.set(located[idx].wpid, position));
      return { ok: true, order: order, count: located.length, unplaced: rows.length - located.length };
    }

    function clearWalkOrder() {
      state.walkOrder = null;
      state.walkMetres = 0;
    }

    // Persist the suggestion onto the rows as walk_order. One PATCH per row,
    // sequentially: this is a handful of rows in one city, and a burst of forty
    // parallel writes against PostgREST buys nothing here.
    //
    // It writes 1..n over the LOCATED rows only. A row with no point keeps its
    // existing value rather than being nulled — it was never part of the walk
    // being saved, and clearing it would quietly discard an order the AI import
    // supplied for a waypoint the map has not placed yet.
    async function saveWalkOrder(btn) {
      if (!state.walkOrder || !hasWalkOrderColumn) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const entries = [...state.walkOrder.entries()].sort((a, b) => a[1] - b[1]);
      let saved = 0;
      let failed = 0;
      for (const [wpid, index] of entries) {
        const position = index + 1;          // stored 1-based; the solver is 0-based
        const row = findRow(wpid);
        if (!row) continue;
        if (Number(row.walk_order) === position) { saved += 1; continue; }
        try {
          const res = await fetch(restUrl(TABLE, { [PK]: 'eq.' + wpid }), {
            method: 'PATCH',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
            body: JSON.stringify({ walk_order: position })
          });
          if (!res.ok) throw new Error(await readError(res, 'save failed'));
          const wasClean = !state.dirtyIds.has(wpid);
          row.walk_order = position;
          if (wasClean) pristine.set(wpid, snapshot(row));
          saved += 1;
        } catch (error) {
          failed += 1;
        }
      }
      btn.disabled = false;
      btn.textContent = original;
      if (failed) {
        setStatus('Saved ' + saved + ' of ' + entries.length + ' positions — ' + failed + ' failed.', 'error');
      } else {
        // The stored order now matches, so the suggestion has nothing left to
        // show: drop it and let the saved column do the sorting.
        clearWalkOrder();
        render();
        setStatus('Saved this walk order onto ' + saved + ' waypoint' + (saved === 1 ? '' : 's') + '.', 'success');
      }
    }

    // Miles, because every city in this table is in the US and a walk is
    // something a person estimates in blocks and minutes, not kilometres.
    function formatWalkDistance(metres) {
      const miles = metres / 1609.344;
      const mins = Math.round(metres / 80);   // ~3 mph, the usual walking figure
      return (miles < 0.1 ? '<0.1' : miles.toFixed(1)) + ' mi · about ' + mins + ' min walking';
    }

    function displayName(row) {
      return (row && (cleanText(row.name) || ('Waypoint #' + row.wpid))) || 'Untitled';
    }

    // --- Rendering -----------------------------------------------------------
    // Two views, because a flat list of 1,200 waypoints answers no question
    // anyone actually has. The index answers "where do we have coverage"; the
    // city view answers "does this city's set hang together as a walk".
    //
    //   cities  → a tile per city, count and gaps on it
    //   city    → one consolidated map + that city's cards
    //
    // A text search short-circuits to the city view over the matches wherever
    // they are: searching is how you find one known waypoint, and making that
    // pass through a city tile first would be a step backwards.
    // Is the city index what is on screen? Several summary bits (the pager, the
    // count line) mean something different there, so they ask.
    function render() {
      wpList.innerHTML = '';
      teardownCityMap();
      if (!state.authed) {
        wpList.appendChild(emptyNode('Sign in to view and edit waypoints.'));
        updateSummary();
        return;
      }
      renderCityView();
    }

    // The city-tile index was folded into the always-visible city bar on
    // 2026-07-29: the tiles and the buttons said the same thing, and one of them
    // cost a screen of its own before you could see a single waypoint. "All" is
    // just the city bar's first button — cityFilter '' — so there is now exactly
    // one view.
    async function openCity(key) {
      await maybeSaveDirtyBeforePaging();
      // A suggested walk belongs to the city it was computed for. Carrying it
      // across would leave positions from Denver ordering Baltimore's cards.
      clearWalkOrder();
      state.cityFilter = key || '';
      state.page = 0;
      const list = navRows();
      state.randomId = list.length ? list[0].wpid : null;
      render();
      renderCityBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // The list: heading, consolidated map, then the paged cards. One city, or
    // every waypoint when the All button is active.
    function renderCityView() {
      const current = ensureCurrent();
      const list = navRows();

      const head = document.createElement('div');
      head.className = 'city-head';
      const title = document.createElement('h2');
      title.className = 'city-head-title';
      const sample = list[0];
      title.textContent = state.cityFilter
        ? (cleanText(sample && sample.city) || 'No city')
        : 'All waypoints';
      const count = document.createElement('span');
      count.className = 'city-head-count';
      count.textContent = list.length + ' waypoint' + (list.length === 1 ? '' : 's');
      head.append(title, count);

      // Suggested order is a CITY question. On All the set is the whole table
      // across sixty cities, and a walk between them is not a thing anyone does.
      if (state.cityFilter) {
        const walkBtn = document.createElement('button');
        walkBtn.type = 'button';
        walkBtn.className = 'btn small walk-btn' + (state.walkOrder ? ' is-on' : '');
        walkBtn.textContent = state.walkOrder ? 'Clear order' : 'Suggest order';
        walkBtn.title = state.walkOrder
          ? 'Go back to newest-first'
          : 'Order these waypoints into a sensible walk, shortest route first';
        walkBtn.addEventListener('click', () => {
          if (state.walkOrder) { clearWalkOrder(); render(); return; }
          const result = buildWalkOrder();
          if (!result.ok) { setStatus(result.reason, 'error'); return; }
          state.walkOrder = result.order;
          render();
          setStatus('Suggested a walk of ' + result.count + ' stops · '
            + formatWalkDistance(state.walkMetres)
            + (result.unplaced ? ' · ' + result.unplaced + ' not located yet, left at the end' : ''), 'success');
        });
        head.append(walkBtn);

        if (state.walkOrder && hasWalkOrderColumn) {
          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'btn small';
          saveBtn.textContent = 'Save order';
          saveBtn.title = 'Store this sequence on the waypoints as walk_order';
          saveBtn.addEventListener('click', () => saveWalkOrder(saveBtn));
          head.append(saveBtn);
        }

        if (state.walkOrder) {
          const note = document.createElement('span');
          note.className = 'walk-note';
          note.textContent = 'Suggested walk · ' + formatWalkDistance(state.walkMetres)
            + ' · not saved — set a real order in the Stop Builder';
          head.append(note);
        }
      }
      wpList.append(head);

      if (!current) {
        wpList.appendChild(emptyNode(isFiltered()
          ? 'No waypoints match your filter.'
          : 'No waypoints here yet.'));
        updateSummary();
        return;
      }

      // One map for the whole set — including the stops on other pages, so the
      // shape of the city is visible even while you edit ten of it.
      const mapWrap = document.createElement('div');
      mapWrap.className = 'city-map-wrap';
      const mapEl = document.createElement('div');
      mapEl.className = 'city-map';
      mapEl.id = 'cityMap';
      const status = document.createElement('div');
      status.className = 'city-map-status';
      status.id = 'cityMapStatus';
      status.textContent = 'Placing waypoints…';
      mapWrap.append(mapEl, status);
      wpList.append(mapWrap);

      // A city is a walk: you want to read it straight down, and the map above
      // already carries every pin, so paging one city into chunks of ten would
      // split a route across pages for no reason. Cities render whole.
      // All is the opposite case - it can be the entire table - so it pages.
      let page = list;
      if (!state.cityFilter) {
        const pages = totalPages(list);
        state.page = Math.min(Math.max(0, state.page), pages - 1);
        const start = state.page * PAGE_SIZE;
        page = list.slice(start, start + PAGE_SIZE);
      } else {
        state.page = 0;
      }
      page.forEach((row) => {
        const card = renderCard(row);
        card.classList.toggle('is-current', row.wpid === current.wpid);
        wpList.appendChild(card);
      });

      if (!state.cityFilter) {
        const pager = renderPagerFor(list);
        if (pager) wpList.appendChild(pager);
      }

      // Pins are numbered by position in the full list, so pin 23 is the 23rd
      // waypoint whether or not the cards under it are paged.
      setupCityMap(mapEl, list);
      updateToolbarButtons();
      updateSummary();
    }

    // Clicking a pin brings you to its card: page to it if needed, make it the
    // cursor, scroll it into view and flash it.
    function focusWaypoint(wpid) {
      const list = navRows();
      const idx = list.findIndex((row) => row.wpid === wpid);
      if (idx < 0) return;
      state.randomId = wpid;
      // Only All is paged, so only All can need a page flip to reach a card.
      if (!state.cityFilter) {
        const page = Math.floor(idx / PAGE_SIZE);
        if (page !== state.page) {
          state.page = page;
          render();
        }
      }
      const card = wpList.querySelector('[data-wpid="' + wpid + '"]');
      if (!card) return;
      wpList.querySelectorAll('.wp-card.is-current').forEach((el) => el.classList.remove('is-current'));
      card.classList.add('is-current');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderCard(row) {
      const card = document.createElement('article');
      card.className = 'wp-card';
      card.dataset.wpid = row.wpid;
      card.classList.toggle('is-dirty', state.dirtyIds.has(row.wpid));
      card.classList.toggle('is-saving', state.savingIds.has(row.wpid));
      card.classList.toggle('is-archived', isArchived(row));

      const head = document.createElement('div');
      head.className = 'wp-card-head';

      // The name used to head the card. It was removed 2026-07-29: it duplicated
      // the Name field directly below it, and on a page of ten cards that meant
      // reading every name twice. The head is now WPID on the left, actions on
      // the right.

      const actions = document.createElement('div');
      actions.className = 'card-actions';
      const fillBtn = document.createElement('button');
      fillBtn.type = 'button';
      fillBtn.className = 'btn small';
      fillBtn.textContent = 'Fill';
      fillBtn.title = 'Geocode from what is set and fill in any blank fields';
      fillBtn.addEventListener('click', () => fillWaypoint(row.wpid, fillBtn));
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'btn warn small';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => deleteWaypoint(row.wpid));
      const archiveBtn = document.createElement('button');
      archiveBtn.type = 'button';
      archiveBtn.className = 'btn small';
      archiveBtn.dataset.action = 'archive';
      archiveBtn.textContent = isArchived(row) ? 'Restore' : 'Archive';
      archiveBtn.title = isArchived(row)
        ? 'Restore this waypoint to the active working list'
        : 'Archive this waypoint so future AI/nightly reviews do not suggest it again';
      archiveBtn.disabled = state.savingIds.has(row.wpid);
      archiveBtn.addEventListener('click', () => setWaypointArchived(row.wpid, !isArchived(row)));
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'btn primary small';
      saveBtn.dataset.action = 'save';
      saveBtn.textContent = 'Save';
      // Disabled when there's nothing to save (already saved) or mid-save.
      saveBtn.disabled = !state.dirtyIds.has(row.wpid) || state.savingIds.has(row.wpid);
      saveBtn.addEventListener('click', () => saveRow(row.wpid));
      actions.append(archiveBtn, deleteBtn, fillBtn, saveBtn);

      // Title left, nav centered, actions right.
      // WPID left, actions right.
      head.append(renderNav(row), actions);

      const fields = document.createElement('div');
      fields.className = 'field-grid';
      // Name, then Address — the two that identify the place — before the
      // city/state/ZIP that merely locate it.
      fields.appendChild(renderNameField(row));
      fields.appendChild(renderTextField(row, 'address', 'Address'));
      const cityState = document.createElement('div');
      cityState.className = 'field-row field-row--citystate';
      cityState.append(renderCityStateField(row), renderTextField(row, 'zip', 'ZIP'));
      fields.appendChild(cityState);
      fields.appendChild(renderTextField(row, 'description', 'Description', null, true));
      // Every card carries the field, filled or not — the AI importer sets it,
      // and a hand-entered stop can be given one so its facts stay checkable.
      fields.appendChild(renderSourceUrlField(row));

      // No per-card map any more — the city map above the list carries every
      // stop, so the fields get the full width. Hovering the card lights this
      // row's pin up there instead.
      const body = document.createElement('div');
      body.className = 'wp-card-body';
      body.append(fields);
      card.addEventListener('mouseenter', () => highlightPin(row.wpid, true));
      card.addEventListener('mouseleave', () => highlightPin(row.wpid, false));

      // Saved/Unsaved badge in the lower-right, under the description.
      const foot = document.createElement('div');
      foot.className = 'wp-card-foot';
      const saved = document.createElement('span');
      saved.className = 'wp-saved';
      saved.dataset.saved = '';
      setSavedBadge(saved, row);
      foot.appendChild(saved);

      card.append(head, body, foot);
      return card;
    }

    // Name field with a Translate button: adds an English translation in
    // parentheses for foreign names, e.g. "Museo del Prado (Prado Museum)".
    function renderNameField(row) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const id = 'wp-name-' + row.wpid;

      label.setAttribute('for', id);

    // Google translate (auto-detect). Returns { translation, srcLang }.
    async function googleTranslate(text) {
      try {
        const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q='
          + encodeURIComponent(text);
        const res = await fetch(url);
        if (!res.ok) return { translation: '', srcLang: '' };
        const data = await res.json();
        const segments = (Array.isArray(data) && Array.isArray(data[0])) ? data[0] : [];
        return { translation: cleanText(segments.map((s) => (s && s[0]) ? s[0] : '').join('')), srcLang: (data && data[2]) || '' };
      } catch (error) { return { translation: '', srcLang: '' }; }
    }

    // MyMemory fallback — handles proper names Google leaves untranslated
    // (e.g. "Sor Juana Inés de la Cruz" -> "Sister Juana Inés de la Cruz"). Its top
    // result is often a noisy translation-memory entry (all-caps addresses, etc.),
    // so we scan all matches and reject the junk before picking the best.
    function isAllCaps(s) { return s === s.toUpperCase() && s !== s.toLowerCase(); }
    async function myMemoryTranslate(text, srcLang) {
      const src = srcLang ? srcLang.split('-')[0] : '';
      if (!src) return '';
      try {
        const url = 'https://api.mymemory.translated.net/get?langpair=' + encodeURIComponent(src + '|en')
          + '&q=' + encodeURIComponent(text);
        const res = await fetch(url);
        if (!res.ok) return '';
        const mm = await res.json();
        const baseAllCaps = isAllCaps(text);
        const candidates = [];
        if (mm && mm.responseData) candidates.push({ t: cleanText(mm.responseData.translatedText), q: 101, m: 1 });
        if (mm && Array.isArray(mm.matches)) {
          mm.matches.forEach((x) => candidates.push({ t: cleanText(x.translation), q: Number(x.quality) || 0, m: Number(x.match) || 0 }));
        }
        const good = candidates.filter((c) => {
          if (!c.t) return false;
          if (c.t.toLowerCase() === text.toLowerCase()) return false;   // unchanged
          if (!baseAllCaps && isAllCaps(c.t)) return false;             // all-caps TM junk
          return true;
        });
        if (!good.length) return '';
        good.sort((a, b) => (b.m - a.m) || (b.q - a.q));
        return good[0].t;
      } catch (error) { return ''; }
    }

    // Live-translate a foreign name to English and add it in parentheses.
    async function translateName(row, input, button) {
      const current = cleanText(input.value);
      if (!current) { setStatus('Enter a name first.'); return; }
      // Translate the part before any existing "(...)" so we don't nest.
      const base = current.replace(/\s*\([^)]*\)\s*$/, '').trim() || current;
      const original = button.textContent;
      button.disabled = true;
      button.textContent = 'Translating…';
      try {
        const g = await googleTranslate(base);
        if (g.srcLang === 'en') { setStatus('“' + base + '” is already English.'); return; }
        let translation = g.translation;
        // Google often leaves proper names untouched — try MyMemory in that case.
        if (!translation || translation.toLowerCase() === base.toLowerCase()) {
          const mm = await myMemoryTranslate(base, g.srcLang);
          if (mm) translation = mm;
        }
        if (!translation) { setStatus('No translation found.', 'error'); return; }
        if (translation.toLowerCase() === base.toLowerCase()) {
          setStatus('“' + base + '” looks like a proper name — no English translation to add.');
          return;
        }
        // If the translation already includes the original (e.g. "Plaza Mayor (Main
        // Square)"), use it as-is; otherwise wrap the translation in parentheses.
        const newName = translation.toLowerCase().indexOf(base.toLowerCase()) === 0
          ? translation
          : base + ' (' + translation + ')';
        input.value = newName;
        updateField(row.wpid, 'name', newName);
        setStatus('Translated to “' + translation + '”. Review, then Save.', 'success');
      } catch (error) {
        console.error(error);
        setStatus('Translation lookup failed.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    }

    function renderTextField(row, field, labelText, hint, multiline) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const id = 'wp-' + field + '-' + row.wpid;
      const label = document.createElement('label');
      label.setAttribute('for', id);
      label.textContent = labelText;
      const input = multiline ? document.createElement('textarea') : document.createElement('input');
      input.id = id;
      input.dataset.field = field;
      if (!multiline) input.type = 'text';
      input.value = row[field] || '';
      // Address doubles as a Plus Code slot, so say so where you would type one.
      if (field === 'address') input.placeholder = '800 Decatur St  ·  or a Plus Code: 87C4VXQ7+3H';

      // A field the city badge is counting as an error wears a thick red border
      // until it is filled, so the count and the card agree on screen. The note
      // under Address also reports what a Plus Code resolved to.
      const note = document.createElement('div');
      note.className = 'field-note';
      const paint = () => {
        // Ask waypointErrors rather than re-deciding here, so a Plus Code
        // clearing the ZIP error shows up on the card and the badge together.
        const bad = waypointErrors(row).indexOf(field) > -1;
        input.classList.toggle('is-error', bad);
        note.textContent = '';
        note.className = 'field-note';
        if (field !== 'address') return;
        const value = cleanText(input.value);
        if (!looksLikePlusCode(value)) return;
        if (isShortPlusCode(value)) {
          // A short code is ambiguous worldwide; it needs the city to land.
          const ref = cityReferencePoint(row);
          note.textContent = ref
            ? 'Short Plus Code — placed against ' + (cleanText(row.city) || 'this city') + '.'
            : 'Short Plus Code — add the city, or paste the full code, so it can be placed.';
          note.className = 'field-note' + (ref ? '' : ' is-warn');
        } else {
          const ok = !!decodePlusCode(value);
          note.textContent = ok ? 'Plus Code — decoded to an exact point.' : 'That Plus Code will not decode — check it.';
          note.className = 'field-note' + (ok ? '' : ' is-warn');
        }
      };
      paint();
      // Registered before the Map button's own listener so row.* is already
      // current when that one reads it — otherwise the tooltip lags a keystroke.
      input.addEventListener('input', () => { updateField(row.wpid, field, input.value); paint(); });

      // Address gets a Map button beside it. It searches the FULL address —
      // street plus city, state and ZIP from their own fields — because the box
      // holds the street only, and "800 Decatur St" on its own lands in whichever
      // city Google guesses. Same googleMapsUrl() the card's other map links use,
      // so a Plus Code in this box resolves the same way there too.
      if (field === 'address') {
        const line = document.createElement('div');
        line.className = 'field-line';
        const mapBtn = document.createElement('button');
        mapBtn.type = 'button';
        mapBtn.className = 'btn small';
        mapBtn.textContent = 'Map';
        const syncMap = () => {
          const has = !!(cleanText(input.value) || cleanText(row.city) || cleanText(row.name));
          mapBtn.disabled = !has;
          mapBtn.title = has
            ? 'Look this address up in Google Maps: ' + (addressQuery(row) || cleanText(row.name))
            : 'Add an address, a city, or a name to look up';
        };
        syncMap();
        input.addEventListener('input', syncMap);
        mapBtn.addEventListener('click', () => {
          const href = googleMapsUrl(row, null);
          if (href) window.open(href, '_blank', 'noopener,noreferrer');
        });
        line.append(input, mapBtn);
        wrap.append(label, line, note);
      } else {
        wrap.append(label, input, note);
      }

      if (hint) {
        const help = document.createElement('div');
        help.className = 'field-hint';
        help.textContent = hint;
        wrap.appendChild(help);
      }
      return wrap;
    }

    // Source URL: the page this stop's facts came from. Text box plus an Open
    // button, so you can check the source without copying the link out. The box
    // goes read-only (with a hint) on a database that has not run
    // 2026072902_waypoints_source_url.sql — better than taking an edit that Save
    // would quietly drop.
    function renderSourceUrlField(row) {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const id = 'wp-source-url-' + row.wpid;
      const label = document.createElement('label');
      label.setAttribute('for', id);
      label.textContent = 'Source URL';
      const line = document.createElement('div');
      line.className = 'field-line';
      const input = document.createElement('input');
      input.id = id;
      input.type = 'text';
      input.dataset.field = SOURCE_URL_FIELD;
      input.placeholder = 'https://…';
      input.value = row[SOURCE_URL_FIELD] || '';
      input.disabled = !hasSourceUrlColumn;
      const openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.className = 'btn small';
      openBtn.textContent = 'Open';
      openBtn.title = 'Open the source page in a new tab';
      const syncOpen = () => { openBtn.disabled = !cleanText(input.value); };
      syncOpen();
      input.addEventListener('input', () => {
        updateField(row.wpid, SOURCE_URL_FIELD, input.value);
        syncOpen();
      });
      openBtn.addEventListener('click', () => {

      });
