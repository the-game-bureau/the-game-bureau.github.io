<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WAYPOINTS | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --stack-gap: 14px;
      --panel-radius: 10px;
      /* The socials room's two cut-panel tokens. A panel whose top border is
         interrupted by its own label needs a fill the label can sit on and a
         line strong enough to still read as a frame — the 0.18 --line is too
         faint once it has a gap in it. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }

    /* ── Stock Room header lockup: gear watermark + THE GAME BUREAU eyebrow + big
       title + substat, matching /mc/gifts/. ── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    /* The gear art, mirrored — a faint watermark sunk into the page grid at the
       left of the header, bleeding off the left edge. */
    .stockroom-gear {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%) scaleX(-1);
      width: 184px;
      height: 184px;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-gear .header-gear-atmosphere,
    .stockroom-gear .header-gear-halo { display: none; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow:
        0 0 3px var(--paper-base),
        0 0 3px var(--paper-base),
        0 0 5px var(--paper-base);
    }
    .stockroom-title {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .stockroom-titlecol .stockroom-substat {
      margin: 3px 0 0;
      min-height: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-substat.error { color: var(--danger); }
    .stockroom-substat.success { color: var(--success); }

    /* Every gap in the page stack is var(--stack-gap) now: legend -> add bar ->
       city rail -> list. It used to be 18px, then -6px, then 14px — three
       different guesses at the same interval, which is what made the column
       look loose in one place and cramped in the next. */
    .legend {
      margin: 0 0 var(--stack-gap);
      padding: 0 12px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.warn { color: var(--danger); border-color: rgba(160,63,45,0.45); }
    .btn.warn:hover { background: rgba(160,63,45,0.08); border-color: var(--danger); }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn[aria-current="page"]:disabled {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      opacity: 1;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar .btn { flex: 0 0 auto; white-space: nowrap; }
    /* Add-waypoints row: the Stock Room's command-bar look — a soft panel with a
       mono label, dividers between groups, and quiet "ghost" reference links. */
    /* Both boxes below are real <fieldset>s keeping their default display, so
       the <legend> natively cuts the top border — the socials room's device,
       and the same one mc/data/cities.html wears.

       The margin used to be `-6px 0 0`: no bottom gap at all, and a negative
       top one to close the space under the city bar this row used to follow.
       It leads now, so it takes the page's own rhythm instead. */
    .command-bar {
      width: 100%;
      min-inline-size: 0;
      margin: 0 0 var(--stack-gap);
      padding: 4px 12px 12px;
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: var(--panel-radius);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* The folder tab. The border runs into the label and back out again, so the
       cut-out reads as a tag clipped onto the frame rather than a gap in it.

       PSEUDO-ELEMENT, not a border on the legend: the word has to sit centred
       on the horizontal line, which is where the browser puts a legend, but the
       tab's sides must stop AT that line. A bordered box whose bottom edge is
       the line cannot also have its text centred on it. So the outline is drawn
       only over the half above — `inset: 0 0 50%`, since the legend's midpoint
       IS the line — and the word's lower half hangs invisibly into the panel,
       the fill and the panel being the same colour with no edge between them.

       isolation: isolate is load-bearing: the arch sits at z-index -1 to stay
       behind the text, and without its own stacking context that -1 would drop
       it behind the fieldset's background and vanish. */
    .command-bar > legend,
    .panel > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .command-bar > legend::before,
    .panel > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }
    /* Pushed to the far end of the bar: it acts on the cards below, not on the
       Add group it sits beside. */
    #saveAllBtn { margin-left: auto; }

    .command-bar-divider {
      width: 1px;
      align-self: stretch;
      min-height: 24px;
      margin: 0 2px;
      background: var(--line);
    }
    .command-bar .btn {
      flex: 0 0 auto;
      min-width: 0;
      padding: 0 12px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    /* Reference links read quieter than the create actions. */
    .command-bar .btn.ghost {
      background: transparent;
      border-style: dashed;
      color: var(--muted);
    }
    .command-bar .btn.ghost:hover { color: var(--ink); border-color: var(--accent); }

    /* Mode toggle on the "With AI" picker: OpenStreetMap vs AI prompt → SQL. */
    .prompt-modes { display: flex; flex-wrap: wrap; gap: 6px; }
    .prompt-mode.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .prompt-mode.is-active:hover { background: rgba(var(--bic-blue-rgb), 0.85); }

    /* Options row on the "With AI" prompt picker (Stops count + keywords). */
    .prompt-opts { display: flex; flex-wrap: wrap; gap: 10px; }
    .prompt-opt {
      display: grid;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .prompt-opt--wide { flex: 1 1 220px; }
    .prompt-opt input,
    .prompt-opt textarea {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 500;
      letter-spacing: normal;
      text-transform: none;
    }
    .prompt-opt textarea {
      min-height: 92px;
      resize: vertical;
    }
    .prompt-opt input[type="number"] { width: 96px; }

    /* The NFL slate: 30-odd cities, so a grid of compact rows rather than a
       list you scroll past. The count badge is the point of the row — it says
       where the next batch of waypoints should go. */
    .nfl-pick { display: grid; gap: 10px; }
    .nfl-pick-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .nfl-pick-count {
      margin-right: auto;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .nfl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 4px;
      max-height: 46vh;
      overflow-y: auto;
      padding-right: 2px;
    }
    .nfl-city {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .nfl-city.is-picked { border-color: var(--accent); background: rgba(var(--bic-blue-rgb), 0.06); }
    .nfl-city input { margin: 0; }
    .nfl-city-name { flex: 1; min-width: 0; }
    .nfl-city-count {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }
    /* A city with nothing filed under it is the one worth picking. */
    .nfl-city.is-empty .nfl-city-count { color: var(--danger); font-weight: 700; }
    .nfl-pick-go { display: flex; justify-content: flex-end; }

    /* NIGHTLY panel — same run-status vocabulary as the Stock Room and the
       soundtrack admin, so a green/red dot means the same thing on all three. */
    .nightly-sec { display: grid; gap: 8px; }
    .nightly-sec + .nightly-sec { margin-top: 16px; }
    .nightly-h {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .run-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .run-dot {
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .run-status[data-state="ok"] .run-dot { background: #1e7a4b; }
    .run-status[data-state="stale"] .run-dot,
    .run-status[data-state="error"] .run-dot { background: var(--danger); }
    .run-body { display: grid; gap: 3px; min-width: 0; }
    .run-line { color: var(--ink); font-size: 0.92rem; font-weight: 800; }
    .run-sub { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
    .run-links { display: flex; flex-wrap: wrap; gap: 8px; }

    .nightly-stop {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .nightly-stop.is-added { opacity: 0.55; }
    .nightly-stop-main { display: grid; gap: 2px; min-width: 0; }
    .nightly-stop-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .nightly-stop-sub { font-size: 0.76rem; color: var(--muted); line-height: 1.4; }
    .nightly-stop-sub a { color: var(--accent); }
    .nightly-tours { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .nightly-tours a { color: var(--accent); }

    .toolbar input {
      flex: 1 1 80px;
      min-width: 0;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    .toolbar select {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }


    /* Tinted, so the white cards inside read as objects sitting ON it — they
       had only their own 1px border to separate them from a near-white panel.
       And the tight 0 1px 4px shadow rather than 0 12px 28px: the big cushion
       is right for a modal floating over the page, and under a long list it
       only blurs the panel's own edge. The modals here keep it. */
    .panel {
      display: grid;
      gap: 12px;
      min-inline-size: 0;
      padding: 4px 14px 14px;
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: var(--panel-radius);
      overflow: visible;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    /* Navigation group (lives in the card action row, left of Delete). */
    .wp-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-start;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(var(--bic-blue-rgb), 0.04);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    /* Saved/Unsaved badge in the card's lower-right, under the description. */
    .wp-card-foot { display: flex; justify-content: flex-end; margin-top: 2px; }
    .wp-saved { font-weight: 700; letter-spacing: 0.02em; font-size: 0.85rem; }

    .wp-list { display: grid; gap: 12px; }

    /* Radius one step under the panel's 10px, and --control-line rather than
       --line: at 0.18 the card edge disappeared against the tint now behind
       it. A card nested in a container should not share its corner, or the two
       read as one surface. */
    .wp-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    /* The cursor card inside a page of ten — where the pager lands you, and
       what "jump to N" targets. */
    .wp-card.is-current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.12); }

    /* Toolbar pager: ‹ Page 3 of 6 › */
    .wp-pager { display: inline-flex; align-items: center; gap: 6px; }
    .wp-pager[hidden] { display: none; }
    /* Built with the list and appended under the cards, since the toolbar it
       used to live in is gone. */
    .wp-pager--inline { display: flex; justify-content: center; padding: 4px 0 2px; }
    .wp-pager .btn { min-width: 34px; padding: 0 8px; font-size: 1rem; line-height: 1; }
    .wp-pager-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .wp-card.is-dirty {
      border-color: rgba(194,55,55,0.55);
      box-shadow: 0 0 0 3px rgba(194,55,55,0.08);
    }
    .wp-card.is-saving { opacity: 0.68; }
    .wp-card.is-archived {
      border-style: dashed;
      background: rgba(var(--bic-blue-rgb), 0.035);
    }

    .wp-card-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }
    .wp-card-head > .wp-nav { justify-self: start; }
    .wp-card-head > .card-actions { justify-self: end; }
    .wp-archived-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border: 1px solid rgba(160, 63, 45, 0.28);
      border-radius: 999px;
      background: rgba(160, 63, 45, 0.08);
      color: var(--danger);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* The card's identifier, top-left. .wp-title and .wp-meta went with the
       card heading on 2026-07-29 and had no markup left to style. */
    .wp-id {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .field-grid { display: grid; gap: 10px; }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .field-row--3 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.7fr) minmax(0, 0.9fr); }
    .field-row--citystate { grid-template-columns: minmax(0, 2fr) minmax(0, 0.8fr); }

    .field { display: grid; gap: 5px; }
    /* A field whose input shares a row with a button (e.g. Name + Translate). */
    .field-line { display: flex; gap: 6px; align-items: center; }
    .field-line input { flex: 1; min-width: 0; }

    .field label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    .field select { min-height: 38px; }
    .wp-citystate-control { display: flex; gap: 6px; align-items: center; }
    .wp-citystate-control select { flex: 1 1 auto; min-width: 0; }
    /* Was a 38px square holding a single '+'; 'NEW' needs room to breathe. */
    .wp-city-add { flex: 0 0 auto; width: auto; padding: 0 10px; white-space: nowrap; }
    .field textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.4;
    }

    .field-hint {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.35;
    }

    /* A blank field that the city badge is counting as an error. Deliberately
       heavier than the normal 1px hairline: on a card of six inputs a tinted
       border is easy to miss, and the whole point is that the red on the badge
       and the red on the card are the same fact. */
    .field input.is-error,
    .field textarea.is-error,
    .field select.is-error {
      border-width: 2px;
      border-color: var(--danger);
      background: rgba(160, 63, 45, 0.04);
    }
    .field input.is-error:focus,
    .field textarea.is-error:focus,
    .field select.is-error:focus { outline-color: var(--danger); }

    /* Live note under a field — currently what a Plus Code resolved to. Empty
       most of the time, so it collapses rather than reserving a line. */
    .field-note {
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.35;
    }
    .field-note:empty { display: none; }
    .field-note.is-warn { color: var(--danger); font-weight: 700; }


    /* The card lost its aerial photo on 2026-07-29 — one map per city sits
       above the list instead — so the fields take the whole width. */
    .wp-card-body { display: block; }

    /* --- City bar: the page's navigation ---------------------------------
       Always visible, All first, then one button per waypoint-bearing city.
       It replaced both the city dropdown and the tile index on 2026-07-29 -
       where the coverage is should not be behind a click.

       Big rectangular keys, not pills: this is the primary navigation of the
       page, it should read as a bank of buttons you hit, and the count needs
       room to sit under the name rather than crowding it. */
    .city-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: var(--stack-gap);
    }
    .city-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      min-width: 104px;
      min-height: 72px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font: inherit;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .city-btn:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
      border-color: var(--accent);
    }
    .city-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .city-btn.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .city-btn-name {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .city-btn-count {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .city-btn.is-active .city-btn-count { color: rgba(255, 255, 255, 0.82); }

    /* Third line: what is wrong in that city. Present on every button so the
       buttons stay the same height and the eye can run straight down the column
       of red; a clean city says "no errors" in the same quiet grey as the count. */
    .city-btn-errors {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--danger);
    }
    .city-btn-errors.is-clean { color: rgba(var(--bic-blue-rgb), 0.42); font-weight: 500; }
    .city-btn.is-active .city-btn-errors { color: #ffd9d0; }
    .city-btn.is-active .city-btn-errors.is-clean { color: rgba(255, 255, 255, 0.6); }

    /* --- City view -------------------------------------------------------- */
    .city-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 4px;
    }
    .city-head-title { margin: 0; font-size: 1.15rem; }
    .city-head-count {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    /* Pushed to the far end of the heading row: it acts on the whole city, not
       on the title it sits beside. */
    .walk-btn { margin-left: auto; }
    .walk-btn.is-on { border-color: var(--accent); background: rgba(var(--bic-blue-rgb), 0.1); }
    /* The reminder that this is advisory. Full width under the row so it reads
       as a footnote to the walk rather than another control in it. */
    .walk-note {
      flex: 1 1 100%;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .city-map-wrap { display: grid; gap: 4px; }
    .city-map {
      width: 100%;
      height: 420px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .city-map .leaflet-container { width: 100%; height: 100%; }
    /* Attribution is kept for Esri's terms, but it is a credit, not a control. */
    .city-map .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.62);
      font-size: 9px;
      line-height: 1.3;
      padding: 0 4px;
    }
    .city-map-status {
      font-size: 0.74rem;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
    }

    /* A numbered dot rather than a teardrop: it sits ON the spot instead of
       hanging above it, and it reads on dark rooftops and pale pavement alike.
       .is-hot is the hover echo from the matching card. */
    .wp-map-pin-dot {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin: 1px;
      border-radius: 50%;
      background: var(--accent, #d34e2a);
      border: 2px solid #fff;
      color: #fff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease;
    }
    .wp-map-pin.is-hot { z-index: 900 !important; }
    .wp-map-pin.is-hot .wp-map-pin-dot {
      transform: scale(1.45);
      background: var(--ink, #16202b);
    }

    @keyframes wp-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .wp-blink { animation: wp-blink 0.45s ease-in-out infinite; }
    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    /* Above Leaflet's panes/controls (which reach z-index ~1000) so the map and
       its zoom buttons sit behind the dialog. */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15,23,42,0.42);
    }
    .modal-backdrop[hidden] { display: none; }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2001;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(560px, calc(100vw - 32px));
      /* Tall enough that a form shows all of its fields without scrolling. */
      max-height: min(88vh, calc(100vh - 32px));
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(15,23,42,0.28);
      overflow: hidden;
    }
    .modal[hidden] { display: none; }

    .modal-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(var(--bic-blue-rgb), 0.06);
    }
    .modal-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .modal-status { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

    .prompt-body {
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .prompt-search { display: flex; gap: 8px; }
    .prompt-search input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .prompt-search select {
      flex: 0 0 auto;
      max-width: 40%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }
    .zip-list { display: grid; gap: 5px; }
    .zip-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      font: inherit;
    }
    .zip-row:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.5);
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .zip-code { font-weight: 800; }
    .zip-desc { color: var(--muted); font-size: 0.82rem; }
    .prompt-text {
      width: 100%;
      /* Fill the taller dialog rather than sitting in a short box inside it. */
      min-height: 62vh;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: vertical;
      padding: 12px;
      font: 0.78rem/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: var(--ink, #1e293b);
      background: #fff;
      white-space: pre-wrap;
    }
    .prompt-text:focus { outline: none; }

    /* The manual add form is a single narrow column — size the lightbox to it. */
    #manualDialog { width: min(560px, calc(100vw - 32px)); }
    #manualBody { padding: 14px; }
    /* With AI modal: comfortable for the prompt textarea and the results list. */
    /* Wide enough for Stops + Keywords + Source URL on one row. */
    #promptDialog { width: min(760px, calc(100vw - 32px)); }
    /* "Add selected" sits at the foot of the OpenStreetMap results, staying put
       above the scrolling pick-list. */
    .pick-foot {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      padding: 10px 0 2px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 45%);
    }
    .pick-foot .btn { min-width: 170px; }
    .pick-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pick-tools a { font-size: 0.8rem; cursor: pointer; color: var(--accent); text-decoration: underline; }
    .pick-list { display: grid; gap: 5px; }
    .pick-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }
    .pick-row.dup { background: rgba(194, 55, 55, 0.06); border-color: rgba(194, 55, 55, 0.4); }
    .pick-row input[type="checkbox"] { margin-top: 3px; flex: 0 0 auto; width: 16px; height: 16px; cursor: pointer; }
    .pick-main { display: flex; flex-direction: column; min-width: 0; gap: 2px; flex: 1; }
    .pick-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .pick-sub { font-size: 0.76rem; color: var(--muted); word-break: break-word; }
    .pick-dupnote { font-size: 0.74rem; color: #c23737; }

    .near-list {
      overflow: auto;
      padding: 10px 12px;
      display: grid;
      gap: 5px;
      align-content: start;
    }
    .near-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .near-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .near-name { font-weight: 700; font-size: 0.9rem; word-break: break-word; }
    .near-sub { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 720px) {
      .city-map { height: 300px; }
      /* Thirty cities wrapping into six rows would push the list off screen, so
         narrow viewports scroll the bar sideways instead. */
      .city-bar {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }
      .city-btn { flex: none; }
    }

    @media (max-width: 640px) {
      .stockroom-gear { display: none; }
      .stockroom-head { padding: 0 2px; gap: 10px; min-height: 0; }
      .stockroom-title { font-size: 1.4rem; }
      .legend { padding: 0 2px; }

      .wp-card-head { grid-template-columns: minmax(0, 1fr); }
      .wp-card-head > .wp-nav { justify-self: start; }
      .wp-card-head > .card-actions { justify-self: stretch; }
      .card-actions { grid-column: 1 / -1; justify-content: stretch; }
      .card-actions .btn { flex: 1 1 auto; }
      .field-row { grid-template-columns: 1fr; }

      /* Toolbar wraps onto multiple rows; search takes a full row. */
      .toolbar { flex-wrap: wrap; }
      .toolbar input { flex: 1 1 100%; }
      .toolbar .btn { flex: 1 1 auto; }

      /* Add-waypoints command bar: buttons stretch, dividers drop out. The
         label is the fieldset's legend now, so it needs no row of its own. */
      .command-bar .btn { flex: 1 1 auto; }
      .command-bar-divider { display: none; }

      /* Dialogs (Find waypoints, Prompt, Near) fill the screen. */
      .modal { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
      .modal-bar { flex-wrap: wrap; padding: 10px; }
      .modal-title { flex: 1 1 100%; }
      .modal-bar .btn { flex: 1 1 auto; }

      /* Find-stops / Prompt picker: stack state, city, and the action button. */
      .prompt-search { flex-wrap: wrap; }
      .prompt-search select,
      .prompt-search input,
      .prompt-search .btn { flex: 1 1 100%; max-width: none; }

    }
  </style>

         ABOVE the city bar as of 2026-08-07. The city badges are a filter over

         you happen to have selected — so the row that CREATES things now comes
         before the row that narrows them, instead of being pushed below a rail
         that grows a line every time a new city is catalogued. -->
    <fieldset class="command-bar">
      <legend>Add</legend>

        <button class="btn small" id="newBtn" type="button" title="Add one waypoint by hand in a pop-up form">Manual</button>
