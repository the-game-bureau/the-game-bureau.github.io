<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CITIES | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --stack-gap: 14px;
      /* The two cut-panel tokens, same values as the socials room. A panel
         whose top border is interrupted by its own label needs a fill the
         label can sit on and a line strong enough to read as a frame — the
         0.18 --line is too faint once it has a gap in it. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }
    button, input, select { font: inherit; }

    /* ── Stock Room header lockup ──────────────────────────────────────────── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .stockroom-gear {
      position: absolute; top: 50%; left: -28px; transform: translateY(-50%) scaleX(-1);
      width: 184px; height: 184px; z-index: 0; pointer-events: none; overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase; color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow: 0 0 3px var(--paper-base), 0 0 3px var(--paper-base), 0 0 5px var(--paper-base);
    }
    .stockroom-title { margin: 0; font-size: 1.7rem; letter-spacing: 0.03em; line-height: 1; }
    .stockroom-substat {
      margin: 3px 0 0; min-height: 0;
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.02em; color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-substat.error { color: var(--danger); }
    .stockroom-substat.success { color: var(--success); }
    .stockroom-head-status {
      margin-left: auto; display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; flex-wrap: wrap;
    }
    .signout-btn {
      width: 42px; height: 42px; padding: 0; border-radius: 50%;
      background: #fff; border: 1px solid var(--line); cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .legend { margin: 0 0 18px; padding: 0 12px; color: var(--muted); font-size: 0.98rem; line-height: 1.4; }
    .legend strong { color: var(--ink); }

    /* ── Buttons ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 38px;
      padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
      color: var(--ink); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em;
      text-decoration: none; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.warn { color: var(--danger); border-color: rgba(160, 63, 45, 0.45); background: transparent; }
    .btn.warn:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }
    .btn.small { min-height: 32px; padding: 0 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Command bar + list panel (the socials room's cut panels) ──────────── */
    /* Both boxes are real <fieldset>s keeping their default display, so the
       <legend> natively cuts the top border. The label used to be a plain ADD
       span INSIDE the bar, which spent a slot in the row on a word; as a legend
       it names the box from the frame and gives the row back. */
    .command-bar {
      width: 100%; min-inline-size: 0;
      margin: 0 0 var(--stack-gap); padding: 4px 12px 12px;
      background: var(--cut-panel-bg); border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    .command-bar-inner {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    }

    /* The folder tab. The border runs into the label and back out again, so the
       cut-out reads as a tag clipped onto the frame rather than a gap in it.

       The tab is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box. The word has to sit
       centred on the horizontal line, which is where the browser puts a legend
       by default. But the tab's sides must stop AT that line rather than
       carrying on into the panel, and a bordered box whose bottom edge is the
       line cannot also have its text centred on the line — the text centre is
       always the better part of half a box above the bottom edge.

       So the box stays put and the outline is drawn only over the half above
       the line — `inset: 0 0 50%`, since the legend's midpoint IS the line. The
       word's lower half hangs into the panel, invisibly, because the tab fill
       and the panel are the same colour with no bottom edge between them.

       isolation: isolate is load-bearing. The arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own that -1 would
       drop it behind the fieldset's own background and it would vanish. */
    .command-bar > legend,
    .panel > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .command-bar > legend::before,
    .panel > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;              /* the legend's midpoint is the border line */
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome
         instead of a tab. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }
    .command-bar-divider { width: 1px; align-self: stretch; min-height: 24px; margin: 0 2px; background: var(--line); }
    .command-bar input[type="search"] {
      flex: 1 1 160px; min-width: 0; min-height: 38px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    .command-bar-select {
      flex: 0 0 auto; min-height: 38px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
      font-weight: 600; cursor: pointer;
    }
    /* [hidden] would otherwise lose to the flex shorthand above. */
    .command-bar-select[hidden] { display: none; }
    .command-bar-toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem;
      font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .command-bar-count { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 700; color: var(--muted); }

    /* ── Prompt lightbox ──────────────────────────────────────────────────── */
    .prompt-lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 24, 32, 0.5);
      z-index: 1200;
    }
    .prompt-lightbox.is-open { display: flex; }
    .prompt-dialog {
      width: min(920px, 100%);
      max-height: min(82vh, 900px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid var(--line);
      border-top: 8px solid var(--accent);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 48px rgba(17, 24, 32, 0.28);
      overflow: hidden;
    }
    .prompt-dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
    }
    .prompt-dialog-title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .prompt-dialog-body {
      padding: 12px;
      overflow: auto;
    }
    .prompt-text {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .prompt-options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
    }
    .prompt-options-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .prompt-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .prompt-option input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .prompt-dialog-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
    }
    .prompt-copy-status {
      min-height: 1.2em;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── City list ─────────────────────────────────────────────────────────── */
    /* A fieldset, so it wears the same cut-out label as the command bar above.
       The tint matters more here than it looks: the rows are near-white cards,
       and on the old rgba(255,255,255,0.7) panel they had nothing but their own
       1px border to separate them from the surface behind. Same reasoning as
       the socials queue.

       Tight shadow, not the 0 18px 36px cushion this panel used to carry: that
       is right for a modal floating over the page, and under a long list it
       only blurs the panel's own edge. Modals on this page keep it. */
    .panel {
      min-inline-size: 0;
      border: 1px solid var(--cut-panel-line); border-radius: 10px;
      background: var(--cut-panel-bg);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
      padding: 4px 8px 8px; margin: 0 0 40px;
      overflow: visible;
    }
    .city-list { display: grid; gap: 8px; }
    .city-empty { padding: 22px; text-align: center; color: var(--muted); }

    /* ── Pager (top + bottom, identical) ───────────────────────────────────── */
    .pager { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 8px; }
    /* [hidden] loses to display:flex on specificity, so restate it. */
    .pager[hidden] { display: none; }
    .pager--top { border-bottom: 1px solid var(--line); margin: 0 0 8px; }
    .pager--bottom { border-top: 1px solid var(--line); margin: 8px 0 0; }
    .pager-info {
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.02em; color: var(--muted);
    }
    .pager-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .pager-page {
      padding: 0 6px; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
      font-weight: 700; color: var(--ink); white-space: nowrap;
    }

    /* Solid white on the tinted panel, and a radius one step tighter than the
       panel's 10px — a card nested inside a container should not share its
       corner, or the two read as one surface. The border steps up to
       --control-line for the same reason: at 0.18 it disappeared against the
       fill now behind it. */
    .city-row {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.1fr) auto auto;
      align-items: center; gap: 10px 14px;
      padding: 10px 12px; border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff;
    }
    .city-row.is-dirty { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.12); }
    .city-row.is-ignored .city-name { color: #9aa0a6; }

    .city-idcol { display: grid; gap: 2px; min-width: 0; }
    /* The "City, Region" key, composed read-only from the fields below. */
    .city-name { font-weight: 700; font-size: 1rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
    .city-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .geo-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
    }
    .geo-badge--country { border-radius: 999px; }
    .city-slug { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; color: var(--muted); }

    .city-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.6fr) minmax(0, 1fr); gap: 6px 8px; min-width: 0; }
    .city-fields label { display: grid; gap: 3px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .city-fields input,
    .city-fields select {
      min-height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px;
      background: #fff; color: var(--ink); font-weight: 500; min-width: 0;
    }

    .city-flags { display: grid; gap: 4px; }
    .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .flag input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    .city-actions { display: flex; gap: 6px; }

    @media (max-width: 760px) {
      .stockroom-gear { display: none; }
      .stockroom-head { padding: 0 2px; min-height: 0; }
      .stockroom-title { font-size: 1.4rem; }
      .legend { padding: 0 2px; }
      .city-row { grid-template-columns: 1fr; }
      .city-actions { justify-content: flex-end; }
      .city-actions .btn { flex: 1 1 auto; }
    }
  </style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title" id="cityTitle">0 CITIES</h1>
            <p class="room-substat" id="pageStatus" aria-live="polite">Cities for use across all of The Game Bureau. A core table for use with games, gifts, soundtracks and more.</p>
      </div>
    </div>

    <fieldset class="command-bar">
      <legend>Add</legend>
      <div class="command-bar-inner">
        <input type="search" id="searchInput" placeholder="Search cities…" autocomplete="off">
        <select id="continentFilter" class="command-bar-select" aria-label="Filter by continent" hidden>
          <option value="">All continents</option>
        </select>
        <select id="countryFilter" class="command-bar-select" aria-label="Filter by country" hidden>
          <option value="">All countries</option>
        </select>
        <select id="hiddenFilter" class="command-bar-select" aria-label="Filter by visibility" hidden>
          <option value="">Any visibility</option>
        </select>
        <span class="command-bar-divider" aria-hidden="true"></span>
        <button class="btn small primary" id="addCityBtn" type="button">manual</button>
        <button class="btn small" id="openPromptBtn" type="button">prompt</button>
      </div>
    </fieldset>

    <fieldset class="panel">
      <legend>Cities</legend>
      <div class="pager pager--top" id="pagerTop" aria-label="Pagination (top)" hidden></div>
      <div class="city-list" id="cityList"></div>
      <div class="pager pager--bottom" id="pagerBottom" aria-label="Pagination (bottom)" hidden></div>
    </fieldset>

    <div class="prompt-lightbox" id="promptLightbox" role="dialog" aria-modal="true" aria-labelledby="promptDialogTitle" hidden>
      <div class="prompt-dialog">
        <div class="prompt-dialog-head">
          <h2 class="prompt-dialog-title" id="promptDialogTitle">City Finder Prompt</h2>
          <button class="btn small" id="closePromptBtn" type="button">Close</button>
        </div>
        <div class="prompt-dialog-body">
          <fieldset class="prompt-options" aria-label="Result count">
            <legend class="prompt-options-label">Results</legend>
            <label class="prompt-option"><input type="radio" name="promptCount" value="10">10</label>
            <label class="prompt-option"><input type="radio" name="promptCount" value="100" checked>100</label>
            <label class="prompt-option"><input type="radio" name="promptCount" value="1000">1000</label>
          </fieldset>
          <textarea class="prompt-text" id="cityPromptText" spellcheck="false" readonly></textarea>
        </div>
        <div class="prompt-dialog-foot">
          <div class="prompt-copy-status" id="promptCopyStatus" aria-live="polite"></div>
          <button class="btn small primary" id="copyPromptBtn" type="button">Copy</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script src="/mc/js/supabase-rest.js"></script>
  <script src="/mc/assets/geo.js"></script>
  <script src="/mc/assets/city-picker.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };
    const TABLE = 'cities';
    const DEFAULT_SUBSTAT = 'Cities for use across all of The Game Bureau. A core table for use with games, gifts, soundtracks and more.';

    const cityTitleEl = document.getElementById('cityTitle');
    const pageStatus = document.getElementById('pageStatus');
    const addCityBtn = document.getElementById('addCityBtn');
    const openPromptBtn = document.getElementById('openPromptBtn');
    const promptLightbox = document.getElementById('promptLightbox');
    const closePromptBtn = document.getElementById('closePromptBtn');
    const copyPromptBtn = document.getElementById('copyPromptBtn');
    const cityPromptText = document.getElementById('cityPromptText');
    const promptCopyStatus = document.getElementById('promptCopyStatus');
    const promptCountRadios = Array.from(document.querySelectorAll('input[name="promptCount"]'));
    const searchInput = document.getElementById('searchInput');
    const continentFilter = document.getElementById('continentFilter');
    const countryFilter = document.getElementById('countryFilter');
    const hiddenFilter = document.getElementById('hiddenFilter');
    const cityListEl = document.getElementById('cityList');
    const pagerTopEl = document.getElementById('pagerTop');
    const pagerBottomEl = document.getElementById('pagerBottom');

    // Paging is purely a render-time slice. loadCities() still pulls the whole
    // table through TgbRest.fetchAll (which pages past PostgREST's 1000-row cap),
    // so search and the country/state/city sort still run across every row —
    // only the DOM is capped. Rendering 250+ editable rows, each with four
    // inputs and a country <select> of ~200 options, is what made this page slow.
    const PAGE_SIZE = 100;

    function updateCityTitle() {
      if (!cityTitleEl) return;
      const total = state && Array.isArray(state.rows) ? state.rows.length : 0;
      cityTitleEl.textContent = total + ' CITIES';
    }

    function selectedPromptCount() {
      const checked = promptCountRadios.find((r) => r.checked);
      const n = Number(checked ? checked.value : 100);
      return Number.isFinite(n) && n > 0 ? n : 100;
    }

    function currentCityNamesForPrompt() {
      const names = (state && Array.isArray(state.rows) ? state.rows : [])
        .map((r) => String((r && r.city) || '').trim())
        .filter(Boolean);
      const unique = Array.from(new Set(names));
      unique.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      return unique;
    }

    function buildCityImportPrompt(resultLimit) {
      const limit = Number(resultLimit) || 100;
      const existingCities = currentCityNamesForPrompt();
      const cityLines = existingCities.length
        ? existingCities.map((name) => '- ' + name)
        : ['- (City list not loaded yet. Open this page while signed in to include live DB cities.)'];
      return [
        'You are generating SQL for Supabase Postgres.',
        '',
        'Goal:',
        '1) Find candidate cities to add to public.cities.',
        '2) Return SQL that can be run as-is to import those cities.',
        '3) Make sure cities already in public.cities are excluded.',
        '',
        'Return exactly ' + limit + ' candidate rows.',
        '',
        'Prioritize city types in this order:',
        '- Tourist destination cities around the world.',
        '- North American fan-base cities for pro and college sports (especially American football).',
        '- Major pro sports cities (NFL, NCAA football, MLB, NBA, NHL, MLS, WNBA, NWSL).',
        '- Cities with major sports venues.',
        '',
        'Important hidden-flag rule:',
        '- If a city is primarily a venue city (not itself a major destination/fanbase) OR the venue city differs from the primary fanbase city, include that venue city and set ALL THREE hidden flags to true:',
        '  hide_from_games = true, hide_from_soundtracks = true, hide_from_gift_shop = true.',
        '- Also set ignored = true for those rows for compatibility.',
        '- For all regular destination/fanbase cities, set all three hide flags false and ignored false.',
        '',
        'City formatting rules:',
        '- Use canonical city strings:',
        '  - US: "City, FullStateName" (example: "Atlanta, Georgia")',
        '  - Non-US: "City, CountryName" (example: "Paris, France")',
        '- Never use US postal abbreviations inside the `city` field. Good: "Sacramento, California". Bad: "Sacramento, CA".',
        '- The `city` field, `state_name`, `state_code`, `country_name`, and `country_code` must all agree with each other. Do not mix abbreviations and full names incorrectly.',
        '- Fill ALL structured city fields for EVERY row: city, city_name, state_name, state_code, country_name, country_code, plus the hide flags and ignored.',
        '- city_name = just the city name with no state/country.',
        '- US rows: state_name must be the full state name and state_code must be the 2-letter USPS abbreviation.',
        '- Non-US rows: when the city belongs to a real first-level region/province/state/canton/etc., fill BOTH state_name and state_code.',
        '- For foreign state_code, use the best real local abbreviation / postal abbreviation / widely used short code in uppercase (examples: Ontario -> ON, British Columbia -> BC, Queensland -> QLD, Victoria -> VIC, Bavaria -> BY, New South Wales -> NSW).',
        '- Do NOT leave foreign state_name/state_code blank just because the city is outside the US. Fill them whenever a real region exists.',
        '- Only use null for state_name/state_code when the city truly has no meaningful first-level region to store.',
        '- country_name must be the full country name and country_code must be the alpha-3 code (USA, CAN, FRA, GBR, AUS, DEU, MEX, BRA, etc.).',
        '- For venue-only cities, all four visibility fields must agree: hide_from_games = true, hide_from_soundtracks = true, hide_from_gift_shop = true, ignored = true.',
        '- For normal destination/fanbase cities, all four visibility fields must agree the other way: hide_from_games = false, hide_from_soundtracks = false, hide_from_gift_shop = false, ignored = false.',
        '- Do not include slug in SQL (trigger derives it).',
        '',
        'Current cities already in public.cities (exclude every one of these):',
        ...cityLines,
        '',
        'Output requirements:',
        '- Output SQL only (no prose).',
        '- Use a candidate_rows CTE + filtered_rows CTE and filter out existing cities from public.cities before insert.',
        '- Columns to write: city, city_name, state_name, state_code, country_name, country_code, hide_from_games, hide_from_soundtracks, hide_from_gift_shop, ignored.',
        '- Before outputting SQL, self-check every row for: canonical `city` format, complete structured fields, and matching visibility flags.',
        '',
        'SQL template to follow exactly (replace sample rows with ' + limit + ' rows):',
        'with candidate_rows(city, city_name, state_name, state_code, country_name, country_code, hide_from_games, hide_from_soundtracks, hide_from_gift_shop, ignored) as (',
        '  values',
        "    ('Atlanta, Georgia', 'Atlanta', 'Georgia', 'GA', 'United States', 'USA', false, false, false, false),",
        "    ('Toronto, Canada', 'Toronto', 'Ontario', 'ON', 'Canada', 'CAN', false, false, false, false),",
        "    ('Melbourne, Australia', 'Melbourne', 'Victoria', 'VIC', 'Australia', 'AUS', false, false, false, false),",
        "    ('Inglewood, California', 'Inglewood', 'California', 'CA', 'United States', 'USA', true, true, true, true)",
        '),',
        'filtered_rows as (',
        '  select c.*',
        '  from candidate_rows c',
        '  where not exists (',
        '    select 1 from public.cities e where e.city = c.city',
        '  )',
        ')',
        'insert into public.cities (city, city_name, state_name, state_code, country_name, country_code, hide_from_games, hide_from_soundtracks, hide_from_gift_shop, ignored)',
        'select city, city_name, state_name, state_code, country_name, country_code, hide_from_games, hide_from_soundtracks, hide_from_gift_shop, ignored',
        'from filtered_rows',
        'on conflict (city) do nothing;'
      ].join('\n');
    }

    function refreshPromptText() {
      if (!cityPromptText) return;
      cityPromptText.value = buildCityImportPrompt(selectedPromptCount());
    }

    function setPromptCopyStatus(text, isSuccess) {
      if (!promptCopyStatus) return;
      promptCopyStatus.textContent = text || '';
      promptCopyStatus.style.color = isSuccess ? 'var(--success)' : 'var(--muted)';
    }

    function openPromptLightbox() {
      if (!promptLightbox) return;
      refreshPromptText();
      promptLightbox.hidden = false;
      promptLightbox.classList.add('is-open');
      if (cityPromptText) cityPromptText.focus();
      setPromptCopyStatus('');
    }

    function closePromptLightbox() {
      if (!promptLightbox) return;
      promptLightbox.classList.remove('is-open');
      promptLightbox.hidden = true;
      if (openPromptBtn) openPromptBtn.focus();
    }

    async function copyPromptText() {
      if (!cityPromptText) return;
      const text = cityPromptText.value || '';
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          cityPromptText.removeAttribute('readonly');
          cityPromptText.select();
          document.execCommand('copy');
          cityPromptText.setAttribute('readonly', 'readonly');
        }
        setPromptCopyStatus('Copied.', true);
      } catch (err) {
        console.error(err);
        setPromptCopyStatus('Could not copy automatically. Select and copy manually.', false);
      }
    }

    const state = { rows: [], authed: false, page: 1, continent: '', country: '', hidden: '' };

    // Sentinel for "the country has no continent on file" — distinct from '',
    // which is the All option. Cities with no country_code land here too.
    const CONTINENT_NONE = '__none__';

    function continentOf(row) {
      if (!(window.TgbGeo && TgbGeo.continentForCountry)) return '';
      return TgbGeo.continentForCountry(row) || '';
    }
    function countryOf(row) { return String((row && row.country_code) || '').toUpperCase(); }

    // One hide flag, with the documented fallback: a column that isn't present
    // (a database without 2026072901_cities_hide_flags.sql) falls back to the
    // retired `ignored`, which meant "hidden everywhere".
    function hideFlagOf(row, column) {
      if (!row) return false;
      if (row[column] === true) return true;
      if (row[column] === undefined) return row.ignored === true;
      return false;
    }
    const HIDE_COLUMNS = ['hide_from_games', 'hide_from_soundtracks', 'hide_from_gift_shop'];

    // ── Filter predicates ─────────────────────────────────────────────────────
    function matchesContinent(r) {
      if (!state.continent) return true;
      const c = continentOf(r);
      return state.continent === CONTINENT_NONE ? !c : c === state.continent;
    }
    function matchesCountry(r) {
      return !state.country || countryOf(r) === state.country;
    }
    function matchesHidden(r) {
      const h = state.hidden;
      if (!h) return true;
      if (h === 'any') return HIDE_COLUMNS.some((c) => hideFlagOf(r, c));
      if (h === 'none') return !HIDE_COLUMNS.some((c) => hideFlagOf(r, c));
      if (h === 'all') return HIDE_COLUMNS.every((c) => hideFlagOf(r, c));
      return hideFlagOf(r, h);   // a single surface column
    }

    // Shared option-filler. Keeps the current selection when it survives the
    // rebuild and silently drops to All when it does not — picking Europe and
    // then a country outside it would otherwise strand you on zero rows with no
    // hint as to which control is to blame.
    function fillSelect(el, current, options, allLabel) {
      if (!el) return current;
      el.innerHTML = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = allLabel;
      el.appendChild(all);
      options.forEach((o) => {
        const op = document.createElement('option');
        op.value = o.value;
        op.textContent = o.label + ' (' + o.count + ')';
        if (o.title) op.title = o.title;
        el.appendChild(op);
      });
      const survives = !current || options.some((o) => o.value === current);
      el.value = survives ? current : '';
      el.hidden = false;
      return survives ? current : '';
    }

    // Continent options come from every loaded city — this control is the top of
    // the cascade, so it must always offer the full set. Built from the cities,
    // not the 249-row country catalog: offering "Antarctica" on a list with no
    // Antarctic cities is a dead option. Hidden entirely when nothing is
    // classified, which is what a database without the continent migration
    // looks like.
    function rebuildContinentFilter() {
      if (!continentFilter) return;
      const counts = {};
      let unassigned = 0;
      state.rows.forEach((r) => {
        const c = continentOf(r);
        if (c) counts[c] = (counts[c] || 0) + 1; else unassigned++;
      });
      const names = Object.keys(counts).sort((a, b) => a.localeCompare(b));
      if (!names.length) { continentFilter.hidden = true; state.continent = ''; return; }

      const opts = names.map((n) => ({ value: n, label: n, count: counts[n] }));
      if (unassigned) {
        opts.push({
          value: CONTINENT_NONE, label: 'Unassigned', count: unassigned,
          title: 'Cities whose country has no continent on file, or no country at all.'
        });
      }
      state.continent = fillSelect(continentFilter, state.continent, opts, 'All continents (' + state.rows.length + ')');
    }

    // Countries within the chosen continent, so the two controls cannot be set
    // to a combination that yields nothing.
    function rebuildCountryFilter() {
      if (!countryFilter) return;
      const scope = state.rows.filter(matchesContinent);
      const counts = {}, names = {};
      scope.forEach((r) => {
        const code = countryOf(r);
        if (!code) return;
        counts[code] = (counts[code] || 0) + 1;
        names[code] = r.country_name || code;
      });
      const codes = Object.keys(counts).sort((a, b) => String(names[a]).localeCompare(String(names[b])));
      if (!codes.length) { countryFilter.hidden = true; state.country = ''; return; }
      const opts = codes.map((c) => ({ value: c, label: names[c], count: counts[c] }));
      state.country = fillSelect(countryFilter, state.country, opts, 'All countries (' + scope.length + ')');
    }

    // Visibility, scoped to the continent + country already chosen. "Any hidden"
    // is the headline ask: one or more of the three surface flags ticked.
    function rebuildHiddenFilter() {
      if (!hiddenFilter) return;
      const scope = state.rows.filter((r) => matchesContinent(r) && matchesCountry(r));
      const n = { any: 0, none: 0, all: 0, hide_from_games: 0, hide_from_soundtracks: 0, hide_from_gift_shop: 0 };
      scope.forEach((r) => {
        const on = HIDE_COLUMNS.filter((c) => hideFlagOf(r, c));
        on.forEach((c) => { n[c]++; });
        if (on.length) n.any++; else n.none++;
        if (on.length === HIDE_COLUMNS.length) n.all++;
      });
      const opts = [
        { value: 'any', label: 'Any hidden', count: n.any, title: 'One or more of the three hide checkboxes is ticked.' },
        { value: 'none', label: 'Fully visible', count: n.none, title: 'None of the three hide checkboxes is ticked.' },
        { value: 'all', label: 'Hidden everywhere', count: n.all, title: 'All three hide checkboxes are ticked.' },
        { value: 'hide_from_games', label: 'Hidden from games', count: n.hide_from_games },
        { value: 'hide_from_soundtracks', label: 'Hidden from soundtracks', count: n.hide_from_soundtracks },
        { value: 'hide_from_gift_shop', label: 'Hidden from gift shop', count: n.hide_from_gift_shop }
      ];
      state.hidden = fillSelect(hiddenFilter, state.hidden, opts, 'Any visibility (' + scope.length + ')');
    }

    // Rebuild the whole cascade. Order matters: country options depend on the
    // chosen continent, visibility counts depend on both.
    function rebuildFilters() {
      rebuildContinentFilter();
      rebuildCountryFilter();
      rebuildHiddenFilter();
    }

    // The Country dropdown reads the single source of truth — public.countries,
    // via TgbGeo (assets/geo.js hydrates it). Rebuilt once countries load.
    let COUNTRY_OPTS = (window.TgbGeo && TgbGeo.countryOptions) ? TgbGeo.countryOptions() : [];
    let COUNTRY_NAME_BY_CODE = {};
    function rebuildCountryOpts() {
      COUNTRY_OPTS = (window.TgbGeo && TgbGeo.countryOptions) ? TgbGeo.countryOptions() : COUNTRY_OPTS;
      COUNTRY_NAME_BY_CODE = {};
      COUNTRY_OPTS.forEach((o) => { COUNTRY_NAME_BY_CODE[String(o.code).toUpperCase()] = o.name; });
    }
    rebuildCountryOpts();
    const STATE_OPTS = [];
    if (window.TgbGeo && TgbGeo.usStateOptions) TgbGeo.usStateOptions().forEach((o) => STATE_OPTS.push({ code: String(o.code).toUpperCase(), name: o.name }));
    if (window.TgbGeo && TgbGeo.provinceOptions) TgbGeo.provinceOptions().forEach((o) => STATE_OPTS.push({ code: String(o.code).toUpperCase(), name: o.name }));
    // One shared datalist of state/province names for the State inputs.
    (function () {
      const dl = document.createElement('datalist');
      dl.id = 'city-state-list';
      STATE_OPTS.forEach((s) => { const o = document.createElement('option'); o.value = s.name; dl.appendChild(o); });
      document.body.appendChild(dl);
    }());

    // ── ?add=<city string> ────────────────────────────────────────────────────
    // Somewhere else in Mission Control found a city this catalogue does not
    // have and sent you here to add it. The Anchor Events CHECK report is the
    // first caller: its `unknown-city` finding cannot be fixed on the event row,
    // because the row already holds the string nobody recognises.
    //
    // IT OPENS THE ADD DIALOG PREFILLED rather than merely landing you on the
    // page. Arriving at a 1,451-row catalogue and being told to type in a city
    // you were just looking at somewhere else is the errand this exists to
    // remove; openAddDialog's `initialValue` already parses "Nowheresville,
    // Nebraska" into a city and a state, and the state code derives from there.
    //
    // AFTER load, not beside it: the dialog writes through the same authHeaders
    // the page uses, so it has to wait for the session the way everything else
    // here does.
    function openAddFromQuery() {
      let wanted = '';
      try { wanted = (new URLSearchParams(location.search).get('add') || '').trim(); }
      catch (e) { wanted = ''; }
      if (!wanted) return;

      // EVERY BRANCH BELOW SAYS SOMETHING. This arrived as one silent path --
      // if the dialog did not open you got a blank Cities page and no reason,
      // which is indistinguishable from the link being broken.
      const done = () => {
        // CLEARED ONLY ONCE WE HAVE ACTED. It used to be cleared first, so a
        // branch that bailed lost the request and a reload could not retry it.
        try { history.replaceState(null, '', location.pathname); } catch (e) { /* history unavailable */ }
      };

      if (!(window.TgbCities && typeof TgbCities.openAddDialog === 'function')) {
        setStatus('The city picker did not load, so "' + wanted + '" could not be opened for adding. Reload the page (Ctrl+Shift+R).', 'error');
        return;   // query kept: a reload is exactly the fix, and it will retry
      }

      // ALREADY HERE? Don't open a form the database would refuse -- but don't
      // just whisper it either. The list is searched down to the row so the
      // answer is on screen, which is also how you check the spelling that made
      // the other page think it was missing.
      const key = String(wanted).trim().toLowerCase();
      const match = state.rows.find((r) => String(r.city || '').trim().toLowerCase() === key);
      if (match) {
        done();
        if (searchInput) { searchInput.value = match.city; state.page = 1; state.q = key; render(); }
        setStatus('"' + match.city + '" is already in the catalogue, shown below. Nothing to add.', 'success');
        return;
      }

      TgbCities.openAddDialog({ authHeaders: authHeaders, initialValue: wanted }).then((cityRow) => {
        done();
        if (!cityRow) {
          // openAddDialog resolves null when it refuses -- today, only because
          // another one of its dialogs is already open.
          setStatus('The add form did not open for "' + wanted + '". Close any other dialog and press ADD.', 'error');
          return;
        }
        setStatus('Added ' + (cityRow.city || 'city') + '.', 'success');
        loadCities();
      });
    }

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => { state.authed = true; await loadCities(); openAddFromQuery(); },
      onSignedOut: () => { state.authed = false; state.rows = []; rebuildFilters(); render(); refreshPromptText(); setStatus('Sign in with an admin account.'); }
    });

    refreshPromptText();
    promptCountRadios.forEach((radio) => {
      radio.addEventListener('change', () => {
        refreshPromptText();
        setPromptCopyStatus('Prompt updated for ' + selectedPromptCount() + ' results.', false);
      });
    });
    if (openPromptBtn) openPromptBtn.addEventListener('click', openPromptLightbox);
    if (closePromptBtn) closePromptBtn.addEventListener('click', closePromptLightbox);
    if (copyPromptBtn) copyPromptBtn.addEventListener('click', copyPromptText);
    if (promptLightbox) {
      promptLightbox.addEventListener('click', (event) => {
        if (event.target === promptLightbox) closePromptLightbox();
      });
    }
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && promptLightbox && !promptLightbox.hidden) closePromptLightbox();
    });

    function setStatus(text, kind) {
      if (!pageStatus) return;
      if (kind === 'error') {
        pageStatus.textContent = text || DEFAULT_SUBSTAT;
      } else {
        pageStatus.textContent = DEFAULT_SUBSTAT;
      }
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => { if (v != null) url.searchParams.set(k, v); });
      return url.toString();
    }
    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      return Object.assign({ apikey: SUPABASE_CONFIG.publishableKey, Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey }, extra || {});
    }
    async function readError(res, fallback) {
      try { const t = await res.text(); if (!t) return fallback; try { const j = JSON.parse(t); return j.message || j.error || t; } catch (e) { return t; } }
      catch (e) { return fallback; }
    }

    // select=* on purpose: never name `ignored` (a DB without the migration 400s
    // on an unknown column); a missing flag reads as false.
    async function loadCities() {
      // Always show a state in the list — a blank panel during a slow load or a
      // silent auth failure reads as "nothing's here".
      if (cityListEl) { cityListEl.innerHTML = ''; cityListEl.appendChild(emptyNode('Loading cities…')); }
      setStatus('Loading cities…');
      try {
        // Refresh a stale/expiring access token before the read, so a valid
        // session doesn't 401 with "Empty JWT" / an expired token.
        if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
          try { await adminAuth.ensureFreshSession(); } catch (e) {}
        }
        // Country dropdown options come from public.countries (via geo.js) —
        // make sure they're hydrated before we render the row editors.
        if (window.TgbGeo && TgbGeo.countriesReady) { try { await TgbGeo.countriesReady; } catch (e) {} }
        rebuildCountryOpts();
        const url = restUrl(TABLE, { select: '*', order: 'city.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        state.rows = Array.isArray(rows) ? rows : [];
        state.page = 1;
        rebuildFilters();
        refreshPromptText();
        render();
        setStatus('Loaded ' + state.rows.length + ' cities.', 'success');
      } catch (err) {
        console.error(err);
        const msg = err && err.message ? err.message : 'Could not load cities.';
        setStatus(msg, 'error');
        if (cityListEl) {
          cityListEl.innerHTML = '';
          const isAuth = /jwt|401|permission|auth|sign/i.test(msg);
          cityListEl.appendChild(emptyNode(
            (isAuth ? 'Could not load cities — sign-in issue. ' : 'Could not load cities. ') +
            msg + ' · Reload the page (Ctrl+Shift+R).'
          ));
        }
      }
    }

    function emptyNode(text) {
      const d = document.createElement('div');
      d.className = 'city-empty';
      d.textContent = text;
      return d;
    }

    // Every row that passes the search box, in display order. Paging slices this.
    function visibleRows() {
      const q = (searchInput && searchInput.value || '').trim().toLowerCase();
      const rows = state.rows.filter((r) => {
        if (!matchesContinent(r) || !matchesCountry(r) || !matchesHidden(r)) return false;
        if (!q) return true;
        return [r.city, r.slug, r.city_name, r.state_name, r.country_name].some((v) => String(v || '').toLowerCase().includes(q));
      });
      // Sort: country alpha, then state alpha, then city alpha (case-insensitive;
      // blanks sort last so unclassified rows fall to the bottom of each group).
      const key = (v) => { const s = String(v == null ? '' : v).trim(); return s || '￿'; };
      const cmp = (a, b, f) => key(f(a)).localeCompare(key(f(b)), undefined, { sensitivity: 'base', numeric: true });
      rows.sort((a, b) =>
        cmp(a, b, (r) => r.country_name) ||
        cmp(a, b, (r) => r.state_name) ||
        cmp(a, b, (r) => r.city_name || r.city));
      return rows;
    }

    function hidePagers() {
      [pagerTopEl, pagerBottomEl].forEach((el) => { if (el) { el.innerHTML = ''; el.hidden = true; } });
    }

    // `scrollUp` is set only on the bottom pager: paging from down there leaves
    // you staring at the end of a fresh page, so jump back to the top of the list.
    function goToPage(page, scrollUp) {
      state.page = page;
      render();
      if (!scrollUp) return;
      const panel = document.querySelector('.panel');
      if (panel && panel.scrollIntoView) panel.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    function renderPager(host, info, scrollUp) {
      if (!host) return;
      host.innerHTML = '';
      host.hidden = false;

      const label = document.createElement('span');
      label.className = 'pager-info';
      label.textContent = info.total
        ? 'Showing ' + (info.start + 1) + '–' + (info.start + info.count) + ' of ' + info.total + ' cities'
        : 'No cities';
      host.appendChild(label);

      // One page: the count is still worth showing, the buttons are not.
      if (info.pageCount <= 1) return;

      const controls = document.createElement('div');
      controls.className = 'pager-controls';
      const jump = (text, page, disabled) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn small';
        b.textContent = text;
        b.disabled = !!disabled;
        if (!disabled) b.addEventListener('click', () => goToPage(page, scrollUp));
        return b;
      };
      const p = state.page;
      controls.append(
        jump('« First', 1, p === 1),
        jump('‹ Prev', p - 1, p === 1)
      );
      const pageLabel = document.createElement('span');
      pageLabel.className = 'pager-page';
      pageLabel.textContent = 'Page ' + p + ' of ' + info.pageCount;
      controls.append(
        pageLabel,
        jump('Next ›', p + 1, p === info.pageCount),
        jump('Last »', info.pageCount, p === info.pageCount)
      );
      host.appendChild(controls);
    }

    function render() {
      updateCityTitle();
      if (!cityListEl) return;
      cityListEl.innerHTML = '';
      if (!state.authed) { hidePagers(); cityListEl.appendChild(emptyNode('Sign in to manage cities.')); return; }

      const rows = visibleRows();
      if (!rows.length) {
        hidePagers();
        cityListEl.appendChild(emptyNode(state.rows.length ? 'No cities match.' : 'No cities yet — hit “+ Add”.'));
        return;
      }

      // Clamp before slicing: deleting the last row of the last page, or typing
      // a search that shrinks the set, would otherwise strand you on an empty
      // page that looks like "no cities".
      const pageCount = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      state.page = Math.min(Math.max(1, state.page), pageCount);

      const start = (state.page - 1) * PAGE_SIZE;
      const pageRows = rows.slice(start, start + PAGE_SIZE);
      pageRows.forEach((r) => cityListEl.appendChild(renderRow(r)));

      const info = { total: rows.length, start: start, count: pageRows.length, pageCount: pageCount };
      renderPager(pagerTopEl, info, false);
      renderPager(pagerBottomEl, info, true);
    }

    function geoBadges(row) {
      const wrap = document.createDocumentFragment();
      const badge = (window.TgbGeo && TgbGeo.geoBadge) ? TgbGeo.geoBadge(row) : null;
      const state = row.state_code || (badge && badge.kind === 'state' ? badge.value : '');
      const country = row.country_code || (badge && badge.kind === 'country' ? badge.value : '');
      if (state) { const s = document.createElement('span'); s.className = 'geo-badge'; s.textContent = state; wrap.appendChild(s); }
      if (country && country !== 'USA') { const c = document.createElement('span'); c.className = 'geo-badge geo-badge--country'; c.textContent = country; wrap.appendChild(c); }
      else if (!state && country) { const c = document.createElement('span'); c.className = 'geo-badge geo-badge--country'; c.textContent = country; wrap.appendChild(c); }
      return wrap;
    }

    // Grey in the list means "hidden from at least one public surface" — it is
    // a flag to notice, not a precise statement of which one. The checkboxes on
    // the row say which. Falls back to the retired `ignored` column so this
    // reads correctly before 2026072901_cities_hide_flags.sql is applied.
    // Shares hideFlagOf with the visibility filter, so the grey row and the
    // "Any hidden" count can never disagree about what hidden means.
    function isHiddenAnywhere(row) {
      return HIDE_COLUMNS.some((c) => hideFlagOf(row, c));
    }

    function renderRow(row) {
      const el = document.createElement('div');
      el.className = 'city-row';
      el.dataset.slug = row.slug || '';
      if (isHiddenAnywhere(row)) el.classList.add('is-ignored');

      // Identity: the "City, Region" key (composed from the fields, read-only) +
      // slug. The key is what other tables reference; it updates live as you edit
      // City / State / Country below, and changing it warns before saving.
      const idcol = document.createElement('div');
      idcol.className = 'city-idcol';
      const keyDisplay = document.createElement('div');
      keyDisplay.className = 'city-name';
      keyDisplay.textContent = row.city || '(unnamed)';
      keyDisplay.title = 'The "City, Region" key other tables reference — built from the fields.';
      const sub = document.createElement('span');
      sub.className = 'city-sub';
      const slug = document.createElement('span');
      slug.className = 'city-slug';
      slug.textContent = row.slug || '';
      sub.appendChild(slug);
      idcol.append(keyDisplay, sub);

      // Editable structured fields: City name, State, St. abbr, Country.
      const fields = document.createElement('div');
      fields.className = 'city-fields';

      const mkText = (labelText, value, opts) => {
        opts = opts || {};
        const wrap = document.createElement('label');
        wrap.textContent = labelText;
        const input = document.createElement('input');
        input.type = opts.type || 'text';
        if (opts.list) input.setAttribute('list', opts.list);
        if (opts.placeholder) input.placeholder = opts.placeholder;
        if (opts.maxLength) input.maxLength = opts.maxLength;
        input.value = value == null ? '' : String(value);
        wrap.appendChild(input);
        return { wrap, input };
      };

      const cityNameF = mkText('City', row.city_name || '', { placeholder: 'Atlanta' });
      const stateF = mkText('State', row.state_name || '', { list: 'city-state-list' });
      const abbrF = mkText('St. abbr', row.state_code || '', { maxLength: 3 });

      const countryWrap = document.createElement('label');
      countryWrap.textContent = 'Country';
      const countrySelect = document.createElement('select');
      const blankOpt = document.createElement('option');
      blankOpt.value = ''; blankOpt.textContent = '—';
      countrySelect.appendChild(blankOpt);
      COUNTRY_OPTS.forEach((o) => {
        const op = document.createElement('option');
        op.value = String(o.code).toUpperCase();
        op.textContent = o.name;
        countrySelect.appendChild(op);
      });
      const addCountryOpt = document.createElement('option');
      addCountryOpt.value = '__add_country__';
      addCountryOpt.textContent = '+ Add a country…';
      countrySelect.appendChild(addCountryOpt);
      countrySelect.value = String(row.country_code || '').toUpperCase();
      countryWrap.appendChild(countrySelect);

      const cityNameInput = cityNameF.input, stateInput = stateF.input, abbrInput = abbrF.input;

      fields.append(cityNameF.wrap, stateF.wrap, abbrF.wrap, countryWrap);

      // Flags — one per public surface. These replaced the single "Venue only"
      // checkbox on 2026-07-29: a city can be a real destination for games and
      // a bad fit for the shop, so the three decisions are now independent.
      // Each falls back to the retired `ignored` column when its own column is
      // absent, which is what the old flag meant (hidden everywhere).
      const flags = document.createElement('div');
      flags.className = 'city-flags';

      function hideFlag(column, label, title) {
        const wrap = document.createElement('label');
        wrap.className = 'flag';
        wrap.title = title;
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = row[column] === true
          || (row[column] === undefined && row.ignored === true);
        wrap.append(box, document.createTextNode(label));
        flags.append(wrap);
        return box;
      }

      const hideGamesCb = hideFlag(
        'hide_from_games', 'Hide from games',
        'Keep this city out of the finder on /games/. Use for stadium towns we do not sell into.'
      );
      const hideSoundCb = hideFlag(
        'hide_from_soundtracks', 'Hide from soundtracks',
        'Keep this city off the cassette rail on /soundtracks/.'
      );
      const hideShopCb = hideFlag(
        'hide_from_gift_shop', 'Hide from gift shop',
        'Keep this city out of Shop By City on /gifts/.'
      );

      // Actions.
      const actions = document.createElement('div');
      actions.className = 'city-actions';
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'btn small primary';
      saveBtn.textContent = 'Save';
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn small warn';
      delBtn.textContent = 'Delete';
      actions.append(saveBtn, delBtn);

      // Compose the canonical "City, Region" key from the current field values.
      const composeKey = () => {
        const cityName = cityNameInput.value.trim();
        const cc = countrySelect.value ? countrySelect.value.toUpperCase() : '';
        if (window.TgbGeo && TgbGeo.composeGeo) {
          return TgbGeo.composeGeo({
            cityName: cityName,
            stateCode: abbrInput.value.trim().toUpperCase(),
            stateName: stateInput.value.trim(),
            countryCode: cc,
            countryName: cc ? (COUNTRY_NAME_BY_CODE[cc] || '') : ''
          }) || cityName;
        }
        return cityName;
      };
      const updateKeyPreview = () => { keyDisplay.textContent = composeKey() || '(unnamed)'; };

      const markDirty = () => { el.classList.add('is-dirty'); updateKeyPreview(); };
      [cityNameInput, stateInput, abbrInput].forEach((i) => i.addEventListener('input', markDirty));
      [hideGamesCb, hideSoundCb, hideShopCb].forEach((box) => box.addEventListener('change', markDirty));

      // Country <select> doubles as an "add a country" entry point: picking the
      // "+ Add a country…" option opens the shared dialog instead of selecting it.
      countrySelect.addEventListener('change', () => {
        if (countrySelect.value !== '__add_country__') { markDirty(); return; }
        countrySelect.value = String(row.country_code || '').toUpperCase();   // revert
        if (!window.TgbCountries) return;
        window.TgbCountries.openAddDialog({ authHeaders }).then((c) => {
          if (!c) return;
          rebuildCountryOpts();
          const code = String(c.code).toUpperCase();
          if (!countrySelect.querySelector('option[value="' + code + '"]')) {
            const op = document.createElement('option');
            op.value = code; op.textContent = c.name;
            countrySelect.insertBefore(op, countrySelect.querySelector('option[value="__add_country__"]'));
          }
          countrySelect.value = code;
          markDirty();
        });
      });

      saveBtn.addEventListener('click', () => {
        const cityName = cityNameInput.value.trim();
        if (!cityName) { setStatus('City name can’t be empty.', 'error'); cityNameInput.focus(); return; }
        const canonical = composeKey();

        // Every structured column comes straight from its own editable field.
        const cc = countrySelect.value ? countrySelect.value.toUpperCase() : null;
        const payload = {
          hide_from_games: hideGamesCb.checked,
          hide_from_soundtracks: hideSoundCb.checked,
          hide_from_gift_shop: hideShopCb.checked,
          // `ignored` is deprecated but still written, so a client or page that
          // has not moved to the three columns keeps behaving sensibly. It means
          // "hidden everywhere", so it is only true when all three are.
          ignored: hideGamesCb.checked && hideSoundCb.checked && hideShopCb.checked,
          city_name: cityName || null,
          state_name: stateInput.value.trim() || null,
          state_code: abbrInput.value.trim().toUpperCase() || null,
          country_code: cc,
          country_name: cc ? (COUNTRY_NAME_BY_CODE[cc] || null) : null
        };

        // Rename? The composed key is what other tables reference — warn. The
        // slug is a stable PK and does not change on rename.
        if (canonical.toLowerCase() !== String(row.city || '').toLowerCase()) {
          const ok = window.confirm(
            'Rename “' + (row.city || '') + '” → “' + canonical + '”?\n\n' +
            'The city name is the KEY that games and gift-shop listings reference by string — those are NOT updated automatically. Anything still pointing at “' + (row.city || '') + '” (a game\'s Start City, a gift\'s shop, a /gifts/?city=… link) will stop matching this city until you fix it there too.\n\n' +
            'Rename anyway?'
          );
          if (!ok) return;
          payload.city = canonical;
        }

        saveRow(row, payload, saveBtn, el);
      });
      delBtn.addEventListener('click', () => deleteRow(row, delBtn));

      el.append(idcol, fields, flags, actions);
      return el;
    }

    // PATCH by slug — the stable primary key, unchanged even on rename. The
    // payload never contains slug; it carries `city` + structured geo only when
    // the Save handler detected (and warned about) a rename.
    async function saveRow(row, payload, btn, el) {
      const slug = row.slug;
      if (!slug) { setStatus('This row has no slug to update.', 'error'); return; }
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
      try {
        const res = await fetch(restUrl(TABLE, { slug: 'eq.' + slug }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await readError(res, 'Save failed.'));
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) throw new Error('Nothing was saved — the database refused the change. Check you are signed in as an admin.');
        Object.assign(row, rows[0]);
        if (el) { el.classList.remove('is-dirty'); el.classList.toggle('is-ignored', isHiddenAnywhere(row)); }
        setStatus('Saved ' + (row.city || slug) + '.', 'success');
        render();
      } catch (err) {
        console.error(err);
        setStatus(err && err.message ? err.message : 'Save failed.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function deleteRow(row, btn) {
      const slug = row.slug;
      if (!slug) return;
      if (!window.confirm('Delete "' + (row.city || slug) + '" from the city catalog? This is permanent. To keep it but drop it from a public page, use the Hide from checkboxes instead.')) return;
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Deleting…';
      try {
        const res = await fetch(restUrl(TABLE, { slug: 'eq.' + slug }), { method: 'DELETE', headers: authHeaders({ Prefer: 'return=minimal' }) });
        if (!res.ok) throw new Error(await readError(res, 'Delete failed.'));
        state.rows = state.rows.filter((r) => r.slug !== slug);
        render();
        setStatus('Deleted ' + (row.city || slug) + '.', 'success');
      } catch (err) {
        console.error(err);
        setStatus(err && err.message ? err.message : 'Delete failed.', 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    if (addCityBtn) {
      addCityBtn.addEventListener('click', () => {
        if (!(window.TgbCities && typeof TgbCities.openAddDialog === 'function')) { setStatus('City picker not loaded.', 'error'); return; }
        TgbCities.openAddDialog({ authHeaders: authHeaders }).then((cityRow) => {
          if (!cityRow) return;
          setStatus('Added ' + (cityRow.city || 'city') + '.', 'success');
          loadCities();
        });
      });
    }
    // Any new search starts at page 1 — keeping the old page number would land
    // you past the end of a narrower result set.
    if (searchInput) searchInput.addEventListener('input', () => { state.page = 1; render(); });
    // Each control re-derives the ones below it in the cascade, then re-renders.
    function onFilterChange() {
      state.page = 1;
      rebuildCountryFilter();
      rebuildHiddenFilter();
      render();
    }
    if (continentFilter) continentFilter.addEventListener('change', () => {
      state.continent = continentFilter.value || '';
      onFilterChange();
    });
    if (countryFilter) countryFilter.addEventListener('change', () => {
      state.country = countryFilter.value || '';
      onFilterChange();
    });
    if (hiddenFilter) hiddenFilter.addEventListener('change', () => {
      state.hidden = hiddenFilter.value || '';
      state.page = 1;
      render();
    });

    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    render();
    adminAuth.init();
  </script>
</body>
</html>
