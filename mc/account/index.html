<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3eee6" />
  <meta name="description" content="Sign in to THE GAME BUREAU." />
  <title>Account | The Game Bureau</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mc/assets/public-theme.css">
  <script src="/mc/assets/public-account.js"></script>
  <script src="/mc/assets/account-page.js" defer></script>
  <script>
    if (new URLSearchParams(window.location.search).get('embedded') === '1') {
      document.documentElement.classList.add('account-embedded');
    }
  </script>
  <style>
    body.public-library {
      --library-paper: #f3eee6;
      --library-paper-strong: #fbf8f1;
      --library-ink: #111111;
      --library-muted: rgba(17, 17, 17, 0.62);
      --library-line: rgba(17, 17, 17, 0.14);
      --library-line-strong: rgba(17, 17, 17, 0.82);
      --library-accent: #d73a31;
      --library-accent-soft: rgba(215, 58, 49, 0.1);
      min-height: 100svh;
      margin: 0;
      color: var(--library-ink);
      background: var(--library-paper);
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      overflow-x: hidden;
    }

    body.public-library,
    body.public-library * {
      font-family: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      letter-spacing: 0;
    }

    body.public-library::before,
    body.public-library::after {
      display: none;
    }

    .public-library .page-shell {
      width: min(1320px, calc(100% - 40px));
      min-height: 100svh;
      padding: 24px 0 52px;
    }

    .public-library .site-nav {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 1rem;
      padding: 0 0 20px;
      border: 0;
      border-bottom: 2px solid var(--library-line-strong);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .public-library .brand-lockup {
      gap: 10px;
      align-items: start;
    }

    .public-library .brand-lockup--page .brand-name {
      color: var(--library-accent) !important;
      font-family: "IBM Plex Mono", monospace !important;
      font-size: 0.72rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.24em !important;
      text-transform: uppercase;
      text-shadow: none;
    }

    .public-library .page-headline {
      color: var(--library-ink);
      font-size: clamp(4rem, 11vw, 7.8rem);
      font-weight: 800;
      letter-spacing: -0.09em;
      line-height: 0.82;
      text-transform: uppercase;
      text-shadow: none;
    }

    .public-library .page-count-line {
      margin: 0;
      color: var(--library-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .public-library .nav-links {
      gap: 8px;
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .public-library .nav-link,
    .public-library .utility-link,
    .public-library .button,
    .public-library .ghost-button,
    .public-library .btn,
    .public-library .btn-primary,
    .public-library .cta,
    .public-library .account-tab,
    .public-library .text-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--library-line-strong);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.62);
      color: var(--library-ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: none;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .public-library .nav-link:hover,
    .public-library .nav-link:focus-visible,
    .public-library .utility-link:hover,
    .public-library .utility-link:focus-visible,
    .public-library .button:hover,
    .public-library .button:focus-visible,
    .public-library .ghost-button:hover,
    .public-library .ghost-button:focus-visible,
    .public-library .btn:hover,
    .public-library .btn:focus-visible,
    .public-library .btn-primary:hover,
    .public-library .btn-primary:focus-visible,
    .public-library .cta:hover,
    .public-library .cta:focus-visible,
    .public-library .account-tab:hover,
    .public-library .account-tab:focus-visible,
    .public-library .text-button:hover,
    .public-library .text-button:focus-visible {
      border-color: var(--library-accent);
      background: rgba(255, 255, 255, 0.92);
      color: var(--library-ink);
      outline: none;
      transform: translateY(-1px);
    }

    .public-library .nav-link--active,
    .public-library .btn,
    .public-library .btn-primary,
    .public-library .account-tab.is-active {
      background: var(--library-ink);
      border-color: var(--library-ink);
      color: #ffffff;
    }

    .public-library .nav-link--active:hover,
    .public-library .nav-link--active:focus-visible,
    .public-library .btn:hover,
    .public-library .btn:focus-visible,
    .public-library .btn-primary:hover,
    .public-library .btn-primary:focus-visible,
    .public-library .account-tab.is-active:hover,
    .public-library .account-tab.is-active:focus-visible {
      background: var(--library-accent);
      border-color: var(--library-accent);
      color: #ffffff;
    }

    .public-library main {
      display: grid;
      gap: 18px;
      padding-top: 18px;
    }

    .public-library .account-layout {
      display: grid;
      justify-content: center;
    }

    .public-library .account-panel {
      width: min(760px, 100%);
      display: grid;
      gap: 18px;
      padding: 18px;
      border: 1px solid var(--library-line-strong);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: none;
    }

    .public-library .account-panel h2 {
      margin: 0;
      color: var(--library-ink);
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .public-library .kicker {
      margin: 0;
      color: var(--library-accent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .public-library .account-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--library-line);
    }

    .public-library .account-form {
      display: grid;
      gap: 14px;
    }

    .public-library .account-form label {
      display: grid;
      gap: 8px;
      color: var(--library-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .public-library .account-form input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--library-line-strong);
      border-radius: 0;
      background: var(--library-paper-strong);
      color: var(--library-ink);
      font: 600 1rem/1.2 "IBM Plex Mono", "Menlo", "Consolas", monospace;
    }

    .public-library .account-form input:focus {
      border-color: var(--library-accent);
      outline: none;
      box-shadow: inset 0 0 0 1px var(--library-accent);
    }

    .public-library .account-status {
      margin: 0;
      min-height: 1.4em;
      color: var(--library-muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .public-library .account-status.is-error {
      color: var(--library-accent);
      font-weight: 700;
    }

    .public-library .account-status.is-success {
      color: var(--library-ink);
      font-weight: 700;
    }

    .public-library .account-email {
      margin: 0;
      color: var(--library-muted);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .public-library .account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid var(--library-line);
    }

    .public-library .account-actions > * {
      flex: 0 0 auto;
    }

    .public-library .cta,
    .public-library .text-button {
      background: transparent;
    }

    html.account-embedded body.public-library {
      background: transparent;
    }

    html.account-embedded .page-shell {
      width: min(820px, calc(100% - 24px));
      min-height: auto;
      padding: 12px 0;
    }

    html.account-embedded .site-nav,
    html.account-embedded .tgb-admin-page-link {
      display: none !important;
    }

    html.account-embedded main {
      padding-top: 0;
    }

    html.account-embedded .account-panel {
      width: 100%;
      min-height: calc(100svh - 24px);
    }

    @media (max-width: 820px) {
      .public-library .page-shell {
        width: calc(100% - 24px);
        padding: 14px 0 36px;
      }

      .public-library .site-nav {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .public-library .page-headline {
        font-size: 3.2rem;
      }

      .public-library .nav-links {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .public-library .account-tabs,
      .public-library .account-actions,
      .public-library .nav-links {
        grid-template-columns: 1fr;
      }

      .public-library .account-actions {
        display: grid;
      }

      .public-library .account-actions > * {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/mc/assets/site-shell.css">
  <link rel="stylesheet" href="/mc/assets/site-pages.css">
  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/assets/site-nav-login.js" defer></script>
</head>
<body class="public-library home-page" data-admin-page="mission-control">
  <div class="page-shell">
  <header class="site-nav">
    <div class="brand-lockup">
      <span class="brand-name">The Game Bureau</span>
      <p class="brand-tagline">The Cure for the Common Walking Tour</p>
    </div>
    <nav class="nav-links" aria-label="Primary">
      <div class="nav-primary-links" aria-label="Featured">
        <a class="nav-link nav-link--major nav-link--games" href="/games/">GAMES</a>
        <a class="nav-link nav-link--major nav-link--gifts" href="/gifts/">GIFTS</a>
      </div>
      <div class="nav-utility-links">
        <a class="nav-link nav-link--minor" href="/mc/how/">How It Works</a>
        <a class="nav-link nav-link--minor" href="/highlights/">Highlights</a>
      </div>
    </nav>
  </header>

    <main>
      <section class="account-layout" aria-label="Account forms">
        <section class="account-panel" id="signedOutPanel">
          <div class="account-tabs" role="tablist" aria-label="Account mode">
            <button class="account-tab" type="button" role="tab" data-auth-mode-btn="signin">Sign in</button>
            <button class="account-tab" type="button" role="tab" data-auth-mode-btn="signup">Create account</button>
          </div>

          <form class="account-form" id="signInForm" data-auth-mode="signin">
            <label>
              Email
              <input name="email" type="email" autocomplete="username" required>
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn btn-primary" type="submit">Sign in</button>
            <button class="text-button" id="recoverBtn" type="button">Send password reset email</button>
            <p class="account-status" id="signInStatus" aria-live="polite"></p>
          </form>

          <form class="account-form hidden" id="signUpForm" data-auth-mode="signup">
            <label>
              Display name
              <input name="display_name" type="text" autocomplete="name">
            </label>
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="new-password" minlength="6" required>
            </label>
            <button class="btn btn-primary" type="submit">Create account</button>
            <p class="account-status" id="signUpStatus" aria-live="polite"></p>
          </form>
        </section>

        <section class="account-panel hidden" id="signedInPanel">
          <p class="kicker">Signed in</p>
          <h2 id="accountName">Field agent</h2>
          <p class="account-email" id="accountEmail"></p>

          <form class="account-form" id="profileForm">
            <label>
              Display name
              <input id="displayNameInput" name="display_name" type="text" autocomplete="name">
            </label>
            <button class="btn btn-primary" type="submit">Save account</button>
            <p class="account-status" id="profileStatus" aria-live="polite"></p>
          </form>

          <div class="account-actions">
            <a class="cta" id="openLibraryLink" href="/games/">OPEN GAME LIBRARY</a>
            <button class="btn" id="accountSignOutBtn" type="button">Sign out</button>
          </div>
        </section>
      </section>
    </main>

    <!-- Site footer (shared via /assets/site-footer.js) -->
    <footer class="site-footer" data-site-footer></footer>
    <script src="/mc/assets/site-footer.js"></script>
  </div>
  <script src="/mc/assets/admin-bridge.js"></script>
</body>
</html>
