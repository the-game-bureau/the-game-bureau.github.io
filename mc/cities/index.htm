<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CITIES | THE GAME BUREAU</title>
  <link rel="icon" href="/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --stack-gap: 14px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }
    button, input, select { font: inherit; }

    /* ── Stock Room header lockup ──────────────────────────────────────────── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .stockroom-gear {
      position: absolute; top: 50%; left: -28px; transform: translateY(-50%) scaleX(-1);
      width: 184px; height: 184px; z-index: 0; pointer-events: none; overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase; color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow: 0 0 3px var(--paper-base), 0 0 3px var(--paper-base), 0 0 5px var(--paper-base);
    }
    .stockroom-title { margin: 0; font-size: 1.7rem; letter-spacing: 0.03em; line-height: 1; }
    .stockroom-substat {
      margin: 3px 0 0; min-height: 0;
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.02em; color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-substat.error { color: var(--danger); }
    .stockroom-substat.success { color: var(--success); }
    .stockroom-head-status {
      margin-left: auto; display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; flex-wrap: wrap;
    }
    .signout-btn {
      width: 42px; height: 42px; padding: 0; border-radius: 50%;
      background: #fff; border: 1px solid var(--line); cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .legend { margin: 0 0 18px; padding: 0 12px; color: var(--muted); font-size: 0.98rem; line-height: 1.4; }
    .legend strong { color: var(--ink); }

    /* ── Buttons ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 38px;
      padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
      color: var(--ink); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em;
      text-decoration: none; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.warn { color: var(--danger); border-color: rgba(160, 63, 45, 0.45); background: transparent; }
    .btn.warn:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }
    .btn.small { min-height: 32px; padding: 0 10px; font-size: 0.76rem; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Command bar (Stock Room look) ─────────────────────────────────────── */
    .command-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%;
      margin: 0 0 var(--stack-gap); padding: 10px 12px;
      background: #eef0f4; border: 1px solid var(--line); border-radius: 10px;
    }
    .command-bar-label {
      flex: 0 0 auto; font-family: "IBM Plex Mono", monospace; font-size: 0.66rem;
      font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }
    .command-bar-divider { width: 1px; align-self: stretch; min-height: 24px; margin: 0 2px; background: var(--line); }
    .command-bar input[type="search"] {
      flex: 1 1 160px; min-width: 0; min-height: 38px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    .command-bar-toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem;
      font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .command-bar-count { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 700; color: var(--muted); }

    /* ── City list ─────────────────────────────────────────────────────────── */
    .panel {
      border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 18px 36px var(--paper-shadow); padding: 8px; margin: 0 0 40px;
    }
    .city-list { display: grid; gap: 8px; }
    .city-empty { padding: 22px; text-align: center; color: var(--muted); }

    .city-row {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.1fr) auto auto;
      align-items: center; gap: 10px 14px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
    }
    .city-row.is-dirty { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--bic-blue-rgb), 0.12); }
    .city-row.is-ignored .city-name { color: #9aa0a6; }

    .city-idcol { display: grid; gap: 2px; min-width: 0; }
    /* The "City, Region" key, composed read-only from the fields below. */
    .city-name { font-weight: 700; font-size: 1rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
    .city-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .geo-badge {
      font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
    }
    .geo-badge--country { border-radius: 999px; }
    .city-slug { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; color: var(--muted); }

    .city-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.6fr) minmax(0, 1fr); gap: 6px 8px; min-width: 0; }
    .city-fields label { display: grid; gap: 3px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .city-fields input,
    .city-fields select {
      min-height: 34px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px;
      background: #fff; color: var(--ink); font-weight: 500; min-width: 0;
    }

    .city-flags { display: grid; gap: 4px; }
    .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer; }
    .flag input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    .city-actions { display: flex; gap: 6px; }

    @media (max-width: 760px) {
      .stockroom-gear { display: none; }
      .stockroom-head { padding: 0 2px; min-height: 0; }
      .stockroom-title { font-size: 1.4rem; }
      .legend { padding: 0 2px; }
      .city-row { grid-template-columns: 1fr; }
      .city-actions { justify-content: flex-end; }
      .city-actions .btn { flex: 1 1 auto; }
    }
  </style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>

    <p class="legend">The one city catalog the whole site reads &mdash; <strong>/sound/</strong>, <strong>/shop/</strong>, and every admin picker. <strong>Venue only</strong> hides a city from gifts &amp; soundtracks (a place teams play but we don't sell for). To remove a city entirely, delete it.</p>

  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };
    const TABLE = 'cities';

    const pageStatus = document.getElementById('pageStatus');
    const signOutBtn = document.getElementById('signOutBtn');
    const addCityBtn = document.getElementById('addCityBtn');
    const searchInput = document.getElementById('searchInput');
    const cityListEl = document.getElementById('cityList');
    const cityCountEl = document.getElementById('cityCount');

    const state = { rows: [], authed: false };

    // The Country dropdown reads the single source of truth — public.countries,
    // via TgbGeo (assets/geo.js hydrates it). Rebuilt once countries load.
    let COUNTRY_OPTS = (window.TgbGeo && TgbGeo.countryOptions) ? TgbGeo.countryOptions() : [];
    let COUNTRY_NAME_BY_CODE = {};
    function rebuildCountryOpts() {
      COUNTRY_OPTS = (window.TgbGeo && TgbGeo.countryOptions) ? TgbGeo.countryOptions() : COUNTRY_OPTS;
      COUNTRY_NAME_BY_CODE = {};
      COUNTRY_OPTS.forEach((o) => { COUNTRY_NAME_BY_CODE[String(o.code).toUpperCase()] = o.name; });
    }
    rebuildCountryOpts();
    const STATE_OPTS = [];
    if (window.TgbGeo && TgbGeo.usStateOptions) TgbGeo.usStateOptions().forEach((o) => STATE_OPTS.push({ code: String(o.code).toUpperCase(), name: o.name }));
    if (window.TgbGeo && TgbGeo.provinceOptions) TgbGeo.provinceOptions().forEach((o) => STATE_OPTS.push({ code: String(o.code).toUpperCase(), name: o.name }));
    // One shared datalist of state/province names for the State inputs.
    (function () {
      const dl = document.createElement('datalist');
      dl.id = 'city-state-list';
      STATE_OPTS.forEach((s) => { const o = document.createElement('option'); o.value = s.name; dl.appendChild(o); });
      document.body.appendChild(dl);
    }());

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => { state.authed = true; await loadCities(); },
      onSignedOut: () => { state.authed = false; state.rows = []; render(); setStatus('Sign in with an admin account.'); }
    });

    function setStatus(text, kind) {
      if (!pageStatus) return;
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => { if (v != null) url.searchParams.set(k, v); });
      return url.toString();
    }
    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      return Object.assign({ apikey: SUPABASE_CONFIG.publishableKey, Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey }, extra || {});
    }
    async function readError(res, fallback) {
      try { const t = await res.text(); if (!t) return fallback; try { const j = JSON.parse(t); return j.message || j.error || t; } catch (e) { return t; } }
      catch (e) { return fallback; }
    }

    // select=* on purpose: never name `ignored` (a DB without the migration 400s
    // on an unknown column); a missing flag reads as false.
    async function loadCities() {
      // Always show a state in the list — a blank panel during a slow load or a
      // silent auth failure reads as "nothing's here".
      if (cityListEl) { cityListEl.innerHTML = ''; cityListEl.appendChild(emptyNode('Loading cities…')); }
      setStatus('Loading cities…');
      try {
        // Refresh a stale/expiring access token before the read, so a valid
        // session doesn't 401 with "Empty JWT" / an expired token.
        if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
          try { await adminAuth.ensureFreshSession(); } catch (e) {}
        }
        // Country dropdown options come from public.countries (via geo.js) —
        // make sure they're hydrated before we render the row editors.
        if (window.TgbGeo && TgbGeo.countriesReady) { try { await TgbGeo.countriesReady; } catch (e) {} }
        rebuildCountryOpts();
        const url = restUrl(TABLE, { select: '*', order: 'city.asc' });
        const rows = await TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
        state.rows = Array.isArray(rows) ? rows : [];
        render();
        setStatus('Loaded ' + state.rows.length + ' cities.', 'success');
      } catch (err) {
        console.error(err);
        const msg = err && err.message ? err.message : 'Could not load cities.';
        setStatus(msg, 'error');
        if (cityListEl) {
          cityListEl.innerHTML = '';
          const isAuth = /jwt|401|permission|auth|sign/i.test(msg);
          cityListEl.appendChild(emptyNode(
            (isAuth ? 'Could not load cities — sign-in issue. ' : 'Could not load cities. ') +
            msg + ' · Reload the page (Ctrl+Shift+R).'
          ));
        }
      }
    }

    function emptyNode(text) {
      const d = document.createElement('div');
      d.className = 'city-empty';
      d.textContent = text;
      return d;
    }

    function render() {
      if (!cityListEl) return;
      cityListEl.innerHTML = '';
      if (!state.authed) { cityListEl.appendChild(emptyNode('Sign in to manage cities.')); if (cityCountEl) cityCountEl.textContent = ''; return; }
      const q = (searchInput && searchInput.value || '').trim().toLowerCase();
      const rows = state.rows.filter((r) => {
        if (!q) return true;
        return [r.city, r.slug, r.city_name, r.state_name, r.country_name].some((v) => String(v || '').toLowerCase().includes(q));
      });
      // Sort: country alpha, then state alpha, then city alpha (case-insensitive;
      // blanks sort last so unclassified rows fall to the bottom of each group).
      const key = (v) => { const s = String(v == null ? '' : v).trim(); return s || '￿'; };
      const cmp = (a, b, f) => key(f(a)).localeCompare(key(f(b)), undefined, { sensitivity: 'base', numeric: true });
      rows.sort((a, b) =>
        cmp(a, b, (r) => r.country_name) ||
        cmp(a, b, (r) => r.state_name) ||
        cmp(a, b, (r) => r.city_name || r.city));
      if (!rows.length) { cityListEl.appendChild(emptyNode(state.rows.length ? 'No cities match.' : 'No cities yet — hit “+ Add”.')); }
      else rows.forEach((r) => cityListEl.appendChild(renderRow(r)));
      if (cityCountEl) {
        cityCountEl.textContent = rows.length + ' shown · ' + state.rows.length + ' total';
      }
    }

    function geoBadges(row) {
      const wrap = document.createDocumentFragment();
      const badge = (window.TgbGeo && TgbGeo.geoBadge) ? TgbGeo.geoBadge(row) : null;
      const state = row.state_code || (badge && badge.kind === 'state' ? badge.value : '');
      const country = row.country_code || (badge && badge.kind === 'country' ? badge.value : '');
      if (state) { const s = document.createElement('span'); s.className = 'geo-badge'; s.textContent = state; wrap.appendChild(s); }
      if (country && country !== 'USA') { const c = document.createElement('span'); c.className = 'geo-badge geo-badge--country'; c.textContent = country; wrap.appendChild(c); }
      else if (!state && country) { const c = document.createElement('span'); c.className = 'geo-badge geo-badge--country'; c.textContent = country; wrap.appendChild(c); }
      return wrap;
    }

    function renderRow(row) {
      const el = document.createElement('div');
      el.className = 'city-row';
      el.dataset.slug = row.slug || '';
      if (row.ignored === true) el.classList.add('is-ignored');

      // Identity: the "City, Region" key (composed from the fields, read-only) +
      // slug. The key is what other tables reference; it updates live as you edit
      // City / State / Country below, and changing it warns before saving.
      const idcol = document.createElement('div');
      idcol.className = 'city-idcol';
      const keyDisplay = document.createElement('div');
      keyDisplay.className = 'city-name';
      keyDisplay.textContent = row.city || '(unnamed)';
      keyDisplay.title = 'The "City, Region" key other tables reference — built from the fields.';
      const sub = document.createElement('span');
      sub.className = 'city-sub';
      const slug = document.createElement('span');
      slug.className = 'city-slug';
      slug.textContent = row.slug || '';
      sub.appendChild(slug);
      idcol.append(keyDisplay, sub);

      // Editable structured fields: City name, State, St. abbr, Country.
      const fields = document.createElement('div');
      fields.className = 'city-fields';

      const mkText = (labelText, value, opts) => {
        opts = opts || {};
        const wrap = document.createElement('label');
        wrap.textContent = labelText;
        const input = document.createElement('input');
        input.type = opts.type || 'text';
        if (opts.list) input.setAttribute('list', opts.list);
        if (opts.placeholder) input.placeholder = opts.placeholder;
        if (opts.maxLength) input.maxLength = opts.maxLength;
        input.value = value == null ? '' : String(value);
        wrap.appendChild(input);
        return { wrap, input };
      };

      const cityNameF = mkText('City', row.city_name || '', { placeholder: 'Atlanta' });
      const stateF = mkText('State', row.state_name || '', { list: 'city-state-list', placeholder: 'Georgia' });
      const abbrF = mkText('St. abbr', row.state_code || '', { placeholder: 'GA', maxLength: 3 });

      const countryWrap = document.createElement('label');
      countryWrap.textContent = 'Country';
      const countrySelect = document.createElement('select');
      const blankOpt = document.createElement('option');
      blankOpt.value = ''; blankOpt.textContent = '—';
      countrySelect.appendChild(blankOpt);
      COUNTRY_OPTS.forEach((o) => {
        const op = document.createElement('option');
        op.value = String(o.code).toUpperCase();
        op.textContent = o.name;
        countrySelect.appendChild(op);
      });
      const addCountryOpt = document.createElement('option');
      addCountryOpt.value = '__add_country__';
      addCountryOpt.textContent = '+ Add a country…';
      countrySelect.appendChild(addCountryOpt);
      countrySelect.value = String(row.country_code || '').toUpperCase();
      countryWrap.appendChild(countrySelect);

      const cityNameInput = cityNameF.input, stateInput = stateF.input, abbrInput = abbrF.input;

      fields.append(cityNameF.wrap, stateF.wrap, abbrF.wrap, countryWrap);

      // Flags.
      const flags = document.createElement('div');
      flags.className = 'city-flags';
      const ignoredLabel = document.createElement('label');
      ignoredLabel.className = 'flag';
      const ignoredCb = document.createElement('input');
      ignoredCb.type = 'checkbox';
      ignoredCb.checked = row.ignored === true;
      ignoredLabel.append(ignoredCb, document.createTextNode('Venue only'));
      flags.append(ignoredLabel);

      // Actions.
      const actions = document.createElement('div');
      actions.className = 'city-actions';
      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'btn small primary';
      saveBtn.textContent = 'Save';
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn small warn';
      delBtn.textContent = 'Delete';
      actions.append(saveBtn, delBtn);

      // Compose the canonical "City, Region" key from the current field values.
      const composeKey = () => {
        const cityName = cityNameInput.value.trim();
        const cc = countrySelect.value ? countrySelect.value.toUpperCase() : '';
        if (window.TgbGeo && TgbGeo.composeGeo) {
          return TgbGeo.composeGeo({
            cityName: cityName,
            stateCode: abbrInput.value.trim().toUpperCase(),
            stateName: stateInput.value.trim(),
            countryCode: cc,
            countryName: cc ? (COUNTRY_NAME_BY_CODE[cc] || '') : ''
          }) || cityName;
        }
        return cityName;
      };
      const updateKeyPreview = () => { keyDisplay.textContent = composeKey() || '(unnamed)'; };

      const markDirty = () => { el.classList.add('is-dirty'); updateKeyPreview(); };
      [cityNameInput, stateInput, abbrInput].forEach((i) => i.addEventListener('input', markDirty));
      ignoredCb.addEventListener('change', markDirty);

      // Country <select> doubles as an "add a country" entry point: picking the
      // "+ Add a country…" option opens the shared dialog instead of selecting it.
      countrySelect.addEventListener('change', () => {
        if (countrySelect.value !== '__add_country__') { markDirty(); return; }
        countrySelect.value = String(row.country_code || '').toUpperCase();   // revert
        if (!window.TgbCountries) return;
        window.TgbCountries.openAddDialog({ authHeaders }).then((c) => {
          if (!c) return;
          rebuildCountryOpts();
          const code = String(c.code).toUpperCase();
          if (!countrySelect.querySelector('option[value="' + code + '"]')) {
            const op = document.createElement('option');
            op.value = code; op.textContent = c.name;
            countrySelect.insertBefore(op, countrySelect.querySelector('option[value="__add_country__"]'));
          }
          countrySelect.value = code;
          markDirty();
        });
      });

      saveBtn.addEventListener('click', () => {
        const cityName = cityNameInput.value.trim();
        if (!cityName) { setStatus('City name can’t be empty.', 'error'); cityNameInput.focus(); return; }
        const canonical = composeKey();

        // Every structured column comes straight from its own editable field.
        const cc = countrySelect.value ? countrySelect.value.toUpperCase() : null;
        const payload = {
          ignored: ignoredCb.checked,
          city_name: cityName || null,
          state_name: stateInput.value.trim() || null,
          state_code: abbrInput.value.trim().toUpperCase() || null,
          country_code: cc,
          country_name: cc ? (COUNTRY_NAME_BY_CODE[cc] || null) : null
        };

        // Rename? The composed key is what other tables reference — warn. The
        // slug is a stable PK and does not change on rename.
        if (canonical.toLowerCase() !== String(row.city || '').toLowerCase()) {
          const ok = window.confirm(
            'Rename “' + (row.city || '') + '” → “' + canonical + '”?\n\n' +
            'The city name is the KEY that games and gift-shop listings reference by string — those are NOT updated automatically. Anything still pointing at “' + (row.city || '') + '” (a game\'s Start City, a gift\'s shop, a /shop/?city=… link) will stop matching this city until you fix it there too.\n\n' +
            'Rename anyway?'
          );
          if (!ok) return;
          payload.city = canonical;
        }

        saveRow(row, payload, saveBtn, el);
      });
      delBtn.addEventListener('click', () => deleteRow(row, delBtn));

      el.append(idcol, fields, flags, actions);
      return el;
    }

    // PATCH by slug — the stable primary key, unchanged even on rename. The
    // payload never contains slug; it carries `city` + structured geo only when
    // the Save handler detected (and warned about) a rename.
    async function saveRow(row, payload, btn, el) {
      const slug = row.slug;
      if (!slug) { setStatus('This row has no slug to update.', 'error'); return; }
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
      try {
        const res = await fetch(restUrl(TABLE, { slug: 'eq.' + slug }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await readError(res, 'Save failed.'));
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) throw new Error('Nothing was saved — the database refused the change. Check you are signed in as an admin.');
        Object.assign(row, rows[0]);
        if (el) { el.classList.remove('is-dirty'); el.classList.toggle('is-ignored', row.ignored === true); }
        setStatus('Saved ' + (row.city || slug) + '.', 'success');
        render();
      } catch (err) {
        console.error(err);
        setStatus(err && err.message ? err.message : 'Save failed.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function deleteRow(row, btn) {
      const slug = row.slug;
      if (!slug) return;
      if (!window.confirm('Delete "' + (row.city || slug) + '" from the city catalog? This is permanent. To keep it but drop it from gifts & soundtracks, use Venue only instead.')) return;
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Deleting…';
      try {
        const res = await fetch(restUrl(TABLE, { slug: 'eq.' + slug }), { method: 'DELETE', headers: authHeaders({ Prefer: 'return=minimal' }) });
        if (!res.ok) throw new Error(await readError(res, 'Delete failed.'));
        state.rows = state.rows.filter((r) => r.slug !== slug);
        render();
        setStatus('Deleted ' + (row.city || slug) + '.', 'success');
      } catch (err) {
        console.error(err);
        setStatus(err && err.message ? err.message : 'Delete failed.', 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    if (addCityBtn) {
      addCityBtn.addEventListener('click', () => {
        if (!(window.TgbCities && typeof TgbCities.openAddDialog === 'function')) { setStatus('City picker not loaded.', 'error'); return; }
        TgbCities.openAddDialog({ authHeaders: authHeaders }).then((cityRow) => {
          if (!cityRow) return;
          setStatus('Added ' + (cityRow.city || 'city') + '.', 'success');
          loadCities();
        });
      });
    }
    if (searchInput) searchInput.addEventListener('input', render);

    if (window.TgbMcAdminNav && typeof TgbMcAdminNav.init === 'function') {
      TgbMcAdminNav.init({ signOutButton: signOutBtn, auth: adminAuth });
    }

    render();
    adminAuth.init();
  </script>
</body>
</html>
