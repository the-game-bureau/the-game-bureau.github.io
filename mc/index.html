<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LIBRARY | MISSION CONTROL | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
          document.documentElement.classList.add('admin-embedded');
        }
      } catch (error) {}
    }());
  </script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --mist: var(--paper-base);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .topbar-actions > a.btn[href="../library.html"] {
      display: none;
    }

    .admin-nav { display: flex; gap: 4px; }
    .admin-nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav-link:hover { background: var(--line); color: var(--ink); }
    .admin-nav-link--active { background: var(--accent); color: #fff; }

    .brand {
      display: grid;
      gap: 4px;
    }

    .section-head {
      display: grid;
      gap: 4px;
      margin: 0 0 14px;
    }

    .section-head--gears {
      position: relative;
      overflow: hidden;
      gap: 6px;
      margin-bottom: 18px;
      padding: 20px 22px 22px;
      padding-right: clamp(136px, 30vw, 220px);
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .section-head--gears > :not(.section-gear-art):not(.section-head-actions) {
      position: relative;
      z-index: 1;
    }

    .section-head-actions {
      position: absolute;
      top: 50%;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
      transform: translateY(-50%);
    }

    .section-head--gears .copy {
      max-width: 440px;
    }

    .section-gear-art {
      position: absolute;
      top: -4px;
      right: -2px;
      z-index: 0;
      width: 320px;
      height: 188px;
      pointer-events: none;
      opacity: 0.96;
      overflow: visible;
    }

    .section-head--gears .header-gear {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-atmosphere {
      opacity: 0.9;
    }

    .section-head--gears .header-gear--large {
      stroke: rgba(var(--bic-blue-rgb), 0.28);
    }

    .section-head--gears .header-gear--small {
      stroke: rgba(var(--bic-blue-rgb), 0.22);
    }

    .section-head--gears .header-gear-body {
      fill: rgba(var(--bic-blue-rgb), 0.045);
      stroke-width: 3.4;
    }

    .section-head--gears .header-gear-ring {
      fill: rgba(var(--bic-blue-rgb), 0.018);
      stroke-width: 3;
    }

    .section-head--gears .header-gear-inner {
      fill: none;
      stroke-width: 2.4;
      opacity: 0.92;
    }

    .section-head--gears .header-gear-spoke {
      fill: rgba(var(--bic-blue-rgb), 0.1);
      stroke: none;
    }

    .section-head--gears .header-gear-core {
      fill: rgba(var(--bic-blue-rgb), 0.08);
      stroke-width: 2.2;
    }

    .section-head--gears .header-gear-halo {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.14);
      stroke-width: 2;
      stroke-dasharray: 4 8;
    }

    .section-head--gears .header-gear-bore {
      fill: none;
      stroke-width: 2;
    }

    .section-head--gears .header-gear-wire {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.12);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-wire--bold {
      stroke: rgba(var(--bic-blue-rgb), 0.17);
      stroke-width: 1.8;
    }

    .section-head--gears .header-gear-guide {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.1);
      stroke-width: 1.2;
      stroke-dasharray: 2 7;
    }

    .section-head--gears .header-gear-node {
      fill: rgba(var(--bic-blue-rgb), 0.17);
    }

    .section-head--gears .header-gear-speck {
      fill: rgba(var(--bic-blue-rgb), 0.11);
    }

    .section-head--gears .header-gear-crosshair {
      stroke: rgba(var(--bic-blue-rgb), 0.15);
      stroke-width: 1.4;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 4.5rem;
      letter-spacing: 0;
      line-height: 0.92;
      text-shadow: 0 6px 14px rgba(var(--bic-blue-rgb), 0.08);
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar input {
      min-width: min(100%, 260px);
      flex: 1;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
    }

    .toolbar input:focus,
    .auth input:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      line-height: 0;
    }

    .signout-btn svg {
      width: 31px;
      height: 31px;
      display: block;
      flex: 0 0 auto;
    }

    .mb-menu {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mb-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .mb-trigger:hover,
    .mb-trigger:focus-visible,
    .mb-menu.open .mb-trigger {
      background: rgba(255,255,255,1);
      border-color: var(--accent);
      outline: none;
    }

    .mb-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }

    .mb-section {
      padding: 6px 14px 4px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mb-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .mb-item:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
    }

    .mb-item.is-active {
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--accent);
    }

    .mb-sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--bic-blue-rgb), 0.52);
      backdrop-filter: blur(6px);
    }

    .auth-modal.hidden {
      display: none !important;
    }

    .auth {
      position: relative;
      width: min(430px, 100%);
      margin: 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }

    .auth-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .auth-close:hover { background: var(--line); color: var(--ink); }

    .auth h1 {
      margin-bottom: 10px;
      font-size: 2.4rem;
    }

    .auth-form {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .auth-actions {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .auth-actions .btn.primary {
      flex: 1 1 auto;
    }

    .home-icon-btn {
      width: 44px;
      min-width: 44px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      line-height: 0;
    }

    .home-icon-btn svg {
      display: block;
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .auth label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .auth input {
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .status.success {
      color: var(--success);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .admin-section {
      margin-top: 34px;
    }

    .admin-library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .admin-game-card {
      --game-primary: var(--bic-blue);
      --game-secondary: rgba(var(--bic-blue-rgb), 0.72);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 22px var(--paper-shadow);
      cursor: pointer;
      transition: outline 0.1s;
    }

    .admin-game-card.is-selected {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .toolbar .btn:disabled,
    .toolbar a.btn[aria-disabled="true"],
    .section-head-actions .btn:disabled,
    .section-head-actions a.btn[aria-disabled="true"] {
      opacity: 0.38;
      pointer-events: none;
    }

    .toolbar-gap { margin-left: auto; }
    .toolbar-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: center;
    }

    .admin-game-media {
      position: relative;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      background:
        linear-gradient(135deg, var(--game-secondary), var(--game-primary)),
        rgba(var(--bic-blue-rgb), 0.08);
    }

    .admin-game-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(0,0,0,0.16));
      pointer-events: none;
      z-index: 2;
    }

    .admin-game-image {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .admin-game-monogram {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.86);
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .admin-game-media[data-has-image="true"] .admin-game-monogram {
      opacity: 0.2;
    }

    .admin-game-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--game-primary);
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .admin-game-status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      padding: 4px 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .admin-game-status.archived { color: #8a6d1e; border: 1px solid rgba(138, 109, 30, 0.45); }
    .admin-game-status.erased { color: var(--danger); border: 1px solid rgba(160, 63, 45, 0.45); }

    .admin-game-card.is-archived { opacity: 0.78; }
    .admin-game-card.is-erased { opacity: 0.55; }

    .admin-game-body {
      display: grid;
      gap: 5px;
      padding: 8px;
    }

    .admin-game-eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.25;
      text-transform: uppercase;
      word-break: break-word;
    }

    .admin-game-title {
      margin: 0;
      color: var(--game-primary);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .admin-game-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 2px;
    }

    .admin-game-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }

    .admin-game-btn.primary {
      border-color: var(--game-primary);
      background: var(--game-primary);
      color: #fff;
    }

    .empty {
      display: grid;
      place-items: center;
      grid-column: 1 / -1;
      min-height: 260px;
      padding: 24px;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    html.admin-embedded body {
      min-height: 100%;
      background: transparent;
    }

    html.admin-embedded .app {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    html.admin-embedded .topbar,
    html.admin-embedded .section-head--gears,
    html.admin-embedded .home-icon-btn {
      display: none !important;
    }

    @media (max-width: 700px) {
      .app {
        width: min(100vw - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions .btn {
        flex: 1;
      }

      .topbar-actions .mb-menu {
        flex: 1;
      }

      .topbar-actions .mb-trigger {
        width: 100%;
      }

      .topbar-actions .signout-btn {
        flex: 0 0 42px;
      }

      h1 {
        font-size: 3rem;
      }

      h2 {
        font-size: 2rem;
      }

      .section-head--gears {
        padding: 18px 18px 112px;
      }

      .section-head--gears .copy {
        max-width: none;
      }

      .section-gear-art {
        top: auto;
        right: -22px;
        bottom: -26px;
        width: 250px;
        height: 147px;
      }

      .toolbar {
        display: grid;
      }

      .toolbar input,
      .toolbar .btn {
        width: 100%;
      }

      .admin-library-grid {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      }
    }

    .lib-context-menu {
      position: fixed;
      z-index: 200;
      min-width: 160px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }
    .lib-context-menu[hidden] { display: none; }
    .lib-context-menu-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .lib-context-menu-item:hover { background: rgba(var(--bic-blue-rgb), 0.07); }
    .lib-context-menu-item--danger { color: var(--danger); }
    .lib-context-menu-item--danger:hover { background: rgba(160, 63, 45, 0.08); }
  </style>
</head>
<body>
  <div class="auth-modal" id="authModal">
    <section class="auth" id="authPanel">
      <button class="auth-close" id="authCloseBtn" type="button" aria-label="Close">&#x2715;</button>
      <p class="kicker">The Game Bureau</p>
      <h1>Mission Control</h1>
      <p class="copy">Sign in to Mission Control with an admin account.</p>
      <form class="auth-form" id="authForm">
        <label>
          Email
          <input id="emailInput" type="email" autocomplete="username" required>
        </label>
        <label>
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required>
        </label>
        <div class="auth-actions">
          <button class="btn primary" id="signInBtn" type="submit">Sign In</button>
          <a class="btn home-icon-btn" href="../" aria-label="Home" title="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 13 8 8.5 8 6h2.5v.5L12 5 21 13" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const AUTH_STORAGE_KEY = 'tgb-photo-review-auth-session';
    const GAMES_SCHEMA = {
      tagline: true,
      featured: true
    };

    const authModal = document.getElementById('authModal');
    const authCloseBtn = document.getElementById('authCloseBtn');
    const authPanel = document.getElementById('authPanel');
    const reviewPanel = document.getElementById('reviewPanel');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const authStatus = document.getElementById('authStatus');
    const libraryStatus = document.getElementById('libraryStatus');
    const gameGrid = document.getElementById('gameGrid');
    const libNewBtn = document.getElementById('libNewBtn');
    const libEditBtn = document.getElementById('libEditBtn');
    const libDupBtn = document.getElementById('libDupBtn');
    const libArchBtn = document.getElementById('libArchBtn');
    const libEraseBtn = document.getElementById('libEraseBtn');
    const libPreviewBtn = document.getElementById('libPreviewBtn');
    const libPublicBtn = document.getElementById('libPublicBtn');

    let currentSession = null;
    const selectedGames = new Map();
    let allGamesData = [];
    let lastSelectedId = null;

    function authUrl(path) {
      return new URL('/auth/v1/' + String(path || '').replace(/^\/+/, ''), SUPABASE_CONFIG.url + '/').toString();
    }

    function restUrl(table, params = {}) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') {
          url.searchParams.set(key, String(value));
        }
      });
      return url.toString();
    }

    function buildBuilderRoute(params = {}) {
      const builderParams = new URLSearchParams();
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') {
          builderParams.set(key, String(value));
        }
      });
      const search = builderParams.toString();
      return 'builder.html' + (search ? '?' + search : '');
    }

    function setStatus(el, message, state = '') {
      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('error', state === 'error');
      el.classList.toggle('success', state === 'success');
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          const message = payload.message || payload.msg || payload.error_description || payload.error || text;
          if (/public\.admin_users|admin_users/i.test(message) && /schema cache|could not find/i.test(message)) {
            return 'Admin access is not set up yet. Run docs/supabase/photo-submissions.sql in Supabase, then add your email to public.admin_users.';
          }
          return message;
        } catch (error) {
          return text;
        }
      } catch (error) {
        return fallback;
      }
    }

    function readStoredSession() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
      } catch (error) {
        return null;
      }
    }

    function storeSession(session) {
      try {
        if (session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
        else localStorage.removeItem(AUTH_STORAGE_KEY);
      } catch (error) {
      }
    }

    async function signIn(email, password) {
      const response = await fetch(authUrl('token?grant_type=password'), {
        method: 'POST',
        headers: {
          apikey: SUPABASE_CONFIG.publishableKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      if (!response.ok) {
        throw new Error(await readError(response, 'Sign in failed.'));
      }

      return response.json();
    }

    async function refreshSession(session) {
      if (!session || !session.refresh_token) return null;
      const response = await fetch(authUrl('token?grant_type=refresh_token'), {
        method: 'POST',
        headers: {
          apikey: SUPABASE_CONFIG.publishableKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });

      if (!response.ok) return null;
      return response.json();
    }

    async function getUsableSession() {
      const stored = readStoredSession();
      if (!stored || !stored.access_token) return null;
      const expiresAt = Number(stored.expires_at || 0) * 1000;
      if (expiresAt && expiresAt > Date.now() + 60000) return stored;
      const refreshed = await refreshSession(stored);
      if (refreshed && refreshed.access_token) {
        storeSession(refreshed);
        return refreshed;
      }
      storeSession(null);
      return null;
    }

    function authHeaders(extra = {}) {
      return {
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + currentSession.access_token,
        ...extra
      };
    }

    async function verifyAdmin() {
      const email = currentSession && currentSession.user ? currentSession.user.email : '';
      const response = await fetch(restUrl('admin_users', {
        select: 'email',
        email: 'eq.' + email,
        limit: '1'
      }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(await readError(response, 'Could not verify admin access.'));
      }

      const rows = await response.json();
      return Array.isArray(rows) && rows.length > 0;
    }

    function getMissingGamesColumnName(errorMessage = '') {
      const message = String(errorMessage || '');
      const match = message.match(/column\s+games\.([a-z_]+)\s+does\s+not\s+exist/i);
      if (match) return String(match[1] || '').trim().toLowerCase();
      const schemaMatch = message.match(/could not find the ['"]?([a-z_]+)['"]? column of ['"]?games/i);
      return schemaMatch ? String(schemaMatch[1] || '').trim().toLowerCase() : '';
    }

    function buildGameSelect() {
      const columns = [
        'id',
        'name',
        'primary_color',
        'secondary_color',
        'city',
        'archived',
        'erased',
        'tags',
        'body',
        'logo_url',
        'guide_image_url'
      ];
      if (GAMES_SCHEMA.featured) columns.splice(5, 0, 'featured');
      if (GAMES_SCHEMA.tagline) columns.splice(2, 0, 'tagline');
      return columns.join(',');
    }

    async function fetchGames(selectOverride = '') {
      const response = await fetch(restUrl('games', {
        select: selectOverride || buildGameSelect(),
        order: 'name.asc'
      }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });

      if (!response.ok) {
        const message = await readError(response, 'Could not load games.');
        const missingColumn = getMissingGamesColumnName(message);
        if (missingColumn === 'tagline' && GAMES_SCHEMA.tagline) {
          GAMES_SCHEMA.tagline = false;
          return fetchGames(buildGameSelect());
        }
        if (missingColumn === 'featured' && GAMES_SCHEMA.featured) {
          GAMES_SCHEMA.featured = false;
          return fetchGames(buildGameSelect());
        }
        throw new Error(message);
      }

      return response.json();
    }

    function isFilledArchiveValue(value) {
      if (typeof value === 'boolean') return value;
      if (typeof value === 'string') {
        const trimmed = value.trim().toLowerCase();
        return !!trimmed && trimmed !== 'false' && trimmed !== '0' && trimmed !== 'no';
      }
      return !!value;
    }

    function isLiveGame(game) {
      return !isFilledArchiveValue(game && game.archived) && !isFilledArchiveValue(game && game.erased);
    }

    function getGameState(game) {
      if (isFilledArchiveValue(game && game.erased)) return 'erased';
      if (isFilledArchiveValue(game && game.archived)) return 'archived';
      return 'live';
    }

    function getGamePalette(game) {
      return {
        primary: String(game && (game.primary_color || game.primaryColor) || '').trim() || '#2d4880',
        secondary: String(game && (game.secondary_color || game.secondaryColor) || '').trim() || 'rgba(45,72,128,0.72)'
      };
    }

    function resolveAdminAssetUrl(value) {
      const raw = String(value || '').trim().replace(/\\/g, '/')
        .replace('https://the-game-bureau.github.io/the-game-bureau/', 'https://thegamebureau.com/')
        .replace('https://the-game-bureau.github.io/', 'https://thegamebureau.com/');
      if (!raw) return '';
      if (raw.startsWith('data:') || raw.startsWith('blob:')) return raw;
      try {
        const base = /^assets\//i.test(raw) ? new URL('../', window.location.href).toString() : window.location.href;
        const resolved = new URL(raw, base);
        const protocol = String(resolved.protocol || '').toLowerCase();
        return protocol === 'http:' || protocol === 'https:' || protocol === 'file:' ? resolved.toString() : '';
      } catch (error) {
        return '';
      }
    }

    function getGameImageUrl(game) {
      return resolveAdminAssetUrl(game && (
        game.logo_url ||
        game.logoUrl ||
        game.logo ||
        game.guide_image_url ||
        game.guideImageUrl
      ) || '');
    }

    function getGameMonogram(game) {
      const title = String(game && game.name || 'Game').trim();
      const words = title.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return title.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'TG';
    }

    function getGameCaption(game) {
      const tagline = String(game && game.tagline || '').replace(/\s+/g, ' ').trim();
      const body = String(game && game.body || '').replace(/\s+/g, ' ').trim();
      const caption = tagline || body || 'A live local experience by The Game Bureau.';
      return caption.length > 100 ? caption.slice(0, 97).trimEnd() + '...' : caption;
    }

    function isGameFeatured(game) {
      const featuredField = game && game.featured;
      if (typeof featuredField === 'boolean') return featuredField;
      if (typeof featuredField === 'string' && featuredField.trim()) return true;
      const tags = Array.isArray(game && game.tags) ? game.tags : [];
      return tags.some((tag) => String(tag || '').trim().toLowerCase() === 'featured');
    }

    function sortGamesForAdminLibrary(games) {
      const stateOrder = { live: 0, archived: 1, erased: 2 };
      return [...games].sort((left, right) => {
        const stateDelta = stateOrder[getGameState(left)] - stateOrder[getGameState(right)];
        if (stateDelta !== 0) return stateDelta;
        const featuredDelta = Number(isGameFeatured(right)) - Number(isGameFeatured(left));
        if (featuredDelta !== 0) return featuredDelta;
        return String(left && left.name || 'Untitled Game').localeCompare(
          String(right && right.name || 'Untitled Game'),
          undefined,
          { sensitivity: 'base' }
        );
      });
    }

    function renderLibraryEmpty(message) {
      gameGrid.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gameGrid.appendChild(empty);
    }

    function createAdminGameCard(game) {
      const gameId = String(game && game.id || '').trim();
      const palette = getGamePalette(game);
      const state = getGameState(game);
      const card = document.createElement('article');
      card.className = 'admin-game-card';
      if (state !== 'live') card.classList.add('is-' + state);
      card.style.setProperty('--game-primary', palette.primary);
      card.style.setProperty('--game-secondary', palette.secondary);

      const media = document.createElement('div');
      media.className = 'admin-game-media';

      const monogram = document.createElement('div');
      monogram.className = 'admin-game-monogram';
      monogram.textContent = getGameMonogram(game);
      media.appendChild(monogram);

      const imageUrl = getGameImageUrl(game);
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const image = document.createElement('img');
        image.className = 'admin-game-image';
        image.src = imageUrl;
        image.alt = '';
        image.loading = 'lazy';
        image.decoding = 'async';
        image.addEventListener('error', () => {
          image.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(image);
      }

      if (isGameFeatured(game)) {
        const badge = document.createElement('div');
        badge.className = 'admin-game-badge';
        badge.textContent = 'Featured';
        media.appendChild(badge);
      }

      if (state !== 'live') {
        const statusBadge = document.createElement('div');
        statusBadge.className = 'admin-game-status ' + state;
        statusBadge.textContent = state;
        media.appendChild(statusBadge);
      }

      const body = document.createElement('div');
      body.className = 'admin-game-body';

      const eyebrow = document.createElement('p');
      eyebrow.className = 'admin-game-eyebrow';
      eyebrow.textContent = String(game && game.city || '').trim() || gameId || 'Game';

      const title = document.createElement('h3');
      title.className = 'admin-game-title';
      title.textContent = String(game && game.name || '').trim() || 'Untitled Game';

      body.append(eyebrow, title);
      card.append(media, body);
      card.dataset.gameId = gameId;
      card.dataset.gameState = state;
      card.addEventListener('mousedown', (event) => {
        if (event.shiftKey) event.preventDefault();
      });
      card.addEventListener('click', (event) => selectGame(game, event));
      return card;
    }

    function renderAdminLibrary(games) {
      allGamesData = Array.isArray(games) ? games : [];
      const allGames = sortGamesForAdminLibrary(allGamesData);

      const gamesById = new Map(allGames.map((g) => [String(g.id), g]));
      for (const id of [...selectedGames.keys()]) {
        const fresh = gamesById.get(String(id));
        if (fresh) selectedGames.set(id, fresh);
        else selectedGames.delete(id);
      }
      updateToolbar();
      gameGrid.innerHTML = '';

      if (!allGames.length) {
        renderLibraryEmpty('No games found.');
        setStatus(libraryStatus, 'No games found.');
        return;
      }

      const counts = allGames.reduce((acc, game) => {
        acc[getGameState(game)] = (acc[getGameState(game)] || 0) + 1;
        return acc;
      }, {});

      allGames.forEach((game) => {
        const card = createAdminGameCard(game);
        if (selectedGames.has(String(game.id))) card.classList.add('is-selected');
        gameGrid.appendChild(card);
      });

      const parts = [];
      if (counts.live) parts.push(counts.live + ' live');
      if (counts.archived) parts.push(counts.archived + ' archived');
      if (counts.erased) parts.push(counts.erased + ' erased');
      setStatus(libraryStatus, 'Showing ' + allGames.length + ' game' + (allGames.length === 1 ? '' : 's') + ' (' + parts.join(', ') + ').', 'success');
    }

    async function loadAdminLibrary() {
      setStatus(libraryStatus, 'Loading library...');
      renderLibraryEmpty('Loading games...');

      try {
        const games = await fetchGames();
        renderAdminLibrary(games);
      } catch (error) {
        console.error(error);
        renderLibraryEmpty('Could not load games.');
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    function setLinkEnabled(el, href) {
      if (href) {
        el.href = href;
        el.removeAttribute('aria-disabled');
        el.removeAttribute('tabindex');
      } else {
        el.removeAttribute('href');
        el.setAttribute('aria-disabled', 'true');
        el.setAttribute('tabindex', '-1');
      }
    }

    function updateToolbar() {
      const count = selectedGames.size;
      const has = count > 0;
      const single = count === 1;
      const oneGame = single ? [...selectedGames.values()][0] : null;
      const allArchived = has && [...selectedGames.values()].every((g) => isFilledArchiveValue(g.archived));
      libDupBtn.disabled = !has;
      libArchBtn.disabled = !has;
      libEraseBtn.disabled = !has;
      libArchBtn.textContent = allArchived ? 'Unarchive' : 'Archive';
      setLinkEnabled(libEditBtn, single ? buildBuilderRoute({ id: oneGame.id }) : null);
      setLinkEnabled(libPreviewBtn, single ? '../game/run/index.html?id=' + encodeURIComponent(oneGame.id) : null);
      setLinkEnabled(libPublicBtn, '../library.html');
    }

    libNewBtn.href = buildBuilderRoute({ new: '1' });

    function selectGame(game, event) {
      const id = String(game.id);
      const shift = event && event.shiftKey;
      const cards = [...gameGrid.querySelectorAll('.admin-game-card')];
      const ids = cards.map((c) => c.dataset.gameId);

      if (shift && lastSelectedId && lastSelectedId !== id && ids.includes(lastSelectedId) && ids.includes(id)) {
        const a = ids.indexOf(lastSelectedId);
        const b = ids.indexOf(id);
        const [lo, hi] = a < b ? [a, b] : [b, a];
        for (let i = lo; i <= hi; i++) {
          const rangeId = ids[i];
          const rangeGame = allGamesData.find((g) => String(g.id) === rangeId);
          if (rangeGame) selectedGames.set(rangeId, rangeGame);
        }
      } else {
        if (selectedGames.has(id)) selectedGames.delete(id);
        else selectedGames.set(id, game);
        lastSelectedId = id;
      }

      cards.forEach((c) => {
        c.classList.toggle('is-selected', selectedGames.has(c.dataset.gameId));
      });
      updateToolbar();

      if (shift) window.getSelection && window.getSelection().removeAllRanges();
    }

    async function patchGame(id, payload) {
      const response = await fetch(restUrl('games', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Update failed.'));
    }

    function generateGameId() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    async function duplicateGame(game) {
      const response = await fetch(restUrl('games', { id: 'eq.' + game.id }), {
        headers: authHeaders({ Accept: 'application/json' })
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not fetch game.'));
      const rows = await response.json();
      const source = rows[0];
      if (!source) throw new Error('Game not found.');
      const copy = Object.assign({}, source);
      copy.id = generateGameId();
      delete copy.created_at;
      delete copy.updated_at;
      copy.name = (source.name || 'Game') + ' Copy';
      copy.archived = 'YES';
      copy.erased = null;
      const ins = await fetch(restUrl('games'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(copy)
      });
      if (!ins.ok) throw new Error(await readError(ins, 'Duplicate failed.'));
    }

    libDupBtn.addEventListener('click', async () => {
      if (!selectedGames.size) return;
      const games = [...selectedGames.values()];
      libDupBtn.disabled = true;
      setStatus(libraryStatus, 'Duplicating…');
      try {
        for (const game of games) await duplicateGame(game);
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
        libDupBtn.disabled = false;
      }
    });

    libArchBtn.addEventListener('click', async () => {
      if (!selectedGames.size) return;
      const games = [...selectedGames.values()];
      const allArchived = games.every((g) => isFilledArchiveValue(g.archived));
      libArchBtn.disabled = true;
      setStatus(libraryStatus, allArchived ? 'Unarchiving…' : 'Archiving…');
      try {
        for (const game of games) await patchGame(game.id, { archived: allArchived ? null : 'YES' });
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
        libArchBtn.disabled = false;
      }
    });

    async function deleteGame(id) {
      const response = await fetch(restUrl('games', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Delete failed.'));
    }

    libEraseBtn.addEventListener('click', async () => {
      if (!selectedGames.size) return;
      const games = [...selectedGames.values()];
      const n = games.length;
      const allErased = games.every((g) => isFilledArchiveValue(g.erased));
      const label = n === 1 ? (games[0].name || games[0].id) : n + ' games';
      const msg = allErased
        ? 'Permanently delete ' + label + ' from the database? This cannot be undone.'
        : 'Erase ' + label + '? They will be hidden but can be deleted later.';
      if (!window.confirm(msg)) return;
      libEraseBtn.disabled = true;
      setStatus(libraryStatus, allErased ? 'Deleting…' : 'Erasing…');
      try {
        for (const game of games) {
          if (isFilledArchiveValue(game.erased)) await deleteGame(game.id);
          else await patchGame(game.id, { erased: 'YES' });
        }
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
        libEraseBtn.disabled = false;
      }
    });

    function showAuth() {
      authModal.classList.remove('hidden');
      setStatus(authStatus, 'Sign in with an admin account.');
    }

    async function showReview(session) {
      currentSession = session;
      authModal.classList.add('hidden');
      await loadAdminLibrary();
    }

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = String(emailInput.value || '').trim();
      const password = String(passwordInput.value || '');
      if (!email || !password) return;

      signInBtn.disabled = true;
      setStatus(authStatus, 'Signing in...');
      try {
        const session = await signIn(email, password);
        currentSession = session;
        storeSession(session);
        const isAdmin = await verifyAdmin();
        if (!isAdmin) {
          storeSession(null);
          currentSession = null;
          throw new Error('This account is signed in, but it is not on the admin list.');
        }
        passwordInput.value = '';
        setStatus(authStatus, '');
        await showReview(session);
      } catch (error) {
        setStatus(authStatus, error instanceof Error ? error.message : String(error), 'error');
      } finally {
        signInBtn.disabled = false;
      }
    });

    authCloseBtn.addEventListener('click', () => { authModal.classList.add('hidden'); });

    signOutBtn.addEventListener('click', () => {
      currentSession = null;
      storeSession(null);
      gameGrid.innerHTML = '';
      showAuth();
    });

    document.querySelectorAll('[data-admin-logoff]').forEach((button) => {
      button.addEventListener('click', () => {
        signOutBtn.click();
      });
    });

    (async function init() {
      const session = await getUsableSession();
      if (!session) {
        showAuth();
        return;
      }

      currentSession = session;
      try {
        const isAdmin = await verifyAdmin();
        if (!isAdmin) {
          storeSession(null);
          currentSession = null;
          showAuth();
          setStatus(authStatus, 'This account is signed in, but it is not on the admin list.', 'error');
          return;
        }
        await showReview(session);
      } catch (error) {
        console.error(error);
        storeSession(null);
        currentSession = null;
        showAuth();
        setStatus(authStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    const libContextMenu = document.getElementById('libContextMenu');
    const ctxEditBtn = document.getElementById('ctxEditBtn');
    const ctxDupBtn = document.getElementById('ctxDupBtn');
    const ctxArchBtn = document.getElementById('ctxArchBtn');
    const ctxEraseBtn = document.getElementById('ctxEraseBtn');

    function openLibContextMenu(x, y) {
      const games = [...selectedGames.values()];
      const single = games.length === 1;
      const allArchived = games.every((g) => isFilledArchiveValue(g.archived));
      const allErased = games.every((g) => isFilledArchiveValue(g.erased));
      ctxEditBtn.disabled = !single;
      ctxArchBtn.textContent = allArchived ? 'Unarchive' : 'Archive';
      ctxEraseBtn.textContent = allErased ? 'Delete' : 'Erase';
      libContextMenu.removeAttribute('hidden');
      const menuW = libContextMenu.offsetWidth;
      const menuH = libContextMenu.offsetHeight;
      libContextMenu.style.left = Math.min(x, window.innerWidth - menuW - 8) + 'px';
      libContextMenu.style.top = Math.min(y, window.innerHeight - menuH - 8) + 'px';
    }

    function closeLibContextMenu() {
      libContextMenu.setAttribute('hidden', '');
    }

    gameGrid.addEventListener('contextmenu', (event) => {
      const card = event.target.closest('.admin-game-card');
      if (!card) return;
      event.preventDefault();
      const game = allGamesData.find((g) => String(g.id) === card.dataset.gameId);
      if (!game) return;
      if (!selectedGames.has(game.id)) selectGame(game);
      openLibContextMenu(event.clientX, event.clientY);
    });

    ctxEditBtn.addEventListener('click', () => {
      closeLibContextMenu();
      if (selectedGames.size !== 1) return;
      const game = [...selectedGames.values()][0];
      window.location.href = buildBuilderRoute({ id: game.id });
    });

    ctxDupBtn.addEventListener('click', async () => {
      const games = [...selectedGames.values()];
      closeLibContextMenu();
      if (!games.length) return;
      setStatus(libraryStatus, 'Duplicating…');
      try {
        for (const game of games) await duplicateGame(game);
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    });

    ctxArchBtn.addEventListener('click', async () => {
      const games = [...selectedGames.values()];
      closeLibContextMenu();
      if (!games.length) return;
      const allArchived = games.every((g) => isFilledArchiveValue(g.archived));
      setStatus(libraryStatus, allArchived ? 'Unarchiving…' : 'Archiving…');
      try {
        for (const game of games) await patchGame(game.id, { archived: allArchived ? null : 'YES' });
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    });

    ctxEraseBtn.addEventListener('click', async () => {
      const games = [...selectedGames.values()];
      closeLibContextMenu();
      if (!games.length) return;
      const n = games.length;
      const allErased = games.every((g) => isFilledArchiveValue(g.erased));
      const label = n === 1 ? (games[0].name || games[0].id) : n + ' games';
      const msg = allErased
        ? 'Permanently delete ' + label + ' from the database? This cannot be undone.'
        : 'Erase ' + label + '? They will be hidden but can be deleted later.';
      if (!window.confirm(msg)) return;
      setStatus(libraryStatus, allErased ? 'Deleting…' : 'Erasing…');
      try {
        for (const game of games) {
          if (isFilledArchiveValue(game.erased)) await deleteGame(game.id);
          else await patchGame(game.id, { erased: 'YES' });
        }
        await loadAdminLibrary();
      } catch (error) {
        setStatus(libraryStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    });

    document.addEventListener('click', (event) => {
      if (!libContextMenu.hidden && !libContextMenu.contains(event.target)) closeLibContextMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLibContextMenu();
    });
    document.addEventListener('scroll', closeLibContextMenu, true);

    })();
  </script>
  <script>
    (function () {
      document.querySelectorAll('[data-admin-menu]').forEach((menu) => {
        const trigger = menu.querySelector('.mb-trigger');
        const panel = menu.querySelector('.mb-panel');
        if (!trigger || !panel) return;

        function closeMenu() {
          menu.classList.remove('open');
          panel.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
        }

        trigger.addEventListener('click', (event) => {
          event.stopPropagation();
          const isOpen = !panel.hidden;
          document.querySelectorAll('[data-admin-menu]').forEach((otherMenu) => {
            otherMenu.classList.remove('open');
            const otherTrigger = otherMenu.querySelector('.mb-trigger');
            const otherPanel = otherMenu.querySelector('.mb-panel');
            if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            if (otherPanel) otherPanel.hidden = true;
          });
          if (isOpen) return;
          menu.classList.add('open');
          panel.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
        });

        panel.addEventListener('click', (event) => {
          event.stopPropagation();
          if (event.target.closest('.mb-item')) closeMenu();
        });

        document.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeMenu();
        });
      });
    }());
  </script>
</body>
