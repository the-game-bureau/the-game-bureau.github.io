<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MISSION CONTROL | THE GAME BUREAU</title>
  <!-- The mast, not the old shared tgb.ico: this is the one page you keep on a
       home screen, and it should be identifiable at 16px from its own glyph.
       Drawn from the same Lucide radio-tower the headline and the nav's MISSION
       CONTROL button carry, by mc/_dev/scripts/make-mission-control-icons.py. -->
  <link rel="icon" href="/mc/assets/brand/mission-control.ico" sizes="any">
  <!-- 180 is the size iOS asks for, and the PNG is deliberately opaque: a
       transparent apple-touch-icon is composited onto BLACK before the squircle
       mask, so it would arrive as a black tile. -->
  <link rel="apple-touch-icon" href="/mc/assets/brand/mission-control-180.png">
  <link rel="manifest" href="/mc/manifest.webmanifest">
  <meta name="theme-color" content="#2d4880">
  <!-- What the icon is captioned on the home screen. Without it iOS uses the
       <title>, which here is the full "MISSION CONTROL | THE GAME BUREAU" and
       gets truncated to something unreadable. -->
  <meta name="apple-mobile-web-app-title" content="Mission Control">
  <meta name="application-name" content="Mission Control">
  <!-- Standalone: launched from the home screen this runs without Safari's
       chrome. That is the point of installing it, but it also means no browser
       back button, which is why the nav bar below is the only way between rooms
       and has to work at 360px. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --cut-panel-bg: #eef0f4;
      --cut-panel-line: var(--line);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button { font: inherit; }

    .mc-hub-head {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
    }

    /* .mc-chores > legend belongs here too. It was only in the sizing rule
       below, so it inherited the body font in sentence case while every sibling
       legend rendered mono and uppercase -- the odd one out on the page. */
    .mc-hub-group > legend,
    .mc-chores > legend,
    .mc-hub-card-group {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* The floor was 2.6rem, which put "Mission Control" plus the mast at about
       375px of type on a 360px phone -- it wrapped mid-word behind the aerial.
       2.05rem fits it on one line at 360 and the vw term takes over by ~390. */
    .mc-hub-head h1 {
      margin: 0;
      font-size: clamp(2.05rem, 9.5vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: 0;
      overflow-wrap: break-word;
    }

    /* The broadcast mast, same Lucide radio-tower the nav's MISSION CONTROL
       button carries. Sized in em so it tracks the clamped headline instead of
       needing its own breakpoints, and left inline rather than made a flex item:
       at the small end of the clamp the two words can wrap, and a flex icon
       would then centre itself against a two-line block instead of sitting in
       front of "Mission". An inline replaced element sits on the baseline, which
       is where a glyph belongs.

       The stroke is scaled DOWN as the type scales up: at 5.8rem a 2px stroke on
       a 24-box would render heavier than the letterforms beside it. */
    .mc-hub-mast {
      width: 0.76em;
      height: 0.76em;
      margin-right: 0.2em;
      vertical-align: -0.02em;
      color: var(--bic-blue, #2d4880);
      overflow: visible;
    }

    .mc-hub-intro {
      max-width: 720px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .mc-hub-directory {
      display: grid;
      gap: 22px;
    }

    /* Tight shadow, the socials panels' 0 1px 4px rather than the wide soft one
       the shared .prompt-panel carries: that cushion is right for a modal
       floating over the page, and under a grid of cards it only blurs the
       panel's own edge. */
    .mc-hub-group {
      min-inline-size: 0;
      /* Breathing room for the #anchor jump the nav's GAMES button makes —
         without it the section lands flush against the top of the viewport and
         its folder-tab legend is half cut off. */
      scroll-margin-top: 18px;
      margin: 0;
      padding: 6px 14px 13px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    /* The section labels wear the socials command bar's folder tab, so the two
       pages cut their panels the same way. The border runs into the label and
       back out again, and the cut-out reads as a tag clipped onto the frame
       rather than a gap in it.

       The tab is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box. The word has to sit
       centred on the horizontal line, which is where the browser puts a legend
       by default. But the tab's sides must stop AT that line rather than
       carrying on into the panel, and a bordered box whose bottom edge is the
       line cannot also have its text centred on the line -- the text centre is
       always the better part of half a box above the bottom edge.

       So the box stays put and the outline is drawn only over the half above
       the line -- `inset: 0 0 50%`, since the legend's midpoint IS the line.
       The word's lower half hangs into the panel, invisibly, because the tab
       fill and the panel are the same colour with no bottom edge between them.

       isolation: isolate is load-bearing. The arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own that -1 would
       drop it behind the fieldset's own background and it would vanish. */
    .mc-hub-group > legend,
    .mc-chores > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ink);
    }

    .mc-hub-group > legend::before,
    .mc-chores > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;              /* the legend's midpoint is the border line */
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome
         instead of a tab. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .mc-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .mc-hub-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 220px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.93);
      color: inherit;
      text-decoration: none;
      transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
    }

    .mc-hub-card:hover,
    .mc-hub-card:focus-visible {
      border-color: var(--bic-blue);
      box-shadow: 0 8px 18px rgba(var(--bic-blue-rgb), 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .mc-hub-card-group {
      font-size: 0.63rem;
      color: var(--muted);
    }

    .mc-hub-card h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    /* :not(.room-blurb) because the three Ancillary Things blurbs are the ROOMS'
       own sentences and wear the room's own container: `.room-blurb` in
       admin-shell.css, the same rule the header under each room's title uses.
       Without the :not() the two fought and the card won some properties and
       lost others, which is neither the card's look nor the room's. The
       directory cards below still use this rule. */
    .mc-hub-card p:not(.room-blurb) {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .mc-hub-card-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--bic-blue);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mc-hub-card-button::after {
      content: "\2192";
      font-size: 1rem;
    }

    /* Combined card: one panel that lists its links. Used by Games,
       Game Elements, and External Tools. */
    .mc-hub-card--combined {
      grid-template-rows: auto 1fr;
      min-height: 0;
    }

    .mc-hub-card--combined:hover,
    .mc-hub-card--combined:focus-within {
      transform: none;
      border-color: var(--line);
      box-shadow: none;
    }

    /* Flows into columns rather than one tall stack. A combined card is the only
       thing in its section grid, so it spans the full width — ten Games tools in
       a single column would leave the right two-thirds of the panel empty and
       push everything below it off the screen. */
    .mc-hub-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .mc-hub-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
    }

    .mc-hub-link::after {
      content: "\2192";
      color: var(--muted);
      font-size: 1rem;
    }

    .mc-hub-link.is-external::after {
      content: "\2197";
    }

    .mc-hub-link:hover,
    .mc-hub-link:focus-visible {
      border-color: var(--bic-blue);
      background: rgba(var(--bic-blue-rgb), 0.06);
      outline: none;
      transform: translateY(-1px);
    }

    /* DAILY CHORES — the three admins worked through every day, pulled out of
       the directory below so they are one click from landing here. Same
       labelled-border idiom as the gift shop's .btn-fieldset: a real <fieldset>
       keeping its default display so the <legend> natively cuts the top border,
       with an inner wrapper doing the horizontal layout. */
    .mc-chores {
      min-inline-size: 0;
      margin: 0 0 22px;
      padding: 6px 14px 13px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    /* Same grid as the directory below, so a chore card is the same object as
       every other card on the page. */
    .mc-chores-inner {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    /* A chore card is a .mc-hub-card minus the group eyebrow: three rows
       (title / blurb / button) instead of four. The eyebrow would only repeat
       DAILY CHORES, which the border already says.

       .mc-hub-card--tight is the same shape for a GENERATED card, so a menu
       group that opts out of `combined` renders cards that match the chores
       above them rather than 220px-tall boxes with a hole in the middle. */
    .mc-chore,
    .mc-hub-card--tight { grid-template-rows: auto 1fr auto; min-height: 0; }

    @media (max-width: 720px) {
      .mc-hub-grid,
      .mc-chores-inner,
      .mc-hub-links { grid-template-columns: 1fr; }

      /* min-height was 190px, set when these sat two-up and needed to match
         each other. Stacked one per row there is nothing left to match, and
         eleven cards padded to 190px made the page four screens of whitespace.
         The content sizes them now. */
      .mc-hub-card {
        min-height: 0;
        gap: 8px;
        padding: 15px;
      }
      .mc-hub-card h2 { font-size: 1.18rem; }
      .mc-hub-card p:not(.room-blurb) { font-size: 0.86rem; line-height: 1.5; }

      .mc-hub-directory { gap: 16px; }
      .mc-chores { margin-bottom: 16px; }
      .mc-hub-group,
      .mc-chores { padding: 6px 10px 11px; }

      .mc-hub-intro { font-size: 0.94rem; line-height: 1.55; }
      .mc-hub-head { gap: 6px; }

      /* Both already clear 42px, so they are legal targets; the extra height is
         for a thumb reaching across a phone rather than a cursor. */
      .mc-hub-card-button,
      .mc-hub-link { min-height: 46px; }
      .mc-hub-link { font-size: 0.88rem; }
    }

    /* Landscape on a notched phone puts the display cutout over the left gutter.
       The shell's own gutter is symmetric and cannot know about it. */
    @supports (padding: max(0px)) {
      @media (max-width: 900px) and (orientation: landscape) {
        body:not(.builder-page--editor) .app {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    }
  </style>
  <link rel="stylesheet" href="js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <header class="mc-hub-head">
      <h1><svg class="mc-hub-mast" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/></svg>Mission Control</h1>
      <p class="mc-hub-intro">Build games, manage the website, batch-edit content, and open the reference tools used to keep everything moving.</p>
    </header>

    <!-- ACCESS REQUESTS. Hidden until there is at least one pending, so the hub
         is not carrying an empty box on the 364 days a year nobody is asking to
         join. It sits ABOVE Ancillary Things because somebody waiting on a decision
         is waiting on a person, and a chore is not. -->
    <fieldset class="mc-chores mc-access" id="mcAccessPanel" hidden>
      <legend>Access Requests</legend>
      <div class="mc-access-inner" id="mcAccessList"></div>
      <p class="mc-access-note" id="mcAccessNote"></p>
    </fieldset>

    <fieldset class="mc-chores">
      <!-- ANCILLARY THINGS, renamed from DAILY CHORES on 2026-08-20. The old
           name described the CADENCE and said nothing about what these are;
           the new one says what they are, which the big-picture section of
           CLAUDE.md now names outright: soundtracks, gifts and social posts
           hang off the product rather than being it.
           THE CLASS NAMES DO NOT MOVE. `.mc-chores` and `.mc-chore` are
           identifiers, the same bargain the Tape Room made through four
           renames of its verbs without the column following. -->
      <legend>Ancillary Things</legend>
      <div class="mc-chores-inner">
        <a class="mc-hub-card mc-chore" href="/mc/gifts/">
          <h2>GIFT SHOP</h2>
          <p class="room-blurb" data-room-blurb="stock-room"></p>
          <span class="mc-hub-card-button">GO TO STOCK ROOM</span>
        </a>
        <a class="mc-hub-card mc-chore" href="/mc/soundtracks/">
          <h2>TAPE ROOM</h2>
          <p class="room-blurb" data-room-blurb="tape-room"></p>
          <span class="mc-hub-card-button">GO TO TAPE ROOM</span>
        </a>
        <a class="mc-hub-card mc-chore" href="/mc/socializer.html">
          <h2>SOCIALIZER</h2>
          <p class="room-blurb" data-room-blurb="socializer"></p>
          <span class="mc-hub-card-button">GO TO SOCIALIZER</span>
        </a>
      </div>
    </fieldset>

    <div class="mc-hub-directory" id="mcHubDirectory"></div>
  </main>

  <style>
    /* Rows, not cards. A request is a name and two decisions; the card shape
       next door is for destinations you travel to. */
    .mc-access-inner { display: grid; gap: 8px; }
    .mc-access-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border: 1px solid rgba(45, 72, 128, 0.28);
      border-radius: 6px;
      background: #ffffff;
    }
    .mc-access-who { flex: 1 1 260px; min-width: 0; }
    .mc-access-name { font-weight: 700; }
    .mc-access-email { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; color: #4a5772; }
    .mc-access-note-text { margin: 4px 0 0; font-size: 0.85rem; color: #4a5772; }
    .mc-access-when { font-size: 0.72rem; color: #6b7280; letter-spacing: 0.04em; }
    .mc-access-acts { display: flex; gap: 8px; }
    .mc-access-btn {
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(45, 72, 128, 0.4);
      border-radius: 5px;
      background: #ffffff;
      color: #2d4880;
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .mc-access-btn--approve { background: #2d4880; border-color: #2d4880; color: #ffffff; }
    .mc-access-btn[disabled] { opacity: 0.5; cursor: default; }
    .mc-access-note { margin: 10px 0 0; font-size: 0.85rem; color: #b3261e; }
    .mc-access-note:empty { display: none; }
  </style>

  <!-- The Ancillary Things blurbs are the ROOMS' own sentences, rendered from
       one source so a card cannot drift from the room it opens. The <p>s
       above are empty on purpose; see mc/js/room-blurbs.js. -->
  <script src="/mc/js/room-blurbs.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin-nav-menu.js"></script>
  <script>
    (function () {
      'use strict';

      const SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };
      const directory = document.getElementById('mcHubDirectory');
      // THE HASH HAS TO BE RE-APPLIED BY HAND, and this is not optional for the
      // nav's GAMES button to work. admin-shell.css hides every child of <body>
      // with `display: none !important` until the session is authorized, so the
      // browser processes /mc/#game-builder against a page with no laid-out
      // sections, scrolls nowhere, and never retries once the content appears —
      // the link would look like it simply did not fire. Re-running it after
      // authorization is what makes the anchor land.
      function applyHash() {
        const id = String(location.hash || '').replace(/^#/, '');
        if (!id) return;
        // Not getElementById on a raw fragment: a hash is user-supplied, and
        // CSS.escape keeps a stray quote or bracket from throwing here.
        let target = null;
        try { target = document.getElementById(decodeURIComponent(id)); } catch (e) { target = null; }
        if (target && target.scrollIntoView) target.scrollIntoView({ block: 'start' });
      }

      // ── ACCESS REQUESTS ────────────────────────────────────────────────
      // Reads public.admin_access_requests under the signed-in admin's own
      // session; RLS on that table is is_photo_admin(), so a signed-in
      // non-admin gets an empty list rather than a refusal, and the panel stays
      // hidden. Deciding goes through tgb_decide_admin_access, which re-checks
      // the caller inside the function -- the grant alone would let any
      // authenticated Supabase user call it.
      const accessPanel = document.getElementById('mcAccessPanel');
      const accessList = document.getElementById('mcAccessList');
      const accessNote = document.getElementById('mcAccessNote');

      function accessHeaders(session) {
        return {
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + session.access_token,
          'Content-Type': 'application/json'
        };
      }

      function ago(iso) {
        const ms = Date.now() - new Date(iso).getTime();
        if (!isFinite(ms)) return '';
        const h = Math.floor(ms / 3600000);
        if (h < 1) return 'just now';
        if (h < 24) return h + 'h ago';
        return Math.floor(h / 24) + 'd ago';
      }

      async function decideAccess(session, id, approve, row) {
        accessNote.textContent = '';
        [...row.querySelectorAll('button')].forEach(function (b) { b.disabled = true; });
        try {
          const res = await fetch(SUPABASE_CONFIG.url + '/rest/v1/rpc/tgb_decide_admin_access', {
            method: 'POST',
            headers: accessHeaders(session),
            body: JSON.stringify({ request_id: id, approve: approve })
          });
          if (!res.ok) throw new Error((await res.text()) || 'Could not save that decision.');
          // Reload rather than removing the row by hand: a second admin may
          // have decided something else while this list was on screen, and the
          // table is the only thing that knows.
          await loadAccessRequests(session);
        } catch (error) {
          accessNote.textContent = String(error.message || error).slice(0, 300);
          [...row.querySelectorAll('button')].forEach(function (b) { b.disabled = false; });
        }
      }

      async function loadAccessRequests(session) {
        if (!session || !session.access_token || !accessPanel) return;
        let rows = [];
        try {
          const url = SUPABASE_CONFIG.url
            + '/rest/v1/admin_access_requests?select=*&status=eq.pending&order=created_at.desc';
          const res = await fetch(url, { headers: accessHeaders(session), cache: 'no-store' });
          // A database that has not run 2026081701 yet answers 404/400 here.
          // Treat that as "nothing to show" rather than an error on the hub, the
          // same tolerance the Tape Room extends to a missing issues table.
          if (!res.ok) { accessPanel.hidden = true; return; }
          rows = await res.json();
        } catch (error) { accessPanel.hidden = true; return; }

        accessList.textContent = '';
        accessNote.textContent = '';
        accessPanel.hidden = !Array.isArray(rows) || rows.length === 0;
        if (accessPanel.hidden) return;

        rows.forEach(function (req) {
          const row = document.createElement('div');
          row.className = 'mc-access-row';

          const who = document.createElement('div');
          who.className = 'mc-access-who';
          const name = document.createElement('div');
          name.className = 'mc-access-name';
          name.textContent = req.name || '(no name given)';
          const mail = document.createElement('div');
          mail.className = 'mc-access-email';
          mail.textContent = req.email;
          who.appendChild(name);
          who.appendChild(mail);
          if (req.note) {
            const note = document.createElement('p');
            note.className = 'mc-access-note-text';
            note.textContent = req.note;
            who.appendChild(note);
          }

          const when = document.createElement('span');
          when.className = 'mc-access-when';
          when.textContent = ago(req.created_at);

          const acts = document.createElement('div');
          acts.className = 'mc-access-acts';
          const approve = document.createElement('button');
          approve.type = 'button';
          approve.className = 'mc-access-btn mc-access-btn--approve';
          approve.textContent = 'Approve';
          approve.title = 'Add ' + req.email + ' to the admin list';
          approve.addEventListener('click', function () { decideAccess(session, req.id, true, row); });
          const deny = document.createElement('button');
          deny.type = 'button';
          deny.className = 'mc-access-btn';
          deny.textContent = 'Deny';
          // Says what it does NOT do, because the obvious reading is wrong: the
          // person keeps the Supabase account they made for themselves, they
          // simply never reach Mission Control with it.
          deny.title = 'Refuse the request. The account stays, it just gets no admin access.';
          deny.addEventListener('click', function () { decideAccess(session, req.id, false, row); });
          acts.appendChild(approve);
          acts.appendChild(deny);

          row.appendChild(who);
          row.appendChild(when);
          row.appendChild(acts);
          accessList.appendChild(row);
        });
      }

      const adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        // Fires after .mc-auth-authorized lands, so the sections have layout.
        onAuthorized: function (session) {
          requestAnimationFrame(applyHash);
          loadAccessRequests(session);
        }
      });

      // Arriving at /mc/#game-builder from the nav while already on /mc/ changes
      // only the fragment, which fires hashchange and no reload. The browser
      // handles that case itself, but not when the section was rendered after
      // the initial hash — so answer both the same way.
      window.addEventListener('hashchange', applyHash);

      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

      function buildItemCard(group, item) {
        const card = document.createElement('a');
        // --tight so a generated card sits at content height like the Daily
        // Chores it renders beside, instead of the 220px floor a card needs
        // when it is one of many in a long directory.
        card.className = 'mc-hub-card mc-hub-card--tight';
        card.href = item.href;
        if (item.external) {
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
        }

        const itemTitle = document.createElement('h2');
        itemTitle.textContent = item.label;

        const blurb = document.createElement('p');
        blurb.textContent = item.description || 'Open this Mission Control tool.';

        // `action` is the chore-card idiom: a button that names where it goes
        // ("GO TO STOCK ROOM"), not what it does generically. A group without
        // one still gets the old label, so nothing has to be filled in.
        const button = document.createElement('span');
        button.className = 'mc-hub-card-button';
        button.textContent = item.action || (item.external ? 'Open External' : 'Open Tool');

        card.appendChild(itemTitle);
        card.appendChild(blurb);
        card.appendChild(button);
        return card;
      }

      // A "combined" group renders as ONE card that lists its links, instead of
      // one big card per item.
      function buildCombinedCard(group) {
        const card = document.createElement('div');
        card.className = 'mc-hub-card mc-hub-card--combined';

        // The item cards put the group name in the eyebrow and the tool name in
        // the heading. Here the heading IS the group name, so an eyebrow
        // repeating it would be a stutter — it carries the count instead, which
        // is the one thing the panel does not already say. A group NAMED Tools
        // would stutter the other way ("3 TOOLS" over "Tools"), so that one
        // counts links, which is also the truer word for it: they are three
        // external services, not tools we built.
        const count = group.items.length;
        const noun = /tool/i.test(group.label)
          ? (count === 1 ? ' Link' : ' Links')
          : (count === 1 ? ' Tool' : ' Tools');
        const groupLabel = document.createElement('span');
        groupLabel.className = 'mc-hub-card-group';
        groupLabel.textContent = count + noun;

        const list = document.createElement('div');
        list.className = 'mc-hub-links';
        group.items.forEach((item) => {
          const link = document.createElement('a');
          link.className = 'mc-hub-link' + (item.external ? ' is-external' : '');
          link.href = item.href;
          link.textContent = item.label;
          if (item.external) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
          list.appendChild(link);
        });

        card.appendChild(groupLabel);
        card.appendChild(list);
        return card;
      }

      // "Game Elements" -> "game-elements". Kept deliberately dumb: anything a
      // group label can contain that is not a letter or a digit becomes a
      // single hyphen, so the result is a valid fragment for any label anyone
      // types, including the ampersand the old "Data & Research" carried.
      function groupAnchor(label) {
        return String(label || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'group';
      }

      function renderDirectory() {
        const groups = window.TgbMcAdminNav.getGroups();
        groups.forEach((group) => {
          // A group flagged hubHidden lives in the dropdown only — it is already
          // on this page as an Ancillary Thing, and a second card is the same link
          // twice.
          if (group.hubHidden) return;

          const section = document.createElement('fieldset');
          section.className = 'mc-hub-group';
          // A stable anchor per section, derived from the label: "Game Builder"
          // -> #game-builder. The shared admin nav's GAMES button links straight
          // to one of these, so the id has to survive a re-render — deriving it
          // from the label rather than the loop index means reordering the
          // groups cannot silently repoint that link at the wrong section.
          section.id = groupAnchor(group.label);

          const legend = document.createElement('legend');
          legend.textContent = group.label;

          const grid = document.createElement('div');
          grid.className = 'mc-hub-grid';

          if (group.combined) {
            grid.appendChild(buildCombinedCard(group));
          } else {
            group.items.forEach((item) => grid.appendChild(buildItemCard(group, item)));
          }

          section.appendChild(legend);
          section.appendChild(grid);
          directory.appendChild(section);
        });
      }

      renderDirectory();
      adminAuth.init();
    }());
  </script>
</body>
</html>
