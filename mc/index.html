<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MISSION CONTROL | THE GAME BUREAU</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/icon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <!-- The mast, not the old shared tgb.ico: this is the one page you keep on a
       home screen, and it should be identifiable at 16px from its own glyph.
       Drawn from the same Lucide radio-tower the headline and the nav's MISSION
       CONTROL button carry, by mc/_dev/scripts/make-mission-control-icons.py. -->
  <!-- 180 is the size iOS asks for, and the PNG is deliberately opaque: a
       transparent apple-touch-icon is composited onto BLACK before the squircle
       mask, so it would arrive as a black tile. -->
  <link rel="manifest" href="/mc/manifest.webmanifest">
  <meta name="theme-color" content="#2d4880">
  <!-- What the icon is captioned on the home screen. Without it iOS uses the
       <title>, which here is the full "MISSION CONTROL | THE GAME BUREAU" and
       gets truncated to something unreadable. -->
  <meta name="apple-mobile-web-app-title" content="Mission Control">
  <meta name="application-name" content="Mission Control">
  <!-- Standalone: launched from the home screen this runs without Safari's
       chrome. That is the point of installing it, but it also means no browser
       back button, which is why the nav bar below is the only way between rooms
       and has to work at 360px. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --cut-panel-bg: #eef0f4;
      --cut-panel-line: var(--line);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button { font: inherit; }

    .mc-hub-head {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
    }

    /* .mc-chores > legend belongs here too. It was only in the sizing rule
       below, so it inherited the body font in sentence case while every sibling
       legend rendered mono and uppercase -- the odd one out on the page. */
    .mc-hub-group > legend,
    .mc-chores > legend,
    .mc-hub-card-group {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* The floor was 2.6rem, which put "Mission Control" plus the mast at about
       375px of type on a 360px phone -- it wrapped mid-word behind the aerial.
       2.05rem fits it on one line at 360 and the vw term takes over by ~390. */
    .mc-hub-head h1 {
      margin: 0;
      font-size: clamp(2.05rem, 9.5vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: 0;
      overflow-wrap: break-word;
    }

    /* The broadcast mast, same Lucide radio-tower the nav's MISSION CONTROL
       button carries. Sized in em so it tracks the clamped headline instead of
       needing its own breakpoints, and left inline rather than made a flex item:
       at the small end of the clamp the two words can wrap, and a flex icon
       would then centre itself against a two-line block instead of sitting in
       front of "Mission". An inline replaced element sits on the baseline, which
       is where a glyph belongs.

       The stroke is scaled DOWN as the type scales up: at 5.8rem a 2px stroke on
       a 24-box would render heavier than the letterforms beside it. */
    .mc-hub-mast {
      width: 0.76em;
      height: 0.76em;
      margin-right: 0.2em;
      vertical-align: -0.02em;
      color: var(--bic-blue, #2d4880);
      overflow: visible;
    }

    .mc-hub-intro {
      max-width: 720px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }
    /* The address takes the accent and the page's weight rather than going
       browser-blue and underlined, which in the middle of a muted paragraph
       reads as a different kind of thing entirely. */
    .mc-hub-intro a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.35);
    }
    .mc-hub-intro a:hover { border-bottom-color: var(--accent); }

    .mc-hub-directory {
      display: grid;
      gap: 22px;
    }

    /* Tight shadow, the socials panels' 0 1px 4px rather than the wide soft one
       the shared .prompt-panel carries: that cushion is right for a modal
       floating over the page, and under a grid of cards it only blurs the
       panel's own edge. */
    .mc-hub-group {
      min-inline-size: 0;
      /* Breathing room for the #anchor jump the nav's GAMES button makes —
         without it the section lands flush against the top of the viewport and
         its folder-tab legend is half cut off. */
      scroll-margin-top: 18px;
      margin: 0;
      padding: 6px 14px 13px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    /* The section labels wear the socials command bar's folder tab, so the two
       pages cut their panels the same way. The border runs into the label and
       back out again, and the cut-out reads as a tag clipped onto the frame
       rather than a gap in it.

       The tab is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box. The word has to sit
       centred on the horizontal line, which is where the browser puts a legend
       by default. But the tab's sides must stop AT that line rather than
       carrying on into the panel, and a bordered box whose bottom edge is the
       line cannot also have its text centred on the line -- the text centre is
       always the better part of half a box above the bottom edge.

       So the box stays put and the outline is drawn only over the half above
       the line -- `inset: 0 0 50%`, since the legend's midpoint IS the line.
       The word's lower half hangs into the panel, invisibly, because the tab
       fill and the panel are the same colour with no bottom edge between them.

       isolation: isolate is load-bearing. The arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own that -1 would
       drop it behind the fieldset's own background and it would vanish. */
    .mc-hub-group > legend,
    .mc-chores > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ink);
    }

    .mc-hub-group > legend::before,
    .mc-chores > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;              /* the legend's midpoint is the border line */
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome
         instead of a tab. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .mc-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }


    /* ---- THE FORMULA DRAWS AS WHAT A GAME IS MADE OF ---------------------
       GAME INFO across the top; under it the three things a game names -- an
       ANCHOR EVENT, its AUDIENCES and a MAP -- and under the map what a map is
       made of: STOPS, each of them a WAYPOINT and a CHALLENGE.

       CONTAINMENT, NOT AN EQUATION. It drew as `waypoint + challenge = stop
       -> atlas` until 2026-08-31, which said one true thing about two of the
       rooms and could not say the rest: that all of this hangs off a GAME, and
       that the anchor and the audiences sit beside the map rather than
       anywhere in that sentence. A breakdown chart says both at a glance and
       needs no signs at all -- so the +, the =, the arrow and the word under it
       are gone, and ALIGNMENT is what carries the nesting.

       WHAT THAT COSTS: the arrow carried the words `in an order`, which is the
       whole difference between a pile of stops and a map. The Atlas card own
       description still says it (`Maps made up of ordered lists of stops`), so
       it is stated rather than drawn.

       ONLY THE GROUP CARRYING `flow` GETS THIS. Every other group keeps the
       auto-fit row, so nothing else moves. */
    .mc-hub-grid--flow {
      /* FOUR EQUAL COLUMNS. The map and the stop span the right-hand two, and
         the waypoint and the challenge take one each under them -- which is
         what puts all four in one column and makes the nesting readable
         without a single connecting line. */
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      grid-auto-rows: auto;
      align-items: stretch;
      gap: 10px;
    }

    /* THE CARDS SIZE TO THEIR CONTENT. Without this the shared min-height
       makes a four-row column enormous and the two short boxes beside it float
       in white space. */
    .mc-hub-grid--flow > .mc-hub-card { min-height: 0; }

    /* NAMED FOR WHAT THEY ARE, not numbered. This chart is a specific diagram
       rather than a generic n-up, so a rule reading `.flow-stop` says what it
       is placing; `.flow-5` would need the diagram open beside it. */
    .mc-hub-grid--flow .flow-game      { grid-column: 1 / -1; grid-row: 1; }
    .mc-hub-grid--flow .flow-anchor    { grid-column: 1;      grid-row: 2; }

    /* THE GAME IS THE TITLE OF THE DIAGRAM, so it is set like one: centred,
       huge, and with no sentence under it. Everything below is what a game is
       MADE OF, and a card at the top drawn to the same weight as its own parts
       said they were all the same kind of thing.

       `clamp()` RATHER THAN A FLAT SIZE. At 136px "Game Builder" is about
       790px of a 1180px chart and fits; at 390px it would be four times the
       width of the page. The middle term is viewport-relative so it shrinks
       with the chart rather than at one breakpoint.

       `justify-items: center` ON THE CARD, not just `text-align` on the
       heading: the card is a GRID, so its child is a track item and would sit
       left however the text inside it were aligned. Both are set -- the first
       places the box, the second centres a heading that wraps. */
    .mc-hub-grid--flow .flow-game {
      justify-items: center;
      align-content: center;
      padding: 26px 20px;
    }
    /* EVERY BOX IS CENTRED AND SHOUTED. This is a DIAGRAM, not a directory:
       each box is a labelled thing rather than a card you read down, so the
       label sits in the middle of it the way it does on the drawing this chart
       was taken from.

       ONE RULE FOR THE CHART RATHER THAN ONE PER SLOT. It began as three
       declarations on `.flow-anchor` and would have been the same three seven
       times over -- and a box added later would arrive looking like none of the
       others.

       THE HEADING AND ITS SENTENCE ARE CENTRED, and the CARD is centred by
       `justify-items` -- both are needed and one alone looks right. The card is
       a GRID, so its children are track items and sit LEFT however their own
       text is aligned.

       CAPS ARE WIDER, and the narrow boxes are a quarter of the chart:
       `CHALLENGE BANK` has to be able to break, or it pushes its column past
       its share and takes the whole row with it. */
    .mc-hub-grid--flow .mc-hub-card { justify-items: center; }
    .mc-hub-grid--flow .mc-hub-card h2 {
      text-transform: uppercase;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .mc-hub-grid--flow .mc-hub-card p { text-align: center; }

    .mc-hub-grid--flow .flow-game h2 {
      /* CAPS IN CSS, NOT IN THE DATA. The nav holds `Game Builder`, which is
         the room own name and what the dropdown, the directory and this
         check all read; the chart shouting it is a rendering choice. It also
         means `textContent` still says `Game Builder`, so anything finding a
         card by its heading -- the suite does -- is untouched. */
      text-transform: uppercase;
      /* AND CAPS ARE WIDER. `GAME BUILDER` is about 12% broader than the
         sentence-case line at the same size, so the ceiling comes down from
         8.5rem to 7.6rem and the viewport term from 10vw to 9 -- measured at
         five widths rather than guessed, and it still clears 120px. */
      font-size: clamp(2.1rem, 9vw, 7.6rem);
      line-height: 1.02;
      text-align: center;
      /* A 136px line has room to breathe on its own; the heading rule gives
         every other card a bottom margin that would open a gap under a card
         with nothing beneath it. */
      margin: 0;
      /* IT MAY WRAP ON A PHONE and must break sensibly when it does -- two
         words at 2.4rem is still the widest thing on the page. */
      overflow-wrap: anywhere;
    }
    .mc-hub-grid--flow .flow-audience  { grid-column: 2;      grid-row: 2; }
    .mc-hub-grid--flow .flow-map       { grid-column: 3 / -1; grid-row: 2; }
    .mc-hub-grid--flow .flow-stop      { grid-column: 3 / -1; grid-row: 3; }
    .mc-hub-grid--flow .flow-waypoint  { grid-column: 3;      grid-row: 4; }
    .mc-hub-grid--flow .flow-challenge { grid-column: 4;      grid-row: 4; }

    /* THE SIGNS AND THE ARROW WENT WITH THE EQUATION (2026-08-31), and their
       CSS with them: `.flow-mark`, `.flow-sign`, `.flow-word` and
       `.flow-arrow` matched nothing once the chart became a breakdown, which
       is the dead CSS this project sweeps for. A containment chart draws no
       connectors -- the alignment IS the statement. */

    /* TWO COLUMNS BEFORE ONE. At four the boxes are 150px of a 780px page and
       every label wraps; at two the diagram still holds its shape -- the game
       across the top, the anchor beside the audiences, the map above the stop
       above its two halves. */
    @media (max-width: 900px) {
      .mc-hub-grid--flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mc-hub-grid--flow .flow-game      { grid-column: 1 / -1; grid-row: 1; }
      .mc-hub-grid--flow .flow-anchor    { grid-column: 1;      grid-row: 2; }
      .mc-hub-grid--flow .flow-audience  { grid-column: 2;      grid-row: 2; }
      .mc-hub-grid--flow .flow-map       { grid-column: 1 / -1; grid-row: 3; }
      .mc-hub-grid--flow .flow-stop      { grid-column: 1 / -1; grid-row: 4; }
      .mc-hub-grid--flow .flow-waypoint  { grid-column: 1;      grid-row: 5; }
      .mc-hub-grid--flow .flow-challenge { grid-column: 2;      grid-row: 5; }
    }

    /* AND ONE COLUMN ON A PHONE, in the order the chart reads. Below about
       520px two boxes a line is two clipped labels. */
    @media (max-width: 520px) {
      .mc-hub-grid--flow { grid-template-columns: 1fr; }
      .mc-hub-grid--flow > * { grid-column: 1 !important; grid-row: auto !important; }
    }

    .mc-hub-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 220px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.93);
      color: inherit;
      text-decoration: none;
      transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
    }

    .mc-hub-card:hover,
    .mc-hub-card:focus-visible {
      border-color: var(--bic-blue);
      box-shadow: 0 8px 18px rgba(var(--bic-blue-rgb), 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .mc-hub-card-group {
      font-size: 0.63rem;
      color: var(--muted);
    }

    .mc-hub-card h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    /* :not(.room-blurb) because the three Ancillary Things blurbs are the ROOMS'
       own sentences and wear the room's own container: `.room-blurb` in
       admin-shell.css, the same rule the header under each room's title uses.
       Without the :not() the two fought and the card won some properties and
       lost others, which is neither the card's look nor the room's. The
       directory cards below still use this rule. */
    .mc-hub-card p:not(.room-blurb) {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    /* `.mc-hub-card-button` IS GONE (2026-08-31), with the last three buttons
       that wore it: the three Ancillary Things cards. Every hub card is one big
       <a> with the href on it, so a blue bar at the foot of one was a control
       drawn inside a control -- and the affordance is the card itself, which
       takes a blue border and lifts on hover and on focus.

       ITS `::after` DREW THE ARROW, and that went too. */

    /* Combined card: one panel that lists its links. Used by Games,
       Game Elements, and External Tools. */
    .mc-hub-card--combined {
      grid-template-rows: auto 1fr;
      min-height: 0;
    }

    .mc-hub-card--combined:hover,
    .mc-hub-card--combined:focus-within {
      transform: none;
      border-color: var(--line);
      box-shadow: none;
    }

    /* Flows into columns rather than one tall stack. A combined card is the only
       thing in its section grid, so it spans the full width — ten Games tools in
       a single column would leave the right two-thirds of the panel empty and
       push everything below it off the screen. */
    .mc-hub-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .mc-hub-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
    }

    .mc-hub-link::after {
      content: "\2192";
      color: var(--muted);
      font-size: 1rem;
    }

    .mc-hub-link.is-external::after {
      content: "\2197";
    }

    .mc-hub-link:hover,
    .mc-hub-link:focus-visible {
      border-color: var(--bic-blue);
      background: rgba(var(--bic-blue-rgb), 0.06);
      outline: none;
      transform: translateY(-1px);
    }

    /* DAILY CHORES — the three admins worked through every day, pulled out of
       the directory below so they are one click from landing here. Same
       labelled-border idiom as the gift shop's .btn-fieldset: a real <fieldset>
       keeping its default display so the <legend> natively cuts the top border,
       with an inner wrapper doing the horizontal layout. */
    .mc-chores {
      min-inline-size: 0;
      margin: 0 0 22px;
      padding: 6px 14px 13px;
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      background: var(--cut-panel-bg);
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    /* Same grid as the directory below, so a chore card is the same object as
       every other card on the page. */
    .mc-chores-inner {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    /* A chore card is a .mc-hub-card minus the group eyebrow: three rows
       (title / blurb / button) instead of four. The eyebrow would only repeat
       DAILY CHORES, which the border already says.

       .mc-hub-card--tight is the same shape for a GENERATED card, so a menu
       group that opts out of `combined` renders cards that match the chores
       above them rather than 220px-tall boxes with a hole in the middle. */
    .mc-chore,
    .mc-hub-card--tight { min-height: 0; }
    /* THE CHORE CARDS KEEP THE THIRD TRACK, because they still hold a `GO TO`
       button and the `1fr` is what pins it to the foot however long the blurb
       is. A GENERATED card has two children since 2026-08-31, so the same
       template left an empty row and paid for its gap. */
    .mc-chore { grid-template-rows: auto 1fr auto; }
    /* AND `align-content: start`, WHICH IS THE HALF THAT IS EASY TO MISS.
       A grid stretched taller than its content spreads the SPARE HEIGHT INTO
       ITS TRACKS by default -- so on a row whose height is set by the longest
       blurb beside it, the heading track grew and pushed its own blurb down
       the card. Two rows of `auto` are not enough on their own; the leftover
       has to be told to sit at the bottom rather than between them. */
    .mc-hub-card--tight { grid-template-rows: auto auto; align-content: start; }

    @media (max-width: 720px) {
      .mc-hub-grid,
      .mc-chores-inner,
      .mc-hub-links { grid-template-columns: 1fr; }

      /* min-height was 190px, set when these sat two-up and needed to match
         each other. Stacked one per row there is nothing left to match, and
         eleven cards padded to 190px made the page four screens of whitespace.
         The content sizes them now. */
      .mc-hub-card {
        min-height: 0;
        gap: 8px;
        padding: 15px;
      }
      .mc-hub-card h2 { font-size: 1.18rem; }
      .mc-hub-card p:not(.room-blurb) { font-size: 0.86rem; line-height: 1.5; }

      .mc-hub-directory { gap: 16px; }
      .mc-chores { margin-bottom: 16px; }
      .mc-hub-group,
      .mc-chores { padding: 6px 10px 11px; }

      .mc-hub-intro { font-size: 0.94rem; line-height: 1.55; }
      .mc-hub-head { gap: 6px; }

      /* It already clears 42px, so it is a legal target; the extra height is
         for a thumb reaching across a phone rather than a cursor.
         `.mc-hub-card-button` SHARED THIS RULE and went on 2026-08-31 --
         removing the whole block would have taken `.mc-hub-link` with it, which
         is the trap in deleting a selector that sits in a group. */
      .mc-hub-link { min-height: 46px; }
      .mc-hub-link { font-size: 0.88rem; }
    }

    /* Landscape on a notched phone puts the display cutout over the left gutter.
       The shell's own gutter is symmetric and cannot know about it. */
    @supports (padding: max(0px)) {
      @media (max-width: 900px) and (orientation: landscape) {
        body:not(.builder-page--editor) .app {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    }
  </style>
  <link rel="stylesheet" href="js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <header class="mc-hub-head">

  <script src="/mc/assets/geo.js"></script>

  <script>
    (function () {
      'use strict';

      const SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };
      const directory = document.getElementById('mcHubDirectory');
      // THE HASH HAS TO BE RE-APPLIED BY HAND, and this is not optional for the
      // nav's GAMES button to work. admin-shell.css hides every child of <body>
      // with `display: none !important` until the session is authorized, so the
      // browser processes /mc/#game-builder against a page with no laid-out
      // sections, scrolls nowhere, and never retries once the content appears —
      // the link would look like it simply did not fire. Re-running it after
      // authorization is what makes the anchor land.
      function applyHash() {
        const id = String(location.hash || '').replace(/^#/, '');
        if (!id) return;
        // Not getElementById on a raw fragment: a hash is user-supplied, and
        // CSS.escape keeps a stray quote or bracket from throwing here.
        let target = null;
        try { target = document.getElementById(decodeURIComponent(id)); } catch (e) { target = null; }
        if (target && target.scrollIntoView) target.scrollIntoView({ block: 'start' });
      }

      // ── ACCESS REQUESTS ────────────────────────────────────────────────
      // Reads public.admin_access_requests under the signed-in admin's own
      // session; RLS on that table is is_photo_admin(), so a signed-in
      // non-admin gets an empty list rather than a refusal, and the panel stays
      // hidden. Deciding goes through tgb_decide_admin_access, which re-checks
      // the caller inside the function -- the grant alone would let any
      // authenticated Supabase user call it.
      const accessPanel = document.getElementById('mcAccessPanel');
      const accessList = document.getElementById('mcAccessList');
      const accessNote = document.getElementById('mcAccessNote');

      function accessHeaders(session) {
        return {
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + session.access_token,
          'Content-Type': 'application/json'
        };
      }

      function ago(iso) {
        const ms = Date.now() - new Date(iso).getTime();
        if (!isFinite(ms)) return '';
        const h = Math.floor(ms / 3600000);
        if (h < 1) return 'just now';
        if (h < 24) return h + 'h ago';
        return Math.floor(h / 24) + 'd ago';
      }

      async function decideAccess(session, id, approve, row) {
        accessNote.textContent = '';
        [...row.querySelectorAll('button')].forEach(function (b) { b.disabled = true; });
        try {
          const res = await fetch(SUPABASE_CONFIG.url + '/rest/v1/rpc/tgb_decide_admin_access', {
            method: 'POST',
            headers: accessHeaders(session),
            body: JSON.stringify({ request_id: id, approve: approve })
          });
          if (!res.ok) throw new Error((await res.text()) || 'Could not save that decision.');
          // Reload rather than removing the row by hand: a second admin may
          // have decided something else while this list was on screen, and the
          // table is the only thing that knows.
          await loadAccessRequests(session);
        } catch (error) {
          accessNote.textContent = String(error.message || error).slice(0, 300);
          [...row.querySelectorAll('button')].forEach(function (b) { b.disabled = false; });
        }
      }

      async function loadAccessRequests(session) {
        if (!session || !session.access_token || !accessPanel) return;
        let rows = [];
        try {
          const url = SUPABASE_CONFIG.url
            + '/rest/v1/admin_access_requests?select=*&status=eq.pending&order=created_at.desc';
          const res = await fetch(url, { headers: accessHeaders(session), cache: 'no-store' });
          // A database that has not run 2026081701 yet answers 404/400 here.
          // Treat that as "nothing to show" rather than an error on the hub, the
          // same tolerance the Tape Room extends to a missing issues table.
          if (!res.ok) { accessPanel.hidden = true; return; }
          rows = await res.json();
        } catch (error) { accessPanel.hidden = true; return; }

        accessList.textContent = '';
        accessNote.textContent = '';
        accessPanel.hidden = !Array.isArray(rows) || rows.length === 0;
        if (accessPanel.hidden) return;

        rows.forEach(function (req) {
          const row = document.createElement('div');
          row.className = 'mc-access-row';

          const who = document.createElement('div');
          who.className = 'mc-access-who';
          const name = document.createElement('div');
          name.className = 'mc-access-name';
          name.textContent = req.name || '(no name given)';
          const mail = document.createElement('div');
          mail.className = 'mc-access-email';
          mail.textContent = req.email;
          who.appendChild(name);
          who.appendChild(mail);
          if (req.note) {
            const note = document.createElement('p');
            note.className = 'mc-access-note-text';
            note.textContent = req.note;
            who.appendChild(note);
          }

          const when = document.createElement('span');
          when.className = 'mc-access-when';
          when.textContent = ago(req.created_at);

          const acts = document.createElement('div');
          acts.className = 'mc-access-acts';
          const approve = document.createElement('button');
          approve.type = 'button';
          approve.className = 'mc-access-btn mc-access-btn--approve';
          approve.textContent = 'Approve';
          approve.title = 'Add ' + req.email + ' to the admin list';
          approve.addEventListener('click', function () { decideAccess(session, req.id, true, row); });
          const deny = document.createElement('button');
          deny.type = 'button';
          deny.className = 'mc-access-btn';
          deny.textContent = 'Deny';
          // Says what it does NOT do, because the obvious reading is wrong: the
          // person keeps the Supabase account they made for themselves, they
          // simply never reach Mission Control with it.
          deny.title = 'Refuse the request. The account stays, it just gets no admin access.';
          deny.addEventListener('click', function () { decideAccess(session, req.id, false, row); });
          acts.appendChild(approve);
          acts.appendChild(deny);

          row.appendChild(who);
          row.appendChild(when);
          row.appendChild(acts);
          accessList.appendChild(row);
        });
      }

      // ── TO REVIEW, and THE ROUTINES ────────────────────────────────────
      //
      // Both read under the signed-in admin's own session. `socials` and
      // `issues` are admin-read only, so the publishable key alone
      // would answer with an empty list rather than a refusal -- which is
      // exactly the shape of bug this panel must not have, since an empty list
      // and "nothing waiting" look identical. See countOf() for how a refused
      // read is kept distinguishable from a zero.
      // `REVIEW_SOURCES` AND THE THREE PANEL HANDLES WERE HERE, and went with
      // the panels on 2026-08-31. The list held one query per room, written per
      // room rather than normalised, because normalising would have meant
      // changing five rooms to suit one table.
      // `BOTS`, `countOf`, `reviewLabel`, `reviewRow`, `loadReview`,
      // `agoShort` AND `loadBots` WERE ALL HERE.
      //
      // TWO THINGS FROM THEM ARE WORTH KEEPING IN MIND if either panel is ever
      // rebuilt:
      //
      // `countOf` RETURNED NULL RATHER THAN 0 FOR A REFUSED READ. `socials`
      // and `issues` are admin-read only, so a lapsed session answers with a
      // refusal -- and reporting that as a zero would say a queue was empty when
      // nobody knew. "Nothing is waiting" and "we could not find out" are
      // opposite answers and have to stay that way.
      //
      // A TRIGGER ID IS THE ADDRESS OF A ROUTINE, and a stale one 404s
      // silently. `BOTS` held them beside the names for that reason rather than
      // leaving them to be remembered; they are in CLAUDE.md.

      // ── THE CITIES PANEL NEEDS A SESSION ─────────────────────────────────
      //
      // `workSession` IS NAMED FOR THE WORKLIST THAT IS GONE, and it is kept
      // because the Cities panel reads it. It is set on authorization rather
      // than when a worklist opened, so nothing about it depended on that
      // panel; renaming it is a tidy-up for another day. What matters is that
      // it is declared BEFORE the Cities code that uses it.
      let workSession = null;

      // ── CITIES ──────────────────────────────────────────────────────────
      //
      // ONE CITY AT A TIME. The catalogue is 1,451 rows and the question asked
      // of it from here is almost always about ONE of them: is Foxborough
      // hidden, should Tulsa be on the gift shop. A hundred-row page is the
      // right shape for the room and the wrong shape for a hub panel, so this
      // shows a single city with its three visibility flags and steps.
      //
      // IT IS NOT THE WHOLE ROOM AND DOES NOT TRY TO BE. Renaming a city, the
      // structured geo fields, the bulk AI import and the three filters went
      // with mc/data/cities.html when it was deleted on 2026-08-25, so this is
      // the only city editor there is. **A rename in particular
      // must not be offered here**: `city` is the KEY that games and gift-shop
      // listings reference BY STRING, nothing updates them automatically, and
      // the room's own rename warning is three sentences long for that reason.
      const CITY_TABLE = 'cities';
      const CITY_FLAGS = [
        ['hide_from_games', 'games', 'Keep this city out of the finder on /games/. Use for stadium towns we do not sell into.'],
        ['hide_from_soundtracks', 'soundtracks', 'Keep this city off the cassette rail on /soundtracks/.'],
        ['hide_from_gift_shop', 'gift shop', 'Keep this city out of Shop By City on /gifts/.']
      ];

      const cityPanel = document.getElementById('mcCityPanel');
      const citySearch = document.getElementById('mcCitySearch');
      const cityBody = document.getElementById('mcCityBody');
      const cityNote = document.getElementById('mcCityNote');
      const cityPrev = document.getElementById('mcCityPrev');
      const cityNext = document.getElementById('mcCityNext');
      const cityPos = document.getElementById('mcCityPos');
      const cityAdd = document.getElementById('mcCityAdd');
      const cityState = { rows: [], i: 0, q: '' };

      // The room's own fallback: a database that has not run
      // 2026072901_cities_hide_flags.sql has no per-surface columns, and the
      // retired `ignored` meant hidden everywhere.
      function cityFlagOn(row, column) {
        if (row[column] === undefined) return row.ignored === true;
        return row[column] === true;
      }

      function cityMatches(row) {
        if (!cityState.q) return true;
        return String(row.city || '').toLowerCase().indexOf(cityState.q) !== -1;
      }

      function cityVisible() {
        return cityState.rows.filter(cityMatches);
      }

      function renderCity() {
        if (!cityBody) return;
        cityBody.textContent = '';
        const rows = cityVisible();
        if (!rows.length) {
          const p = document.createElement('p');
          p.className = 'mc-work-empty';
          p.textContent = cityState.rows.length
            ? 'No city matches that.'
            : 'Could not read the city catalogue.';
          cityBody.appendChild(p);
          cityPos.textContent = '';
          cityPrev.disabled = true;
          cityNext.disabled = true;
          return;
        }
        if (cityState.i >= rows.length) cityState.i = 0;
        if (cityState.i < 0) cityState.i = rows.length - 1;
        const row = rows[cityState.i];

        const head = document.createElement('div');
        head.className = 'mc-city-head';
        const name = document.createElement('span');
        name.className = 'mc-city-name';
        name.textContent = row.city || row.slug || '(unnamed)';
        head.appendChild(name);
        // The same two badges the room draws, from the same helper, so a city
        // reads identically in both places.
        if (window.TgbGeo && TgbGeo.geoBadge) {
          const b = TgbGeo.geoBadge(row);
          const code = (row.state_code || (b && b.kind === 'state' ? b.value : '')) ||
                       (row.country_code || (b && b.kind === 'country' ? b.value : ''));
          if (code) {
            const badge = document.createElement('span');
            badge.className = 'mc-city-badge';
            badge.textContent = code;
            head.appendChild(badge);
          }
        }
        cityBody.appendChild(head);

        const flags = document.createElement('div');
        flags.className = 'mc-city-flags';
        const boxes = CITY_FLAGS.map(function (f) {
          const label = document.createElement('label');
          label.className = 'mc-city-flag';
          label.title = f[2];
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = cityFlagOn(row, f[0]);
          box.addEventListener('change', function () { saveCity(row, boxes); });
          label.appendChild(box);
          label.appendChild(document.createTextNode('hide from ' + f[1]));
          flags.appendChild(label);
          return { column: f[0], box: box };
        });
        cityBody.appendChild(flags);

        cityPos.textContent = (cityState.i + 1) + ' of ' + rows.length;
        cityPrev.disabled = rows.length < 2;
        cityNext.disabled = rows.length < 2;
      }

      // SAVES ON THE TICK, no Save button. There is one row on screen and three
      // booleans on it: a Save button would be a second press for a decision
      // already made, and the room's own Save exists because its card also
      // carries five text fields that a rename has to be warned about.
      async function saveCity(row, boxes) {
        boxes.forEach(function (b) { b.box.disabled = true; });
        const payload = {};
        boxes.forEach(function (b) { payload[b.column] = b.box.checked; });
        // `ignored` IS DEPRECATED AND STILL WRITTEN, so a reader that has not
        // moved to the three columns keeps behaving sensibly. It means "hidden
        // everywhere", so it is true only when all three are -- the room writes
        // it exactly this way and the two must not disagree.
        payload.ignored = boxes.every(function (b) { return b.box.checked; });
        try {
          const res = await fetch(SUPABASE_CONFIG.url + '/rest/v1/' + CITY_TABLE +
              '?slug=eq.' + encodeURIComponent(row.slug), {
            method: 'PATCH',
            // return=representation IS NOT DECORATION: PostgREST answers 200
            // with an empty array when RLS refuses, so without reading the row
            // back a refused change reports success and the tick stays on
            // screen against a database that never took it.
            headers: Object.assign(accessHeaders(workSession), { Prefer: 'return=representation' }),
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('Request failed (' + res.status + ')');
          const saved = await res.json();
          if (!Array.isArray(saved) || !saved.length) {
            throw new Error('The database refused that change. Check you are still signed in as an admin.');
          }
          Object.assign(row, saved[0]);
          cityNote.classList.remove('mc-work-error');
          cityNote.textContent = 'Saved ' + (row.city || row.slug) + '.';
        } catch (err) {
          // PUT THE TICKS BACK. Leaving them where the click left them shows a
          // state the database does not hold, which is the failure this whole
          // page keeps guarding against.
          boxes.forEach(function (b) { b.box.checked = cityFlagOn(row, b.column); });
          cityNote.classList.add('mc-work-error');
          cityNote.textContent = err && err.message ? err.message : 'That did not work.';
        } finally {
          boxes.forEach(function (b) { b.box.disabled = false; });
        }
      }

      function stepCity(by) {
        cityState.i += by;
        renderCity();
      }

      async function loadCities(session) {
        if (!cityPanel) return;
        if (!(window.TgbCities && typeof TgbCities.load === 'function')) {
          cityPanel.hidden = true;
          return;
        }
        try {
          await TgbCities.load();
          // includeIgnored: the room shows hidden cities greyed rather than
          // dropping them, and a panel that could not reach a hidden city would
          // be unable to UNHIDE one, which is half of what it is for.
          cityState.rows = TgbCities.all();
          renderCity();
        } catch (err) {
          cityState.rows = [];
          renderCity();
        }
      }

      if (citySearch) {
        citySearch.addEventListener('input', function () {
          cityState.q = citySearch.value.trim().toLowerCase();
          // BACK TO THE FIRST MATCH on every keystroke. Holding the index while
          // the list shrinks under it lands you on an unrelated city.
          cityState.i = 0;
          renderCity();
        });
      }
      if (cityPrev) cityPrev.addEventListener('click', function () { stepCity(-1); });
      if (cityNext) cityNext.addEventListener('click', function () { stepCity(1); });
      if (cityAdd) {
        cityAdd.addEventListener('click', function () {
          // GUARD ON WHAT IS ACTUALLY CALLED. This tested `TgbCities.add` and
          // then called `openAddDialog`, so a module exporting one and not the
          // other would have gone straight past the guard into a TypeError --
          // and a module exporting the other way round would have refused to
          // open a dialog it could perfectly well open.
          if (!(window.TgbCities && typeof TgbCities.openAddDialog === 'function')) {
            // THERE IS NOWHERE TO SEND THEM ANY MORE. This used to fall back to
            // the Cities room, which was deleted on 2026-08-25, so it says what
            // is wrong instead: a button that silently does nothing is
            // indistinguishable from a broken one.
            cityNote.classList.add('mc-work-error');
            cityNote.textContent = 'The city picker did not load, so a city cannot be added. Reload the page.';
            return;
          }
          // THE SHARED ADD DIALOG, not a second form. It derives the state code,
          // composes the canonical string and writes the structured geo, and a
          // city added here has to be the same row as one added anywhere else.
          TgbCities.openAddDialog({ authHeaders: function () { return accessHeaders(workSession); } })
            .then(function (row) {
              if (!row) return;
              cityState.q = '';
              if (citySearch) citySearch.value = '';
              loadCities(workSession);
            })
            .catch(function (err) { console.error(err); });
        });
      }

      const adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        // Fires after .mc-auth-authorized lands, so the sections have layout.
        onAuthorized: function (session) {
          requestAnimationFrame(applyHash);
          loadAccessRequests(session);
          workSession = session;
          loadCities(session);
        }
      });

      // Arriving at /mc/#game-builder from the nav while already on /mc/ changes
      // only the fragment, which fires hashchange and no reload. The browser
      // handles that case itself, but not when the section was rendered after
      // the initial hash — so answer both the same way.
      window.addEventListener('hashchange', applyHash);

      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

      function buildItemCard(group, item) {
        const card = document.createElement('a');
        // --tight so a generated card sits at content height like the Daily
        // Chores it renders beside, instead of the 220px floor a card needs
        // when it is one of many in a long directory.
        card.className = 'mc-hub-card mc-hub-card--tight';
        card.href = item.href;
        if (item.external) {
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
        }

        const itemTitle = document.createElement('h2');
        itemTitle.textContent = item.label;

        const blurb = document.createElement('p');
        blurb.textContent = item.description || 'Open this Mission Control tool.';

        // NO BUTTON INSIDE THE CARD (2026-08-31). THE WHOLE CARD IS THE LINK --
        // it is an `<a>` with the href on it, so a blue `OPEN TOOL` bar at the
        // foot was a control drawn inside a control, and every card in the
        // directory carried the same two words. **A label that appears on every
        // card is furniture, not information**, which is the same rule that took
        // the kind chip off the Events rows and the status chip off a track.
        //
        // THE AFFORDANCE IS NOT LOST WITH IT: the heading is set in the accent,
        // the card lifts and takes a blue border on hover and on focus, and an
        // `<a>` with an href carries `cursor: pointer` for free.
        //
        // AND THE THREE ANCILLARY THINGS CARDS LOST THEIRS TOO, later the same
        // day, so `.mc-hub-card-button` is gone from the page entirely. The
        // reason is the same on every card: it is one big `<a>`, so a bar at its
        // foot is a control drawn inside a control.
        //
        // `item.action` IS READ BY NOTHING NOW and no nav item sets one,
        // checked rather than assumed. If a per-card label is ever wanted back,
        // it wants a reason better than "every card should have a button".
        card.appendChild(itemTitle);
        card.appendChild(blurb);
        return card;
      }

      // A "combined" group renders as ONE card that lists its links, instead of
      // one big card per item.
      function buildCombinedCard(group) {
        const card = document.createElement('div');
        card.className = 'mc-hub-card mc-hub-card--combined';

        // The item cards put the group name in the eyebrow and the tool name in
        // the heading. Here the heading IS the group name, so an eyebrow
        // repeating it would be a stutter — it carries the count instead, which
        // is the one thing the panel does not already say. A group NAMED Tools
        // would stutter the other way ("3 TOOLS" over "Tools"), so that one
        // counts links, which is also the truer word for it: they are three
        // external services, not tools we built.
        const count = group.items.length;
        const noun = /tool/i.test(group.label)
          ? (count === 1 ? ' Link' : ' Links')
          : (count === 1 ? ' Tool' : ' Tools');
        const groupLabel = document.createElement('span');
        groupLabel.className = 'mc-hub-card-group';
        groupLabel.textContent = count + noun;

        const list = document.createElement('div');
        list.className = 'mc-hub-links';
        group.items.forEach((item) => {
          const link = document.createElement('a');
          link.className = 'mc-hub-link' + (item.external ? ' is-external' : '');
          link.href = item.href;
          link.textContent = item.label;
          if (item.external) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
          list.appendChild(link);
        });

        card.appendChild(groupLabel);
        card.appendChild(list);
        return card;
      }

      // "Game Elements" -> "game-elements". Kept deliberately dumb: anything a
      // group label can contain that is not a letter or a digit becomes a
      // single hyphen, so the result is a valid fragment for any label anyone
      // types, including the ampersand the old "Data & Research" carried.
      function groupAnchor(label) {
        return String(label || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'group';
      }

      /* THE FORMULA GROUP IS LAID OUT AS WHAT A GAME IS MADE OF.

         GAME INFO across the top; under it the three things a game names -- an
         ANCHOR EVENT, its AUDIENCES and a MAP -- and under the map what a map
         is made of: STOPS, each of them a WAYPOINT and a CHALLENGE.

         IT DREW AS AN EQUATION UNTIL 2026-08-31 (`waypoint + challenge = stop
         -> atlas`), which said one true thing about two of the rooms and could
         not say the rest: that all of it hangs off a GAME, and that the anchor
         and the audiences sit BESIDE the map rather than anywhere in that
         sentence. A breakdown says both at a glance, and it needs no signs --
         the ALIGNMENT is the statement, so `arrowSvg` and `flowMark` went with
         the +, the =, the arrow and the word under it.

         DRIVEN BY `group.flow`, NOT BY THE LABEL. A layout keyed on a string is
         a layout somebody breaks by renaming the group -- and this one has been
         renamed twice this month.

         AND IT DEGRADES RATHER THAN GUESSES: the chart is SEVEN named
         positions, so a group of any other size falls back to the ordinary row
         rather than dropping a room or inventing a place for one. */
      const FLOW_SLOTS = [
        "flow-game",       /* the whole thing hangs off this one */
        "flow-anchor",     /* why anybody is in the city */
        "flow-audience",   /* who it is pitched at, and who they are up against */
        "flow-map",        /* and the walk, which the three below are made of */
        "flow-stop",
        "flow-waypoint",
        "flow-challenge"
      ];

      function buildFlow(group, grid) {
        const items = group.items;
        if (items.length !== FLOW_SLOTS.length) return false;
        grid.classList.add("mc-hub-grid--flow");
        /* THE ORDER IS THE GROUP OWN, so the chart and the dropdown cannot
           disagree about which room is which: the nav lists these seven in the
           order the chart reads, top to bottom and left to right. */
        items.forEach((item, i) => {
          const c = buildItemCard(group, item);
          c.classList.add(FLOW_SLOTS[i]);
          /* THE GAME SAYS WHAT IT IS RATHER THAN WHAT THE ROOM DOES.
             It is set huge and centred as the title of the diagram, and at that
             size `Admins and AI build games here.` reads as a caption on the
             chart itself rather than as a description of one box.

             AND WITH THE `OPEN TOOL` BAR GONE, nothing on the card announced
             that it is pressable. The heading is in the accent and the card
             lifts on hover, which is the affordance -- but a 122px word set on
             its own reads as a HEADING, and a heading is the one thing on a page
             people do not try to click. So it says so.

             SET HERE RATHER THAN IN THE NAV DATA: `item.description` is what the
             dropdown and the directory print, and there the room's own sentence
             is right. Only the chart substitutes.

             AND SET RATHER THAN REMOVED. It was dropped outright for an hour;
             the element is reused so the card keeps its two-row template and its
             `align-content: start`, which is what stops the heading track
             stretching and pushing its own text down the card. */
          if (FLOW_SLOTS[i] === "flow-game") {
            const blurb = c.querySelector("p");
            if (blurb) blurb.textContent = "This is a button.";
          }
          grid.appendChild(c);
        });
        return true;
      }
      function renderDirectory() {
        const groups = window.TgbMcAdminNav.getGroups();
        groups.forEach((group) => {
          // A group flagged hubHidden lives in the dropdown only — it is already
          // on this page as an Ancillary Thing, and a second card is the same link
          // twice.
          if (group.hubHidden) return;

          const section = document.createElement('fieldset');
          section.className = 'mc-hub-group';
          // A stable anchor per section, derived from the label: "Game Builder"
          // -> #game-builder. The shared admin nav's GAMES button links straight
          // to one of these, so the id has to survive a re-render — deriving it
          // from the label rather than the loop index means reordering the
          // groups cannot silently repoint that link at the wrong section.
          section.id = groupAnchor(group.label);

          const legend = document.createElement('legend');
          legend.textContent = group.label;

          const grid = document.createElement('div');
          grid.className = 'mc-hub-grid';

          if (group.combined) {
            grid.appendChild(buildCombinedCard(group));
          } else if (!(group.flow && buildFlow(group, grid))) {
            group.items.forEach((item) => grid.appendChild(buildItemCard(group, item)));
          }

          section.appendChild(legend);
          section.appendChild(grid);
          directory.appendChild(section);
        });
      }

      renderDirectory();
      adminAuth.init();
    }());
  </script>
</body>
</html>
