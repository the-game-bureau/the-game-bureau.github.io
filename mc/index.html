<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MISSION CONTROL | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button { font: inherit; }

    .mc-hub-head {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(var(--bic-blue-rgb),0.08));
      box-shadow: 0 20px 44px var(--paper-shadow);
    }

    .mc-hub-kicker,
    .mc-hub-group-title,
    .mc-hub-card-group {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mc-hub-kicker {
      margin: 0;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .mc-hub-head h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
    }

    .mc-hub-intro {
      max-width: 720px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .mc-hub-directory {
      display: grid;
      gap: 24px;
    }

    .mc-hub-group {
      display: grid;
      gap: 10px;
    }

    .mc-hub-group-title {
      margin: 0;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .mc-hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .mc-hub-card {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
      min-height: 220px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.93);
      box-shadow: 0 12px 26px rgba(var(--bic-blue-rgb), 0.08);
      color: inherit;
      text-decoration: none;
      transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
    }

    .mc-hub-card:hover,
    .mc-hub-card:focus-visible {
      border-color: var(--bic-blue);
      box-shadow: 0 18px 34px rgba(var(--bic-blue-rgb), 0.16);
      outline: none;
      transform: translateY(-2px);
    }

    .mc-hub-card-group {
      font-size: 0.63rem;
      color: var(--muted);
    }

    .mc-hub-card h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.025em;
    }

    .mc-hub-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .mc-hub-card-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--bic-blue);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mc-hub-card-button::after {
      content: "\2192";
      font-size: 1rem;
    }

    /* Combined card: one panel that lists its links (e.g. the Gift Shop cluster). */
    .mc-hub-card--combined {
      grid-template-rows: auto auto 1fr;
    }

    .mc-hub-card--combined:hover,
    .mc-hub-card--combined:focus-within {
      transform: none;
      border-color: var(--line);
      box-shadow: 0 12px 26px rgba(var(--bic-blue-rgb), 0.08);
    }

    .mc-hub-links {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .mc-hub-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.6);
      color: inherit;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
    }

    .mc-hub-link::after {
      content: "\2192";
      color: var(--muted);
      font-size: 1rem;
    }

    .mc-hub-link.is-external::after {
      content: "\2197";
    }

    .mc-hub-link:hover,
    .mc-hub-link:focus-visible {
      border-color: var(--bic-blue);
      background: rgba(var(--bic-blue-rgb), 0.06);
      outline: none;
      transform: translateY(-1px);
    }

    @media (max-width: 720px) {
      .mc-hub-grid { grid-template-columns: 1fr; }
      .mc-hub-card { min-height: 190px; }
    }
  </style>
  <link rel="stylesheet" href="js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <header class="mc-hub-head">
      <p class="mc-hub-kicker">The Game Bureau</p>
      <h1>Mission Control</h1>
      <p class="mc-hub-intro">Build games, manage the website, batch-edit content, and open the reference tools used to keep everything moving.</p>
    </header>

    <div class="mc-hub-directory" id="mcHubDirectory"></div>
  </main>

  <script src="js/admin-auth.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin-nav-menu.js"></script>
  <script>
    (function () {
      'use strict';

      const SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };
      const directory = document.getElementById('mcHubDirectory');
      const adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG
      });

      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

      function buildItemCard(group, item) {
        const card = document.createElement('a');
        card.className = 'mc-hub-card';
        card.href = item.href;
        if (item.external) {
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
        }

        const groupLabel = document.createElement('span');
        groupLabel.className = 'mc-hub-card-group';
        groupLabel.textContent = group.label;

        const itemTitle = document.createElement('h2');
        itemTitle.textContent = item.label;

        const blurb = document.createElement('p');
        blurb.textContent = item.description || 'Open this Mission Control tool.';

        const button = document.createElement('span');
        button.className = 'mc-hub-card-button';
        button.textContent = item.external ? 'Open External' : 'Open Tool';

        card.appendChild(groupLabel);
        card.appendChild(itemTitle);
        card.appendChild(blurb);
        card.appendChild(button);
        return card;
      }

      // A "combined" group renders as ONE card that lists its links, instead of
      // one big card per item (used for the Gift Shop cluster).
      function buildCombinedCard(group) {
        const card = document.createElement('div');
        card.className = 'mc-hub-card mc-hub-card--combined';

        const groupLabel = document.createElement('span');
        groupLabel.className = 'mc-hub-card-group';
        groupLabel.textContent = group.label;

        const title = document.createElement('h2');
        title.textContent = group.label;

        const list = document.createElement('div');
        list.className = 'mc-hub-links';
        group.items.forEach((item) => {
          const link = document.createElement('a');
          link.className = 'mc-hub-link' + (item.external ? ' is-external' : '');
          link.href = item.href;
          link.textContent = item.label;
          if (item.external) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
          list.appendChild(link);
        });

        card.appendChild(groupLabel);
        card.appendChild(title);
        card.appendChild(list);
        return card;
      }

      function renderDirectory() {
        const groups = window.TgbMcAdminNav.getGroups();
        groups.forEach((group) => {
          const section = document.createElement('section');
          section.className = 'mc-hub-group';

          // No section heading — each card already shows its group name.
          const grid = document.createElement('div');
          grid.className = 'mc-hub-grid';

          if (group.combined) {
            grid.appendChild(buildCombinedCard(group));
          } else {
            group.items.forEach((item) => grid.appendChild(buildItemCard(group, item)));
          }

          section.appendChild(grid);
          directory.appendChild(section);
        });
      }

      renderDirectory();
      adminAuth.init();
    }());
  </script>
</body>
</html>
