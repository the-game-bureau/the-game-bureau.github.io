<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TRIVIA | THE GAME BUREAU</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/icon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      /* THE SOCIALIZER'S PALETTE. Copied, not approximated: mc/socializer/ is
         the reference room and this is a copy, so when either changes, change
         both. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --bic-red: #c23737;
      --success: #276740;
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
    }

    body {
      margin: 0; background: var(--paper-base); color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 15px;
    }
    .app { width: min(100%, var(--mc-shell-width, 1400px)); margin: 0 auto; padding: 0 18px 60px; }

    /* ---- bars ------------------------------------------------------------ */
    .bar-row { display: flex; gap: 10px; align-items: stretch; margin: 10px 0; flex-wrap: wrap; }
    .command-bar {
      margin: 0; border: 1px solid var(--cut-panel-line); border-radius: 8px;
      background: var(--cut-panel-bg); padding: 2px 9px 8px;
    }
    .command-bar > legend {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      padding: 0 6px; margin-left: 2px;
    }
    .command-bar-inner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* PICK TAKES THE SLACK. One flexible bar per row, or the free space splits
       between them and neither end of the row stays pinned. */
    .command-bar--pick { flex: 1 1 auto; min-width: 0; }
    .command-bar--play, .command-bar--score { flex: 0 0 auto; }
    .command-bar--pick select { flex: 1 1 200px; min-width: 0; max-width: 32ch; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 36px; padding: 0 12px;
      border: 1px solid var(--control-line); border-radius: 8px;
      background: #fff; color: var(--ink);
      font: 600 0.78rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: rgba(var(--bic-blue-rgb), 0.07); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #24396a; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    /* [hidden] HAS TO BE RE-ASSERTED over .btn's author display, or setting
       .hidden silently does nothing. A dozen instances of this in the repo. */
    .btn[hidden] { display: none !important; }

    input[type="text"], select {
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.86rem;
      color: var(--ink); background: #fff;
      border: 1px solid var(--control-line); border-radius: 7px;
      padding: 7px 9px; min-height: 34px;
    }
    .score { font: 600 0.78rem/1 'IBM Plex Mono', monospace; letter-spacing: 0.06em;
             color: var(--muted); white-space: nowrap; }
    .score b { color: var(--ink); font-size: 1.05rem; }

    /* ---- the table ------------------------------------------------------- */
    .panel {
      border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
      box-shadow: 0 1px 4px var(--paper-shadow); margin: 0 0 14px; overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; background: var(--cut-panel-bg); border-bottom: 1px solid var(--line);
    }
    .panel-title { font: 600 0.74rem/1 'IBM Plex Mono', monospace;
                   letter-spacing: 0.1em; text-transform: uppercase; }
    .panel-head .spacer { margin-left: auto; }
    /* THE LIST SCROLLS INSIDE ITS OWN PANEL rather than growing the document,
       so the head and the bars stay on screen. */
    .panel-body { max-height: 70vh; overflow: auto; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      position: sticky; top: 0; z-index: 1;
      background: var(--cut-panel-bg); text-align: left; white-space: nowrap;
      padding: 6px 12px; border-bottom: 1px solid var(--line);
      font: 600 0.62rem/1.2 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    tbody td {
      padding: 9px 12px; border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.09);
      font-size: 0.88rem; vertical-align: top;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--panel-soft); }
    tbody tr:last-child td { border-bottom: 0; }
    .col-key { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
               color: var(--muted); white-space: nowrap; }
    .col-q { font-weight: 500; }
    .col-a { white-space: nowrap; font-weight: 600; }
    .col-form { font: 500 0.7rem/1.2 'IBM Plex Mono', monospace; color: var(--muted);
                white-space: nowrap; }
    .col-play { text-align: right; white-space: nowrap; }

    .chip {
      display: inline-flex; align-items: center; padding: 3px 8px;
      border: 1px solid var(--control-line); border-radius: 999px;
      font: 600 0.6rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    /* TEAM AND CITY GET A GROUND OF THEIR OWN, so the two kinds of key are
       told apart down a column of rows without reading a word each time.

       THE COLOUR IS NEVER THE ONLY SIGNAL: every chip still carries its word,
       which is what survives a screenshot, a colourblind reader and a printer.
       The fill is reinforcement, not the message.

       THE AMBER IS THE EVENTS ROOM'S MEASURED ONE (122, 84, 12) rather than a
       fresh guess. A natural amber is simply light and comes out under 4.5:1 as
       small text on its own wash; that value was measured for exactly this job
       and is reused rather than re-derived. Contrast on the fills over paper:
       team 7.3:1, city 5.6:1, bad 4.6:1, all above 4.5 at 0.6rem. */
    .chip--team {
      background: rgba(var(--bic-blue-rgb), 0.12);
      border-color: rgba(var(--bic-blue-rgb), 0.45);
      color: var(--ink);
    }
    .chip--city {
      background: rgba(122, 84, 12, 0.13);
      border-color: rgba(122, 84, 12, 0.42);
      color: rgb(122, 84, 12);
    }
    /* A THIRD SHAPE, A THIRD GROUND. Green is free here: nothing in this room
       uses it semantically, and the chips carry their word either way. Measured
       the same way as the other two, 5.9:1 on its own fill. */
    .chip--waypoint {
      background: rgba(39, 103, 64, 0.12);
      border-color: rgba(39, 103, 64, 0.42);
      color: var(--success);
    }
    /* AN ID THAT RESOLVES TO NEITHER SHAPE IS A TYPO NOTHING ELSE CATCHES,
       because trivia.id is not a foreign key and cannot be one. Red pen, and
       the only chip here wearing a semantic colour. */
    /* A FAMILY IS VIOLET, MEASURED not picked: 6.6 to 1 as text on its own wash,
       the same way the team and city chips were checked. */
    .chip--family {
      background: rgba(106, 61, 140, 0.12);
      border-color: rgba(106, 61, 140, 0.42);
      color: rgb(106, 61, 140);
    }
    /* PORTABLE IS THE QUIETEST, which is the right weight: it is the LEAST
       specific rung and should not shout on a list where everything else is
       narrower. No fill, dashed, and it still carries its word. */
    .chip--portable { color: var(--muted); border-style: dashed; }
    .chip--bad {
      background: rgba(194, 55, 55, 0.10);
      border-color: var(--bic-red);
      color: var(--bic-red);
    }

    .empty { padding: 30px 26px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .empty b { color: var(--ink); }

    /* ---- the popup ------------------------------------------------------- */
    .dlg {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
      background: rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg.is-open { display: flex; }
    .dlg-panel {
      width: min(680px, 100%); background: #fff;
      border: 1px solid var(--cut-panel-line); border-radius: 12px;
      box-shadow: 0 10px 40px rgba(var(--bic-blue-rgb), 0.28);
    }
    .dlg-head {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      background: var(--cut-panel-bg); border-radius: 12px 12px 0 0;
    }
    .dlg-title { font: 700 0.9rem/1 'IBM Plex Mono', monospace;
                 letter-spacing: 0.08em; text-transform: uppercase; }
    .dlg-sub { font: 500 0.72rem/1 'IBM Plex Mono', monospace; color: var(--muted); }
    .dlg-head .spacer { margin-left: auto; }
    .dlg-body { padding: 20px 18px 6px; }
    .dlg-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px; border-top: 1px solid var(--line);
    }
    .dlg-foot .spacer { margin-left: auto; }

    .question { margin: 0 0 14px; font-size: 1.2rem; line-height: 1.35;
                font-weight: 500; text-wrap: balance; }
    /* THE STAKE IS QUIET AND THE NUMBER IS NOT. It sits between the question and
       the answers because that is the order somebody reads them in, and it is
       the last thing seen before a press. */
    .stake {
      margin: 0 0 16px;
      font: 500 0.68rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .stake b { font-size: 1.15rem; color: var(--ink); }

    .choices { display: grid; gap: 9px; }
    .choice {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 14px; text-align: left;
      border: 1px solid var(--control-line); border-radius: 9px;
      background: #fff; color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1rem;
      cursor: pointer;
    }
    .choice:hover:not(:disabled) { background: var(--panel-soft); }
    .choice:disabled { cursor: default; }
    .choice-key {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; border: 1px solid var(--control-line);
      font: 600 0.72rem/1 'IBM Plex Mono', monospace;
    }
    /* RIGHT AND WRONG ARE NOT COLOUR ALONE. Each carries a word, so a
       screenshot and a colourblind reader both keep the answer. */
    .choice.is-right { border-color: var(--success); background: rgba(39,103,64,0.09); color: var(--success); }
    .choice.is-right .choice-key { border-color: var(--success); }
    .choice.is-wrong { border-color: var(--bic-red); background: rgba(194,55,55,0.08); color: var(--bic-red); }
    .choice.is-wrong .choice-key { border-color: var(--bic-red); }
    .choice-mark { margin-left: auto; font: 600 0.64rem/1 'IBM Plex Mono', monospace;
                   letter-spacing: 0.1em; text-transform: uppercase; }

    .oneword { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .oneword input[type="text"] { flex: 1 1 240px; min-width: 0; min-height: 44px; font-size: 1rem; }

    .verdict { margin: 16px 0 0; font-size: 1rem; line-height: 1.45; }
    .verdict.is-right { color: var(--success); }
    .verdict.is-wrong { color: var(--bic-red); }

    @media (max-width: 760px) {
      .command-bar { flex: 1 1 100%; }
      .col-key, .col-form { display: none; }
    }

    /* ---- inline editing --------------------------------------------------
       BLACK AND BOLD MEANS YOU CAN CHANGE IT, at rest rather than on hover:
       a dotted underline that only appears under the pointer says nothing about
       the other cells you are looking at. Same affordance the Socializer's
       editable fields carry, and the same reason. */
    .ed { cursor: text; }
    .ed:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
    .ed:empty::before { content: attr(data-empty); color: var(--muted); font-style: italic; }
    .ed-box {
      width: 100%; min-width: 0;
      font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 0.88rem;
      color: var(--ink); background: #fff;
      border: 1px solid var(--ink); border-radius: 6px; padding: 5px 7px;
    }
    .col-choices { font-size: 0.8rem; color: var(--muted); }

    /* ---- the add dialog --------------------------------------------------- */
    .dlg-form { display: grid; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field > span {
      font: 600 0.64rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .field input { width: 100%; }
    .field small { color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
    .dlg-msg { color: var(--bic-red); font-size: 0.84rem; line-height: 1.4; }
    .dlg-msg:empty { display: none; }

    /* ---- the player ------------------------------------------------------- */
    .command-bar--score input[type="text"] { width: 13ch; }
</style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>

    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title" id="roomTitle">? QUESTIONS</h1>
        <p class="room-blurb">Trivia questions and answers for challenges.</p>
        <span class="status room-scribble" id="pageStatus" role="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="bar-row">
      <fieldset class="command-bar command-bar--add">
        <legend>Add</legend>
        <div class="command-bar-inner">
          <button type="button" class="btn" id="manualBtn">Manual</button>
        </div>
      </fieldset>

      <fieldset class="command-bar command-bar--play">
        <legend>Play</legend>
        <div class="command-bar-inner">
          <button type="button" class="btn primary" id="gameBtn">New game</button>
          <button type="button" class="btn" id="randomBtn">One question</button>
        </div>
      </fieldset>

      <fieldset class="command-bar command-bar--pick">
        <legend>Or pick</legend>
        <div class="command-bar-inner">
          <select id="cityPick" aria-label="City"><option value="">Any city</option></select>
          <select id="teamPick" aria-label="Team"><option value="">Any team</option></select>

  </main>

  <div class="dlg" id="playDlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-panel">
      <div class="dlg-head">
        <span class="dlg-title" id="dlgTitle">Question</span>
        <span class="dlg-sub" id="dlgSub"></span>
        <span class="spacer"></span>
        <span class="score" id="dlgScore"></span>
      </div>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-foot">
        <button type="button" class="btn" id="closeBtn">Close</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="nextBtn">Next question</button>
      </div>
    </div>
  </div>

  <div class="dlg" id="addDlg" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="dlg-panel">
      <div class="dlg-head">
        <span class="dlg-title" id="addTitle">Add a question</span>
        <span class="dlg-sub">The rules are in mc/_dev/prompt-tools/trivia.prompt.md</span>
      </div>
      <div class="dlg-body">
        <div class="dlg-form">
          <label class="field">
            <span>Keyed to</span>
            <input type="text" id="addId" list="placeList" autocomplete="off"
                   placeholder="denver-co or denver-co-nfl-broncos">
            <datalist id="placeList"></datalist>
            <small>A full destination id for a question about that team, or its
              city and state for one about the place.</small>
          </label>
          <label class="field">
            <span>Question</span>
            <input type="text" id="addQ" autocomplete="off"
                   placeholder="Which river runs through it?">
          </label>
          <label class="field">
            <span>Answer</span>
            <input type="text" id="addA" autocomplete="off" placeholder="Monongahela">
          </label>
          <label class="field">
            <span>Choices</span>
            <input type="text" id="addC" autocomplete="off"
                   placeholder="Allegheny / Monongahela / Ohio / Susquehanna">
            <small>Separated by a slash. Leave it empty for a typed answer, which
              must then be a single word.</small>
          </label>
        </div>
        <p class="dlg-msg" id="addMsg"></p>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn" id="addCancel">Cancel</button>
        <span class="spacer"></span>
        <button type="button" class="btn primary" id="addSave">Add question</button>
      </div>
    </div>
  </div>

  <script src="/mc/js/admin-site-nav.js"></script>
  <script src="/mc/js/admin-auth.js"></script>
  <script>

    /* ================================================================== *
     *  TRIVIA. The table of every question, editable in place, and a
     *  popup for playing one.
     *
     *  A GAME IS TEN QUESTIONS, dealt once so the header can say "3 of 10"
     *  on question one. A scope holding fewer plays short and says so;
     *  padding it would ask the same thing twice in one game.
     *
     *  TWO TRIES, AND THAT IS WHAT THE SCORING IS FOR: 7 right first time,
     *  3 right second, 0 otherwise. A wrong first answer marks the button
     *  and does NOT reveal the answer, or the second try would be free.
     *
     *  THE POINTS ARE NOT COMPUTED HERE ALONE. `scores` carries a CHECK
     *  that recomputes them from `correct` and `tries`, so a client that
     *  got the arithmetic wrong is refused rather than believed. Change
     *  the bands in both places, or the write simply starts failing.
     *
     *  WRITTEN ON SETTLE, ONCE PER QUESTION: right, or wrong the second
     *  time. Never on a first miss, which is the middle of a question.
     *
     *  THREE SHAPES, ALL DERIVED FROM THE KEY AND NONE OF THEM STORED:
     *    team      a full destinations.id
     *    city      its city and state prefix
     *    waypoint  wp-<wpid>, a question about one place on a route
     *
     *  THE ANSWER CONTROL FOLLOWS THE ROW: choices means buttons, no
     *  choices means a text box. The database allows nothing else.
     * ================================================================== */

    const SUPABASE_URL = 'https://qmaafbncpzrdmqapkkgr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3';

    const GAME_SIZE = 10;
    const FIRST_TRY = 7;
    const SECOND_TRY = 3;
    /* THE WAYPOINT PREFIX. `wp-` cannot collide with a destination key, which
       always begins with a city slug, and it is what tells a waypoint question
       from a city one without asking the database. */
    const WP = 'wp-';
    /* THE TWO BROADEST RUNGS. `*` is asked in every game there is and a family
       key in every game of that sport, so they are the highest-value rows in the
       table -- and both were EMPTY until the ladder made them reachable. The
       room has to know them or it draws them as a typo. */
    const PORTABLE = '*';

    const el = (id) => document.getElementById(id);
    const clean = (v) => (v === null || v === undefined ? '' : String(v).trim());

    const state = {
      trivia: [], destinations: [], waypoints: [], families: [],
      city: '', team: '',
      deck: [], current: null, shown: [], answered: false, given: '', right: false,
      tries: 0, missed: '',
      game: null,
      points: 0, asked: 0, loaded: false
    };

    let adminAuth = null;

    function restUrl(table, params) {
      const u = new URL(SUPABASE_URL + '/rest/v1/' + encodeURIComponent(table));
      Object.keys(params || {}).forEach((k) => u.searchParams.set(k, params[k]));
      return u.toString();
    }
    function authHeaders(extra) {
      const s = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      return Object.assign({
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + ((s && s.access_token) || SUPABASE_KEY),
        'Content-Type': 'application/json'
      }, extra || {});
    }

    /* TRANSLATE DATABASE ERRORS INTO SENTENCES. A raw 23514 naming a constraint
       is a statement about our schema; each one here says what to do instead. */
    async function readError(res, fallback) {
      let text = '';
      try { text = await res.text(); } catch (e) { text = ''; }
      if (/trivia_answer_is_a_choice/.test(text)) {
        return 'The answer has to be one of the choices, spelled the same way.';
      }
      if (/trivia_free_answer_is_one_word/.test(text)) {
        return 'With no choices the answer is typed, so it must be a single word. '
             + 'Add choices, or shorten the answer.';
      }
      if (/trivia_choices_enough/.test(text)) {
        return 'Two choices at least, or leave it empty for a typed answer.';
      }
      if (/trivia_no_one_word_prefix/.test(text)) {
        return 'A question may not open with "One word". Ask for a thing that is '
             + 'one word instead: the last name of, which river.';
      }
      if (/trivia_question_not_blank|trivia_answer_not_blank/.test(text)) {
        return 'A question and an answer are both required.';
      }
      if (/trivia_id_lower/.test(text)) return 'The key must be lowercase.';
      if (/scores_points_match_the_rules/.test(text)) {
        return 'The database refused the score: the points do not match the try it '
             + 'was won on. That is a bug in this page, not in your answer.';
      }
      if (/PGRST205.*trivia|relation .*trivia/.test(text)) {
        return 'There is no public.trivia table. Run mc/supabase/migrations/2026083006_trivia.sql.';
      }
      if (/PGRST205.*scores|relation .*scores/.test(text)) {
        return 'There is no public.scores table. Run mc/supabase/migrations/2026083015_scores.sql.';
      }
      if (/PGRST205.*destinations|relation .*destinations/.test(text)) {
        return 'There is no public.destinations table. Run mc/supabase/migrations/2026083004_destinations.sql.';
      }
      if (/42501|row-level security/.test(text)) return 'The database refused it. Sign in again.';
      return fallback + (text ? ' (' + text.slice(0, 160) + ')' : '');
    }

    let statusTimer = null;
    function setStatus(msg, tone) {
      const box = el('pageStatus');
      box.textContent = msg || '';
      box.className = 'status room-scribble' + (tone ? ' ' + tone : '');
      window.clearTimeout(statusTimer);
      /* An error stays until the next action; a success clears itself, because a
         stale line an hour later is a lie about what is currently true. */
      if (msg && tone !== 'error') statusTimer = window.setTimeout(() => {
        if (el('pageStatus').textContent === msg) el('pageStatus').textContent = '';
      }, 6000);
    }

    async function pageAll(table, params) {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const res = await fetch(restUrl(table, params), {
          headers: authHeaders({ Range: from + '-' + (from + 999) })
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not read ' + table + '.'));
        const page = await res.json();
        out.push(...page);
        if (page.length < 1000) break;
      }
      return out;
    }

    /* Every value drawn here is a row value going into an html string. A question
       carrying an ampersand is ordinary; one carrying a tag is not. */
    function esc(v) {
      return clean(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                     .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---- the keys --------------------------------------------------------- */

    /* THE SAME SLUG THE GENERATED COLUMN USES, so a prefix computed here and an
       id computed by Postgres agree. */
    const slug = (v) => clean(v).toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const cityKeyOf = (d) => slug(d.city) + '-' + slug(d.state);
    const wpKeyOf = (w) => WP + w.wpid;

    /* SHAPE IS DERIVED AND MUST NEVER BECOME A COLUMN: a stored copy of what the
       key already says is the fault that got `type` dropped. */
    function shapeOf(id) {
      const v = clean(id);
      if (!v) return '';
      if (v === PORTABLE) return 'portable';
      if (v.indexOf(WP) === 0) {
        return state.waypoints.some((w) => wpKeyOf(w) === v) ? 'waypoint' : '';
      }
      /* A FAMILY IS READ OFF THE AUDIENCES rather than from a list this page
         would have to keep in step with the database. */
      if (state.families.indexOf(v) >= 0) return 'family';
      if (state.destinations.some((d) => d.id === v)) return 'team';
      if (state.destinations.some((d) => d.id.indexOf(v + '-') === 0)) return 'city';
      return '';
    }
    function placeLabel(id) {
      const v = clean(id);
      if (v === PORTABLE) return 'anywhere, anyone';
      if (state.families.indexOf(v) >= 0) return 'the whole of ' + v.toUpperCase();
      if (v.indexOf(WP) === 0) {
        const w = state.waypoints.find((x) => wpKeyOf(x) === v);
        return w ? (clean(w.name) + (clean(w.city) ? ', ' + clean(w.city) : '')) : v;
      }
      const team = state.destinations.find((d) => d.id === v);
      if (team) return team.city + ', ' + team.state + ' ' + team.nickname;
      const any = state.destinations.find((d) => d.id.indexOf(v + '-') === 0);
      if (any) return any.city + ', ' + any.state;
      return v;
    }

    const inCity = (row, key) => row.id === key || clean(row.id).indexOf(key + '-') === 0;

    function pool() {
      if (state.team) return state.trivia.filter((r) => r.id === state.team);
      if (state.city) return state.trivia.filter((r) => inCity(r, state.city));
      return state.trivia.slice();
    }
    function scopeLabel() {
      if (state.team) return placeLabel(state.team);
      if (state.city) return placeLabel(state.city);
      return 'the whole table';
    }

    /* ---- writing ---------------------------------------------------------- */

    /* EVERY WRITE ASKS FOR THE ROW BACK. PostgREST answers 200 with an EMPTY
       ARRAY when RLS refuses, so without reading it a refused edit reports
       success and the page shows a value the table never took. */
    async function patchRow(row, patch) {
      const res = await fetch(restUrl('trivia', { trivia_id: 'eq.' + row.trivia_id }), {
        method: 'PATCH',
        headers: authHeaders({ Prefer: 'return=representation' }),
        body: JSON.stringify(patch)
      });
      if (!res.ok) throw new Error(await readError(res, 'Could not save.'));
      const rows = await res.json();
      if (!rows.length) throw new Error('The database refused the change. Sign in again.');
      Object.assign(row, rows[0]);
      return rows[0];
    }

    /* THE SCORE IS RECORDED ON SETTLE, ONCE PER QUESTION, and a failure to record
       is REPORTED rather than swallowed: a play that scored and was not written
       is indistinguishable from one that never happened. */
    async function recordScore(row, given, correct, tries) {
      const points = correct ? (tries === 1 ? FIRST_TRY : tries === 2 ? SECOND_TRY : 0) : 0;
      try {
        const res = await fetch(restUrl('scores', {}), {
          method: 'POST',
          headers: authHeaders({ Prefer: 'return=representation' }),
          body: JSON.stringify({
            player: clean(el('player').value),   // blank becomes anon in the database
            area: 'trivia',
            subject_id: String(row.trivia_id),
            answer_given: clean(given),
            correct: correct,
            tries: tries,
            points: points
          })
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not record the score.'));
        const back = await res.json();
        if (!back.length) throw new Error('The database refused the score.');
      } catch (err) {
        setStatus(err.message || 'Could not record the score.', 'error');
      }
      return points;
    }

    /* ---- the deck and the game -------------------------------------------- */

    /* A SHUFFLED DECK, NOT A DRAW PER PRESS. Drawing at random every time asks
       the same question twice before it has asked half of them. */
    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function startGame() {
      const rows = shuffle(pool());
      if (!rows.length) {
        setStatus('Nothing keyed to ' + scopeLabel() + ' yet, so there is no game to play.', 'error');
        return;
      }
      state.game = { rows: rows.slice(0, GAME_SIZE), at: 0, points: 0, won: 0 };
      /* A SCOPE WITH FEWER THAN TEN PLAYS SHORT AND SAYS SO. Padding it would ask
         the same question twice in one game, and rounding the count up would be
         the room lying about its own length. */
      if (state.game.rows.length < GAME_SIZE) {
        setStatus(scopeLabel() + ' holds only ' + state.game.rows.length
          + (state.game.rows.length === 1 ? ' question' : ' questions')
          + ', so this game is that long.', '');
      } else {
        setStatus('');
      }
      open(state.game.rows[0]);
    }
    function advanceGame() {
      const g = state.game;
      g.at += 1;
      if (g.at >= g.rows.length) { paintDialog(); return; }
      open(g.rows[g.at]);
    }
    function drawNext() {
      if (!state.deck.length) {
        state.deck = shuffle(pool());
        if (state.deck.length > 1 && state.current
            && state.deck[0].trivia_id === state.current.trivia_id) {
          state.deck.push(state.deck.shift());
        }
      }
      const row = state.deck.shift();
      if (!row) { setStatus('Nothing keyed to ' + scopeLabel() + ' yet.', 'error'); return; }
      open(row);
    }

    /* ---- judging ---------------------------------------------------------- */

    /* CASE AND SURROUNDING SPACE ONLY. A typed answer is refused by the database
       if it holds a space, so there is nothing else to forgive, and forgiving
       more would start accepting a different word. */
    const same = (a, b) => clean(a).toLowerCase() === clean(b).toLowerCase();

    function judge(given) {
      if (state.answered || !state.current) return;
      const row = state.current;
      state.tries += 1;
      state.given = clean(given);
      const right = same(given, row.answer);

      /* A WRONG FIRST ANSWER REVEALS NOTHING. Showing the answer would make the
         second try free, and the second try is the whole reason 3 points exist. */
      if (!right && state.tries < 2) {
        state.missed = state.given;
        paintDialog();
        return;
      }

      state.answered = true;
      state.right = right;
      state.asked += 1;
      const points = right ? (state.tries === 1 ? FIRST_TRY : SECOND_TRY) : 0;
      state.points += points;
      if (state.game) { state.game.points += points; if (right) state.game.won += 1; }
      paintScore();
      paintDialog();
      recordScore(row, given, right, state.tries);
    }

    /* ---- the popup -------------------------------------------------------- */

    function open(row) {
      state.current = row;
      /* SHUFFLED ONCE PER OPEN, NOT IN paintDialog, which runs again the moment
         an answer is judged and would move the buttons under the pointer. */
      state.shown = Array.isArray(row.choices) ? shuffle(row.choices) : [];
      state.answered = false;
      state.given = '';
      state.missed = '';
      state.right = false;
      state.tries = 0;
      el('playDlg').classList.add('is-open');
      paintDialog();
    }
    function close() {
      el('playDlg').classList.remove('is-open');
      state.current = null;
      state.answered = false;
      /* CLOSING ABANDONS THE GAME rather than leaving it half played behind a
         shut dialog, where New game would look like it had done nothing. */
      state.game = null;
    }

    function paintDialog() {
      const g = state.game;

      /* THE RESULT SCREEN, in the same panel rather than a second dialog over the
         first: a panel that changes its mind beats a stack. */
      if (g && g.at >= g.rows.length) {
        el('dlgTitle').textContent = 'Game over';
        el('dlgSub').textContent = scopeLabel();
        el('dlgScore').textContent = '';
        el('dlgBody').innerHTML =
          '<p class="question"><b>' + g.points + '</b> points, '
          + g.won + ' of ' + g.rows.length + ' right.</p>'
          + '<p class="verdict' + (g.won === g.rows.length ? ' is-right' : '') + '">'
          + (g.won === g.rows.length ? 'Every one.'
             : g.won === 0 ? 'Not one. The city wins.'
             : 'The rest are still in the table.') + '</p>';
        el('nextBtn').textContent = 'Play again';
        return;
      }

      const row = state.current;
      if (!row) return;
      const shape = shapeOf(row.id);

      el('dlgTitle').textContent = g
        ? 'Question ' + (g.at + 1) + ' of ' + g.rows.length
        : 'Question';
      el('nextBtn').textContent = g
        ? (g.at + 1 >= g.rows.length ? 'See the score' : 'Next question')
        : 'Next question';
      el('dlgSub').textContent = placeLabel(row.id)
        + '  ' + (shape || 'unknown key') + '  ' + row.id;
      el('dlgScore').innerHTML = g
        ? ('<b>' + g.points + '</b> pts')
        : ('<b>' + state.points + '</b> pts');

      const parts = ['<p class="question">' + esc(row.question) + '</p>'];

      /* WHAT THIS ANSWER IS WORTH, RIGHT NOW. The header counts what you have
         already won, which is a different question from what is on the table,
         and the drop from 7 to 3 is the whole reason to think before pressing.
         Drawn only while the question is open: once it is settled the verdict
         says what was actually scored, and two numbers would disagree. */
      if (!state.answered) {
        parts.push('<p class="stake">Playing for <b>'
          + (state.tries === 0 ? FIRST_TRY : SECOND_TRY) + '</b> points</p>');
      }

      const choices = state.shown.length ? state.shown : null;

      if (choices && choices.length) {
        parts.push('<div class="choices" id="choices">');
        choices.forEach((c, i) => {
          let cls = 'choice', mark = '', dead = false;
          if (state.answered) {
            if (same(c, row.answer)) { cls += ' is-right'; mark = 'Correct'; }
            else if (same(c, state.given) || same(c, state.missed)) {
              cls += ' is-wrong'; mark = 'You said';
            }
            dead = true;
          } else if (state.missed && same(c, state.missed)) {
            /* THE FIRST MISS STAYS MARKED AND DEAD, or somebody could spend the
               second try on the answer they have already given. */
            cls += ' is-wrong'; mark = 'You said'; dead = true;
          }
          parts.push('<button type="button" class="' + cls + '" data-choice="' + i + '"'
            + (dead ? ' disabled' : '') + '>'
            + '<span class="choice-key">' + 'ABCDEFGH'.charAt(i) + '</span>'
            + '<span>' + esc(c) + '</span>'
            + (mark ? '<span class="choice-mark">' + mark + '</span>' : '')
            + '</button>');
        });
        parts.push('</div>');
      } else {
        parts.push('<div class="oneword">'
          + '<input type="text" id="wordBox" placeholder="One word" autocomplete="off"'
          + ' autocapitalize="off" spellcheck="false"'
          + (state.answered ? ' disabled value="' + esc(state.given) + '"' : '') + '>'
          + '<button type="button" class="btn primary" id="wordBtn"'
          + (state.answered ? ' disabled' : '') + '>Answer</button></div>');
      }

      if (state.answered) {
        const points = state.right ? (state.tries === 1 ? FIRST_TRY : SECOND_TRY) : 0;
        parts.push('<p class="verdict ' + (state.right ? 'is-right' : 'is-wrong') + '">'
          + (state.right
              ? 'Right on try ' + state.tries + '. <b>' + points + '</b> points.'
              : 'Wrong twice. The answer is <b>' + esc(row.answer) + '</b>.') + '</p>');
      } else if (state.missed) {
        parts.push('<p class="verdict is-wrong">Not that one. One more try.</p>');
      }

      el('dlgBody').innerHTML = parts.join('');

      /* WIRED DEFENSIVELY, one control at a time. A dead reference here would take
         the rest of the block down with it, which in this room means a question
         you can read and cannot answer. */
      const box = el('choices');
      if (box) box.addEventListener('click', (e) => {
        const b = e.target.closest('[data-choice]');
        if (b && !b.disabled && !state.answered) judge(choices[Number(b.dataset.choice)]);
      });
      const wordBtn = el('wordBtn'), wordBox = el('wordBox');
      if (wordBtn && wordBox) {
        wordBtn.addEventListener('click', () => judge(wordBox.value));
        wordBox.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); judge(wordBox.value); }
        });
        if (!state.answered) wordBox.focus();
      }
    }

    /* ---- the table -------------------------------------------------------- */

    function paintScore() {
      el('score').innerHTML = '<b>' + state.points + '</b> pts';
      el('resetBtn').disabled = state.asked === 0;
    }

    const choicesText = (r) => Array.isArray(r.choices) && r.choices.length
      ? r.choices.join(' / ') : '';

    function paintTable() {
      const rows = pool();
      const host = el('tableHost');
      el('deckCount').textContent = rows.length
        ? rows.length + (rows.length === 1 ? ' question' : ' questions') + ' from ' + scopeLabel()
        : 'nothing from ' + scopeLabel();

      if (!state.loaded) { host.innerHTML = '<p class="empty">Loading.</p>'; return; }
      if (!rows.length) {
        host.innerHTML = '<p class="empty">' + (state.trivia.length
          ? 'Nothing keyed to <b>' + esc(scopeLabel()) + '</b> yet. Clear the pickers, or press Manual to add one.'
          : 'No questions on file. Press Manual to add one. The rules are in <b>mc/_dev/prompt-tools/trivia.prompt.md</b>.') + '</p>';
        return;
      }

      const body = rows.map((r) => {
        const shape = shapeOf(r.id);
        return '<tr data-row="' + r.trivia_id + '">'
          + '<td><span class="chip chip--' + (shape || 'bad') + '">'
            + (shape || 'no such place') + '</span></td>'
          + '<td class="col-key ed" data-field="id" data-empty="key">' + esc(r.id) + '</td>'
          + '<td class="col-q ed" data-field="question" data-empty="question">' + esc(r.question) + '</td>'
          + '<td class="col-a ed" data-field="answer" data-empty="answer">' + esc(r.answer) + '</td>'
          + '<td class="col-choices ed" data-field="choices" data-empty="typed answer">'
            + esc(choicesText(r)) + '</td>'
          + '<td class="col-play"><button type="button" class="btn" data-play="'
            + r.trivia_id + '">Play</button></td></tr>';
      }).join('');

      host.innerHTML = '<table><thead><tr>'
        + '<th>Shape</th><th>Keyed to</th><th>Question</th><th>Answer</th>'
        + '<th>Choices</th><th></th></tr></thead><tbody>' + body + '</tbody></table>';
    }

    /* ---- editing in place -------------------------------------------------- */

    let editing = null;

    function startEdit(td) {
      if (editing) return;
      const tr = td.closest('[data-row]');
      const row = state.trivia.find((r) => String(r.trivia_id) === tr.dataset.row);
      if (!row) return;
      const field = td.dataset.field;
      const was = field === 'choices' ? choicesText(row) : clean(row[field]);

      /* THE TOKEN IS THE WHOLE POINT. `finish` used to test `if (!editing)`,
         which is true of ANY edit rather than THIS one -- so clicking a second
         cell focused its box, BLURRED the first, and the first box's blur
         handler fired with `editing` already pointing at the new edit. It then
         committed the OLD field again from its own closure and cancelled the
         new edit on the way out. Two identical patches and a cell that would
         not open. Comparing the token means a stale handler cannot speak. */
      const token = {};
      editing = { td: td, row: row, field: field, token: token };
      td.textContent = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ed-box';
      input.value = was;
      td.appendChild(input);
      input.focus();
      input.select();

      const finish = (save) => {
        if (!editing || editing.token !== token) return;
        const value = input.value;
        editing = null;
        if (!save || value === was) { redraw(); return; }
        commit(row, field, value);
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        /* ESCAPE MUST NOT REACH THE DOCUMENT HANDLER, which closes a dialog.
           Cancelling an edit and shutting a popup are different intentions. */
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }

    function redraw() { paintTable(); buildPickers(); }

    /* CHOICES ARE TYPED AS A SLASH SEPARATED LINE and stored as an array. An
       empty line is NULL, not an empty array: null is what the database reads as
       "typed answer", and an empty array would fail the two-choice CHECK with a
       message about a state nobody meant.

       THE ANSWER AND THE CHOICES ARE ONE EDIT, NOT TWO. `trivia_answer_is_a_choice`
       refuses an answer that is not among its own options, so editing the answer
       alone on a multiple choice row was ALWAYS refused -- correctly, and it read
       as the cell simply not writing. Both halves now travel in ONE patch, which
       is also the only way they can travel: sent separately, whichever went first
       would be refused for disagreeing with the half still to come. */
    function commit(row, field, value) {
      const patch = {};
      const had = Array.isArray(row.choices) && row.choices.length
        ? row.choices.slice() : null;

      if (field === 'choices') {
        const list = clean(value).split('/').map((v) => v.trim()).filter(Boolean);
        patch.choices = list.length ? list : null;
        /* REWORDING THE CORRECT OPTION MOVES THE ANSWER WITH IT, matched by
           POSITION. Nothing else can identify it: the text is exactly what just
           changed, so the slot is the only stable handle. */
        if (list.length && !list.some((c) => same(c, row.answer))) {
          const at = had ? had.findIndex((c) => same(c, row.answer)) : -1;
          /* If the slot is gone the answer is left alone and the database
             refuses, which is the honest outcome: nothing here knows which of
             the new options was meant to be right. */
          if (at >= 0 && at < list.length) patch.answer = list[at];
        }
      } else if (field === 'answer') {
        const next = clean(value);
        patch.answer = next;
        if (had) {
          /* TYPING AN OPTION THAT IS ALREADY THERE just moves which one is
             correct, and the list does not change. Typing something NEW replaces
             the option that was correct, in its own slot, so the shuffle order
             and the other three distractors survive. */
          if (!had.some((c) => same(c, next))) {
            const at = had.findIndex((c) => same(c, row.answer));
            const list = had.slice();
            if (at >= 0) list[at] = next; else list.push(next);
            patch.choices = list;
          }
        }
      } else {
        patch[field] = field === 'id' ? clean(value).toLowerCase() : clean(value);
      }
      patchRow(row, patch).then(() => {
        setStatus('Saved.', '');
        redraw();
      }).catch((err) => {
        setStatus(err.message || 'Could not save.', 'error');
        redraw();
      });
    }

    /* ---- the pickers ------------------------------------------------------ */

    /* BUILT FROM THE ROWS THAT EXIST, so a picker can only offer a choice with
       questions behind it: an empty result is not a state either can produce. */
    function buildPickers() {
      const cities = {}, teams = {};
      state.destinations.forEach((d) => {
        const ck = cityKeyOf(d);
        if (!cities[ck]) cities[ck] = { label: d.city + ', ' + d.state, n: 0 };
        teams[d.id] = { label: d.city + ' ' + d.nickname + ' (' + d.league + ')', n: 0 };
      });
      state.trivia.forEach((r) => {
        Object.keys(cities).forEach((k) => { if (inCity(r, k)) cities[k].n += 1; });
        if (teams[r.id]) teams[r.id].n += 1;
      });
      fill('cityPick', 'Any city', cities, state.city);
      fill('teamPick', 'Any team', teams, state.team);
    }
    function fill(id, anyLabel, map, keep) {
      const sel = el(id);
      sel.textContent = '';
      const any = document.createElement('option');
      any.value = '';
      any.textContent = anyLabel + ' (' + state.trivia.length + ')';
      sel.appendChild(any);
      /* A PLACE WITH NOTHING BEHIND IT IS NOT OFFERED. 110 destinations against a
         handful of questions would be a list of dead ends. */
      Object.keys(map).filter((k) => map[k].n > 0)
        .sort((a, b) => map[a].label.localeCompare(map[b].label))
        .forEach((k) => {
          const o = document.createElement('option');
          o.value = k;
          o.textContent = map[k].label + ' (' + map[k].n + ')';
          sel.appendChild(o);
        });
      const has = Array.prototype.some.call(sel.options, (o) => o.value === keep);
      sel.value = has ? keep : '';
      if (!has) { if (id === 'cityPick') state.city = ''; else state.team = ''; }
    }

    /* THE ADD DIALOG'S KEY LIST OFFERS EVERY PLACE, not only the ones already
       holding a question: this is where a new place gets its first. Waypoints
       are capped, because 536 options in a datalist is a scroll and not a list;
       the box takes a typed wp- key whether or not it is offered. */
    const WP_SUGGESTIONS = 60;
    function buildPlaceList() {
      const list = el('placeList');
      if (!list) return;
      const keys = {};
      state.destinations.forEach((d) => {
        keys[d.id] = d.city + ' ' + d.nickname + ' (' + d.league + ')';
        keys[cityKeyOf(d)] = d.city + ', ' + d.state;
      });
      state.waypoints.slice(0, WP_SUGGESTIONS).forEach((w) => {
        keys[wpKeyOf(w)] = clean(w.name) + (clean(w.city) ? ', ' + clean(w.city) : '');
      });
      list.textContent = '';
      Object.keys(keys).sort().forEach((k) => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = keys[k];
        list.appendChild(o);
      });
    }

    function paintClear() {
      const on = !!(state.city || state.team);
      const b = el('clearBtn');
      b.setAttribute('aria-disabled', on ? 'false' : 'true');
      b.style.opacity = on ? '' : '0.45';
    }

    /* CHOOSING ONE PICKER CLEARS THE OTHER: they select overlapping sets from two
       angles, so holding both would leave a short list with two reasons. */
    function afterPick() {
      paintClear();
      state.deck = [];
      paintTable();
    }
    function chooseCity() {
      state.city = el('cityPick').value;
      if (state.city) { state.team = ''; el('teamPick').value = ''; }
      afterPick();
    }
    function chooseTeam() {
      state.team = el('teamPick').value;
      if (state.team) { state.city = ''; el('cityPick').value = ''; }
      afterPick();
    }

    /* ---- adding ------------------------------------------------------------ */

    function openAdd() {
      ['addQ', 'addA', 'addC'].forEach((k) => { el(k).value = ''; });
      el('addMsg').textContent = '';
      /* PREFILLED FROM THE PICKER when one is on, because the commonest reason to
         press Manual is that the place you are looking at is short. */
      el('addId').value = state.team || state.city || '';
      el('addDlg').classList.add('is-open');
      el('addId').focus();
    }
    function closeAdd() { el('addDlg').classList.remove('is-open'); }

    async function saveAdd() {
      const id = clean(el('addId').value).toLowerCase();
      const question = clean(el('addQ').value);
      const answer = clean(el('addA').value);
      const list = clean(el('addC').value).split('/').map((v) => v.trim()).filter(Boolean);
      const msg = el('addMsg');

      /* CHECKED HERE AND ENFORCED THERE. Every one of these is refused by the
         database too; catching them first means a sentence rather than a round
         trip, and the room and the constraints cannot disagree because the
         constraints are what actually decide. */
      if (!id || !question || !answer) {
        msg.textContent = 'A key, a question and an answer are all required.';
        return;
      }
      if (!shapeOf(id)) {
        msg.textContent = 'Nothing matches ' + id + '. Pick a key from the list, or '
          + 'use wp- and a waypoint id for a question about one place.';
        return;
      }
      if (/^one word/i.test(question)) {
        msg.textContent = 'A question may not open with "One word". Ask for a thing '
          + 'that is one word instead: the last name of, which river.';
        return;
      }
      if (list.length === 1) {
        msg.textContent = 'Two choices at least, or leave it empty for a typed answer.';
        return;
      }
      if (list.length && !list.some((c) => same(c, answer))) {
        msg.textContent = 'The answer has to be one of the choices, spelled the same way.';
        return;
      }
      if (!list.length && /\s/.test(answer)) {
        msg.textContent = 'With no choices the answer is typed, so it must be a single word.';
        return;
      }

      el('addSave').disabled = true;
      try {
        const res = await fetch(restUrl('trivia', {}), {
          method: 'POST',
          headers: authHeaders({ Prefer: 'return=representation' }),
          body: JSON.stringify({ id: id, question: question, answer: answer,
                                 choices: list.length ? list : null })
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not add it.'));
        const back = await res.json();
        if (!back.length) throw new Error('The database refused it. Sign in again.');
        state.trivia.push(back[0]);
        closeAdd();
        redraw();
        el('roomTitle').textContent = state.trivia.length + ' QUESTIONS';
        setStatus('Added, keyed to ' + placeLabel(id) + '.', '');
      } catch (err) {
        msg.textContent = err.message || 'Could not add it.';
      } finally {
        el('addSave').disabled = false;
      }
    }

    /* ---- boot ------------------------------------------------------------- */

    async function boot() {
      try {
        setStatus('Loading.', '');
        /* WAYPOINTS ARE READ FOR THEIR NAMES ONLY, which is why the select is
           three columns rather than *: a waypoint row carries a description and
           a source url this room never shows. */
        const [trivia, destinations, waypoints] = await Promise.all([
          pageAll('trivia', { select: '*', order: 'trivia_id.asc' }),
          pageAll('destinations', { select: '*', order: 'id.asc' }),
          pageAll('waypoints', { select: 'wpid,name,city', order: 'name.asc' })
            .catch(() => [])
        ]);
        state.trivia = trivia;
        state.destinations = destinations;
        state.waypoints = waypoints;
        /* READ OFF THE DESTINATIONS, so a family invented tomorrow needs no edit
           here. They carry the league in upper case; a trivia key is lowercase
           by CHECK, so it is folded down. */
        state.families = [...new Set(destinations.map(
          (d) => clean(d.league).toLowerCase()).filter(Boolean))];
        state.loaded = true;

        const n = trivia.length;
        el('roomTitle').textContent = n + (n === 1 ? ' QUESTION' : ' QUESTIONS');

        buildPickers();
        buildPlaceList();
        paintClear();
        paintScore();
        paintTable();

        /* A KEY THAT RESOLVES TO NO SHAPE IS A TYPO NOTHING ELSE CATCHES.
           trivia.id is not a foreign key and cannot be one, so this room is the
           only place it will ever be reported. */
        const orphans = [...new Set(trivia.map((r) => r.id).filter((id) => !shapeOf(id)))];
        if (orphans.length) {
          setStatus(orphans.length + (orphans.length === 1 ? ' question is' : ' questions are')
            + ' keyed to nothing that exists: ' + orphans.join(', ')
            + '. Fix the key, or add the destination or waypoint.', 'error');
        } else {
          setStatus('');
        }
      } catch (err) {
        state.loaded = true;
        el('tableHost').innerHTML = '<p class="empty">Could not load.</p>';
        setStatus(err.message || 'Could not load.', 'error');
      }
    }

    /* BOUND ONCE, ON THE HOST, NOT INSIDE paintTable -- that runs on every pick
       and every save, so binding there stacks a listener per repaint. */
    el('tableHost').addEventListener('click', (e) => {
      const play = e.target.closest('[data-play]');
      if (play) {
        const row = state.trivia.find((r) => String(r.trivia_id) === play.dataset.play);
        /* PLAYING ONE FROM THE TABLE LEAVES ANY GAME, or the header would count a
           question that is not among the ten that were dealt. */
        if (row) { state.game = null; open(row); }
        return;
      }
      const cell = e.target.closest('.ed');
      if (cell && !editing) startEdit(cell);
    });

    el('manualBtn').addEventListener('click', openAdd);
    el('addCancel').addEventListener('click', closeAdd);
    el('addSave').addEventListener('click', saveAdd);
    el('addDlg').addEventListener('click', (e) => { if (e.target === el('addDlg')) closeAdd(); });

    el('gameBtn').addEventListener('click', () => { state.deck = []; startGame(); });
    el('randomBtn').addEventListener('click', () => {
      /* ONE QUESTION DRAWS FROM THE SCOPE ON SCREEN. Unlike New game it does not
         clear the pickers: they say what you are looking at, and pressing this
         should not silently widen it. */
      state.game = null;
      drawNext();
    });
    el('cityPick').addEventListener('change', chooseCity);
    el('teamPick').addEventListener('change', chooseTeam);
    el('clearBtn').addEventListener('click', () => {
      if (el('clearBtn').getAttribute('aria-disabled') === 'true') {
        setStatus('Nothing is picked.', '');
        return;
      }
      state.city = ''; state.team = '';
      el('cityPick').value = ''; el('teamPick').value = '';
      afterPick();
    });
    el('resetBtn').addEventListener('click', () => {
      state.points = 0; state.asked = 0;
      paintScore();
      /* THE TABLE IS NOT TOUCHED, and the message says so: `scores` is append
         only and a row already written is a record of something that happened. */
      setStatus('Score reset. What is already in scores stays there.', '');
    });
    el('nextBtn').addEventListener('click', () => {
      const g = state.game;
      if (g && g.at >= g.rows.length) { startGame(); return; }
      if (g) { advanceGame(); return; }
      drawNext();
    });
    el('closeBtn').addEventListener('click', close);
    el('playDlg').addEventListener('click', (e) => { if (e.target === el('playDlg')) close(); });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      /* THE ADD DIALOG IS ON TOP WHEN IT IS OPEN, so it takes Escape first. */
      if (el('addDlg').classList.contains('is-open')) { closeAdd(); return; }
      if (el('playDlg').classList.contains('is-open')) close();
    });

    adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: { url: SUPABASE_URL, publishableKey: SUPABASE_KEY },
      onAuthorized: () => { boot(); }
    });
    if (window.TgbAdminSiteNav && window.TgbAdminSiteNav.bindAuth) {
      window.TgbAdminSiteNav.bindAuth(adminAuth);
    }
    adminAuth.init();
  </script>
</body>
</html>
