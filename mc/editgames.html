<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… | The Game Bureau</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://thegamebureau.com/mc/marquee.html">
  <!-- editgames.html was merged into what is now mc/marquee.html. This stub
       forwards any old bookmarks / links to the game editor, preserving the
       query string so editgames.html?id=… lands on marquee.html?id=….
       The target moved twice: mc/editgames.html -> games/admin/marquee.html
       (merge) -> mc/marquee.html (2026-08-07). Only this stub survives both,
       because GitHub Pages serves no 301 and a moved page leaves nothing
       behind unless someone parks a file at the old path. -->
  <script>
    (function () {
      var target = '/mc/marquee.html' + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
  <!-- No-JS fallback (does not carry the query string, but still lands on the editor). -->
  <meta http-equiv="refresh" content="0; url=/mc/marquee.html">
</head>
<body>
  <p>This page moved to <a href="/mc/marquee.html">mc/marquee.html</a>. Redirecting…</p>
</body>
</html>
