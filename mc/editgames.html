<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… | The Game Bureau</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://thegamebureau.com/games/admin/profiles.html">
  <!-- editgames.html was merged into what is now games/admin/profiles.html. This
       stub forwards any old
       bookmarks / links to the game editor, preserving the query string so
       editgames.html?id=… lands on profiles.html?id=…. -->
  <script>
    (function () {
      var target = '/games/admin/profiles.html' + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
  <!-- No-JS fallback (does not carry the query string, but still lands on the editor). -->
  <meta http-equiv="refresh" content="0; url=/games/admin/profiles.html">
</head>
<body>
  <p>This page moved to <a href="/games/admin/profiles.html">games/admin/profiles.html</a>. Redirecting…</p>
</body>
</html>
