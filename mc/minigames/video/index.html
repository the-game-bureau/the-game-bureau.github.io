<!--
AI_VIDEO_CLIP_PROMPT

Find one embeddable YouTube clip for this pro-sports video trivia mini-game, then append one object to the CLIPS array below.

Requirements:
- Use a professional sports clip only: NBA, WNBA, NFL, MLB, NHL, MLS, NWSL, Premier League, UEFA, international pro soccer, or another clearly professional league.
- Prefer an official league, team, broadcaster, or verified media-channel upload.
- Avoid YouTube Shorts. Use a normal watch/embed video that works in an iframe.
- Verify the embed URL loads: https://www.youtube.com/embed/{youtubeId}. Do not use videos that say "Video unavailable."
- Pick a clip short enough for a quick mini-game, ideally a single highlight or compact recap.
- Write a question that is answerable by watching the clip and is not fully spoiled by the video title.
- Include exactly four answer choices and set answerIndex to the zero-based index of the correct choice.
- Keep the explanation to one sentence.

Return ONLY this JavaScript object shape, with no Markdown:
{
  id: "unique-slug",
  title: "Public-facing clip title",
  eyebrow: "League or event label",
  matchup: "Team/player context",
  youtubeId: "11_character_video_id",
  youtubeUrl: "https://www.youtube.com/watch?v=11_character_video_id",
  question: "Trivia question?",
  choices: ["Choice A", "Choice B", "Choice C", "Choice D"],
  answerIndex: 0,
  explanation: "One-sentence answer explanation."
}
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101820" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Video Trivia | The Game Bureau</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <style>
    :root {
      --bg: #101820;
      --panel: rgba(12, 18, 26, 0.9);
      --panel-strong: rgba(22, 30, 42, 0.96);
      --ink: #fff7dd;
      --muted: rgba(255, 247, 221, 0.66);
      --line: rgba(255, 247, 221, 0.18);
      --line-strong: rgba(255, 247, 221, 0.34);
      --accent: #d3bc8d;
      --accent-dark: #776540;
      --good: #6ed78f;
      --bad: #ff7b66;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(211, 188, 141, 0.18), transparent 36%),
        radial-gradient(circle at 80% 0%, rgba(99, 137, 193, 0.16), transparent 34%),
        linear-gradient(180deg, #101820 0%, #070b10 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .game-shell {
      width: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
      overflow-x: hidden;
    }

    .game-card {
      width: calc(100vw - 24px);
      max-width: 980px;
      min-width: 0;
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.014)),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .topbar {
      min-width: 0;
      display: grid;
      gap: 6px;
      text-align: center;
    }

    .kicker {
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.42rem, 6vw, 2.55rem);
      font-weight: 950;
      line-height: 0.98;
      letter-spacing: 0;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 38rem;
      color: var(--muted);
      font-size: clamp(0.88rem, 2.8vw, 1rem);
      font-weight: 750;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }

    .clip-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #020408;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      aspect-ratio: 16 / 9;
    }

    .clip-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #020408;
    }

    .clip-meta {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
    }

    .pill,
    .source-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .source-link {
      color: var(--accent);
    }

    .quiz-panel {
      min-width: 0;
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
    }

    .question {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.05rem, 4.2vw, 1.38rem);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .choices {
      display: grid;
      gap: 8px;
    }

    .choice {
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      cursor: pointer;
      font-size: 0.96rem;
      font-weight: 850;
      line-height: 1.15;
      text-align: left;
      overflow-wrap: anywhere;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      border-color: var(--accent);
      background: rgba(211, 188, 141, 0.14);
      outline: none;
    }

    .choice:active {
      transform: scale(0.99);
    }

    .choice.is-correct {
      border-color: rgba(110, 215, 143, 0.88);
      background: rgba(110, 215, 143, 0.17);
      color: var(--ink);
    }

    .choice.is-wrong {
      border-color: rgba(255, 123, 102, 0.86);
      background: rgba(255, 123, 102, 0.13);
    }

    .choice:disabled {
      cursor: default;
    }

    .status {
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
    }

    .status.good {
      color: var(--good);
    }

    .status.bad {
      color: var(--bad);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .action-btn {
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid rgba(211, 188, 141, 0.55);
      border-radius: 8px;
      background: linear-gradient(180deg, #eadca8 0%, var(--accent) 100%);
      color: #101820;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.055);
      color: var(--accent);
      box-shadow: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 760px) {
      .game-card {
        gap: 14px;
        padding: 16px;
      }

      .choices {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body data-admin-page="mission-control">
  <main class="game-shell" aria-label="Video trivia mini-game">
    <section class="game-card">
      <header class="topbar">
        <span class="kicker">The Game Bureau</span>
        <h1>Video Trivia</h1>
        <p class="subtitle" id="clipTitle">Watch the clip, then call the play.</p>
      </header>

      <div class="clip-frame">
        <iframe
          id="videoFrame"
          title="Sports trivia video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
          allowfullscreen
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <div class="clip-meta" aria-label="Clip details">
        <span class="pill" id="clipEyebrow">Pro Sports</span>
        <span class="pill" id="clipMatchup">Highlight</span>
        <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener">Open on YouTube</a>
      </div>

      <section class="quiz-panel" aria-label="Trivia question">
        <p class="question" id="questionText">Question loading...</p>
        <div class="choices" id="choices" role="list"></div>
        <p class="status" id="statusText" aria-live="polite">Pick the answer after you watch the video.</p>
        <div class="actions">
          <button class="action-btn secondary" id="replayBtn" type="button">Reset Answers</button>
          <button class="action-btn" id="shuffleBtn" type="button">Random Clip</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const CLIPS = [
        {
          id: 'nhl-top-goals-title-card',
          title: 'Top 10 NHL goals of the season',
          eyebrow: 'NHL Highlights',
          matchup: 'Top goals reel',
          youtubeId: '4Vek2W7S36c',
          youtubeUrl: 'https://www.youtube.com/watch?v=4Vek2W7S36c',
          question: 'What number is on the title-card jersey?',
          choices: ['8', '19', '88', '98'],
          answerIndex: 3,
          explanation: 'The opening title card shows a player wearing number 98.'
        }
      ];

      const params = new URLSearchParams(window.location.search);
      const els = {
        title: document.getElementById('clipTitle'),
        frame: document.getElementById('videoFrame'),
        eyebrow: document.getElementById('clipEyebrow'),
        matchup: document.getElementById('clipMatchup'),
        source: document.getElementById('sourceLink'),
        question: document.getElementById('questionText'),
        choices: document.getElementById('choices'),
        status: document.getElementById('statusText'),
        replay: document.getElementById('replayBtn'),
        shuffle: document.getElementById('shuffleBtn')
      };

      let activeClip = null;
      let solved = false;

      function chooseClip(excludeId) {
        const requested = params.get('clip') || params.get('id');
        if (requested) {
          const direct = CLIPS.find((clip) => clip.id === requested);
          if (direct) return direct;
        }

        const pool = CLIPS.length > 1 && excludeId
          ? CLIPS.filter((clip) => clip.id !== excludeId)
          : CLIPS;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function renderClip(clip) {
        activeClip = clip;
        solved = false;
        document.title = clip.title + ' | The Game Bureau';
        els.title.textContent = clip.title;
        els.frame.title = clip.title;
        els.frame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(clip.youtubeId) + '?rel=0&modestbranding=1&playsinline=1';
        els.eyebrow.textContent = clip.eyebrow || 'Pro Sports';
        els.matchup.textContent = clip.matchup || 'Highlight';
        els.source.href = clip.youtubeUrl;
        els.question.textContent = clip.question;
        els.status.className = 'status';
        els.status.textContent = 'Pick the answer after you watch the video.';
        renderChoices(clip);
      }

      function renderChoices(clip) {
        els.choices.replaceChildren();
        clip.choices.forEach((choice, index) => {
          const button = document.createElement('button');
          button.className = 'choice';
          button.type = 'button';
          button.setAttribute('role', 'listitem');
          button.textContent = choice;
          button.addEventListener('click', () => checkAnswer(button, index));
          els.choices.appendChild(button);
        });
      }

      function checkAnswer(button, index) {
        if (!activeClip || solved) return;
        if (index === activeClip.answerIndex) {
          solved = true;
          button.classList.add('is-correct');
          els.status.className = 'status good';
          els.status.textContent = activeClip.explanation;
          Array.from(els.choices.children).forEach((choice) => {
            choice.disabled = true;
          });
          window.setTimeout(notifyComplete, 750);
          return;
        }

        button.classList.add('is-wrong');
        button.disabled = true;
        els.status.className = 'status bad';
        els.status.textContent = 'Not that one. Watch the clip again and try the remaining answers.';
      }

      function resetAnswers() {
        if (!activeClip) return;
        solved = false;
        els.status.className = 'status';
        els.status.textContent = 'Pick the answer after you watch the video.';
        renderChoices(activeClip);
      }

      function shuffleClip() {
        params.delete('clip');
        params.delete('id');
        renderClip(chooseClip(activeClip && activeClip.id));
      }

      function notifyComplete() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'tgb:minigame:complete',
            game: 'video',
            clip: activeClip && activeClip.id
          }, '*');
        }
      }

      els.replay.addEventListener('click', resetAnswers);
      els.shuffle.addEventListener('click', shuffleClip);
      renderClip(chooseClip());
    })();
  </script>
</body>
</html>
