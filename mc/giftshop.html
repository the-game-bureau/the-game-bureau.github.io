<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GIFT SHOP | THE GAME BUREAU</title>
  <link rel="icon" href="../site/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
          document.documentElement.classList.add('admin-embedded');
        }
      } catch (error) {}
    }());
  </script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }

    .app {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .admin-nav { display: flex; gap: 4px; }
    .admin-nav-group { position: relative; display: inline-flex; }
    .admin-nav-submenu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      display: none;
      flex-direction: column;
      padding: 6px;
      gap: 2px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }
    .admin-nav-group:hover > .admin-nav-submenu,
    .admin-nav-group:focus-within > .admin-nav-submenu { display: flex; }
    .admin-nav-submenu .admin-nav-link {
      white-space: nowrap;
      font-size: 0.78rem;
      min-height: 34px;
      padding: 0 12px;
    }
    .admin-nav-split {
      display: inline-flex;
      border: 2px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .admin-nav-split .admin-nav-link {
      border-radius: 0;
      background: #fff;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit {
      padding: 0 12px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      background: #d1d5db;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit:hover {
      background: #c5c9d1;
      color: var(--ink);
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-split .admin-nav-link--split-edit.admin-nav-link--active:hover {
      background: rgba(var(--bic-blue-rgb), 0.85);
      color: #fff;
    }
    .admin-nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s;
    }
    .admin-nav-link:hover { background: var(--line); color: var(--ink); }
    .admin-nav-link--active { background: var(--accent); color: #fff; }
    .toolbar-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; }

    .topbar-actions > a.btn[href="./"] { display: none; }

    .section-head { display: grid; gap: 4px; margin: 0 0 14px; }

    .section-head--gears {
      position: relative;
      overflow: hidden;
      gap: 6px;
      margin-bottom: 18px;
      padding: 20px 22px 22px;
      padding-right: clamp(136px, 30vw, 220px);
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .section-head--gears > :not(.section-gear-art):not(.section-head-actions) {
      position: relative;
      z-index: 1;
    }

    .section-head-actions {
      position: absolute;
      top: 50%;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 8px;
      transform: translateY(-50%);
    }

    .section-head-actions .btn[aria-disabled="true"] {
      opacity: 0.38;
      pointer-events: none;
    }

    .section-head--gears .copy {
      max-width: 440px;
    }

    .section-gear-art {
      position: absolute;
      top: -4px;
      right: -2px;
      z-index: 0;
      width: 320px;
      height: 188px;
      pointer-events: none;
      opacity: 0.96;
      overflow: visible;
    }

    .section-head--gears .header-gear {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-atmosphere {
      opacity: 0.9;
    }

    .section-head--gears .header-gear--large {
      stroke: rgba(var(--bic-blue-rgb), 0.28);
    }

    .section-head--gears .header-gear--small {
      stroke: rgba(var(--bic-blue-rgb), 0.22);
    }

    .section-head--gears .header-gear-body {
      fill: rgba(var(--bic-blue-rgb), 0.045);
      stroke-width: 3.4;
    }

    .section-head--gears .header-gear-ring {
      fill: rgba(var(--bic-blue-rgb), 0.018);
      stroke-width: 3;
    }

    .section-head--gears .header-gear-inner {
      fill: none;
      stroke-width: 2.4;
      opacity: 0.92;
    }

    .section-head--gears .header-gear-spoke {
      fill: rgba(var(--bic-blue-rgb), 0.1);
      stroke: none;
    }

    .section-head--gears .header-gear-core {
      fill: rgba(var(--bic-blue-rgb), 0.08);
      stroke-width: 2.2;
    }

    .section-head--gears .header-gear-halo {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.14);
      stroke-width: 2;
      stroke-dasharray: 4 8;
    }

    .section-head--gears .header-gear-bore {
      fill: none;
      stroke-width: 2;
    }

    .section-head--gears .header-gear-wire {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.12);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section-head--gears .header-gear-wire--bold {
      stroke: rgba(var(--bic-blue-rgb), 0.17);
      stroke-width: 1.8;
    }

    .section-head--gears .header-gear-guide {
      fill: none;
      stroke: rgba(var(--bic-blue-rgb), 0.1);
      stroke-width: 1.2;
      stroke-dasharray: 2 7;
    }

    .section-head--gears .header-gear-node {
      fill: rgba(var(--bic-blue-rgb), 0.17);
    }

    .section-head--gears .header-gear-speck {
      fill: rgba(var(--bic-blue-rgb), 0.11);
    }

    .section-head--gears .header-gear-crosshair {
      stroke: rgba(var(--bic-blue-rgb), 0.15);
      stroke-width: 1.4;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 3rem;
      letter-spacing: 0;
      line-height: 1;
    }

    h2 {
      margin: 0;
      color: var(--bic-blue);
      font-size: 2.4rem;
      letter-spacing: 0;
      line-height: 1;
    }

    .copy { margin: 0; color: var(--muted); line-height: 1.5; max-width: 620px; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      margin-bottom: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 36px var(--paper-shadow);
    }

    .toolbar select {
      appearance: none;
      -webkit-appearance: none;
      flex: 1;
      min-width: min(100%, 260px);
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .toolbar select::-ms-expand { display: none; }

    button, .btn, .admin-nav-link, [class*="-btn"] {
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .btn:hover { background: rgba(255,255,255,1); border-color: var(--accent); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: var(--bic-blue); border-color: var(--bic-blue); }

    .btn.danger {
      color: var(--danger);
      border-color: rgba(160, 63, 45, 0.45);
      background: rgba(255,255,255,0.92);
    }
    .btn.danger:hover { background: rgba(160, 63, 45, 0.08); border-color: var(--danger); }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(var(--bic-blue-rgb), 0.52);
      backdrop-filter: blur(6px);
    }

    .auth-modal.hidden {
      display: none !important;
    }

    .auth {
      position: relative;
      width: min(430px, 100%);
      margin: 0;
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(var(--bic-blue-rgb), 0.18);
    }

    .auth-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .auth-close:hover { background: var(--line); color: var(--ink); }

    .auth h1 { margin-bottom: 10px; font-size: 2.4rem; }
    .auth-form { display: grid; gap: 12px; margin-top: 18px; }
    .auth-actions { display: flex; gap: 10px; }
    .auth-actions .btn.primary { flex: 1; }
    .auth label {
      display: grid; gap: 6px;
      color: var(--muted); font-size: 0.9rem; font-weight: 700;
    }
    .auth input {
      height: 44px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: rgba(255,255,255,0.86);
    }
    .auth input:focus,
    .toolbar select:focus,
    .item input:focus,
    .item textarea:focus {
      outline: 2px solid rgba(var(--bic-blue-rgb), 0.24);
      outline-offset: 2px;
    }

    .home-icon-btn {
      letter-spacing: 0.06em;
    }

    .signout-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .signout-btn svg { display: block; width: 31px; height: 31px; }

    .mb-menu {
      position: relative;
      display: flex;
      align-items: center;
    }

    .mb-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.15s, border-color 0.15s;
    }

    .mb-trigger:hover,
    .mb-trigger:focus-visible,
    .mb-menu.open .mb-trigger {
      background: rgba(255,255,255,1);
      border-color: var(--accent);
      outline: none;
    }

    .mb-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 18px 36px var(--paper-shadow);
      z-index: 30;
    }

    .mb-section {
      padding: 6px 14px 4px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mb-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--ink);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .mb-item:hover {
      background: rgba(var(--bic-blue-rgb), 0.08);
    }

    .mb-item.is-active {
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--accent);
    }

    .mb-sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(var(--bic-blue-rgb), 0.1);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }

    #shopStatus,
    #shopStatus.success {
      color: var(--ink);
      font-weight: 600;
    }

    .items {
      display: grid;
      gap: 14px;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px var(--paper-shadow);
    }

    .item.is-archived { opacity: 0.65; }
    .item.is-new { border-color: var(--accent); }

    .item-focus-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      width: 220px;
      flex-shrink: 0;
    }
    .item-focus-caption {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      line-height: 1.4;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: left;
    }
    .item-focus {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.06);
      border: 1px solid var(--line);
      overflow: hidden;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      touch-action: none;
    }
    .item-focus [data-focus-placeholder] {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .item-focus img {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      max-height: none;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }
    .item-focus[data-has-image="true"] {
      cursor: grab;
    }
    .item-focus[data-dragging="true"] {
      cursor: grabbing;
    }

    .item-fields {
      display: grid;
      grid-template-columns: 1fr 140px 130px;
      gap: 10px;
      align-items: end;
    }

    .item-fields .field-wide { grid-column: 1 / -1; }
    .item-fields label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-fields input,
    .item-fields textarea,
    .item-fields select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
    }
    .item-fields textarea {
      height: 64px;
      padding: 8px 10px;
      resize: vertical;
      min-height: 64px;
    }

    .item-listings {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.03);
    }
    .item-listings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .item-listings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .listing-row {
      display: grid;
      grid-template-columns: 1fr 90px auto auto;
      gap: 6px;
      align-items: center;
    }
    .listing-row select,
    .listing-row input[type="number"] {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: rgba(255,255,255,0.96);
      font-size: 0.85rem;
    }
    .listing-row select[multiple] {
      height: auto;
      min-height: 132px;
      padding: 4px 6px;
      overflow-y: auto;
    }
    .listing-row select[multiple] option { padding: 2px 6px; }
    .listing-row select[multiple] option:checked {
      background: linear-gradient(0deg, rgba(var(--bic-blue-rgb), 0.18), rgba(var(--bic-blue-rgb), 0.18));
      color: var(--ink);
    }
    .listing-row.is-multi { align-items: start; }
    .listing-row.is-multi .listing-live,
    .listing-row.is-multi .listing-remove,
    .listing-row.is-multi input[type="number"] { margin-top: 2px; }
    .listing-multi-hint {
      grid-column: 1 / -1;
      margin: -2px 0 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .listing-row .listing-live {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .listing-row .listing-live input { width: auto; height: auto; }
    .listing-row .listing-remove {
      width: 30px; height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,0.96);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .listing-row .listing-remove:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .listing-row.is-removed { display: none; }
    .item-listings-empty {
      padding: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    .item-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
      margin-top: 4px;
    }

    /* ── Suggest lightbox ─────────────────────────────────────── */
    .suggest-modal {
      position: fixed; inset: 0; z-index: 1500;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .suggest-modal[hidden] { display: none; }
    .suggest-backdrop {
      position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }
    .suggest-panel {
      position: relative;
      width: min(720px, 100%);
      max-height: 90vh;
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
      overflow: hidden;
    }
    .suggest-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .suggest-panel-head h2 { margin: 0; font-size: 1rem; }
    .suggest-close {
      background: transparent; border: 0;
      font-size: 1.3rem; line-height: 1;
      color: var(--muted); cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
    }
    .suggest-close:hover { background: rgba(0,0,0,0.05); color: var(--ink); }
    .suggest-form, .suggest-results {
      padding: 16px 18px;
      overflow: auto;
      flex: 1;
    }
    .suggest-form { display: grid; gap: 12px; }
    .suggest-form label {
      display: grid; gap: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted);
    }
    .suggest-form input[type="text"],
    .suggest-form input[type="number"],
    .suggest-form select {
      height: 36px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 6px;
      font-family: inherit; font-size: 0.9rem;
      color: var(--ink); background: #fff;
    }
    .suggest-form .suggest-check {
      flex-direction: row; align-items: center; gap: 8px;
      font-family: inherit;
      text-transform: none; letter-spacing: 0;
      font-size: 0.85rem; font-weight: 500; color: var(--ink);
    }
    .suggest-form .suggest-check input { width: auto; height: auto; }
    .suggest-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      margin-top: 4px;
    }
    .suggest-status {
      min-height: 1.4em; margin: 0;
      font-size: 0.85rem; color: var(--muted);
    }
    .suggest-status.error { color: var(--danger); font-weight: 700; }
    .suggest-status.success { color: var(--ok, #2f6b3d); font-weight: 700; }
    .suggest-results-head {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .suggest-results-head label {
      display: inline-flex; gap: 6px; align-items: center;
      font-size: 0.85rem;
    }
    .suggest-results-count {
      flex: 1;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .suggest-results-list {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 8px;
    }
    .suggest-result {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      align-items: center;
      background: rgba(255,255,255,0.96);
    }
    .suggest-result img {
      width: 56px; height: 56px;
      object-fit: contain;
      border-radius: 6px;
      background: #f5f5f5;
    }
    .suggest-result-meta {
      display: flex; flex-direction: column; gap: 2px;
      min-width: 0;
    }
    .suggest-result-title {
      font-size: 0.88rem; font-weight: 700;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-sub {
      font-size: 0.7rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .suggest-result-actions {
      display: flex; flex-direction: column; gap: 4px;
      align-items: flex-end;
    }
    .suggest-result-badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.12);
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .suggest-result.is-existing { opacity: 0.55; }
    .suggest-result-check { width: 18px; height: 18px; cursor: pointer; }
    .suggest-result a.suggest-result-link {
      color: inherit; text-decoration: none;
    }
    .suggest-result a.suggest-result-link:hover .suggest-result-title {
      text-decoration: underline;
    }

    .item-archive-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .item-archive-toggle input { width: auto; height: auto; }

    .item-status {
      flex: 1;
      text-align: right;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .item-status.error { color: var(--danger); font-weight: 700; }
    .item-status.success { color: var(--success); font-weight: 700; }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .hidden { display: none !important; }

    html.admin-embedded body {
      min-height: 100%;
      background: transparent;
    }

    html.admin-embedded .app {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    html.admin-embedded .topbar,
    html.admin-embedded .section-head--gears,
    html.admin-embedded .home-icon-btn {
      display: none !important;
    }

    @media (max-width: 720px) {
      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions .mb-menu {
        flex: 1;
      }

      .topbar-actions .mb-trigger {
        width: 100%;
      }

      .topbar-actions .signout-btn {
        flex: 0 0 42px;
      }

      h1 { font-size: 2.4rem; }

      .section-head--gears {
        padding: 18px 18px 112px;
      }

      .section-head--gears .copy {
        max-width: none;
      }

      .section-gear-art {
        top: auto;
        right: -22px;
        bottom: -26px;
        width: 250px;
        height: 147px;
      }

      .toolbar {
        display: grid;
      }

      .toolbar > * {
        width: 100%;
      }

      .item { grid-template-columns: auto 1fr; }
      .item-focus-col { max-width: 100%; }
      .item-fields { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 540px) {
      .item-fields { grid-template-columns: 1fr; }
    }
  </style>

    const LOCAL_SUGGEST_ITEMS_HOST = window.location.hostname === 'localhost' ? 'localhost' : '127.0.0.1';
    const LOCAL_SUGGEST_ITEMS_RUN_URL = 'http://' + LOCAL_SUGGEST_ITEMS_HOST + ':8765/run-stock-gift-shop';
    const LOCAL_SUGGEST_SEARCH_URL = 'http://' + LOCAL_SUGGEST_ITEMS_HOST + ':8765/search-candidates';
    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      signOutButton: signOutBtn,
      onAuthorized: async () => {
        await showShop();

    let gamesById = new Map();
    let gameOptionsHtml = '<option value="">— Pick a game —</option>';

    function restUrl(table, params = {}) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function setStatus(el, message, state = '') {
      if (!el) return;
      el.textContent = message || '';
      el.classList.toggle('error', state === 'error');
      el.classList.toggle('success', state === 'success');
    }

    function setSuggestItemsButtonEnabled(enabled) {
      if (!suggestItemsBtn) return;
      const session = adminAuth.getSession ? adminAuth.getSession() : null;
      const signedIn = !!(session && session.access_token);
      const canUse = !!enabled && signedIn && CAN_RUN_LOCAL_SUGGEST_ITEMS;
      suggestItemsBtn.disabled = !canUse;
      if (!CAN_RUN_LOCAL_SUGGEST_ITEMS) {
        suggestItemsBtn.title = 'Local only. Open Mission Control on localhost or 127.0.0.1 and run "' + LOCAL_SUGGEST_ITEMS_COMMAND + '".';
        return;
      }
      if (!signedIn) {
        suggestItemsBtn.title = 'Sign in to Mission Control to suggest items.';
        return;
      }
      suggestItemsBtn.title = 'Run local gift shop suggestions. Start "' + LOCAL_SUGGEST_ITEMS_COMMAND + '" first.';
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) { return text; }
      } catch (_) { return fallback; }
    }

    function authHeaders(extra = {}) {
      return adminAuth.authHeaders(extra);
    }

    // ── Games ────────────────────────────────────────────────────────
    async function fetchGames() {
      const response = await fetch(restUrl('games', { select: 'id,name,archived', order: 'name.asc' }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load games.'));
      return response.json();
    }

    function isLive(game) {
      const dead = (v) => typeof v === 'boolean' ? v : (typeof v === 'string' && v.trim() && v.trim().toLowerCase() !== 'false' && v.trim() !== '0');
      return !dead(game.archived);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadGames() {
      const games = await fetchGames();
      gamesById = new Map(games.map((g) => [g.id, g]));
      // Live games first, archived games grouped after.
      const live = games.filter(isLive);
      const dead = games.filter((g) => !isLive(g));
      const renderOpt = (g, suffix) =>
        '<option value="' + escapeHtml(g.id) + '">' +
        escapeHtml((g.name || g.id) + (suffix ? ' ' + suffix : '')) +
        '</option>';
      gameOptionsHtml =
        '<option value="">— Pick a game —</option>' +
        live.map((g) => renderOpt(g, '')).join('') +
        dead.map((g) => renderOpt(g, '(archived)')).join('');

      // Top-level preview picker — all shops (live first, archived after).
      previewShopSelect.innerHTML =
        '<option value="">All Games</option>' +
        live.map((g) => renderOpt(g, '')).join('') +
        dead.map((g) => renderOpt(g, '(archived)')).join('');
    }

    function filterItemsByShop() {
      const gameId = previewShopSelect.value;
      const items = itemsList.querySelectorAll('.item');
      let visible = 0;
      items.forEach((item) => {
        if (!gameId) {
          item.classList.remove('hidden');
          visible++;
          return;
        }
        const listingSelects = item.querySelectorAll('.listing-row:not(.is-removed) [data-listing-field="game_id"]');
        const match = Array.from(listingSelects).some((sel) =>
          Array.from(sel.selectedOptions).some((o) => o.value === gameId)
        );
        item.classList.toggle('hidden', !match);
        if (match) visible++;
      });
      const total = items.length;
      const hidden = total - visible;
      setStatus(shopStatus, total + ' items, ' + visible + ' visible, ' + hidden + ' hidden.', 'success');
    }

    previewShopSelect.addEventListener('change', () => {
      filterItemsByShop();
    });

    // ── Items ────────────────────────────────────────────────────────
    async function fetchAllItems() {
      // Embed each item's listings so we can render the full edit UI in
      // one round-trip. Order is title-asc; per-listing position is
      // surfaced inside each card, not at the catalog level.
      const response = await fetch(restUrl('gift_shop_items', {
        select: '*,gift_shop_listings(*)',
        order: 'title.asc.nullslast'
      }), {
        headers: authHeaders({ Accept: 'application/json' }),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not load gift shop items.'));
      return response.json();
    }

    async function insertItem(payload) {
      const response = await fetch(restUrl('gift_shop_items'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Insert failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateItem(id, payload) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Update failed.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteItem(id) {
      const response = await fetch(restUrl('gift_shop_items', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Delete failed.'));
    }

    // ── Listings ─────────────────────────────────────────────────────
    async function insertListing(payload) {
      const response = await fetch(restUrl('gift_shop_listings'), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not add listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function updateListing(id, payload) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'PATCH',
        headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not update listing.'));
      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function deleteListing(id) {
      const response = await fetch(restUrl('gift_shop_listings', { id: 'eq.' + id }), {
        method: 'DELETE',
        headers: authHeaders({})
      });
      if (!response.ok) throw new Error(await readError(response, 'Could not remove listing.'));
    }

    function renderEmpty() {
      itemsList.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'No items yet. Click ADD to start.';
      itemsList.appendChild(div);
    }

    function buildItemPayload(article) {
      const get = (name) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        return el ? el.value : '';
      };
      const focus = String(article.dataset.imageFocus || '50% 50%');
      const priceRaw = get('price_dollars').trim();
      const priceCents = priceRaw === '' ? null : Math.max(0, Math.round(Number(priceRaw) * 100));
      return {
        kind: 'amazon_link',
        title: get('title').trim() || null,
        url: get('url').trim(),
        image_url: get('image_url').trim() || null,
        image_focus: focus,
        price_display: get('price_display').trim() || null,
        description: get('description').trim() || null,
        price_cents: Number.isFinite(priceCents) ? priceCents : null,
        printful_variant_id: get('printful_variant_id').trim() || null
      };
    }

    function readListingRow(row) {
      const select = row.querySelector('[data-listing-field="game_id"]');
      const game_ids = select.multiple
        ? Array.from(select.selectedOptions)
            .map((o) => String(o.value || '').trim())
            .filter(Boolean)
        : (select.value ? [String(select.value).trim()] : []);
      const positionRaw = String(row.querySelector('[data-listing-field="position"]').value || '').trim();
      const position = positionRaw === '' ? 0 : Math.max(0, Math.floor(Number(positionRaw) || 0));
      const live = !!row.querySelector('[data-listing-field="live"]').checked;
      return { id: row.dataset.listingId || '', game_ids, position, live };
    }

    function appendListingRow(listingsList, listing = {}) {
      const fragment = listingRowTemplate.content.cloneNode(true);
      const row = fragment.querySelector('.listing-row');
      const sel = row.querySelector('[data-listing-field="game_id"]');
      const isNew = !listing.id;

      if (isNew) {
        // Strip the "— Pick a game —" placeholder (multi-select can't show one);
        // the listbox itself communicates "pick one or more".
        sel.innerHTML = gameOptionsHtml.replace(/<option value=""[^>]*>[^<]*<\/option>/, '');
        sel.multiple = true;
        sel.size = 6;
        sel.title = 'Click to pick. Ctrl/Cmd+click to toggle. Shift+click for a range.';
        row.classList.add('is-multi');

        const hint = document.createElement('div');
        hint.className = 'listing-multi-hint';
        hint.textContent = 'Ctrl/Cmd+click to toggle · Shift+click for a range';
        row.insertBefore(hint, sel);
      } else {
        sel.innerHTML = gameOptionsHtml;
        const targetId = listing.game_id || '';
        if (targetId) {
          const exists = sel.querySelector('option[value="' + CSS.escape(targetId) + '"]');
          if (!exists) {
            const opt = document.createElement('option');
            opt.value = targetId;
            opt.textContent = (gamesById.get(targetId)?.name || targetId) + ' (missing)';
            sel.appendChild(opt);
          }
          sel.value = targetId;
        }
      }
      row.querySelector('[data-listing-field="position"]').value =
        listing.position == null ? '' : String(listing.position);
      row.querySelector('[data-listing-field="live"]').checked = !!listing.live;
      row.dataset.listingId = listing.id || '';
      row.querySelector('[data-action="remove-listing"]').addEventListener('click', () => {
        // For unsaved rows just drop them; for persisted rows mark for
        // deletion and hide so syncListings can DELETE on save.
        if (row.dataset.listingId) {
          row.classList.add('is-removed');
          row.dataset.removed = 'true';
        } else {
          row.remove();
        }
        refreshListingsEmpty(listingsList);
      });
      listingsList.appendChild(row);
      refreshListingsEmpty(listingsList);
      return row;
    }

    function refreshListingsEmpty(listingsList) {
      const live = listingsList.querySelectorAll('.listing-row:not(.is-removed)');
      let empty = listingsList.querySelector('.item-listings-empty');
      if (!live.length) {
        if (!empty) {
          empty = document.createElement('div');
          empty.className = 'item-listings-empty';
          empty.textContent = 'Not in any shop yet.';
          listingsList.appendChild(empty);
        }
      } else if (empty) {
        empty.remove();
      }
    }

    async function syncListings(article, itemId) {
      const rows = Array.from(article.querySelectorAll('.listing-row'));
      // 1) Removed rows that already had an id → DELETE
      const toDelete = rows.filter((r) => r.dataset.removed === 'true' && r.dataset.listingId);
      for (const row of toDelete) {
        await deleteListing(row.dataset.listingId);
        row.remove();
      }
      // 2) Live rows: insert if no id, otherwise update. New multi-select
      //    rows fan out into one listing per selected shop.
      const liveRows = rows.filter((r) => r.dataset.removed !== 'true');
      let fannedOut = false;
      for (const row of liveRows) {
        const data = readListingRow(row);
        if (!data.game_ids.length) continue; // skip blanks rather than erroring
        if (data.id) {
          // Existing rows are single-select; only the first id matters here.
          const updated = await updateListing(data.id, {
            game_id: data.game_ids[0],
            position: data.position,
            live: data.live
          });
          if (updated && updated.id) row.dataset.listingId = updated.id;
        } else {
          for (const gid of data.game_ids) {
            const created = await insertListing({
              item_id: itemId,
              game_id: gid,
              position: data.position,
              live: data.live
            });
            if (created && created.id && !row.dataset.listingId) {
              row.dataset.listingId = created.id;
            }
          }
          if (data.game_ids.length > 1) fannedOut = true;
        }
      }
      return fannedOut;
    }

    function bindItem(article, item) {
      article.dataset.id = item.id || '';
      article.classList.toggle('is-new', !item.id);

      const set = (name, value) => {
        const el = article.querySelector('[data-field="' + name + '"]');
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!value;
        else el.value = value == null ? '' : String(value);
      };

      set('title', item.title);
      set('url', item.url);
      set('image_url', item.image_url);
      set('price_display', item.price_display);
      set('description', item.description);
      set('price_dollars', Number.isFinite(item.price_cents) ? (item.price_cents / 100).toFixed(2) : '');
      set('printful_variant_id', item.printful_variant_id);

      // Render existing listings (from the embedded select) and wire
      // up the "+ Add to a shop" button. New blank items get one empty
      // row so the user has somewhere to pick a shop without an extra
      // click.
      const listingsList = article.querySelector('[data-listings-list]');
      listingsList.innerHTML = '';
      const listings = Array.isArray(item.gift_shop_listings) ? item.gift_shop_listings : [];
      const sortedListings = listings.slice().sort((a, b) => {
        const ka = (gamesById.get(a.game_id)?.name || '').toLowerCase();
        const kb = (gamesById.get(b.game_id)?.name || '').toLowerCase();
        if (ka < kb) return -1;
        if (ka > kb) return 1;
        return 0;
      });
      sortedListings.forEach((l) => appendListingRow(listingsList, l));
      if (!sortedListings.length && !item.id) {
        appendListingRow(listingsList, {});
      }
      refreshListingsEmpty(listingsList);

      article.querySelector('[data-action="add-listing"]').addEventListener('click', () => {
        const row = appendListingRow(listingsList, {});
        const sel = row.querySelector('[data-listing-field="game_id"]');
        if (sel) sel.focus();
      });

      // Focus picker: a fixed 220×220 frame matching the public site's
      // minimum card-image size. The image lives behind the frame at
      // "cover" scale (smaller dim = frame size, longer dim overflows).
      // Drag the image to slide it under the window; the resulting
      // top-left as a fraction of overflow is the object-position
      // we save back to the row.
      const FRAME_SIDE = 220;
      const focusBox = article.querySelector('.item-focus');
      const placeholder = focusBox.querySelector('[data-focus-placeholder]');

      const parseFocus = (raw) => {
        const m = String(raw || '').match(/(-?\d+(?:\.\d+)?)\s*%\s+(-?\d+(?:\.\d+)?)\s*%/);
        if (!m) return { x: 50, y: 50 };
        return {
          x: Math.min(100, Math.max(0, parseFloat(m[1]))),
          y: Math.min(100, Math.max(0, parseFloat(m[2])))
        };
      };

      let currentFocus = parseFocus(item.image_focus);
      let lastLayout = null;

      const writeFocus = () => {
        article.dataset.imageFocus =
          currentFocus.x.toFixed(1) + '% ' + currentFocus.y.toFixed(1) + '%';
      };
      writeFocus();

      const applyTransform = () => {
        const img = focusBox.querySelector('img');
        if (!img || !lastLayout) return;
        const tx = -(currentFocus.x / 100) * lastLayout.overflowX;
        const ty = -(currentFocus.y / 100) * lastLayout.overflowY;
        img.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0)';
      };

      const sizeImage = () => {
        const img = focusBox.querySelector('img');
        if (!img || !img.naturalWidth || !img.naturalHeight) {
          lastLayout = null;
          return;
        }
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const scale = Math.max(FRAME_SIDE / W, FRAME_SIDE / H);
        const dispW = W * scale;
        const dispH = H * scale;
        lastLayout = {
          dispW, dispH,
          overflowX: Math.max(0, dispW - FRAME_SIDE),
          overflowY: Math.max(0, dispH - FRAME_SIDE)
        };
        img.style.width = dispW + 'px';
        img.style.height = dispH + 'px';
        applyTransform();
      };

      const refreshFocusImage = () => {
        const url = article.querySelector('[data-field="image_url"]').value.trim();
        const existingImg = focusBox.querySelector('img');
        if (existingImg) existingImg.remove();
        lastLayout = null;
        if (url) {
          const img = document.createElement('img');
          img.alt = '';
          img.referrerPolicy = 'no-referrer';
          img.draggable = false;
          const onLoad = () => {
            focusBox.dataset.hasImage = 'true';
            placeholder.style.display = 'none';
            sizeImage();
          };
          const onError = () => {
            img.remove();
            focusBox.dataset.hasImage = 'false';
            placeholder.style.display = '';
            lastLayout = null;
          };
          img.addEventListener('load', onLoad);
          img.addEventListener('error', onError);
          focusBox.insertBefore(img, placeholder);
          img.src = url;
          // Cached images may already be complete before our listener
          // attaches — fire onLoad synchronously in that case.
          if (img.complete && img.naturalWidth > 0) onLoad();
        } else {
          focusBox.dataset.hasImage = 'false';
          placeholder.style.display = '';
        }
      };
      refreshFocusImage();
      article.querySelector('[data-field="image_url"]').addEventListener('input', refreshFocusImage);

      // Drag the image behind the frame. Pointer delta translates 1:1
      // into transform offset (since frame and image share screen px).
      // Translate is clamped so the frame stays filled (no white edges).
      let dragging = false;
      let dragStart = null;
      focusBox.addEventListener('pointerdown', (e) => {
        if (focusBox.dataset.hasImage !== 'true' || !lastLayout) return;
        dragging = true;
        focusBox.dataset.dragging = 'true';
        try { focusBox.setPointerCapture(e.pointerId); } catch { /* ignore */ }
        dragStart = {
          tx: -(currentFocus.x / 100) * lastLayout.overflowX,
          ty: -(currentFocus.y / 100) * lastLayout.overflowY,
          px: e.clientX,
          py: e.clientY
        };
        e.preventDefault();
      });
      focusBox.addEventListener('pointermove', (e) => {
        if (!dragging || !lastLayout || !dragStart) return;
        const dx = e.clientX - dragStart.px;
        const dy = e.clientY - dragStart.py;
        const tx = Math.max(-lastLayout.overflowX, Math.min(0, dragStart.tx + dx));
        const ty = Math.max(-lastLayout.overflowY, Math.min(0, dragStart.ty + dy));
        currentFocus.x = lastLayout.overflowX > 0 ? (-tx / lastLayout.overflowX) * 100 : 50;
        currentFocus.y = lastLayout.overflowY > 0 ? (-ty / lastLayout.overflowY) * 100 : 50;
        writeFocus();
        applyTransform();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        dragStart = null;
        delete focusBox.dataset.dragging;
        try { focusBox.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
      };
      focusBox.addEventListener('pointerup', endDrag);
      focusBox.addEventListener('pointercancel', endDrag);

      const statusEl = article.querySelector('[data-status]');
      const setItemStatus = (msg, kind = '') => setStatus(statusEl, msg, kind);

      article.querySelector('[data-action="save"]').addEventListener('click', async () => {
        const payload = buildItemPayload(article);
        if (!payload.url) {
          setItemStatus('Amazon URL is required.', 'error');
          return;
        }
        // Validate listings before doing any writes. Collect live shop
        // ids (flattening multi-select rows) and reject if there are
        // duplicates or none.
        const liveRows = Array.from(
          article.querySelectorAll('.listing-row:not(.is-removed)')
        );
        const liveData = liveRows.map(readListingRow).filter((d) => d.game_ids.length);
        const allGameIds = liveData.flatMap((d) => d.game_ids);
        if (!allGameIds.length) {
          setItemStatus('Add this item to at least one shop first.', 'error');
          return;
        }
        const seen = new Set();
        for (const gid of allGameIds) {
          if (seen.has(gid)) {
            setItemStatus('This item is listed in the same shop twice.', 'error');
            return;
          }
          seen.add(gid);
        }
        setItemStatus('Saving…');
        try {
          let saved;
          if (article.dataset.id) {
            saved = await updateItem(article.dataset.id, payload);
          } else {
            saved = await insertItem(payload);
          }
          if (saved && saved.id) {
            article.dataset.id = saved.id;
            article.classList.remove('is-new');
          }
          const fannedOut = await syncListings(article, article.dataset.id);
          setItemStatus('Saved.', 'success');
          setTimeout(() => setItemStatus(''), 2200);
          if (fannedOut) {
            await showShop(previewShopSelect.value);
          }
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });

      article.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        const id = article.dataset.id;
        if (!id) {
          // Brand-new row never saved — just remove from DOM.
          article.remove();
          if (!itemsList.children.length) renderEmpty();
          return;
        }
        if (!window.confirm('Delete this item?')) return;
        setItemStatus('Deleting…');
        try {
          await deleteItem(id);
          article.remove();
          if (!itemsList.children.length) renderEmpty();
        } catch (error) {
          console.error(error);
          setItemStatus(error instanceof Error ? error.message : String(error), 'error');
        }
      });
    }

    function appendItemRow(item = {}) {
      // Replace the empty-state placeholder if it's currently shown.
      const empty = itemsList.querySelector('.empty');
      if (empty) empty.remove();
      const fragment = itemTemplate.content.cloneNode(true);
      const article = fragment.querySelector('.item');
      itemsList.appendChild(article);
      bindItem(article, item);
      return article;
    }

    async function renderAllItems() {
      itemsList.innerHTML = '';
      setStatus(shopStatus, 'Loading items…');
      try {
        const items = await fetchAllItems();
        if (!items.length) {
          renderEmpty();
          setStatus(shopStatus, '');
          return;
        }
        items.forEach((item) => appendItemRow(item));
        filterItemsByShop();
      } catch (error) {
        console.error(error);
        renderEmpty();
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    addItemBtn.addEventListener('click', () => {
      const article = appendItemRow({});
      const titleInput = article.querySelector('[data-field="title"]');
      if (titleInput) titleInput.focus();
    });

    // ── Suggest lightbox ─────────────────────────────────────────
    const suggestModal = document.getElementById('suggestModal');
    const suggestForm = document.getElementById('suggestForm');
    const suggestGameSel = document.getElementById('suggestGame');
    const suggestKeywords = document.getElementById('suggestKeywords');
    const suggestMaxQueries = document.getElementById('suggestMaxQueries');
    const suggestItemsCap = document.getElementById('suggestItemsCap');
    const suggestDelay = document.getElementById('suggestDelay');
    const suggestForceRefetch = document.getElementById('suggestForceRefetch');
    const suggestStatus = document.getElementById('suggestStatus');
    const suggestSearchBtn = document.getElementById('suggestSearchBtn');
    const suggestResultsPane = document.getElementById('suggestResults');
    const suggestResultsList = document.getElementById('suggestResultsList');
    const suggestResultsCount = document.getElementById('suggestResultsCount');
    const suggestResultsStatus = document.getElementById('suggestResultsStatus');
    const suggestSelectAll = document.getElementById('suggestSelectAll');
    const suggestBackBtn = document.getElementById('suggestBackBtn');
    const suggestAddSelectedBtn = document.getElementById('suggestAddSelectedBtn');

    let suggestCandidates = [];

    function openSuggestModal() {
      console.info('[suggest] open (build: 2026-05-19-divform)');
      if (!CAN_RUN_LOCAL_SUGGEST_ITEMS) {
        setStatus(
          shopStatus,
          'Suggest only works from a local Mission Control page. Run "' + LOCAL_SUGGEST_ITEMS_COMMAND + '" first.',
          'error'
        );
        return;
      }
      // Reuse the preloaded gameOptionsHtml; drop its "— Pick a game —" placeholder.
      suggestGameSel.innerHTML =
        '<option value="">— Any game / keywords only —</option>' +
        gameOptionsHtml.replace(/<option value=""[^>]*>[^<]*<\/option>/, '');
      suggestGameSel.value = previewShopSelect.value || '';
      suggestForm.hidden = false;
      suggestResultsPane.hidden = true;
      suggestResultsList.innerHTML = '';
      suggestCandidates = [];
      setStatus(suggestStatus, '');
      setStatus(suggestResultsStatus, '');
      suggestSelectAll.checked = false;
      suggestAddSelectedBtn.disabled = true;
      suggestAddSelectedBtn.textContent = 'Add selected';
      suggestModal.hidden = false;
      setTimeout(() => suggestKeywords.focus(), 0);
    }

    let suggestBusy = false;

    function closeSuggestModal(reason) {
      if (suggestBusy) {
        console.info('[suggest] close blocked while busy (' + (reason || 'unknown') + ')');
        return;
      }
      console.info('[suggest] close (' + (reason || 'unknown') + ')');
      suggestModal.hidden = true;
    }

    document.querySelectorAll('[data-suggest-dismiss]').forEach((el) => {
      el.addEventListener('click', () => closeSuggestModal(el.tagName + (el.id ? '#' + el.id : '') + (el.className ? '.' + el.className.replace(/\s+/g, '.') : '')));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !suggestModal.hidden) closeSuggestModal('Escape key');
    });

    async function runSuggestSearch() {
      suggestBusy = true;
      suggestSearchBtn.disabled = true;
      setStatus(suggestStatus, 'Searching Amazon… this can take a minute on a cold cache.');
      try {
        const response = await fetch(LOCAL_SUGGEST_SEARCH_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({
            game: String(suggestGameSel.value || '').trim(),
            keywords: String(suggestKeywords.value || ''),
            max_queries: Math.max(1, Number(suggestMaxQueries.value || 6)),
            items_per_game: Math.max(1, Number(suggestItemsCap.value || 20)),
            delay: Math.max(0, Number(suggestDelay.value || 1.0)),
            force_refetch: !!suggestForceRefetch.checked
          })
        });
        const raw = await response.text();
        let payload = {};
        if (raw) {
          try { payload = JSON.parse(raw); }
          catch (_) { throw new Error('Local suggester returned invalid JSON.'); }
        }
        if (!response.ok || payload.ok === false) {
          const detail = payload.error || ('Request failed with HTTP ' + response.status + '.');
          throw new Error(String(detail));
        }
        suggestCandidates = Array.isArray(payload.candidates) ? payload.candidates : [];
        renderSuggestResults();
      } catch (error) {
        console.error('[suggest] search failed', error);
        const rawMessage = error instanceof Error ? error.message : String(error);
        const message = /failed to fetch/i.test(rawMessage)
          ? 'Could not reach the local suggester. Start "' + LOCAL_SUGGEST_ITEMS_COMMAND + '" and try again.'
          : rawMessage;
        setStatus(suggestStatus, message, 'error');
      } finally {
        suggestBusy = false;
        suggestSearchBtn.disabled = false;
      }
    }

    suggestSearchBtn.addEventListener('click', runSuggestSearch);
    // Hitting Enter inside the keyword field used to submit a <form>; now bind
    // it explicitly so the same shortcut still works without a form element.
    suggestKeywords.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); runSuggestSearch(); }
    });

    function renderSuggestResults() {
      suggestForm.hidden = true;
      suggestResultsPane.hidden = false;
      suggestResultsList.innerHTML = '';
      suggestResultsCount.textContent =
        suggestCandidates.length + ' candidate' + (suggestCandidates.length === 1 ? '' : 's');
      suggestCandidates.forEach((c, idx) => {
        const li = document.createElement('li');
        li.className = 'suggest-result' + (c.already_in_db ? ' is-existing' : '');
        li.dataset.idx = String(idx);

        const img = document.createElement('img');
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        img.loading = 'lazy';
        img.decoding = 'async';
        if (c.image_url) img.src = c.image_url;
        li.appendChild(img);

        const meta = document.createElement('div');
        meta.className = 'suggest-result-meta';
        const link = document.createElement('a');
        link.className = 'suggest-result-link';
        link.href = c.url || '#';
        link.target = '_blank';
        link.rel = 'noopener nofollow sponsored';
        const titleEl = document.createElement('div');
        titleEl.className = 'suggest-result-title';
        titleEl.textContent = c.title || 'Untitled';
        link.appendChild(titleEl);
        meta.appendChild(link);

        const sub = document.createElement('div');
        sub.className = 'suggest-result-sub';
        const subParts = [];
        if (c.price_display) subParts.push(c.price_display);
        else subParts.push('price n/a');
        if (c.query) subParts.push('query: ' + c.query);
        sub.textContent = subParts.join(' · ');
        meta.appendChild(sub);
        li.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'suggest-result-actions';
        if (c.already_in_db) {
          const badge = document.createElement('span');
          badge.className = 'suggest-result-badge';
          badge.textContent = 'Already added';
          actions.appendChild(badge);
        } else {
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.className = 'suggest-result-check';
          check.dataset.idx = String(idx);
          actions.appendChild(check);
        }
        li.appendChild(actions);

        suggestResultsList.appendChild(li);
      });
      suggestSelectAll.checked = false;
      updateAddSelectedState();
      if (!suggestCandidates.length) {
        setStatus(suggestResultsStatus, 'No candidates. Try different keywords or bypass the cache.', 'error');
      } else {
        setStatus(suggestResultsStatus, '');
      }
    }

    function updateAddSelectedState() {
      const checks = suggestResultsList.querySelectorAll('.suggest-result-check:checked');
      suggestAddSelectedBtn.disabled = !checks.length;
      suggestAddSelectedBtn.textContent = checks.length
        ? 'Add ' + checks.length + ' item' + (checks.length === 1 ? '' : 's')
        : 'Add selected';
    }

    suggestResultsList.addEventListener('change', (e) => {
      if (e.target.classList.contains('suggest-result-check')) updateAddSelectedState();
    });

    suggestSelectAll.addEventListener('change', () => {
      suggestResultsList.querySelectorAll('.suggest-result-check').forEach((c) => {
        c.checked = suggestSelectAll.checked;
      });
      updateAddSelectedState();
    });

    suggestBackBtn.addEventListener('click', () => {
      suggestResultsPane.hidden = true;
      suggestForm.hidden = false;
      setStatus(suggestStatus, '');
    });

    suggestAddSelectedBtn.addEventListener('click', async () => {
      const checks = Array.from(suggestResultsList.querySelectorAll('.suggest-result-check:checked'));
      if (!checks.length) return;
      suggestBusy = true;
      suggestAddSelectedBtn.disabled = true;
      suggestSelectAll.disabled = true;
      let added = 0;
      const fails = [];
      setStatus(suggestResultsStatus, 'Adding ' + checks.length + ' item(s)…');
      try {
        for (const check of checks) {
          const idx = Number(check.dataset.idx);
          const c = suggestCandidates[idx];
          if (!c) continue;
          try {
            await insertItem({
              kind: 'amazon_link',
              title: c.title || null,
              url: c.url,
              image_url: c.image_url || null,
              image_focus: '50% 50%',
              price_display: c.price_display || null,
              description: c.description || null
            });
            added++;
            const li = check.closest('.suggest-result');
            if (li) li.classList.add('is-existing');
            const badge = document.createElement('span');
            badge.className = 'suggest-result-badge';
            badge.textContent = 'Added';
            check.replaceWith(badge);
          } catch (error) {
            console.error('[suggest] insert failed', error);
            fails.push(c.title || c.url);
          }
        }
      } finally {
        suggestBusy = false;
        suggestSelectAll.disabled = false;
        suggestSelectAll.checked = false;
        updateAddSelectedState();
      }
      if (added) {
        await showShop(previewShopSelect.value);
      }
      const msg =
        'Added ' + added + (fails.length ? ' (' + fails.length + ' failed)' : '') +
        '. New items have no shop yet — open them in the list and use "+ Add to shops".';
      setStatus(suggestResultsStatus, msg, fails.length ? 'error' : 'success');
    });

    suggestItemsBtn.addEventListener('click', openSuggestModal);

    async function showShop(preservedGameId = '') {
      addItemBtn.disabled = true;
      setSuggestItemsButtonEnabled(false);
      try {
        await loadGames();
        if (preservedGameId && previewShopSelect.querySelector('option[value="' + CSS.escape(preservedGameId) + '"]')) {
          previewShopSelect.value = preservedGameId;
        }
        addItemBtn.disabled = false;
        setSuggestItemsButtonEnabled(true);
        await renderAllItems();
      } catch (error) {
        console.error(error);
        addItemBtn.disabled = false;
        setSuggestItemsButtonEnabled(true);
        setStatus(shopStatus, error instanceof Error ? error.message : String(error), 'error');
      }
    }

    document.querySelectorAll('[data-admin-logoff]').forEach((button) => {
      button.addEventListener('click', () => {
        adminAuth.signOut();
      });
    });

    (async function init() {
      try {
        await adminAuth.init();
      } catch (error) {
        console.error(error);
        adminAuth.showAuth(error instanceof Error ? error.message : String(error), 'error');
      }
    })();
  </script>
  <script>
    (function () {
      document.querySelectorAll('[data-admin-menu]').forEach((menu) => {
        const trigger = menu.querySelector('.mb-trigger');
        const panel = menu.querySelector('.mb-panel');
        if (!trigger || !panel) return;

        function closeMenu() {
          menu.classList.remove('open');
          panel.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
        }

        trigger.addEventListener('click', (event) => {
          event.stopPropagation();
          const isOpen = !panel.hidden;
          document.querySelectorAll('[data-admin-menu]').forEach((otherMenu) => {
            otherMenu.classList.remove('open');
            const otherTrigger = otherMenu.querySelector('.mb-trigger');
            const otherPanel = otherMenu.querySelector('.mb-panel');
            if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            if (otherPanel) otherPanel.hidden = true;
          });
          if (isOpen) return;
          menu.classList.add('open');
          panel.hidden = false;
          trigger.setAttribute('aria-expanded', 'true');
        });

        panel.addEventListener('click', (event) => {
          event.stopPropagation();
          if (event.target.closest('.mb-item')) closeMenu();
        });

        document.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeMenu();
        });
      });
    }());
  </script>
</body>
</html>
