    // The guide brief. It carries the character's own hometown rather than any
    // game's city - this room holds no game information, and the hometown is
    // the thing a human actually chose for this character.
    function buildGuidePrompt(guide) {
      const lines = [];
      lines.push('You are writing a GUIDE for THE GAME BUREAU (TGB), which makes location-based,');
      lines.push('live-action games: one part walking tour, one part scavenger hunt, one part escape');
      lines.push('room, played on real streets in a real city.');
      lines.push('');
      lines.push('WHAT A GUIDE IS');
      lines.push('- The guide is the voice in the player’s ear and on their screen. The player is');
      lines.push('  physically on the pavement; the guide runs the show remotely. That dual reality');
      lines.push('  is the whole trick - the guide is never walking beside them.');
      lines.push('- A guide is a CHARACTER, not a narrator-shaped label. It has a hometown, a way of');
      lines.push('  speaking, things it likes and a flaw it will admit to.');
      lines.push('- TGB blends history and fiction. A guide may be built on a real figure, but the');
      lines.push('  story around it is invented.');
      lines.push('- One guide can front many games, so write it to travel. Do not tie the character');
      lines.push('  to one matchup, one date, or one opponent.');
      lines.push('');
      if (guide) {
        const name = cleanText(guide.name);
        const isPlaceholder = name.replace(/\s+/g, ' ').toLowerCase() === 'mission control';
        lines.push('THE GUIDE YOU ARE WRITING');
        if (name && !isPlaceholder) {
          lines.push('- Name: ' + name);
          lines.push('  KEEP THIS NAME EXACTLY. Return it as GUIDE NAME. Do not rename or invent one,');
          lines.push('  and do not put the name inside GUIDE BIO.');
        } else {
          lines.push('- Name: not settled yet. Invent one that suits the hometown below.');
        }
        if (cleanText(guide.hometown)) lines.push('- Hometown (the character is FROM here): ' + cleanText(guide.hometown));
        if (cleanText(guide.bio)) lines.push('- Current bio (refine or replace): ' + cleanText(guide.bio));
        if (cleanText(guide.background)) lines.push('- Current background (refine or replace): ' + cleanText(guide.background));
      } else {
        lines.push('THE GUIDE YOU ARE WRITING');
        lines.push('- A new character. Invent the name, and say where it is from.');
        const notes = cleanText(state.promptNotes);
        if (notes) {
          // Verbatim, and marked as the human's word. Anything typed here -
          // "Hometown: Buffalo. Fandom: Bills." - is the only thing the AI
          // knows about this guide, so it outranks its own invention.
          lines.push('- WHAT I ALREADY KNOW ABOUT THIS GUIDE (treat as fixed, do not contradict it):');
          lines.push('  ' + notes);
        }
      }
      lines.push('');
      lines.push('DELIVER exactly these three, each on its own line, nothing else:');
      lines.push('GUIDE NAME: <the name a player hears>');
      lines.push('GUIDE BIO: <2-3 sentences the PLAYER reads. Do not include the guide’s name.>');
      lines.push('GUIDE BACKGROUND: <the full breakdown - appearance, personality, motivation,');
      lines.push('strengths and flaws, voice and tone, signature phrases, and one sample line the');
      lines.push('guide says at the first stop. Never shown to a player.>');
      return lines.join('\n');
    }

    // --- the city list --------------------------------------------------------
    function fillCityList() {
      const list = el('cityList');
      if (!list || !window.TgbCities) return;
      window.TgbCities.load().then(() => {
        list.innerHTML = '';
        window.TgbCities.all().forEach((row) => {
          const o = document.createElement('option');
          o.value = row.city;
          list.appendChild(o);
        });
      }).catch(() => {});
    }

    // --- wiring ---------------------------------------------------------------

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading guides...');
        fillCityList();
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.guides = [];
        render();
        setStatus('Sign in with an admin account.');
      }
    });
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    el('manualBtn').addEventListener('click', () => openForm(null));
    el('promptBtn').addEventListener('click', () => showGuidePrompt(null));
    el('promptNotes').addEventListener('input', (e) => {
      state.promptNotes = e.target.value;
      refreshNewGuidePrompt();
    });
    el('searchInput').addEventListener('input', (e) => { state.filter = e.target.value; render(); });
    el('showArchived').addEventListener('change', (e) => { state.showArchived = e.target.checked; render(); });
    el('guideForm').addEventListener('submit', submitForm);
    document.querySelectorAll('[data-form-close]').forEach((b) => b.addEventListener('click', closeForm));
    el('formBackdrop').addEventListener('click', closeForm);
    el('confirmYes').addEventListener('click', () => closeAsk(true));
    el('confirmNo').addEventListener('click', () => closeAsk(false));
    el('confirmBackdrop').addEventListener('click', () => closeAsk(false));
    document.querySelectorAll('[data-prompt-close]').forEach((b) => b.addEventListener('click', closePrompt));
    el('promptBackdrop').addEventListener('click', closePrompt);
    el('copyPromptBtn').addEventListener('click', async () => {
      const ok = await copyText(el('promptText').value);
      el('copyStatus').textContent = ok ? 'Copied' : 'Copy it by hand';
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!el('promptCard').hidden) closePrompt();
      else if (!el('confirmCard').hidden) closeAsk(false);
      else if (!el('formCard').hidden) closeForm();
    });

    render();
    adminAuth.init();
  </script>
</body>
</html>
