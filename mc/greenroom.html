<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GUIDE GREEN ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --mc-shell-width: 1180px;
      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button, textarea { font: inherit; }
    a { color: var(--accent); }

    .prompt-layout {
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto;
    }

    .prompt-main { display: grid; gap: 16px; min-width: 0; }

    .prompt-panel,
    .side-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 36px var(--paper-shadow);
      overflow: hidden;
    }

    /* No accent stripe. Every panel here wore an 8px dark-blue rule across the
       top; at four boxes down the page it stopped marking anything and just
       made the page stripey. The 1px panel line is enough of an edge. */
    .prompt-panel { min-width: 0; }

    .explain { padding: 18px; border-top: 8px solid var(--bic-red); }
    .explain h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .explain p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .explain p:last-child { margin-bottom: 0; }
    .explain strong { color: var(--ink); }

    .side-label {
      display: block;
      margin-bottom: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── The queue ────────────────────────────────────────────────────────── */
    /* A faint tint on the panel body so the white cards read as objects sitting
       on it. Both were near-white before, which left the cards relying entirely
       on their 1px border to separate from the background. */
    .queue-panel {
      min-inline-size: 0;
      padding: 4px 0 0;
      border: 1px solid var(--cut-panel-line);
      background: var(--cut-panel-bg);
      border-radius: 10px;
      overflow: visible;
      /* Tighter than the shared .prompt-panel cushion (0 18px 36px). That wide
         soft shadow is right for a modal floating over the page; under a long
         list it just blurs the panel's own edge. Modals keep it. */
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .queue-panel > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .queue-status {
      display: none;
      margin: 0 16px 8px auto;
    }
    .queue-status:not(:empty) {
      display: flex;
      justify-content: flex-end;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }
    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .panel-sub {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .panel-head-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

    /* Active / Skipped tabs. Both views render from the same posts array —
       the only difference is which side of the skip list a post sits on. */
    /* Segmented control, not a row of buttons: one inset track with the active
       segment raised out of it. Reads as "three views of one list" rather than
       three independent controls.

       The 16px side margin is the panel's gutter — .prompt-panel carries no
       padding of its own (its .panel-head brings its own), so the tab strip and
       the card list each supply it. That was invisible while posts were
       edge-to-edge rows; once they became bordered cards they sat flush against
       the panel wall, which is what this fixes. */
    .queue-tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      margin: 8px 16px 12px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #f8fbff;
      box-shadow: inset 0 1px 1px rgba(var(--bic-blue-rgb), 0.06);
    }
    .queue-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.86);
      transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
    }
    .queue-tab:hover { color: var(--ink); }
    .queue-tab.is-active {
      color: var(--ink);
      border-color: var(--control-line);
      background: #fff;
      box-shadow: 0 1px 2px rgba(var(--bic-blue-rgb), 0.1);
    }
    .queue-tab-count {
      min-width: 21px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.14);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .queue-tab.is-active .queue-tab-count { background: var(--accent); color: #fff; }

    /* Cards with air between them, not rows divided by hairlines — each post is
       a discrete thing you act on. Padding is the panel gutter; see .queue-tabs.
       :empty so a hidden list contributes no stray bottom space. */
    .queue-list { display: grid; gap: 10px; padding: 0 16px 16px; }
    .queue-list:empty { padding: 0; }

    /* Radius one step tighter than the panel's 12px: a card nested inside a
       container should not share its corner, or the two read as one surface. */
    .post {
      display: grid;
      gap: 0;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(17, 24, 32, 0.05);
      transition: box-shadow 120ms ease, border-color 120ms ease;
    }
    /* Hover sharpens the edge rather than lifting the card. A translate plus a
       wide blur reads soft and makes the whole list feel like it is floating;
       a darker border and a tight shadow keep the edges crisp. */
    .post:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.46);
      box-shadow: 0 1px 5px rgba(17, 24, 32, 0.09);
    }
    /* A decided card is legible but visibly out of the running. Posted sits at
       a lighter touch than skipped — it is done, not discarded — and carries a
       green edge so the two decided tabs never look like each other. */
    .post.is-skipped { opacity: 0.6; }
    .post.is-skipped:hover { opacity: 1; }
    .post.is-posted { opacity: 0.85; border-left: 3px solid var(--success, #2f7d4f); }
    .post.is-posted:hover { opacity: 1; }
    .post-receipt {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--success, #2f7d4f);
    }

    .post-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.24);
      background: #f7faff;
      color: rgba(var(--bic-blue-rgb), 0.86);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .post-kicker-id {
      color: var(--ink);
    }
    /* Sits in front of REASONING and wears the label's own type, so the line
       reads as one run -- "72% REASONING History. ..." -- rather than as a badge
       parked beside a heading. Tinted red under 40 only: that is the band the
       bot files to reach its five with a rule bent, and the one worth catching
       on the way past. */
    .post-why-score {
      margin-right: 7px;
      color: rgba(var(--bic-blue-rgb), 0.9);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
    }
    .post-why-score.is-low { color: var(--bic-red); }

    /* ── The post as it will look ─────────────────────────────────────────── */
    .post-preview { display: grid; gap: 10px; padding: 14px 14px 13px; }

    /* The caption IS the post, so it is the largest thing on the card and wears
       no quote-block chrome — chrome would imply it is being cited rather than
       published. */
    .post-caption {
      margin: 0;
      color: var(--ink);
      font-size: 1.01rem;
      line-height: 1.45;
      letter-spacing: -0.004em;
    }

    /* The unfurled link, shaped like the card X and Facebook will render. With
       a thumbnail it goes image-left / text-right; without one — no og:image,
       an older row, or an image that failed to load — the grid collapses to a
       single column and it looks exactly as it did before thumbnails existed. */
    .post-card {
      display: grid;
      gap: 2px;
      padding: 9px 11px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #f7faff;
      text-decoration: none;
      color: inherit;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .post-card:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.46);
      background: #eef4ff;
    }
    .post-card.has-shot {
      grid-template-columns: 116px minmax(0, 1fr);
      align-items: center;
      gap: 13px;
      padding: 10px;
    }
    .post-card-body { display: grid; gap: 3px; min-width: 0; }
    .post-card-shot {
      display: block;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(17, 24, 32, 0.06);
      /* Inset hairline so a pale image still has a defined edge. */
      box-shadow: inset 0 0 0 1px rgba(17, 24, 32, 0.08);
      aspect-ratio: 16 / 10;
    }
    .post-card-shot img {
      display: block;
      width: 100%;
      height: 100%;
      /* cover, so a tall or panoramic og:image still fills the tile instead of
         letterboxing — every card in the list then reads at the same size. */
      object-fit: cover;
    }
    @media (max-width: 560px) {
      .post-kicker {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
      .post-card.has-shot { grid-template-columns: 84px minmax(0, 1fr); gap: 11px; }
    }
    .post-card-domain {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.84);
    }
    .post-card-headline {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.28;
      color: var(--ink);
    }
    .post-card-meta {
      font-size: 0.72rem;
      line-height: 1.35;
      color: rgba(var(--bic-blue-rgb), 0.84);
    }

    /* ── Ephemera: ours, never posted ─────────────────────────────────────── */
    .post-ephemera {
      display: grid;
      gap: 8px;
      padding: 11px 14px 13px;
      border-top: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      background: #f8fbff;
    }

    /* The label sits inline so a one-line note stays one line. */
    .post-why-label {
      margin-right: 7px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .post-why {
      margin: 0;
      color: rgba(var(--bic-blue-rgb), 0.82);
      font-size: 0.82rem;
      font-style: italic;
      line-height: 1.45;
    }

    /* Topic + platform tags. Topics are quiet (they describe the story);
       platforms are loud and colour-coded (they are the recommendation you act
       on). Each platform chip carries its format reason as a title. */

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Platform styling is now only worn by the picker's tick buttons — the
       "Post to" pills on the card were removed, so there is no link variant. */
    .tag--platform { border-width: 1.5px; }
    /* The merged Meta row. Facebook's blue leads because Facebook is always
       part of it; Instagram only joins when the candidate has an image. The
       old .is-facebook / .is-instagram rules died with the two separate rows. */
    .tag--platform.is-meta { color: #1b4da8; border-color: rgba(27, 77, 168, 0.45); background: rgba(27, 77, 168, 0.06); }

    /* A question needs less room than a form. */
    .tool-modal-panel--ask { width: min(430px, calc(100vw - 32px)); }
    .confirm-body { display: grid; gap: 14px; padding: 16px 18px 18px; }
    .confirm-text { margin: 0; color: var(--ink); font-size: 0.95rem; line-height: 1.5; }

    /* Edit sits apart from the decisions. Post, Copy and Skip are the three
       things you do to a candidate; Edit is maintenance on it, so it goes to
       the far end rather than into that sequence. */
    .post-actions .post-edit-btn { margin-left: auto; }

    .post-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
    .post-edit-btn { margin-left: auto; }

    /* Post picker: tick any number of platforms, then step through them
       one composer at a time — each opened by its own click, see the JS. */
    /* White, because it now sits on the tinted ephemera panel — the old blue
       wash disappeared into it. */
    /* Post dialog body: the candidate restated at the top so you know which
       one you are posting, then the picker. */
    /* Same treatment as .post-card-shot, so the picture looks identical here and
       on the card. Capped in height because the dialog is a working surface: the
       point is to recognise the image, not to inspect it. */
    /* Inside the dialog the picker wears the same tinted cut panel as the queue
       and the command bar, so this reads as part of the room rather than a
       generic modal. It used to drop its frame entirely and sit on the modal's
       white, which is what made it look like a different product. */
    /* One row per account: tick on the left, why-it-fits on the right. */
    /* The agent's own reason for THIS story reads at full strength; the
       standing format note for an untagged account sits back. */
    /* The reason a ticked platform cannot go out by machine. Quieter than the
       format note above it — it is a constraint, not a recommendation. */
    @media (max-width: 560px) {
    }
    .autopost-choice { min-height: 30px; padding: 0 12px; cursor: pointer; opacity: 0.55; justify-content: center; }
    .autopost-choice.is-suggested { box-shadow: inset 0 0 0 1.5px currentColor; }
    .autopost-choice:hover { filter: brightness(0.94); }
    /* Ticked = full strength; unticked sits back so the selection is readable
       at a glance without a checkbox glyph competing with the platform tag. */
    .autopost-choice[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 0 0 2px currentColor; }
    .autopost-choice.is-done { opacity: 0.4; text-decoration: line-through; }
    .autopost-go[disabled] { opacity: 0.45; cursor: not-allowed; }
    .post-feedback {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--success);
    }
    /* The paste notice stays until the next action, so it is still on screen
       when you come back from the platform's tab. Loud enough to be the answer
       to "why is the box empty?". */
    .post-feedback.is-sticky {
      padding: 6px 11px;
      border: 1px solid rgba(194, 55, 55, 0.34);
      border-radius: 7px;
      background: rgba(194, 55, 55, 0.07);
      color: var(--bic-red);
      letter-spacing: 0.06em;
      text-transform: none;
      font-size: 0.74rem;
    }

    /* An empty tab is a normal state here — Posted and Skipped both start
       empty — so it gets a dashed well rather than a bare line of grey text
       floating in the panel. */
    .queue-empty {
      padding: 34px 18px;
      margin: 0 16px 18px;
      border: 1px dashed var(--cut-panel-line);
      border-radius: 12px;
      background: #f8fbff;
      color: var(--ink);
      font-size: 0.92rem;
      line-height: 1.6;
      text-align: center;
    }
    .queue-empty[hidden] { display: none; }

    /* ── Focus, consistently ──────────────────────────────────────────────
       Every interactive thing on the page gets the same visible ring. There
       was none before, so keyboard users had only the browser default, which
       the custom backgrounds here largely swallow. :focus-visible, so a mouse
       click does not paint a ring. */
    .btn:focus-visible,
    .queue-tab:focus-visible,
    .autopost-choice:focus-visible,
    .chip:focus-visible,
    .post-card:focus-visible,
    .modal-form input:focus-visible,
    .modal-form select:focus-visible,
    .modal-form textarea:focus-visible,
    .platform-pick input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .post-card:focus-visible {
      border-color: rgba(var(--bic-blue-rgb), 0.3);
      background: rgba(var(--bic-blue-rgb), 0.045);
    }

    /* Honour a reduced-motion preference across every transition added here. */
    @media (prefers-reduced-motion: reduce) {
      .post,
      .post-card,
      .queue-tab,
      .autopost-choice,
      .btn { transition: none; }
    }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    /* display: inline-flex below is an AUTHOR rule and beats the browser's own
       [hidden] { display: none }, so hiding a button by attribute silently did
       nothing -- askConfirm's one-button notices were still showing No. Any
       element given a display here needs this line beside it. */
    .btn[hidden] { display: none; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .btn:hover { border-color: rgba(var(--bic-blue-rgb), 0.42); background: rgba(var(--bic-blue-rgb), 0.05); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn.primary:hover { background: #24396a; }
    .btn.danger { border-color: rgba(194, 55, 55, 0.42); color: var(--bic-red); }
    .btn.danger:hover { background: rgba(194, 55, 55, 0.08); }
    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    /* The legend cuts the panel's top border, and the line used to just stop
       either side of it. It now wears a folder tab: the border runs into the
       label and back out again, so the cut-out reads as a tag clipped onto the
       frame rather than a gap in it.

       The tab is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box. The word has to sit
       centred on the horizontal line, which is the legend's default position --
       the browser centres it there. But the tab's sides must stop AT that line
       rather than carrying on into the panel, and a bordered box whose bottom
       edge is the line cannot also have its text centred on the line: the text
       centre is always the better part of half a box above the bottom edge.

       So the box stays put and the outline is drawn only over the half above
       the line -- `inset: 0 0 50%`, since the legend's midpoint IS the line.
       The word's lower half then hangs into the panel, which is invisible
       because the tab fill and the panel are the same colour and there is no
       bottom edge between them.

       isolation: isolate is load-bearing. The arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own that -1 would
       drop it behind the fieldset's own background and it would vanish. */
    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .command-bar > legend::before,
    .queue-panel > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;              /* the legend's midpoint is the border line */
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome
         instead of a tab. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .admin-auth-toggle { min-height: 42px; padding-inline: 14px; white-space: nowrap; }
    .admin-auth-toggle.is-signed-in { border-color: rgba(194, 55, 55, 0.44); color: var(--bic-red); }

    /* ── Paste-ready prompt ───────────────────────────────────────────────── */
    .prompt-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .prompt {
      display: block;
      width: 100%;
      min-height: 52vh;
      padding: 18px 20px 22px;
      border: 0;
      resize: vertical;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.26) 1px, transparent 1px),
        #fffefa;
      background-position: 0 0, 56px 0, 0 0;
      background-size: 100% 28px, 100% 100%, 100% 100%;
      color: #17253c;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.55;
      outline: none;
      white-space: pre-wrap;
    }
    .prompt:focus { box-shadow: inset 0 0 0 2px rgba(var(--bic-blue-rgb), 0.22); }
    .copy-status {
      min-width: 72px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--success);
      text-align: right;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .side-stack { display: grid; gap: 16px; }
    .side-card { padding: 16px; }
    .side-card h2 {
      margin: 0 0 8px;
      font-size: 1.02rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .side-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .side-card p:last-child { margin-bottom: 0; }
    .side-note { font-size: 0.8rem; }

    .mini-list {
      display: grid;
      gap: 4px;
      margin: 10px 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .mini-list b { color: var(--ink); }

    .run-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.05);
    }
    .run-dot {
      flex: 0 0 auto;
      width: 9px; height: 9px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .run-status[data-state="ok"] .run-dot { background: #1e7a4b; }
    .run-status[data-state="stale"] .run-dot { background: var(--bic-red); }
    .run-body { display: grid; gap: 3px; min-width: 0; }
    .run-line { color: var(--ink); font-size: 0.92rem; font-weight: 800; }
    .run-sub { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }

    .side-links { display: grid; gap: 8px; margin-top: 14px; }
    .side-links + .side-links { margin-top: 8px; }

    /* ── Header (Stock Room lockup) ───────────────────────────────────────── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .stockroom-gear {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%) scaleX(-1);
      width: 184px;
      height: 184px;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow: 0 0 3px var(--paper-base), 0 0 3px var(--paper-base), 0 0 5px var(--paper-base);
    }
    .stockroom-title { margin: 0; font-size: 1.7rem; letter-spacing: 0.03em; line-height: 1; }
    .stockroom-titlecol .stockroom-substat {
      margin: 3px 0 0;
      min-height: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-head-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .socials-room-head .stockroom-gear,
    .socials-room-head .stockroom-eyebrow,
    .socials-room-head .stockroom-head-status {
      display: none;
    }

    .tool-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(17, 24, 32, 0.36);
    }
    .tool-backdrop[hidden],
    .tool-modal-panel[hidden] {
      display: none;
    }
    .tool-modal-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 100;
      width: min(780px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      transform: translate(-50%, -50%);
      overflow: auto;
    }
    .tool-modal-panel--wide {
      width: min(980px, calc(100vw - 32px));
    }
    .modal-form {
      display: grid;
      gap: 12px;
      padding: 16px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .modal-form label,
    .modal-form .field-label,
    .platform-row label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .modal-form input,
    .modal-form select,
    .modal-form textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: 600 0.92rem/1.35 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0;
      text-transform: none;
    }
    .modal-form textarea {
      min-height: 92px;
      resize: vertical;
    }
    .modal-form .full { grid-column: 1 / -1; }
    .manual-url-field {
      display: grid;
      gap: 6px;
    }
    .manual-url-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: stretch;
    }
    .manual-url-control .btn {
      min-height: 40px;
      padding-inline: 14px;
    }
    .label-opt { opacity: 0.6; font-weight: 600; letter-spacing: 0.08em; }
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .platform-row {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }
    .platform-pick {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .platform-pick input {
      width: auto;
      min-height: 0;
      padding: 0;
    }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px;
    }
    .modal-status {
      margin-right: auto;
      color: var(--bic-red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .modal-status.is-ok {
      color: var(--ink);
    }

    @media (max-width: 840px) {
      .panel-head { align-items: flex-start; flex-direction: column; }
      .copy-status { text-align: left; }
      .prompt { min-height: 60vh; padding: 14px 14px 18px; font-size: 0.82rem; }
      .post-actions .btn { flex: 1 1 auto; }
      .post-edit-btn { margin-left: 0; }
      .command-bar .btn { flex: 1 1 auto; }
      .modal-grid,
      .platform-grid {
        grid-template-columns: 1fr;
      }
      .manual-url-control {
        grid-template-columns: 1fr;
      }
    }

    /* ── Green Room additions ────────────────────────────────────────────────
       Everything above is the Socializer's stylesheet, carried over so the two
       rooms are visibly the same product. Only what a GUIDE needs and a social
       post does not is added here. */

    .guide-list { display: grid; gap: 14px; }

    .guide-card {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 10px 24px var(--paper-shadow);
    }
    .guide-card.is-archived { opacity: .58; }
    @media (max-width: 620px) {
      .guide-card { grid-template-columns: minmax(0, 1fr); }
    }

    .guide-shot {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(var(--bic-blue-rgb), .06);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .guide-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .guide-shot-empty {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .12em;
      text-align: center;
      color: var(--muted);
      padding: 8px;
    }

    .guide-figure { display: grid; gap: 8px; align-content: start; }
    .guide-figure .btn { width: 100%; }
    .guide-upload-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .64rem;
      line-height: 1.45;
      color: var(--muted);
      word-break: break-word;
      min-height: 1em;
    }
    .guide-upload-status.is-error { color: var(--bic-red); }

    .guide-body { display: grid; gap: 10px; align-content: start; min-width: 0; }

    .guide-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .guide-name { margin: 0; font-size: 1.15rem; line-height: 1.2; letter-spacing: -.01em; }
    .guide-id {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .guide-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    .guide-text { margin: 0; font-size: .9rem; line-height: 1.55; color: var(--ink); }
    .guide-text--muted { color: var(--muted); font-size: .84rem; }
    /* A background can run to 4,000 characters. The card shows the top of it
       and the editor shows the rest - a card that scrolls for a page and a half
       is a card nobody scrolls past. */
    .guide-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .guide-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .guide-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

    /* Every column, edited where it is read. The card IS the form now - the
       modal only survives for making a guide that does not exist yet. */
    .gfields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .gfield { display: grid; gap: 4px; min-width: 0; }
    .gfield--wide { grid-column: 1 / -1; }
    .gfield > span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .6rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gfield input[type="text"],
    .gfield input[type="url"],
    .gfield textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: .88rem;
      line-height: 1.5;
    }
    .gfield textarea { resize: vertical; min-height: 74px; }
    .gfield textarea.tall { min-height: 130px; }
    .gfield input:focus, .gfield textarea:focus {
      outline: none;
      border-color: var(--bic-blue);
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), .12);
    }

    /* EMPTY IS RED. Not a pill, not a warning icon - the box itself, in pen
       red, exactly where the missing thing goes. Nothing to read and nothing
       to dismiss: a wall of red boxes is the state of the guide at a glance. */
    .gfield input.is-empty, .gfield textarea.is-empty { border-color: var(--bic-red); }

    /* The system columns. Shown because they are in the table, but they have
       one writer each and it is not a person. */
    .gfield-ro {
      padding: 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
      background: rgba(var(--bic-blue-rgb), .04);
      overflow-wrap: anywhere;
    }

    .gcheck { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--ink); }
    .gcheck input { width: 16px; height: 16px; margin: 0; }

    .gsave-note { font-size: .72rem; color: var(--bic-red); font-weight: 700; }

    /* The prompt's notes row. .label-opt is built for the form's two-column
       grid and left this one squeezed against the textarea below it. */
    #promptNotesWrap {
      display: grid;
      gap: 6px;
      padding: 0 18px 12px;
      margin: 0;
    }
    #promptNotesWrap > span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #promptNotes {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: .9rem;
    }
    #promptNotes:focus {
      outline: none;
      border-color: var(--bic-blue);
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), .12);
    }
    @media (max-width: 720px) { .gfields { grid-template-columns: minmax(0, 1fr); } }

    .guide-empty {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
    }

    .gr-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
    .gr-filter input[type="search"] {
      flex: 1 1 240px;
      min-width: 0;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    .gr-filter label { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
    .gr-count { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: var(--muted); }

    /* The form modal reuses the Socializer's modal-grid; these two only exist
       because a guide has long prose where a post has a caption. */
    .modal-form textarea.tall { min-height: 200px; }
    .modal-form .field-note { font-size: .72rem; color: var(--muted); margin: 4px 0 0; }

    /* .label-opt lays its <span> out as a block label above a full-width
       control, which is right for every field here except the one that IS a
       checkbox - there the box was pushed to the far edge, a screen away from
       its own word. */
    .label-opt.label-check span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: auto;
    }
    .label-opt.label-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 0;
      margin: 0;
      flex: 0 0 auto;
    }

  </style>
</head>

             placeholder="Hometown: Buffalo. Fandom: Bills. A snowplough driver who has seen it all.">

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script src="/mc/js/supabase-rest.js"></script>
  <script src="/mc/assets/geo.js"></script>
  <script src="/mc/assets/city-picker.js"></script>
  <script src="picmaker/prompts.js"></script>
  <script>
    'use strict';

    // GUIDE GREEN ROOM — where the narrators are made.
    //
    // One table, public.guides, and nothing else. A guide is a CHARACTER: one
    // row, however many games point at it. This room deliberately shows NO game
    // information at all - not a count, not a title. A guide is written on its
    // own terms, and the moment a card starts listing games it becomes a report
    // about games rather than a place to write a character.
    //
    // The games.guide_* columns are still what both engines read at play time.
    // NOTHING HERE WRITES THEM: the guides_sync_games trigger pushes a saved
    // guide onto every game pointing at it. Write the guide; the trigger does
    // the rest.

    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const GUIDE_BUCKET = 'guides';
    const EDITABLE = ['name', 'hometown', 'bio', 'background', 'image_url'];

    const state = {
      authed: false,
      guides: [],
      filter: '',
      showArchived: false,
      editingId: null,      // null while the form is adding rather than editing
      busy: false,
      dirty: new Set(),     // guide ids with unsaved boxes on their card
      promptNotes: ''       // what the PROMPT box was told about the guide to invent
    };

    const el = (id) => document.getElementById(id);
    const cleanText = (v) => String(v == null ? '' : v).trim();
    const guideList = el('guideList');
    const pageStatus = el('pageStatus');

    function cssEscape(value) {
      const s = String(value);
      return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\\]]/g, '\\$&');
    }

    let statusTimer = 0;
    function setStatus(text, kind) {
      if (!pageStatus) return;
      window.clearTimeout(statusTimer);
      pageStatus.textContent = text || 'Each game has a guide that lends voice and tone to the player’s experience. A guide can narrate one or more games.';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
      if (text && kind !== 'error') statusTimer = window.setTimeout(() => setStatus(''), 4500);
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
        try { await adminAuth.ensureFreshSession(); } catch (error) {}
      }
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.hint || payload.error || text;
        } catch (error) { return text; }
      } catch (error) { return fallback; }
    }

    function adminToken() {
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      return (session && session.access_token) || '';
    }

    // --- loading --------------------------------------------------------------

    async function refresh() {
      try {
        await ensureFreshSession();
        // select=*, never a column list: naming a column the database does not
        // have 400s the whole load. The standing rule in this codebase.
        const url = restUrl('guides', { select: '*', order: 'name.asc' });
        const rows = (window.TgbRest && window.TgbRest.fetchAll)
          ? await window.TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }))
          : await (await fetch(url, { headers: authHeaders() })).json();
        if (rows && rows.code) throw new Error(rows.message || 'Load failed.');
        state.guides = Array.isArray(rows) ? rows : [];
        render();
        setStatus('');
      } catch (error) {
        console.error(error);
        const msg = (error && error.message) || 'Load failed.';
        setStatus(msg, 'error');
        guideList.innerHTML = '';
        guideList.appendChild(emptyNode(/relation|does not exist/i.test(msg)
          ? 'public.guides does not exist yet — run mc/supabase/migrations/2026080901_guides_table.sql.'
          : 'Could not load guides. ' + msg));
      }
    }

    // --- rendering ------------------------------------------------------------

    function emptyNode(text) {
      const node = document.createElement('div');
      node.className = 'guide-empty';
      node.textContent = text;
      return node;
    }

    function visibleGuides() {
      const q = state.filter.toLowerCase();
      return state.guides.filter((g) => {
        if (!state.showArchived && g.archived) return false;
        if (!q) return true;
        return (cleanText(g.name) + ' ' + cleanText(g.hometown) + ' ' + cleanText(g.bio)).toLowerCase().includes(q);
      });
    }

    function render() {
      guideList.innerHTML = '';
      if (!state.authed) {
        guideList.appendChild(emptyNode('Sign in with an admin account to work on the guides.'));
        el('countLine').textContent = '';
        return;
      }
      const rows = visibleGuides();
      el('countLine').textContent = rows.length === state.guides.length
        ? state.guides.length + ' guide' + (state.guides.length === 1 ? '' : 's')
        : rows.length + ' of ' + state.guides.length + ' guides';
      if (!rows.length) {
        guideList.appendChild(emptyNode(state.guides.length
          ? 'No guide matches that filter.'
          : 'No guides yet. Press MANUAL to write the first one.'));
        return;
      }
      rows.forEach((g) => guideList.appendChild(renderGuideCard(g)));
    }

    function chip(text) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = text;
      return s;
    }

    function mkBtn(text, title, onClick, cls) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn small' + (cls ? ' ' + cls : '');
      b.textContent = text;
      if (title) b.title = title;
      b.addEventListener('click', onClick);
      return b;
    }

    function renderGuideCard(guide) {
      const card = document.createElement('article');
      card.className = 'guide-card' + (guide.archived ? ' is-archived' : '');
      card.dataset.guideId = guide.id;

      // ── the portrait, and the two buttons under it ──
      const figure = document.createElement('div');
      figure.className = 'guide-figure';
      const shot = document.createElement('div');
      shot.className = 'guide-shot';
      shot.setAttribute('data-shot', '');
      paintShot(shot, guide);

      const status = document.createElement('div');
      status.className = 'guide-upload-status';
      status.setAttribute('aria-live', 'polite');

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.hidden = true;
      const uploadBtn = mkBtn('Upload Image', 'Put a portrait on this guide', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = '';
        if (file) uploadImageFile(guide.id, file, uploadBtn, status);
      });

      figure.append(shot, uploadBtn, fileInput);
      // Offered when there is a URL and something still to do with it: either
      // the picture is not yet in the row, or the file is still hosted
      // somewhere that is not ours. Both are fixed by the same press.
      const hasUrl = !!cleanText(guide.image_url);
      const notOurs = hasUrl && cleanText(guide.image_url).indexOf(SUPABASE_CONFIG.url) !== 0;
      if (hasUrl && (!cleanText(guide.image) || notOurs)) {
        figure.appendChild(mkBtn('Host Here', 'Copy this picture into the row, and host a copy for the engines',
          (e) => uploadImageFromUrl(guide.id, e.target, status)));
      }
      figure.appendChild(status);

      // ── the character ──
      const body = document.createElement('div');
      body.className = 'guide-body';

      const head = document.createElement('div');
      head.className = 'guide-head';
      const name = document.createElement('h2');
      name.className = 'guide-name';
      name.textContent = cleanText(guide.name) || 'Unnamed guide';
      const id = document.createElement('span');
      id.className = 'guide-id';
      id.textContent = '#' + guide.id;
      head.append(name, id);

      body.appendChild(head);

      // EVERY COLUMN IN public.guides, in the order a person reads them: what
      // a player hears first, then what is written about the character, then
      // the plumbing. Editable ones are boxes; the four with exactly one
      // non-human writer are shown and locked.
      const fields = document.createElement('div');
      fields.className = 'gfields';
      fields.append(
        gField(guide, 'name', 'name', { required: true }),
        gField(guide, 'hometown', 'hometown', { list: 'cityList', required: true }),
        gField(guide, 'bio', 'bio', { multiline: true, wide: true, required: true }),
        gField(guide, 'background', 'background', { multiline: true, tall: true, wide: true, required: true }),
        gField(guide, 'image_url', 'image_url', { wide: true, type: 'url', required: true }),
        gReadOnly('image', imageSummary(guide)),
        gReadOnly('id', String(guide.id)),
        gReadOnly('created_at', stamp(guide.created_at)),
        gReadOnly('updated_at', stamp(guide.updated_at)),
        gArchived(guide)
      );
      body.appendChild(fields);

      const actions = document.createElement('div');
      actions.className = 'guide-actions';
      const save = mkBtn('Save', 'Write these fields back', () => saveCard(guide.id), 'primary');
      save.dataset.action = 'save';
      save.disabled = !state.dirty.has(String(guide.id));
      const note = document.createElement('span');
      note.className = 'gsave-note';
      note.dataset.role = 'dirty-note';
      note.textContent = state.dirty.has(String(guide.id)) ? 'unsaved' : '';
      actions.append(
        save,
        mkBtn('Image Prompt', 'An AI prompt for this guide’s portrait', () => showImagePrompt(guide.id)),
        mkBtn('Prompt', 'An AI prompt that rewrites this guide', () => showGuidePrompt(guide.id)),
        mkBtn(guide.archived ? 'Restore' : 'Archive',
          guide.archived ? 'Back into the working list' : 'Out of the working list, without deleting',
          () => toggleArchived(guide.id)),
        mkBtn('Delete', 'Remove this guide for good', () => deleteGuide(guide.id), 'warn'),
        note
      );
      body.appendChild(actions);

      card.append(figure, body);
      return card;
    }

    // --- the fields on a card -------------------------------------------------

    // A live copy per guide, so typing does not have to hit the database on
    // every keystroke and Save has something to write. Keyed by id.
    const drafts = new Map();
    function draftOf(guide) {
      const key = String(guide.id);
      if (!drafts.has(key)) {
        drafts.set(key, {
          name: cleanText(guide.name), hometown: cleanText(guide.hometown),
          bio: cleanText(guide.bio), background: cleanText(guide.background),
          image_url: cleanText(guide.image_url), archived: !!guide.archived
        });
      }
      return drafts.get(key);
    }
    const CARD_FIELDS = ['name', 'hometown', 'bio', 'background', 'image_url'];
    function isDirty(guide) {
      const d = draftOf(guide);
      return CARD_FIELDS.some((f) => d[f] !== cleanText(guide[f])) || d.archived !== !!guide.archived;
    }
    function markCardDirty(guide) {
      const key = String(guide.id);
      if (isDirty(guide)) state.dirty.add(key); else state.dirty.delete(key);
      const card = guideList.querySelector('[data-guide-id="' + cssEscape(key) + '"]');
      if (card) {
        const save = card.querySelector('[data-action="save"]');
        if (save) save.disabled = !state.dirty.has(key);
        const note = card.querySelector('[data-role="dirty-note"]');
        if (note) note.textContent = state.dirty.has(key) ? 'unsaved' : '';
      }
    }

    function gField(guide, key, label, opts) {
      const options = opts || {};
      const wrap = document.createElement('label');
      wrap.className = 'gfield' + (options.wide ? ' gfield--wide' : '');
      const lab = document.createElement('span');
      lab.textContent = label;
      const draft = draftOf(guide);
      const input = document.createElement(options.multiline ? 'textarea' : 'input');
      if (!options.multiline) input.type = options.type || 'text';
      if (options.tall) input.className = 'tall';
      if (options.list) input.setAttribute('list', options.list);
      input.value = draft[key];
      input.dataset.field = key;
      // EMPTY IS RED, and only empty. There is no other validation state on a
      // card - a guide with no background is not an error, it is unfinished
      // work, and the red box says which piece is missing without a sentence.
      const paint = () => input.classList.toggle('is-empty', options.required !== false && !cleanText(input.value));
      paint();
      input.addEventListener('input', () => {
        draft[key] = input.value;
        paint();
        markCardDirty(guide);
      });
      wrap.append(lab, input);
      return wrap;
    }

    function gReadOnly(label, value) {
      const wrap = document.createElement('div');
      wrap.className = 'gfield';
      const lab = document.createElement('span');
      lab.textContent = label;
      const box = document.createElement('div');
      box.className = 'gfield-ro';
      box.textContent = value || '—';
      wrap.append(lab, box);
      return wrap;
    }

    function gArchived(guide) {
      const wrap = document.createElement('div');
      wrap.className = 'gfield';
      const lab = document.createElement('span');
      lab.textContent = 'archived';
      const line = document.createElement('label');
      line.className = 'gcheck';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!draftOf(guide).archived;
      box.addEventListener('change', () => {
        draftOf(guide).archived = box.checked;
        markCardDirty(guide);
      });
      line.append(box, document.createTextNode(box.checked ? 'out of the working list' : 'in the working list'));
      wrap.append(lab, line);
      return wrap;
    }

    // The image column holds a whole picture, so the field shows its weight
    // rather than 90,000 characters of base64 nobody can read or edit.
    function imageSummary(guide) {
      const inline = cleanText(guide.image);
      if (!inline) return 'not in the row';
      const kb = Math.round(inline.length / 1024);
      const kind = (inline.match(/^data:([^;]+)/) || [])[1] || 'image';
      return kind + ' · ' + kb + ' KB in the row';
    }

    function stamp(value) {
      const v = cleanText(value);
      if (!v) return '';
      const d = new Date(v);
      return isNaN(d) ? v : d.toLocaleString([], {
        year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
    }

    async function saveCard(id) {
      const guide = findGuide(id);
      if (!guide) return;
      const draft = draftOf(guide);
      if (!draft.name) { setStatus('A guide needs a name.', 'error'); return; }
      if (draft.hometown && window.TgbCities
        && !window.TgbCities.all().some((c) => c.city === draft.hometown)) {
        setStatus('"' + draft.hometown + '" is not in the city catalogue — pick one from the list.', 'error');
        return;
      }
      const payload = {
        name: draft.name || null,
        hometown: draft.hometown || null,
        bio: draft.bio || null,
        background: draft.background || null,
        image_url: draft.image_url || null,
        archived: !!draft.archived
      };
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not save this guide.'));
        const [fresh] = await res.json();
        Object.assign(guide, fresh);
        drafts.delete(String(id));
        state.dirty.delete(String(id));
        render();
        setStatus('Saved ' + cleanText(fresh.name) + '.', 'success');
      } catch (error) {
        const raw = error.message || '';
        setStatus(/guides_name_key|duplicate key/i.test(raw)
          ? 'There is already a guide with that name — a character is meant to be singular.'
          : (raw || 'Save failed.'), 'error');

    function paintShot(shot, guide) {
      shot.innerHTML = '';
      // THE FIELD WINS. guides.image carries the portrait in the row itself;
      // image_url only points at a copy hosted elsewhere for the engines. When
      // both exist they are the same picture, and the one that cannot 404 is
      // the one to draw.
      const inline = cleanText(guide.image);
      const url = inline || cleanText(guide.image_url);
      if (!url) {
        const ph = document.createElement('div');
        ph.className = 'guide-shot-empty';
        ph.textContent = 'NO PORTRAIT';
        shot.appendChild(ph);
        return;
      }
      const img = document.createElement('img');
      img.src = url;
      img.alt = cleanText(guide.name) || 'Guide portrait';
      img.loading = 'lazy';
      // A dead link is the normal case for anything not yet hosted here, so it
      // is named rather than left as a broken-image icon. "No portrait" and
      // "the portrait link is broken" are different problems.
      img.addEventListener('error', () => {
        shot.innerHTML = '';
        const ph = document.createElement('div');
        ph.className = 'guide-shot-empty';
        ph.textContent = 'LINK IS DEAD';
        shot.appendChild(ph);
      });
      shot.appendChild(img);
    }

    function formPayload() {
      return {
        name: cleanText(el('fName').value) || null,
        hometown: cleanText(el('fHometown').value) || null,
        bio: cleanText(el('fBio').value) || null,

    async function submitForm(event) {
      if (event) event.preventDefault();
      if (state.busy) return;
      const payload = formPayload();
      if (!payload.name) { formStatus('A guide needs a name.', true); return; }
      // The hometown is a foreign key into public.cities. Catching it here
      // turns a raw 23503 into a sentence, and stops a typo being saved as a
      // city that does not exist.
      if (payload.hometown && window.TgbCities) {
        const known = window.TgbCities.all().some((c) => c.city === payload.hometown);
        if (!known) {
          formStatus('"' + payload.hometown + '" is not in the city catalogue — pick one from the list.', true);
          return;
        }
      }
      state.busy = true;
      formStatus('Saving...');
      try {
        await ensureFreshSession();
        const editing = state.editingId != null;
        const res = await fetch(
          restUrl('guides', editing ? { id: 'eq.' + state.editingId } : {}),
          {
            method: editing ? 'PATCH' : 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify(payload)
          });
        if (!res.ok) throw new Error(await readError(res, 'Could not save this guide.'));
        const [fresh] = await res.json();
        if (editing) {
          const i = state.guides.findIndex((g) => String(g.id) === String(state.editingId));
          if (i > -1) state.guides[i] = fresh;
        } else {
          state.guides.push(fresh);
        }
        state.guides.sort((a, b) => cleanText(a.name).localeCompare(cleanText(b.name)));
        closeForm();
        render();
        setStatus((editing ? 'Saved ' : 'Added ') + cleanText(fresh.name) + '.', 'success');
      } catch (error) {
        // The name index is the one a person actually trips over.
        const raw = error.message || '';
        formStatus(/guides_name_key|duplicate key/i.test(raw)
          ? 'There is already a guide with that name — a character is meant to be singular.'
          : (raw || 'Save failed.'), true);
      } finally {
        state.busy = false;
      }
    }

    // DELETE IS REAL AND IT REACHES FURTHER THAN THIS ROOM. games.guide_id is

        'This cannot be undone. Any game using this guide is left without one. '

    // --- the portrait ---------------------------------------------------------
    // Two upload paths, and the split is CORS rather than preference. A local
    // file goes straight from the browser to Supabase Storage on the admin's
    // token; a remote URL cannot be fetched by the browser at all, so the
    // upload-guide-image Edge Function fetches it server-side. Both land in the
    // guides bucket and write the same public URL back.
    //
    // KEYED BY GUIDE ID - guide-<id>.<ext>. The old scheme named the file after
    // the GAME, which is why one character could end up with eight portraits.

    function uploadStatus(node, message, isError) {
      if (!node) return;
      node.textContent = message || '';
      node.classList.toggle('is-error', !!isError);
    }

    async function applyImageUrl(id, publicUrl, status) {
      const guide = findGuide(id);
      if (!guide) return;
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ image_url: publicUrl })
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not save the portrait.'));
        const [fresh] = await res.json();
        Object.assign(guide, fresh);
        uploadStatus(status, 'Saved');
        render();
        setStatus('Portrait saved for ' + cleanText(guide.name) + '.', 'success');
      } catch (error) {
        uploadStatus(status, 'Uploaded, but saving the URL failed: ' + (error.message || error), true);
      }
    }

    // Downscale to a square-ish portrait and re-encode as JPEG. This is what
    // makes storing the picture IN THE ROW workable: the four portraits that
    // existed when this was written were 0.7-2.4 MB each, and 34 of those
    // base64'd would be a ~100 MB page load to draw cards 132 pixels wide.
    // At 512 px a portrait lands around 60-90 KB, so the whole table is ~3 MB.
    //
    // Transparency is lost to the JPEG, deliberately: a guide portrait is a
    // photograph or a painting, it sits on an opaque card, and PNG at this size
    // is three or four times the bytes for a transparency nothing uses.
    const PORTRAIT_MAX_PX = 512;
    const PORTRAIT_QUALITY = 0.82;

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Could not read that file.'));
        reader.readAsDataURL(file);
      });
    }

    function downscaleToDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, PORTRAIT_MAX_PX / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          // A JPEG has no alpha, so anything transparent would come out black
          // without this. White matches the card.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', PORTRAIT_QUALITY)); }
          catch (error) { reject(new Error('Could not re-encode that image.')); }
        };
        img.onerror = () => reject(new Error('That file is not an image the browser can read.'));
        img.src = dataUrl;
      });
    }

    async function uploadImageFile(id, file, btn, status) {
      const token = adminToken();
      if (!token) { uploadStatus(status, 'Sign in as an admin to upload.', true); return; }
      if (!/^image\//i.test(file.type || '')) { uploadStatus(status, 'Choose an image file.', true); return; }
      // The ceiling the Edge Function enforces, checked here so a pointless
      // 40 MB upload fails at once rather than at the far end.
      if (file.size > 15 * 1024 * 1024) { uploadStatus(status, 'Larger than 15 MB.', true); return; }
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      uploadStatus(status, 'Resizing...');
      try {
        // 1. Into the ROW, downscaled. This is the portrait the Green Room
        //    draws, and the one that cannot go missing.
        const inline = await downscaleToDataUrl(await fileToDataUrl(file));
        const kb = Math.round(inline.length / 1024);
        if (inline.length > 262144) throw new Error('Still ' + kb + ' KB after resizing — try a smaller image.');
        uploadStatus(status, 'Saving ' + kb + ' KB...');
        await ensureFreshSession();
        const patch = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ image: inline })
        });
        if (!patch.ok) throw new Error(await readError(patch, 'Could not save the portrait.'));
        const [saved] = await patch.json();
        const guide = findGuide(id);
        if (guide) Object.assign(guide, saved);
        render();
        uploadStatus(status, 'Saved ' + kb + ' KB · hosting a copy...');

        // 2. And a hosted copy at FULL size, because guides.image_url is what
        //    the trigger pushes onto games.guide_image_url for the engines. A
        //    data URI must never go down that path - it would be copied onto
        //    every game pointing at this guide.
        const rawExt = (String(file.name).split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const ext = rawExt || (String(file.type).split('/')[1] || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
        const path = encodeURIComponent('guide-' + id + '.' + ext);
        const base = SUPABASE_CONFIG.url.replace(/\/+$/, '');
        // Its own try. The portrait is ALREADY SAVED at this point; the hosted
        // copy is for the engines. Letting a Storage hiccup report "Upload
        // failed" would send somebody back to re-upload a picture that is
        // sitting in the row working perfectly.
        try {
          const res = await fetch(base + '/storage/v1/object/' + GUIDE_BUCKET + '/' + path, {
            method: 'POST',
            headers: {
              apikey: SUPABASE_CONFIG.publishableKey,
              Authorization: 'Bearer ' + token,
              'Content-Type': file.type || 'application/octet-stream',
              'x-upsert': 'true'
            },
            body: file
          });
          if (!res.ok) {
            const t = await res.text().catch(() => '');
            throw new Error('storage said ' + res.status + (t ? ': ' + t.slice(0, 90) : ''));
          }
          // Cache-bust, or a replacement is masked by the stale CDN copy.
          await applyImageUrl(id, base + '/storage/v1/object/public/' + GUIDE_BUCKET + '/' + path + '?v=' + Date.now(), status);
          uploadStatus(status, 'Saved ' + kb + ' KB · hosted copy done');
        } catch (hostErr) {
          uploadStatus(status, 'Portrait saved (' + kb + ' KB). The hosted copy for the engines failed: '
            + (hostErr.message || hostErr), true);
        }
      } catch (error) {
        uploadStatus(status, String((error && error.message) || 'Upload failed.'), true);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    // Pull a remote image into a data URI through a canvas. Works because the
    // legacy portraits live on thegamebureau.com, which is where this page is
    // served from, and Supabase Storage sends CORS headers - so both are
    // readable. Anything else taints the canvas and toDataURL throws, which is
    // caught and reported rather than left to look like a save failure.
    function urlToDownscaledDataUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const scale = Math.min(1, PORTRAIT_MAX_PX / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', PORTRAIT_QUALITY)); }
          catch (error) { reject(new Error('that image will not allow being copied (CORS)')); }
        };
        img.onerror = () => reject(new Error('could not load that image'));
        img.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cors=1';
      });
    }

    // HOST HERE does two things, and the first is the important one: it brings
    // the picture INTO the row. The second re-hosts it in Storage so the
    // engines' URL stops depending on a file path in the repo.
    async function uploadImageFromUrl(id, btn, status) {
      const guide = findGuide(id);
      if (!guide) return;
      const sourceUrl = cleanText(guide.image_url);
      if (!/^https?:\/\//i.test(sourceUrl)) { uploadStatus(status, 'No image URL to fetch.', true); return; }
      const token = adminToken();
      if (!token) { uploadStatus(status, 'Sign in as an admin to upload.', true); return; }
      btn.disabled = true;
      uploadStatus(status, 'Copying into the row...');
      try {
        try {
          const inline = await urlToDownscaledDataUrl(sourceUrl);
          const kb = Math.round(inline.length / 1024);
          await ensureFreshSession();
          const patch = await fetch(restUrl('guides', { id: 'eq.' + id }), {
            method: 'PATCH',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify({ image: inline })
          });
          if (!patch.ok) throw new Error(await readError(patch, 'could not save it'));
          const [saved] = await patch.json();
          Object.assign(guide, saved);
          render();
          uploadStatus(status, 'In the row (' + kb + ' KB) · hosting...');
        } catch (inlineErr) {
          uploadStatus(status, 'Could not copy it into the row: ' + (inlineErr.message || inlineErr), true);
        }
        const endpoint = SUPABASE_CONFIG.url.replace(/\/+$/, '') + '/functions/v1/upload-guide-image';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_CONFIG.publishableKey,
            Authorization: 'Bearer ' + token
          },
          // gameId is only ever an object name to that function.
          body: JSON.stringify({ url: sourceUrl, gameId: 'guide-' + id })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error((data && data.error) || ('upload failed (' + res.status + ')'));
        const publicUrl = cleanText(data && data.url);
        if (!publicUrl) throw new Error('no url returned');
        await applyImageUrl(id, publicUrl, status);
      } catch (error) {
        uploadStatus(status, String((error && error.message) || 'Upload failed.'), true);
      } finally {
        btn.disabled = false;
      }
    }

    // --- the prompts ----------------------------------------------------------

    function openPrompt(title, help, chips, text) {
      el('promptTitle').textContent = title;
      el('promptHelp').textContent = help;
      const meta = el('promptChips');
      meta.innerHTML = '';
      (chips || []).forEach((c) => meta.appendChild(chip(c)));

      el('copyStatus').textContent = '';
      el('promptCard').hidden = false;
      el('promptBackdrop').hidden = false;

    }

    function closePrompt() {
      el('promptCard').hidden = true;
      el('promptBackdrop').hidden = true;
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; }
      catch (error) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (err) { return false; }
      }
    }

    let promptFor = null;   // the guide the open prompt is about, or null for a new one

    function showGuidePrompt(id) {
      const guide = id == null ? null : findGuide(id);
      promptFor = guide;
      // The notes box only earns its place on a prompt with nothing to go on.
      // Asked about an existing guide, the brief already carries its name,
      // hometown, bio and background - a second place to say the same thing
      // would just be somewhere for the two to disagree.
      el('promptNotesWrap').hidden = !!guide;
      openPrompt(
        guide ? ('Prompt — ' + (cleanText(guide.name) || '#' + guide.id)) : 'Prompt — a new guide',
        guide
          ? 'Paste this into any AI. It answers with GUIDE NAME / GUIDE BIO / GUIDE BACKGROUND; bring those back into the boxes on the card.'
          : 'Say what you know in Notes — hometown, fandom, the voice you want — and it folds into the brief as you type. Paste the result into any AI, then press MANUAL to enter what it writes.',
        ['public.guides', 'writes nothing itself', guide ? 'keeps the existing name' : 'invents a character'],
        buildGuidePrompt(guide));

    function refreshNewGuidePrompt() {
      if (promptFor) return;
      el('promptText').value = buildGuidePrompt(null);
    }

    function showImagePrompt(id) {
      const guide = findGuide(id);
      if (!guide) return;
      openPrompt('Image Prompt — ' + (cleanText(guide.name) || '#' + guide.id),
        'Paste this into an image generator, then bring the result back with Upload Image.',

        }));
