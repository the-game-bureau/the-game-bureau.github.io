<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAGLINES | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea { font: inherit; }

    .section-head {
      display: grid;
      gap: 6px;
      margin: 0 0 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }
    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 0.92rem; }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }
    .legend { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; }
    .legend .star { color: var(--bic-red); font-weight: 700; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.icon { min-width: 38px; padding: 0 10px; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .signout-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }

    .group { display: grid; gap: 8px; }
    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0 2px;
      padding-bottom: 6px;
      border-bottom: 2px solid rgba(var(--bic-blue-rgb), 0.2);
    }
    .group-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .group-count { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

    .item-list { display: grid; gap: 8px; }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .item-bullet {
      width: 20px;
      margin-top: 2px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
    .item.is-rival .item-bullet { color: var(--bic-red); }

    .item-main { min-width: 0; }
    .game-name {
      margin: 0 0 2px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .game-matchup { color: rgba(var(--bic-blue-rgb), 0.5); font-weight: 500; text-transform: none; letter-spacing: 0; }
    .game-date {
      color: var(--bic-red);
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tagline-body {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
    }
    .tagline-body.is-empty { color: var(--muted); font-style: italic; }
    .tagline-suggestion {
      margin: 5px 0 0;
      color: var(--ink);
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .tagline-suggestion-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .item-actions { display: flex; gap: 6px; align-items: center; }

    .approve-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
    }
    .approve-toggle input { accent-color: var(--success); cursor: pointer; margin: 0; }
    .approve-toggle.is-on { border-color: var(--success); background: rgba(47, 107, 61, 0.1); color: var(--success); }

    .item.is-approved { border-left: 3px solid var(--success); }

    .section { display: grid; gap: 14px; }
    .section + .section { margin-top: 18px; }
    .section-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 3px solid rgba(var(--bic-blue-rgb), 0.28);
    }
    .section-title {
      margin: 0;
      font-size: 1.24rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .section-count { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .section-approved .section-title-row { border-bottom-color: var(--success); }
    .section-approved .section-title { color: var(--success); }
    .section-approved .section-title::before { content: '\2713  '; }

    .edit-form { grid-column: 1 / -1; display: grid; gap: 6px; }
    .edit-form textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      resize: vertical;
    }
    .edit-form .actions { display: flex; gap: 6px; justify-content: flex-end; }

    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }
  </style>
  <link rel="stylesheet" href="js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>

    <section class="section-head">
      <p class="kicker">TGB MISSION CONTROL</p>
      <h2>TAGLINES</h2>
      <p class="status" id="pageStatus" aria-live="polite">Sign in with an admin account.</p>
      <p class="legend">Taglines are the first thing a player sees under a game's title.<br>
        <span class="star">*</span> divisional-rival matchup.</p>
    </section>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Filter by game or tagline..." autocomplete="off">
    </div>

    <section class="panel" id="taglinesPanel">
      <div class="item-list" id="groups"></div>
    </section>
  </main>

  <script src="js/admin-auth.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/admin-site-nav.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    // NFL team -> league / conference / division, keyed by mascot. Used to sort
    // games by the visiting (away) team and to flag divisional rivals.
    const TEAM_META = {};
    const DIVISIONS = {
      'AFC East':  ['Bills', 'Dolphins', 'Patriots', 'Jets'],
      'AFC North': ['Ravens', 'Bengals', 'Browns', 'Steelers'],
      'AFC South': ['Texans', 'Colts', 'Jaguars', 'Titans'],
      'AFC West':  ['Broncos', 'Chiefs', 'Raiders', 'Chargers'],
      'NFC East':  ['Cowboys', 'Giants', 'Eagles', 'Commanders'],
      'NFC North': ['Bears', 'Lions', 'Packers', 'Vikings'],
      'NFC South': ['Falcons', 'Panthers', 'Saints', 'Buccaneers'],
      'NFC West':  ['Cardinals', 'Rams', '49ers', 'Seahawks']
    };
    Object.entries(DIVISIONS).forEach(([label, teams]) => {
      const [conf, div] = label.split(' ');
      teams.forEach((mascot) => { TEAM_META[mascot] = { league: 'NFL', conf, div }; });
    });

    // Team lore, keyed by mascot. Taglines never name the mascot directly — they
    // ALLUDE to it through fan culture and city identity. `crowd` = ways to name
    // the traveling fanbase (no mascot word); `lines` = ready-made lore lines
    // where {city} is the HOST city the visitors are invading. No day/time refs.
    const TEAM_LORE = {
      // AFC East
      Bills:      { crowd: ["Buffalo's faithful", 'the table-breaking crowd'], lines: ['Buffalo Packs The Tailgate And Heads For {city}.', "{city} Isn't Built For Buffalo Cold."] },
      Dolphins:   { crowd: ["South Beach's faithful", 'the aqua-and-orange crowd'], lines: ['Miami Brings The Heat To {city}.', 'South Beach Energy Floods {city} Streets.'] },
      Patriots:   { crowd: ["New England's faithful", 'the minuteman crowd'], lines: ['New England Marches On {city}.', 'Six-Banner Swagger Rolls Into {city}.'] },
      Jets:       { crowd: ['Gang Green', 'the flight crew'], lines: ['Gang Green Takes Off For {city}.', 'New York Noise Lands In {city}.'] },
      // AFC North
      Ravens:     { crowd: ["Baltimore's flock", 'the Charm City crowd'], lines: ['Baltimore Descends On {city}.', 'Charm City Brings Its Edge To {city}.'] },
      Bengals:    { crowd: ['the Who Dey faithful', 'the Queen City crowd'], lines: ['The Jungle Empties Into {city}.', 'Cincinnati Stripes Cross Into {city}.'] },
      Browns:     { crowd: ['the Dawg Pound', 'the Cleveland faithful'], lines: ['The Dawg Pound Travels To {city}.', 'Cleveland Grit Hits {city} Streets.'] },
      Steelers:   { crowd: ['the Terrible Towel crowd', "Steel City's faithful"], lines: ['Steel City Waves Its Towels Over {city}.', 'Pittsburgh Black-And-Gold Floods {city}.'] },
      // AFC South
      Texans:     { crowd: ['the H-Town faithful', 'the Bull Pen crowd'], lines: ['Houston Rolls Deep Into {city}.', 'Space City Touches Down In {city}.'] },
      Colts:      { crowd: ['the Horseshoe faithful', "Indy's crowd"], lines: ['Indianapolis Saddles Up For {city}.', 'The Horseshoe Hangs Over {city}.'] },
      Jaguars:    { crowd: ["Duval's faithful", 'the Bold City crowd'], lines: ['Duval Pours Into {city}.', 'Jacksonville Brings The Bold To {city}.'] },
      Titans:     { crowd: ['the Music City faithful', 'the Two-Tone crowd'], lines: ['Nashville Brings The Noise To {city}.', 'Music City Marches On {city}.'] },
      // AFC West
      Broncos:    { crowd: ['the Mile High faithful', 'the Orange Crush crowd'], lines: ['Mile High Air Follows Denver To {city}.', 'Denver Stampedes Into {city}.'] },
      Chiefs:     { crowd: ['the Sea of Red', "Arrowhead's faithful"], lines: ['Kansas City Brings The Barbecue And The Noise To {city}.', 'The Sea Of Red Washes Over {city}.'] },
      Raiders:    { crowd: ['the Black Hole', "Sin City's faithful"], lines: ['Las Vegas Rolls The Dice On {city}.', 'The Black Hole Opens Up In {city}.'] },
      Chargers:   { crowd: ['the Powder Blue crowd', 'the Bolt faithful'], lines: ['Los Angeles Sends A Lightning Bolt Through {city}.', 'Powder Blue Lights Up {city}.'] },
      // NFC East
      Cowboys:    { crowd: ['the Lone Star faithful', "America's Team crowd"], lines: ['The Lone Star Rises Over {city}.', 'Dallas Plants Its Star In {city}.'] },
      Giants:     { crowd: ['Big Blue', 'the Big Apple crowd'], lines: ['Big Blue Buses Into {city}.', 'New York Muscle Hits {city} Streets.'] },
      Eagles:     { crowd: ['the Brotherly faithful', 'the Philly crowd'], lines: ['Philadelphia Brings Brotherly Trouble To {city}.', 'Philly Grit Spills Onto {city} Streets.'] },
      Commanders: { crowd: ['the Burgundy-and-Gold crowd', "D.C.'s faithful"], lines: ['Washington Marches On {city}.', 'The Capital Storms {city}.'] },
      // NFC North
      Bears:      { crowd: ['the Monsters of the Midway', 'the Windy City crowd'], lines: ['Chicago Blows Into {city}.', 'The Monsters Of The Midway Roam {city}.'] },
      Lions:      { crowd: ['the Motor City faithful', 'the Pride of Detroit'], lines: ['Detroit Drives Down To {city}.', 'Motor City Roars Into {city}.'] },
      Packers:    { crowd: ['the Cheeseheads', "Titletown's faithful"], lines: ['Titletown Travels Well To {city}.', 'Frozen-Tundra Faithful Thaw Out In {city}.'] },
      Vikings:    { crowd: ['the Skol crowd', 'the Purple faithful'], lines: ['The Skol Chant Echoes Through {city}.', 'The North Sails Into {city}.'] },
      // NFC South
      Falcons:    { crowd: ['the Rise Up faithful', 'the Dirty Bird crowd'], lines: ['Atlanta Rises Up In {city}.', 'The A Brings Dirty-Bird Energy To {city}.'] },
      Panthers:   { crowd: ['the Keep Pounding faithful', 'the Queen City crowd'], lines: ['Carolina Keeps Pounding Through {city}.', 'The Carolinas Prowl Into {city}.'] },
      Saints:     { crowd: ['the Who Dat Nation', 'the Big Easy faithful'], lines: ['New Orleans Brings The Second Line To {city}.', 'Who Dat Nation Marches On {city}.'] },
      Buccaneers: { crowd: ['the Pewter faithful', 'the Cannon crew'], lines: ['Tampa Bay Fires Its Cannons Over {city}.', 'The Bay Raids {city}.'] },
      // NFC West
      Cardinals:  { crowd: ['the Red Sea', 'the Valley faithful'], lines: ['The Desert Sends Its Red Sea To {city}.', 'Arizona Swoops Into {city}.'] },
      Rams:       { crowd: ['the L.A. faithful', 'the Horns crowd'], lines: ['Los Angeles Lowers Its Horns At {city}.', 'Hollywood Glamour Crashes {city}.'] },
      '49ers':    { crowd: ['the Faithful', 'the Gold Rush crowd'], lines: ['San Francisco Strikes Gold In {city}.', 'The Bay Pans {city} For Clues.'] },
      Seahawks:   { crowd: ['the 12s', 'the Emerald City faithful'], lines: ['The 12s Bring The Noise To {city}.', 'The Pacific Northwest Soars Into {city}.'] }
    };

    function loreFor(mascot) {
      return (mascot && TEAM_LORE[String(mascot).trim()]) || null;
    }

    const LEAGUE_ORDER = ['NFL', 'NBA', 'MLB', 'NHL'];
    const CONF_ORDER = ['AFC', 'NFC'];
    const DIV_ORDER = ['East', 'North', 'South', 'West'];

    function metaFor(mascot) {
      return (mascot && TEAM_META[String(mascot).trim()]) || null;
    }

    // Divisional rival = away and home share a conference + division. Recomputed
    // on every render, never stored.
    function isDivisional(game) {
      const a = metaFor(game.away_team_mascot);
      const h = metaFor(game.home_team_mascot);
      return !!(a && h && a.conf === h.conf && a.div === h.div);
    }

    function groupKey(game) {
      const a = metaFor(game.away_team_mascot);
      if (!a) return { label: 'Other', league: '~', conf: '~', div: '~' };
      return { label: a.league + ' · ' + a.conf + ' ' + a.div, league: a.league, conf: a.conf, div: a.div };
    }

    function groupSortRank(g) {
      if (g.league === '~') return [99, 99, 99];
      const l = LEAGUE_ORDER.indexOf(g.league); const c = CONF_ORDER.indexOf(g.conf); const d = DIV_ORDER.indexOf(g.div);
      return [l < 0 ? 50 : l, c < 0 ? 50 : c, d < 0 ? 50 : d];
    }

    const pageStatus = document.getElementById('pageStatus');
    const groupsEl   = document.getElementById('groups');
    const searchInput = document.getElementById('searchInput');

    const state = {
      games: [],
      authed: false,
      editingId: null,
      filter: '',
      suggestions: new Map()
    };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading...');
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.games = [];
        state.suggestions.clear();
        render();
        setStatus('Sign in with an admin account.');
      }
    });

    function setStatus(text, kind) {
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function authHeaders(extra) {
      const session = adminAuth.getSession();
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) { return text; }
      } catch (_) { return fallback; }
    }

    async function refresh() {
      try {
        const url = restUrl('games', {
          select: 'id,name,tagline,tagline_approved,city,tags,game_date,start_time,away_team_city,away_team_mascot,home_team_city,home_team_mascot,fandom_game',
          order: 'name.asc'
        });
        const response = await fetch(url, { headers: authHeaders(), cache: 'no-store' });
        if (!response.ok) throw new Error(await readError(response, 'Could not load games'));
        const rows = await response.json();
        state.games = normalizeGames(rows);
        render();
        setStatus('');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Load failed', 'error');
      }
    }

    async function saveTagline(game, value) {
      const next = formatTaglineCase(value);
      try {
        const response = await fetch(restUrl('games', { id: 'eq.' + game.id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ tagline: next || null, updated_at: new Date().toISOString() })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not save'));
        const updated = await response.json();
        const fresh = (Array.isArray(updated) && updated[0]) || null;
        state.games = state.games.map((g) => normalizeGame(
          g.id === game.id ? (fresh || Object.assign({}, g, { tagline: next || null })) : g
        ));
        state.editingId = null;
        render();
        setStatus('Saved.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Save failed', 'error');
      }
    }

    async function saveApproved(game, approved) {
      try {
        const response = await fetch(restUrl('games', { id: 'eq.' + game.id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ tagline_approved: approved, updated_at: new Date().toISOString() })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not save'));
        const updated = await response.json();
        const fresh = (Array.isArray(updated) && updated[0]) || null;
        state.games = state.games.map((g) => normalizeGame(
          g.id === game.id ? (fresh || Object.assign({}, g, { tagline_approved: approved })) : g
        ));
        render();
        setStatus(approved ? 'Tagline approved.' : 'Approval cleared.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Save failed', 'error');
      }
    }

    function normalizeGames(rows) {
      return (Array.isArray(rows) ? rows : []).map(normalizeGame);
    }

    function normalizeGame(game) {
      if (!game || typeof game !== 'object') return game;
      const tagline = formatTaglineCase(game.tagline);
      return Object.assign({}, game, { tagline: tagline || null });
    }

    function formatTaglineCase(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      return text.replace(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g, (word) => (
        formatTaglineWord(word)
      ));
    }

    function formatTaglineWord(word) {
      const source = String(word || '');
      const apostropheIndex = source.search(/['’]/);
      const base = apostropheIndex >= 0 ? source.slice(0, apostropheIndex) : source;
      const suffix = apostropheIndex >= 0 ? source.slice(apostropheIndex) : '';
      const baseLetters = base.replace(/[^A-Za-z]/g, '');
      if (baseLetters && baseLetters === baseLetters.toUpperCase()) return base + suffix;
      return source.charAt(0).toUpperCase() + source.slice(1).toLowerCase();
    }

    function shortPlace(value) {
      return String(value || '')
        .split(',')[0]
        .trim();
    }

    function shortCity(game) {
      return shortPlace(game && (game.city || game.home_team_city));
    }

    function gameTags(game) {
      const values = Array.isArray(game.tags) ? game.tags : [game.tags];
      return values.map((tag) => String(tag || '').trim().toLowerCase()).filter(Boolean);
    }

    function escapeRegExp(value) {
      return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function stripMascotNames(value, game) {
      let text = String(value || '');
      [game && game.away_team_mascot, game && game.home_team_mascot].forEach((mascot) => {
        const mascotText = String(mascot || '').trim();
        if (!mascotText) return;
        text = text.replace(new RegExp('\\b' + escapeRegExp(mascotText) + '\\b', 'gi'), '');
      });
      return text
        .replace(/\s+([.,!?;:])/g, '$1')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function buildTaglineSuggestions(game) {
      const city = shortCity(game);
      const away = shortPlace(game.away_team_city);
      const home = shortPlace(game.home_team_city);
      const targetCity = city || home;
      const awayLore = loreFor(game.away_team_mascot);
      const tags = gameTags(game);
      const hasTag = (value) => tags.some((tag) => tag.includes(value));
      const suggestions = [];
      const add = (...values) => suggestions.push(...values.filter(Boolean));

      if (game.fandom_game || (away && home)) {
        // Team lore: allude to the visiting team through fan culture and city
        // identity — never the mascot word itself. {city} = the host city.
        if (awayLore && targetCity) {
          awayLore.lines.forEach((line) => add(line.replace(/\{city\}/g, targetCity)));
          awayLore.crowd.forEach((crowd) => add(
            crowd + ' Have Rolled Into ' + targetCity + '.',
            targetCity + ', Meet ' + crowd + '.',
            crowd + ' Are Loose In ' + targetCity + '.'
          ));
          if (home && home !== away && awayLore.crowd[0]) {
            add(
              'The Home Crowd Holds The Map. ' + awayLore.crowd[0] + ' Came For It.',
              awayLore.crowd[0] + ' Take On The Home Crowd, Block By Block.'
            );
          }
        }
        if (away && targetCity) {
          add(
            away + ' Fans Get The First Read On ' + targetCity + '.',
            away + ' Faithful, Your ' + targetCity + ' Takeover Starts Here.',
            away + ' Travels Loud. ' + targetCity + ' Gets The Clues.',
            away + ' Colors Are About To Stand Out Across ' + targetCity + '.',
            away + ' Road Pride Meets ' + targetCity + ' Street Smarts.',
            away + ' Fans Came Early To Claim The City.',
            away + ' Knows How To Travel. ' + targetCity + ' Is About To Find Out.',
            'The ' + away + ' Traveling Section Has A City To Decode.',
            'Bring The ' + away + ' Chant Off The Concourse And Into ' + targetCity + '.',
            'A Road-Day Ritual For The ' + away + ' Faithful.',
            'A Little ' + away + ' Noise In ' + targetCity + '.',
            targetCity + ', Meet The ' + away + ' Road Crew.',
            targetCity + ' Is Hosting. ' + away + ' Is Investigating.',
            targetCity + ' Through ' + away + ' Eyes.',
            'Find The Side Of ' + targetCity + ' The Home Crowd Misses.'
          );
        }
        if (away && targetCity && hasTag('football')) {
          add(
            away + ' Tailgate Energy Hits ' + targetCity + ' Early.',
            away + ' Gets A Pregame Route Before The Home Crowd Wakes Up.',
            'Before Kickoff, The ' + away + ' Faithful Get The First Move.',
            'Road Colors. Loud Calls. ' + targetCity + ' Streets.',
            away + ' Fans Brought The Away-Day Noise.'
          );
        }
        if (away && targetCity && hasTag('baseball')) {
          add(
            away + ' Gets The Road Series Started In The Streets.',
            away + ' Fans Take Batting Practice On ' + targetCity + ' Clues.',
            'Before First Pitch, ' + away + ' Gets The City First.',
            'Road Colors In The Bleachers. Clues In The Streets.',
            away + ' Turns A Road Trip Into A Citywide Rally.'
          );
        }
        if (home && away && home !== away) {
          add(
            home + ' Has The Home Crowd. ' + away + ' Has The Mission.',
            away + ' Fans Have Entered ' + home + ' Territory.',
            away + ' Came To Outsmart The Home Crowd.',
            'The Home City Sets The Stage. ' + away + ' Brings The Nerve.'
          );
        }
        if (targetCity) {
          add(
            'Two Fanbases. One City. No Neutral Ground.',
            'Rival Colors Take To The Streets Of ' + targetCity + '.',
            'The Rivalry Has Taken To The Streets.',
            'Enemy Territory Has Never Looked This Good.',
            'Know The City. Outsmart The Rival.',
            'Claim The Streets. Earn The Bragging Rights.',
            'A Citywide Challenge With Rivalry In Its Veins.',
            'Every Street Has A Side.',
            'The City Is Neutral. The Fans Are Not.',
            'Explore ' + city + '. Defend Your Colors.',
            'Cross The City. Cross Enemy Lines.',
            'Rivalry Looks Different From Street Level.',
            'The Real Contest Is Hidden Around ' + targetCity + '.',
            'City Clues. Rival Crews.',
            targetCity + ' Has Become Rival Territory.',
            targetCity + ' Is Big Enough For Both Sides. Barely.',
            targetCity + ' Is The Board. Rival Pride Is The Prize.'
          );
        }
        if (isDivisional(game)) {
          add(
            'Old Rivals. New Streets.',
            'Settle The Rivalry One Clue At A Time.',
            'Familiar Rivals. Unfamiliar Territory.',
            'The Rivalry Runs Deeper Than The Map.',
            'Same Division. Different Side Of The City.',
            'No Neutral Corners In This Rivalry.',
            'Rivalry Rules Apply On Every Block.',
            'Bragging Rights Are Hidden In Plain Sight.',
            'The Division Rivalry Has Left The Field.'
          );
        }
        if (hasTag('halloween') && targetCity) add('Rival Colors Take Over ' + targetCity + ' After Dark.');
      }

      if (hasTag('trivia') && city) {
        add(
          'Know ' + city + '? Prove It.',
          city + ' Knows The Answers. Do You?',
          'Put Your ' + city + ' Knowledge On The Line.'
        );
      }
      if ((hasTag('puzzle') || hasTag('scavenger')) && city) {
        add(
          'Crack The Clues. Claim ' + city + '.',
          city + ' Is Hiding Something.',
          'Read The Streets. Solve ' + city + '.',
          'Every Block Holds A Clue.',
          'The Rivalry Is Written All Over ' + city + '.'
        );
      }
      if (hasTag('city tour') && city) {
        add(
          'See ' + city + ' Like You Have A Mission.',
          'Meet The ' + city + ' Hiding In Plain Sight.',
          'Take The Curious Route Through ' + city + '.'
        );
      }
      if (hasTag('birthday')) add('Make The Birthday A Mission.');

      if (city) {
        add(
          'Turn ' + city + ' Into Your Game Board.',
          'See ' + city + ' Differently, One Clue At A Time.',
          'The Streets Of ' + city + ' Are In Play.',
          city + ' Has More To Reveal.',
          'Take The Side Streets Through ' + city + '.',
          'Find What ' + city + ' Hides In Plain Sight.',
          'A Better Way To Get Lost In ' + city + '.',
          'Follow The Clues Through ' + city + '.',
          'The Curious Side Of ' + city + ' Starts Here.',
          city + ' Is Full Of Unfinished Business.',
          city + ' Rewards The Ones Who Look Closer.',
          'Choose A Side. Explore The City.',
          'One City. Countless Ways To Claim It.',
          'Leave No Corner Of ' + city + ' Unchallenged.',
          'See The City. Spot The Rivalry.',
          'Every City Has Secrets. Every Rival Wants Them.'
        );
      } else {
        add(
          'Follow The Clues. Find What Others Miss.',
          'Your Next Mission Starts Here.',
          'A Game Built For Curious Teams.',
          'Old Rivals. New Territory.',
          'Choose A Side. Follow The Clues.',
          'Rival Pride Meets Street Smarts.'
        );
      }

      return [...new Set(suggestions
        .map((suggestion) => stripMascotNames(suggestion, game))
        .map(formatTaglineCase)
        .filter(Boolean))];
    }

    function suggestTagline(game) {
      if (!game) return;
      const suggestions = buildTaglineSuggestions(game);
      const current = formatTaglineCase(game.tagline);
      const previous = state.suggestions.get(game.id);
      const preferred = suggestions.filter((suggestion) => suggestion !== current && suggestion !== previous);
      const pool = preferred.length ? preferred : suggestions.filter((suggestion) => suggestion !== current);
      const next = pool[Math.floor(Math.random() * pool.length)] || suggestions[0] || '';
      if (!next) return;
      state.suggestions.set(game.id, next);
      render();
      setStatus('Suggested a tagline for ' + (game.name || 'this game') + '.', 'success');
    }

    function matchesFilter(game) {
      if (!state.filter) return true;
      const hay = (
        String(game.name || '') + ' ' +
        String(game.tagline || '') + ' ' +
        String(game.game_date || '') + ' ' +
        formatGameDate(game)
      ).toLowerCase();
      return hay.includes(state.filter);
    }

    function formatGameDate(game) {
      const raw = String(game && game.game_date || '').trim();
      if (!raw) return '';
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return raw;
      const [, year, month, day] = match;
      const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString('en-US', {
        timeZone: 'UTC',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    // Division-level grouping (by the visiting team's league/conf/div) for a
    // single set of games, sorted the canonical way within each group.
    function buildDivisionGroups(games) {
      const map = new Map();
      games.forEach((game) => {
        const key = groupKey(game);
        if (!map.has(key.label)) map.set(key.label, { meta: key, games: [] });
        map.get(key.label).games.push(game);
      });
      const groups = [...map.values()];
      groups.sort((a, b) => {
        const ra = groupSortRank(a.meta), rb = groupSortRank(b.meta);
        for (let i = 0; i < ra.length; i += 1) { if (ra[i] !== rb[i]) return ra[i] - rb[i]; }
        return a.meta.label.localeCompare(b.meta.label);
      });
      // Within a group: sort by away team, then by game name.
      groups.forEach((group) => {
        group.games.sort((a, b) => {
          const am = String(a.away_team_mascot || '~').localeCompare(String(b.away_team_mascot || '~'));
          if (am !== 0) return am;
          return String(a.name || '').localeCompare(String(b.name || ''));
        });
      });
      return groups;
    }

    // Two top-level sections — Approved then Unapproved — each containing the
    // division groupings for its games.
    function buildSections(games) {
      const approvedGames = games.filter((game) => game.tagline_approved);
      const rest = games.filter((game) => !game.tagline_approved);
      const sections = [];
      if (rest.length) {
        sections.push({ label: 'Unapproved', approved: false, groups: buildDivisionGroups(rest) });
      }
      if (approvedGames.length) {
        sections.push({ label: 'Approved', approved: true, groups: buildDivisionGroups(approvedGames) });
      }
      return sections;
    }

    function matchupLabel(game) {
      const away = [game.away_team_city, game.away_team_mascot].filter(Boolean).join(' ');
      const home = [game.home_team_city, game.home_team_mascot].filter(Boolean).join(' ');
      if (away && home) return away + ' @ ' + home;
      return away || home || '';
    }

    function render() {
      groupsEl.innerHTML = '';
      if (!state.authed) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Sign in to view and edit taglines.';
        groupsEl.appendChild(empty);
        return;
      }
      const visible = state.games.filter(matchesFilter);
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = state.filter ? 'No games match your filter.' : 'No games found.';
        groupsEl.appendChild(empty);
        return;
      }
      const sections = buildSections(visible);
      let rivalTotal = 0;
      sections.forEach((sectionData) => {
        const sectionEl = document.createElement('div');
        sectionEl.className = 'section' + (sectionData.approved ? ' section-approved' : '');

        const sectionCount = sectionData.groups.reduce((sum, group) => sum + group.games.length, 0);
        const sectionHead = document.createElement('div');
        sectionHead.className = 'section-title-row';
        const sectionTitle = document.createElement('h3');
        sectionTitle.className = 'section-title';
        sectionTitle.textContent = sectionData.label;
        const sectionMeta = document.createElement('span');
        sectionMeta.className = 'section-count';
        sectionMeta.textContent = sectionCount + (sectionCount === 1 ? ' game' : ' games');
        sectionHead.append(sectionTitle, sectionMeta);
        sectionEl.appendChild(sectionHead);

        sectionData.groups.forEach((group) => {
          const groupEl = document.createElement('div');
          groupEl.className = 'group';

          const head = document.createElement('div');
          head.className = 'group-head';
          const title = document.createElement('h4');
          title.className = 'group-title';
          title.textContent = group.meta.label;
          const count = document.createElement('span');
          count.className = 'group-count';
          count.textContent = group.games.length + (group.games.length === 1 ? ' game' : ' games');
          head.append(title, count);
          groupEl.appendChild(head);

          const list = document.createElement('div');
          list.className = 'item-list';
          group.games.forEach((game) => {
            const rival = isDivisional(game);
            if (rival) rivalTotal += 1;
            list.appendChild(renderItem(game, rival));
          });
          groupEl.appendChild(list);
          sectionEl.appendChild(groupEl);
        });

        groupsEl.appendChild(sectionEl);
      });
      setStatus(visible.length + ' games · ' + rivalTotal + ' divisional rival' + (rivalTotal === 1 ? '' : 's') + ' (*)');
    }

    function renderGameName(game) {
      const name = document.createElement('div');
      name.className = 'game-name';
      name.textContent = game.name || 'Untitled';
      const matchup = matchupLabel(game);
      if (matchup) {
        const mu = document.createElement('span');
        mu.className = 'game-matchup';
        mu.textContent = '  ' + matchup;
        name.appendChild(mu);
      }
      const dateLabel = formatGameDate(game);
      if (dateLabel) {
        const date = document.createElement('span');
        date.className = 'game-date';
        date.textContent = '  ' + dateLabel;
        name.appendChild(date);
      }
      return name;
    }

    function renderItem(game, rival) {
      const item = document.createElement('article');
      item.className = 'item' + (rival ? ' is-rival' : '') + (game.tagline_approved ? ' is-approved' : '');
      item.dataset.id = game.id;

      const bullet = document.createElement('div');
      bullet.className = 'item-bullet';
      bullet.textContent = rival ? '*' : '·';
      bullet.title = rival ? 'Divisional rival' : '';
      item.appendChild(bullet);

      if (state.editingId === game.id) {
        const main = document.createElement('div');
        main.className = 'item-main';
        main.appendChild(renderGameName(game));
        main.appendChild(renderEditForm(game));
        item.appendChild(main);
        return item;
      }

      const main = document.createElement('div');
      main.className = 'item-main';
      const name = renderGameName(game);
      const body = document.createElement('p');
      body.className = 'tagline-body' + (game.tagline ? '' : ' is-empty');
      body.textContent = formatTaglineCase(game.tagline) || 'No tagline. Click to add one.';
      body.title = 'Click to edit';
      body.addEventListener('click', () => { state.editingId = game.id; render(); });
      main.append(name, body);
      const suggestion = state.suggestions.get(game.id);
      if (suggestion) {
        const suggested = document.createElement('p');
        suggested.className = 'tagline-suggestion';
        const label = document.createElement('span');
        label.className = 'tagline-suggestion-label';
        label.textContent = 'Suggested: ';
        suggested.append(label, document.createTextNode(suggestion));
        main.appendChild(suggested);
      }
      item.appendChild(main);

      const actions = document.createElement('div');
      actions.className = 'item-actions';
      const approve = document.createElement('label');
      approve.className = 'approve-toggle' + (game.tagline_approved ? ' is-on' : '');
      const approveBox = document.createElement('input');
      approveBox.type = 'checkbox';
      approveBox.checked = !!game.tagline_approved;
      approveBox.addEventListener('change', () => saveApproved(game, approveBox.checked));
      const approveText = document.createElement('span');
      approveText.textContent = 'Approved';
      approve.append(approveBox, approveText);
      actions.appendChild(approve);
      const suggestBtn = document.createElement('button');
      suggestBtn.type = 'button';
      suggestBtn.className = 'btn icon';
      suggestBtn.textContent = 'Suggest';
      suggestBtn.addEventListener('click', () => suggestTagline(game));
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn icon';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => { state.editingId = game.id; render(); });
      actions.append(suggestBtn, editBtn);
      item.appendChild(actions);
      return item;
    }

    function renderEditForm(game) {
      const form = document.createElement('form');
      form.className = 'edit-form';

      const ta = document.createElement('textarea');
      ta.value = formatTaglineCase(game.tagline);
      ta.placeholder = 'Tagline...';
      form.appendChild(ta);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => { state.editingId = null; render(); });
      const save = document.createElement('button');
      save.type = 'submit';
      save.className = 'btn primary';
      save.textContent = 'Save';
      actions.append(cancel, save);
      form.appendChild(actions);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        saveTagline(game, ta.value);
      });
      // Cmd/Ctrl+Enter saves; Esc cancels.
      ta.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); saveTagline(game, ta.value); }
        if (event.key === 'Escape') { state.editingId = null; render(); }
      });
      setTimeout(() => ta.focus(), 0);
      return form;
    }

    searchInput.addEventListener('input', () => {
      state.filter = searchInput.value.trim().toLowerCase();
      render();
    });

    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    render();
    adminAuth.init();
  </script>
</body>
</html>
