<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAGLINES | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    button, input, textarea { font: inherit; }

    .section-head {
      display: grid;
      gap: 6px;
      margin: 0 0 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.14);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(var(--bic-blue-rgb), 0.08) 100%);
      box-shadow: 0 18px 36px var(--paper-shadow);
    }
    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 0.92rem; }
    .status.error { color: var(--danger); font-weight: 700; }
    .status.success { color: var(--success); font-weight: 700; }
    .legend { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; }
    .legend .star { color: var(--bic-red); font-weight: 700; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }
    .btn.icon { min-width: 38px; padding: 0 10px; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .signout-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .signout-btn svg { width: 22px; height: 22px; color: var(--ink); }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--paper-shadow);
    }

    .group { display: grid; gap: 8px; }
    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0 2px;
      padding-bottom: 6px;
      border-bottom: 2px solid rgba(var(--bic-blue-rgb), 0.2);
    }
    .group-title {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .group-count { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }

    .item-list { display: grid; gap: 8px; }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .item.is-rival { border-color: rgba(194, 55, 55, 0.4); background: rgba(194, 55, 55, 0.035); }

    .item-bullet {
      width: 20px;
      margin-top: 2px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }
    .item.is-rival .item-bullet { color: var(--bic-red); }

    .item-main { min-width: 0; }
    .game-name {
      margin: 0 0 2px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .game-matchup { color: rgba(var(--bic-blue-rgb), 0.5); font-weight: 500; text-transform: none; letter-spacing: 0; }
    .game-date {
      color: var(--bic-red);
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tagline-body {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
    }
    .tagline-body.is-empty { color: var(--muted); font-style: italic; }

    .item-actions { display: flex; gap: 6px; }

    .edit-form { grid-column: 1 / -1; display: grid; gap: 6px; }
    .edit-form textarea {
      width: 100%;
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      resize: vertical;
    }
    .edit-form .actions { display: flex; gap: 6px; justify-content: flex-end; }

    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }
  </style>
  <link rel="stylesheet" href="admin-shell.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="topbar-actions" style="margin-left:auto;">
        <button class="btn mc-back-btn" type="button" data-mc-back data-mc-back-fallback="/">Home</button>
        <button class="signout-btn" id="signOutBtn" type="button" aria-label="ADMIN LOGIN" title="ADMIN LOGIN">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5.5 19.5c1.2-3.4 3.8-5.1 6.5-5.1s5.3 1.7 6.5 5.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <section class="section-head">
      <p class="kicker">TGB MISSION CONTROL</p>
      <h2>TAGLINES</h2>
      <p class="status" id="pageStatus" aria-live="polite">Sign in with an admin account.</p>
      <p class="legend">Grouped by the visiting team's league, conference, and division.
        <span class="star">*</span> marks a divisional-rival matchup. Click any tagline to edit it.</p>
    </section>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Filter by game or tagline..." autocomplete="off">
    </div>

    <section class="panel" id="taglinesPanel">
      <div class="item-list" id="groups"></div>
    </section>
  </main>

  <script src="admin-auth.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-nav-menu.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    // NFL team -> league / conference / division, keyed by mascot. Used to sort
    // games by the visiting (away) team and to flag divisional rivals.
    const TEAM_META = {};
    const DIVISIONS = {
      'AFC East':  ['Bills', 'Dolphins', 'Patriots', 'Jets'],
      'AFC North': ['Ravens', 'Bengals', 'Browns', 'Steelers'],
      'AFC South': ['Texans', 'Colts', 'Jaguars', 'Titans'],
      'AFC West':  ['Broncos', 'Chiefs', 'Raiders', 'Chargers'],
      'NFC East':  ['Cowboys', 'Giants', 'Eagles', 'Commanders'],
      'NFC North': ['Bears', 'Lions', 'Packers', 'Vikings'],
      'NFC South': ['Falcons', 'Panthers', 'Saints', 'Buccaneers'],
      'NFC West':  ['Cardinals', 'Rams', '49ers', 'Seahawks']
    };
    Object.entries(DIVISIONS).forEach(([label, teams]) => {
      const [conf, div] = label.split(' ');
      teams.forEach((mascot) => { TEAM_META[mascot] = { league: 'NFL', conf, div }; });
    });

    const LEAGUE_ORDER = ['NFL', 'NBA', 'MLB', 'NHL'];
    const CONF_ORDER = ['AFC', 'NFC'];
    const DIV_ORDER = ['East', 'North', 'South', 'West'];

    function metaFor(mascot) {
      return (mascot && TEAM_META[String(mascot).trim()]) || null;
    }

    // Divisional rival = away and home share a conference + division. Recomputed
    // on every render, never stored.
    function isDivisional(game) {
      const a = metaFor(game.away_team_mascot);
      const h = metaFor(game.home_team_mascot);
      return !!(a && h && a.conf === h.conf && a.div === h.div);
    }

    function groupKey(game) {
      const a = metaFor(game.away_team_mascot);
      if (!a) return { label: 'Other', league: '~', conf: '~', div: '~' };
      return { label: a.league + ' · ' + a.conf + ' ' + a.div, league: a.league, conf: a.conf, div: a.div };
    }

    function groupSortRank(g) {
      if (g.league === '~') return [99, 99, 99];
      const l = LEAGUE_ORDER.indexOf(g.league); const c = CONF_ORDER.indexOf(g.conf); const d = DIV_ORDER.indexOf(g.div);
      return [l < 0 ? 50 : l, c < 0 ? 50 : c, d < 0 ? 50 : d];
    }

    const pageStatus = document.getElementById('pageStatus');
    const signOutBtn = document.getElementById('signOutBtn');
    const groupsEl   = document.getElementById('groups');
    const searchInput = document.getElementById('searchInput');

    const state = { games: [], authed: false, editingId: null, filter: '' };

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading...');
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.games = [];
        render();
        setStatus('Sign in with an admin account.');
      }
    });

    function setStatus(text, kind) {
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
    }

    function authHeaders(extra) {
      const session = adminAuth.getSession();
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.msg || payload.error_description || payload.error || text;
        } catch (_) { return text; }
      } catch (_) { return fallback; }
    }

    async function refresh() {
      try {
        const url = restUrl('games', {
          select: 'id,name,tagline,game_date,start_time,away_team_city,away_team_mascot,home_team_city,home_team_mascot,fandom_game',
          order: 'name.asc'
        });
        const response = await fetch(url, { headers: authHeaders(), cache: 'no-store' });
        if (!response.ok) throw new Error(await readError(response, 'Could not load games'));
        const rows = await response.json();
        state.games = normalizeGames(rows);
        render();
        setStatus('');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Load failed', 'error');
      }
    }

    async function saveTagline(game, value) {
      const next = formatTaglineCase(value);
      try {
        const response = await fetch(restUrl('games', { id: 'eq.' + game.id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ tagline: next || null, updated_at: new Date().toISOString() })
        });
        if (!response.ok) throw new Error(await readError(response, 'Could not save'));
        const updated = await response.json();
        const fresh = (Array.isArray(updated) && updated[0]) || null;
        state.games = state.games.map((g) => normalizeGame(
          g.id === game.id ? (fresh || Object.assign({}, g, { tagline: next || null })) : g
        ));
        state.editingId = null;
        render();
        setStatus('Saved.', 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Save failed', 'error');
      }
    }

    function normalizeGames(rows) {
      return (Array.isArray(rows) ? rows : []).map(normalizeGame);
    }

    function normalizeGame(game) {
      if (!game || typeof game !== 'object') return game;
      const tagline = formatTaglineCase(game.tagline);
      return Object.assign({}, game, { tagline: tagline || null });
    }

    function formatTaglineCase(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      return text.replace(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g, (word) => (
        formatTaglineWord(word)
      ));
    }

    function formatTaglineWord(word) {
      const source = String(word || '');
      const apostropheIndex = source.search(/['’]/);
      const base = apostropheIndex >= 0 ? source.slice(0, apostropheIndex) : source;
      const suffix = apostropheIndex >= 0 ? source.slice(apostropheIndex) : '';
      const baseLetters = base.replace(/[^A-Za-z]/g, '');
      if (baseLetters && baseLetters === baseLetters.toUpperCase()) return base + suffix;
      return source.charAt(0).toUpperCase() + source.slice(1).toLowerCase();
    }

    function matchesFilter(game) {
      if (!state.filter) return true;
      const hay = (
        String(game.name || '') + ' ' +
        String(game.tagline || '') + ' ' +
        String(game.game_date || '') + ' ' +
        formatGameDate(game)
      ).toLowerCase();
      return hay.includes(state.filter);
    }

    function formatGameDate(game) {
      const raw = String(game && game.game_date || '').trim();
      if (!raw) return '';
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return raw;
      const [, year, month, day] = match;
      const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleDateString('en-US', {
        timeZone: 'UTC',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function buildGroups(games) {
      const map = new Map();
      games.forEach((game) => {
        const key = groupKey(game);
        if (!map.has(key.label)) map.set(key.label, { meta: key, games: [] });
        map.get(key.label).games.push(game);
      });
      const groups = [...map.values()];
      groups.sort((a, b) => {
        const ra = groupSortRank(a.meta), rb = groupSortRank(b.meta);
        for (let i = 0; i < ra.length; i += 1) { if (ra[i] !== rb[i]) return ra[i] - rb[i]; }
        return a.meta.label.localeCompare(b.meta.label);
      });
      // Within a group: sort by away team, then by game name.
      groups.forEach((group) => {
        group.games.sort((a, b) => {
          const am = String(a.away_team_mascot || '~').localeCompare(String(b.away_team_mascot || '~'));
          if (am !== 0) return am;
          return String(a.name || '').localeCompare(String(b.name || ''));
        });
      });
      return groups;
    }

    function matchupLabel(game) {
      const away = [game.away_team_city, game.away_team_mascot].filter(Boolean).join(' ');
      const home = [game.home_team_city, game.home_team_mascot].filter(Boolean).join(' ');
      if (away && home) return away + ' @ ' + home;
      return away || home || '';
    }

    function render() {
      groupsEl.innerHTML = '';
      if (!state.authed) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Sign in to view and edit taglines.';
        groupsEl.appendChild(empty);
        return;
      }
      const visible = state.games.filter(matchesFilter);
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = state.filter ? 'No games match your filter.' : 'No games found.';
        groupsEl.appendChild(empty);
        return;
      }
      const groups = buildGroups(visible);
      let rivalTotal = 0;
      groups.forEach((group) => {
        const section = document.createElement('div');
        section.className = 'group';

        const head = document.createElement('div');
        head.className = 'group-head';
        const title = document.createElement('h3');
        title.className = 'group-title';
        title.textContent = group.meta.label;
        const count = document.createElement('span');
        count.className = 'group-count';
        count.textContent = group.games.length + (group.games.length === 1 ? ' game' : ' games');
        head.append(title, count);
        section.appendChild(head);

        const list = document.createElement('div');
        list.className = 'item-list';
        group.games.forEach((game) => {
          const rival = isDivisional(game);
          if (rival) rivalTotal += 1;
          list.appendChild(renderItem(game, rival));
        });
        section.appendChild(list);
        groupsEl.appendChild(section);
      });
      setStatus(visible.length + ' games · ' + rivalTotal + ' divisional rival' + (rivalTotal === 1 ? '' : 's') + ' (*)');
    }

    function renderItem(game, rival) {
      const item = document.createElement('article');
      item.className = 'item' + (rival ? ' is-rival' : '');
      item.dataset.id = game.id;

      if (state.editingId === game.id) {
        item.appendChild(renderEditForm(game));
        return item;
      }

      const bullet = document.createElement('div');
      bullet.className = 'item-bullet';
      bullet.textContent = rival ? '*' : '·';
      bullet.title = rival ? 'Divisional rival' : '';
      item.appendChild(bullet);

      const main = document.createElement('div');
      main.className = 'item-main';
      const name = document.createElement('div');
      name.className = 'game-name';
      name.textContent = game.name || 'Untitled';
      const matchup = matchupLabel(game);
      if (matchup) {
        const mu = document.createElement('span');
        mu.className = 'game-matchup';
        mu.textContent = '  ' + matchup;
        name.appendChild(mu);
      }
      const dateLabel = formatGameDate(game);
      if (dateLabel) {
        const date = document.createElement('span');
        date.className = 'game-date';
        date.textContent = '  ' + dateLabel;
        name.appendChild(date);
      }
      const body = document.createElement('p');
      body.className = 'tagline-body' + (game.tagline ? '' : ' is-empty');
      body.textContent = formatTaglineCase(game.tagline) || 'No tagline. Click to add one.';
      body.title = 'Click to edit';
      body.addEventListener('click', () => { state.editingId = game.id; render(); });
      main.append(name, body);
      item.appendChild(main);

      const actions = document.createElement('div');
      actions.className = 'item-actions';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn icon';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => { state.editingId = game.id; render(); });
      actions.appendChild(editBtn);
      item.appendChild(actions);
      return item;
    }

    function renderEditForm(game) {
      const form = document.createElement('form');
      form.className = 'edit-form';

      const ta = document.createElement('textarea');
      ta.value = formatTaglineCase(game.tagline);
      ta.placeholder = 'Tagline...';
      form.appendChild(ta);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => { state.editingId = null; render(); });
      const save = document.createElement('button');
      save.type = 'submit';
      save.className = 'btn primary';
      save.textContent = 'Save';
      actions.append(cancel, save);
      form.appendChild(actions);

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        saveTagline(game, ta.value);
      });
      // Cmd/Ctrl+Enter saves; Esc cancels.
      ta.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); saveTagline(game, ta.value); }
        if (event.key === 'Escape') { state.editingId = null; render(); }
      });
      setTimeout(() => ta.focus(), 0);
      return form;
    }

    searchInput.addEventListener('input', () => {
      state.filter = searchInput.value.trim().toLowerCase();
      render();
    });

    window.TgbMcAdminNav.init({ signOutButton: signOutBtn, auth: adminAuth });

    render();
    adminAuth.init();
  </script>
</body>
</html>
