<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GUIDE GREEN ROOM | THE GAME BUREAU</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" href="/icon-32.png?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --mc-shell-width: 1180px;
      --stack-gap: 14px;
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.8);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --accent: var(--bic-blue);
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --panel: rgba(255, 255, 255, 0.92);
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --success: #276740;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--bic-blue-rgb), 0.18) 1px, transparent 1px),
        linear-gradient(rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.14) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
    }

    button, textarea { font: inherit; }
    a { color: var(--accent); }

    .prompt-layout {
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto;
    }

    .prompt-main { display: grid; gap: 16px; min-width: 0; }

    .prompt-panel,
    .side-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 36px var(--paper-shadow);
      overflow: hidden;
    }

    /* No accent stripe. Every panel here wore an 8px dark-blue rule across the
       top; at four boxes down the page it stopped marking anything and just
       made the page stripey. The 1px panel line is enough of an edge. */
    .prompt-panel { min-width: 0; }

    .explain { padding: 18px; border-top: 8px solid var(--bic-red); }
    .explain h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .explain p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .explain p:last-child { margin-bottom: 0; }
    .explain strong { color: var(--ink); }

    .side-label {
      display: block;
      margin-bottom: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── The queue ────────────────────────────────────────────────────────── */
    /* A faint tint on the panel body so the white cards read as objects sitting
       on it. Both were near-white before, which left the cards relying entirely
       on their 1px border to separate from the background. */
    .queue-panel {
      min-inline-size: 0;
      padding: 4px 0 0;
      border: 1px solid var(--cut-panel-line);
      background: var(--cut-panel-bg);
      border-radius: 10px;
      overflow: visible;
      /* Tighter than the shared .prompt-panel cushion (0 18px 36px). That wide
         soft shadow is right for a modal floating over the page; under a long
         list it just blurs the panel's own edge. Modals keep it. */
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    .queue-panel > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .queue-status {
      display: none;
      margin: 0 16px 8px auto;
    }
    .queue-status:not(:empty) {
      display: flex;
      justify-content: flex-end;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
    }
    .panel-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .panel-sub {
      margin-left: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .panel-head-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

    /* Active / Skipped tabs. Both views render from the same posts array —
       the only difference is which side of the skip list a post sits on. */
    /* Segmented control, not a row of buttons: one inset track with the active
       segment raised out of it. Reads as "three views of one list" rather than
       three independent controls.

       The 16px side margin is the panel's gutter — .prompt-panel carries no
       padding of its own (its .panel-head brings its own), so the tab strip and
       the card list each supply it. That was invisible while posts were
       edge-to-edge rows; once they became bordered cards they sat flush against
       the panel wall, which is what this fixes. */
    .queue-tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      margin: 8px 16px 12px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #f8fbff;
      box-shadow: inset 0 1px 1px rgba(var(--bic-blue-rgb), 0.06);
    }
    .queue-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.86);
      transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
    }
    .queue-tab:hover { color: var(--ink); }
    .queue-tab.is-active {
      color: var(--ink);
      border-color: var(--control-line);
      background: #fff;
      box-shadow: 0 1px 2px rgba(var(--bic-blue-rgb), 0.1);
    }
    .queue-tab-count {
      min-width: 21px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(var(--bic-blue-rgb), 0.14);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .queue-tab.is-active .queue-tab-count { background: var(--accent); color: #fff; }

    /* Cards with air between them, not rows divided by hairlines — each post is
       a discrete thing you act on. Padding is the panel gutter; see .queue-tabs.
       :empty so a hidden list contributes no stray bottom space. */
    .queue-list { display: grid; gap: 10px; padding: 0 16px 16px; }
    .queue-list:empty { padding: 0; }

    /* Radius one step tighter than the panel's 12px: a card nested inside a
       container should not share its corner, or the two read as one surface. */
    .post {
      display: grid;
      gap: 0;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(17, 24, 32, 0.05);
      transition: box-shadow 120ms ease, border-color 120ms ease;
    }
    /* Hover sharpens the edge rather than lifting the card. A translate plus a
       wide blur reads soft and makes the whole list feel like it is floating;
       a darker border and a tight shadow keep the edges crisp. */
    .post:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.46);
      box-shadow: 0 1px 5px rgba(17, 24, 32, 0.09);
    }
    /* A decided card is legible but visibly out of the running. Posted sits at
       a lighter touch than skipped — it is done, not discarded — and carries a
       green edge so the two decided tabs never look like each other. */
    .post.is-skipped { opacity: 0.6; }
    .post.is-skipped:hover { opacity: 1; }
    .post.is-posted { opacity: 0.85; border-left: 3px solid var(--success, #2f7d4f); }
    .post.is-posted:hover { opacity: 1; }
    .post-receipt {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--success, #2f7d4f);
    }

    .post-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(var(--bic-blue-rgb), 0.24);
      background: #f7faff;
      color: rgba(var(--bic-blue-rgb), 0.86);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .post-kicker-id {
      color: var(--ink);
    }
    /* Sits in front of REASONING and wears the label's own type, so the line
       reads as one run -- "72% REASONING History. ..." -- rather than as a badge
       parked beside a heading. Tinted red under 40 only: that is the band the
       bot files to reach its five with a rule bent, and the one worth catching
       on the way past. */
    .post-why-score {
      margin-right: 7px;
      color: rgba(var(--bic-blue-rgb), 0.9);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
    }
    .post-why-score.is-low { color: var(--bic-red); }

    /* ── The post as it will look ─────────────────────────────────────────── */
    .post-preview { display: grid; gap: 10px; padding: 14px 14px 13px; }

    /* The caption IS the post, so it is the largest thing on the card and wears
       no quote-block chrome — chrome would imply it is being cited rather than
       published. */
    .post-caption {
      margin: 0;
      color: var(--ink);
      font-size: 1.01rem;
      line-height: 1.45;
      letter-spacing: -0.004em;
    }

    /* The unfurled link, shaped like the card X and Facebook will render. With
       a thumbnail it goes image-left / text-right; without one — no og:image,
       an older row, or an image that failed to load — the grid collapses to a
       single column and it looks exactly as it did before thumbnails existed. */
    .post-card {
      display: grid;
      gap: 2px;
      padding: 9px 11px;
      border: 1px solid var(--control-line);
      border-radius: 6px;
      background: #f7faff;
      text-decoration: none;
      color: inherit;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .post-card:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.46);
      background: #eef4ff;
    }
    .post-card.has-shot {
      grid-template-columns: 116px minmax(0, 1fr);
      align-items: center;
      gap: 13px;
      padding: 10px;
    }
    .post-card-body { display: grid; gap: 3px; min-width: 0; }
    .post-card-shot {
      display: block;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(17, 24, 32, 0.06);
      /* Inset hairline so a pale image still has a defined edge. */
      box-shadow: inset 0 0 0 1px rgba(17, 24, 32, 0.08);
      aspect-ratio: 16 / 10;
    }
    .post-card-shot img {
      display: block;
      width: 100%;
      height: 100%;
      /* cover, so a tall or panoramic og:image still fills the tile instead of
         letterboxing — every card in the list then reads at the same size. */
      object-fit: cover;
    }
    @media (max-width: 560px) {
      .post-kicker {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
      .post-card.has-shot { grid-template-columns: 84px minmax(0, 1fr); gap: 11px; }
    }
    .post-card-domain {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.84);
    }
    .post-card-headline {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.28;
      color: var(--ink);
    }
    .post-card-meta {
      font-size: 0.72rem;
      line-height: 1.35;
      color: rgba(var(--bic-blue-rgb), 0.84);
    }

    /* ── Ephemera: ours, never posted ─────────────────────────────────────── */
    .post-ephemera {
      display: grid;
      gap: 8px;
      padding: 11px 14px 13px;
      border-top: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      background: #f8fbff;
    }

    /* The label sits inline so a one-line note stays one line. */
    .post-why-label {
      margin-right: 7px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .post-why {
      margin: 0;
      color: rgba(var(--bic-blue-rgb), 0.82);
      font-size: 0.82rem;
      font-style: italic;
      line-height: 1.45;
    }

    /* Topic + platform tags. Topics are quiet (they describe the story);
       platforms are loud and colour-coded (they are the recommendation you act
       on). Each platform chip carries its format reason as a title. */

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.22);
      border-radius: 999px;
      background: #fff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Platform styling is now only worn by the picker's tick buttons — the
       "Post to" pills on the card were removed, so there is no link variant. */
    .tag--platform { border-width: 1.5px; }
    /* The merged Meta row. Facebook's blue leads because Facebook is always
       part of it; Instagram only joins when the candidate has an image. The
       old .is-facebook / .is-instagram rules died with the two separate rows. */
    .tag--platform.is-meta { color: #1b4da8; border-color: rgba(27, 77, 168, 0.45); background: rgba(27, 77, 168, 0.06); }

    /* A question needs less room than a form. */
    .tool-modal-panel--ask { width: min(430px, calc(100vw - 32px)); }
    .confirm-body { display: grid; gap: 14px; padding: 16px 18px 18px; }
    .confirm-text { margin: 0; color: var(--ink); font-size: 0.95rem; line-height: 1.5; }

    /* Edit sits apart from the decisions. Post, Copy and Skip are the three
       things you do to a candidate; Edit is maintenance on it, so it goes to
       the far end rather than into that sequence. */
    .post-actions .post-edit-btn { margin-left: auto; }

    .post-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
    .post-edit-btn { margin-left: auto; }

    /* Post picker: tick any number of platforms, then step through them
       one composer at a time — each opened by its own click, see the JS. */
    /* White, because it now sits on the tinted ephemera panel — the old blue
       wash disappeared into it. */
    /* Post dialog body: the candidate restated at the top so you know which
       one you are posting, then the picker. */
    /* Same treatment as .post-card-shot, so the picture looks identical here and
       on the card. Capped in height because the dialog is a working surface: the
       point is to recognise the image, not to inspect it. */
    /* Inside the dialog the picker wears the same tinted cut panel as the queue
       and the command bar, so this reads as part of the room rather than a
       generic modal. It used to drop its frame entirely and sit on the modal's
       white, which is what made it look like a different product. */
    /* One row per account: tick on the left, why-it-fits on the right. */
    /* The agent's own reason for THIS story reads at full strength; the
       standing format note for an untagged account sits back. */
    /* The reason a ticked platform cannot go out by machine. Quieter than the
       format note above it — it is a constraint, not a recommendation. */
    @media (max-width: 560px) {
    }
    .autopost-choice { min-height: 30px; padding: 0 12px; cursor: pointer; opacity: 0.55; justify-content: center; }
    .autopost-choice.is-suggested { box-shadow: inset 0 0 0 1.5px currentColor; }
    .autopost-choice:hover { filter: brightness(0.94); }
    /* Ticked = full strength; unticked sits back so the selection is readable
       at a glance without a checkbox glyph competing with the platform tag. */
    .autopost-choice[aria-pressed="true"] { opacity: 1; box-shadow: inset 0 0 0 2px currentColor; }
    .autopost-choice.is-done { opacity: 0.4; text-decoration: line-through; }
    .autopost-go[disabled] { opacity: 0.45; cursor: not-allowed; }
    .post-feedback {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--success);
    }
    /* The paste notice stays until the next action, so it is still on screen
       when you come back from the platform's tab. Loud enough to be the answer
       to "why is the box empty?". */
    .post-feedback.is-sticky {
      padding: 6px 11px;
      border: 1px solid rgba(194, 55, 55, 0.34);
      border-radius: 7px;
      background: rgba(194, 55, 55, 0.07);
      color: var(--bic-red);
      letter-spacing: 0.06em;
      text-transform: none;
      font-size: 0.74rem;
    }

    /* An empty tab is a normal state here — Posted and Skipped both start
       empty — so it gets a dashed well rather than a bare line of grey text
       floating in the panel. */
    .queue-empty {
      padding: 34px 18px;
      margin: 0 16px 18px;
      border: 1px dashed var(--cut-panel-line);
      border-radius: 12px;
      background: #f8fbff;
      color: var(--ink);
      font-size: 0.92rem;
      line-height: 1.6;
      text-align: center;
    }
    .queue-empty[hidden] { display: none; }

    /* ── Focus, consistently ──────────────────────────────────────────────
       Every interactive thing on the page gets the same visible ring. There
       was none before, so keyboard users had only the browser default, which
       the custom backgrounds here largely swallow. :focus-visible, so a mouse
       click does not paint a ring. */
    .btn:focus-visible,
    .queue-tab:focus-visible,
    .autopost-choice:focus-visible,
    .chip:focus-visible,
    .post-card:focus-visible,
    .modal-form input:focus-visible,
    .modal-form select:focus-visible,
    .modal-form textarea:focus-visible,
    .platform-pick input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .post-card:focus-visible {
      border-color: rgba(var(--bic-blue-rgb), 0.3);
      background: rgba(var(--bic-blue-rgb), 0.045);
    }

    /* Honour a reduced-motion preference across every transition added here. */
    @media (prefers-reduced-motion: reduce) {
      .post,
      .post-card,
      .queue-tab,
      .autopost-choice,
      .btn { transition: none; }
    }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    /* display: inline-flex below is an AUTHOR rule and beats the browser's own
       [hidden] { display: none }, so hiding a button by attribute silently did
       nothing -- askConfirm's one-button notices were still showing No. Any
       element given a display here needs this line beside it. */
    .btn[hidden] { display: none; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .btn:hover { border-color: rgba(var(--bic-blue-rgb), 0.42); background: rgba(var(--bic-blue-rgb), 0.05); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn.primary:hover { background: #24396a; }
    .btn.danger { border-color: rgba(194, 55, 55, 0.42); color: var(--bic-red); }
    .btn.danger:hover { background: rgba(194, 55, 55, 0.08); }
    /* Filled red, for the button that AGREES to something irreversible — the
       confirm dialog's Delete. .danger is the outlined version, worn by a
       button that merely leads to that question; this is the one that answers
       it. It carries .primary too, so it must beat .btn.primary: same
       specificity, so it wins by coming later in the sheet. Keep it below. */
    .btn.danger-solid,
    .btn.primary.danger-solid { border-color: var(--bic-red); background: var(--bic-red); color: #fff; }
    .btn.danger-solid:hover,
    .btn.primary.danger-solid:hover { background: #a92c2c; border-color: #a92c2c; }
    .btn.small { min-height: 34px; padding: 0 11px; font-size: 0.66rem; }

    .command-bar {
      width: 100%;
      max-width: var(--mc-shell-width);
      min-inline-size: 0;
      padding: 4px 12px 12px;
      margin: 0 auto var(--stack-gap);
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }
    /* The legend cuts the panel's top border, and the line used to just stop
       either side of it. It now wears a folder tab: the border runs into the
       label and back out again, so the cut-out reads as a tag clipped onto the
       frame rather than a gap in it.

       The tab is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box. The word has to sit
       centred on the horizontal line, which is the legend's default position --
       the browser centres it there. But the tab's sides must stop AT that line
       rather than carrying on into the panel, and a bordered box whose bottom
       edge is the line cannot also have its text centred on the line: the text
       centre is always the better part of half a box above the bottom edge.

       So the box stays put and the outline is drawn only over the half above
       the line -- `inset: 0 0 50%`, since the legend's midpoint IS the line.
       The word's lower half then hangs into the panel, which is invisible
       because the tab fill and the panel are the same colour and there is no
       bottom edge between them.

       isolation: isolate is load-bearing. The arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own that -1 would
       drop it behind the fieldset's own background and it would vanish. */
    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .command-bar > legend::before,
    .queue-panel > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;              /* the legend's midpoint is the border line */
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome
         instead of a tab. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .command-bar .btn {
      min-width: 0;
      padding: 0 12px;
      border-color: var(--control-line);
      box-shadow: 0 1px 1px rgba(var(--bic-blue-rgb), 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .admin-auth-toggle { min-height: 42px; padding-inline: 14px; white-space: nowrap; }
    .admin-auth-toggle.is-signed-in { border-color: rgba(194, 55, 55, 0.44); color: var(--bic-red); }

    /* ── The prompt popup ─────────────────────────────────────────────────────
       Three bands in one column: a head that names the prompt, a body that
       holds the ruled sheet, and a foot whose whole job is COPY.

       COPY LIVES IN THE FOOT AND NEVER SCROLLS. The thing you came here to do
       is take the text away, and the text is sixty lines long — a copy button
       riding at the top of a scrolling panel is one you have to go back and
       find. It is the only button with weight on the screen for the same
       reason.

       It wears the room's paper, not a modal's flat white, so the popup reads
       as a sheet pulled onto the desk rather than a different application.
       The 8px red stripe above the help line is gone: that came from .explain,
       the page's callout style, and in here it marked nothing. */
    #promptCard {
      display: flex;
      flex-direction: column;
      height: min(880px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--paper-base);
    }
    /* An ID beats .tool-modal-panel[hidden], so the shared hide rule stops
       working the moment a panel is styled by its own id — the dialog paints
       display:flex over the top of it and Close does nothing. Any future
       #id rule that sets display needs its own [hidden] beside it. */
    #promptCard[hidden] { display: none; }
    .prompt-head { align-items: flex-start; }
    .prompt-headline { display: grid; gap: 4px; min-width: 0; }
    .prompt-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #promptTitle {
      font-size: 1.02rem;
      letter-spacing: 0.03em;
      text-transform: none;
    }

    .prompt-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      padding: 14px 16px 16px;
      overflow: hidden;
    }
    /* Not .explain — see the note above. Plain type under the title. */
    .prompt-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .prompt-note:empty { display: none; }

    /* The ruled sheet. The rules are every 28px with a red margin at 56px, so
       the type is locked to a 28px leading and starts to the right of the
       margin — set at anything else, no line sits on a rule and every line
       crosses the margin. */
    .prompt {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 220px;
      padding: 13px 18px 18px 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      resize: none;
      background:
        linear-gradient(rgba(var(--bic-blue-rgb), 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194, 55, 55, 0.26) 1px, transparent 1px),
        #fffefa;
      background-position: 0 0, 56px 0, 0 0;
      background-size: 100% 28px, 100% 100%, 100% 100%;
      color: #17253c;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.88rem;
      line-height: 28px;
      outline: none;
      white-space: pre-wrap;
      box-shadow: inset 0 1px 2px rgba(var(--bic-blue-rgb), 0.06);
    }
    .prompt:focus { border-color: rgba(var(--bic-blue-rgb), 0.45); }

    .prompt-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      flex: 0 0 auto;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
    }
    /* One control with four doors, fenced off so the four do not read as four
       more buttons standing equal to COPY. */
    .prompt-ai {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px 5px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.04);
    }
    .prompt-ai-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .prompt-ai .btn { background: #fff; }
    /* An <a> wearing .btn — it navigates, so it stays an anchor and keeps
       middle-click and open-in-new-tab. Secondary weight beside COPY: it is
       where you go after copying, not the thing you came to do. */
    .prompt-sql-btn { gap: 8px; }
    /* .btn is inline-flex, which outranks the [hidden] default — the same trap
       #promptCard fell into. It is hidden on the portrait prompt, whose answer
       is a picture, not a statement. */
    .prompt-sql-btn[hidden] { display: none; }
    .prompt-sql-btn svg { width: 14px; height: 14px; flex: 0 0 auto; opacity: .75; }
    /* The hinge. It sits first and takes all the slack, so the three steps
       land as one block at the right in the order they are done. */
    .copy-status {
      margin-right: auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .prompt-copy {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 20px;
    }
    .prompt-copy svg { width: 15px; height: 15px; flex: 0 0 auto; }
    /* Green only while the confirmation is on screen; the button goes back to
       being the ordinary primary a moment later, so it never reads as a state
       the dialog is stuck in. */
    .prompt-copy.is-done,
    .prompt-copy.is-done:hover {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .side-stack { display: grid; gap: 16px; }
    .side-card { padding: 16px; }
    .side-card h2 {
      margin: 0 0 8px;
      font-size: 1.02rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .side-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .side-card p:last-child { margin-bottom: 0; }
    .side-note { font-size: 0.8rem; }

    .mini-list {
      display: grid;
      gap: 4px;
      margin: 10px 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .mini-list b { color: var(--ink); }

    .run-status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(var(--bic-blue-rgb), 0.05);
    }
    .run-dot {
      flex: 0 0 auto;
      width: 9px; height: 9px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .run-status[data-state="ok"] .run-dot { background: #1e7a4b; }
    .run-status[data-state="stale"] .run-dot { background: var(--bic-red); }
    .run-body { display: grid; gap: 3px; min-width: 0; }
    .run-line { color: var(--ink); font-size: 0.92rem; font-weight: 800; }
    .run-sub { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }

    .side-links { display: grid; gap: 8px; margin-top: 14px; }
    .side-links + .side-links { margin-top: 8px; }

    /* ── Header (Stock Room lockup) ───────────────────────────────────────── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }
    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }
    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .stockroom-gear {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%) scaleX(-1);
      width: 184px;
      height: 184px;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }
    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }
    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }
    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }
    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }
    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }
    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }
    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }
    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }
    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }
    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow: 0 0 3px var(--paper-base), 0 0 3px var(--paper-base), 0 0 5px var(--paper-base);
    }
    .stockroom-title { margin: 0; font-size: 1.7rem; letter-spacing: 0.03em; line-height: 1; }
    .stockroom-titlecol .stockroom-substat {
      margin: 3px 0 0;
      min-height: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.5;
      color: var(--muted);
    }
    .stockroom-substat:empty { display: none; }
    .stockroom-head-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .socials-room-head .stockroom-gear,
    .socials-room-head .stockroom-eyebrow,
    .socials-room-head .stockroom-head-status {
      display: none;
    }

    .tool-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(17, 24, 32, 0.36);
    }
    .tool-backdrop[hidden],
    .tool-modal-panel[hidden] {
      display: none;
    }
    .tool-modal-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 100;
      width: min(780px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      transform: translate(-50%, -50%);
      overflow: auto;
    }
    .tool-modal-panel--wide {
      width: min(980px, calc(100vw - 32px));
    }
    .modal-form {
      display: grid;
      gap: 12px;
      padding: 16px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .modal-form label,
    .modal-form .field-label,
    .platform-row label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .modal-form input,
    .modal-form select,
    .modal-form textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: 600 0.92rem/1.35 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0;
      text-transform: none;
    }
    .modal-form textarea {
      min-height: 92px;
      resize: vertical;
    }
    .modal-form .full { grid-column: 1 / -1; }
    .manual-url-field {
      display: grid;
      gap: 6px;
    }
    .manual-url-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: stretch;
    }
    .manual-url-control .btn {
      min-height: 40px;
      padding-inline: 14px;
    }
    .label-opt { opacity: 0.6; font-weight: 600; letter-spacing: 0.08em; }
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .platform-row {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }
    .platform-pick {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .platform-pick input {
      width: auto;
      min-height: 0;
      padding: 0;
    }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px;
    }
    .modal-status {
      margin-right: auto;
      color: var(--bic-red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .modal-status.is-ok {
      color: var(--ink);
    }

    @media (max-width: 840px) {
      .panel-head { align-items: flex-start; flex-direction: column; }
      /* The left padding stays at the red margin — it is what keeps the type
         off the rule, and a narrow screen does not move the rule. */
      .prompt { min-height: 180px; padding: 13px 12px 16px 68px; font-size: 0.8rem; }
      #promptCard { height: calc(100vh - 32px); }
      .prompt-copy { flex: 1 1 auto; justify-content: center; }
      /* The three steps stack rather than half-wrapping into two ragged rows,
         and each one still spans the foot so the order stays readable. */
      .prompt-ai { width: 100%; }
      .prompt-ai-row { flex: 1 1 auto; }
      .prompt-ai-row .btn { flex: 1 1 auto; }
      .prompt-sql-btn { flex: 1 1 auto; }
      .post-actions .btn { flex: 1 1 auto; }
      .post-edit-btn { margin-left: 0; }
      .command-bar .btn { flex: 1 1 auto; }
      .modal-grid,
      .platform-grid {
        grid-template-columns: 1fr;
      }
      .manual-url-control {
        grid-template-columns: 1fr;
      }
    }

    /* ── Green Room additions ────────────────────────────────────────────────
       Everything above is the Socializer's stylesheet, carried over so the two
       rooms are visibly the same product. Only what a GUIDE needs and a social
       post does not is added here. */


    /* ── The card, as a filing card ──────────────────────────────────────────
       An actor's bio sheet or a charter preference sheet: a headshot at the
       left, then ruled rows of LABEL / value that a person fills in. The boxes
       are gone - a field is a line you write on, which is what makes a form
       read as a form rather than as a web page with inputs on it. Everything
       is tighter: a guide should be a card you flick past, not a page you
       scroll. */
    .guide-card {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 14px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), .28);
      border-radius: 4px;
      /* Card stock, not paper: a flat warm white with a hairline rule down the
         left the way an index card carries one. */
      background:
        linear-gradient(90deg, rgba(190, 55, 55, .28) 0 1px, transparent 1px 100%),
        #fffef8;
      box-shadow: 0 1px 0 rgba(var(--bic-blue-rgb), .10), 0 6px 14px rgba(var(--bic-blue-rgb), .06);
    }
    /* Arrived here from a ?guide= link. A ring rather than a colour change, so
       nothing on the card itself reads differently for four seconds, and it
       fades out because "this is the one you asked for" stops being true as
       soon as you start working. */
    .guide-card.is-linked {
      border-color: var(--bic-blue);
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), .22), 0 6px 14px rgba(var(--bic-blue-rgb), .10);
      transition: box-shadow 600ms ease, border-color 600ms ease;
    }
    @media (max-width: 620px) {
      .guide-card { grid-template-columns: minmax(0, 1fr); }
    }

    /* A headshot, so 3:4 rather than square. */
    .guide-shot {
      position: relative;
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(var(--bic-blue-rgb), .22);
      border-radius: 2px;
      background: rgba(var(--bic-blue-rgb), .05);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .guide-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .guide-shot-empty {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .56rem;
      letter-spacing: .12em;
      text-align: center;
      color: var(--muted);
      padding: 6px;
    }

    .guide-figure { display: grid; gap: 5px; align-content: start; }
    .guide-figure .btn {
      width: 100%;
      min-height: 26px;
      padding: 0 6px;
      border-radius: 2px;
      font-size: .6rem;
      letter-spacing: .06em;
    }
    .guide-upload-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .58rem;
      line-height: 1.4;
      color: var(--muted);
      word-break: break-word;
    }
    .guide-upload-status.is-error { color: var(--bic-red); }

    .guide-body { display: grid; gap: 8px; align-content: start; min-width: 0; }

    /* Ruled rows. The label sits in its own narrow column, right-aligned
       against the rule, the way a printed form sets its captions. */
    .gfields { display: grid; }
    .gfield {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
      padding: 3px 0;
      border-bottom: 1px solid rgba(var(--bic-blue-rgb), .13);
      min-width: 0;
    }
    .gfield:last-child { border-bottom: 0; }
    /* The labels are written in caps in the markup, so text-transform is left
       off deliberately: what is in the HTML is what is on the screen, and a
       transform would quietly hide a label that had been typed in lower case. */
    .gfield > span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .58rem;
      letter-spacing: .12em;
      color: var(--muted);
      text-align: right;
      padding-top: 4px;
    }

    /* A line to write on, not a box to fill. */
    .gfield input[type="text"],
    .gfield input[type="url"],
    .gfield textarea {
      width: 100%;
      padding: 3px 2px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: .84rem;
      line-height: 1.45;
    }
    .gfield textarea { resize: vertical; min-height: 40px; }
    .gfield textarea.tall { min-height: 66px; }
    .gfield input:focus, .gfield textarea:focus {
      outline: none;
      border-bottom-color: var(--bic-blue);
      background: rgba(var(--bic-blue-rgb), .04);
    }

    /* EMPTY IS RED - now the rule under the line, where a blank on a paper
       form is a blank line waiting to be written on. */
    .gfield input.is-empty, .gfield textarea.is-empty { border-bottom-color: var(--bic-red); }

    /* The name line, with the id riding at its right. */
    .gfield-line { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .gfield-line input { flex: 1; min-width: 0; }
    .gfield-id {
      flex: 0 0 auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .1em;
      color: var(--muted);
    }

    /* The system columns: same rows, set in type rather than in a control, so
       the eye can tell at a glance what it is allowed to touch. */
    .gfield-ro {
      padding: 4px 2px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .66rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .guide-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      padding-top: 2px;
    }
    .guide-actions .btn {
      min-height: 26px;
      padding: 0 9px;
      border-radius: 2px;
      font-size: .64rem;
      letter-spacing: .06em;
    }

    /* .warn was being passed to the Delete button and doing nothing at all -
       this stylesheet came from the Socializer, which never defined it. Red
       type, and a red edge only on hover: a destructive button should read as
       different without shouting from across the card. */
    .guide-actions .btn.warn {
      color: var(--bic-red);
      border-color: rgba(194, 55, 55, .35);
    }
    .guide-actions .btn.warn:hover {
      background: rgba(194, 55, 55, .08);
      border-color: var(--bic-red);
    }

    .gsave-note {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .6rem;
      color: var(--bic-red);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-right: auto;
    }
    /* The same word in the same place, green instead of red. It clears itself
       after a few seconds: UNSAVED is a state that persists until you act,
       SAVED is an event, and a permanent one would soon be describing a card
       nobody has touched since the page loaded. */
    .gsave-note.is-saved { color: var(--success); }

    /* The controls above the sheet: HOW MANY, then NOTES taking the rest of
       the line. .label-opt is a text style, not a layout, so without the grid
       here the label and the box sit squeezed side by side. The body supplies
       the gutter, so neither carries padding of its own. */
    .prompt-controls {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 14px;
      flex: 0 0 auto;
    }
    .prompt-controls[hidden] { display: none; }
    .prompt-count { display: grid; gap: 6px; flex: 0 0 auto; }
    /* Sits on the control line rather than above it — it has no label of its
       own, its words are the label. */
    .prompt-check {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 34px;
      margin: 0;
      opacity: 1;
    }
    .prompt-check[hidden] { display: none; }
    .prompt-check span {
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .prompt-check:hover span { color: var(--ink); }
    #promptNotesWrap {
      display: grid;
      gap: 6px;
      flex: 1 1 240px;
      min-width: 0;
      padding: 0;
      margin: 0;
      opacity: 1;
    }
    #promptNotesWrap[hidden] { display: none; }
    .prompt-ctl-label,
    #promptNotesWrap > span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .62rem;
      letter-spacing: .14em;
      color: var(--muted);
      opacity: .9;
    }

    /* One inset track with the answer in force raised out of it. */
    .seg {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--control-line);
      border-radius: 8px;
      background: #f8fbff;
      box-shadow: inset 0 1px 1px rgba(var(--bic-blue-rgb), 0.06);
    }
    .seg-btn {
      min-width: 46px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      cursor: pointer;
      color: rgba(var(--bic-blue-rgb), 0.86);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease;
    }
    .seg-btn:hover { color: var(--ink); }
    .seg-btn.is-on {
      color: #fff;
      border-color: var(--bic-blue);
      background: var(--bic-blue);
      box-shadow: 0 1px 2px rgba(var(--bic-blue-rgb), 0.18);
    }
    #promptNotes {
      width: 100%;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font-size: .9rem;
      font-weight: 400;
      letter-spacing: 0;
    }
    #promptNotes:focus {
      outline: none;
      border-color: var(--bic-blue);
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), .12);
    }

    .guide-empty {
      padding: 24px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 4px;
    }

    .guide-list { display: grid; gap: 10px; }

    @media (max-width: 720px) {
      .gfield { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .gfield > span { text-align: left; }
    }


    /* The two command bars share a line. ADD takes the space; SORT is only as
       wide as its buttons. .command-bar centres itself and caps at the shell
       width, so both are overridden here rather than in the inherited rule -
       that one still serves the rooms with a single full-width bar. */
    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      max-width: var(--mc-shell-width);
      margin: 0 auto var(--stack-gap);
    }
    /* width:100% AND max-width:shell come from the inherited .command-bar,
       which was written for one bar sitting alone. Inside a flex row both
       panels then demand the full width, overlap, and the first one collapses
       to a column - so both are cleared and flex does the sizing instead. */
    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 1 1 auto; min-width: 0; }
    .command-bar--sort,
    .command-bar--portraits { flex: 0 0 auto; }
    /* Nothing to draw means no button — the room is finished, and a control
       that opens an empty prompt is a control that reads as broken. */
    .command-bar--portraits[hidden] { display: none; }
    /* The order in force reads as the pressed button. */
    .command-bar--sort .btn.is-on {
      background: var(--bic-blue);
      border-color: var(--bic-blue);
      color: #fff;
    }
    @media (max-width: 620px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
    }


    /* The form modal reuses the Socializer's modal-grid; these two only exist
       because a guide has long prose where a post has a caption. */
    .modal-form textarea.tall { min-height: 200px; }
    .modal-form .field-note { font-size: .72rem; color: var(--muted); margin: 4px 0 0; }

    /* .label-opt lays its <span> out as a block label above a full-width
       control, which is right for every field here except the one that IS a
       checkbox - there the box was pushed to the far edge, a screen away from
       its own word. */
    .label-opt.label-check span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: auto;
    }
    .label-opt.label-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      min-height: 0;
      margin: 0;
      flex: 0 0 auto;
    }

  <!-- ── The form. One modal for both NEW and EDIT: the fields are identical

      <div class="modal-actions">

        <button class="btn primary" type="submit">Save</button>
      </div>

  <!-- A yes/no question, asked where every other question in this room is
       asked. Generic on purpose: it takes its words from the caller, so the
       next confirmation does not add a third dialog. -->
  <div class="tool-backdrop" id="confirmBackdrop" hidden></div>

        <button class="btn" id="confirmNo" type="button">Cancel</button>
        <button class="btn primary" id="confirmYes" type="button">Yes</button>

    </div>

  <!-- ── The prompt sheet. The eyebrow says which of the two prompts this is;
       the chips that used to sit under the head ("public.guides", "writes
       nothing itself") are gone — they described the plumbing to someone who
       had come here to copy some text. ── -->
  <div class="tool-backdrop" id="promptBackdrop" hidden></div>
  <section class="prompt-panel tool-modal-panel tool-modal-panel--wide" id="promptCard"
           role="dialog" aria-modal="true" aria-labelledby="promptTitle" hidden>
    <div class="panel-head prompt-head">
      <div class="prompt-headline">
        <span class="prompt-eyebrow" id="promptKind">Paste-ready prompt</span>
        <h2 class="panel-title" id="promptTitle">Paste-Ready Prompt</h2>

        <button class="btn small" data-prompt-close type="button">Close</button>
      </span>
    </div>

    <div class="prompt-body">
      <p class="prompt-note" id="promptHelp"></p>
      <!-- The two things you say before copying, on one line. Both belong to
           a guide that does not exist yet, so the whole row goes away when the
           prompt is about a guide already on a card. -->
      <div class="prompt-controls" id="promptControls">
        <!-- HOW MANY is a segmented control, not a number box: three real
             answers, and the one in force is readable without opening
             anything - the same reason SORT is two buttons. -->
        <div class="prompt-count">
          <span class="prompt-ctl-label">HOW MANY</span>
          <div class="seg" role="group" aria-label="How many guides to ask for">
            <button class="seg-btn" type="button" data-count="1">1</button>
            <button class="seg-btn" type="button" data-count="5">5</button>
            <button class="seg-btn" type="button" data-count="10">10</button>
          </div>
        </div>
        <!-- The roster always goes in as a do-not-repeat list of NAMES. This
             is the separate, stronger call about PLACES: a catalogue full of
             Chicago is a real risk, but so is refusing the second guide from
             a city big enough for two. It is a switch because that judgement
             changes with what you are asking for. -->
        <label class="label-opt label-check prompt-check" id="promptAvoidWrap">
          <span>
            <input type="checkbox" id="promptAvoidHometowns" checked>
            Avoid hometowns we already use
          </span>
        </label>
        <!-- Character and portrait in one errand. Off by default: it only
             works in an AI that can draw (not Claude), and it changes the
             answer from one block of SQL into SQL plus a stack of images. -->
        <label class="label-opt label-check prompt-check" id="promptDrawWrap">
          <span>
            <input type="checkbox" id="promptDrawImages">
            Draw the portraits too
          </span>
        </label>
        <!-- NOTES. The prompt for a guide that does not exist yet has nothing
             to go on, so this is where you tell it: the hometown, the fandom,
             the kind of voice you want. It folds into the brief as you type. -->
        <label class="label-opt" id="promptNotesWrap">
          <span>NOTES FOR THE AI</span>
          <input type="text" id="promptNotes" autocomplete="off"
                 placeholder="Hometown: Buffalo. Fandom: Bills. A snowplough driver who has seen it all.">
        </label>
      </div>
      <textarea class="prompt" id="promptText" readonly spellcheck="false"></textarea>
    </div>

    <!-- THE FOOT IS THE JOB IN ORDER: copy it, paste it into an AI, run what
         comes back. Left to right is the sequence, and the weight says which
         step you are on — COPY is the only primary. -->
    <div class="prompt-foot">
      <!-- First in the DOM and carrying the auto margin, so it holds the left
           end and pushes the three steps into a block at the right. It is
           empty almost always; the margin is what does the work. -->
      <span class="copy-status" id="copyStatus" aria-live="polite"></span>

      <button class="btn primary prompt-copy" id="copyPromptBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyPromptLabel">Copy prompt</span>
      </button>

      <!-- Three doors to the same step, so they are grouped as one control
           rather than strung out as three peers of Copy. They open a BLANK
           chat: none of them takes a sixty-line prompt through a query string
           reliably, and the prompt is on the clipboard already — a
           half-truncated pre-fill would be worse than an empty box.

           CLAUDE IS NOT ONE OF THEM, and that is deliberate: it cannot
           generate images, so it is a dead end for the portrait prompts and
           for a brief with "Draw the portraits too" ticked. Every door here
           has to finish the errand it is offered for. -->
      <div class="prompt-ai" role="group" aria-label="Open an AI to paste into">
        <span class="prompt-ctl-label">PASTE INTO</span>
        <span class="prompt-ai-row">
          <a class="btn small" target="_blank" rel="noopener" href="https://chatgpt.com/">ChatGPT</a>
          <a class="btn small" target="_blank" rel="noopener" href="https://grok.com/">Grok</a>
          <a class="btn small" target="_blank" rel="noopener" href="https://gemini.google.com/app">Gemini</a>
        </span>
      </div>

      <!-- Where the answer goes. The prompt's deliverable is SQL, so the last
           step is a tab this page can hand you rather than one you go and
           find. -->
      <a class="btn prompt-sql-btn" id="sqlEditorLink" target="_blank" rel="noopener"
         href="https://supabase.com/dashboard/project/qmaafbncpzrdmqapkkgr/sql/new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3h7v7"></path>
          <path d="M21 3l-9 9"></path>
          <path d="M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
        </svg>
        <span>SQL editor</span>
      </a>
    </div>
  </section>

  <script>
    'use strict';

    // GUIDE GREEN ROOM — where the narrators are made.
    //
    // One table, public.guides, and nothing else. A guide is a CHARACTER: one
    // row, however many games point at it. This room deliberately shows NO game
    // information at all - not a count, not a title. A guide is written on its
    // own terms, and the moment a card starts listing games it becomes a report
    // about games rather than a place to write a character.
    //
    // The games.guide_* columns are still what both engines read at play time.
    // NOTHING HERE WRITES THEM: the guides_sync_games trigger pushes a saved
    // guide onto every game pointing at it. Write the guide; the trigger does
    // the rest.

    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    // The `guides` Storage bucket is no longer written to. Nothing points at
    // an object in it now that image_url is gone, so a copy there would be a
    // file nothing references. The bucket and its existing objects are left
    // alone rather than tidied away: games.guide_image_url still names some of
    // them, frozen, and the engines still read that column.
    const EDITABLE = ['name', 'hometown', 'bio', 'background'];

    const state = {
      authed: false,
      guides: [],
      filter: '',
      editingId: null,      // null while the form is adding rather than editing
      busy: false,
      dirty: new Set(),     // guide ids with unsaved boxes on their card
      // NEWEST FIRST BY DEFAULT. The room is worked at the front - a guide you
      // just added is the one you are still writing, and it used to open on
      // the far end of an alphabet from it.
      sort: 'newest',       // 'newest' | 'az' (az = city, then last name)
      promptNotes: '',      // what the PROMPT box was told about the guide to invent
      promptCount: 1,       // how many guides that prompt asks for: 1, 5 or 10
      promptAvoidHometowns: true,  // keep the new ones away from the hometowns already in use
      promptDrawImages: false      // ask the same AI for the portraits after the SQL
    };

    const el = (id) => document.getElementById(id);
    const cleanText = (v) => String(v == null ? '' : v).trim();
    const guideList = el('guideList');
    const pageStatus = el('pageStatus');

    function cssEscape(value) {
      const s = String(value);
      return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\\]]/g, '\\$&');
    }

    // The line that sits under the title when nothing else is being said: the
    // count, then the blurb. The count is a sentence rather than a badge over
    // the list because it is a fact about the room, not a control - and it now
    // has only one home, so it cannot disagree with itself.
    function restingLine() {
      const blurb = 'Each game has a guide that lends voice and tone to the player’s experience.'
        + ' A guide can narrate one or more games.';
      if (!state.authed || !state.guides.length) return blurb;
      const n = state.guides.length;
      return n + ' guide' + (n === 1 ? '' : 's') + '. ' + blurb;
    }

    let statusTimer = 0;
    function setStatus(text, kind) {
      if (!pageStatus) return;
      window.clearTimeout(statusTimer);
      pageStatus.textContent = text || restingLine();
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
      if (text && kind !== 'error') statusTimer = window.setTimeout(() => setStatus(''), 4500);
    }

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') {
        try { await adminAuth.ensureFreshSession(); } catch (error) {}
      }
    }

    async function readError(response, fallback) {
      try {
        const text = await response.text();
        if (!text) return fallback;
        try {
          const payload = JSON.parse(text);
          return payload.message || payload.hint || payload.error || text;
        } catch (error) { return text; }
      } catch (error) { return fallback; }
    }

    function adminToken() {
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      return (session && session.access_token) || '';
    }

    // --- loading --------------------------------------------------------------

    // ?guide=<id> — a deep link into one character's card, used by the guide
    // picker in Game Profiles. It SCROLLS AND MARKS, it does not filter: you
    // arrived to edit one guide, but the roster around it is the reason this
    // room shows every card at once, and a filtered room would hide the very
    // thing you would compare against.
    //
    // Fires once. Reloading the list later - after a save, an upload, a delete
    // - must not yank the page back to whatever the URL said when it opened.
    let jumpedToRequestedGuide = false;

    function requestedGuideId() {
      try {
        return String(new URLSearchParams(location.search).get('guide') || '').trim();
      } catch (e) { return ''; }
    }

    function jumpToRequestedGuide() {
      if (jumpedToRequestedGuide) return;
      const want = requestedGuideId();
      if (!want) { jumpedToRequestedGuide = true; return; }
      const card = guideList.querySelector('[data-guide-id="' + cssEscape(want) + '"]');
      if (!card) {
        // The list is loaded and the guide is not in it - deleted next door, or
        // a hand-typed id. Say so rather than leaving the page looking normal
        // while silently ignoring the URL.
        setStatus('Guide #' + want + ' is not in this room.', 'error');
        jumpedToRequestedGuide = true;
        return;
      }
      jumpedToRequestedGuide = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('is-linked');
      // The mark fades on its own: it says "this is the one you asked for",
      // which stops being true the moment you start working in the room.
      setTimeout(() => card.classList.remove('is-linked'), 4000);
    }

    async function refresh() {
      try {
        await ensureFreshSession();
        // select=*, never a column list: naming a column the database does not
        // have 400s the whole load. The standing rule in this codebase.
        const url = restUrl('guides', { select: '*', order: 'name.asc' });
        const rows = (window.TgbRest && window.TgbRest.fetchAll)
          ? await window.TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }))
          : await (await fetch(url, { headers: authHeaders() })).json();
        if (rows && rows.code) throw new Error(rows.message || 'Load failed.');
        state.guides = Array.isArray(rows) ? rows : [];
        render();
        setStatus('');
        jumpToRequestedGuide();
      } catch (error) {
        console.error(error);
        const msg = (error && error.message) || 'Load failed.';
        setStatus(msg, 'error');
        guideList.innerHTML = '';
        guideList.appendChild(emptyNode(/relation|does not exist/i.test(msg)
          ? 'public.guides does not exist yet — run mc/supabase/migrations/2026080901_guides_table.sql.'
          : 'Could not load guides. ' + msg));
      }
    }

    // --- rendering ------------------------------------------------------------

    function emptyNode(text) {
      const node = document.createElement('div');
      node.className = 'guide-empty';
      node.textContent = text;
      return node;
    }

    // NOTHING IS HIDDEN. The name filter went on 2026-08-09 - 34 cards is a
    // scroll, not a search problem, and a box that hides rows is a way to edit
    // a guide while looking at a list that does not contain it - and the
    // archived flag went the same day. Every guide in the table is on screen.
    // A NAME SPLIT THE WAY A ROSTER IS FILED: last name to sort on, the rest
    // as the tiebreak. Quoted nicknames come out first - Bernice "Birdie"
    // LaFleur files under LaFleur, and Hector "El Martillo" Valenzuela under
    // Valenzuela, where taking the last word of the raw string would file one
    // of them under a nickname. A single-word name (Mission Control, Sir Purr,
    // The Wagonmaster) is left whole: it has no surname to find, and guessing
    // one would file The Wagonmaster under W.
    function guideNameParts(guide) {
      const raw = cleanText(guide && guide.name)
        .replace(/[“”"'’][^“”"'’]*[“”"'’]/g, ' ')   // drop "Birdie", 'El Martillo'
        .replace(/\s+/g, ' ')
        .trim();
      if (!raw) return { last: '', first: '' };
      const words = raw.split(' ');
      if (words.length === 1) return { last: words[0], first: '' };
      return { last: words[words.length - 1], first: words.slice(0, -1).join(' ') };
    }

    const byText = (a, b) => String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base' });

    function visibleGuides() {
      const rows = state.guides.slice();
      if (state.sort === 'az') {
        // CITY, then last name, then first: the room is read city by city -
        // it is how a guide is cast, and how the picker in Game Profiles is
        // ordered - and within a city a roster files by surname.
        rows.sort((a, b) => {
          const townA = cleanText(a.hometown);
          const townB = cleanText(b.hometown);
          // Unplaced guides sink rather than sorting under the empty string at
          // the top, where the list would look like it starts broken.
          if (!townA !== !townB) return townA ? -1 : 1;
          const byTown = byText(townA, townB);
          if (byTown) return byTown;
          const nameA = guideNameParts(a);
          const nameB = guideNameParts(b);
          return byText(nameA.last, nameB.last) || byText(nameA.first, nameB.first);
        });
      } else {
        // Newest FIRST, by id rather than created_at: the id is assigned in
        // order and can never be null, while created_at is a timestamp two
        // rows written in the same second would tie on.
        rows.sort((a, b) => Number(b.id) - Number(a.id));
      }
      return rows;
    }

    function setSort(mode) {
      state.sort = mode;
      el('sortAzBtn').classList.toggle('is-on', mode === 'az');
      el('sortNewBtn').classList.toggle('is-on', mode === 'newest');
      render();
    }

    function render() {
      guideList.innerHTML = '';
      // Every path that changes the guides ends here — a load, a save, an
      // upload, a delete — so the portrait count is repainted here rather than
      // at four call sites that would drift apart.
      paintMissingArt();
      if (!state.authed) {
        guideList.appendChild(emptyNode('Sign in with an admin account to work on the guides.'));
        setStatus('');
        return;
      }
      const rows = visibleGuides();
      setStatus('');
      if (!rows.length) {
        guideList.appendChild(emptyNode(state.guides.length
          ? 'No guide matches that filter.'
          : 'No guides yet. Press MANUAL to write the first one.'));
        return;
      }
      rows.forEach((g) => guideList.appendChild(renderGuideCard(g)));
    }

    function mkBtn(text, title, onClick, cls) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn small' + (cls ? ' ' + cls : '');
      b.textContent = text;
      if (title) b.title = title;
      b.addEventListener('click', onClick);
      return b;
    }

    function renderGuideCard(guide) {
      const card = document.createElement('article');
      card.className = 'guide-card';
      card.dataset.guideId = guide.id;

      // ── the portrait, and the two buttons under it ──
      const figure = document.createElement('div');
      figure.className = 'guide-figure';
      const shot = document.createElement('div');
      shot.className = 'guide-shot';
      shot.setAttribute('data-shot', '');
      paintShot(shot, guide);

      const status = document.createElement('div');
      status.className = 'guide-upload-status';
      status.setAttribute('aria-live', 'polite');

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.hidden = true;
      const uploadBtn = mkBtn('Upload Image', 'Put a portrait on this guide', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = '';
        if (file) uploadImageFile(guide.id, file, uploadBtn, status);
      });

      // Image Prompt sits with the picture, not in the row of card actions:
      // it is one half of getting a portrait (write the prompt, then upload
      // what comes back), and both halves belong under the thing they change.
      figure.append(shot, uploadBtn, fileInput,
        mkBtn('Image Prompt', 'An AI prompt for this guide’s portrait', () => showImagePrompt(guide.id)));
      // HOST HERE is gone with image_url (2026-08-09). There is nowhere else
      // for a portrait to be any more - it is in the row or it does not exist,
      // so there is nothing to fetch and nothing to re-host.
      figure.appendChild(status);

      // ── the character ──
      const body = document.createElement('div');
      body.className = 'guide-body';

      // NO HEADING. The name and the id were a title bar above the fields, and
      // both are fields - the name box is the first thing on the card and id
      // is a locked one below. A card that printed them again was reading the
      // same two values twice, and the heading version was the one you could
      // not edit.

      // EVERY COLUMN IN public.guides, in the order a person reads them: what
      // a player hears first, then what is written about the character, then
      // the plumbing. Editable ones are boxes; the four with exactly one
      // non-human writer are shown and locked.
      const fields = document.createElement('div');
      fields.className = 'gfields';
      // The id rides at the right of the NAME row: it is how you refer to the
      // card, so it belongs on the line you read first, and it costs no row of
      // its own. THE IMAGE ROW IS GONE - the portrait is right there at the
      // left of the card, so a line reporting its file type and weight was
      // describing something already on screen.
      const stamped = document.createElement('span');
      stamped.className = 'gfield-id';
      stamped.textContent = '#' + guide.id;
      fields.append(
        gField(guide, 'name', 'NAME', { required: true, suffix: stamped }),
        gField(guide, 'hometown', 'HOMETOWN', { list: 'cityList', required: true }),
        gField(guide, 'bio', 'BIO', { multiline: true, required: true }),
        gField(guide, 'background', 'BACKGROUND', { multiline: true, tall: true, required: true }),
        gStamps(guide)
      );
      body.appendChild(fields);

      const actions = document.createElement('div');
      actions.className = 'guide-actions';
      const save = mkBtn('Save', 'Write these fields back', () => saveCard(guide.id), 'primary');
      save.dataset.action = 'save';
      save.disabled = !state.dirty.has(String(guide.id));
      // Delete sits between Fill and Save, red, and it is the one button on
      // the card that cannot be undone: it takes the character AND leaves
      // every game that used it without a guide, a number this room
      // deliberately cannot show. Hence the confirmation it always asks for.
      const note = document.createElement('span');
      note.className = 'gsave-note';
      note.dataset.role = 'dirty-note';
      // Built from the same reading as every later repaint, so a card that is
      // rebuilt mid-flash comes back still saying it.
      const shown = cardNote(String(guide.id));
      note.textContent = shown.text;
      note.classList.toggle('is-saved', shown.saved);
      // The note carries margin-right:auto, so everything after it is pushed
      // to the right edge: Fill, then Save under your thumb.
      actions.append(
        note,
        mkBtn('Fill', 'Fill the empty boxes from what the filled ones already say', () => fillCard(guide.id)),
        mkBtn('Delete', 'Remove this guide for good', () => deleteGuide(guide.id), 'warn'),
        save
      );
      body.appendChild(actions);

      card.append(figure, body);
      return card;
    }

    // --- the fields on a card -------------------------------------------------

    // A live copy per guide, so typing does not have to hit the database on
    // every keystroke and Save has something to write. Keyed by id.
    const drafts = new Map();
    function draftOf(guide) {
      const key = String(guide.id);
      if (!drafts.has(key)) {
        drafts.set(key, {
          name: cleanText(guide.name), hometown: cleanText(guide.hometown),
          bio: cleanText(guide.bio), background: cleanText(guide.background),
        });
      }
      return drafts.get(key);
    }
    const CARD_FIELDS = ['name', 'hometown', 'bio', 'background'];
    function isDirty(guide) {
      const d = draftOf(guide);
      return CARD_FIELDS.some((f) => d[f] !== cleanText(guide[f]));
    }

    // SAVED IS SAID WHERE UNSAVED IS SAID. One slot on the card answers "is
    // this written down?", so the yes and the no share it - a confirmation
    // somewhere else on the screen is a second place to look for one fact.
    //
    // It has to outlive a render(), because saving and uploading both rebuild
    // the card: hence a map consulted while the note is being built, rather
    // than a class dropped onto a node that is about to be thrown away.
    // Guide id -> the timer that clears it.
    // Guide id -> { text, timer }. The word differs by what was written: a
    // portrait saves on its own the instant you pick a file, and "image saved"
    // is what makes that legible - a bare "saved" beside boxes that were never
    // touched invites you to think they were.
    const savedFlash = new Map();
    const SAVED_FLASH_MS = 4000;

    function flashSaved(id, text) {
      const key = String(id);
      const prev = savedFlash.get(key);
      if (prev) clearTimeout(prev.timer);
      savedFlash.set(key, {
        text: text || 'saved',
        timer: setTimeout(() => {
          savedFlash.delete(key);
          paintCardNote(key);
        }, SAVED_FLASH_MS)
      });
      paintCardNote(key);
    }

    // UNSAVED OUTRANKS SAVED. Type into a box a second after uploading and the
    // card is dirty again; still saying "saved" would be a lie about the boxes
    // rather than a stale compliment.
    function cardNote(key) {
      if (state.dirty.has(key)) return { text: 'unsaved', saved: false };
      const flash = savedFlash.get(key);
      if (flash) return { text: flash.text, saved: true };
      return { text: '', saved: false };
    }

    function paintCardNote(key) {
      const card = guideList.querySelector('[data-guide-id="' + cssEscape(key) + '"]');
      if (!card) return;
