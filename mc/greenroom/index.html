      const save = card.querySelector('[data-action="save"]');
      if (save) save.disabled = !state.dirty.has(key);
      const note = card.querySelector('[data-role="dirty-note"]');
      if (!note) return;
      const shown = cardNote(key);
      note.textContent = shown.text;
      note.classList.toggle('is-saved', shown.saved);
    }

    function markCardDirty(guide) {
      const key = String(guide.id);
      if (isDirty(guide)) state.dirty.add(key); else state.dirty.delete(key);
      paintCardNote(key);
    }

    function gField(guide, key, label, opts) {
      const options = opts || {};
      const wrap = document.createElement('label');
      wrap.className = 'gfield';
      const lab = document.createElement('span');
      lab.textContent = label;
      const draft = draftOf(guide);
      const input = document.createElement(options.multiline ? 'textarea' : 'input');
      if (!options.multiline) input.type = options.type || 'text';
      if (options.tall) input.className = 'tall';
      if (options.list) input.setAttribute('list', options.list);
      input.value = draft[key];
      input.dataset.field = key;
      // EMPTY IS RED, and only empty. There is no other validation state on a
      // card - a guide with no background is not an error, it is unfinished
      // work, and the red box says which piece is missing without a sentence.
      const paint = () => input.classList.toggle('is-empty', options.required !== false && !cleanText(input.value));
      paint();
      input.addEventListener('input', () => {
        draft[key] = input.value;
        paint();
        markCardDirty(guide);
      });
      // A suffix rides at the right of the same row - the id on the name line.
      // It shares the value column rather than taking one of its own, so the
      // rules down the card stay unbroken.
      if (options.suffix) {
        const line = document.createElement('div');
        line.className = 'gfield-line';
        line.append(input, options.suffix);
        wrap.append(lab, line);
      } else {
        wrap.append(lab, input);
      }
      return wrap;
    }

    // Both timestamps on one line: created at the left, updated riding the
    // right the way the id rides the name row. They are one fact about the
    // card - when it appeared and when it last changed - and two rows for it
    // took as much of the sheet as the bio.
    //
    // An untouched guide shows only "created". Printing the same timestamp
    // twice invites reading it as two events.
    function gStamps(guide) {
      const wrap = document.createElement('div');
      wrap.className = 'gfield';
      const lab = document.createElement('span');
      lab.textContent = 'CREATED';
      const line = document.createElement('div');
      line.className = 'gfield-line';
      const made = document.createElement('div');
      made.className = 'gfield-ro';
      made.style.flex = '1';
      made.textContent = stamp(guide.created_at) || '—';
      line.appendChild(made);
      const changed = stamp(guide.updated_at);
      if (changed && changed !== stamp(guide.created_at)) {
        const edited = document.createElement('span');
        edited.className = 'gfield-id';
        edited.textContent = 'UPDATED ' + changed;
        line.appendChild(edited);
      }
      wrap.append(lab, line);
      return wrap;
    }

    function stamp(value) {
      const v = cleanText(value);
      if (!v) return '';
      const d = new Date(v);
      return isNaN(d) ? v : d.toLocaleString([], {
        year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
    }

    // --- Fill -----------------------------------------------------------------
    //
    // Fill the EMPTY boxes from what the FULL ones already say. No AI and no
    // network: this only rearranges what a human already wrote, which is why
    // it can be trusted to run on a press. It writes to the draft, so nothing
    // reaches the database until Save - and if it guesses wrong, retyping the
    // box is the whole undo.

    // The labelled sections an AI-written background comes back with. Ten of
    // the fourteen backgrounds in the table carry these headings, so a bio can
    // usually be lifted rather than invented.
    const BIO_SOURCES = ['Short description', 'One-line hook', 'Personality'];

    function sectionFrom(text, label) {
      const body = cleanText(text);
      if (!body) return '';
      const re = new RegExp('^\\s*' + label + '\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*[A-Z][A-Za-z \\-]{2,28}\\s*:|$)', 'im');
      const hit = body.match(re);
      return hit ? cleanText(hit[1]).replace(/\s+/g, ' ') : '';
    }

    // THE FIRST-PERSON REWRITE IS GONE (2026-08-10), and with it about sixty
    // lines of the most delicate code on this page: pronoun tables, contraction
    // handling, subject-verb agreement and a positional -s stripper with a
    // keep-list, all of it to turn "she rides shotgun" into "I ride shotgun".
    //
    // It existed to bridge a mismatch that no longer exists. The background is
    // written ABOUT the character and the bio used to be the character
    // SPEAKING, so Fill had to change person. Bios are third person now - the
    // whole table was rewritten and the AI brief asks for it - so the two
    // fields are in the same voice and the sentences carry across untouched.
    //
    // ONE THING STILL HAS TO HAPPEN: the name comes out. A bio never carries
    // the guide's own name (the game has already told the player what they are
    // called, so a bio that repeats it reads as a caption), while a background
    // uses it freely. So the name is swapped for whichever pronoun that
    // background already uses about them - taking the text's own word for it
    // rather than guessing from the name, which would be guessing at a person.
    const KEEP_S = [
      'is', 'was', 'has', 'does', 'goes', 'always', 'sometimes', 'perhaps', 'yes',
      'across', 'less', 'unless', 'this', 'his', 'hers', 'its', 'us', 'plus', 'gas',
      'bus', 'class', 'glass', 'press', 'dress', 'guess', 'miss', 'boss', 'loss'
    ];
    // Verbs whose base genuinely ends -ie, so "ties" is "tie" and never "ty".
    const SHORT_IE = ['tie', 'lie', 'die', 'vie', 'hie', 'untie'];

    // POSSESSIVES COUNT. A background often names the character in every
    // subject position and only ever uses a pronoun possessively - "Otis
    // Bellweather maintained courthouse clocks. His manners are those of a
    // host." Counting subjects alone finds nothing there, defaults to they,
    // and hands back a bio that says "They maintained... His manners", which
    // is worse than either choice made consistently.
    function dominantPronoun(text) {
      const count = (re) => (text.match(re) || []).length;
      const she = count(/\b(?:she|her|hers|herself)\b/gi);
      const he = count(/\b(?:he|him|his|himself)\b/gi);
      const they = count(/\b(?:they|them|their|theirs|themselves)\b/gi);
      if (she && she >= he && she >= they) return 'she';
      if (he && he >= they) return 'he';
      // they/them is the default when the text never says - the same rule the
      // rest of the product follows about people whose pronouns are not given.
      return 'they';
    }

    function stripGuideName(text, name) {
      let out = ' ' + cleanText(text) + ' ';
      if (!cleanText(out)) return '';
      const pronoun = dominantPronoun(out);
      const full = cleanText(name);
      if (full) {
        // Longest first, so "Miss Peachtree Knox" is matched before
        // "Peachtree" and does not leave half a name behind. Parts of one or
        // two letters are skipped - an initial is too easy to hit inside
        // ordinary prose.
        const parts = [full].concat(full.split(/\s+/).filter((p) => p.replace(/\W/g, '').length > 2));
        parts.sort((a, b) => b.length - a.length).forEach((p) => {
          const safe = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          out = out.replace(new RegExp('\\b' + safe + "'s\\b", 'g'), pronoun === 'they' ? 'their' : (pronoun === 'she' ? 'her' : 'his'));
          out = out.replace(new RegExp('\\b' + safe + '\\b', 'g'), pronoun);
        });
      }
      // Name parts are replaced one at a time, so two of them side by side
      // each leave a pronoun behind: "Peachtree Knox is unshockable" comes out
      // "she she is". Collapsing a doubled pronoun is cheaper and safer than
      // trying every multi-word combination of a name.
      out = out.replace(/\b(she|he|they|her|his|their)\s+\1\b/gi, '$1');
      // Agreement, but only for "they" - "she is" was already correct and must
      // be left alone. Same positional -s rule the old rewrite used, since
      // they-verbs drop the -s exactly as I-verbs did.
      if (pronoun === 'they') {
        out = out
          .replace(/\bthey is\b/gi, 'they are')
          .replace(/\bthey was\b/gi, 'they were')
          .replace(/\bthey has\b/gi, 'they have')
          .replace(/\bthey does\b/gi, 'they do')
          .replace(/\bthey goes\b/gi, 'they go')
          .replace(/\bthey isn't\b/gi, "they aren't")
          .replace(/\bthey doesn't\b/gi, "they don't")
          .replace(/\bthey hasn't\b/gi, "they haven't")
          // An adverb may sit between the pronoun and its verb - "they always
          // says so" is the shape a next-word-only rule misses.
          .replace(/\bthey ((?:always|never|often|sometimes|usually|rarely|still|also|just|really|only|barely|nearly|almost)\s+)?(\w+)s\b/gi,
            (whole, adverb, verb) => {
              if (KEEP_S.indexOf(verb.toLowerCase() + 's') > -1) return whole;
              let stem = verb;
              // "carries" -> "carry", "studies" -> "study". The regex has
              // already taken the s, leaving "carrie". Without this the old
              // rewrite produced "they carrie a thermos", which is the kind of
              // wrong that reads as a broken page rather than a rough draft.
              // SHORT_IE guards the handful of verbs whose base really does
              // end -ie, where "ties" is "tie" and not "ty".
              if (/[^aeiou]ie$/i.test(stem) && SHORT_IE.indexOf(stem.toLowerCase()) === -1) {
                stem = stem.slice(0, -2) + 'y';
              } else if (/(?:ch|sh|ss|x|z|o)e$/i.test(stem)) {
                // "misses" -> "miss", "watches" -> "watch": -es after a sibilant.
                stem = stem.slice(0, -1);
              }
              return 'they ' + (adverb || '') + stem;
            });
      }
      out = cleanText(out);
      // EVERY sentence, not just the first: a swap can leave a sentence opening
      // on a word that used to sit mid-clause, and fixing only character zero
      // leaves the rest lower case.
      out = out.replace(/([.!?]\s+)([a-z])/g, (m, punct, ch) => punct + ch.toUpperCase());
      return out.charAt(0).toUpperCase() + out.slice(1);
    }

    function firstSentences(text, count) {
      const parts = cleanText(text).replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+/g);
      if (!parts) return cleanText(text).replace(/\s+/g, ' ').slice(0, 300);
      return parts.slice(0, count).join(' ').trim();
    }

    // A city from the catalogue, named in the guide's own words.
    //
    // THE EARLIEST MENTION WINS, and that is not a detail. The first cut took
    // the longest matching name instead, which read Mission Control's text -
    // "ready to rally Chicago fans" at character 45, with Cincinnati buried at
    // 376 - and confidently answered Cincinnati. A guide's home is what its
    // opening line says, so position decides; length only breaks a tie at the
    // same position, which is what keeps "Kansas City" from being read as
    // "Kansas".
    //
    // Matching is case-sensitive on purpose. "mobile", "reading" and "hope"
    // are all real cities in the catalogue, and a bio mentioning a mobile
    // phone should not acquire a hometown in Alabama.
    function cityFromText(text) {
      const body = cleanText(text);
      if (!body || !window.TgbCities) return '';
      const rows = window.TgbCities.all();
      if (!rows.length) return '';
      let best = null;
      rows.forEach((row) => {
        const name = String(row.city).split(',')[0].trim();
        if (name.length < 4) return;
        const at = body.search(new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b'));
        if (at < 0) return;
        if (!best || at < best.at || (at === best.at && name.length > best.name.length)) {
          best = { city: row.city, name: name, at: at };
        }
      });
      return best ? best.city : '';
    }

    function fillCard(id) {
      const guide = findGuide(id);
      if (!guide) return;
      const draft = draftOf(guide);
      const filled = [];

      // HOMETOWN from whatever the guide's own text names. Only a city the
      // catalogue knows, because the column is a foreign key into it.
      if (!draft.hometown) {
        const city = cityFromText([draft.name, draft.bio, draft.background].filter(Boolean).join('\n'));
        if (city) { draft.hometown = city; filled.push('hometown'); }
      }

      // BIO from the background's own summary sections, and only failing those
      // its first two sentences. A background is written for whoever builds the
      // game; a bio is read by the player, so the summary lines are the ones
      // that were already written to be short.
      //
      // Both fields are third person now, so the sentences carry across as
      // they stand - only the name comes out. See stripGuideName.
      if (!draft.bio && draft.background) {
        let bio = '';
        for (let i = 0; i < BIO_SOURCES.length && !bio; i += 1) {
          bio = sectionFrom(draft.background, BIO_SOURCES[i]);
        }
        if (!bio) bio = firstSentences(draft.background, 2);
        if (bio) {
          draft.bio = stripGuideName(firstSentences(bio, 3), draft.name);
          filled.push('bio');
        }
      }

      // A BACKGROUND IS NOT DERIVABLE and Fill does not pretend otherwise. It
      // is the long character breakdown; there is nothing in a two-sentence
      // bio to expand it from, and a fabricated one reads exactly like a real
      // one. That is what the PROMPT button is for.

      if (!filled.length) {
        const blanks = CARD_FIELDS.filter((f) => !draft[f]);
        const derivable = blanks.filter((f) => f !== 'background' && f !== 'name');
        let why;
        if (!blanks.length) why = 'Every box on that card is already filled.';
        else if (!derivable.length) {
          // The common case, and the one a vague message made confusing: the
          // only blank is the background, which Fill cannot invent from a
          // two-sentence bio. Name the button that can.
          why = 'Only the background is empty, and that cannot be derived from a bio — use PROMPT.';
        } else {
          why = 'Nothing to fill ' + derivable.join(' or ') + ' from: no city the catalogue knows is named in this guide’s text.';
        }
        setStatus(why, blanks.length ? 'error' : '');
        return;
      }
      // Dirty BEFORE the repaint: renderGuideCard reads state.dirty to decide
      // whether Save is enabled, so marking it afterwards would rebuild the
      // card with a dead Save button over freshly filled boxes.
      state.dirty.add(String(id));
      render();
      setStatus('Filled ' + filled.join(' and ') + ' for ' + (cleanText(draft.name) || '#' + id)
        + ' from what was already there. Check it, then Save.', 'success');
    }

    async function saveCard(id) {
      const guide = findGuide(id);
      if (!guide) return;
      const draft = draftOf(guide);
      if (!draft.name) { setStatus('A guide needs a name.', 'error'); return; }
      if (draft.hometown && window.TgbCities
        && !window.TgbCities.all().some((c) => c.city === draft.hometown)) {
        setStatus('"' + draft.hometown + '" is not in the city catalogue — pick one from the list.', 'error');
        return;
      }
      const payload = {
        name: draft.name || null,
        hometown: draft.hometown || null,
        bio: draft.bio || null,
        background: draft.background || null,
      };
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not save this guide.'));
        const [fresh] = await res.json();
        Object.assign(guide, fresh);
        drafts.delete(String(id));
        state.dirty.delete(String(id));
        render();
        flashSaved(id);
        setStatus('Saved ' + cleanText(fresh.name) + '.', 'success');
      } catch (error) {
        const raw = error.message || '';
        setStatus(/guides_name_key|duplicate key/i.test(raw)
          ? 'There is already a guide with that name — a character is meant to be singular.'
          : (raw || 'Save failed.'), 'error');
      }
    }

    function paintShot(shot, guide) {
      shot.innerHTML = '';
      // The row is the only place a portrait lives now. There is no URL to
      // fall back to, which is the point: nothing here can 404.
      const url = cleanText(guide.image);
      if (!url) {
        const ph = document.createElement('div');
        ph.className = 'guide-shot-empty';
        ph.textContent = 'NO PORTRAIT';
        shot.appendChild(ph);
        return;
      }
      const img = document.createElement('img');
      img.src = url;
      img.alt = cleanText(guide.name) || 'Guide portrait';
      img.loading = 'lazy';
      // A dead link is the normal case for anything not yet hosted here, so it
      // is named rather than left as a broken-image icon. "No portrait" and
      // "the portrait link is broken" are different problems.
      img.addEventListener('error', () => {
        shot.innerHTML = '';
        const ph = document.createElement('div');
        ph.className = 'guide-shot-empty';
        ph.textContent = 'LINK IS DEAD';
        shot.appendChild(ph);
      });
      shot.appendChild(img);
    }

    const findGuide = (id) => state.guides.find((g) => String(g.id) === String(id)) || null;


    // --- the form -------------------------------------------------------------
    // One modal for NEW and EDIT. state.editingId is the whole difference: null
    // means insert, an id means update. Two dialogs would drift apart the first
    // time one of them gained a field.

    function openForm(id) {
      const guide = id == null ? null : findGuide(id);
      state.editingId = guide ? guide.id : null;
      el('formTitle').textContent = guide ? ('Edit — ' + (cleanText(guide.name) || '#' + guide.id)) : 'New Guide';
      el('fName').value = guide ? cleanText(guide.name) : '';
      el('fHometown').value = guide ? cleanText(guide.hometown) : '';
      el('fBio').value = guide ? cleanText(guide.bio) : '';
      el('fBackground').value = guide ? cleanText(guide.background) : '';
      formStatus('');
      el('formCard').hidden = false;
      el('formBackdrop').hidden = false;
      el('fName').focus();
    }

    function closeForm() {
      el('formCard').hidden = true;
      el('formBackdrop').hidden = true;
      state.editingId = null;
    }

    function formStatus(message, isError) {
      const node = el('formStatus');
      node.textContent = message || '';
      node.classList.toggle('is-error', !!isError);
    }

    function formPayload() {
      return {
        name: cleanText(el('fName').value) || null,
        hometown: cleanText(el('fHometown').value) || null,
        bio: cleanText(el('fBio').value) || null,
        background: cleanText(el('fBackground').value) || null
      };
    }

    async function submitForm(event) {
      if (event) event.preventDefault();
      if (state.busy) return;
      const payload = formPayload();
      if (!payload.name) { formStatus('A guide needs a name.', true); return; }
      // The hometown is a foreign key into public.cities. Catching it here
      // turns a raw 23503 into a sentence, and stops a typo being saved as a
      // city that does not exist.
      if (payload.hometown && window.TgbCities) {
        const known = window.TgbCities.all().some((c) => c.city === payload.hometown);
        if (!known) {
          formStatus('"' + payload.hometown + '" is not in the city catalogue — pick one from the list.', true);
          return;
        }
      }
      state.busy = true;
      formStatus('Saving...');
      try {
        await ensureFreshSession();
        const editing = state.editingId != null;
        const res = await fetch(
          restUrl('guides', editing ? { id: 'eq.' + state.editingId } : {}),
          {
            method: editing ? 'PATCH' : 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify(payload)
          });
        if (!res.ok) throw new Error(await readError(res, 'Could not save this guide.'));
        const [fresh] = await res.json();
        if (editing) {
          const i = state.guides.findIndex((g) => String(g.id) === String(state.editingId));
          if (i > -1) state.guides[i] = fresh;
        } else {
          state.guides.push(fresh);
        }
        state.guides.sort((a, b) => cleanText(a.name).localeCompare(cleanText(b.name)));
        closeForm();
        render();
        setStatus((editing ? 'Saved ' : 'Added ') + cleanText(fresh.name) + '.', 'success');
      } catch (error) {
        // The name index is the one a person actually trips over.
        const raw = error.message || '';
        formStatus(/guides_name_key|duplicate key/i.test(raw)
          ? 'There is already a guide with that name — a character is meant to be singular.'
          : (raw || 'Save failed.'), true);
      } finally {
        state.busy = false;
      }
    }

    // --- delete ---------------------------------------------------------------

    let confirmResolve = null;
    // destructive paints the affirmative button red-filled instead of blue.
    // The blue primary is the same button this room uses for Save, and on the
    // one dialog you cannot take back, the button that agrees should not look
    // like the button you press all day.
    function ask(title, text, yesLabel, destructive) {
      el('confirmTitle').textContent = title;
      el('confirmText').textContent = text;
      el('confirmYes').textContent = yesLabel || 'Yes';
      el('confirmYes').classList.toggle('danger-solid', !!destructive);
      el('confirmCard').hidden = false;
      el('confirmBackdrop').hidden = false;
      return new Promise((resolve) => { confirmResolve = resolve; });
    }
    function closeAsk(answer) {
      el('confirmCard').hidden = true;
      el('confirmBackdrop').hidden = true;
      if (confirmResolve) { confirmResolve(answer); confirmResolve = null; }
    }

    // DELETE IS REAL, IT IS THE ONLY WAY OUT, AND IT REACHES FURTHER THAN THIS
    // ROOM. games.guide_id is ON DELETE SET NULL, so removing a guide leaves
    // every game that used it with no guide at all - and this page cannot show
    // how many that is, by design. Archive used to be the reversible
    // alternative the confirmation offered; with the flag dropped there is no
    // longer one, so the wording says exactly that instead of implying a
    // gentler option that no longer exists.
    async function deleteGuide(id) {
      const guide = findGuide(id);
      if (!guide) return;
      const ok = await ask('Delete ' + (cleanText(guide.name) || 'this guide') + '?',
        'This cannot be undone, and there is no archive to fall back on. '
        + 'Any game using this guide is left without one.', 'Delete', true);
      if (!ok) return;
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'DELETE',
          headers: authHeaders({ Prefer: 'return=minimal' })
        });
        if (!res.ok) throw new Error(await readError(res, 'Could not delete this guide.'));
        state.guides = state.guides.filter((g) => String(g.id) !== String(id));
        render();
        setStatus('Deleted ' + (cleanText(guide.name) || '#' + id) + '.', 'success');
      } catch (error) {
        setStatus(error.message || 'Delete failed.', 'error');
      }
    }

    // --- the portrait ---------------------------------------------------------
    // Two upload paths, and the split is CORS rather than preference. A local
    // file goes straight from the browser to Supabase Storage on the admin's
    // token; a remote URL cannot be fetched by the browser at all, so the
    // upload-guide-image Edge Function fetches it server-side. Both land in the
    // guides bucket and write the same public URL back.
    //
    // KEYED BY GUIDE ID - guide-<id>.<ext>. The old scheme named the file after
    // the GAME, which is why one character could end up with eight portraits.

    function uploadStatus(node, message, isError) {
      if (!node) return;
      node.textContent = message || '';
      node.classList.toggle('is-error', !!isError);
    }


    // Downscale to a square-ish portrait and re-encode as JPEG. This is what
    // makes storing the picture IN THE ROW workable: the four portraits that
    // existed when this was written were 0.7-2.4 MB each, and 34 of those
    // base64'd would be a ~100 MB page load to draw cards 132 pixels wide.
    // At 512 px a portrait lands around 60-90 KB, so the whole table is ~3 MB.
    //
    // Transparency is lost to the JPEG, deliberately: a guide portrait is a
    // photograph or a painting, it sits on an opaque card, and PNG at this size
    // is three or four times the bytes for a transparency nothing uses.
    const PORTRAIT_MAX_PX = 512;
    const PORTRAIT_QUALITY = 0.82;

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Could not read that file.'));
        reader.readAsDataURL(file);
      });
    }

    function downscaleToDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, PORTRAIT_MAX_PX / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          // A JPEG has no alpha, so anything transparent would come out black
          // without this. White matches the card.
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', PORTRAIT_QUALITY)); }
          catch (error) { reject(new Error('Could not re-encode that image.')); }
        };
        img.onerror = () => reject(new Error('That file is not an image the browser can read.'));
        img.src = dataUrl;
      });
    }

    async function uploadImageFile(id, file, btn, status) {
      const token = adminToken();
      if (!token) { uploadStatus(status, 'Sign in as an admin to upload.', true); return; }
      if (!/^image\//i.test(file.type || '')) { uploadStatus(status, 'Choose an image file.', true); return; }
      // The ceiling the Edge Function enforces, checked here so a pointless
      // 40 MB upload fails at once rather than at the far end.
      if (file.size > 15 * 1024 * 1024) { uploadStatus(status, 'Larger than 15 MB.', true); return; }
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      uploadStatus(status, 'Resizing...');
      try {
        // 1. Into the ROW, downscaled. This is the portrait the Green Room
        //    draws, and the one that cannot go missing.
        const inline = await downscaleToDataUrl(await fileToDataUrl(file));
        const kb = Math.round(inline.length / 1024);
        if (inline.length > 262144) throw new Error('Still ' + kb + ' KB after resizing — try a smaller image.');
        uploadStatus(status, 'Saving ' + kb + ' KB...');
        await ensureFreshSession();
        const patch = await fetch(restUrl('guides', { id: 'eq.' + id }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ image: inline })
        });
        if (!patch.ok) throw new Error(await readError(patch, 'Could not save the portrait.'));
        const [saved] = await patch.json();
        const guide = findGuide(id);
        if (guide) Object.assign(guide, saved);
        render();
        // The portrait is the one thing on this card that writes itself the
        // moment you choose a file, with no Save to press - so it says so in
        // the slot that answers that question for everything else, naming
        // what was written so it cannot be read as "the boxes are saved".
        flashSaved(id, 'image saved');
        uploadStatus(status, 'Saved ' + kb + ' KB into the row');

        // THE STORAGE COPY IS GONE with image_url (2026-08-09). Uploading
        // used to write twice: the row for this page, and a Storage object
        // whose URL the trigger pushed to the engines. With no URL column
        // there is nothing to point at that object, so writing it would
        // leave a file in a bucket that nothing on earth references.
      } catch (error) {
        uploadStatus(status, String((error && error.message) || 'Upload failed.'), true);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }



    // --- the prompts ----------------------------------------------------------

    // kind is the mono eyebrow over the title — which of the two prompts this
    // is. title is what it is about.
    function openPrompt(kind, title, help, text) {
      el('promptKind').textContent = kind;
      el('promptTitle').textContent = title;
      el('promptHelp').textContent = help || '';
      el('promptText').value = text;
      resetCopyButton();
      el('promptCard').hidden = false;
      el('promptBackdrop').hidden = false;
      el('promptText').focus();
      el('promptText').setSelectionRange(0, 0);
      el('promptText').scrollTop = 0;
    }

    function closePrompt() {
      el('promptCard').hidden = true;
      el('promptBackdrop').hidden = true;
    }

    let copyResetTimer = null;
    function resetCopyButton() {
      clearTimeout(copyResetTimer);
      copyResetTimer = null;
      el('copyPromptBtn').classList.remove('is-done');
      el('copyPromptLabel').textContent = 'Copy prompt';
      el('copyStatus').textContent = '';
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; }
      catch (error) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (err) { return false; }
      }
    }

    let promptFor = null;   // the guide the open prompt is about, or null for a new one

    function showGuidePrompt(id) {
      const guide = id == null ? null : findGuide(id);
      promptFor = guide;
      // The notes box only earns its place on a prompt with nothing to go on.
      // Asked about an existing guide, the brief already carries its name,
      // hometown, bio and background - a second place to say the same thing
      // would just be somewhere for the two to disagree.
      el('promptControls').hidden = !!guide;
      el('sqlEditorLink').hidden = false;   // the brief's answer IS SQL
      paintPromptCount();
      // Nothing to avoid on an empty catalogue, and a switch that changes
      // nothing is a switch you have to think about for no reason.
      el('promptAvoidWrap').hidden = !guideRosterLines(null).length;
      el('promptAvoidHometowns').checked = !!state.promptAvoidHometowns;
      el('promptDrawImages').checked = !!state.promptDrawImages;
      if (guide) {
        openPrompt('Guide brief',
          cleanText(guide.name) || 'Guide #' + guide.id,
          'Paste this into any AI. It answers with an UPDATE for this row — run it in the Supabase SQL editor, then reload this page.',
          buildGuidePrompt(guide));
      } else {
        openPrompt('Guide brief — new characters',
          newPromptTitle(), newPromptHelp(), buildGuidePrompt(null));
      }
    }

    // The head has to move with HOW MANY, or the sheet says ten and the title
    // still says one.
    function newPromptTitle() {
      return promptCount() === 1
        ? 'A guide who does not exist yet'
        : promptCount() + ' guides who do not exist yet';
    }

    function newPromptHelp() {
      const tail = 'Paste it into any AI: it answers with one INSERT'
        + (promptCount() === 1 ? '' : ' carrying all ' + promptCount() + ' guides')
        + ' — run that in the Supabase SQL editor, then reload this page.'
        // The order matters and is easy to get wrong: the cards do not exist
        // until the SQL has run, so a portrait made first has nowhere to go.
        // No warning about which AI can draw — the buttons in the foot are all
        // ones that can, which is why Claude is not among them.
        + (state.promptDrawImages
            ? ' The portraits come after it — run the SQL first, reload, then upload each one to its new card.'
            : '');
      // Said out loud because it is the one thing in the brief nobody typed —
      // otherwise the roster is a surprise found while scrolling the sheet.
      // Counted off the guides, not off the lines: past the cap the list ends
      // with an "(and N more)" line, which is not a guide.
      const n = state.guides.filter((g) => cleanText((drafts.get(String(g.id)) || g).name)).length;
      const known = n
        ? ' The ' + n + ' guides you already have go in as a do-not-repeat list'
          + (state.promptAvoidHometowns ? ', their hometowns included.' : ' — names only.')
        : '';
      return 'Say what you know in Notes — hometown, fandom, the voice you want — and it folds into the brief as you type.'
        + known + ' ' + tail;
    }

    // 1, 5 or 10. Anything else in state - there is no way to get one through
    // the buttons, but a stale value would silently change the brief - falls
    // back to one guide.
    const PROMPT_COUNTS = [1, 5, 10];
    function promptCount() {
      return PROMPT_COUNTS.indexOf(state.promptCount) === -1 ? 1 : state.promptCount;
    }

    function setPromptCount(n) {
      state.promptCount = PROMPT_COUNTS.indexOf(n) === -1 ? 1 : n;
      paintPromptCount();
      refreshNewGuidePrompt();
    }

    function paintPromptCount() {
      document.querySelectorAll('#promptControls .seg-btn').forEach((b) => {
        b.classList.toggle('is-on', Number(b.dataset.count) === promptCount());
        b.setAttribute('aria-pressed', String(Number(b.dataset.count) === promptCount()));
      });
    }

    function refreshNewGuidePrompt() {
      if (promptFor) return;
      el('promptTitle').textContent = newPromptTitle();
      el('promptHelp').textContent = newPromptHelp();
      el('promptText').value = buildGuidePrompt(null);
      // The note is the first thing in the rebuilt text, so hold the sheet at
      // the top - typing must not leave it looking at line 40.
      el('promptText').scrollTop = 0;
      resetCopyButton();   // what was copied a moment ago is no longer this text
    }

    // READS THE BOXES, NOT THE SAVED ROW. It used to take the guide straight
    // from state, so a background typed and not yet saved was ignored - you
    // wrote the character, pressed Image Prompt, and got a prompt describing
    // the empty row you started from, with nothing on screen to say why. The
    // draft is what the person is looking at, so the draft is what the prompt
    // describes; Save is for the database, not for this.
    function showImagePrompt(id) {
      const guide = findGuide(id);
      if (!guide) return;
      const draft = draftOf(guide);
      // NO CONTROLS ON THIS ONE. HOW MANY and NOTES belong to the brief that
      // invents characters: this prompt draws ONE portrait of ONE guide who
      // already exists, from the fields on the card. Ten of them is not a
      // thing, and a note telling the AI what the guide is like is a note that
      // can disagree with the boxes six inches above it. They were only ever
      // shown here because the dialog is shared, and openPrompt inherited
      // whatever the last caller left on screen.
      el('promptControls').hidden = true;
      // And no SQL editor in the foot: this prompt's answer is a picture,
      // which comes back through Upload Image on the card.
      el('sqlEditorLink').hidden = true;
      const thin = !cleanText(draft.bio) && !cleanText(draft.background);
      openPrompt('Portrait prompt — cartoon, never photoreal',
        cleanText(draft.name) || 'Guide #' + guide.id,
        thin
          // Worth saying rather than letting a generic portrait come back and
          // look like the prompt's fault: with no bio and no background there
          // is little to draw from but the name.
          ? (cleanText(draft.hometown)
              ? 'This guide has no bio and no background yet, so the prompt is working from the name and ' + cleanText(draft.hometown) + ' alone. Write something first, or use it as a starting point.'
              : 'This guide has no bio, background or hometown yet, so the prompt has only the name to go on and the portrait will be generic. Write something first, or use it as a starting point.')
          : 'Every field on the card as it stands, saved or not — the hometown does most of the work. Paste it into an image generator, then bring the result back with Upload Image.',
        window.TgbPicmakerPrompts.buildGuideImagePrompt({
          guideName: draft.name,
          guideHometown: draft.hometown,
          guideBio: draft.bio,
          guideBackground: draft.background
        }));
    }

    // EVERY GUIDE WITH NO PICTURE, in the order the room is showing them, so
    // the numbered list in the prompt matches the wall of cards you are
    // looking at. Reads the SAVED image and the DRAFT text: the portrait is
    // only ever written by Upload Image, but a background typed and not yet
    // saved is what the person means the picture to be of.
    function guidesMissingArt() {
      return visibleGuides().filter((g) => !cleanText(g.image)).map((g) => {
        const d = drafts.get(String(g.id)) || g;
        return {
          guideName: cleanText(d.name) || 'Guide #' + g.id,
          guideHometown: cleanText(d.hometown),
          guideBio: cleanText(d.bio),
          guideBackground: cleanText(d.background)
        };
      });
    }

    function showMissingArtPrompt() {
      const missing = guidesMissingArt();
      if (!missing.length) return;
      // Same two suppressions as the single portrait prompt: HOW MANY and
      // NOTES belong to inventing characters, and the answer here is pictures
      // rather than SQL.
      el('promptControls').hidden = true;
      el('sqlEditorLink').hidden = true;
      const n = missing.length;
      const noText = missing.filter((g) => !g.guideBio && !g.guideBackground).length;
      openPrompt('Portrait prompts — every guide with no picture',
        n === 1 ? 'One guide is missing a portrait' : n + ' guides are missing portraits',
        'One prompt, ' + n + ' portrait' + (n === 1 ? '' : 's')
          + ' — the look rules are stated once and every character listed under them.'
          // Said up front, because a thin character comes back generic and
          // that looks like the prompt's fault rather than an empty row.
          + (noText ? ' ' + noText + ' of them have nothing written down yet and will come back generic.' : '')
          + ' Bring each result back with Upload Image on its card.',
        window.TgbPicmakerPrompts.buildGuideImageBatchPrompt(missing));
    }

    // Paints the count onto the button, and takes the whole panel away when
    // there is nothing left to draw.
    function paintMissingArt() {
      const bar = document.querySelector('.command-bar--portraits');
      const n = guidesMissingArt().length;
      if (bar) bar.hidden = !n;
      el('missingArtBtn').textContent = n ? 'MISSING (' + n + ')' : 'MISSING';
    }

    // THE ROSTER IS A DO-NOT-REPEAT LIST AND NOTHING ELSE. It is in the brief
    // so an AI inventing a character does not hand back one we already have -
    // ask ten times for a narrator and you will be offered a warm retired
    // cabbie from Chicago most of those times. It is deliberately NOT sent as
    // a house style to match or a set to fill gaps in: these characters were
    // written at different times to different standards, and telling a model
    // to fit in with them is how a catalogue gets more of its own average.
    //
    // Reads the draft where one exists, so a rename typed and not yet saved
    // still counts as taken - the same rule the prompts already follow.
    // drafts.get rather than draftOf: this walks every guide, and draftOf
    // would mint a draft for each one as a side effect.
    // A cap, because the brief has to stay readable and a roster is the one
    // part of it that grows without limit. The tail is counted rather than
    // dropped silently.
    const ROSTER_MAX = 60;

    // The one-line sketch of a guide, for the grouped roster. A name alone
    // tells an AI not to reuse it; deciding whether a NEW person from the same
    // town is genuinely a different person takes knowing who the old one is.
    function rosterSketch(d) {
      const text = cleanText(d.bio) || cleanText(d.background);
      if (!text) return '';
      const flat = text.replace(/\s+/g, ' ');
      if (flat.length <= 150) return flat;
      // Cut at a word, not mid-syllable — a sketch is read, not parsed.
      const cut = flat.slice(0, 150);
      return cut.slice(0, cut.lastIndexOf(' ') > 60 ? cut.lastIndexOf(' ') : 150) + '...';
    }

    function rosterEntries(exceptId) {
      return state.guides
        .filter((g) => String(g.id) !== String(exceptId))
        .map((g) => {
          const d = drafts.get(String(g.id)) || g;
          return { name: cleanText(d.name), hometown: cleanText(d.hometown), sketch: rosterSketch(d) };
        })
        .filter((e) => e.name)
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    // FLAT LIST, for when hometowns are off-limits anyway: the only question
    // the AI has to answer is "is this name taken", and a name is enough.
    function guideRosterLines(exceptId) {
      const named = rosterEntries(exceptId)
        .map((e) => (e.hometown ? e.name + ' - ' + e.hometown : e.name));
      return named.length <= ROSTER_MAX
        ? named
        : named.slice(0, ROSTER_MAX).concat(['(and ' + (named.length - ROSTER_MAX) + ' more)']);
    }

    // GROUPED BY TOWN, for when a repeat hometown is allowed. Then the
    // question changes from "is this name taken" to "is this ALREADY THE
    // PERSON WE HAVE FROM THERE", which a bare list of names cannot answer -
    // and the failure it guards against is the specific one: told Chicago is
    // free, a model hands back a second warm retired Chicago cabbie, because
    // that is what it hands back every time. Grouping puts the town's existing
    // characters next to each other, where a repeat is obvious.
    function guideRosterByTown(exceptId) {
      const entries = rosterEntries(exceptId);
      const towns = new Map();
      entries.forEach((e) => {
        const key = e.hometown || '';
        if (!towns.has(key)) towns.set(key, []);
        towns.get(key).push(e);
      });
      const keys = Array.from(towns.keys()).sort((a, b) => {
        // The unplaced go last: they carry no hometown to clash with, so they
        // are the least useful part of this list.
        if (!a) return 1;
        if (!b) return -1;
        return a.localeCompare(b);
      });
      const lines = [];
      let shown = 0;
      keys.forEach((key) => {
        if (shown >= ROSTER_MAX) return;
        lines.push('  * ' + (key || 'No hometown recorded'));
        towns.get(key).forEach((e) => {
          if (shown >= ROSTER_MAX) return;
          shown += 1;
          lines.push('    - ' + e.name + (e.sketch ? ': ' + e.sketch : ''));
        });
      });
      if (entries.length > shown) lines.push('  (and ' + (entries.length - shown) + ' more)');
      return lines;
    }

    // The guide brief. It carries the character's own hometown rather than any
    // game's city - this room holds no game information, and the hometown is
    // the thing a human actually chose for this character.
    function buildGuidePrompt(guide) {
      const lines = [];
      // NOTES GO AT THE TOP, and that is a visibility fix as much as an
      // editorial one. They used to sit under THE GUIDE YOU ARE WRITING, forty
      // lines down a sheet that opens scrolled to the top - so you typed into
      // the box and nothing on screen moved, and the only way to know the
      // note had landed was to scroll the prompt you were about to copy. At
      // the head it appears as you type. It also reads right: this is the one
      // thing in the brief the human actually asserted, so it outranks
      // everything the AI is about to invent below it.
      const notes = guide ? '' : cleanText(state.promptNotes);
      // A prompt about a guide already on a card is about THAT guide, so the
      // count applies to the new-character prompt only.
      const count = guide ? 1 : promptCount();
      const many = count > 1;
      if (notes) {
        lines.push('WHAT I ALREADY KNOW ABOUT ' + (many ? 'THESE GUIDES' : 'THIS GUIDE')
          + ' - treat as fixed, do not contradict it'
          + (many ? ', and it holds for all ' + count : '') + ':');
        lines.push(notes);
        lines.push('');
      }
      // THE BRIEF DESCRIBES A PERSON, NOT A PRODUCT. It used to open with
      // what TGB makes, how a game is played, and a warning not to tie the
      // character to one matchup - all of which invited the AI to write a
      // tour host for a specific trip. A guide is used in many cities, so the
      // brief now asks only for someone from somewhere, with a voice and a
      // history. Where they happen to be guiding is not their business here.
      if (many) {
        lines.push('Invent ' + count + ' CHARACTERS: ' + count + ' distinct people, each with a hometown, a');
        lines.push('voice, and a life behind them. Each one is a GAME GUIDE - they direct one');
        lines.push('person at a time through our game, on foot, in a real city, speaking in their');
        lines.push('ear. Everything below applies to every one of them.');
        lines.push('');
        // The failure mode of asking for ten at once is ten dressings of one
        // person - same warmth, same cadence, a different job title. Worth
        // spelling out with a test the model can actually apply.
        lines.push('MAKE THEM DIFFERENT FROM ONE ANOTHER. Different hometowns, ages, trades and');
        lines.push('ways of speaking; do not run them all warm and folksy. If two of them could');
        lines.push('swap lines without anyone noticing, one of them is not written yet.');
      } else {
        lines.push('Invent a CHARACTER: a distinctive person with a hometown, a voice, and a life');
        lines.push('behind them. They are a GAME GUIDE - they direct one person at a time through');
        lines.push('our game, on foot, in a real city, speaking in their ear.');
      }
      lines.push('');
      lines.push('WHAT MATTERS');
      // THE TERM IS FIXED, THE SENTENCE IS NOT. Left to itself a model writes
      // "tour guide", "host", "docent" or "narrator", and each of those means
      // something slightly different to a player - a docent is in a museum, a
      // tour guide has a flag up. Naming the one term and then explicitly
      // freeing the sentence around it is what stops 39 bios all reading
      // "...and now works as a Game Guide."
      lines.push('- THEY ARE A GAME GUIDE, IN THOSE WORDS. Every bio must contain the term Game');
      lines.push('  Guide, capitalised, exactly so. Never "tour guide", "guide", "host",');
      lines.push('  "narrator", "docent" or "storyteller". Vary the SENTENCE, never the term:');
      lines.push('  "took up work as a Game Guide the spring the shop closed", "has been a Game');
      lines.push('  Guide since her ears went", "does Saturdays as a Game Guide". Do not open');
      lines.push('  the bio with it - it belongs after you have said who they are.');
      // The reason is the only part of a bio that is about the person rather
      // than about their old job, and it is what a player remembers. Without
      // this, every answer comes back "retired, and now guides", which is the
      // same character wearing a different trade.
      lines.push('- SAY WHY THEY ARE A GAME GUIDE NOW, and make it their own. A season that goes');
      lines.push('  quiet, a trade automated out from under them, a surgery, a buyout, a child');
      lines.push('  who took over the business, a bet, a habit they could not stop, too much');
      lines.push('  daylight or not enough. "They are retired" is not a reason - half of them');
      lines.push('  are retired. It should follow from the life you just gave them.');
      lines.push('- THE HOMETOWN IS THE ANCHOR. This person is FROM somewhere, and it shows: in');
      lines.push('  how they talk, what they compare things to, what they are proud and sick of.');
      lines.push('  Local detail beats a postcard - the street, the diner, the weather, the team,');
      lines.push('  the thing outsiders always get wrong about the place.');
      lines.push('- THEY WILL NOT ALWAYS BE AT HOME. The same character is used in many different');
      lines.push('  cities, so never write them as belonging to the place they are currently in,');
      lines.push('  and never mention a particular city they are visiting, a rival, an opponent,');
      lines.push('  a trip or an occasion. They carry home with them; that is the whole appeal.');
      lines.push('- GIVE THEM ODD, SPECIFIC FACTS. A trade they used to have, a superstition, a');
      lines.push('  grudge, something they collect, a thing they always say. Small and concrete');
      lines.push('  beats grand and vague; two or three real details outlast a paragraph of');
      lines.push('  adjectives.');
      lines.push('- A REAL PERSON MAY INSPIRE THEM, but the character and everything around them');
      lines.push('  is invented. Do not write a living person as themselves.');
      lines.push('- Keep it warm and worth listening to. This is somebody a stranger is choosing');
      lines.push('  to spend an hour with.');
      lines.push('');
      // TWO SHAPES OF ROSTER, chosen by whether a town can be reused. Banned
      // hometowns need only names; allowed ones need to show WHO we already
      // have from each town, or "different from what you have" is an
      // instruction with nothing behind it.
      const townsAllowed = !guide && !state.promptAvoidHometowns;
      const roster = townsAllowed
        ? guideRosterByTown(guide ? guide.id : null)
        : guideRosterLines(guide ? guide.id : null).map((line) => '  * ' + line);
      if (roster.length) {
        lines.push('GUIDES WE ALREADY HAVE - a DO-NOT-REPEAT list, and nothing else. Do not copy');
        lines.push('their style, do not write a companion to one, do not treat them as a house');
        lines.push('voice to match:');
        lines.push('- Do not reuse one of these names.');
        lines.push('- Do not hand back one of these characters under a new name - a different');
        lines.push('  trade in the same city with the same manner is the same guide.');
        // The hometown rule is the switch, and off it does NOT go quiet: a
        // repeat town is exactly where a model reaches for the character it
        // already offered you, so the permission comes with the test it has to
        // pass. "Prefer somewhere else" left on permanently was the wrong fix -
        // some cities plainly have room for two - but so is silence.
        if (!guide && state.promptAvoidHometowns) {
          lines.push('- DO NOT USE ANY HOMETOWN ON THIS LIST. Pick somewhere we do not have yet.');
        } else if (townsAllowed) {
          lines.push('- A HOMETOWN ON THIS LIST MAY BE USED AGAIN, but only if the new person could');
          lines.push('  never be mistaken for the one we already have from that town. Read what we');
          lines.push('  hold from there - it is listed under each town below - and make the new one');
          lines.push('  differ in the VITAL STATS AND THE HISTORY:');
          lines.push('    * generation - not the same decade of birth, not the same era they came up in');
          lines.push('    * sex, and the life that went with it in that place at that time');
          lines.push('    * trade and class - not another version of the same working life');
          lines.push('    * how they speak - register, pace, what they are funny about');
          lines.push('    * what the town did TO them - the same city read from a different side of it');
          lines.push('  A second guide from a town should feel like meeting somebody else who happens');
          lines.push('  to be from there, never like the first one with a new job.');
        }
        if (many) {
          lines.push('- Do not repeat a hometown within your own ' + count + ' either.');
        }
        roster.forEach((line) => lines.push(line));
        lines.push('');
      }
      if (guide) {
        // The DRAFT, for the same reason the image prompt reads it: what is
        // in the boxes is what the person is looking at. Only the main
        // PROMPT button reaches this today and it passes null - but a
        // per-guide prompt reading a stale row is the bug this already was.
        const src = draftOf(guide);
        const name = cleanText(src.name);
        const isPlaceholder = name.replace(/\s+/g, ' ').toLowerCase() === 'mission control';
        lines.push('THE GUIDE YOU ARE WRITING');
        lines.push('- Row id: ' + guide.id + '  (the UPDATE below must carry this id)');
        if (name && !isPlaceholder) {
          lines.push('- Name: ' + name);
          lines.push('  KEEP THIS NAME EXACTLY. Do not rename or invent one, and do not put the');
          lines.push('  name inside the bio.');
        } else {
          lines.push('- Name: not settled yet. Invent one that suits the hometown below.');
        }
        if (cleanText(src.hometown)) lines.push('- Hometown (the character is FROM here): ' + cleanText(src.hometown));
        if (cleanText(src.bio)) lines.push('- Current bio (refine or replace): ' + cleanText(src.bio));
        if (cleanText(src.background)) lines.push('- Current background (refine or replace): ' + cleanText(src.background));
      } else {
        lines.push(many ? 'THE GUIDES YOU ARE WRITING' : 'THE GUIDE YOU ARE WRITING');
        lines.push(many
          ? '- ' + count + ' new characters. Invent every name, and say where each one is from.'
          : '- A new character. Invent the name, and say where it is from.');
        // The note itself is verbatim at the top of the brief; this is the
        // line that binds it, so the AI is not left to guess whether the
        // opening block was context or instruction.
        if (notes) lines.push('- Build them around what I already know, at the top of this brief.');
      }
      lines.push('');
      lines.push(...deliverSqlLines(guide, count));
      return lines.join('\n');
    }

    // THE DELIVERABLE IS SQL, and the reason is the same one that killed the
    // research-page pattern across this repo: a prompt whose output is prose
    // is a prompt whose output has to be retyped. Three labelled paragraphs
    // meant reading a background out of a chat window and into a textarea,
    // once per guide - which is fine for one and absurd for ten.
    //
    // It is written for a chat AI with no key and no session, exactly like the
    // Socializer's PROMPT button: the deliverable is a statement a human runs
    // in the Supabase SQL editor. Do not "improve" this into an RPC call.
    //
    // Three things in the boilerplate are load-bearing, and the prompt says so
    // rather than hoping:
    //
    //   * DOLLAR QUOTES. A bio is prose and prose has apostrophes; a single
    //     unescaped one in "don't" breaks the whole paste. $g$...$g$ needs no
    //     escaping at all, which is a rule a model can follow every time.
    //   * THE LEFT JOIN ON public.cities. guides.hometown is a foreign key to
    //     cities.city, so an invented or differently-spelled city fails the
    //     entire insert - all ten guides lost to one wrong comma. Joining
    //     instead lands a null there and keeps the other nine, the same trade
    //     the waypoint importer makes with walk_order: a small loss beats a
    //     failed paste.
    //   * NO id AND NO image. id is `generated always as identity` and refuses
    //     a supplied value; the portrait is a base64 data URI written by the
    //     uploader on the card, which no chat AI can produce.
    function deliverSqlLines(guide, count) {
      const out = [];
      const many = count > 1;
      out.push('DELIVER ONE ```sql BLOCK AND NOTHING ELSE - no preamble, no commentary, no');
      out.push('explanation after it. I paste it straight into the Supabase SQL editor.');
      out.push('');
      out.push('RULES FOR THE SQL, all of them:');
      out.push('- Wrap EVERY text value in dollar quotes - $g$like this$g$ - so apostrophes and');
      out.push('  quotation marks need no escaping. Never use single quotes around a value.');
      out.push('- No newlines inside a value. A background is one long paragraph on one line.');
      out.push('- Never set id, image, created_at or updated_at. The id is generated, and the');
      out.push('  portrait is uploaded separately.');
      out.push('- hometown must be the canonical city string - "Buffalo, New York", "Paris,');
      out.push('  France" - because it is a foreign key into our city catalogue. The lookup in');
      out.push('  the statement below quietly drops a city we do not hold rather than failing,');
      out.push('  so give your best answer rather than leaving it out.');
      out.push('- Reproduce the shape below EXACTLY, changing only the values.');
      out.push('');
      if (guide) {
        out.push('```sql');
        out.push('update public.guides set');
        out.push('  name       = $g$<what they are called>$g$,');
        out.push('  bio        = $g$<2-4 sentences, THIRD PERSON - never "I", never "you". Open on their trade or role, not their name. Say where they are from, that they are a Game Guide, and why they took that up when they did. Do not include the name, and do not name any city they might be visiting.>$g$,');
        out.push('  background = $g$<the full breakdown - appearance, personality, hometown and what it did to them, history, the odd specific facts, strengths and flaws, voice and tone, and two or three things they always say. Internal only.>$g$,');
        // coalesce, not a bare subselect: on an UPDATE an unknown city would
        // resolve to null and WIPE a hometown somebody had already chosen.
        // On the INSERT there is nothing to lose, so the join stands alone.
        out.push('  hometown   = coalesce((select c.city from public.cities c where c.city = $g$<canonical city>$g$), hometown),');
        out.push('  updated_at = now()');
        out.push('where id = ' + guide.id + ';');
        out.push('```');
        return out;
      }
      out.push('```sql');
      out.push('insert into public.guides (name, bio, background, hometown)');
      out.push('select v.name, v.bio, v.background, c.city');
      out.push('from (values');
      // One example row, then a placeholder for the rest - a model given the
      // first row in full copies its shape reliably, and spelling out all ten
      // would make the prompt longer than the answer.
      out.push('  ($g$<name>$g$, $g$<bio: 2-4 sentences, THIRD PERSON - never "I", never "you". Open on their trade or role, not their name. Say where they are from, that they are a Game Guide, and why they took that up when they did. Do not include the name, and do not name any city they might be visiting.>$g$, $g$<background: the full breakdown - appearance, personality, hometown and what it did to them, history, the odd specific facts, strengths and flaws, voice and tone, and two or three things they always say. Internal only.>$g$, $g$<canonical city>$g$)'
        + (many ? ',' : ''));
      if (many) {
        out.push('  -- ' + (count - 1) + ' more rows in exactly this shape, comma-separated, last one');
        out.push('  -- with no trailing comma. ' + count + ' rows in total.');
      }
      out.push(') as v(name, bio, background, hometown)');
      out.push('left join public.cities c on c.city = v.hometown');
      // (the tail of the statement is pushed below, then the optional
      // portrait half of the errand)
      // Re-paste safety, and the only thing standing between a second click of
      // Run and a duplicate roster. Names are not unique in the table.
      out.push('where not exists (select 1 from public.guides g where lower(g.name) = lower(v.name))');
      out.push('returning id, name, hometown;');
      out.push('```');
      if (state.promptDrawImages) out.push(...drawPortraitLines(count));
      return out;
    }

    // THE PORTRAITS, IN THE SAME BREATH. The AI has just invented these people
    // - it knows the coat, the weather and the trade better than a second
    // prompt pasted an hour later ever will, because that one only gets the
    // three sentences that survived into the row.
    //
    // TEXT FIRST, PICTURES SECOND, and the prompt insists on it. Image
    // generation is where these runs fall over: a model hits a content filter,
    // times out, or stops after three to ask whether to keep going. If the SQL
    // is already complete above that point, the guides are saved and the
    // portraits can be redone from the Green Room with MISSING. Ask for them
    // in the other order and a failed render costs you the characters too.
    //
    // The look rules come from picmaker/prompts.js, the same copy the portrait
    // prompts use, rather than a second wording of them here.
    function drawPortraitLines(count) {
      const out = [];
      const many = count > 1;
      const them = many ? 'all ' + count + ' of them' : 'them';
      out.push('');
      out.push('THEN DRAW ' + (many ? 'THE ' + count + ' PORTRAITS' : 'THE PORTRAIT') + ' - after the SQL block, not before it.');
      out.push('Only once the SQL above is complete, draw ' + (many ? 'one image per guide' : 'the guide') + ', from the character');
      out.push('you just wrote - the hometown, the bio and the background are the brief.');
      out.push('');
      out.push('PORTRAIT DIRECTION' + (many ? ' - applies to every one of the ' + count : ''));
      (window.TgbPicmakerPrompts.guideImageDirectionLines(
        many ? 'Each character\'s hometown' : 'The character\'s hometown'
      ) || []).forEach((line) => out.push(line));
      if (many) {
        out.push('- Do not carry a face, an outfit or a palette from one character to the next. These are ' + count + ' unrelated people.');
        out.push('- ONE IMAGE PER GUIDE, in the order they appear in the SQL, each labelled with that guide\'s name. No contact sheet, no grid, no line-up, no two characters in one picture.');
        out.push('- If you can only make one image at a time, work down the list and keep going until ' + them + ' are done. Do not stop to ask whether to continue.');
      }
      out.push('');
      // The escape hatch, and the reason the SQL is first. Said plainly so a
      // model that cannot draw returns the useful half instead of refusing the
      // whole request or apologising in place of the statement.
      out.push('If you cannot generate images, still return the SQL block in full, then say so in');
      out.push('one line. The SQL is the part I cannot do without.');
      return out;
    }

    // --- the city list --------------------------------------------------------
    function fillCityList() {
      const list = el('cityList');
      if (!list || !window.TgbCities) return;
      window.TgbCities.load().then(() => {
        list.innerHTML = '';
        window.TgbCities.all().forEach((row) => {
          const o = document.createElement('option');
          o.value = row.city;
          list.appendChild(o);
        });
      }).catch(() => {});
    }

    // --- wiring ---------------------------------------------------------------

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading guides...');
        fillCityList();
        await refresh();
      },
      onSignedOut: () => {
        state.authed = false;
        state.guides = [];
        render();
        setStatus('Sign in with an admin account.');
      }
    });
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    el('manualBtn').addEventListener('click', () => openForm(null));
    el('promptBtn').addEventListener('click', () => showGuidePrompt(null));
    el('missingArtBtn').addEventListener('click', showMissingArtPrompt);
    el('sortAzBtn').addEventListener('click', () => setSort('az'));
    el('sortNewBtn').addEventListener('click', () => setSort('newest'));
    el('promptNotes').addEventListener('input', (e) => {
      state.promptNotes = e.target.value;
      refreshNewGuidePrompt();
    });
    document.querySelectorAll('#promptControls .seg-btn').forEach((b) => {
      b.addEventListener('click', () => setPromptCount(Number(b.dataset.count)));
    });
    el('promptAvoidHometowns').addEventListener('change', (e) => {
      state.promptAvoidHometowns = e.target.checked;
      refreshNewGuidePrompt();
    });
    el('promptDrawImages').addEventListener('change', (e) => {
      state.promptDrawImages = e.target.checked;
      refreshNewGuidePrompt();
    });
    el('guideForm').addEventListener('submit', submitForm);
    document.querySelectorAll('[data-form-close]').forEach((b) => b.addEventListener('click', closeForm));
    el('formBackdrop').addEventListener('click', closeForm);
    el('confirmYes').addEventListener('click', () => closeAsk(true));
    el('confirmNo').addEventListener('click', () => closeAsk(false));
    el('confirmBackdrop').addEventListener('click', () => closeAsk(false));
    document.querySelectorAll('[data-prompt-close]').forEach((b) => b.addEventListener('click', closePrompt));
    el('promptBackdrop').addEventListener('click', closePrompt);
    // The button itself is the confirmation — a word appearing beside it is
    // easy to miss on a control you have just clicked. A failure still gets
    // words, because it needs to say what to do instead.
    el('copyPromptBtn').addEventListener('click', async () => {
      const ok = await copyText(el('promptText').value);
      clearTimeout(copyResetTimer);
      if (ok) {
        el('copyPromptBtn').classList.add('is-done');
        el('copyPromptLabel').textContent = 'Copied';
        el('copyStatus').textContent = '';
        copyResetTimer = setTimeout(resetCopyButton, 1800);
      } else {
        el('copyStatus').textContent = 'Select the text and copy it by hand';
        el('promptText').select();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!el('promptCard').hidden) closePrompt();
      else if (!el('confirmCard').hidden) closeAsk(false);
      else if (!el('formCard').hidden) closeForm();
    });

    // Paints the A-Z button as pressed before anything loads, so the panel
    // never sits there with neither option lit.
    setSort(state.sort);
    adminAuth.init();
  </script>
</body>
</html>
