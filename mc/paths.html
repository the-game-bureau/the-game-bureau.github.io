<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PATH BUILDER | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- No Leaflet TAG. There is a map, but 144 KB in the head to draw nothing is
       most of what made the Waypoints page slow to first paint, so ensureLeaflet()
       below injects it the first time a path actually has a point to show. A
       path of unlocated waypoints never downloads it at all. -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255, 255, 255, 0.92);
      --warn: rgba(190, 55, 55, 0.9);
      /* THE SOCIALIZER'S PALETTE. Copied, not approximated: mc/socials/index.html
         is the reference room and this is a copy of it, so when either one's
         chrome changes, change both. These three are what make a bar read as a
         defined panel rather than a faint box -- the state the Tape Room and the
         Stock Room were both in before their own passes. */
      --cut-panel-bg: #e4ecfa;
      --cut-panel-line: rgba(var(--bic-blue-rgb), 0.38);
      --control-line: rgba(var(--bic-blue-rgb), 0.3);
      --bic-red: #c23737;
      --success: #276740;
      --panel-soft: rgba(var(--bic-blue-rgb), 0.065);
    }

    body {
      margin: 0;
      background: var(--paper-base);
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app { max-width: 1180px; margin: 0 auto; padding: 0 18px 80px; }

    /* .page-head / .page-title / .page-sub are GONE. The header is the shared
       one from admin-shell.css -- .room-head, .room-title, .room-blurb,
       .room-scribble -- which is where four rooms' worth of drift was fixed.
       The one local rule is the tone override below: .status carries .error and
       .success classes from setStatus(), and the scribble is a red pen whatever
       the news is. */
    /* THE PEN IS RED WHATEVER THE NEWS IS. setStatus() puts .error or .success on
       this element, and both were repainting the scribble: at (0,2,0) they beat
       .room-scribble's (0,1,0) in admin-shell.css, so a saved-path notice came
       out in body ink and a failure in the page's warn colour. Neither is a pen.
       Weight still carries the difference. */
    .status.error,
    .status.success { color: var(--bic-red); }
    .status.error { font-weight: 700; }

    /* ── THE COMMAND BAR, copied from mc/socials/index.html ────────────────
       Removed earlier the same day when the last page-level bar moved onto the
       path panel, and brought straight back for the ADD bar -- copied out of
       the Socializer again rather than reconstructed, which is the standing
       rule for this vocabulary. When either room's chrome changes, change both.

       .command-bar centres itself and caps at the shell width, which is right
       for a room with one bar sitting alone; .bar-row is here so a second bar
       can share the line later without that rule fighting it. */
    .bar-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      margin: 0 0 16px;
    }
    .bar-row .command-bar { width: auto; max-width: none; margin: 0; }
    .bar-row .command-bar:first-child { flex: 0 0 auto; }
    .command-bar--open { flex: 0 0 auto; }
    .command-bar--open select { min-width: 12rem; }
    @media (max-width: 760px) {
      .bar-row { flex-wrap: wrap; }
      .bar-row .command-bar:first-child { flex: 1 1 100%; }
    }

    .command-bar {
      width: 100%;
      min-inline-size: 0;
      padding: 4px 12px 12px;
      background: var(--cut-panel-bg);
      border: 1px solid var(--cut-panel-line);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(var(--bic-blue-rgb), 0.12);
    }

    /* THE FOLDER TAB. The legend cuts the panel's top border, and the arch runs
       that border into the label and back out, so the cut-out reads as a tag
       clipped onto the frame rather than a gap in it.

       It is a PSEUDO-ELEMENT, not a border on the legend, because the two
       things wanted here are incompatible on one box: the word must sit centred
       ON the line (the legend's default position), and the tab's sides must
       stop AT that line. A bordered box whose bottom edge is the line cannot
       also have its text centred on it. So the outline is drawn over the half
       above the line only -- `inset: 0 0 50%`, since the legend's midpoint IS
       the line -- and the word's lower half hangs invisibly into the panel,
       which works because the tab fill and the panel are the same colour.

       isolation: isolate is load-bearing: the arch sits at z-index -1 to stay
       behind the text, and without a stacking context of its own it would drop
       behind the fieldset's background and vanish. */
    .command-bar > legend {
      float: none;
      width: auto;
      padding: 3px 10px;
      margin: 0 0 0 10px;
      position: relative;
      isolation: isolate;
      line-height: 1;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .command-bar > legend::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 50%;
      border: 1px solid var(--cut-panel-line);
      border-bottom: 0;
      /* 5px, not the panel's 10px: the arch is only half the legend tall, so a
         wider radius would curve the whole way across and read as a dome. */
      border-radius: 5px 5px 0 0;
      background: var(--cut-panel-bg);
    }

    .command-bar-inner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    /* Short of the buttons' full height on purpose: a rule as tall as what it
       divides reads as a border on both of them. align-self keeps it centred
       when the row wraps and the buttons are not all the same height. */
    .bar-sep {
      align-self: center;
      width: 1px;
      height: 20px;
      margin: 0 2px;
      background: var(--cut-panel-line);
    }
    .command-bar .btn { border-color: var(--control-line); }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 7px 13px;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { border-color: var(--ink); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.small { font-size: 0.72rem; padding: 5px 9px; }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.warn { color: var(--warn); }

    /* Still used by the smaller in-panel rows; the page's TOP bar is now a
       pair of .command-bar fieldsets above. */
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }

    /* Two columns: the path on the left, the city's unused waypoints on the
       right. Side by side because the whole job is moving rows between them. */
    /* WAYPOINTS LEFT, PATH RIGHT. You are moving places out of a catalogue and
       into a walk, so the source sits where reading starts and the destination
       where it ends; dragging then runs left to right like everything else that
       means "put this there". The path keeps the wider column because its rows
       carry an ordinal, a handle and three buttons. */
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
    @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

    .panel {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      box-shadow: 0 1px 0 var(--paper-shadow);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .panel-count { font-size: 0.78rem; color: var(--muted); }
    /* align-items:center, not the baseline the plain head uses: a row holding
       buttons has nothing sensible to sit them on a baseline with. The count is
       pushed off the title and the buttons take the right end. */
    /* The panel's own top edge: cut-panel ground so it reads as a control
       strip belonging to this panel, rounded to match its corners. */
    .panel-open {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--cut-panel-line);
      border-radius: 8px 8px 0 0;
      background: var(--cut-panel-bg);
    }
    .panel-open select { min-width: 0; }
    .panel-open select#pathSelect { flex: 1 1 180px; }
    .panel-open .btn, .panel-open select { border-color: var(--control-line); }

    .panel-head--acts { align-items: center; flex-wrap: wrap; }
    .panel-head--acts .panel-count { margin-right: auto; }
    .panel-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .panel-acts .btn { padding: 5px 10px; font-size: 0.76rem; }
    .panel-body { padding: 8px; min-height: 90px; }

    .stop {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      margin-bottom: 6px;
    }
    .stop:last-child { margin-bottom: 0; }
    /* Only the handle starts a drag. Making the whole row draggable makes the
       text impossible to select, which you want when copying an address. */
    /* The grab cursor is on the ROW, since the whole row is the grip. The handle
       is the visual affordance -- what tells you a row can be picked up -- so it
       is a little bolder than the text beside it. The address line keeps a text
       cursor, because pressing there selects rather than drags. */
    #poolList .stop, #pathStops .stop { cursor: grab; }
    #poolList .stop:active, #pathStops .stop:active { cursor: grabbing; }
    #poolList .stop .stop-meta, #pathStops .stop .stop-meta { cursor: text; }
    .stop-handle { color: var(--muted); font-size: 1rem; line-height: 1; user-select: none; }
    /* Spent, not gone. Quiet enough to read as done and solid enough to still
       be draggable -- a row at 0.4 looks disabled, and this one is not. */
    .stop--used { opacity: 0.62; }
    .stop--used .stop-name { font-weight: 500; }
    .stop-used-tag {
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stop-ord {
      min-width: 1.9em;
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .stop-main { flex: 1; min-width: 0; }
    .stop-name { font-weight: 600; font-size: 0.94rem; overflow-wrap: anywhere; }
    .stop-meta { font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere; }
    .stop-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .stop.is-dragging { opacity: 0.4; }
    /* Only while something is actually in the air: an outline drawn all the
       time is chrome, drawn during a drag it is an answer to "can I let go
       here?". min-height so an empty path is a target you can hit. */
    body.is-dragging-wp #pathStops { min-height: 96px; outline: 2px dashed var(--line); outline-offset: -6px; border-radius: 8px; }
    body.is-dragging-wp #pathStops.is-drop-zone { outline-color: var(--ink); background: rgba(45, 72, 128, 0.04); }
    /* A line where the row will land, rather than moving everything as you go.
       Reordering ten rows live is hard to aim at. */
    .stop.drop-before { box-shadow: 0 -3px 0 -1px var(--ink); }
    .stop.drop-after { box-shadow: 0 3px 0 -1px var(--ink); }

    .stop--start .stop-ord::after { content: ' \25B6'; color: var(--ink); }
    .stop--end .stop-ord::after { content: ' \25A0'; color: var(--ink); }

    .empty { padding: 16px 10px; color: var(--muted); font-size: 0.88rem; }

    select, input[type="text"], input[type="search"] {
      font: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 6px 8px;
      max-width: 100%;
    }
    label.inline { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .meta-field { display: grid; gap: 4px; }
    .meta-field input, .meta-field select { width: 100%; }

    /* One control now the three buttons beside it are gone. */
    .pool-filter { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .pool-filter input { flex: 1; }

    .hint { font-size: 0.78rem; color: var(--muted); padding: 0 14px 12px; }

    /* The map spans both columns: a walk is judged by its shape, and half a
       city's width is not enough to see one. */
    .map-panel { margin-bottom: 18px; }
    .map-head-tools { display: flex; align-items: center; gap: 12px; font-size: 0.78rem; color: var(--muted); }
    .map-head-tools label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    #pathMap { height: 380px; border-radius: 0 0 4px 4px; background: rgba(var(--bic-blue-rgb), 0.06); }
    #pathMap.is-empty { display: grid; place-items: center; height: 130px; }
    .map-note { padding: 8px 14px; font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); }
    .map-note.warn { color: var(--warn); }

    /* Numbered in PATH order, so the map reads the same as the list beside it. */
    .rb-pin-dot {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin: 1px;
      border-radius: 50%;
      background: var(--bic-blue);
      border: 2px solid #fff;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.66rem;
      font-weight: 700;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.35);
    }
    .rb-pin--start .rb-pin-dot { background: #2f6b3d; }
    .rb-pin--end .rb-pin-dot { background: var(--warn); }
    /* An unused waypoint is a candidate, not a stop: hollow, small, unnumbered. */
    .rb-pin--pool .rb-pin-dot {
      width: 12px;
      height: 12px;
      margin: 6px;
      background: #fff;
      border: 2px solid rgba(var(--bic-blue-rgb), 0.75);
    }
    .rb-pop-name { font-weight: 700; margin-bottom: 4px; }
    .rb-pop-meta { color: var(--muted); margin-bottom: 6px; }

    .dlg { position: fixed; inset: 0; z-index: 1100; display: none; place-items: center; padding: 24px; background: rgba(2, 6, 23, 0.55); }
    .dlg.is-open { display: grid; }
    .dlg-panel {
      width: min(100%, 440px);
      display: grid;
      gap: 14px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper-base);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.3);
    }
    .dlg-title { margin: 0; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .dlg-field { display: grid; gap: 5px; }
    .dlg-field input, .dlg-field select { width: 100%; }
    .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dlg-note { margin: 0; font-size: 0.76rem; color: var(--muted); }
    /* The city control is wrapped by city-picker.js, which hangs its + beside
       the field; without this the wrapper collapses and the select shrinks. */
    .dlg-field .tgb-city-wrap { display: flex; gap: 6px; align-items: center; }
    .dlg-field .tgb-city-wrap select { flex: 1; }

    .dlg-panel--wide { width: min(100%, 640px); max-height: calc(100vh - 48px); overflow: auto; }
    .dlg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .dlg-id { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .dlg-spacer { flex: 1; }
    .dlg-actions { flex-wrap: wrap; }

    .wp-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .wp-form .wp-field { display: grid; gap: 4px; min-width: 0; }
    .wp-form .wp-field--full { grid-column: 1 / -1; }
    .wp-form input, .wp-form textarea { width: 100%; font: inherit; font-size: 0.9rem; }
    .wp-form textarea {
      min-height: 92px;
      resize: vertical;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 6px 8px;
    }
    /* The same red the Waypoints page paints: a field a walking tour actually
       needs, left blank. You cannot path to a waypoint with no address, and
       one with no description gives a challenge writer nothing to build on. */
    .wp-form .is-error input, .wp-form .is-error textarea { border-color: var(--warn); }
    .wp-readonly {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 6px 0;
      overflow-wrap: anywhere;
    }
    .wp-hint { font-size: 0.72rem; color: var(--muted); }
    .dlg-note.busy { color: var(--ink); }

    .find-bar { display: flex; gap: 8px; }
    .find-bar input { flex: 1; }
    .find-list { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
    .find-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
    }
    .find-row-main { flex: 1; min-width: 0; }
    .find-row-name { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
    .find-row-sub { font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere; }
    /* A result we appear to hold already. Not blocked - one address is often
       several stops - but never silently offered as if it were new. */
    .find-row.is-dupe { border-color: var(--warn); }
    .find-row-dupe { font-size: 0.72rem; color: var(--warn); font-weight: 700; }

    .ai-prompt {
      width: 100%;
      min-height: 240px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px;
      resize: vertical;
    }
    .nightly-src { font-size: 0.76rem; color: var(--muted); }
    .nightly-src a { color: var(--ink); }
  </style>
  <link rel="stylesheet" href="/mc/js/admin-shell.css">
</head>
<body class="mc-auth-protected">
  <main class="app">
    <header class="admin-site-nav" data-admin-site-nav></header>

    <!-- THE SHARED HEADER, from mc/js/admin-shell.css. .room-head, .room-title
         and .room-blurb are defined there, not here, which is the whole point:
         they were written out separately in four rooms once and drifted into
         four different title sizes. -->
    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title">PATH BUILDER</h1>
        <!-- THE TAGLINE IS NOT A STATUS LINE. It is the standing description of
             the room, and a message that overwrote it would take the
             explanation away exactly when something had gone wrong. Notices go
             in the scribble beside it. -->
        <p class="room-blurb">Drag WAYPOINTS to make a PATH for each game.</p>
        <!-- #pageStatus KEEPS ITS ID, so every setStatus() call in this file
             still lands. What changed is where it sits and what it looks like:
             the red-pen margin note beside the room's name. -->
        <span class="status room-scribble" id="pageStatus" role="status" aria-live="polite"></span>
      </div>
    </div>

    <!-- TWO BARS ON ONE ROW, the Socializer's own shape: what you are working
         on, and what you can do to it. OPEN takes the space because its two
         pickers grow; THIS PATH is only as wide as its four buttons. -->
    <!-- WIREFRAME. Both buttons are placeholders: they are wired to say so
         rather than left inert, because an enabled button that does nothing
         reads as broken. What they will do is not decided yet.

         WORTH KNOWING BEFORE THEY ARE: this room already has both actions.
         "+ Waypoint" sits in the library's filter row and opens the waypoint
         editor as an unsaved draft; "New" sits in the path panel's own strip.
         If these two take over, those two go in the same commit -- two ways to
         make the same thing is how a room grows a second vocabulary. -->
    <div class="bar-row">
      <fieldset class="command-bar">
        <legend>ADD</legend>
        <div class="command-bar-inner">
          <!-- MANUAL, because the three buttons in this bar are three SOURCES
               of a waypoint and the difference between them is where the place
               comes from: typed in by hand, or found by the routine. -->
          <button class="btn" id="addWaypointBtn" type="button" title="Type a place in by hand">Waypoint Manual</button>
          <!-- WAYPOINT BOT, out of the library's filter row. It is a SOURCE of
               waypoints, like the two buttons beside it, and the filter row is
               for narrowing a list rather than growing it.
               Named for the routine that fills it, the way TGB GIFT SHOP BOT and
               TGB SOUNDTRACK BOT are named in their rooms: "Nightly" said when
               it runs, which is the least useful thing about it and has been
               wrong since the scout went twice daily. -->
          <button class="btn" id="nightlyBtn" type="button" title="What the scout routine found on its last run">Waypoint Bot</button>
          <!-- The bar holds two nouns. The rule says where one ends and the
               other begins, which four buttons in a row of identical chrome
               otherwise leave you to work out from the words. -->
          <span class="bar-sep" role="separator" aria-orientation="vertical"></span>
          <!-- THE REAL NEW-PATH ACTION, moved up from the path panel's own
               strip where it was called "New". It belongs here: this bar is
               where things are made, and a button that made a path while
               sitting inside the panel that shows one read as an action ON the
               open path rather than a way to start another. -->
          <button class="btn" id="addPathBtn" type="button" title="Start a new path by hand">Path Manual</button>
          <!-- PATH BOT. A placeholder like the Path button beside it: there is
               no routine writing paths yet. The NFL Tour Builder commits SQL to
               mc/supabase/tours/ for a human to run, which is the closest thing
               and is not this. Wired to say so rather than swallow the click. -->
          <button class="btn" id="pathBotBtn" type="button" title="Not wired yet">Path Bot</button>
        </div>
      </fieldset>
      <!-- ONE CONTROL, AND IT SETS THE WHOLE ROOM. The city decides which
           waypoints the library holds and which paths the picker offers, so it
           belongs at the top of the page rather than inside one of the two
           panels it governs. The path picker stays down on the path panel: that
           one chooses which of this city's paths you are editing, which is a
           smaller question and answered where the answer shows. -->
      <fieldset class="command-bar command-bar--open">
        <legend>OPEN</legend>
        <div class="command-bar-inner">
          <label class="inline" for="cityFilter">City</label>
          <select id="cityFilter"></select>
        </div>
      </fieldset>
    </div>

    <section class="panel map-panel">
      <div class="panel-head">
        <span class="panel-title" id="mapTitle">The walk</span>
        <span class="map-head-tools">
          <label><input type="checkbox" id="mapShowPool"> Show unused waypoints</label>
          <span class="panel-count" id="mapCount"></span>
        </span>
      </div>
      <div id="pathMap" class="is-empty"><span class="empty">Nothing to draw yet.</span></div>
      <p class="map-note" id="mapNote"></p>
    </section>

    <div class="cols">
      <section class="panel" id="poolPanel">
        <div class="panel-head">
          <span class="panel-title" id="poolTitle">WAYPOINT LIBRARY</span>
          <span class="panel-count" id="poolCount"></span>
        </div>
        <!-- No city control here. The path has a city; the pool is simply that
             city's other waypoints. Two city pickers on one screen let them
             disagree, and a pool showing Denver for a Miami path is a list of
             places you can add and never should. -->
        <div class="pool-filter">
          <input type="search" id="poolSearch" placeholder="Search waypoints">
        </div>
        <datalist id="pathCityList"></datalist>
        <div class="panel-body" id="poolList"></div>
      </section>
      <section class="panel" id="pathPanel">
        <!-- WHICH PATH, AND WHAT TO DO WITH IT, both on the panel that IS the
             path: the thing you choose sits with the thing that changes when
             you choose it. The CITY is not here -- it governs the library as
             well, so it sits in OPEN at the top of the room. -->
        <div class="panel-open">
          <label class="inline" for="pathSelect">Path</label>
          <select id="pathSelect"></select>
        </div>
        <!-- SAVE, SUGGEST ORDER AND DELETE LIVE ON THE PATH, not in the page's
             top bar. All three act on the list directly underneath them and on
             nothing else, and from the top of the page they read as page
             chrome - Delete especially, which sat a few pixels from New and
             deleted a different kind of thing.
             The count moves out with them: what a path's header has room to say
             is its name and what you can do to it. -->
        <div class="panel-head panel-head--acts">
          <span class="panel-title" id="pathPanelTitle">PATH</span>
          <span class="panel-count" id="pathCount"></span>
          <span class="panel-acts">

            <button class="btn" id="suggestOrderBtn" type="button" disabled title="Reorder the stops by geometry - shortest sensible walk">Suggest order</button>

          </span>

        <p class="hint">First stop is the start (&#9654;), last is the end (&#9632;).</p>
      </section>

    </div>
  </main>

  <!-- NIGHTLY: what the Waypoint Tour Scout committed this morning. Read-only

  <script src="/mc/js/admin-auth.js"></script>
  <script src="/mc/js/admin-shell.js"></script>
  <script src="/mc/js/admin-site-nav.js"></script>
  <script src="/mc/js/supabase-rest.js"></script>
  <!-- geo.js first: city-picker canonicalizes with it when it is present. -->
  <script src="/mc/assets/geo.js"></script>
  <script src="/mc/assets/city-picker.js"></script>
  <!-- The geocoding half of the Waypoints page, extracted so this one can do the
       same work while that page is folded in. Pure logic, no DOM. -->
  <script src="/mc/assets/waypoint-geo.js"></script>
  <!-- The five AI prompts. Their text is the product; see the file's header. -->
  <script src="/mc/assets/waypoint-prompts.js"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    // Trail vocabulary. The keys are constrained in the database by
    // paths_shape_known, so adding one here needs a migration - the five below
    // loop / out_and_back / point_to_point arrived with 2026080805.
    const SHAPES = [
      { key: 'loop', label: 'Loop',
        blurb: 'Ends where it began, without retracing the way out.' },
      { key: 'out_and_back', label: 'Out and back',
        blurb: 'Same two ends, different streets on the return leg.' },
      { key: 'point_to_point', label: 'Point to point (linear)',
        blurb: 'Starts at A, finishes at a completely different B. Needs transit, a shuttle or a car at the finish.' },
      { key: 'lollipop', label: 'Lollipop',
        blurb: 'A straight stick out to a circle, round it, then back down the same stick.' },
      { key: 'figure_eight', label: 'Figure eight',
        blurb: 'Two loops crossing at one central point - walkable as half the distance or the whole shape, with no repeated steps.' },
      { key: 'horseshoe', label: 'Horseshoe (open loop)',
        blurb: 'A wide U. The ends differ but sit close enough together to walk or ride between.' },
      { key: 'network', label: 'Network / grid',
        blurb: 'Interconnected segments walkers mix and match into their own distance on the fly.' }
    ];
    const shapeBlurb = (key) => (SHAPES.find((s) => s.key === key) || {}).blurb || '';

    const state = {
      authed: false,
      paths: [],        // public.paths
      stops: [],         // public.path_stops for the open path, in order
      pathStops: [],     // every path_stops row, tour_id only - for the picker
      waypoints: [],     // public.waypoints, every one
      pathId: '',
      cityFilter: '',    // '' = every city. Narrows the path picker only.
      dirty: false,      // the ORDER/membership differs from what is stored
      poolQuery: ''
    };

    const el = (id) => document.getElementById(id);
    const pageStatus = el('pageStatus');
    const cleanText = (v) => String(v == null ? '' : v).trim();

    function restUrl(table, params) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SUPABASE_CONFIG.url + '/');
      Object.entries(params || {}).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    function authHeaders(extra) {
      if (adminAuth && typeof adminAuth.authHeaders === 'function') return adminAuth.authHeaders(extra || {});
      const session = adminAuth && adminAuth.getSession ? adminAuth.getSession() : null;
      const token = (session && session.access_token) || SUPABASE_CONFIG.publishableKey;
      return Object.assign({
        apikey: SUPABASE_CONFIG.publishableKey,
        Authorization: 'Bearer ' + token,
        Accept: 'application/json'
      }, extra || {});
    }

    async function ensureFreshSession() {
      if (adminAuth && typeof adminAuth.ensureFreshSession === 'function') return adminAuth.ensureFreshSession();
    }

    let statusTimer = 0;
    function setStatus(text, kind) {
      if (!pageStatus) return;
      window.clearTimeout(statusTimer);
      pageStatus.textContent = text || '';
      pageStatus.classList.toggle('error', kind === 'error');
      pageStatus.classList.toggle('success', kind === 'success');
      if (text && kind !== 'error') statusTimer = window.setTimeout(() => setStatus(''), 3500);
    }

    async function readError(res) {
      const body = await res.text().catch(() => '');
      try {
        const j = JSON.parse(body);
        return j.message || j.hint || body || ('HTTP ' + res.status);
      } catch (_) { return body || ('HTTP ' + res.status); }
    }

    // TgbRest.fetchAll pages past PostgREST's 1000-row cap. waypoints is already
    // at 282 and the whole point of the pool is that it holds everything.
    async function fetchAll(table, params) {
      const url = restUrl(table, params);
      if (window.TgbRest && typeof window.TgbRest.fetchAll === 'function') {
        return window.TgbRest.fetchAll(url, authHeaders({ Accept: 'application/json' }));
      }
      const res = await fetch(url, { headers: authHeaders({ Accept: 'application/json' }) });
      if (!res.ok) throw new Error(await readError(res));
      return res.json();
    }

    // --- loading --------------------------------------------------------------

    async function loadAll() {
      // select=* on both, never a column list - naming a column PostgREST does
      // not have rejects the whole page load, the standing rule in this codebase.
      // path_stops WHOLE, not just the open path's. The city picker bolds the
      // cities that have a walk with real stops on it, which is a question about
      // every city rather than the one on screen. The table is a few dozen rows
      // of two ids and a number; loadStops still fetches the open path's own
      // list separately, because that one is edited and this one is only read.
      const [paths, waypoints, allStops] = await Promise.all([
        fetchAll('paths', { select: '*', order: 'tour_id.asc' }),
        fetchAll('waypoints', { select: '*', order: 'wpid.asc' }),
        fetchAll('path_stops', { select: 'tour_id', order: 'tour_id.asc' })
      ]);
      state.paths = Array.isArray(paths) ? paths : [];
      state.pathStops = Array.isArray(allStops) ? allStops : [];
      probeWaypointColumns(waypoints);
      state.waypoints = (Array.isArray(waypoints) ? waypoints : []).filter((w) => !w.archived);
      if (!state.pathId || !state.paths.some((r) => r.tour_id === state.pathId)) {
        state.pathId = pathFromUrl() || (state.paths[0] ? state.paths[0].tour_id : '');
      }
      // Open on the city of the path being shown, not on "every city" - the
      // picker should describe what is on screen the moment it appears.
      state.cityFilter = pathCity();
      await loadStops();
    }

    // Keeps the bolding honest after a save without another round trip: the
    // open path's stops are authoritative for its own tour_id. Called after a
    // save and after the open path's list loads.
    function syncPathStopsForOpenPath() {
      if (!state.pathId) return;
      state.pathStops = state.pathStops.filter((r) => String(r.tour_id) !== String(state.pathId));
      state.stops.forEach(() => state.pathStops.push({ tour_id: state.pathId }));
    }

    async function loadStops() {
      if (!state.pathId) { state.stops = []; state.dirty = false; renderAll(); return; }
      const rows = await fetchAll('path_stops', {
        select: '*', tour_id: 'eq.' + state.pathId, order: 'ord.asc'
      });
      state.stops = (Array.isArray(rows) ? rows : [])
        .map((r) => String(r.wpid))
        .filter((id) => state.waypoints.some((w) => String(w.wpid) === id));
      state.dirty = false;
      syncPathStopsForOpenPath();
      renderAll();
    }

    function pathFromUrl() {
      return cleanText(new URLSearchParams(location.search).get('path'));
    }

    function syncUrl() {
      const url = new URL(location.href);
      if (state.pathId) url.searchParams.set('path', state.pathId);
      else url.searchParams.delete('path');
      // replaceState: picking a path is a filter, not navigation. Stacking a
      // history entry per path would make Back useless for leaving the page.
      history.replaceState(null, '', url);
    }

    // THE TWO CATALOGUES DISAGREE, and this is the whole reason for this helper.
    // public.cities holds the canonical string, "Miami, Florida"; waypoints.city
    // holds the bare name, "Miami" - as do both paths already in the table. So
    // the city is PICKED from the catalogue (real, spelled right, one of ours)
    // and STORED bare, or the pool filter matches no waypoint and the path
    // reads differently from every other path in the table.
    function cityNameOf(value) {
      const raw = cleanText(value);
      if (!raw) return '';
      if (window.TgbGeo && typeof window.TgbGeo.parseGeo === 'function') {
        const parsed = window.TgbGeo.parseGeo(raw);
        if (parsed && parsed.cityName) return parsed.cityName;
      }
      return raw.split(',')[0].trim();
    }

    const wpById = (id) => state.waypoints.find((w) => String(w.wpid) === String(id));
    const currentPath = () => state.paths.find((r) => r.tour_id === state.pathId) || null;

    // The single source of the pool's city. Derived, never stored: there is one
    // city on this screen and it belongs to the path.
    function pathCity() {
      const path = currentPath();
      return path ? cityNameOf(path.city) : '';
    }

    // --- rendering ------------------------------------------------------------

    function renderAll() {
      renderCityFilter();
      renderPathSelect();
      renderMapTitle();
      renderMeta();
      renderStops();
      renderPool();
      el('saveBtn').disabled = !state.dirty || !state.pathId;
      el('deletePathBtn').disabled = !state.pathId;
      el('suggestOrderBtn').disabled = state.stops.length < 3;
      renderCounts();
      // Async, and deliberately not awaited: the list must not wait on a tile
      // server, and every call is guarded by mapState.token.
      renderMap();
    }

    // The map heads the page, so it carries the path's name rather than a
    // generic label - it is the one place the title is read rather than edited.
    // An untitled path falls back to its city, then to the id, which is never
    // blank: a nameless header reads as a broken panel.
    function renderMapTitle() {
      const path = currentPath();
      const name = path
        ? (cleanText(path.title) || cleanText(path.city) || path.tour_id)
        : 'The walk';
      el('mapTitle').textContent = name;
    }

    function renderCounts() {
      el('pathCount').textContent = state.stops.length
        ? state.stops.length + ' stop' + (state.stops.length === 1 ? '' : 's') + (state.dirty ? ' - unsaved' : '')
        : '';
    }

    // The cities that actually have paths - the picker's job is narrowing what
    // is there, so a city with nothing in it would be a dead end. A city with
    // no path yet is reached through NEW, which offers the whole catalogue.
    // EVERY CITY EITHER PANEL COULD SHOW SOMETHING FOR, which since this picker
    // started filling the library means cities with WAYPOINTS as well as cities
    // with paths. Listing only the latter made the first path in a city
    // impossible to start from here: the city was absent from the one control
    // that opens it, so its library could never be put on screen.
    function pathCities() {
      const cities = state.paths.map((r) => cityNameOf(r.city))
        .concat(state.waypoints.map((w) => cityNameOf(w.city)));
      return [...new Set(cities.filter(Boolean))].sort((a, b) => a.localeCompare(b));
    }

    // Cities holding a path that actually has a stop on it. A path with no
    // stops is a title and a shape, not a walk, so it does not count as having
    // been built -- which is the whole distinction the bold is drawing.
    //
    // state.stops is only ever the OPEN path's list, so this reads the loaded
    // path_stops rather than that: the answer has to cover every city in the
    // picker, not the one already on screen.
    function citiesWithPathStops() {
      const withStops = new Set(state.pathStops.map((r) => String(r.tour_id)));
      return new Set(state.paths
        .filter((r) => withStops.has(String(r.tour_id)))
        .map((r) => cityNameOf(r.city))
        .filter(Boolean));
    }

    function pathsInCity(city) {
      const want = cleanText(city).toLowerCase();
      if (!want) return state.paths.slice();
      return state.paths.filter((r) => cityNameOf(r.city).toLowerCase() === want);
    }

    function renderCityFilter() {
      const sel = el('cityFilter');
      sel.innerHTML = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = 'Every city';
      sel.appendChild(all);
      // BOLD MEANS SOMEBODY HAS ALREADY BUILT HERE. The list is now every city
      // with a path OR a waypoint, so most entries are places with a catalogue
      // and no walk yet -- and the useful thing to see at a glance is which few
      // have a walk with real stops on it. Plain means "a library, nothing built
      // from it".
      const started = citiesWithPathStops();
      pathCities().forEach((c) => {
        const o = document.createElement('option');
        o.value = c;
        o.textContent = c;
        // An option cannot be styled by class in every browser -- Safari and
        // iOS render the native picker and ignore it -- so the weight goes on
        // the element itself, which they do honour.
        if (started.has(c)) o.style.fontWeight = '700';
        sel.appendChild(o);
      });
      sel.value = state.cityFilter;
      // Disabled only when there is genuinely nothing to pick. It used to key
      // on paths alone, so a catalogue full of waypoints and no path yet left
      // the one control that would show them greyed out.
      sel.disabled = sel.options.length < 2;
    }

    function renderPathSelect() {
      const sel = el('pathSelect');
      sel.innerHTML = '';
      const rows = pathsInCity(state.cityFilter);
      if (!rows.length) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = state.paths.length
          ? 'No paths in ' + state.cityFilter
          : 'No paths yet';
        sel.appendChild(o);
        sel.disabled = true;
        return;
      }
      sel.disabled = false;
      rows.forEach((r) => {
        const o = document.createElement('option');
        o.value = r.tour_id;
        // The city is only worth repeating when the list spans several.
        o.textContent = (!state.cityFilter && cleanText(r.city) ? cleanText(r.city) + ' - ' : '')
          + (cleanText(r.title) || r.tour_id);
        sel.appendChild(o);
      });
      sel.value = state.pathId;
    }

    // Path title / shape / city, saved on change. These are three fields on one
    // row; a Save button for them as well as for the order would be two kinds of
    // save on one screen, and the order is the one that needs deliberate saving
    // because it is what you spend the time on.
    function renderMeta() {
      const box = el('pathMeta');
      box.innerHTML = '';
      const path = currentPath();
      if (!path) return;

      const field = (label, node) => {
        const wrap = document.createElement('div');
        wrap.className = 'meta-field';
        const l = document.createElement('label');
        l.className = 'inline';
        l.textContent = label;
        wrap.append(l, node);
        return wrap;
      };

      const title = document.createElement('input');
      title.type = 'text';
      title.value = cleanText(path.title);
      title.placeholder = 'What this walk is called';
      title.addEventListener('change', () => savePathField('title', title.value));

      const shape = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = '(not set)';
      shape.appendChild(blank);
      SHAPES.forEach((s) => {
        const o = document.createElement('option');
        o.value = s.key;
        o.textContent = s.label;
        o.title = s.blurb;   // the full description, on hover
        shape.appendChild(o);
      });
      shape.value = cleanText(path.shape);
      shape.title = shapeBlurb(shape.value);
      shape.addEventListener('change', () => savePathField('shape', shape.value));

      // This field decides what the pool and the map's candidates show, so it is
      // backed by the shared catalogue. Stored bare ("Miami"), see cityNameOf.
      const city = document.createElement('input');
      city.type = 'text';
      city.value = cleanText(path.city);
      city.placeholder = 'City';
      city.setAttribute('list', 'pathCityList');
      city.addEventListener('change', () => savePathField('city', cityNameOf(city.value)));

      const id = document.createElement('input');
      id.type = 'text';
      id.value = path.tour_id;
      id.readOnly = true;
      // The id is referenced by every path_stops row. Renaming it here would
      // orphan them all, so it is shown and not editable - the same bargain
      // anchor_events makes with its client-supplied primary key.
      id.title = 'The path id. Not editable - every stop points at it.';

      box.append(
        field('Title', title),
        field('Shape', shape),
        field('City', city),
        field('Path id', id)
      );
    }

    function renderStops() {
      const box = el('pathStops');
      box.innerHTML = '';
      if (!state.pathId) {
        box.innerHTML = '<p class="empty">No path selected. Make one with New path.</p>';
        return;
      }
      if (!state.stops.length) {
        box.innerHTML = '<p class="empty">Nothing on this path yet. Drag a waypoint over from the left, or press Add on one.</p>';
        return;
      }
      state.stops.forEach((wpid, i) => {
        const w = wpById(wpid);
        if (!w) return;
        const row = document.createElement('div');
        row.className = 'stop'
          + (i === 0 ? ' stop--start' : '')
          + (i === state.stops.length - 1 && state.stops.length > 1 ? ' stop--end' : '');
        row.dataset.wpid = wpid;
        // THE INDEX, because a wpid is no longer unique on a path: a loop may
        // list the same square first and last, and indexOf would find whichever
        // copy came first and move the wrong one.
        row.dataset.idx = String(i);

        const handle = document.createElement('span');
        handle.className = 'stop-handle';
        handle.textContent = '≡';
        handle.title = 'Drag to reorder';
        wireDrag(handle, row);

        const ord = document.createElement('span');
        ord.className = 'stop-ord';
        ord.textContent = String(i + 1);

        const main = document.createElement('div');
        main.className = 'stop-main';
        const name = document.createElement('div');
        name.className = 'stop-name';
        name.textContent = cleanText(w.name) || ('WPID ' + w.wpid);
        const meta = document.createElement('div');
        meta.className = 'stop-meta';
        meta.textContent = [cleanText(w.address), cleanText(w.city)].filter(Boolean).join(' - ')
          || 'no address';
        main.append(name, meta);

        const actions = document.createElement('div');
        actions.className = 'stop-actions';
        const up = mkBtn('↑', 'Move up', () => moveStop(i, i - 1), i === 0);
        const down = mkBtn('↓', 'Move down', () => moveStop(i, i + 1), i === state.stops.length - 1);
        const edit = mkBtn('Edit', 'Edit this waypoint', () => openWaypointEditor(w.wpid));
        const off = mkBtn('Remove', 'Take off this path (the waypoint is kept)', () => removeStop(i));
        off.classList.add('warn');
        actions.append(up, down, edit, off);

        row.append(handle, ord, main, actions);
        wireDropTarget(row);
        box.appendChild(row);
      });
    }

    function mkBtn(text, title, onClick, disabled) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn small';
      b.textContent = text;
      b.title = title;
      if (disabled) b.disabled = true;
      b.addEventListener('click', onClick);
      return b;
    }

    // Every waypoint in the PATH'S city that is not already a stop. The typed
    // filter narrows that set; it never widens it past the city.
    // THE LIBRARY KEEPS EVERY PLACE, WHETHER IT IS ON THE PATH OR NOT.
    //
    // It used to drop a waypoint the moment it landed on a path, which made
    // adding a stop read as MOVING the place out of the catalogue -- and the
    // catalogue is the permanent thing here. A place lives once in
    // public.waypoints and can be on any number of paths, which is the entire
    // reason waypoints and path_stops are two tables; a library that empties as
    // you build contradicts that on screen.
    //
    // Rows already on the path stay, marked and with Add spent. What used to be
    // a filter is now a STATE on the row: see .stop--used and stopsHas below.
    // HOW MANY TIMES this place is on the open path, not whether. A path may
    // visit the same square twice -- a loop that starts and finishes there is
    // the ordinary case -- so the answer worth showing is a count.
    // wpid comes back from PostgREST as a number and is held as a string in
    // state.stops, so this compares the two the only way that is safe.
    function stopsCount(wpid) {
      return state.stops.filter((id) => String(id) === String(wpid)).length;
    }

    function poolRows() {
      // THE CHOSEN CITY, falling back to the open path's. Choosing a city is
      // now what fills this library, so a city with no path yet still shows its
      // waypoints -- which is exactly the state you are in when you are about
      // to build the first path there. Reading pathCity() alone left the
      // library empty until a path existed to give it a city.
      const city = (state.cityFilter || pathCity()).toLowerCase();
      const q = state.poolQuery.toLowerCase();
      return state.waypoints.filter((w) => {
        if (!city || cleanText(w.city).toLowerCase() !== city) return false;
        if (!q) return true;
        return (cleanText(w.name) + ' ' + cleanText(w.address)).toLowerCase().includes(q);
      });
    }

    function renderPool() {
      const box = el('poolList');
      box.innerHTML = '';
      const rows = poolRows();
      // THE LEFT PANEL IS A LIBRARY, NOT A LEFTOVER. Titling it "not on this
      // path" defined a standing catalogue of places by what it is currently
      // missing, which changes every time you drag a row: the same shelf was
      // called something different a second later. It is the city's waypoint
      // library, and the path is what you build out of it.
      //
      // The city goes AFTER the colon so the two titles start with the noun
      // and line up down the page, rather than each beginning with whatever
      // city happens to be open.
      // Each panel is titled for the city it is actually showing: the library
      // follows the chosen city, the path follows the path that is open. They
      // are the same city almost always, and differ for the moment between
      // choosing a city and its first path opening.
      const libraryCity = state.cityFilter || pathCity();
      // NAMES THE CITY IT WILL ACTUALLY SEARCH. "Filter by name or address"
      // described the mechanism; the useful thing to say is the SCOPE, because
      // this box never reaches past the open city and a search that silently
      // does not cover everything is the one worth labelling.
      el('poolSearch').placeholder = libraryCity
        ? 'Search ' + libraryCity + ' waypoints'
        : 'Search waypoints';
      const city = pathCity();
      el('pathPanelTitle').textContent = city
        ? 'PATH: ' + city.toUpperCase()
        : 'PATH';
      el('poolTitle').textContent = libraryCity
        ? 'WAYPOINT LIBRARY: ' + libraryCity.toUpperCase()
        : 'WAYPOINT LIBRARY';
      // ONE NUMBER: how many waypoints this city has. The "N on this path" half
      // was the same fact the rows already carry, said again in a corner -- every
      // one of those rows is dimmed and captioned "on this path", so the count
      // was a tally of something visible from where you are standing.
      el('poolCount').textContent = rows.length + (rows.length === 1 ? ' waypoint' : ' waypoints');
      if (!rows.length) {
        box.innerHTML = '<p class="empty">'
          + (city
              ? 'No waypoint in ' + libraryCity + ' yet. Add one with Waypoint Manual, or clear the filter box.'
              : 'This path has no city yet - set one above and its waypoints appear here.')
          + '</p>';
        return;
      }
      // Capped, because "every waypoint" is 282 rows and painting all of them
      // makes the panel a scroll pit. The filter is how you find the rest.
      rows.slice(0, 60).forEach((w) => {
        const row = document.createElement('div');
        row.className = 'stop';
        // The pool row carries the wpid for the same reason a path row does:
        // the drag handlers read it off the element rather than closing over it.
        row.dataset.wpid = w.wpid;

        // DRAG FROM HERE ONTO THE PATH. Handle only, the same rule the path
        // rows follow: a fully draggable row cannot have its address selected,
        // which is the other thing people do to these rows.
        // ALREADY ON THE PATH is a state of the row, not a reason to remove it.
        // Dimmed and captioned rather than hidden, so the library is the same
        // list before and after you build a walk out of it.
        const times = stopsCount(w.wpid);
        const used = times > 0;
        if (used) row.classList.add('stop--used');

        const handle = document.createElement('span');
        handle.className = 'stop-handle';
        handle.textContent = '≡';
        handle.title = !state.pathId ? 'Open a path first'
          : used ? 'Drag on again to visit it a second time' : 'Drag onto the path';
        if (state.pathId) wireDrag(handle, row, 'pool');

        const main = document.createElement('div');
        main.className = 'stop-main';
        const name = document.createElement('div');
        name.className = 'stop-name';
        name.textContent = cleanText(w.name) || ('WPID ' + w.wpid);
        const meta = document.createElement('div');
        meta.className = 'stop-meta';
        meta.textContent = [cleanText(w.address), cleanText(w.city)].filter(Boolean).join(' - ') || 'no address';
        main.append(name, meta);
        if (used) {
          const tag = document.createElement('div');
          tag.className = 'stop-used-tag';
          // The count only earns its place past one: "on this path x1" is the
          // same news as "on this path", said less clearly.
          tag.textContent = times > 1 ? ('on this path x' + times) : 'on this path';
          main.appendChild(tag);
        }
        const actions = document.createElement('div');
        actions.className = 'stop-actions';
        actions.appendChild(mkBtn('Edit', 'Edit this waypoint', () => openWaypointEditor(w.wpid)));
        // ADD STAYS LIVE once the place is on the path. It was spent, because
        // the (tour_id, wpid) primary key refused a second copy; that key is
        // gone (2026-08-18) and a loop that finishes where it started needs
        // exactly this button pressed twice.
        actions.appendChild(mkBtn('Add',
          used ? 'Put it on the end again' : 'Put this on the end of the path',
          () => addStop(w.wpid), !state.pathId));
        row.append(handle, main, actions);
        box.appendChild(row);
      });
      if (rows.length > 60) {
        const more = document.createElement('p');
        more.className = 'empty';
        more.textContent = (rows.length - 60) + ' more - narrow the filter to see them.';
        box.appendChild(more);
      }
    }

    // The path's City field offers the shared catalogue through ONE datalist
    // built once, not TgbCities.attach: renderMeta rebuilds its inputs on every
    // render, and attach keeps a controller for every element it is given - a
    // few minutes of editing would leak hundreds. Same call events.html makes.
    function fillCityList() {
      const list = el('pathCityList');
      if (!list || !window.TgbCities) return;
      window.TgbCities.load().then(() => {
        list.innerHTML = '';
        window.TgbCities.all().forEach((row) => {
          const o = document.createElement('option');
          o.value = cityNameOf(row.city);
          o.label = row.city;
          list.appendChild(o);
        });
      }).catch(() => {});
    }

    // --- the map --------------------------------------------------------------

    // Stored coordinates ONLY. The waypoints page pays the Nominatim cost once,
    // at one request a second, and writes the point back; this page reads what
    // that left behind. Geocoding a dozen stops here would put a 13-second wait
    // in front of a screen whose whole job is dragging rows around, and the
    // answer is already in the table for almost every row.
    function pointOf(w) {
      if (!w) return null;
      const lat = Number(w.lat);
      const lon = Number(w.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      if (lat === 0 && lon === 0) return null;
      return { lat, lon };
    }

    let leafletPromise = null;
    function ensureLeaflet() {
      if (typeof L !== 'undefined') return Promise.resolve(true);
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise((resolve) => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(css);
        const js = document.createElement('script');
        js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        js.async = true;
        // A map that will not load is not a broken page - the list is the thing
        // you edit and it is all still there. Resolve either way.
        js.onload = () => resolve(true);
        js.onerror = () => resolve(false);
        document.head.appendChild(js);
      });
      return leafletPromise;
    }

    const mapState = { map: null, layer: null, fitKey: '', showPool: false, token: 0 };

    function mkPin(label, extraClass) {
      return L.divIcon({
        className: 'rb-pin ' + (extraClass || ''),
        html: '<span class="rb-pin-dot">' + (label || '') + '</span>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    // Redrawn wholesale on every render - a path is a dozen markers, and a diff
    // of a layer group is more code than it saves.
    async function renderMap() {
      const box = el('pathMap');
      const note = el('mapNote');
      const count = el('mapCount');
      if (!box) return;

      const stops = state.stops.map(wpById).filter(Boolean);
      const located = stops.map((w) => ({ w, at: pointOf(w) })).filter((e) => e.at);
      const unlocated = stops.length - located.length;

      // The same set the pool panel lists, minus the typed filter - the map is
      // showing you where the candidates are, not what you searched for.
      const pool = mapState.showPool
        ? state.waypoints
            .filter((w) => !state.stops.includes(String(w.wpid)))
            .filter((w) => pathCity() && cleanText(w.city).toLowerCase() === pathCity().toLowerCase())
            .map((w) => ({ w, at: pointOf(w) }))
            .filter((e) => e.at)
            .slice(0, 250)
        : [];

      count.textContent = located.length
        ? located.length + ' of ' + stops.length + ' stops on the map'
        : '';

      if (!located.length && !pool.length) {
        // Never downloads Leaflet for a path it cannot draw.
        if (mapState.map) { mapState.map.remove(); mapState.map = null; mapState.fitKey = ''; }
        box.classList.add('is-empty');
        box.innerHTML = '<span class="empty">'
          + (stops.length
              ? 'None of these ' + stops.length + ' stops has coordinates yet.'
              : 'Add stops to see the walk.')
          + '</span>';
        note.textContent = stops.length
          ? 'Open the stop in Waypoints and let its city map locate it - the point is saved there and read here.'
          : '';
        note.classList.toggle('warn', stops.length > 0);
        return;
      }

      const token = ++mapState.token;
      const ok = await ensureLeaflet();
      if (!ok || token !== mapState.token) return;

      if (!mapState.map) {
        box.classList.remove('is-empty');
        box.innerHTML = '';
        mapState.map = L.map(box, {
          maxZoom: 22,
          scrollWheelZoom: false,   // the wheel belongs to the page, which scrolls
          attributionControl: true
        }).setView([39.5, -98.35], 4);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 22, maxNativeZoom: 19, attribution: 'Esri'
        }).addTo(mapState.map);
        setTimeout(() => { try { mapState.map.invalidateSize(); } catch (_) {} }, 0);
      }
      const map = mapState.map;
      if (mapState.layer) map.removeLayer(mapState.layer);
      mapState.layer = L.layerGroup().addTo(map);

      pool.forEach(({ w, at }) => {
        const marker = L.marker([at.lat, at.lon], {
          icon: mkPin('', 'rb-pin--pool'),
          title: cleanText(w.name)
        }).addTo(mapState.layer);
        marker.bindTooltip(cleanText(w.name) || ('WPID ' + w.wpid), { direction: 'top', offset: [0, -8] });
        // Clicking a candidate adds it, which is the one thing a map can do
        // better than the list: you pick the next stop by where it is.
        const pop = document.createElement('div');
        pop.innerHTML = '<div class="rb-pop-name"></div><div class="rb-pop-meta"></div>';
        pop.querySelector('.rb-pop-name').textContent = cleanText(w.name) || ('WPID ' + w.wpid);
        pop.querySelector('.rb-pop-meta').textContent = cleanText(w.address) || 'no address';
        pop.appendChild(mkBtn('Add to path', 'Put this on the end of the path', () => {
          map.closePopup();
          addStop(w.wpid);
        }, !state.pathId));
        pop.appendChild(mkBtn('Edit', 'Edit this waypoint', () => {
          map.closePopup();
          openWaypointEditor(w.wpid);
        }));
        marker.bindPopup(pop);
      });

      // Path pins last so they sit above the candidates.
      located.forEach(({ w, at }, i) => {
        const idx = state.stops.indexOf(String(w.wpid));
        const isStart = idx === 0;
        const isEnd = idx === state.stops.length - 1 && state.stops.length > 1;
        const marker = L.marker([at.lat, at.lon], {
          icon: mkPin(String(idx + 1), isStart ? 'rb-pin--start' : (isEnd ? 'rb-pin--end' : '')),
          riseOnHover: true
        }).addTo(mapState.layer);
        marker.bindTooltip((idx + 1) + '. ' + (cleanText(w.name) || ('WPID ' + w.wpid)),
          { direction: 'top', offset: [0, -10] });
        // A pin is the fastest way to the place it marks: click opens its editor.
        // Scrolling to the row was the old behaviour and is now what the tooltip
        // is for - you can see which row it is without leaving the map.
        marker.on('click', () => openWaypointEditor(w.wpid));
      });

      // The walk itself, in path order, under the numbers.
      const line = state.stops
        .map((id) => pointOf(wpById(id)))
        .filter(Boolean)
        .map((p) => [p.lat, p.lon]);
      if (line.length > 1) {
        // A white casing under the blue. The tiles are satellite imagery, and a
        // 2px dark-blue dash over a city block is invisible on its own - drawn
        // once without this and the walk simply could not be seen.
        L.polyline(line, { color: '#fff', weight: 5, opacity: 0.85, interactive: false })
          .addTo(mapState.layer).bringToBack();
        L.polyline(line, { color: '#2d4880', weight: 2.5, opacity: 0.95, dashArray: '5 6', interactive: false })
          .addTo(mapState.layer);
      }

      // Refit only when the SET of drawn points changes, never on a reorder.
      // Yanking the viewport every time you drag a row makes the map unusable
      // exactly when you are using it.
      const key = [
        located.map((e) => e.w.wpid).sort((a, b) => a - b).join(','),
        pool.length,
        mapState.showPool ? pathCity() : ''
      ].join('|');
      if (key !== mapState.fitKey) {
        mapState.fitKey = key;
        const bounds = located.map((e) => [e.at.lat, e.at.lon]);
        if (mapState.showPool && !bounds.length) pool.forEach((e) => bounds.push([e.at.lat, e.at.lon]));
        if (bounds.length === 1) map.setView(bounds[0], 16);
        else if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 17 });
      }

      note.classList.toggle('warn', unlocated > 0);
      note.textContent = unlocated
        ? unlocated + ' stop' + (unlocated === 1 ? ' has' : 's have') + ' no coordinates and cannot be drawn'
          + ' - open the city in Waypoints, which locates and saves the point.'
        : (mapState.showPool && pool.length
            ? pool.length + ' unused waypoint' + (pool.length === 1 ? '' : 's') + ' shown hollow - click one to add it.'
            : '');
    }

    // --- the waypoint editor --------------------------------------------------
    //
    // Phase one of folding mc/data/waypoints.html into this page. A waypoint is
    // edited in a popup off whichever list or pin you found it in, rather than
    // on a card in a separate room - the catalogue and the walk you are building
    // out of it are the same job.
    //
    // ONE waypoint is open at a time, so there is no dirty SET to track and no
    // Save all: the dialog holds a working copy, Save writes it, Close throws it
    // away after asking. That is the whole reason the popup is worth the change.

    // Only these go to the database. Naming a column PostgREST does not have
    // rejects the WHOLE write, so the three that arrived in later migrations are
    // probed from the shape of a real row rather than assumed.
    const WP_FIELDS = ['name', 'city', 'state', 'zip', 'address', 'description'];

    // The two-letter code for a city string, via the shared geo module -- the
    // same one that turns "Denver, Colorado" into CO everywhere else. Returns
    // '' when the city is not one it can parse, which is a real case: a
    // waypoint's city is free text and may be somewhere not in the catalogue.
    function stateFromCity(city) {
      const name = cleanText(city);
      if (!name || !window.TgbGeo || typeof window.TgbGeo.parseGeo !== 'function') return '';
      try {
        const geo = window.TgbGeo.parseGeo(name) || {};
        return cleanText(geo.stateCode || geo.state_code || '');
      } catch (err) { return ''; }
    }
    const wpCols = { source_url: false, archived: false, latlon: false, walk_order: false };
    // A field a walking tour actually needs. Same list the Waypoints page paints
    // red, so the two cannot disagree about what "incomplete" means.
    const WP_ERROR_FIELDS = ['address', 'city', 'zip', 'description'];

    function probeWaypointColumns(rows) {
      const has = (key) => (Array.isArray(rows) ? rows : []).some(
        (r) => r && typeof r === 'object' && Object.prototype.hasOwnProperty.call(r, key));
      wpCols.source_url = has('source_url');
      wpCols.archived = has('archived');
      wpCols.latlon = has('lat');
      wpCols.walk_order = has('walk_order');
    }

    const wpEdit = { row: null, wpid: '', dirty: false, busy: false, addToPath: false };

    function wpDlgOpen() { return el('wpDlg').classList.contains('is-open'); }

    function wpNote(text, kind) {
      const note = el('wpDlgNote');
      note.textContent = text || '';
      note.classList.toggle('warn', kind === 'error');
      note.classList.toggle('busy', kind === 'busy');
    }

    // A Plus Code in Address is not a missing address - it is a more precise one
    // than a street number, and it is why the field accepts one at all. It also
    // clears the ZIP error: ZIP only counts because it is what the map falls
    // back to when a street will not geocode.
    function wpErrors(row) {
      const geo = window.TgbWaypointGeo;
      if (!row || row.archived) return [];
      const plusCoded = geo && geo.looksLikePlusCode(row.address)
        && !geo.isShortPlusCode(row.address) && !!geo.decodePlusCode(row.address);
      return WP_ERROR_FIELDS.filter((f) => {
        if (plusCoded && (f === 'address' || f === 'zip')) return false;
        return !cleanText(row[f]);
      });
    }

    function openWaypointEditor(wpid) {
      const source = wpid == null ? null : wpById(wpid);
      if (wpid != null && !source) return;
      // A working COPY. Everything up to Save happens here, so Close can throw
      // the edit away without the list having been changed underneath.
      wpEdit.row = source
        ? Object.assign({}, source)
        : { wpid: '', name: '', city: pathCity(), state: '', zip: '', address: '',
            description: '', source_url: '', archived: false, lat: null, lon: null };
      wpEdit.wpid = source ? String(source.wpid) : '';
      wpEdit.dirty = false;
      wpEdit.busy = false;
      // A waypoint made while a path is open is almost always for that path.
      wpEdit.addToPath = !source && !!state.pathId;
      el('wpDlg').classList.add('is-open');
      renderWaypointForm();
      const first = el('wpForm').querySelector('input, textarea');
      if (first) first.focus();
    }

    function closeWaypointEditor(force) {
      if (!force && wpEdit.dirty
        && !window.confirm('This waypoint has unsaved changes. Close and lose them?')) return;
      el('wpDlg').classList.remove('is-open');
      wpEdit.row = null;
      wpEdit.dirty = false;
    }

    function wpField(label, key, opts) {
      const options = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'wp-field' + (options.full ? ' wp-field--full' : '');
      const lab = document.createElement('label');
      lab.className = 'inline';
      lab.textContent = label;
      const input = document.createElement(options.multiline ? 'textarea' : 'input');
      if (!options.multiline) input.type = 'text';
      input.value = cleanText(wpEdit.row[key]);
      if (options.placeholder) input.placeholder = options.placeholder;
      if (options.list) input.setAttribute('list', options.list);
      input.addEventListener('input', () => {
        wpEdit.row[key] = input.value;
        // Editing the address invalidates the stored point - the coordinates
        // describe where the OLD address was. Locate or Fill sets them again.
        if (key === 'address') { wpEdit.row.lat = null; wpEdit.row.lon = null; }
        wpEdit.dirty = true;
        paintWpErrors();
      });
      wrap.append(lab, input);
      if (options.hint) {
        const hint = document.createElement('p');
        hint.className = 'wp-hint';
        hint.textContent = options.hint;
        wrap.appendChild(hint);
      }
      wrap.dataset.field = key;
      return wrap;
    }

    function paintWpErrors() {
      const bad = wpErrors(wpEdit.row);
      el('wpForm').querySelectorAll('[data-field]').forEach((node) => {
        node.classList.toggle('is-error', bad.indexOf(node.dataset.field) > -1);
      });
    }

    function renderWaypointForm() {
      const row = wpEdit.row;
      if (!row) return;
      const box = el('wpForm');
      box.innerHTML = '';
      const isNew = !wpEdit.wpid;

      el('wpDlgTitle').textContent = isNew ? 'New waypoint' : (cleanText(row.name) || 'Waypoint');
      el('wpDlgId').textContent = isNew ? 'not saved yet' : ('WPID ' + wpEdit.wpid);

      box.append(
        wpField('Name', 'name', { full: true, placeholder: 'What the place is called' }),
        wpField('Description', 'description', { full: true, multiline: true,
          placeholder: 'What a visitor standing here is told' }),
        wpField('Address', 'address', { full: true,
          placeholder: '200 E Colfax Ave',
          hint: 'Street only - city, state and ZIP have their own fields. A Plus Code is allowed where there is no street.' }),
        wpField('City', 'city', { list: 'pathCityList' }),
        // NO STATE BOX. The city carries it: public.cities holds the canonical
        // string, TgbGeo parses "Denver, Colorado" into a state, and stateFromCity
        // below writes the two-letter CODE the other 280 rows use. A field that
        // can only be filled in one correct way is a field that can be got
        // wrong, and this one was: Nominatim answers "Florida" where every
        // stored row says "FL".
        // The COLUMN is untouched and still written on save.
        wpField('ZIP', 'zip'),
        wpField('Source URL', 'source_url', { placeholder: 'https://en.wikipedia.org/...' })
      );

      // Read-only, one writer each. See the dialog's markup comment.
      const point = document.createElement('div');
      point.className = 'wp-field';
      const pl = document.createElement('label');
      pl.className = 'inline';
      pl.textContent = 'Coordinates';
      const pv = document.createElement('div');
      pv.className = 'wp-readonly';
      pv.textContent = (row.lat != null && row.lon != null)
        ? (Number(row.lat).toFixed(6) + ', ' + Number(row.lon).toFixed(6))
        : (wpCols.latlon ? 'not located - press Locate' : 'no column');
      point.append(pl, pv);
      box.appendChild(point);

      if (wpEdit.addToPath !== null && !wpEdit.wpid && state.pathId) {
        const add = document.createElement('div');
        add.className = 'wp-field wp-field--full';
        const lab = document.createElement('label');
        lab.style.display = 'flex';
        lab.style.gap = '6px';
        lab.style.alignItems = 'center';
        lab.style.fontSize = '0.85rem';
        const box2 = document.createElement('input');
        box2.type = 'checkbox';
        box2.checked = wpEdit.addToPath;
        box2.addEventListener('change', () => { wpEdit.addToPath = box2.checked; });
        lab.append(box2, document.createTextNode('Put this on the open path when it saves'));
        add.appendChild(lab);
        box.appendChild(add);
      }

      const archived = !!row.archived;
      const archiveBtn = el('wpArchiveBtn');
      archiveBtn.textContent = archived ? 'Restore' : 'Archive';
      archiveBtn.title = archived
        ? 'Return this waypoint to the working list'
        : 'Archive it so future AI and nightly runs do not suggest it again';
      archiveBtn.hidden = isNew || !wpCols.archived;
      el('wpDupeBtn').hidden = isNew;
      el('wpDeleteBtn').hidden = isNew;
      el('wpLocateBtn').hidden = !wpCols.latlon;
      el('wpSaveBtn').textContent = isNew ? 'Create' : 'Save';
      paintWpErrors();
      const bad = wpErrors(row);
      wpNote(bad.length ? 'Missing: ' + bad.join(', ') + '.' : '');
    }

    function wpBusy(on, text) {
      wpEdit.busy = !!on;
      ['wpSaveBtn', 'wpFillBtn', 'wpFindBtn', 'wpLocateBtn', 'wpDupeBtn', 'wpArchiveBtn', 'wpDeleteBtn']
        .forEach((id) => { el(id).disabled = !!on; });
      if (text) wpNote(text, 'busy');
    }

    // Editable columns only, and only the ones the database actually has.
    function wpPayload(row) {
      const payload = {};
      WP_FIELDS.forEach((f) => { payload[f] = cleanText(row[f]) || null; });
      // STATE COMES FROM THE CITY. It has no box any more, so a row edited here
      // would otherwise write back whatever it happened to arrive with -- and a
      // row whose city was just corrected would keep the old state.
      // The derived value only overwrites when it resolves: a city TgbGeo cannot
      // parse leaves whatever was already stored alone rather than nulling it.
      const derived = stateFromCity(row.city);
      if (derived) payload.state = derived;
      if (wpCols.source_url) payload.source_url = cleanText(row.source_url) || null;
      if (wpCols.archived) payload.archived = !!row.archived;
      if (wpCols.latlon && row.lat != null && row.lon != null) {
        payload.lat = Number(row.lat);
        payload.lon = Number(row.lon);
      }
      return payload;
    }

    // Put a freshly written row back into the catalogue in place, rather than
    // reloading every waypoint to see one change.
    function absorbWaypoint(fresh) {
      if (!fresh) return null;
      const i = state.waypoints.findIndex((w) => String(w.wpid) === String(fresh.wpid));
      if (i > -1) state.waypoints[i] = fresh;
      else state.waypoints.push(fresh);
      return fresh;
    }

    async function saveWaypoint() {
      const row = wpEdit.row;
      if (!row || wpEdit.busy) return;
      if (!cleanText(row.name) && !cleanText(row.address)) {
        wpNote('A waypoint needs at least a name or an address.', 'error');
        return;
      }
      const isNew = !wpEdit.wpid;
      // The last gate before a duplicate enters the catalogue. Two rows for one
      // place are very hard to spot later - both look correct - and the importers
      // dedupe on name + address, so a near-miss defeats them too.
      if (isNew && window.TgbWaypointGeo) {
        const match = window.TgbWaypointGeo.findSimilar(row, state.waypoints);
        if (match && !window.confirm(
          'This looks like WPID ' + match.row.wpid
          + (cleanText(match.row.name) ? ' (' + match.row.name + ')' : '')
          + ' by ' + match.reason + '.\n\nCreate it anyway?')) return;
      }
      wpBusy(true, isNew ? 'Creating...' : 'Saving...');
      try {
        await ensureFreshSession();
        const res = await fetch(
          restUrl('waypoints', isNew ? {} : { wpid: 'eq.' + wpEdit.wpid }),
          {
            method: isNew ? 'POST' : 'PATCH',
            headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
            body: JSON.stringify(wpPayload(row))
          });
        if (!res.ok) throw new Error(await readError(res));
        const [fresh] = await res.json();
        absorbWaypoint(fresh);
        const wasNew = isNew;
        wpEdit.wpid = String(fresh.wpid);
        wpEdit.row = Object.assign({}, fresh);
        wpEdit.dirty = false;
        wpBusy(false);
        // Creating a waypoint for the open path and then having to find it in
        // the pool to add it is two steps for one intention.
        if (wasNew && wpEdit.addToPath && state.pathId) {
          addStop(fresh.wpid);
          setStatus('Created ' + (cleanText(fresh.name) || ('WPID ' + fresh.wpid))
            + ' and put it on the path - press Save to keep the order.', 'success');
        } else {
          setStatus('Saved ' + (cleanText(fresh.name) || ('WPID ' + fresh.wpid)) + '.', 'success');
        }
        renderWaypointForm();
        renderAll();
      } catch (err) {
        wpBusy(false);
        wpNote(err.message || 'Could not save this waypoint.', 'error');
      }
    }

    async function deleteWaypointRow() {
      const wpid = wpEdit.wpid;
      if (!wpid || wpEdit.busy) return;
      const name = cleanText(wpEdit.row.name) || ('WPID ' + wpid);
      const onPaths = state.stops.includes(String(wpid)) ? ' It is on the open path.' : '';
      if (!window.confirm('Delete ' + name + '?' + onPaths
        + '\n\nThis cannot be undone. Archive instead if you only want it out of the way.')) return;
      wpBusy(true, 'Deleting...');
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('waypoints', { wpid: 'eq.' + wpid }), {
