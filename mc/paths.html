          method: 'DELETE', headers: authHeaders({ Prefer: 'return=minimal' })
        });
        if (!res.ok) throw new Error(await readError(res));
        state.waypoints = state.waypoints.filter((w) => String(w.wpid) !== String(wpid));
        // path_stops cascades on the database side; drop it here too so the
        // open path does not show a stop whose place no longer exists.
        state.stops = state.stops.filter((id) => id !== String(wpid));
        wpBusy(false);
        closeWaypointEditor(true);
        renderAll();
        setStatus('Deleted ' + name + '.', 'success');
      } catch (err) {
        wpBusy(false);
        wpNote(err.message || 'Could not delete this waypoint.', 'error');
      }
    }

    async function toggleWaypointArchived() {
      if (!wpEdit.wpid || wpEdit.busy) return;
      wpEdit.row.archived = !wpEdit.row.archived;
      wpEdit.dirty = true;
      await saveWaypoint();
      // An archived waypoint leaves the working catalogue, so the lists behind
      // the dialog change - state.waypoints filters it out on the next load.
      renderAll();
    }

    async function duplicateWaypointRow() {
      if (!wpEdit.wpid || wpEdit.busy) return;
      // A copy is a LOOSE waypoint: it belongs to no path, and it is never born
      // archived - a tombstone is somebody's decision about the original.
      const copy = Object.assign({}, wpEdit.row);
      copy.wpid = '';
      copy.name = cleanText(copy.name) ? cleanText(copy.name) + ' (copy)' : '';
      copy.archived = false;
      wpEdit.row = copy;
      wpEdit.wpid = '';
      wpEdit.dirty = true;
      wpEdit.addToPath = false;
      renderWaypointForm();
      wpNote('A copy of the original, not saved yet. Press Create.', 'busy');
    }

    // Coordinates only - no fields touched. This is the one the map wants: it
    // is what turns an unplaced row into a pin.
    async function locateWaypoint() {
      const geo = window.TgbWaypointGeo;
      if (!geo || wpEdit.busy) return;
      wpBusy(true, 'Locating... (one request a second, Nominatim\'s rule)');
      try {
        const point = geo.pointFor(wpEdit.row) || await geo.locate(wpEdit.row);
        if (!point) { wpBusy(false); wpNote('Could not locate that address.', 'error'); return; }
        wpEdit.row.lat = geo.round6(point.lat);
        wpEdit.row.lon = geo.round6(point.lon);
        wpEdit.dirty = true;
        wpBusy(false);
        renderWaypointForm();
        wpNote('Located. Save to store the point.', 'busy');
      } catch (err) {
        wpBusy(false);
        wpNote(err.message || 'Locate failed.', 'error');
      }
    }

    // Fill BLANK fields only, from whatever the row already says. Everything
    // typed is kept - see waypoint-geo.js.
    async function fillWaypoint() {
      const geo = window.TgbWaypointGeo;
      if (!geo || wpEdit.busy) return;
      wpBusy(true, 'Filling... this makes several geocoder calls a second apart.');
      try {
        const result = await geo.fill(wpEdit.row, {
          onStage: (stage) => { if (stage === 'zip') wpNote('Chasing the ZIP...', 'busy'); }
        });
        wpBusy(false);
        if (result.complete) { wpNote('Nothing blank to fill.'); return; }
        if (result.error) { wpNote(result.error, 'error'); return; }
        if (!result.filled.length) { wpNote('Found a match, but nothing new to fill.'); return; }
        wpEdit.dirty = true;
        renderWaypointForm();
        wpNote('Filled ' + result.filled.join(', ') + '.'
          + (result.zipApprox ? ' The ZIP is the city-centre one - check it.' : '')
          + ' Review, then Save.', 'busy');
      } catch (err) {
        wpBusy(false);
        wpNote(err.message || 'Lookup failed.', 'error');
      }
    }

    function openWaypointInMaps() {
      const geo = window.TgbWaypointGeo;
      const url = geo && geo.googleMapsUrl(wpEdit.row, {
        lat: Number(wpEdit.row.lat), lon: Number(wpEdit.row.lon)
      });
      if (url) window.open(url, '_blank', 'noopener');
      else wpNote('Nothing to search for yet - add a name or an address.', 'error');
    }

    // --- find a place online --------------------------------------------------
    //
    // Phase two of the merge: what the Waypoints page called Manual + "Find
    // online". The old flow inserted a chosen result straight into the table and
    // then took you to its card to correct it. This one opens the result in the
    // editor as an unsaved DRAFT, because the geocoder is usually nearly right,
    // and nearly right inserted unreviewed is what fills a catalogue with
    // rubbish nobody can tell from real rows afterwards.

    const findState = { busy: false, items: [] };

    function openFindDialog(seed) {
      el('findDlg').classList.add('is-open');
      const box = el('findQuery');
      if (seed !== undefined) box.value = cleanText(seed);
      el('findNote').textContent = '';
      el('findNote').classList.remove('warn');
      renderFindResults();
      box.focus();
      box.select();
    }

    function closeFindDialog() { el('findDlg').classList.remove('is-open'); }

    function findNote(text, kind) {
      const note = el('findNote');
      note.textContent = text || '';
      note.classList.toggle('warn', kind === 'error');
      note.classList.toggle('busy', kind === 'busy');
    }

    async function runFind() {
      const geo = window.TgbWaypointGeo;
      const query = cleanText(el('findQuery').value);
      if (!geo || findState.busy) return;
      if (!query) { findNote('Type something to look for, or press Blank waypoint.', 'error'); return; }
      findState.busy = true;
      el('findGoBtn').disabled = true;
      findNote('Searching OpenStreetMap...', 'busy');
      findState.items = [];
      renderFindResults();
      try {
        const result = await geo.search(query);
        findState.items = result.items;
        // A partial answer is still an answer. Overpass 504s often enough that
        // treating it as fatal would make the button feel broken.
        const partial = result.failed.length
          ? ' (' + result.failed.join(' and ') + ' did not respond - OpenStreetMap\'s free endpoints are often busy; try again in a moment)'
          : '';
        findNote(result.items.length
          ? 'Pick one to open it as a draft. Nothing is saved until you press Create.' + partial
          : 'Nothing found' + (partial || '. For a business, add the city - "Euclid Records New Orleans".'),
          result.items.length ? '' : 'error');
      } catch (err) {
        findNote(err.message || 'Search failed.', 'error');
      } finally {
        findState.busy = false;
        el('findGoBtn').disabled = false;
        renderFindResults();
      }
    }

    function renderFindResults() {
      const geo = window.TgbWaypointGeo;
      const box = el('findList');
      box.innerHTML = '';
      el('findCount').textContent = findState.items.length
        ? findState.items.length + ' found' : '';
      findState.items.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'find-row';
        const main = document.createElement('div');
        main.className = 'find-row-main';
        const name = document.createElement('div');
        name.className = 'find-row-name';
        name.textContent = item.name;
        const sub = document.createElement('div');
        sub.className = 'find-row-sub';
        sub.textContent = item.sub || '';
        main.append(name, sub);
        // Checked on the NAME only at this stage: a result's address is not
        // known until its draft is built, and building every draft would mean a
        // reverse geocode per result at one a second.
        const dupe = geo && geo.findSimilar({ name: item.name }, state.waypoints);
        if (dupe) {
          row.classList.add('is-dupe');
          const flag = document.createElement('div');
          flag.className = 'find-row-dupe';
          flag.textContent = 'Already in the catalogue as WPID ' + dupe.row.wpid;
          main.appendChild(flag);
        }
        row.append(main, mkBtn('Open', 'Open this as an unsaved draft', () => openDraftFrom(item)));
        box.appendChild(row);
      });
    }

    async function openDraftFrom(item) {
      const geo = window.TgbWaypointGeo;
      if (!geo || findState.busy) return;
      findState.busy = true;
      findNote('Building the draft...', 'busy');
      try {
        const draft = await geo.draftFromResult(item);
        // The path's city is the one you are working in; a geocoder that
        // returns "Miami Beach" for a Miami place would otherwise quietly file
        // the waypoint where the pool cannot see it.
        if (!cleanText(draft.city)) draft.city = pathCity();
        closeFindDialog();
        openWaypointEditor(null);
        Object.assign(wpEdit.row, draft);
        wpEdit.dirty = true;
        renderWaypointForm();
        const match = geo.findSimilar(wpEdit.row, state.waypoints);
        wpNote(match
          ? 'Careful: this looks like WPID ' + match.row.wpid + ' ('
            + (cleanText(match.row.name) || 'unnamed') + ') by ' + match.reason
            + '. Create it anyway only if it is genuinely a different place.'
          : 'Draft from OpenStreetMap - check it, then press Create.',
          match ? 'error' : 'busy');
      } catch (err) {
        findNote(err.message || 'Could not build a draft from that result.', 'error');
      } finally {
        findState.busy = false;
      }
    }

    // --- the AI pulls ---------------------------------------------------------
    //
    // Phase three: the five prompts off the Waypoints page. Each one asks a
    // different AI a different question and gets back an INSERT block to run in
    // the Supabase editor - the prompts write no database themselves, which is
    // the whole reason they are safe to paste into whatever chat is open.
    //
    // The text lives in waypoint-prompts.js. Read the warning at the top of that
    // file before renaming anything: buildTourPlacesWaypointPrompt is the stored
    // specification of a scheduled cloud routine.

    const AI_PULLS = [
      { key: 'city', label: 'With AI - sweep one city',
        blurb: 'Anything standable in one city, sourced from Wikipedia articles that carry coordinates or a street address.',
        fields: ['area', 'count', 'keywords', 'sourceUrl'] },
      { key: 'tour', label: 'With AI - tour places (a real walk)',
        blurb: 'Starts from published walking tours and keeps only what they actually stop at. A loop that finishes within five minutes of where it began, commercial start and end. This is the prompt the NFL Tour Builder routine reads as its spec.',
        fields: ['city', 'notes', 'shape'] },
      { key: 'nfl', label: 'With AI - NFL cities that need stops',
        blurb: 'Several cities at once, least-covered first.',
        fields: ['cityCount', 'perCity', 'keywords'] },
      { key: 'sports', label: 'With AI - football history in the WRONG city',
        blurb: 'Starts from the football, not the city: a player\'s hometown, a coach\'s grave, the church where he married. Kept only when the place sits somewhere other than that team\'s own city - a Steelers marker in Pittsburgh is worthless to it.',
        fields: ['count'] },
      { key: 'bars', label: 'With AI - oldest bars',
        blurb: 'The oldest continuously operating bar or tavern in each city or region you name.',
        fields: ['focus', 'notes'] }
    ];

    const aiState = { pull: 'city', values: {}, text: '' };

    function openAiDialog() {
      const sel = el('aiPull');
      if (!sel.options.length) {
        AI_PULLS.forEach((p) => {
          const o = document.createElement('option');
          o.value = p.key;
          o.textContent = p.label;
          sel.appendChild(o);
        });
      }
      sel.value = aiState.pull;
      el('aiDlg').classList.add('is-open');
      renderAiInputs();
    }

    function closeAiDialog() { el('aiDlg').classList.remove('is-open'); }

    function aiInput(key, label, opts) {
      const options = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'wp-field' + (options.full ? ' wp-field--full' : '');
      const lab = document.createElement('label');
      lab.className = 'inline';
      lab.textContent = label;
      const input = document.createElement(options.select ? 'select' : 'input');
      if (options.select) {
        options.select.forEach((o) => {
          const opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = o.label;
          input.appendChild(opt);
        });
      } else {
        input.type = options.number ? 'number' : 'text';
        if (options.placeholder) input.placeholder = options.placeholder;
      }
      input.value = aiState.values[key] != null ? aiState.values[key] : (options.value || '');
      aiState.values[key] = input.value;
      input.addEventListener('input', () => { aiState.values[key] = input.value; });
      input.addEventListener('change', () => { aiState.values[key] = input.value; });
      wrap.append(lab, input);
      if (options.hint) {
        const hint = document.createElement('p');
        hint.className = 'wp-hint';
        hint.textContent = options.hint;
        wrap.appendChild(hint);
      }
      return wrap;
    }

    function renderAiInputs() {
      const pull = AI_PULLS.find((p) => p.key === aiState.pull) || AI_PULLS[0];
      const box = el('aiInputs');
      box.innerHTML = '';
      el('aiPullBlurb').textContent = pull.blurb;
      el('aiPromptText').hidden = true;
      el('aiCopyBtn').hidden = true;
      el('aiDbBtn').hidden = true;
      el('aiDlgCount').textContent = '';

      const P = window.TgbWaypointPrompts;
      const here = pathCity();
      pull.fields.forEach((f) => {
        if (f === 'area') box.appendChild(aiInput('area', 'City', {
          value: here ? here : '', placeholder: 'Denver, CO', full: true,
          hint: 'City and state or country, the way you would say it.'
        }));
        if (f === 'city') box.appendChild(aiInput('city', 'City', {
          value: here ? here : '', placeholder: 'Miami, FL', full: true
        }));
        if (f === 'count') box.appendChild(aiInput('count', 'How many', { number: true, value: '10' }));
        if (f === 'cityCount') box.appendChild(aiInput('cityCount', 'How many cities', {
          number: true, value: '5',
          hint: 'The least-covered NFL cities, counted from what we already hold.'
        }));
        if (f === 'perCity') box.appendChild(aiInput('perCity', 'Stops per city', { number: true, value: '5' }));
        if (f === 'keywords') box.appendChild(aiInput('keywords', 'Keywords (optional)', {
          placeholder: 'murals, speakeasies', full: true
        }));
        if (f === 'sourceUrl') box.appendChild(aiInput('sourceUrl', 'Source URL (optional)', {
          placeholder: 'https://en.wikipedia.org/...', full: true
        }));
        if (f === 'notes') box.appendChild(aiInput('notes', 'Angle (optional)', {
          placeholder: 'lean historic, avoid the waterfront', full: true
        }));
        if (f === 'focus') box.appendChild(aiInput('focus', 'Where', {
          placeholder: 'the Gulf Coast', full: true
        }));
        if (f === 'shape') box.appendChild(aiInput('shape', 'Shape', {
          select: SHAPES.map((s) => ({ value: s.key, label: s.label })), value: 'loop'
        }));
      });

      if (aiState.pull === 'nfl' && P) {
        const need = P.nflCitiesByNeed().slice(0, Number(aiState.values.cityCount) || 5);
        const note = document.createElement('p');
        note.className = 'wp-hint wp-field--full';
        note.textContent = 'Next up: ' + need.map((c) => c.city + ' (' + c.count + ')').join(', ');
        box.appendChild(note);
      }
    }

    function buildAiPrompt() {
      const P = window.TgbWaypointPrompts;
      if (!P) return;
      // The prompts need to know what we already hold - as a do-not-repeat list,
      // and as the count that decides which cities are underserved.
      P.useCatalogue(state.waypoints);
      const v = aiState.values;
      let text = '';
      try {
        if (aiState.pull === 'city') {
          text = P.buildWaypointAiPrompt(cleanText(v.area), Number(v.count) || 10,
            cleanText(v.keywords), cleanText(v.sourceUrl));
        } else if (aiState.pull === 'tour') {
          text = P.buildTourPlacesWaypointPrompt(cleanText(v.city), cleanText(v.notes), cleanText(v.shape));
        } else if (aiState.pull === 'nfl') {
          const cities = P.nflCitiesByNeed().slice(0, Number(v.cityCount) || 5).map((c) => c.city);
          text = P.buildNflWalkingTourPrompt(cities, Number(v.perCity) || 5, cleanText(v.keywords));
        } else if (aiState.pull === 'sports') {
          text = P.buildNflSportsWaypointPrompt(Number(v.count) || 10);
        } else if (aiState.pull === 'bars') {
          text = P.buildOldBarsWaypointPrompt(cleanText(v.focus), cleanText(v.notes));
        }
      } catch (err) {
        el('aiPullBlurb').textContent = 'Could not build that prompt: ' + (err.message || err);
        return;
      }
      aiState.text = text;
      const ta = el('aiPromptText');
      ta.value = text;
      ta.hidden = false;
      el('aiCopyBtn').hidden = false;
      el('aiDbBtn').hidden = false;
      el('aiDlgCount').textContent = text.length.toLocaleString() + ' characters';
      ta.focus();
      ta.setSelectionRange(0, 0);
    }

    async function copyAiPrompt() {
      const ta = el('aiPromptText');
      ta.focus();
      ta.select();
      try { await navigator.clipboard.writeText(ta.value); }
      catch (err) { document.execCommand('copy'); }
      const btn = el('aiCopyBtn');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
    }

    // --- NIGHTLY --------------------------------------------------------------

    const NIGHTLY_FILE = '/mc/stops/nightly.json';
    // A run that errors pushes nothing, so a stale commit IS the failure signal -
    // there is no other receipt, the scout writes one file and no database.
    const NIGHTLY_RUN_FEED = 'https://api.github.com/repos/the-game-bureau/the-game-bureau.github.io/commits'
      + '?path=mc/stops/nightly.json&per_page=1';
    const NIGHTLY_STALE_HOURS = 30;

    function nightlyRelative(then, now) {
      const mins = Math.round((now - then) / 60000);
      if (mins < 60) return mins + ' min ago';
      const hours = Math.round(mins / 60);
      if (hours < 36) return hours + ' hour' + (hours === 1 ? '' : 's') + ' ago';
      return Math.round(hours / 24) + ' days ago';
    }

    function openNightlyDialog() {
      el('nightlyDlg').classList.add('is-open');
      el('nightlyList').innerHTML = '';
      el('nightlyHead').textContent = 'Reading this morning\'s file...';
      el('nightlyWhen').textContent = '';
      loadNightlyRun();
      loadNightlyPicks();
    }

    function closeNightlyDialog() { el('nightlyDlg').classList.remove('is-open'); }

    async function loadNightlyRun() {
      const when = el('nightlyWhen');
      try {
        const res = await fetch(NIGHTLY_RUN_FEED, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error('GitHub ' + res.status);
        const commits = await res.json();
        if (!Array.isArray(commits) || !commits.length) throw new Error('no commits');
        const stamp = new Date(commits[0].commit.committer.date);
        const now = new Date();
        const stale = (now - stamp) / 3600000 > NIGHTLY_STALE_HOURS;
        when.textContent = 'Last run ' + nightlyRelative(stamp, now) + (stale ? ' - overdue' : '');
      } catch (err) {
        when.textContent = 'Last run unknown';
      }
    }

    async function loadNightlyPicks() {
      const list = el('nightlyList');
      let data = null;
      try {
        const res = await fetch(NIGHTLY_FILE + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch (err) {
        el('nightlyHead').textContent = 'Could not read nightly.json.';
        return;
      }
      const stops = Array.isArray(data && data.stops) ? data.stops : [];
      const city = cleanText(data && data.city);
      const sources = Array.isArray(data && data.sources) ? data.sources
        : (Array.isArray(data && data.tours) ? data.tours : []);
      el('nightlyHead').textContent = (city || 'No city yet') + ' · '
        + stops.length + ' candidate' + (stops.length === 1 ? '' : 's')
        + (sources.length ? ' from ' + sources.length + ' source' + (sources.length === 1 ? '' : 's') : '')
        + (cleanText(data && data.note) ? ' · ' + cleanText(data.note) : '');
      list.innerHTML = '';
      if (!stops.length) {
        el('nightlyHead').textContent += ' - nothing queued.';
        return;
      }
      stops.forEach((stop) => list.appendChild(renderNightlyStop(stop)));
    }

    function renderNightlyStop(stop) {
      const row = document.createElement('div');
      row.className = 'find-row';
      const main = document.createElement('div');
      main.className = 'find-row-main';
      const name = document.createElement('div');
      name.className = 'find-row-name';
      name.textContent = cleanText(stop.name) || 'Unnamed';
      const sub = document.createElement('div');
      sub.className = 'find-row-sub';
      sub.textContent = [cleanText(stop.address), cleanText(stop.city), cleanText(stop.state)]
        .filter(Boolean).join(' · ') || 'no address';
      main.append(name, sub);
      if (cleanText(stop.source_url)) {
        const src = document.createElement('div');
        src.className = 'nightly-src';
        const a = document.createElement('a');
        a.href = stop.source_url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'source';
        src.appendChild(a);
        main.appendChild(src);
      }
      // The scout can offer the same stop two mornings running - its rotation is
      // read from git history, not from the table - so an already-added stop is
      // marked rather than offered again.
      const dupe = state.waypoints.find((w) =>
        cleanText(w.name).toLowerCase() === cleanText(stop.name).toLowerCase()
        && cleanText(w.city).toLowerCase() === cleanText(stop.city).toLowerCase());
      if (dupe) {
        row.classList.add('is-dupe');
        const flag = document.createElement('div');
        flag.className = 'find-row-dupe';
        flag.textContent = 'Already in the table as WPID ' + dupe.wpid;
        main.appendChild(flag);
      }
      row.append(main, mkBtn('Open', 'Open this candidate as an unsaved draft', () => {
        closeNightlyDialog();
        openWaypointEditor(null);
        Object.assign(wpEdit.row, {
          name: cleanText(stop.name), city: cleanText(stop.city), state: cleanText(stop.state),
          zip: cleanText(stop.zip), address: cleanText(stop.address),
          description: cleanText(stop.description), source_url: cleanText(stop.source_url)
        });
        wpEdit.dirty = true;
        renderWaypointForm();
        wpNote('From this morning\'s scout run - check it, then press Create.', 'busy');
      }));
      return row;
    }

    // --- suggest an order -----------------------------------------------------

    // Geometry, applied to THE PATH - not to waypoints.walk_order, which is a
    // per-city hint that predates paths and is not a path's order. The path's
    // order is path_stops.ord, and it is what this rewrites (and leaves unsaved
    // so you can look at it first).
    function suggestPathOrder() {
      const geo = window.TgbWaypointGeo;
      if (!geo || !state.pathId) return;
      const located = [];
      const unplaced = [];
      state.stops.forEach((id) => {
        const w = wpById(id);
        const at = w && pointOf(w);
        if (at) located.push({ id: String(id), lat: at.lat, lon: at.lon });
        else unplaced.push(String(id));
      });
      if (located.length < 3) {
        setStatus('Needs at least three located stops to be worth reordering.', 'error');
        return;
      }
      const result = geo.suggestWalk(located);
      // Unplaced stops keep their relative order and sink to the end: they were
      // never part of the walk being solved, and dropping them would lose them.
      state.stops = result.order.map((i) => located[i].id).concat(unplaced);
      markDirty();
      setStatus('Reordered ' + located.length + ' stops - ' + geo.formatWalkDistance(result.metres)
        + (unplaced.length ? ' · ' + unplaced.length + ' unlocated stop(s) left at the end' : '')
        + '. Press Save to keep it.', 'success');
    }

    // --- editing the order ----------------------------------------------------

    function markDirty() { state.dirty = true; syncPathStopsForOpenPath(); renderAll(); }

    function moveStop(from, to) {
      if (to < 0 || to >= state.stops.length) return;
      const [row] = state.stops.splice(from, 1);
      state.stops.splice(to, 0, row);
      markDirty();
    }

    // A REPEAT IS ALLOWED. This used to return early when the place was already
    // on the path, matching the (tour_id, wpid) primary key that refused it; the
    // key is now (tour_id, ord), so a loop can end where it began.
    function addStop(wpid) {
      state.stops.push(String(wpid));
      markDirty();
    }

    // Removing a stop takes it OFF THE PATH and leaves the waypoint alone. That
    // is the whole reason these are two tables: a place is not deleted because
    // one walk stopped visiting it.
    function removeStop(i) {
      state.stops.splice(i, 1);
      markDirty();
    }

    // The list BODY is a drop target, not only its rows. Two cases need it and
    // both are common: a path with no stops yet has no row to aim at, and the
    // gap under the last row is where people naturally drop something meant to
    // go on the end. Bound once at startup; the rows are rebuilt every render
    // and this element is not.
    function wirePathDropZone() {
      const box = el('pathStops');
      if (!box) return;
      box.addEventListener('dragover', (e) => {
        if (!dragFrom || !state.pathId) return;
        // A row under the cursor is a more precise target and owns the drop.
        if (e.target.closest && e.target.closest('.stop')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        box.classList.add('is-drop-zone');
      });
      box.addEventListener('dragleave', (e) => {
        if (e.target === box) box.classList.remove('is-drop-zone');
      });
      box.addEventListener('drop', (e) => {
        if (!dragFrom || !state.pathId) return;
        if (e.target.closest && e.target.closest('.stop')) return;
        e.preventDefault();
        box.classList.remove('is-drop-zone');
        const changed = dragKind === 'pool'
          ? insertStop(dragFrom, state.stops.length)
          : moveStop(dragIdx, state.stops.length);
        dragFrom = null;
        dragKind = null;
        dragIdx = -1;
        if (changed) markDirty();
      });
    }

    let dragFrom = null;
    // 'stop' = already on the path, so the drop is a REORDER. 'pool' = coming
    // from the catalogue, so the drop is an INSERT. Without this the two look
    // identical at the drop target: both are a wpid and a position.
    let dragKind = null;
    // Which POSITION on the path is being dragged, for a 'stop' drag. -1 for a
    // library row, which has no position yet.
    let dragIdx = -1;

    // THE WHOLE ROW IS THE GRIP NOW, not only the handle.
    //
    // Handle-only was a deliberate call and it protected one real thing: a
    // draggable element cannot have its text selected in Chrome, and copying a
    // stop's ADDRESS is something people do to these rows. But a 12px glyph is
    // not a discoverable target -- reaching for the row and getting nothing is
    // the same as the feature not existing, which is exactly how it read.
    //
    // Both, then: the row drags, and pressing on the address line turns
    // dragging off for the duration of that press so the text stays selectable.
    // The handle stays as the visual affordance -- it is what tells you the row
    // can be picked up at all.
    function wireDrag(handle, row, kind) {
      row.draggable = true;

      // Buttons must not start a drag: a press on Edit or Add that turns into a
      // two-pixel wobble becomes a drag instead of a click.
      row.addEventListener("pointerdown", (e) => {
        const onControl = e.target.closest && e.target.closest('button, a, input, select, textarea');
        const onText = e.target.closest && e.target.closest('.stop-meta');
        row.draggable = !(onControl || onText);
      });
      // Restore, or the row stays undraggable after one address selection.
      row.addEventListener('pointerup', () => { row.draggable = true; });
      row.addEventListener('mouseleave', () => { row.draggable = true; });

      row.addEventListener('dragstart', (e) => {
        dragFrom = row.dataset.wpid;
        dragKind = kind || 'stop';
        // Only meaningful for a row already on the path; the library has no
        // position to move from.
        dragIdx = row.dataset.idx === undefined ? -1 : Number(row.dataset.idx);
        row.classList.add('is-dragging');
        document.body.classList.add('is-dragging-wp');
        e.dataTransfer.effectAllowed = 'move';
        // Firefox refuses to start a drag unless something is set.
        try { e.dataTransfer.setData('text/plain', dragFrom); } catch (_) {}
      });
      row.addEventListener('dragend', () => {
        row.draggable = true;
        dragFrom = null;
        dragKind = null;
        dragIdx = -1;
        document.body.classList.remove('is-dragging-wp');
        el('pathStops').classList.remove('is-drop-zone');
        document.querySelectorAll('.stop').forEach((n) => {
          n.classList.remove('is-dragging', 'drop-before', 'drop-after');
        });
      });
    }

    // TWO OPERATIONS, NOT ONE, and which you get depends on where the row came
    // from. A place may now appear more than once on a path, so "is it already
    // on the list" can no longer decide: dragging from the LIBRARY always adds a
    // copy, dragging a row already ON the path always moves that row.
    // Both return false when nothing would change, so the caller can leave the
    // list alone rather than marking it dirty for no reason.
    function insertStop(wpid, at) {
      state.stops.splice(Math.max(0, Math.min(at, state.stops.length)), 0, String(wpid));
      return true;
    }

    function moveStop(from, at) {
      if (!(from >= 0 && from < state.stops.length)) return false;
      if (from === at || from + 1 === at) return false;
      const [moved] = state.stops.splice(from, 1);
      if (from < at) at -= 1;
      state.stops.splice(Math.max(0, Math.min(at, state.stops.length)), 0, moved);
      return true;
    }

    function wireDropTarget(row) {
      row.addEventListener('dragover', (e) => {
        // The test is the ROW, not the wpid: with repeats allowed, the other
        // copy of the same place is a legitimate target to drop beside.
        if (!dragFrom) return;
        if (dragKind === 'stop' && Number(row.dataset.idx) === dragIdx) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Above or below the midpoint decides which side of this row it lands.
        const box = row.getBoundingClientRect();
        const after = (e.clientY - box.top) > box.height / 2;
        row.classList.toggle('drop-after', after);
        row.classList.toggle('drop-before', !after);
      });
      row.addEventListener('dragleave', () => row.classList.remove('drop-before', 'drop-after'));
      row.addEventListener('drop', (e) => {
        if (!dragFrom) return;
        e.preventDefault();
        const after = row.classList.contains('drop-after');
        row.classList.remove('drop-before', 'drop-after');
        // Read the target off the ROW's position, never indexOf: with repeats
        // allowed, indexOf finds the first copy and would aim at the wrong one.
        const target = Number(row.dataset.idx) + (after ? 1 : 0);
        const changed = dragKind === 'pool'
          ? insertStop(dragFrom, target)
          : moveStop(dragIdx, target);
        dragFrom = null;
        dragKind = null;
        dragIdx = -1;
        if (changed) markDirty();
      });
    }

    // --- writing --------------------------------------------------------------

    // Delete-then-insert for the whole path, not a diff. The path is at most a
    // dozen rows, positions shift wholesale when you move one, and a partial
    // failure that leaves two stop 3s is worse than redoing the lot. The delete
    // and the insert are separate requests, so a crash between them empties the
    // path - which is visible and fixable, unlike a silently wrong order.
    async function saveOrder() {
      if (!state.pathId) return;
      const btn = el('saveBtn');
      btn.disabled = true;
      setStatus('Saving order...');
      try {
        await ensureFreshSession();
        const del = await fetch(restUrl('path_stops', { tour_id: 'eq.' + state.pathId }), {
          method: 'DELETE', headers: authHeaders()
        });
        if (!del.ok) throw new Error(await readError(del));
        if (state.stops.length) {
          const body = state.stops.map((wpid, i) => ({
            tour_id: state.pathId, wpid: Number(wpid), ord: i + 1
          }));
          const ins = await fetch(restUrl('path_stops', {}), {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(body)
          });
          if (!ins.ok) throw new Error(await readError(ins));
        }
        state.dirty = false;
        renderAll();
        setStatus('Saved ' + state.stops.length + ' stop' + (state.stops.length === 1 ? '' : 's') + '.', 'success');
      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Could not save the order.', 'error');
        renderAll();
      }
    }

    async function savePathField(field, value) {
      const path = currentPath();
      if (!path) return;
      const patch = {};
      patch[field] = cleanText(value) || null;
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('paths', { tour_id: 'eq.' + state.pathId }), {
          method: 'PATCH',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(patch)
        });
        if (!res.ok) throw new Error(await readError(res));
        path[field] = patch[field];
        // Changing the city changes the pool and the map's candidates with it,
        // so this is a full render, not just the picker's label.
        renderAll();
        setStatus('Saved.', 'success');
      } catch (err) {
        setStatus(err.message || 'Could not save that.', 'error');
      }
    }

    // Same readable shape the importer builds, and to the SECOND: to the minute,
    // two paths made for one city in the same minute collide on the id and the
    // second silently merges into the first. That has already happened once in
    // this table - it produced a twenty-stop "loop".
    function makePathId(city, shape) {
      const slug = cleanText(city).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'path';
      const d = new Date();
      const p = (n, w) => String(n).padStart(w || 2, '0');
      const stamp = d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate())
        + '-' + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds());
      return slug + '-' + (cleanText(shape) || 'loop') + '-' + stamp;
    }

    // The dialog is static markup, so the city control is attached once and
    // lives for the page - attach() keeps its controller forever, which is
    // right for a form and wrong for a list that rerenders.
    let newPathCityCtl = null;
    function openNewPathDialog() {
      const dlg = el('newPathDlg');
      const shape = el('newPathShape');
      if (!shape.options.length) {
        SHAPES.forEach((s) => {
          const o = document.createElement('option');
          o.value = s.key;
          o.textContent = s.label;
          shape.appendChild(o);
        });
      }
      if (!newPathCityCtl && window.TgbCities) {
        newPathCityCtl = window.TgbCities.attach(el('newPathCity'), {
          // Admin surface: a venue-only city is hidden from the public rails but
          // is exactly where a path might be built, so show it (grey).
          includeIgnored: true,
          authHeaders: authHeaders,
          allOption: 'Pick a city',
          onChange: previewPathId
        });
      }
      el('newPathName').value = '';
      shape.value = 'loop';
      // NEW takes the city from the picker in the bar - that is the city you
      // are looking at, and on "Every city" it falls back to the open path's.
      // The option values are the CANONICAL strings ("Miami, Florida"), so the
      // bare name has to be matched back through cityNameOf rather than
      // compared directly - and only after load() resolves, or the value is set
      // against a select with no options yet and silently stays blank.
      const open = (state.cityFilter || pathCity()).toLowerCase();
      const preselect = () => {
        const rows = (window.TgbCities && window.TgbCities.all()) || [];
        const guess = open
          ? (rows.find((r) => cityNameOf(r.city).toLowerCase() === open) || {}).city
          : '';
        el('newPathCity').value = guess || '';
        previewPathId();
      };
      dlg.classList.add('is-open');
      el('newPathName').focus();
      if (window.TgbCities) window.TgbCities.load().then(preselect).catch(preselect);
      else preselect();
    }

    function closeNewPathDialog() { el('newPathDlg').classList.remove('is-open'); }

    // Show the id before it is committed. It is the one field on this page that
    // can never be edited afterwards, so it should not be a surprise.
    function previewPathId() {
      const city = cityNameOf(el('newPathCity').value);
      el('newPathShapeNote').textContent = shapeBlurb(el('newPathShape').value);
      el('newPathIdNote').textContent = city
        ? 'Path id: ' + makePathId(city, el('newPathShape').value) + ' (permanent)'
        : 'Pick a city to see the path id.';
    }

    async function newPath() {
      const city = cityNameOf(el('newPathCity').value);
      if (!city) { el('newPathCity').focus(); return; }
      const title = cleanText(el('newPathName').value);
      const shape = el('newPathShape').value || 'loop';
      const tourId = makePathId(city, shape);
      closeNewPathDialog();
      try {
        await ensureFreshSession();
        const res = await fetch(restUrl('paths', {}), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: JSON.stringify({ tour_id: tourId, city: city, shape: shape, title: title || null })
        });
        if (!res.ok) throw new Error(await readError(res));
        const [row] = await res.json();
        state.paths.push(row);
        state.paths.sort((a, b) => a.tour_id.localeCompare(b.tour_id));
        state.pathId = row.tour_id;
        state.stops = [];
        state.dirty = false;
        // Follow the new path rather than hiding it behind the old filter.
        state.cityFilter = cityNameOf(row.city);
        syncUrl();
        renderAll();
        setStatus('New path ' + row.tour_id + '.', 'success');
      } catch (err) {
        setStatus(err.message || 'Could not create the path.', 'error');
      }
    }

    async function deletePath() {
      const path = currentPath();
      if (!path) return;
      const name = cleanText(path.title) || path.tour_id;
      if (!window.confirm('Delete the path "' + name + '"?\n\nIts ' + state.stops.length
        + ' waypoint(s) are NOT deleted - they stay in the catalogue and on any other path.')) return;
      try {
        await ensureFreshSession();
        // path_stops has on delete cascade, so the membership goes with it.
        const res = await fetch(restUrl('paths', { tour_id: 'eq.' + path.tour_id }), {
          method: 'DELETE', headers: authHeaders()
        });
        if (!res.ok) throw new Error(await readError(res));
        state.paths = state.paths.filter((r) => r.tour_id !== path.tour_id);
        // Stay in the city if it still has a path; otherwise the filter would
        // name a city with nothing in it while another city's path is open.
        const sameCity = pathsInCity(state.cityFilter);
        const next = sameCity[0] || state.paths[0] || null;
        state.pathId = next ? next.tour_id : '';
        state.cityFilter = next ? cityNameOf(next.city) : '';
        syncUrl();
        await loadStops();
        setStatus('Deleted ' + name + '.', 'success');
      } catch (err) {
        setStatus(err.message || 'Could not delete the path.', 'error');
      }
    }

    // Returns false when the unsaved-order guard turned the move down, so a
    // caller that changed something else first (the city picker) can put its
    // own control back rather than leaving the two disagreeing.
    async function openPath(tourId) {
      if (state.dirty && !window.confirm('This path has unsaved order changes. Leave them?')) {
        el('pathSelect').value = state.pathId;
        return false;
      }
      state.pathId = tourId;
      // The pool follows the path's own city, so there is nothing to sync here.
      syncUrl();
      await loadStops();
      return true;
    }

    // Picking a city narrows the path picker. If the open path is not in that
    // city, the first one there is opened - a picker that filters a list but
    // leaves a hidden row selected shows a path the list denies having.
    // Picking a city fills the library and narrows the path picker. If the open
    // path is not in that city, the first one there is opened - a picker that
    // filters a list but leaves a hidden row selected shows a path the list
    // denies having.
    //
    // A CITY WITH NO PATHS IS A VALID CHOICE and no longer snaps back to the
    // previous one. It used to, because the city existed only to find a path;
    // it now fills the library too, and "show me this city's waypoints so I can
    // build its first path" is the whole point of choosing an empty one.
    async function pickCity(city) {
      const previous = state.cityFilter;
      state.cityFilter = cleanText(city);
      const rows = pathsInCity(state.cityFilter);
      if (!rows.some((r) => r.tour_id === state.pathId)) {
        const moved = await openPath(rows[0] ? rows[0].tour_id : '');
        if (!moved && rows.length) { state.cityFilter = previous; renderAll(); return; }
      }
      renderAll();
    }

    // --- wiring ---------------------------------------------------------------

    const adminAuth = window.TgbMcAdminAuth.create({
      supabaseConfig: SUPABASE_CONFIG,
      onAuthorized: async () => {
        state.authed = true;
        setStatus('Loading paths...');
        try {
          await loadAll();
          fillCityList();
          renderAll();
          setStatus('');
        } catch (err) {
          console.error(err);
          setStatus(err.message || 'Could not load paths.', 'error');
        }
      },
      onSignedOut: () => {
        state.authed = false;
        state.paths = [];
        state.stops = [];
        state.waypoints = [];
        renderAll();
        setStatus('Sign in with an admin account.');
      }
    });
    if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

    el('cityFilter').addEventListener('change', (e) => pickCity(e.target.value));
    el('pathSelect').addEventListener('change', (e) => openPath(e.target.value));
    el('newPathCreate').addEventListener('click', newPath);
    el('newPathCancel').addEventListener('click', closeNewPathDialog);
    el('newPathShape').addEventListener('change', previewPathId);
    el('newPathCity').addEventListener('change', previewPathId);
    el('newPathDlg').addEventListener('click', (e) => {
      if (e.target === el('newPathDlg')) closeNewPathDialog();
    });
    el('newPathName').addEventListener('keydown', (e) => { if (e.key === 'Enter') newPath(); });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (el('newPathDlg').classList.contains('is-open')) closeNewPathDialog();
      else if (el('aiDlg').classList.contains('is-open')) closeAiDialog();
      else if (el('nightlyDlg').classList.contains('is-open')) closeNightlyDialog();
      else if (el('findDlg').classList.contains('is-open') && !findState.busy) closeFindDialog();
      else if (wpDlgOpen() && !wpEdit.busy) closeWaypointEditor();
    });
    el('saveBtn').addEventListener('click', saveOrder);
    el('deletePathBtn').addEventListener('click', deletePath);
    el('poolSearch').addEventListener('input', (e) => { state.poolQuery = e.target.value; renderPool(); });
    // FIND ONLINE, WITH AI AND + WAYPOINT LOST THEIR BUTTONS (2026-08-18).
    // The manual add survives as the ADD bar's Waypoint Manual, which calls the
    // same openWaypointEditor(null).
    //
    // openFindDialog and openAiDialog and their dialogs are LEFT IN PLACE and
    // are now unreachable from this page. They are not dead by accident: the
    // world search is the only thing here that can pull a place out of
    // OpenStreetMap, and the AI dialog is how a human gets the import SQL
    // prompts for a city. Both are worth a button somewhere. If they are not
    // coming back, delete openFindDialog, openAiDialog, #findDlg, #aiDlg and
    // the search half of waypoint-geo.js together rather than leaving a room
    // full of code nothing can call.
    el('wpFindBtn').addEventListener('click', () => {
      // Seeded with the name AND the city: "Freedom Tower" alone matches one in
      // Manhattan, and the geocoder has no idea which town you are working in.
      const seed = [cleanText(wpEdit.row && wpEdit.row.name), cleanText(wpEdit.row && wpEdit.row.city)]
        .filter(Boolean).join(' ');
      openFindDialog(seed);
    });
    el('aiPull').addEventListener('change', (e) => { aiState.pull = e.target.value; renderAiInputs(); });
    el('aiBuildBtn').addEventListener('click', buildAiPrompt);
    el('aiCopyBtn').addEventListener('click', copyAiPrompt);
    el('aiCloseBtn').addEventListener('click', closeAiDialog);
    el('aiDlg').addEventListener('click', (e) => { if (e.target === el('aiDlg')) closeAiDialog(); });
    el('nightlyBtn').addEventListener('click', openNightlyDialog);
    el('nightlyCloseBtn').addEventListener('click', closeNightlyDialog);
    el('nightlyDlg').addEventListener('click', (e) => { if (e.target === el('nightlyDlg')) closeNightlyDialog(); });
    el('findGoBtn').addEventListener('click', runFind);
    el('findCloseBtn').addEventListener('click', closeFindDialog);
    el('findBlankBtn').addEventListener('click', () => { closeFindDialog(); openWaypointEditor(null); });
    el('findQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter') runFind(); });
    el('findDlg').addEventListener('click', (e) => {
      if (e.target === el('findDlg') && !findState.busy) closeFindDialog();
    });
    el('suggestOrderBtn').addEventListener('click', suggestPathOrder);
    el('wpSaveBtn').addEventListener('click', saveWaypoint);
    el('wpFillBtn').addEventListener('click', fillWaypoint);
    el('wpLocateBtn').addEventListener('click', locateWaypoint);
    el('wpMapsBtn').addEventListener('click', openWaypointInMaps);
    el('wpDupeBtn').addEventListener('click', duplicateWaypointRow);
    el('wpArchiveBtn').addEventListener('click', toggleWaypointArchived);
    el('wpDeleteBtn').addEventListener('click', deleteWaypointRow);
    el('wpCloseBtn').addEventListener('click', () => closeWaypointEditor());
    el('wpDlg').addEventListener('click', (e) => {
      // Backdrop only, and never mid-write: a stray click while Fill is running
      // would leave the request going with nothing to receive it.
      if (e.target === el('wpDlg') && !wpEdit.busy) closeWaypointEditor();
    });
    el('mapShowPool').addEventListener('change', (e) => { mapState.showPool = e.target.checked; renderMap(); });

    // An unsaved order is a few minutes of dragging. Losing it to a stray tab
    // close is the one mistake this page can make on your behalf.
    window.addEventListener('beforeunload', (e) => {
      if (!state.dirty && !wpEdit.dirty) return;
      e.preventDefault();
      e.returnValue = '';
    });

    // The new-waypoint editor, opened as an unsaved draft. Same call the
    // library's own + Waypoint makes -- the two are the same action from two
    // places, and when the ADD bar takes over that button goes rather than the
    // handler being written twice.
    el('addWaypointBtn').addEventListener('click', () => openWaypointEditor(null));

    // STILL A WIREFRAME PLACEHOLDER. It says so rather than doing nothing at
    // all: a button that swallows a click with no response is indistinguishable
    // from one that is broken. Replace when the action is decided.
    el('addPathBtn').addEventListener('click', openNewPathDialog);
    el('pathBotBtn').addEventListener('click', () => setStatus('not wired yet'));

    // The path list is a drop target for the whole of its area, not only its
    // rows. Bound once, before anything renders into it.
    wirePathDropZone();

    // Nothing paints until this runs: the body is mc-auth-protected, and
    // admin-shell.css hides every child except the sign-in root that init()
    // creates. Without it the page is a blank screen with no way in.
    adminAuth.init();
  </script>
</body>
</html>
