<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOP BUILDER | THE GAME BUREAU</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    :root {
      --paper-base: #fefef9;
      --bic-blue: #2d4880;
      --bic-blue-rgb: 45, 72, 128;
      --paper-shadow: rgba(var(--bic-blue-rgb), 0.12);
      --paper-line-minor: rgba(var(--bic-blue-rgb), 0.22);
      --paper-line-major: rgba(190, 55, 55, 0.24);
      --bic-red: #c23737;
      --ink: var(--bic-blue);
      --muted: rgba(var(--bic-blue-rgb), 0.72);
      --line: rgba(var(--bic-blue-rgb), 0.18);
      --paper: rgba(255,255,255,0.92);
      --accent: var(--bic-blue);
      --danger: #a03f2d;
      --success: #2f6b3d;
      --stack-gap: 14px;
      --panel-radius: 10px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        linear-gradient(var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-minor) 1px, transparent 1px),
        linear-gradient(var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line-major) 1px, transparent 1px),
        linear-gradient(180deg, var(--paper-base) 0%, rgba(var(--bic-blue-rgb), 0.05) 100%);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px, 100% 100%;
      color: var(--ink);
    }

    

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { background: rgba(var(--bic-blue-rgb), 0.08); border-color: var(--accent); }

    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .btn.primary:hover { background: rgba(var(--bic-blue-rgb), 0.85); }

    .btn.warn { color: var(--danger); border-color: rgba(160,63,45,0.45); }

    .btn.warn:hover { background: rgba(160,63,45,0.08); border-color: var(--danger); }

    .btn.small { min-height: 34px; padding: 0 10px; font-size: 0.76rem; }

    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .btn[aria-current="page"]:disabled {
      border-color: rgba(var(--bic-blue-rgb), 0.12);
      background: rgba(var(--bic-blue-rgb), 0.08);
      color: rgba(var(--bic-blue-rgb), 0.46);
      opacity: 1;
      pointer-events: none;
    }

    

    

    

    

    

    .field { display: grid; gap: 5px; }

    

    .field label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select,
    .step-block select {
      width: 100%;
      min-height: 38px;
      padding: 9px 10px;
      border: 1px solid rgba(var(--bic-blue-rgb), 0.28);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      /* Without this every control falls back to the browser's default face,
         which is why they read as foreign next to the rest of the page. */
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .field input:hover,
    .field textarea:hover,
    .field select:hover,
    .step-block select:hover {
      border-color: rgba(var(--bic-blue-rgb), 0.45);
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus,
    .step-block select:focus {
      outline: none;
      border-color: var(--accent, var(--bic-blue));
      box-shadow: 0 0 0 3px rgba(var(--bic-blue-rgb), 0.14);
    }

    .field select,
    .step-block select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 30px;
      /* Caret drawn inline so it matches the ink colour on every platform. */
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%232d4880' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 11px center;
      background-size: 10px 6px;
      cursor: pointer;
    }

    .field select:disabled,
    .step-block select:disabled {
      background-color: rgba(var(--bic-blue-rgb), 0.05);
      color: var(--muted);
      cursor: default;
    }

    .field textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.5;
    }

    

    .field input.is-error:focus,
    .field textarea.is-error:focus,
    .field select.is-error:focus { outline-color: var(--danger); }

    

    

      

      

    /* ── Stock Room header lockup: gear watermark + THE GAME BUREAU eyebrow + big
       title + substat, matching /gifts/admin/. ── */
    .stockroom-head {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 72px;
      padding: 0 12px;
      margin: 0 0 var(--stack-gap);
    }

    .stockroom-head-lockup,
    .stockroom-head-status { position: relative; z-index: 1; }

    .stockroom-head-lockup { display: flex; align-items: center; gap: 12px; min-width: 0; }

    /* The gear art, mirrored — a faint watermark sunk into the page grid at the
       left of the header, bleeding off the left edge. */
    .stockroom-gear {
      position: absolute;
      top: 50%;
      left: -28px;
      transform: translateY(-50%) scaleX(-1);
      width: 184px;
      height: 184px;
      z-index: 0;
      pointer-events: none;
      overflow: visible;
    }

    .stockroom-gear .header-gear { fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .stockroom-gear .header-gear--large { stroke: rgba(var(--bic-blue-rgb), 0.15); }

    .stockroom-gear .header-gear--small { stroke: rgba(var(--bic-blue-rgb), 0.11); }

    .stockroom-gear .header-gear-body { fill: rgba(var(--bic-blue-rgb), 0.022); stroke-width: 3.4; }

    .stockroom-gear .header-gear-ring { fill: none; stroke-width: 3; }

    .stockroom-gear .header-gear-inner { fill: none; stroke-width: 2.4; }

    .stockroom-gear .header-gear-spoke { fill: rgba(var(--bic-blue-rgb), 0.06); stroke: none; }

    .stockroom-gear .header-gear-core { fill: rgba(var(--bic-blue-rgb), 0.05); stroke-width: 2.2; }

    .stockroom-gear .header-gear-bore { fill: none; stroke-width: 2; }

    .stockroom-gear .header-gear-crosshair { stroke: rgba(var(--bic-blue-rgb), 0.12); stroke-width: 1.4; }

    .stockroom-gear .header-gear-atmosphere,
    .stockroom-gear .header-gear-halo { display: none; }

    .stockroom-titlecol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    .stockroom-eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(var(--bic-blue-rgb), 0.9);
      text-shadow:
        0 0 3px var(--paper-base),
        0 0 3px var(--paper-base),
        0 0 5px var(--paper-base);
    }

    .stockroom-title {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .stockroom-titlecol .stockroom-substat {
      margin: 3px 0 0;
      min-height: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .stockroom-substat:empty { display: none; }

    .stockroom-substat.error { color: var(--danger); }

    .stockroom-substat.success { color: var(--success); }

    .stockroom-head-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

      .stockroom-gear { display: none; }

      .stockroom-head { padding: 0 2px; gap: 10px; min-height: 0; }

      .stockroom-title { font-size: 1.4rem; }
    .app {
      width: min(var(--mc-shell-width, 1180px), calc(100vw - 24px));
      margin: 0 auto;
      padding: 18px 0 60px;
    }

    /* One block per step, stacked, so 1 and 2 read top to bottom rather than as
       one crowded row. The actions sit with step 2 because nothing can be saved
       until a city is chosen. */
    .step-block {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      margin: 0 0 10px;
      background: #eef0f4;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .step-block + .step-block { margin-bottom: 16px; }

    /* The create buttons live outside the grey block: they act on the catalog
       behind a step, not on the step itself. */
    .step-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      width: 100%;
      margin: 0 0 10px;
    }

    .step-row .step-block { flex: 1 1 auto; margin: 0; }
    /* The shared control rule sets width:100%, which would push the select onto
       its own line under the numeral. Inside a step it shares the row instead. */
    .step-block select { flex: 1 1 260px; width: auto; max-width: 520px; }
    .step-row > .btn { flex: 0 0 auto; align-self: center; white-space: nowrap; }

    .ch-backdrop[hidden],
    .ch-dialog[hidden] { display: none; }

    .ch-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1400;
      background: rgba(17, 24, 32, 0.55);
    }

    .ch-dialog {
      position: fixed;
      z-index: 1401;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      gap: 10px;
      width: min(460px, calc(100vw - 32px));
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel, #fff);
      box-shadow: 0 24px 60px rgba(17, 24, 32, 0.35);
    }

    .ch-dialog h3 {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ch-dialog .field { display: grid; gap: 4px; }
    .ch-dialog .field > span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ch-dialog textarea { min-height: 70px; resize: vertical; }
    .ch-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* The four steps, in order: the city gates everything, then the two halves of
       the stop, then the action. The numeral is the instruction — it replaces a
       paragraph explaining what to do first. */
    .step-num {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Inside a stop row the numeral sits on the field label, so steps 3 and 4
       read as a continuation of 1 and 2 up in the bar rather than a new list. */
    .field > span.field-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field .step-num {
      width: 24px;
      height: 24px;
      font-size: 0.9rem;
    }

    .command-bar-label {
      flex: 0 0 auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bar-note { color: var(--muted); font-size: 0.8rem; }

    

    

    

    

    
    

    

    

    /* One stop. The ordinal is the anchor on the left; everything else is the
       two choices that make it a stop. */
    

    

    
    
    
    

    
    
    

    

    

    .chip.warn { border-color: rgba(194, 55, 55, 0.4); background: rgba(194, 55, 55, 0.08); color: var(--bic-red); }
    .chip.ok { border-color: rgba(39, 103, 64, 0.35); background: rgba(39, 103, 64, 0.08); color: #276740; }

    

    
    
    
    

    

    .status { margin: 0; color: var(--muted); font-size: 0.8rem; }
    .status.is-error { color: #a03f2d; font-weight: 800; }
    .status.is-success { color: #276740; font-weight: 800; }

    @media (max-width: 720px) {
      
      
      
      .step-block select { flex: 1 1 100%; max-width: none; }
    }

  </style>

<body class="mc-auth-protected">
  <main class="app">
    <!-- Shared admin nav. Looks like the public site nav; every button goes to
         that section's ADMIN page, and the padlock at the end is sign-in /
         sign-out. See mc/js/admin-site-nav.js. -->
    <header class="admin-site-nav" data-admin-site-nav></header>
    <script src="/mc/js/admin-site-nav.js"></script>

    <!-- Room hero, same as the four admin rooms: .room-head in admin-shell.css.
         No gear here — the nav above carries the only one now. No eyebrow — it
         already says THE GAME BUREAU. The Waypoints link stays: it is the
         other half of a stop, and the shared nav has no route to it. -->
    <div class="room-head">
      <div class="room-titlecol">
        <h1 class="room-title" id="pageTitle">Stop Builder</h1>
        <p class="room-substat" id="pageStatus" aria-live="polite"></p>
      </div>
      <div class="room-head-actions">
        <a class="btn" href="/mc/data/waypoints.html" title="The catalog of real-world places a stop can use">Waypoints</a>
      </div>
    </div>

    <!-- City first, and it gates everything after it. A stop belongs to the city,
         so every game set there shares it — see the game_stops view. -->
    <div class="step-row">
      <div class="step-block" aria-label="Choose a city">
        <span class="step-num">1</span>
        <span class="command-bar-label">City</span>
        <select id="citySelect" aria-label="Choose a city" disabled>
          <option value="">Sign in to load…</option>
        </select>
      </div>
      <button class="btn small" id="newCityBtn" type="button" disabled title="Add a city to the shared catalog (public.cities)">New city</button>
    </div>

    <div class="step-row">
      <div class="step-block" aria-label="Choose a waypoint">
        <span class="step-num">2</span>
        <span class="command-bar-label">Waypoint</span>
        <select id="waypointSelect" aria-label="Choose a waypoint" disabled>
          <option value="">Choose a city first…</option>
        </select>
        <span class="bar-note" id="waypointNote"></span>
      </div>
      <button class="btn small" id="newWaypointBtn" type="button" title="Open Waypoints to add a place, then come back — this list refreshes itself">New waypoint</button>
    </div>

    <div class="step-row">
      <div class="step-block" aria-label="Choose a challenge">
        <span class="step-num">3</span>
        <span class="command-bar-label">Challenge</span>
        <select id="challengeSelect" aria-label="Choose a challenge" disabled>
          <option value="">Choose a city first…</option>
        </select>
      </div>
      <button class="btn small" id="newChallengeBtn" type="button" disabled title="Write a new challenge">New challenge</button>
    </div>

    <div class="step-block" aria-label="Add the stop">
      <span class="step-num">4</span>
      <span class="command-bar-label">Add stop</span>
      <span class="bar-note" id="addNote"></span>
      <button class="btn small primary" id="addStopBtn" type="button" disabled title="Choose a waypoint first">Add</button>
    </div>

    <!-- Writing a challenge, in the smallest form that produces a usable row.
         The catalog editor was removed on 2026-07-30, so without this there is
         no way to create one at all. -->
    <div class="ch-backdrop" id="chBackdrop" hidden></div>
    <section class="ch-dialog" id="chDialog" hidden role="dialog" aria-modal="true" aria-labelledby="chTitle">
      <h3 id="chTitle">New challenge</h3>
      <label class="field"><span>Name</span><input type="text" id="chName" autocomplete="off" placeholder="Admin label, e.g. Count the columns"></label>
      <label class="field"><span>Kind</span>
        <select id="chKind">
          <option value="question">question</option>
          <option value="minigame">minigame</option>
          <option value="photo">photo</option>
          <option value="freeform">freeform</option>
        </select>
      </label>
      <label class="field"><span>Prompt</span><textarea id="chPrompt" placeholder="What the player reads at the stop"></textarea></label>
      <label class="field" id="chAnswerField"><span>Answer</span><input type="text" id="chAnswer" autocomplete="off"></label>
      <p class="status" id="chStatus"></p>
      <div class="ch-actions">
        <button class="btn small" id="chCancel" type="button">Cancel</button>
        <button class="btn small primary" id="chSave" type="button">Create</button>
      </div>
    </section>
  </main>

  <script src="/mc/js/admin-auth.js"></script>

  <script>
    (function () {
      'use strict';

      // Stop Builder — assembles Stops out of three catalogs.
      //
      //   games       what the stop belongs to
      //   waypoints   the place itself (mc/data/waypoints.html edits these)
      //
      // One stop can be added to several games at once, which is the point of the
      // checkbox list in step 2.
      //
      // There is no route ordering on this page. stops.ord still exists and is
      // still what games/admin/profiles.html reads (order=ord.asc), so a new stop is
      // given the next free number automatically; nothing here reorders them.
      //
      // Writes public.stops, which superseded public.maps on 2026-07-30.

      var SUPABASE_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        publishableKey: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
      };

      var citySelect = document.getElementById('citySelect');
      var addStopBtn = document.getElementById('addStopBtn');
      var waypointSelect = document.getElementById('waypointSelect');
      var challengeSelect = document.getElementById('challengeSelect');
      var newChallengeBtn = document.getElementById('newChallengeBtn');
      var newWaypointBtn = document.getElementById('newWaypointBtn');
      var waypointNote = document.getElementById('waypointNote');
      var pageStatus = document.getElementById('pageStatus');

      var state = {
        cities: [], waypoints: [], challenges: [], stops: [],
        city: '',
        // The stop being composed in blocks 3 and 4.
        pickWaypoint: '', pickChallenge: '',
        busy: false
      };

      function text(v) { return String(v == null ? '' : v).trim(); }

      function setStatus(message, tone) {
        if (!pageStatus) return;
        pageStatus.textContent = message || '';
        pageStatus.classList.toggle('is-error', tone === 'error');
        pageStatus.classList.toggle('is-success', tone === 'success');
      }

      // ── Supabase REST ──────────────────────────────────────────────────────
      function anonHeaders(extra) {
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + SUPABASE_CONFIG.publishableKey,
          Accept: 'application/json'
        }, extra || {});
      }

      function authHeaders(extra) {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        var token = session && session.access_token;
        if (!token) throw new Error('Sign in with an admin account.');
        return Object.assign({
          apikey: SUPABASE_CONFIG.publishableKey,
          Authorization: 'Bearer ' + token,
          Accept: 'application/json'
        }, extra || {});
      }

      function restUrl(path) { return SUPABASE_CONFIG.url + '/rest/v1/' + path; }

      // PostgREST caps a response at 1000 rows and truncates silently, so any
      // read of a whole table pages. waypoints is already past 1000.
      async function fetchAll(path) {
        var PAGE = 1000;
        var all = [];
        for (var from = 0; ; from += PAGE) {
          var res = await fetch(restUrl(path), {
            headers: anonHeaders({ Range: from + '-' + (from + PAGE - 1) }),
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Supabase ' + res.status + ' for ' + path.split('?')[0]);
          var rows = await res.json();
          if (!Array.isArray(rows)) throw new Error('Unexpected response for ' + path.split('?')[0]);
          all = all.concat(rows);
          if (rows.length < PAGE) return all;
        }
      }

      async function writeRow(method, path, body) {
        var res = await fetch(restUrl(path), {
          method: method,
          headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
          body: body === undefined ? undefined : JSON.stringify(body)
        });
        if (!res.ok) {
          var detail = await res.text().catch(function () { return ''; });
          throw new Error('Supabase ' + res.status + (detail ? ': ' + detail.slice(0, 200) : ''));
        }
        if (method === 'DELETE') return null;
        var rows = await res.json().catch(function () { return []; });
        var row = Array.isArray(rows) ? rows[0] : rows;
        // An INSERT/UPDATE that RLS filters out comes back 200 with an empty
        // array rather than an error, so a lapsed session would look like a save.
        if (!row) throw new Error('Nothing was written — sign in again and retry.');
        return row;
      }

      function friendlyError(error) {
        var message = (error && error.message) || 'Write failed.';
        if (/stops_city_waypoint_idx|duplicate key/i.test(message)) {
          return 'That waypoint is already a stop in this city. One place can only be used once per city.';
        }
        if (/PGRST205|does not exist|42P01/i.test(message)) {
          return 'The stops table is not there yet — run mc/supabase/migrations/2026073003_stops.sql.';
        }
        if (/violates foreign key/i.test(message)) {
          return 'That city, waypoint or challenge no longer exists. Refresh the page.';
        }
        return message;
      }

      // ── Labels ─────────────────────────────────────────────────────────────
      function waypointLabel(wp) {
        if (!wp) return '(unknown waypoint)';
        var name = text(wp.name) || ('Waypoint #' + wp.wpid);
        var addr = text(wp.address);
        return addr ? name + ' — ' + addr : name;
      }

      function challengeLabel(ch) {
        if (!ch) return '(no challenge)';
        return (text(ch.name) || 'Challenge #' + ch.id) + ' · ' + text(ch.kind);
      }

      function findChallenge(id) {
        for (var i = 0; i < state.challenges.length; i++) {
          if (String(state.challenges[i].id) === String(id)) return state.challenges[i];
        }
        return null;
      }

      function findWaypoint(id) {
        for (var i = 0; i < state.waypoints.length; i++) {
          if (String(state.waypoints[i].wpid) === String(id)) return state.waypoints[i];
        }
        return null;
      }

      // Cities come from the catalog now that games are not involved, so a city
      // added with New city is usable immediately.
      var ALL_CITIES = '*';

      function cityRow(slug) {
        for (var i = 0; i < state.cities.length; i++) {
          if (String(state.cities[i].slug) === String(slug)) return state.cities[i];
        }
        return null;
      }

      function cityLabel(slug) {
        var row = cityRow(slug);
        return row ? text(row.city) : String(slug || '');
      }

      // Waypoints are matched on the city NAME only. cities.city is
      // "Dallas, Texas" while waypoints.city is "Dallas" with the state in its
      // own column, so a whole-string compare would match nothing.
      function cityNameOf(str) {
        return text(String(str).split(',')[0]).toLowerCase();
      }

      function waypointsInCity() {
        if (!state.city) return [];
        if (state.city === ALL_CITIES) return state.waypoints.slice();
        var want = cityNameOf(cityLabel(state.city));
        return state.waypoints.filter(function (wp) { return cityNameOf(wp.city) === want; });
      }

      function stopsInCity() {
        if (!state.city || state.city === ALL_CITIES) return [];
        return state.stops.filter(function (s2) { return String(s2.city_slug) === String(state.city); });
      }

      // ── Load ───────────────────────────────────────────────────────────────
      async function loadAll() {
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) { resetAll(); return; }
        setStatus('Loading games, waypoints and stops…');
        try {
          var results = await Promise.all([
            fetchAll('cities?select=slug,city&order=city.asc'),
            fetchAll('waypoints?select=wpid,name,city,state,address&order=name.asc'),
            fetchAll('challenges?select=*&order=name.asc').catch(function () { return null; }),
            // Both new tables tolerate being absent so the page still works
            // against a database that has not run the migration yet.
            fetchAll('stops?select=*&order=city_slug.asc,ord.asc').catch(function () { return null; })
          ]);
          state.cities = results[0] || [];
          state.waypoints = results[1] || [];
          var missing = results[2] === null || results[3] === null;
          state.challenges = results[2] || [];
          state.stops = results[3] || [];
          populateCities();
          setControlsEnabled(true);
          render();
          setStatus(missing
            ? 'Cities and waypoints loaded, but public.stops / public.challenges are missing — run mc/supabase/migrations/2026073003_stops.sql.'
            : state.cities.length + ' cities · ' + state.waypoints.length + ' waypoints · ' + state.challenges.length + ' challenges',
            missing ? 'error' : '');
        } catch (error) {
          console.error(error);
          setControlsEnabled(false);
          setStatus(friendlyError(error), 'error');
        }
      }

      function resetAll() {
        state.cities = []; state.waypoints = []; state.challenges = []; state.stops = [];
        state.city = '';
        state.pickWaypoint = ''; state.pickChallenge = '';
        setControlsEnabled(false);
        if (citySelect) citySelect.innerHTML = '<option value="">Sign in to load…</option>';
        if (waypointSelect) { waypointSelect.innerHTML = '<option value="">Choose a city first…</option>'; waypointSelect.disabled = true; }
        if (addStopBtn) addStopBtn.disabled = true;
        setStatus('Sign in with an admin account.');
      }

      function setControlsEnabled(on) {
        if (citySelect) citySelect.disabled = !on;
        var ncb = document.getElementById('newCityBtn');
        if (ncb) ncb.disabled = !on;
        if (addStopBtn) addStopBtn.disabled = !on || !state.city;
      }

      function fillSelect(select, options, value, blankLabel) {
        select.innerHTML = '';
        var blank = document.createElement('option');
        blank.value = '';
        blank.textContent = blankLabel;
        select.appendChild(blank);
        options.forEach(function (opt) {
          var option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.label;
          select.appendChild(option);
        });
        select.value = options.some(function (o) { return o.value === value; }) ? value : '';
        return select.value;
      }

      function populateCities() {
        if (!citySelect) return;
        state.city = fillSelect(citySelect, state.cities.map(function (c) {
          return { value: String(c.slug), label: text(c.city) };
        }), state.city, 'Choose a city…');
      }

      // ── Dirty tracking ─────────────────────────────────────────────────────
      // ── Render ─────────────────────────────────────────────────────────────
      function render() {
        renderComposer();
      }

      // Blocks 3 and 4. Waypoints are narrowed to the chosen city and exclude
      // any already used by this game -- the unique index on
      // (game_id, waypoint_id) would reject those, so offering them could only
      // produce an error.
      function renderComposer() {
        var ready = !!state.city;
        if (waypointSelect) {
          // A waypoint already used in this city is left out: the unique index on
          // (city_slug, waypoint_id) would reject it, so offering it could only
          // produce an error.
          var used = Object.create(null);
          stopsInCity().forEach(function (s2) { used[String(s2.waypoint_id)] = true; });
          var free = waypointsInCity().filter(function (wp) { return !used[String(wp.wpid)]; });
          waypointSelect.disabled = !ready || state.busy || !free.length;
          state.pickWaypoint = fillSelect(waypointSelect, free.map(function (wp) {
            return { value: String(wp.wpid), label: waypointLabel(wp) };
          }), state.pickWaypoint, !ready ? 'Choose a city first…'
            : (free.length ? 'Choose a waypoint…' : 'Every waypoint in this city is already used'));
          if (waypointNote) {
            waypointNote.textContent = ready && !free.length && waypointsInCity().length
              ? 'Add more in Waypoints.' : '';
          }
        }
        if (challengeSelect) {
          challengeSelect.disabled = !ready || state.busy || !state.challenges.length;
          state.pickChallenge = fillSelect(challengeSelect, state.challenges.map(function (ch) {
            return { value: String(ch.id), label: challengeLabel(ch) };
          }), state.pickChallenge, !ready ? 'Choose a city first…'
            : (state.challenges.length ? 'Choose a challenge…' : 'Write one with New challenge'));
        }
        if (newChallengeBtn) newChallengeBtn.disabled = state.busy;
        if (addStopBtn) addStopBtn.disabled = state.busy || !state.pickWaypoint || !state.pickChallenge;
        syncAddNote();
      }

      function syncAddNote() {
        var note = document.getElementById('addNote');
        if (!note) return;
        var wp = findWaypoint(state.pickWaypoint);
        var ch = findChallenge(state.pickChallenge);
        note.textContent = (wp && ch && state.city)
          ? waypointLabel(wp) + ' + ' + (text(ch.name) || 'challenge') + ' → ' + cityLabel(state.city)
          : (!state.city ? 'Choose a city in step 1'
            : (!wp ? 'Choose a waypoint in step 2' : 'Choose a challenge in step 3'));
      }

      function emptyNode(message) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.textContent = message;
        return div;
      }

      function chip(label, tone) {
        var span = document.createElement('span');
        span.className = 'chip' + (tone ? ' ' + tone : '');
        span.textContent = label;
        return span;
      }

      function smallBtn(label, disabled, onClick) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn small';
        b.textContent = label;
        b.disabled = !!disabled || state.busy;
        b.addEventListener('click', onClick);
        return b;
      }

      function selectField(labelText, options, value, onChange, blankLabel, step) {
        var wrap = document.createElement('label');
        wrap.className = 'field';
        var label = document.createElement('span');
        if (step) {
          label.className = 'field-label-row';
          var num = document.createElement('span');
          num.className = 'step-num';
          num.textContent = String(step);
          var word = document.createElement('span');
          word.textContent = labelText;
          label.append(num, word);
        } else {
          label.textContent = labelText;
        }
        var select = document.createElement('select');
        var blank = document.createElement('option');
        blank.value = '';
        blank.textContent = blankLabel || 'Choose…';
        select.appendChild(blank);
        options.forEach(function (opt) {
          var option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.label;
          select.appendChild(option);
        });
        select.value = value || '';
        select.disabled = state.busy;
        select.addEventListener('change', function () { onChange(select.value); });
        wrap.append(label, select);
        return wrap;
      }

      // ── Stops ──────────────────────────────────────────────────────────────
      function nextKey() { return 'k' + (nextKey.n = (nextKey.n || 0) + 1); }

      function setBusy(on) {
        state.busy = !!on;
        if (addStopBtn) addStopBtn.disabled = on || !state.pickWaypoint || !state.pickChallenge;
        if (newChallengeBtn) newChallengeBtn.disabled = on;
        syncAddNote();
        if (citySelect) citySelect.disabled = on;
        if (waypointSelect) waypointSelect.disabled = on || !state.city;
        if (challengeSelect) challengeSelect.disabled = on || !state.city;
        var ncBusy = document.getElementById('newCityBtn');
        if (ncBusy) ncBusy.disabled = on;
      }

      // Both halves are already chosen by the time this is reachable, so the stop
      // is written immediately rather than parked as a pending edit. There is no
      // half-made stop to leave lying around.
      // Writes one stop per picked game. A game that already has this waypoint is
      // skipped rather than failing the batch — the unique index on
      // (game_id, waypoint_id) would reject it, and with several games selected
      // that overlap is expected rather than an error.
      // One row per city, not per game: every game set in this city shares it.
      async function addStop() {
        if (!state.city || state.city === ALL_CITIES || !state.pickWaypoint || !state.pickChallenge) return;
        var wp = findWaypoint(state.pickWaypoint);
        var rows = stopsInCity();
        // ord is not exposed here, but games/admin/profiles.html reads stops back through
        // the game_stops view with order=ord.asc, so a new row takes the next
        // free number rather than everything defaulting to 0.
        var maxOrd = rows.reduce(function (m, s2) { return Math.max(m, Number(s2.ord) || 0); }, 0);
        setBusy(true);
        setStatus('Adding stop…');
        try {
          var row = await writeRow('POST', 'stops', {
            city_slug: state.city,
            waypoint_id: Number(state.pickWaypoint),
            challenge_id: Number(state.pickChallenge),
            ord: maxOrd + 1,
            end: 'NO'
          });
          state.stops.push({
            id: row.id,
            city_slug: state.city,
            waypoint_id: Number(state.pickWaypoint),
            challenge_id: Number(state.pickChallenge),
            ord: maxOrd + 1,
            end: 'NO'
          });
          // Clear the waypoint but keep the challenge: adding several stops that
          // share one challenge is the common case.
          state.pickWaypoint = '';
          setBusy(false);
          render();
          setStatus((wp ? waypointLabel(wp) : 'Stop') + ' added to ' + cityLabel(state.city) + '.', 'success');
        } catch (error) {
          console.error(error);
          setBusy(false);
          setStatus(friendlyError(error), 'error');
        }
      }

      // ── Wiring ─────────────────────────────────────────────────────────────
      var adminAuth = window.TgbMcAdminAuth.create({
        supabaseConfig: SUPABASE_CONFIG,
        onAuthorized: function () {
          setAdminAuthToggleState(true);
          loadAll().catch(function () { /* status already shown */ });
        },
        onSignedOut: function () {
          setAdminAuthToggleState(false);
          resetAll();
        }
      });

      // Sign in / sign out is the padlock in the shared admin nav.
      if (window.TgbAdminSiteNav) window.TgbAdminSiteNav.bindAuth(adminAuth);

      if (citySelect) citySelect.addEventListener('change', function () {
        state.city = citySelect.value;
        // Changing city invalidates the waypoint: it was filtered to the old one.
        state.pickWaypoint = '';
        setControlsEnabled(true);
        render();
      });

      if (challengeSelect) challengeSelect.addEventListener('change', function () {
        state.pickChallenge = challengeSelect.value;
        if (addStopBtn) addStopBtn.disabled = state.busy || !state.pickWaypoint || !state.pickChallenge;
        syncAddNote();
      });

      if (waypointSelect) waypointSelect.addEventListener('change', function () {
        state.pickWaypoint = waypointSelect.value;
        if (addStopBtn) addStopBtn.disabled = state.busy || !state.pickWaypoint;
        syncAddNote();
      });

      var awaitingWaypoint = false;

      if (newWaypointBtn) newWaypointBtn.addEventListener('click', function () {
        awaitingWaypoint = true;
        window.open('/mc/data/waypoints.html', '_blank', 'noopener,noreferrer');
      });

      // Re-read the catalog when you come back from that tab, so a waypoint added
      // over there turns up in step 3 without reloading this page.
      window.addEventListener('focus', function () {
        if (state.busy) return;
        if (!awaitingWaypoint) return;
        awaitingWaypoint = false;
        var session = adminAuth.getSession ? adminAuth.getSession() : null;
        if (!session || !session.access_token) return;
        fetchAll('waypoints?select=wpid,name,city,state,address&order=name.asc')
          .then(function (rows) {
            var gained = (rows || []).length - state.waypoints.length;
            state.waypoints = rows || [];
            render();
            if (gained > 0) setStatus(gained + ' new waypoint' + (gained === 1 ? '' : 's') + ' picked up.', 'success');
          })
          .catch(function (error) { console.error(error); });
      });

      // The New-challenge dialog. Creating a challenge has to live somewhere and
      // the catalog panel is gone, so this is the whole editor: enough fields to
      // produce a usable row, nothing more.
      var chDialog = document.getElementById('chDialog');
      var chBackdrop = document.getElementById('chBackdrop');
      var chName = document.getElementById('chName');
      var chKind = document.getElementById('chKind');
      var chPrompt = document.getElementById('chPrompt');
      var chAnswer = document.getElementById('chAnswer');
      var chAnswerField = document.getElementById('chAnswerField');
      var chStatus = document.getElementById('chStatus');

      function chSyncAnswer() {
        // photo and freeform have no single right answer, so the field would only
        // invite one no engine should check.
        var k = chKind ? chKind.value : 'question';
        if (chAnswerField) chAnswerField.hidden = (k === 'photo' || k === 'freeform');
      }

      function openChallengeDialog() {
        if (!chDialog) return;
        chName.value = ''; chPrompt.value = ''; chAnswer.value = ''; chKind.value = 'question';
        chStatus.textContent = '';
        chStatus.className = 'status';
        chSyncAnswer();
        chDialog.hidden = false;
        chBackdrop.hidden = false;
        chName.focus();
      }

      function closeChallengeDialog() {
        if (chDialog) chDialog.hidden = true;
        if (chBackdrop) chBackdrop.hidden = true;
      }

      async function createChallenge() {
        var name = text(chName.value);
        if (!name) {
          chStatus.textContent = 'A name is required — it is how you will find this again.';
          chStatus.className = 'status is-error';
          return;
        }
        var save = document.getElementById('chSave');
        save.disabled = true;
        chStatus.textContent = 'Creating…';
        chStatus.className = 'status';
        try {
          var row = await writeRow('POST', 'challenges', {
            name: name,
            kind: chKind.value || 'question',
            prompt: text(chPrompt.value) || null,
            answer: (chKind.value === 'photo' || chKind.value === 'freeform') ? null : (text(chAnswer.value) || null)
          });
          state.challenges.push(row);
          state.challenges.sort(function (a, b) {
            return String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' });
          });
          // Select what you just wrote — you made it to use it.
          state.pickChallenge = String(row.id);
          closeChallengeDialog();
          render();
          setStatus('Created "' + name + '" and selected it.', 'success');
        } catch (error) {
          console.error(error);
          chStatus.textContent = friendlyError(error);
          chStatus.className = 'status is-error';
        } finally {
          save.disabled = false;
        }
      }

      if (newChallengeBtn) newChallengeBtn.addEventListener('click', openChallengeDialog);
      if (chKind) chKind.addEventListener('change', chSyncAnswer);
      if (chBackdrop) chBackdrop.addEventListener('click', closeChallengeDialog);
      var chCancel = document.getElementById('chCancel');
      if (chCancel) chCancel.addEventListener('click', closeChallengeDialog);
      var chSave = document.getElementById('chSave');
      if (chSave) chSave.addEventListener('click', createChallenge);

      // Adds to public.cities, the catalog every surface shares — the same
      // dialog the Waypoints page and the builders use, so there is one add-city
      // form rather than four.
      var newCityBtn = document.getElementById('newCityBtn');
      if (newCityBtn) newCityBtn.addEventListener('click', function () {
        if (!(window.TgbCities && typeof window.TgbCities.openAddDialog === 'function')) {
          setStatus('The shared city dialog did not load.', 'error');
          return;
        }
        window.TgbCities.openAddDialog({ authHeaders: authHeaders }).then(function (cityRow) {
          if (!cityRow || !cityRow.city) return;
          // The dropdown above lists cities that HAVE games, because a city with
          // none leads to an empty step 2. A brand-new city therefore will not
          // appear here until a game is filed against it.
          setStatus('Added ' + cityRow.city + ' to the city catalog. It appears in step 1 once a game exists in it.', 'success');
        }).catch(function (error) {
          console.error(error);
          setStatus(friendlyError(error), 'error');
        });
      });

      if (addStopBtn) addStopBtn.addEventListener('click', addStop);

      resetAll();
      // Nothing renders until this runs: create() only builds the controller,
      // init() is what restores a stored session or opens the sign-in modal.
      adminAuth.init();
    }());
  </script>
</body>
</html>
