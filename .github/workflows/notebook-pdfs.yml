name: Build notebook PDFs
run-name: Notebook PDFs · ${{ inputs.game || 'changed games' }}

# Builds a notebook game's PDFs (cover, contents, print-at-home, free sampler) with
# studio/kit/build-pdfs.js and commits them to <game>/pdf/.
# Started from a game's admin page (Build PDFs), from the Actions tab, or on its own
# when a notebook game's pages or the kit change on main.
on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Game folder from the site root, e.g. chess'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '**/game.json'
      - '**/rules.md'
      - '**/cover.html'
      - '**/contents.html'
      - '**/sampler.html'
      - 'studio/kit/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: notebook-pdfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Pick the games to build
        id: games
        env:
          INPUT_GAME: ${{ inputs.game }}
          BEFORE: ${{ github.event.before }}
        run: |
          is_game() { [ -f "$1/game.json" ] && grep -q '"kit": *"notebook"' "$1/game.json"; }
          if [ -n "$INPUT_GAME" ]; then
            game="${INPUT_GAME#/}"; game="${game%/}"
            if ! printf '%s' "$game" | grep -Eq '^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$' || ! is_game "$game"; then
              echo "::error::'$INPUT_GAME' is not a notebook game folder (needs game.json with \"kit\": \"notebook\")"; exit 1
            fi
            games="$game"
          else
            changed=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            if echo "$changed" | grep -q '^studio/kit/'; then
              games=$(find . -maxdepth 4 -name game.json -not -path './.git/*' -exec dirname {} \; | sed 's#^\./##' | while read -r d; do is_game "$d" && echo "$d"; done)
            else
              # For each changed file, walk up to the nearest folder that is a notebook game.
              games=$(echo "$changed" | while read -r f; do
                d=$(dirname "$f")
                while [ "$d" != "." ] && [ -n "$d" ]; do
                  if is_game "$d"; then echo "$d"; break; fi
                  d=$(dirname "$d")
                done
              done | sort -u)
              # A game whose only change is to web-page-only fields of game.json (order link, announcement,
              # photos other than the cover picture...) keeps its PDFs. Same list as NB.WEB_ONLY in kit.js.
              keep=""
              for g in $games; do
                if echo "$changed" | grep "^$g/" | grep -vq "^$g/game.json$" || ! git cat-file -e "$BEFORE:$g/game.json" 2>/dev/null; then keep="$keep $g"; continue; fi
                if git show "$BEFORE:$g/game.json" > "$RUNNER_TEMP/old.json" && python3 - "$RUNNER_TEMP/old.json" "$g/game.json" <<'PY'
          import json, sys
          WEB_ONLY = ['order', 'announce', 'announceFrom', 'announceUntil', 'shareText', 'layout', 'setup', 'autoPreviews', 'favicon', 'videoHeading', 'slugTouched']
          def key(path):
              g = json.load(open(path))
              o = {k: v for k, v in g.items() if k not in WEB_ONLY}
              ph = [m for m in g.get('media') or [] if m and m.get('type', 'image') == 'image' and m.get('src') and not m.get('placeholder')]
              ci = o.pop('coverImage', None)
              m = (ph[0] if ph else None) if 'coverImage' not in g else next((x for x in ph if x['src'] == ci), None)
              o['media'] = [m['src'], m.get('focus')] if m else None
              return json.dumps(o, sort_keys=True)
          sys.exit(0 if key(sys.argv[1]) == key(sys.argv[2]) else 1)
          PY
                then echo "$g: only web page fields changed, PDFs stay as they are"; else keep="$keep $g"; fi
              done
              games="$keep"
            fi
          fi
          games=$(echo $games)
          echo "Games: ${games:-none}"
          echo "list=$games" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.games.outputs.list != ''
        with:
          node-version: 20

      - name: Install Playwright and pdf-lib
        if: steps.games.outputs.list != ''
        run: |
          mkdir -p "$RUNNER_TEMP/pdfdeps" && cd "$RUNNER_TEMP/pdfdeps"
          npm init -y >/dev/null
          npm i playwright@1.49.1 pdf-lib@1.17.1
          npx playwright install --with-deps chromium

      - name: Render PDFs
        if: steps.games.outputs.list != ''
        env:
          GAMES: ${{ steps.games.outputs.list }}
        run: NODE_PATH="$RUNNER_TEMP/pdfdeps/node_modules" node studio/kit/build-pdfs.js $GAMES

      - name: Commit PDFs
        if: steps.games.outputs.list != ''
        env:
          GAMES: ${{ steps.games.outputs.list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved on while the PDFs rendered (another publish, or an earlier run's PDFs).
          # Rebasing binary PDFs conflicts, so put the new PDFs on top of the latest main instead,
          # and try again if someone pushes in between. A later change to a game starts its own run.
          out="$RUNNER_TEMP/out"
          for g in $GAMES; do mkdir -p "$out/$g"; cp -a "$g/pdf/." "$out/$g/"; done
          pushed=""
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for g in $GAMES; do [ -d "$g" ] || continue; mkdir -p "$g/pdf"; cp -a "$out/$g/." "$g/pdf/"; git add -A "$g/pdf"; done
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Rebuild notebook PDFs: $GAMES"
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "main moved on, trying again ($i)"; sleep $((i * 5))
          done
          [ -n "$pushed" ] || { echo "::error::Could not push the PDFs after 5 tries"; exit 1; }
          # Pushes made with GITHUB_TOKEN don't start other workflows, so start the Pages deploy here.
          gh workflow run deploy.yml --ref main
