name: Daily soundtrack generator

# Runs at 10:00 America/Chicago. GitHub cron is UTC with no DST, so we trigger
# at BOTH 15:00 and 16:00 UTC and let the guard proceed only during the 10am
# Central hour. Exactly one scheduled job does real work year-round.
#
# The job asks Claude with web search for one missing active city soundtrack
# plus one active underfilled soundtrack top-up. The runner excludes
# public.cities rows where ignored=true, fails if any hidden/venue-only city has
# a standalone soundtrack, updates sound/soundtracks.json, and commits any
# resulting change. The public /sound/ page reads that JSON directly.

on:
  schedule:
    - cron: "0 15 * * *"  # 10:00 CDT (summer)
    - cron: "0 16 * * *"  # 10:00 CST (winter)
  workflow_dispatch:
    inputs:
      city_slug:
        description: "Force the missing active city slug; ignored=true cities are rejected"
        type: string
        default: ""
      top_up_slug:
        description: "Force the active underfilled soundtrack slug; ignored=true cities are rejected"
        type: string
        default: ""
      dry_run:
        description: "Run without writing/committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soundtrack-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Proceed only at 10am Central (or on manual dispatch)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ='America/Chicago' date +%H)
          echo "Central hour: $hour"
          if [ "$hour" = "10" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not 10am Central - skipping this trigger (the other cron handles it)."
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate soundtrack update
        if: steps.gate.outputs.go == 'true'
        env:
          SUPABASE_URL: https://qmaafbncpzrdmqapkkgr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOUNDTRACK_CITY_SLUG: ${{ github.event.inputs.city_slug }}
          SOUNDTRACK_TOP_UP_SLUG: ${{ github.event.inputs.top_up_slug }}
          SOUNDTRACK_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node _dev/scripts/soundtrack-daily.mjs

      - name: Commit & push if soundtracks changed
        if: steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sound/soundtracks.json
          if git diff --cached --quiet; then
            echo "No soundtrack changes - nothing to commit."
            exit 0
          fi
          stamp=$(TZ='America/Chicago' date +'%Y-%m-%d %H:%M %Z')
          git commit -m "auto: daily soundtrack update ($stamp)"
          git push
