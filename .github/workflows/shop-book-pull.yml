name: Gift Shop daily book pull

# Twice daily at ~06:55 and ~18:55 America/Chicago. GitHub cron is UTC with no
# DST, so each Central run has a summer and winter UTC trigger. The guard below
# proceeds only during the 06:00 or 18:00 Central HOUR, so exactly two scheduled
# runs do real work year-round.
#
# The guard checks the hour, not the exact minute. Scheduled triggers routinely
# start late, and a minute-exact test ("0655") skips the whole job on any delay
# — a green run that silently did nothing. The URL error check gates the same
# way for the same reason.
#
# Each run asks Claude (with web search) for a few books tied to one of our shop
# cities and inserts them as ARCHIVED, unpublished candidates via
# tgb_import_bookshop_prompt_items. An admin reviews them in the Stock Room and
# either unarchives+publishes or rejects. Nothing is committed to the repo —
# the write lands in Supabase.

on:
  schedule:
    - cron: "55 11 * * *"  # 06:55 CDT (summer)
    - cron: "55 12 * * *"  # 06:55 CST (winter)
    - cron: "55 23 * * *"  # 18:55 CDT (summer)
    - cron: "55 0 * * *"   # 18:55 CST (winter)
  workflow_dispatch:
    inputs:
      count:
        description: "How many books to pull this run"
        type: string
        default: "5"
      topic:
        description: "Override the city/topic (optional)"
        type: string
        default: ""

concurrency:
  group: shop-book-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Proceed only at 06:55 or 18:55 Central (or on manual dispatch)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ='America/Chicago' date +%H)
          echo "Central hour: $hour"
          if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not the 6am or 6pm Central hour — skipping this trigger (the paired cron handles it)."
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull candidate books
        if: steps.gate.outputs.go == 'true'
        env:
          SUPABASE_URL: https://qmaafbncpzrdmqapkkgr.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOOK_PULL_COUNT: ${{ github.event.inputs.count }}
          BOOK_PULL_TOPIC: ${{ github.event.inputs.topic }}
        run: node _dev/scripts/shop-book-pull.mjs
