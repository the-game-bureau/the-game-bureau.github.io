name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate asset manifest
        run: |
          python3 << 'EOF'
          import os, json
          exts = {'.jpg','.jpeg','.png','.gif','.svg','.webp','.avif','.ico','.bmp','.tiff','.tif'}
          exclude = {'404.webp','builder.ico','builder.png','share-thumbnail.png'}
          assets_dir = 'public/assets'
          files = []
          for root, _, names in os.walk(assets_dir):
              for name in names:
                  if os.path.splitext(name)[1].lower() not in exts or name in exclude:
                      continue
                  rel = os.path.relpath(os.path.join(root, name), assets_dir).replace(os.sep, '/')
                  files.append(rel)
          files = sorted(files)
          with open(os.path.join(assets_dir, 'asset-manifest.json'),'w') as fh:
              json.dump({'files': files}, fh, indent=2)
              fh.write('\n')
          print(f'Wrote {len(files)} entries to asset-manifest.json')
          EOF

      - name: Build public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # Apex / hosting metadata belongs at site root
          [ -f public/CNAME ]     && cp public/CNAME     _site/CNAME     || true
          [ -f public/.nojekyll ] && cp public/.nojekyll _site/.nojekyll || true
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='CNAME' \
            --exclude='.nojekyll' \
            --filter='dir-merge,- .gitignore' \
            --exclude='private/' \
            public/ _site/public/
          rsync -av \
            --filter='dir-merge,- .gitignore' \
            game/ _site/game/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v5
        id: deployment
