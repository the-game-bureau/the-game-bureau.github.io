name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate asset manifest
        run: |
          python3 << 'EOF'
          import os, json
          exts = {'.jpg','.jpeg','.png','.gif','.svg','.webp','.avif','.ico','.bmp','.tiff','.tif'}
          exclude = {'404.webp','builder.ico','builder.png','share-thumbnail.png'}
          # Repo root is the site root. Assets moved to ./mc/assets on
          # 2026-08-06; the manifest still lands inside that folder, so it is
          # served at /mc/assets/asset-manifest.json.
          assets_dir = 'mc/assets'
          files = []
          for root, _, names in os.walk(assets_dir):
              for name in names:
                  if os.path.splitext(name)[1].lower() not in exts or name in exclude:
                      continue
                  rel = os.path.relpath(os.path.join(root, name), assets_dir).replace(os.sep, '/')
                  files.append(rel)
          files = sorted(files)
          with open(os.path.join(assets_dir, 'asset-manifest.json'),'w') as fh:
              json.dump({'files': files}, fh, indent=2)
              fh.write('\n')
          print(f'Wrote {len(files)} entries to asset-manifest.json')
          EOF

      - name: Build deploy site
        run: |
          mkdir -p _site
          # Repo root IS the site root and deploys as-is: index.html (home),
          # mc/ (admin), game/ (game runtime), and the public-site sections
          # (account/, gifts/, ww/, etc.). mc/_dev/, mc/backups/, supabase/ are
          # source-only and excluded.
          #
          # Both carry a slash so they are anchored to the site root rather than
          # matching any directory of that name at any depth — which is what a
          # bare name does. mc/_dev/backups/ is covered by the mc/_dev exclude.
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='mc/_dev' \
            --exclude='mc/backups' \
            --exclude='supabase' \
            --exclude='node_modules' \
            --exclude='README.md' \
            --exclude='.tmp' \
            --filter='dir-merge,- .gitignore' \
            --exclude='private/' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v5
        id: deployment
