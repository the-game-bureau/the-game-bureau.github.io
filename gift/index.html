<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef1e8">
  <title>GIFT SHOP | THE GAME BUREAU</title>
  <link rel="icon" href="../assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/public-theme.css">
  <style>
    .public-gift {
      --theme-color: var(--brass);
    }

    .public-gift .admin-btn {
      display: none;
    }

    .gift-page {
      display: grid;
      gap: 1rem;
    }

    .public-gift .metric-grid {
      grid-template-columns: 1fr;
    }

    .gift-grid-wrap {
      padding-top: 0.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.74);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow-soft);
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--theme-color);
      box-shadow: 0 24px 54px rgba(21, 33, 29, 0.1);
      outline: none;
    }

    .card[data-game-color] {
      --theme-color: var(--card-game-color, var(--brass));
    }

    .card-media {
      position: relative;
      aspect-ratio: 1 / 1.08;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.28) 0%, transparent 26%),
        linear-gradient(180deg, rgba(41, 67, 61, 0.1), rgba(41, 67, 61, 0.03));
    }

    .card-media::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(21, 33, 29, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 33, 29, 0.05) 1px, transparent 1px),
        radial-gradient(circle at 18% 26%, transparent 0 22px, rgba(41, 67, 61, 0.08) 22px 23px, transparent 23px 46px);
      background-size: 24px 24px, 24px 24px, auto;
      opacity: 0.78;
    }

    .card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-monogram {
      position: absolute;
      left: 1rem;
      bottom: 0.9rem;
      color: rgba(21, 33, 29, 0.46);
      font-family: "Newsreader", serif;
      font-size: 2.45rem;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .card-media[data-has-image="true"] .card-monogram {
      display: none;
    }

    .card-body {
      display: grid;
      gap: 0.55rem;
      padding: 1.08rem 1.14rem 1.2rem;
    }

    .card-title {
      margin: 0;
      color: var(--ink);
      font-family: "Newsreader", serif;
      font-size: 1.62rem;
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    .card-price {
      color: var(--theme-color);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .card-game-eyebrow {
      color: var(--theme-color);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .card-caption {
      color: var(--muted-strong);
      font-size: 0.92rem;
      line-height: 1.58;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-cta {
      margin-top: 0.08rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .card-cta::after {
      content: " ↗";
      font-size: 0.92rem;
      line-height: 1;
    }

    .footer-note {
      max-width: 44rem;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.62;
    }

  </style>
</head>
<body class="public-library public-gift">
  <div class="page-shell">
    <header class="site-nav">
      <div class="brand-lockup brand-lockup--page">
        <span class="brand-name">The Game Bureau</span>
        <span class="page-headline" id="heading">Gift Shop</span>
        <p class="page-count-line"><span id="itemCount">0</span> items<span id="eyebrowSuffix" hidden> · <span id="eyebrow"></span></span></p>
      </div>
      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../library.html">Library</a>
        <a class="nav-link nav-link--active" href="index.html">Gift Shop</a>
        <a class="utility-link admin-btn" href="../mc/giftshop.html">Mission Control</a>
        <a class="nav-link nav-link--account" href="../account.html" data-account-link>Account</a>
      </nav>
    </header>

    <main class="gift-page">
      <section class="metric-grid" aria-label="Gift shop metrics">
        <article class="metric-card">
          <span class="metric-label">Visible Now</span>
          <span class="metric-value" id="shopCount">0</span>
          <p class="metric-copy" id="lead">Books, field notes, and local finds selected to extend the routes beyond the street.</p>
        </article>
      </section>

      <div class="status-pill" id="status" aria-live="polite" hidden></div>

      <section class="gift-grid-wrap" aria-label="Gift shop items">
        <div class="grid" id="grid"></div>
      </section>

      <p class="footer-note">As an Amazon Associate, The Game Bureau may earn from qualifying purchases.</p>
    </main>
  </div>

  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const params = new URLSearchParams(location.search);
    const gameId = String(params.get('id') || params.get('game') || '').trim();

    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('grid');
    const headingEl = document.getElementById('heading');
    const eyebrowEl = document.getElementById('eyebrow');
    const eyebrowSuffixEl = document.getElementById('eyebrowSuffix');
    const leadEl = document.getElementById('lead');
    const itemCountEl = document.getElementById('itemCount');
    const shopCountEl = document.getElementById('shopCount');

    function setStatus(msg) {
      const text = msg || '';
      statusEl.textContent = text;
      statusEl.hidden = !text;
    }

    function setEyebrow(text) {
      const trimmed = String(text || '').trim();
      eyebrowEl.textContent = trimmed;
      eyebrowSuffixEl.hidden = !trimmed;
    }

    function escapeText(value) {
      return String(value == null ? '' : value);
    }

    function getMonogram(title) {
      const t = String(title || 'Item').trim();
      const words = t.match(/[A-Za-z0-9]+/g) || [];
      if (words.length >= 2) return ((words[0][0] || '') + (words[1][0] || '')).toUpperCase();
      return t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'GS';
    }

    function renderEmpty(message) {
      gridEl.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = message;
      gridEl.appendChild(empty);
    }

    function buildSupabaseUrl(table, query = {}) {
      const url = new URL('rest/v1/' + table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
      url.searchParams.set('apikey', SB_CONFIG.key);
      Object.entries(query).forEach(([k, v]) => {
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, String(v));
      });
      return url.toString();
    }

    async function fetchJson(url) {
      let res;
      try {
        res = await fetch(url);
      } catch (e) {
        throw new Error('Network request to Supabase failed.');
      }
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error('Supabase ' + res.status + ': ' + text.slice(0, 200));
      }
      return res.json();
    }

    async function fetchGame(id) {
      const rows = await fetchJson(buildSupabaseUrl('games', {
        select: 'id,name,tagline,primary_color',
        id: 'eq.' + id,
        limit: '1'
      }));
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function fetchListingsForGame(id) {
      return fetchJson(buildSupabaseUrl('gift_shop_listings', {
        select: '*,gift_shop_items(*)',
        game_id: 'eq.' + id,
        live: 'eq.true',
        archived: 'eq.false',
        order: 'position.asc.nullslast'
      }));
    }

    async function fetchAllListings() {
      return fetchJson(buildSupabaseUrl('gift_shop_listings', {
        select: '*,gift_shop_items(*),games(id,name,primary_color)',
        live: 'eq.true',
        archived: 'eq.false',
        order: 'created_at.desc'
      }));
    }

    function createCard(item, opts = {}) {
      const url = String(item.url || '').trim();
      if (!url) return null;

      const card = document.createElement('a');
      card.className = 'card';
      card.href = url;
      card.target = '_blank';
      card.rel = 'noopener nofollow sponsored';

      if (opts.gameColor) {
        card.dataset.gameColor = '';
        card.style.setProperty('--card-game-color', opts.gameColor);
      }

      const media = document.createElement('div');
      media.className = 'card-media';

      const monogram = document.createElement('div');
      monogram.className = 'card-monogram';
      monogram.textContent = getMonogram(item.title);
      media.appendChild(monogram);

      const imageUrl = String(item.image_url || '').trim();
      media.dataset.hasImage = imageUrl ? 'true' : 'false';
      if (imageUrl) {
        const img = document.createElement('img');
        img.className = 'card-image';
        img.src = imageUrl;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        const focus = String(item.image_focus || '').trim();
        if (focus) img.style.objectPosition = focus;
        img.addEventListener('error', () => {
          img.remove();
          media.dataset.hasImage = 'false';
        });
        media.appendChild(img);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const gameNames = Array.isArray(opts.gameNames)
        ? opts.gameNames
        : (opts.gameName ? [opts.gameName] : []);
      if (gameNames.length) {
        const ge = document.createElement('p');
        ge.className = 'card-game-eyebrow';
        ge.textContent = gameNames.join(' · ');
        body.appendChild(ge);
      }

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = escapeText(item.title || 'Untitled item');
      body.appendChild(title);

      const price = String(item.price_display || '').trim();
      if (price) {
        const priceEl = document.createElement('div');
        priceEl.className = 'card-price';
        priceEl.textContent = price;
        body.appendChild(priceEl);
      }

      const desc = String(item.description || '').trim();
      if (desc) {
        const captionEl = document.createElement('p');
        captionEl.className = 'card-caption';
        captionEl.textContent = desc;
        body.appendChild(captionEl);
      }

      const cta = document.createElement('span');
      cta.className = 'card-cta';
      cta.textContent = 'Open listing';
      body.appendChild(cta);

      card.append(media, body);
      return card;
    }

    function applyGameTheme(game) {
      const primary = String(game && game.primary_color || '').trim();
      if (!primary) return;
      document.documentElement.style.setProperty('--theme-color', primary);
      document.body.dataset.theme = 'game';
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', primary);
    }

    async function loadSingleGame(id) {
      setStatus('Loading');
      renderEmpty('Loading inventory...');
      try {
        const [game, listings] = await Promise.all([
          fetchGame(id).catch(() => null),
          fetchListingsForGame(id)
        ]);

        if (game && game.name) {
          headingEl.textContent = 'Gift Shop';
          setEyebrow(game.name);
          document.title = game.name.toUpperCase() + ' GIFT SHOP | THE GAME BUREAU';
        }
        const tagline = String((game && game.tagline) || '').trim();
        if (tagline) {
          leadEl.textContent = tagline;
          leadEl.hidden = false;
        } else {
          leadEl.textContent = 'Field notes, provisions, and local finds chosen for this route.';
          leadEl.hidden = false;
        }
        applyGameTheme(game);

        const seenItemIds = new Set();
        const cards = (Array.isArray(listings) ? listings : [])
          .reduce((acc, listing) => {
            const item = listing && listing.gift_shop_items;
            if (!item || item.id == null || seenItemIds.has(item.id)) return acc;
            seenItemIds.add(item.id);
            const card = createCard(item);
            if (card) acc.push(card);
            return acc;
          }, []);

        gridEl.innerHTML = '';
        if (!cards.length) {
          renderEmpty('No items in the gift shop yet.');
          itemCountEl.textContent = '0';
          shopCountEl.textContent = '1';
          setStatus('');
          return;
        }
        cards.forEach((card) => gridEl.appendChild(card));
        itemCountEl.textContent = String(cards.length);
        shopCountEl.textContent = '1';
        setStatus(cards.length + ' item' + (cards.length === 1 ? '' : 's'));
      } catch (error) {
        console.error('[giftshop] load failed', error);
        renderEmpty('Could not load gift shop.');
        itemCountEl.textContent = '0';
        shopCountEl.textContent = '0';
        setStatus(error instanceof Error ? error.message : String(error));
      }
    }

    async function loadAllShops() {
      headingEl.textContent = 'Gift Shop';
      setEyebrow('');
      leadEl.textContent = 'Books, field notes, and local finds gathered across every route in the bureau.';
      leadEl.hidden = false;
      document.title = 'GIFT SHOP | THE GAME BUREAU';

      setStatus('Loading');
      renderEmpty('Loading inventory...');

      try {
        const listings = await fetchAllListings();
        if (!Array.isArray(listings) || !listings.length) {
          renderEmpty('No items in the gift shop yet.');
          itemCountEl.textContent = '0';
          shopCountEl.textContent = '0';
          setStatus('');
          return;
        }

        const grouped = new Map();
        for (const listing of listings) {
          const item = listing && listing.gift_shop_items;
          if (!item || item.id == null) continue;
          const game = listing.games || {};
          const gameName = String(game.name || '').trim();
          const gameColor = String(game.primary_color || '').trim();
          let entry = grouped.get(item.id);
          if (!entry) {
            entry = { item, names: [], firstColor: gameColor || null };
            grouped.set(item.id, entry);
          }
          if (gameName && !entry.names.includes(gameName)) {
            entry.names.push(gameName);
          }
          if (!entry.firstColor && gameColor) entry.firstColor = gameColor;
        }

        const cards = Array.from(grouped.values())
          .map(({ item, names, firstColor }) => createCard(item, {
            gameNames: names,
            gameColor: firstColor || null
          }))
          .filter(Boolean);

        gridEl.innerHTML = '';
        if (!cards.length) {
          renderEmpty('No items available.');
          itemCountEl.textContent = '0';
          shopCountEl.textContent = '0';
          setStatus('');
          return;
        }
        cards.forEach((card) => gridEl.appendChild(card));
        itemCountEl.textContent = String(cards.length);
        shopCountEl.textContent = String(new Set(listings.map((l) => l.game_id).filter(Boolean)).size);
        setStatus(cards.length + ' item' + (cards.length === 1 ? '' : 's') + ' across ' +
          new Set(listings.map((l) => l.game_id).filter(Boolean)).size + ' game(s)');
      } catch (error) {
        console.error('[giftshop] all-shops load failed', error);
        renderEmpty('Could not load gift shop.');
        itemCountEl.textContent = '0';
        shopCountEl.textContent = '0';
        setStatus(error instanceof Error ? error.message : String(error));
      }
    }

    if (gameId) loadSingleGame(gameId);
    else loadAllShops();
  </script>
  <script>
    (function () {
      try {
        const session = JSON.parse(localStorage.getItem('tgb-photo-review-auth-session') || 'null');
        const expiresAt = Number(session && session.expires_at || 0) * 1000;
        if (session && session.access_token && (!expiresAt || expiresAt > Date.now())) {
          const btn = document.querySelector('.admin-btn');
          if (btn) btn.style.display = 'inline-flex';
        }
      } catch (_) {}
    }());
  </script>
</body>
</html>
