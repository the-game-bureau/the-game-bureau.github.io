    /* ── SECTION BLOCKS ── */

    /* ── HOW TO PLAY ── */

    /* ── START ── */
    #startingLocationSection {
      --start-card-bg: rgba(255,255,255,0.55);
      --start-card-blur: blur(4px);
      display: none;
      position: relative;
      background: #fff;

      margin: calc(var(--v) * 1.5) var(--pad) 0;

      color: #111;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;

      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .start-bg-map {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.55;
      border-radius: 18px;
      pointer-events: none;
    }

    .start-blurb {
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.005em;
      line-height: 1.6;
      color: #333;
      text-align: center;
      width: 100%;
      position: relative;
      z-index: 3;
      background: var(--start-card-bg);
      backdrop-filter: var(--start-card-blur);
      -webkit-backdrop-filter: var(--start-card-blur);
      border-radius: 16px;
      border: 2px solid var(--primary);
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    .start-blurb strong { color: var(--primary); }
    .start-x-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10%;
      height: auto;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }
    .start-waypoint-pin {
      fill: var(--primary);
    }
    .start-flip {
      width: clamp(200px, 50vw, 240px);
      z-index: 3;
      perspective: 1200px;
      -webkit-perspective: 1200px;
    }
    .start-flip-inner {
      display: grid;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      will-change: transform;
    }
    .start-flip.flipped .start-flip-inner {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .start-flip-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: visibility 0s linear 0.3s;
      width: 100%;
    }
    .start-flip-front {
      display: flex;
      align-items: center;
      transform: rotateY(0deg) translateZ(0.1px);
      -webkit-transform: rotateY(0deg) translateZ(0.1px);
      visibility: visible;
    }
    .start-flip-back {
      transform: rotateY(180deg) translateZ(0.1px);
      -webkit-transform: rotateY(180deg) translateZ(0.1px);
      display: flex;
      flex-direction: column;
      pointer-events: none;
      visibility: hidden;
    }
    .start-flip.flipped .start-flip-front {
      pointer-events: none;
      visibility: hidden;
    }
    .start-flip.flipped .start-flip-back {
      pointer-events: auto;
      visibility: visible;
    }
    @media (hover: none) and (pointer: coarse), (max-width: 640px) {
      .start-flip {
        perspective: none;
        -webkit-perspective: none;
      }
      .start-flip-inner,
      .start-flip.flipped .start-flip-inner {
        transform: none;
        -webkit-transform: none;
        transition: none;
      }
      .start-flip-face {
        transition: opacity 0.24s ease, visibility 0s linear 0.24s;
      }
      .start-flip-front,
      .start-flip.flipped .start-flip-back {
        opacity: 1;
        visibility: visible;
        transform: none;
        -webkit-transform: none;
        transition-delay: 0s;
      }
      .start-flip-back,
      .start-flip.flipped .start-flip-front {
        opacity: 0;
        visibility: hidden;
        transform: none;
        -webkit-transform: none;
      }
    }
    .start-map-buttons {
      display: flex;

    .start-card-label {
      position: absolute;

    /* ── WEATHER ── */

        .replace('/assets/teams/', '/assets/games/')
        .replace('/assets/vendors/', '/assets/games/');

      if (rawValue.startsWith('data:') || rawValue.startsWith('blob:')) {
        return rawValue;
      }

      try {
        const base = /^assets\//i.test(rawValue)
          ? new URL('../', window.location.href).toString()
          : window.location.href;
        const resolvedUrl = new URL(rawValue, base);
        const protocol = String(resolvedUrl.protocol || '').toLowerCase();
        return protocol === 'http:' || protocol === 'https:' || protocol === 'file:' ? resolvedUrl.toString() : '';
      } catch (error) {

      return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>

    function isLikelyUS(lat, lon) {
      // Continental US (CONUS), Alaska, Hawaii — rough bounding boxes.
      // NWS api.weather.gov only covers US territories; outside this we skip it.
      if (lat >= 24 && lat <= 50 && lon >= -125 && lon <= -66) return true;
      if (lat >= 51 && lat <= 72 && lon >= -180 && lon <= -129) return true;
      if (lat >= 18 && lat <= 23 && lon >= -161 && lon <= -154) return true;
      return false;
    }

    function feelsLikeF(tempF, humidity, windMph) {
      if (!Number.isFinite(tempF)) return null;
      const T = tempF;
      const RH = Number.isFinite(humidity) ? humidity : null;
      const V  = Number.isFinite(windMph)  ? windMph  : null;
      // Wind chill: cold + breezy
      if (T <= 50 && V != null && V > 3) {
        const v = Math.pow(V, 0.16);
        return Math.round(35.74 + 0.6215 * T - 35.75 * v + 0.4275 * T * v);
      }
      // Heat index: hot + humid (Rothfusz regression)
      if (T >= 80 && RH != null && RH >= 40) {
        const T2 = T * T, R2 = RH * RH;
        return Math.round(
          -42.379 + 2.04901523 * T + 10.14333127 * RH
          - 0.22475541 * T * RH - 0.00683783 * T2 - 0.05481717 * R2
          + 0.00122874 * T2 * RH + 0.00085282 * T * R2 - 0.00000199 * T2 * R2
        );
      }
      return Math.round(T);
    }

      if (typeof str !== 'string') return null;
      const matches = str.match(/\d+/g);
      if (!matches || !matches.length) return null;
      // "5 to 10 mph" → take the upper bound
      return parseInt(matches[matches.length - 1], 10);
    }

    function nwsIconToOurIcon(iconUrl, isDaytime) {
      if (!iconUrl) return 'cloud';
      const m = iconUrl.match(/\/icons\/[^/]+\/[^/]+\/([^/?,]+)/);
      const code = m ? m[1].toLowerCase() : '';
      if (code === 'skc' || code === 'hot') return 'sun';
      if (code === 'few' || code === 'sct' ||
          code === 'wind_skc' || code === 'wind_few' || code === 'wind_sct') {
        return isDaytime === false ? 'cloud' : 'partlyCloudy';
      }
      if (code === 'bkn' || code === 'ovc' || code === 'wind_bkn' || code === 'wind_ovc') return 'cloud';
      if (code.indexOf('tsra') === 0 ||
          code === 'tornado' || code === 'hurricane' || code === 'tropical_storm') return 'thunder';
      if (code.indexOf('snow') === 0 || code === 'blizzard' ||
          code === 'cold' || code === 'sleet' || code === 'snow_sleet' || code === 'snow_fzra') return 'snow';
      if (code.indexOf('rain') === 0 || code === 'fzra' || code === 'rain_fzra' || code === 'rain_sleet') return 'rain';
      if (code === 'fog' || code === 'smoke' || code === 'haze' || code === 'dust') return 'fog';
      return 'cloud';
    }

    function dayLabel(date, todayKey) {
      const dKey = date.toDateString();
      if (dKey === todayKey) return 'TODAY';
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (dKey === tomorrow.toDateString()) return 'TMRW';
      return date.toLocaleDateString('en', { weekday: 'short' }).toUpperCase();
    }

    function modeOf(arr) {
      if (!arr || !arr.length) return null;
      const counts = new Map();
      let best = arr[0], bestN = 0;
      for (const v of arr) {
        const n = (counts.get(v) || 0) + 1;
        counts.set(v, n);
        if (n > bestN) { bestN = n; best = v; }
      }
      return best;
    }

    async function fetchNWSWeather(lat, lon) {
      // NWS gridpoint: 2.5km resolution for CONUS. Two-step: points → forecastHourly.
      const pointsRes = await fetch(
        `https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`,
        { headers: { Accept: 'application/geo+json' }, cache: 'no-store' }
      );
      if (!pointsRes.ok) throw new Error(`NWS points ${pointsRes.status}`);
      const points = await pointsRes.json();

      const fcastUrl = points && points.properties && points.properties.forecastHourly;
      if (!fcastUrl) throw new Error('NWS missing forecastHourly URL');

      const fcastRes = await fetch(fcastUrl, {
        headers: { Accept: 'application/geo+json' }, cache: 'no-store'
      });
      if (!fcastRes.ok) throw new Error(`NWS hourly ${fcastRes.status}`);
      const fcast = await fcastRes.json();

      const periods = (fcast && fcast.properties && fcast.properties.periods) || [];
      if (!periods.length) throw new Error('NWS no periods');

      // Bucket hourly periods by local date.
      const byDate = new Map();
      for (const p of periods) {
        const d = new Date(p.startTime);
        const key = d.toDateString();
        if (!byDate.has(key)) byDate.set(key, { date: d, periods: [] });
        byDate.get(key).periods.push(p);
      }

      const todayKey = new Date().toDateString();
      const dateKeys = Array.from(byDate.keys()).slice(0, 7);

      const days = dateKeys.map((key) => {
        const { date, periods: dayPeriods } = byDate.get(key);
        const isToday = key === todayKey;
        const cur = dayPeriods[0];

        const temps = dayPeriods.map(p => Number(p.temperature)).filter(Number.isFinite);
        const hi = temps.length ? Math.max(...temps) : null;
        const lo = temps.length ? Math.min(...temps) : null;

        const winds = dayPeriods.map(p => parseNWSWindSpeed(p.windSpeed)).filter(Number.isFinite);
        const wind = isToday
          ? parseNWSWindSpeed(cur.windSpeed)
          : (winds.length ? Math.max(...winds) : null);

        const hums = dayPeriods
          .map(p => p.relativeHumidity ? Number(p.relativeHumidity.value) : null)
          .filter(Number.isFinite);
        const humidity = isToday
          ? (cur.relativeHumidity ? Number(cur.relativeHumidity.value) : null)
          : (hums.length ? Math.round(hums.reduce((s,v)=>s+v,0) / hums.length) : null);

        // Prefer daytime periods when picking the day's representative icon/text.
        const daytime = dayPeriods.filter(p => p.isDaytime !== false);
        const iconSrc = daytime.length ? daytime : dayPeriods;
        const icon = modeOf(iconSrc.map(p => nwsIconToOurIcon(p.icon, p.isDaytime !== false))) || 'cloud';
        const conditionText = modeOf(
          iconSrc.map(p => (p.shortForecast || '').trim()).filter(Boolean)
        ) || (cur.shortForecast || '').trim();

        const tempNow = Number(cur.temperature);
        const bigTemp = isToday
          ? (Number.isFinite(tempNow) ? tempNow : hi)
          : hi;
        const feels = isToday
          ? feelsLikeF(tempNow, humidity, wind)
          : null;

        return {
          date: key,
          label: dayLabel(date, todayKey),
          isToday,
          bigTemp: Number.isFinite(bigTemp) ? bigTemp : null,
          conditionText,
          icon,
          hi: Number.isFinite(hi) ? hi : null,
          lo: Number.isFinite(lo) ? lo : null,
          wind: Number.isFinite(wind) ? wind : null,
          humidity: Number.isFinite(humidity) ? humidity : null,
          feels: Number.isFinite(feels) ? feels : null
        };
      });

      return { source: 'NWS', days };
    }

    async function fetchLocalLabel(lat, lon, fallback) {
      // Reverse-geocode the rendezvous point to a neighborhood/suburb/quarter.
      // Nominatim's `address` object contains every admin level regardless of
      // zoom; we just pick the most specific present.
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=jsonv2&zoom=18&addressdetails=1`,
          { headers: { 'Accept-Language': 'en' }, cache: 'no-store' }
        );
        if (!res.ok) return fallback;
        const data = await res.json();
        const a = data && data.address ? data.address : {};
        return (
          a.neighbourhood || a.suburb     || a.quarter   ||
          a.city_district || a.borough    || a.district  ||
          a.town          || a.village    || a.hamlet    ||
          a.city          || a.county     || fallback
        );
      } catch (e) {
        return fallback;
      }
    }

    async function fetchOpenMeteoWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                  `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m` +
                  `&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,wind_speed_10m_max` +
                  `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=7` +
                  `&cell_selection=nearest`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Weather HTTP ${res.status}`);
      const data = await res.json();
      const cur = data.current || {};
      const dly = data.daily || {};
      const times = Array.isArray(dly.time) ? dly.time : [];
      if (!times.length) throw new Error('Open-Meteo no daily');

      const todayKey = new Date().toDateString();

      const days = times.map((t, i) => {
        // `t` is "YYYY-MM-DD" — interpret as a local-date-of-the-rendezvous's-timezone day.
        const [y, m, d] = String(t).split('-').map(Number);
        const date = new Date(y, (m || 1) - 1, d || 1);
        const dateKey = date.toDateString();
        const isToday = dateKey === todayKey;
        const code = Number((dly.weather_code || [])[i]);
        const info = WEATHER_CODE_MAP[code] || { text: 'Conditions Unknown', icon: 'cloud' };
        const hi = Number((dly.temperature_2m_max || [])[i]);
        const lo = Number((dly.temperature_2m_min || [])[i]);
        const dailyWind = Number((dly.wind_speed_10m_max || [])[i]);

        const bigTemp = isToday && Number.isFinite(cur.temperature_2m)
          ? cur.temperature_2m
          : (Number.isFinite(hi) ? hi : null);
        const wind = isToday && Number.isFinite(cur.wind_speed_10m)
          ? cur.wind_speed_10m
          : (Number.isFinite(dailyWind) ? dailyWind : null);
        const humidity = isToday && Number.isFinite(cur.relative_humidity_2m)
          ? cur.relative_humidity_2m
          : null;
        const feels = isToday && Number.isFinite(cur.apparent_temperature)
          ? cur.apparent_temperature
          : null;

        return {
          date: dateKey,
          label: dayLabel(date, todayKey),
          isToday,
          bigTemp: Number.isFinite(bigTemp) ? Math.round(bigTemp) : null,
          conditionText: info.text,
          icon: info.icon,
          hi: Number.isFinite(hi) ? Math.round(hi) : null,
          lo: Number.isFinite(lo) ? Math.round(lo) : null,
          wind: Number.isFinite(wind) ? Math.round(wind) : null,
          humidity: Number.isFinite(humidity) ? Math.round(humidity) : null,
          feels: Number.isFinite(feels) ? Math.round(feels) : null
        };
      });

      return { source: 'Open-Meteo', days };
    }

    async function renderWeather(lat, lon, cityLabel) {
      const section = document.getElementById('weatherSection');
      const content = document.getElementById('weatherContent');
      const badge   = document.getElementById('weatherLiveBadge');
      const cityEl  = document.getElementById('weatherCityLabel');
      if (!section || !content) return;

      // Kick off the neighborhood lookup in parallel with the weather fetch.
      const labelPromise = fetchLocalLabel(lat, lon, cityLabel);

      let payload = null;
      // Prefer NWS in the US — 2.5km grid forecast at the rendezvous point.
      if (isLikelyUS(lat, lon)) {
        try { payload = await fetchNWSWeather(lat, lon); } catch (e) { payload = null; }
      }
      // Open-Meteo fallback (global, with nearest-cell selection for coastal/edge points).
      if (!payload) {
        try { payload = await fetchOpenMeteoWeather(lat, lon); } catch (e) { payload = null; }
      }
      const days = payload && Array.isArray(payload.days) ? payload.days : [];
      if (!days.length || days[0].bigTemp == null) {
        section.style.display = 'none';
        return;
      }

      const localLabel = await labelPromise;

      content.innerHTML = `
        <div class="weather-hero-block" id="weatherHeroBlock"></div>
        <div class="weather-day-strip" id="weatherDayStrip"></div>
      `;
      const heroBlock = content.querySelector('#weatherHeroBlock');
      const strip     = content.querySelector('#weatherDayStrip');

      const pillIcon = (key) => {
        const svg = WEATHER_ICONS[key] || WEATHER_ICONS.cloud;
        return svg.replace('class="weather-icon"', 'class="weather-pill-icon"');
      };

      strip.innerHTML = days.map((d, i) => `
        <button type="button" class="weather-day-pill" data-idx="${i}" aria-pressed="false">
          <span class="weather-day-label">${escapeHtml(d.label)}</span>
          ${pillIcon(d.icon)}
          <span class="weather-day-temps">${d.hi != null ? d.hi + '°' : '—'}<small>/${d.lo != null ? d.lo + '°' : '—'}</small></span>
        </button>
      `).join('');

      const paintHero = (idx) => {
        const d = days[idx];
        if (!d) return;
        const metaParts = [];
        if (d.hi != null && d.lo != null) metaParts.push(`<span><strong>H</strong> ${d.hi}° <strong>L</strong> ${d.lo}°</span>`);
        if (d.wind     != null)           metaParts.push(`<span><strong>Wind</strong> ${d.wind} mph</span>`);
        if (d.humidity != null)           metaParts.push(`<span><strong>Humidity</strong> ${d.humidity}%</span>`);

        const subtitle = d.isToday
          ? (d.feels != null ? `<div class="weather-feels">Feels like ${d.feels}°</div>` : '')
          : `<div class="weather-feels">Forecast High</div>`;

        heroBlock.innerHTML = `
          <div class="weather-hero">
            ${WEATHER_ICONS[d.icon] || WEATHER_ICONS.cloud}
            <div class="weather-temp">${Math.round(d.bigTemp)}°</div>
          </div>
          <div class="weather-condition">${escapeHtml(d.conditionText)}</div>
          ${subtitle}
          ${metaParts.length ? `<div class="weather-meta">${metaParts.join('')}</div>` : ''}
        `;
        if (badge) badge.classList.toggle('show', !!d.isToday);
        Array.from(strip.children).forEach((el, i) => {
          const sel = i === idx;
          el.classList.toggle('is-selected', sel);
          el.setAttribute('aria-pressed', sel ? 'true' : 'false');
        });
      };

      strip.addEventListener('click', (e) => {
        const btn = e.target.closest('.weather-day-pill');
        if (!btn) return;
        const idx = Number(btn.dataset.idx);
        if (Number.isInteger(idx)) paintHero(idx);
      });

      paintHero(0);

      if (cityEl) cityEl.textContent = localLabel || cityLabel || '';
      section.style.display = 'flex';
    }

    async function fetchGameRecord(id) {
      const requestUrl = new URL(`rest/v1/${SB_CONFIG.table}`, `${SB_CONFIG.url.replace(/\/+$/, '')}/`);
      requestUrl.searchParams.set('select', '*');
      requestUrl.searchParams.set('id', `eq.${id}`);
      requestUrl.searchParams.set('limit', '1');

      const response = await fetch(requestUrl.toString(), {
        headers: {
          apikey: SB_CONFIG.key,
          Authorization: `Bearer ${SB_CONFIG.key}`,
          Accept: 'application/json'
        },
        cache: 'no-store'
      });

      if (!response.ok) {
        let message = `Request failed with status ${response.status}`;

        try {
          const payload = await response.json();
          message = payload.message || payload.error_description || payload.error || message;
        } catch (parseError) {
          // Fall back to the status-based message when no JSON body is available.
        }

        throw new Error(message);
      }

      const rows = await response.json();
      return Array.isArray(rows) ? rows[0] || null : null;
    }

    function multiplyGf256(x, y) {
      let result = 0;
      let a = x;
      let b = y;

      while (b > 0) {
        if (b & 1) {
          result ^= a;
        }

        a <<= 1;
        if (a & 0x100) {
          a ^= 0x11d;
        }
        b >>= 1;
      }

      return result;
    }

    function buildReedSolomonGenerator(degree) {
      let polynomial = [1];

      for (let i = 0; i < degree; i += 1) {
        const next = new Array(polynomial.length + 1).fill(0);

        for (let j = 0; j < polynomial.length; j += 1) {
          next[j] ^= multiplyGf256(polynomial[j], 1);
          next[j + 1] ^= multiplyGf256(polynomial[j], 1 << 0);
        }

        for (let j = 0; j < next.length; j += 1) {
          next[j] = next[j];
        }

        let factor = 1;
        for (let k = 0; k < i; k += 1) {
          factor = multiplyGf256(factor, 2);
        }

        const product = new Array(polynomial.length + 1).fill(0);
        for (let j = 0; j < polynomial.length; j += 1) {
          product[j] ^= polynomial[j];
          product[j + 1] ^= multiplyGf256(polynomial[j], factor);
        }
        polynomial = product;
      }

      return polynomial;
    }

    function computeErrorCorrection(dataCodewords, ecCodewords) {
      const generator = buildReedSolomonGenerator(ecCodewords);
      const remainder = new Array(ecCodewords).fill(0);

      for (const value of dataCodewords) {
        const factor = value ^ remainder[0];
        remainder.shift();
        remainder.push(0);

        for (let i = 0; i < ecCodewords; i += 1) {
          remainder[i] ^= multiplyGf256(generator[i + 1], factor);
        }
      }

      return remainder;
    }

    function appendBits(buffer, value, length) {
      for (let i = length - 1; i >= 0; i -= 1) {
        buffer.push((value >>> i) & 1);
      }
    }

    function createQrCodeBytes(text) {
      const version = 5;
      const dataCapacity = 108;
      const ecCodewords = 26;
      const maxPayloadLength = dataCapacity - 2;
      const encodedText = new TextEncoder().encode(text);

      if (encodedText.length > maxPayloadLength) {
        throw new Error('Invite link is too long to encode as a standalone QR code.');
      }

      const bits = [];
      appendBits(bits, 0b0100, 4);
      appendBits(bits, encodedText.length, 8);

      for (const byte of encodedText) {
        appendBits(bits, byte, 8);
      }

      const capacityBits = dataCapacity * 8;
      appendBits(bits, 0, Math.min(4, capacityBits - bits.length));

      while (bits.length % 8 !== 0) {
        bits.push(0);
      }

      const dataCodewords = [];
      for (let i = 0; i < bits.length; i += 8) {
        let value = 0;
        for (let j = 0; j < 8; j += 1) {
          value = (value << 1) | bits[i + j];
        }
        dataCodewords.push(value);
      }

      const padBytes = [0xec, 0x11];
      let padIndex = 0;
      while (dataCodewords.length < dataCapacity) {
        dataCodewords.push(padBytes[padIndex % padBytes.length]);
        padIndex += 1;
      }

      return dataCodewords.concat(computeErrorCorrection(dataCodewords, ecCodewords));
    }

    function createQrMatrix(text) {
      const version = 5;
      const size = 17 + version * 4;
      const matrix = Array.from({ length: size }, () => Array(size).fill(false));
      const isFunction = Array.from({ length: size }, () => Array(size).fill(false));
      const alignmentPositions = [6, 30];

      function setModule(x, y, value, markFunction = true) {
        matrix[y][x] = value;
        if (markFunction) {
          isFunction[y][x] = true;
        }
      }

      function drawFinder(x, y) {
        for (let dy = -1; dy <= 7; dy += 1) {
          for (let dx = -1; dx <= 7; dx += 1) {
            const xx = x + dx;
            const yy = y + dy;
            if (xx < 0 || yy < 0 || xx >= size || yy >= size) {
              continue;
            }

            const isBorder = dx === -1 || dx === 7 || dy === -1 || dy === 7;
            const isOuter = dx === 0 || dx === 6 || dy === 0 || dy === 6;
            const isInner = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
            setModule(xx, yy, !isBorder && (isOuter || isInner));
          }
        }
      }

      function drawAlignment(x, y) {
        for (let dy = -2; dy <= 2; dy += 1) {
          for (let dx = -2; dx <= 2; dx += 1) {
            setModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
          }
        }
      }

      function drawFormatBits(mask) {
        const formatData = (0b01 << 3) | mask;
        let formatBits = formatData << 10;
        const generator = 0x537;

        for (let i = 14; i >= 10; i -= 1) {
          if ((formatBits >>> i) & 1) {
            formatBits ^= generator << (i - 10);
          }
        }

        const finalBits = ((formatData << 10) | formatBits) ^ 0x5412;
        const bit = (index) => ((finalBits >>> index) & 1) === 1;

        for (let i = 0; i <= 5; i += 1) setModule(8, i, bit(i));
        setModule(8, 7, bit(6));
        setModule(8, 8, bit(7));
        setModule(7, 8, bit(8));
        for (let i = 9; i < 15; i += 1) setModule(14 - i, 8, bit(i));

        for (let i = 0; i < 8; i += 1) setModule(size - 1 - i, 8, bit(i));
        for (let i = 8; i < 15; i += 1) setModule(8, size - 15 + i, bit(i));
        setModule(8, size - 8, true);
      }

      function maskApplies(mask, x, y) {
        switch (mask) {
          case 0: return (x + y) % 2 === 0;
          case 1: return y % 2 === 0;
          case 2: return x % 3 === 0;
          case 3: return (x + y) % 3 === 0;
          case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
          case 5: return ((x * y) % 2) + ((x * y) % 3) === 0;
          case 6: return ((((x * y) % 2) + ((x * y) % 3)) % 2) === 0;
          case 7: return ((((x + y) % 2) + ((x * y) % 3)) % 2) === 0;
          default: return false;
        }
      }

      function penaltyScore(candidate) {
        let penalty = 0;

        for (let y = 0; y < size; y += 1) {
          let runColor = candidate[y][0];
          let runLength = 1;
          for (let x = 1; x < size; x += 1) {
            if (candidate[y][x] === runColor) {
              runLength += 1;
            } else {
              if (runLength >= 5) {
                penalty += runLength - 2;
              }
              runColor = candidate[y][x];
              runLength = 1;
            }
          }
          if (runLength >= 5) {
            penalty += runLength - 2;
          }
        }

        for (let x = 0; x < size; x += 1) {
          let runColor = candidate[0][x];
          let runLength = 1;
          for (let y = 1; y < size; y += 1) {
            if (candidate[y][x] === runColor) {
              runLength += 1;
            } else {
              if (runLength >= 5) {
                penalty += runLength - 2;
              }
              runColor = candidate[y][x];
              runLength = 1;
            }
          }
          if (runLength >= 5) {
            penalty += runLength - 2;
          }
        }

        for (let y = 0; y < size - 1; y += 1) {
          for (let x = 0; x < size - 1; x += 1) {
            const color = candidate[y][x];
            if (
              candidate[y][x + 1] === color &&
              candidate[y + 1][x] === color &&
              candidate[y + 1][x + 1] === color
            ) {
              penalty += 3;
            }
          }
        }

        const finderLike = [true, false, true, true, true, false, true, false, false, false, false];
        const reverseFinderLike = [...finderLike].reverse();

        function matchesPattern(line, index, pattern) {
          for (let i = 0; i < pattern.length; i += 1) {
            if (line[index + i] !== pattern[i]) {
              return false;
            }
          }
          return true;
        }

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x <= size - 11; x += 1) {
            if (matchesPattern(candidate[y], x, finderLike) || matchesPattern(candidate[y], x, reverseFinderLike)) {
              penalty += 40;
            }
          }
        }

        for (let x = 0; x < size; x += 1) {
          const column = [];
          for (let y = 0; y < size; y += 1) {
            column.push(candidate[y][x]);
          }
          for (let y = 0; y <= size - 11; y += 1) {
            if (matchesPattern(column, y, finderLike) || matchesPattern(column, y, reverseFinderLike)) {
              penalty += 40;
            }
          }
        }

        let darkModules = 0;
        for (const row of candidate) {
          for (const cell of row) {
            if (cell) {
              darkModules += 1;
            }
          }
        }

        const totalModules = size * size;
        const darkPercent = (darkModules * 100) / totalModules;
        penalty += Math.floor(Math.abs(darkPercent - 50) / 5) * 10;

        return penalty;
      }

      drawFinder(0, 0);
      drawFinder(size - 7, 0);
      drawFinder(0, size - 7);

      for (let i = 8; i < size - 8; i += 1) {
        setModule(i, 6, i % 2 === 0);
        setModule(6, i, i % 2 === 0);
      }

      for (const x of alignmentPositions) {
        for (const y of alignmentPositions) {
          const overlapsFinder =
            (x === 6 && y === 6) ||
            (x === 6 && y === size - 7) ||
            (x === size - 7 && y === 6);

          if (!overlapsFinder) {
            drawAlignment(x, y);
          }
        }
      }

      for (let i = 0; i < 8; i += 1) {
        if (i !== 6) {
          setModule(8, i, false);
          setModule(i, 8, false);
        }
      }
      for (let i = size - 8; i < size; i += 1) {
        setModule(8, i, false);
        setModule(i, 8, false);
      }
      setModule(8, size - 8, true);

      const codewords = createQrCodeBytes(text);
      const dataBits = [];
      for (const codeword of codewords) {
        appendBits(dataBits, codeword, 8);
      }

      let bitIndex = 0;
      let direction = -1;
      for (let x = size - 1; x >= 1; x -= 2) {
        if (x === 6) {
          x -= 1;
        }

        for (let step = 0; step < size; step += 1) {
          const y = direction === -1 ? size - 1 - step : step;
          for (let offset = 0; offset < 2; offset += 1) {
            const xx = x - offset;
            if (isFunction[y][xx]) {
              continue;
            }

            matrix[y][xx] = bitIndex < dataBits.length ? dataBits[bitIndex] === 1 : false;
            bitIndex += 1;
          }
        }

        direction *= -1;
      }

      let bestMask = 0;
      let bestMatrix = null;
      let bestPenalty = Number.POSITIVE_INFINITY;

      for (let mask = 0; mask < 8; mask += 1) {
        const candidate = matrix.map((row) => row.slice());

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            if (!isFunction[y][x] && maskApplies(mask, x, y)) {
              candidate[y][x] = !candidate[y][x];
            }
          }
        }

        const previousMatrix = matrix.map((row) => row.slice());
        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            matrix[y][x] = candidate[y][x];
          }
        }
        drawFormatBits(mask);
        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            candidate[y][x] = matrix[y][x];
            matrix[y][x] = previousMatrix[y][x];
          }
        }

        const score = penaltyScore(candidate);
        if (score < bestPenalty) {
          bestPenalty = score;
          bestMask = mask;
          bestMatrix = candidate;
        }
      }

      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          matrix[y][x] = bestMatrix[y][x];
        }
      }
      drawFormatBits(bestMask);

      return matrix;
    }

    function renderQrCode(container, text, size = 180) {
      const matrix = createQrMatrix(text);
      const moduleCount = matrix.length;
      const quietZone = 4;
      const totalModules = moduleCount + quietZone * 2;
      const moduleSize = size / totalModules;

      const svgParts = [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalModules} ${totalModules}" width="${size}" height="${size}" shape-rendering="crispEdges">`,
        `<rect width="${totalModules}" height="${totalModules}" fill="#ffffff"/>`
      ];

      for (let y = 0; y < moduleCount; y += 1) {
        for (let x = 0; x < moduleCount; x += 1) {
          if (matrix[y][x]) {
            svgParts.push(
              `<rect x="${x + quietZone}" y="${y + quietZone}" width="1" height="1" fill="#000000"/>`
            );
          }
        }
      }

      svgParts.push('</svg>');
      container.innerHTML = svgParts.join('');
      const svg = container.querySelector('svg');
      if (svg) {
        svg.style.display = 'block';
        svg.style.width = `${size}px`;
        svg.style.height = `${size}px`;
      }
    }

    async function init() {
      if (!gameId) {
        renderMissingGameSelection();
        return;
      }

      try {
        const game = await fetchGameRecord(gameId);
        if (!game) {
          renderFatalState('Error Loading Game');
          return;
        }

        const primaryColor = game.primary_color || game.primaryColor || '#33e6e6';
        const secondaryColor = game.secondary_color || game.secondaryColor || '#243256';
        document.documentElement.style.setProperty('--primary', primaryColor);
        document.documentElement.style.setProperty('--secondary', secondaryColor);
        document.body.style.background = primaryColor;

        const gameNode = {
          defaultEmoji:        game.default_emoji,
          tertiaryColor:       game.tertiary_color,
          quaternaryColor:     game.quaternary_color,
          body:                game.body,
          tagline:             game.tagline,
          city:                game.city,
          guideName:           game.guide_name,
          guideBio:            game.guide_bio,
          guideImageUrl:       game.guide_image_url,
          price:               game.price,
          howToPlay:           game.how_to_play,
          locationBased:       game.location_based,
          startingLocation:    game.starting_location,
          startingLocationLat: game.starting_location_lat,
          startingLocationLon: game.starting_location_lon,
          logoUrl:             game.logo_url || game.logoUrl || game.logo,
        };
        const defaultEmoji = gameNode.defaultEmoji || '🧩';

        const tertiaryColor = gameNode.tertiaryColor || '#ffffff';
        const quaternaryColor = gameNode.quaternaryColor || '#ffffff';
        document.documentElement.style.setProperty('--tertiary', tertiaryColor);
        document.documentElement.style.setProperty('--quaternary', quaternaryColor);
        document.body.style.color = quaternaryColor;
        const images = applyGameImages(gameNode);

        const gameName = String(game.name || 'Untitled Game').trim() || 'Untitled Game';
        const gameTagline = String(game.tagline || gameNode.tagline || '').trim();
        document.title = `${gameName} | THE GAME BUREAU`;
        const city = (gameNode.city || game.city || '').trim();
        document.getElementById('startBlurb').innerHTML = `You must go to <strong>${city}</strong> to play this game. Tap to reveal the starting point.`;

        // Preserve the engine selector in shared/QR links so scanning a
        // code generated on /game/run/?id=…&e=map also lands on the map
        // engine.
        const _qrEngineParam = String(urlParams.get('e') || '').trim();
        const qrUrl = `https://thegamebureau.com/game/run/index.html?id=${encodeURIComponent(gameId)}${_qrEngineParam ? `&e=${encodeURIComponent(_qrEngineParam)}` : ''}`;
        const ogImage = images.logoUrl;
        const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val || ''); };
        setMeta('meta[property="og:title"]', gameName);
        setMeta('meta[property="og:description"]', gameTagline);
        document.querySelector('meta[property="og:image"]')?.setAttribute('content', ogImage);
        setMeta('meta[property="og:url"]', qrUrl);
        setMeta('meta[name="twitter:title"]', gameName);
        setMeta('meta[name="twitter:description"]', gameTagline);
        document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', ogImage);
        const gameTitleEl = document.getElementById('gameTitle');
        gameTitleEl.textContent = gameName;

        gameTitleEl.style.color = secondaryColor;
        document.getElementById('gameTagline').textContent = gameTagline;

        if (gameNode.howToPlay) {
          document.getElementById('howToPlaySection').style.display = 'block';
          document.getElementById('howToPlayText').textContent = gameNode.howToPlay;
        }

        if (gameNode.guideName) {
          document.getElementById('guideSection').style.display = 'block';
          document.getElementById('guideNameDisplay').textContent = gameNode.guideName.toUpperCase();
          document.getElementById('guideDescription').textContent = gameNode.guideBio || 'Your mission lead.';
          const gImg = images.guideUrl || images.logoUrl || FALLBACK_GUIDE_AVATAR;
          document.getElementById('guideAvatar').src = gImg;
        }

        // START
        const isLocationBased = !!gameNode.locationBased;
        if (isLocationBased) {
          const startingLocation = (gameNode.startingLocation || '').trim();
          const startingLocationValid = startingLocation && startingLocation !== 'http://' && startingLocation !== 'https://';

          const urlMatch = startingLocation.match(/(?:what3words\.com|w3w\.co)\/([a-z]+\.[a-z]+\.[a-z]+)/i);
          const rawMatch = startingLocation.match(/\/{1,3}([a-z]+\.[a-z]+\.[a-z]+)/i);
          const words = urlMatch ? urlMatch[1].toLowerCase() : rawMatch ? rawMatch[1].toLowerCase() : null;
          const webUrl = words ? `https://what3words.com/${words}` : startingLocationValid ? startingLocation : null;

          const mapLat = typeof gameNode.startingLocationLat === 'number' ? gameNode.startingLocationLat : null;
          const mapLon = typeof gameNode.startingLocationLon === 'number' ? gameNode.startingLocationLon : null;
          const ll     = mapLat != null && mapLon != null ? `${mapLat},${mapLon}` : null;
          const locQ   = encodeURIComponent(words || city || '');
          const what3wordsCoordsUrl = (coords) => {
            if (!coords) return null;
            const [lat, lng] = String(coords).split(',').map(value => value.trim());
            return lat && lng
              ? `https://what3words.com/?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`
              : null;
          };
          const what3wordsPinUrl = (coords) => words
            ? `https://what3words.com/${words}`
            : what3wordsCoordsUrl(coords) || webUrl || 'https://what3words.com';
          const applePinLabel = encodeURIComponent(`${gameName} starting point`);
          const appleMapsUrl = (coords) => coords
            ? `https://maps.apple.com/?ll=${coords}&q=${applePinLabel}`
            : `https://maps.apple.com/?q=${locQ}`;
          const mapUrls = {
            apple:  appleMapsUrl(ll),
            google: `https://www.google.com/maps/search/?api=1&query=${ll || locQ}`,
            w3w:    what3wordsPinUrl(ll),
          };
          // Iframe-friendly URLs for the map lightbox.
          // Apple Maps blocks iframe embedding, so we substitute OpenStreetMap's
          // embed (iframe-safe, no key) centered on the same coordinates.
          const bboxPad = 0.003;
          const osmEmbedUrlFor = (lat, lon) =>
            `https://www.openstreetmap.org/export/embed.html?bbox=${lon - bboxPad},${lat - bboxPad},${lon + bboxPad},${lat + bboxPad}&marker=${lat},${lon}&layer=mapnik`;
          const osmEmbedUrl = (mapLat != null && mapLon != null) ? osmEmbedUrlFor(mapLat, mapLon) : null;
          const frameUrls = {
            apple:  osmEmbedUrl,
            google: `https://maps.google.com/maps?q=${ll || locQ}&output=embed`,
            w3w:    mapUrls.w3w,
          };

          // Lightbox
          const lightbox = document.getElementById('w3wLightbox');
          const lbFrame  = document.getElementById('w3wLightboxFrame');
          const lbLabel  = document.getElementById('w3wLightboxLabel');
          const openLightbox = (url, label) => {
            lbFrame.src = url;
            lbLabel.textContent = label;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
          };
          const closeLightbox = () => {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
            lbFrame.src = '';
          };
          document.getElementById('w3wLightboxClose').onclick = closeLightbox;

          const appNames = { apple: 'Apple Maps', google: 'Google Maps', w3w: 'what3words' };

          // Panel flip
          const btns  = document.getElementById('startMapButtons');
          const startFlip = document.getElementById('startFlip');

          const flipToFront = () => startFlip.classList.remove('flipped');
          const flipToBack  = () => {
            btns.style.display = 'flex';
            startFlip.classList.add('flipped');
          };

          document.getElementById('startingLocationSection').onclick = () => {
            if (startFlip.classList.contains('flipped')) flipToFront();
            else flipToBack();
          };
          document.getElementById('startMapButtons').onclick = (e) => { e.stopPropagation(); if (e.target === e.currentTarget) flipToFront(); };
          document.getElementById('startCloseBtn').onclick   = (e) => { e.stopPropagation(); flipToFront(); };

          document.querySelectorAll('#startMapButtons .start-map-btn').forEach(btn => {
            btn.addEventListener('click', e => {
              e.stopPropagation();
              const key = btn.dataset.map;
              if (!key) return;
              openLightbox(frameUrls[key] || mapUrls[key], appNames[key]);
            });
          });

          // Populate
          document.getElementById('startingLocationSection').style.display = 'flex';
          document.getElementById('startBlurb').innerHTML = `You must go to <strong>${city}</strong> to play this game. Tap to reveal the starting point.`;
          document.getElementById('startCityLabel').textContent = (gameNode.city || city || '').trim();

          // OSM background map
          const bgMap = document.getElementById('startBgMap');
          (async () => {
            try {
              let lat = null, lon = null;

              // 1. w3w → most precise
              if (words) {
                try {
                  const res  = await fetch(`https://api.what3words.com/v3/convert-to-coordinates?words=${encodeURIComponent(words)}&key=${what3wordsApiKey}`);
                  const data = await res.json();
                  if (data.coordinates) { lat = data.coordinates.lat; lon = data.coordinates.lng; }
                } catch(e) {}
              }

              // 2. stored lat/lon
              if (lat == null && mapLat != null) { lat = mapLat; lon = mapLon; }

              // 3. Nominatim city geocode
              if (lat == null) {
                const mapCity = (gameNode.city || '').trim();
                if (!mapCity) return;
                const res    = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(mapCity)}&format=json&limit=1`, { headers: { 'Accept-Language': 'en' } });
                const places = await res.json();
                if (!places.length) return;
                lat = parseFloat(places[0].lat);
                lon = parseFloat(places[0].lon);
              }

              // Live weather for the rendezvous coordinates.
              renderWeather(lat, lon, (gameNode.city || city || '').trim());

              // Backfill links that need resolved coordinates for a pinned destination.
              const resolvedLL = `${lat},${lon}`;
              mapUrls.apple    = appleMapsUrl(resolvedLL);
              mapUrls.google   = `https://www.google.com/maps/search/?api=1&query=${resolvedLL}`;
              frameUrls.apple  = osmEmbedUrlFor(lat, lon);
              frameUrls.google = `https://maps.google.com/maps?q=${resolvedLL}&output=embed`;
              mapUrls.w3w      = what3wordsPinUrl(resolvedLL);
              frameUrls.w3w    = mapUrls.w3w;

              const zoom = (words || mapLat != null) ? 15 : 12;
              const W = bgMap.offsetWidth || 640, H = bgMap.offsetHeight || 400;
              const canvas = document.createElement('canvas');
              canvas.width = W; canvas.height = H;
              const ctx = canvas.getContext('2d');
              const ts = 256, n = Math.pow(2, zoom);
              const tXf = (lon + 180) / 360 * n;
              const tYf = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
              const tXi = Math.floor(tXf), tYi = Math.floor(tYf);
              const oX = (tXf - tXi) * ts, oY = (tYf - tYi) * ts;
              const cx = W / 2, cy = H / 2;
              const rX = Math.ceil(W / ts / 2) + 1, rY = Math.ceil(H / ts / 2) + 1;
              await Promise.all(
                Array.from({ length: (2*rY+1)*(2*rX+1) }, (_, i) => {
                  const dy = Math.floor(i / (2*rX+1)) - rY;
                  const dx = (i % (2*rX+1)) - rX;
                  return new Promise(r => {
                    const img = new Image(); img.crossOrigin = 'anonymous';
                    img.onload  = () => { ctx.drawImage(img, Math.round(cx - oX + dx*ts), Math.round(cy - oY + dy*ts), ts, ts); r(); };
                    img.onerror = r;
                    img.src = `https://tile.openstreetmap.org/${zoom}/${tXi+dx}/${tYi+dy}.png`;
                  });
                })
              );
              try { bgMap.style.backgroundImage = `url(${canvas.toDataURL()})`; } catch(e) {}
            } catch(e) {}
          })();
        } else {
          document.getElementById('startingLocationSection').style.display = 'none';
        }
        // /START

        // ── SHARE ──
        {
          document.getElementById('shareSection').style.display = 'flex';
          const shareText = gameTagline || gameName;
          const clipboardShareText = [
            gameName,
            gameTagline,
            qrUrl
          ].filter(Boolean).join('\n');

          document.getElementById('shareBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (navigator.share) {
              navigator.share({ title: gameName, text: shareText, url: qrUrl }).catch(() => {});
            } else {
              navigator.clipboard?.writeText(clipboardShareText).catch(() => {});
            }
          });

          try {
            new QRCode(document.getElementById('shareQrContainer'), {
              text: qrUrl, width: 200, height: 200,
              colorDark: '#000000', colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.M
            });
          } catch (e) { document.getElementById('shareQrContainer').style.display = 'none'; }

        }
        // /SHARE

        const bodyText = gameNode.body || '';
        document.getElementById('desc').textContent = bodyText;
        if (bodyText) document.getElementById('descSection').style.display = 'block';
        document.getElementById('gamePrice').textContent = (gameNode.price || 'FREE').toUpperCase();

        // Engine selection precedence:
        //   1. ?e=<engine> in the run URL (manual override / sharing).
        //   2. The game's saved `engine` column on the games row (the
        //      designer's choice in the builder).
        //   3. Fall through to the player router's default ("text"),
        //      matching the router's behavior in /game/play/index.html.
        {
          const playUrl = new URL('../../game/play/index.html', window.location.href);
          playUrl.searchParams.set('id', gameId);
          const urlEngine = String(urlParams.get('e') || '').trim();
          const dbEngine = String(game.engine || '').trim();
          const engineParam = urlEngine || dbEngine;
          if (engineParam) playUrl.searchParams.set('e', engineParam);
          document.getElementById('startBtn').href = playUrl.toString();
        }
        document.getElementById('landing').style.display = 'block';
        const ctaBar = document.getElementById('ctaBar');
        ctaBar.style.background = primaryColor;
        ctaBar.style.display = 'flex';
      } catch (error) {
        console.error('Game fetch error:', error);
        renderFatalState('Error Loading Game');
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      init();

      const lightbox = document.getElementById('guideLightbox');
      const lightboxImg = document.getElementById('guideLightboxImg');
      const avatar = document.getElementById('guideAvatar');

      avatar.addEventListener('click', function () {
        lightboxImg.src = this.src;
        lightbox.classList.add('open');
      });

      lightbox.addEventListener('click', function () {
        lightbox.classList.remove('open');
      });
    });
  </script>

  <div class="guide-lightbox" id="guideLightbox">
    <img id="guideLightboxImg" src="" alt="Guide">
  </div>
</body>
</html>
