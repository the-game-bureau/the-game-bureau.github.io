  <script>
    const SB_CONFIG = {
      url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
      key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3'
    };

    const DEFAULT_WPID = '1543';
    const DEFAULT_WAYPOINT = {
      wpid: 1543,
      name: 'Cafe du Monde',
      address: '800 Decatur St',
      city: 'New Orleans',
      state: 'LA',
      zip: '70116',
      description: 'The classic French Quarter coffee stand, known for cafe au lait and beignets dusted in powdered sugar.',
      lat: 29.957604,
      lon: -90.061769
    };

    const DEFAULT_GAME_ID = 'nor2026ari';

    // Live-navigation tuning (meters / zoom).
    const NAV_ZOOM = 18;
    const NAV_ANCHOR_Y = 0.6;        // user dot sits in the lower third, route ahead
    const PREVIEW_ANCHOR_Y = 0.4;
    const ARRIVAL_RADIUS = 25;       // within this of the destination -> arrived
    const ADVANCE_RADIUS = 16;       // within this of a maneuver -> advance to the next
    const REROUTE_RADIUS = 55;       // farther than this from the route -> re-route
    const RECENTER_MIN_MOVE = 8;     // re-render the map only after moving this far

    const params = new URLSearchParams(window.location.search);
    const gameId = cleanText(params.get('id') || params.get('game') || '') || DEFAULT_GAME_ID;
    const requestedWpid = cleanWpid(params.get('wpid') || params.get('waypoint') || '');
    const wpid = requestedWpid || DEFAULT_WPID;

    const body = document.body;
    const mapBg = document.getElementById('mapBg');
    const mapHitLayer = document.getElementById('mapHitLayer');
    const mapTileLayer = document.getElementById('mapTileLayer');
    const routeLayer = document.getElementById('routeLayer');
    const userDot = document.getElementById('userDot');
    const destLabel = document.getElementById('destLabel');
    const destLabelName = destLabel.querySelector('.dest-label-name');
    const destLabelSub = destLabel.querySelector('.dest-label-sub');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const recenterBtn = document.getElementById('recenterBtn');
    const statusText = document.getElementById('statusText');
    const errorCard = document.getElementById('errorCard');
    const errorText = document.getElementById('errorText');
    const errorBackBtn = document.getElementById('errorBackBtn');
    const wpName = document.getElementById('wpName');
    const wpDescription = document.getElementById('wpDescription');
    const wpAddress = document.getElementById('wpAddress');
    const sheetNotice = document.getElementById('sheetNotice');
    const backBtn = document.getElementById('backBtn');
    const navBackBtn = document.getElementById('navBackBtn');
    const startBtn = document.getElementById('startBtn');
    const mapsBtn = document.getElementById('mapsBtn');
    const navArrow = document.getElementById('navArrow');
    const navDist = document.getElementById('navDist');
    const navInstruction = document.getElementById('navInstruction');
    const etaText = document.getElementById('etaText');
    const etaSub = document.getElementById('etaSub');
    const arriveBtn = document.getElementById('arriveBtn');
    const arriveBtn2 = document.getElementById('arriveBtn2');
    const arrivedName = document.getElementById('arrivedName');

    function cleanText(value) {
      return String(value == null ? '' : value).trim();
    }

    function cleanWpid(value) {
      const match = cleanText(value).match(/^\d+$/);
      return match ? match[0] : '';
    }

    function restUrl(table, query) {
      const url = new URL('/rest/v1/' + encodeURIComponent(table), SB_CONFIG.url + '/');
      Object.entries(query || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.toString();
    }

    function restHeaders() {
      return {
        apikey: SB_CONFIG.key,
        Authorization: 'Bearer ' + SB_CONFIG.key,
        Accept: 'application/json'
      };
    }

    async function fetchOne(table, query) {
      const response = await fetch(restUrl(table, Object.assign({}, query, { limit: 1 })), {
        headers: restHeaders(),
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('Request failed with status ' + response.status);
      const rows = await response.json();
      return Array.isArray(rows) && rows[0] ? rows[0] : null;
    }

    async function loadWaypoint(id) {
      const row = await fetchOne('waypoints', {
        select: 'wpid,name,address,city,state,zip,description',
        wpid: 'eq.' + id
      });
      if (row) return row;
      if (id === DEFAULT_WPID) return DEFAULT_WAYPOINT;
      throw new Error("We couldn't find this stop.");
    }

    async function loadGame(id) {
      if (!id) return null;
      return fetchOne('games_with_teams', {
        select: '*',
        id: 'eq.' + id
      }).catch(() => null);
    }

    async function applyGameTheme(game) {
      if (!game || typeof game !== 'object') return;

      // Fandom games (e.g. the default nor2026ari) store no colors on the row —
      // the brand palette derives from the away team via team-palette.js
      // (helmet -> primary, stripe -> secondary, mask -> tertiary, auto-contrast
      // font -> quaternary, first non-near-white -> accent). Non-fandom games
      // fall back to the row's own colors.
      let palette = null;
      if (window.TgbTeamPalette) {
        try {
          const teams = await window.TgbTeamPalette.loadTeams(SB_CONFIG);
          palette = window.TgbTeamPalette.resolveGamePalette(teams, game, 'away').palette;
        } catch (error) {
          console.warn('Team palette fetch failed:', error);
        }
      }

      const root = document.documentElement;
      [
        ['--primary', (palette && palette.primary) || game.primary_color],
        ['--secondary', (palette && palette.secondary) || game.secondary_color],
        ['--tertiary', (palette && palette.tertiary) || game.tertiary_color],
        ['--quaternary', (palette && palette.quaternary) || game.quaternary_color],
        ['--accent', (palette && palette.accent) || game.primary_color]
      ].forEach(([prop, value]) => {
        const color = cleanText(value);
        if (color) root.style.setProperty(prop, color);
      });
    }

    function waypointAddressText(waypoint) {
      const line1 = cleanText(waypoint.address);
      const cityState = [cleanText(waypoint.city), cleanText(waypoint.state)].filter(Boolean).join(', ');
      const line2 = [cityState, cleanText(waypoint.zip)].filter(Boolean).join(' ');
      return [line1, line2].filter(Boolean).join('\n');
    }

    function destinationQuery(waypoint) {
      const lat = Number(waypoint.lat);
      const lon = Number(waypoint.lon);
      if (Number.isFinite(lat) && Number.isFinite(lon)) return lat + ',' + lon;
      return [cleanText(waypoint.name), waypointAddressText(waypoint)].filter(Boolean).join(', ');
    }

    function directionsUrl(waypoint) {
      const url = new URL('https://www.google.com/maps/dir/');
      url.searchParams.set('api', '1');
      url.searchParams.set('destination', destinationQuery(waypoint));
      url.searchParams.set('travelmode', 'walking');
      return url.toString();
    }

    /* ---------- Map projection / rendering ---------- */
    let mapView = null;

    function lonToTileX(lon, zoom) {
      return ((lon + 180) / 360) * Math.pow(2, zoom);
    }

    function latToTileY(lat, zoom) {
      const rad = lat * Math.PI / 180;
      return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, zoom);
    }

    function tileXToLon(x, zoom) {
      return x / Math.pow(2, zoom) * 360 - 180;
    }

    function tileYToLat(y, zoom) {
      const n = Math.PI - 2 * Math.PI * y / Math.pow(2, zoom);
      return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    // anchorY is where the geographic center sits vertically (0 top, 1 bottom).
    function renderMap(centerLat, centerLon, zoom, anchorY) {
      if (!mapTileLayer) return;
      const lat = Number(centerLat);
      const lon = Number(centerLon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const tileSize = 256;
      const worldTiles = Math.pow(2, zoom);
      const viewportWidth = Math.max(window.innerWidth || 0, 320);
      const viewportHeight = Math.max(window.innerHeight || 0, 480);
      const offsetX = viewportWidth / 2;
      const offsetY = viewportHeight * (Number.isFinite(anchorY) ? anchorY : 0.5);
      const centerX = lonToTileX(lon, zoom) * tileSize;
      const centerY = latToTileY(lat, zoom) * tileSize;
      mapView = { zoom, tileSize, centerX, centerY, offsetX, offsetY, viewportWidth, viewportHeight };

      const firstTileX = Math.floor((centerX - offsetX) / tileSize) - 1;
      const lastTileX = Math.floor((centerX - offsetX + viewportWidth) / tileSize) + 1;
      const firstTileY = Math.floor((centerY - offsetY) / tileSize) - 1;
      const lastTileY = Math.floor((centerY - offsetY + viewportHeight) / tileSize) + 1;

      mapTileLayer.textContent = '';
      for (let ty = firstTileY; ty <= lastTileY; ty += 1) {
        if (ty < 0 || ty >= worldTiles) continue;
        for (let tx = firstTileX; tx <= lastTileX; tx += 1) {
          const wrappedX = ((tx % worldTiles) + worldTiles) % worldTiles;
          const img = document.createElement('img');
          img.alt = '';
          img.decoding = 'async';
          img.loading = 'eager';
          img.src = 'https://tile.openstreetmap.org/' + zoom + '/' + wrappedX + '/' + ty + '.png';
          img.style.left = Math.round(tx * tileSize - centerX + offsetX) + 'px';
          img.style.top = Math.round(ty * tileSize - centerY + offsetY) + 'px';
          mapTileLayer.appendChild(img);
        }
      }
    }

    function projectPoint(lat, lon) {
      if (!mapView) return null;
      const x = lonToTileX(lon, mapView.zoom) * mapView.tileSize - mapView.centerX + mapView.offsetX;
      const y = latToTileY(lat, mapView.zoom) * mapView.tileSize - mapView.centerY + mapView.offsetY;
      return { x, y };
    }

    function haversineMeters(a, b) {
      const R = 6371000;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLon = (b.lon - a.lon) * Math.PI / 180;
      const lat1 = a.lat * Math.PI / 180;
      const lat2 = b.lat * Math.PI / 180;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function routeBounds(points) {
      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      points.forEach((p) => {
        const lat = Number(p && p.lat);
        const lon = Number(p && p.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      });
      if (minLat === Infinity) return null;
      return { minLat, maxLat, minLon, maxLon };
    }

    /* ---------- Walking route + turn instructions (keyless: OSRM foot) ---------- */
    async function fetchWalkingRoute(origin, dest) {
      const url = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/'
        + origin.lon + ',' + origin.lat + ';' + dest.lon + ',' + dest.lat
        + '?overview=full&geometries=geojson&steps=true';
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error('Route request failed with status ' + response.status);
      const data = await response.json();
      const route = data && Array.isArray(data.routes) ? data.routes[0] : null;
      if (!route || !route.geometry || !Array.isArray(route.geometry.coordinates)) throw new Error('No route found.');

      const steps = [];
      (Array.isArray(route.legs) ? route.legs : []).forEach((leg) => {
        (Array.isArray(leg.steps) ? leg.steps : []).forEach((step) => {
          const m = step.maneuver || {};
          const loc = Array.isArray(m.location) ? { lon: m.location[0], lat: m.location[1] } : null;
          if (!loc) return;
          steps.push({
            type: cleanText(m.type),
            modifier: cleanText(m.modifier),
            bearing: Number(m.bearing_after),
            name: cleanText(step.name),
            distance: Number(step.distance) || 0,
            location: loc
          });
        });
      });

      return {
        coords: route.geometry.coordinates.map((c) => ({ lon: c[0], lat: c[1] })),
        distance: route.distance,
        duration: route.duration,
        steps
      };
    }

    function bearingToCardinal(deg) {
      if (!Number.isFinite(deg)) return '';
      return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round((deg % 360) / 45) % 8];
    }

    function stepInstruction(step) {
      const type = step.type;
      const mod = step.modifier;
      const road = step.name;
      const onto = road ? ' onto ' + road : '';
      const along = road ? ' on ' + road : '';
      let text;
      switch (type) {
        case 'depart': text = 'Head ' + (bearingToCardinal(step.bearing) || 'out') + along; break;
        case 'turn': text = 'Turn ' + (mod || 'ahead') + onto; break;
        case 'end of road': text = 'At the end of the road, turn ' + (mod || 'ahead') + onto; break;
        case 'fork': text = 'Keep ' + (mod || 'straight') + onto; break;
        case 'merge': text = 'Merge' + onto; break;
        case 'roundabout': case 'rotary': text = 'At the roundabout, continue' + onto; break;
        case 'continue': text = 'Continue ' + (mod && mod !== 'straight' ? mod : '') + along; break;
        case 'new name': text = 'Continue' + along; break;
        case 'arrive': text = 'Arrive at ' + destinationName; break;
        default: text = road ? 'Continue on ' + road : 'Continue';
      }
      return text.replace(/\s+/g, ' ').trim();
    }

    function maneuverArrow(step) {
      if (step.type === 'arrive') return '◉';
      if (step.modifier === 'uturn') return '↩';
      switch (step.modifier) {
        case 'sharp left':
        case 'left': return '↰';
        case 'slight left': return '↖';
        case 'sharp right':
        case 'right': return '↱';
        case 'slight right': return '↗';
        default: return '↑';
      }
    }

    function formatDistance(meters) {
      const m = Number(meters) || 0;
      const feet = m * 3.28084;
      if (feet < 1000) return Math.max(10, Math.round(feet / 10) * 10) + ' ft';
      return (m / 1609.34).toFixed(1) + ' mi';
    }

    function straightSteps(origin, dest) {
      return [
        { type: 'depart', modifier: '', bearing: NaN, name: '', distance: haversineMeters(origin, dest), location: origin },
        { type: 'arrive', modifier: '', bearing: NaN, name: '', distance: 0, location: dest }
      ];
    }

    /* ---------- Painting the route + markers ---------- */
    const MIN_ZOOM = 3, MAX_ZOOM = 19;
    const route = { coords: [], steps: [], dest: null, distance: 0, duration: 0 };
    let view = null;            // { lat, lon, zoom, anchorY } — the current map view
    let userPanned = false;     // user dragged away from auto-follow
    let userPos = null;
    let navigating = false;
    let arrived = false;
    let stepIndex = 0;
    let watchId = 0;
    let lastRenderPos = null;
    let rerouting = false;
    let lastRerouteAt = 0;

    function setNotice(message) {
      if (!sheetNotice) return;
      sheetNotice.textContent = cleanText(message);
    }

    function setPageMode(mode) {
      body.classList.toggle('is-loading', mode === 'loading');
      body.classList.toggle('is-error', mode === 'error');
      body.classList.toggle('is-navigating', mode === 'navigating' || mode === 'arrived');
      body.classList.toggle('is-arrived', mode === 'arrived');
    }

    function resetStartButton() {
      startBtn.disabled = false;
      startBtn.textContent = 'Start walking';
    }

    function enterPreview() {
      navigating = false;
      arrived = false;
      stopWatch();
      setPageMode('preview');
      resetStartButton();
      renderPreviewMap();
    }

    function enterNavigation(origin) {
      userPos = origin;
      stepIndex = 0;
      navigating = true;
      arrived = false;
      lastRenderPos = null;
      setNotice('');
      setPageMode('navigating');
      renderFollow();
      updateNavHud(origin);
      startWatch();
    }

    function paintRoute() {
      if (!mapView) return;
      const vw = mapView.viewportWidth;
      const vh = mapView.viewportHeight;
      routeLayer.setAttribute('width', vw);
      routeLayer.setAttribute('height', vh);
      routeLayer.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);

      let svg = '';
      if (route.coords.length >= 2) {
        const pts = route.coords.map((c) => projectPoint(c.lat, c.lon)).filter(Boolean);
        if (pts.length >= 2) {
          const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
          svg += '<path class="route-line-casing" d="' + d + '"></path><path class="route-line" d="' + d + '"></path>';
        }
      }
      if (route.dest) {
        const t = projectPoint(route.dest.lat, route.dest.lon);
        if (t) {
          svg += '<circle class="route-dest-ring" cx="' + t.x.toFixed(1) + '" cy="' + t.y.toFixed(1) + '" r="11"></circle>'
            + '<circle class="route-dest" cx="' + t.x.toFixed(1) + '" cy="' + t.y.toFixed(1) + '" r="5"></circle>';
        }
      }
      routeLayer.innerHTML = svg;
      positionDestLabel();
    }

    function positionUserDot() {
      if (!userPos || !mapView) { userDot.style.display = 'none'; return; }
      const p = projectPoint(userPos.lat, userPos.lon);
      if (!p) { userDot.style.display = 'none'; return; }
      userDot.style.display = 'block';
      userDot.style.left = p.x.toFixed(1) + 'px';
      userDot.style.top = p.y.toFixed(1) + 'px';
    }

    // The destination details label hovers just above the destination pin.
    function positionDestLabel() {
      if (!route.dest || !mapView) { destLabel.style.visibility = 'hidden'; return; }
      const p = projectPoint(route.dest.lat, route.dest.lon);
      if (!p) { destLabel.style.visibility = 'hidden'; return; }
      destLabel.style.visibility = 'visible';
      destLabel.style.left = p.x.toFixed(1) + 'px';
      destLabel.style.top = (p.y - 15).toFixed(1) + 'px';
    }

    // Single low-level entry point for setting the map view; everything else
    // (preview, follow, drag, zoom) routes through here.
    function setView(lat, lon, zoom, anchorY) {
      view = { lat, lon, zoom: Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom)), anchorY };
      renderMap(view.lat, view.lon, view.zoom, view.anchorY);
      paintRoute();
      positionUserDot();
    }

    function renderPreviewMap() {
      if (!route.dest) return;
      userPanned = false;
      body.classList.remove('is-panned');
      setView(route.dest.lat, route.dest.lon, 16, PREVIEW_ANCHOR_Y);
    }

    function renderFollow() {
      if (!userPos) return;
      const zoom = view ? view.zoom : NAV_ZOOM;
      setView(userPos.lat, userPos.lon, zoom, NAV_ANCHOR_Y);
      lastRenderPos = userPos;
    }

    function maybeRecenter() {
      if (!userPos) return;
      if (userPanned) { positionUserDot(); positionDestLabel(); return; }
      if (!lastRenderPos || haversineMeters(userPos, lastRenderPos) > RECENTER_MIN_MOVE) renderFollow();
      else positionUserDot();
    }

    function recenterMap() {
      userPanned = false;
      body.classList.remove('is-panned');
      if (navigating) renderFollow();
      else renderPreviewMap();
    }

    /* ---------- Drag to pan, pinch / wheel / buttons to zoom ---------- */
    const pointers = new Map();
    let dragStart = null;
    let pinchStart = null;
    let panRaf = 0;
    let dragMoved = false;
    let suppressNextMapClick = false;
    const mapSurface = mapHitLayer || mapBg;

    function setPanned() {
      if (userPanned) return;
      userPanned = true;
      body.classList.add('is-panned');
    }

    function zoomBy(delta) {
      if (!view) return;
      // Zooming keeps the current mode: while following it just changes the
      // follow zoom; panning leaves the panned center in place.
      setView(view.lat, view.lon, view.zoom + delta, view.anchorY);
    }

    mapSurface.addEventListener('pointerdown', (e) => {
      if (!view) return;
      dragMoved = false;
      if (mapSurface.setPointerCapture) mapSurface.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        dragStart = {
          x: e.clientX, y: e.clientY,
          cx: lonToTileX(view.lon, view.zoom) * 256,
          cy: latToTileY(view.lat, view.zoom) * 256,
          zoom: view.zoom
        };
        pinchStart = null;
      } else if (pointers.size === 2) {
        dragStart = null;
        const p = [...pointers.values()];
        pinchStart = { dist: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) };
      }
    });

    mapSurface.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pinchStart && pointers.size >= 2) {
        const p = [...pointers.values()];
        const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        const ratio = dist / pinchStart.dist;
        if (ratio > 1.6) { zoomBy(1); pinchStart.dist = dist; }
        else if (ratio < 0.625) { zoomBy(-1); pinchStart.dist = dist; }
        return;
      }

      if (dragStart) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (!body.classList.contains('is-dragging') && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
          body.classList.add('is-dragging');
          dragMoved = true;
          setPanned();
        }
        const lon = tileXToLon((dragStart.cx - dx) / 256, dragStart.zoom);
        const lat = tileYToLat((dragStart.cy - dy) / 256, dragStart.zoom);
        if (panRaf) cancelAnimationFrame(panRaf);
        panRaf = requestAnimationFrame(() => { setView(lat, lon, dragStart.zoom, view.anchorY); });
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 0) {
        if (dragMoved) suppressNextMapClick = true;
        dragStart = null;
        body.classList.remove('is-dragging');
      }
    }
    mapSurface.addEventListener('pointerup', endPointer);
    mapSurface.addEventListener('pointercancel', endPointer);

    mapSurface.addEventListener('wheel', (e) => {
      if (!view) return;
      e.preventDefault();
      zoomBy(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });

    mapSurface.addEventListener('click', () => {
      if (suppressNextMapClick) {
        suppressNextMapClick = false;
        return;
      }
      if (userPanned) recenterMap();
    });

    zoomInBtn.addEventListener('click', () => zoomBy(1));
    zoomOutBtn.addEventListener('click', () => zoomBy(-1));
    recenterBtn.addEventListener('click', recenterMap);

    /* ---------- Live navigation ---------- */
    let destinationName = 'your destination';

    function advanceStep(user) {
      const steps = route.steps;
      while (stepIndex < steps.length - 1 && haversineMeters(user, steps[stepIndex].location) < ADVANCE_RADIUS) {
        stepIndex += 1;
      }
    }

    function updateNavHud(user) {
      const steps = route.steps;
      const step = steps[stepIndex] || steps[steps.length - 1];
      if (step) {
        navArrow.textContent = maneuverArrow(step);
        navDist.textContent = formatDistance(haversineMeters(user, step.location));
        navInstruction.textContent = stepInstruction(step);
      }
      let remaining = haversineMeters(user, route.dest);
      for (let i = stepIndex + 1; i < steps.length; i += 1) remaining += steps[i].distance;
      const minutes = Math.max(1, Math.round(remaining / 1.35 / 60));
      etaText.textContent = minutes + ' min';
      etaSub.textContent = formatDistance(remaining) + ' · ' + destinationName;
    }

    function maybeReroute(user) {
      if (rerouting || !route.coords.length) return;
      let min = Infinity;
      for (const c of route.coords) {
        const d = haversineMeters(user, c);
        if (d < min) min = d;
        if (min < REROUTE_RADIUS) break;
      }
      if (min < REROUTE_RADIUS) return;
      const now = Date.now();
      if (now - lastRerouteAt < 10000) return;
      lastRerouteAt = now;
      rerouting = true;
      fetchWalkingRoute(user, route.dest)
        .then((r) => {
          if (r && r.coords.length >= 2) {
            route.coords = r.coords;
            route.steps = r.steps;
            stepIndex = 0;
            renderFollow();
          }
        })
        .catch(() => {})
        .finally(() => { rerouting = false; });
    }

    function onPosition(pos) {
      const user = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      userPos = user;

      if (route.dest && haversineMeters(user, route.dest) <= ARRIVAL_RADIUS) {
        enterArrived();
        positionUserDot();
        return;
      }
      advanceStep(user);
      updateNavHud(user);
      maybeReroute(user);
      maybeRecenter();
    }

    function startWatch() {
      if (!navigator.geolocation || watchId) return;
      watchId = navigator.geolocation.watchPosition(onPosition, () => {}, {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 15000
      });
    }

    function stopWatch() {
      if (watchId && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
      watchId = 0;
    }

    function enterArrived() {
      if (arrived) return;
      arrived = true;
      navigating = false;
      setPageMode('arrived');
      arrivedName.textContent = destinationName;
      stopWatch();
    }

    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation is unavailable.'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
          (err) => reject(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
        );
      });
    }

    async function startNavigation() {
      if (navigating || !route.dest) return;
      startBtn.disabled = true;
      startBtn.textContent = 'Finding your location…';

      let origin;
      try {
        origin = await getCurrentPosition();
      } catch (error) {
        resetStartButton();
        setNotice('Location is off. You can still open this stop in Maps.');
        return;
      }

      let resolved = null;
      try {
        resolved = await fetchWalkingRoute(origin, route.dest);
      } catch (error) {
        resolved = null;
      }

      if (resolved && resolved.coords.length >= 2) {
        route.coords = resolved.coords;
        route.steps = resolved.steps;
        route.distance = resolved.distance;
        route.duration = resolved.duration;
      } else {
        // When the route service is unavailable, keep a simple heading toward
        // the stop instead of blocking the player.
        route.coords = [origin, route.dest];
        route.steps = straightSteps(origin, route.dest);
      }

      enterNavigation(origin);
    }

    window.addEventListener('resize', () => {
      if (navigating) renderFollow();
      else renderPreviewMap();
    });

    /* ---------- Run/forwarding URLs ---------- */
    function appendArrivalParams(url, waypoint) {
      const idParam = cleanText(params.get('id'));
      const gameParam = cleanText(params.get('game'));
      const waypointId = cleanWpid(waypoint && waypoint.wpid) || wpid;

      if (idParam) url.searchParams.set('id', idParam);
      if (gameParam) url.searchParams.set('game', gameParam);
      if (!idParam && !gameParam && gameId) url.searchParams.set('id', gameId);
      if (waypointId) {
        url.searchParams.set('wpid', waypointId);
        url.searchParams.set('waypoint', waypointId);
        url.searchParams.set('arrived_wpid', waypointId);
      }
      return url;
    }

    function appendSharedRunParams(url) {
      const idParam = cleanText(params.get('id'));
      const gameParam = cleanText(params.get('game'));

      if (idParam && !url.searchParams.has('id')) url.searchParams.set('id', idParam);
      if (gameParam && !url.searchParams.has('game')) url.searchParams.set('game', gameParam);
      if (!idParam && !gameParam && gameId && !url.searchParams.has('id') && !url.searchParams.has('game')) {
        url.searchParams.set('id', gameId);
      }
      ['access_code', 'code', 'auto_redeem', 'teams', 'session', 'mode'].forEach((key) => {
        const value = cleanText(params.get(key));
        if (value && !url.searchParams.has(key)) url.searchParams.set(key, value);
      });
      return url;
    }

    function sameOriginUrl(raw) {
      const value = cleanText(raw);
      if (!value) return null;
      try {
        const url = new URL(value, window.location.href);
        return url.origin === window.location.origin ? url : null;
      } catch (error) {
        return null;
      }
    }

    function firstParam(keys) {
      for (const key of keys) {
        const value = cleanText(params.get(key));
        if (value) return value;
      }
      return '';
    }

    function rewindUrl(game, waypoint) {
      const directTarget = firstParam(['rewind', 'rewind_to', 'prev', 'previous', 'prev_url', 'previous_url', 'back', 'back_url', 'return', 'return_to', 'returnTo', 'from_url']);
      const directUrl = sameOriginUrl(directTarget);
      if (directUrl) return appendSharedRunParams(directUrl).toString();

      const previousWaypoint = cleanWpid(firstParam(['prev_wpid', 'previous_wpid', 'back_wpid', 'from_wpid']));
      if (previousWaypoint) {
        const url = new URL('./navigator.html', window.location.href);
        appendSharedRunParams(url);
        url.searchParams.set('wpid', previousWaypoint);
        url.searchParams.set('waypoint', previousWaypoint);
        return url.toString();
      }

      const previousChallenge = sameOriginUrl(firstParam(['prev_challenge', 'previous_challenge', 'back_challenge']));
      if (previousChallenge) return appendSharedRunParams(previousChallenge).toString();

      return '';
    }

    function fallbackRunUrl(game) {
      const engineAliases = { map: 'map', text: 'text', '1': 'text', '2': 'map' };
      const requestedEngine = cleanText(params.get('e')).toLowerCase();
      const dbEngine = cleanText(game && game.engine).toLowerCase();
      const engine = engineAliases[requestedEngine] || engineAliases[dbEngine] || 'text';
      return appendSharedRunParams(new URL('./' + engine + '/', window.location.href)).toString();
    }

    function arrivedUrl(game, waypoint) {
      const nextRaw = cleanText(params.get('next'));
      if (nextRaw) {
        try {
          const next = new URL(nextRaw, window.location.href);
          if (next.origin === window.location.origin) return appendArrivalParams(next, waypoint).toString();
        } catch (error) {}
      }

      const engineAliases = { map: 'map', text: 'text', '1': 'text', '2': 'map' };
      const requestedEngine = cleanText(params.get('e')).toLowerCase();
      const dbEngine = cleanText(game && game.engine).toLowerCase();
      const engine = engineAliases[requestedEngine] || engineAliases[dbEngine] || 'text';
      const url = new URL('./' + engine + '/', window.location.href);

      ['access_code', 'code', 'auto_redeem', 'teams', 'session', 'mode'].forEach((key) => {
        const value = cleanText(params.get(key));
        if (value) url.searchParams.set(key, value);
      });
      return appendArrivalParams(url, waypoint).toString();
    }

    function syncWaypointParam(waypoint) {
      const id = cleanWpid(waypoint && waypoint.wpid);
      if (!id || requestedWpid === id) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('wpid', id);
        window.history.replaceState(null, '', url);
      } catch (error) {}
    }

    /* ---------- Render ---------- */
    function renderDestination(waypoint, game) {
      const name = cleanText(waypoint.name) || 'the next stop';
      const address = waypointAddressText(waypoint);
      const description = cleanText(waypoint.description);
      const lat = Number(waypoint.lat);
      const lon = Number(waypoint.lon);
      const hasCoords = Number.isFinite(lat) && Number.isFinite(lon);

      destinationName = name;
      route.dest = hasCoords ? { lat, lon } : null;

      syncWaypointParam(waypoint);
      document.title = name.toUpperCase() + ' | NAVIGATOR | THE GAME BUREAU';
      wpName.textContent = name;
      wpDescription.textContent = description;
      wpAddress.textContent = address;

      destLabelName.textContent = name;
      destLabelSub.textContent = cleanText(waypoint.address) || cleanText(waypoint.city) || 'Destination';

      mapsBtn.href = directionsUrl(waypoint);
      arriveBtn.href = arriveBtn2.href = arrivedUrl(game, waypoint);
      backBtn.dataset.href = rewindUrl(game, waypoint);
      backBtn.dataset.fallbackHref = fallbackRunUrl(game);
      navBackBtn.dataset.href = backBtn.dataset.href;
      navBackBtn.dataset.fallbackHref = backBtn.dataset.fallbackHref;

      if (!hasCoords) {
        startBtn.style.display = 'none';
        setNotice('Open this stop in Maps for directions.');
      } else {
        startBtn.style.display = '';
        setNotice('');
      }

      statusText.textContent = '';
      enterPreview();
    }

    function enterError(error) {
      console.error(error);
      statusText.textContent = '';
      errorText.textContent = error && error.message ? error.message : 'Try opening the game again.';
      if (errorBackBtn) errorBackBtn.dataset.fallbackHref = fallbackRunUrl(null);
      setPageMode('error');
    }

    startBtn.addEventListener('click', () => { startNavigation(); });

    function handleBackClick(event) {
      const trigger = event && event.currentTarget ? event.currentTarget : backBtn;
      if (navigating && !arrived) {
        // Back exits live navigation first; a second Back leaves the page.
        enterPreview();
        return;
      }
      const href = cleanText(trigger.dataset.href || backBtn.dataset.href);
      if (href) { window.location.href = href; return; }
      if (window.history.length > 1) window.history.back();
      else if (cleanText(trigger.dataset.fallbackHref || backBtn.dataset.fallbackHref)) {
        window.location.href = trigger.dataset.fallbackHref || backBtn.dataset.fallbackHref;
      }
    }

    backBtn.addEventListener('click', handleBackClick);
    navBackBtn.addEventListener('click', handleBackClick);
    if (errorBackBtn) errorBackBtn.addEventListener('click', handleBackClick);

    (async function init() {
      try {
        const [game, waypoint] = await Promise.all([loadGame(gameId), loadWaypoint(wpid)]);
        await applyGameTheme(game);
        renderDestination(waypoint, game);
      } catch (error) {
        if (!requestedWpid && wpid === DEFAULT_WPID) {
          const game = await loadGame(gameId);
          await applyGameTheme(game);
          renderDestination(DEFAULT_WAYPOINT, game);
          return;
        }
        enterError(error);
      }
    }());
  </script>
</body>
</html>
