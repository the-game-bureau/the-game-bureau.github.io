<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#26373b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Locker | The Game Bureau</title>
  <link rel="icon" href="../../site/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #172225;
      --secondary: #fff3cf;
      --tertiary: #d4a84a;
      --quaternary: #ffd978;

      --bg: #172225;
      --locker: var(--primary);
      --locker-dark: var(--primary);
      --locker-light: var(--primary);
      --cream: #fff3cf;
      --muted: rgba(255, 243, 207, 0.68);
      --ink: #121a1c;
      --brass: var(--tertiary);
      --brass-light: var(--quaternary);
      --red: #d5634f;
      --green: #71c58b;
      --panel: rgba(18, 26, 28, 0.72);
      --panel-border: rgba(255, 243, 207, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .game-shell {
      position: relative;
      width: 100vw;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 0 0 / 36px 36px,
        radial-gradient(circle at 50% -20%, rgba(255, 217, 120, 0.16), transparent 38%),
        linear-gradient(180deg, #23363b 0%, #111b1d 100%);
    }

    .topbar {
      position: relative;
      z-index: 3;
      margin: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
    }

    .kicker {
      display: block;
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 2px 0 0;
      color: var(--cream);
      font-size: clamp(1.15rem, 5vw, 1.55rem);
      font-weight: 950;
      letter-spacing: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    }

    .locker {
      position: relative;
      width: min(100%, 430px);
      height: min(720px, calc(100dvh - 104px));
      min-height: 560px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 18px;
      border: 3px solid rgba(255, 243, 207, 0.16);
      border-radius: 8px;
      background: var(--primary);
      box-shadow:
        inset 0 0 0 3px rgba(18, 26, 28, 0.22),
        inset 18px 0 34px rgba(255, 255, 255, 0.08),
        inset -18px 0 34px rgba(0, 0, 0, 0.18),
        0 24px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transform-origin: left center;
      transition: transform 800ms cubic-bezier(.18,.88,.28,1), filter 500ms ease;
    }

    .locker.unlocked {
      transform: perspective(900px) rotateY(-18deg) translateX(-8px);
      filter: brightness(1.08);
    }

    .vents {
      display: grid;
      gap: 8px;
      width: min(210px, 58%);
      margin: 0 auto;
    }

    .vent {
      height: 8px;
      border-radius: 999px;
      background: rgba(18, 26, 28, 0.45);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18);
    }

    .riddle-card {
      position: relative;
      align-self: start;
      margin-top: 8px;
      padding: 22px 18px;
      border-radius: 6px;
      border: 10px solid;
      border-image: linear-gradient(135deg, #6b4322 0%, #8b5a2b 22%, #a87440 48%, #6b4322 78%, #4a2d15 100%) 1;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255, 255, 255, 0.06), transparent 55%),
        radial-gradient(ellipse at 80% 85%, rgba(255, 255, 255, 0.05), transparent 50%),
        radial-gradient(circle at 30% 60%, rgba(255, 255, 255, 0.04) 0%, transparent 8%),
        radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 10%),
        linear-gradient(180deg, #1f3a2c 0%, #16302a 50%, #1a3328 100%);
      color: #f4f1e6;
      box-shadow:
        inset 0 0 30px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(0, 0, 0, 0.5),
        0 12px 28px rgba(18, 26, 28, 0.4);
    }

    .riddle {
      margin: 0;
      min-height: 86px;
      display: grid;
      align-items: center;
      color: #f4f1e6;
      font-family: 'Caveat', 'Kalam', 'Comic Sans MS', cursive;
      font-size: clamp(1.35rem, 5.4vw, 1.7rem);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      letter-spacing: 0.02em;
      text-shadow:
        0 0 1px rgba(255, 255, 255, 0.5),
        0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .lock-plate {
      position: relative;
      align-self: end;
      display: grid;
      gap: 12px;
      padding: 22px 16px 18px;
      border: 1px solid rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.08), transparent 60%),
        linear-gradient(180deg, #2a3a40 0%, #162023 55%, #0c1416 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 243, 207, 0.06),
        0 18px 38px rgba(0, 0, 0, 0.42);
    }

    .lock-plate::before,
    .lock-plate::after {
      content: '';
      position: absolute;
      bottom: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #f0f0f0 0%, #888 38%, #2a2a2a 100%);
      box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.6), 0 1px 1px rgba(0, 0, 0, 0.5);
    }

    .lock-plate::before { left: 10px; }
    .lock-plate::after { right: 10px; }

    .lock-plate.shake {
      animation: lockShake 360ms cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes lockShake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lock-plate.shake {
        animation: none;
      }
    }

    .shackle {
      position: absolute;
      left: 50%;
      top: -54px;
      width: 120px;
      height: 92px;
      border: 14px solid;
      border-image: linear-gradient(90deg, #8a5e15 0%, #d4a84a 18%, #ffe28a 38%, #d4a84a 62%, #8a5e15 100%) 1;
      border-bottom: 0;
      border-radius: 76px 76px 0 0;
      transform: translateX(-50%);
      box-shadow:
        0 0 22px rgba(255, 217, 120, 0.28),
        inset 0 0 0 1px rgba(0, 0, 0, 0.35);
      transition: transform 500ms ease, filter 500ms ease;
    }

    .shackle::before {
      content: '';
      position: absolute;
      inset: -14px -14px 0 -14px;
      border-radius: 76px 76px 0 0;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.5), transparent 38%);
      pointer-events: none;
    }

    .locker.unlocked .shackle {
      filter: brightness(1.15);
      transform: translateX(-34%) translateY(-18px) rotate(14deg);
    }

    .lock-face {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      padding: 16px 14px;
      border: 2px solid rgba(60, 38, 8, 0.7);
      border-radius: 10px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.55), transparent 55%),
        linear-gradient(135deg, #f1cb68 0%, #a87825 48%, #ffe28a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -2px 4px rgba(74, 43, 13, 0.55),
        inset 0 0 0 1px rgba(255, 243, 207, 0.35),
        0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .lock-face::before,
    .lock-face::after {
      content: '';
      position: absolute;
      top: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #fff5c8 0%, #8a5e15 70%, #3a2607 100%);
      box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.5);
    }

    .lock-face::before { left: 8px; }
    .lock-face::after { right: 8px; }

    .tumblers {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tumbler {
      display: grid;
      grid-template-rows: 42px 64px 42px;
      gap: 7px;
      min-width: 0;
    }

    .digit-btn {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      background:
        linear-gradient(180deg, #3a4a50 0%, #1a2528 55%, #0e1618 100%);
      color: var(--cream);
      font-size: 1.2rem;
      font-weight: 950;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
    }

    .digit-btn:active {
      transform: translateY(1px);
      background: linear-gradient(180deg, #1a2528 0%, #0e1618 100%);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .digit {
      display: grid;
      place-items: center;
      min-width: 0;
      border: 2px solid #20160b;
      border-radius: 8px;
      background:
        linear-gradient(180deg, #fffaea 0%, #e6d394 22%, #b59544 50%, #6a5220 58%, #c9a85e 78%, #fff0bf 100%);
      color: #1a1106;
      font-size: clamp(2rem, 12vw, 3.2rem);
      font-weight: 950;
      line-height: 1;
      box-shadow:
        inset 0 10px 14px rgba(255, 255, 255, 0.55),
        inset 0 -10px 16px rgba(74, 43, 13, 0.4),
        inset 0 0 0 1px rgba(255, 243, 207, 0.4),
        0 2px 4px rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 0 rgba(255, 250, 220, 0.5);
    }

    .status {
      min-height: 42px;
      display: grid;
      place-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      background:
        linear-gradient(180deg, #1a2528 0%, #0e1618 100%);
      color: var(--brass-light);
      font-size: clamp(0.82rem, 3.6vw, 0.96rem);
      font-weight: 950;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        inset 0 0 10px rgba(255, 217, 120, 0.08);
      text-shadow: 0 0 6px rgba(255, 217, 120, 0.5);
      transition: color 200ms ease, text-shadow 200ms ease;
    }

    .status:hover {
      color: #fff3cf;
      text-shadow: 0 0 10px rgba(255, 217, 120, 0.7);
    }

    .status.error {
      color: #ffd6cd;
      background: color-mix(in srgb, var(--red) 24%, rgba(18, 26, 28, 0.82));
    }

    .status.open {
      color: #dfffe7;
      background: color-mix(in srgb, var(--green) 28%, rgba(18, 26, 28, 0.82));
    }

    .unlock-glow {
      position: absolute;
      inset: auto -35% -18% -35%;
      height: 42%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 217, 120, 0.36), transparent 62%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    .locker.unlocked .unlock-glow {
      opacity: 1;
    }

    @media (max-height: 680px) {
      .topbar {
        margin-top: calc(env(safe-area-inset-top, 0px) + 8px);
        padding: 10px 12px;
      }

      .stage {
        padding-top: 8px;
      }

      .locker {
        min-height: 500px;
        padding: 14px;
        gap: 8px;
      }

      .riddle {
        min-height: 64px;
      }

      .tumbler {
        grid-template-rows: 36px 56px 36px;
        gap: 6px;
      }

      .digit-btn {
        min-height: 36px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <span class="kicker">The Game Bureau</span>
      <h1>Locker</h1>
    </header>

    <section class="stage" aria-label="Locker combination">
      <div class="locker" id="locker">
        <div class="vents" aria-hidden="true">
          <span class="vent"></span>
          <span class="vent"></span>
          <span class="vent"></span>
        </div>

        <article class="riddle-card">
          <p class="riddle" id="riddleText"></p>
        </article>

        <section class="lock-plate" aria-label="Combination lock">
          <div class="shackle" aria-hidden="true"></div>
          <div class="lock-face">
            <div class="tumblers" id="tumblers"></div>
            <div class="status" id="status" aria-live="polite">Click here to unlock</div>
          </div>
        </section>

        <div class="unlock-glow" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const locker = document.getElementById('locker');
      const riddleText = document.getElementById('riddleText');
      const lockPlate = document.querySelector('.lock-plate');
      const tumblers = document.getElementById('tumblers');
      const statusEl = document.getElementById('status');

      const state = {
        digits: [0, 0, 0, 0],
        unlocked: false,
        attempts: 0
      };

      const question = getParam(['question', 'riddle', 'clue', 'prompt']) || 'No question found.';
      const answer = normalizeAnswer(getParam(['answer', 'code', 'digits']));
      const returnTarget = getParam(['return', 'returnUrl', 'back']);

      applyHostColors();

      riddleText.textContent = question;

      if (!answer) {
        setStatus('Missing code', 'error');
      } else {
        setStatus('Click here to unlock', '');
      }

      renderTumblers();

      function applyHostColors() {
        const root = document.documentElement.style;
        const map = {
          primary: ['primary', 'primary_color', 'primaryColor'],
          secondary: ['secondary', 'secondary_color', 'secondaryColor'],
          tertiary: ['tertiary', 'tertiary_color', 'tertiaryColor'],
          quaternary: ['quaternary', 'quaternary_color', 'quaternaryColor']
        };
        Object.keys(map).forEach((key) => {
          const value = getParam(map[key]);
          if (value && /^(#[0-9a-f]{3,8}|rgb|hsl|[a-z]+)/i.test(value)) {
            root.setProperty('--' + key, value);
          }
        });
      }

      function getParam(names) {
        for (const name of names) {
          const value = params.get(name);
          if (value != null && String(value).trim()) return String(value).trim();
        }
        return '';
      }

      function normalizeAnswer(value) {
        const digits = String(value || '').replace(/\D/g, '').slice(0, 4);
        return digits.length === 4 ? digits : '';
      }

      function currentCode() {
        return state.digits.join('');
      }

      function setStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function renderTumblers() {
        tumblers.innerHTML = '';
        state.digits.forEach((digit, index) => {
          const tumbler = document.createElement('div');
          tumbler.className = 'tumbler';

          const up = document.createElement('button');
          up.className = 'digit-btn';
          up.type = 'button';
          up.textContent = '+';
          up.setAttribute('aria-label', 'Increase digit ' + (index + 1));
          up.addEventListener('click', () => changeDigit(index, 1));

          const readout = document.createElement('div');
          readout.className = 'digit';
          readout.textContent = String(digit);
          readout.setAttribute('aria-label', 'Digit ' + (index + 1) + ': ' + digit);

          const down = document.createElement('button');
          down.className = 'digit-btn';
          down.type = 'button';
          down.textContent = '-';
          down.setAttribute('aria-label', 'Decrease digit ' + (index + 1));
          down.addEventListener('click', () => changeDigit(index, -1));

          let startY = null;
          readout.addEventListener('pointerdown', (evt) => {
            if (state.unlocked) return;
            startY = evt.clientY;
            readout.setPointerCapture(evt.pointerId);
          });
          readout.addEventListener('pointerup', (evt) => {
            if (startY == null || state.unlocked) return;
            const delta = evt.clientY - startY;
            startY = null;
            if (Math.abs(delta) < 18) return;
            changeDigit(index, delta < 0 ? 1 : -1);
          });
          readout.addEventListener('pointercancel', () => {
            startY = null;
          });

          tumbler.appendChild(up);
          tumbler.appendChild(readout);
          tumbler.appendChild(down);
          tumblers.appendChild(tumbler);
        });
      }

      function changeDigit(index, delta) {
        if (state.unlocked) return;
        state.digits[index] = (state.digits[index] + delta + 10) % 10;
        renderTumblers();
      }

      function submitCode() {
        if (state.unlocked) return;
        if (!answer) {
          setStatus('Missing code', 'error');
          return;
        }

        if (currentCode() === answer) {
          unlock();
          return;
        }

        state.attempts += 1;
        shakeLock();
        setStatus('Click here to unlock', '');
      }

      statusEl.addEventListener('click', submitCode);

      function shakeLock() {
        if (!lockPlate) return;
        lockPlate.classList.remove('shake');
        void lockPlate.offsetWidth;
        lockPlate.classList.add('shake');
      }

      if (lockPlate) {
        lockPlate.addEventListener('animationend', () => {
          lockPlate.classList.remove('shake');
        });
      }

      function unlock() {
        if (state.unlocked) return;
        state.unlocked = true;
        locker.classList.add('unlocked');
        setStatus('Unlocked', 'open');
        window.setTimeout(() => {
          if (notifyGameComplete()) return;
          returnToPreviousPage();
        }, 950);
      }

      function notifyGameComplete() {
        const isEmbedded = getParam(['embedded']) === '1';
        if (isEmbedded && window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'tgb:minigame:complete', game: 'locker' }, '*');
          return true;
        }
        return false;
      }

      function returnToPreviousPage() {
        const safeTarget = getSafeReturnUrl(returnTarget);
        if (safeTarget) {
          window.location.href = safeTarget;
          return;
        }

        if (document.referrer) {
          window.location.href = document.referrer;
          return;
        }

        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        setStatus('Unlocked', 'open');
      }

      function getSafeReturnUrl(value) {
        if (!value) return '';
        try {
          const url = new URL(value, window.location.href);
          if (url.origin === window.location.origin) return url.href;
        } catch (error) {}
        return '';
      }
    }());
  </script>
</body>
</html>
