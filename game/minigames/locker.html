<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2d4880" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Unlock the Locker | The Game Bureau</title>
  <link rel="icon" href="../../site/assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2d4880;
      --secondary: #d4d9e1;
      --tertiary: #ffffff;
      --quaternary: #243256;
      --bg: transparent;
      --cream: var(--quaternary);
      --muted: color-mix(in srgb, var(--quaternary) 62%, transparent);
      --ink: var(--quaternary);
      --panel: color-mix(in srgb, var(--primary) 84%, black);
      --panel-border: color-mix(in srgb, var(--quaternary) 16%, var(--secondary) 84%);
      --shell-top: color-mix(in srgb, var(--secondary) 78%, white);
      --shell-mid: color-mix(in srgb, var(--primary) 74%, var(--secondary) 26%);
      --shell-low: color-mix(in srgb, var(--primary) 88%, black);
      --shell-edge: color-mix(in srgb, var(--quaternary) 20%, var(--primary) 80%);
      --title-surface-top: color-mix(in srgb, var(--secondary) 82%, white);
      --title-surface-low: color-mix(in srgb, var(--secondary) 58%, transparent);
      --title-border: color-mix(in srgb, var(--quaternary) 10%, var(--secondary) 90%);
      --title-text: var(--quaternary);
      --plaque-top: color-mix(in srgb, var(--secondary) 90%, white);
      --plaque-low: color-mix(in srgb, var(--secondary) 72%, var(--primary) 28%);
      --panel-dark-top: color-mix(in srgb, var(--primary) 72%, black);
      --panel-dark-low: color-mix(in srgb, var(--primary) 92%, black);
      --accent: color-mix(in srgb, var(--tertiary) 74%, var(--secondary) 26%);
      --accent-strong: color-mix(in srgb, var(--tertiary) 76%, var(--quaternary) 24%);
      --accent-shadow: color-mix(in srgb, var(--tertiary) 36%, var(--primary) 64%);
      --shackle-highlight: color-mix(in srgb, var(--secondary) 88%, white);
      --shackle-mid: color-mix(in srgb, var(--secondary) 36%, var(--primary) 64%);
      --shackle-dark: color-mix(in srgb, var(--primary) 72%, black);
      --keyhole: color-mix(in srgb, var(--primary) 82%, black);
      --red: #d5634f;
      --green: #71c58b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--cream);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .game-shell {
      position: relative;
      width: 100vw;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
      overflow: hidden;
      background: transparent;
      isolation: isolate;
    }

    .game-shell::before,
    .game-shell::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(18px);
      z-index: 0;
    }

    .game-shell::before {
      width: min(72vw, 480px);
      height: min(72vw, 480px);
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, color-mix(in srgb, var(--secondary) 28%, transparent) 0%, transparent 70%);
    }

    .game-shell::after {
      width: min(48vw, 320px);
      height: min(48vw, 320px);
      right: -10%;
      top: 24%;
      background: radial-gradient(circle, color-mix(in srgb, var(--primary) 18%, transparent) 0%, transparent 72%);
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 6px;
      width: min(100%, 340px);
      margin: 0 auto;
      padding: 12px 18px 14px;
      border: 1px solid var(--title-border);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--title-surface-top) 0%, var(--title-surface-low) 100%);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(18px) saturate(1.08);
      text-align: center;
    }

    .kicker {
      display: block;
      color: color-mix(in srgb, var(--title-text) 82%, var(--tertiary) 18%);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-shadow: none;
    }

    h1 {
      margin: 0;
      max-width: 10ch;
      color: var(--title-text);
      font-size: clamp(1.68rem, 6.4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 0.94;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .stage {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding-top: 4px;
    }

    .locker {
      position: relative;
      width: min(100%, 368px);
      height: min(694px, calc(100dvh - 142px));
      min-height: min(520px, calc(100dvh - 48px));
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
      padding: 94px 8px 20px;
      background: transparent;
      overflow: visible;
      transform-origin: center 78%;
      transition: transform 800ms cubic-bezier(.18,.88,.28,1), filter 500ms ease;
      isolation: isolate;
    }

    .locker::before,
    .locker::after {
      content: '';
      position: absolute;
      pointer-events: none;
    }

    .locker::before {
      inset: 92px 18px 0;
      border-radius: 54px 54px 26px 26px;
      z-index: 0;
      border: 2px solid var(--shell-edge);
      background:
        radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--tertiary) 18%, transparent) 0%, transparent 32%),
        linear-gradient(180deg, var(--shell-top) 0%, color-mix(in srgb, var(--secondary) 50%, var(--primary) 50%) 18%, var(--shell-mid) 56%, var(--shell-low) 100%);
      box-shadow:
        0 28px 54px rgba(0, 0, 0, 0.24),
        inset 0 2px 0 rgba(255, 255, 255, 0.52),
        inset 0 -16px 24px color-mix(in srgb, var(--primary) 34%, black);
    }

    .locker::after {
      inset: 104px 30px 16px;
      border-radius: 42px 42px 20px 20px;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--tertiary) 22%, transparent) 0%, transparent 28%, color-mix(in srgb, black 12%, transparent) 100%),
        linear-gradient(180deg, color-mix(in srgb, var(--primary) 8%, transparent) 0%, transparent 100%);
      opacity: 0.72;
    }

    .locker.unlocked {
      transform: perspective(1000px) rotateY(-14deg) translateX(-10px);
      filter: brightness(1.04);
    }

    .shackle {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 168px;
      height: 132px;
      border: 16px solid;
      border-image: linear-gradient(90deg, var(--shackle-dark) 0%, var(--shackle-highlight) 28%, var(--shackle-mid) 54%, color-mix(in srgb, var(--quaternary) 28%, var(--primary) 72%) 100%) 1;
      border-bottom: 0;
      border-radius: 110px 110px 0 0;
      transform: translateX(-50%);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.24);
      transition: transform 500ms ease, filter 500ms ease;
      z-index: 0;
    }

    .shackle::before {
      content: '';
      position: absolute;
      inset: -16px -16px 0 -16px;
      border-radius: 110px 110px 0 0;
      background: radial-gradient(ellipse at 50% 18%, rgba(255, 255, 255, 0.48), transparent 42%);
      pointer-events: none;
    }

    .locker.unlocked .shackle {
      filter: brightness(1.12);
      transform: translateX(-36%) translateY(-12px) rotate(16deg);
    }

    .vents {
      display: none;
    }

    .vent {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 66%, black), color-mix(in srgb, var(--secondary) 18%, transparent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .riddle-card {
      position: relative;
      z-index: 1;
      align-self: start;
      width: min(100%, 282px);
      margin: 0 auto;
      padding: 18px 18px 16px;
      border-radius: 26px;
      border: 2px solid color-mix(in srgb, var(--quaternary) 14%, var(--secondary) 86%);
      background: linear-gradient(180deg, var(--plaque-top) 0%, var(--plaque-low) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        inset 0 -8px 12px color-mix(in srgb, var(--primary) 14%, transparent),
        0 10px 18px rgba(0, 0, 0, 0.16);
    }

    .riddle-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid color-mix(in srgb, var(--quaternary) 10%, transparent);
      border-radius: 18px;
      pointer-events: none;
    }

    .riddle {
      margin: 0;
      min-height: 76px;
      display: grid;
      align-items: center;
      color: var(--quaternary);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(1.08rem, 4.2vw, 1.28rem);
      font-weight: 700;
      line-height: 1.32;
      text-align: center;
      letter-spacing: 0.01em;
      text-wrap: balance;
      text-shadow: none;
    }

    .lock-plate {
      position: relative;
      z-index: 1;
      align-self: end;
      width: min(100%, 296px);
      margin: 0 auto;
      display: block;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .lock-plate::before,
    .lock-plate::after {
      display: none;
    }

    .lock-plate.shake {
      animation: lockShake 360ms cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes lockShake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lock-plate.shake {
        animation: none;
      }
    }

    .lock-face {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      padding: 18px 16px 16px;
      border: 2px solid color-mix(in srgb, var(--secondary) 26%, var(--primary) 74%);
      border-radius: 34px 34px 22px 22px;
      background:
        radial-gradient(circle at 50% 14%, color-mix(in srgb, var(--secondary) 18%, transparent) 0%, transparent 28%),
        linear-gradient(180deg, var(--panel-dark-top) 0%, var(--panel-dark-low) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -8px 12px rgba(0, 0, 0, 0.24),
        0 12px 18px rgba(0, 0, 0, 0.18),
        0 0 0 4px color-mix(in srgb, var(--secondary) 12%, transparent);
    }

    .lock-face::before,
    .lock-face::after {
      content: '';
      position: absolute;
      top: 12px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tertiary) 88%, white) 0%, color-mix(in srgb, var(--secondary) 48%, var(--primary) 52%) 70%, color-mix(in srgb, var(--primary) 72%, black) 100%);
      box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.5);
    }

    .lock-emblem {
      position: relative;
      width: 78px;
      height: 98px;
      margin: 2px auto 4px;
      border: 3px solid color-mix(in srgb, var(--secondary) 18%, var(--quaternary) 82%);
      border-radius: 999px 999px 20px 20px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--secondary) 90%, white) 0%, color-mix(in srgb, var(--secondary) 40%, var(--primary) 60%) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -10px 12px color-mix(in srgb, var(--primary) 22%, transparent),
        0 6px 12px rgba(0, 0, 0, 0.12);
    }

    .lock-emblem::before,
    .lock-emblem::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--keyhole);
    }

    .lock-emblem::before {
      top: 20px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.08),
        0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .lock-emblem::after {
      top: 37px;
      width: 10px;
      height: 31px;
      border-radius: 999px 999px 10px 10px;
    }

    .lock-face::before {
      left: 8px;
    }

    .lock-face::after {
      right: 8px;
    }

    .tumblers {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .tumbler {
      display: grid;
      grid-template-rows: 44px 82px 44px;
      gap: 10px;
      min-width: 0;
    }

    .digit-btn {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 44px;
      border: 1px solid color-mix(in srgb, var(--secondary) 18%, transparent);
      border-radius: 16px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--secondary) 22%, var(--primary) 78%) 0%, color-mix(in srgb, var(--primary) 82%, black) 58%, color-mix(in srgb, var(--primary) 92%, black) 100%);
      color: var(--tertiary);
      font-size: 1.18rem;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
      text-transform: uppercase;
    }

    .digit-btn:active {
      transform: translateY(1px);
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, black) 0%, color-mix(in srgb, var(--primary) 92%, black) 100%);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .digit {
      display: grid;
      place-items: center;
      min-width: 0;
      border: 2px solid color-mix(in srgb, var(--secondary) 28%, var(--primary) 72%);
      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 18%, color-mix(in srgb, white 56%, transparent) 0%, transparent 40%),
        linear-gradient(180deg, color-mix(in srgb, var(--tertiary) 84%, white) 0%, color-mix(in srgb, var(--secondary) 82%, white) 18%, color-mix(in srgb, var(--secondary) 68%, var(--primary) 32%) 52%, color-mix(in srgb, var(--primary) 34%, var(--secondary) 66%) 100%);
      color: var(--quaternary);
      font-size: clamp(2.2rem, 12vw, 3.2rem);
      font-weight: 900;
      line-height: 1;
      box-shadow:
        inset 0 10px 14px rgba(255, 255, 255, 0.55),
        inset 0 -10px 16px color-mix(in srgb, var(--primary) 18%, transparent),
        0 2px 4px rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35),
        0 0 10px color-mix(in srgb, var(--secondary) 14%, transparent);
    }

    .status {
      min-height: 50px;
      display: grid;
      place-items: center;
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, var(--secondary) 18%, transparent);
      border-radius: 999px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--secondary) 20%, var(--primary) 80%) 0%, color-mix(in srgb, var(--primary) 84%, black) 100%);
      color: var(--tertiary);
      font-size: clamp(0.82rem, 3.6vw, 0.94rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.5),
        inset 0 0 10px color-mix(in srgb, var(--secondary) 12%, transparent);
      text-shadow: 0 0 6px color-mix(in srgb, var(--secondary) 22%, transparent);
      transition: color 200ms ease, text-shadow 200ms ease;
    }

    .status:hover {
      color: color-mix(in srgb, var(--tertiary) 78%, var(--secondary) 22%);
      text-shadow: 0 0 10px color-mix(in srgb, var(--secondary) 32%, transparent);
    }

    .status.error {
      color: #ffd6cd;
      background: color-mix(in srgb, var(--red) 24%, rgba(18, 26, 28, 0.82));
    }

    .status.open {
      color: #dfffe7;
      background: color-mix(in srgb, var(--green) 28%, rgba(18, 26, 28, 0.82));
    }

    .unlock-glow {
      position: absolute;
      z-index: 0;
      inset: auto -12% -8% -12%;
      height: 44%;
      background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--secondary) 42%, transparent), transparent 62%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    .locker.unlocked .unlock-glow {
      opacity: 1;
    }

    @media (max-width: 420px) {
      .game-shell {
        padding-left: 12px;
        padding-right: 12px;
      }

      .topbar {
        width: 100%;
        padding-left: 14px;
        padding-right: 14px;
      }

      .locker {
        width: 100%;
        padding-left: 4px;
        padding-right: 4px;
      }

      .riddle-card,
      .lock-face {
        border-radius: 22px;
      }
    }

    @media (max-height: 740px) {
      .locker {
        height: min(642px, calc(100dvh - 100px));
        min-height: min(500px, calc(100dvh - 36px));
        padding-top: 86px;
        gap: 10px;
      }

      .locker::before,
      .locker::after {
        inset-block-start: 84px;
      }

      .shackle {
        width: 152px;
        height: 118px;
        border-width: 14px;
      }

      .riddle {
        min-height: 64px;
        font-size: clamp(0.98rem, 4.8vw, 1.12rem);
      }

      .tumbler {
        grid-template-rows: 36px 62px 36px;
        gap: 6px;
      }

      .digit-btn {
        min-height: 36px;
        font-size: 1rem;
      }

      .digit {
        font-size: clamp(1.9rem, 10vw, 2.6rem);
      }

      .status {
        min-height: 42px;
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <span class="kicker">The Game Bureau</span>
      <h1>Unlock the Locker</h1>
    </header>

    <section class="stage" aria-label="Locker combination">
      <div class="locker" id="locker">
        <div class="shackle" aria-hidden="true"></div>
        <div class="vents" aria-hidden="true">
          <span class="vent"></span>
          <span class="vent"></span>
          <span class="vent"></span>
        </div>

        <article class="riddle-card">
          <p class="riddle" id="riddleText"></p>
        </article>

        <section class="lock-plate" aria-label="Combination lock">
          <div class="lock-face">
            <div class="lock-emblem" aria-hidden="true"></div>
            <div class="tumblers" id="tumblers"></div>
            <div class="status" id="status" aria-live="polite">Click here to unlock</div>
          </div>
        </section>

        <div class="unlock-glow" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const locker = document.getElementById('locker');
      const riddleText = document.getElementById('riddleText');
      const lockPlate = document.querySelector('.lock-plate');
      const tumblers = document.getElementById('tumblers');
      const statusEl = document.getElementById('status');
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      const state = {
        digits: [0, 0, 0, 0],
        unlocked: false,
        attempts: 0
      };

      const question = getParam(['question', 'riddle', 'clue', 'prompt']) || 'No question found.';
      const answer = normalizeAnswer(getParam(['answer', 'code', 'digits']));
      const returnTarget = getParam(['return', 'returnUrl', 'back']);

      applyHostColors();

      riddleText.textContent = question;

      if (!answer) {
        setStatus('Missing code', 'error');
      } else {
        setStatus('Click here to unlock', '');
      }

      renderTumblers();

      function applyHostColors() {
        const root = document.documentElement.style;
        const map = {
          primary: ['primary', 'primary_color', 'primaryColor'],
          secondary: ['secondary', 'secondary_color', 'secondaryColor'],
          tertiary: ['tertiary', 'tertiary_color', 'tertiaryColor'],
          quaternary: ['quaternary', 'quaternary_color', 'quaternaryColor']
        };
        Object.keys(map).forEach((key) => {
          const value = getParam(map[key]);
          if (value && /^(#[0-9a-f]{3,8}|rgb|hsl|[a-z]+)/i.test(value)) {
            root.setProperty('--' + key, value);
          }
        });
        const themeColor = getParam(map.primary) || getParam(map.secondary) || '';
        if (themeColorMeta && themeColor) {
          themeColorMeta.setAttribute('content', themeColor);
        }
      }

      function getParam(names) {
        for (const name of names) {
          const value = params.get(name);
          if (value != null && String(value).trim()) return String(value).trim();
        }
        return '';
      }

      function normalizeAnswer(value) {
        const digits = String(value || '').replace(/\D/g, '').slice(0, 4);
        return digits.length === 4 ? digits : '';
      }

      function currentCode() {
        return state.digits.join('');
      }

      function setStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function renderTumblers() {
        tumblers.innerHTML = '';
        state.digits.forEach((digit, index) => {
          const tumbler = document.createElement('div');
          tumbler.className = 'tumbler';

          const up = document.createElement('button');
          up.className = 'digit-btn';
          up.type = 'button';
          up.textContent = '+';
          up.setAttribute('aria-label', 'Increase digit ' + (index + 1));
          up.addEventListener('click', () => changeDigit(index, 1));

          const readout = document.createElement('div');
          readout.className = 'digit';
          readout.textContent = String(digit);
          readout.setAttribute('aria-label', 'Digit ' + (index + 1) + ': ' + digit);

          const down = document.createElement('button');
          down.className = 'digit-btn';
          down.type = 'button';
          down.textContent = '-';
          down.setAttribute('aria-label', 'Decrease digit ' + (index + 1));
          down.addEventListener('click', () => changeDigit(index, -1));

          let startY = null;
          readout.addEventListener('pointerdown', (evt) => {
            if (state.unlocked) return;
            startY = evt.clientY;
            readout.setPointerCapture(evt.pointerId);
          });
          readout.addEventListener('pointerup', (evt) => {
            if (startY == null || state.unlocked) return;
            const delta = evt.clientY - startY;
            startY = null;
            if (Math.abs(delta) < 18) return;
            changeDigit(index, delta < 0 ? 1 : -1);
          });
          readout.addEventListener('pointercancel', () => {
            startY = null;
          });

          tumbler.appendChild(up);
          tumbler.appendChild(readout);
          tumbler.appendChild(down);
          tumblers.appendChild(tumbler);
        });
      }

      function changeDigit(index, delta) {
        if (state.unlocked) return;
        state.digits[index] = (state.digits[index] + delta + 10) % 10;
        renderTumblers();
      }

      function submitCode() {
        if (state.unlocked) return;
        if (!answer) {
          setStatus('Missing code', 'error');
          return;
        }

        if (currentCode() === answer) {
          unlock();
          return;
        }

        state.attempts += 1;
        shakeLock();
        setStatus('Click here to unlock', '');
      }

      statusEl.addEventListener('click', submitCode);

      function shakeLock() {
        if (!lockPlate) return;
        lockPlate.classList.remove('shake');
        void lockPlate.offsetWidth;
        lockPlate.classList.add('shake');
      }

      if (lockPlate) {
        lockPlate.addEventListener('animationend', () => {
          lockPlate.classList.remove('shake');
        });
      }

      function unlock() {
        if (state.unlocked) return;
        state.unlocked = true;
        locker.classList.add('unlocked');
        setStatus('Unlocked', 'open');
        window.setTimeout(() => {
          if (notifyGameComplete()) return;
          returnToPreviousPage();
        }, 950);
      }

      function notifyGameComplete() {
        const isEmbedded = getParam(['embedded']) === '1';
        if (isEmbedded && window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'tgb:minigame:complete', game: 'locker' }, '*');
          return true;
        }
        return false;
      }

      function returnToPreviousPage() {
        const safeTarget = getSafeReturnUrl(returnTarget);
        if (safeTarget) {
          window.location.href = safeTarget;
          return;
        }

        if (document.referrer) {
          window.location.href = document.referrer;
          return;
        }

        if (window.history.length > 1) {
          window.history.back();
          return;
        }

        setStatus('Unlocked', 'open');
      }

      function getSafeReturnUrl(value) {
        if (!value) return '';
        try {
          const url = new URL(value, window.location.href);
          if (url.origin === window.location.origin) return url.href;
        } catch (error) {}
        return '';
      }
    }());
  </script>
</body>
</html>
