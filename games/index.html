          selectedGamesGridEl.appendChild(empty);
        } else {
          games.forEach((game) => {
            const gameId = game.id || '';
            const gameHref = '/game/run/index.html?id=' + encodeURIComponent(gameId);
            const card = document.createElement('article');
            card.className = 'game-card';
            card.dataset.gameId = gameId;
            // Admin overlay: signed-in admins get an "EDIT GAME" button on each
            // card (painted by admin-bridge.js), opening the builder for this id.
            card.dataset.adminEdit = 'game';
            card.dataset.adminId = gameId;

            // Deed stamps: CATEGORY_ICON mark + state/country badge for the host city.
            const icons = document.createElement('div');
            icons.className = 'game-card-icons';
            const teamPalette = getHelmetByAwayTeam(game);
            const hasAwayTeam = !!(plainText(game.away_team_city) && plainText(game.away_team_mascot));
            // The game's own primary_color (set in the builder) wins over the
            // team helmet color, so non-fan games can have their own identity.
            const cardAccent = plainText(game.primary_color)
                            || (teamPalette && teamPalette.primary_color)
                            || '#2d4880';
            const cardSecondary = plainText(game.secondary_color)
                                || (teamPalette && teamPalette.secondary_color)
                                || cardAccent;
            card.style.setProperty('--card-accent', cardAccent);
            card.style.setProperty('--card-accent-ink', accentTextColor(cardAccent));
            card.style.setProperty('--card-secondary', cardSecondary);
            card.style.setProperty('--card-secondary-ink', accentTextColor(cardSecondary));
            const explicitCategoryIcon = normalizeCategoryIcon(game.category_icon) || normalizeCategoryIcon(game.categoryIcon);
            const categoryIcon = getGameCategoryIcon(game, teamPalette);
            if (hasAwayTeam || explicitCategoryIcon) {
              const palette = teamPalette || NO_HELMET_PALETTE;
              const helmetSrc = teamMarkSVG(
                categoryIcon,
                (teamPalette && teamPalette.primary_color) || cardAccent,
                (teamPalette && teamPalette.secondary_color) || plainText(game.secondary_color) || '#ffffff',
                (teamPalette && teamPalette.tertiary_color) || plainText(game.tertiary_color) || '#111111'
              );
              if (helmetSrc) {
                const helmetImg = document.createElement('img');
                helmetImg.className = 'game-card-helmet';
                helmetImg.alt = '';
                helmetImg.src = helmetSrc;
                if (normalizeCategoryIcon(categoryIcon) === 'baseball') helmetImg.classList.add('team-mark--baseball');
                icons.appendChild(helmetImg);
              }
            }
            const venueBadge = cityGeoBadge(game.city);
            if (venueBadge) icons.appendChild(buildGeoBadge(venueBadge));

            const deed = document.createElement('div');
            deed.className = 'game-card-deed';
            const deedHead = document.createElement('div');
            deedHead.className = 'game-card-deed-head';
            const primaryTagText = plainText(game.primary_tag);
            if (primaryTagText) {
              const deedLabel = document.createElement('span');
              deedLabel.className = 'game-card-deed-label';
              deedLabel.textContent = primaryTagText.toUpperCase();
              deedHead.appendChild(deedLabel);
            }
            if (icons.childNodes.length) deedHead.appendChild(icons);

            const title = document.createElement('div');
            title.className = 'game-card-title';
            title.textContent = stripMascotNames(game.name, game) || '(untitled game)';
            title.dataset.fitText = 'true';
            title.dataset.fitMax = '32';
            title.dataset.fitMin = '14';
            deed.append(deedHead, title);
            card.appendChild(deed);

            const deedLines = document.createElement('dl');
            deedLines.className = 'game-card-deed-lines';
            const addDeedLine = (labelText, valueText) => {
              const value = plainText(valueText);
              if (!value) return;
              const row = document.createElement('div');
              row.className = 'game-card-deed-line';
              const label = document.createElement('dt');
              label.textContent = labelText;
              const valueEl = document.createElement('dd');
              valueEl.textContent = value;
              valueEl.dataset.fitText = 'true';
              valueEl.dataset.fitMax = '14';
              valueEl.dataset.fitMin = '9';
              row.append(label, valueEl);
              deedLines.appendChild(row);
            };
            const dateStr = formatGameDate(game);
            addDeedLine('When', dateStr || 'Anytime');

            const cityText = plainText(game.city);
            if (cityText) {
              const commaIdx = cityText.indexOf(',');
              const cityLine1 = commaIdx >= 0 ? cityText.slice(0, commaIdx).trim() : cityText;
              const cityLine2 = commaIdx >= 0 ? cityText.slice(commaIdx + 1).trim() : '';
              const row = document.createElement('div');
              row.className = 'game-card-deed-line game-card-deed-line--city';
              const label = document.createElement('dt');
              label.textContent = 'Start City';
              const valueEl = document.createElement('dd');
              valueEl.dataset.fitText = 'true';
              // Lower max than other deed lines because two stacked lines
              // need to share the ~28px row content area without bleeding
              // upward into the "When" row above.
              valueEl.dataset.fitMax = '11';
              valueEl.dataset.fitMin = '8';
              const line1 = document.createElement('span');
              line1.className = 'game-card-deed-city-line';
              line1.textContent = cityLine1;
              const line2 = document.createElement('span');
              line2.className = 'game-card-deed-city-line';
              line2.textContent = cityLine2;
              valueEl.append(line1, line2);
              row.append(label, valueEl);
              deedLines.appendChild(row);
            }
            if (deedLines.childNodes.length) card.appendChild(deedLines);

            const tagline = document.createElement('div');
            tagline.className = 'game-card-tagline';
            tagline.textContent = stripMascotNames(game.tagline, game) || 'Open the link. Start on site.';
            tagline.dataset.fitText = 'true';
            tagline.dataset.fitMax = '14.5';
            tagline.dataset.fitMin = '10';
            card.appendChild(tagline);

            const actions = document.createElement('div');
            actions.className = 'game-card-actions';

            const playLink = document.createElement('a');
            playLink.className = 'game-card-play';
            playLink.href = gameHref;
            playLink.textContent = 'PLAY GAME';
            actions.appendChild(playLink);

            card.appendChild(actions);

            selectedGamesGridEl.appendChild(card);
          });
        }
        selectedGamesEl.hidden = false;
        scheduleSelectedCardTextFit();
        selectedGamesEl.classList.remove('is-fresh');
        if (shouldAnimate) {
          void selectedGamesEl.offsetWidth;
          selectedGamesEl.classList.add('is-fresh');
        }
        if (shouldScroll) {
          selectedGamesEl.scrollIntoView({ behavior: metaReducedMotion ? 'auto' : 'smooth', block: 'start' });
          selectedGamesEl.focus({ preventScroll: true });
        }
      }

      function setMode(mode) {
        activeMode = mode === MODE_FAN ? MODE_FAN : MODE_CITY;
        clearSelectedEntry();
        renderDirectory();
      }

      function renderError(message) {
        updateHeroButtons();
        if (heroMetaListEl) {
          heroMetaListEl.innerHTML = '';
          const err = document.createElement('div');
          err.style.cssText = 'padding:14px;color:var(--muted);font-size:0.8rem;text-align:center;';
          err.textContent = message;
          heroMetaListEl.appendChild(err);
        }
      }

      // ---------------------------------------------------------------------------
      // Geolocation default selection
      // ---------------------------------------------------------------------------
      // On page load, ask the browser for the visitor's coordinates and
      // auto-select the team whose fanbase city is geographically
      // closest. If geolocation is denied / unavailable / errors out, OR
      // if no fanbase city has known coordinates, fall back to the City
      // tab with "New Orleans" pre-selected so the page always shows
      // something meaningful below the hero.
      // Never overrides a selection the user made via URL (?fan=, ?city=)
      // or by clicking a row before geolocation resolved.
      const FALLBACK_CITY_NAME = 'New Orleans';

      function haversineKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const toRad = (deg) => deg * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
                * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }

      // Earliest upcoming game timestamp for a fan entry (Infinity if none).
      // Used to tie-break the nearest-team pick when multiple teams share a
      // fanbase city (e.g. Saints + Pelicans both in New Orleans → both at
      // identical distance from a New Orleans visitor).
      function soonestUpcomingGameTs(entry) {
        const games = gamesForEntry(entry);
        const cutoff = Date.now() - 86400000;
        let soonest = Infinity;
        for (const game of games) {
          const dateStr = String((game && game.game_date) || '').trim();
          const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (!match) continue;
          const ts = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          if (ts < cutoff) continue;
          if (ts < soonest) soonest = ts;
        }
        return soonest;
      }

      function findNearestFanEntry(userLat, userLng) {
        const coords = window.TGB_TEAM_CITY_COORDS || {};
        const entries = buildFanEntries();
        let best = null;
        let bestDist = Infinity;
        let bestSoonest = Infinity;
        for (const entry of entries) {
          const fanbase = (entry.helmet && entry.helmet.fanbase) || entry.label || '';
          // fanbase may be "City, ST"; coords are keyed by the bare city, so key
          // off the part before the comma.
          const cityCoords = coords[teamKey(String(fanbase).split(',')[0])];
          if (!cityCoords) continue;
          const dist = haversineKm(userLat, userLng, cityCoords[0], cityCoords[1]);
          if (dist < bestDist) {
            bestDist = dist;
            bestSoonest = soonestUpcomingGameTs(entry);
            best = entry;
          } else if (dist === bestDist) {
            const soonest = soonestUpcomingGameTs(entry);
            if (soonest < bestSoonest) {
              bestSoonest = soonest;
              best = entry;
            }
          }
        }
        return best;
      }

      function selectFallbackCity() {
        if (selectedEntryKey) return;
        if (activeMode !== MODE_CITY) {
          setMode(MODE_CITY);
        }
        let target = null;
        for (const entry of heroMetaEntries.values()) {
          if (entry.entryKind !== 'city') continue;
          if (cityDisplayName(entry.label).toLowerCase() === FALLBACK_CITY_NAME.toLowerCase()) {
            target = entry;
            break;
          }
        }
        if (target) toggleSelectedEntry(target);
      }

      function tryGeolocateAndSelectNearestFan() {
        if (selectedEntryKey) return;
        if (activeMode !== MODE_FAN) return;
        if (!navigator.geolocation) {
          selectFallbackCity();
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            // Re-check guards: user may have switched tabs or clicked a
            // row between the prompt and the resolve.
            if (selectedEntryKey) return;
            if (activeMode !== MODE_FAN) {
              selectFallbackCity();
              return;
            }
            const nearest = findNearestFanEntry(
              position.coords.latitude,
              position.coords.longitude
            );
            if (nearest) {
              toggleSelectedEntry(nearest);
            } else {
              selectFallbackCity();
            }
          },
          () => {
            if (selectedEntryKey) return;
            selectFallbackCity();
          },
          { timeout: 8000, maximumAge: 600000 }
        );
      }

      // ---------------------------------------------------------------------------
      // Data load
      // ---------------------------------------------------------------------------
      // localStorage cache so returning visitors see the scrolling
      // directory paint instantly on first frame instead of waiting for
      // two Supabase round-trips. The fresh network response replaces
      // the cached render once it arrives.
      const CACHE_KEY_GAMES = 'tgb-games-cache-v1';
      const CACHE_KEY_TEAMS = 'tgb-teams-cache-v1';

      function readCache(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch (_) { return null; }
      }
      function writeCache(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (_) { /* quota / private mode — ignore */ }
      }

      // True only for a verified admin (painted by /assets/admin-bridge.js, which
      // adds the body/root class and exposes the bridge API). Signed-out public
      // visitors are never admins.
      function isAdminAuthorized() {
        return !!((window.TgbPublicAdminBridge
            && typeof window.TgbPublicAdminBridge.isAuthorized === 'function'
            && window.TgbPublicAdminBridge.isAuthorized())
          || document.documentElement.classList.contains('tgb-admin-authorized'));
      }

      // Force /assets/admin-bridge.js to (re)paint EDIT GAME buttons onto every
      // [data-admin-edit] card now, instead of waiting on its debounced observer.
      function paintEditButtons() {
        const bridge = window.TgbPublicAdminBridge;
        if (!bridge || typeof bridge.scan !== 'function') return;
        requestAnimationFrame(() => { try { bridge.scan(); } catch (_) {} });
      }

      // Rebuild liveGames from the raw rows. Every non-archived game is shown,
      // regardless of date (past, present, future, or undated) — for the public
      // and admins alike. Archived is the only exclusion, and it's absolute.
      function recomputeLiveGames() {
        liveGames = (Array.isArray(rawGames) ? rawGames : [])
          .filter((game) => !isTrueish(game && game.archived));
        refreshDefaultCitySampleGames();
        renderDirectory();
        // applyUrlSelection is idempotent — reapplying after fresh data
        // recovers any URL-bookmarked selection that wasn't yet in the
        // cached snapshot.
        suppressUrlWrite = true;
        try { applyUrlSelection(); } finally { suppressUrlWrite = false; }
      }

      function applyDirectoryData(games, teamColorsResult) {
        colorsByCityMascot = teamColorsResult.lookup;
        allTeams = teamColorsResult.teams;
        rawGames = Array.isArray(games) ? games : [];
        recomputeLiveGames();
      }

      async function load() {
        const initParams = new URLSearchParams(window.location.search);
        if (initParams.get('city')) activeMode = MODE_CITY;
        else if (initParams.get('fan')) activeMode = MODE_FAN;
        else if (initParams.get('mode') === 'city') activeMode = MODE_CITY;
        else if (initParams.get('mode') === 'fan') activeMode = MODE_FAN;

        // ── 1. Paint immediately from cache if we have it ────────────
        const cachedGames = readCache(CACHE_KEY_GAMES);
        const cachedTeams = readCache(CACHE_KEY_TEAMS);
        let painted = false;
        if (cachedGames && cachedTeams) {
          try {
            applyDirectoryData(cachedGames, buildTeamIndex(cachedTeams));
            painted = true;
          } catch (_) { /* cache shape mismatch — let fresh fetch repaint */ }
        }

        // ── 2. Fetch fresh and repaint ───────────────────────────────
        fetchGiftCount()
          .then((count) => statsTicker.setTarget(null, null, count))
          .catch(() => { /* leave the gifts ticker at its current value */ });

        loadGiftStrip();

        try {
          // The cities catalog rides along so venue-only towns are known before
          // the directory paints. Failure is swallowed: a missing catalog must
          // not take the games directory down with it.
          const [games, teamColorsResult] = await Promise.all([
            fetchGames(),
            fetchTeamColors(),
            fetchIgnoredCities().catch(() => {})
          ]);
          writeCache(CACHE_KEY_GAMES, games);
          writeCache(CACHE_KEY_TEAMS, teamColorsResult.teams);
          applyDirectoryData(games, teamColorsResult);
        } catch (error) {
          console.error(error);
          if (!painted) renderError(error instanceof Error ? error.message : String(error));
        }
      }

      // ---------------------------------------------------------------------------
      // Event wiring
      // ---------------------------------------------------------------------------

      document.querySelectorAll('.hero-mode-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          setModeFromControl(btn.dataset.mode === 'fan' ? MODE_FAN : MODE_CITY);
        });
        btn.addEventListener('keydown', (event) => {
          const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
          if (!keys.includes(event.key)) return;
          event.preventDefault();
          let nextMode = activeMode;
          if (event.key === 'Home') nextMode = MODE_FAN;
          if (event.key === 'End') nextMode = MODE_CITY;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            nextMode = activeMode === MODE_FAN ? MODE_CITY : MODE_FAN;
          }
          setModeFromControl(nextMode);
          const nextBtn = document.querySelector(`.hero-mode-tab[data-mode="${nextMode}"]`);
          if (nextBtn) nextBtn.focus();
        });
      });

      // Hero mode slider: click tabs, drag with mouse, or swipe with touch.
      (function () {
        const switchEl = document.getElementById('heroModeSwitch');
        const trackEl = document.querySelector('.hero-mode-track');
        const markerEl = trackEl ? trackEl.querySelector('.hero-mode-marker') : null;
        if (!switchEl || !trackEl || !markerEl) return;
        const DRAG_THRESHOLD = 6;
        let startX = 0;
        let startY = 0;
        let startProgress = 0;
        let currentProgress = 0;
        let pointerId = null;
        let tracking = false;
        let dragging = false;
        let suppressNextClick = false;

        const clamp = (value) => Math.min(1, Math.max(0, value));
        const modeProgress = () => activeMode === MODE_CITY ? 1 : 0;
        const setMarkerProgress = (value) => {
          currentProgress = clamp(value);
          markerEl.style.transform = 'translateX(' + (currentProgress * 100) + '%)';
        };
        const resetDragState = () => {
          switchEl.classList.remove('is-sliding');
          markerEl.style.transform = '';
        };

        const beginGesture = (clientX, clientY, id) => {
          pointerId = id;
          startX = clientX;
          startY = clientY;
          startProgress = modeProgress();
          currentProgress = startProgress;
          tracking = true;
          dragging = false;
        };

        const moveGesture = (clientX, clientY, id, event) => {
          if (!tracking || id !== pointerId) return;
          const dx = clientX - startX;
          const dy = clientY - startY;
          if (!dragging) {
            if (Math.abs(dy) > DRAG_THRESHOLD && Math.abs(dy) > Math.abs(dx)) {
              tracking = false;
              pointerId = null;
              return;
            }
            if (Math.abs(dx) < DRAG_THRESHOLD) return;
            dragging = true;
            switchEl.classList.add('is-sliding');
            if (typeof id === 'number') {
              try { trackEl.setPointerCapture(id); } catch (e) {}
            }
          }
          const travel = Math.max(1, trackEl.getBoundingClientRect().width / 2);
          setMarkerProgress(startProgress + (dx / travel));
          if (event) event.preventDefault();
        };

        const endGesture = (id) => {
          if (!tracking || id !== pointerId) return;
          const shouldCommitDrag = dragging;
          tracking = false;
          pointerId = null;
          if (shouldCommitDrag) {
            suppressNextClick = true;
            setModeFromControl(currentProgress >= 0.5 ? MODE_CITY : MODE_FAN);
          }
          resetDragState();
        };

        trackEl.addEventListener('click', (event) => {
          if (!suppressNextClick) return;
          suppressNextClick = false;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        if (typeof window.PointerEvent !== 'undefined') {
          trackEl.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            beginGesture(event.clientX, event.clientY, event.pointerId);
          });
          trackEl.addEventListener('pointermove', (event) => {
            moveGesture(event.clientX, event.clientY, event.pointerId, event);
          }, { passive: false });
          trackEl.addEventListener('pointerup', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('pointercancel', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('lostpointercapture', (event) => endGesture(event.pointerId));
        }

        trackEl.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          beginGesture(touch.clientX, touch.clientY, 'touch');
        }, { passive: true });
        trackEl.addEventListener('touchmove', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          moveGesture(touch.clientX, touch.clientY, 'touch', event);
        }, { passive: false });
        trackEl.addEventListener('touchend', () => endGesture('touch'));
        trackEl.addEventListener('touchcancel', () => endGesture('touch'));
      }());

      if (heroMetaListEl) {
        heroMetaListEl.addEventListener('click', (e) => {
          const item = e.target.closest('.hero-meta-list-item');
          if (!item) return;
          e.preventDefault();
          const entry = heroMetaEntries.get(item.dataset.entryKind + '|' + item.dataset.entryKey);
          if (entry) toggleSelectedEntry(entry);
        });
      }

      window.addEventListener('resize', scheduleSelectedCardTextFit);

      // Back/forward: re-apply the URL's mode + selection without pushing.
      window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const modeParam = params.get('mode');
        const wantMode = params.get('city') ? MODE_CITY
                       : params.get('fan')  ? MODE_FAN
                       : modeParam === MODE_CITY ? MODE_CITY
                       : modeParam === MODE_FAN ? MODE_FAN
                       : activeMode;
        suppressUrlWrite = true;
        try {
          if (wantMode !== activeMode) {
            activeMode = wantMode;
            renderDirectory();
          }
          applyUrlSelection();
        } finally {
          suppressUrlWrite = false;
        }
      });

      // Admin-only "show all games" toggle. Hidden for the public; revealed when
      // /assets/admin-bridge.js verifies an admin. All non-archived games are
      // always in view now (no date filtering), so this no longer changes which
      // games appear — it switches the admin between a flat "All games" list and
      // the normal city/fandom grouping.
      function setupAdminAllGamesToggle() {
        const style = document.createElement('style');
        style.textContent = [
          // Top-right, to the LEFT of EDIT GAMES (right:114px) which is itself
          // left of the floating LOG OUT (right:14px): [Show all][EDIT GAMES][LOG OUT].
          '#tgbAdminShowAll{position:fixed;top:14px;right:242px;z-index:2147482000;display:none;align-items:center;gap:8px;min-height:34px;padding:0 14px;border:1px solid #111;border-radius:8px;background:#111;color:#fff;font-family:"IBM Plex Mono",Consolas,monospace;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);}',
          '#tgbAdminShowAll.is-visible{display:inline-flex;}',
          '#tgbAdminShowAll.is-on{background:#fff;color:#111;}'
        ].join('');
        document.head.appendChild(style);

        const btn = document.createElement('button');
        btn.id = 'tgbAdminShowAll';
        btn.type = 'button';
        const paint = () => {
          btn.classList.toggle('is-on', adminShowAll);
          btn.textContent = adminShowAll ? 'Showing all games' : 'Show all games';
        };
        paint();
        btn.addEventListener('click', () => {
          adminShowAll = !adminShowAll;
          paint();
          // recomputeLiveGames() re-filters and (via applyUrlSelection) resets any
          // city/fan selection. When turning ON, immediately drive the generic
          // selected-games grid with a synthetic "all" entry so the admin sees a
          // flat list of EVERY game — not just bumped city/fan counts.
          recomputeLiveGames();
          if (adminShowAll) {
            selectedEntryKind = 'all';
            selectedEntryKey = '*';
            refreshSelectionStyles();
            renderSelectedGames({ entryKind: 'all', entryKey: '*', label: 'All games (admin)' });
            // The cards carry data-admin-edit; nudge the bridge to paint every
            // EDIT GAME button immediately rather than waiting on its debounced
            // observer (which can miss a bulk re-render).
            paintEditButtons();
          }
        });
        document.body.appendChild(btn);

        const sync = () => {
          const admin = isAdminAuthorized();
          btn.classList.toggle('is-visible', admin);
          // If the admin signs out while "show all" is on, drop back to the
          // normal grouped view (the flat admin list isn't for the public).
          if (!admin && adminShowAll) {
            adminShowAll = false;
            paint();
            recomputeLiveGames();
          }
        };
        sync();
        // The bridge verifies asynchronously and toggles the root class when it
        // resolves; watch for that so the control appears without a reload.
        new MutationObserver(sync).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class']
        });
      }

      // ---------------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------------
      setupAdminAllGamesToggle();
      load();
    }());
  </script>

       Intercepts clicks on .game-card-play and shows a popup instead of playing.
       This is temporary — DELETE THIS ENTIRE <script> BLOCK to restore play.
       Nothing else was changed; the buttons/hrefs are untouched.
       ========================================================================== -->
  <script>
  (function () {
    function showComingSoon() {
      var prev = document.getElementById('tgbComingSoonToast');
      if (prev) prev.remove();
      var overlay = document.createElement('div');
      overlay.id = 'tgbComingSoonToast';
      overlay.setAttribute('role', 'status');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,6,10,0.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer;';
      var box = document.createElement('div');
      box.style.cssText = 'position:relative;max-width:340px;text-align:center;padding:26px 28px;border-radius:16px;border:1px solid rgba(245,180,97,0.4);background:#111a27;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,0.5);';
      box.innerHTML = '<button type="button" id="tgbComingSoonClose" aria-label="Close" style="position:absolute;top:8px;right:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:8px;background:transparent;color:#c8d3e0;font-size:1.25rem;line-height:1;cursor:pointer;">&times;</button>' +
        '<div style="font-size:1.5rem;font-weight:800;letter-spacing:0.08em;margin-bottom:8px;">COMING SOON</div>' +
        '<div style="color:#c8d3e0;font-size:0.9rem;line-height:1.5;">Games aren\'t quite ready to play yet — check back soon.</div>';
      overlay.appendChild(box);
      var close = function () { overlay.remove(); document.removeEventListener('keydown', onKey); };
      var onKey = function (e) { if (e.key === 'Escape') close(); };
      overlay.addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
    }
    // Capture phase so this beats the link's navigation and any other handlers.
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.game-card-play') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      showComingSoon();
    }, true);
  }());
  </script>
