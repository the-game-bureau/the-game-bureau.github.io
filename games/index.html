  <!-- Page controller: data loading, hero finder, selected-game cards, and URL state. -->
  <script>
    (function () {
      // ---------------------------------------------------------------------------
      // Configuration and DOM handles
      // ---------------------------------------------------------------------------
      const SB_CONFIG = {
        url: 'https://qmaafbncpzrdmqapkkgr.supabase.co',
        key: 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3',
        table: 'games'
      };

      const selectedGamesEl = document.getElementById('selectedGames');
      const selectedGamesTitleEl = document.getElementById('selectedGamesTitle');
      const selectedGamesGridEl = document.getElementById('selectedGamesGrid');

      // Hero finder mode labels and targets.
      const MODE_CITY = 'city';
      const MODE_FAN = 'fan';
      const PROMPT_FAN = 'WHO DO YOU CHEER FOR?';
      const PROMPT_CITY = 'WHERE ARE YOU HEADED?';
      const heroMetaListEl = document.getElementById('heroMetaList');
      const heroMetaPromptEl = document.getElementById('heroMetaPrompt');

      const COLORS_JSON_URL = '/assets/teams/teams.json';
      // Supabase is the source of truth for team data; the JSON above is a
      // cached fallback for offline / first-paint scenarios.
      const TEAMS_REST_URL = SB_CONFIG.url + '/rest/v1/teams'
        + '?select=league,conference,code,full_name,first_name,fanbase,mascot,sport,shell,stripe,mask'
        + '&order=league_sort.asc&order=team_sort.asc';
      const NO_HELMET_PALETTE = {
        primary_color: '#c8c4ba',
        secondary_color: '#8a8680',
        tertiary_color: '#4a4642'
      };
      const CATEGORY_ICON_FOOTBALL = 'football';
      const CATEGORY_ICON_MUSIC = 'music';
      const CATEGORY_ICON_VALUES = new Set([CATEGORY_ICON_FOOTBALL, 'basketball', 'baseball', CATEGORY_ICON_MUSIC]);

      // Geography badge lookup tables.
      const US_STATES = {
        'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
        'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',
        'hawaii':'HI','idaho':'ID','illinois':'IL','indiana':'IN','iowa':'IA',
        'kansas':'KS','kentucky':'KY','louisiana':'LA','maine':'ME','maryland':'MD',
        'massachusetts':'MA','michigan':'MI','minnesota':'MN','mississippi':'MS','missouri':'MO',
        'montana':'MT','nebraska':'NE','nevada':'NV','new hampshire':'NH','new jersey':'NJ',
        'new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND','ohio':'OH',
        'oklahoma':'OK','oregon':'OR','pennsylvania':'PA','rhode island':'RI','south carolina':'SC',
        'south dakota':'SD','tennessee':'TN','texas':'TX','utah':'UT','vermont':'VT',
        'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI','wyoming':'WY',
        'district of columbia':'DC', 'dc':'DC', 'd.c.':'DC', 'd. c.':'DC'
      };
      // Country oval decals — ISO 3166-1 alpha-3 codes (Olympic/FIFA style).
      const COUNTRY_CODES = {
        'united kingdom':'GBR','england':'GBR','scotland':'GBR','wales':'GBR','northern ireland':'GBR',
        'france':'FRA','germany':'DEU','spain':'ESP','italy':'ITA','portugal':'PRT',
        'netherlands':'NLD','belgium':'BEL','ireland':'IRL','sweden':'SWE','norway':'NOR',
        'denmark':'DNK','finland':'FIN','austria':'AUT','switzerland':'CHE','poland':'POL',
        'czech republic':'CZE','greece':'GRC','turkey':'TUR','russia':'RUS','ukraine':'UKR',
        'mexico':'MEX','canada':'CAN','brazil':'BRA','argentina':'ARG','chile':'CHL',
        'colombia':'COL','peru':'PER','uruguay':'URY',
        'australia':'AUS','new zealand':'NZL','japan':'JPN','china':'CHN','south korea':'KOR',
        'india':'IND','singapore':'SGP','thailand':'THA','indonesia':'IDN','philippines':'PHL',
        'south africa':'ZAF','egypt':'EGY','israel':'ISR','united arab emirates':'ARE',
        'united states':'USA','usa':'USA'
      };

      // ---------------------------------------------------------------------------
      // Geography badges
      // ---------------------------------------------------------------------------
      function cityGeoBadge(label) {
        const labelStr = String(label || '').trim();
        // Special case: "Washington D.C." (and variants like "Washington DC",
        // "Washington, D.C.") often arrives WITHOUT a real comma separator, so
        // the parts-after-comma loop below would miss it. A trailing "D.C." /
        // "DC" suffix is unambiguous enough to short-circuit here.
        if (/\bd\.?\s*c\.?$/i.test(labelStr)) {
          return { kind: 'state', value: 'DC' };
        }
        const parts = labelStr.split(',').map((s) => s.trim()).filter(Boolean);
        // Walk from the end inward so "London, England, United Kingdom" still matches UK.
        for (let i = parts.length - 1; i >= 1; i--) {
          const key = parts[i].toLowerCase();
          if (US_STATES[key]) return { kind: 'state', value: US_STATES[key] };
          if (COUNTRY_CODES[key]) return { kind: 'country', value: COUNTRY_CODES[key] };
        }
        return null;
      }

      function cityDisplayName(label) {
        const parts = String(label || '').split(',').map((s) => s.trim()).filter(Boolean);
        return parts[0] || label || '';
      }

      function svgPathCenter(pathData, fallbackX, fallbackY) {
        const numbers = String(pathData || '').match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
        if (!numbers || numbers.length < 2) return { x: fallbackX, y: fallbackY };
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        for (let i = 0; i < numbers.length - 1; i += 2) {
          const x = Number(numbers[i]);
          const y = Number(numbers[i + 1]);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
        if (![minX, minY, maxX, maxY].every(Number.isFinite)) {
          return { x: fallbackX, y: fallbackY };
        }
        return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
      }

      // Builds the visual element for a geo badge. For US states we have
      // baked-in SVG outlines (us-state-shapes.js) — render the silhouette
      // with the 2-letter abbreviation overlaid. Countries (and any state we
      // somehow don't have a shape for) fall back to the existing span.
      function buildGeoBadge(badge, extraClass) {
        const cls = (s) => 'hero-meta-list-geo' + (s ? ' ' + s : '') + (extraClass ? ' ' + extraClass : '');
        const shapes = window.US_STATE_SHAPES || null;
        if (badge && badge.kind === 'state' && shapes && shapes[badge.value]) {
          const NS = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(NS, 'svg');
          svg.setAttribute('viewBox', shapes._viewBox || '0 0 40 24');
          svg.setAttribute('class', cls('hero-meta-list-geo--state hero-meta-list-geo--shape'));
          svg.setAttribute('aria-hidden', 'true');
          svg.setAttribute('focusable', 'false');
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('d', shapes[badge.value]);
          svg.appendChild(path);
          const fallbackX = (shapes._w || 40) / 2;
          const fallbackY = (shapes._h || 24) / 2;
          const labelPoint = svgPathCenter(shapes[badge.value], fallbackX, fallbackY);
          const text = document.createElementNS(NS, 'text');
          text.setAttribute('x', String(labelPoint.x));
          text.setAttribute('y', String(labelPoint.y));
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('dominant-baseline', 'middle');
          text.setAttribute('alignment-baseline', 'middle');
          text.setAttribute('dy', '0.04em');
          text.textContent = badge.value;
          svg.appendChild(text);
          return svg;
        }
        const span = document.createElement('span');
        if (badge) {
          span.className = cls('hero-meta-list-geo--' + badge.kind);
          if (badge.kind === 'country') {
            const label = document.createElement('span');
            label.className = 'hero-meta-list-geo-label';
            label.textContent = badge.value;
            span.appendChild(label);
          } else {
            span.textContent = badge.value;
          }
          span.setAttribute('aria-hidden', 'true');
        } else {
          span.className = cls('');
        }
        return span;
      }

      // ---------------------------------------------------------------------------
      // Page state
      // ---------------------------------------------------------------------------
      let activeMode = MODE_FAN;
      let selectedEntryKind = '';
      let selectedEntryKey  = '';
      let liveGames = [];
      let colorsByCityMascot = new Map();
      let allTeams = [];

      // ---------------------------------------------------------------------------
      // Team data and schedule normalization
      // ---------------------------------------------------------------------------
      function teamKey(value) {
        return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
      }

      // Build the same { lookup, teams } shape from a flat list of team records.
      // Accepts either Supabase rows ({ first_name, full_name, ... }) or the
      // legacy JSON shape ({ firstName, fullName, ... }) — picks whichever keys
      // are present per record.
      function buildTeamIndex(records) {
        const lookup = new Map();
        const teams = [];
        for (const value of records || []) {
          if (!value || typeof value !== 'object') continue;
          const firstName = value.firstName || value.first_name || '';
          const fanbase   = value.fanbase   || firstName        || '';
          const mascot    = value.mascot    || '';
          const sport     = value.sport     || '';
          const shell     = value.shell     || '';
          const stripe    = value.stripe    || '';
          const mask      = value.mask      || '';
          const palette = {
            primary_color: shell,
            secondary_color: stripe,
            tertiary_color: mask,
            sport,
            fanbase
          };
          // Index by fanbase (matches schedule's away_team_city); also index by
          // firstName when it differs so legacy schedule data using the brand
          // short name still resolves.
          const fanbaseKey = teamKey(fanbase);
          const firstNameKey = teamKey(firstName);
          const mascotKey = teamKey(mascot);
          if (mascotKey) {
            if (fanbaseKey) lookup.set(fanbaseKey + '|' + mascotKey, palette);
            if (firstNameKey && firstNameKey !== fanbaseKey) lookup.set(firstNameKey + '|' + mascotKey, palette);
          }
          teams.push({ firstName, fanbase, mascot, sport, palette });
        }
        return { lookup, teams };
      }

      async function fetchTeamColorsFromSupabase() {
        const response = await fetch(TEAMS_REST_URL, {
          headers: { apikey: SB_CONFIG.key, Authorization: 'Bearer ' + SB_CONFIG.key },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
      }

      async function fetchTeamColorsFromJson() {
        const response = await fetch(COLORS_JSON_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const doc = await response.json();
        const flat = [];
        const walk = (node) => {
          if (!node || typeof node !== 'object') return;
          for (const value of Object.values(node)) {
            if (!value || typeof value !== 'object') continue;
            if ('fullName' in value || 'shell' in value) flat.push(value);
            else walk(value);
          }
        };
        walk((doc && doc.leagues) || {});
        return flat;
      }

      async function fetchTeamColors() {
        try {
          const rows = await fetchTeamColorsFromSupabase();
          if (Array.isArray(rows) && rows.length) return buildTeamIndex(rows);
          // Empty array → table not seeded yet; fall through to JSON.
        } catch (error) {
          // Network/RLS/etc — fall back to bundled JSON.
        }
        try {
          const flat = await fetchTeamColorsFromJson();
          return buildTeamIndex(flat);
        } catch (error) {
          return { lookup: new Map(), teams: [] };
        }
      }

      function getHelmetByAwayTeam(game) {
        if (!game) return null;
        const cityKey = teamKey(game.away_team_city);
        const mascotKey = teamKey(game.away_team_mascot);
        if (!cityKey || !mascotKey) return null;
        return colorsByCityMascot.get(cityKey + '|' + mascotKey) || null;
      }

      function normalizeCategoryIcon(value) {
        const normalized = String(value || '').trim().toLowerCase();
        return CATEGORY_ICON_VALUES.has(normalized) ? normalized : '';
      }

      function getGameCategoryIcon(game, fallbackPalette) {
        return normalizeCategoryIcon(game && game.category_icon)
          || normalizeCategoryIcon(game && game.categoryIcon)
          || normalizeCategoryIcon(fallbackPalette && fallbackPalette.sport);
      }

      function getEntryCategoryIcon(games, fallbackPalette) {
        for (const game of games || []) {
          const explicit = normalizeCategoryIcon(game && game.category_icon)
            || normalizeCategoryIcon(game && game.categoryIcon);
          if (explicit) return explicit;
        }
        return normalizeCategoryIcon(fallbackPalette && fallbackPalette.sport) || CATEGORY_ICON_FOOTBALL;
      }

      function pixelMusicNotesSVG(primary, secondary, tertiary) {
        const ink = '#181818';
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">'
          + '<rect width="64" height="64" fill="none"/>'
          + '<g fill="' + ink + '">'
          + '<g transform="rotate(-7 15 28)">'
          + '<rect x="11" y="10" width="4" height="25"/><rect x="14" y="13" width="13" height="4"/>'
          + '<rect x="24" y="17" width="4" height="8"/><rect x="28" y="22" width="5" height="4"/>'
          + '<rect x="3" y="33" width="16" height="9"/><rect x="7" y="30" width="12" height="15"/>'
          + '<rect x="10" y="44" width="10" height="4"/>'
          + '</g>'
          + '<g transform="rotate(-6 51 17)">'
          + '<rect x="46" y="5" width="3" height="16"/><rect x="49" y="7" width="10" height="3"/>'
          + '<rect x="57" y="10" width="3" height="7"/><rect x="50" y="18" width="9" height="3"/>'
          + '<rect x="59" y="21" width="3" height="6"/><rect x="42" y="22" width="10" height="8"/>'
          + '<rect x="44" y="29" width="7" height="3"/>'
          + '</g>'
          + '<g transform="rotate(-6 43 48)">'
          + '<rect x="29" y="33" width="28" height="5"/><rect x="31" y="41" width="25" height="5"/>'
          + '<rect x="33" y="45" width="5" height="11"/><rect x="53" y="44" width="5" height="11"/>'
          + '<rect x="24" y="53" width="16" height="9"/><rect x="28" y="50" width="12" height="14"/>'
          + '<rect x="46" y="52" width="16" height="9"/><rect x="50" y="49" width="12" height="14"/>'
          + '</g>'
          + '</g>'
          + '</svg>';
        return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
      }

      // Dispatch to the right CATEGORY_ICON SVG generator. Falls back to the
      // football helmet so legacy entries with no icon tag still render.
      function teamMarkSVG(categoryIcon, primary, secondary, tertiary) {
        switch (normalizeCategoryIcon(categoryIcon) || CATEGORY_ICON_FOOTBALL) {
          case CATEGORY_ICON_MUSIC:
            return pixelMusicNotesSVG(primary, secondary, tertiary);
          case 'basketball':
            if (typeof window.basketballSVG === 'function') return window.basketballSVG(primary, secondary, tertiary);
            break;
          case 'baseball':
            if (typeof window.baseballSVG === 'function') return window.baseballSVG(primary, secondary, tertiary);
            break;
        }
        return typeof window.helmetSVG === 'function' ? window.helmetSVG(primary, secondary, tertiary) : null;
      }

      function isTrueish(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'string') {
          const normalized = value.trim().toLowerCase();
          return !!normalized && normalized !== 'false' && normalized !== '0' && normalized !== 'no';
        }
        return !!value;
      }

      function plainText(value) {
        return String(value || '')
          .replace(/<[^>]*>/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function getCity(game) {
        return plainText(game && game.city);
      }

      // Always bucket fan-mode games by fanbase+mascot internally so two
      // teams with the same fanbase (LA Rams/Chargers, NY Yankees/Mets,
      // UTSA Roadrunners + San Antonio Spurs, etc.) each get their own
      // directory row. The row displays only the fanbase; the helmet icon
      // tells them apart visually. We normalize via the team's `fanbase`
      // from teams.json so schedule inconsistencies (UTSA vs San Antonio)
      // don't fracture a single team into multiple rows.
      function getFanTeam(game) {
        const cityRaw = plainText(game && game.away_team_city);
        const mascot = plainText(game && game.away_team_mascot);
        const helmet = getHelmetByAwayTeam(game);
        const city = (helmet && helmet.fanbase) || cityRaw;
        if (city) {
          return mascot ? city + ' ' + mascot : city;
        }
        const structuredCandidates = [
          game && game.away_team,
          game && game.awayTeam,
          game && game.visitor_team,
          game && game.visitorTeam,
          game && game.fan_team,
          game && game.fanTeam,
          game && game.opponent_team,
          game && game.opponentTeam
        ];
        for (const candidate of structuredCandidates) {
          const team = plainText(candidate);
          if (team) return team;
        }
        const name = plainText(game && game.name);
        const match = name.match(/^(.+?)\s+Fans Takeover\s+/i);
        return match ? plainText(match[1]) : '';
      }

      function getGameCountLabel(count) {
        return count === 1 ? '1 game' : count + ' games';
      }

      function getGameCountHeadline(count) {
        return count === 1 ? '1 Game' : count + ' Games';
      }

      function isFandomGame(game) {
        if (!game || typeof game !== 'object') return false;
        if (Object.prototype.hasOwnProperty.call(game, 'fandom_game')) {
          return isTrueish(game.fandom_game);
        }
        // Backward-compatible until the database migration is applied.
        return !!(plainText(game.away_team_city) && plainText(game.away_team_mascot));
      }

      async function fetchGames() {
        const url = new URL('rest/v1/' + SB_CONFIG.table, SB_CONFIG.url.replace(/\/+$/, '') + '/');
        url.searchParams.set('apikey', SB_CONFIG.key);
        url.searchParams.set('select', '*');
        url.searchParams.set('order', 'name.asc');
        const response = await fetch(url.toString(), {
          headers: {
            apikey: SB_CONFIG.key,
            Authorization: 'Bearer ' + SB_CONFIG.key,
            Accept: 'application/json'
          },
          cache: 'no-store'
        });
        if (!response.ok) {
          const text = await response.text().catch(() => '');
          throw new Error('Supabase ' + response.status + ': ' + text.slice(0, 200));
        }
        return response.json();
      }

      // ---------------------------------------------------------------------------
      // Hero counts and directory data
      // ---------------------------------------------------------------------------
      function updateHeroButtons() {
        document.querySelectorAll('.hero-mode-tab').forEach((btn) => {
          const isFan = btn.dataset.mode === 'fan';
          const selected = (isFan && activeMode === MODE_FAN) || (!isFan && activeMode === MODE_CITY);
          btn.setAttribute('aria-selected', String(selected));
          btn.setAttribute('tabindex', selected ? '0' : '-1');
        });
        const switchEl = document.getElementById('heroModeSwitch');
        if (switchEl) switchEl.dataset.mode = activeMode === MODE_FAN ? 'fan' : 'city';
        if (heroMetaPromptEl) {
          heroMetaPromptEl.textContent = activeMode === MODE_FAN ? PROMPT_FAN : PROMPT_CITY;
        }
      }

      function buildCityEntries() {
        const counts = new Map();
        liveGames.forEach((game) => {
          const city = getCity(game);
          if (!city) return;
          counts.set(city, (counts.get(city) || 0) + 1);
        });
        return [...counts.entries()]
          .sort((left, right) => left[0].localeCompare(right[0], undefined, { sensitivity: 'base' }))
          .map(([label, count]) => ({
            label,
            count,
            sub: getGameCountLabel(count),
            href: '#',
            entryKind: 'city',
            entryKey: label
          }));
      }

      // Fan-mode directory is driven by teams.json (canonical team list), not
      // by whatever free-form text happens to be in the Supabase game rows.
      // We pre-bucket games by their normalized fanKey so each team can claim
      // its own entries; teams with no matching games are dropped so the list
      // stays focused on currently-playable fandoms.
      function buildFanEntries() {
        const gamesByFanKey = new Map();
        liveGames.filter(isFandomGame).forEach((game) => {
          const fan = getFanTeam(game);
          if (!fan) return;
          if (!gamesByFanKey.has(fan)) gamesByFanKey.set(fan, []);
          gamesByFanKey.get(fan).push(game);
        });
        return allTeams
          .map((team) => {
            const fanbase = team.fanbase || team.firstName || '';
            const mascot = team.mascot || '';
            if (!fanbase || !mascot) return null;
            const fanKey = fanbase + ' ' + mascot;
            const games = gamesByFanKey.get(fanKey) || [];
            const count = games.length;
            const categoryIcon = getEntryCategoryIcon(games, team.palette);
            return {
              label: fanbase,
              count,
              sub: count > 0 ? getGameCountLabel(count) : 'No games yet',
              href: '#',
              helmet: team.palette,
              categoryIcon,
              expectsHelmet: true,
              entryKind: 'fan',
              entryKey: fanKey
            };
          })
          .filter((entry) => entry && entry.count > 0)
          .sort((left, right) => left.label.localeCompare(right.label, undefined, { sensitivity: 'base' }));
      }

      // Nav-stats ticker — starts at 0 and counts up open-ended on page
      // load, then eases into the real totals once games/teams have loaded.
      // If the open-ended count happens to exceed the actual total (rare —
      // e.g. only a handful of cities and a slow connection), it clamps to
      // the target rather than counting backwards.
      const statsTicker = (function () {
        const gameEl = document.getElementById('heroKickerGameCount');
        const cityEl = document.getElementById('heroKickerCityCount');
        const GAME_TICK_MS = 50;
        const CITY_TICK_MS = 150;
        const EASE_DURATION = 1400;
        let gameDisplayed = 0;
        let cityDisplayed = 0;
        let gameTarget = null;
        let cityTarget = null;
        let lastGameTick = 0;
        let lastCityTick = 0;
        let easing = false;
        let easeStart = 0;
        let easeGameFrom = 0;
        let easeCityFrom = 0;
        let raf = null;

        function render() {
          if (gameEl) gameEl.textContent = String(gameDisplayed);
          if (cityEl) cityEl.textContent = String(cityDisplayed);
        }

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function tick(ts) {
          if (easing) {
            const t = Math.min(1, (ts - easeStart) / EASE_DURATION);
            const e = easeOutCubic(t);
            gameDisplayed = Math.round(easeGameFrom + (gameTarget - easeGameFrom) * e);
            cityDisplayed = Math.round(easeCityFrom + (cityTarget - easeCityFrom) * e);
            render();
            if (t >= 1) {
              easing = false;
              raf = null;
              return;
            }
          } else {
            if (!lastGameTick) lastGameTick = ts;
            if (!lastCityTick) lastCityTick = ts;
            if (ts - lastGameTick >= GAME_TICK_MS) {
              gameDisplayed += 1;
              lastGameTick = ts;
            }
            if (ts - lastCityTick >= CITY_TICK_MS) {
              cityDisplayed += 1;
              lastCityTick = ts;
            }
            render();
          }
          raf = requestAnimationFrame(tick);
        }

        function start() {
          if (raf || easing) return;
          raf = requestAnimationFrame(tick);
        }

        function setTarget(games, cities) {
          if (gameTarget === games && cityTarget === cities) return;
          gameTarget = games;
          cityTarget = cities;
          if (gameDisplayed > games) gameDisplayed = games;
          if (cityDisplayed > cities) cityDisplayed = cities;
          easeGameFrom = gameDisplayed;
          easeCityFrom = cityDisplayed;
          easeStart = performance.now();
          easing = true;
          if (!raf) raf = requestAnimationFrame(tick);
        }

        return { start, setTarget };
      }());
      statsTicker.start();

      function renderDirectory() {
        updateHeroButtons();
        const cityCount = new Set(liveGames.map(getCity).filter(Boolean)).size;
        statsTicker.setTarget(liveGames.length, cityCount);
        renderHeroMetaList();
      }

      // ---------------------------------------------------------------------------
      // Selection and URL state
      // ---------------------------------------------------------------------------
      function refreshSelectionStyles() {
        document.querySelectorAll('[data-entry-kind][data-entry-key]').forEach((el) => {
          const matches = el.dataset.entryKind === selectedEntryKind && el.dataset.entryKey === selectedEntryKey;
          el.classList.toggle('is-active', matches && !!selectedEntryKind);
        });
      }

      function toggleSelectedEntry(entry) {
        if (selectedEntryKind === entry.entryKind && selectedEntryKey === entry.entryKey) {
          clearSelectedEntry();
          return;
        }
        selectedEntryKind = entry.entryKind;
        selectedEntryKey  = entry.entryKey;
        refreshSelectionStyles();
        renderSelectedGames(entry);
        writeUrlState();
      }

      function clearSelectedEntry() {
        selectedEntryKind = '';
        selectedEntryKey  = '';
        refreshSelectionStyles();
        if (selectedGamesGridEl) selectedGamesGridEl.innerHTML = '';
        if (selectedGamesTitleEl) selectedGamesTitleEl.textContent = '';
        if (selectedGamesEl) {
          selectedGamesEl.hidden = true;
          selectedGamesEl.classList.remove('is-fresh');
        }
        writeUrlState();
      }

      // URL state: ?city= / ?fan= mirror the current selection so views are
      // bookmarkable, shareable, and survive back/forward navigation.
      let suppressUrlWrite = false;

      function modeHref(mode) {
        return '/games/?mode=' + (mode === MODE_FAN ? MODE_FAN : MODE_CITY);
      }

      function pushModeState(mode) {
        const nextMode = mode === MODE_FAN ? MODE_FAN : MODE_CITY;
        const next = new URL(window.location.href);
        next.search = '';
        next.searchParams.set('mode', nextMode);
        if (next.href === window.location.href) return;
        history.pushState({ mode: nextMode }, '', next.pathname + next.search);
      }

      function setModeFromControl(mode) {
        const nextMode = mode === MODE_FAN ? MODE_FAN : MODE_CITY;
        suppressUrlWrite = true;
        try {
          setMode(nextMode);
        } finally {
          suppressUrlWrite = false;
        }
        pushModeState(nextMode);
      }

      function writeUrlState() {
        if (suppressUrlWrite) return;
        const next = new URL(window.location.href);
        next.search = '';
        if (selectedEntryKind === 'city' && selectedEntryKey) {
          next.searchParams.set('city', selectedEntryKey);
        } else if (selectedEntryKind === 'fan' && selectedEntryKey) {
          next.searchParams.set('fan', selectedEntryKey);
        }
        if (next.href === window.location.href) return;
        history.pushState({ kind: selectedEntryKind, key: selectedEntryKey }, '', next);
      }

      function applyUrlSelection() {
        const params = new URLSearchParams(window.location.search);
        const city = params.get('city');
        const fan = params.get('fan');
        const key = city ? 'city|' + city : fan ? 'fan|' + fan : '';
        if (!key) {
          if (selectedEntryKind) clearSelectedEntry();
          return;
        }
        const entry = heroMetaEntries.get(key);
        if (entry) {
          selectedEntryKind = entry.entryKind;
          selectedEntryKey  = entry.entryKey;
          refreshSelectionStyles();
          renderSelectedGames(entry, { scroll: false, animate: false });
        } else if (selectedEntryKind) {
          clearSelectedEntry();
        }
      }

      function rerenderSelectedGames(options) {
        if (!selectedEntryKind || !selectedEntryKey) return;
        const entry = heroMetaEntries.get(selectedEntryKind + '|' + selectedEntryKey);
        if (entry) renderSelectedGames(entry, options || { scroll: false, animate: false });
      }

      // ---------------------------------------------------------------------------
      // Hero directory rendering
      // ---------------------------------------------------------------------------
      function createHeroMetaItem(entry) {
        const item = document.createElement('a');
        item.className = 'hero-meta-list-item';
        item.href = '#';
        item.dataset.entryKind = entry.entryKind;
        item.dataset.entryKey  = entry.entryKey;
        if (selectedEntryKind === entry.entryKind && selectedEntryKey === entry.entryKey) {
          item.classList.add('is-active');
        }

        if (entry.expectsHelmet) {
          const palette = entry.helmet || NO_HELMET_PALETTE;
          // Tint the row using the team's primary (and secondary) so each
          // team has its own visual identity in the scrolling directory.
          if (entry.helmet && entry.helmet.primary_color) {
            item.dataset.teamTint = '';
            item.style.setProperty('--team-primary', entry.helmet.primary_color);
            if (entry.helmet.secondary_color) {
              item.style.setProperty('--team-secondary', entry.helmet.secondary_color);
            }
          }
          const src = teamMarkSVG(
            entry.categoryIcon || palette.sport,
            palette.primary_color,
            palette.secondary_color,
            palette.tertiary_color
          );
          if (src) {
            const img = document.createElement('img');
            img.className = 'hero-meta-list-helmet';
            img.alt = '';
            img.src = src;
            if (!entry.helmet) img.classList.add('hero-meta-list-helmet--none');
            item.appendChild(img);
          }
        } else if (entry.entryKind === 'city') {
          const badge = cityGeoBadge(entry.label);
          item.appendChild(buildGeoBadge(badge));
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'hero-meta-list-helmet hero-meta-list-helmet--spacer';
          item.appendChild(spacer);
        }

        const labelWrap = document.createElement('span');
        labelWrap.className = 'hero-meta-list-copy';
        const label = document.createElement('span');
        label.className = 'hero-meta-list-name';
        label.textContent = entry.entryKind === 'city' ? cityDisplayName(entry.label) : entry.label;
        labelWrap.append(label);
        const count = document.createElement('span');
        count.className = 'hero-meta-list-count';
        count.textContent = getGameCountLabel(entry.count);
        item.append(labelWrap, count);
        return item;
      }

      const heroMetaEntries = new Map();

      function renderHeroMetaList() {
        if (!heroMetaListEl) return;
        heroMetaListEl.innerHTML = '';
        heroMetaEntries.clear();
        const entries = activeMode === MODE_FAN ? buildFanEntries() : buildCityEntries();
        if (!entries.length) return;

        const track = document.createElement('div');
        track.className = 'hero-meta-list-track';
        // Three identical stacked chunks: [pre | primary | post]. We start the
        // scrollTop inside the primary chunk so the user has a full chunk's
        // worth of content available both above (pre) and below (post). When
        // the auto-scroll or a manual drag/wheel moves scrollTop outside the
        // primary chunk's range, setMetaScrollPosition silently jumps by
        // exactly one chunk-height — invisible because the chunks are clones.
        const preChunk = document.createElement('div');
        preChunk.className = 'hero-meta-list-chunk';
        preChunk.setAttribute('aria-hidden', 'true');
        const primaryChunk = document.createElement('div');
        primaryChunk.className = 'hero-meta-list-chunk';
        const postChunk = document.createElement('div');
        postChunk.className = 'hero-meta-list-chunk';
        postChunk.setAttribute('aria-hidden', 'true');
        // Stash each entry by its lookup key for the delegated click handler.
        entries.forEach((entry) => {
          heroMetaEntries.set(entry.entryKind + '|' + entry.entryKey, entry);
          primaryChunk.appendChild(createHeroMetaItem(entry));
        });
        // Clone into pre/post chunks so the measured loop height matches
        // the primary list exactly.
        entries.forEach((entry) => preChunk.appendChild(createHeroMetaItem(entry)));
        entries.forEach((entry) => postChunk.appendChild(createHeroMetaItem(entry)));
        track.append(preChunk, primaryChunk, postChunk);
        heroMetaListEl.appendChild(track);
        // Park scrollTop at the top of the primary chunk so there's a full
        // chunk visible above AND below right from frame 0 — that's what
        // makes "scroll up" feel infinite instead of clamping at the top.
        const initialLoopHeight = getMetaScrollLoopHeight();
        metaScrollPosition = initialLoopHeight;
        heroMetaListEl.scrollTop = initialLoopHeight;
        startMetaScroll();
      }

      // ---------------------------------------------------------------------------
      // Hero directory infinite scroll
      // ---------------------------------------------------------------------------
      const META_SCROLL_PX_PER_SEC = 22;
      let metaScrollRaf = null;
      let metaScrollLastTs = 0;
      let metaScrollPosition = 0;
      let metaDragActive = false;
      let metaUserPauseUntil = 0;
      const metaReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      function getMetaScrollLoopHeight() {
        if (!heroMetaListEl) return 0;
        const firstChunk = heroMetaListEl.querySelector('.hero-meta-list-chunk');
        if (!firstChunk) return 0;
        return Math.max(0, Math.round(firstChunk.getBoundingClientRect().height));
      }

      function shouldPauseMetaScroll(ts) {
        if (!heroMetaListEl) return true;
        if (metaDragActive) return true;
        if (heroMetaListEl.contains(document.activeElement)) return true;
        return ts < metaUserPauseUntil;
      }

      function setMetaScrollPosition(next, loopHeight) {
        if (!heroMetaListEl) return;
        let value = Number.isFinite(next) ? next : 0;
        if (loopHeight > 0 && loopHeight > heroMetaListEl.clientHeight) {
          // Keep scrollTop inside the *primary* chunk's range — i.e.
          // [loopHeight, 2 * loopHeight). Jumps by exactly one loopHeight are
          // invisible because the three stacked chunks are identical, which
          // is what makes scrolling feel infinite in BOTH directions.
          while (value >= 2 * loopHeight) value -= loopHeight;
          while (value < loopHeight) value += loopHeight;
        } else {
          // Content fits in the viewport — there's nothing to wrap. Clamp
          // to the natural scroll range so metaScrollPosition can't drift
          // beyond the browser's actual scrollTop.
          const max = Math.max(0, heroMetaListEl.scrollHeight - heroMetaListEl.clientHeight);
          if (value < 0) value = 0;
          if (value > max) value = max;
        }
        metaScrollPosition = value;
        heroMetaListEl.scrollTop = value;
      }

      function startMetaScroll() {
        if (metaScrollRaf || metaReducedMotion || !heroMetaListEl) return;
        metaScrollLastTs = 0;
        const tick = (ts) => {
          if (!metaScrollLastTs) metaScrollLastTs = ts;
          const dt = Math.min(40, ts - metaScrollLastTs);
          metaScrollLastTs = ts;
          const loopHeight = getMetaScrollLoopHeight();
          if (!shouldPauseMetaScroll(ts) && heroMetaListEl && loopHeight > heroMetaListEl.clientHeight) {
            setMetaScrollPosition(metaScrollPosition + META_SCROLL_PX_PER_SEC * (dt / 1000), loopHeight);
          }
          metaScrollRaf = requestAnimationFrame(tick);
        };
        metaScrollRaf = requestAnimationFrame(tick);
      }

      // Wrap scrollTop into the height of the original chunk so user
      // scrolling / wheel / drag still looks seamless.
      function wrapMetaScroll() {
        if (!heroMetaListEl) return;
        const loopHeight = getMetaScrollLoopHeight();
        if (loopHeight <= 0) {
          metaScrollPosition = heroMetaListEl.scrollTop;
          return;
        }
        setMetaScrollPosition(heroMetaListEl.scrollTop, loopHeight);
      }

      function initMetaScrollInteractions() {
        if (!heroMetaListEl) return;
        // Drag-to-scroll.
        let dragStartY = 0;
        let dragStartScroll = 0;
        let dragSuppressClick = false;
        const DRAG_THRESHOLD = 4;

        let pointerDownId = null;
        heroMetaListEl.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          metaDragActive = false;
          pointerDownId = e.pointerId;
          dragStartY = e.clientY;
          metaScrollPosition = heroMetaListEl.scrollTop;
          dragStartScroll = heroMetaListEl.scrollTop;
          metaUserPauseUntil = performance.now() + 600;
          // Do NOT setPointerCapture here — it would retarget the subsequent
          // `click` event to heroMetaListEl, breaking chip click detection.
          // Capture is set only once a real drag is detected (in pointermove).
        });

        heroMetaListEl.addEventListener('pointermove', (e) => {
          if (e.pointerId !== pointerDownId) return;
          const dy = e.clientY - dragStartY;
          if (!metaDragActive && Math.abs(dy) > DRAG_THRESHOLD) {
            metaDragActive = true;
            heroMetaListEl.classList.add('is-dragging');
            try { heroMetaListEl.setPointerCapture(e.pointerId); } catch (_) {}
          }
          if (metaDragActive) {
            heroMetaListEl.scrollTop = dragStartScroll - dy;
            wrapMetaScroll();
            // Re-baseline so wrap doesn't make subsequent moves jump.
            const consumed = (dragStartScroll - dy) - heroMetaListEl.scrollTop;
            if (consumed !== 0) {
              dragStartScroll -= consumed;
            }
            e.preventDefault();
          }
        });

        const endDrag = (e) => {
          if (e.pointerId === pointerDownId) pointerDownId = null;
          if (heroMetaListEl.hasPointerCapture(e.pointerId)) {
            try { heroMetaListEl.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          if (metaDragActive) {
            dragSuppressClick = true;
            // Allow one event loop turn for the click to fire and be swallowed.
            setTimeout(() => { dragSuppressClick = false; }, 0);
          }
          metaDragActive = false;
          heroMetaListEl.classList.remove('is-dragging');
          metaUserPauseUntil = performance.now() + 350;
        };
        heroMetaListEl.addEventListener('pointerup', endDrag);
        heroMetaListEl.addEventListener('pointercancel', endDrag);

        // Swallow the click that follows a drag.
        heroMetaListEl.addEventListener('click', (e) => {
          if (dragSuppressClick) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        // Native scroll (wheel) — pause briefly so we don't fight the user.
        heroMetaListEl.addEventListener('wheel', () => {
          metaUserPauseUntil = performance.now() + 800;
        }, { passive: true });

        heroMetaListEl.addEventListener('scroll', wrapMetaScroll, { passive: true });
      }

      initMetaScrollInteractions();

      // ---------------------------------------------------------------------------
      // Selected-games rendering
      // ---------------------------------------------------------------------------
      function gamesForEntry(entry) {
        if (entry.entryKind === 'city') {
          return liveGames.filter((g) => getCity(g) === entry.entryKey);
        }
        if (entry.entryKind === 'fan') {
          return liveGames.filter((g) => getFanTeam(g) === entry.entryKey);
        }
        return [];
      }

      function formatGameDate(game) {
        const dateStr = String((game && game.game_date) || '').trim();
        const timeStr = String((game && game.start_time) || '').trim();
        const parts = [];

        if (dateStr) {
          // Parse YYYY-MM-DD as a *local* date so the weekday isn't shifted
          // by the viewer's timezone (new Date('2026-10-12') would be UTC).
          const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (match) {
            const d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
            const sameYear = d.getFullYear() === new Date().getFullYear();
            parts.push(d.toLocaleDateString('en-US', {
              weekday: 'short',
              month: 'short',
              day: 'numeric',
              year: sameYear ? undefined : 'numeric'
            }));
          } else {
            parts.push(dateStr);
          }
        }

        if (timeStr) {
          const timeMatch = timeStr.match(/^(\d{1,2}):(\d{2})/);
          if (timeMatch) {
            const h24 = Number(timeMatch[1]);
            const minutes = timeMatch[2];
            const period = h24 >= 12 ? 'PM' : 'AM';
            const h12 = ((h24 + 11) % 12) + 1;
            parts.push(h12 + (minutes === '00' ? '' : ':' + minutes) + ' ' + period);
          } else {
            parts.push(timeStr.slice(0, 5));
          }
        }

        return parts.join(' · ');
      }

      function escapeRegExp(value) {
        return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function stripMascotNames(value, game) {
        let text = plainText(value);
        if (!text) return '';
        [
          [game && game.away_team_mascot, game && game.away_team_city],
          [game && game.home_team_mascot, game && game.home_team_city]
        ].forEach(([mascot, city]) => {
          const mascotText = plainText(mascot);
          const cityText = plainText(city);
          if (!mascotText || !cityText) return;
          text = text.replace(new RegExp('\\b' + escapeRegExp(mascotText) + '\\b', 'gi'), cityText);
        });
        return text.replace(/\s{2,}/g, ' ').trim();
      }

      function hexToRgb(hex) {
        const value = String(hex || '').replace('#', '').trim();
        const normalized = value.length === 3
          ? value.split('').map((ch) => ch + ch).join('')
          : value;
        if (!/^[0-9a-f]{6}$/i.test(normalized)) return null;
        return {
          r: parseInt(normalized.slice(0, 2), 16),
          g: parseInt(normalized.slice(2, 4), 16),
          b: parseInt(normalized.slice(4, 6), 16)
        };
      }

      function accentTextColor(hex) {
        const rgb = hexToRgb(hex);
        if (!rgb) return '#ffffff';
        const luminance = (0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b) / 255;
        return luminance > 0.58 ? '#111111' : '#ffffff';
      }

      function fitTextToBox(el) {
        if (!el) return;
        const minSize = Number(el.dataset.fitMin || 10);
        const fallbackMax = parseFloat(window.getComputedStyle(el).fontSize) || 16;
        const maxSize = Number(el.dataset.fitMax || fallbackMax);
        let size = maxSize;
        el.style.fontSize = size + 'px';
        if (!el.clientWidth || !el.clientHeight) return;
        while (size > minSize && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
          size -= 0.5;
          el.style.fontSize = size + 'px';
        }
      }

      let selectedCardFitRaf = null;
      function scheduleSelectedCardTextFit() {
        if (selectedCardFitRaf) cancelAnimationFrame(selectedCardFitRaf);
        selectedCardFitRaf = requestAnimationFrame(() => {
          selectedCardFitRaf = null;
          if (!selectedGamesEl || selectedGamesEl.hidden) return;
          selectedGamesEl.querySelectorAll('[data-fit-text]').forEach(fitTextToBox);
        });
      }

      function renderSelectedGames(entry, options) {
        if (!selectedGamesEl || !selectedGamesGridEl || !selectedGamesTitleEl) return;
        const shouldScroll = !options || options.scroll !== false;
        const shouldAnimate = !options || options.animate !== false;
        const games = gamesForEntry(entry).slice().sort((a, b) => {
          const da = (a.game_date || '') + (a.start_time || '');
          const db = (b.game_date || '') + (b.start_time || '');
          return da.localeCompare(db);
        });
        selectedGamesTitleEl.innerHTML = '';
        const countLabel = getGameCountLabel(games.length);
        let titleText = '';
        let iconNode = null;

        if (entry.entryKind === 'fan') {
          const sample = games[0] || null;
          const fanbase = (entry.helmet && entry.helmet.fanbase) || plainText(sample && sample.away_team_city);
          titleText = `${getGameCountHeadline(games.length)} for traveling ${fanbase || entry.label} fans`;
          {
            const palette = entry.helmet || NO_HELMET_PALETTE;
            const src = teamMarkSVG(
              entry.categoryIcon || getGameCategoryIcon(sample, palette) || palette.sport,
              palette.primary_color,
              palette.secondary_color,
              palette.tertiary_color
            );
            if (src) {
              const img = document.createElement('img');
              img.className = 'selected-games-icon selected-games-icon--helmet';
              img.alt = '';
              img.src = src;
              iconNode = img;
            }
          }
        } else if (entry.entryKind === 'city') {
          titleText = `${getGameCountHeadline(games.length)} in ${entry.label}`;
          const badge = cityGeoBadge(entry.label);
          if (badge) iconNode = buildGeoBadge(badge, 'selected-games-icon');
        } else {
          titleText = `${entry.label} · ${countLabel}`;
        }

        if (iconNode) selectedGamesTitleEl.appendChild(iconNode);
        const textSpan = document.createElement('span');
        textSpan.className = 'selected-games-title-text';
        textSpan.textContent = titleText;
        selectedGamesTitleEl.appendChild(textSpan);

        selectedGamesGridEl.innerHTML = '';
        if (!games.length) {
          const empty = document.createElement('div');
          empty.className = 'selected-games-empty';
          empty.textContent = 'No live games found.';
          selectedGamesGridEl.appendChild(empty);
        } else {
          games.forEach((game) => {
            const gameId = game.id || '';
            const gameHref = '/game/run/index.html?id=' + encodeURIComponent(gameId);
            const card = document.createElement('article');
            card.className = 'game-card';
            card.dataset.gameId = gameId;

            // Deed stamps: CATEGORY_ICON mark + state/country badge for the host city.
            const icons = document.createElement('div');
            icons.className = 'game-card-icons';
            const teamPalette = getHelmetByAwayTeam(game);
            const hasAwayTeam = !!(plainText(game.away_team_city) && plainText(game.away_team_mascot));
            // The game's own primary_color (set in the builder) wins over the
            // team helmet color, so non-fan games can have their own identity.
            const cardAccent = plainText(game.primary_color)
                            || (teamPalette && teamPalette.primary_color)
                            || '#2d4880';
            const cardSecondary = plainText(game.secondary_color)
                                || (teamPalette && teamPalette.secondary_color)
                                || cardAccent;
            card.style.setProperty('--card-accent', cardAccent);
            card.style.setProperty('--card-accent-ink', accentTextColor(cardAccent));
            card.style.setProperty('--card-secondary', cardSecondary);
            card.style.setProperty('--card-secondary-ink', accentTextColor(cardSecondary));
            const explicitCategoryIcon = normalizeCategoryIcon(game.category_icon) || normalizeCategoryIcon(game.categoryIcon);
            const categoryIcon = getGameCategoryIcon(game, teamPalette);
            if (hasAwayTeam || explicitCategoryIcon) {
              const palette = teamPalette || NO_HELMET_PALETTE;
              const helmetSrc = teamMarkSVG(
                categoryIcon,
                (teamPalette && teamPalette.primary_color) || cardAccent,
                (teamPalette && teamPalette.secondary_color) || plainText(game.secondary_color) || '#ffffff',
                (teamPalette && teamPalette.tertiary_color) || plainText(game.tertiary_color) || '#111111'
              );
              if (helmetSrc) {
                const helmetImg = document.createElement('img');
                helmetImg.className = 'game-card-helmet';
                helmetImg.alt = '';
                helmetImg.src = helmetSrc;
                icons.appendChild(helmetImg);
              }
            }
            const venueBadge = cityGeoBadge(game.city);
            if (venueBadge) icons.appendChild(buildGeoBadge(venueBadge));

            const deed = document.createElement('div');
            deed.className = 'game-card-deed';
            const deedHead = document.createElement('div');
            deedHead.className = 'game-card-deed-head';
            const primaryTagText = plainText(game.primary_tag);
            if (primaryTagText) {
              const deedLabel = document.createElement('span');
              deedLabel.className = 'game-card-deed-label';
              deedLabel.textContent = primaryTagText.toUpperCase();
              deedHead.appendChild(deedLabel);
            }
            if (icons.childNodes.length) deedHead.appendChild(icons);

            const title = document.createElement('div');
            title.className = 'game-card-title';
            title.textContent = stripMascotNames(game.name, game) || '(untitled game)';
            title.dataset.fitText = 'true';
            title.dataset.fitMax = '20';
            title.dataset.fitMin = '10';
            deed.append(deedHead, title);
            card.appendChild(deed);

            const deedLines = document.createElement('dl');
            deedLines.className = 'game-card-deed-lines';
            const addDeedLine = (labelText, valueText) => {
              const value = plainText(valueText);
              if (!value) return;
              const row = document.createElement('div');
              row.className = 'game-card-deed-line';
              const label = document.createElement('dt');
              label.textContent = labelText;
              const valueEl = document.createElement('dd');
              valueEl.textContent = value;
              valueEl.dataset.fitText = 'true';
              valueEl.dataset.fitMax = '14';
              valueEl.dataset.fitMin = '9';
              row.append(label, valueEl);
              deedLines.appendChild(row);
            };
            const dateStr = formatGameDate(game);
            addDeedLine('When', dateStr || 'Anytime');

            const cityText = plainText(game.city);
            if (cityText) {
              const commaIdx = cityText.indexOf(',');
              const cityLine1 = commaIdx >= 0 ? cityText.slice(0, commaIdx).trim() : cityText;
              const cityLine2 = commaIdx >= 0 ? cityText.slice(commaIdx + 1).trim() : '';
              const row = document.createElement('div');
              row.className = 'game-card-deed-line game-card-deed-line--city';
              const label = document.createElement('dt');
              label.textContent = 'Start City';
              const valueEl = document.createElement('dd');
              valueEl.dataset.fitText = 'true';
              // Lower max than other deed lines because two stacked lines
              // need to share the ~28px row content area without bleeding
              // upward into the "When" row above.
              valueEl.dataset.fitMax = '11';
              valueEl.dataset.fitMin = '8';
              const line1 = document.createElement('span');
              line1.className = 'game-card-deed-city-line';
              line1.textContent = cityLine1;
              const line2 = document.createElement('span');
              line2.className = 'game-card-deed-city-line';
              line2.textContent = cityLine2;
              valueEl.append(line1, line2);
              row.append(label, valueEl);
              deedLines.appendChild(row);
            }
            if (deedLines.childNodes.length) card.appendChild(deedLines);

            const tagline = document.createElement('div');
            tagline.className = 'game-card-tagline';
            tagline.textContent = stripMascotNames(game.tagline, game) || 'Open the link. Start on site.';
            tagline.dataset.fitText = 'true';
            tagline.dataset.fitMax = '14.5';
            tagline.dataset.fitMin = '10';
            card.appendChild(tagline);

            const actions = document.createElement('div');
            actions.className = 'game-card-actions';

            const playLink = document.createElement('a');
            playLink.className = 'game-card-play';
            playLink.href = gameHref;
            playLink.textContent = 'PLAY GAME';
            actions.appendChild(playLink);

            card.appendChild(actions);

            selectedGamesGridEl.appendChild(card);
          });
        }
        selectedGamesEl.hidden = false;
        scheduleSelectedCardTextFit();
        selectedGamesEl.classList.remove('is-fresh');
        if (shouldAnimate) {
          void selectedGamesEl.offsetWidth;
          selectedGamesEl.classList.add('is-fresh');
        }
        if (shouldScroll) {
          selectedGamesEl.scrollIntoView({ behavior: metaReducedMotion ? 'auto' : 'smooth', block: 'start' });
          selectedGamesEl.focus({ preventScroll: true });
        }
      }

      function setMode(mode) {
        activeMode = mode === MODE_FAN ? MODE_FAN : MODE_CITY;
        clearSelectedEntry();
        renderDirectory();
      }

      function renderError(message) {
        updateHeroButtons();
        if (heroMetaListEl) {
          heroMetaListEl.innerHTML = '';
          const err = document.createElement('div');
          err.style.cssText = 'padding:14px;color:var(--muted);font-size:0.8rem;text-align:center;';
          err.textContent = message;
          heroMetaListEl.appendChild(err);
        }
      }

      // ---------------------------------------------------------------------------
      // Geolocation default selection
      // ---------------------------------------------------------------------------
      // On page load, ask the browser for the visitor's coordinates and
      // auto-select the team whose fanbase city is geographically
      // closest. If geolocation is denied / unavailable / errors out, OR
      // if no fanbase city has known coordinates, fall back to the City
      // tab with "New Orleans" pre-selected so the page always shows
      // something meaningful below the hero.
      // Never overrides a selection the user made via URL (?fan=, ?city=)
      // or by clicking a row before geolocation resolved.
      const FALLBACK_CITY_NAME = 'New Orleans';

      function haversineKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const toRad = (deg) => deg * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
                * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }

      // Earliest upcoming game timestamp for a fan entry (Infinity if none).
      // Used to tie-break the nearest-team pick when multiple teams share a
      // fanbase city (e.g. Saints + Pelicans both in New Orleans → both at
      // identical distance from a New Orleans visitor).
      function soonestUpcomingGameTs(entry) {
        const games = gamesForEntry(entry);
        const cutoff = Date.now() - 86400000;
        let soonest = Infinity;
        for (const game of games) {
          const dateStr = String((game && game.game_date) || '').trim();
          const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (!match) continue;
          const ts = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          if (ts < cutoff) continue;
          if (ts < soonest) soonest = ts;
        }
        return soonest;
      }

      function findNearestFanEntry(userLat, userLng) {
        const coords = window.TGB_TEAM_CITY_COORDS || {};
        const entries = buildFanEntries();
        let best = null;
        let bestDist = Infinity;
        let bestSoonest = Infinity;
        for (const entry of entries) {
          const fanbase = (entry.helmet && entry.helmet.fanbase) || entry.label || '';
          const cityCoords = coords[teamKey(fanbase)];
          if (!cityCoords) continue;
          const dist = haversineKm(userLat, userLng, cityCoords[0], cityCoords[1]);
          if (dist < bestDist) {
            bestDist = dist;
            bestSoonest = soonestUpcomingGameTs(entry);
            best = entry;
          } else if (dist === bestDist) {
            const soonest = soonestUpcomingGameTs(entry);
            if (soonest < bestSoonest) {
              bestSoonest = soonest;
              best = entry;
            }
          }
        }
        return best;
      }

      function selectFallbackCity() {
        if (selectedEntryKey) return;
        if (activeMode !== MODE_CITY) {
          setMode(MODE_CITY);
        }
        let target = null;
        for (const entry of heroMetaEntries.values()) {
          if (entry.entryKind !== 'city') continue;
          if (cityDisplayName(entry.label).toLowerCase() === FALLBACK_CITY_NAME.toLowerCase()) {
            target = entry;
            break;
          }
        }
        if (target) toggleSelectedEntry(target);
      }

      function tryGeolocateAndSelectNearestFan() {
        if (selectedEntryKey) return;
        if (activeMode !== MODE_FAN) return;
        if (!navigator.geolocation) {
          selectFallbackCity();
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            // Re-check guards: user may have switched tabs or clicked a
            // row between the prompt and the resolve.
            if (selectedEntryKey) return;
            if (activeMode !== MODE_FAN) {
              selectFallbackCity();
              return;
            }
            const nearest = findNearestFanEntry(
              position.coords.latitude,
              position.coords.longitude
            );
            if (nearest) {
              toggleSelectedEntry(nearest);
            } else {
              selectFallbackCity();
            }
          },
          () => {
            if (selectedEntryKey) return;
            selectFallbackCity();
          },
          { timeout: 8000, maximumAge: 600000 }
        );
      }

      // ---------------------------------------------------------------------------
      // Data load
      // ---------------------------------------------------------------------------
      async function load() {
        try {
          const [games, teamColorsResult] = await Promise.all([fetchGames(), fetchTeamColors()]);
          colorsByCityMascot = teamColorsResult.lookup;
          allTeams = teamColorsResult.teams;
          liveGames = (Array.isArray(games) ? games : []).filter((game) => !isTrueish(game && game.archived));
          // Pick the right mode tab BEFORE the first directory render so the
          // URL's entry exists in heroMetaEntries when we go to apply it.
          const initParams = new URLSearchParams(window.location.search);
          const hasExplicitDirectoryMode = initParams.has('city')
            || initParams.has('fan')
            || initParams.get('mode') === MODE_CITY
            || initParams.get('mode') === MODE_FAN;
          if (initParams.get('city')) activeMode = MODE_CITY;
          else if (initParams.get('fan')) activeMode = MODE_FAN;
          else if (initParams.get('mode') === 'city') activeMode = MODE_CITY;
          else if (initParams.get('mode') === 'fan') activeMode = MODE_FAN;
          renderDirectory();
          suppressUrlWrite = true;
          try { applyUrlSelection(); } finally { suppressUrlWrite = false; }
          if (!hasExplicitDirectoryMode) tryGeolocateAndSelectNearestFan();
        } catch (error) {
          console.error(error);
          renderError(error instanceof Error ? error.message : String(error));
        }
      }

      // ---------------------------------------------------------------------------
      // Event wiring
      // ---------------------------------------------------------------------------
      // GAMES dropdown.
      // Dropdown open/close/escape lives in /assets/site-nav.js. Here we
      // only register the games-page-specific handler that intercepts
      // clicks on a same-page dropdown link and swaps mode in-place
      // (returning false tells site-nav.js to preventDefault + close).
      if (window.TgbNav && typeof window.TgbNav.onDropdownItemClick === 'function') {
        window.TgbNav.onDropdownItemClick(function (item) {
          var target = new URL(item.href, window.location.href);
          if (target.pathname !== window.location.pathname) return;
          var wantMode = item.dataset.mode === 'fan' ? MODE_FAN : MODE_CITY;
          setModeFromControl(wantMode);
          return false;
        });
      }

      document.querySelectorAll('.hero-mode-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          setModeFromControl(btn.dataset.mode === 'fan' ? MODE_FAN : MODE_CITY);
        });
        btn.addEventListener('keydown', (event) => {
          const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
          if (!keys.includes(event.key)) return;
          event.preventDefault();
          let nextMode = activeMode;
          if (event.key === 'Home') nextMode = MODE_FAN;
          if (event.key === 'End') nextMode = MODE_CITY;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            nextMode = activeMode === MODE_FAN ? MODE_CITY : MODE_FAN;
          }
          setModeFromControl(nextMode);
          const nextBtn = document.querySelector(`.hero-mode-tab[data-mode="${nextMode}"]`);
          if (nextBtn) nextBtn.focus();
        });
      });

      // Hero mode slider: click tabs, drag with mouse, or swipe with touch.
      (function () {
        const switchEl = document.getElementById('heroModeSwitch');
        const trackEl = document.querySelector('.hero-mode-track');
        const markerEl = trackEl ? trackEl.querySelector('.hero-mode-marker') : null;
        if (!switchEl || !trackEl || !markerEl) return;
        const DRAG_THRESHOLD = 6;
        let startX = 0;
        let startY = 0;
        let startProgress = 0;
        let currentProgress = 0;
        let pointerId = null;
        let tracking = false;
        let dragging = false;
        let suppressNextClick = false;

        const clamp = (value) => Math.min(1, Math.max(0, value));
        const modeProgress = () => activeMode === MODE_CITY ? 1 : 0;
        const setMarkerProgress = (value) => {
          currentProgress = clamp(value);
          markerEl.style.transform = 'translateX(' + (currentProgress * 100) + '%)';
        };
        const resetDragState = () => {
          switchEl.classList.remove('is-sliding');
          markerEl.style.transform = '';
        };

        const beginGesture = (clientX, clientY, id) => {
          pointerId = id;
          startX = clientX;
          startY = clientY;
          startProgress = modeProgress();
          currentProgress = startProgress;
          tracking = true;
          dragging = false;
        };

        const moveGesture = (clientX, clientY, id, event) => {
          if (!tracking || id !== pointerId) return;
          const dx = clientX - startX;
          const dy = clientY - startY;
          if (!dragging) {
            if (Math.abs(dy) > DRAG_THRESHOLD && Math.abs(dy) > Math.abs(dx)) {
              tracking = false;
              pointerId = null;
              return;
            }
            if (Math.abs(dx) < DRAG_THRESHOLD) return;
            dragging = true;
            switchEl.classList.add('is-sliding');
            if (typeof id === 'number') {
              try { trackEl.setPointerCapture(id); } catch (e) {}
            }
          }
          const travel = Math.max(1, trackEl.getBoundingClientRect().width / 2);
          setMarkerProgress(startProgress + (dx / travel));
          if (event) event.preventDefault();
        };

        const endGesture = (id) => {
          if (!tracking || id !== pointerId) return;
          const shouldCommitDrag = dragging;
          tracking = false;
          pointerId = null;
          if (shouldCommitDrag) {
            suppressNextClick = true;
            setModeFromControl(currentProgress >= 0.5 ? MODE_CITY : MODE_FAN);
          }
          resetDragState();
        };

        trackEl.addEventListener('click', (event) => {
          if (!suppressNextClick) return;
          suppressNextClick = false;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        if (typeof window.PointerEvent !== 'undefined') {
          trackEl.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            beginGesture(event.clientX, event.clientY, event.pointerId);
          });
          trackEl.addEventListener('pointermove', (event) => {
            moveGesture(event.clientX, event.clientY, event.pointerId, event);
          }, { passive: false });
          trackEl.addEventListener('pointerup', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('pointercancel', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('lostpointercapture', (event) => endGesture(event.pointerId));
        }

        trackEl.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          beginGesture(touch.clientX, touch.clientY, 'touch');
        }, { passive: true });
        trackEl.addEventListener('touchmove', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          moveGesture(touch.clientX, touch.clientY, 'touch', event);
        }, { passive: false });
        trackEl.addEventListener('touchend', () => endGesture('touch'));
        trackEl.addEventListener('touchcancel', () => endGesture('touch'));
      }());

      if (heroMetaListEl) {
        heroMetaListEl.addEventListener('click', (e) => {
          const item = e.target.closest('.hero-meta-list-item');
          if (!item) return;
          e.preventDefault();
          const entry = heroMetaEntries.get(item.dataset.entryKind + '|' + item.dataset.entryKey);
          if (entry) toggleSelectedEntry(entry);
        });
      }

      window.addEventListener('resize', scheduleSelectedCardTextFit);

      // Back/forward: re-apply the URL's mode + selection without pushing.
      window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const modeParam = params.get('mode');
        const wantMode = params.get('city') ? MODE_CITY
                       : params.get('fan')  ? MODE_FAN
                       : modeParam === MODE_CITY ? MODE_CITY
                       : modeParam === MODE_FAN ? MODE_FAN
                       : activeMode;
        suppressUrlWrite = true;
        try {
          if (wantMode !== activeMode) {
            activeMode = wantMode;
            renderDirectory();
          }
          applyUrlSelection();
        } finally {
          suppressUrlWrite = false;
        }
      });

      // ---------------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------------
      load();
    }());
  </script>
</body>
</html>
