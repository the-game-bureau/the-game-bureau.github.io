<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games | The Game Bureau</title>
<meta name="description" content="Live action games played in real streets, the day before the event that brought you to town. Pick your side and see where you are going.">

<meta property="og:type" content="website">
<meta property="og:title" content="The Game Bureau">
<meta property="og:description" content="Live action games played in real streets. Pick your side and see where you are going.">
<meta property="og:url" content="https://thegamebureau.com/games/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="/shell/site-shell.css">

<style>
/* ══════════════════════════════════════════════════════════════════════
   THE GAMES PAGE. A rail of games on the left, a map on the right.

   WHY DARK, when the rest of the public site is paper: the map is the
   brightest object on the page and every game carries its own away-club
   colour. A pale chrome would compete with the first and wash out the
   second. `body.home-page` in site-shell.css already owns this palette,
   so this is the house dark skin rather than a new one.

   WHY A SPLIT AT ALL: the product is "somewhere specific, the day before
   the thing that brought you there", and a grid of cards says none of
   that. The map is not decoration, it is the argument.
   ══════════════════════════════════════════════════════════════════════ */

:root { color-scheme: dark; }

* { box-sizing: border-box; }

/* THE PAGE IS A COLUMN: shared nav, the split, shared footer. The split
   takes the slack, so it fills whatever is left of the screen without this
   page having to know how tall the nav happens to be. A footer below the fold
   is reachable by scrolling, which is what a footer is for. */
body.home-page {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}

/* ---- the frame ------------------------------------------------------- */
.gp {
  display: grid;
  grid-template-columns: minmax(360px, 34vw) 1fr;
  flex: 1 1 auto;
  /* A floor, or on a short window the map collapses to a sliver and the rail
     to two rows. Below this the phone layout takes over anyway. */
  min-height: 620px;
}
.gp-rail {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border-right: 1px solid var(--line-strong);
  background: var(--paper);
}
.gp-map {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--paper-strong);
}

/* ---- the shared nav, on a page where it is the first thing --------------
   site-shell.css gives it `width: calc(100% - 48px); margin: 0 auto;
   padding: 0 0 16px` -- no TOP padding, because on every other public page
   something sits above it. Here it is the first thing on the page, so the
   wordmark sat hard against the top edge.

   Full bleed with its own 24px inset rather than an auto-centred 48px-narrower
   box, so the nav's left edge and the rail's left edge are ONE margin. Two
   margins four pixels apart is the kind of thing you cannot name and can see. */
body.home-page .site-nav.site-nav {
  width: 100%;
  margin: 0;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
}
@media (max-width: 860px) {
  body.home-page .site-nav.site-nav { padding: 16px 18px 14px; }
}

/* ---- masthead -------------------------------------------------------- */
.gp-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); }
/* THE WORDMARK IS THE NAV'S JOB NOW, so the rail leads with the instruction
   instead of saying the company name a second time six pixels below it. */
.gp-kicker {
  margin: 0;
  font: 800 1.5rem/0.95 'Big Shoulders Display', system-ui, sans-serif;
  letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink);
}
.gp-pitch {
  margin: 9px 0 0;
  font: 400 0.86rem/1.55 'IBM Plex Mono', monospace;
  color: var(--muted); max-width: 46ch;
}
.gp-pitch b { color: var(--ink); font-weight: 600; }

/* ---- the finder ------------------------------------------------------ */
.gp-find { padding: 18px 24px; border-bottom: 1px solid var(--line); }
.gp-find label {
  display: block; margin-bottom: 7px;
  font: 600 0.56rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.17em; text-transform: uppercase; color: var(--muted);
}
.gp-find input {
  width: 100%; padding: 10px 12px;
  font: 400 0.9rem/1.3 'IBM Plex Mono', monospace;
  color: var(--ink); background: var(--paper-strong);
  border: 1px solid var(--line-strong); border-radius: 7px;
}
.gp-find input::placeholder { color: var(--muted); }
.gp-find input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gp-tally {
  margin-top: 9px;
  font: 400 0.66rem/1.4 'IBM Plex Mono', monospace; color: var(--muted);
}
.gp-tally b { color: var(--accent); font-weight: 600; }

/* ---- the list -------------------------------------------------------- */
.gp-list { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px 20px; min-height: 0; }

/* ONE GAME. The left edge is the away club's own colour, which is the
   palette a fandom game is built from: the fan's side, not the host's.
   It is an inset shadow rather than a border so the corner stays round. */
.gm {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 12px 14px 12px 16px; margin-bottom: 6px;
  border: 1px solid var(--line); border-radius: 9px;
  background: var(--paper-strong); color: inherit;
  font: inherit;
  box-shadow: inset 4px 0 0 0 var(--gm-color, var(--accent));
}
.gm:hover { border-color: var(--line-strong); }
.gm:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gm.is-open {
  border-color: var(--gm-color, var(--accent));
  background: color-mix(in srgb, var(--gm-color, var(--accent)) 11%, var(--paper-strong));
}
.gm-fixture {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  font: 700 1.14rem/1.1 'Big Shoulders Display', system-ui, sans-serif;
  letter-spacing: 0.01em; text-transform: uppercase;
}
/* "AT" IS DIRECTIONAL AND SAYS WHO IS TRAVELLING, which is the whole
   premise: the away fans are the ones in town with an afternoon free. */
.gm-at {
  font: 500 0.6rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase;
}
.gm-where {
  margin-top: 5px;
  font: 400 0.68rem/1.4 'IBM Plex Mono', monospace; color: var(--muted);
  display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline;
}
.gm-when { color: var(--accent); }
.gm-tag {
  margin: 8px 0 0;
  font: 400 0.8rem/1.5 'IBM Plex Mono', monospace; color: var(--ink);
  opacity: 0.86;
}

/* ---- the opened game ------------------------------------------------- */
.gm-more { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); }
.gm-body {
  margin: 0 0 11px;
  font: 400 0.8rem/1.6 'IBM Plex Mono', monospace; color: var(--muted);
}
.gm-buy { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gm-price {
  font: 700 1.18rem/1 'Big Shoulders Display', system-ui, sans-serif;
  letter-spacing: 0.02em;
}
.gm-go {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: 7px; text-decoration: none;
  font: 600 0.66rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--gm-color, var(--accent));
  color: var(--gm-ink, #fff);
  border: 1px solid transparent;
}
.gm-go:hover { filter: brightness(1.12); }
.gm-go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.gm-note {
  margin: 9px 0 0;
  font: 400 0.66rem/1.45 'IBM Plex Mono', monospace; color: var(--muted);
}

/* ---- the shop, inside the game it belongs to ---------------------------
   THE OLD PAGE HAD A SCROLLING "FROM THE GIFT SHOP" STRIP ALONG THE BOTTOM and
   the rebuild dropped it, which took the shop's shopfront off the busiest page
   on the site. This is that route back, and it is a better one: a strip of
   featured sports gifts was the same four objects on every visit and said
   nothing about the game you were looking at. These are gifts for the city you
   are about to walk. */
.gm-shop { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
.gm-shop-label {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin: 0 0 8px;
  font: 600 0.56rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
}
.gm-shop-all { color: var(--accent); text-decoration: none; letter-spacing: 0.1em; }
.gm-shop-all:hover { text-decoration: underline; }
.gm-shop-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.gm-gift {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: 7px; overflow: hidden;
  background: var(--paper);
}
.gm-gift:hover { border-color: var(--gm-color, var(--accent)); }
.gm-gift-pic {
  display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
  background: var(--paper); border: 0;
}
/* A GIFT WITH NO USABLE PICTURE KEEPS ITS TILE rather than tearing a hole in
   the row: an initial on a flat ground reads as a thing, an empty box reads as
   a page that half loaded. */
.gm-gift-mono {
  display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1;
  font: 700 1.3rem/1 'Big Shoulders Display', system-ui, sans-serif;
  color: var(--muted); background: var(--paper);
}
.gm-gift-name {
  display: block; padding: 5px 6px 6px;
  font: 400 0.6rem/1.3 'IBM Plex Mono', monospace; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.gp-empty {
  padding: 34px 22px; text-align: center; color: var(--muted);
  font: 400 0.86rem/1.65 'IBM Plex Mono', monospace;
}
.gp-empty b {
  display: block; margin-bottom: 8px; color: var(--ink);
  font: 700 1.1rem/1.2 'Big Shoulders Display', system-ui, sans-serif;
  letter-spacing: 0.02em; text-transform: uppercase;
}

/* ---- the map --------------------------------------------------------- */
#map { position: absolute; inset: 0; background: var(--paper-strong); }
/* THE TILES ARE DIMMED AND DESATURATED, not left as they ship. OSM's own
   raster is a bright paper map: against this chrome it reads as a hole cut
   in the page, and every team colour on top of it loses. Pulled down, it
   becomes the ground the colour sits on. */
.leaflet-tile-pane { filter: grayscale(0.72) brightness(0.62) contrast(1.06); }
.leaflet-container { background: var(--paper-strong); font-family: 'IBM Plex Mono', monospace; }
.leaflet-control-attribution {
  background: rgba(10, 14, 21, 0.82) !important;
  color: var(--muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--accent) !important; }

/* A CITY IS A DOT WITH A NAME, drawn by us rather than by a pin image:
   it takes currentColor, so the away club's colour reaches it with no
   second rule and no second asset to load. */
.pin { display: grid; place-items: center; }
.pin i {
  display: block; width: 13px; height: 13px; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 0 3px rgba(10, 14, 21, 0.75), 0 0 14px currentColor;
}
.pin-label {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 17px; white-space: nowrap;
  font: 600 0.6rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 4px;
  background: rgba(10, 14, 21, 0.86); color: var(--ink);
}
.pin--away i { width: 10px; height: 10px; opacity: 0.9; }

.gp-mapnote {
  position: absolute; left: 14px; bottom: 14px; z-index: 500;
  max-width: 300px; padding: 11px 14px; border-radius: 9px;
  background: rgba(10, 14, 21, 0.9); border: 1px solid var(--line-strong);
  font: 400 0.72rem/1.5 'IBM Plex Mono', monospace; color: var(--muted);
}
.gp-mapnote b {
  display: block; color: var(--ink); margin-bottom: 4px;
  font: 600 0.62rem/1 'IBM Plex Mono', monospace;
  letter-spacing: 0.13em; text-transform: uppercase;
}
.gp-mapnote[hidden] { display: none; }

/* ---- phones ----------------------------------------------------------
   THE MAP GOES ON TOP AND KEEPS A FIXED HEIGHT. Side by side it would be
   two columns of nothing; underneath the list it would never be seen. */
@media (max-width: 860px) {
  .gp {
    grid-template-columns: 1fr;
    grid-template-rows: 38vh auto;
    min-height: 0;
  }
  .gp-map { order: -1; min-height: 38vh; border-bottom: 1px solid var(--line-strong); }
  .gp-rail { border-right: 0; }
  .gp-list { overflow: visible; }
  .gp-mapnote { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .leaflet-container * { transition: none !important; }
}
</style>
</head>

<body class="home-page" data-admin-page="mission-control">

<!-- THE SHARED PUBLIC NAV. Hand-rolling these four links in the rail would be
     the copy-and-drift this repo has lost to more than once: site-nav.js also
     carries the sign-in padlock, the follow reel and the live stat badges the
     footer feeds it. -->
<header class="site-nav" data-site-nav></header>

<div class="gp">
  <aside class="gp-rail">
    <header class="gp-head">
      <p class="gp-kicker">Pick your side</p>
      <p class="gp-pitch">
        In town for a game, a concert, or nothing in particular? <b>The day
        before</b>, we send you walking: real streets, real places, and
        something to work out at each one. Pick your side and see where you
        are going.
      </p>
    </header>

    <div class="gp-find">
      <label for="q">Find your game</label>
      <input type="search" id="q" placeholder="A club, a city, a nickname" autocomplete="off">
      <p class="gp-tally" id="tally"></p>
    </div>

    <div class="gp-list" id="list"></div>
  </aside>

  <div class="gp-map">
    <div id="map"></div>
    <div class="gp-mapnote" id="mapnote" hidden></div>
  </div>
</div>

<!-- BOTH OF THESE ARE ON THE OTHER EIGHT PUBLIC PAGES and were on this one
     before the rebuild, so they stay: a redesign should not quietly change what
     a page does. public-account.js is the sign-in state and the account
     lightbox. supabase-fallback.js serves a committed snapshot out of
     /mc/backups/ when a live read fails, and it is worth knowing that this is
     the shape CLAUDE.md warns about under soundtracks: a fallback that renders
     a stale catalogue perfectly makes an outage invisible, and on a page with
     prices on it a stale row is worse than an honest failure. Left in place
     because removing it is a product decision, not a tidy-up. -->
<footer class="site-footer" data-site-footer></footer>

<script src="/mc/assets/supabase-fallback.js"></script>
<script src="/mc/assets/public-account.js"></script>
<script src="/shell/site-nav.js"></script>
<script src="/mc/assets/site-analytics.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://qmaafbncpzrdmqapkkgr.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3';

  var el = function (id) { return document.getElementById(id); };
  var clean = function (v) { return v === null || v === undefined ? '' : String(v).trim(); };

  var state = { games: [], points: {}, q: '', openId: '', loaded: false, gifts: {} };
  var map = null, layer = null, arc = null;

  /* ---- geography -----------------------------------------------------
     THERE IS NO COORDINATE ON A CITY ANYWHERE IN THIS DATABASE, so a city
     point is derived from the AVERAGE of the waypoints we hold in it. That
     is a real centre of the places we actually send people to, which is a
     better middle for this map than a civic centroid would be.

     36 of the 37 club cities resolve that way. The ones below are the
     fallback for anywhere the library has not reached yet: without them a
     game silently refuses to fly, which looks like a broken control. */
  var FALLBACK = {
    'baton rouge': [30.4515, -91.1871],
    'green bay':   [44.5133, -88.0133],
    'foxborough':  [42.0654, -71.2478],
    'orchard park':[42.7738, -78.7870],
    'east rutherford':[40.8135, -74.0745],
    'santa clara': [37.4030, -121.9700],
    'inglewood':   [33.9535, -118.3392],
    'arlington':   [32.7473, -97.0945],
    'glendale':    [33.5276, -112.2626],
    'paradise':    [36.0909, -115.1833]
  };

  function cityKey(v) {
    // The stored form is "Charlotte, North Carolina"; the waypoint library
    // holds the bare city. Split on the comma and match the head.
    return clean(v).split(',')[0].trim().toLowerCase();
  }
  function pointFor(city) {
    var k = cityKey(city);
    if (state.points[k]) return state.points[k];
    if (FALLBACK[k]) return FALLBACK[k];
    return null;
  }

  /* ---- reading -------------------------------------------------------- */

  function rest(table, params) {
    var u = new URL(SUPABASE_URL + '/rest/v1/' + table);
    Object.keys(params || {}).forEach(function (k) { u.searchParams.set(k, params[k]); });
    return u.toString();
  }
  function headers() {
    return { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
  }

  // PostgREST caps a response at 1000 rows and truncates SILENTLY, so every
  // read that expects a whole table pages.
  function pageAll(table, params) {
    var out = [];
    function next(from) {
      var h = headers();
      h.Range = from + '-' + (from + 999);
      return fetch(rest(table, params), { headers: h }).then(function (r) {
        if (!r.ok) throw new Error(table);
        return r.json();
      }).then(function (rows) {
        out = out.concat(rows);
        if (rows.length < 1000) return out;
        return next(from + 1000);
      });
    }
    return next(0);
  }

  function load() {
    // select=* and never a column list: an unknown column 400s the whole
    // read, while a missing one read as blank is survivable.
    var games = pageAll('games', { select: '*', order: 'game_date.asc' });
    var wps = pageAll('waypoints', { select: 'city,lat,lon' }).catch(function () { return []; });
    return Promise.all([games, wps]).then(function (both) {
      state.games = both[0].filter(isLive);
      var sums = {};
      both[1].forEach(function (w) {
        if (w.lat === null || w.lon === null || w.lat === undefined) return;
        var k = cityKey(w.city);
        if (!k) return;
        if (!sums[k]) sums[k] = [0, 0, 0];
        sums[k][0] += Number(w.lat);
        sums[k][1] += Number(w.lon);
        sums[k][2] += 1;
      });
      Object.keys(sums).forEach(function (k) {
        state.points[k] = [sums[k][0] / sums[k][2], sums[k][1] / sums[k][2]];
      });
      state.loaded = true;
    });
  }

  // `archived` is TEXT on this table and 'YES' is the only true value; null
  // and '' are false. Never compare it as a boolean.
  function isLive(g) {
    return clean(g && g.archived).toUpperCase() !== 'YES'
        && clean(g && g.erased).toUpperCase() !== 'YES';
  }

  /* ---- the shop -------------------------------------------------------
     THE CONTRACT IS THE PUBLIC SHOP'S OWN: gift_shop_listings joined to
     gift_shop_items, filtered on the LISTING's archived flag, then judged by
     the ITEM's own archived / certified_at. `live` on the listing is
     deliberately not read: the shop does not read it either, and filtering on
     it once cut the pickable catalogue from 611 gifts to 79.

     Cached per city and fetched only when a game is opened, so a visitor who
     never opens one pays nothing for this. */
  function giftsFor(city, done) {
    var key = clean(city).toLowerCase();
    if (!key) { done([]); return; }
    if (state.gifts[key]) { done(state.gifts[key]); return; }
    var url = rest('gift_shop_listings', {
      select: '*,gift_shop_items(*)',
      archived: 'eq.false',
      city: 'eq.' + city,
      limit: '24'
    });
    fetch(url, { headers: headers() }).then(function (r) {
      return r.ok ? r.json() : [];
    }).then(function (rows) {
      var items = (Array.isArray(rows) ? rows : [])
        .map(function (row) { return row && row.gift_shop_items; })
        .filter(function (it) {
          return it && it.certified_at && !it.rejected_at
              && clean(it.archived).toLowerCase() !== 'true'
              && it.archived !== true;
        });
      state.gifts[key] = items;
      done(items);
    }).catch(function () {
      // A shop that will not answer is not a reason to break the game card.
      state.gifts[key] = [];
      done([]);
    });
  }

  function giftRow(city, color) {
    var box = document.createElement('div');
    box.className = 'gm-shop';
    var label = document.createElement('p');
    label.className = 'gm-shop-label';
    label.appendChild(text('span', 'From the ' + city.split(',')[0].trim() + ' shop'));
    var all = document.createElement('a');
    all.className = 'gm-shop-all';
    // The shop's own URL contract: ?city= narrows it.
    all.href = '/gifts/?city=' + encodeURIComponent(city);
    all.textContent = 'See all';
    all.addEventListener('click', function (e) { e.stopPropagation(); });
    label.appendChild(all);
    box.appendChild(label);

    var row = document.createElement('div');
    row.className = 'gm-shop-row';
    box.appendChild(row);
    box.hidden = true;

    giftsFor(city, function (items) {
      if (!items.length) return;
      items.slice(0, 4).forEach(function (it) {
        var a = document.createElement('a');
        a.className = 'gm-gift';
        a.href = '/gifts/?item=' + encodeURIComponent(clean(it.id));
        a.title = clean(it.title);
        a.addEventListener('click', function (e) { e.stopPropagation(); });
        var pic = clean(it.image_url);
        if (pic) {
          var img = document.createElement('img');
          img.className = 'gm-gift-pic';
          img.src = pic;
          img.alt = '';
          img.loading = 'lazy';
          img.addEventListener('error', function () {
            img.replaceWith(mono(it.title));
          });
          a.appendChild(img);
        } else {
          a.appendChild(mono(it.title));
        }
        a.appendChild(text('span', clean(it.title), 'gm-gift-name'));
        row.appendChild(a);
      });
      box.hidden = false;
    });
    return box;
  }
  function mono(title) {
    var d = document.createElement('span');
    d.className = 'gm-gift-mono';
    d.textContent = (clean(title).charAt(0) || '?').toUpperCase();
    return d;
  }

  /* ---- what a card says ----------------------------------------------- */

  function awayName(g) { return tidyPlace(g.away_team_city) || clean(g.away_team_mascot); }
  function homeName(g) {
    return tidyPlace(g.home_team_city) || hostCity(g) || clean(g.home_team_mascot);
  }
  // A STATE THAT REPEATS ITS CITY IS DROPPED. Several places genuinely share a
  // name with the division around them and the catalogue is right to hold both,
  // but "New York, New York" on a card is the row saying it twice. Same rule the
  // Tape Room already keeps for its tape headlines.
  function tidyPlace(v) {
    var parts = clean(v).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    if (parts.length === 2 && parts[0].toLowerCase() === parts[1].toLowerCase()) return parts[0];
    return parts.join(', ');
  }
  function hostCity(g) {
    return tidyPlace(clean(g.city) || clean(g.home_team_city) || clean(g.venue_city));
  }

  /* THE VISIBLE PAGE NAMES CITIES, NEVER CLUB NICKNAMES.
     The fixture line, the pins and the note are built from cities already. The
     TAGLINE AND THE BODY ARE NOT: they are authored prose and they name clubs
     outright ("Pittsburgh Steelers fans are in town a day early"). A nickname is
     somebody else's trademark, and this is the shop window.

     The substitution is precise rather than a blanket sweep, because the row
     already knows exactly which two nicknames could appear and which city each
     one belongs to. Two-word form first ("Pittsburgh Steelers" -> "Pittsburgh"),
     or replacing the bare nickname would leave the city doubled.

     THIS IS A SAFETY NET, NOT THE FIX, and it has one hole it cannot close: a
     tagline that names a club the ROW DOES NOT IDENTIFY. `smissno` says "Golden
     Eagles" with no away mascot on the row, and `jax2026phi` names a club whose
     mascot field is null. A global nickname map would resolve those to the
     WRONG city, which is worse than leaving them, so they are a content fix in
     the Taglines room rather than something to paper over here. */
  function cityOnly(str, g) {
    var out = clean(str);
    if (!out) return '';
    // THE BARE CITY, not the canonical "City, State". This is running prose,
    // and "Philadelphia, Pennsylvania fans crash the capital" is not a sentence
    // anybody wrote. The card's own fixture line keeps the full form.
    var bare = function (v) { return clean(v).split(',')[0].trim(); };
    var pairs = [
      [clean(g.away_team_mascot), bare(g.away_team_city)],
      [clean(g.home_team_mascot), bare(g.home_team_city) || bare(hostCity(g))]
    ];
    pairs.forEach(function (pair) {
      var nick = pair[0], city = pair[1];
      if (!nick || !city) return;
      // (?![a-z]) rather than a word boundary: it keeps "Saints" out of
      // "Saintsbury" without needing an escape this file has to survive.
      out = out.replace(new RegExp(city + ' ' + nick + '(?![a-z])', 'gi'), city);
      out = out.replace(new RegExp('the ' + nick + '(?![a-z])', 'g'), city);
      out = out.replace(new RegExp(nick + "(?![a-z])'s", 'gi'), city + "'s");
      out = out.replace(new RegExp(nick + "(?![a-z])'", 'gi'), city + "'s");
      out = out.replace(new RegExp(nick + '(?![a-z])', 'gi'), city);
    });
    return out;
  }

  // A FANDOM GAME TAKES ITS COLOUR FROM THE AWAY CLUB, which is the side the
  // game is pitched at. That rule lives in team-palette.js for the engines;
  // here the row already carries the resolved value.
  function colorOf(g) {
    var c = clean(g.primary_color);
    return /^#[0-9a-f]{6}$/i.test(c) ? c : '#f5b461';
  }
  // Perceived luminance, so a pale club colour does not get white text on it.
  function inkOn(hex) {
    var n = parseInt(hex.slice(1), 16);
    var l = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
    return l > 150 ? '#0a0e15' : '#ffffff';
  }

  function whenOf(g) {
    var d = clean(g.game_date);
    if (!d) return '';
    var parts = d.split('-');
    if (parts.length !== 3) return d;
    // Built in UTC: these are calendar dates, and a local Date crossing a
    // DST boundary lands on the day before.
    var dt = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
    return dt.toLocaleDateString('en-US',
      { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function matches(g) {
    if (!state.q) return true;
    var hay = [g.name, g.city, g.tagline, g.away_team_city, g.away_team_mascot,
               g.home_team_city, g.home_team_mascot, g.venue_city]
      .map(clean).join(' ').toLowerCase();
    return hay.indexOf(state.q) >= 0;
  }
  function visible() { return state.games.filter(matches); }

  /* ---- drawing --------------------------------------------------------- */

  function render() {
    var rows = visible();
    var list = el('list');
    list.textContent = '';

    el('tally').innerHTML = state.loaded
      ? ('<b>' + rows.length + '</b> ' + (rows.length === 1 ? 'game' : 'games')
         + (state.q ? ' matching' : ' to play'))
      : 'Loading the schedule.';

    if (!state.loaded) return;

    if (!rows.length) {
      list.appendChild(emptyNode());
      return;
    }
    rows.forEach(function (g) { list.appendChild(cardFor(g)); });
  }

  function emptyNode() {
    var box = document.createElement('div');
    box.className = 'gp-empty';
    var b = document.createElement('b');
    var p = document.createElement('p');
    if (state.q) {
      b.textContent = 'Nothing under that';
      p.textContent = 'No game matches "' + state.q + '". Try a club, a city or a nickname.';
    } else {
      // AN EMPTY SHOP WINDOW SAYS WHEN IT WILL NOT BE, rather than reading as
      // a page that failed to load. There is no game live today.
      b.textContent = 'No games on sale yet';
      p.textContent = 'We are building them city by city. The first ones go on '
        + 'sale alongside the fixtures they are played the day before.';
    }
    box.appendChild(b);
    box.appendChild(p);
    return box;
  }

  function cardFor(g) {
    var color = colorOf(g);
    var open = clean(g.id) === state.openId;

    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'gm' + (open ? ' is-open' : '');
    card.style.setProperty('--gm-color', color);
    card.style.setProperty('--gm-ink', inkOn(color));
    card.setAttribute('aria-expanded', open ? 'true' : 'false');
    card.dataset.gameId = clean(g.id);

    var fx = document.createElement('div');
    fx.className = 'gm-fixture';
    fx.appendChild(text('span', awayName(g)));
    fx.appendChild(text('span', 'at', 'gm-at'));
    fx.appendChild(text('span', homeName(g)));
    card.appendChild(fx);

    var where = document.createElement('div');
    where.className = 'gm-where';
    where.appendChild(text('span', hostCity(g)));
    var w = whenOf(g);
    if (w) where.appendChild(text('span', w, 'gm-when'));
    card.appendChild(where);

    var tag = cityOnly(g.tagline, g);
    if (tag) card.appendChild(text('p', tag, 'gm-tag'));

    if (open) card.appendChild(openBody(g, color));

    card.addEventListener('click', function () { choose(g); });
    return card;
  }

  function openBody(g, color) {
    var more = document.createElement('div');
    more.className = 'gm-more';

    var body = cityOnly(g.body, g);
    if (body) {
      more.appendChild(text('p', body.length > 260 ? body.slice(0, 258) + '..' : body, 'gm-body'));
    }

    var buy = document.createElement('div');
    buy.className = 'gm-buy';
    var price = clean(g.price)
      || (g.price_cents ? '$' + (Number(g.price_cents) / 100).toFixed(2) : '');
    if (price) buy.appendChild(text('span', price, 'gm-price'));

    // A REAL ANCHOR, so middle-click and ctrl-click work and it survives this
    // page's JavaScript failing.
    var go = document.createElement('a');
    go.className = 'gm-go';
    go.href = '/mc/game/run/?id=' + encodeURIComponent(clean(g.id));
    go.textContent = 'Play this game';
    go.addEventListener('click', function (e) { e.stopPropagation(); });
    buy.appendChild(go);
    more.appendChild(buy);

    var start = clean(g.starting_location_name);
    if (start) more.appendChild(text('p', 'You start at ' + start + '.', 'gm-note'));

    var city = hostCity(g);
    if (city) more.appendChild(giftRow(city, color));
    return more;
  }

  function text(tag, s, cls) {
    var n = document.createElement(tag);
    n.textContent = s;
    if (cls) n.className = cls;
    return n;
  }

  /* ---- the map --------------------------------------------------------
     LEAFLET IS INJECTED ON DEMAND, not loaded in the head: 144KB that has to
     arrive and parse before anything paints is most of what makes a page like
     this feel slow, and the rail is the half people read first. */
  var leafletReady = null;
  function ensureLeaflet() {
    if (leafletReady) return leafletReady;
    leafletReady = new Promise(function (resolve) {
      if (window.L) { resolve(window.L); return; }
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(css);
      var js = document.createElement('script');
      js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      // Resolve on error too: a map that will not load is not a broken page,
      // the games are the point and they are all still there.
      js.onload = function () { resolve(window.L || null); };
      js.onerror = function () { resolve(null); };
      document.head.appendChild(js);
    });
    return leafletReady;
  }

  function initMap() {
    return ensureLeaflet().then(function (L) {
      if (!L || map) return map;
      map = L.map('map', {
        zoomControl: true, attributionControl: true, scrollWheelZoom: true
      }).setView([39.5, -96.5], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
      showAll();
      return map;
    });
  }

  function dot(L, latlng, color, label, small) {
    var icon = L.divIcon({
      className: '',
      html: '<span class="pin' + (small ? ' pin--away' : '') + '" style="color:' + color + '">'
          + '<i></i>' + (label ? '<span class="pin-label">' + label + '</span>' : '')
          + '</span>',
      iconSize: [13, 13], iconAnchor: [7, 7]
    });
    return L.marker(latlng, { icon: icon, keyboard: false });
  }

  // THE RESTING STATE IS EVERY HOST CITY AT ONCE, so the page opens saying
  // "here is where we play" rather than showing an empty continent.
  function showAll() {
    if (!map || !window.L) return;
    var L = window.L;
    layer.clearLayers();
    if (arc) { map.removeLayer(arc); arc = null; }
    var seen = {}, pts = [];
    visible().forEach(function (g) {
      var city = hostCity(g);
      var k = cityKey(city);
      if (!k || seen[k]) return;
      var p = pointFor(city);
      if (!p) return;
      seen[k] = true;
      pts.push(p);
      dot(L, p, colorOf(g), '', false).addTo(layer);
    });
    el('mapnote').hidden = true;
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.18), { animate: false });
    else if (pts.length === 1) map.setView(pts[0], 9, { animate: false });
  }

  /* CHOOSING A GAME FLIES THE MAP FROM THE AWAY CITY INTO THE HOME CITY.
     That IS the product in one gesture: the fans travel, and the game is
     played in the host's streets the day before. The away pin is smaller and
     the arc runs toward the host, so the direction of travel is readable
     without reading anything. */
  function flyTo(g) {
    if (!map || !window.L) return;
    var L = window.L;
    var away = pointFor(g.away_team_city);
    var home = pointFor(hostCity(g)) || pointFor(g.home_team_city);
    if (!home) return;

    var color = colorOf(g);
    layer.clearLayers();
    if (arc) { map.removeLayer(arc); arc = null; }

    dot(L, home, color, homeName(g), false).addTo(layer);
    if (away) {
      dot(L, away, color, awayName(g), true).addTo(layer);
      arc = L.polyline([away, home], {
        color: color, weight: 2, opacity: 0.85, dashArray: '5 7'
      }).addTo(map);
      map.fitBounds(L.latLngBounds([away, home]).pad(0.35));
      // THE SECOND MOVE IS THE POINT. Fitting both cities says where they came
      // from; the zoom that follows says where the game actually happens.
      window.setTimeout(function () {
        if (clean(g.id) === state.openId) map.flyTo(home, 12, { duration: 1.6 });
      }, 1100);
    } else {
      map.flyTo(home, 12, { duration: 1.4 });
    }

    var note = el('mapnote');
    note.textContent = '';
    note.appendChild(text('b', 'Where you are going'));
    note.appendChild(text('span',
      awayName(g) + ' fans take over ' + hostCity(g) + '. You play the day before.'));
    note.hidden = false;
  }

  function choose(g) {
    var id = clean(g.id);
    // A SECOND PRESS CLOSES IT and puts the map back to every city, so the
    // card is its own way out rather than needing a control that only exists
    // while something is open.
    state.openId = state.openId === id ? '' : id;
    render();
    if (state.openId) {
      initMap().then(function () { flyTo(g); });
      var open = document.querySelector('.gm.is-open');
      if (open && open.scrollIntoView) open.scrollIntoView({ block: 'nearest' });
    } else {
      showAll();
    }
  }

  /* ---- wiring ---------------------------------------------------------- */

  el('q').addEventListener('input', function () {
    state.q = clean(el('q').value).toLowerCase();
    // A search that no longer holds the open game closes it, or the map would
    // be flown somewhere the list can no longer show you.
    if (state.openId && !visible().some(function (g) { return clean(g.id) === state.openId; })) {
      state.openId = '';
    }
    render();
    if (!state.openId) showAll();
  });

  render();
  load().then(function () {
    render();
    // THE MAP IS BUILT OUTSIDE THE LOAD'S CATCH, and that is not tidiness.
    // Chained, a Leaflet failure lands in the handler below and erases a list
    // that had already rendered perfectly: the games are the point and a map
    // that will not draw is not a reason to lose them. Caught by a test whose
    // stub was missing a method, which is exactly the shape of a CDN that is
    // having a bad afternoon.
    initMap().catch(function (err) {
      if (window.console) console.error('map', err);
    });
  }).catch(function (err) {
    state.loaded = true;
    el('tally').textContent = 'Could not load the schedule. Please try again shortly.';
    el('list').textContent = '';
    if (window.console) console.error(err);
  });
})();
</script>

<script src="/shell/site-footer.js" defer></script>
</body>
