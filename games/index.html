  <style>
    /* Games hero: keep it compact on desktop so the hero + nav fit the viewport
       without needing to scroll. Overrides the taller shared
       `body.home-page .hero` default (clamp 620–760px). Scoped to this page via
       the inline <style>, and to desktop via the media query, so how/shop/
       highlights heroes and this page's mobile sizing (min-height: 0) are
       untouched. */
    @media (min-width: 981px) {

    /* Admin-only EDIT GAMES button — sits to the LEFT of the floating LOG OUT
       control painted by admin-bridge.js (top-right, right:14px). Same visual
       treatment as LOG OUT / EDIT HIGHLIGHTS, gated on the same
       html.tgb-admin-authorized class so only a signed-in admin ever sees it.
       The right offset clears the ~90px LOG OUT button plus a small gap. */
    .tgb-games-edit {
      display: none;
      position: fixed;
      top: 14px;
      right: 114px;
      z-index: 2147483000;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid #111;
      background: #111;
      color: #fff !important;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none !important;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
      -webkit-tap-highlight-color: transparent;
    }
    .tgb-games-edit:hover,
    .tgb-games-edit:focus-visible {
      background: #fff;
      color: #111 !important;
      outline: none;
    }
    html.tgb-admin-authorized .tgb-games-edit { display: inline-flex; }

    /* ── Gift shop strip (above the footer) ────────────────────────────────
       A self-running marquee of gifts flagged sports AND featured. The track
       holds the item list TWICE (the copy is aria-hidden) and slides exactly
       -50%, so the seam lands where the second copy's first tile sits under
       the first copy's — the loop reads as continuous.

       No scrollbar anywhere: the viewport is overflow:hidden, so the strip
       can never give the page a horizontal scrollbar either.

       Colors: everything is expressed in the page's palette vars, never in
       literal colors, because the skin is a swappable layer — site-shell.css
       sets a dark body.home-page palette and civic-modernist-pages.css (loaded
       last) currently remaps the same vars to white/navy. Var-only means the
       panel and tiles follow .selected-games and .game-card through a skin
       change instead of stranding a dark slab on a light page. */
    /* min-width/max-width are load-bearing, not defensive: this section is a
       grid item of body.home-page main, so its automatic minimum size would
       otherwise resolve against the max-content width of the marquee track
       (~5800px) and stretch the whole page — hero text clipped, cards off the
       right edge, a document-level horizontal scrollbar. Same reason the
       viewport below pins min-width. */
    .gift-strip {
      min-width: 0;
      max-width: 100%;
      padding: 24px 28px;
      border: 1px solid var(--line-strong);
      background: var(--paper-strong);
      box-shadow: var(--shadow-panel, none);
    }
    .gift-strip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    /* Same display face/size as .selected-games-title so the two section
       headings on this page read as a pair. */
    .gift-strip-title {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font-family: inherit;   /* the skin owns the display face */
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.1;
      text-transform: uppercase;
    }
    /* The skin may repaint this as a solid button (civic-modernist does, with
       min-height 42 and a navy fill) but supplies no padding or display, so the
       label ends up jammed against the box edges. Own those here: inline-flex
       centres the text vertically inside whatever height the skin sets, and the
       side padding keeps it off the edges either way. */
    .gift-strip-all {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      padding: 0 16px;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .gift-strip-all:hover,
    .gift-strip-all:focus-visible { text-decoration: underline; outline: none; }

    .gift-strip-viewport {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;   /* the whole point: never a browser scrollbar */
      padding: 4px 0 10px;
    }
    .gift-strip-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: giftStripScroll var(--gift-strip-duration, 60s) linear infinite;
    }
    /* Pause while the visitor is reading or tabbing through the tiles. */
    .gift-strip-viewport:hover .gift-strip-track,
    .gift-strip-viewport:focus-within .gift-strip-track { animation-play-state: paused; }
    @keyframes giftStripScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-50% - 6px)); }  /* half the gap */
    }
    /* Reduced motion: no marquee. Hand the row back to manual scrolling so
       the tail is still reachable — a scrollbar inside the strip only, and
       only for visitors who asked motion to stop. */
    @media (prefers-reduced-motion: reduce) {
      .gift-strip-track { animation: none; }
      .gift-strip-viewport { overflow-x: auto; overscroll-behavior-x: contain; }
    }

    /* Tile treatment mirrors .game-card as the skin renders it: hairline
       border on --card-paper, accent border on hover. */
    .gift-strip-item {
      flex: 0 0 176px;
      display: grid;
      grid-template-rows: 148px auto;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line, rgba(255, 255, 255, 0.14));
      background: var(--card-paper, #161b25);
      color: var(--ink);
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .gift-strip-item:hover,
    .gift-strip-item:focus-visible {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 0 0 2px var(--accent);
      outline: none;
    }
    /* The image well stays white on purpose: retail photography is shot on
       white, so a tinted well would frame every product in a halo. */
    .gift-strip-media {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #ffffff;
    }
    .gift-strip-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    /* Fallback when a gift has no image_url (or it 404s): the monogram. */
    .gift-strip-monogram {
      font-family: "IBM Plex Mono", monospace;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: rgba(17, 17, 17, 0.28);   /* sits on the white well, not the card */
    }
    .gift-strip-name {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.28;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .gift-strip-item { flex-basis: 148px; grid-template-rows: 124px auto; }
    }
