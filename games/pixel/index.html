        else if (initParams.get('fan')) activeMode = MODE_FAN;
        else if (initParams.get('mode') === 'city') activeMode = MODE_CITY;
        else if (initParams.get('mode') === 'fan') activeMode = MODE_FAN;

        // ── 1. Paint immediately from cache if we have it ────────────
        const cachedGames = readCache(CACHE_KEY_GAMES);
        const cachedTeams = readCache(CACHE_KEY_TEAMS);
        let painted = false;
        if (cachedGames && cachedTeams) {
          try {
            applyDirectoryData(cachedGames, buildTeamIndex(cachedTeams));
            painted = true;
          } catch (_) { /* cache shape mismatch — let fresh fetch repaint */ }
        }

        // ── 2. Fetch fresh and repaint ───────────────────────────────
        try {
          const [games, teamColorsResult] = await Promise.all([fetchGames(), fetchTeamColors()]);
          writeCache(CACHE_KEY_GAMES, games);
          writeCache(CACHE_KEY_TEAMS, teamColorsResult.teams);
          applyDirectoryData(games, teamColorsResult);
        } catch (error) {
          console.error(error);
          if (!painted) renderError(error instanceof Error ? error.message : String(error));
        }
      }

      // ---------------------------------------------------------------------------
      // Event wiring
      // ---------------------------------------------------------------------------
      // GAMES dropdown.
      // Dropdown open/close/escape lives in /assets/site-nav.js. Here we
      // only register the games-page-specific handler that intercepts
      // clicks on a same-page dropdown link and swaps mode in-place
      // (returning false tells site-nav.js to preventDefault + close).
      if (window.TgbNav && typeof window.TgbNav.onDropdownItemClick === 'function') {
        window.TgbNav.onDropdownItemClick(function (item) {
          var target = new URL(item.href, window.location.href);
          var targetPath = target.pathname.replace(/\/+$/, '/');
          var currentPath = window.location.pathname.replace(/\/+$/, '/');
          var isPixelGamesPath = document.body.classList.contains('pixel-art-page') && targetPath === '/games/';
          if (targetPath !== currentPath && !isPixelGamesPath) return;
          var wantMode = item.dataset.mode === 'fan' ? MODE_FAN : MODE_CITY;
          setModeFromControl(wantMode);
          return false;
        });
      }

      document.querySelectorAll('.hero-mode-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          setModeFromControl(btn.dataset.mode === 'fan' ? MODE_FAN : MODE_CITY);
        });
        btn.addEventListener('keydown', (event) => {
          const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
          if (!keys.includes(event.key)) return;
          event.preventDefault();
          let nextMode = activeMode;
          if (event.key === 'Home') nextMode = MODE_FAN;
          if (event.key === 'End') nextMode = MODE_CITY;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            nextMode = activeMode === MODE_FAN ? MODE_CITY : MODE_FAN;
          }
          setModeFromControl(nextMode);
          const nextBtn = document.querySelector(`.hero-mode-tab[data-mode="${nextMode}"]`);
          if (nextBtn) nextBtn.focus();
        });
      });

      // Hero mode slider: click tabs, drag with mouse, or swipe with touch.
      (function () {
        const switchEl = document.getElementById('heroModeSwitch');
        const trackEl = document.querySelector('.hero-mode-track');
        const markerEl = trackEl ? trackEl.querySelector('.hero-mode-marker') : null;
        if (!switchEl || !trackEl || !markerEl) return;
        const DRAG_THRESHOLD = 6;
        let startX = 0;
        let startY = 0;
        let startProgress = 0;
        let currentProgress = 0;
        let pointerId = null;
        let tracking = false;
        let dragging = false;
        let suppressNextClick = false;

        const clamp = (value) => Math.min(1, Math.max(0, value));
        const modeProgress = () => activeMode === MODE_CITY ? 1 : 0;
        const setMarkerProgress = (value) => {
          currentProgress = clamp(value);
          markerEl.style.transform = 'translateX(' + (currentProgress * 100) + '%)';
        };
        const resetDragState = () => {
          switchEl.classList.remove('is-sliding');
          markerEl.style.transform = '';
        };

        const beginGesture = (clientX, clientY, id) => {
          pointerId = id;
          startX = clientX;
          startY = clientY;
          startProgress = modeProgress();
          currentProgress = startProgress;
          tracking = true;
          dragging = false;
        };

        const moveGesture = (clientX, clientY, id, event) => {
          if (!tracking || id !== pointerId) return;
          const dx = clientX - startX;
          const dy = clientY - startY;
          if (!dragging) {
            if (Math.abs(dy) > DRAG_THRESHOLD && Math.abs(dy) > Math.abs(dx)) {
              tracking = false;
              pointerId = null;
              return;
            }
            if (Math.abs(dx) < DRAG_THRESHOLD) return;
            dragging = true;
            switchEl.classList.add('is-sliding');
            if (typeof id === 'number') {
              try { trackEl.setPointerCapture(id); } catch (e) {}
            }
          }
          const travel = Math.max(1, trackEl.getBoundingClientRect().width / 2);
          setMarkerProgress(startProgress + (dx / travel));
          if (event) event.preventDefault();
        };

        const endGesture = (id) => {
          if (!tracking || id !== pointerId) return;
          const shouldCommitDrag = dragging;
          tracking = false;
          pointerId = null;
          if (shouldCommitDrag) {
            suppressNextClick = true;
            setModeFromControl(currentProgress >= 0.5 ? MODE_CITY : MODE_FAN);
          }
          resetDragState();
        };

        trackEl.addEventListener('click', (event) => {
          if (!suppressNextClick) return;
          suppressNextClick = false;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        if (typeof window.PointerEvent !== 'undefined') {
          trackEl.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            beginGesture(event.clientX, event.clientY, event.pointerId);
          });
          trackEl.addEventListener('pointermove', (event) => {
            moveGesture(event.clientX, event.clientY, event.pointerId, event);
          }, { passive: false });
          trackEl.addEventListener('pointerup', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('pointercancel', (event) => endGesture(event.pointerId));
          trackEl.addEventListener('lostpointercapture', (event) => endGesture(event.pointerId));
        }

        trackEl.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          beginGesture(touch.clientX, touch.clientY, 'touch');
        }, { passive: true });
        trackEl.addEventListener('touchmove', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          moveGesture(touch.clientX, touch.clientY, 'touch', event);
        }, { passive: false });
        trackEl.addEventListener('touchend', () => endGesture('touch'));
        trackEl.addEventListener('touchcancel', () => endGesture('touch'));
      }());

      if (heroMetaListEl) {
        heroMetaListEl.addEventListener('click', (e) => {
          const item = e.target.closest('.hero-meta-list-item');
          if (!item) return;
          e.preventDefault();
          const entry = heroMetaEntries.get(item.dataset.entryKind + '|' + item.dataset.entryKey);
          if (entry) toggleSelectedEntry(entry);
        });
      }

      window.addEventListener('resize', scheduleSelectedCardTextFit);

      // Back/forward: re-apply the URL's mode + selection without pushing.
      window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const modeParam = params.get('mode');
        const wantMode = params.get('city') ? MODE_CITY
                       : params.get('fan')  ? MODE_FAN
                       : modeParam === MODE_CITY ? MODE_CITY
                       : modeParam === MODE_FAN ? MODE_FAN
                       : activeMode;
        suppressUrlWrite = true;
        try {
          if (wantMode !== activeMode) {
            activeMode = wantMode;
            renderDirectory();
          }
          applyUrlSelection();
        } finally {
          suppressUrlWrite = false;
        }
      });

      // Admin-only "show all games" toggle. Hidden for the public; revealed when
      // /assets/admin-bridge.js verifies an admin. Flips adminShowAll and re-filters
      // the already-fetched rows — no refetch, no public exposure of the data.
      function setupAdminAllGamesToggle() {
        const style = document.createElement('style');
        style.textContent = [
          '#tgbAdminShowAll{position:fixed;left:14px;bottom:14px;z-index:2147482000;display:none;align-items:center;gap:8px;min-height:34px;padding:0 14px;border:1px solid #111;border-radius:8px;background:#111;color:#fff;font-family:"IBM Plex Mono",Consolas,monospace;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);}',
          '#tgbAdminShowAll.is-visible{display:inline-flex;}',
          '#tgbAdminShowAll.is-on{background:#fff;color:#111;}'
        ].join('');
        document.head.appendChild(style);

        const btn = document.createElement('button');
        btn.id = 'tgbAdminShowAll';
        btn.type = 'button';
        const paint = () => {
          btn.classList.toggle('is-on', adminShowAll);
          btn.textContent = adminShowAll ? 'Showing all games' : 'Show all games';
        };
        paint();
        btn.addEventListener('click', () => {
          adminShowAll = !adminShowAll;
          paint();
          // recomputeLiveGames() re-filters and (via applyUrlSelection) resets any
          // city/fan selection. When turning ON, immediately drive the generic
          // selected-games grid with a synthetic "all" entry so the admin sees a
          // flat list of EVERY game — not just bumped city/fan counts.
          recomputeLiveGames();
          if (adminShowAll) {
            selectedEntryKind = 'all';
            selectedEntryKey = '*';
            refreshSelectionStyles();
            renderSelectedGames({ entryKind: 'all', entryKey: '*', label: 'All games (admin)' });
            // The cards carry data-admin-edit; nudge the bridge to paint every
            // EDIT GAME button immediately rather than waiting on its debounced
            // observer (which can miss a bulk re-render).
            paintEditButtons();
          }
        });
        document.body.appendChild(btn);

        const sync = () => {
          const admin = isAdminAuthorized();
          btn.classList.toggle('is-visible', admin);
          // If the admin signs out while "show all" is on, drop back to the
          // public view so archived/past games don't linger for a public visitor.
          if (!admin && adminShowAll) {
            adminShowAll = false;
            paint();
            recomputeLiveGames();
          }
        };
        sync();
        // The bridge verifies asynchronously and toggles the root class when it
        // resolves; watch for that so the control appears without a reload.
        new MutationObserver(sync).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class']
        });
      }

      // ---------------------------------------------------------------------------
      // Bootstrap
      // ---------------------------------------------------------------------------
      setupAdminAllGamesToggle();
      load();
    }());
  </script>
  <!-- ==========================================================================
       TEMP · "COMING SOON" gate on PLAY GAME buttons.
       Intercepts clicks on .game-card-play and shows a popup instead of playing.
       This is temporary — DELETE THIS ENTIRE <script> BLOCK to restore play.
       Nothing else was changed; the buttons/hrefs are untouched.
       ========================================================================== -->
  <script>
  (function () {
    function showComingSoon() {
      var prev = document.getElementById('tgbComingSoonToast');
      if (prev) prev.remove();
      var overlay = document.createElement('div');
      overlay.id = 'tgbComingSoonToast';
      overlay.setAttribute('role', 'status');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,6,10,0.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer;';
      var box = document.createElement('div');
      box.style.cssText = 'position:relative;max-width:340px;text-align:center;padding:26px 28px;border-radius:16px;border:1px solid rgba(245,180,97,0.4);background:#111a27;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,0.5);';
      box.innerHTML = '<button type="button" id="tgbComingSoonClose" aria-label="Close" style="position:absolute;top:8px;right:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:8px;background:transparent;color:#c8d3e0;font-size:1.25rem;line-height:1;cursor:pointer;">&times;</button>' +
        '<div style="font-size:1.5rem;font-weight:800;letter-spacing:0.08em;margin-bottom:8px;">COMING SOON</div>' +
        '<div style="color:#c8d3e0;font-size:0.9rem;line-height:1.5;">Games aren\'t quite ready to play yet — check back soon.</div>';
      overlay.appendChild(box);
      var close = function () { overlay.remove(); document.removeEventListener('keydown', onKey); };
      var onKey = function (e) { if (e.key === 'Escape') close(); };
      overlay.addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
    }
    // Capture phase so this beats the link's navigation and any other handlers.
    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.game-card-play') : null;
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      showComingSoon();
    }, true);
  }());
  </script>
