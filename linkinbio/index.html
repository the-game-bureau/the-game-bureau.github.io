<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Game Bureau Links</title>
<meta name="description" content="Every story The Game Bureau posts to Instagram, where you can actually tap it.">

<!-- WHY THIS PAGE EXISTS. Instagram's caption link is not clickable, and it is
     the account most likely to be read. Without somewhere to send people, every
     story we post there is a thing you can see and cannot reach. This is the
     one address a bio can hold.

     SO IT LISTS INSTAGRAM POSTS ONLY, filtered in the function rather than
     here: a story that never went to Instagram is one the reader arriving from
     Instagram has not seen, and putting it in the list makes them hunt for
     something they half-remember and will not find. Filtering client-side would
     also break the paging, because an offset counts rows the server returned,
     not rows this page decided to draw.

     IT READS ONLY WHAT WE ACTUALLY POSTED. tgb_public_socials_feed is
     SECURITY DEFINER and returns status = 'posted' rows alone: never a
     candidate in Review, which is a story nobody has decided on, and never a
     SKIPPED one, some of which were turned down for being off-brand or grim.
     It also refuses `why`, our internal note, and `confidence`, the bot's own
     score for its pick. Nothing here is a disclosure: it is the same headline
     and picture a stranger already sees on Instagram.

     THAT IS WHY THE PAGE CALLS A FUNCTION AND NOT THE TABLE. public.socials is
     admin-only in both directions and must stay that way. -->

<meta property="og:type" content="website">
<meta property="og:title" content="The Game Bureau Links">
<meta property="og:description" content="Every story The Game Bureau posts to Instagram, where you can actually tap it.">
<meta property="og:url" content="https://thegamebureau.com/linkinbio/">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://qmaafbncpzrdmqapkkgr.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- THE WEBFONT MUST NOT BLOCK THE FIRST PAINT. A stylesheet link is
     render-blocking, and this page is opened on a phone on mobile data from
     inside Instagram: the words matter more than which face they are in. Loaded
     as `print` and switched to `all` once it arrives, so the system stack in
     the CSS below draws immediately and is replaced when the font lands. The
     <noscript> copy is for a browser that never runs the switch. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap"></noscript>

<style>
  :root {
    --ground: #000;
    --card: #0e0e10;
    --line: rgba(255, 255, 255, 0.13);
    --text: #f5f5f5;
    --muted: rgba(245, 245, 245, 0.52);
  }

  * { box-sizing: border-box; }

  /* NOTHING MAY MOVE SIDEWAYS. Instagram's in-app browser rubber-bands on both
     axes, so a single pixel of horizontal overflow anywhere turns every
     vertical swipe into a wobble. `overflow-x: hidden` is the backstop and
     `overscroll-behavior` is what stops the bounce itself -- the page no longer
     slides against its own edges, and a swipe cannot chain through to whatever
     the browser is showing behind it. */
  html {
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  /* THIS PAGE IS READ ON A PHONE, IN INSTAGRAM'S OWN BROWSER, more or less
     without exception. Everything below is sized for a thumb first and simply
     stops widening on a desktop. */
  body {
    margin: 0;
    max-width: 100%;
    overflow-x: hidden;
    overscroll-behavior: none;
    padding: 0 16px 56px;
    background: var(--ground);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  header { padding: 40px 4px 22px; text-align: center; }

  h1 {
    margin: 0;
    font-size: 1.42rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .tag {
    margin: 8px 0 0;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* ONE LIST OF WHOLE-ROW TARGETS. There is nothing to aim at, because the row
     IS the link: the shape a bio-link page has for the good reason that it is
     tapped by a thumb on a moving train. */
  .feed { display: grid; gap: 10px; }

  /* EVERY ROW IS THE SAME HEIGHT, AND THAT IS THE REAL FIX FOR A PAGE THAT
     SCOOTS. Row height used to be decided by the TEXT -- one line of headline
     or three, in whichever font had arrived -- so the whole list re-laid itself
     out when the webfont landed and again when a slow thumbnail resolved.
     Everything below the change jumped.

     At a fixed 98px the total height of the page is 25 rows times 108px before
     a single character is measured. Nothing the fonts or the images do can move
     anything. 98 = the 74px thumbnail plus 11px of padding either side plus
     the two borders, so the picture still sets the proportion; the text now
     fits inside that rather than deciding it. */
  .item {
    display: flex;
    align-items: center;
    gap: 13px;
    height: 98px;
    max-width: 100%;
    overflow: hidden;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .item:hover, .item:focus-visible {
    border-color: rgba(255, 255, 255, 0.4);
    background: #17171a;
    outline: none;
  }

  /* A dark placeholder, so a picture that is slow or missing leaves a shape
     rather than a hole punched in the row. */
  .thumb {
    flex: 0 0 74px;
    width: 74px;
    height: 74px;
    border-radius: 9px;
    background: #202024;
    object-fit: cover;
  }

  /* `flex: 1 1 auto` WITH `min-width: 0`. Without the explicit basis a flex
     child is sized from its content, and .meta below is `nowrap`: a long outlet
     name could set a width wider than the row and push the card past the
     viewport, which is the horizontal overflow the rules above only hide. */
  .body { flex: 1 1 auto; min-width: 0; }

  .title {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 700;
    line-height: 1.32;
    /* TWO LINES, NOT THREE, now that the card has a fixed height: two lines of
       headline plus the source line fits inside 98px with room to spare, and
       three does not -- the third line would push the source out of the card.
       A long word is broken rather than allowed to set the width. */
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* THE SOURCE IS NAMED, and it is not decoration. A headline is the OUTLET'S
     line, not ours. A bare list of them under our own masthead would read as
     things The Game Bureau wrote. */
  .meta {
    margin: 5px 0 0;
    max-width: 100%;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note {
    padding: 40px 8px;
    color: var(--muted);
    text-align: center;
    font-size: 0.92rem;
  }

  /* THE WAY DEEPER, AND THE WAY BACK, IN THE SAME PLACE. Both are a single
     control at the end of the list, because that is where you are when you run
     out of things to read. */
  .more { padding: 22px 4px 0; text-align: center; }
  .more[hidden] { display: none; }

  .more button, .more a {
    display: inline-block;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
  }

  .more button:hover, .more a:hover {
    border-color: rgba(255, 255, 255, 0.45);
    background: #17171a;
  }

  .more button:disabled { opacity: 0.5; cursor: default; }

  footer { padding: 32px 4px 0; text-align: center; }

  footer a {
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }

  footer a:hover { color: var(--text); border-bottom-color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .item { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>The Game Bureau Links</h1>
      <!-- THE LINE HAS TO MATCH THE FILTER. It read "Everything we have
           posted lately", which stopped being true the moment the feed was
           narrowed to Instagram. A page whose own subtitle overstates what
           it holds is a page somebody scrolls looking for a story that is
           not there. -->
      <p class="tag" id="tag">Everything we post to Instagram</p>
    </header>

    <main class="feed" id="feed" aria-busy="true">
      <p class="note" id="note">Loading&hellip;</p>
    </main>

    <div class="more" id="more" hidden></div>

    <footer>
      <a href="https://thegamebureau.com/">thegamebureau.com</a>
    </footer>
  </div>

<script src="/mc/assets/site-analytics.js" defer></script>
<script>
  (function () {
    'use strict';

    var SUPABASE_URL = 'https://qmaafbncpzrdmqapkkgr.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3';

    // TWO VIEWS, ONE FILE. The archive is `?all` rather than a second page,
    // because a second page means a second copy of this stylesheet and this
    // renderer, and copy-and-drift is the failure this repo has paid for more
    // than any other. The link is what was asked for; a separate FILE was not.
    var ARCHIVE = /(^|[?&])all(=|&|$)/.test(location.search);

    // FRONT: 25. ARCHIVE: 100 A PAGE, walked.
    //
    // 100 is the function's own ceiling per call, so the archive is one request
    // when there are fewer than 100 posts and grows a button when there are
    // more. THE FIRST PAGE ALWAYS PAINTS BEFORE ANY OF THAT: nothing waits on a
    // second request, which is the whole of "fast page load" here.
    var FRONT = 25;
    var PAGE = 100;

    var feed = document.getElementById('feed');
    var more = document.getElementById('more');
    // The heading stays. Only the line under it changes, so the two views are
    // plainly the same page rather than two places with the same name.
    if (ARCHIVE) {
      var tag = document.getElementById('tag');
      if (tag) tag.textContent = 'The Instagram archive';
      document.title = 'Archive · The Game Bureau Links';
    }

    function say(text) {
      feed.textContent = '';
      var p = document.createElement('p');
      p.className = 'note';
      p.textContent = text;
      feed.appendChild(p);
      feed.setAttribute('aria-busy', 'false');
    }

    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch (e) { return ''; }
    }

    function when(iso) {
      var t = Date.parse(iso || '');
      if (!isFinite(t)) return '';
      var days = Math.floor((Date.now() - t) / 86400000);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 7) return days + ' days ago';
      if (days < 14) return 'last week';
      return Math.floor(days / 7) + ' weeks ago';
    }

    function build(row) {
      var url = String(row.url || '').trim();
      // A NOTE WITH NO LINK IS NOT A LINK. MANUAL ADD lets somebody file a
      // plain line of text with no destination, which is a real and useful
      // thing in the queue and is nothing at all on a page whose entire job is
      // to send people somewhere.
      if (!url) return null;

      var a = document.createElement('a');
      a.className = 'item';
      a.href = url;
      // Same tab, deliberately. This is opened inside Instagram's own browser,
      // where a new tab is a second webview with no obvious way back.
      a.rel = 'noopener';

      var img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      // The pictures are hotlinked from the outlets, and a referrer is how some
      // of them decide to serve a placeholder instead.
      img.referrerPolicy = 'no-referrer';
      // A DEAD ADDRESS LEAVES THE PLACEHOLDER rather than a browser's broken
      // image glyph, which on a black card looks like the page is broken.
      img.addEventListener('error', function () { img.removeAttribute('src'); });
      if (row.image) img.src = String(row.image);

      var body = document.createElement('div');
      body.className = 'body';

      var h = document.createElement('p');
      h.className = 'title';
      h.textContent = String(row.headline || '').trim() || hostOf(url) || 'Read this';

      var meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = [String(row.source || '').trim() || hostOf(url), when(row.posted_at)]
        .filter(Boolean).join('  ·  ');

      body.appendChild(h);
      body.appendChild(meta);
      a.appendChild(img);
      a.appendChild(body);
      return a;
    }

    /** One page of the feed.
     *
     *  THE FIRST PAGE DELIBERATELY DOES NOT SEND feed_offset. That parameter
     *  arrived with 2026082104, and until that migration is applied PostgREST
     *  answers a call naming it with "function not found" -- so a page that
     *  always sent it would be a page that was blank until somebody ran some
     *  SQL. Sending it only when it is non-zero means the front view and the
     *  archive's first page work against either version of the function, and
     *  only the DEPTH of the archive waits on the migration.
     */
    function page(limit, offset) {
      var q = '?feed_limit=' + limit + (offset ? '&feed_offset=' + offset : '');
      return fetch(SUPABASE_URL + '/rest/v1/rpc/tgb_public_socials_feed' + q, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
      }).then(function (res) {
        if (!res.ok) throw new Error('feed responded ' + res.status);
        return res.json();
      }).then(function (rows) { return Array.isArray(rows) ? rows : []; });
    }

    /** A ROW IS DRAWN AT MOST ONCE, and `seen` is the whole mechanism.
     *
     *  OFFSET PAGING RACES AGAINST NEW POSTS. The feed is ordered posted_at
     *  desc, so a post filed BETWEEN two page requests shifts every older row
     *  down one and feed_offset=100 hands back the row already drawn at
     *  position 100. The bot files twice a day and people post by hand, so
     *  that window is not theoretical -- and it is INVISIBLE FROM A CHECK:
     *  the data is clean, the ordering is stable (posted_at desc, id desc),
     *  and the page still shows a story twice. Nothing but the render can
     *  catch it.
     *
     *  KEYED ON THE URL, NOT THE ROW ID, AND THAT IS A DECISION. An id key
     *  would catch only the race. The url also collapses one story genuinely
     *  posted twice -- which gifts are expressly allowed to be, since a gift
     *  url never changes and the shop is meant to come round again. On a
     *  page whose whole job is "the things you just saw", the same card twice
     *  reads as a fault whatever it is to us. Say so if a repeat should
     *  count as news; key on row.id and this reverts to the race alone.
     *
     *  `build` already refuses a row with no url, so a blank cannot collide
     *  with another blank here; the id is the fallback regardless.
     */
    var seen = Object.create(null);

    function append(rows) {
      var items = [];
      rows.forEach(function (row) {
        var key = String(row.url || row.id || '').trim().toLowerCase();
        if (key && seen[key]) return;
        var el = build(row);
        if (!el) return;
        if (key) seen[key] = true;
        items.push(el);
      });
      items.forEach(function (el) { feed.appendChild(el); });
      return items.length;
    }

    function showArchiveLink() {
      more.textContent = '';
      var a = document.createElement('a');
      a.href = '?all';
      a.textContent = 'Everything we have posted';
      more.appendChild(a);
      more.hidden = false;
    }

    function showBackLink() {
      more.textContent = '';
      var a = document.createElement('a');
      a.href = './';
      a.textContent = 'Back to the latest';
      more.appendChild(a);
      more.hidden = false;
    }

    /** A BUTTON, NOT AN INFINITE SCROLL. Loading forever as somebody scrolls
     *  makes the footer unreachable and spends their data without asking. */
    function showMoreButton(nextOffset) {
      more.textContent = '';
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'Show more';
      b.addEventListener('click', function () {
        b.disabled = true;
        b.textContent = 'Loading…';
        page(PAGE, nextOffset)
          .then(function (rows) {
            var n = append(rows);
            // A SHORT PAGE IS THE END. Asking for the count separately would be
            // a second request answering a question this one already settles.
            if (rows.length < PAGE) { showBackLink(); return; }
            // ADVANCE BY WHAT THE SERVER SENT, NEVER BY WHAT WAS DRAWN. The
            // offset is the server's cursor; stepping it by the deduped count
            // would walk backwards into the same overlap on every press.
            showMoreButton(nextOffset + rows.length);
            if (!n) showBackLink();
          })
          .catch(function (err) {
            console.error('The Game Bureau Links: could not load more.', err);
            showBackLink();
          });
      });
      more.appendChild(b);
      more.hidden = false;
    }

    page(ARCHIVE ? PAGE : FRONT, 0)
      .then(function (rows) {
        feed.textContent = '';
        var n = append(rows);
        feed.setAttribute('aria-busy', 'false');
        if (!n) { say('Nothing here just yet.'); return; }
        if (!ARCHIVE) { showArchiveLink(); return; }
        if (rows.length < PAGE) { showBackLink(); return; }
        showMoreButton(rows.length);
      })
      .catch(function (err) {
        // A VISITOR IS TOLD NOTHING ABOUT OUR SCHEMA. The real reason goes to
        // the console, where somebody who came here to find out why the page is
        // empty will look, and nowhere else.
        console.error('The Game Bureau Links: could not load the feed.', err);
        say('Nothing here just yet.');
      });
  }());
</script>
</body>
</html>
