<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Game Bureau Links</title>
<meta name="description" content="Everything The Game Bureau has posted lately, in one place.">

<!-- WHY THIS PAGE EXISTS. Instagram's caption link is not clickable, and it is
     the account most likely to be read. Without somewhere to send people, every
     story we post there is a thing you can see and cannot reach. This is the
     one address a bio can hold.

     IT READS ONLY WHAT WE ACTUALLY POSTED. tgb_public_socials_feed is
     SECURITY DEFINER and returns status = 'posted' rows alone: never a
     candidate in Review, which is a story nobody has decided on, and never a
     SKIPPED one, some of which were turned down for being off-brand or grim.
     It also refuses `why`, our internal note, and `confidence`, the bot's own
     score for its pick. Nothing here is a disclosure: it is the same headline
     and picture a stranger already sees on Instagram.

     THAT IS WHY THE PAGE CALLS A FUNCTION AND NOT THE TABLE. public.socials is
     admin-only in both directions and must stay that way. -->

<meta property="og:type" content="website">
<meta property="og:title" content="The Game Bureau Links">
<meta property="og:description" content="Everything The Game Bureau has posted lately, in one place.">
<meta property="og:url" content="https://thegamebureau.com/linkinbio/">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://qmaafbncpzrdmqapkkgr.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">

<style>
  :root {
    --ground: #000;
    --card: #0e0e10;
    --line: rgba(255, 255, 255, 0.13);
    --text: #f5f5f5;
    --muted: rgba(245, 245, 245, 0.52);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  /* THIS PAGE IS READ ON A PHONE, IN INSTAGRAM'S OWN BROWSER, more or less
     without exception. Everything below is sized for a thumb first and simply
     stops widening on a desktop. */
  body {
    margin: 0;
    padding: 0 16px 56px;
    background: var(--ground);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  header { padding: 40px 4px 22px; text-align: center; }

  h1 {
    margin: 0;
    font-size: 1.42rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .tag {
    margin: 8px 0 0;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* ONE LIST OF WHOLE-ROW TARGETS. There is nothing to aim at, because the row
     IS the link: the shape a bio-link page has for the good reason that it is
     tapped by a thumb on a moving train. */
  .feed { display: grid; gap: 10px; }

  .item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .item:hover, .item:focus-visible {
    border-color: rgba(255, 255, 255, 0.4);
    background: #17171a;
    outline: none;
  }

  /* A dark placeholder, so a picture that is slow or missing leaves a shape
     rather than a hole punched in the row. */
  .thumb {
    flex: 0 0 74px;
    width: 74px;
    height: 74px;
    border-radius: 9px;
    background: #202024;
    object-fit: cover;
  }

  .body { min-width: 0; }

  .title {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 700;
    line-height: 1.32;
    /* Three lines, then an ellipsis: a 90-character headline would otherwise
       make one card four times the height of its neighbour. */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* THE SOURCE IS NAMED, and it is not decoration. A headline is the OUTLET'S
     line, not ours. A bare list of them under our own masthead would read as
     things The Game Bureau wrote. */
  .meta {
    margin: 5px 0 0;
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note {
    padding: 40px 8px;
    color: var(--muted);
    text-align: center;
    font-size: 0.92rem;
  }

  footer { padding: 32px 4px 0; text-align: center; }

  footer a {
    color: var(--muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }

  footer a:hover { color: var(--text); border-bottom-color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .item { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>The Game Bureau Links</h1>
      <p class="tag">Everything we have posted lately</p>
    </header>

    <main class="feed" id="feed" aria-busy="true">
      <p class="note" id="note">Loading&hellip;</p>
    </main>

    <footer>
      <a href="https://thegamebureau.com/">thegamebureau.com</a>
    </footer>
  </div>

<script src="/mc/assets/site-analytics.js" defer></script>
<script>
  (function () {
    'use strict';

    var SUPABASE_URL = 'https://qmaafbncpzrdmqapkkgr.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3';

    // 24 IS THE FUNCTION'S OWN CEILING, not a number chosen here.
    // tgb_public_socials_feed clamps feed_limit to 24 so a public endpoint
    // cannot be asked for the whole table. Asking for more is not an error, it
    // just returns 24, so this says 24 rather than pretending otherwise.
    var LIMIT = 24;

    var feed = document.getElementById('feed');

    function say(text) {
      feed.textContent = '';
      var p = document.createElement('p');
      p.className = 'note';
      p.textContent = text;
      feed.appendChild(p);
      feed.setAttribute('aria-busy', 'false');
    }

    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch (e) { return ''; }
    }

    function when(iso) {
      var t = Date.parse(iso || '');
      if (!isFinite(t)) return '';
      var days = Math.floor((Date.now() - t) / 86400000);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 7) return days + ' days ago';
      if (days < 14) return 'last week';
      return Math.floor(days / 7) + ' weeks ago';
    }

    function build(row) {
      var url = String(row.url || '').trim();
      // A NOTE WITH NO LINK IS NOT A LINK. MANUAL ADD lets somebody file a
      // plain line of text with no destination, which is a real and useful
      // thing in the queue and is nothing at all on a page whose entire job is
      // to send people somewhere.
      if (!url) return null;

      var a = document.createElement('a');
      a.className = 'item';
      a.href = url;
      // Same tab, deliberately. This is opened inside Instagram's own browser,
      // where a new tab is a second webview with no obvious way back.
      a.rel = 'noopener';

      var img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      // The pictures are hotlinked from the outlets, and a referrer is how some
      // of them decide to serve a placeholder instead.
      img.referrerPolicy = 'no-referrer';
      // A DEAD ADDRESS LEAVES THE PLACEHOLDER rather than a browser's broken
      // image glyph, which on a black card looks like the page is broken.
      img.addEventListener('error', function () { img.removeAttribute('src'); });
      if (row.image) img.src = String(row.image);

      var body = document.createElement('div');
      body.className = 'body';

      var h = document.createElement('p');
      h.className = 'title';
      h.textContent = String(row.headline || '').trim() || hostOf(url) || 'Read this';

      var meta = document.createElement('p');
      meta.className = 'meta';
      meta.textContent = [String(row.source || '').trim() || hostOf(url), when(row.posted_at)]
        .filter(Boolean).join('  ·  ');

      body.appendChild(h);
      body.appendChild(meta);
      a.appendChild(img);
      a.appendChild(body);
      return a;
    }

    fetch(SUPABASE_URL + '/rest/v1/rpc/tgb_public_socials_feed?feed_limit=' + LIMIT, {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    })
      .then(function (res) {
        if (!res.ok) throw new Error('feed responded ' + res.status);
        return res.json();
      })
      .then(function (rows) {
        var items = (Array.isArray(rows) ? rows : []).map(build).filter(Boolean);
        if (!items.length) { say('Nothing here just yet.'); return; }
        feed.textContent = '';
        items.forEach(function (el) { feed.appendChild(el); });
        feed.setAttribute('aria-busy', 'false');
      })
      .catch(function (err) {
        // A VISITOR IS TOLD NOTHING ABOUT OUR SCHEMA. The real reason goes to
        // the console, where somebody who came here to find out why the page is
        // empty will look, and nowhere else.
        console.error('The Game Bureau Links: could not load the feed.', err);
        say('Nothing here just yet.');
      });
  }());
</script>
</body>
</html>
