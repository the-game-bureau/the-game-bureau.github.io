<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101216" />
  <meta name="description" content="The Game Bureau." />
  <title>HOME | THE GAME BUREAU</title>
  <link rel="icon" href="assets/brand/tgb.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --night: #101216;
      --night-soft: #181c23;
      --night-deep: #090b0f;
      --paper: #f1e3bf;
      --gold: #d8a24b;
      --gold-soft: #f4dca0;
      --line: rgba(241, 227, 191, 0.16);
      --panel: rgba(17, 20, 26, 0.84);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 3vw, 2rem);
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--paper);
      background:
        radial-gradient(circle at 18% 8%, rgba(216, 162, 75, 0.2) 0%, transparent 26%),
        radial-gradient(circle at 100% 24%, rgba(98, 132, 140, 0.16) 0%, transparent 22%),
        linear-gradient(180deg, var(--night-soft) 0%, var(--night) 52%, var(--night-deep) 100%);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 38%, rgba(0, 0, 0, 0.3) 74%, rgba(0, 0, 0, 0.62) 100%);
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.95fr);
      gap: clamp(1.25rem, 3vw, 2rem);
      align-items: center;
    }

    .copy {
      position: relative;
      padding: clamp(1.8rem, 4vw, 3rem);
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(216, 162, 75, 0.08) 0%, transparent 42%),
        linear-gradient(160deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)),
        var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .copy::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 14%, rgba(244, 220, 160, 0.14) 0%, transparent 24%),
        linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.04) 44%, transparent 45%);
    }

    h1 {
      position: relative;
      z-index: 1;
      color: #fff8e5;
      font-family: "Cinzel", serif;
      font-size: clamp(3.2rem, 8vw, 6.5rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }

    .tagline {
      position: relative;
      z-index: 1;
      margin-top: 1.15rem;
      max-width: 18ch;
      color: var(--gold-soft);
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.55;
    }

    .library-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      margin-top: 1.7rem;
      padding: 0 1.4rem;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #20170d;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      box-shadow: 0 14px 34px rgba(216, 162, 75, 0.22);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .library-btn:hover,
    .library-btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 18px 42px rgba(216, 162, 75, 0.3);
      outline: none;
    }

    .poster {
      position: relative;
      min-height: 100%;
      padding: clamp(0.9rem, 2vw, 1.25rem);
      border: 1px solid var(--line);
      border-radius: 30px;
      background:
        radial-gradient(circle at top, rgba(244, 220, 160, 0.12) 0%, transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)),
        rgba(14, 17, 22, 0.92);
      box-shadow: var(--shadow);
    }

    .poster::before,
    .poster::after {
      content: "";
      position: absolute;
      width: 84px;
      height: 18px;
      background: rgba(244, 220, 160, 0.18);
      border: 1px solid rgba(244, 220, 160, 0.2);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.18);
      z-index: 2;
    }

    .poster::before {
      top: 0.6rem;
      left: 1.4rem;
      transform: rotate(-7deg);
    }

    .poster::after {
      right: 1.1rem;
      bottom: 0.7rem;
      transform: rotate(6deg);
    }

    .poster-frame {
      aspect-ratio: 5 / 6.7;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(241, 227, 191, 0.14);
      background: #0d1115;
    }

    .poster-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.88) brightness(0.9) contrast(1.02);
    }

    @media (max-width: 920px) {
      .scene {
        grid-template-columns: 1fr;
      }

      .poster {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
    }

    @media (max-width: 640px) {
      .scene {
        gap: 1rem;
      }

      .copy,
      .poster {
        border-radius: 24px;
      }

      .library-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="copy" aria-label="Homepage introduction">
      <h1>The Game Bureau</h1>
      <p class="tagline">The antidote for the walking tour</p>
      <a class="library-btn" href="library.html">Games library</a>
    </section>

    <div class="poster" aria-hidden="true">
      <div class="poster-frame">
        <img src="assets/games/nolammap.png" alt="">
      </div>
    </div>
  </main>
</body>
</html>
