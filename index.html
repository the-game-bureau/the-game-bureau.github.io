  </main>
  <script>
    (function () {
      const gameCountEl = document.getElementById('heroGameCount');
      const cityCountEl = document.getElementById('heroCityCount');
      if (!gameCountEl || !cityCountEl || !window.fetch) return;

      const endpoint = new URL('https://qmaafbncpzrdmqapkkgr.supabase.co/rest/v1/games');
      endpoint.searchParams.set('apikey', 'sb_publishable_6a9XqxYa0-AZtyrwz4ZeUg_aiMsVH-3');
      endpoint.searchParams.set('select', 'city,archived,erased');

      function isTrueish(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'string') {
          const normalized = value.trim().toLowerCase();
          return !!normalized && normalized !== 'false' && normalized !== '0' && normalized !== 'no';
        }
        return !!value;
      }

      fetch(endpoint.toString())
        .then((response) => response.ok ? response.json() : Promise.reject(response))
        .then((games) => {
          const liveGames = (Array.isArray(games) ? games : []).filter((game) => {
            return !isTrueish(game && game.archived) && !isTrueish(game && game.erased);
          });
          const cities = new Set(liveGames.map((game) => String(game && game.city || '').trim()).filter(Boolean));
          gameCountEl.textContent = String(liveGames.length);
          cityCountEl.textContent = String(cities.size);
        })
        .catch(() => {});
    }());
  </script>
