<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="The Game Bureau. Live action, real world games: part scavenger hunt, part escape room, played on foot in a real city. Opening soon.">
  <title>The Game Bureau</title>
  <link rel="icon" href="/mc/assets/brand/tgb.ico" type="image/x-icon">

  <meta property="og:title" content="The Game Bureau">
  <meta property="og:description" content="Part scavenger hunt, part escape room. The city you are visiting is the gameboard. Opening soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thegamebureau.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- COMING SOON, AND IT IS A REAL PAGE RATHER THAN A REDIRECT.
       This file was a bare iframe around /games/. The rooms behind it are being
       rebuilt, and a shop window onto unfinished work is worse than a closed
       door: a visitor cannot tell a half-built page from a broken one.

       WHAT THIS DOES NOT DO, said plainly rather than assumed: it closes the
       FRONT DOOR only. /games/, /gifts/, /soundtracks/ and /highlights/ are
       still served at their own addresses and are still indexed. Closing those
       is a separate decision, and it is not this file's to make.

       NO NAV AND NO FOOTER, deliberately. Both are doors into the pages this
       page exists to hold back, and site-footer.js would put live counts of
       games and gifts on a page that says we are not open yet. -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --ground: #101722;
      --ink:    #f3eee6;
      --muted:  rgba(243, 238, 230, 0.62);
      --line:   rgba(243, 238, 230, 0.18);
      --accent: #f5b461;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      /* THE WHOLE PAGE IS ONE SCREEN and must stay one on a phone in landscape,
         which is shorter than anybody designs for. Padding scales with the
         viewport rather than being a fixed number. */
      padding: clamp(24px, 6vh, 56px) clamp(20px, 5vw, 48px);
    }

    header { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 26px; height: 26px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: var(--accent);
    }
    .mark svg { display: block; width: 100%; height: 100%; }
    .wordmark {
      font: 700 0.82rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    main {
      flex: 1 1 auto;
      display: flex; flex-direction: column; justify-content: center;
      max-width: 22ch;
    }
    h1 {
      margin: 0 0 22px;
      font-weight: 700;
      font-size: clamp(2.6rem, 11vw, 5.6rem);
      line-height: 0.94;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    h1 em { font-style: normal; color: var(--accent); }

    .pitch {
      max-width: 42ch;
      margin: 0 0 14px;
      font-size: clamp(1.02rem, 2.4vw, 1.22rem);
      line-height: 1.5;
      color: var(--muted);
    }
    .pitch b { color: var(--ink); font-weight: 500; }

    .status {
      display: inline-flex; align-items: center; gap: 9px;
      margin-top: 12px;
      font: 500 0.7rem/1 'IBM Plex Mono', monospace;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
    }
    /* A DOT THAT BREATHES, and stops for anybody who asked it to. */
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex: 0 0 auto;
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.28; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

    footer {
      display: flex; align-items: baseline; gap: 8px 18px; flex-wrap: wrap;
      padding-top: 18px; border-top: 1px solid var(--line);
      font: 500 0.68rem/1.5 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { border-bottom-color: var(--accent); color: var(--accent); }
    footer .spacer { margin-left: auto; }

    @media (max-width: 560px) {
      main { max-width: none; }
      footer .spacer { margin-left: 0; flex-basis: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <!-- THE WAYPOINT PIN, DRAWN. The closest thing this project has to a logo,
         and drawn rather than typed for the reason the games page learned the
         hard way: neither face this site loads carries an emoji glyph, so a
         character would be tofu on some machines and a picture on others. -->
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    </span>
    <span class="wordmark">The Game Bureau</span>
  </header>

  <main>
    <h1>Opening<br><em>soon.</em></h1>
    <p class="pitch">
      Part scavenger hunt, part escape room. <b>The city you are visiting is the
      gameboard</b>, and every stop is a real corner you have to stand on.
    </p>
    <p class="pitch">
      We are building the first routes now.
    </p>
    <p class="status"><span class="dot"></span>Under construction</p>
  </main>

  <footer>
    <span>&copy; The Game Bureau</span>
    <span class="spacer"></span>
    <a href="mailto:hello@thegamebureau.com">hello@thegamebureau.com</a>
  </footer>

</body>
</html>
