  <script src="/mc/assets/public-account.js"></script>
  <link rel="stylesheet" href="/mc/assets/civic-modernist-pages.css">
  <style>
    /* The header is the Gift Shop's, rule for rule: a slim band rather than the
       430px hero the other pages use, a blue top rule, and a light wash that
       fades left-to-right over a collage so the headline stays readable on top
       of it. Only the image differs — /gifts/ uses its items collage, this uses
       the highlights one. Selectors carry the same
       body[data-admin-page=…] main.<page> prefix the skin uses, so they land on
       top of its 430px defaults instead of losing to them. */
    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero {
      min-height: 0;
      padding: 0;
      max-width: 100%;
      overflow: hidden;
      border: 0;
      border-top: 6px solid var(--civic-blue);
      border-bottom: 1px solid var(--civic-border-strong);
      background:
        linear-gradient(90deg, rgba(246, 248, 250, 0.96) 0%, rgba(246, 248, 250, 0.86) 40%, rgba(246, 248, 250, 0.5) 66%, rgba(246, 248, 250, 0.12) 100%),
        url("/highlights/highlights_banner.png") center / cover no-repeat;
    }

    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-grid {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 14px 26px 18px;
      align-items: start;
    }

    /* The skin's default hero column is a white panel with a blue top rule. The
       Gift Shop drops it and lets the copy sit straight on the wash; so does
       this, or the band would carry a card inside a card. */
    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-grid > div:first-child {
      box-sizing: border-box;
      width: 100%;
      max-width: 760px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-headline {
      margin: 0;
      font-size: clamp(1.7rem, 2.8vw, 2.2rem);
      line-height: 1;
      text-shadow: none;
    }

    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-sub {
      max-width: 650px;
      margin-top: 4px;
    }

    /* Sits where the Gift Shop puts its city rail, and reads as the same kind of
       control strip: status chip first, then the ways out of the page. */
    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-actions {
      /* Not the shell's two-up grid: three items of different widths, laid out
         as a strip that wraps, the way the shop's hero tools do. */
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      width: auto;
      margin-top: 14px;
    }

    body[data-admin-page="game-results"].home-page main.coming-soon-page .hero-button {
      width: auto;
      min-height: 42px;
    }

    .coming-soon-stamp {
      /* inline-flex alone still stretches here: the hero column is a grid, and a
         grid item stretches to the track unless it is told not to. */
      display: inline-flex;
      width: fit-content;
      align-self: start;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      margin: 0;
      padding: 0 14px;
      border: 1px solid var(--civic-border-strong);
      background: var(--civic-blue);
      color: #fff;
      font-family: "IBM Plex Mono", Consolas, monospace;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Pulses so the chip reads as "in progress" rather than "abandoned". It is
       the only motion on the page, so reduced-motion drops it entirely. */
    .coming-soon-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: coming-soon-pulse 2.4s ease-in-out infinite;
    }

    @keyframes coming-soon-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .coming-soon-dot { animation: none; }
    }

  </style>
</head>
<!-- data-admin-page is a pure CSS hook here: every civic-skin rule for this page
     is keyed on it. The page carries no admin scripts and no admin controls. -->
<body class="home-page" data-admin-page="game-results">
  <div class="page-shell">
    <header class="site-nav" data-site-nav></header>
    <script src="/mc/assets/site-nav.js"></script>

    <main class="coming-soon-page">
      <section class="hero" aria-label="Highlights overview">
        <div class="hero-grid">
          <div>
            <h1 class="hero-headline">Highlights</h1>
            <p class="hero-sub">Scores, recaps, and photos from every Game Bureau game.</p>
            <div class="hero-actions">
              <p class="coming-soon-stamp"><span class="coming-soon-dot" aria-hidden="true"></span>Coming soon</p>
              <a class="hero-button" href="/games/">Browse the games</a>
              <a class="hero-button" href="/gifts/">Visit the gift shop</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Site footer (shared via /assets/site-footer.js) -->
    <footer class="site-footer" data-site-footer></footer>
    <script src="/mc/assets/site-footer.js"></script>
  </div>

  <!-- Roaming cassette case: if a city soundtrack is playing and was minimized
       on /soundtracks/, it reappears here and picks the track back up. -->
  <script src="/mc/assets/mini-cassette.js" defer></script>
</body>
</html>
