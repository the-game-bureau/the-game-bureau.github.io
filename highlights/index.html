      const ANCHOR_FIGURES = [ANCHOR_FIGURE_MALE, ANCHOR_FIGURE_FEMALE, ANCHOR_FIGURE_BALD];

      function anchorSvg() {
        const figure = ANCHOR_FIGURES[Math.floor(Math.random() * ANCHOR_FIGURES.length)];
        return ANCHOR_STUDIO_HEAD + figure + ANCHOR_STUDIO_TAIL;

      const countEl = document.getElementById('resultsCount');
      const tableWrapEl = document.getElementById('resultsTableWrap');
      const bodyEl = document.getElementById('resultsBody');
      const emptyEl = document.getElementById('resultsEmpty');
      const featuredEl = document.getElementById('featuredResult');
      const moreScoresBtn = document.getElementById('moreScoresButton');
      const scrollSentinelEl = document.getElementById('resultsScrollSentinel');
      let displayedCount = 0;
      let resultRowIndex = 0;
      let currentLoadedCount = 0;
      let currentTotalCount = 0;
      let currentHasMoreResults = false;
      let currentFilters = [];
      let isLoadingResults = false;
      let hasRenderedFirstPage = false;
      let scrollObserver = null;
      let fillViewportTimer = 0;

      // ── Auto-scroll ticker (modeled on the games hero meta list) ──────────
      const AUTO_SCROLL_PX_PER_SEC = 24;
      const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      let autoScrollRaf = null;
      let autoScrollLastTs = 0;
      let autoScrollPauseUntil = 0;
      let isHoveringScores = false;

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function updateMoreButton() {
        if (!moreScoresBtn) return;
        // Always visible once scores exist; disabled while loading or fully loaded.
        moreScoresBtn.hidden = !hasRenderedFirstPage || currentTotalCount <= 0;
        moreScoresBtn.disabled = !currentHasMoreResults || isLoadingResults;
        moreScoresBtn.textContent = currentHasMoreResults ? 'MORE SCORES' : 'NO MORE SCORES';
      }

      function setHeadlineCount(value) {
        if (countEl) countEl.textContent = String(Math.max(0, Number(value) || 0));
      }

      function sentinelIsNearViewport() {
        if (!scrollSentinelEl || !tableWrapEl || typeof scrollSentinelEl.getBoundingClientRect !== 'function') return false;
        const sentinelRect = scrollSentinelEl.getBoundingClientRect();
        const containerRect = tableWrapEl.getBoundingClientRect();
        return sentinelRect.top <= containerRect.bottom + 300;
      }

      function pageNeedsMoreRows() {
        if (!tableWrapEl) return false;
        const containerHeight = tableWrapEl.clientHeight || 0;
        if (!containerHeight) return false;
        // Keep loading until the box actually overflows (so scroll can kick in).
        return (tableWrapEl.scrollHeight || 0) <= containerHeight + 40;
      }

      function scheduleViewportFill() {
        if (!currentHasMoreResults || isLoadingResults || fillViewportTimer) return;
        fillViewportTimer = window.setTimeout(() => {
          fillViewportTimer = 0;
          if (currentHasMoreResults && !isLoadingResults && (pageNeedsMoreRows() || sentinelIsNearViewport())) {
            loadNextCurrentResults();
          }
        }, 80);
      }

      function queueViewportFill() {
        if (typeof window.requestAnimationFrame === 'function') {
          window.requestAnimationFrame(() => scheduleViewportFill());
          return;
        }
        scheduleViewportFill();
      }

      function formatScore(value) {
        const number = Number(value);
        return Number.isFinite(number) ? String(number) : '0';
      }

      function formatAnchorDate(value) {
        if (!value) return '';
        try {
          const date = new Date(value);
          if (!Number.isFinite(date.getTime())) return '';
          return new Intl.DateTimeFormat(undefined, {
            weekday: 'long',
            month: 'long',
            day: 'numeric'
          }).format(date);
        } catch (error) {
          return '';
        }
      }

      function quotedInValue(value) {
        return '"' + String(value || '').replace(/["\\]/g, '') + '"';
      }

      function buildResultsUrl(options) {
        options = options || {};
        const params = [
          'select=' + encodeURIComponent(options.select || RESULT_SELECT),
          'order=created_at.desc,instanceid.desc'
        ];
        (options.filters || []).forEach((filter) => {
          if (!filter || !filter.length) return;
          params.push(encodeURIComponent(filter[0]) + '=' + encodeURIComponent(filter[1]));
        });
        if (Number.isFinite(options.limit)) params.push('limit=' + Math.max(0, options.limit));
        if (Number.isFinite(options.offset) && options.offset > 0) params.push('offset=' + Math.max(0, options.offset));
        return SB_URL + '/rest/v1/' + TABLE + '?' + params.join('&');
      }

      function resultHeaders(extra) {
        return Object.assign({
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          Accept: 'application/json'
        }, extra || {});
      }

      async function fetchResultCount(filters) {
        const response = await fetch(buildResultsUrl({
          select: 'instanceid',
          filters: filters || [],
          limit: 1
        }), {
          headers: resultHeaders({ Prefer: 'count=exact' }),
          cache: 'no-store'
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
        }
        const range = response.headers && response.headers.get ? response.headers.get('content-range') : '';
        const match = String(range || '').match(/\/(\d+)$/);
        if (match) return Number(match[1]) || 0;
        const rows = await response.json();
        return Array.isArray(rows) ? rows.length : 0;
      }

      async function fetchResultRows(filters, limit, offset) {
        const response = await fetch(buildResultsUrl({
          filters: filters || [],
          limit: limit,
          offset: offset
        }), {
          headers: resultHeaders(),
          cache: 'no-store'
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
        }
        const rows = await response.json();
        return Array.isArray(rows) ? rows : [];
      }

      async function fetchGameNameMap(rows) {
        const ids = Array.from(new Set((Array.isArray(rows) ? rows : [])
          .map((row) => String(row && row.gameid || '').trim())
          .filter(Boolean)));
        const map = new Map();
        if (!ids.length) return map;

        const url = SB_URL + '/rest/v1/games'
          + '?select=' + encodeURIComponent('id,name')
          + '&id=in.(' + ids.map(quotedInValue).map(encodeURIComponent).join(',') + ')';

        try {
          const response = await fetch(url, {
            headers: {
              apikey: SB_KEY,
              Authorization: 'Bearer ' + SB_KEY,
              Accept: 'application/json'
            },
            cache: 'no-store'
          });
          if (!response.ok) return map;
          const games = await response.json();
          (Array.isArray(games) ? games : []).forEach((game) => {
            const id = String(game && game.id || '').trim();
            const name = String(game && game.name || '').trim();
            if (id && name) map.set(id, name);
          });
        } catch (error) {
          console.warn('[highlights] game name lookup failed', error);
        }
        return map;
      }

      function collapseResultRow(row) {
        if (!row || row.getAttribute('aria-expanded') !== 'true') return;
        const detailId = row.getAttribute('aria-controls') || '';
        const detail = detailId ? document.getElementById(detailId) : null;
        const label = row.dataset.resultLabel || 'highlight row';
        row.setAttribute('aria-expanded', 'false');
        row.setAttribute('aria-label', 'Show full scoreline for ' + label);
        if (detail) detail.hidden = true;
      }

      function collapseAllResultRows(except) {
        if (!bodyEl || !bodyEl.querySelectorAll) return;
        bodyEl.querySelectorAll('.result-main-row[aria-expanded="true"]').forEach((row) => {
          if (row !== except) collapseResultRow(row);
        });
      }

      function bindResultToggles() {
        if (!bodyEl || !bodyEl.querySelectorAll) return;
        bodyEl.querySelectorAll('[data-result-toggle]:not([data-toggle-bound="true"])').forEach((row) => {
          row.dataset.toggleBound = 'true';
          const toggleRow = () => {
            const detailId = row.getAttribute('aria-controls') || '';
            const detail = detailId ? document.getElementById(detailId) : null;
            if (!detail) return;
            const isOpen = row.getAttribute('aria-expanded') === 'true';
            const label = row.dataset.resultLabel || 'highlight row';
            if (!isOpen) collapseAllResultRows(row);
            row.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
            row.setAttribute('aria-label', (isOpen ? 'Show full scoreline for ' : 'Hide full scoreline for ') + label);
            detail.hidden = isOpen;
          };
          row.addEventListener('click', toggleRow);
          row.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            toggleRow();
          });
        });
      }

      function renderFeatured(row, gameNameById) {
        if (!featuredEl) return;
        if (!row) {
          featuredEl.removeAttribute('role');
          featuredEl.removeAttribute('tabindex');
          featuredEl.removeAttribute('aria-label');
          featuredEl.removeAttribute('data-featured-instance');
          featuredEl.innerHTML = '<p class="results-feature-title">No results yet</p>';
          return;
        }
        const nameMap = gameNameById || new Map();
        const gameid = row.gameid || '';
        const gameName = nameMap.get(String(gameid))
          || DEMO_GAME_NAMES[String(gameid)]
          || 'Unknown game';
        const tgb = row.tgbteamname || 'Team One';
        const opponent = row.opponentname || 'Opponent';
        const score = formatScore(row.tgbteamscore) + '-' + formatScore(row.opponentscore);
        const winner = row.winnername || 'Pending';
        const tgbNum = Number(row.tgbteamscore);
        const opponentNum = Number(row.opponentscore);
        const scoresComparable = Number.isFinite(tgbNum) && Number.isFinite(opponentNum);
        const tgbLabel = (scoresComparable && tgbNum > opponentNum) ? 'Winner' : 'Opponent';
        const opponentLabel = (scoresComparable && opponentNum > tgbNum) ? 'Winner' : 'Opponent';
        const instanceId = String(row.instanceid == null ? '' : row.instanceid);
        featuredEl.setAttribute('role', 'button');
        featuredEl.setAttribute('tabindex', '0');
        featuredEl.setAttribute('aria-label', 'Show full scoreline for ' + gameName);
        if (instanceId) featuredEl.setAttribute('data-featured-instance', instanceId);
        else featuredEl.removeAttribute('data-featured-instance');
        featuredEl.innerHTML = [
          '<span class="results-feature-winner" title="' + escapeHtml(winner) + '">' + escapeHtml(winner) + '</span>',
          '<div class="results-feature-match">',
            '<span class="results-feature-team"><span class="results-feature-team-label">' + escapeHtml(tgbLabel) + '</span><strong title="' + escapeHtml(tgb) + '">' + escapeHtml(tgb) + '</strong></span>',
            '<span class="results-feature-score">' + escapeHtml(score) + '</span>',
            '<span class="results-feature-team"><span class="results-feature-team-label">' + escapeHtml(opponentLabel) + '</span><strong title="' + escapeHtml(opponent) + '">' + escapeHtml(opponent) + '</strong></span>',
          '</div>',
          '<p class="results-feature-title" title="' + escapeHtml(gameName) + '">' + escapeHtml(gameName) + '</p>'
        ].join('');
      }

      function renderRows(rows, gameNameById, options) {
        options = options || {};
        gameNameById = gameNameById || new Map();
        if (!Array.isArray(rows) || rows.length === 0) {
          if (!hasRenderedFirstPage) {
            if (countEl) countEl.textContent = '0';
            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = false;
            if (bodyEl) bodyEl.innerHTML = '';
            renderFeatured(null);
          }
          return;
        }

        displayedCount += rows.length;
        if (tableWrapEl) tableWrapEl.hidden = false;
        if (emptyEl) emptyEl.hidden = true;
        if (!hasRenderedFirstPage) {
          renderFeatured(rows[0], gameNameById);
          if (bodyEl) bodyEl.innerHTML = '';
          hasRenderedFirstPage = true;
        }

        const html = rows.map((row) => {
          const index = resultRowIndex++;
          const gameid = row.gameid || '';
          const gameName = gameNameById.get(String(gameid))
            || DEMO_GAME_NAMES[String(gameid)]
            || 'Unknown game';
          const tgb = row.tgbteamname || 'Team One';
          const opponent = row.opponentname || 'Opponent';
          const tgbScore = formatScore(row.tgbteamscore);
          const opponentScore = formatScore(row.opponentscore);
          const detailId = 'highlight-detail-' + index;
          const tgbNum = Number(row.tgbteamscore);
          const opponentNum = Number(row.opponentscore);
          const scoresComparable = Number.isFinite(tgbNum) && Number.isFinite(opponentNum);
          const tgbWins = scoresComparable && tgbNum > opponentNum;
          const opponentWins = scoresComparable && opponentNum > tgbNum;
          const tgbTeamClass = 'result-team' + (tgbWins ? ' is-winner' : '');
          const opponentTeamClass = 'result-team' + (opponentWins ? ' is-winner' : '');
          const tgbLabel = tgbWins ? 'Winner' : 'Opponent';
          const opponentLabel = opponentWins ? 'Winner' : 'Opponent';
          // Anchorman broadcast line for the expanded score.
          const datePhrase = formatAnchorDate(row.created_at);
          const datePrefix = datePhrase ? ('On ' + escapeHtml(datePhrase) + ', ') : '';
          const gameEm = '<strong class="result-anchor-em">' + escapeHtml(gameName) + '</strong>';
          let anchorLine;
          if (scoresComparable && (tgbWins || opponentWins)) {
            const winnerName = tgbWins ? tgb : opponent;
            const loserName = tgbWins ? opponent : tgb;
            const higher = Math.max(tgbNum, opponentNum);
            const lower = Math.min(tgbNum, opponentNum);
            anchorLine = datePrefix
              + '<strong class="result-anchor-em">' + escapeHtml(winnerName) + '</strong> defeated '
              + escapeHtml(loserName) + ' by a score of ' + higher + ' to ' + lower
              + ' in the ' + gameEm + ' game.';
          } else {
            anchorLine = datePrefix
              + escapeHtml(tgb) + ' and ' + escapeHtml(opponent)
              + ' played to a ' + escapeHtml(tgbScore + '-' + opponentScore) + ' draw in the '
              + gameEm + ' game.';
          }
          return [
            '<tr class="result-main-row" data-result-toggle role="button" tabindex="0" aria-expanded="false" aria-controls="' + escapeHtml(detailId) + '" data-instanceid="' + escapeHtml(row.instanceid == null ? '' : row.instanceid) + '" data-result-label="' + escapeHtml(gameName) + '" aria-label="Show full scoreline for ' + escapeHtml(gameName) + '">',
              '<td><span class="result-game-name" title="' + escapeHtml(gameName) + '">' + escapeHtml(gameName) + '</span></td>',
              '<td><span class="' + tgbTeamClass + '"><span class="result-team-label">' + escapeHtml(tgbLabel) + '</span><span class="result-team-name" title="' + escapeHtml(tgb) + '">' + escapeHtml(tgb) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(tgbScore) + '</span></td>',
              '<td><span class="' + opponentTeamClass + '"><span class="result-team-label">' + escapeHtml(opponentLabel) + '</span><span class="result-team-name" title="' + escapeHtml(opponent) + '">' + escapeHtml(opponent) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(opponentScore) + '</span></td>',
              '<td><button type="button" class="result-highlights-button">Highlights</button></td>',
            '</tr>',
            '<tr class="result-detail-row" id="' + escapeHtml(detailId) + '" hidden>',
              '<td class="result-detail-cell" colspan="6">',
                '<div class="result-detail-panel">',
                  '<div class="result-anchor">',
                    '<div class="result-anchor-figure" role="button" tabindex="0" aria-label="Watch highlights" data-anchor-lightbox>' + anchorSvg() + '</div>',
                    '<div class="result-anchor-bubble"><p class="result-anchor-line">' + anchorLine + '</p></div>',
                  '</div>',
                '</div>',
              '</td>',
            '</tr>'
          ].join('');
        }).join('');
        bodyEl.insertAdjacentHTML(options.append === false ? 'afterbegin' : 'beforeend', html);
        bindResultToggles();
      }

      async function initResultsWindow() {
        setHeadlineCount(0);
        updateMoreButton();

        currentFilters = [];
        currentTotalCount = await fetchResultCount([]);
        setHeadlineCount(currentTotalCount);

        currentLoadedCount = 0;
        currentHasMoreResults = currentLoadedCount < currentTotalCount;
        if (!currentHasMoreResults) {
          if (bodyEl) bodyEl.innerHTML = '';
          if (tableWrapEl) tableWrapEl.hidden = true;
          if (emptyEl) emptyEl.hidden = false;
          renderFeatured(null);
          hasRenderedFirstPage = true;
          updateMoreButton();
          return;
        }

        await loadNextCurrentResults();
      }

      async function loadNextCurrentResults() {
        if (isLoadingResults || !currentHasMoreResults) return;
        isLoadingResults = true;
        updateMoreButton();
        try {
          const remaining = Math.max(0, currentTotalCount - currentLoadedCount);
          const rows = await fetchResultRows(currentFilters, Math.min(PAGE_SIZE, remaining), currentLoadedCount);
          const gameNameById = await fetchGameNameMap(rows);
          currentLoadedCount += rows.length;
          currentHasMoreResults = rows.length > 0 && currentLoadedCount < currentTotalCount;
          renderRows(rows, gameNameById, { append: true });
          updateMoreButton();
        } catch (error) {
          if (!hasRenderedFirstPage) {
            if (bodyEl) bodyEl.innerHTML = '';
            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = true;
          }
          renderFeatured(null);
          console.error('[game-results] load failed', error);
        } finally {
          isLoadingResults = false;
          updateMoreButton();
          queueViewportFill();
          if (hasRenderedFirstPage) startAutoScroll();
        }
      }

      // ── Auto-scroll ticker ────────────────────────────────────────────────
      // Slowly advances scrollTop like the games hero list. It pauses whenever
      // the user is likely reading or interacting (hover, focus inside, recent
      // wheel/touch, or a row expanded), pulls the next page in when it reaches
      // the bottom, and loops back to the top once everything is loaded.
      function anyRowExpanded() {
        return !!(bodyEl && bodyEl.querySelector('.result-main-row[aria-expanded="true"]'));
      }

      function shouldPauseAutoScroll(ts) {
        if (!tableWrapEl) return true;
        if (isHoveringScores) return true;
        if (anyRowExpanded()) return true;
        if (tableWrapEl.contains(document.activeElement)) return true;
        return ts < autoScrollPauseUntil;
      }

      function autoScrollTick(ts) {
        if (!autoScrollLastTs) autoScrollLastTs = ts;
        const dt = Math.min(40, ts - autoScrollLastTs);
        autoScrollLastTs = ts;
        if (tableWrapEl && !shouldPauseAutoScroll(ts)) {
          const max = tableWrapEl.scrollHeight - tableWrapEl.clientHeight;
          if (max > 1) {
            let next = tableWrapEl.scrollTop + AUTO_SCROLL_PX_PER_SEC * (dt / 1000);
            if (next >= max - 0.5) {
              if (currentHasMoreResults) {
                loadNextCurrentResults();   // reached the bottom — pull more in
              } else {
                next = 0;                   // fully loaded — loop to the top
              }
            }
            tableWrapEl.scrollTop = next;
          }
        }
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function startAutoScroll() {
        if (autoScrollRaf || prefersReducedMotion || !tableWrapEl) return;
        autoScrollLastTs = 0;
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function initAutoScrollInteractions() {
        if (!tableWrapEl) return;
        tableWrapEl.addEventListener('pointerenter', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = true;
        });
        tableWrapEl.addEventListener('pointerleave', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = false;
        });
        tableWrapEl.addEventListener('wheel', () => {
          autoScrollPauseUntil = performance.now() + 1200;
        }, { passive: true });
        tableWrapEl.addEventListener('touchstart', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
        tableWrapEl.addEventListener('touchmove', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
      }

      async function handleMoreScoresClick() {
        if (isLoadingResults || !currentHasMoreResults) return;
        const firstNewIndex = bodyEl ? bodyEl.querySelectorAll('.result-main-row').length : 0;
        await loadNextCurrentResults();
        const rows = bodyEl ? bodyEl.querySelectorAll('.result-main-row') : [];
        const target = rows[firstNewIndex];
        if (target && tableWrapEl && typeof target.getBoundingClientRect === 'function') {
          const containerTop = tableWrapEl.getBoundingClientRect().top;
          const targetTop = target.getBoundingClientRect().top;
          const destination = tableWrapEl.scrollTop + (targetTop - containerTop);
          // Hold the ticker so the smooth scroll can play out and stay put.
          autoScrollPauseUntil = performance.now() + 2000;
          if (typeof tableWrapEl.scrollTo === 'function') {
            tableWrapEl.scrollTo({ top: destination, behavior: 'smooth' });
          } else {
            tableWrapEl.scrollTop = destination;
          }
        }
      }

      function initScoreLoading() {
        if (scrollSentinelEl && typeof IntersectionObserver === 'function') {
          scrollObserver = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              loadNextCurrentResults();
            }
          }, {
            root: tableWrapEl || null,
            rootMargin: '300px 0px 300px 0px'
          });
          scrollObserver.observe(scrollSentinelEl);
        }
        if (tableWrapEl) tableWrapEl.addEventListener('scroll', scheduleViewportFill, { passive: true });
        window.addEventListener('resize', scheduleViewportFill);
        if (moreScoresBtn) {
          moreScoresBtn.addEventListener('click', handleMoreScoresClick);
        }
        initAutoScrollInteractions();
      }

      function openResultRow(mainRow) {
        if (!mainRow) return;
        collapseAllResultRows(mainRow);
        const detailId = mainRow.getAttribute('aria-controls') || '';
        const detail = detailId ? document.getElementById(detailId) : null;
        const label = mainRow.dataset.resultLabel || 'highlight row';
        if (detail) detail.hidden = false;
        mainRow.setAttribute('aria-expanded', 'true');
        mainRow.setAttribute('aria-label', 'Hide full scoreline for ' + label);
      }

      function initFeaturedLink() {
        if (!featuredEl) return;

        const activateFeatured = () => {
          if (!bodyEl) return;
          const instanceId = featuredEl.getAttribute('data-featured-instance') || '';
          let target = null;
          if (instanceId) {
            const safeId = (window.CSS && typeof CSS.escape === 'function') ? CSS.escape(instanceId) : instanceId;
            target = bodyEl.querySelector('.result-main-row[data-instanceid="' + safeId + '"]');
          }
          if (!target) target = bodyEl.querySelector('.result-main-row');
          if (!target) return;
          openResultRow(target);
          if (typeof target.scrollIntoView === 'function') {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          if (typeof target.focus === 'function') {
            target.focus({ preventScroll: true });
          }
        };

        featuredEl.addEventListener('click', () => {
          if (featuredEl.getAttribute('role') !== 'button') return;
          activateFeatured();
        });
        featuredEl.addEventListener('keydown', (event) => {
          if (featuredEl.getAttribute('role') !== 'button') return;
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          activateFeatured();
        });
      }

      function initHighlightsLightbox() {
        const lightbox = document.getElementById('highlightsLightbox');
        if (!lightbox) return;
        let lastFocused = null;

        function openLightbox() {
          lastFocused = document.activeElement;
          lightbox.hidden = false;
          const closeBtn = lightbox.querySelector('[data-highlights-close]');
          if (closeBtn && typeof closeBtn.focus === 'function') closeBtn.focus();
        }

        function closeLightbox() {
          lightbox.hidden = true;
          if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
          lastFocused = null;
        }

        if (bodyEl) {
          // Anchorman studio box → open the COMING SOON lightbox. (The
          // Highlights button just bubbles to the row's toggle, expanding
          // this row's details panel — no lightbox.)
          bodyEl.addEventListener('click', (event) => {
            if (!event.target || !event.target.closest) return;
            if (event.target.closest('[data-anchor-lightbox]')) {
              event.stopPropagation();
              openLightbox();
            }
          });

          // Keyboard: Enter/Space on the anchorman box opens the lightbox.
          bodyEl.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            if (!event.target || !event.target.closest) return;
            if (event.target.closest('[data-anchor-lightbox]')) {
              event.preventDefault();
              openLightbox();
            }
          });
        }

        lightbox.addEventListener('click', (event) => {
          if (event.target === lightbox || (event.target && event.target.closest('[data-highlights-close]'))) {
            closeLightbox();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
        });
      }

      initFeaturedLink();
      initHighlightsLightbox();
      initScoreLoading();
      initResultsWindow().catch((error) => {
        renderFeatured(null);
        updateMoreButton();
        console.error('[game-results] setup failed', error);
      });
      queueViewportFill();
    }());
  </script>
  <script src="/assets/admin-bridge.js"></script>
</body>
</html>
