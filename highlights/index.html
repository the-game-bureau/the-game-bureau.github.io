      padding: 26px 32px;
      background:
        linear-gradient(95deg,

          rgba(8, 11, 17, 0.82) 34%,
          rgba(8, 11, 17, 0.52) 58%,
          rgba(8, 11, 17, 0.24) 80%,

    body.home-page .game-results-page .hero-grid {
      min-height: 0;
      gap: 18px;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.62fr);
      align-items: stretch;

    body.home-page .game-results-page .hero-headline {

      overflow: hidden;

    body.home-page .results-feature {
      display: grid;
      gap: 8px;
      min-width: 0;
      border-radius: 8px;
    }

    body.home-page .results-feature[role="button"] {

    body.home-page .results-feature[role="button"]:focus-visible {
      outline: 2px solid rgba(245, 180, 97, 0.64);
      outline-offset: 3px;

    body.home-page .results-feature-title {
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--ink);
      font-family: "Big Shoulders Display", "Impact", "Arial Narrow", sans-serif;
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.03;

    body.home-page .results-feature-match {
      display: grid;

      font-size: 0.82rem;

    body.home-page .results-feature-team {

    body.home-page .results-feature-team-label {
      color: var(--muted);

      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;

    body.home-page .results-feature-match strong {
      display: block;
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;

    body.home-page .results-feature-score {

    body.home-page .results-feature-winner {

      max-width: 100%;
      min-height: 26px;
      align-items: center;
      padding: 0 10px;
      border: 1px solid rgba(245, 180, 97, 0.34);
      border-radius: 6px;
      background: rgba(245, 180, 97, 0.12);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    body.home-page .results-shell {
      display: grid;
      gap: 10px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;

    body.home-page .results-table-wrap {
      /* ~5 game rows tall; remaining scores load + scroll within (no visible bar). */

      overflow-y: auto;
      overscroll-behavior: contain;
      -ms-overflow-style: none;
    }

    body.home-page .results-table-wrap::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body.home-page .results-table {
      width: 100%;
      min-width: 0;
      /* Fixed layout: column widths come from the colgroup, never from cell
         content — so expanding a row's detail panel can't reflow the table. */
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0 4px;
    }

    body.home-page .results-table .col-game { width: 26%; }
    body.home-page .results-table .col-team { width: 22%; }
    body.home-page .results-table .col-score { width: 7%; }
    body.home-page .results-table .col-action { width: 16%; }

    body.home-page .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;

    body.home-page .results-table td {
      text-align: left;
      vertical-align: middle;

      border-left: 1px solid var(--line);
      border-radius: 8px 0 0 8px;
    }

    body.home-page .results-table td:last-child {
      border-right: 1px solid var(--line);
      border-radius: 0 8px 8px 0;
    }

    body.home-page .result-main-row {
      cursor: pointer;

      line-clamp: 2;

      font-weight: 800;
      line-height: 1.18;
      overflow: hidden;
      white-space: normal;
      overflow-wrap: anywhere;

      display: grid;
      gap: 3px;
      min-width: 0;

    body.home-page .result-team-label {
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    body.home-page .result-team-name {
      overflow: hidden;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 800;

      font-size: 1.52rem;
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;

    body.home-page .result-winner {

      justify-content: center;

      border: 1px solid rgba(245, 180, 97, 0.34);
      border-radius: 6px;
      background: rgba(245, 180, 97, 0.11);
      color: var(--accent);
      font-size: 0.64rem;
      font-weight: 800;

      border-radius: 6px;
      background: rgba(245, 180, 97, 0.12);
      color: var(--accent);

      font-family: "IBM Plex Mono", monospace;
      font-size: 0.64rem;
      font-weight: 900;

    body.home-page .result-highlights-button:focus-visible {

    body.home-page .result-highlights-button:focus-visible {
      outline: 2px solid rgba(245, 180, 97, 0.64);
      outline-offset: 2px;

    .highlights-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 10, 0.86);
    }

    .highlights-lightbox[hidden] {
      display: none;
    }

    .highlights-lightbox-panel {
      position: relative;
      display: grid;
      gap: 0;
      width: min(780px, 100%);
      max-height: 86vh;
      overflow: auto;
      padding: 18px;
      border: 6px solid #242b37;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 32%),
        linear-gradient(180deg, #111821, #070a10);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.64),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .highlights-lightbox-panel::after {
      content: "";
      justify-self: center;
      width: min(180px, 46%);
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      background: #242b37;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.34);
    }

    .highlights-lightbox-screen {
      display: grid;
      gap: 14px;
      min-width: 0;
      padding: 20px;
      border: 1px solid rgba(245, 180, 97, 0.28);
      border-radius: 10px;
      background:
        radial-gradient(circle at 12% 8%, rgba(245, 180, 97, 0.11), transparent 28%),
        linear-gradient(180deg, rgba(19, 24, 34, 0.98), rgba(8, 11, 17, 0.98));
      box-shadow:
        inset 0 0 0 2px rgba(0, 0, 0, 0.42),
        inset 0 0 34px rgba(0, 0, 0, 0.48);
    }

    .highlights-lightbox-body {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .highlights-lightbox-close {
      position: absolute;
      top: 10px;
      right: 12px;
      display: inline-flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 180, 97, 0.3);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }

    .highlights-lightbox-close:hover,
    .highlights-lightbox-close:focus-visible {
      border-color: rgba(245, 180, 97, 0.6);
      background: rgba(245, 180, 97, 0.14);
    }

    body.home-page .result-detail-panel {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(245, 180, 97, 0.22);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(245, 180, 97, 0.07), rgba(245, 180, 97, 0.02)),
        rgba(10, 13, 20, 0.96);
      box-shadow: var(--shadow-chip);
    }

    body.home-page .highlights-lightbox .result-detail-panel {
      gap: 14px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    body.home-page .result-anchor {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    body.home-page .result-anchor-figure {
      width: 132px;
      cursor: pointer;
      border-radius: 8px;
    }

    body.home-page .highlights-lightbox .result-anchor-figure {
      width: 190px;
      cursor: default;
    }

    body.home-page .result-anchor-figure:focus-visible {
      outline: 2px solid rgba(245, 180, 97, 0.7);
      outline-offset: 2px;
    }

    body.home-page .result-anchor-figure svg {
      display: block;
      width: 100%;
      height: auto;
    }

    body.home-page .anchor-studio-football {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    body.home-page .highlights-lightbox .anchor-mouth {
      transform-box: fill-box;
      transform-origin: center;
      animation: anchorMouthTalk 520ms steps(4, end) infinite;
      will-change: transform;
    }

    @keyframes anchorMouthTalk {
      0%, 100% { transform: scaleY(0.2); }
      24% { transform: scaleY(1.2); }
      48% { transform: scaleY(0.45); }
      72% { transform: scaleY(1.45); }
    }

    body.home-page .result-anchor-bubble {
      position: relative;
      padding: 12px 15px;
      border: 1px solid rgba(245, 180, 97, 0.4);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    /* Speech-bubble tail pointing left toward the anchorman. */
    body.home-page .result-anchor-bubble::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 26px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 10px solid rgba(245, 180, 97, 0.4);
    }

    body.home-page .result-anchor-bubble::after {
      content: "";
      position: absolute;
      left: -8px;
      top: 27px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 9px solid #ffffff;
    }

    body.home-page .result-anchor-line {
      margin: 0;
      color: #14181f;
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.42;
    }

    body.home-page .result-anchor-em {
      color: #a85f00;
      font-weight: 800;
    }

    @media (max-width: 620px) {
      body.home-page .result-anchor-figure {

      .highlights-lightbox {
        align-items: flex-start;
        overflow-y: auto;
      }

      .highlights-lightbox-panel {
        max-height: none;
        padding: 12px;
      }

      .highlights-lightbox-screen {
        padding: 16px;
      }

      body.home-page .highlights-lightbox .result-anchor {
        grid-template-columns: minmax(0, 1fr);
      }

      body.home-page .highlights-lightbox .result-anchor-figure {
        justify-self: center;
        width: min(220px, 72vw);
      }

      body.home-page .highlights-lightbox .result-anchor-bubble::before,
      body.home-page .highlights-lightbox .result-anchor-bubble::after {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.home-page .highlights-lightbox .anchor-mouth {
        animation: none;
      }
    }

    body.home-page .results-empty {
      margin: 0;
      text-align: center;
    }

    body.home-page .more-scores-button {
      justify-self: center;
      min-height: 34px;
      padding: 0 16px;
      border: 1px solid rgba(245, 180, 97, 0.44);
      border-radius: 6px;
      background: rgba(245, 180, 97, 0.12);
      color: var(--accent);
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    body.home-page .more-scores-button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
    }

    body.home-page .more-scores-button:not(:disabled):hover,
    body.home-page .more-scores-button:not(:disabled):focus-visible {
      border-color: rgba(245, 180, 97, 0.72);
      background: rgba(245, 180, 97, 0.2);
    }

    body.home-page .results-sentinel {
      width: 100%;
      height: 1px;
    }

    body.home-page .results-skeleton td {
      color: var(--muted);
    }

    @media (max-width: 980px) {
      body.home-page .game-results-page .hero {
        padding: 24px 28px;
      }

      body.home-page .game-results-page .hero-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      body.home-page .game-results-page .hero-headline {
        font-size: 3rem;
      }

      body.home-page .results-hero-card {
        min-height: 132px;
      }
    }

    @media (max-width: 620px) {
      body.home-page .game-results-page .hero {
        padding: 20px;
      }

      body.home-page .game-results-page .hero-headline {
        font-size: 2.52rem;
      }

      body.home-page .results-shell {
        padding: 0;
      }

      body.home-page .results-feature-match {
        grid-template-columns: minmax(0, 1fr);
      }

      body.home-page .results-feature-score {
        min-width: 0;
        text-align: left;
      }
    }
  </style>

    <header class="site-nav" data-site-nav></header>

    <main class="game-results-page">
      <section class="hero" aria-label="HIGHLIGHTS">
        <div class="hero-grid">
          <div>
            <p class="hero-kicker"><span id="resultsCount">0</span> RECENT GAMES</p>
            <h1 class="hero-headline">HIGHLIGHTS</h1>
            <p class="hero-copy">Kick back and relive your thrill of victory or your agony of defeat.</p>

          <aside class="hero-meta results-hero-card" aria-label="Latest result">

    </div>

      function escapeHtml(value) {

        if (!scrollSentinelEl || !tableWrapEl || typeof scrollSentinelEl.getBoundingClientRect !== 'function') return false;
        const sentinelRect = scrollSentinelEl.getBoundingClientRect();
        const containerRect = tableWrapEl.getBoundingClientRect();
        return sentinelRect.top <= containerRect.bottom + 300;

        if (!tableWrapEl) return false;

            day: 'numeric'

        } catch (error) {
          return '';

      function buildResultsUrl(options) {
        options = options || {};
        const params = [
          'select=' + encodeURIComponent(options.select || RESULT_SELECT),
          'order=created_at.desc,instanceid.desc'
        ];
        (options.filters || []).forEach((filter) => {
          if (!filter || !filter.length) return;
          params.push(encodeURIComponent(filter[0]) + '=' + encodeURIComponent(filter[1]));
        });
        if (Number.isFinite(options.limit)) params.push('limit=' + Math.max(0, options.limit));
        if (Number.isFinite(options.offset) && options.offset > 0) params.push('offset=' + Math.max(0, options.offset));
        const table = options.table || activeResultsTable;
        return SB_URL + '/rest/v1/' + table + '?' + params.join('&');
      }

      function resultHeaders(extra) {
        return Object.assign({
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          Accept: 'application/json'

      function isMissingResultsRelation(status, detail) {
        return status === 404 && /PGRST205|Could not find the table/i.test(String(detail || ''));
      }

      async function fetchResultsResponse(options, fetchOptions) {
        const tables = activeResultsTable === RESULTS_TABLES[0]
          ? RESULTS_TABLES
          : [activeResultsTable].concat(RESULTS_TABLES.filter((table) => table !== activeResultsTable));
        let lastError = null;

        for (const table of tables) {
          const response = await fetch(buildResultsUrl(Object.assign({}, options || {}, { table: table })), fetchOptions || {});
          if (response.ok) {
            activeResultsTable = table;
            return response;
          }

          const detail = await response.text();
          lastError = new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
          if (isMissingResultsRelation(response.status, detail)) continue;
          throw lastError;
        }

        throw lastError || new Error('Could not load highlights.');
      }

      async function fetchResultCount(filters) {
        const response = await fetchResultsResponse({
          select: 'instanceid',
          filters: filters || [],
          limit: 1
        }, {
          headers: resultHeaders({ Prefer: 'count=exact' }),
          cache: 'no-store'
        });
        const range = response.headers && response.headers.get ? response.headers.get('content-range') : '';
        const match = String(range || '').match(/\/(\d+)$/);
        if (match) return Number(match[1]) || 0;
        const rows = await response.json();
        return Array.isArray(rows) ? rows.length : 0;
      }

      async function fetchResultRows(filters, limit, offset) {
        const response = await fetchResultsResponse({
          filters: filters || [],
          limit: limit,
          offset: offset
        }, {
          headers: resultHeaders(),
          cache: 'no-store'
        });
        const rows = await response.json();
        return Array.isArray(rows) ? rows : [];
      }

      async function fetchGameNameMap(rows) {
        const ids = Array.from(new Set((Array.isArray(rows) ? rows : [])
          .map((row) => String(row && row.gameid || '').trim())
          .filter(Boolean)));
        const map = new Map();
        if (!ids.length) return map;

        const url = SB_URL + '/rest/v1/games'
          + '?select=' + encodeURIComponent('id,name')
          + '&id=in.(' + ids.map(quotedInValue).map(encodeURIComponent).join(',') + ')';

        try {
          const response = await fetch(url, {
            headers: {
              apikey: SB_KEY,
              Authorization: 'Bearer ' + SB_KEY,
              Accept: 'application/json'
            },
            cache: 'no-store'
          });
          if (!response.ok) return map;
          const games = await response.json();
          (Array.isArray(games) ? games : []).forEach((game) => {
            const id = String(game && game.id || '').trim();
            const name = String(game && game.name || '').trim();
            if (id && name) map.set(id, name);
          });
        } catch (error) {
          console.warn('[highlights] game name lookup failed', error);
        }
        return map;
      }

        const nameMap = gameNameById || new Map();
        const gameid = row.gameid || '';
        const gameName = nameMap.get(String(gameid))
          || DEMO_GAME_NAMES[String(gameid)]
          || 'Unknown game';
        const tgb = row.tgbteamname || 'Team One';
        const opponent = row.opponentname || 'Opponent';
        const score = formatScore(row.tgbteamscore) + '-' + formatScore(row.opponentscore);
        const winner = row.winnername || 'Pending';
        const tgbNum = Number(row.tgbteamscore);
        const opponentNum = Number(row.opponentscore);
        const scoresComparable = Number.isFinite(tgbNum) && Number.isFinite(opponentNum);
        const tgbLabel = (scoresComparable && tgbNum > opponentNum) ? 'Winner' : 'Opponent';
        const opponentLabel = (scoresComparable && opponentNum > tgbNum) ? 'Winner' : 'Opponent';
        const instanceId = String(row.instanceid == null ? '' : row.instanceid);

            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = false;
            if (bodyEl) bodyEl.innerHTML = '';
            renderFeatured(null);
          }
          return;
        }

        displayedCount += rows.length;
        if (tableWrapEl) tableWrapEl.hidden = false;
        if (emptyEl) emptyEl.hidden = true;
        if (!hasRenderedFirstPage) {
          renderFeatured(rows[0], gameNameById);
          if (bodyEl) bodyEl.innerHTML = '';
          hasRenderedFirstPage = true;
        }

        const html = rows.map((row) => {
          const index = resultRowIndex++;
          const gameid = row.gameid || '';
          const gameName = gameNameById.get(String(gameid))
            || DEMO_GAME_NAMES[String(gameid)]
            || 'Unknown game';
          const tgb = row.tgbteamname || 'Team One';
          const opponent = row.opponentname || 'Opponent';
          const tgbScore = formatScore(row.tgbteamscore);
          const opponentScore = formatScore(row.opponentscore);
          const detailKey = 'highlight-detail-' + index;
          const instanceId = String(row.instanceid == null ? '' : row.instanceid);
          const tgbNum = Number(row.tgbteamscore);
          const opponentNum = Number(row.opponentscore);
          const scoresComparable = Number.isFinite(tgbNum) && Number.isFinite(opponentNum);
          const tgbWins = scoresComparable && tgbNum > opponentNum;
          const opponentWins = scoresComparable && opponentNum > tgbNum;
          const tgbTeamClass = 'result-team' + (tgbWins ? ' is-winner' : '');
          const opponentTeamClass = 'result-team' + (opponentWins ? ' is-winner' : '');
          const tgbLabel = tgbWins ? 'Winner' : 'Opponent';
          const opponentLabel = opponentWins ? 'Winner' : 'Opponent';
          const datePhrase = formatAnchorDate(row.created_at);
          const datePrefix = datePhrase ? ('On ' + escapeHtml(datePhrase) + ', ') : '';
          const lead = datePrefix ? 'the ' : 'The ';
          const gameEm = '<strong class="result-anchor-em">' + escapeHtml(gameName) + '</strong>';
          let anchorLine;
          if (scoresComparable && (tgbWins || opponentWins)) {
            const winnerName = tgbWins ? tgb : opponent;
            const loserName = tgbWins ? opponent : tgb;
            const higher = Math.max(tgbNum, opponentNum);
            const lower = Math.min(tgbNum, opponentNum);
            anchorLine = datePrefix + lead
              + '<strong class="result-anchor-em">' + escapeHtml(winnerName) + '</strong> defeated the '
              + escapeHtml(loserName) + ' by a score of ' + higher + ' to ' + lower
              + ' in the ' + gameEm + ' game.';
          } else {
            anchorLine = datePrefix + lead
              + escapeHtml(tgb) + ' and the ' + escapeHtml(opponent)
              + ' played to a ' + escapeHtml(tgbScore + '-' + opponentScore) + ' draw in the '
              + gameEm + ' game.';
          }
          anchorLine += ' Rumor has it, you can click on the little graphic behind me to see all the highlights for this game.';
          resultDetailsByKey.set(detailKey, {
            html: [
              '<div class="result-detail-panel">',
                '<div class="result-anchor">',
                  '<div class="result-anchor-figure" aria-hidden="true">' + anchorSvg() + '</div>',
                  '<div class="result-anchor-bubble"><p class="result-anchor-line">' + anchorLine + '</p></div>',
                '</div>',
              '</div>'
            ].join('')
          });
          const rowClass = 'result-main-row' + (index % 2 ? ' is-alt' : '');
          return [
            '<tr class="' + rowClass + '" data-result-lightbox data-result-key="' + escapeHtml(detailKey) + '" role="button" tabindex="0" aria-haspopup="dialog" data-instanceid="' + escapeHtml(instanceId) + '" data-result-label="' + escapeHtml(gameName) + '" aria-label="Open score details for ' + escapeHtml(gameName) + '">',
              '<td><span class="result-game-name" title="' + escapeHtml(gameName) + '">' + escapeHtml(gameName) + '</span></td>',
              '<td><span class="' + tgbTeamClass + '"><span class="result-team-label">' + escapeHtml(tgbLabel) + '</span><span class="result-team-name" title="' + escapeHtml(tgb) + '">' + escapeHtml(tgb) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(tgbScore) + '</span></td>',
              '<td><span class="' + opponentTeamClass + '"><span class="result-team-label">' + escapeHtml(opponentLabel) + '</span><span class="result-team-name" title="' + escapeHtml(opponent) + '">' + escapeHtml(opponent) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(opponentScore) + '</span></td>',
              '<td><button type="button" class="result-highlights-button">Highlights</button></td>',
            '</tr>'
          ].join('');
        }).join('');
        bodyEl.insertAdjacentHTML(options.append === false ? 'afterbegin' : 'beforeend', html);
        bindResultLightboxRows();
      }

      async function initResultsWindow() {
        setHeadlineCount(0);
        updateMoreButton();
        resultDetailsByKey.clear();

        currentFilters = [];
        currentTotalCount = await fetchResultCount([]);
        setHeadlineCount(currentTotalCount);

        currentLoadedCount = 0;
        currentHasMoreResults = currentLoadedCount < currentTotalCount;
        if (!currentHasMoreResults) {
          if (bodyEl) bodyEl.innerHTML = '';
          if (tableWrapEl) tableWrapEl.hidden = true;
          if (emptyEl) emptyEl.hidden = false;
          renderFeatured(null);
          hasRenderedFirstPage = true;
          updateMoreButton();
          return;
        }

        await loadNextCurrentResults();
      }

      async function loadNextCurrentResults() {
        if (isLoadingResults || !currentHasMoreResults) return;
        isLoadingResults = true;
        updateMoreButton();
        try {
          const remaining = Math.max(0, currentTotalCount - currentLoadedCount);
          const rows = await fetchResultRows(currentFilters, Math.min(PAGE_SIZE, remaining), currentLoadedCount);
          const gameNameById = await fetchGameNameMap(rows);
          currentLoadedCount += rows.length;
          currentHasMoreResults = rows.length > 0 && currentLoadedCount < currentTotalCount;
          renderRows(rows, gameNameById, { append: true });
          updateMoreButton();
        } catch (error) {
          if (!hasRenderedFirstPage) {
            if (bodyEl) bodyEl.innerHTML = '';
            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = true;
          }
          renderFeatured(null);
          console.error('[game-results] load failed', error);
        } finally {
          isLoadingResults = false;
          updateMoreButton();
          queueViewportFill();
          if (hasRenderedFirstPage) startAutoScroll();
        }
      }

      // ── Auto-scroll ticker ────────────────────────────────────────────────
      // Slowly advances scrollTop like the games hero list. It pauses whenever
      // the user is likely reading or interacting (hover, focus inside, recent
      // wheel/touch, or the score lightbox is open), pulls the next page in when it reaches
      // the bottom, and loops back to the top once everything is loaded.
      function shouldPauseAutoScroll(ts) {
        if (!tableWrapEl) return true;
        if (isHoveringScores) return true;
        if (scoreLightboxIsOpen()) return true;
        if (tableWrapEl.contains(document.activeElement)) return true;
        return ts < autoScrollPauseUntil;
      }

      function autoScrollTick(ts) {
        if (!autoScrollLastTs) autoScrollLastTs = ts;
        const dt = Math.min(40, ts - autoScrollLastTs);
        autoScrollLastTs = ts;
        if (tableWrapEl && !shouldPauseAutoScroll(ts)) {
          const max = tableWrapEl.scrollHeight - tableWrapEl.clientHeight;
          if (max > 1) {
            let next = tableWrapEl.scrollTop + AUTO_SCROLL_PX_PER_SEC * (dt / 1000);
            if (next >= max - 0.5) {
              if (currentHasMoreResults) {
                loadNextCurrentResults();   // reached the bottom — pull more in
              } else {
                next = 0;                   // fully loaded — loop to the top
              }
            }
            tableWrapEl.scrollTop = next;
          }
        }
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function startAutoScroll() {
        if (autoScrollRaf || prefersReducedMotion || !tableWrapEl) return;
        autoScrollLastTs = 0;
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function initAutoScrollInteractions() {
        if (!tableWrapEl) return;
        tableWrapEl.addEventListener('pointerenter', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = true;
        });
        tableWrapEl.addEventListener('pointerleave', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = false;
        });
        tableWrapEl.addEventListener('wheel', () => {
          autoScrollPauseUntil = performance.now() + 1200;
        }, { passive: true });
        tableWrapEl.addEventListener('touchstart', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
        tableWrapEl.addEventListener('touchmove', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
      }

      async function handleMoreScoresClick() {
        if (isLoadingResults || !currentHasMoreResults) return;
        const firstNewIndex = bodyEl ? bodyEl.querySelectorAll('.result-main-row').length : 0;
        await loadNextCurrentResults();
        const rows = bodyEl ? bodyEl.querySelectorAll('.result-main-row') : [];
        const target = rows[firstNewIndex];
        if (target && tableWrapEl && typeof target.getBoundingClientRect === 'function') {
          const containerTop = tableWrapEl.getBoundingClientRect().top;
          const targetTop = target.getBoundingClientRect().top;
          const destination = tableWrapEl.scrollTop + (targetTop - containerTop);
          // Hold the ticker so the smooth scroll can play out and stay put.
          autoScrollPauseUntil = performance.now() + 2000;
          if (typeof tableWrapEl.scrollTo === 'function') {
            tableWrapEl.scrollTo({ top: destination, behavior: 'smooth' });
          } else {
            tableWrapEl.scrollTop = destination;
          }
        }
      }

      function initScoreLoading() {
        if (scrollSentinelEl && typeof IntersectionObserver === 'function') {
          scrollObserver = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              loadNextCurrentResults();
            }
          }, {
            root: tableWrapEl || null,
            rootMargin: '300px 0px 300px 0px'
          });
          scrollObserver.observe(scrollSentinelEl);
        }
        if (tableWrapEl) tableWrapEl.addEventListener('scroll', scheduleViewportFill, { passive: true });
        window.addEventListener('resize', scheduleViewportFill);
        if (moreScoresBtn) {
          moreScoresBtn.addEventListener('click', handleMoreScoresClick);
        }
        initAutoScrollInteractions();
      }

      function initFeaturedLink() {
        if (!featuredEl) return;

        const activateFeatured = () => {
          if (!bodyEl) return;
          const instanceId = featuredEl.getAttribute('data-featured-instance') || '';
          let target = null;
          if (instanceId) {
            const safeId = (window.CSS && typeof CSS.escape === 'function') ? CSS.escape(instanceId) : instanceId;
            target = bodyEl.querySelector('.result-main-row[data-instanceid="' + safeId + '"]');
          }
          if (!target) target = bodyEl.querySelector('.result-main-row');
          if (!target) return;
          openResultLightboxByRow(target);
        };

        featuredEl.addEventListener('click', () => {
          if (featuredEl.getAttribute('role') !== 'button') return;
          activateFeatured();
        });
        featuredEl.addEventListener('keydown', (event) => {
          if (featuredEl.getAttribute('role') !== 'button') return;
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          activateFeatured();
        });
      }

      function initHighlightsLightbox() {
        const lightbox = document.getElementById('highlightsLightbox');
        if (!lightbox) return;

        lightbox.addEventListener('click', (event) => {
          if (event.target === lightbox || (event.target && event.target.closest('[data-highlights-close]'))) {
            closeResultLightbox();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (lightbox.hidden) return;
          if (event.key === 'Escape') closeResultLightbox();
        });
      }

      initFeaturedLink();
      initHighlightsLightbox();
      initScoreLoading();
      initResultsWindow().catch((error) => {
        renderFeatured(null);
        updateMoreButton();
        console.error('[game-results] setup failed', error);
      });
      queueViewportFill();
    }());
  </script>
  <script src="/assets/admin-bridge.js"></script>
</body>
</html>
