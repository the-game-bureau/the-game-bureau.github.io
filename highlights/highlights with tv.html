      let loopEnabled = false;
      let loopSetHeight = 0;

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function setHeadlineCount(value) {
        if (countEl) countEl.textContent = String(Math.max(0, Number(value) || 0));
      }

      function sentinelIsNearViewport() {
        if (!scrollSentinelEl || !tableWrapEl || typeof scrollSentinelEl.getBoundingClientRect !== 'function') return false;
        const sentinelRect = scrollSentinelEl.getBoundingClientRect();
        const containerRect = tableWrapEl.getBoundingClientRect();
        return sentinelRect.top <= containerRect.bottom + 300;
      }

      function pageNeedsMoreRows() {
        if (!tableWrapEl) return false;
        const containerHeight = tableWrapEl.clientHeight || 0;
        if (!containerHeight) return false;
        // Keep loading until the box actually overflows (so scroll can kick in).
        return (tableWrapEl.scrollHeight || 0) <= containerHeight + 40;
      }

      function scheduleViewportFill() {
        if (!currentHasMoreResults || isLoadingResults || fillViewportTimer) return;
        fillViewportTimer = window.setTimeout(() => {
          fillViewportTimer = 0;
          if (currentHasMoreResults && !isLoadingResults && (pageNeedsMoreRows() || sentinelIsNearViewport())) {
            loadNextCurrentResults();
          }
        }, 80);
      }

      function queueViewportFill() {
        if (typeof window.requestAnimationFrame === 'function') {
          window.requestAnimationFrame(() => scheduleViewportFill());
          return;
        }
        scheduleViewportFill();
      }

      function formatScore(value) {
        const number = Number(value);
        return Number.isFinite(number) ? String(number) : '0';
      }

      function formatAnchorDate(value) {
        if (!value) return '';
        try {
          const date = new Date(value);
          if (!Number.isFinite(date.getTime())) return '';
          return new Intl.DateTimeFormat(undefined, {
            weekday: 'long',
            month: 'long',
            day: 'numeric'
          }).format(date);
        } catch (error) {
          return '';
        }
      }

      // Compact "played on" date shown under the game name in each row.
      function formatPlayedDate(value) {
        if (!value) return '';
        try {
          const date = new Date(value);
          if (!Number.isFinite(date.getTime())) return '';
          return new Intl.DateTimeFormat(undefined, {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          }).format(date);
        } catch (error) {
          return '';
        }
      }

      function quotedInValue(value) {
        return '"' + String(value || '').replace(/["\\]/g, '') + '"';
      }

      function buildResultsUrl(options) {
        options = options || {};
        const params = [
          'select=' + encodeURIComponent(options.select || RESULT_SELECT),
          'order=created_at.desc,instanceid.desc'
        ];
        (options.filters || []).forEach((filter) => {
          if (!filter || !filter.length) return;
          params.push(encodeURIComponent(filter[0]) + '=' + encodeURIComponent(filter[1]));
        });
        if (Number.isFinite(options.limit)) params.push('limit=' + Math.max(0, options.limit));
        if (Number.isFinite(options.offset) && options.offset > 0) params.push('offset=' + Math.max(0, options.offset));
        const table = options.table || activeResultsTable;
        return SB_URL + '/rest/v1/' + table + '?' + params.join('&');
      }

      function resultHeaders(extra) {
        return Object.assign({
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          Accept: 'application/json'
        }, extra || {});
      }

      function setHeroPhotoState(state, message) {
        if (heroPhotoTvEl) heroPhotoTvEl.dataset.state = state || 'empty';
        if (heroPhotoSignalEl) heroPhotoSignalEl.textContent = message || '';
      }

      function encodeStoragePath(path) {
        return String(path || '').split('/').map(encodeURIComponent).join('/');
      }

      function publicStorageUrl(bucket, path) {
        const cleanPath = String(path || '').trim();
        if (!cleanPath) return '';
        return SB_URL.replace(/\/+$/, '')
          + '/storage/v1/object/public/'
          + encodeURIComponent(bucket || PHOTO_BUCKET)
          + '/'
          + encodeStoragePath(cleanPath);
      }

      function heroPhotoAlt(row) {
        const label = String((row && row.stop_title) || '').trim();
        return label || '';
      }

      function normalizeHeroPhoto(row) {
        const path = row && (row.thumb_storage_path || row.storage_path);
        const src = publicStorageUrl(row && row.storage_bucket, path);
        if (!src) return null;
        return {
          src: src,
          alt: heroPhotoAlt(row)
        };
      }

      function buildHeroPhotosUrl() {
        return SB_URL + '/rest/v1/photo_submissions?'
          + [
            'select=' + encodeURIComponent(HERO_PHOTO_SELECT),
            'status=eq.approved',
            'order=created_at.desc',
            'limit=' + HERO_PHOTO_LIMIT
          ].join('&');
      }

      function buildGamePhotosUrl(gameId) {
        return SB_URL + '/rest/v1/photo_submissions?'
          + [
            'select=' + encodeURIComponent(HERO_PHOTO_SELECT),
            'status=eq.approved',
            'game_id=' + encodeURIComponent('eq.' + String(gameId || '').trim()),
            'order=created_at.desc',
            'limit=' + GAME_PHOTO_LIMIT
          ].join('&');
      }

      async function fetchApprovedHeroPhotos() {
        const response = await fetch(buildHeroPhotosUrl(), {
          headers: resultHeaders(),
          cache: 'no-store'
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
        }
        const rows = await response.json();
        return Array.isArray(rows) ? rows : [];
      }

      async function fetchApprovedGamePhotos(gameId) {
        const response = await fetch(buildGamePhotosUrl(gameId), {
          headers: resultHeaders(),
          cache: 'no-store'
        });
        if (!response.ok) {
          const detail = await response.text();
          throw new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
        }
        const rows = await response.json();
        return Array.isArray(rows) ? rows : [];
      }

      function clearHeroPhotoTimer() {
        if (!heroPhotoTimer) return;
        window.clearInterval(heroPhotoTimer);
        heroPhotoTimer = 0;
      }

      function startHeroPhotoTimer() {
        clearHeroPhotoTimer();
        if (prefersReducedMotion || heroPhotoSlides.length < 2) return;
        heroPhotoTimer = window.setInterval(() => {
          if (document.hidden) return;
          showHeroPhoto(heroPhotoIndex + 1, false);
        }, HERO_PHOTO_INTERVAL_MS);
      }

      function showHeroPhoto(index, immediate) {
        if (!heroPhotoSlides.length || !heroPhotoImageEls.length) {
          clearHeroPhotoTimer();
          setHeroPhotoState('empty', 'NO SIGNAL');
          return;
        }

        const normalizedIndex = ((Number(index) || 0) % heroPhotoSlides.length + heroPhotoSlides.length) % heroPhotoSlides.length;
        const slide = heroPhotoSlides[normalizedIndex];
        const nextSlot = immediate ? heroPhotoActiveSlot : (heroPhotoActiveSlot + 1) % heroPhotoImageEls.length;
        const nextImg = heroPhotoImageEls[nextSlot];
        const previousImg = heroPhotoImageEls[heroPhotoActiveSlot];
        const token = ++heroPhotoLoadToken;
        nextImg.classList.remove('is-active');
        nextImg.style.visibility = immediate ? '' : 'hidden';
        nextImg.alt = '';

        const activate = () => {
          if (token !== heroPhotoLoadToken) return;
          nextImg.onload = null;
          nextImg.onerror = null;
          nextImg.style.visibility = '';
          nextImg.alt = slide.alt;
          if (immediate) nextImg.style.transition = 'none';
          heroPhotoImageEls.forEach((img, slot) => {
            img.classList.toggle('is-active', slot === nextSlot);
          });
          if (immediate) {
            nextImg.getBoundingClientRect();
            window.setTimeout(() => { nextImg.style.transition = ''; }, 0);
          }
          if (previousImg && previousImg !== nextImg) {
            window.setTimeout(() => {
              if (!previousImg.classList.contains('is-active')) previousImg.removeAttribute('src');
            }, 760);
          }
          heroPhotoActiveSlot = nextSlot;
          heroPhotoIndex = normalizedIndex;
          setHeroPhotoState('ready', '');
        };

        const handleError = () => {
          if (token !== heroPhotoLoadToken) return;
          nextImg.onload = null;
          nextImg.onerror = null;
          nextImg.classList.remove('is-active');
          nextImg.style.visibility = 'hidden';
          nextImg.removeAttribute('src');
          console.warn('[highlights] approved photo failed to load', slide && slide.src);
          heroPhotoSlides.splice(normalizedIndex, 1);
          if (!heroPhotoSlides.length) {
            clearHeroPhotoTimer();
            heroPhotoImageEls.forEach((img) => {
              img.classList.remove('is-active');
              img.removeAttribute('src');
            });
            setHeroPhotoState('empty', 'NO SIGNAL');
            return;
          }
          showHeroPhoto(normalizedIndex % heroPhotoSlides.length, true);
        };

        nextImg.onload = activate;
        nextImg.onerror = handleError;
        if (nextImg.getAttribute('src') !== slide.src) {
          nextImg.src = slide.src;
        } else if (nextImg.complete && nextImg.naturalWidth) {
          activate();
        }
      }

      async function initHeroPhotoTv() {
        if (!heroPhotoTvEl || !heroPhotoImageEls.length) return;
        setHeroPhotoState('loading', '');
        try {
          const rows = await fetchApprovedHeroPhotos();
          heroPhotoSlides = rows.map(normalizeHeroPhoto).filter(Boolean);
          if (!heroPhotoSlides.length) {
            setHeroPhotoState('empty', 'NO SIGNAL');
            return;
          }
          showHeroPhoto(0, true);
          startHeroPhotoTimer();
        } catch (error) {
          console.warn('[highlights] approved photos unavailable', error);
          clearHeroPhotoTimer();
          setHeroPhotoState('empty', 'NO SIGNAL');
        }
      }

      function isMissingResultsRelation(status, detail) {
        return status === 404 && /PGRST205|Could not find the table/i.test(String(detail || ''));
      }

      async function fetchResultsResponse(options, fetchOptions) {
        const tables = activeResultsTable === RESULTS_TABLES[0]
          ? RESULTS_TABLES
          : [activeResultsTable].concat(RESULTS_TABLES.filter((table) => table !== activeResultsTable));
        let lastError = null;

        for (const table of tables) {
          const response = await fetch(buildResultsUrl(Object.assign({}, options || {}, { table: table })), fetchOptions || {});
          if (response.ok) {
            activeResultsTable = table;
            return response;
          }

          const detail = await response.text();
          lastError = new Error('HTTP ' + response.status + (detail ? ' - ' + detail : ''));
          if (isMissingResultsRelation(response.status, detail)) continue;
          throw lastError;
        }

        throw lastError || new Error('Could not load highlights.');
      }

      async function fetchResultCount(filters) {
        const response = await fetchResultsResponse({
          select: 'instanceid',
          filters: filters || [],
          limit: 1
        }, {
          headers: resultHeaders({ Prefer: 'count=exact' }),
          cache: 'no-store'
        });
        const range = response.headers && response.headers.get ? response.headers.get('content-range') : '';
        const match = String(range || '').match(/\/(\d+)$/);
        if (match) return Number(match[1]) || 0;
        const rows = await response.json();
        return Array.isArray(rows) ? rows.length : 0;
      }

      async function fetchResultRows(filters, limit, offset) {
        const response = await fetchResultsResponse({
          filters: filters || [],
          limit: limit,
          offset: offset
        }, {
          headers: resultHeaders(),
          cache: 'no-store'
        });
        const rows = await response.json();
        return Array.isArray(rows) ? rows : [];
      }

      async function fetchGameNameMap(rows) {
        const ids = Array.from(new Set((Array.isArray(rows) ? rows : [])
          .map((row) => String(row && row.gameid || '').trim())
          .filter(Boolean)));
        const map = new Map();
        if (!ids.length) return map;

        const url = SB_URL + '/rest/v1/games'
          + '?select=' + encodeURIComponent('id,name')
          + '&id=in.(' + ids.map(quotedInValue).map(encodeURIComponent).join(',') + ')';

        try {
          const response = await fetch(url, {
            headers: {
              apikey: SB_KEY,
              Authorization: 'Bearer ' + SB_KEY,
              Accept: 'application/json'
            },
            cache: 'no-store'
          });
          if (!response.ok) return map;
          const games = await response.json();
          (Array.isArray(games) ? games : []).forEach((game) => {
            const id = String(game && game.id || '').trim();
            const name = String(game && game.name || '').trim();
            if (id && name) map.set(id, name);
          });
        } catch (error) {
          console.warn('[highlights] game name lookup failed', error);
        }
        return map;
      }

      function scoreLightboxIsOpen() {
        const lightbox = document.getElementById('highlightsLightbox');
        return !!(lightbox && !lightbox.hidden);
      }

      function openResultLightbox(detail, sourceEl) {
        const lightbox = document.getElementById('highlightsLightbox');
        const modalBodyEl = document.getElementById('highlightsLightboxBody');
        if (!lightbox || !modalBodyEl || !detail) return;
        scoreLightboxLastFocused = sourceEl || document.activeElement;
        currentLightboxDetail = detail;
        modalBodyEl.innerHTML = detail.html || '';
        lightbox.hidden = false;
        autoScrollPauseUntil = performance.now() + 5000;
        if (typeof lightbox.focus === 'function') lightbox.focus();
        startScreenRotation(detail);
      }

      function closeResultLightbox() {
        const lightbox = document.getElementById('highlightsLightbox');
        const modalBodyEl = document.getElementById('highlightsLightboxBody');
        if (!lightbox) return;
        lightbox.hidden = true;
        if (modalBodyEl) modalBodyEl.innerHTML = '';
        currentLightboxDetail = null;
        photoGalleryLoadToken += 1;
        stopScreenRotation();
        currentGalleryPhotos = [];
        gallerySelectedIndices = new Set();
        if (scoreLightboxLastFocused && typeof scoreLightboxLastFocused.focus === 'function') {
          scoreLightboxLastFocused.focus({ preventScroll: true });
        }
        scoreLightboxLastFocused = null;
      }

      function renderScoreLightboxDetail() {
        const modalBodyEl = document.getElementById('highlightsLightboxBody');
        if (!modalBodyEl || !currentLightboxDetail) return;
        photoGalleryLoadToken += 1;
        currentGalleryPhotos = [];
        gallerySelectedIndices = new Set();
        modalBodyEl.innerHTML = currentLightboxDetail.html || '';
        startScreenRotation(currentLightboxDetail);
      }

      function galleryShellHtml(title, bodyHtml) {
        return [
          '<div class="highlight-photo-gallery">',
            '<div class="highlight-photo-gallery-head">',
              '<h2 class="highlight-photo-gallery-title">' + escapeHtml(title || 'Highlights') + '</h2>',
              '<button type="button" class="highlight-photo-gallery-back" data-photo-gallery-back>Back</button>',
            '</div>',
            bodyHtml,
          '</div>'
        ].join('');
      }

      function stopScreenRotation() {
        screenRotationToken += 1;
        if (screenRotationTimer) {
          window.clearInterval(screenRotationTimer);
          screenRotationTimer = 0;
        }
      }

      // If the game has approved highlight photos, cycle the over-the-shoulder
      // monitor through the football bumper and each photo in sequence. With no
      // photos, the football bumper is left running on its own.
      async function startScreenRotation(detail) {
        stopScreenRotation();
        const modalBodyEl = document.getElementById('highlightsLightboxBody');
        const lightbox = document.getElementById('highlightsLightbox');
        if (!modalBodyEl || !lightbox || lightbox.hidden || !detail || !detail.gameid) return;
        const footballEl = modalBodyEl.querySelector('.result-screen-football');
        const photoEl = modalBodyEl.querySelector('.result-screen-photo');
        const playEl = modalBodyEl.querySelector('.result-screen-play');
        const watchBtn = modalBodyEl.querySelector('[data-watch-highlights]');
        const emptyNote = modalBodyEl.querySelector('[data-watch-empty]');
        if (!footballEl || !photoEl) return;

        const token = ++screenRotationToken;
        let rows;
        try {
          rows = await fetchApprovedGamePhotos(detail.gameid);
        } catch (error) {
          return;
        }
        if (token !== screenRotationToken || lightbox.hidden) return;
        const photos = rows.map(normalizeHeroPhoto).filter(Boolean);

        // Reveal the "watch highlights" affordances only when photos exist —
        // the play badge on the monitor and the CTA button below the desk.
        if (photos.length) {
          if (playEl) playEl.setAttribute('opacity', '1');
          if (watchBtn) {
            watchBtn.hidden = false;
            watchBtn.textContent = '▶ Watch Highlights · ' + photos.length;
          }
          if (emptyNote) emptyNote.hidden = true;
        } else {
          if (playEl) playEl.setAttribute('opacity', '0');
          if (watchBtn) watchBtn.hidden = true;
          if (emptyNote) emptyNote.hidden = false;
          return; // leave the football bumper running on its own
        }

        // Slide 0 is the football bumper (null); the rest are highlight photos.
        const slides = [null].concat(photos);
        const setImageHref = (src) => {
          photoEl.setAttribute('href', src);
          photoEl.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', src);
        };
        const showSlide = (i) => {
          const slide = slides[((i % slides.length) + slides.length) % slides.length];
          if (slide) {
            setImageHref(slide.src);
            photoEl.setAttribute('opacity', '1');
            footballEl.setAttribute('opacity', '0');
          } else {
            photoEl.setAttribute('opacity', '0');
            footballEl.setAttribute('opacity', '1');
          }
        };

        if (prefersReducedMotion) {
          showSlide(1); // static: rest on the first highlight photo
          return;
        }

        let slideIndex = 0;
        showSlide(slideIndex); // start on the football bumper
        screenRotationTimer = window.setInterval(() => {
          if (token !== screenRotationToken || document.hidden) return;
          slideIndex += 1;
          showSlide(slideIndex);
        }, SCREEN_ROTATION_INTERVAL_MS);
      }

      // Full-res source + a sensible download filename for each highlight photo.
      function normalizeGalleryPhoto(row) {
        const fullPath = row && row.storage_path;
        const path = fullPath || (row && row.thumb_storage_path);
        const src = publicStorageUrl(row && row.storage_bucket, path);
        if (!src) return null;
        const rawName = String((row && row.file_name) || '').trim();
        const fileName = rawName || ('highlight-' + String((row && row.id) || 'photo') + '.jpg');
        return { src: src, alt: heroPhotoAlt(row), fileName: fileName };
      }

      function galleryRoot() {
        return document.getElementById('highlightsLightboxBody');
      }

      function updateDownloadSelectedButton() {
        const root = galleryRoot();
        const btn = root && root.querySelector('[data-download-selected]');
        if (!btn) return;
        const count = gallerySelectedIndices.size;
        btn.disabled = count === 0;
        btn.textContent = count > 0 ? 'Download Selected (' + count + ')' : 'Download Selected';
      }

      function updateCarouselCounter() {
        const root = galleryRoot();
        const viewport = root && root.querySelector('.highlight-carousel-viewport');
        if (!viewport || !currentGalleryPhotos.length) return;
        const idx = Math.round(viewport.scrollLeft / Math.max(1, viewport.clientWidth));
        const clamped = Math.max(0, Math.min(currentGalleryPhotos.length - 1, idx));
        const counter = root.querySelector('[data-carousel-counter]');
        if (counter) counter.textContent = (clamped + 1) + ' / ' + currentGalleryPhotos.length;
        const dots = root.querySelectorAll('[data-carousel-dot]');
        dots.forEach((dot, i) => dot.classList.toggle('is-active', i === clamped));
      }

      function setGalleryStatus(message) {
        const root = galleryRoot();
        const el = root && root.querySelector('[data-gallery-status]');
        if (el) el.textContent = message || '';
      }

      function bindGalleryCarousel() {
        const root = galleryRoot();
        const viewport = root && root.querySelector('.highlight-carousel-viewport');
        if (viewport) viewport.addEventListener('scroll', updateCarouselCounter, { passive: true });
        updateCarouselCounter();
        updateDownloadSelectedButton();
      }

      function carouselScroll(direction) {
        const root = galleryRoot();
        const viewport = root && root.querySelector('.highlight-carousel-viewport');
        const total = currentGalleryPhotos.length;
        if (!viewport || !total) return;
        const current = Math.round(viewport.scrollLeft / Math.max(1, viewport.clientWidth));
        const target = ((current + direction) % total + total) % total;
        // Neighbours glide; a wrap (first→last or last→first) jumps instantly so
        // it doesn't smooth-scroll through every photo in between.
        const isWrap = Math.abs(target - current) > 1;
        carouselGoTo(target, isWrap ? 'auto' : 'smooth');
      }

      function carouselGoTo(index, behavior) {
        const root = galleryRoot();
        const viewport = root && root.querySelector('.highlight-carousel-viewport');
        if (!viewport || !Number.isFinite(index)) return;
        viewport.scrollTo({ left: index * viewport.clientWidth, behavior: behavior || 'smooth' });
      }

      function toggleGallerySelect(button) {
        const index = Number(button.getAttribute('data-carousel-select'));
        if (!Number.isFinite(index)) return;
        if (gallerySelectedIndices.has(index)) {
          gallerySelectedIndices.delete(index);
          button.setAttribute('aria-pressed', 'false');
          button.textContent = 'Select';
        } else {
          gallerySelectedIndices.add(index);
          button.setAttribute('aria-pressed', 'true');
          button.textContent = 'Selected ✓';
        }
        updateDownloadSelectedButton();
      }

      async function downloadOnePhoto(photo) {
        if (!photo || !photo.src) return;
        try {
          const response = await fetch(photo.src, { cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = photo.fileName || 'highlight.jpg';
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 4000);
        } catch (error) {
          // CORS or network failure: open the image so the user can save it.
          window.open(photo.src, '_blank', 'noopener');
        }
      }

      async function downloadPhotos(list) {
        const photos = (Array.isArray(list) ? list : []).filter(Boolean);
        for (let i = 0; i < photos.length; i += 1) {
          await downloadOnePhoto(photos[i]);
          // Stagger so the browser doesn't block the batch as a popup flood.
          if (i < photos.length - 1) await new Promise((resolve) => window.setTimeout(resolve, 350));
        }
      }

      async function downloadSelectedPhotos() {
        const list = Array.from(gallerySelectedIndices)
          .sort((a, b) => a - b)
          .map((i) => currentGalleryPhotos[i])
          .filter(Boolean);
        if (!list.length) return;
        // One photo saves directly; more than one bundles into a zip.
        if (list.length === 1) {
          setGalleryStatus('Downloading 1 photo…');
          await downloadOnePhoto(list[0]);
          setGalleryStatus('Downloaded 1 photo.');
          return;
        }
        const root = galleryRoot();
        const button = root && root.querySelector('[data-download-selected]');
        const detail = currentLightboxDetail || {};
        const base = String(detail.matchup || detail.gameName || 'highlights');
        const zipName = (base.replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '') || 'highlights') + '-selected';
        const originalLabel = button ? button.textContent : '';
        if (button) { button.disabled = true; button.textContent = 'Zipping…'; }
        try {
          await downloadPhotosAsZip(list, zipName);
        } finally {
          if (button) { button.disabled = false; button.textContent = originalLabel || 'Download Selected'; }
        }
      }

      // JSZip is loaded on demand (only when someone hits Download All).
      let jsZipPromise = null;
      function loadJsZip() {
        if (window.JSZip) return Promise.resolve(window.JSZip);
        if (jsZipPromise) return jsZipPromise;
        jsZipPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          script.onload = () => resolve(window.JSZip);
          script.onerror = () => { jsZipPromise = null; reject(new Error('JSZip failed to load')); };
          document.head.appendChild(script);
        });
        return jsZipPromise;
      }

      async function downloadPhotosAsZip(list, zipName) {
        const photos = (Array.isArray(list) ? list : []).filter(Boolean);
        if (!photos.length) return;
        setGalleryStatus('Preparing ' + photos.length + ' photos…');
        let JSZipLib;
        try {
          JSZipLib = await loadJsZip();
        } catch (error) {
          // No zip library — fall back to saving each photo individually.
          setGalleryStatus('Downloading ' + photos.length + ' photos…');
          return downloadPhotos(photos);
        }
        const zip = new JSZipLib();
        const usedNames = new Set();
        let added = 0;
        for (let i = 0; i < photos.length; i += 1) {
          setGalleryStatus('Zipping photo ' + (i + 1) + ' of ' + photos.length + '…');
          try {
            const response = await fetch(photos[i].src, { cache: 'no-store' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const blob = await response.blob();
            let name = photos[i].fileName || ('highlight-' + (i + 1) + '.jpg');
            if (usedNames.has(name)) {
              const dot = name.lastIndexOf('.');
              const base = dot > 0 ? name.slice(0, dot) : name;
              const ext = dot > 0 ? name.slice(dot) : '';
              name = base + '-' + (i + 1) + ext;
            }
            usedNames.add(name);
            zip.file(name, blob);
            added += 1;
          } catch (error) {
            // Skip photos we can't fetch (likely CORS) and keep zipping the rest.
          }
        }
        if (!added) {
          // Couldn't fetch anything to zip — fall back to individual downloads.
          setGalleryStatus('Downloading ' + photos.length + ' photos…');
          return downloadPhotos(photos);
        }
        setGalleryStatus('Building zip…');
        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const link = document.createElement('a');
        link.href = url;
        link.download = (zipName || 'highlights') + '.zip';
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 4000);
        setGalleryStatus('Downloaded ' + added + (added === 1 ? ' photo.' : ' photos.'));
      }

      async function downloadAllPhotos() {
        const root = galleryRoot();
        const button = root && root.querySelector('[data-download-all]');
        const detail = currentLightboxDetail || {};
        const base = String(detail.matchup || detail.gameName || 'highlights');
        const zipName = base.replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '') || 'highlights';
        const originalLabel = button ? button.textContent : '';
        if (button) { button.disabled = true; button.textContent = 'Zipping…'; }
        try {
          await downloadPhotosAsZip(currentGalleryPhotos, zipName);
        } finally {
          if (button) { button.disabled = false; button.textContent = originalLabel || 'Download All'; }
        }
      }

      async function openPhotoGalleryFromDetail(detail) {
        stopScreenRotation();
        currentGalleryPhotos = [];
        gallerySelectedIndices = new Set();
        const modalBodyEl = document.getElementById('highlightsLightboxBody');
        const lightbox = document.getElementById('highlightsLightbox');
        if (!modalBodyEl || !lightbox || lightbox.hidden || !detail || !detail.gameid) return;
        const token = ++photoGalleryLoadToken;
        const title = detail.matchup || detail.gameName || 'Highlights';
        modalBodyEl.innerHTML = galleryShellHtml(title, '<p class="highlight-photo-gallery-empty">Loading highlight photos...</p>');
        try {
          const rows = await fetchApprovedGamePhotos(detail.gameid);
          if (token !== photoGalleryLoadToken || lightbox.hidden) return;
          const photos = rows.map(normalizeGalleryPhoto).filter(Boolean);
          if (!photos.length) {
            modalBodyEl.innerHTML = galleryShellHtml(title, '<p class="highlight-photo-gallery-empty">No highlights yet for this game.</p>');
            return;
          }
          currentGalleryPhotos = photos;
          gallerySelectedIndices = new Set();
          const slides = photos.map((photo, i) => [
            '<figure class="highlight-carousel-slide">',
              '<img src="' + escapeHtml(photo.src) + '" alt="' + escapeHtml(photo.alt || 'Highlight photo') + '" loading="lazy" draggable="false">',
              '<button type="button" class="highlight-carousel-select" data-carousel-select="' + i + '" aria-pressed="false">Select</button>',
            '</figure>'
          ].join('')).join('');
          // Position dots only when the count is small enough to stay legible.
          const dots = photos.length > 1 && photos.length <= 12
            ? '<div class="highlight-carousel-dots" data-carousel-dots>'
                + photos.map((photo, i) =>
                    '<button type="button" class="highlight-carousel-dot' + (i === 0 ? ' is-active' : '') + '" data-carousel-dot="' + i + '" aria-label="Go to photo ' + (i + 1) + '"></button>'
                  ).join('')
                + '</div>'
            : '';
          const carousel = [
            '<div class="highlight-carousel">',
              '<button type="button" class="highlight-carousel-nav highlight-carousel-nav--prev" data-carousel-prev aria-label="Previous photo">‹</button>',
              '<div class="highlight-carousel-viewport">',
                '<div class="highlight-carousel-track">', slides, '</div>',
              '</div>',
              '<button type="button" class="highlight-carousel-nav highlight-carousel-nav--next" data-carousel-next aria-label="Next photo">›</button>',
            '</div>',
            '<p class="highlight-carousel-counter" data-carousel-counter>1 / ' + photos.length + '</p>',
            dots,
            '<div class="highlight-gallery-actions">',
              '<button type="button" class="highlight-gallery-download" data-download-selected disabled>Download Selected</button>',
              '<button type="button" class="highlight-gallery-download highlight-gallery-download--all" data-download-all>Download All</button>',
            '</div>',
            '<p class="highlight-gallery-status" data-gallery-status role="status" aria-live="polite"></p>'
          ].join('');
          modalBodyEl.innerHTML = galleryShellHtml(title, carousel);
          bindGalleryCarousel();
        } catch (error) {
          if (token !== photoGalleryLoadToken || lightbox.hidden) return;
          console.warn('[highlights] game photo gallery unavailable', error);
          modalBodyEl.innerHTML = galleryShellHtml(title, '<p class="highlight-photo-gallery-empty">Could not load highlight photos right now.</p>');
        }
      }

      function openResultLightboxByRow(row) {
        if (!row) return;
        const detail = resultDetailsByKey.get(row.dataset.resultKey || '');
        openResultLightbox(detail, row);
      }

      function bindResultLightboxRows() {
        if (!bodyEl || !bodyEl.querySelectorAll) return;
        bodyEl.querySelectorAll('[data-result-lightbox]:not([data-lightbox-bound="true"])').forEach((row) => {
          row.dataset.lightboxBound = 'true';
          const openRow = () => {
            openResultLightboxByRow(row);
          };
          row.addEventListener('click', openRow);
          row.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            if (event.target && event.target.closest && event.target.closest('button')) return;
            event.preventDefault();
            openRow();
          });
        });
      }

      function renderRows(rows, gameNameById, options) {
        options = options || {};
        gameNameById = gameNameById || new Map();
        if (!Array.isArray(rows) || rows.length === 0) {
          if (!hasRenderedFirstPage) {
            if (countEl) countEl.textContent = '0';
            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = false;
            if (bodyEl) bodyEl.innerHTML = '';
          }
          return;
        }

        displayedCount += rows.length;
        if (tableWrapEl) tableWrapEl.hidden = false;
        if (emptyEl) emptyEl.hidden = true;
        if (!hasRenderedFirstPage) {
          if (bodyEl) bodyEl.innerHTML = '';
          hasRenderedFirstPage = true;
        }

        const html = rows.map((row) => {
          const index = resultRowIndex++;
          const gameid = row.gameid || '';
          const gameName = gameNameById.get(String(gameid))
            || DEMO_GAME_NAMES[String(gameid)]
            || 'Unknown game';
          const tgb = row.tgbteamname || 'Team One';
          const opponent = row.opponentname || 'Opponent';
          const tgbScore = formatScore(row.tgbteamscore);
          const opponentScore = formatScore(row.opponentscore);
          const detailKey = 'highlight-detail-' + index;
          const instanceId = String(row.instanceid == null ? '' : row.instanceid);
          const tgbNum = Number(row.tgbteamscore);
          const opponentNum = Number(row.opponentscore);
          const scoresComparable = Number.isFinite(tgbNum) && Number.isFinite(opponentNum);
          const tgbWins = scoresComparable && tgbNum > opponentNum;
          const opponentWins = scoresComparable && opponentNum > tgbNum;
          const tgbTeamClass = 'result-team' + (tgbWins ? ' is-winner' : '');
          const opponentTeamClass = 'result-team' + (opponentWins ? ' is-winner' : '');
          const tgbLabel = tgbWins ? 'Winner' : 'Opponent';
          const opponentLabel = opponentWins ? 'Winner' : 'Opponent';
          const trophy = '<span class="result-team-trophy" aria-hidden="true">🏆</span>';
          const tgbLabelHtml = (tgbWins ? trophy : '') + escapeHtml(tgbLabel);
          const opponentLabelHtml = (opponentWins ? trophy : '') + escapeHtml(opponentLabel);
          const datePhrase = formatAnchorDate(row.created_at);
          const playedDate = formatPlayedDate(row.created_at);
          const datePrefix = datePhrase ? ('On ' + escapeHtml(datePhrase) + ', ') : '';
          const lead = datePrefix ? 'the ' : 'The ';
          const gameEm = '<strong class="result-anchor-em">' + escapeHtml(gameName) + '</strong>';
          let anchorLine;
          if (scoresComparable && (tgbWins || opponentWins)) {
            const winnerName = tgbWins ? tgb : opponent;
            const loserName = tgbWins ? opponent : tgb;
            const higher = Math.max(tgbNum, opponentNum);
            const lower = Math.min(tgbNum, opponentNum);
            anchorLine = datePrefix + lead
              + '<strong class="result-anchor-em">' + escapeHtml(winnerName) + '</strong> defeated the '
              + escapeHtml(loserName) + ' by a score of ' + higher + ' to ' + lower
              + ' in the ' + gameEm + ' game.';
          } else {
            anchorLine = datePrefix + lead
              + escapeHtml(tgb) + ' and the ' + escapeHtml(opponent)
              + ' played to a ' + escapeHtml(tgbScore + '-' + opponentScore) + ' draw in the '
              + gameEm + ' game.';
          }
          // Winner listed first; a draw keeps the team's own order.
          const matchup = (opponentWins ? opponent : tgb) + ' vs ' + (opponentWins ? tgb : opponent);
          resultDetailsByKey.set(detailKey, {
            gameid: gameid,
            gameName: gameName,
            matchup: matchup,
            html: [
              '<div class="result-detail-panel">',
                '<div class="result-anchor">',
                  '<button type="button" class="result-anchor-figure" data-photo-gallery-trigger data-result-key="' + escapeHtml(detailKey) + '" aria-label="Watch highlights for ' + escapeHtml(gameName) + '">' + anchorSvg(index) + '</button>',
                  '<div class="result-anchor-bubble"><p class="result-anchor-line">' + anchorLine + '</p></div>',
                '</div>',
                // Primary CTA + play badge on the monitor are both revealed by
                // startScreenRotation once we know the game has highlight photos.
                '<button type="button" class="result-watch-btn" data-photo-gallery-trigger data-watch-highlights data-result-key="' + escapeHtml(detailKey) + '" hidden>▶ Watch Highlights</button>',
                '<p class="result-watch-empty" data-watch-empty hidden>No highlights from this game yet.</p>',
              '</div>'
            ].join('')
          });
          const rowClass = 'result-main-row' + (index % 2 ? ' is-alt' : '');
          return [
            '<tr class="' + rowClass + '" data-result-lightbox data-result-key="' + escapeHtml(detailKey) + '" role="button" tabindex="0" aria-haspopup="dialog" data-instanceid="' + escapeHtml(instanceId) + '" data-result-label="' + escapeHtml(gameName) + '" aria-label="Open score details for ' + escapeHtml(gameName) + '">',
              '<td><span class="result-game-name" title="' + escapeHtml(gameName) + '">' + escapeHtml(gameName) + '</span>' + (playedDate ? '<span class="result-game-date">' + escapeHtml(playedDate) + '</span>' : '') + '</td>',
              '<td><span class="' + tgbTeamClass + '"><span class="result-team-label">' + tgbLabelHtml + '</span><span class="result-team-name" title="' + escapeHtml(tgb) + '">' + escapeHtml(tgb) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(tgbScore) + '</span></td>',
              '<td><span class="' + opponentTeamClass + '"><span class="result-team-label">' + opponentLabelHtml + '</span><span class="result-team-name" title="' + escapeHtml(opponent) + '">' + escapeHtml(opponent) + '</span></span></td>',
              '<td><span class="result-score">' + escapeHtml(opponentScore) + '</span></td>',
              '<td><button type="button" class="result-highlights-button">Highlights</button></td>',
            '</tr>'
          ].join('');
        }).join('');
        bodyEl.insertAdjacentHTML(options.append === false ? 'afterbegin' : 'beforeend', html);
        bindResultLightboxRows();
      }

      async function initResultsWindow() {
        setHeadlineCount(0);
        resultDetailsByKey.clear();
        resultRowIndex = 0;

        currentFilters = [];
        currentTotalCount = await fetchResultCount([]);
        setHeadlineCount(currentTotalCount);

        currentLoadedCount = 0;
        currentHasMoreResults = currentLoadedCount < currentTotalCount;
        if (!currentHasMoreResults) {
          if (bodyEl) bodyEl.innerHTML = '';
          if (tableWrapEl) tableWrapEl.hidden = true;
          if (emptyEl) emptyEl.hidden = false;
          hasRenderedFirstPage = true;
          return;
        }

        await loadNextCurrentResults();
      }

      async function loadNextCurrentResults() {
        if (isLoadingResults || !currentHasMoreResults) return;
        isLoadingResults = true;
        try {
          const remaining = Math.max(0, currentTotalCount - currentLoadedCount);
          const rows = await fetchResultRows(currentFilters, Math.min(PAGE_SIZE, remaining), currentLoadedCount);
          const gameNameById = await fetchGameNameMap(rows);
          currentLoadedCount += rows.length;
          currentHasMoreResults = rows.length > 0 && currentLoadedCount < currentTotalCount;
          renderRows(rows, gameNameById, { append: true });
        } catch (error) {
          if (!hasRenderedFirstPage) {
            if (bodyEl) bodyEl.innerHTML = '';
            if (tableWrapEl) tableWrapEl.hidden = true;
            if (emptyEl) emptyEl.hidden = true;
          }
          console.error('[game-results] load failed', error);
        } finally {
          isLoadingResults = false;
          queueViewportFill();
          if (hasRenderedFirstPage) startAutoScroll();
          if (!currentHasMoreResults && hasRenderedFirstPage) {
            // Everything is loaded — wait a frame for layout, then loop it.
            window.requestAnimationFrame(setupInfiniteLoop);
          }
        }
      }

      // ── Infinite loop (both directions) ───────────────────────────────────
      // With every score loaded, triplicate the rows so there is always a full
      // copy above and below the middle copy. Keeping scrollTop inside the middle
      // band lets the user scroll up or down forever with no visible seam.
      function setupInfiniteLoop() {
        if (loopEnabled || !bodyEl || !tableWrapEl || currentHasMoreResults) return;
        const rows = Array.from(bodyEl.querySelectorAll('tr'));
        const originalCount = rows.length;
        if (originalCount < 2) return;
        if (bodyEl.getBoundingClientRect().height <= tableWrapEl.clientHeight + 4) return; // fits; nothing to loop
        const frag = document.createDocumentFragment();
        for (let copy = 0; copy < 2; copy += 1) {
          rows.forEach((row) => {
            const clone = row.cloneNode(true);
            clone.removeAttribute('data-lightbox-bound'); // cloneNode drops listeners
            clone.setAttribute('data-loop-clone', 'true');
            frag.appendChild(clone);
          });
        }
        bodyEl.appendChild(frag);
        bindResultLightboxRows(); // wire clicks on the freshly-cloned rows
        // Exact repeat period = distance from a row to its clone one copy later.
        // (Measuring the tbody height would be off by the table's border-spacing.)
        const allRows = bodyEl.querySelectorAll('tr');
        const period = allRows[originalCount].getBoundingClientRect().top
          - allRows[0].getBoundingClientRect().top;
        if (period <= 0) { // measurement failed — bail rather than loop badly
          bodyEl.querySelectorAll('[data-loop-clone="true"]').forEach((el) => el.remove());
          return;
        }
        loopSetHeight = period;
        loopEnabled = true;
        // All rows are in; the load-more observer has nothing left to trigger.
        if (scrollObserver) scrollObserver.disconnect();
        tableWrapEl.scrollTop = loopSetHeight; // start in the middle copy
        tableWrapEl.addEventListener('scroll', normalizeLoopScroll, { passive: true });
      }

      function normalizeLoopScroll() {
        if (!loopEnabled || loopSetHeight <= 0) return;
        const st = tableWrapEl.scrollTop;
        if (st < loopSetHeight) tableWrapEl.scrollTop = st + loopSetHeight;
        else if (st >= loopSetHeight * 2) tableWrapEl.scrollTop = st - loopSetHeight;
      }

      function teardownInfiniteLoop() {
        if (!loopEnabled) return;
        tableWrapEl.removeEventListener('scroll', normalizeLoopScroll);
        bodyEl.querySelectorAll('[data-loop-clone="true"]').forEach((el) => el.remove());
        loopEnabled = false;
        loopSetHeight = 0;
      }

      // ── Auto-scroll ticker ────────────────────────────────────────────────
      // Slowly advances scrollTop like the games hero list. It pauses whenever
      // the user is likely reading or interacting (hover, focus inside, recent
      // wheel/touch, or the score lightbox is open), pulls the next page in when it reaches
      // the bottom, and loops back to the top once everything is loaded.
      function shouldPauseAutoScroll(ts) {
        if (!tableWrapEl) return true;
        if (isHoveringScores) return true;
        if (scoreLightboxIsOpen()) return true;
        if (tableWrapEl.contains(document.activeElement)) return true;
        return ts < autoScrollPauseUntil;
      }

      function autoScrollTick(ts) {
        if (!autoScrollLastTs) autoScrollLastTs = ts;
        const dt = Math.min(40, ts - autoScrollLastTs);
        autoScrollLastTs = ts;
        if (tableWrapEl && !shouldPauseAutoScroll(ts)) {
          if (loopEnabled) {
            // Just keep advancing; normalizeLoopScroll wraps within the middle band.
            tableWrapEl.scrollTop = tableWrapEl.scrollTop + AUTO_SCROLL_PX_PER_SEC * (dt / 1000);
          } else {
            const max = tableWrapEl.scrollHeight - tableWrapEl.clientHeight;
            if (max > 1) {
              let next = tableWrapEl.scrollTop + AUTO_SCROLL_PX_PER_SEC * (dt / 1000);
              if (next >= max - 0.5) {
                if (currentHasMoreResults) {
                  loadNextCurrentResults();   // reached the bottom — pull more in
                } else {
                  next = 0;                   // fully loaded — loop to the top
                }
              }
              tableWrapEl.scrollTop = next;
            }
          }
        }
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function startAutoScroll() {
        if (autoScrollRaf || prefersReducedMotion || !tableWrapEl) return;
        autoScrollLastTs = 0;
        autoScrollRaf = requestAnimationFrame(autoScrollTick);
      }

      function initAutoScrollInteractions() {
        if (!tableWrapEl) return;
        tableWrapEl.addEventListener('pointerenter', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = true;
        });
        tableWrapEl.addEventListener('pointerleave', (e) => {
          if (e.pointerType === 'mouse') isHoveringScores = false;
        });
        tableWrapEl.addEventListener('wheel', () => {
          autoScrollPauseUntil = performance.now() + 1200;
        }, { passive: true });
        tableWrapEl.addEventListener('touchstart', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
        tableWrapEl.addEventListener('touchmove', () => {
          autoScrollPauseUntil = performance.now() + 1800;
        }, { passive: true });
      }

      function initScoreLoading() {
        if (scrollSentinelEl && typeof IntersectionObserver === 'function') {
          scrollObserver = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              loadNextCurrentResults();
            }
          }, {
            root: tableWrapEl || null,
            rootMargin: '300px 0px 300px 0px'
          });
          scrollObserver.observe(scrollSentinelEl);
        }
        if (tableWrapEl) tableWrapEl.addEventListener('scroll', scheduleViewportFill, { passive: true });
        window.addEventListener('resize', scheduleViewportFill);
        // Row heights + viewport change on resize, so rebuild the loop clones.
        let loopResizeTimer = 0;
        window.addEventListener('resize', () => {
          if (!loopEnabled) return;
          window.clearTimeout(loopResizeTimer);
          loopResizeTimer = window.setTimeout(() => {
            teardownInfiniteLoop();
            window.requestAnimationFrame(setupInfiniteLoop);
          }, 200);
        });
        initAutoScrollInteractions();
        initDragScroll();
      }

      // Click-and-drag scrolling for the score list on desktop (mouse only —
      // touch keeps native fling/momentum). Movement past a few px is treated as
      // a drag, not a click, so a drag never opens a row's highlight lightbox.
      function initDragScroll() {
        if (!tableWrapEl) return;
        let pointerActive = false;
        let dragging = false;
        let capturedPointerId = null;
        let startY = 0;
        let startScrollTop = 0;
        let moved = 0;
        let suppressNextClick = false;

        tableWrapEl.addEventListener('pointerdown', (event) => {
          if (event.pointerType !== 'mouse' || event.button !== 0) return;
          pointerActive = true;
          dragging = false;
          capturedPointerId = null;
          moved = 0;
          startY = event.clientY;
          startScrollTop = tableWrapEl.scrollTop;
          autoScrollPauseUntil = performance.now() + 1200;
        });

        tableWrapEl.addEventListener('pointermove', (event) => {
          if (!pointerActive) return;
          const dy = event.clientY - startY;
          if (Math.abs(dy) > moved) moved = Math.abs(dy);
          if (moved <= 4) return;
          if (!dragging) {
            dragging = true;
            tableWrapEl.classList.add('is-dragging');
            try {
              tableWrapEl.setPointerCapture(event.pointerId);
              capturedPointerId = event.pointerId;
            } catch (error) {}
          }
          tableWrapEl.scrollTop = startScrollTop - dy;
          // Keep a drag inside the middle copy so it loops instead of hitting a
          // floor; shift the drag origin too so the math stays continuous.
          if (loopEnabled && loopSetHeight > 0) {
            if (tableWrapEl.scrollTop < loopSetHeight) {
              tableWrapEl.scrollTop += loopSetHeight;
              startScrollTop += loopSetHeight;
            } else if (tableWrapEl.scrollTop >= loopSetHeight * 2) {
              tableWrapEl.scrollTop -= loopSetHeight;
              startScrollTop -= loopSetHeight;
            }
          }
          autoScrollPauseUntil = performance.now() + 1200;
          event.preventDefault();
        });

        function endDrag(event) {
          if (!pointerActive) return;
          pointerActive = false;
          tableWrapEl.classList.remove('is-dragging');
          if (moved > 4) suppressNextClick = true;
          try {
            if (capturedPointerId != null) tableWrapEl.releasePointerCapture(capturedPointerId);
          } catch (error) {}
          dragging = false;
          capturedPointerId = null;
        }
        tableWrapEl.addEventListener('pointerup', endDrag);
        tableWrapEl.addEventListener('pointercancel', endDrag);
        window.addEventListener('pointerup', endDrag, true);
        window.addEventListener('pointercancel', endDrag, true);

        // Capture-phase so it beats the row click handlers when a drag just ended.
        tableWrapEl.addEventListener('click', (event) => {
          if (!suppressNextClick) return;
          suppressNextClick = false;
          event.stopPropagation();
          event.preventDefault();
        }, true);
      }

      function initHighlightsLightbox() {
        const lightbox = document.getElementById('highlightsLightbox');
        if (!lightbox) return;

        lightbox.addEventListener('click', (event) => {
          if (event.target === lightbox) {
            closeResultLightbox();
            return;
          }
          const backButton = event.target && event.target.closest ? event.target.closest('[data-photo-gallery-back]') : null;
          if (backButton) {
            event.preventDefault();
            renderScoreLightboxDetail();
            return;
          }
          const closest = (selector) => (event.target && event.target.closest ? event.target.closest(selector) : null);
          if (closest('[data-carousel-prev]')) { event.preventDefault(); carouselScroll(-1); return; }
          if (closest('[data-carousel-next]')) { event.preventDefault(); carouselScroll(1); return; }
          const dotButton = closest('[data-carousel-dot]');
          if (dotButton) { event.preventDefault(); carouselGoTo(Number(dotButton.getAttribute('data-carousel-dot'))); return; }
          const selectButton = closest('[data-carousel-select]');
          if (selectButton) { event.preventDefault(); toggleGallerySelect(selectButton); return; }
          if (closest('[data-download-selected]')) { event.preventDefault(); downloadSelectedPhotos(); return; }
          if (closest('[data-download-all]')) { event.preventDefault(); downloadAllPhotos(); return; }
          const galleryTrigger = event.target && event.target.closest ? event.target.closest('[data-photo-gallery-trigger]') : null;
          if (galleryTrigger) {
            event.preventDefault();
            const detailKey = galleryTrigger.getAttribute('data-result-key') || '';
            const detail = resultDetailsByKey.get(detailKey) || currentLightboxDetail;
            openPhotoGalleryFromDetail(detail);
          }
        });

        document.addEventListener('keydown', (event) => {
          if (lightbox.hidden) return;
          if (event.key === 'Escape') closeResultLightbox();
        });
      }

      initHeroPhotoTv();
      initHighlightsLightbox();
      initScoreLoading();
      initResultsWindow().catch((error) => {
        console.error('[game-results] setup failed', error);
      });
      queueViewportFill();
    }());
  </script>
  <script src="/mc/assets/admin-bridge.js"></script>
  <script src="/mc/assets/site-analytics.js" defer></script>
