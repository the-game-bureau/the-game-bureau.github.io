<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css?v=5bed51556d">
<script src="/studio/kit/kit.js?v=5bed51556d"></script>
<script src="/studio/kit/print.js?v=5bed51556d"></script>
<!--
  COVER (Big photo style, from the studio's cover styles). print.js places .cover-front, .cover-back
  and .cover-spine on the printer's spread, with bleed, and pads them to the safe area.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} (photo 1 from Photos & video).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
/* Front: photo 1 fills the whole front to the bleed, title over a dark fade at the bottom. */
.cover-front{background:var(--brand);color:#fff;justify-content:flex-end;overflow:hidden}
.cover-front .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover}
.cover-front .pk-art{position:absolute;right:var(--pad);top:var(--pad);opacity:.5}
.cover-front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0))}
.cover-front .words{position:relative;z-index:1}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cover-front h1{font-size:76pt;line-height:.92;margin-top:8pt;text-transform:uppercase;max-width:6.8in}
.cover-front .sub{font:400 22pt "NB Display",Impact,sans-serif;letter-spacing:.1em;margin-top:8pt;color:#fff;opacity:.9;text-transform:uppercase}
.cover-front .tag{font:600 13pt/1.35 "NB Text",sans-serif;margin:14pt 0 0;max-width:5.8in}

.cover-back{background:var(--paper);color:var(--ink);gap:18pt}
.cover-back h2{font-size:40pt;color:var(--brand)}
.cover-back .tag{font-size:14pt;margin:0;max-width:5.8in}
.cover-back .pk-steps{max-width:5.8in}
.cover-back .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.cover-back .brand{font:400 16pt "NB Display",Impact,sans-serif;letter-spacing:.08em;color:var(--brand)}
.cover-back .url{font:700 11pt "NB Text",sans-serif}
.barcode-space{width:2in;height:1.2in}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  {{image}}
  <div class="words">
    <div class="kick">{{kicker}}</div>
    <h1>{{title}}</h1>
    <div class="sub">{{subtitle}}</div>
    <p class="tag">{{tagline}}</p>
  </div>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <h2>{{title}}</h2>
  <p class="tag">{{tagline}}</p>
  {{steps}}
  {{specs}}
  <div class="foot">
    <div><div class="brand">{{kicker}}</div><div class="url">{{url}}</div></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
