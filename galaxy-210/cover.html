<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css?v=4156bbc417">
<script src="/studio/kit/kit.js?v=4156bbc417"></script>
<script src="/studio/kit/print.js?v=4156bbc417"></script>
<!--
  COVER (Big photo style, from the studio's cover styles). print.js places .cover-front, .cover-back
  and .cover-spine on the printer's spread, with bleed, and pads them to the safe area.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} {{qr}} {{stepsHeading}} (photo 1 from Photos & video).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
/* Front: photo 1 fills the whole front to the bleed, title over a dark fade at the bottom. */
.cover-front{background:var(--brand);color:#fff;justify-content:flex-end;overflow:hidden}
.cover-front .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover}
.cover-front .pk-art{position:absolute;right:var(--pad);top:var(--pad);opacity:.5}
.cover-front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0))}
.cover-front .words{position:relative;z-index:1}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.cover-front h1{font-size:76pt;line-height:.92;margin-top:8pt;text-transform:uppercase;max-width:6.8in}
.cover-front .sub{font:400 22pt "NB Display",Impact,sans-serif;letter-spacing:.1em;margin-top:8pt;color:#fff;opacity:.9;text-transform:uppercase}

/* BACK: "Poster". The main colour to the bleed, photo 1 echoed faintly behind so the wrap
   reads as one piece, then, sitting at the bottom just above the footer, the kicker, the title, the hook in the accent
   colour and the tagline, and a footer band with a QR code to the game page and room for a barcode. */
.cover-back{background:var(--brand);color:#fff;overflow:hidden;gap:0}
.cover-back .bk-echo{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;z-index:0}
.cover-back .bk-echo .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.28}
.cover-back .bk-echo .pk-art{display:none}
.cover-back .bk-echo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--brand) 20%,transparent) 30%,var(--brand) 92%)}
.cover-back>*:not(.bk-echo){position:relative;z-index:1}
.cover-back .bk-kick{margin-top:auto;font:800 9.5pt "NB Text",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cover-back .bk-title{font:400 92pt/.9 "NB Display",Impact,sans-serif;letter-spacing:.01em;text-transform:uppercase;margin-top:10pt;max-width:7in;text-wrap:balance}
.cover-back h2{font-size:40pt;line-height:.95;text-transform:uppercase;color:var(--accent);margin-top:14pt;max-width:6.6in}
.cover-back h2:empty{display:none}
.cover-back h2{text-wrap:balance}
.cover-back .bk-tag{font:500 15pt/1.4 "NB Text",sans-serif;margin:16pt 0 0;max-width:6in}
.cover-back .bk-foot{margin:.4in calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:.22in var(--pad) var(--pad);background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;gap:14pt}
.cover-back .pk-qr{width:1.05in;height:1.05in;color:var(--ink);flex:none}
.cover-back .bk-scan{font:400 10pt/1.35 "NB Text",sans-serif;flex:1}
.cover-back .bk-scan b{display:block;font:400 17pt/1 "NB Display",Impact,sans-serif;letter-spacing:.03em;color:var(--brand);margin-bottom:4pt;text-transform:uppercase}
.cover-back .bk-url{font-weight:800;letter-spacing:.02em}
.barcode-space{width:2in;height:1.2in;flex:none;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  {{image}}
  <div class="words">
    <div class="kick">{{kicker}}</div>
    <h1>{{title}}</h1>
    <div class="sub">{{subtitle}}</div>
  </div>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <div class="bk-echo">{{image}}</div>
  <div class="bk-kick">{{kicker}}</div>
  <div class="bk-title">{{title}}</div>
  <h2>{{subtitle}}</h2>
  <p class="bk-tag">{{tagline}}</p>
  <div class="bk-foot">
    {{qr}}
    <div class="bk-scan"><b>Scan to play along</b>Rules, a how-to-play video and more at<br><span class="bk-url">{{url}}</span></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
