<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Contents</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  CONTENTS: every inside page of the notebook, in order.
  - <section data-rules> is replaced by rules.md and flows onto as many pages as it needs.
  - Each <section class="page"> is one fixed page; its padding keeps content in the safe area.
  - <template data-repeat="N" data-per="2"> repeats its pages N times. Inside it, {{n}} numbers
    the copies (1, 2, 3...) and {{i}} {{i+1}} number the items on each copy (1-2, 3-4...).
    {{sheets}} is print.sheets in game.json (set on the admin page).
  - The free sampler keeps the rules plus the first print.samplerPages pages,
    or only the pages marked data-sampler.
  - Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{url}} {{price}} {{sheets}}.
-->
<style>
.page h2{font-size:28pt;color:var(--brand)}
.page .lede{margin:4pt 0 12pt;font-size:10pt}
.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th,.grid td{border:1pt solid var(--ink);height:.3in;font-size:9pt;text-align:center}
.grid thead th{background:var(--brand);color:#fff;font:400 11pt "NB Display",Impact,sans-serif;letter-spacing:.04em;height:.42in}
.grid th.r{width:.7in;background:color-mix(in srgb,var(--accent) 25%,#fff);color:var(--ink);font:400 11pt "NB Display",Impact,sans-serif}
.grid tfoot th,.grid tfoot td{height:.42in;border-width:2pt}

.sheet{display:flex;flex-direction:column;gap:10pt}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2pt solid var(--ink);padding-bottom:4pt}
.sheet-head .fill{display:flex;gap:16pt;font:800 8pt "NB Text",sans-serif;letter-spacing:.1em}
.sheet-head .fill span{border-bottom:1pt solid var(--ink);min-width:1.3in}
.notes{flex:1;border:1pt solid var(--ink);border-radius:4pt;padding:8pt;font:800 8pt "NB Text",sans-serif;letter-spacing:.1em;
  background:repeating-linear-gradient(transparent 0 .3in,color-mix(in srgb,var(--ink) 25%,transparent) .3in calc(.3in + .6pt))}
</style>
</head>
<body data-page="contents">

<section data-rules></section>

<section class="page">
  <h2>Score Book</h2>
  <p class="lede">Write each player's name at the top of a column. Record every game in its row.</p>
  <table class="grid">
    <thead><tr><th class="r">GAME</th><th>PLAYER 1</th><th>PLAYER 2</th><th>PLAYER 3</th><th>PLAYER 4</th><th>PLAYER 5</th><th>PLAYER 6</th></tr></thead>
    <tbody id="score-rows"></tbody>
    <tfoot><tr><th class="r">TOTAL</th><td></td><td></td><td></td><td></td><td></td><td></td></tr></tfoot>
  </table>
</section>

<template data-repeat="{{sheets}}">
  <section class="page sheet">
    <div class="sheet-head"><h2>GAME {{n}}</h2><div class="fill"><span>DATE</span><span>WINNER</span></div></div>
    <table class="grid">
      <thead><tr><th class="r">ROUND</th><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead>
      <tbody>
        <tr><th class="r">1</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">2</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">3</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">4</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">5</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">6</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">7</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        <tr><th class="r">8</th><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      </tbody>
      <tfoot><tr><th class="r">TOTAL</th><td></td><td></td><td></td><td></td><td></td><td></td></tr></tfoot>
    </table>
    <div class="notes">NOTES</div>
  </section>
</template>

<script>
// Score Book rows: one per game sheet.
(function () {
  const n = 24;
  let rows = '';
  for (let r = 1; r <= n; r++) rows += '<tr><th class="r">' + r + '</th>' + '<td></td>'.repeat(6) + '</tr>';
  document.getElementById('score-rows').innerHTML = rows;
})();
</script>
</body>
</html>
