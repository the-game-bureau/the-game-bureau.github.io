<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER. Design the front and the back here; print.js places them:
    ?layout=spread  back | spine | front, with bleed (the printer's cover PDF)
    ?layout=front   front alone at trim size (first page of the print-at-home and sampler PDFs)
    ?layout=back    back alone at trim size (last page of those PDFs)
  .cover-front and .cover-back fill their panel to the bleed edge, with padding set for you so
  content stays in the safe area. .cover-spine shows only when the spine is wide enough.
  Leave the lower right of the back clear (about 2 x 1.2 in) if the printer adds a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} (photo 1 from Photos & video, or squares until there is one). Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
.cover-front{background:var(--brand);color:#fff;justify-content:space-between}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;color:var(--accent)}
.cover-front h1{font-size:92pt;line-height:.9;margin-top:.2in;text-transform:uppercase;max-width:6.6in}
.cover-front .sub{font:400 26pt "NB Display",Impact,sans-serif;letter-spacing:.12em;margin-top:10pt;color:var(--accent);text-transform:uppercase}
.cover-front .foot{border-top:2pt solid rgba(255,255,255,.7);padding-top:10pt;font:700 13pt "NB Text",sans-serif;max-width:6in}

.cover-back{background:var(--paper);color:var(--ink);gap:18pt}
.cover-back h2{font-size:40pt;color:var(--brand)}
.cover-back .tag{font-size:14pt;margin:0;max-width:5.8in}
.cover-back .pk-steps{max-width:5.8in}
.cover-back .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.cover-back .brand{font:400 16pt "NB Display",Impact,sans-serif;letter-spacing:.08em;color:var(--brand)}
.cover-back .url{font:700 11pt "NB Text",sans-serif}
.barcode-space{width:2in;height:1.2in}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div>
    <div class="kick">The Game Bureau presents</div>
    <h1>{{title}}</h1>
  </div>
  {{image}}
  <div class="foot">{{tagline}}</div>
</div>

<div class="cover-spine">The Game Bureau presents · {{title}}</div>

<div class="cover-back">
  <h2>{{title}}</h2>
  <p class="tag">{{tagline}}</p>
  {{steps}}
  {{specs}}
  <div class="foot">
    <div><div class="brand">The Game Bureau presents {{title}}</div><div class="url">{{url}}</div></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
