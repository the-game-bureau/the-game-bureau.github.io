<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER. Design the front and the back here; print.js places them:
    ?layout=spread  back | spine | front, with bleed (the printer's cover PDF)
    ?layout=front   front alone at trim size (first page of the print-at-home and sampler PDFs)
    ?layout=back    back alone at trim size (last page of those PDFs)
  .cover-front and .cover-back fill their panel to the bleed edge, with padding set for you so
  content stays in the safe area. .cover-spine shows only when the spine is wide enough.
  Leave the lower right of the back clear (about 2 x 1.2 in) if the printer adds a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} {{qr}} {{stepsHeading}} (the photo marked FOR NOTEBOOK COVER in Media, or squares when none is). Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
.cover-front{background:var(--brand);color:#fff;justify-content:space-between}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;color:var(--accent)}
.cover-front h1{font-size:92pt;line-height:.9;margin-top:.2in;text-transform:uppercase;max-width:6.6in}
.cover-front .sub{font:400 26pt "NB Display",Impact,sans-serif;letter-spacing:.12em;margin-top:10pt;color:var(--accent);text-transform:uppercase}
.cover-front .foot{border-top:2pt solid rgba(255,255,255,.7);padding-top:10pt;font:700 13pt "NB Text",sans-serif;max-width:6in}

/* BACK: "Poster". The main colour to the bleed, photo 1 echoed faintly up top so the wrap
   reads as one piece, the hook in the accent colour, three steps as cards, the specs as
   chips, and a white footer band with a QR code to the game page and room for a barcode. */
.cover-back{background:var(--brand);color:#fff;overflow:hidden;gap:0}
.cover-back .bk-echo{position:absolute;left:0;right:0;top:0;height:58%;overflow:hidden;z-index:0}
.cover-back .bk-echo .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.28}
.cover-back .bk-echo .pk-art{display:none}
.cover-back .bk-echo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--brand) 25%,transparent),var(--brand) 96%)}
.cover-back>*:not(.bk-echo){position:relative;z-index:1}
.cover-back .bk-kick{font:800 9.5pt "NB Text",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cover-back h2{font-size:64pt;line-height:.9;text-transform:uppercase;color:var(--accent);margin-top:10pt;max-width:6.6in}
.cover-back h2:empty::before{content:attr(data-title)}
.cover-back h2{text-wrap:balance}
.cover-back .bk-tag{font:500 15pt/1.4 "NB Text",sans-serif;margin:16pt 0 0;max-width:6in}
.cover-back .bk-how{margin-top:auto;padding-top:.3in}
.cover-back .bk-h{font:800 9.5pt "NB Text",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin:0 0 10pt;display:flex;align-items:center;gap:10pt}
.cover-back .bk-h::after{content:"";flex:1;border-top:1.5pt solid color-mix(in srgb,var(--accent) 60%,transparent)}
.cover-back .pk-steps{grid-template-columns:repeat(3,1fr);gap:10pt}
.cover-back .pk-steps li{padding:.62in 12pt 12pt;min-height:0;background:rgba(255,255,255,.08);border:1pt solid rgba(255,255,255,.18);border-radius:8pt;font-size:10pt;line-height:1.35;color:rgba(255,255,255,.88)}
.cover-back .pk-steps li::before{left:12pt;top:12pt;width:.4in;height:.4in;line-height:.4in}
.cover-back .pk-steps b{font-size:17pt;color:#fff;margin-bottom:3pt}
.cover-back .pk-specs{margin-top:12pt;gap:8pt}
.cover-back .pk-specs div{border:1.5pt solid var(--accent);border-radius:99pt;padding:5pt 12pt;font:600 10pt "NB Text",sans-serif}
.cover-back .pk-specs b{display:inline;color:var(--accent);font-size:7.5pt;margin-right:6pt}
.cover-back .bk-foot{margin:.3in calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:.22in var(--pad) var(--pad);background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;gap:14pt}
.cover-back .pk-qr{width:1.05in;height:1.05in;color:var(--ink);flex:none}
.cover-back .bk-scan{font:400 10pt/1.35 "NB Text",sans-serif;flex:1}
.cover-back .bk-scan b{display:block;font:400 17pt/1 "NB Display",Impact,sans-serif;letter-spacing:.03em;color:var(--brand);margin-bottom:4pt;text-transform:uppercase}
.cover-back .bk-url{font-weight:800;letter-spacing:.02em}
.cover-back .bk-brand{font:800 8pt "NB Text",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--brand);margin-top:8pt;opacity:.8}
.barcode-space{width:2in;height:1.2in;flex:none;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div>
    <div class="kick">The Game Bureau presents</div>
    <h1>{{title}}</h1>
  </div>
  {{image}}
  <div class="foot">{{tagline}}</div>
</div>

<div class="cover-spine">The Game Bureau presents · {{title}}</div>

<div class="cover-back">
  <div class="bk-echo">{{image}}</div>
  <div class="bk-kick">{{title}}</div>
  <h2 data-title="{{title}}">{{subtitle}}</h2>
  <p class="bk-tag">{{tagline}}</p>
  <div class="bk-how">
    <div class="bk-h">{{stepsHeading}}</div>
    {{steps}}
    {{specs}}
  </div>
  <div class="bk-foot">
    {{qr}}
    <div class="bk-scan"><b>Scan to play along</b>Rules, a how-to-play video and more at<br><span class="bk-url">{{url}}</span><div class="bk-brand">{{kicker}}</div></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
