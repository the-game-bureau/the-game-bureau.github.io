<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dice Derby · contents</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  CONTENTS: every inside page of the notebook, in order.
  - <section data-rules> is replaced by rules.md (it flows onto as many pages as it needs).
  - Each <section class="page"> is one fixed page. Its padding keeps content inside the safe area.
  - <template data-repeat="N" data-per="2"> repeats its pages N times: {{i}} and {{i+1}} number
    the items on each copy (1-2, 3-4, ...), {{n}} numbers the copies (1, 2, 3, ...).
  - The free sampler keeps the rules plus the first print.samplerPages pages (game.json),
    or only the pages you mark with data-sampler.
  - {{title}} {{subtitle}} {{tagline}} {{url}} {{price}} are filled from game.json.
-->
<style>
.race-page{display:flex;flex-direction:column;justify-content:space-between;gap:.25in}
.race{border:2.5pt solid var(--ink);border-radius:6pt;padding:9pt 11pt 8pt;flex:1;display:flex;flex-direction:column}
.race-head{display:flex;align-items:baseline;gap:14pt;border-bottom:1.5pt solid var(--ink);padding-bottom:5pt;margin-bottom:5pt}
.race-head h2{font-size:26pt;color:var(--brand)}
.race-head .fill{flex:1;display:flex;gap:12pt;font-size:8pt;font-weight:800;letter-spacing:.1em;justify-content:flex-end}
.race-head .fill span{border-bottom:1pt solid var(--ink);min-width:1.2in;padding-bottom:1pt}
.lane-head,.lane{display:grid;grid-template-columns:.42in .95in 1fr .5in;align-items:center;gap:6pt}
.lane-head{font-size:6.5pt;font-weight:800;letter-spacing:.12em;color:#555;padding:0 0 2pt}
.lane-head :last-child{text-align:center}
.lanes{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.lane{height:.3in}
.lane:nth-child(odd){background:color-mix(in srgb,var(--accent) 14%,transparent)}
.num{font:400 15pt/1 "NB Display",Impact,sans-serif;text-align:center;color:#fff;background:var(--brand);border-radius:3pt;padding:3pt 0}
.owner{height:.22in;border:1pt solid var(--ink);background:#fff;border-radius:2pt}
.track{display:flex;align-items:center;gap:3pt;height:100%;border-left:2pt solid var(--ink);padding-left:4pt}
.box{width:.36in;height:.22in;border:1.2pt solid var(--ink);background:#fff;border-radius:2pt}
.box:last-child{border-width:2pt;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/6pt 6pt}
.box:last-child{background-color:#fff}
.finish{margin-left:auto;width:2pt;height:100%;background:var(--ink)}
.pays{font:400 14pt/1 "NB Display",Impact,sans-serif;text-align:center}
.pays small{display:block;font:700 5.5pt "NB Text",sans-serif;letter-spacing:.12em;color:#555}

.stable h1{font-size:30pt;color:var(--brand)}
.stable p{margin:4pt 0 12pt;font-size:9.5pt}
.stable table{width:100%;border-collapse:collapse;table-layout:fixed}
.stable th,.stable td{border:1pt solid var(--ink);height:.27in;font-size:9pt;text-align:center}
.stable thead th{height:.5in;background:var(--brand);color:#fff;font:400 11pt "NB Display",Impact,sans-serif;letter-spacing:.04em;vertical-align:bottom;padding-bottom:3pt}
.stable thead th.name{background:#fff;color:var(--ink);font:600 8pt "NB Text",sans-serif;vertical-align:top;text-align:left;padding:3pt}
.stable th.r,.stable thead th.r{width:.6in;color:var(--ink);font:400 11pt "NB Display",Impact,sans-serif;background:color-mix(in srgb,var(--accent) 22%,#fff)}
.stable tfoot th,.stable tfoot td{height:.4in;border-width:2pt;font:400 13pt "NB Display",Impact,sans-serif}
</style>
</head>
<body data-page="contents">

<section data-rules></section>

<section class="page stable">
  <h1>The Stable Book</h1>
  <p>Write each owner's name at the top of a column. After every race, write the winning owner's points in that race's row. Add them up after the last race.</p>
  <table>
    <thead><tr><th class="r">RACE</th><th>OWNER 1</th><th>OWNER 2</th><th>OWNER 3</th><th>OWNER 4</th><th>OWNER 5</th><th>OWNER 6</th></tr>
    <tr><th class="r">NAME</th><th class="name"></th><th class="name"></th><th class="name"></th><th class="name"></th><th class="name"></th><th class="name"></th></tr></thead>
    <tbody id="stable-rows"></tbody>
    <tfoot><tr><th class="r">TOTAL</th><td></td><td></td><td></td><td></td><td></td><td></td></tr></tfoot>
  </table>
</section>

<template data-repeat="12" data-per="2">
  <section class="page race-page">
    <div class="race" data-race="{{i}}"></div>
    <div class="race" data-race="{{i+1}}"></div>
  </section>
</template>

<script>
// Fill in the repeating parts before print.js lays the pages out.
// Horse: number, boxes to the finish, payout.
const HORSES = [[2,2,6],[3,3,4],[4,5,3],[5,6,2],[6,7,2],[7,8,1],[8,7,2],[9,6,2],[10,5,3],[11,3,4],[12,2,6]];
const race = n => '<div class="race-head"><h2>RACE ' + n + '</h2><div class="fill"><span>WINNER #</span><span>OWNER</span><span>PAYS</span></div></div>' +
  '<div class="lane-head"><span>HORSE</span><span>OWNER</span><span>GATE &rarr; FINISH</span><span>PAYS</span></div><div class="lanes">' +
  HORSES.map(([h, boxes, pays]) => '<div class="lane"><div class="num">' + h + '</div><div class="owner"></div><div class="track">' +
    '<div class="box"></div>'.repeat(boxes) + '</div><div class="pays">' + pays + '</div></div>').join('') + '</div>';
const tpl = document.querySelector('template[data-repeat]');
tpl.innerHTML = tpl.innerHTML.replace(/<div class="race" data-race="(\{\{[^}]+\}\})"><\/div>/g, (m, tag) => '<div class="race">' + race(tag) + '</div>');
let rows = '';
for (let r = 1; r <= 24; r++) rows += '<tr><th class="r">' + r + '</th>' + '<td></td>'.repeat(6) + '</tr>';
document.getElementById('stable-rows').innerHTML = rows;
</script>
</body>
</html>
