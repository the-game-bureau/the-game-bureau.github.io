<!--
  WORD FLEET BATTLE SHEET GENERATOR. Everything it needs is in this one file:
  the word list, the sheet layout and styles, and the code that fills them in.
  It came from the Node book tool in the the-game-bureau/wordfleet repo (publishing/), and
  makes the same sheets in the browser:
  - Five word-ships per sheet (5, 4, 3, 3 and 2 letters), drawn from the common and everyday
    US English words in dictionaries/words.xml, minus the offensive and never-suggested lists
    in dictionaries/en-US.json. That filtered list is WORDS below.
  - Five three-digit launch codes per sheet. No two sheets share a fleet, and no launch code
    is used twice in one edition, so an edition holds at most 200 sheets.
  - GAME picks one of the studio's notebooks (read from GitHub with gh.js). Its title heads every
    sheet and its web address (game.json "url", else thegamebureau.com/<folder>) sits bottom right.
  - SAVE TO WEBSITE commits the edition (the same JSON format as publishing/editions/*.json) to
    <notebook folder>/battle-sheets/<edition>.json on main. The battle-sheet-pdfs workflow then renders
    <edition>.pdf beside it (build-pdf.js opens this page with ?edition=<path>&pdf).
  - SAVED EDITIONS lists what is saved for the chosen notebook, with its PDF, and opens any of them
    again, so a printed batch can be reprinted exactly.
-->
<style>
/* ---------- the page around the sheets ---------- */
.gen-wrap{max-width:1100px;margin:0 auto;padding:16px}
.gen-controls{margin-bottom:18px}
.gen-back{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;text-decoration:none;margin-bottom:10px}
.gen-controls h2{font-size:34px;color:var(--brand)}
.gen-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.gen-row label{display:grid;gap:4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.gen-row select{min-width:240px;max-width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;font:600 16px "NB Text",system-ui,sans-serif}
.gen-row input[type=number]{width:96px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:600 16px "NB Text",system-ui,sans-serif}
.gen-row .nb-btn{min-height:44px}
.gen-saved{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:4px}
.gen-saved h3{margin:0 0 8px;font-size:15px;letter-spacing:.06em}
.gen-saved ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gen-saved li{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.gen-saved li b{min-width:150px}
.gen-saved .nb-btn{min-height:36px;padding:6px 12px;font-size:13px}
#gen-status{margin:14px 0 0}
.gen-sheets{display:grid;justify-content:center;gap:20px}

/* ---------- one battle sheet: a Letter page, 0.5 in margins ---------- */
@page{size:letter;margin:.5in}
.bs-page{box-sizing:border-box;width:8.5in;height:11in;padding:.5in;background:#fff;box-shadow:0 2px 9px rgba(25,47,39,.14)}
.bs-page *,.bs-page *::before,.bs-page *::after{box-sizing:border-box}
.bs-sheet{display:grid;grid-template-rows:5in auto auto;color:#181a18;font:11pt/1.15 Arial,sans-serif;letter-spacing:0}
.bs-head,.bs-foot{display:flex;align-items:baseline;justify-content:space-between;gap:.15in}
.bs-head{margin-bottom:.105in;padding-bottom:.075in;border-bottom:1pt solid;font-size:9pt;font-weight:700}
.bs-head strong{font-size:16pt}
.bs-name{display:flex;align-items:baseline;gap:.1in;margin-bottom:.12in;font-size:9pt;font-weight:700;text-transform:uppercase}
.bs-name-line{width:4.1in;height:.13in;border-bottom:.65pt solid}
.bs-board{display:grid;grid-template-columns:3.93in minmax(0,1fr);gap:.4in}
.bs-defense{padding-top:.2in;border-top:.65pt dashed #8e968e}
.bs-board h3{display:flex;align-items:center;gap:.09in;min-height:.24in;margin:0 0 .05in;font:700 12pt/1.15 Arial,sans-serif;letter-spacing:0;text-transform:uppercase;color:#181a18}
.bs-lengths{display:inline-flex;gap:.055in}
.bs-lengths span{display:grid;place-items:center;width:.185in;height:.185in;border:.7pt solid;border-radius:50%;font-size:8pt}
.bs-words{margin-inline-start:auto;font:700 9pt/1.1 "Courier New",monospace;white-space:nowrap}
.bs-grid{width:100%;table-layout:fixed;border-collapse:collapse;font-size:9pt;text-align:center}
.bs-grid col:first-child{width:.29in}
.bs-grid thead{height:.19in}
.bs-grid tbody tr{height:.354in}
.bs-grid th{padding:0;vertical-align:middle}
.bs-grid tbody td{padding:0;border:.55pt solid #757975}
.bs-grid tbody tr:first-child td{border-top:.9pt solid #1e211e}
.bs-grid tbody tr:last-child td{border-bottom:.9pt solid #1e211e}
.bs-grid tbody td:first-of-type{border-left:.9pt solid #1e211e}
.bs-grid tbody td:last-child{border-right:.9pt solid #1e211e}
.bs-manifest{display:grid;gap:.043in;margin:.15in 0 .12in}
.bs-mrow{display:flex;justify-content:center;gap:.046in}
.bs-cell{position:relative;width:.35in;height:.337in;padding:.038in;border:.55pt solid #757975;font-size:8.5pt}
.bs-cell.vowel{background:linear-gradient(135deg,#dedfde 49%,#9b9f9b 50%,#fff 52%)}
.bs-count{position:absolute;right:.035in;bottom:.035in;font:700 8pt/1 "Courier New",monospace}
.bs-codes{padding:.057in .1in;border:.8pt solid;font-size:8pt;text-transform:uppercase}
.bs-codes div{margin-top:.045in;font:700 10pt/1 "Courier New",monospace;text-align:center;word-spacing:.12in}
.bs-foot{margin-top:.11in;padding-top:.073in;border-top:.55pt solid #757975;color:#444;font-size:8pt}

@media screen{.gen-sheets{zoom:var(--z,1)}}
@media print{
  body.ad-app{background:#fff}
  .ad-top,.gen-controls{display:none}
  .gen-wrap{max-width:none;margin:0;padding:0}
  .gen-sheets{display:block}
  .bs-page{width:auto;height:auto;padding:0;box-shadow:none;break-after:page;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bs-page:last-child{break-after:auto}
}
</style>

WING","SWIPE","SWORN","TABLE","TABOO","TACIT","TAKES","TALES","TALKS","TANKS","TAPES","TARDY","TASKS","TASTE","TAXES","TEACH","TEAMS","TEARS","TEENS","TEETH","TELLS","TEMPO","TENDS","TENSE","TENTH","TENTS","TERMS","TESTS","TEXTS","THANK","THEIR","THEME","THICK","THIEF","THING","THIRD","THREE","THREW","THROW","THUMB","TIDAL","TIGER","TIGHT","TILES","TIMER","TIMES","TIRED","TITLE","TODAY","TOKEN","TOMBS","TONIC","TOOLS","TOOTH","TORCH","TOTAL","TOUCH","TOUGH","TOURS","TOWEL","TOWNS","TOXIC","TRACK","TRADE","TRAIL","TRAIN","TRAIT","TRASH","TREAT","TREES","TREND","TRIAL","TRIBE","TRICK","TRIED","TRIES","TRIPS","TRUCK","TRULY","TRUNK","TRUST","TRUTH","TUBES","TUMOR","TUNES","TURNS","TWIST","TYPED","TYPES","ULTRA","UNCLE","UNION","UNITS","UNITY","UNTIL","UPPER","UPSET","URBAN","URGED","URINE","USAGE","USERS","USING","USUAL","UTTER","VAGUE","VALID","VALUE","VAPOR","VAULT","VENUE","VERSE","VIDEO","VIEWS","VINYL","VIRAL","VIRUS","VISIT","VITAL","VIVID","VOCAL","VOICE","VOTES","WAGES","WAIST","WAITS","WAKES","WALKS","WALLS","WANTS","WARDS","WARMS","WARNS","WASTE","WATCH","WAXED","WEARY","WEEDS","WEEKS","WEIRD","WELLS","WHALE","WHEAT","WHEEL","WHICH","WHIPS","WHITE","WHOLE","WHOSE","WIDOW","WIDTH","WIELD","WINDS","WINES","WINGS","WIPES","WIRED","WIRES","WITCH","WOKEN","WOMAN","WOMEN","WOODS","WORDS","WORKS","WORLD","WORMS","WORRY","WORSE","WORST","WORTH","WOUND","WOVEN","WRAPS","WRIST","WRITE","WRONG","WROTE","YARDS","YEARS","YEAST","YIELD","YOUNG","YOURS","YOUTH","ZEBRA","ZONES"]};

  var LENGTHS = [5, 4, 3, 3, 2];
  var COLUMNS = 'ABCDEFGHIJ';
  var MANIFEST_ROWS = ['ABCD', 'EFG', 'HIJK', 'LMNOP', 'QRS', 'TUV', 'WX', 'YZ'];
  var MAX = 200; // 1,000 launch codes, five per sheet
  var STORE = 'wf-battle-sheets';
  var GAME_STORE = 'wf-battle-sheets-game';
  // Used until the notebook list arrives, and if GitHub can't be reached.
  var FALLBACK = { folder: 'wordfleet2', title: 'WORD FLEET', url: 'thegamebureau.com/wordfleet2' };
  var notebook = FALLBACK, notebooks = [];

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function randomInt(n) {
    // Unbiased random whole number from 0 to n - 1.
    var limit = Math.floor(0x100000000 / n) * n, x = new Uint32Array(1);
    do { crypto.getRandomValues(x); } while (x[0] >= limit);
    return x[0] % n;
  }
  var pick = function (list) { return list[randomInt(list.length)]; };
  var fleetKey = function (words) { return words.slice().sort().join(' '); };

  function createSheets(count) {
    var five = WORDS[5], four = WORDS[4], three = WORDS[3], two = WORDS[2];
    var fleets = new Set(), sheets = [];
    var codes = Array.from({ length: 1000 }, function (_, n) { return String(n).padStart(3, '0'); });
    while (sheets.length < count) {
      var a = pick(three), b;
      do { b = pick(three); } while (b === a);
      var words = [pick(five), pick(four), a, b, pick(two)];
      var key = fleetKey(words);
      if (fleets.has(key)) continue;
      fleets.add(key);
      var sheetCodes = [];
      for (var i = 0; i < 5; i++) sheetCodes.push(codes.splice(randomInt(codes.length), 1)[0]);
      sheets.push({ words: words, codes: sheetCodes });
    }
    return sheets;
  }

  function validateSheets(sheets) {
    if (!Array.isArray(sheets) || !sheets.length || sheets.length > MAX) throw new Error('An edition needs 1 to ' + MAX + ' battle sheets.');
    var fleets = new Set(), codes = new Set();
    sheets.forEach(function (sheet, index) {
      var words = sheet && sheet.words, c = sheet && sheet.codes;
      if (!Array.isArray(words) || words.length !== LENGTHS.length || new Set(words).size !== words.length ||
          !words.every(function (w, i) { return typeof w === 'string' && /^[A-Z]+$/.test(w) && w.length === LENGTHS[i]; })) {
        throw new Error('Sheet ' + (index + 1) + ' has invalid word-ships.');
      }
      if (!Array.isArray(c) || c.length !== 5 || !c.every(function (x) { return typeof x === 'string' && /^\d{3}$/.test(x); })) {
        throw new Error('Sheet ' + (index + 1) + ' has invalid launch codes.');
      }
      fleets.add(fleetKey(words));
      c.forEach(function (x) { codes.add(x); });
    });
    if (fleets.size !== sheets.length || codes.size !== sheets.length * 5) throw new Error('Fleets and launch codes must all be different.');
  }

  function grid(label) {
    var head = COLUMNS.split('').map(function (l) { return '<th scope="col">' + l + '</th>'; }).join('');
    var rows = '';
    for (var r = 1; r <= 10; r++) rows += '<tr><th scope="row">' + r + '</th>' + '<td></td>'.repeat(COLUMNS.length) + '</tr>';
    return '<table class="bs-grid" aria-label="' + label + '"><colgroup><col><col span="10"></colgroup><thead><tr><td></td>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function manifest(counts) {
    return '<div class="bs-manifest">' + MANIFEST_ROWS.map(function (row) {
      return '<div class="bs-mrow">' + row.split('').map(function (l) {
        return '<span class="bs-cell' + ('AEIOU'.indexOf(l) >= 0 ? ' vowel' : '') + '"><strong>' + l + '</strong>' +
          (counts ? '<span class="bs-count">' + (counts[l] || 0) + '</span>' : '') + '</span>';
      }).join('') + '</div>';
    }).join('') + '</div>';
  }

  var titleCase = function (t) { return String(t).toLowerCase().replace(/(^|[\s-])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); };
  // A notebook's web address, the same way the printed notebook works it out (print.js).
  var siteUrl = function (folder, g) { return String((g && g.url) || 'thegamebureau.com/' + folder).replace(/^https?:\/\//, '').replace(/\/$/, ''); };

  function renderSheet(sheet, index) {
    var counts = {};
    sheet.words.join('').split('').forEach(function (l) { counts[l] = (counts[l] || 0) + 1; });
    return '<section class="bs-page" aria-label="Battle sheet ' + (index + 1) + '"><div class="bs-sheet">' +
      '<div><header class="bs-head"><strong>' + esc(String(notebook.title).toUpperCase()) + ' BATTLE TRACKER</strong><span>The ' + esc(titleCase(notebook.title)) + ' Game Notebook</span></header>' +
      '<div class="bs-name"><span>Fleet Name</span><span class="bs-name-line"></span></div>' +
      '<div class="bs-board"><div><h3>Attack Grid <span class="bs-lengths">' + LENGTHS.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</span></h3>' + grid('Attack Grid') + '</div>' +
      '<div><h3>Attack Manifest</h3>' + manifest() + '<div class="bs-codes"><strong>Launch Codes</strong><div>' + esc(sheet.codes.join(' ')) + '</div></div></div></div></div>' +
      '<div class="bs-board bs-defense"><div><h3>Defense Grid <span class="bs-words">' + esc(sheet.words.join(' / ')) + '</span></h3>' + grid('Defense Grid') + '</div>' +
      '<div><h3>Defense Manifest</h3>' + manifest(counts) + '</div></div>' +
      '<footer class="bs-foot"><strong>The Game Bureau</strong><span>' + esc(notebook.url) + '</span></footer>' +
      '</div></section>';
  }

  var edition = null;

  function status(text, kind) { var s = $('#gen-status'); s.textContent = text; s.className = 'ad-status' + (kind ? ' ' + kind : ''); }

  function show(ed, note) {
    edition = ed;
    if (ed.notebook && ed.notebook.title) setNotebook(ed.notebook);
    ed.notebook = notebook;
    $('#gen-count').value = ed.sheets.length;
    $('#gen-sheets').innerHTML = ed.sheets.map(renderSheet).join('');
    fit();
    if (!FORPDF) try { localStorage.setItem(STORE, JSON.stringify(ed)); } catch (e) { /* storage is optional */ }
    var made = ed.made ? ' Made ' + new Date(ed.made).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) + '.' : '';
    status((note ? note + ' ' : '') + 'Edition ' + String(ed.edition || '').toUpperCase() + ': ' + ed.sheets.length + ' battle sheet' + (ed.sheets.length === 1 ? '' : 's') + '.' + made, 'ok');
  }

  function generate() {
    var n = Math.round(Number($('#gen-count').value));
    if (!(n >= 1 && n <= MAX)) { status('Choose 1 to ' + MAX + ' sheets.', 'bad'); return; }
    var sheets = createSheets(n);
    validateSheets(sheets);
    var d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    show({ schema: 1, game: 'word-fleet', notebook: notebook, edition: stamp, made: d.toISOString(), sheets: sheets }, 'New sheets made.');
  }

  // ---------- which notebook the sheets belong to ----------
  function setNotebook(nb) {
    notebook = { folder: nb.folder || '', title: nb.title, url: nb.url || siteUrl(nb.folder, null) };
    try { localStorage.setItem(GAME_STORE, JSON.stringify(notebook)); } catch (e) { /* optional */ }
    fillPicker();
  }
  function fillPicker() {
    var list = notebooks.slice();
    if (!list.some(function (n) { return n.folder === notebook.folder; })) list.unshift(notebook);
    $('#gen-game').innerHTML = list.map(function (n) {
      return '<option value="' + esc(n.folder) + '"' + (n.folder === notebook.folder ? ' selected' : '') + '>' + esc(titleCase(n.title)) + ' (' + esc(n.url) + ')</option>';
    }).join('');
  }
  $('#gen-game').onchange = function () {
    var f = this.value, nb = notebooks.filter(function (n) { return n.folder === f; })[0];
    if (!nb) return;
    setNotebook(nb);
    if (edition) { edition.notebook = notebook; edition.saved = false; show(edition, 'Sheets now say ' + titleCase(nb.title) + '.'); }
    if (!$('#gen-saved').hidden) listSaved();
  };
  if (!new URLSearchParams(location.search).has('pdf')) try { var g0 = JSON.parse(localStorage.getItem(GAME_STORE)); if (g0 && g0.title) notebook = g0; } catch (e) { /* none saved */ }
  if (!new URLSearchParams(location.search).has('pdf')) GH.listGames().then(function (r) {
    notebooks = r.games.filter(function (x) { return !/^(studio|template)(\/|$)/.test(x.folder); }).map(function (x) {
      return { folder: x.folder, title: x.game.title || x.folder, url: siteUrl(x.folder, x.game) };
    }).sort(function (a, b) { return a.title.localeCompare(b.title); });
    // Refresh the saved choice with the notebook's current title and address.
    var now = notebooks.filter(function (n) { return n.folder === notebook.folder; })[0];
    if (now && (now.title !== notebook.title || now.url !== notebook.url)) {
      setNotebook(now);
      if (edition) { edition.notebook = notebook; show(edition); }
    } else fillPicker();
  }).catch(function (e) {
    fillPicker();
    status('Could not list the studio notebooks (' + e.message + '), so only ' + titleCase(notebook.title) + ' is offered.', 'bad');
  });

  function fit() {
    // Letter pages are 8.5 in wide; shrink them to fit narrow screens.
    var room = $('.gen-wrap').clientWidth - 32;
    $('#gen-sheets').style.setProperty('--z', Math.min(1, room / 816).toFixed(3));
  }

  $('#gen-new').onclick = function () {
    if (edition && !edition.saved && !confirm('Make a new set of sheets? These sheets have not been saved to the website.')) return;
    generate();
  };
  $('#gen-print').onclick = function () { window.print(); };
  // ---------- saving to and opening from the website ----------
  var Q = new URLSearchParams(location.search);
  var FORPDF = Q.has('pdf'); // build-pdf.js renders the page this way: no studio, no storage
  var savedDir = function () { return notebook.folder + '/battle-sheets/'; };
  var siteLink = function (path) { return 'https://' + GH.SITE + '/' + path; };
  var needKey = function () {
    if (GH.token()) return false;
    $('#gen-status').innerHTML = 'Saving to the website needs the studio\'s one-time setup. Open <a href="/studio/#connect">Connect</a>, then come back.';
    $('#gen-status').className = 'ad-status bad';
    return true;
  };

  $('#gen-save').onclick = function () {
    if (!edition || needKey()) return;
    if (!notebook.folder) { status('Pick a game first.', 'bad'); return; }
    var btn = this, path = savedDir() + edition.edition + '.json';
    edition.notebook = notebook;
    btn.disabled = true;
    GH.commit([{ path: path, text: JSON.stringify(edition, function (k, v) { return k === 'saved' ? undefined : v; }, 2) + '\n' }],
      'Save ' + titleCase(notebook.title) + ' battle sheets, edition ' + edition.edition, function (t) { status(t); })
      .then(function () {
        edition.saved = true;
        $('#gen-status').innerHTML = 'Saved to the website. The PDF is being made and will be at <a href="' + esc(siteLink(savedDir() + edition.edition + '.pdf')) + '" target="_blank" rel="noopener">' +
          esc(GH.SITE + '/' + savedDir() + edition.edition + '.pdf') + '</a> in about 3 minutes.';
        $('#gen-status').className = 'ad-status ok';
        if (!$('#gen-saved').hidden) listSaved();
      })
      .catch(function (e) { status('Could not save: ' + e.message, 'bad'); })
      .then(function () { btn.disabled = false; });
  };

  function listSaved() {
    var box = $('#gen-saved'), dir = savedDir();
    box.innerHTML = '<p class="ad-help">Looking on the website…</p>';
    GH.listFiles().then(function (files) {
      var pdfs = new Set(files.filter(function (f) { return f.path.indexOf(dir) === 0 && /\.pdf$/.test(f.path); }).map(function (f) { return f.path; }));
      var eds = files.filter(function (f) { return f.path.indexOf(dir) === 0 && /^[^/]+\.json$/.test(f.path.slice(dir.length)); })
        .sort(function (a, b) { return b.path.localeCompare(a.path); });
      box.innerHTML = '<h3>SAVED ' + esc(String(notebook.title).toUpperCase()) + ' EDITIONS</h3>' + (eds.length ? '<ul>' + eds.map(function (f) {
        var name = f.path.slice(dir.length).replace(/\.json$/, ''), pdf = dir + name + '.pdf';
        return '<li><b>' + esc(name.toUpperCase()) + '</b><button type="button" class="nb-btn" data-open="' + esc(f.sha) + '" data-name="' + esc(name) + '">OPEN</button>' +
          (pdfs.has(pdf) ? '<a class="nb-btn" href="' + esc(siteLink(pdf)) + '" target="_blank" rel="noopener">PDF</a>' : '<span class="ad-help">PDF still being made</span>') + '</li>';
      }).join('') + '</ul>' : '<p class="ad-help">Nothing saved for this game yet. Make sheets, then SAVE TO WEBSITE.</p>');
      box.querySelectorAll('[data-open]').forEach(function (b) {
        b.onclick = function () {
          if (edition && !edition.saved && !confirm('Open the saved edition? The sheets on screen have not been saved to the website.')) return;
          GH.readBlobText(b.dataset.open).then(function (t) {
            var ed = JSON.parse(t);
            validateSheets(ed.sheets);
            ed.saved = true;
            show(ed, 'Opened ' + b.dataset.name.toUpperCase() + ' from the website.');
          }).catch(function (e) { status('Could not open it: ' + e.message, 'bad'); });
        };
      });
    }).catch(function (e) { box.innerHTML = '<p class="ad-help">Could not look on the website: ' + esc(e.message) + '</p>'; });
  }
  $('#gen-load').onclick = function () {
    var box = $('#gen-saved'), open = box.hidden;
    box.hidden = !open; this.setAttribute('aria-expanded', String(open));
    if (open) listSaved();
  };
  addEventListener('resize', fit);

  if (Q.get('edition')) {
    // ?edition=<path from the site root>: show that saved edition (build-pdf.js uses this).
    fetch('/' + Q.get('edition').replace(/^\/+/, ''), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (ed) { validateSheets(ed.sheets); ed.saved = true; show(ed); document.body.dataset.ready = '1'; })
      .catch(function (e) { status('Could not open ' + Q.get('edition') + ': ' + e.message, 'bad'); document.body.dataset.ready = 'error'; });
    return;
  }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE)); validateSheets(saved.sheets); } catch (e) { saved = null; }
  if (saved) show(saved, 'Showing your last edition.'); else generate();
})();
</script>
