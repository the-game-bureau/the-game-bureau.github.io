<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER (Bold title style, from the studio's cover styles). print.js places .cover-front, .cover-back
  and .cover-spine on the printer's spread, with bleed, and pads them to the safe area.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} {{qr}} {{stepsHeading}} (photo 1 from Photos & video).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
/* Front: accent colour with a giant title, a band of the main colour and a framed photo. */
.cover-front{background:var(--accent);color:var(--ink);gap:14pt}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.cover-front h1{font-size:96pt;line-height:.9;text-transform:uppercase}
.cover-front .band{background:var(--brand);color:#fff;margin:0 calc(-1 * var(--pad));padding:10pt var(--pad);font:400 24pt "NB Display",Impact,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.cover-front .band:empty{display:none}
.cover-front .pk-image{border:4pt solid var(--ink);border-radius:0;margin:0}
.cover-front .pk-art{margin-top:auto}
.cover-front .pk-art i{border-color:var(--ink)}
.cover-front .pk-art i:nth-child(3n){background:var(--brand);border-color:var(--brand)}
.cover-front .tag{font:700 12pt/1.35 "NB Text",sans-serif;margin:auto 0 0;max-width:6in}

/* BACK: "Poster". The main colour to the bleed, photo 1 echoed faintly behind so the wrap
   reads as one piece, the kicker at the very top, then the title, the hook in the accent
   colour and the tagline, and a footer band with a QR code to the game page and room for a barcode. */
.cover-back{background:var(--brand);color:#fff;overflow:hidden;gap:0}
.cover-back .bk-echo{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;z-index:0}
.cover-back .bk-echo .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.28}
.cover-back .bk-echo .pk-art{display:none}
.cover-back .bk-echo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--brand) 20%,transparent) 30%,var(--brand) 92%)}
.cover-back>*:not(.bk-echo){position:relative;z-index:1}
.cover-back .bk-kick{font:800 9.5pt "NB Text",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cover-back .bk-title{font:400 30pt/1 "NB Display",Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-top:.45in}
.cover-back h2{font-size:64pt;line-height:.9;text-transform:uppercase;color:var(--accent);margin-top:10pt;max-width:6.6in}
.cover-back h2:empty::before{content:attr(data-title)}
.cover-back .bk-title:has(+ h2:empty){display:none}
.cover-back h2{text-wrap:balance}
.cover-back .bk-tag{font:500 15pt/1.4 "NB Text",sans-serif;margin:16pt 0 0;max-width:6in}
.cover-back .bk-foot{margin:auto calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:.22in var(--pad) var(--pad);background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;gap:14pt}
.cover-back .pk-qr{width:1.05in;height:1.05in;color:var(--ink);flex:none}
.cover-back .bk-scan{font:400 10pt/1.35 "NB Text",sans-serif;flex:1}
.cover-back .bk-scan b{display:block;font:400 17pt/1 "NB Display",Impact,sans-serif;letter-spacing:.03em;color:var(--brand);margin-bottom:4pt;text-transform:uppercase}
.cover-back .bk-url{font-weight:800;letter-spacing:.02em}
.barcode-space{width:2in;height:1.2in;flex:none;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div class="kick">{{kicker}}</div>
  <h1>{{title}}</h1>
  <div class="band">{{subtitle}}</div>
  {{image}}
  <p class="tag">{{tagline}}</p>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <div class="bk-echo">{{image}}</div>
  <div class="bk-kick">{{kicker}}</div>
  <div class="bk-title">{{title}}</div>
  <h2 data-title="{{title}}">{{subtitle}}</h2>
  <p class="bk-tag">{{tagline}}</p>
  <div class="bk-foot">
    {{qr}}
    <div class="bk-scan"><b>Scan to play along</b>Rules, a how-to-play video and more at<br><span class="bk-url">{{url}}</span></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
