<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER (Bold title style, from the studio's cover styles). print.js places .cover-front, .cover-back
  and .cover-spine on the printer's spread, with bleed, and pads them to the safe area.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} (photo 1 from Photos & video).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
/* Front: accent colour with a giant title, a band of the main colour and a framed photo. */
.cover-front{background:var(--accent);color:var(--ink);gap:14pt}
.cover-front .kick{font:800 10pt "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.cover-front h1{font-size:96pt;line-height:.9;text-transform:uppercase}
.cover-front .band{background:var(--brand);color:#fff;margin:0 calc(-1 * var(--pad));padding:10pt var(--pad);font:400 24pt "NB Display",Impact,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.cover-front .band:empty{display:none}
.cover-front .pk-image{border:4pt solid var(--ink);border-radius:0;margin:0}
.cover-front .pk-art{margin-top:auto}
.cover-front .pk-art i{border-color:var(--ink)}
.cover-front .pk-art i:nth-child(3n){background:var(--brand);border-color:var(--brand)}
.cover-front .tag{font:700 12pt/1.35 "NB Text",sans-serif;margin:auto 0 0;max-width:6in}

.cover-back{background:var(--brand);color:#fff;gap:18pt}
.cover-back h2{font-size:44pt;color:#fff;text-transform:uppercase}
.cover-back .tag{font-size:14pt;margin:0;max-width:5.8in}
.cover-back .pk-steps{max-width:5.8in}
.cover-back .pk-specs b{color:rgba(255,255,255,.7)}
.cover-back .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.cover-back .brand{font:400 16pt "NB Display",Impact,sans-serif;letter-spacing:.08em;color:#fff}
.cover-back .url{font:700 11pt "NB Text",sans-serif}
.barcode-space{width:2in;height:1.2in;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div class="kick">{{kicker}}</div>
  <h1>{{title}}</h1>
  <div class="band">{{subtitle}}</div>
  {{image}}
  <p class="tag">{{tagline}}</p>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <h2>{{title}}</h2>
  <p class="tag">{{tagline}}</p>
  {{steps}}
  {{specs}}
  <div class="foot">
    <div><div class="brand">{{kicker}}</div><div class="url">{{url}}</div></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
