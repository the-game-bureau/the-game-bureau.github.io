<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER (Framed style, from the studio's cover styles). Design the front and the back here; print.js places them:
    ?layout=spread  back | spine | front, with bleed (the printer's cover PDF)
    ?layout=front   front alone at trim size (first page of the print-at-home and sampler PDFs; the sampler adds its stamp on top)
    ?layout=back    back alone at trim size (last page of those PDFs)
  .cover-front and .cover-back fill their panel to the bleed edge, with padding set for you so
  words stay in the safe area. Pictures may run to the bleed; words never leave the padding.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} {{qr}} {{stepsHeading}}
  ({{image}} is the photo marked FOR NOTEBOOK COVER in Media, or a pattern of squares when none is).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink), plus var(--on-brand) and var(--on-accent)
  (white or ink, whichever reads on that colour) and var(--brand-ink) (the main colour, or ink when it is too pale on paper).
  Type on every style: kicker 10pt Text caps, title in Display caps, subtitle 24pt Display caps, web address 9pt.
-->
<style>
/* Front: a vintage poster. Paper colour, a double rule frame in the main colour, everything centred, the photo in a window. */
.cover-front .kick{font:800 10pt/1.2 "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.cover-front h1{line-height:.9;text-transform:uppercase;text-wrap:balance;overflow-wrap:break-word}
.cover-front .sub{font:400 24pt/1.05 "NB Display",Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-wrap:balance}
.cover-front .kick:empty,.cover-front .sub:empty{display:none}
.cover-front .pk-url{font:700 9pt/1.2 "NB Text",sans-serif;letter-spacing:.06em;margin-top:auto;padding-top:12pt;opacity:.85}
.cover-front{background:var(--paper);color:var(--ink);align-items:stretch;text-align:center}
.cover-front .frame{flex:1;display:flex;flex-direction:column;align-items:center;padding:.32in .4in;border:5pt solid var(--brand);box-shadow:inset 0 0 0 4pt var(--paper),inset 0 0 0 5.5pt var(--brand)}
.cover-front .kick{color:var(--brand-ink);display:flex;align-items:center;gap:10pt}
.cover-front .kick::before,.cover-front .kick::after{content:"";width:.5in;border-top:1.5pt solid var(--accent)}
.cover-front h1{font-size:80pt;margin-top:12pt;color:var(--brand-ink);max-width:6.4in}
.cover-front .sub{margin-top:10pt;font-size:20pt}
.cover-front .pk-image{flex:1 1 0;min-height:2in;max-height:none;width:100%;margin:.3in 0 0;border-radius:0;border:2pt solid var(--brand)}
.cover-front .pk-art{flex:1;align-content:center;justify-content:center;margin-top:.3in;}
.cover-front .pk-art i{border-color:var(--brand)}
.cover-front .pk-url{flex:none;padding-top:10pt;color:var(--brand-ink)}

/* BACK: "Poster". The main colour to the bleed, photo 1 echoed faintly behind so the wrap
   reads as one piece, then, sitting at the bottom just above the footer, the kicker, the title, the hook in the accent
   colour and the tagline, and a footer band with a QR code to the game page and room for a barcode. */
.cover-back{background:var(--brand);color:var(--on-brand);overflow:hidden;gap:0}
.cover-back .bk-echo{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;z-index:0}
.cover-back .bk-echo .pk-image{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:luminosity;opacity:.28}
.cover-back .bk-echo .pk-art{display:none}
.cover-back .bk-echo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--brand) 20%,transparent) 30%,var(--brand) 92%)}
.cover-back>*:not(.bk-echo){position:relative;z-index:1}
.cover-back .bk-kick{margin-top:auto;font:800 10pt/1.2 "NB Text",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:color-mix(in srgb,var(--on-brand) 80%,transparent)}
.cover-back .bk-kick:empty{display:none}
.cover-back .bk-title{font:400 92pt/.9 "NB Display",Impact,sans-serif;letter-spacing:.01em;text-transform:uppercase;margin-top:10pt;max-width:7in;text-wrap:balance}
.cover-back h2{font-size:40pt;line-height:.95;text-transform:uppercase;color:var(--accent);margin-top:14pt;max-width:6.6in;text-wrap:balance}
.cover-back h2:empty{display:none}
.cover-back .bk-tag{font:500 15pt/1.4 "NB Text",sans-serif;margin:16pt 0 0;max-width:6in}
.cover-back .bk-tag:empty{display:none}
.cover-back .bk-foot{margin:.4in calc(-1 * var(--pad)) calc(-1 * var(--pad));padding:.22in var(--pad) var(--pad);background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;gap:14pt}
.cover-back .pk-qr{width:1.05in;height:1.05in;color:var(--ink);flex:none}
.cover-back .bk-scan{font:400 10pt/1.35 "NB Text",sans-serif;flex:1}
.cover-back .bk-scan b{display:block;font:400 17pt/1 "NB Display",Impact,sans-serif;letter-spacing:.03em;color:var(--brand-ink);margin-bottom:4pt;text-transform:uppercase}
.cover-back .bk-url{font-weight:800;letter-spacing:.02em}
.barcode-space{width:2in;height:1.2in;flex:none;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div class="frame">
    <div class="kick">{{kicker}}</div>
    <h1>{{title}}</h1>
    <div class="sub">{{subtitle}}</div>
    {{image}}
  </div>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <div class="bk-echo">{{image}}</div>
  <div class="bk-kick">{{kicker}}</div>
  <div class="bk-title">{{title}}</div>
  <h2>{{subtitle}}</h2>
  <p class="bk-tag">{{tagline}}</p>
  <div class="bk-foot">
    {{qr}}
    <div class="bk-scan"><b>Scan to play along</b>Rules, a how-to-play video and more at<br><span class="bk-url">{{url}}</span></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
