<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cover</title>
<link rel="stylesheet" href="/studio/kit/print.css">
<script src="/studio/kit/kit.js"></script>
<script src="/studio/kit/print.js"></script>
<!--
  COVER (Notebook style, from the studio's cover styles). print.js places .cover-front, .cover-back
  and .cover-spine on the printer's spread, with bleed, and pads them to the safe area.
  Leave the lower right of the back clear (about 2 x 1.2 in) for a barcode.
  Filled from game.json: {{title}} {{subtitle}} {{tagline}} {{kicker}} {{url}} {{price}},
  and as HTML: {{steps}} {{specs}} {{description}} {{image}} (photo 1 from Photos & video).
  Colours: var(--brand) var(--accent) var(--paper) var(--ink).
-->
<style>
/* Front: ruled notebook paper with a margin line and a label for the title. */
.cover-front,.cover-back{background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(90deg,transparent 1.05in,color-mix(in srgb,var(--accent) 80%,#d33) 1.05in,color-mix(in srgb,var(--accent) 80%,#d33) calc(1.05in + 1.5pt),transparent calc(1.05in + 1.5pt)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(.34in - 1pt),color-mix(in srgb,var(--brand) 35%,transparent) calc(.34in - 1pt),color-mix(in srgb,var(--brand) 35%,transparent) .34in);
  background-position:0 0,0 .9in}
.cover-front{justify-content:center;align-items:center;gap:22pt}
.cover-front .label{background:#fff;border:3pt solid var(--brand);border-radius:14pt;padding:22pt 28pt;text-align:center;width:5.6in;box-shadow:4pt 4pt 0 var(--brand)}
.cover-front .kick{font:800 9pt "NB Text",sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--brand)}
.cover-front h1{font-size:58pt;line-height:.95;margin:8pt 0 6pt;color:var(--brand);text-transform:uppercase}
.cover-front .sub{font:400 18pt "NB Display",Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.cover-front .lines{margin-top:14pt;display:grid;gap:12pt;text-align:left;font:700 9pt "NB Text",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.cover-front .lines span{display:block;border-bottom:1pt solid var(--ink);padding-bottom:2pt}
.cover-front .pk-image{width:4.6in;flex:none;height:3.2in;max-height:none;margin:0;border:3pt solid #fff;box-shadow:0 2pt 8pt rgba(0,0,0,.25);transform:rotate(-2deg);border-radius:2pt}
.cover-front .pk-art{grid-template-columns:repeat(6,.45in)}
.cover-front .pk-art i{height:.45in;border-color:var(--brand)}
.cover-front .tag{font:600 12pt/1.4 "NB Text",sans-serif;text-align:center;max-width:5.4in;margin:0}

.cover-back{gap:16pt;padding-left:1.3in!important}
.cover-back h2{font-size:38pt;color:var(--brand)}
.cover-back .tag{font-size:13pt;margin:0;max-width:5.4in}
.cover-back .pk-steps{max-width:5.4in}
.cover-back .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.cover-back .brand{font:400 16pt "NB Display",Impact,sans-serif;letter-spacing:.08em;color:var(--brand)}
.cover-back .url{font:700 11pt "NB Text",sans-serif}
.barcode-space{width:2in;height:1.2in;background:#fff}
</style>
</head>
<body data-page="cover">

<div class="cover-front">
  <div class="label">
    <div class="kick">{{kicker}}</div>
    <h1>{{title}}</h1>
    <div class="sub">{{subtitle}}</div>
    <div class="lines"><span>Name</span><span>Started</span></div>
  </div>
  {{image}}
  <p class="tag">{{tagline}}</p>
</div>

<div class="cover-spine">{{title}}</div>

<div class="cover-back">
  <h2>{{title}}</h2>
  <p class="tag">{{tagline}}</p>
  {{steps}}
  {{specs}}
  <div class="foot">
    <div><div class="brand">{{kicker}}</div><div class="url">{{url}}</div></div>
    <div class="barcode-space"></div>
  </div>
</div>

</body>
</html>
