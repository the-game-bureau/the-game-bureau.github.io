<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>THE GAME BUREAU - Game Notebook Studio</title>
<!-- Notebook Studio: one editor for making and editing notebook games.
     /studio/ starts a new notebook; /studio/?game=<folder> edits one. See studio/README.md. -->
<link rel="icon" href="/favicon.ico">
<!-- The kit loads fresh on every visit, all at one version, so a browser never mixes a cached old
     kit.js with a new admin.js. The site is published two ways (the deploy workflow and GitHub's own
     branch build), and only one of them stamps versions on links, so this can't rely on that stamp. -->
<script>
(function () {
  var v = Date.now().toString(36), k = '/studio/kit/';
  ['kit.css', 'admin.css'].forEach(function (f) { document.write('<link rel="stylesheet" href="' + k + f + '?v=' + v + '">'); });
  ['kit.js', 'gh.js', 'studio.js', 'admin.js'].forEach(function (f) { document.write('<script src="' + k + f + '?v=' + v + '" defer><\/script>'); });
})();
</script>
</head>
<body data-page="admin"></body>
</html>
